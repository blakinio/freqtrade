version: 2
updates:
- package-ecosystem: docker  # zizmor: ignore[dependabot-cooldown] Docker does not support cooldowns at the moment.
  # Docker does not support cooldowns at the moment.
  # https://github.com/dependabot/dependabot-core/issues/14044
  # cooldown:
  #   default-days: 7
  directories:
    - "/"
    - "/docker"
    - "/deploy/synology/portal"
    - "/deploy/synology/portal-oidc"
  schedule:
    interval: daily
  ignore:
  - dependency-name: "*"
    update-types: ["version-update:semver-major"]
  open-pull-requests-limit: 10
  target-branch: develop
  commit-message:
    prefix: "build(deps)"

- package-ecosystem: devcontainers
  directory: "/"
  cooldown:
    default-days: 7
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  commit-message:
    prefix: "build(deps-devcontainer)"

- package-ecosystem: pip
  directory: "/"
  cooldown:
    default-days: 7
    exclude:
      - ccxt
  schedule:
    interval: "cron"
    # Monday at 03:00
    cronjob: "0 3 * * 1"
  open-pull-requests-limit: 15
  target-branch: develop
  commit-message:
    prefix: "build(deps)"
  groups:
    types:
      patterns:
        - "types-*"
    pytest:
      patterns:
        - "pytest*"
    mkdocs:
      patterns:
        - "mkdocs*"
    scipy:
      patterns:
        - "scipy"
        - "scipy-stubs"
    gymnasium:
      patterns:
        - "gymnasium"
        - "stable-baselines3"
        - "sb3-contrib"

- package-ecosystem: npm
  directory: "/ai_platform/portal/web"
  cooldown:
    default-days: 7
  schedule:
    interval: "cron"
    cronjob: "0 4 * * 1"
  open-pull-requests-limit: 10
  target-branch: develop
  commit-message:
    prefix: "build(portal-deps)"
  groups:
    portal-runtime:
      dependency-type: "production"
      update-types:
        - "minor"
        - "patch"
    portal-development:
      dependency-type: "development"
      update-types:
        - "minor"
        - "patch"

- package-ecosystem: pip
  directory: "/deploy/synology/portal-oidc"
  cooldown:
    default-days: 7
  schedule:
    interval: "cron"
    cronjob: "30 4 * * 1"
  open-pull-requests-limit: 10
  target-branch: develop
  commit-message:
    prefix: "build(portal-deps)"
  groups:
    portal-control-plane:
      patterns:
        - "*"

- package-ecosystem: "github-actions"
  directory: "/"
  cooldown:
    default-days: 7
  schedule:
    interval: "cron"
    # Monday at 03:00
    cronjob: "0 3 * * 1"
  open-pull-requests-limit: 10
  target-branch: develop
  commit-message:
    prefix: "ci(deps)"
  groups:
    actions:
      patterns:
        - "actions/*"
    docker:
      patterns:
        - "docker/*"
