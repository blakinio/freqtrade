name: Temporary GitHub Actions Cache Hygiene V2

on:
  push:
    branches:
      - chore/github-actions-ci-hygiene-20260811
    paths:
      - .github/workflows/_tmp-github-actions-cache-hygiene-v2.yml

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: github-actions-cache-hygiene-20260811-v2
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Snapshot, delete eligible caches, and verify exhaustively
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          snapshot="$(mktemp)"
          candidates="$(mktemp)"
          final_snapshot="$(mktemp)"
          final_candidates="$(mktemp)"
          trap 'rm -f "$snapshot" "$candidates" "$final_snapshot" "$final_candidates" /tmp/branch.json' EXIT

          list_all_caches() {
            local target="$1"
            : > "$target"
            local page=1
            while :; do
              local payload count
              payload="$(curl -fsS "${auth[@]}" "${api}/actions/caches?per_page=100&page=${page}")"
              count="$(jq '.actions_caches | length' <<<"$payload")"
              [[ "$count" -gt 0 ]] || break
              jq -r '.actions_caches[] | [.id, .ref, .size_in_bytes] | @tsv' <<<"$payload" >> "$target"
              page=$((page + 1))
            done
          }

          classify_eligible() {
            local source="$1"
            local target="$2"
            : > "$target"
            while IFS=$'\t' read -r id ref size; do
              [[ -n "${id:-}" && -n "${ref:-}" ]] || continue
              local reason=""
              if [[ "$ref" =~ ^refs/pull/([0-9]+)/merge$ ]]; then
                local pr state pr_json
                pr="${BASH_REMATCH[1]}"
                pr_json="$(curl -fsS "${auth[@]}" "${api}/pulls/${pr}")"
                state="$(jq -r '.state' <<<"$pr_json")"
                if [[ "$state" != "open" ]]; then
                  reason="closed-pr-${pr}"
                fi
              elif [[ "$ref" =~ ^refs/heads/(.+)$ ]]; then
                local branch encoded status
                branch="${BASH_REMATCH[1]}"
                encoded="$(jq -rn --arg v "$branch" '$v|@uri')"
                status="$(curl -sS -o /tmp/branch.json -w '%{http_code}' "${auth[@]}" "${api}/branches/${encoded}")"
                if [[ "$status" == "404" ]]; then
                  reason="deleted-branch-${branch}"
                elif [[ "$status" != "200" ]]; then
                  echo "Unexpected branch lookup status ${status} for ${branch}" >&2
                  exit 1
                fi
              fi
              if [[ -n "$reason" ]]; then
                printf '%s\t%s\t%s\t%s\n' "$id" "$ref" "$size" "$reason" >> "$target"
              fi
            done < "$source"
          }

          before="$(curl -fsS "${auth[@]}" "${api}/actions/cache/usage")"
          echo "CACHE_USAGE_BEFORE_V2|count=$(jq -r '.active_caches_count' <<<"$before")|bytes=$(jq -r '.active_caches_size_in_bytes' <<<"$before")"

          list_all_caches "$snapshot"
          classify_eligible "$snapshot" "$candidates"

          snapshot_count="$(wc -l < "$snapshot" | tr -d ' ')"
          candidate_count="$(wc -l < "$candidates" | tr -d ' ')"
          candidate_bytes="$(awk -F '\t' '{sum += $3} END {printf "%.0f", sum+0}' "$candidates")"
          echo "CACHE_SNAPSHOT_V2|total=${snapshot_count}|eligible=${candidate_count}|eligible_bytes=${candidate_bytes}"

          deleted_count=0
          deleted_bytes=0
          while IFS=$'\t' read -r id ref size reason; do
            [[ -n "${id:-}" ]] || continue
            echo "DELETE_CACHE_V2|id=${id}|ref=${ref}|bytes=${size}|reason=${reason}"
            curl -fsS -X DELETE "${auth[@]}" "${api}/actions/caches/${id}"
            deleted_count=$((deleted_count + 1))
            deleted_bytes=$((deleted_bytes + size))
          done < "$candidates"

          # Non-mutating full rescan after all deletions. This avoids offset drift while deleting.
          list_all_caches "$final_snapshot"
          classify_eligible "$final_snapshot" "$final_candidates"
          remaining_eligible="$(wc -l < "$final_candidates" | tr -d ' ')"
          if [[ "$remaining_eligible" -ne 0 ]]; then
            echo "Eligible caches remain after cleanup:" >&2
            cat "$final_candidates" >&2
            exit 1
          fi

          after="$(curl -fsS "${auth[@]}" "${api}/actions/cache/usage")"
          final_count="$(wc -l < "$final_snapshot" | tr -d ' ')"
          echo "CACHE_CLEANUP_RESULT_V2|deleted_count=${deleted_count}|deleted_bytes=${deleted_bytes}|remaining_eligible=${remaining_eligible}|final_listed=${final_count}"
          echo "CACHE_USAGE_AFTER_V2|count=$(jq -r '.active_caches_count' <<<"$after")|bytes=$(jq -r '.active_caches_size_in_bytes' <<<"$after")"

          {
            echo '## GitHub Actions cache hygiene V2'
            echo
            echo "- Snapshot-listed caches: ${snapshot_count}"
            echo "- Eligible caches at snapshot: ${candidate_count}"
            echo "- Deleted caches: ${deleted_count}"
            echo "- Deleted object bytes (sum): ${deleted_bytes}"
            echo "- Eligible caches after non-mutating full rescan: ${remaining_eligible}"
            echo "- Final listed caches: ${final_count}"
            echo "- Usage endpoint before: $(jq -r '.active_caches_count' <<<"$before") caches / $(jq -r '.active_caches_size_in_bytes' <<<"$before") bytes"
            echo "- Usage endpoint after: $(jq -r '.active_caches_count' <<<"$after") caches / $(jq -r '.active_caches_size_in_bytes' <<<"$after") bytes"
            echo
            echo 'Scope: only caches bound to closed PR merge refs or branches confirmed absent by GitHub API. No artifacts, workflow runs, logs, active PR caches, active branch caches, or active default-branch caches were deleted.'
          } >> "$GITHUB_STEP_SUMMARY"
