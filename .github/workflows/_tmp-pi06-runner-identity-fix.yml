name: Temporary PI-06 runner identity fix

on:
  push:
    branches:
      - fix/portal-pi06-synology-runner-identity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/portal-pi06-synology-runner-identity
          fetch-depth: 0

      - name: Apply exact runner identity replacements
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('.github/workflows/portal-authentik-synology-target-preflight.yml'): [
                  ('runs-on: [self-hosted, Linux, oteryn-staging]',
                   'runs-on: [self-hosted, Linux, freqtrade-staging]', 1),
              ],
              Path('deploy/synology/portal-authentik/target_preflight.py'): [
                  ('"expected_runner_name": "oteryn-synology-staging"',
                   '"expected_runner_name": "freqtrade-synology-staging"', 1),
                  ('"expected_runner_label": "oteryn-staging"',
                   '"expected_runner_label": "freqtrade-staging"', 1),
              ],
              Path('tests/ai_platform/portal/deployment/test_authentik_synology_target_preflight.py'): [
                  ('runs-on: [self-hosted, Linux, oteryn-staging]',
                   'runs-on: [self-hosted, Linux, freqtrade-staging]', 1),
                  ('request["expected_runner_name"] == "oteryn-synology-staging"',
                   'request["expected_runner_name"] == "freqtrade-synology-staging"', 1),
              ],
              Path('docs/ai_platform/portal/PI06_AUTHENTIK_SYNOLOGY_TARGET_PREFLIGHT.md'): [
                  ('runner name: `oteryn-synology-staging`',
                   'runner name: `freqtrade-synology-staging`', 1),
                  ('labels: `self-hosted`, `Linux`, `oteryn-staging`',
                   'labels: `self-hosted`, `Linux`, `freqtrade-staging`', 1),
              ],
              Path('docs/agents/tasks/FTAI-20260727-portal-pi06-authentik-synology-target-preflight.md'): [
                  ('oteryn-synology-staging', 'freqtrade-synology-staging', 3),
                  ('self-hosted/Linux/oteryn-staging',
                   'self-hosted/Linux/freqtrade-staging', 1),
              ],
          }

          for path, rules in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new, expected_count in rules:
                  actual_count = text.count(old)
                  if actual_count != expected_count:
                      raise SystemExit(
                          f'{path}: expected {expected_count} occurrences of {old!r}, got {actual_count}'
                      )
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/_tmp-pi06-runner-identity-fix.yml').unlink()

      - name: Commit corrected contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix(portal): align PI-06 preflight with Synology runner"
          git push origin HEAD:fix/portal-pi06-synology-runner-identity
