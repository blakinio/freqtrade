name: Agent Checkpoint Finalize Temporary

on:
  push:
    branches:
      - docs/rl-v2-lifecycle-seed-robustness-infrastructure-closure-20260725
    paths:
      - ".github/workflows/agent-checkpoint-finalize-temporary.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: docs/rl-v2-lifecycle-seed-robustness-infrastructure-closure-20260725
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate checkpoint and generate compact handover
        shell: bash
        run: |
          set -euo pipefail
          task=docs/agents/tasks/FTAI-20260725-rl-v2-lifecycle-seed-robustness-infrastructure.md
          python tools/agents/checkpoint.py "$task" --require-checkpoint | tee checkpoint-output.txt
          python tools/agents/resume.py --task "$task" | tee resume-output.txt
      - name: Upload exact command outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-seed-infrastructure-final-handover
          path: |
            checkpoint-output.txt
            resume-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Self-remove temporary validator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-checkpoint-finalize-temporary.yml
          git commit -m "ci(agents): remove temporary checkpoint validator"
          git push origin HEAD:docs/rl-v2-lifecycle-seed-robustness-infrastructure-closure-20260725
