name: Agent checkpoint history

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/agents/tasks/**"
      - "docs/agents/GOVERNANCE_CONTRACT.json"
      - "docs/agents/CONTEXT_HANDOFF.md"
      - "docs/agents/tasks/TASK_TEMPLATE.md"
      - "tools/agents/checkpoint.py"
      - "tools/agents/validate_checkpoint_history.py"
      - "tests/ci/test_agent_checkpoint_observation_history.py"
      - "tests/ci/test_agent_checkpoint_history_monotonic.py"
  push:
    branches: [develop]
    paths:
      - "docs/agents/tasks/**"
      - "docs/agents/GOVERNANCE_CONTRACT.json"
      - "docs/agents/CONTEXT_HANDOFF.md"
      - "docs/agents/tasks/TASK_TEMPLATE.md"
      - "tools/agents/checkpoint.py"
      - "tools/agents/validate_checkpoint_history.py"
      - "tests/ci/test_agent_checkpoint_observation_history.py"
      - "tests/ci/test_agent_checkpoint_history_monotonic.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install bounded validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 pytest==9.1.1
      - name: Run focused checkpoint-history regressions
        run: python -m pytest -q -o addopts='' --confcutdir=tests/ci tests/ci/test_agent_checkpoint_history_monotonic.py tests/ci/test_agent_checkpoint_observation_history.py
      - name: Validate PR checkpoint history
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/agents/validate_checkpoint_history.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Validate pushed checkpoint records
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python tools/agents/validate_checkpoint_history.py --base "$BASE_SHA" --head "$HEAD_SHA"
