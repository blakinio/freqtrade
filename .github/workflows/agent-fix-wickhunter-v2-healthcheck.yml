name: Temporary WickHunter v2 healthcheck rename

"on":
  pull_request:
    types: [synchronize]
    branches:
      - develop
    paths:
      - ".github/workflows/agent-fix-wickhunter-v2-healthcheck.yml"

permissions:
  contents: write

concurrency:
  group: temporary-wickhunter-v2-healthcheck-rename
  cancel-in-progress: false

jobs:
  rename:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: agent/wickhunter-okx-market-evidence-v2

      - name: Update references and remove duplicate module
        run: |
          set -euo pipefail
          sed -i 's#wickhunter-market-evidence-v2/healthcheck.py#wickhunter-market-evidence-v2/healthcheck_v2.py#g' \
            .github/workflows/ai-platform-wickhunter-market-evidence-ci.yml \
            docs/agents/tasks/FTAI-20260731-wickhunter-okx-market-evidence-v2.md
          git rm -- deploy/synology/wickhunter-market-evidence-v2/healthcheck.py

      - name: Commit exact rename
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/ai-platform-wickhunter-market-evidence-ci.yml \
            docs/agents/tasks/FTAI-20260731-wickhunter-okx-market-evidence-v2.md \
            deploy/synology/wickhunter-market-evidence-v2/healthcheck.py
          git commit -m "fix(deploy): remove duplicate healthcheck module"
          git push origin HEAD:agent/wickhunter-okx-market-evidence-v2
