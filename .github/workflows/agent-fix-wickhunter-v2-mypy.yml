name: Temporary WickHunter v2 mypy fix

"on":
  pull_request:
    types: [synchronize]
    branches:
      - develop
    paths:
      - ".github/workflows/agent-fix-wickhunter-v2-mypy.yml"

permissions:
  contents: write

concurrency:
  group: temporary-wickhunter-v2-mypy-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: agent/wickhunter-okx-market-evidence-v2

      - name: Remove optional assignment ambiguity
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/wickhunter/production_market_evidence_v2.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "    for canonical in EXPECTED_SYMBOLS:\n        row = tickers.get(canonical)\n"
          end_marker = "        records.append(\n"
          if text.count(start_marker) != 1:
              raise SystemExit("expected ticker loop start was not found exactly once")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          block = block.replace(
              "        row = tickers.get(canonical)\n",
              "        ticker = tickers.get(canonical)\n",
              1,
          )
          block = block.replace("if row is None", "if ticker is None")
          block = block.replace("row.get(", "ticker.get(")
          path.write_text(text[:start] + block + text[end:], encoding="utf-8")
          PY

      - name: Format and commit exact fix
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.20
          ruff format ai_platform/wickhunter/production_market_evidence_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ai_platform/wickhunter/production_market_evidence_v2.py
          git commit -m "fix(wickhunter): remove optional ticker assignment ambiguity"
          git push origin HEAD:agent/wickhunter-okx-market-evidence-v2
