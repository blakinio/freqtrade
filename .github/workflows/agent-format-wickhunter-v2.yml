name: Temporary WickHunter v2 test formatter

"on":
  pull_request:
    types: [synchronize]
    branches:
      - develop
    paths:
      - ".github/workflows/agent-format-wickhunter-v2.yml"

permissions:
  contents: write

concurrency:
  group: temporary-wickhunter-v2-test-formatter
  cancel-in-progress: false

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: agent/wickhunter-okx-market-evidence-v2

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.20

      - name: Format exact v2 tests
        run: |
          set -euo pipefail
          ruff format \
            tests/ai_platform_integration/test_wickhunter_production_market_evidence_v2.py \
            tests/ai_platform_integration/test_wickhunter_production_market_evidence_service_v2.py

      - name: Commit formatting only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            tests/ai_platform_integration/test_wickhunter_production_market_evidence_v2.py \
            tests/ai_platform_integration/test_wickhunter_production_market_evidence_service_v2.py
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style(wickhunter): apply Ruff formatting to v2 tests"
          git push origin HEAD:agent/wickhunter-okx-market-evidence-v2
