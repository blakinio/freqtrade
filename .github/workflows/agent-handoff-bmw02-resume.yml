name: Generate BMW-02 compact resume handoff

on:
  push:
    branches:
      - agent/handoff-bmw02-resume-20260728

permissions:
  contents: read

jobs:
  resume:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Validate active checkpoint
        run: >-
          python tools/agents/checkpoint.py
          docs/agents/tasks/FTAI-20260728-portal-bmw02-command-intent.md
          --require-checkpoint
      - name: Generate compact resume prompt
        run: >-
          python tools/agents/resume.py
          --task docs/agents/tasks/FTAI-20260728-portal-bmw02-command-intent.md
          > resume.txt
      - name: Upload resume output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bmw02-resume-output
          path: resume.txt
          if-no-files-found: error
          retention-days: 1
