name: Agent Liquidations Health Observer

"on":
  push:
    branches:
      - develop
    paths:
      - .github/workflows/agent-liquidations-health-observer.yml

permissions: {}

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      statuses: write
    steps:
      - name: Publish latest scheduled health run outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVED_SHA: e73de2c7a080c79486141cdafa4d2bb41afdd80e
        shell: bash
        run: |
          set -Eeuo pipefail
          runs_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/liquidations-live-operational-health.yml/runs?branch=develop&event=schedule&per_page=20")"
          RUNS_JSON="$runs_json" python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          api_url = os.environ["GITHUB_API_URL"]
          token = os.environ["GH_TOKEN"]
          sha = os.environ["OBSERVED_SHA"]
          payload = json.loads(os.environ["RUNS_JSON"])
          runs = [run for run in payload.get("workflow_runs", []) if run.get("status") == "completed"][:3]
          for index in range(3):
              context = f"liquidations-live-scheduled-{index + 1}"
              if index < len(runs):
                  run = runs[index]
                  conclusion = str(run.get("conclusion") or "failure")
                  state = "success" if conclusion == "success" else "failure"
                  description = f"scheduled run {run.get('id')}: {conclusion}"
                  target_url = str(run.get("html_url") or "")
              else:
                  state = "pending"
                  description = "scheduled health run not available yet"
                  target_url = ""
              status_payload = {"state": state, "context": context, "description": description[:140]}
              if target_url:
                  status_payload["target_url"] = target_url
              request = urllib.request.Request(
                  f"{api_url}/repos/{repository}/statuses/{sha}",
                  data=json.dumps(status_payload).encode(),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  response.read()
          PY
