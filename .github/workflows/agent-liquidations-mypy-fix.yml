name: Agent Liquidations MyPy Fix

"on":
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions: {}

concurrency:
  group: agent-liquidations-mypy-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'fix/liquidations-live-telegram-monitoring-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/liquidations-live-telegram-monitoring-20260730
          persist-credentials: false

      - name: Apply bounded type-narrowing repair
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/liquidations-live-telegram-monitoring-20260730
        shell: bash
        run: |
          set -Eeuo pipefail
          path='ai_platform/scripts/liquidation_alert_notifications.py'
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("ai_platform/scripts/liquidation_alert_notifications.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    collector_ok = container.get("healthy") is True and state.get("healthy") is True
              return {
          '''
          replacement = '''    collector_ok = container.get("healthy") is True and state.get("healthy") is True
              binance = sources.get("binance-usdm")
              bybit = sources.get("bybit-linear")
              binance_health = binance.get("healthy") if isinstance(binance, dict) else None
              bybit_health = bybit.get("healthy") if isinstance(bybit, dict) else None
              return {
          '''
          if anchor not in text:
              if "binance_health =" in text and "bybit_health =" in text:
                  raise SystemExit(0)
              raise SystemExit("collector anchor not found")
          text = text.replace(anchor, replacement, 1)

          patterns = {
              "binance": (
                  r'\s+\(sources\.get\("binance-usdm"\) or \{\}\)\.get\("healthy"\)\n'
                  r'\s+if isinstance\(sources\.get\("binance-usdm"\), dict\)\n'
                  r'\s+else None,'
              ),
              "bybit": (
                  r'\s+\(sources\.get\("bybit-linear"\) or \{\}\)\.get\("healthy"\)\n'
                  r'\s+if isinstance\(sources\.get\("bybit-linear"\), dict\)\n'
                  r'\s+else None,'
              ),
          }
          text, binance_count = re.subn(patterns["binance"], "\n            binance_health,", text, count=1)
          text, bybit_count = re.subn(patterns["bybit"], "\n            bybit_health,", text, count=1)
          if (binance_count, bybit_count) != (1, 1):
              raise SystemExit(
                  f"source health expression counts: binance={binance_count}, bybit={bybit_count}"
              )
          path.write_text(text, encoding="utf-8")
          PY

          if git diff --quiet -- "$path"; then
            echo 'Repair already present.'
            exit 0
          fi
          python -m compileall -q "$path"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${BRANCH}" --jq .sha)"
          content="$(base64 -w0 "$path")"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='fix(liquidations): narrow source health mappings' \
            -f content="$content" \
            -f branch="$BRANCH" \
            -f sha="$sha" >/dev/null
