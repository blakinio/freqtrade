name: Agent Liquidations MyPy Fix

"on":
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions: {}

concurrency:
  group: agent-liquidations-mypy-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'fix/liquidations-live-telegram-monitoring-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/liquidations-live-telegram-monitoring-20260730
          persist-credentials: false

      - name: Apply tuple type contract
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/liquidations-live-telegram-monitoring-20260730
        shell: bash
        run: |
          set -Eeuo pipefail
          path='ai_platform/scripts/liquidation_alert_notifications.py'
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/scripts/liquidation_alert_notifications.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    elif sha and status == "completed" and not _final_status_present(client, repository, sha):
                  synthetic_code = "LIQUIDATIONS_HEALTH_STATUS_MISSING"
                  synthetic_description = "Najnowszy run nie opublikował finalnego statusu commita."

              if synthetic_code:
          '''
          replacement = '''    elif sha and status == "completed" and not _final_status_present(client, repository, sha):
                  synthetic_code = "LIQUIDATIONS_HEALTH_STATUS_MISSING"
                  synthetic_description = "Najnowszy run nie opublikował finalnego statusu commita."

              codes: tuple[str, ...]
              report: dict[str, Any]
              if synthetic_code:
          '''
          if anchor not in text:
              if "codes: tuple[str, ...]" in text and "report: dict[str, Any]" in text:
                  raise SystemExit(0)
              raise SystemExit("tuple typing anchor not found")
          text = text.replace(anchor, replacement, 1)
          old = "        report: dict[str, Any] = {}\n"
          if text.count(old) != 1:
              raise SystemExit(f"annotated report assignment count={text.count(old)}")
          text = text.replace(old, "        report = {}\n", 1)
          path.write_text(text, encoding="utf-8")
          PY

          if git diff --quiet -- "$path"; then
            echo 'Repair already present.'
            exit 0
          fi
          python -m compileall -q "$path"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${BRANCH}" --jq .sha)"
          content="$(base64 -w0 "$path")"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='fix(liquidations): type incident code tuples explicitly' \
            -f content="$content" \
            -f branch="$BRANCH" \
            -f sha="$sha" >/dev/null
