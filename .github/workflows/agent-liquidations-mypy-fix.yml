name: Agent Liquidations MyPy Fix

"on":
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions: {}

concurrency:
  group: agent-liquidations-mypy-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'fix/liquidations-live-telegram-monitoring-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/liquidations-live-telegram-monitoring-20260730
          persist-credentials: false

      - name: Apply complete mapping type narrowing
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/liquidations-live-telegram-monitoring-20260730
        shell: bash
        run: |
          set -Eeuo pipefail
          path='ai_platform/scripts/liquidation_alert_notifications.py'
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/scripts/liquidation_alert_notifications.py")
          text = path.read_text(encoding="utf-8")
          old = '''    checks = report.get("checks") if isinstance(report.get("checks"), dict) else {}
              container = checks.get("container") if isinstance(checks.get("container"), dict) else {}
              state = checks.get("state") if isinstance(checks.get("state"), dict) else {}
              sources = checks.get("sources") if isinstance(checks.get("sources"), dict) else {}
              disk = checks.get("disk") if isinstance(checks.get("disk"), dict) else {}
              portal = checks.get("portal") if isinstance(checks.get("portal"), dict) else {}
          '''
          new = '''    raw_checks = report.get("checks")
              checks = raw_checks if isinstance(raw_checks, dict) else {}
              raw_container = checks.get("container")
              raw_state = checks.get("state")
              raw_sources = checks.get("sources")
              raw_disk = checks.get("disk")
              raw_portal = checks.get("portal")
              container = raw_container if isinstance(raw_container, dict) else {}
              state = raw_state if isinstance(raw_state, dict) else {}
              sources = raw_sources if isinstance(raw_sources, dict) else {}
              disk = raw_disk if isinstance(raw_disk, dict) else {}
              portal = raw_portal if isinstance(raw_portal, dict) else {}
          '''
          if old not in text:
              if "raw_checks = report.get" in text and "raw_portal = checks.get" in text:
                  raise SystemExit(0)
              raise SystemExit("mapping narrowing block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          if git diff --quiet -- "$path"; then
            echo 'Repair already present.'
            exit 0
          fi
          python -m compileall -q "$path"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${BRANCH}" --jq .sha)"
          content="$(base64 -w0 "$path")"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='fix(liquidations): narrow nested health mappings' \
            -f content="$content" \
            -f branch="$BRANCH" \
            -f sha="$sha" >/dev/null
