name: Agent Liquidations Remediation PR

"on":
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize

permissions:
  contents: write

concurrency:
  group: agent-liquidations-remediation-pr
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/liquidations-live-telegram-monitoring-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/liquidations-live-telegram-monitoring-20260730
          fetch-depth: 0

      - name: Apply tested remediation payload
        shell: bash
        run: |
          set -Eeuo pipefail
          sed -n '/^[[:space:]]*H4sI/,/^[[:space:]]*PAYLOAD$/p' \
            .github/workflows/agent-liquidations-remediation.yml \
            | sed '$d' | tr -d '[:space:]' | base64 -d > /tmp/liquidfix-payload.tar.gz
          test "$(sha256sum /tmp/liquidfix-payload.tar.gz | cut -d' ' -f1)" = \
            "e19a6f16385722b311e4173dc78e7db1656c928192fc17b5ae85f58e5e7b8e6d"
          tar -xzf /tmp/liquidfix-payload.tar.gz

          python - <<'PY'
          from pathlib import Path

          proof = Path("deploy/synology/portal/prove-liquidations-live.sh")
          text = proof.read_text(encoding="utf-8")
          old = 'test "$portal_restart" = "unless-stopped"'
          assert text.count(old) == 1
          proof.write_text(text.replace(old, 'test "$portal_restart" = "always"'), encoding="utf-8")

          deploy = Path("deploy/synology/portal/deploy-preview.sh")
          text = deploy.read_text(encoding="utf-8")
          assert text.count("unless-stopped") == 2
          deploy.write_text(text.replace("unless-stopped", "always"), encoding="utf-8")

          repair = Path(".github/workflows/repair-synology-autostart.yml")
          text = repair.read_text(encoding="utf-8")
          trigger = """  workflow_run:\n    workflows:\n      - Portal Synology LAN Preview\n    types:\n      - completed\n"""
          assert text.count(trigger) == 1
          text = text.replace(trigger, "")
          anchor = "      - deploy/synology/liquid20/compose.yaml\n"
          assert text.count(anchor) == 1
          repair.write_text(
              text.replace(
                  anchor,
                  anchor
                  + "      - deploy/synology/portal/deploy-preview.sh\n"
                  + "      - deploy/synology/portal/prove-liquidations-live.sh\n",
              ),
              encoding="utf-8",
          )
          PY

          git rm \
            .github/workflows/agent-liquidations-remediation.yml \
            .github/workflows/agent-liquidations-remediation-pr.yml
          python -m py_compile ai_platform/scripts/liquidation_alert_notifications.py
          pytest -q \
            tests/ai_platform_integration/test_liquidation_alert_notifications.py \
            tests/ai_platform_integration/test_liquidation_portal_health.py \
            tests/ai_platform_integration/test_liquidation_live_health.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "fix(liquidations): add Telegram watchdog and align portal restart contract"
          git push origin HEAD:fix/liquidations-live-telegram-monitoring-20260730
