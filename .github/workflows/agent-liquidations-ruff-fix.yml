name: Agent Liquidations Ruff Fix

"on":
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: agent-liquidations-ruff-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'fix/liquidations-live-telegram-monitoring-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/liquidations-live-telegram-monitoring-20260730
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Apply repository Ruff rules
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.21
          ruff check --fix --unsafe-fixes \
            ai_platform/scripts/liquidation_alert_notifications.py \
            tests/ai_platform_integration/test_liquidation_alert_notifications.py || true
          ruff format \
            ai_platform/scripts/liquidation_alert_notifications.py \
            tests/ai_platform_integration/test_liquidation_alert_notifications.py

          python - <<'PY'
          from pathlib import Path

          script = Path("ai_platform/scripts/liquidation_alert_notifications.py")
          text = script.read_text(encoding="utf-8")
          replacements = {
              '        return "Sprawdź kontener runnera `freqtrade-synology-staging-runner` i jego rejestrację w GitHub Actions."': '''        return (
              "Sprawdź kontener runnera `freqtrade-synology-staging-runner` "
              "i jego rejestrację w GitHub Actions."
          )''',
              '        return "Sprawdź `freqtrade-portal-staging`, jego obraz, politykę restartu i chroniony endpoint health."': '''        return (
              "Sprawdź `freqtrade-portal-staging`, jego obraz, politykę restartu "
              "i chroniony endpoint health."
          )''',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          script.write_text(text, encoding="utf-8")

          tests = Path("tests/ai_platform_integration/test_liquidation_alert_notifications.py")
          text = tests.read_text(encoding="utf-8")
          old = '{"alerts":[{"code":"LIQUID20_CONTAINER_UNHEALTHY","message":"collector stopped"}],"checks":{"container":{"healthy":false},"state":{"healthy":false},"sources":{},"disk":{"healthy":true},"portal":{"healthy":true,"commit_sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}}}'
          new = '''{
            "alerts": [
              {
                "code": "LIQUID20_CONTAINER_UNHEALTHY",
                "message": "collector stopped"
              }
            ],
            "checks": {
              "container": {"healthy": false},
              "state": {"healthy": false},
              "sources": {},
              "disk": {"healthy": true},
              "portal": {
                "healthy": true,
                "commit_sha": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
              }
            }
          }'''
          assert text.count(old) == 1
          tests.write_text(text.replace(old, new), encoding="utf-8")
          PY

          ruff format \
            ai_platform/scripts/liquidation_alert_notifications.py \
            tests/ai_platform_integration/test_liquidation_alert_notifications.py
          ruff check \
            ai_platform/scripts/liquidation_alert_notifications.py \
            tests/ai_platform_integration/test_liquidation_alert_notifications.py
          python -m py_compile ai_platform/scripts/liquidation_alert_notifications.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ai_platform/scripts/liquidation_alert_notifications.py \
            tests/ai_platform_integration/test_liquidation_alert_notifications.py
          git diff --cached --quiet && exit 0
          git commit -m "style(liquidations): satisfy repository Ruff rules"
          git push origin HEAD:fix/liquidations-live-telegram-monitoring-20260730
