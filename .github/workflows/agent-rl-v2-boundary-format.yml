name: Temporary RL-v2 boundary format

on:
  push:
    branches:
      - fix/rl-v2-paired-attribution-boundary-20260724

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: fix/rl-v2-paired-attribution-boundary-20260724
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet ruff==0.15.21
      - name: Format bounded files
        run: |
          python -m ruff check --fix \
            ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py \
            tests/ai_platform/test_rl_v2_roi_lifecycle_paired_attribution.py
          python -m ruff format \
            ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py \
            tests/ai_platform/test_rl_v2_roi_lifecycle_paired_attribution.py
          rm .github/workflows/agent-rl-v2-boundary-format.yml
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py \
            tests/ai_platform/test_rl_v2_roi_lifecycle_paired_attribution.py \
            .github/workflows/agent-rl-v2-boundary-format.yml
          git commit -m 'style(ai-platform): format RL-v2 boundary repair'
          git push origin HEAD:fix/rl-v2-paired-attribution-boundary-20260724
