name: Temporary RL-v2 boundary repair

on:
  push:
    branches:
      - fix/rl-v2-paired-attribution-boundary-20260724

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: fix/rl-v2-paired-attribution-boundary-20260724
      - name: Apply bounded repair
        shell: python
        run: |
          from pathlib import Path

          validator = Path('ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py')
          text = validator.read_text(encoding='utf-8')
          old = '''            if last_date >= stopdt:\n                raise RLV2PairedAttributionError(\n                    f"Data crosses exclusive stop for {pair} {timeframe}"\n                )\n'''
          new = '''            if last_date > stopdt:\n                raise RLV2PairedAttributionError(\n                    f"Data crosses exclusive stop for {pair} {timeframe}"\n                )\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exact validator boundary block once')
          validator.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/ai_platform/test_rl_v2_roi_lifecycle_paired_attribution.py')
          text = tests.read_text(encoding='utf-8')
          old_import = '''    materialize_runtime_config,\n)\n'''
          new_import = '''    materialize_runtime_config,\n    verify_downloaded_data,\n)\n'''
          if text.count(old_import) != 1:
              raise SystemExit('expected exact import block once')
          text = text.replace(old_import, new_import)
          old_assert = '''    assert not (REPO_ROOT / REQUEST_REPO_PATH).exists()\n'''
          new_assert = '''    request_path = REPO_ROOT / REQUEST_REPO_PATH\n    if request_path.exists():\n        assert load_rl_v2_roi_lifecycle_paired_attribution_request(request_path) == (\n            canonical_rl_v2_roi_lifecycle_paired_attribution_request()\n        )\n'''
          if text.count(old_assert) != 1:
              raise SystemExit('expected exact inert request assertion once')
          text = text.replace(old_assert, new_assert)
          marker = '''\ndef test_synthetic_trade_accounting_fixture_reconciles() -> None:\n'''
          regression = '''\ndef test_data_verifier_accepts_exact_stop_boundary(\n    monkeypatch: pytest.MonkeyPatch, tmp_path: Path\n) -> None:\n    import pandas as pd\n\n    dates = pd.to_datetime(\n        ["2025-08-01T00:00:00Z", "2026-05-01T00:00:00Z"], utc=True\n    )\n\n    def fake_load_pair_history(**_: object) -> pd.DataFrame:\n        return pd.DataFrame({"date": dates})\n\n    monkeypatch.setattr(\n        "freqtrade.data.history.history_utils.load_pair_history",\n        fake_load_pair_history,\n    )\n\n    result = verify_downloaded_data(tmp_path, pairs=["BTC/USDT"])\n\n    assert result["status"] == "ready"\n    assert result["coverage"]["BTC/USDT:15m"]["last"] == (\n        "2026-05-01T00:00:00+00:00"\n    )\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('expected accounting test marker once')
          tests.write_text(text.replace(marker, regression + marker), encoding='utf-8')

          Path('.github/workflows/agent-rl-v2-boundary-repair.yml').unlink()
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py \
            tests/ai_platform/test_rl_v2_roi_lifecycle_paired_attribution.py \
            .github/workflows/agent-rl-v2-boundary-repair.yml
          git commit -m 'fix(ai-platform): align RL-v2 data stop boundary'
          git push origin HEAD:fix/rl-v2-paired-attribution-boundary-20260724
