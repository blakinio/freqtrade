name: Temporary RL-v2 boundary test repair

on:
  push:
    branches:
      - fix/rl-v2-paired-attribution-boundary-20260724

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: fix/rl-v2-paired-attribution-boundary-20260724
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply dependency-light boundary test
        shell: python
        run: |
          from pathlib import Path

          validator = Path('ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py')
          text = validator.read_text(encoding='utf-8')
          marker = '''\ndef verify_downloaded_data(datadir: Path, *, pairs: list[str] | None = None) -> dict[str, Any]:\n'''
          helper = '''\ndef _validate_data_coverage_bounds(\n    *,\n    pair: str,\n    timeframe: str,\n    first_date: datetime,\n    last_date: datetime,\n    startdt: datetime,\n    stopdt: datetime,\n) -> None:\n    if first_date > startdt:\n        raise RLV2PairedAttributionError(\n            f"Data starts too late for {pair} {timeframe}: {first_date.isoformat()}"\n        )\n    minimum_last_ts = int(stopdt.timestamp()) - TIMEFRAME_SECONDS[timeframe]\n    if int(last_date.timestamp()) < minimum_last_ts:\n        raise RLV2PairedAttributionError(\n            f"Data ends too early for {pair} {timeframe}: {last_date.isoformat()}"\n        )\n    if last_date > stopdt:\n        raise RLV2PairedAttributionError(\n            f"Data crosses exclusive stop for {pair} {timeframe}"\n        )\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('expected verifier marker once')
          text = text.replace(marker, helper + marker)
          old = '''            if first_date > startdt:\n                raise RLV2PairedAttributionError(\n                    f"Data starts too late for {pair} {timeframe}: {first_date.isoformat()}"\n                )\n            minimum_last_ts = timerange.stopts - TIMEFRAME_SECONDS[timeframe]\n            if int(last_date.timestamp()) < minimum_last_ts:\n                raise RLV2PairedAttributionError(\n                    f"Data ends too early for {pair} {timeframe}: {last_date.isoformat()}"\n                )\n            if last_date > stopdt:\n                raise RLV2PairedAttributionError(\n                    f"Data crosses exclusive stop for {pair} {timeframe}"\n                )\n'''
          new = '''            _validate_data_coverage_bounds(\n                pair=pair,\n                timeframe=timeframe,\n                first_date=first_date,\n                last_date=last_date,\n                startdt=startdt,\n                stopdt=stopdt,\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit('expected inline verifier block once')
          validator.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/ai_platform/test_rl_v2_roi_lifecycle_paired_attribution.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace('from copy import deepcopy\n', 'from copy import deepcopy\nfrom datetime import UTC, datetime, timedelta\n')
          old_import = '''    _sha256,\n    canonical_rl_v2_roi_lifecycle_paired_attribution_request,\n    load_rl_v2_roi_lifecycle_paired_attribution_request,\n    materialize_runtime_config,\n    verify_downloaded_data,\n'''
          new_import = '''    _sha256,\n    _validate_data_coverage_bounds,\n    canonical_rl_v2_roi_lifecycle_paired_attribution_request,\n    load_rl_v2_roi_lifecycle_paired_attribution_request,\n    materialize_runtime_config,\n'''
          if text.count(old_import) != 1:
              raise SystemExit('expected test import block once')
          text = text.replace(old_import, new_import)
          start = text.index('def test_data_verifier_accepts_exact_stop_boundary(')
          end = text.index('def test_synthetic_trade_accounting_fixture_reconciles()', start)
          regression = '''def test_data_verifier_accepts_exact_stop_boundary() -> None:\n    startdt = datetime(2025, 8, 1, tzinfo=UTC)\n    stopdt = datetime(2026, 5, 1, tzinfo=UTC)\n\n    _validate_data_coverage_bounds(\n        pair="BTC/USDT",\n        timeframe="15m",\n        first_date=startdt,\n        last_date=stopdt,\n        startdt=startdt,\n        stopdt=stopdt,\n    )\n\n    with pytest.raises(RLV2PairedAttributionError, match="crosses exclusive stop"):\n        _validate_data_coverage_bounds(\n            pair="BTC/USDT",\n            timeframe="15m",\n            first_date=startdt,\n            last_date=stopdt + timedelta(minutes=15),\n            startdt=startdt,\n            stopdt=stopdt,\n        )\n\n\n'''
          tests.write_text(text[:start] + regression + text[end:], encoding='utf-8')
          Path('.github/workflows/agent-rl-v2-boundary-test-repair.yml').unlink()
      - name: Format bounded files
        run: |
          python -m pip install --disable-pip-version-check --quiet ruff==0.15.21
          python -m ruff check --fix \
            ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py \
            tests/ai_platform/test_rl_v2_roi_lifecycle_paired_attribution.py
          python -m ruff format \
            ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py \
            tests/ai_platform/test_rl_v2_roi_lifecycle_paired_attribution.py
      - name: Commit bounded repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py \
            tests/ai_platform/test_rl_v2_roi_lifecycle_paired_attribution.py \
            .github/workflows/agent-rl-v2-boundary-test-repair.yml
          git commit -m 'test(ai-platform): isolate RL-v2 boundary regression'
          git push origin HEAD:fix/rl-v2-paired-attribution-boundary-20260724
