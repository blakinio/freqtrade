name: Temporary RL-v2 checkpoint sync

on:
  push:
    branches:
      - docs/rl-v2-paired-attribution-checkpoint-20260725

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: docs/rl-v2-paired-attribution-checkpoint-20260725
      - name: Synchronize checkpoint
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/agents/tasks/FTAI-20260724-rl-v2-roi-lifecycle-paired-attribution-execution.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('status: active\nbranch: feat/rl-v2-roi-lifecycle-paired-attribution-infrastructure\n', 'status: active\nbranch: develop\n', 1)
          text = text.replace('related_pr: "248"\n', 'related_pr: "269"\n', 1)
          marker = '## Context checkpoint\n\n```yaml\n'
          start = text.index(marker) + len(marker)
          end = text.index('\n```', start)
          checkpoint = '''checkpoint_version: 1
updated_at: 2026-07-25T00:23:00+02:00
head: ee76c708091c00329b20f044e133072ecbc4ae6b
branch: develop
pr: 269
status: ready
context_routes:
  - docs/agents/tasks/FTAI-20260724-rl-v2-historical-evidence-diagnosis.md
