          marker = '## Context checkpoint\n\n```yaml\n'
          start = text.index(marker) + len(marker)
          end = text.index('\n```', start)
          checkpoint = '''checkpoint_version: 1
updated_at: 2026-07-25T00:03:00+02:00
head: 067e1b0763cad44062ff02274fc9252f93b31a14
branch: fix/rl-v2-paired-attribution-boundary-20260724
