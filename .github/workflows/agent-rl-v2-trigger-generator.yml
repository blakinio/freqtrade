name: Temporary RL-v2 trigger generator

on:
  push:
    branches:
      - run/rl-v2-roi-lifecycle-paired-attribution-v1-retry2

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: run/rl-v2-roi-lifecycle-paired-attribution-v1-retry2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate exact canonical request
        run: |
          set -euo pipefail
          python ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py --print-canonical \
            > ai_platform/experimental_model_research/rl-v2-roi-lifecycle-paired-attribution-execution-v1.json
          python ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py \
            ai_platform/experimental_model_research/rl-v2-roi-lifecycle-paired-attribution-execution-v1.json
          rm .github/workflows/agent-rl-v2-trigger-generator.yml
      - name: Commit exact-one-file trigger
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_platform/experimental_model_research/rl-v2-roi-lifecycle-paired-attribution-execution-v1.json \
            .github/workflows/agent-rl-v2-trigger-generator.yml
          git commit -m 'ci(ai-platform): execute repaired RL-v2 paired attribution'
          git push origin HEAD:run/rl-v2-roi-lifecycle-paired-attribution-v1-retry2
