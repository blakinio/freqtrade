name: Agent WickHunter Pre-commit Fix

"on":
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: agent-wickhunter-precommit-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'fix/wickhunter-ruff-baseline-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out baseline repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/wickhunter-ruff-baseline-20260730
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Repair inherited mypy and formatting findings
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/wickhunter/production_market_evidence_service.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''class MarketEvidencePublicationError(RuntimeError):
              """Raised when the outer immutable package cannot be published safely."""
          '''
          helper = '''class MarketEvidencePublicationError(RuntimeError):
              """Raised when the outer immutable package cannot be published safely."""


          def _require_int(value: object, *, field: str) -> int:
              if isinstance(value, bool) or not isinstance(value, int):
                  raise MarketEvidencePublicationError(f"{field} must be an integer")
              return value
          '''
          assert text.count(anchor) == 1
          text = text.replace(anchor, helper)
          replacements = {
              'int(request["decision_start_ms"])': '_require_int(request["decision_start_ms"], field="decision_start_ms")',
              'int(request["pre_roll_start_ms"])': '_require_int(request["pre_roll_start_ms"], field="pre_roll_start_ms")',
              'int(request["sample_interval_seconds"])': '_require_int(request["sample_interval_seconds"], field="sample_interval_seconds")',
              'int(request["max_sample_lateness_seconds"])': '_require_int(request["max_sample_lateness_seconds"], field="max_sample_lateness_seconds")',
              'int(snapshot.get("scheduled_at_ms", -1))': '_require_int(snapshot.get("scheduled_at_ms", -1), field="scheduled_at_ms")',
              'int(snapshot.get("available_at_ms", -1))': '_require_int(snapshot.get("available_at_ms", -1), field="available_at_ms")',
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

          python -m pip install --disable-pip-version-check pre-commit
          pre-commit run --all-files || true
          pre-commit run --all-files

          allowed='^(ai_platform/portal/web/components/market-evidence-dashboard\.tsx|ai_platform/wickhunter/production_market_evidence_daemon\.py|ai_platform/wickhunter/production_market_evidence_service\.py|ai_platform/wickhunter/production_market_evidence_wh01\.py)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed by pre-commit:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ai_platform/portal/web/components/market-evidence-dashboard.tsx \
            ai_platform/wickhunter/production_market_evidence_daemon.py \
            ai_platform/wickhunter/production_market_evidence_service.py \
            ai_platform/wickhunter/production_market_evidence_wh01.py
          git commit -m "fix(wickhunter): satisfy inherited pre-commit baseline"
          git push origin HEAD:fix/wickhunter-ruff-baseline-20260730
