name: AI Platform Binance Spot Instrument Shadow Acceptance V2

on:
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - "ai_platform/market_data/run-requests/binance-spot-instrument-shadow-acceptance-20260729-v2.json"

permissions:
  contents: read

concurrency:
  group: binance-spot-instrument-shadow-acceptance-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  REQUEST_PATH: ai_platform/market_data/run-requests/binance-spot-instrument-shadow-acceptance-20260729-v2.json
  POLICY_PATH: ai_platform/market_data/binance-spot-instrument-shadow-acceptance-policy-v1.json

jobs:
  acceptance:
    name: Run 24-hour Binance Spot instrument shadow acceptance v2
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 1500
    env:
      ACCEPTANCE_HOST_ID: freqtrade-synology-staging
      STATE_DIR: /var/lib/freqtrade-staging-state
      DURABLE_ROOT: /var/lib/freqtrade-staging-state/binance-spot-instrument-acceptance
      DURABLE_URI: file:///var/lib/freqtrade-staging-state/binance-spot-instrument-acceptance

    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact-one-file v2 trigger scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expected=$'A\tai_platform/market_data/run-requests/binance-spot-instrument-shadow-acceptance-20260729-v2.json'
          actual="$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Binance instrument acceptance v2 trigger must add exactly the canonical request" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

      - name: Validate staging identity and prepare durable storage
        id: staging
        shell: bash
        env:
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          RUNNER_TEMP_VALUE: ${{ runner.temp }}
          GITHUB_WORKSPACE_VALUE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          umask 027
          python3 tools/market_data/binance_spot_instrument_acceptance_v2_preflight.py

      - name: Refuse trading credentials and proxy routing
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            BINANCE_API_KEY BINANCE_API_SECRET BINANCE_SECRET_KEY \
            BYBIT_API_KEY BYBIT_API_SECRET \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            EXCHANGE_API_KEY EXCHANGE_API_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET \
            HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          do
            if [[ -n "${!name:-}" ]]; then
              echo "Forbidden credential or proxy environment is present: $name" >&2
              exit 1
            fi
          done

      - name: Install isolated uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.12"
          enable-cache: false

      - name: Install pinned acceptance dependency
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --python "$VIRTUAL_ENV/bin/python" "jsonschema==4.26.0"
          python - <<'PY'
          from importlib.metadata import version

          assert version("jsonschema") == "4.26.0"
          print("BINANCE_ACCEPTANCE_V2_JSONSCHEMA_4_26_0_READY")
          PY

      - name: Validate frozen package without network
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path

          from ai_platform.market_data.binance_spot_instrument_acceptance import (
              BinanceSpotInstrumentAcceptancePolicy,
              validate_request,
          )

          policy = BinanceSpotInstrumentAcceptancePolicy.load(Path("ai_platform/market_data/binance-spot-instrument-shadow-acceptance-policy-v1.json"))
          request = json.loads(Path("ai_platform/market_data/run-requests/binance-spot-instrument-shadow-acceptance-20260729-v2.json").read_text(encoding="utf-8"))
          validate_request(request, policy=policy)
          print("BINANCE_SPOT_INSTRUMENT_ACCEPTANCE_V2_PREFLIGHT_PASS")
          PY

      - name: Run frozen 24-hour acceptance package
        id: run
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ steps.staging.outputs.run_id }}
        run: |
          set -euo pipefail
          root="${DURABLE_ROOT%/}/$RUN_ID"
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          set +e
          PYTHONPATH=. python -m ai_platform.market_data.binance_spot_instrument_acceptance run \
            --request "$REQUEST_PATH" \
            --policy "$POLICY_PATH" \
            --collector-commit "$HEAD_SHA" \
            --output-root "$root"
          status=$?
          set -e
          if [[ "$status" -ne 0 && "$status" -ne 1 && "$status" -ne 2 ]]; then
            echo "Unexpected acceptance runner exit code: $status" >&2
            exit 1
          fi
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Independently verify complete evidence package
        id: verify
        shell: bash
        env:
          ROOT: ${{ steps.run.outputs.root }}
          RUN_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [[ ! -f "$ROOT/binance-spot-instrument-acceptance-report.json" ]]; then
            printf 'exit_code=1\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          PYTHONPATH=. python -m ai_platform.market_data.binance_spot_instrument_acceptance evaluate \
            --run-root "$ROOT" \
            --policy "$POLICY_PATH"
          status=$?
          set -e
          [[ "$status" == "$RUN_EXIT_CODE" ]] || { echo "Independent evaluator outcome differs from runner" >&2; exit 1; }
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Upload bounded metadata evidence
        if: ${{ always() && steps.run.outputs.root != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binance-spot-instrument-shadow-acceptance-v2-${{ github.event.pull_request.number }}
          path: |
            ${{ steps.run.outputs.root }}/samples/*/sample-report.json
            ${{ steps.run.outputs.root }}/run-request.json
            ${{ steps.run.outputs.root }}/policy.json
            ${{ steps.run.outputs.root }}/binance-spot-instrument-acceptance-summary.json
            ${{ steps.run.outputs.root }}/binance-spot-instrument-acceptance-manifest.json
            ${{ steps.run.outputs.root }}/binance-spot-instrument-acceptance-report.json
            ${{ steps.run.outputs.root }}/artifact-sha256.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Remove isolated acceptance runtime
        if: always()
        shell: bash
        run: rm -rf .venv

      - name: Enforce terminal acceptance outcome
        shell: bash
        env:
          RUN_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          [[ "$RUN_EXIT_CODE" == "$VERIFY_EXIT_CODE" ]] || { echo "Runner and evaluator exit codes disagree" >&2; exit 1; }
          case "$RUN_EXIT_CODE" in
            0) echo "Binance Spot instrument shadow v2 outcome: accepted; production source remains disabled" ;;
            2) echo "Binance Spot instrument shadow v2 outcome: inconclusive; production source remains disabled" ;;
            1) echo "Binance Spot instrument shadow v2 outcome: rejected; production source remains disabled"; exit 1 ;;
            *) echo "Missing terminal acceptance result" >&2; exit 1 ;;
          esac
