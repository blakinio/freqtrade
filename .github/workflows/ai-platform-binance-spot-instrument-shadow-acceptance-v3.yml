name: AI Platform Binance Spot Instrument Shadow Acceptance V3

"on":
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - "ai_platform/market_data/run-requests/binance-spot-instrument-shadow-acceptance-20260729-v3.json"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: binance-spot-instrument-shadow-acceptance-v3
  cancel-in-progress: false

env:
  REQUEST_PATH: ai_platform/market_data/run-requests/binance-spot-instrument-shadow-acceptance-20260729-v3.json
  POLICY_PATH: ai_platform/market_data/binance-spot-instrument-shadow-acceptance-policy-v1.json
  STATE_DIR: /var/lib/freqtrade-staging-state
  DURABLE_ROOT: /var/lib/freqtrade-staging-state/binance-spot-instrument-acceptance

jobs:
  initialize:
    name: Initialize non-blocking Binance acceptance v3
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 10

    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact-one-file v3 trigger scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expected=$'A\tai_platform/market_data/run-requests/binance-spot-instrument-shadow-acceptance-20260729-v3.json'
          actual="$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Binance acceptance v3 trigger must add exactly the canonical request" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

      - name: Validate approved runner and durable storage
        shell: bash
        env:
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME_VALUE" == "freqtrade-synology-staging" ]]
          [[ "$RUNNER_OS_VALUE" == "Linux" ]]
          [[ "$RUNNER_ARCH_VALUE" == "X64" || "$RUNNER_ARCH_VALUE" == "ARM64" ]]
          [[ -d "$STATE_DIR" && -w "$STATE_DIR" ]]
          mkdir -p "$DURABLE_ROOT"
          [[ -d "$DURABLE_ROOT" && -w "$DURABLE_ROOT" ]]

      - name: Refuse trading credentials and proxy routing
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            BINANCE_API_KEY BINANCE_API_SECRET BINANCE_SECRET_KEY \
            BYBIT_API_KEY BYBIT_API_SECRET \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            EXCHANGE_API_KEY EXCHANGE_API_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET \
            HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          do
            if [[ -n "${!name:-}" ]]; then
              echo "Forbidden credential or proxy environment is present: $name" >&2
              exit 1
            fi
          done

      - name: Install isolated uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.12"
          enable-cache: false

      - name: Install pinned acceptance dependency
        shell: bash
        run: uv pip install --python "$VIRTUAL_ENV/bin/python" "jsonschema==4.26.0"

      - name: Initialize durable incremental state
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m \
            ai_platform.market_data.binance_spot_instrument_acceptance_incremental \
            init \
            --request "$REQUEST_PATH" \
            --policy "$POLICY_PATH" \
            --durable-root "$DURABLE_ROOT" \
            --collector-commit "$HEAD_SHA"

      - name: Remove isolated acceptance runtime
        if: always()
        shell: bash
        run: rm -rf .venv

  sample:
    name: Collect one due Binance acceptance sample v3
    if: github.event_name == 'schedule'
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 5

    steps:
      - name: Checkout exact scheduled commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Validate approved runner and durable storage
        shell: bash
        env:
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME_VALUE" == "freqtrade-synology-staging" ]]
          [[ "$RUNNER_OS_VALUE" == "Linux" ]]
          [[ "$RUNNER_ARCH_VALUE" == "X64" || "$RUNNER_ARCH_VALUE" == "ARM64" ]]
          [[ -d "$STATE_DIR" && -w "$STATE_DIR" ]]
          mkdir -p "$DURABLE_ROOT"
          [[ -d "$DURABLE_ROOT" && -w "$DURABLE_ROOT" ]]

      - name: Refuse trading credentials and proxy routing
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            BINANCE_API_KEY BINANCE_API_SECRET BINANCE_SECRET_KEY \
            BYBIT_API_KEY BYBIT_API_SECRET \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            EXCHANGE_API_KEY EXCHANGE_API_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET \
            HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          do
            if [[ -n "${!name:-}" ]]; then
              echo "Forbidden credential or proxy environment is present: $name" >&2
              exit 1
            fi
          done

      - name: Check whether a sample is due
        id: due
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          durable_root = Path(os.environ["DURABLE_ROOT"])
          pointer_path = durable_root / "active-binance-spot-instrument-acceptance-v3.json"
          should_run = True
          status = "invalid"
          due_ns = 0
          if not pointer_path.exists():
              should_run = False
              status = "idle"
          else:
              try:
                  pointer = json.loads(pointer_path.read_text(encoding="utf-8"))
                  run_root = Path(str(pointer["run_root"]))
                  if run_root.parent != durable_root:
                      raise ValueError("active run root is outside durable root")
                  state = json.loads(
                      (run_root / "incremental-state.json").read_text(encoding="utf-8")
                  )
                  state_status = state.get("status")
                  if state_status == "completed":
                      status = "completed"
                  elif state_status == "active":
                      interval_ns = int(state["sample_interval_seconds"]) * 1_000_000_000
                      index = int(state["next_sample_index"])
                      due_ns = int(state["window_started_ns"]) + index * interval_ns
                      last_completed = state.get("last_sample_completed_ns")
                      if last_completed is not None:
                          due_ns = max(due_ns, int(last_completed) + interval_ns)
                      should_run = time.time_ns() >= due_ns
                      status = "due" if should_run else "not_due"
                  else:
                      raise ValueError("incremental state status is invalid")
              except (KeyError, OSError, TypeError, ValueError, json.JSONDecodeError) as exc:
                  print(f"Due check will fail closed through the sampler: {exc}")
                  should_run = True
                  status = "invalid"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
              output.write(f"status={status}\n")
              output.write(f"due_ns={due_ns}\n")
          print(f"Binance acceptance v3 due status: {status}")
          PY

      - name: Install isolated uv and Python
        if: steps.due.outputs.should_run == 'true'
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.12"
          enable-cache: false

      - name: Install pinned acceptance dependency
        if: steps.due.outputs.should_run == 'true'
        shell: bash
        run: uv pip install --python "$VIRTUAL_ENV/bin/python" "jsonschema==4.26.0"

      - name: Collect at most one due sample
        if: steps.due.outputs.should_run == 'true'
        id: sample
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m \
            ai_platform.market_data.binance_spot_instrument_acceptance_incremental \
            sample \
            --policy "$POLICY_PATH" \
            --durable-root "$DURABLE_ROOT"

      - name: Upload bounded terminal metadata evidence
        if: ${{ steps.sample.outputs.status == 'finalized' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binance-spot-instrument-shadow-acceptance-v3-${{ steps.sample.outputs.run_id }}
          path: |
            ${{ steps.sample.outputs.run_root }}/samples/*/sample-report.json
            ${{ steps.sample.outputs.run_root }}/run-request.json
            ${{ steps.sample.outputs.run_root }}/policy.json
            ${{ steps.sample.outputs.run_root }}/incremental-state.json
            ${{ steps.sample.outputs.run_root }}/binance-spot-instrument-acceptance-summary.json
            ${{ steps.sample.outputs.run_root }}/binance-spot-instrument-acceptance-manifest.json
            ${{ steps.sample.outputs.run_root }}/binance-spot-instrument-acceptance-report.json
            ${{ steps.sample.outputs.run_root }}/artifact-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated acceptance runtime
        if: ${{ always() && steps.due.outputs.should_run == 'true' }}
        shell: bash
        run: rm -rf .venv

      - name: Enforce terminal acceptance outcome
        if: ${{ steps.sample.outputs.status == 'finalized' }}
        shell: bash
        env:
          OUTCOME: ${{ steps.sample.outputs.outcome }}
        run: |
          set -euo pipefail
          case "$OUTCOME" in
            accepted)
              echo "Binance Spot instrument shadow v3 accepted; production remains disabled"
              ;;
            inconclusive_incomplete_window)
              echo "Binance Spot instrument shadow v3 inconclusive; production remains disabled"
              ;;
            rejected)
              echo "Binance Spot instrument shadow v3 rejected; production remains disabled" >&2
              exit 1
              ;;
            *)
              echo "Missing or invalid terminal acceptance outcome" >&2
              exit 1
              ;;
          esac
