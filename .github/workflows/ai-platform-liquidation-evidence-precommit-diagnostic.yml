name: AI Platform Liquidation Evidence Pre-commit Diagnostic

on:
  push:
    branches:
      - docs/liquid20-candle-evidence-publication
    paths:
      - .github/workflows/ai-platform-liquidation-evidence-precommit-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.repository == 'blakinio/freqtrade'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: docs/liquid20-candle-evidence-publication

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'

      - name: Capture full pre-commit output
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pre-commit
          set +e
          pre-commit run --all-files --show-diff-on-failure > precommit-diagnostic.txt 2>&1
          status=$?
          set -e
          printf '\nPRE_COMMIT_EXIT_STATUS=%s\n' "$status" >> precommit-diagnostic.txt
          cat precommit-diagnostic.txt

      - name: Commit diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add precommit-diagnostic.txt
          git commit -m "chore(liquidations): capture temporary pre-commit diagnostic"
          git push origin HEAD:docs/liquid20-candle-evidence-publication
