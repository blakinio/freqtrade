name: AI Platform Liquidation Evidence Pre-commit Diagnostic

on:
  push:
    branches:
      - docs/liquid20-candle-evidence-publication
    paths:
      - .github/workflows/ai-platform-liquidation-evidence-precommit-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'blakinio/freqtrade'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: docs/liquid20-candle-evidence-publication

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'

      - name: Capture full pre-commit output
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pre-commit
          set +e
          pre-commit run --all-files --show-diff-on-failure > precommit-output.txt 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > precommit-status.txt
          cat precommit-output.txt

      - name: Upload diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquid20-evidence-precommit-diagnostic
          path: |
            precommit-output.txt
            precommit-status.txt
          if-no-files-found: error
          retention-days: 1
