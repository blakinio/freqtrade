name: AI Platform OKX Liquidation Shadow Acceptance

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop
    paths:
      - "ai_platform/research/liquidations/run-requests/okx-shadow-acceptance-20260727-v1.json"

permissions:
  contents: read

concurrency:
  group: okx-liquidation-shadow-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  REQUEST_PATH: ai_platform/research/liquidations/run-requests/okx-shadow-acceptance-20260727-v1.json
  POLICY_PATH: ai_platform/research/liquidations/okx-liquidation-shadow-acceptance-policy-v1.json

jobs:
  acceptance:
    name: Run 24-hour OKX shadow acceptance
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 1500
    env:
      ACCEPTANCE_HOST_ID: freqtrade-synology-staging
      DURABLE_ROOT: /var/lib/freqtrade-staging-state/okx-liquidation-acceptance
      DURABLE_URI: file:///var/lib/freqtrade-staging-state/okx-liquidation-acceptance

    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact-one-file trigger scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expected=$'A\tai_platform/research/liquidations/run-requests/okx-shadow-acceptance-20260727-v1.json'
          actual="$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")"
          if [[ "$actual" != "$expected" ]]; then
            echo "OKX acceptance trigger must add exactly the canonical request file" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

      - name: Validate staging identity and durable storage
        id: staging
        shell: bash
        env:
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME_VALUE" = "$ACCEPTANCE_HOST_ID"
          test "$RUNNER_OS_VALUE" = "Linux"
          test -n "$ACCEPTANCE_HOST_ID"
          test -n "$DURABLE_ROOT"
          test -n "$DURABLE_URI"
          case "$DURABLE_ROOT" in
            /*) ;;
            *) echo "DURABLE_ROOT must be absolute" >&2; exit 1 ;;
          esac
          test "$(dirname "$DURABLE_ROOT")" = "/var/lib/freqtrade-staging-state"
          test -d "$DURABLE_ROOT"
          test -w "$DURABLE_ROOT"
          case "$DURABLE_ROOT" in
            "$RUNNER_TEMP"|"$RUNNER_TEMP"/*|"$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*)
              echo "Durable root must not be runner-temporary or workspace storage" >&2
              exit 1
              ;;
          esac
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text(encoding="utf-8"))
          expected = {
              "host_id": os.environ["ACCEPTANCE_HOST_ID"],
              "host_class": "always_on_nonrestricted_linux_staging",
              "github_hosted_runner": False,
              "durable_storage_uri": os.environ["DURABLE_URI"],
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f"request {key} does not match staging configuration")
          run_id = str(request.get("run_id", ""))
          if not re.fullmatch(r"[A-Za-z0-9._-]{3,80}", run_id):
              raise SystemExit("request run_id is invalid")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"run_id={run_id}\n")
          PY

      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET \
            BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            if [[ -n "${!name:-}" ]]; then
              echo "Recognized trading credential environment is present: $name" >&2
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install public collector dependency
        run: python -m pip install --disable-pip-version-check websockets==15.0.1

      - name: Run frozen acceptance package
        id: run
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ steps.staging.outputs.run_id }}
        run: |
          set -euo pipefail
          root="${DURABLE_ROOT%/}/$RUN_ID"
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          set +e
          PYTHONPATH=. python -m ai_platform.scripts.liquidation_okx_shadow_acceptance \
            --request "$REQUEST_PATH" \
            --policy "$POLICY_PATH" \
            --collector-commit "$HEAD_SHA" \
            --output-root "$root"
          status=$?
          set -e
          if [[ "$status" -ne 0 && "$status" -ne 1 && "$status" -ne 2 ]]; then
            echo "Unexpected acceptance runner exit code: $status" >&2
            exit 1
          fi
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Independently verify complete evidence package
        id: verify
        shell: bash
        env:
          ROOT: ${{ steps.run.outputs.root }}
          RUN_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [[ ! -f "$ROOT/okx-shadow-acceptance-report.json" ]]; then
            printf 'exit_code=1\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          PYTHONPATH=. python -m ai_platform.scripts.liquidation_okx_shadow_acceptance_evaluator \
            --run-root "$ROOT" \
            --policy "$POLICY_PATH"
          status=$?
          set -e
          if [[ "$status" != "$RUN_EXIT_CODE" ]]; then
            echo "Independent evaluator outcome differs from runner" >&2
            exit 1
          fi
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Upload bounded metadata evidence
        if: ${{ always() && steps.run.outputs.root != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: okx-liquidation-shadow-acceptance-${{ github.event.pull_request.number }}
          path: |
            ${{ steps.run.outputs.root }}/okx-usdt-swap-summary.json
            ${{ steps.run.outputs.root }}/okx-usdt-swap-instruments.json
            ${{ steps.run.outputs.root }}/okx-shadow-acceptance-manifest.json
            ${{ steps.run.outputs.root }}/okx-shadow-acceptance-report.json
            ${{ steps.run.outputs.root }}/artifact-sha256.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce terminal acceptance outcome
        shell: bash
        env:
          RUN_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [[ "$RUN_EXIT_CODE" != "$VERIFY_EXIT_CODE" ]]; then
            echo "Runner and evaluator exit codes disagree" >&2
            exit 1
          fi
          case "$RUN_EXIT_CODE" in
            0) echo "OKX shadow source outcome: accepted" ;;
            2) echo "OKX shadow source outcome: inconclusive_insufficient_activity" >&2; exit 2 ;;
            *) echo "OKX shadow source outcome: rejected or incomplete" >&2; exit 1 ;;
          esac
