name: AI Platform Phase 5 Final Holdout Validation v2

on:
  pull_request:
    types: [opened]
    branches: [develop]
    paths:
      - "ai_platform/validation/run-requests/final-holdout-v2.json"

permissions:
  contents: read

concurrency:
  group: ai-platform-phase5-final-holdout-v2
  cancel-in-progress: false

jobs:
  final-holdout-validation-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout exact final-validation request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Validate frozen v2 contract and block premature holdout access
        run: |
          python - <<'PY'
          import json
          import math
          from datetime import datetime, timezone
          from pathlib import Path

          request_path = Path("ai_platform/validation/run-requests/final-holdout-v2.json")
          declaration_path = Path("ai_platform/validation/final-holdout-v2-declaration.json")
          evidence_path = Path("ai_platform/evidence/phase5-exit-thresholds-v1.json")
          experiment_path = Path("ai_platform/experiments/final-holdout-v2.json")

          request = json.loads(request_path.read_text(encoding="utf-8"))
          declaration = json.loads(declaration_path.read_text(encoding="utf-8"))
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          experiment = json.loads(experiment_path.read_text(encoding="utf-8"))

          expected_holdout = "20260801-20260930"
          expected_training = "20251201-20260228"
          expected_tuning = "20260301-20260430"
          expected_entry = 0.006
          expected_exit = -0.009
          earliest_execution_date = "2026-10-01"
          today_utc = datetime.now(timezone.utc).date().isoformat()

          checks = {
              "request_declaration_path": request.get("holdout_declaration") == str(declaration_path),
              "request_selection_evidence_path": request.get("selection_evidence") == str(evidence_path),
              "request_experiment_manifest_path": request.get("experiment_manifest") == str(experiment_path),
              "request_final_holdout_allowed": request.get("final_holdout_allowed") is True,
              "request_retuning_allowed": request.get("retuning_allowed") is False,
              "request_promotion_allowed": request.get("promotion_allowed") is False,
              "request_holdout_boundary": request.get("final_holdout_timerange") == expected_holdout,
              "request_entry_threshold": math.isclose(
                  float(request.get("expected_selected_parameters", {}).get("entry_prediction_threshold", 999)),
                  expected_entry,
                  rel_tol=0.0,
                  abs_tol=1e-12,
              ),
              "request_exit_threshold": math.isclose(
                  float(request.get("expected_selected_parameters", {}).get("exit_prediction_threshold", 999)),
                  expected_exit,
                  rel_tol=0.0,
                  abs_tol=1e-12,
              ),
              "declaration_status": declaration.get("status")
              == "declared_unseen_pending_final_validation_work_package",
              "declaration_holdout_boundary": declaration.get("final_holdout", {}).get("timerange")
              == expected_holdout,
              "declaration_before_start": declaration.get("final_holdout", {}).get("declared_before_window_start")
              is True,
              "declaration_no_consumed_overlap": declaration.get("final_holdout", {}).get("overlaps_consumed_holdout")
              is False,
              "declaration_holdout_unused": declaration.get("final_holdout", {}).get("used") is False,
              "declaration_retuning_forbidden": declaration.get("authorization", {}).get("retuning_allowed") is False,
              "declaration_promotion_forbidden": declaration.get("authorization", {}).get("promotion_allowed") is False,
              "evidence_status": evidence.get("status") == "selected_stable",
              "evidence_entry_threshold": math.isclose(
                  float(evidence.get("optimization", {}).get("fixed_parameters", {}).get("entry_prediction_threshold", 999)),
                  expected_entry,
                  rel_tol=0.0,
                  abs_tol=1e-12,
              ),
              "evidence_exit_threshold": math.isclose(
                  float(evidence.get("optimization", {}).get("selected_parameters", {}).get("exit_prediction_threshold", 999)),
                  expected_exit,
                  rel_tol=0.0,
                  abs_tol=1e-12,
              ),
              "training_boundary": evidence.get("optimization", {}).get("training", {}).get("timerange")
              == expected_training,
              "tuning_boundary": evidence.get("optimization", {}).get("tuning", {}).get("timerange")
              == expected_tuning,
              "consumed_holdout_boundary": evidence.get("holdout_policy", {})
              .get("consumed_holdout_reference", {})
              .get("timerange")
              == "20260501-20260630",
              "consumed_holdout_not_used_in_phase52": evidence.get("holdout_policy", {}).get(
                  "consumed_holdout_used_in_phase52"
              )
              is False,
              "phase52_final_holdout_not_used": evidence.get("holdout_policy", {}).get("final_holdout_used") is False,
              "experiment_holdout_boundary": experiment.get("timerange") == expected_holdout,
              "experiment_strategy": experiment.get("strategy") == "AiPhase52ExitStrategy",
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Frozen final-validation v2 contract failed: " + ", ".join(failed))

          if today_utc < earliest_execution_date:
              raise SystemExit(
                  "Final holdout v2 is prospectively declared but not yet complete. "
                  f"Earliest execution date is {earliest_execution_date} UTC; today is {today_utc}. "
                  "No holdout data was downloaded or accessed by this workflow."
              )

          print(
              "Frozen final-validation v2 contract passed: "
              f"entry={expected_entry}, exit={expected_exit}, holdout={expected_holdout}, today_utc={today_utc}"
          )
          PY

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: true # zizmor: ignore[cache-poisoning] - research dependency cache only
          python-version: "3.12"
          cache-dependency-glob: "requirements**.txt"
          cache-suffix: "phase5-final-validation-v2-3.12"

      - name: Install FreqAI dependencies
        run: |
          uv pip install -r requirements-freqai.txt
          uv pip install -e .

      - name: Prepare research user directory
        run: freqtrade create-userdir --userdir user_data

      - name: Restore Kraken historical data cache
        id: kraken-data-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: user_data/data/kraken
          key: phase5-kraken-trades-v2-${{ runner.os }}-${{ hashFiles('ai_platform/experiments/final-holdout-v2.json', 'ai_platform/configs/freqai-baseline.example.json') }}
          restore-keys: |
            phase5-kraken-trades-v2-${{ runner.os }}-
            phase5-kraken-trades-v1-${{ runner.os }}-

      - name: Incrementally update declared Kraken history
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(
              Path("ai_platform/experiments/final-holdout-v2.json").read_text(encoding="utf-8")
          )
          config_path = Path(manifest["config"])
          config = json.loads(config_path.read_text(encoding="utf-8"))
          exchange = str(config.get("exchange", {}).get("name", "")).lower()
          if exchange != "kraken":
              raise SystemExit(f"Final holdout v2 workflow expects Kraken baseline, got {exchange!r}")

          command = [
              "freqtrade",
              "download-data",
              "--config",
              str(config_path),
              "--pairs",
              *manifest["pairs"],
              "--timeframes",
              *manifest["timeframes"],
              "--timerange",
              manifest["download_timerange"],
              "--dl-trades",
              "--convert",
          ]
          subprocess.run(command, check=True)
          PY

      - name: Save PR-local Kraken historical data cache
        if: steps.kraken-data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: user_data/data/kraken
          key: ${{ steps.kraken-data-cache.outputs.cache-primary-key }}

      - name: Materialize frozen Phase 5.2 parameters
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          from ai_platform.strategies.AiPhase52ExitStrategy import AiPhase52ExitStrategy

          declaration = json.loads(
              Path("ai_platform/validation/final-holdout-v2-declaration.json").read_text(encoding="utf-8")
          )
          entry = float(declaration["frozen_parameters"]["entry_prediction_threshold"])
          exit_threshold = float(declaration["frozen_parameters"]["exit_prediction_threshold"])

          if not math.isclose(
              float(AiPhase52ExitStrategy.entry_prediction_threshold), entry, rel_tol=0.0, abs_tol=1e-12
          ):
              raise SystemExit(
                  "AiPhase52ExitStrategy entry threshold drifted from the prospectively frozen selection"
              )

          parameter_file = {
              "strategy_name": "AiPhase52ExitStrategy",
              "params": {
                  "sell": {"exit_prediction_threshold": exit_threshold}
              },
              "ft_stratparam_v": 1,
              "export_time": "2026-07-20T00:00:00Z"
          }
          Path("ai_platform/strategies/AiPhase52ExitStrategy.json").write_text(
              json.dumps(parameter_file, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              "Frozen parameters materialized: "
              f"entry_prediction_threshold={entry}, exit_prediction_threshold={exit_threshold}"
          )
          PY

      - name: Run one-shot frozen final holdout v2 backtest
        id: holdout
        run: |
          set -euo pipefail
          run_dir="$(python -m ai_platform.scripts.run_experiment ai_platform/experiments/final-holdout-v2.json --stage backtest | tail -n 1)"
          echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"
          echo "Final holdout v2 run directory: $run_dir"

      - name: Evaluate final holdout v2 gates without retuning
        id: result
        env:
          RUN_DIR: ${{ steps.holdout.outputs.run_dir }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_dir = Path(os.environ["RUN_DIR"])
          summary = json.loads((run_dir / "run-summary.json").read_text(encoding="utf-8"))
          validation_plan = json.loads(
              Path("ai_platform/validation/baseline-validation-v1.json").read_text(encoding="utf-8")
          )
          declaration = json.loads(
              Path("ai_platform/validation/final-holdout-v2-declaration.json").read_text(encoding="utf-8")
          )
          metrics = summary.get("metrics") or {}

          def metric(*names):
              for name in names:
                  value = metrics.get(name)
                  if isinstance(value, (int, float)):
                      return value
              raise SystemExit(f"Required metric missing; tried: {', '.join(names)}")

          trades = int(metric("total_trades", "trade_count"))
          profit = float(metric("profit_total", "total_profit"))
          drawdown = float(metric("max_drawdown_account", "max_drawdown"))
          gates = validation_plan["gates"]
          checks = {
              "minimum_holdout_trades": trades >= int(gates["minimum_holdout_trades"]),
              "minimum_holdout_profit": profit >= float(gates["minimum_holdout_profit"]),
              "maximum_holdout_drawdown": drawdown <= float(gates["maximum_holdout_drawdown"]),
          }
          passed = all(checks.values())

          result = {
              "schema_version": 1,
              "status": "holdout_passed" if passed else "holdout_failed",
              "selection_status": "selected_stable",
              "selected_parameters": declaration["frozen_parameters"],
              "selection_evidence": declaration["selection_evidence"],
              "final_validation_commit": summary["git_commit"],
              "final_holdout": {
                  "name": declaration["final_holdout"]["name"],
                  "timerange": declaration["final_holdout"]["timerange"],
                  "used": True,
              },
              "metrics": {
                  "trades": trades,
                  "profit": profit,
                  "drawdown": drawdown,
              },
              "gates": {
                  "source": "ai_platform/validation/baseline-validation-v1.json",
                  "thresholds": {
                      "minimum_holdout_trades": gates["minimum_holdout_trades"],
                      "minimum_holdout_profit": gates["minimum_holdout_profit"],
                      "maximum_holdout_drawdown": gates["maximum_holdout_drawdown"],
                  },
                  "checks": checks,
                  "passed": passed,
              },
              "retuning_allowed": False,
              "promotion_allowed": False,
              "promotion_decision": "not_performed",
              "notes": "Frozen prospective final holdout v2 evidence only. This result must not be used to retune parameters, features, or models. No profitability claim is made.",
          }
          result_path = run_dir / "final-validation-v2-result.json"
          result_path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("PHASE5_FINAL_VALIDATION_V2_RESULT=" + json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY

      - name: Upload final holdout v2 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5-final-holdout-v2-evidence-${{ github.event.pull_request.number }}
          path: ${{ steps.holdout.outputs.run_dir }}
          retention-days: 30

      - name: Upload final holdout v2 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5-final-holdout-v2-diagnostics-${{ github.event.pull_request.number }}
          path: |
            ai_platform/artifacts/validation-v2
            ai_platform/strategies/AiPhase52ExitStrategy.json
          if-no-files-found: ignore
          retention-days: 30
