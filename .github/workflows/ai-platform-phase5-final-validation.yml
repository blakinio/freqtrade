name: AI Platform Phase 5 Final Holdout Validation

on:
  pull_request:
    types: [opened]
    branches: [develop]
    paths:
      - "ai_platform/validation/run-requests/final-holdout-v1.json"

permissions:
  contents: read

concurrency:
  group: ai-platform-phase5-final-holdout
  cancel-in-progress: false

jobs:
  final-holdout-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout exact final-validation request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: true # zizmor: ignore[cache-poisoning] - research dependency cache only
          python-version: "3.12"
          cache-dependency-glob: "requirements**.txt"
          cache-suffix: "phase5-final-validation-3.12"

      - name: Install FreqAI dependencies
        run: |
          uv pip install -r requirements-freqai.txt
          uv pip install -e .

      - name: Prepare research user directory
        run: freqtrade create-userdir --userdir user_data

      - name: Restore shared Kraken historical data cache
        id: kraken-data-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: user_data/data/kraken
          key: phase5-kraken-trades-v1-${{ runner.os }}-${{ hashFiles('ai_platform/experiments/baseline-v1.json', 'ai_platform/configs/freqai-baseline.example.json') }}
          restore-keys: |
            phase5-kraken-trades-v1-${{ runner.os }}-

      - name: Download or incrementally update declared Kraken history
        if: steps.kraken-data-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(
              Path("ai_platform/experiments/final-holdout-v1.json").read_text(encoding="utf-8")
          )
          config_path = Path(manifest["config"])
          config = json.loads(config_path.read_text(encoding="utf-8"))
          exchange = str(config.get("exchange", {}).get("name", "")).lower()
          if exchange != "kraken":
              raise SystemExit(f"Final holdout workflow expects Kraken baseline, got {exchange!r}")

          command = [
              "freqtrade",
              "download-data",
              "--config",
              str(config_path),
              "--pairs",
              *manifest["pairs"],
              "--timeframes",
              *manifest["timeframes"],
              "--timerange",
              manifest["download_timerange"],
              "--dl-trades",
              "--convert",
          ]
          subprocess.run(command, check=True)
          PY

      - name: Save PR-local Kraken historical data cache
        if: steps.kraken-data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: user_data/data/kraken
          key: ${{ steps.kraken-data-cache.outputs.cache-primary-key }}

      - name: Validate frozen selection and materialize selected parameter
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(
              Path("ai_platform/validation/run-requests/final-holdout-v1.json").read_text(encoding="utf-8")
          )
          evidence_path = Path(request["selection_evidence"])
          experiment_path = Path(request["experiment_manifest"])
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          experiment = json.loads(experiment_path.read_text(encoding="utf-8"))

          expected_holdout = "20260501-20260630"
          expected_training = "20251201-20260228"
          expected_tuning = "20260301-20260430"

          checks = {
              "request_final_holdout_allowed": request.get("final_holdout_allowed") is True,
              "request_retuning_allowed": request.get("retuning_allowed") is False,
              "selection_status": evidence.get("status") == "selected_stable",
              "eligible_for_final_validation": evidence.get("eligible_for_final_validation") is True,
              "training_boundary": evidence.get("training", {}).get("timerange") == expected_training,
              "tuning_boundary": evidence.get("tuning", {}).get("timerange") == expected_tuning,
              "selection_holdout_boundary": evidence.get("final_holdout", {}).get("timerange") == expected_holdout,
              "holdout_not_used_for_selection": evidence.get("final_holdout", {}).get("used_for_selection") is False,
              "holdout_not_used_for_retuning": evidence.get("final_holdout", {}).get("used_for_retuning") is False,
              "experiment_holdout_boundary": experiment.get("timerange") == expected_holdout,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Frozen final-validation contract failed: " + ", ".join(failed))

          threshold = evidence.get("selected_parameters", {}).get("entry_prediction_threshold")
          if threshold != 0.006:
              raise SystemExit(f"Expected frozen selected threshold 0.006, got {threshold!r}")

          parameter_file = {
              "strategy_name": "AiBaselineStrategy",
              "params": {
                  "buy": {"entry_prediction_threshold": threshold}
              },
              "ft_stratparam_v": 1,
              "export_time": "2026-07-19T20:38:45Z"
          }
          Path("ai_platform/strategies/AiBaselineStrategy.json").write_text(
              json.dumps(parameter_file, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"Frozen selected entry_prediction_threshold={threshold}")
          PY

      - name: Run one-shot frozen final holdout backtest
        id: holdout
        run: |
          set -euo pipefail
          run_dir="$(python -m ai_platform.scripts.run_experiment ai_platform/experiments/final-holdout-v1.json --stage backtest | tail -n 1)"
          echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"
          echo "Final holdout run directory: $run_dir"

      - name: Evaluate final holdout gates without retuning
        id: result
        env:
          RUN_DIR: ${{ steps.holdout.outputs.run_dir }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_dir = Path(os.environ["RUN_DIR"])
          summary = json.loads((run_dir / "run-summary.json").read_text(encoding="utf-8"))
          validation_plan = json.loads(
              Path("ai_platform/validation/baseline-validation-v1.json").read_text(encoding="utf-8")
          )
          evidence = json.loads(
              Path("ai_platform/optimization/evidence/freqai-baseline-signal-thresholds-v1-selected.json").read_text(encoding="utf-8")
          )
          metrics = summary.get("metrics") or {}

          def metric(*names):
              for name in names:
                  value = metrics.get(name)
                  if isinstance(value, (int, float)):
                      return value
              raise SystemExit(f"Required metric missing; tried: {', '.join(names)}")

          trades = int(metric("total_trades", "trade_count"))
          profit = float(metric("profit_total", "total_profit"))
          drawdown = float(metric("max_drawdown_account", "max_drawdown"))
          gates = validation_plan["gates"]
          checks = {
              "minimum_holdout_trades": trades >= int(gates["minimum_holdout_trades"]),
              "minimum_holdout_profit": profit >= float(gates["minimum_holdout_profit"]),
              "maximum_holdout_drawdown": drawdown <= float(gates["maximum_holdout_drawdown"]),
          }
          passed = all(checks.values())

          result = {
              "schema_version": 1,
              "status": "holdout_passed" if passed else "holdout_failed",
              "selection_status": evidence["status"],
              "selected_parameters": evidence["selected_parameters"],
              "research_commit": evidence["research_request"]["research_commit"],
              "final_validation_commit": summary["git_commit"],
              "final_holdout": {
                  "name": validation_plan["holdout"]["name"],
                  "timerange": validation_plan["holdout"]["timerange"],
                  "used": True,
              },
              "metrics": {
                  "trades": trades,
                  "profit": profit,
                  "drawdown": drawdown,
              },
              "gates": {
                  "thresholds": {
                      "minimum_holdout_trades": gates["minimum_holdout_trades"],
                      "minimum_holdout_profit": gates["minimum_holdout_profit"],
                      "maximum_holdout_drawdown": gates["maximum_holdout_drawdown"],
                  },
                  "checks": checks,
                  "passed": passed,
              },
              "retuning_allowed": False,
              "promotion_allowed": False,
              "promotion_decision": "not_performed",
              "notes": "Frozen final holdout evidence only. This result must not be used to retune parameters, features, or models. No profitability claim is made.",
          }
          result_path = run_dir / "final-validation-result.json"
          result_path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("PHASE5_FINAL_VALIDATION_RESULT=" + json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY

      - name: Upload final holdout evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5-final-holdout-evidence-${{ github.event.pull_request.number }}
          path: ${{ steps.holdout.outputs.run_dir }}
          retention-days: 30

      - name: Upload final holdout failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5-final-holdout-diagnostics-${{ github.event.pull_request.number }}
          path: |
            ai_platform/artifacts/validation
            ai_platform/strategies/AiBaselineStrategy.json
          if-no-files-found: ignore
          retention-days: 30
