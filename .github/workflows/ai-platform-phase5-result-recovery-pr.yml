name: AI Platform Phase 5 Result Recovery PR

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/ai-platform-phase5-result-recovery-pr.yml"

permissions:
  actions: read
  contents: read

jobs:
  recover-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Extract Phase 5 result from completed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = "https://api.github.com/repos/blakinio/freqtrade/actions/jobs/88226990900/logs"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              text = response.read().decode("utf-8-sig", errors="replace")

          matches = [
              line for line in text.splitlines()
              if "PHASE5_TUNING_RESULT" in line
          ]
          if not matches:
              raise SystemExit("PHASE5_TUNING_RESULT not found in completed job log")
          for line in matches:
              print(line)
          PY
