name: AI Platform Phase 5 Tuning

on:
  pull_request:
    types: [opened]
    paths:
      - "ai_platform/optimization/run-requests/signal-thresholds-v1.json"

permissions:
  contents: read

concurrency:
  group: ai-platform-phase5-tuning-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  signal-threshold-tuning:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: true # zizmor: ignore[cache-poisoning] - research-only, no release artifacts
          python-version: "3.12"
          cache-dependency-glob: "requirements**.txt"
          cache-suffix: "phase5-tuning-3.12"

      - name: Install FreqAI and Hyperopt dependencies
        run: |
          uv pip install -r requirements-freqai.txt
          uv pip install -r requirements-hyperopt.txt
          uv pip install -e .

      - name: Prepare research user directory
        run: freqtrade create-userdir --userdir user_data

      - name: Restore Kraken historical data cache
        id: kraken-data-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: user_data/data/kraken
          key: phase5-kraken-trades-v1-${{ runner.os }}-${{ hashFiles('ai_platform/experiments/baseline-v1.json', 'ai_platform/configs/freqai-baseline.example.json') }}
          restore-keys: |
            phase5-kraken-trades-v1-${{ runner.os }}-

      - name: Download or incrementally update declared Kraken historical data
        if: steps.kraken-data-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(
              Path("ai_platform/experiments/baseline-v1.json").read_text(encoding="utf-8")
          )
          config_path = Path(manifest["config"])
          config = json.loads(config_path.read_text(encoding="utf-8"))
          exchange = str(config.get("exchange", {}).get("name", "")).lower()
          if exchange != "kraken":
              raise SystemExit(f"Phase 5 tuning workflow expects Kraken baseline, got {exchange!r}")

          command = [
              "freqtrade",
              "download-data",
              "--config",
              str(config_path),
              "--pairs",
              *manifest["pairs"],
              "--timeframes",
              *manifest["timeframes"],
              "--timerange",
              manifest["download_timerange"],
              "--dl-trades",
              "--convert",
          ]
          print("Restored cache was incomplete or missing; updating Kraken trade history incrementally")
          subprocess.run(command, check=True)
          PY

      - name: Save PR-local Kraken historical data cache
        if: steps.kraken-data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: user_data/data/kraken
          key: ${{ steps.kraken-data-cache.outputs.cache-primary-key }}

      - name: Run Phase 5.1 tuning only
        id: optimize
        shell: bash
        run: |
          set +e
          python -m ai_platform.scripts.run_optimization \
            ai_platform/optimization/baseline-signal-thresholds-v1.json \
            > phase5-run-path.txt \
            2> phase5-run-error.txt
          status=$?
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"

          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            echo "::group::Phase 5 optimizer stderr"
            cat phase5-run-error.txt || true
            echo "::endgroup::"

            echo "::group::Phase 5 Hyperopt logs"
            find ai_platform/artifacts/optimization -type f -name 'hyperopt.log' -print -exec sh -c '
              echo "===== $1 ====="
              cat "$1"
            ' _ {} \; 2>/dev/null || true
            echo "::endgroup::"

            echo "::group::Phase 5 generated reports"
            find ai_platform/artifacts/optimization -type f \
              \( -name 'provenance.json' -o -name 'optimization-report.json' -o -name 'selection.json' \) \
              -print -exec sh -c '
                echo "===== $1 ====="
                cat "$1"
              ' _ {} \; 2>/dev/null || true
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Collect Phase 5 failure diagnostics
        if: always() && steps.optimize.outcome == 'failure'
        shell: bash
        env:
          OPTIMIZER_STATUS: ${{ steps.optimize.outputs.status }}
          RESEARCH_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p phase5-diagnostics
          cp phase5-run-error.txt phase5-diagnostics/optimizer-stderr.txt 2>/dev/null || true
          cp phase5-run-path.txt phase5-diagnostics/optimizer-stdout.txt 2>/dev/null || true
          printf 'optimizer_status=%s\nresearch_commit=%s\n' \
            "$OPTIMIZER_STATUS" \
            "$RESEARCH_COMMIT" \
            > phase5-diagnostics/run-metadata.txt

          if [[ -d ai_platform/artifacts/optimization ]]; then
            find ai_platform/artifacts/optimization -type f \
              \( -name 'hyperopt.log' \
                -o -name 'provenance.json' \
                -o -name 'optimization-report.json' \
                -o -name 'selection.json' \
                -o -name 'stability-report.json' \
                -o -name '*.fthypt' \
                -o -name 'last_result.json' \) \
              -exec cp --parents {} phase5-diagnostics/ \;
          fi

      - name: Upload Phase 5 failure diagnostics
        if: always() && steps.optimize.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5-tuning-diagnostics-${{ github.event.pull_request.number }}
          path: phase5-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Emit machine-readable tuning result
        if: steps.optimize.outputs.status == '0' || steps.optimize.outputs.status == '2'
        shell: bash
        run: |
          run_dir="$(tail -n 1 phase5-run-path.txt)"
          test -n "$run_dir"
          test -f "$run_dir/optimization-report.json"
          test -f "$run_dir/selection.json"
          test -f "$run_dir/stability-report.json"
          python - "$run_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          run_dir = Path(sys.argv[1])
          report = json.loads((run_dir / "optimization-report.json").read_text(encoding="utf-8"))
          selection = json.loads((run_dir / "selection.json").read_text(encoding="utf-8"))
          stability = json.loads((run_dir / "stability-report.json").read_text(encoding="utf-8"))

          result = {
              "run_dir": str(run_dir),
              "research_commit": selection["git_commit"],
              "selection_id": selection["selection_id"],
              "status": report["status"],
              "selected_parameters": selection["selected_parameters"],
              "tuning_metrics": selection["tuning_metrics"],
              "stability_passed": selection["stability_passed"],
              "eligible_for_final_validation": selection["eligible_for_final_validation"],
              "promotion_allowed": selection["promotion_allowed"],
              "final_holdout_used": report["final_holdout_used"],
              "training": selection["training"],
              "tuning": selection["tuning"],
              "final_holdout": selection["final_holdout"],
              "stability": stability,
          }
          print("PHASE5_TUNING_RESULT=" + json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
