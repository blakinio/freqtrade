name: AI Platform RL-v2 Execution Preflight

on:
  pull_request:
    branches:
      - develop
    paths:
      - "ai_platform/experimental_model_research/rl-v2-execution-preflight-v1.json"
      - "ai_platform/scripts/rl_v2_execution_preflight.py"
      - "tests/ai_platform/test_rl_v2_execution_preflight.py"
      - "docs/ai_platform/RL_V2_EXECUTION_PREFLIGHT.md"
      - "docs/agents/tasks/FTAI-20260723-rl-v2-execution-preflight.md"
      - ".github/workflows/ai-platform-rl-v2-execution-preflight.yml"
  push:
    branches:
      - develop
    paths:
      - "ai_platform/experimental_model_research/rl-v2-execution-preflight-v1.json"
      - "ai_platform/scripts/rl_v2_execution_preflight.py"
      - "tests/ai_platform/test_rl_v2_execution_preflight.py"
      - "docs/ai_platform/RL_V2_EXECUTION_PREFLIGHT.md"
      - "docs/agents/tasks/FTAI-20260723-rl-v2-execution-preflight.md"
      - ".github/workflows/ai-platform-rl-v2-execution-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rl-v2-execution-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execution-preflight:
    name: Non-result-producing RL-v2 runtime preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Validate active task checkpoint
        run: >-
          python tools/agents/checkpoint.py
          docs/agents/tasks/FTAI-20260723-rl-v2-execution-preflight.md
          --require-checkpoint

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FreqAI, freqai_rl, and validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check --quiet
          -e ".[freqai,freqai_rl]" pytest pytest-xdist pytest-asyncio ruff==0.15.21

      - name: Check preflight script formatting
        run: python -m ruff format --check ai_platform/scripts/rl_v2_execution_preflight.py

      - name: Check preflight test formatting
        run: python -m ruff format --check tests/ai_platform/test_rl_v2_execution_preflight.py

      - name: Test frozen descriptor contract
        run: >-
          python -m pytest -q
          tests/ai_platform/test_rl_v2_execution_preflight.py::test_descriptor_freezes_non_result_producing_scope

      - name: Test descriptor fail-closed drift
        run: >-
          python -m pytest -q
          tests/ai_platform/test_rl_v2_execution_preflight.py::test_descriptor_validation_fails_closed_on_runtime_drift

      - name: Test ephemeral configuration boundaries
        run: >-
          python -m pytest -q tests/ai_platform/test_rl_v2_execution_preflight.py
          -k "ephemeral_config"

      - name: Test source non-execution boundary
        run: >-
          python -m pytest -q tests/ai_platform/test_rl_v2_execution_preflight.py
          -k "preflight_source"

      - name: Run bounded RL-v2 execution preflight
        run: python -m ai_platform.scripts.rl_v2_execution_preflight
