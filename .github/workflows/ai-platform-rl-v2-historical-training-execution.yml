name: AI Platform RL-v2 Historical Training Execution

on:
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - "ai_platform/experimental_model_research/run-requests/rl-v2-historical-training-execution-v1.json"

permissions:
  contents: read

concurrency:
  group: rl-v2-historical-training-execution-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  REQUEST_PATH: ai_platform/experimental_model_research/run-requests/rl-v2-historical-training-execution-v1.json
  CONTRACT_PATH: ai_platform/experimental_model_research/rl-v2-historical-training-execution-contract-v1.json
  TASK_PATH: docs/agents/tasks/FTAI-20260723-rl-v2-historical-training-execution.md
  BASE_CONFIG: ai_platform/configs/rl_v2_training_research.json
  DATA_DIR: user_data/data/kraken
  EVIDENCE_ROOT: rl-v2-historical-training-execution-evidence
  DOWNLOAD_TIMERANGE: 20250801-20260501
  EXECUTION_TIMERANGE: 20260301-20260501

jobs:
  validate-request:
    name: Validate one-shot RL-v2 execution request
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact execution request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate trigger PR scope before runtime or data access
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expected=$'A\tai_platform/experimental_model_research/run-requests/rl-v2-historical-training-execution-v1.json'
          actual="$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")"
          if [[ "$actual" != "$expected" ]]; then
            echo "RL-v2 execution PR must add exactly the canonical run-request file" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

      - name: Validate bounded execution checkpoint
        run: python tools/agents/checkpoint.py "$TASK_PATH" --require-checkpoint

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate canonical request and frozen execution contract
        run: |
          mkdir -p "$EVIDENCE_ROOT/request"
          python -m ai_platform.scripts.rl_v2_historical_training_execution_run_request \
            "$REQUEST_PATH"
          python -m ai_platform.scripts.rl_v2_historical_training_execution_run_request \
            --print-canonical > "$EVIDENCE_ROOT/request/canonical-request.json"
          cp "$REQUEST_PATH" "$EVIDENCE_ROOT/request/run-request.json"
          cp "$CONTRACT_PATH" "$EVIDENCE_ROOT/request/execution-contract.json"

      - name: Upload request validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-historical-training-request-${{ github.event.pull_request.number }}
          path: ${{ env.EVIDENCE_ROOT }}/request/
          if-no-files-found: error
          retention-days: 90

  data:
    name: Prepare pre-OOS Kraken history (${{ matrix.pair }})
    needs: validate-request
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - pair: BTC/USDT
            slug: btc-usdt
          - pair: ETH/USDT
            slug: eth-usdt

    steps:
      - name: Checkout exact execution request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate bounded execution checkpoint
        run: python tools/agents/checkpoint.py "$TASK_PATH" --require-checkpoint

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependency-closed FreqAI RL runtime
        run: python -m pip install --disable-pip-version-check --quiet -e ".[freqai,freqai_rl]"

      - name: Prepare research user directory
        run: freqtrade create-userdir --userdir user_data

      - name: Restore exact pre-OOS pair cache
        id: pre-oos-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DATA_DIR }}
          key: rl-v2-historical-training-pre-oos-v1-${{ runner.os }}-${{ matrix.slug }}-${{ hashFiles('ai_platform/experimental_model_research/rl-v2-historical-training-execution-contract-v1.json', 'ai_platform/configs/rl_v2_training_research.json', 'ai_platform/freqaimodels/DesiredPositionReinforcementLearner.py', 'ai_platform/strategies/AiDesiredPositionRLResearchStrategy.py') }}

      - name: Download only declared pre-OOS Kraken history on cache miss
        if: steps.pre-oos-cache.outputs.cache-hit != 'true'
        run: |
          freqtrade download-data \
            --config "$BASE_CONFIG" \
            --pairs "${{ matrix.pair }}" \
            --timeframes 15m 1h 4h \
            --timerange "$DOWNLOAD_TIMERANGE" \
            --dl-trades \
            --convert

      - name: Verify pair coverage remains pre-OOS
        run: |
          mkdir -p "$EVIDENCE_ROOT/data-${{ matrix.slug }}"
          python -m ai_platform.scripts.rl_v2_historical_training_execution_run_request \
            --verify-data "$DATA_DIR" --pair "${{ matrix.pair }}" \
            > "$EVIDENCE_ROOT/data-${{ matrix.slug }}/coverage.json"

      - name: Save exact pre-OOS pair cache after verification
        if: steps.pre-oos-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DATA_DIR }}
          key: ${{ steps.pre-oos-cache.outputs.cache-primary-key }}

      - name: Upload pair coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-historical-training-data-${{ matrix.slug }}-${{ github.event.pull_request.number }}
          path: ${{ env.EVIDENCE_ROOT }}/data-${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 90

  backtest:
    name: Execute one frozen RL-v2 historical training/backtest
    needs: data
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EXECUTION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_CONFIG: ${{ runner.temp }}/rl-v2-historical-training-execution.json

    steps:
      - name: Checkout exact execution request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate bounded execution checkpoint
        run: python tools/agents/checkpoint.py "$TASK_PATH" --require-checkpoint

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependency-closed FreqAI RL runtime
        run: python -m pip install --disable-pip-version-check --quiet -e ".[freqai,freqai_rl]"

      - name: Prepare research user directory
        run: freqtrade create-userdir --userdir user_data

      - name: Restore exact verified BTC pre-OOS cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DATA_DIR }}
          key: rl-v2-historical-training-pre-oos-v1-${{ runner.os }}-btc-usdt-${{ hashFiles('ai_platform/experimental_model_research/rl-v2-historical-training-execution-contract-v1.json', 'ai_platform/configs/rl_v2_training_research.json', 'ai_platform/freqaimodels/DesiredPositionReinforcementLearner.py', 'ai_platform/strategies/AiDesiredPositionRLResearchStrategy.py') }}
          fail-on-cache-miss: true

      - name: Restore exact verified ETH pre-OOS cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DATA_DIR }}
          key: rl-v2-historical-training-pre-oos-v1-${{ runner.os }}-eth-usdt-${{ hashFiles('ai_platform/experimental_model_research/rl-v2-historical-training-execution-contract-v1.json', 'ai_platform/configs/rl_v2_training_research.json', 'ai_platform/freqaimodels/DesiredPositionReinforcementLearner.py', 'ai_platform/strategies/AiDesiredPositionRLResearchStrategy.py') }}
          fail-on-cache-miss: true

      - name: Re-verify combined pre-OOS market data before execution
        run: |
          mkdir -p "$EVIDENCE_ROOT/run"
          python -m ai_platform.scripts.rl_v2_historical_training_execution_run_request \
            --verify-data "$DATA_DIR" \
            > "$EVIDENCE_ROOT/run/data-coverage.json"

      - name: Re-validate canonical request immediately before execution
        run: >-
          python -m ai_platform.scripts.rl_v2_historical_training_execution_run_request
          "$REQUEST_PATH"

      - name: Materialize frozen temporary execution config
        run: >-
          python -m ai_platform.scripts.rl_v2_historical_training_execution_run_request
          --materialize-config "$RUN_CONFIG"

      - name: Run exactly one frozen historical training/backtest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf user_data/backtest_results
          mkdir -p user_data/backtest_results "$EVIDENCE_ROOT/run"
          set +e
          freqtrade backtesting \
            --config "$RUN_CONFIG" \
            --timerange "$EXECUTION_TIMERANGE" \
            --fee 0.002 \
            --cache none \
            --export trades \
            > "$EVIDENCE_ROOT/run/backtest.log" \
            2> "$EVIDENCE_ROOT/run/backtest-error.log"
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "::group::RL-v2 historical backtest stderr"
            cat "$EVIDENCE_ROOT/run/backtest-error.log" || true
            echo "::endgroup::"
            exit "$status"
          fi

          mapfile -t archives < <(find user_data/backtest_results -maxdepth 1 -type f -name '*.zip' -print | sort)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one Freqtrade backtest archive, found ${#archives[@]}" >&2
            exit 1
          fi
          cp "${archives[0]}" "$EVIDENCE_ROOT/run/raw-backtest.zip"
          cp "$RUN_CONFIG" "$EVIDENCE_ROOT/run/effective-runtime-config.json"

      - name: Record non-OOS evidence provenance
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"]) / "run"
          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text(encoding="utf-8"))
          payload = {
              "schema_version": 1,
              "evidence_id": "rl-v2-historical-development-evidence-v1",
              "request_id": request["request_id"],
              "execution_head_sha": os.environ["EXECUTION_HEAD_SHA"],
              "execution_timerange": os.environ["EXECUTION_TIMERANGE"],
              "semantic_evidence_window": request["semantic_evidence_window"],
              "classification": request["evidence_classification"],
              "strict_oos": False,
              "protected_final_validation": False,
              "automatic_ranking": False,
              "automatic_promotion": False,
              "executed_freqtrade_commands": 1,
              "executed_command": "backtesting",
              "raw_backtest_archive": "raw-backtest.zip",
              "consumed_historical_oos_accessed": False,
              "protected_final_holdout_accessed": False,
          }
          (root / "evidence-metadata.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable RL-v2 historical development evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-historical-training-execution-${{ github.event.pull_request.number }}
          path: ${{ env.EVIDENCE_ROOT }}/run/
          if-no-files-found: error
          retention-days: 90
