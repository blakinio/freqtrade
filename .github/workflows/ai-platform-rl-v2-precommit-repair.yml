name: AI Platform RL-v2 Pre-commit Repair

on:
  pull_request:
    types: [synchronize]
    branches:
      - develop
    paths:
      - ".github/workflows/ai-platform-rl-v2-precommit-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/rl-v2-roi-lifecycle-paired-attribution-infrastructure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: b95a3cbbe9f4bfb1e702591d3ff674a96c534eeb
      REPAIR_WORKFLOW: .github/workflows/ai-platform-rl-v2-precommit-repair.yml
      TARGET_FILE: ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact guarded parent
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD^)"
          if [[ "$actual" != "$EXPECTED_PARENT" ]]; then
            echo "Expected guarded parent $EXPECTED_PARENT, got $actual" >&2
            exit 1
          fi

      - name: Apply bounded mypy no-redef repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["TARGET_FILE"])
          text = path.read_text(encoding="utf-8")
          marker = "    if isinstance(value, list):\n"
          prefix, separator, suffix = text.partition(marker)
          if not separator or marker in suffix:
              raise SystemExit("Expected exactly one _collect_keys list branch marker")
          old = (
              "        keys: set[str] = set()\n"
              "        for child in value:\n"
              "            keys.update(_collect_keys(child))\n"
              "        return keys\n"
          )
          new = (
              "        list_keys: set[str] = set()\n"
              "        for child in value:\n"
              "            list_keys.update(_collect_keys(child))\n"
              "        return list_keys\n"
          )
          if suffix.count(old) != 1:
              raise SystemExit("Expected exactly one bounded list accumulator fragment")
          repaired = prefix + separator + suffix.replace(old, new, 1)
          path.write_text(repaired, encoding="utf-8")
          PY
          rm "$REPAIR_WORKFLOW"

      - name: Install exact pre-commit runner
        run: python -m pip install --disable-pip-version-check --quiet pre-commit

      - name: Validate complete repository hooks
        run: pre-commit run --all-files --show-diff-on-failure --verbose

      - name: Verify bounded staged scope
        shell: bash
        run: |
          set -euo pipefail
          git add "$TARGET_FILE" "$REPAIR_WORKFLOW"
          actual="$(git diff --cached --name-status | sort)"
          expected="$(printf 'D\t%s\nM\t%s' "$REPAIR_WORKFLOW" "$TARGET_FILE" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected repair scope.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

      - name: Commit and push guarded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ai-platform): resolve paired attribution mypy redeclaration"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
