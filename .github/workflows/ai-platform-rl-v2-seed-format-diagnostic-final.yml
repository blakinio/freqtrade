name: AI Platform RL-v2 Seed Format Apply Final

on:
  pull_request:
    branches:
      - develop
    paths:
      - "ai_platform/scripts/rl_v2_lifecycle_seed_robustness_evidence.py"
      - ".github/workflows/ai-platform-rl-v2-seed-format-diagnostic-final.yml"

permissions:
  contents: write

concurrency:
  group: rl-v2-seed-format-apply-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply exact formatting and self-remove
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/rl-v2-lifecycle-seed-robustness-infrastructure'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/rl-v2-lifecycle-seed-robustness-infrastructure
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Format and verify evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet ruff==0.15.21
          ruff format --config pyproject.toml \
            ai_platform/scripts/rl_v2_lifecycle_seed_robustness_evidence.py
          ruff check --config pyproject.toml \
            ai_platform/scripts/rl_v2_lifecycle_seed_robustness_evidence.py
          ruff format --check --config pyproject.toml \
            ai_platform/scripts/rl_v2_lifecycle_seed_robustness_evidence.py
      - name: Remove temporary workflow and verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ai-platform-rl-v2-seed-format-diagnostic-final.yml
          actual="$(git diff --name-only | sort)"
          expected=$'.github/workflows/ai-platform-rl-v2-seed-format-diagnostic-final.yml\nai_platform/scripts/rl_v2_lifecycle_seed_robustness_evidence.py'
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected formatting diff:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
      - name: Commit exact formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/scripts/rl_v2_lifecycle_seed_robustness_evidence.py \
            .github/workflows/ai-platform-rl-v2-seed-format-diagnostic-final.yml
          git commit -m "style(ai-platform): format RL-v2 seed robustness evidence"
          git push origin HEAD:feat/rl-v2-lifecycle-seed-robustness-infrastructure
