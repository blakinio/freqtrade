name: AI Platform RL-v2 Seed Format Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - "ai_platform/scripts/rl_v2_lifecycle_seed_robustness_evidence.py"
      - "ai_platform/scripts/rl_v2_lifecycle_seed_robustness_run_request.py"
      - "tests/ai_platform/test_rl_v2_lifecycle_seed_robustness.py"
      - ".github/workflows/ai-platform-rl-v2-seed-format-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: rl-v2-seed-format-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Generate exact Ruff format candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Generate formatted candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet ruff==0.15.21
          mkdir -p fixed/ai_platform/scripts fixed/tests/ai_platform
          cp ai_platform/scripts/rl_v2_lifecycle_seed_robustness_evidence.py \
            fixed/ai_platform/scripts/
          cp ai_platform/scripts/rl_v2_lifecycle_seed_robustness_run_request.py \
            fixed/ai_platform/scripts/
          cp tests/ai_platform/test_rl_v2_lifecycle_seed_robustness.py \
            fixed/tests/ai_platform/
          ruff format --config pyproject.toml \
            fixed/ai_platform/scripts/rl_v2_lifecycle_seed_robustness_evidence.py \
            fixed/ai_platform/scripts/rl_v2_lifecycle_seed_robustness_run_request.py \
            fixed/tests/ai_platform/test_rl_v2_lifecycle_seed_robustness.py
          ruff check --config pyproject.toml \
            fixed/ai_platform/scripts/rl_v2_lifecycle_seed_robustness_evidence.py \
            fixed/ai_platform/scripts/rl_v2_lifecycle_seed_robustness_run_request.py \
            fixed/tests/ai_platform/test_rl_v2_lifecycle_seed_robustness.py
          ruff format --check --config pyproject.toml \
            fixed/ai_platform/scripts/rl_v2_lifecycle_seed_robustness_evidence.py \
            fixed/ai_platform/scripts/rl_v2_lifecycle_seed_robustness_run_request.py \
            fixed/tests/ai_platform/test_rl_v2_lifecycle_seed_robustness.py
      - name: Upload formatted candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-seed-format-fixed-${{ github.event.pull_request.number }}
          path: fixed/
          if-no-files-found: error
          retention-days: 1
