name: AI Platform RL-v2 Seed Ruff Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - "ai_platform/scripts/**"
      - "tests/ai_platform/test_rl_v2_lifecycle_seed_robustness.py"
      - ".github/workflows/ai-platform-rl-v2-seed-ruff-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: rl-v2-seed-ruff-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture Ruff diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Capture Ruff output
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet ruff==0.15.21
          set +e
          ruff check ai_platform tests/ai_platform > ruff-check.txt 2>&1
          check_status=$?
          ruff format --check ai_platform tests/ai_platform > ruff-format.txt 2>&1
          format_status=$?
          set -e
          printf 'ruff_check_status=%s\nruff_format_status=%s\n' \
            "$check_status" "$format_status" > ruff-status.txt
      - name: Upload Ruff diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-seed-ruff-diagnostic-${{ github.event.pull_request.number }}
          path: |
            ruff-check.txt
            ruff-format.txt
            ruff-status.txt
          if-no-files-found: error
          retention-days: 7
