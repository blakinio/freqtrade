name: AI Platform RL-v2 Seed Tree Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/ai-platform-rl-v2-seed-tree-diagnostic.yml"

permissions:
  contents: read

jobs:
  tree:
    name: Capture exact Git tree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Capture tree SHA
        run: git rev-parse 'HEAD^{tree}' > base-tree.txt
      - name: Upload tree SHA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-seed-tree-${{ github.event.pull_request.number }}
          path: base-tree.txt
          if-no-files-found: error
          retention-days: 1
