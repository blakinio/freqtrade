name: AI Platform TradingView Drawdown Format Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
    paths:
      - "ai_platform/scripts/tradingview_futures_historical_benchmark.py"
      - "tests/ai_platform/test_tradingview_futures_historical_benchmark.py"
      - ".github/workflows/ai-platform-tradingview-drawdown-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Capture canonical Ruff formatter diff
        run: |
          python -m pip install --disable-pip-version-check --quiet ruff==0.15.21
          ruff format \
            ai_platform/scripts/tradingview_futures_historical_benchmark.py \
            tests/ai_platform/test_tradingview_futures_historical_benchmark.py
          git diff -- \
            ai_platform/scripts/tradingview_futures_historical_benchmark.py \
            tests/ai_platform/test_tradingview_futures_historical_benchmark.py \
            > ruff-format.diff

      - name: Upload formatter diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tradingview-drawdown-ruff-format-${{ github.event.pull_request.number }}
          path: ruff-format.diff
          if-no-files-found: error
          retention-days: 7
