name: AI Platform TradingView Futures Historical Benchmark Archive Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
    paths:
      - ".github/workflows/ai-platform-tradingview-futures-historical-benchmark.yml"
      - "ai_platform/research/tradingview/futures-historical-benchmark-v1.json"
      - "ai_platform/scripts/tradingview_futures_historical_benchmark.py"
      - "tests/ai_platform/test_tradingview_futures_historical_benchmark.py"
      - "docs/ai_platform/TRADINGVIEW_FUTURES_HISTORICAL_BENCHMARK.md"
      - "docs/agents/tasks/FTAI-20260722-tradingview-futures-historical-benchmark.md"
      - "ai_platform/research/tradingview/run-requests/futures-historical-benchmark-v1.json"

permissions:
  contents: read

concurrency:
  group: tradingview-futures-historical-benchmark-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  REQUEST_PATH: ai_platform/research/tradingview/run-requests/futures-historical-benchmark-v1.json
  CONTRACT_PATH: ai_platform/research/tradingview/futures-historical-benchmark-v1.json
  TASK_PATH: docs/agents/tasks/FTAI-20260722-tradingview-futures-historical-benchmark.md
  EVIDENCE_ROOT: tradingview-futures-historical-benchmark-archive-evidence
  PYTHONPATH: ${{ github.workspace }}

jobs:
  archive-guard:
    name: Validate archived benchmark contract and immutable one-shot request
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate compact benchmark checkpoint
        run: python tools/agents/checkpoint.py "$TASK_PATH" --require-checkpoint

      - name: Validate frozen benchmark contract
        run: |
          mkdir -p "$EVIDENCE_ROOT"
          python -m ai_platform.scripts.tradingview_futures_historical_benchmark contract \
            > "$EVIDENCE_ROOT/contract-report.json"
          cp "$CONTRACT_PATH" "$EVIDENCE_ROOT/execution-contract.json"

      - name: Prove consumed one-shot request is immutable
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE_SHA:$REQUEST_PATH" 2>/dev/null; then
            if [[ ! -f "$REQUEST_PATH" ]]; then
              echo "Consumed benchmark run-request cannot be deleted" >&2
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$REQUEST_PATH"; then
              echo "Consumed benchmark run-request must remain immutable" >&2
              exit 1
            fi
            python -m ai_platform.scripts.tradingview_futures_historical_benchmark \
              validate-request "$REQUEST_PATH" \
              > "$EVIDENCE_ROOT/validated-run-request.json"
            cp "$REQUEST_PATH" "$EVIDENCE_ROOT/run-request.json"
            printf '%s\n' 'consumed_immutable' > "$EVIDENCE_ROOT/request-state.txt"
            exit 0
          fi

          if [[ -f "$REQUEST_PATH" ]]; then
            echo "Archived benchmark cannot accept a new one-shot execution request" >&2
            exit 1
          fi
          printf '%s\n' 'absent' > "$EVIDENCE_ROOT/request-state.txt"

      - name: Upload archive guard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tradingview-futures-historical-benchmark-archive-${{ github.event.pull_request.number }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 90
