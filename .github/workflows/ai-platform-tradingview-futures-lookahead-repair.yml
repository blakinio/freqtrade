name: AI Platform TradingView Futures Lookahead Repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
    paths:
      - ".github/workflows/ai-platform-tradingview-futures-lookahead-repair.yml"
      - "ai_platform/research/tradingview/futures-historical-lookahead-repair-v1.json"
      - "docs/agents/tasks/FTAI-20260722-tradingview-futures-lookahead-repair.md"
      - "ai_platform/research/tradingview/run-requests/futures-historical-lookahead-repair-v1.json"

permissions:
  contents: read

concurrency:
  group: tradingview-futures-lookahead-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  REPAIR_CONTRACT_PATH: ai_platform/research/tradingview/futures-historical-lookahead-repair-v1.json
  REQUEST_PATH: ai_platform/research/tradingview/run-requests/futures-historical-lookahead-repair-v1.json
  TASK_PATH: docs/agents/tasks/FTAI-20260722-tradingview-futures-lookahead-repair.md
  DATA_DIR: user_data/data/krakenfutures
  EVIDENCE_ROOT: tradingview-futures-lookahead-repair-evidence
  SYMBOLS_PATH: tradingview-futures-lookahead-repair-evidence/resolved-markets.json
  MATERIALIZED_CONFIG: tradingview-futures-lookahead-repair-evidence/research-config.json
  ANALYSIS_CONFIG: tradingview-futures-lookahead-repair-evidence/lookahead-compatible-config.json
  PYTHONPATH: ${{ github.workspace }}

jobs:
  contract:
    name: Validate lookahead repair contract and optional one-shot request
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      request_present: ${{ steps.request.outputs.present }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate active bounded checkpoint
        run: python tools/agents/checkpoint.py "$TASK_PATH" --require-checkpoint

      - name: Re-validate frozen source benchmark contract
        run: |
          python -m ai_platform.scripts.tradingview_futures_historical_benchmark contract \
            > "$EVIDENCE_ROOT-source-benchmark-contract.json"

      - name: Validate frozen repair contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("ai_platform/research/tradingview/futures-historical-lookahead-repair-v1.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema_version": 1,
              "repair_id": "tradingview-futures-historical-lookahead-repair-v1",
              "source_benchmark_id": "tradingview-futures-historical-benchmark-v1",
              "source_execution_head_sha": "9c03faedea870cea78b46672545fb4a4ba371e6f",
              "source_workflow_run_id": 29947929886,
              "source_artifact_id": 8541078835,
              "source_artifact_digest": "sha256:9cb7c603d6c1f612a783907aa6ca112c7f946efff80abdd38ad283bed1ad822c",
              "candidates": [
                  "TVDonchianBreakoutStrategy",
                  "TVSupertrendStrategy",
                  "TVBollingerMeanReversionStrategy",
              ],
              "exchange": "krakenfutures",
              "trading_mode": "futures",
              "margin_mode": "isolated",
              "stake_currency": "USD",
              "pairs": ["BTC/USD:USD", "ETH/USD:USD"],
              "timeframe": "15m",
              "download_timerange": "20260201-20260701",
              "analysis_timerange": "20260301-20260701",
              "fee": 0.002,
              "analysis_scope": "lookahead_only",
              "backtest_rerun_allowed": False,
              "ranking_change_allowed": False,
              "retuning_allowed": False,
              "strategy_mutation_allowed": False,
              "automatic_promotion_allowed": False,
              "profitability_claim_allowed": False,
              "superiority_claim_allowed": False,
              "protected_final_holdout": "20260801-20260930",
              "protected_final_holdout_used": False,
              "compatibility_override": {
                  "path": "entry_pricing.price_side",
                  "from": "same",
                  "to": "other",
                  "reason": "Freqtrade lookahead-analysis forces market entry orders, which require entry_pricing.price_side=other; the frozen benchmark config remains unchanged for backtest provenance.",
              },
          }
          if payload != expected:
              raise SystemExit("Lookahead repair contract drifted from the prospectively frozen definition")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Validate optional one-shot repair request and exact trigger scope
        id: request
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! -f "$REQUEST_PATH" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git cat-file -e "$BASE_SHA:$REQUEST_PATH" 2>/dev/null; then
            if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$REQUEST_PATH"; then
              echo "Existing lookahead repair request must remain immutable" >&2
              exit 1
            fi
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expected=$'A\t'"$REQUEST_PATH"
          actual="$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Lookahead repair execution PR must add exactly the canonical run-request file" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("ai_platform/research/tradingview/run-requests/futures-historical-lookahead-repair-v1.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema_version": 1,
              "request_id": "tradingview-futures-historical-lookahead-repair-v1-one-shot",
              "repair_id": "tradingview-futures-historical-lookahead-repair-v1",
              "requested_action": "execute_one_shot_lookahead_repair",
              "source_benchmark_execution_head_sha": "9c03faedea870cea78b46672545fb4a4ba371e6f",
              "acknowledgements": {
                  "backtest_rerun_allowed": False,
                  "ranking_change_allowed": False,
                  "protected_final_holdout_used": False,
                  "retuning_allowed": False,
                  "strategy_mutation_allowed": False,
                  "automatic_promotion_allowed": False,
                  "profitability_claim_allowed": False,
                  "superiority_claim_allowed": False,
              },
          }
          if payload != expected:
              raise SystemExit("Lookahead repair request is not canonical")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          echo "present=true" >> "$GITHUB_OUTPUT"

  execute:
    name: Execute one-shot lookahead evidence repair
    needs: contract
    if: needs.contract.outputs.request_present == 'true' && github.event.action == 'opened'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      REPAIR_EXECUTION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact repair request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate active bounded checkpoint
        run: python tools/agents/checkpoint.py "$TASK_PATH" --require-checkpoint

      - name: Install repository runtime
        run: python -m pip install --disable-pip-version-check --quiet -e .

      - name: Prepare repair evidence and bind source identities
        run: |
          mkdir -p "$EVIDENCE_ROOT/request"
          python -m ai_platform.scripts.tradingview_futures_historical_benchmark contract \
            > "$EVIDENCE_ROOT/request/source-benchmark-contract.json"
          cp "$REPAIR_CONTRACT_PATH" "$EVIDENCE_ROOT/request/lookahead-repair-contract.json"
          cp "$REQUEST_PATH" "$EVIDENCE_ROOT/request/run-request.json"
          printf '%s\n' "$REPAIR_EXECUTION_HEAD_SHA" > "$EVIDENCE_ROOT/request/repair-execution-head.txt"
          printf '%s\n' '9c03faedea870cea78b46672545fb4a4ba371e6f' > "$EVIDENCE_ROOT/request/source-benchmark-execution-head.txt"

      - name: Prepare research user directory
        run: freqtrade create-userdir --userdir user_data

      - name: Re-discover and bind exact Kraken Futures markets
        run: |
          python -m ai_platform.scripts.tradingview_futures_historical_preflight \
            discover-markets --output "$SYMBOLS_PATH" \
            > "$EVIDENCE_ROOT/discovery-report.json"
          python -m ai_platform.scripts.tradingview_futures_historical_benchmark \
            validate-markets "$SYMBOLS_PATH" \
            > "$EVIDENCE_ROOT/validated-markets.json"

      - name: Materialize and validate frozen benchmark config
        run: |
          python -m ai_platform.scripts.tradingview_futures_historical_preflight \
            materialize-config --symbols "$SYMBOLS_PATH" --output "$MATERIALIZED_CONFIG" \
            > "$EVIDENCE_ROOT/materialized-config-report.json"
          python -m ai_platform.scripts.tradingview_futures_historical_benchmark \
            validate-config "$MATERIALIZED_CONFIG" \
            > "$EVIDENCE_ROOT/validated-config.json"

      - name: Derive and prove the single lookahead compatibility override
        run: |
          python - <<'PY'
          import copy
          import json
          import os
          from pathlib import Path

          source_path = Path(os.environ["MATERIALIZED_CONFIG"])
          output_path = Path(os.environ["ANALYSIS_CONFIG"])
          original = json.loads(source_path.read_text(encoding="utf-8"))
          if original.get("entry_pricing", {}).get("price_side") != "same":
              raise SystemExit("Frozen benchmark config no longer has entry_pricing.price_side=same")

          repaired = copy.deepcopy(original)
          repaired["entry_pricing"]["price_side"] = "other"

          def differences(left, right, prefix=""):
              if isinstance(left, dict) and isinstance(right, dict):
                  keys = sorted(set(left) | set(right))
                  result = []
                  for key in keys:
                      path = f"{prefix}.{key}" if prefix else key
                      if key not in left or key not in right:
                          result.append((path, left.get(key), right.get(key)))
                      else:
                          result.extend(differences(left[key], right[key], path))
                  return result
              if left != right:
                  return [(prefix, left, right)]
              return []

          delta = differences(original, repaired)
          expected = [("entry_pricing.price_side", "same", "other")]
          if delta != expected:
              raise SystemExit(f"Unexpected lookahead compatibility delta: {delta!r}")

          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(json.dumps(repaired, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (output_path.parent / "config-delta.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "source_config": str(source_path),
                      "analysis_config": str(output_path),
                      "differences": [
                          {"path": "entry_pricing.price_side", "from": "same", "to": "other"}
                      ],
                      "backtest_config_changed": False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Prove canonical strategies load with lookahead-compatible config
        run: |
          freqtrade list-strategies \
            --config "$ANALYSIS_CONFIG" \
            --strategy-path "$GITHUB_WORKSPACE/ai_platform/strategies" \
            -1 \
            > "$EVIDENCE_ROOT/strategy-listing.txt"
          grep -F "TVDonchianBreakoutStrategy" "$EVIDENCE_ROOT/strategy-listing.txt"
          grep -F "TVSupertrendStrategy" "$EVIDENCE_ROOT/strategy-listing.txt"
          grep -F "TVBollingerMeanReversionStrategy" "$EVIDENCE_ROOT/strategy-listing.txt"

      - name: Download bounded 15m futures history
        run: |
          freqtrade download-data \
            --config "$MATERIALIZED_CONFIG" \
            --datadir "$DATA_DIR" \
            --pairs "BTC/USD:USD" "ETH/USD:USD" \
            --timeframes 15m \
            --timerange 20260201-20260701

      - name: Verify data coverage immediately before repair analysis
        run: |
          python -m ai_platform.scripts.tradingview_futures_historical_preflight \
            verify-data --symbols "$SYMBOLS_PATH" --datadir "$DATA_DIR" \
            > "$EVIDENCE_ROOT/data-coverage.json"

      - name: Execute lookahead repair for all frozen candidates
        shell: bash
        run: |
          set -euo pipefail
          strategies=(
            "TVDonchianBreakoutStrategy"
            "TVSupertrendStrategy"
            "TVBollingerMeanReversionStrategy"
          )
          slugs=("donchian" "supertrend" "bollinger")

          for index in "${!strategies[@]}"; do
            strategy="${strategies[$index]}"
            slug="${slugs[$index]}"
            evidence_dir="$EVIDENCE_ROOT/$slug"
            mkdir -p "$evidence_dir"

            cat > "$evidence_dir/lookahead-command.txt" <<EOF
          freqtrade lookahead-analysis --strategy $strategy --strategy-path $GITHUB_WORKSPACE/ai_platform/strategies --config $ANALYSIS_CONFIG --datadir $DATA_DIR --timerange 20260301-20260701 --fee 0.002 --minimum-trade-amount 1 --targeted-trade-amount 20 --lookahead-analysis-exportfilename $PWD/$evidence_dir/lookahead.csv
          EOF

            set +e
            freqtrade lookahead-analysis \
              --strategy "$strategy" \
              --strategy-path "$GITHUB_WORKSPACE/ai_platform/strategies" \
              --config "$ANALYSIS_CONFIG" \
              --datadir "$DATA_DIR" \
              --timerange 20260301-20260701 \
              --fee 0.002 \
              --minimum-trade-amount 1 \
              --targeted-trade-amount 20 \
              --lookahead-analysis-exportfilename "$PWD/$evidence_dir/lookahead.csv" \
              > "$evidence_dir/lookahead.log" 2>&1
            lookahead_status=$?
            set -e

            python - "$strategy" "$evidence_dir" "$lookahead_status" <<'PY'
          import csv
          import json
          import sys
          from pathlib import Path

          strategy = sys.argv[1]
          evidence_dir = Path(sys.argv[2])
          command_exit = int(sys.argv[3])
          csv_path = evidence_dir / "lookahead.csv"
          row_found = False
          bias_value = None
          raw_bias = None

          if csv_path.is_file():
              with csv_path.open(newline="", encoding="utf-8-sig") as handle:
                  for row in csv.DictReader(handle):
                      if row.get("strategy") == strategy:
                          row_found = True
                          raw_bias = str(row.get("has_bias", "")).strip()
                          normalized = raw_bias.lower()
                          if normalized in {"yes", "true", "1"}:
                              bias_value = True
                          elif normalized in {"no", "false", "0"}:
                              bias_value = False
                          break

          complete = command_exit == 0 and row_found and bias_value is not None
          status = "incomplete"
          if complete:
              status = "fail" if bias_value else "pass"

          payload = {
              "schema_version": 1,
              "strategy": strategy,
              "source_benchmark_execution_head_sha": "9c03faedea870cea78b46672545fb4a4ba371e6f",
              "command_exit_code": command_exit,
              "csv_present": csv_path.is_file(),
              "strategy_row_found": row_found,
              "raw_has_bias": raw_bias,
              "bias_detected": bias_value,
              "status": status,
              "automatic_validation_claim_allowed": False,
              "promotion_allowed": False,
          }
          (evidence_dir / "lookahead-repair-status.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          done

      - name: Assemble repair evidence and fail closed on incomplete output
        run: |
          python - "$EVIDENCE_ROOT" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          candidates = [
              ("TVDonchianBreakoutStrategy", "donchian"),
              ("TVSupertrendStrategy", "supertrend"),
              ("TVBollingerMeanReversionStrategy", "bollinger"),
          ]
          results = []
          incomplete = []
          for strategy, slug in candidates:
              payload = json.loads(
                  (root / slug / "lookahead-repair-status.json").read_text(encoding="utf-8")
              )
              if payload["strategy"] != strategy:
                  raise SystemExit("Lookahead repair strategy identity drifted")
              results.append(payload)
              if payload["status"] == "incomplete":
                  incomplete.append(strategy)

          summary = {
              "schema_version": 1,
              "repair_id": "tradingview-futures-historical-lookahead-repair-v1",
              "source_benchmark_id": "tradingview-futures-historical-benchmark-v1",
              "source_benchmark_execution_head_sha": "9c03faedea870cea78b46672545fb4a4ba371e6f",
              "repair_execution_head_sha": (
                  root / "request" / "repair-execution-head.txt"
              ).read_text(encoding="utf-8").strip(),
              "backtest_rerun": False,
              "ranking_changed": False,
              "retuning_allowed": False,
              "promotion_allowed": False,
              "profitability_claim_allowed": False,
              "superiority_claim_allowed": False,
              "protected_final_holdout_used": False,
              "compatibility_delta": [
                  {"path": "entry_pricing.price_side", "from": "same", "to": "other"}
              ],
              "candidates": results,
              "complete": not incomplete,
          }
          (root / "lookahead-repair-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if incomplete:
              raise SystemExit(
                  "Lookahead repair incomplete for: " + ", ".join(incomplete)
              )
          PY

      - name: Upload immutable lookahead repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tradingview-futures-lookahead-repair-${{ github.event.pull_request.number }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 90
