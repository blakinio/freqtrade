name: AI Platform TradingView Futures Preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
    paths:
      - ".github/workflows/ai-platform-tradingview-futures-preflight.yml"
      - "ai_platform/configs/tradingview-futures-research.example.json"
      - "ai_platform/research/tradingview/futures-historical-preflight-v1.json"
      - "ai_platform/scripts/tradingview_futures_historical_preflight.py"
      - "ai_platform/strategies/TradingViewResearchStrategies.py"
      - "tests/ai_platform/test_tradingview_futures_historical_preflight.py"
      - "docs/agents/tasks/FTAI-20260722-tradingview-futures-historical-preflight.md"

permissions:
  contents: read

concurrency:
  group: tradingview-futures-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TASK_PATH: docs/agents/tasks/FTAI-20260722-tradingview-futures-historical-preflight.md
  DATA_DIR: user_data/data/krakenfutures
  EVIDENCE_DIR: tradingview-futures-preflight-evidence
  SYMBOLS_PATH: tradingview-futures-preflight-evidence/resolved-markets.json
  MATERIALIZED_CONFIG: tradingview-futures-preflight-evidence/research-config.json

jobs:
  contract:
    name: Validate frozen preflight contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate active bounded checkpoint
        run: python tools/agents/checkpoint.py "$TASK_PATH" --require-checkpoint

      - name: Validate contract without network or market data
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python -m ai_platform.scripts.tradingview_futures_historical_preflight contract \
            > "$EVIDENCE_DIR/contract-report.json"

      - name: Upload static contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tradingview-futures-contract-${{ github.event.pull_request.number }}
          path: ${{ env.EVIDENCE_DIR }}/contract-report.json
          if-no-files-found: error
          retention-days: 90

  data-preflight:
    name: Discover Kraken Futures markets and verify historical coverage
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate active bounded checkpoint
        run: python tools/agents/checkpoint.py "$TASK_PATH" --require-checkpoint

      - name: Install repository runtime
        run: python -m pip install --disable-pip-version-check --quiet -e .

      - name: Prepare research user directory
        run: freqtrade create-userdir --userdir user_data

      - name: Prove canonical strategies load without executing them
        run: |
          mkdir -p "$EVIDENCE_DIR"
          freqtrade list-strategies --strategy-path ai_platform/strategies -1 \
            > "$EVIDENCE_DIR/strategy-listing.txt"
          grep -F "TVDonchianBreakoutStrategy" "$EVIDENCE_DIR/strategy-listing.txt"
          grep -F "TVSupertrendStrategy" "$EVIDENCE_DIR/strategy-listing.txt"
          grep -F "TVBollingerMeanReversionStrategy" "$EVIDENCE_DIR/strategy-listing.txt"

      - name: Discover exact active USD-settled perpetual symbols
        run: |
          python -m ai_platform.scripts.tradingview_futures_historical_preflight \
            discover-markets --output "$SYMBOLS_PATH" \
            > "$EVIDENCE_DIR/discovery-report.json"

      - name: Materialize dry-run futures config from discovered symbols
        run: |
          python -m ai_platform.scripts.tradingview_futures_historical_preflight \
            materialize-config --symbols "$SYMBOLS_PATH" --output "$MATERIALIZED_CONFIG" \
            > "$EVIDENCE_DIR/materialized-config-report.json"

      - name: Download bounded 15m Kraken Futures history only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pairs < <(python - "$SYMBOLS_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for pair in payload["pairs"]:
              print(pair)
          PY
          )
          if [[ "${#pairs[@]}" -ne 2 ]]; then
            echo "Expected exactly two runtime-discovered futures pairs" >&2
            exit 1
          fi
          freqtrade download-data \
            --config "$MATERIALIZED_CONFIG" \
            --datadir "$DATA_DIR" \
            --pairs "${pairs[@]}" \
            --timeframes 15m \
            --timerange 20260201-20260701

      - name: Verify warmup and complete historical research coverage
        run: |
          python -m ai_platform.scripts.tradingview_futures_historical_preflight \
            verify-data --symbols "$SYMBOLS_PATH" --datadir "$DATA_DIR" \
            > "$EVIDENCE_DIR/coverage.json"

      - name: Upload data-only preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tradingview-futures-preflight-${{ github.event.pull_request.number }}
          path: |
            ${{ env.EVIDENCE_DIR }}/strategy-listing.txt
            ${{ env.EVIDENCE_DIR }}/discovery-report.json
            ${{ env.EVIDENCE_DIR }}/resolved-markets.json
            ${{ env.EVIDENCE_DIR }}/research-config.json
            ${{ env.EVIDENCE_DIR }}/materialized-config-report.json
            ${{ env.EVIDENCE_DIR }}/coverage.json
          if-no-files-found: error
          retention-days: 90
