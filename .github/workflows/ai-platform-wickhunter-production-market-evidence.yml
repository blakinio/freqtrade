name: AI Platform WickHunter Production Market Evidence

"on":
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - "ai_platform/wickhunter/run-requests/wickhunter-production-market-evidence-20260730-v1.json"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: wickhunter-production-market-evidence-v1
  cancel-in-progress: false

env:
  REQUEST_PATH: ai_platform/wickhunter/run-requests/wickhunter-production-market-evidence-20260730-v1.json
  STATE_DIR: /var/lib/freqtrade-staging-state
  DURABLE_ROOT: /var/lib/freqtrade-staging-state/wickhunter-production-market-evidence
  PERSISTED_REQUEST_PATH: /var/lib/freqtrade-staging-state/wickhunter-production-market-evidence/request.json
  HOST_DURABLE_ROOT: /volume1/docker/freqtrade-staging-state/wickhunter-production-market-evidence
  HOST_PERSISTED_REQUEST_PATH: /volume1/docker/freqtrade-staging-state/wickhunter-production-market-evidence/request.json
  COMPOSE_FILE: deploy/synology/wickhunter-market-evidence/compose.yaml

jobs:
  initialize:
    name: Deploy persistent WickHunter market evidence collector
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 10

    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact-one-file trigger scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expected=$'A\tai_platform/wickhunter/run-requests/wickhunter-production-market-evidence-20260730-v1.json'
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          actual="$(git diff --name-status "$merge_base" "$HEAD_SHA")"
          if [[ "$actual" != "$expected" ]]; then
            echo "WickHunter market evidence trigger must add exactly the canonical request" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

      - name: Validate approved runner, Docker and durable storage
        shell: bash
        env:
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME_VALUE" == "freqtrade-synology-staging" ]]
          [[ "$RUNNER_OS_VALUE" == "Linux" ]]
          [[ "$RUNNER_ARCH_VALUE" == "X64" || "$RUNNER_ARCH_VALUE" == "ARM64" ]]
          [[ -d "$STATE_DIR" && -w "$STATE_DIR" ]]
          mkdir -p "$DURABLE_ROOT"
          [[ -d "$DURABLE_ROOT" && -w "$DURABLE_ROOT" ]]
          docker version >/dev/null
          docker compose version >/dev/null

      - name: Refuse trading credentials and proxy routing
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            BINANCE_API_KEY BINANCE_API_SECRET BINANCE_SECRET_KEY \
            BYBIT_API_KEY BYBIT_API_SECRET \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            EXCHANGE_API_KEY EXCHANGE_API_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET \
            HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          do
            if [[ -n "${!name:-}" ]]; then
              echo "Forbidden credential or proxy environment is present: $name" >&2
              exit 1
            fi
          done

      - name: Persist immutable request and initialize capture
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -e "$PERSISTED_REQUEST_PATH" || -L "$PERSISTED_REQUEST_PATH" ]]; then
            [[ -f "$PERSISTED_REQUEST_PATH" && ! -L "$PERSISTED_REQUEST_PATH" ]]
            cmp --silent "$REQUEST_PATH" "$PERSISTED_REQUEST_PATH"
          else
            temporary="$DURABLE_ROOT/.request.json.${GITHUB_RUN_ID}.tmp"
            install -m 0444 "$REQUEST_PATH" "$temporary"
            mv "$temporary" "$PERSISTED_REQUEST_PATH"
          fi
          if [[ ! -f "$DURABLE_ROOT/active-wickhunter-production-market-evidence-v1.json" ]]; then
            PYTHONPATH=. python3 -m ai_platform.wickhunter.production_market_evidence_service \
              init \
              --request "$PERSISTED_REQUEST_PATH" \
              --durable-root "$DURABLE_ROOT" \
              --collector-commit "$HEAD_SHA"
          else
            PYTHONPATH=. python3 - <<'PY'
          from pathlib import Path
          from ai_platform.wickhunter import production_market_evidence as core

          durable_root = Path("/var/lib/freqtrade-staging-state/wickhunter-production-market-evidence")
          request = core.load_capture_request(durable_root / "request.json")
          run_root, state = core._load_active_run(durable_root)
          if state.get("status") != "active" or state.get("run_id") != request["run_id"]:
              raise SystemExit("existing active capture identity is invalid")
          if run_root != durable_root / str(request["run_id"]):
              raise SystemExit("existing active capture root is invalid")
          print("Existing initialized capture validated; deployment will resume it.")
          PY
          fi

      - name: Deploy collector and release runner
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export COLLECTOR_COMMIT="$HEAD_SHA"
          export IMAGE_TAG="${HEAD_SHA:0:12}"
          export MARKET_EVIDENCE_REQUEST_FILE="$HOST_PERSISTED_REQUEST_PATH"
          export MARKET_EVIDENCE_STATE_DIR="$HOST_DURABLE_ROOT"
          docker compose -f "$COMPOSE_FILE" config --quiet
          docker compose -f "$COMPOSE_FILE" up -d --build --remove-orphans collector

      - name: Verify persistent collector health
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 24); do
            if [[ "$(docker inspect --format '{{.State.Running}}' wickhunter-market-evidence 2>/dev/null || true)" == "true" ]] \
              && [[ -f "$DURABLE_ROOT/collector-health.json" ]]; then
              if python3 - "$DURABLE_ROOT/collector-health.json" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("healthy") is not True:
              raise SystemExit(1)
          result = payload.get("result")
          if not isinstance(result, dict) or result.get("status") in {"failed", "rejected"}:
              raise SystemExit(1)
          PY
              then
                docker inspect --format '{{json .State.Health}}' wickhunter-market-evidence
                echo "Persistent collector is healthy; the GitHub runner is released."
                exit 0
              fi
            fi
            sleep 5
          done
          docker inspect wickhunter-market-evidence || true
          docker logs --tail 100 wickhunter-market-evidence || true
          echo "Persistent WickHunter collector did not become healthy" >&2
          exit 1

  sample:
    name: Scheduled polling disabled; persistent container owns sampling
    if: false
    runs-on: [freqtrade-staging]
    timeout-minutes: 20
    steps:
      - run: echo "Persistent Synology container collects samples without occupying the runner."
