name: AI Platform CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"
  push:
    branches:
      - develop
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"

permissions:
  contents: read

concurrency:
  group: "ai-platform-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: AI platform tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install lightweight validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6"
          "httpx>=0.24.1" fastapi pyjwt cryptography
          ruff==0.15.21 codespell==2.4.2

      - name: Compile AI platform Python
        run: python -m compileall -q ai_platform tests/ai_platform

      - name: Run AI platform tests
        run: >-
          python -m pytest -q -o addopts=''
          --confcutdir=tests/ai_platform tests/ai_platform

      - name: Prepare WickHunter Ruff repair artifact
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'feat/wickhunter-wh00-contracts-vertical-slice-v1'
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            ai_platform/wickhunter
            tests/ai_platform_integration/test_wickhunter_vertical_slice.py
          )
          ruff check --fix "${targets[@]}" || true
          ruff format "${targets[@]}"
          {
            ruff check "${targets[@]}" || true
            ruff format --check "${targets[@]}" || true
          } > /tmp/wickhunter-ruff-report.txt 2>&1
          git diff -- "${targets[@]}" > /tmp/wickhunter-ruff.patch

      - name: Upload WickHunter Ruff repair artifact
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.head_ref == 'feat/wickhunter-wh00-contracts-vertical-slice-v1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wickhunter-ruff-${{ github.run_id }}
          path: |
            /tmp/wickhunter-ruff.patch
            /tmp/wickhunter-ruff-report.txt
          retention-days: 1
          if-no-files-found: error

      - name: Ruff
        run: ruff check ai_platform tests/ai_platform

      - name: Ruff format
        run: ruff format --check ai_platform tests/ai_platform

      - name: Codespell
        run: codespell AGENTS.md ai_platform docs/ai_platform tests/ai_platform

      - name: Validate baseline JSON
        run: python -m json.tool ai_platform/configs/freqai-baseline.example.json > /dev/null

      - name: Validate experiment manifest JSON
        run: python -m json.tool ai_platform/experiments/baseline-v1.json > /dev/null

      - name: Validate experiment schema JSON
        run: python -m json.tool ai_platform/experiments/schema-v1.json > /dev/null
