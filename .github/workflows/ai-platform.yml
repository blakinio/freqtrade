name: AI Platform CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"
  push:
    branches:
      - develop
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"

permissions:
  contents: read

concurrency:
  group: "ai-platform-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: AI platform tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install lightweight validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest jsonschema ruff==0.15.21 codespell==2.4.2

      - name: Compile AI platform Python
        run: python -m compileall -q ai_platform tests/ai_platform

      - name: Run AI platform tests
        run: >-
          python -m pytest -q -o addopts=''
          --confcutdir=tests/ai_platform tests/ai_platform

      - name: Capture Ruff diagnostics
        shell: bash
        run: |
          set +e
          ruff check ai_platform tests/ai_platform > ruff-output.txt 2>&1
          printf '%s\n' "$?" > ruff-exit-code.txt
          exit 0

      - name: Upload Ruff diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ruff-diagnostics
          path: |
            ruff-output.txt
            ruff-exit-code.txt
          if-no-files-found: error

      - name: Enforce Ruff result
        shell: bash
        run: test "$(cat ruff-exit-code.txt)" = "0"

      - name: Ruff format
        run: ruff format --check ai_platform tests/ai_platform

      - name: Codespell
        run: codespell AGENTS.md ai_platform docs/ai_platform tests/ai_platform

      - name: Validate baseline JSON
        run: python -m json.tool ai_platform/configs/freqai-baseline.example.json > /dev/null

      - name: Validate experiment manifest JSON
        run: python -m json.tool ai_platform/experiments/baseline-v1.json > /dev/null

      - name: Validate experiment schema JSON
        run: python -m json.tool ai_platform/experiments/schema-v1.json > /dev/null
