name: AI Platform CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "deploy/synology/portal-oidc/Dockerfile.control-plane"
      - "deploy/synology/portal-oidc/requirements.txt"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"
  push:
    branches:
      - develop
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "deploy/synology/portal-oidc/Dockerfile.control-plane"
      - "deploy/synology/portal-oidc/requirements.txt"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"

permissions:
  contents: read

concurrency:
  group: "ai-platform-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: AI platform tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install lightweight validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6"
          "httpx>=0.24.1" fastapi pyjwt cryptography "PyYAML>=6.0"
          ruff==0.15.21 codespell==2.4.2

      - name: Compile AI platform Python
        run: python -m compileall -q ai_platform tests/ai_platform

      - name: Run AI platform tests
        run: >-
          python -m pytest -q -o addopts=''
          --confcutdir=tests/ai_platform
          --ignore=tests/ai_platform/portal/feature_registry
          --ignore=tests/ai_platform/portal/strategy_lab
          tests/ai_platform

      - name: Ruff
        run: ruff check ai_platform tests/ai_platform

      - name: Ruff format
        run: ruff format --diff --check ai_platform tests/ai_platform

      - name: Codespell
        run: codespell AGENTS.md ai_platform docs/ai_platform tests/ai_platform

      - name: Validate baseline JSON
        run: python -m json.tool ai_platform/configs/freqai-baseline.example.json > /dev/null

      - name: Validate experiment manifest JSON
        run: python -m json.tool ai_platform/experiments/baseline-v1.json > /dev/null

      - name: Validate experiment schema JSON
        run: python -m json.tool ai_platform/experiments/schema-v1.json > /dev/null

      - name: Scan committed Portal artifacts and persisted fixtures
        run: |
          mkdir -p artifacts
          python -m ai_platform.portal.security.sensitive_scan \
            ai_platform/portal tests/ai_platform/portal \
            --report artifacts/sensitive-data-scan.json

      - name: Upload value-free sensitive-data scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: portal-sensitive-data-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/sensitive-data-scan.json
          if-no-files-found: warn
          retention-days: 14

  exact-image-sensitive-data:
    name: Exact control-plane image sensitive-data probes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build exact control-plane image
        run: >-
          docker build
          --file deploy/synology/portal-oidc/Dockerfile.control-plane
          --tag portal-control-plane-sensitive:${{ github.sha }}
          .

      - name: Run clean and synthetic-negative scanner probes
        env:
          IMAGE: portal-control-plane-sensitive:${{ github.sha }}
        run: |
          mkdir -p artifacts/image-sensitive-scan
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/image-sensitive-scan")
          (root / "clean.json").write_text(
              json.dumps({"event": "ready", "authorization_status": "denied"}),
              encoding="utf-8",
          )
          canary = "SYNTHETIC" + "-IMAGE-CANARY"
          (root / "negative.json").write_text(
              json.dumps({"metadata": {"credential_ref": canary}}),
              encoding="utf-8",
          )
          PY

          docker run --rm \
            --volume "$PWD/artifacts/image-sensitive-scan:/scan:ro" \
            "$IMAGE" \
            python -m ai_platform.portal.security.sensitive_scan \
            /scan/clean.json \
            > artifacts/image-sensitive-scan/clean-report.json

          set +e
          docker run --rm \
            --volume "$PWD/artifacts/image-sensitive-scan:/scan:ro" \
            "$IMAGE" \
            python -m ai_platform.portal.security.sensitive_scan \
            /scan/negative.json \
            > artifacts/image-sensitive-scan/negative-report.json
          negative_status=$?
          set -e

          test "$negative_status" -eq 1
          grep -q 'credential_reference' artifacts/image-sensitive-scan/negative-report.json
          if grep -q 'SYNTHETIC-IMAGE-CANARY' artifacts/image-sensitive-scan/negative-report.json; then
            echo "scanner report exposed the synthetic value" >&2
            exit 1
          fi

      - name: Upload exact-image scanner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: portal-sensitive-data-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-sensitive-scan
          if-no-files-found: warn
          retention-days: 14
