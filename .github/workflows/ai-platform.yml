name: AI Platform CI

on:
  pull_request:
    paths:
      - ".github/workflows/ai-platform.yml"

permissions:
  contents: read

jobs:
  validate-checkpoint:
    name: Validate RL-v2 seed audit checkpoint and resume
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run canonical checkpoint and resume validation
        run: |
          mkdir -p diagnostic-output
          python tools/agents/checkpoint.py \
            docs/agents/tasks/FTAI-20260726-rl-v2-seed-effectiveness-determinism-audit.md \
            --require-checkpoint \
            > diagnostic-output/checkpoint.txt
          python tools/agents/resume.py \
            --task docs/agents/tasks/FTAI-20260726-rl-v2-seed-effectiveness-determinism-audit.md \
            > diagnostic-output/resume.txt

      - name: Upload diagnostic output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-seed-audit-checkpoint-resume-${{ github.event.pull_request.number }}
          path: diagnostic-output/
          if-no-files-found: error
          retention-days: 1
