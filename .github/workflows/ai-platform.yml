name: AI Platform CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"

permissions:
  contents: write

concurrency:
  group: "ai-platform-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  format-pi01:
    if: github.head_ref == 'feat/portal-pi01-runtime-read-reconciliation-20260724'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PI-01 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/portal-pi01-runtime-read-reconciliation-20260724
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21

      - name: Format and push exact Ruff output
        run: |
          ruff format \
            ai_platform/portal/execution/private_read.py \
            ai_platform/portal/operations/repository.py \
            ai_platform/portal/operations/service.py \
            tests/ai_platform/portal/operations/test_private_runtime_migration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/portal/execution/private_read.py \
            ai_platform/portal/operations/repository.py \
            ai_platform/portal/operations/service.py \
            tests/ai_platform/portal/operations/test_private_runtime_migration.py
          git diff --cached --quiet && exit 0
          git commit -m "style(portal): apply Ruff formatting"
          git push origin HEAD:feat/portal-pi01-runtime-read-reconciliation-20260724
