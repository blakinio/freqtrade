name: AI Platform CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"
  push:
    branches:
      - develop
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"

permissions:
  contents: read

concurrency:
  group: "ai-platform-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: AI platform tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install lightweight validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6"
          "httpx>=0.24.1" fastapi ruff==0.15.21 codespell==2.4.2

      - name: Compile AI platform Python
        run: python -m compileall -q ai_platform tests/ai_platform

      - name: Run AI platform tests
        run: >-
          python -m pytest -q -o addopts=''
          --confcutdir=tests/ai_platform tests/ai_platform

      - name: Ruff
        run: ruff check ai_platform tests/ai_platform

      - name: Export Ruff-formatted sources
        shell: bash
        run: |
          ruff format ai_platform tests/ai_platform
          exit 1

      - name: Upload Ruff-formatted sources
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-platform-ruff-formatted-sources
          path: |
            ai_platform/portal/execution/private_read.py
            ai_platform/portal/operations/repository.py
            ai_platform/portal/operations/service.py
            tests/ai_platform/portal/operations/test_private_runtime_migration.py
          if-no-files-found: error
          retention-days: 1

      - name: Codespell
        run: codespell AGENTS.md ai_platform docs/ai_platform tests/ai_platform

      - name: Validate baseline JSON
        run: python -m json.tool ai_platform/configs/freqai-baseline.example.json > /dev/null

      - name: Validate experiment manifest JSON
        run: python -m json.tool ai_platform/experiments/baseline-v1.json > /dev/null

      - name: Validate experiment schema JSON
        run: python -m json.tool ai_platform/experiments/schema-v1.json > /dev/null
