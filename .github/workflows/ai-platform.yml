name: AI Platform CI

on:
  pull_request:
    paths:
      - ".github/workflows/ai-platform.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Emit canonical RL-v2 seed-audit formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21

      - name: Apply canonical lint and formatting in runner workspace
        run: |
          ruff check --fix ai_platform/scripts/rl_v2_seed_effectiveness_audit.py
          ruff format ai_platform/scripts/rl_v2_seed_effectiveness_audit.py
          ruff check ai_platform/scripts/rl_v2_seed_effectiveness_audit.py
          ruff format --check ai_platform/scripts/rl_v2_seed_effectiveness_audit.py
          mkdir -p diagnostic-output
          cp ai_platform/scripts/rl_v2_seed_effectiveness_audit.py \
            diagnostic-output/rl_v2_seed_effectiveness_audit.py

      - name: Upload canonical file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-seed-audit-formatted-${{ github.event.pull_request.number }}
          path: diagnostic-output/
          if-no-files-found: error
          retention-days: 1
