name: AI Platform CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"

permissions:
  contents: write

concurrency:
  group: "ai-platform-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  fix-precommit-pi01:
    if: github.head_ref == 'feat/portal-pi01-runtime-read-reconciliation-20260724'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PI-01 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/portal-pi01-runtime-read-reconciliation-20260724
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact mypy corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter = Path("ai_platform/portal/execution/adapter.py")
          lines = adapter.read_text(encoding="utf-8").splitlines(keepends=True)
          marker = "        if collector is None:\n"
          try:
              index = lines.index(marker, 200)
          except ValueError as exc:
              raise SystemExit("adapter collector marker not found") from exc
          for offset in (1, 2, 3):
              lines[index + offset] = lines[index + offset].replace(
                  "reason_code", "collector_reason_code"
              )
          adapter.write_text("".join(lines), encoding="utf-8")

          test = Path("tests/ai_platform/portal/execution/test_private_read.py")
          text = test.read_text(encoding="utf-8")
          if "from email.message import Message\n" not in text:
              text = text.replace(
                  "from decimal import Decimal\n",
                  "from decimal import Decimal\nfrom email.message import Message\n",
                  1,
              )
          if "hdrs=None," not in text:
              raise SystemExit("HTTPError hdrs target not found")
          text = text.replace("hdrs=None,", "hdrs=Message(),", 1)
          if "object(),  # type: ignore[arg-type]" not in text:
              raise SystemExit("unused ignore target not found")
          text = text.replace("object(),  # type: ignore[arg-type]", "object(),", 1)
          test.write_text(text, encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install and run pre-commit
        run: |
          python -m pip install --disable-pip-version-check pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Restore canonical workflow and commit fixes
        run: |
          git fetch origin develop
          git show origin/develop:.github/workflows/ai-platform.yml > .github/workflows/ai-platform.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/portal/execution/adapter.py \
            tests/ai_platform/portal/execution/test_private_read.py \
            .github/workflows/ai-platform.yml
          git commit -m "fix(portal): satisfy full pre-commit checks"
          git push origin HEAD:feat/portal-pi01-runtime-read-reconciliation-20260724
