name: AI Platform CI

on:
  pull_request:
    paths:
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"

permissions:
  contents: read

jobs:
  emit-canonical-request:
    name: Emit canonical seed request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Emit exact canonical request and validate checkpoint
        run: |
          mkdir -p diagnostic-output
          python -m ai_platform.scripts.rl_v2_lifecycle_seed_robustness_run_request \
            --print-canonical > diagnostic-output/canonical-request.json
          python tools/agents/checkpoint.py \
            docs/agents/tasks/FTAI-20260725-rl-v2-lifecycle-seed-robustness-execution.md \
            --require-checkpoint > diagnostic-output/checkpoint-validation.txt

      - name: Upload diagnostic output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-seed-canonical-request-${{ github.event.pull_request.number }}
          path: diagnostic-output/
          if-no-files-found: error
          retention-days: 1
