name: AI Platform CI

on:
  pull_request:
    paths:
      - "docs/agents/tasks/FTAI-20260725-rl-v2-lifecycle-seed-robustness-execution.md"
      - ".github/workflows/ai-platform.yml"

permissions:
  contents: read

jobs:
  validate-terminal-checkpoint:
    name: Validate terminal seed checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate terminal execution checkpoint
        run: |
          mkdir -p diagnostic-output
          # Validate the final closure content after its validation result was recorded.
          python tools/agents/checkpoint.py \
            docs/agents/tasks/FTAI-20260725-rl-v2-lifecycle-seed-robustness-execution.md \
            --require-checkpoint | tee diagnostic-output/checkpoint-validation.txt

      - name: Upload checkpoint validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-seed-execution-close-checkpoint-${{ github.event.pull_request.number }}
          path: diagnostic-output/checkpoint-validation.txt
          if-no-files-found: error
          retention-days: 1
