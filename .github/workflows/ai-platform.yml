name: AI Platform CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"
  push:
    branches:
      - develop
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"

permissions:
  contents: write

concurrency:
  group: "ai-platform-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: AI platform tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install lightweight validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6"
          "httpx>=0.24.1" fastapi pyjwt cryptography
          mypy==2.3.0 ruff==0.15.21 codespell==2.4.2

      - name: Apply confirmed mypy annotation fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/provenance/rl_v2.py")
          old = "def _exact_keys(value: Mapping[str, Any], expected: set[str], label: str) -> None:"
          new = "def _exact_keys(value: Mapping[str, Any], expected: set[str] | frozenset[str], label: str) -> None:"
          text = path.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit("exact _exact_keys annotation marker not found once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          ruff format ai_platform/provenance/rl_v2.py

      - name: Compile AI platform Python
        run: python -m compileall -q ai_platform tests/ai_platform

      - name: Run AI platform tests
        run: >-
          python -m pytest -q -o addopts=''
          --confcutdir=tests/ai_platform tests/ai_platform

      - name: Mypy provenance
        run: mypy ai_platform/provenance/__init__.py ai_platform/provenance/rl_v2.py

      - name: Ruff
        run: ruff check ai_platform tests/ai_platform

      - name: Ruff format
        run: ruff format --check ai_platform tests/ai_platform

      - name: Codespell
        run: codespell AGENTS.md ai_platform docs/ai_platform tests/ai_platform

      - name: Validate baseline JSON
        run: python -m json.tool ai_platform/configs/freqai-baseline.example.json > /dev/null

      - name: Validate experiment manifest JSON
        run: python -m json.tool ai_platform/experiments/baseline-v1.json > /dev/null

      - name: Validate experiment schema JSON
        run: python -m json.tool ai_platform/experiments/schema-v1.json > /dev/null

      - name: Commit confirmed mypy fix
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/provenance/rl_v2.py
          git diff --cached --quiet && { echo "Expected mypy fix produced no diff"; exit 1; }
          git commit -m "fix(ai-platform): accept frozen provenance key sets"
          git push origin "HEAD:${HEAD_REF}"
