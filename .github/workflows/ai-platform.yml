name: AI Platform CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"

permissions:
  contents: write

concurrency:
  group: "ai-platform-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  format-wickhunter-capture:
    name: Apply exact WickHunter Ruff format
    if: github.event.pull_request.number == 753
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install exact repository Ruff version
        run: python -m pip install --disable-pip-version-check ruff==0.15.21

      - name: Format only the WickHunter capture module
        run: ruff format ai_platform/wickhunter/production_market_evidence.py

      - name: Commit only the exact formatted module
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)ai_platform/wickhunter/production_market_evidence.py'
          if git diff --quiet -- ai_platform/wickhunter/production_market_evidence.py; then
            echo "WickHunter capture module is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/wickhunter/production_market_evidence.py
          git commit -m "style(wickhunter): apply Ruff format"
          git push origin "HEAD:${HEAD_BRANCH}"
