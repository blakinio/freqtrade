name: AI Platform CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/ai-platform.yml"

permissions:
  contents: read

concurrency:
  group: "ai-platform-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  precommit-pi01:
    if: github.head_ref == 'feat/portal-pi01-runtime-read-reconciliation-20260724'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PI-01 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/portal-pi01-runtime-read-reconciliation-20260724
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit

      - name: Run pre-commit with diagnostics
        shell: bash
        run: |
          set +e
          pre-commit run --all-files --show-diff-on-failure 2>&1 | tee pre-commit.log
          result=${PIPESTATUS[0]}
          git diff > pre-commit.diff
          echo "$result" > pre-commit.exit-code
          exit "$result"

      - name: Upload pre-commit diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi01-pre-commit-diagnostics
          path: |
            pre-commit.log
            pre-commit.diff
            pre-commit.exit-code
          if-no-files-found: error
          retention-days: 1
