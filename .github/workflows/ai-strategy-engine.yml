name: AI Strategy Engine

on:
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
    paths:
      - ai_strategy_engine/**
      - ai_platform/research/strategy_engine/**
      - .github/workflows/ai-strategy-engine.yml
  pull_request:
    branches:
      - develop
    paths:
      - ai_strategy_engine/**
      - ai_platform/research/strategy_engine/**
      - .github/workflows/ai-strategy-engine.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: ASE-00 complete validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install development dependencies
        working-directory: ai_strategy_engine
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "SQLAlchemy>=2.0.6"

      - name: Run tests
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          pytest

      - name: Run Ruff
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Run mypy
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          mypy src/strategy_engine

      - name: Compile source and tests
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          python -m compileall -q src tests

      - name: Validate Portal Risk Core adapter
        run: |
          . ai_strategy_engine/.venv/bin/activate
          python -m compileall -q ai_platform/research/strategy_engine
          ruff check ai_platform/research/strategy_engine

      - name: Validate JSON, YAML and JSON Schema examples
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          import jsonschema
          import yaml

          root = Path('.')
          for path in sorted(root.rglob('*.json')):
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
          for path in sorted(root.rglob('*.yaml')) + sorted(root.rglob('*.yml')):
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)

          mappings = {
              'examples/feature_record.json': 'schemas/feature-record.v1.schema.json',
              'examples/signal_event.json': 'schemas/signal-event.v1.schema.json',
              'examples/strategy_classic.json': 'schemas/strategy-definition.v1.schema.json',
              'examples/strategy_liquidation.json': 'schemas/strategy-definition.v1.schema.json',
              'examples/strategy_miyagi_ensemble_research.json': 'schemas/strategy-definition.v1.schema.json',
              'examples/strategy_bonsai_research.json': 'schemas/strategy-definition.v1.schema.json',
          }
          for example_name, schema_name in mappings.items():
              example = json.loads((root / example_name).read_text(encoding='utf-8'))
              schema = json.loads((root / schema_name).read_text(encoding='utf-8'))
              jsonschema.Draft202012Validator.check_schema(schema)
              jsonschema.validate(example, schema)
          print('JSON/YAML parsing and JSON Schema example validation passed')
          PY

      - name: Verify materialization evidence and required paths
        working-directory: ai_strategy_engine
        run: |
          test -f configs/feature_registry.v1.yaml
          test -f configs/search_spaces.v1.yaml
          test -f configs/miyagi_parameter_map.v1.yaml
          test -d schemas
          test -d examples
          test -d src/strategy_engine
          test -d tests
          test -d docs
          grep -Fq '73a0d99cab94ba116818a6aef9d818a710fb048a4c0b77f89b9819dd9ac7332f' docs/materialization-evidence.md
          grep -Fq 'status: `complete`' docs/materialization-evidence.md

      - name: Scan secrets, prohibited code and architecture boundaries
        run: |
          . ai_strategy_engine/.venv/bin/activate
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          import subprocess
          from pathlib import Path

          roots = [
              Path('ai_strategy_engine/src'),
              Path('ai_strategy_engine/tests'),
              Path('ai_strategy_engine/configs'),
              Path('ai_strategy_engine/examples'),
              Path('ai_platform/research/strategy_engine'),
          ]
          text_files = [
              path
              for root in roots
              for path in root.rglob('*')
              if path.is_file() and path.suffix.lower() in {'.py', '.json', '.yaml', '.yml', '.toml'}
          ]
          secret_patterns = {
              'private key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'AWS access key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'GitHub token': re.compile(r'gh[pousr]_[A-Za-z0-9_]{30,}'),
              'OpenAI key': re.compile(r'sk-[A-Za-z0-9]{32,}'),
          }
          failures: list[str] = []
          for path in text_files:
              text = path.read_text(encoding='utf-8')
              if 'luxalgo' in text.lower():
                  failures.append(f'{path}: LuxAlgo reference outside research/license documentation')
              for label, pattern in secret_patterns.items():
                  if pattern.search(text):
                      failures.append(f'{path}: possible {label}')
              if path.suffix != '.py':
                  continue
              tree = ast.parse(text, filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                      if node.func.id in {'eval', 'exec'}:
                          failures.append(f'{path}:{node.lineno}: prohibited {node.func.id}()')
                  imported: str | None = None
                  if isinstance(node, ast.ImportFrom):
                      imported = node.module
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.startswith(('freqtrade', 'ai_platform.portal.execution')):
                              failures.append(f'{path}:{node.lineno}: direct execution import {alias.name}')
                  if imported and imported.startswith(('freqtrade', 'ai_platform.portal.execution')):
                      failures.append(f'{path}:{node.lineno}: direct execution import {imported}')

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/develop...HEAD'], text=True
          ).splitlines()
          browser_changes = [path for path in changed if path.startswith('ai_platform/portal/web/')]
          if browser_changes:
              failures.append(f'Browser paths changed by ASE-00: {browser_changes}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Secret, LuxAlgo, eval/exec and Browser-to-Freqtrade boundary scans passed')
          PY
