name: AI Strategy Engine

on:
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
    paths:
      - .github/workflows/ai-strategy-engine.yml
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ai-strategy-engine.yml

permissions:
  contents: write

jobs:
  diagnose-ai-platform-ruff:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0

      - name: Install exact Ruff version
        run: python -m pip install --disable-pip-version-check ruff==0.15.21

      - name: Capture separated repair results
        run: |
          set +e
          ruff check --fix ai_platform/portal/control_plane/__init__.py \
            > /tmp/fix.txt 2>&1
          fix_status=$?
          git diff -- ai_platform/portal/control_plane/__init__.py > /tmp/fix.diff
          ruff check ai_platform tests/ai_platform > /tmp/check.txt 2>&1
          check_status=$?
          ruff format --check ai_platform tests/ai_platform > /tmp/format.txt 2>&1
          format_status=$?
          git checkout -- ai_platform/portal/control_plane/__init__.py
          set -e
          {
            echo '# AI Platform Ruff repair diagnostic'
            echo
            echo "- fix exit code: \`$fix_status\`"
            echo "- check exit code: \`$check_status\`"
            echo "- format exit code: \`$format_status\`"
            echo
            echo '## Fix output'
            echo '```text'
            cat /tmp/fix.txt
            echo '```'
            echo
            echo '## Proposed diff'
            echo '```diff'
            cat /tmp/fix.diff
            echo '```'
            echo
            echo '## Full check output'
            echo '```text'
            cat /tmp/check.txt
            echo '```'
            echo
            echo '## Format check output'
            echo '```text'
            cat /tmp/format.txt
            echo '```'
          } > ai_strategy_engine/docs/ai-platform-ruff-repair-diagnostic.md

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_strategy_engine/docs/ai-platform-ruff-repair-diagnostic.md
          git commit -m "docs(ai-platform): record separated Ruff repair results"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
