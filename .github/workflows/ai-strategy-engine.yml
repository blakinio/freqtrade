name: AI Strategy Engine

on:
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
    paths:
      - .github/workflows/ai-strategy-engine.yml
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ai-strategy-engine.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Capture strict Ruff output
        run: |
          python -m venv ai_strategy_engine/.venv
          . ai_strategy_engine/.venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e "ai_strategy_engine[dev]" "SQLAlchemy>=2.0.6" "fastapi>=0.115"
          set +e
          ruff check ai_strategy_engine ai_platform/research/strategy_engine \
            tests/ai_platform_integration/test_ase00_vertical_slice.py \
            > /tmp/ase00-ruff.txt 2>&1
          status=$?
          set -e
          {
            echo '# ASE-00 strict Ruff report'
            echo
            echo "- exit code: \`$status\`"
            echo
            echo '```text'
            cat /tmp/ase00-ruff.txt
            echo '```'
          } > ai_strategy_engine/docs/ase00-ruff-report.md

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_strategy_engine/docs/ase00-ruff-report.md
          git commit -m "docs(ai-strategy): record strict Ruff findings"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
