name: AI Strategy Engine

on:
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
    paths:
      - .github/workflows/ai-strategy-engine.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  finalize:
    name: finalize-pytest-and-develop-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Merge develop and repair root pytest collection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --no-edit origin/develop
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.')
          pyproject = root / 'pyproject.toml'
          text = pyproject.read_text(encoding='utf-8')
          anchor = 'addopts = ["--dist", "loadscope"]\n'
          addition = anchor + 'pythonpath = ["ai_strategy_engine/src", "ai_strategy_engine"]\n'
          if 'pythonpath = ["ai_strategy_engine/src", "ai_strategy_engine"]' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('pytest addopts anchor mismatch')
              text = text.replace(anchor, addition, 1)
              pyproject.write_text(text, encoding='utf-8')

          develop_sha = subprocess.check_output(
              ['git', 'rev-parse', 'origin/develop'], text=True
          ).strip()
          previous_sha = 'e141a9a044a07dd0fdc80e17ff79a1bb61cd2440'
          docs = [
              root / 'ai_strategy_engine/docs/IMPLEMENTATION_CHECKPOINT.md',
              root / 'ai_strategy_engine/docs/current-state.md',
              root / 'ai_strategy_engine/docs/materialization-evidence.md',
          ]
          for path in docs:
              body = path.read_text(encoding='utf-8')
              if develop_sha not in body:
                  if body.count(previous_sha) != 1:
                      raise SystemExit(f'develop SHA anchor mismatch: {path}')
                  body = body.replace(previous_sha, develop_sha, 1)
                  path.write_text(body, encoding='utf-8')
          PY

          python -m pip install --disable-pip-version-check pytest "pydantic>=2.2"
          pytest --collect-only -q -o addopts='' \
            ai_strategy_engine/tests/unit/test_models.py \
            ai_strategy_engine/tests/unit/test_materialize_starter.py

          git add pyproject.toml \
            ai_strategy_engine/docs/IMPLEMENTATION_CHECKPOINT.md \
            ai_strategy_engine/docs/current-state.md \
            ai_strategy_engine/docs/materialization-evidence.md
          if ! git diff --cached --quiet; then
            git commit -m "fix(ai-strategy): expose package to repository pytest"
          fi
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
