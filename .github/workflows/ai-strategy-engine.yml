name: AI Strategy Engine

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ai-strategy-engine.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ase00-python-boundary-repair
  cancel-in-progress: true

jobs:
  repair:
    name: validate-python-support-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Apply and validate support boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          anchor = 'pythonpath = ["ai_strategy_engine/src", "ai_strategy_engine"]\n'
          addition = anchor + 'norecursedirs = ["ai_strategy_engine"]\n'
          if 'norecursedirs = ["ai_strategy_engine"]' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('root pytest pythonpath anchor mismatch')
              text = text.replace(anchor, addition, 1)
              pyproject.write_text(text, encoding='utf-8')

          test_path = Path('tests/ai_platform_integration/test_ase00_vertical_slice.py')
          test_text = test_path.read_text(encoding='utf-8')
          if 'pytest.skip("ASE-00 requires Python 3.12+"' not in test_text:
              import_anchor = 'import math\nfrom dataclasses import replace\n'
              if test_text.count(import_anchor) != 1:
                  raise SystemExit('stdlib import anchor mismatch')
              test_text = test_text.replace(
                  import_anchor,
                  'import math\nimport sys\nfrom dataclasses import replace\n',
                  1,
              )
              pytest_anchor = 'from pathlib import Path\n\nfrom strategy_engine.features.records'
              replacement = (
                  'from pathlib import Path\n\nimport pytest\n\n'
                  'if sys.version_info < (3, 12):\n'
                  '    pytest.skip("ASE-00 requires Python 3.12+", allow_module_level=True)\n\n'
                  'from strategy_engine.features.records'
              )
              if test_text.count(pytest_anchor) != 1:
                  raise SystemExit('pytest import anchor mismatch')
              test_text = test_text.replace(pytest_anchor, replacement, 1)
              test_path.write_text(test_text, encoding='utf-8')
          PY

          python -m pip install --disable-pip-version-check pytest ruff==0.15.21
          ruff check --fix tests/ai_platform_integration/test_ase00_vertical_slice.py
          ruff format tests/ai_platform_integration/test_ase00_vertical_slice.py
          python -m compileall -q tests/ai_platform_integration/test_ase00_vertical_slice.py
          pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration \
            tests/ai_platform_integration/test_ase00_vertical_slice.py
          python - <<'PY'
          from pathlib import Path
          import tomllib

          config = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          pytest_config = config['tool']['pytest']
          assert pytest_config['norecursedirs'] == ['ai_strategy_engine']
          assert pytest_config['pythonpath'] == ['ai_strategy_engine/src', 'ai_strategy_engine']
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml tests/ai_platform_integration/test_ase00_vertical_slice.py
          git commit -m "fix(ai-strategy): isolate Python 3.12 test surface"
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
