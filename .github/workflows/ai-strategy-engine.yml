name: AI Strategy Engine

on:
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
    paths:
      - .github/workflows/ai-strategy-engine.yml
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ai-strategy-engine.yml

permissions:
  contents: write

jobs:
  diagnose-ai-platform-matrix:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -e "ai_strategy_engine[dev]"
          pytest jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6"
          "httpx>=0.24.1" fastapi pyjwt cryptography
          ruff==0.15.21 codespell==2.4.2

      - name: Capture separated matrix results
        run: |
          ruff check --fix ai_platform/portal/control_plane/__init__.py
          ruff format ai_platform/research/strategy_engine/ase00_adapter.py
          set +e
          ruff check ai_platform tests/ai_platform > /tmp/check.txt 2>&1
          check_status=$?
          ruff format --check ai_platform tests/ai_platform > /tmp/format.txt 2>&1
          format_status=$?
          python -m compileall -q ai_platform tests/ai_platform > /tmp/compile.txt 2>&1
          compile_status=$?
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform tests/ai_platform \
            > /tmp/pytest.txt 2>&1
          pytest_status=$?
          git checkout -- ai_platform/portal/control_plane/__init__.py \
            ai_platform/research/strategy_engine/ase00_adapter.py
          set -e
          {
            echo '# AI Platform post-format matrix diagnostic'
            echo
            echo "- Ruff check: \`$check_status\`"
            echo "- Ruff format: \`$format_status\`"
            echo "- compileall: \`$compile_status\`"
            echo "- pytest: \`$pytest_status\`"
            for section in check format compile pytest; do
              echo
              echo "## $section"
              echo '```text'
              cat "/tmp/$section.txt"
              echo '```'
            done
          } > ai_strategy_engine/docs/ai-platform-matrix-diagnostic.md

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_strategy_engine/docs/ai-platform-matrix-diagnostic.md
          git commit -m "docs(ai-platform): record post-format matrix failure"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
