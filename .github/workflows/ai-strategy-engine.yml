name: AI Strategy Engine

on:
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
      - agent/ase-01-tradingview-strategy-lab
      - agent/ase-fr-01-feature-registry-service
    paths:
      - ai_strategy_engine/**
      - ai_platform/research/strategy_engine/**
      - ai_platform/research/strategy_lab/**
      - ai_platform/portal/feature_registry/**
      - ai_platform/portal/strategy_lab/**
      - ai_platform/portal/control_plane/api.py
      - ai_platform/portal/control_plane/api_core.py
      - ai_platform/portal/control_plane/database.py
      - ai_platform/portal/web/app/ai/experiments/**
      - ai_platform/portal/web/lib/strategy-lab-*.ts
      - ai_platform/portal/web/e2e/strategy-lab.spec.ts
      - tests/ai_platform/portal/feature_registry/**
      - tests/ai_platform/portal/strategy_lab/**
      - tests/ai_platform_integration/test_ase0*_*.py
      - tests/ai_platform_integration/test_ase_fr_01_feature_registry_e2e.py
      - .github/workflows/ai-strategy-engine.yml
  pull_request:
    branches:
      - develop
    paths:
      - ai_strategy_engine/**
      - ai_platform/research/strategy_engine/**
      - ai_platform/research/strategy_lab/**
      - ai_platform/portal/feature_registry/**
      - ai_platform/portal/strategy_lab/**
      - ai_platform/portal/control_plane/api.py
      - ai_platform/portal/control_plane/api_core.py
      - ai_platform/portal/control_plane/database.py
      - ai_platform/portal/web/app/ai/experiments/**
      - ai_platform/portal/web/lib/strategy-lab-*.ts
      - ai_platform/portal/web/e2e/strategy-lab.spec.ts
      - tests/ai_platform/portal/feature_registry/**
      - tests/ai_platform/portal/strategy_lab/**
      - tests/ai_platform_integration/test_ase0*_*.py
      - tests/ai_platform_integration/test_ase_fr_01_feature_registry_e2e.py
      - .github/workflows/ai-strategy-engine.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Strategy Engine complete validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install development dependencies
        working-directory: ai_strategy_engine
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "SQLAlchemy>=2.0.6" "fastapi>=0.115" "httpx>=0.27"

      - name: Run package tests
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          pytest -q

      - name: Run Portal research tests
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/ai_strategy_engine/src"
        run: |
          . ai_strategy_engine/.venv/bin/activate
          pytest -q -o addopts='' --confcutdir=tests/ai_platform/portal \
            tests/ai_platform/portal/feature_registry \
            tests/ai_platform/portal/strategy_lab

      - name: Run Ruff
        run: |
          . ai_strategy_engine/.venv/bin/activate
          ruff check ai_strategy_engine ai_platform/research/strategy_engine \
            ai_platform/portal/feature_registry ai_platform/portal/strategy_lab \
            tests/ai_platform/portal/feature_registry \
            tests/ai_platform/portal/strategy_lab \
            tests/ai_platform_integration/test_ase00_vertical_slice.py \
            tests/ai_platform_integration/test_ase01_strategy_lab_e2e.py \
            tests/ai_platform_integration/test_ase_fr_01_feature_registry_e2e.py

      - name: Run mypy
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          mypy src/strategy_engine

      - name: Compile source and tests
        run: |
          . ai_strategy_engine/.venv/bin/activate
          python -m compileall -q ai_strategy_engine/src ai_strategy_engine/tests \
            ai_platform/research/strategy_engine \
            ai_platform/portal/feature_registry ai_platform/portal/strategy_lab \
            tests/ai_platform/portal/feature_registry \
            tests/ai_platform/portal/strategy_lab

      - name: Validate deterministic repository E2E
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/ai_strategy_engine/src"
        run: |
          . ai_strategy_engine/.venv/bin/activate
          pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration \
            tests/ai_platform_integration/test_ase00_vertical_slice.py \
            tests/ai_platform_integration/test_ase01_strategy_lab_e2e.py \
            tests/ai_platform_integration/test_ase_fr_01_feature_registry_e2e.py

      - name: Validate JSON YAML and JSON Schema examples
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          import jsonschema
          import yaml
          root = Path('.')
          for path in sorted(root.rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
          for path in sorted(root.rglob('*.yaml')) + sorted(root.rglob('*.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          mappings = {
              'examples/feature_record.json': 'schemas/feature-record.v1.schema.json',
              'examples/signal_event.json': 'schemas/signal-event.v1.schema.json',
              'examples/strategy_classic.json': 'schemas/strategy-definition.v1.schema.json',
              'examples/strategy_liquidation.json': 'schemas/strategy-definition.v1.schema.json',
              'examples/strategy_miyagi_ensemble_research.json': 'schemas/strategy-definition.v1.schema.json',
              'examples/strategy_bonsai_research.json': 'schemas/strategy-definition.v1.schema.json',
          }
          for example_name, schema_name in mappings.items():
              example = json.loads((root / example_name).read_text(encoding='utf-8'))
              schema = json.loads((root / schema_name).read_text(encoding='utf-8'))
              jsonschema.Draft202012Validator.check_schema(schema)
              jsonschema.validate(example, schema)
          registry = yaml.safe_load(
              (root / 'configs/feature_registry.v1.yaml').read_text(encoding='utf-8')
          )
          registry_schema = json.loads(
              (root / 'schemas/feature-registry.v1.schema.json').read_text(
                  encoding='utf-8'
              )
          )
          jsonschema.Draft202012Validator.check_schema(registry_schema)
          jsonschema.validate(registry, registry_schema)
          print('JSON/YAML parsing and JSON Schema validation passed')
          PY

      - name: Verify materialization and required paths
        working-directory: ai_strategy_engine
        run: |
          test -f configs/feature_registry.v1.yaml
          test -f configs/search_spaces.v1.yaml
          test -f fixtures/feature_registry_parity.v1.json
          test -f schemas/feature-registry.v1.schema.json
          test -f strategies/tv_supertrend_v1.json
          test -f strategies/tv_squeeze_momentum_v1.json
          test -d schemas
          test -d examples
          test -d src/strategy_engine
          test -d tests
          test -d docs
          grep -Fq '73a0d99cab94ba116818a6aef9d818a710fb048a4c0b77f89b9819dd9ac7332f' \
            docs/materialization-evidence.md
          grep -Fq 'status: `complete`' docs/materialization-evidence.md

      - name: Scan secrets prohibited code and architecture boundaries
        run: |
          . ai_strategy_engine/.venv/bin/activate
          python - <<'PY'
          from __future__ import annotations
          import ast
          import re
          from pathlib import Path
          roots = [
              Path('ai_strategy_engine/src'),
              Path('ai_strategy_engine/tests'),
              Path('ai_strategy_engine/configs'),
              Path('ai_strategy_engine/examples'),
              Path('ai_strategy_engine/fixtures'),
              Path('ai_strategy_engine/strategies'),
              Path('ai_platform/research/strategy_engine'),
              Path('ai_platform/research/strategy_lab'),
              Path('ai_platform/portal/feature_registry'),
              Path('ai_platform/portal/strategy_lab'),
              Path('ai_platform/portal/web/app/ai/experiments'),
              Path('ai_platform/portal/web/lib/strategy-lab-contracts.ts'),
              Path('ai_platform/portal/web/lib/strategy-lab-fixtures.ts'),
              Path('ai_platform/portal/web/lib/strategy-lab-api.ts'),
              Path('tests/ai_platform/portal/feature_registry'),
              Path('tests/ai_platform_integration/test_ase00_vertical_slice.py'),
              Path('tests/ai_platform_integration/test_ase01_strategy_lab_e2e.py'),
              Path('tests/ai_platform_integration/test_ase_fr_01_feature_registry_e2e.py'),
          ]
          suffixes = {'.py', '.json', '.yaml', '.yml', '.toml', '.ts', '.tsx'}
          text_files = [
              path for root in roots
              for path in ([root] if root.is_file() else root.rglob('*'))
              if path.is_file() and path.suffix.lower() in suffixes
          ]
          secret_patterns = {
              'private key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'AWS access key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'GitHub token': re.compile(r'gh[pousr]_[A-Za-z0-9_]{30,}'),
              'OpenAI key': re.compile(r'sk-[A-Za-z0-9]{32,}'),
          }
          failures: list[str] = []
          for path in text_files:
              text = path.read_text(encoding='utf-8')
              lowered = text.lower()
              if 'luxalgo' in lowered:
                  failures.append(f'{path}: prohibited proprietary runtime reference')
              if path.suffix in {'.ts', '.tsx'}:
                  direct_browser_patterns = (
                      re.compile(r'https?://[^\s"\']*freqtrade', re.IGNORECASE),
                      re.compile(r'from\s+["\']freqtrade', re.IGNORECASE),
                      re.compile(r'/api/v1/(?:start|stop|forceenter|forceexit|trades)', re.IGNORECASE),
                  )
                  if any(pattern.search(text) for pattern in direct_browser_patterns):
                      failures.append(f'{path}: browser code references Freqtrade directly')
              for label, pattern in secret_patterns.items():
                  if pattern.search(text):
                      failures.append(f'{path}: possible {label}')
              if path.suffix != '.py':
                  continue
              tree = ast.parse(text, filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id in {'eval', 'exec'}:
                      failures.append(f'{path}:{node.lineno}: prohibited {node.func.id}()')
                  imported = ''
                  if isinstance(node, ast.ImportFrom):
                      imported = node.module or ''
                  elif isinstance(node, ast.Import):
                      imported = ','.join(alias.name for alias in node.names)
                  if path.is_relative_to(Path('ai_strategy_engine')) and imported.startswith(('freqtrade', 'ai_platform.portal.execution')):
                      failures.append(f'{path}:{node.lineno}: direct execution import {imported}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Security and architecture boundary scans passed')
          PY
