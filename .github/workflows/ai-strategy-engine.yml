name: AI Strategy Engine

on:
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
    paths:
      - ai_strategy_engine/tools/prepare_precommit_files.py
      - .github/workflows/ai-strategy-engine.yml
  pull_request:
    branches:
      - develop
    paths:
      - ai_strategy_engine/tools/prepare_precommit_files.py
      - .github/workflows/ai-strategy-engine.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Export validated pre-commit repair
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Prepare bounded files
        run: |
          python ai_strategy_engine/tools/prepare_precommit_files.py
          python -m pip install --disable-pip-version-check ruff==0.15.21
          ruff check --fix \
            ai_platform/research/strategy_engine/ase00_adapter.py \
            ai_strategy_engine/tests/integration/test_registry_dsl.py \
            ai_strategy_engine/tools/prepare_precommit_files.py

      - name: Run complete repository pre-commit
        id: precommit
        run: |
          python -m pip install --disable-pip-version-check pre-commit
          set +e
          pre-commit run --all-files --show-diff-on-failure > /tmp/pre-commit.log 2>&1
          status=$?
          set -e
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$status" > /tmp/pre-commit.status

      - name: Upload validated files and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ase00-final-precommit-files
          path: |
            ai_platform/research/strategy_engine/ase00_adapter.py
            ai_strategy_engine/tests/integration/test_registry_dsl.py
            tests/ai_platform_integration/__init__.py
            /tmp/pre-commit.log
            /tmp/pre-commit.status
          if-no-files-found: error
          retention-days: 1

      - name: Enforce complete repository pre-commit
        if: steps.precommit.outputs.status != '0'
        run: exit 1
