name: AI Strategy Engine

on:
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
    paths:
      - ai_strategy_engine/tools/prepare_precommit_files.py
      - .github/workflows/ai-strategy-engine.yml
  pull_request:
    branches:
      - develop
    paths:
      - ai_strategy_engine/tools/prepare_precommit_files.py
      - .github/workflows/ai-strategy-engine.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Commit validated pre-commit repair
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Prepare and validate bounded files
        run: |
          python -m pip install --disable-pip-version-check \
            pre-commit ruff==0.15.21
          python ai_strategy_engine/tools/prepare_precommit_files.py
          ruff check --fix \
            ai_platform/research/strategy_engine/ase00_adapter.py \
            ai_strategy_engine/tests/integration/test_registry_dsl.py \
            ai_strategy_engine/tools/prepare_precommit_files.py
          ruff format \
            ai_platform/research/strategy_engine/ase00_adapter.py \
            ai_strategy_engine/tests/integration/test_registry_dsl.py \
            ai_strategy_engine/tools/prepare_precommit_files.py
          pre-commit run --all-files --show-diff-on-failure

      - name: Commit validated bounded repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/research/strategy_engine/ase00_adapter.py \
            ai_strategy_engine/tests/integration/test_registry_dsl.py \
            tests/ai_platform_integration/__init__.py
          git diff --cached --quiet && exit 1
          git commit -m "fix(ai-strategy): satisfy repository pre-commit"
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
