name: AI Strategy Engine

on:
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
    paths:
      - ai_strategy_engine/**
      - ai_platform/research/strategy_engine/**
      - tests/ai_platform_integration/**
      - .github/workflows/ai-strategy-engine.yml
  pull_request:
    branches:
      - develop
    paths:
      - ai_strategy_engine/**
      - ai_platform/research/strategy_engine/**
      - tests/ai_platform_integration/**
      - .github/workflows/ai-strategy-engine.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: ASE-00 complete validation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Prepare bounded repository fixes
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.21
          printf '%s\n' '"""AI Platform integration tests."""' \
            > tests/ai_platform_integration/__init__.py
          python - <<'PY'
          from pathlib import Path

          test_path = Path('ai_strategy_engine/tests/integration/test_registry_dsl.py')
          text = test_path.read_text(encoding='utf-8')
          old = 'from pathlib import Path\n\nimport pytest'
          if text.count(old) != 1:
              raise SystemExit('test import anchor mismatch')
          text = text.replace(
              old,
              'from pathlib import Path\nfrom typing import cast\n\nimport pytest',
              1,
          )
          old = '    features = list(document["features"])  # type: ignore[arg-type]'
          if text.count(old) != 2:
              raise SystemExit('test features anchor mismatch')
          text = text.replace(
              old,
              '    features = [\n'
              '        dict(feature)\n'
              '        for feature in cast(list[dict[str, object]], document["features"])\n'
              '    ]',
          )
          old = (
              '    features[0] = {**features[0], "timeframe": "1h"}  '
              '# type: ignore[arg-type]'
          )
          if text.count(old) != 1:
              raise SystemExit('test spread anchor mismatch')
          text = text.replace(
              old,
              '    features[0] = {**features[0], "timeframe": "1h"}',
              1,
          )
          test_path.write_text(text, encoding='utf-8')

          adapter_path = Path('ai_platform/research/strategy_engine/ase00_adapter.py')
          text = adapter_path.read_text(encoding='utf-8')
          old = '''            columns = (
                "squeeze_ratio",
                "squeeze_state",
                "squeeze_duration",
                "bars_since_release",
                "linreg_momentum",
                "momentum_slope",
                "momentum_acceleration",
            )
            value = _row_mapping(squeeze, -1, columns)
'''
          if text.count(old) != 1:
              raise SystemExit('squeeze columns anchor mismatch')
          text = text.replace(old, old.replace('columns', 'squeeze_columns'), 1)
          old = '_row_mapping(squeeze, -2, columns)'
          if text.count(old) != 1:
              raise SystemExit('squeeze previous anchor mismatch')
          text = text.replace(old, '_row_mapping(squeeze, -2, squeeze_columns)', 1)
          old = '''            columns = (
                "supertrend_band",
                "supertrend_direction",
                "supertrend_flip",
                "supertrend_distance_atr",
            )
            value = _row_mapping(supertrend, -1, columns)
'''
          if text.count(old) != 1:
              raise SystemExit('supertrend columns anchor mismatch')
          text = text.replace(old, old.replace('columns', 'supertrend_columns'), 1)
          old = '_row_mapping(supertrend, -2, columns)'
          if text.count(old) != 1:
              raise SystemExit('supertrend prior anchor mismatch')
          text = text.replace(old, '_row_mapping(supertrend, -2, supertrend_columns)', 1)
          adapter_path.write_text(text, encoding='utf-8')
          PY
          ruff check --fix \
            ai_platform/research/strategy_engine/ase00_adapter.py \
            ai_strategy_engine/tests/integration/test_registry_dsl.py

      - name: Validate repository pre-commit
        run: |
          python -m pip install --disable-pip-version-check pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Upload validated bounded files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ase00-final-precommit-files
          path: |
            ai_platform/research/strategy_engine/ase00_adapter.py
            ai_strategy_engine/tests/integration/test_registry_dsl.py
            tests/ai_platform_integration/__init__.py
          if-no-files-found: error
          retention-days: 1

      - name: Install development dependencies
        working-directory: ai_strategy_engine
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "SQLAlchemy>=2.0.6" "fastapi>=0.115"

      - name: Run package tests
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          pytest -q

      - name: Run Ruff
        run: |
          . ai_strategy_engine/.venv/bin/activate
          ruff check ai_strategy_engine ai_platform/research/strategy_engine \
            tests/ai_platform_integration/test_ase00_vertical_slice.py

      - name: Run mypy
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          mypy src/strategy_engine

      - name: Compile source and tests
        run: |
          . ai_strategy_engine/.venv/bin/activate
          python -m compileall -q ai_strategy_engine/src ai_strategy_engine/tests \
            ai_platform/research/strategy_engine

      - name: Validate deterministic repository E2E
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/ai_strategy_engine/src"
        run: |
          . ai_strategy_engine/.venv/bin/activate
          pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration \
            tests/ai_platform_integration/test_ase00_vertical_slice.py

      - name: Validate JSON YAML and JSON Schema examples
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          import jsonschema
          import yaml

          root = Path('.')
          for path in sorted(root.rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
          yaml_paths = sorted(root.rglob('*.yaml')) + sorted(root.rglob('*.yml'))
          for path in yaml_paths:
              yaml.safe_load(path.read_text(encoding='utf-8'))
          mappings = {
              'examples/feature_record.json': 'schemas/feature-record.v1.schema.json',
              'examples/signal_event.json': 'schemas/signal-event.v1.schema.json',
              'examples/strategy_classic.json': 'schemas/strategy-definition.v1.schema.json',
              'examples/strategy_liquidation.json': 'schemas/strategy-definition.v1.schema.json',
              'examples/strategy_miyagi_ensemble_research.json': 'schemas/strategy-definition.v1.schema.json',
              'examples/strategy_bonsai_research.json': 'schemas/strategy-definition.v1.schema.json',
          }
          for example_name, schema_name in mappings.items():
              example = json.loads((root / example_name).read_text(encoding='utf-8'))
              schema = json.loads((root / schema_name).read_text(encoding='utf-8'))
              jsonschema.Draft202012Validator.check_schema(schema)
              jsonschema.validate(example, schema)
          PY

      - name: Verify materialization evidence and required paths
        working-directory: ai_strategy_engine
        run: |
          test -f configs/feature_registry.v1.yaml
          test -f configs/search_spaces.v1.yaml
          test -f configs/miyagi_parameter_map.v1.yaml
          test -d schemas
          test -d examples
          test -d src/strategy_engine
          test -d tests
          test -d docs
          grep -Fq '73a0d99cab94ba116818a6aef9d818a710fb048a4c0b77f89b9819dd9ac7332f' docs/materialization-evidence.md
          grep -Fq 'status: `complete`' docs/materialization-evidence.md

      - name: Scan secrets prohibited code and architecture boundaries
        run: |
          . ai_strategy_engine/.venv/bin/activate
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          import subprocess
          from pathlib import Path

          roots = [
              Path('ai_strategy_engine/src'),
              Path('ai_strategy_engine/tests'),
              Path('ai_strategy_engine/configs'),
              Path('ai_strategy_engine/examples'),
              Path('ai_platform/research/strategy_engine'),
              Path('tests/ai_platform_integration/test_ase00_vertical_slice.py'),
          ]
          suffixes = {'.py', '.json', '.yaml', '.yml', '.toml'}
          text_files = [
              path
              for root in roots
              for path in ([root] if root.is_file() else root.rglob('*'))
              if path.is_file() and path.suffix.lower() in suffixes
          ]
          secret_patterns = {
              'private key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'AWS access key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'GitHub token': re.compile(r'gh[pousr]_[A-Za-z0-9_]{30,}'),
              'OpenAI key': re.compile(r'sk-[A-Za-z0-9]{32,}'),
          }
          failures: list[str] = []
          for path in text_files:
              text = path.read_text(encoding='utf-8')
              if 'luxalgo' in text.lower():
                  failures.append(f'{path}: prohibited LuxAlgo runtime reference')
              for label, pattern in secret_patterns.items():
                  if pattern.search(text):
                      failures.append(f'{path}: possible {label}')
              if path.suffix != '.py':
                  continue
              tree = ast.parse(text, filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                      if node.func.id in {'eval', 'exec'}:
                          failures.append(f'{path}:{node.lineno}: prohibited {node.func.id}()')
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.startswith(('freqtrade', 'ai_platform.portal.execution')):
                              failures.append(f'{path}:{node.lineno}: direct execution import {alias.name}')
                  if isinstance(node, ast.ImportFrom):
                      imported = node.module or ''
                      if imported.startswith(('freqtrade', 'ai_platform.portal.execution')):
                          failures.append(f'{path}:{node.lineno}: direct execution import {imported}')
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/develop...HEAD'],
              text=True,
          ).splitlines()
          browser_changes = [path for path in changed if path.startswith('ai_platform/portal/web/')]
          if browser_changes:
              failures.append(f'Browser paths changed by ASE-00: {browser_changes}')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
