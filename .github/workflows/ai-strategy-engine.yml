name: AI Strategy Engine

on:
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
    paths:
      - .github/workflows/ai-strategy-engine.yml
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ai-strategy-engine.yml

permissions:
  contents: write

jobs:
  capture-ai-platform-ruff:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0

      - name: Install exact Ruff version
        run: python -m pip install --disable-pip-version-check ruff==0.15.21

      - name: Capture exact AI Platform Ruff output
        run: |
          set +e
          ruff check ai_platform tests/ai_platform > /tmp/ai-platform-ruff.txt 2>&1
          status=$?
          set -e
          {
            echo '# AI Platform Ruff report'
            echo
            echo "- command: \`ruff check ai_platform tests/ai_platform\`"
            echo "- exit code: \`$status\`"
            echo
            echo '```text'
            cat /tmp/ai-platform-ruff.txt
            echo '```'
          } > ai_strategy_engine/docs/ai-platform-ruff-report.md

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_strategy_engine/docs/ai-platform-ruff-report.md
          git commit -m "docs(ai-platform): record exact Ruff finding"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
