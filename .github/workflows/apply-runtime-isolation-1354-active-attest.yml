name: Apply runtime isolation 1354 active attestation repair

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/apply-runtime-isolation-1354-active-attest.yml"

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 1464 &&
      github.event.pull_request.head.ref == 'fix/portal-runtime-isolation-1354' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/portal-runtime-isolation-1354
          persist-credentials: true
      - name: Apply active-policy re-attestation repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          driver = 'ai_platform/portal/execution/driver.py'
          replace_once(driver, '''    def attest_network(\n        self,\n        plan: RuntimeIsolationPlan,\n        network_name: str,\n        runtime_id: str,\n    ) -> None: ...\n\n    def cleanup_network''', '''    def attest_network(\n        self,\n        plan: RuntimeIsolationPlan,\n        network_name: str,\n        runtime_id: str,\n    ) -> None: ...\n\n    def attest_active_network(\n        self,\n        plan: RuntimeIsolationPlan,\n        network_name: str,\n        runtime_id: str,\n    ) -> None: ...\n\n    def cleanup_network''')
          replace_once(driver, '''                self._reattest_before_release(runtime_id)\n            except Exception:\n                self._cleanup_failed_runtime(runtime_id, network)\n                raise\n            return current\n''', '''                self._reattest_before_release(runtime_id, active_network=True)\n            except Exception:\n                self._cleanup_failed_runtime(runtime_id, network)\n                raise\n            return current\n''')
          replace_once(driver, '''    def _reattest_before_release(self, runtime_id: str) -> None:\n''', '''    def _reattest_before_release(\n        self, runtime_id: str, *, active_network: bool = False\n    ) -> None:\n''')
          replace_once(driver, '''        self._attest_gateway(plan)\n        self._attest_structural(spec, plan, network)\n        self._attest_effective(spec, plan, network)\n        self._external.activate_network(plan, network, runtime_id)\n''', '''        self._attest_gateway(plan)\n        self._attest_structural(spec, plan, network)\n        self._attest_effective(spec, plan, network, active_network=active_network)\n        if not active_network:\n            self._external.activate_network(plan, network, runtime_id)\n''')
          replace_once(driver, '''    def _attest_effective(\n        self,\n        spec: RuntimeContainerSpec,\n        plan: RuntimeIsolationPlan,\n        network: str,\n    ) -> None:\n''', '''    def _attest_effective(\n        self,\n        spec: RuntimeContainerSpec,\n        plan: RuntimeIsolationPlan,\n        network: str,\n        *,\n        active_network: bool = False,\n    ) -> None:\n''')
          replace_once(driver, '''        self._external.attest_storage(plan, spec.state_path)\n        self._external.attest_network(plan, network, spec.runtime_id)\n''', '''        self._external.attest_storage(plan, spec.state_path)\n        if active_network:\n            self._external.attest_active_network(plan, network, spec.runtime_id)\n        else:\n            self._external.attest_network(plan, network, spec.runtime_id)\n''')

          host = 'ai_platform/portal/execution/host_isolation.py'
          old = '''    def attest_network(\n        self,\n        plan: RuntimeIsolationPlan,\n        network_name: str,\n        runtime_id: str,\n    ) -> None:\n        policy = self._policy_for(plan)\n        network = self._network_info(network_name)\n        if bool(network.get("EnableIPv6", False)):\n            raise RuntimeDriverError(\n                "ISOLATION_ATTESTATION_FAILED",\n                "generation network unexpectedly enables IPv6",\n            )\n        labels = network.get("Labels") or {}\n        if not isinstance(labels, dict) or labels.get("ai.portal.runtime_id") != runtime_id:\n            raise RuntimeDriverError(\n                "ISOLATION_ATTESTATION_FAILED",\n                "generation network identity label does not match runtime",\n            )\n        self._attest_network_members(network, plan, runtime_id)\n        table = self._table_name(network_name)\n        result = self._runner.run(("nft", "-j", "list", "table", "inet", table))\n        if result.returncode != 0:\n            self._raise_command(\n                "HOST_NETWORK_ISOLATION_UNSUPPORTED",\n                result,\n                "nftables generation policy is unavailable",\n            )\n        try:\n            payload = json.loads(result.stdout)\n        except json.JSONDecodeError as exc:\n            raise RuntimeDriverError(\n                "ISOLATION_ATTESTATION_FAILED",\n                "nftables generation policy evidence is invalid JSON",\n            ) from exc\n        self._attest_canonical_nftables(payload, table, self._bridge_name(network), policy)\n'''
          new = '''    def attest_network(\n        self,\n        plan: RuntimeIsolationPlan,\n        network_name: str,\n        runtime_id: str,\n    ) -> None:\n        self._attest_network_state(plan, network_name, runtime_id, active=False)\n\n    def attest_active_network(\n        self,\n        plan: RuntimeIsolationPlan,\n        network_name: str,\n        runtime_id: str,\n    ) -> None:\n        self._attest_network_state(plan, network_name, runtime_id, active=True)\n\n    def _attest_network_state(\n        self,\n        plan: RuntimeIsolationPlan,\n        network_name: str,\n        runtime_id: str,\n        *,\n        active: bool,\n    ) -> None:\n        policy = self._policy_for(plan)\n        network = self._network_info(network_name)\n        if bool(network.get("EnableIPv6", False)):\n            raise RuntimeDriverError(\n                "ISOLATION_ATTESTATION_FAILED",\n                "generation network unexpectedly enables IPv6",\n            )\n        labels = network.get("Labels") or {}\n        if not isinstance(labels, dict) or labels.get("ai.portal.runtime_id") != runtime_id:\n            raise RuntimeDriverError(\n                "ISOLATION_ATTESTATION_FAILED",\n                "generation network identity label does not match runtime",\n            )\n        self._attest_network_members(network, plan, runtime_id)\n        table = self._table_name(network_name)\n        result = self._runner.run(("nft", "-j", "list", "table", "inet", table))\n        if result.returncode != 0:\n            self._raise_command(\n                "HOST_NETWORK_ISOLATION_UNSUPPORTED",\n                result,\n                "nftables generation policy is unavailable",\n            )\n        try:\n            payload = json.loads(result.stdout)\n        except json.JSONDecodeError as exc:\n            raise RuntimeDriverError(\n                "ISOLATION_ATTESTATION_FAILED",\n                "nftables generation policy evidence is invalid JSON",\n            ) from exc\n        self._attest_canonical_nftables(\n            payload, table, self._bridge_name(network), policy, active=active\n        )\n'''
          replace_once(host, old, new)

          tests = 'tests/ai_platform/portal/execution/test_driver.py'
          replace_once(tests, '''        self.attested_networks: list[str] = []\n        self.activated_networks: list[str] = []\n''', '''        self.attested_networks: list[str] = []\n        self.attested_active_networks: list[str] = []\n        self.activated_networks: list[str] = []\n''')
          replace_once(tests, '''    def cleanup_network(self, network_name: str, runtime_id: str) -> None:\n        assert runtime_id == "runtime-1"\n        self.cleaned.append(network_name)\n''', '''    def attest_active_network(\n        self,\n        plan: RuntimeIsolationPlan,\n        network_name: str,\n        runtime_id: str,\n    ) -> None:\n        assert runtime_id == "runtime-1"\n        assert plan.market_data_egress_policy_version == "public-data-v1"\n        self.attested_active_networks.append(network_name)\n\n    def cleanup_network(self, network_name: str, runtime_id: str) -> None:\n        assert runtime_id == "runtime-1"\n        self.cleaned.append(network_name)\n''')
          replace_once(tests, '''    assert driver.start(spec.runtime_id) is DriverRuntimeState.RUNNING\n    assert attestor.attested_networks == [_network()]\n    assert attestor.activated_networks == [_network()]\n''', '''    assert driver.start(spec.runtime_id) is DriverRuntimeState.RUNNING\n    assert attestor.attested_networks == []\n    assert attestor.attested_active_networks == [_network()]\n    assert attestor.activated_networks == []\n''')

          e2e = 'tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py'
          replace_once(e2e, '''        assert public_data.returncode == 0, public_data.stdout + public_data.stderr\n        assert PAPER_E2E_PAIR in public_data.stdout\n\n        network_info = backend._network_info(network)\n''', '''        assert public_data.returncode == 0, public_data.stdout + public_data.stderr\n        assert PAPER_E2E_PAIR in public_data.stdout\n\n        for _ in range(40):\n            state = driver.inspect(runtime_id)\n            if state is DriverRuntimeState.RUNNING:\n                break\n            assert state is DriverRuntimeState.STARTING\n            time.sleep(0.25)\n        else:\n            pytest.fail("released PAPER runtime did not reach application readiness")\n        assert driver.start(runtime_id) is DriverRuntimeState.RUNNING\n\n        network_info = backend._network_info(network)\n''')
          PY
          python -m compileall -q ai_platform/portal/execution tests/ai_platform/portal/execution
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py tests/ai_platform/portal/execution/test_driver.py tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
          git diff --cached --check
          git commit -m "fix(portal): attest active policy for running runtimes"
          git push origin HEAD:fix/portal-runtime-isolation-1354
