name: Apply runtime isolation 1354 code repair

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/apply-runtime-isolation-1354-code-repair.yml"

permissions:
  contents: write

jobs:
  apply-repair:
    if: >-
      github.event.pull_request.number == 1464 &&
      github.event.pull_request.head.ref == 'fix/portal-runtime-isolation-1354' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/portal-runtime-isolation-1354
          persist-credentials: true

      - name: Apply exact bounded code repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          driver = "ai_platform/portal/execution/driver.py"
          replace_once(driver, '    _RELEASE_FILE = f"{_RELEASE_DIR}/release"\n    _LOG_PROBE_READY = f"{_RELEASE_DIR}/log-probe-ready"\n', '    _RELEASE_FILE = f"{_RELEASE_DIR}/release"\n    _APPLICATION_READY_FILE = f"{_RELEASE_DIR}/application-ready"\n    _LOG_PROBE_READY = f"{_RELEASE_DIR}/log-probe-ready"\n')
          replace_once(driver, '''        if current is DriverRuntimeState.RUNNING:\n            if runtime_id not in self._released:\n                self._release_forbidden("running runtime has no current release evidence")\n            return current\n''', '''        if current is DriverRuntimeState.RUNNING:\n            if runtime_id not in self._released:\n                self._release_forbidden("running runtime has no current release evidence")\n            network = self._networks.get(runtime_id, self._network_name(runtime_id))\n            try:\n                self._reattest_before_release(runtime_id)\n            except Exception:\n                self._cleanup_failed_runtime(runtime_id, network)\n                raise\n            return current\n''')
          replace_once(driver, '''            return DriverRuntimeState.RUNNING\n        if current is DriverRuntimeState.STOPPED:\n''', '''            return DriverRuntimeState.STARTING\n        if current is DriverRuntimeState.STOPPED:\n''')
          replace_once(driver, '''            if gate.returncode == 0:\n                return DriverRuntimeState.RUNNING\n            if gate.returncode == 1:\n                return DriverRuntimeState.CREATED\n''', '''            if gate.returncode == 0:\n                ready = self._runner.run(("docker", "exec", runtime_id, "test", "-f", self._APPLICATION_READY_FILE))\n                if ready.returncode == 0:\n                    return DriverRuntimeState.RUNNING\n                if ready.returncode == 1:\n                    return DriverRuntimeState.STARTING\n                raise RuntimeDriverError(\n                    "ISOLATION_ATTESTATION_FAILED",\n                    ready.stderr.strip() or "application readiness state is unreadable",\n                )\n            if gate.returncode == 1:\n                return DriverRuntimeState.CREATED\n''')

          quarantine = "ai_platform/portal/execution/runtime_image/portal-runtime-quarantine"
          replace_once(quarantine, 'release_file="$release_dir/release"\nlog_probe_ready="$release_dir/log-probe-ready"\n', 'release_file="$release_dir/release"\napplication_ready="$release_dir/application-ready"\nlog_probe_ready="$release_dir/log-probe-ready"\n')
          replace_once(quarantine, '''exec "$@"\n''', '''child_pid=""\nforward_signal() {\n    if [ -n "$child_pid" ]; then\n        kill -TERM "$child_pid" 2>/dev/null || true\n    fi\n}\ntrap forward_signal TERM INT HUP\n\n"$@" &\nchild_pid=$!\ni=0\nwhile [ "$i" -lt 20 ]; do\n    if ! kill -0 "$child_pid" 2>/dev/null; then\n        set +e\n        wait "$child_pid"\n        status=$?\n        set -e\n        exit "$status"\n    fi\n    i=$((i + 1))\n    sleep 0.1\ndone\n: > "$application_ready"\nset +e\nwait "$child_pid"\nstatus=$?\nset -e\nexit "$status"\n''')

          e2e = "tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py"
          replace_once(e2e, '                    info[4][0]\n', '                    str(info[4][0])\n')
          replace_once(e2e, '    except socket.gaierror as exc:\n        pytest.fail(f"{hostname}: DNS failed: {exc}")\n\n\ndef _reachable_ipv4', '    except socket.gaierror as exc:\n        pytest.fail(f"{hostname}: DNS failed: {exc}")\n        raise AssertionError("unreachable") from exc\n\n\ndef _reachable_ipv4')
          replace_once(e2e, '    pytest.fail("no reachable public IPv4 E2E probe target: " + "; ".join(failures))\n\n\ndef _reachable_market_data_ipv4', '    pytest.fail("no reachable public IPv4 E2E probe target: " + "; ".join(failures))\n    raise AssertionError("unreachable")\n\n\ndef _reachable_market_data_ipv4')
          replace_once(e2e, '    pytest.fail("market-data endpoint has no reachable IPv4: " + "; ".join(failures))\n\n\ndef _policy', '    pytest.fail("market-data endpoint has no reachable IPv4: " + "; ".join(failures))\n    raise AssertionError("unreachable")\n\n\ndef _policy')
          replace_once(e2e, '            "--label",\n            f"ai.portal.runtime_id={runtime_id}",\n            "--label",\n            f"ai.portal.isolation_plan_digest={plan.digest()}",\n', '            "--label",\n            "ai.portal.test=runtime-isolation-e2e",\n            "--label",\n            f"ai.portal.runtime_id={runtime_id}",\n            "--label",\n            f"ai.portal.isolation_plan_digest={plan.digest()}",\n')

          tests = "tests/ai_platform/portal/execution/test_driver.py"
          replace_once(tests, '    assert driver.start("runtime-1") is DriverRuntimeState.RUNNING\n    assert len(attestor.attested_networks) == initial_attest_count + 1\n', '    assert driver.start("runtime-1") is DriverRuntimeState.STARTING\n    assert len(attestor.attested_networks) == initial_attest_count + 1\n')
          marker = '\ndef test_paused_foreign_runtime_cannot_be_released() -> None:\n'
          addition = '''\ndef test_released_runtime_is_starting_until_application_ready() -> None:\n    runner = _Runner(\n        CommandResult(0, stdout="running\\n"),\n        CommandResult(0),\n        CommandResult(1),\n    )\n    assert DockerCliRuntimeDriver(runner).inspect("runtime-1") is DriverRuntimeState.STARTING\n\n\ndef test_running_generation_repeats_current_isolation_attestation(tmp_path: Path) -> None:\n    plan = _plan()\n    spec = _spec(tmp_path)\n    runner = _Runner(\n        CommandResult(0, stdout="running\\n"),\n        CommandResult(0),\n        CommandResult(0),\n        *_reattest_results(spec, plan),\n    )\n    attestor = _Attestor()\n    driver = DockerCliRuntimeDriver(runner, isolation_plans=_provider(plan), external_attestor=attestor, gateway_attestor=attestor)\n    driver._attested.add(spec.runtime_id)\n    driver._released.add(spec.runtime_id)\n    driver._fingerprints[spec.runtime_id] = driver._fingerprint(spec, plan.digest())\n    driver._networks[spec.runtime_id] = _network()\n    driver._specs[spec.runtime_id] = spec\n    driver._plan_digests[spec.runtime_id] = plan.digest()\n\n    assert driver.start(spec.runtime_id) is DriverRuntimeState.RUNNING\n    assert attestor.attested_networks == [_network()]\n    assert attestor.activated_networks == [_network()]\n\n\ndef test_running_generation_tamper_fails_closed_and_removes_runtime(tmp_path: Path) -> None:\n    plan = _plan()\n    spec = _spec(tmp_path)\n    tampered = _inspect(spec, plan)\n    host = tampered["HostConfig"]\n    assert isinstance(host, dict)\n    host["Privileged"] = True\n    runner = _Runner(\n        CommandResult(0, stdout="running\\n"),\n        CommandResult(0),\n        CommandResult(0),\n        CommandResult(0, stdout=json.dumps([tampered])),\n        CommandResult(0),\n    )\n    attestor = _Attestor()\n    driver = DockerCliRuntimeDriver(runner, isolation_plans=_provider(plan), external_attestor=attestor, gateway_attestor=attestor)\n    driver._attested.add(spec.runtime_id)\n    driver._released.add(spec.runtime_id)\n    driver._fingerprints[spec.runtime_id] = driver._fingerprint(spec, plan.digest())\n    driver._networks[spec.runtime_id] = _network()\n    driver._specs[spec.runtime_id] = spec\n    driver._plan_digests[spec.runtime_id] = plan.digest()\n\n    with pytest.raises(RuntimeDriverError) as exc_info:\n        driver.start(spec.runtime_id)\n\n    assert exc_info.value.reason_code == "ISOLATION_ATTESTATION_FAILED"\n    assert attestor.cleaned == [_network()]\n    assert runner.calls[-1] == ("docker", "rm", "-f", spec.runtime_id)\n\n'''
          replace_once(tests, marker, addition + marker)
          PY
          python -m compileall -q ai_platform/portal/execution tests/ai_platform/portal/execution
          git diff --check

      - name: Commit and push repaired code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/portal/execution/driver.py \
            ai_platform/portal/execution/runtime_image/portal-runtime-quarantine \
            tests/ai_platform/portal/execution/test_driver.py \
            tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
          git diff --cached --check
          git commit -m "fix(portal): close final runtime isolation code gaps"
          git push origin HEAD:fix/portal-runtime-isolation-1354
