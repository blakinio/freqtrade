name: Apply runtime isolation 1354 E2E state repair

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/apply-runtime-isolation-1354-e2e-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 1464 &&
      github.event.pull_request.head.ref == 'fix/portal-runtime-isolation-1354' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/portal-runtime-isolation-1354
          persist-credentials: true
      - name: Patch exact E2E state transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py')
          text = path.read_text(encoding='utf-8')
          old = '''        assert driver.start(runtime_id) is DriverRuntimeState.RUNNING\n\n        public_data = _run(\n'''
          new = '''        assert driver.start(runtime_id) is DriverRuntimeState.STARTING\n\n        public_data = _run(\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one start assertion target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m compileall -q tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
          git diff --cached --check
          git commit -m "test(portal): require starting state after release"
          git push origin HEAD:fix/portal-runtime-isolation-1354
