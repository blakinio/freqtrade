name: Apply Runtime Isolation 1354 Repair

on:
  push:
    branches:
      - fix/portal-runtime-isolation-1354
    paths:
      - .github/workflows/apply-runtime-isolation-1354-repair.yml

permissions:
  contents: write
  issues: read

jobs:
  apply-repair:
    if: ${{ !contains(github.event.head_commit.message, '[applied-1354-codex-patch]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/portal-runtime-isolation-1354
          fetch-depth: 3

      - name: Apply verified Codex repair payload excluding workflow file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: b3592478cdb03a64e4fdb1a9af6350569d0d3e26
          COMMENT_ID: '5257126241'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/apply-runtime-isolation-1354-repair.yml"

          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq .body > /tmp/comment.md
          python - <<'PY'
          from pathlib import Path
          import re

          body = Path('/tmp/comment.md').read_text(encoding='utf-8')
          marker = '### Complete unified diff against `718ce7140f15810e1ade7b2e07dd17cef3565ce3`'
          if marker not in body:
              raise SystemExit('expected exact-base diff marker missing')
          tail = body.split(marker, 1)[1]
          match = re.search(r'```diff\n(.*?)\n```', tail, flags=re.S)
          if not match:
              raise SystemExit('complete diff fence missing')
          patch = match.group(1) + '\n'
          Path('/tmp/repair.diff').write_text(patch, encoding='utf-8')
          PY

          git apply --check /tmp/repair.diff
          git apply /tmp/repair.diff
          git restore --source=HEAD -- .github/workflows/portal-runtime-isolation-e2e.yml
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_platform/portal/execution/driver.py \
            tests/ai_platform/portal/execution/test_driver.py \
            tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py \
            docs/agents/tasks/active/FTAI-20260809-portal-runtime-isolation-1354.md
          git diff --cached --check
          git commit -m 'fix(portal): close remaining runtime isolation gaps (#1354) [applied-1354-codex-patch]'
          git push origin HEAD:fix/portal-runtime-isolation-1354
