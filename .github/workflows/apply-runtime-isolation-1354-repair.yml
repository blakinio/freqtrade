name: Apply Runtime Isolation 1354 Repair

on:
  push:
    branches:
      - fix/portal-runtime-isolation-1354
    paths:
      - .github/workflows/apply-runtime-isolation-1354-repair.yml

permissions:
  contents: write
  issues: read

jobs:
  materialize-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/portal-runtime-isolation-1354
          fetch-depth: 2

      - name: Materialize final retained workflow as ordinary file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: 0c3d5a862ecd487e015bef9b37fdf958473602ea
          COMMENT_ID: '5257126241'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/apply-runtime-isolation-1354-repair.yml"
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq .body > /tmp/comment.md
          python - <<'PY'
          from pathlib import Path
          import re

          body = Path('/tmp/comment.md').read_text(encoding='utf-8')
          marker = '### Complete unified diff against `718ce7140f15810e1ade7b2e07dd17cef3565ce3`'
          tail = body.split(marker, 1)[1]
          match = re.search(r'```diff\n(.*?)\n```', tail, flags=re.S)
          if not match:
              raise SystemExit('complete diff fence missing')
          Path('/tmp/repair.diff').write_text(match.group(1) + '\n', encoding='utf-8')
          PY
          git apply --check --include=.github/workflows/portal-runtime-isolation-e2e.yml /tmp/repair.diff
          git apply --include=.github/workflows/portal-runtime-isolation-e2e.yml /tmp/repair.diff
          mkdir -p docs/agents/evidence
          cp .github/workflows/portal-runtime-isolation-e2e.yml docs/agents/evidence/FTAI-1354-portal-runtime-isolation-e2e.final.yml
          git restore --source=HEAD -- .github/workflows/portal-runtime-isolation-e2e.yml
          git add docs/agents/evidence/FTAI-1354-portal-runtime-isolation-e2e.final.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(portal): materialize final #1354 workflow content'
          git push origin HEAD:fix/portal-runtime-isolation-1354
