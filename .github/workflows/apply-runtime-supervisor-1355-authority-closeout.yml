name: Apply runtime supervisor 1355 authority closeout

on:
  pull_request:
    branches:
      - develop
    types: [synchronize]
    paths:
      - ".github/workflows/apply-runtime-supervisor-1355-authority-closeout.yml"
      - "tools/agents/apply_1355_authority_closeout.py"
      - "tools/agents/run_1355_authority_closeout.py"

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-closeout:
    if: github.event.pull_request.number == 1496 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install focused validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1 jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6"
          "httpx>=0.24.1" fastapi pyjwt cryptography "PyYAML>=6.0" ruff mypy

      - name: Normalize stale helper cardinality
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/agents/apply_1355_authority_closeout.py")
          text = path.read_text(encoding="utf-8")
          old = 'if text.count(old) != 2:\n    raise SystemExit(f"expected two inode readiness loops, got {text.count(old)}")'
          new = 'if text.count(old) != 1:\n    raise SystemExit(f"expected one inode readiness loop, got {text.count(old)}")'
          if text.count(old) != 1:
              raise SystemExit("stale readiness cardinality target not unique")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply reviewed closeout repair
        run: python tools/agents/run_1355_authority_closeout.py

      - name: Close pause ownership and private-read fixture gaps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          driver_path = Path("ai_platform/portal/execution/driver.py")
          text = driver_path.read_text(encoding="utf-8")
          old = '''        if current is DriverRuntimeState.RUNNING:\n            self._require_success(("docker", "pause", runtime_id), "DOCKER_PAUSE_FAILED")\n            return DriverRuntimeState.PAUSED\n'''
          new = '''        if current is DriverRuntimeState.RUNNING:\n            container_id = self._owned_container_id(runtime_id)\n            if container_id is None:\n                raise RuntimeDriverError("RUNTIME_MISSING", "runtime container does not exist")\n            self._require_success(("docker", "pause", container_id), "DOCKER_PAUSE_FAILED")\n            return DriverRuntimeState.PAUSED\n'''
          if text.count(old) != 1:
              raise SystemExit("pause ownership patch target not unique")
          driver_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/ai_platform/portal/execution/test_driver.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''def test_stop_preserves_foreign_container_reusing_runtime_name() -> None:\n'''
          if tests.count(marker) != 1:
              raise SystemExit("pause ownership test insertion marker not unique")
          addition = '''def test_pause_preserves_foreign_container_reusing_runtime_name(tmp_path: Path) -> None:\n    spec = _spec(tmp_path)\n    runner = _Runner(\n        CommandResult(0, stdout="running\\n"),\n        CommandResult(0),\n        CommandResult(0),\n        CommandResult(\n            0,\n            stdout=json.dumps(\n                {\n                    "Id": "foreign-container-id",\n                    "Config": {"Labels": {"ai.portal.runtime_id": "runtime-other"}},\n                }\n            ),\n        ),\n    )\n    driver = DockerCliRuntimeDriver(runner)\n    driver._specs[spec.runtime_id] = spec\n\n    with pytest.raises(RuntimeDriverError) as exc_info:\n        driver.pause("runtime-1")\n\n    assert exc_info.value.reason_code == "GENERATION_OWNERSHIP_CONFLICT"\n    assert all(call[:2] != ("docker", "pause") for call in runner.calls)\n\n\n'''
          if "test_pause_preserves_foreign_container_reusing_runtime_name" in tests:
              raise SystemExit("pause ownership regression already present")
          test_path.write_text(tests.replace(marker, addition + marker, 1), encoding="utf-8")

          private_path = Path("tests/ai_platform/portal/execution/test_private_read.py")
          private = private_path.read_text(encoding="utf-8")
          old_import = '''from ai_platform.portal.execution.runtime import (\n    DriverRuntimeState,\n    ResolvedRuntimeArtifacts,\n    RuntimeContainerSpec,\n)\nfrom ai_platform.portal.execution.workspace import RuntimeWorkspaceStore\n'''
          new_import = '''from ai_platform.portal.execution.runtime import DriverRuntimeState, ResolvedRuntimeArtifacts\nfrom ai_platform.portal.execution.workspace import RuntimeWorkspaceStore\nfrom ai_platform.portal.runtime_supervisor import (\n    SupervisorOperation,\n    SupervisorOutcome,\n    SupervisorOutcomeCode,\n    SupervisorRequest,\n)\n'''
          if private.count(old_import) != 1:
              raise SystemExit("private-read import target not unique")
          private = private.replace(old_import, new_import, 1)
          start = private.index("class _Driver:\n")
          end = private.index("\n\ndef _bot(", start)
          supervisor = '''class _Supervisor:\n    def __init__(self) -> None:\n        self.states: dict[str, DriverRuntimeState] = {}\n\n    def execute(self, request: SupervisorRequest) -> SupervisorOutcome:\n        current = self.states.get(request.generation_id, DriverRuntimeState.MISSING)\n        if request.operation is SupervisorOperation.ENSURE_PROVISIONED:\n            if current in {DriverRuntimeState.MISSING, DriverRuntimeState.STOPPED}:\n                current = DriverRuntimeState.CREATED\n        elif request.operation is SupervisorOperation.ENSURE_RUNNING:\n            current = DriverRuntimeState.RUNNING\n        elif request.operation is SupervisorOperation.ENSURE_PAUSED:\n            if current is DriverRuntimeState.RUNNING:\n                current = DriverRuntimeState.PAUSED\n        elif request.operation is SupervisorOperation.ENSURE_STOPPED:\n            if current is not DriverRuntimeState.MISSING:\n                current = DriverRuntimeState.STOPPED\n        elif request.operation is SupervisorOperation.ENSURE_RETIRED:\n            current = DriverRuntimeState.MISSING\n        self.states[request.generation_id] = current\n        code = (\n            SupervisorOutcomeCode.OBSERVED\n            if request.operation is SupervisorOperation.INSPECT_GENERATION\n            else SupervisorOutcomeCode.APPLIED\n        )\n        return SupervisorOutcome(\n            accepted=True,\n            code=code,\n            operation=request.operation,\n            tenant_id=request.tenant_id,\n            bot_id=request.bot_id,\n            generation_id=request.generation_id,\n            generation_spec_digest=request.generation_spec_digest,\n            command_id=request.command_id,\n            correlation_id=request.correlation_id,\n            state=current,\n            state_version=max(1, request.expected_state_version),\n            evidence_digest="e" * 64,\n        )\n'''
          private = private[:start] + supervisor + private[end:]
          private = private.replace(
              ''') -> tuple[FreqtradeExecutionAdapter, _Driver, str]:\n    driver = _Driver()\n''',
              ''') -> tuple[FreqtradeExecutionAdapter, _Supervisor, str]:\n    driver = _Supervisor()\n''',
              1,
          )
          if "_Driver" in private:
              raise SystemExit("stale private-read raw driver fixture remains")
          private = private.replace('driver.states[runtime_id] = DriverRuntimeState.RUNNING', 'driver.states["generation-private-read"] = DriverRuntimeState.RUNNING')
          private = private.replace('driver.states[runtime_id] = DriverRuntimeState.STOPPED', 'driver.states["generation-private-read"] = DriverRuntimeState.STOPPED')
          private_path.write_text(private, encoding="utf-8")
          PY

      - name: Validate focused Supervisor and adapter boundary
        run: >-
          python -m pytest -q -o addopts=''
          --confcutdir=tests/ai_platform
          tests/ai_platform/portal/runtime_supervisor
          tests/ai_platform/portal/execution/test_adapter.py
          tests/ai_platform/portal/execution/test_driver.py
          tests/ai_platform/portal/execution/test_private_read.py
          tests/ai_platform/portal/execution/test_workspace.py

      - name: Validate static checks
        shell: bash
        run: |
          python -m ruff check \
            ai_platform/portal/execution/adapter.py \
            ai_platform/portal/execution/runtime.py \
            ai_platform/portal/execution/driver.py \
            ai_platform/portal/runtime_supervisor \
            tests/ai_platform/portal/execution/test_adapter.py \
            tests/ai_platform/portal/execution/test_driver.py \
            tests/ai_platform/portal/execution/test_private_read.py \
            tests/ai_platform/portal/runtime_supervisor
          python -m mypy \
            ai_platform/portal/execution/adapter.py \
            ai_platform/portal/execution/runtime.py \
            ai_platform/portal/execution/driver.py \
            ai_platform/portal/runtime_supervisor \
            tests/ai_platform/portal/execution/test_adapter.py \
            tests/ai_platform/portal/execution/test_private_read.py \
            tests/ai_platform/portal/runtime_supervisor
          git diff --check

      - name: Remove temporary repair machinery
        shell: bash
        run: |
          rm -f \
            tools/agents/apply_1355_authority_closeout.py \
            tools/agents/run_1355_authority_closeout.py \
            .github/workflows/apply-runtime-supervisor-1355-authority-closeout.yml
          git diff --check

      - name: Commit exact validated repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HEAD_REF" = "codex/portal-runtime-supervisor-1355"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(portal): close runtime supervisor authority gaps"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin "HEAD:$HEAD_REF"
