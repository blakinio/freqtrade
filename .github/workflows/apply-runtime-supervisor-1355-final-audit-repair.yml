name: Apply Runtime Supervisor 1355 Final Audit Repair

on:
  push:
    branches:
      - codex/portal-runtime-supervisor-1355
    paths:
      - .github/workflows/apply-runtime-supervisor-1355-final-audit-repair.yml

permissions:
  contents: write

jobs:
  apply-repair:
    if: ${{ !contains(github.event.head_commit.message, '[applied-1355-final-audit-repair]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/portal-runtime-supervisor-1355
          fetch-depth: 2

      - name: Apply and validate bounded repair
        shell: bash
        env:
          EXPECTED_PARENT: fcb1a0c6f2378e6ea16ad96a770129b12598c032
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/apply-runtime-supervisor-1355-final-audit-repair.yml"
          python tools/agents/run_1355_final_repair.py
          python -m pip install --disable-pip-version-check -q pytest==9.1.1 ruff==0.15.21 mypy==2.3.0 'pydantic>=2.2' 'SQLAlchemy>=2.0.6' 'httpx>=0.24.1' fastapi pyjwt cryptography 'PyYAML>=6.0'
          python -m ruff format ai_platform/portal/execution/runtime.py ai_platform/portal/execution/driver.py ai_platform/portal/runtime_supervisor/service.py ai_platform/portal/runtime_supervisor/types.py tests/ai_platform/portal/execution/test_driver.py tests/ai_platform/portal/runtime_supervisor/test_service.py
          python -m ruff check ai_platform/portal/execution/runtime.py ai_platform/portal/runtime_supervisor/service.py ai_platform/portal/runtime_supervisor/types.py tests/ai_platform/portal/execution/test_driver.py tests/ai_platform/portal/runtime_supervisor/test_service.py
          python -m ruff check --ignore BLE001 ai_platform/portal/execution/driver.py
          python -m mypy ai_platform/portal/execution/runtime.py ai_platform/portal/execution/driver.py ai_platform/portal/runtime_supervisor/service.py ai_platform/portal/runtime_supervisor/types.py
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform tests/ai_platform/portal/runtime_supervisor tests/ai_platform/portal/execution/test_driver.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_platform/portal/execution/runtime.py ai_platform/portal/execution/driver.py ai_platform/portal/runtime_supervisor/service.py ai_platform/portal/runtime_supervisor/types.py tests/ai_platform/portal/execution/test_driver.py tests/ai_platform/portal/runtime_supervisor/test_service.py
          git diff --cached --check
          git commit -m 'fix(portal): close final supervisor audit gaps (#1355) [applied-1355-final-audit-repair]'
          git push origin HEAD:codex/portal-runtime-supervisor-1355
