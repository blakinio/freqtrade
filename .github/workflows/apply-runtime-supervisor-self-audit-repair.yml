name: Apply runtime supervisor self-audit repair

on:
  push:
    branches:
      - codex/portal-runtime-supervisor-1355
    paths:
      - .github/workflows/apply-runtime-supervisor-self-audit-repair.yml

permissions: {}

jobs:
  repair:
    name: Apply bounded ownership and UDS ACL repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Apply audited repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          driver_path = Path("ai_platform/portal/execution/driver.py")
          driver = driver_path.read_text(encoding="utf-8")
          driver = replace_once(
              driver,
              "        self._plan_digests: dict[str, str] = {}\n",
              "        self._plan_digests: dict[str, str] = {}\n        self._container_ids: dict[str, str] = {}\n",
              label="container id registry",
          )
          driver = replace_once(
              driver,
              "            and self._fingerprints.get(runtime_id) == self._fingerprint(spec, plan_digest)\n",
              "            and self._fingerprints.get(runtime_id) == self._fingerprint(spec, plan_digest)\n            and bool(self._container_ids.get(runtime_id))\n",
              label="generation evidence container id",
          )
          driver = replace_once(
              driver,
              "        network = self._network_name(spec.runtime_id)\n        self._external.prepare_storage(plan, spec.state_path)\n",
              "        network = self._network_name(spec.runtime_id)\n        created_container_id: str | None = None\n        self._external.prepare_storage(plan, spec.state_path)\n",
              label="provision immutable id local",
          )
          driver = replace_once(
              driver,
              "            self._require_success(self._create_args(spec, plan, network), \"DOCKER_CREATE_FAILED\")\n            self._attest_structural(spec, plan, network)\n",
              "            create_result = self._require_success(\n                self._create_args(spec, plan, network), \"DOCKER_CREATE_FAILED\"\n            )\n            created_container_id = create_result.stdout.strip()\n            if not created_container_id:\n                raise RuntimeDriverError(\n                    \"DOCKER_CREATE_FAILED\",\n                    \"Docker create did not return an immutable container identity\",\n                )\n            self._attest_structural(spec, plan, network)\n",
              label="capture docker create id",
          )
          driver = replace_once(
              driver,
              "        except Exception:\n            self._cleanup_failed_runtime(spec.runtime_id, network)\n            raise\n\n        self._attested.add(spec.runtime_id)\n",
              "        except Exception:\n            self._cleanup_failed_runtime(\n                spec.runtime_id, network, container_id=created_container_id\n            )\n            raise\n\n        self._attested.add(spec.runtime_id)\n",
              label="provision cleanup immutable id",
          )
          driver = replace_once(
              driver,
              "        self._plan_digests[spec.runtime_id] = binding.isolation_plan_digest\n        return DriverRuntimeState.CREATED\n",
              "        self._plan_digests[spec.runtime_id] = binding.isolation_plan_digest\n        self._container_ids[spec.runtime_id] = created_container_id\n        return DriverRuntimeState.CREATED\n",
              label="persist immutable id",
          )
          old_cleanup = '''    def _cleanup_failed_runtime(self, runtime_id: str, network: str) -> None:\n        errors: list[str] = []\n        try:\n            remove = self._runner.run(("docker", "rm", "-f", runtime_id))\n            if remove.returncode != 0 and "no such" not in remove.stderr.lower():\n                errors.append(remove.stderr.strip() or "docker container cleanup failed")\n        except Exception as exc:  # noqa: BLE001\n            errors.append(f"docker container cleanup raised {type(exc).__name__}: {exc}")\n        try:\n            self._external.cleanup_network(network, runtime_id)\n        except Exception as exc:  # noqa: BLE001\n            errors.append(f"network cleanup raised {type(exc).__name__}: {exc}")\n        finally:\n            self._clear_generation_evidence(runtime_id)\n        if errors:\n            raise RuntimeDriverError(\n                "RUNTIME_CLEANUP_FAILED",\n                "runtime cleanup was incomplete: " + "; ".join(errors),\n            )\n'''
          new_cleanup = '''    def _cleanup_failed_runtime(\n        self,\n        runtime_id: str,\n        network: str,\n        *,\n        container_id: str | None = None,\n    ) -> None:\n        errors: list[str] = []\n        immutable_container_id = container_id or self._container_ids.get(runtime_id)\n        if immutable_container_id is not None:\n            try:\n                remove = self._runner.run(("docker", "rm", "-f", immutable_container_id))\n                if remove.returncode != 0 and "no such" not in remove.stderr.lower():\n                    errors.append(remove.stderr.strip() or "docker container cleanup failed")\n            except Exception as exc:  # noqa: BLE001\n                errors.append(f"docker container cleanup raised {type(exc).__name__}: {exc}")\n        elif runtime_id in self._attested or runtime_id in self._specs:\n            errors.append("immutable container identity is unavailable; refusing name-based cleanup")\n        try:\n            self._external.cleanup_network(network, runtime_id)\n        except Exception as exc:  # noqa: BLE001\n            errors.append(f"network cleanup raised {type(exc).__name__}: {exc}")\n        finally:\n            self._clear_generation_evidence(runtime_id)\n        if errors:\n            raise RuntimeDriverError(\n                "RUNTIME_CLEANUP_FAILED",\n                "runtime cleanup was incomplete: " + "; ".join(errors),\n            )\n'''
          driver = replace_once(driver, old_cleanup, new_cleanup, label="safe failed cleanup")
          driver = replace_once(
              driver,
              "        self._plan_digests.pop(runtime_id, None)\n\n    def _dns_resolvers",
              "        self._plan_digests.pop(runtime_id, None)\n        self._container_ids.pop(runtime_id, None)\n\n    def _dns_resolvers",
              label="clear immutable id",
          )
          driver = replace_once(
              driver,
              "    def _require_success(self, args: Sequence[str], reason_code: str) -> None:\n        result = self._runner.run(args)\n        if result.returncode != 0:\n            raise RuntimeDriverError(\n                reason_code,\n                result.stderr.strip() or f\"command failed: {args[1]}\",\n            )\n",
              "    def _require_success(self, args: Sequence[str], reason_code: str) -> CommandResult:\n        result = self._runner.run(args)\n        if result.returncode != 0:\n            raise RuntimeDriverError(\n                reason_code,\n                result.stderr.strip() or f\"command failed: {args[1]}\",\n            )\n        return result\n",
              label="require success return",
          )
          driver_path.write_text(driver, encoding="utf-8")

          transport_path = Path("ai_platform/portal/runtime_supervisor/transport.py")
          transport = transport_path.read_text(encoding="utf-8")
          transport = replace_once(
              transport,
              "        peer_uid: Callable[[socket.socket], int] = linux_peer_uid,\n        max_workers: int = MAX_CONNECTION_WORKERS,\n",
              "        peer_uid: Callable[[socket.socket], int] = linux_peer_uid,\n        socket_access_gid: int | None = None,\n        max_workers: int = MAX_CONNECTION_WORKERS,\n",
              label="socket access gid arg",
          )
          transport = replace_once(
              transport,
              "        if not allowed_peer_uids or any(uid < 0 for uid in allowed_peer_uids):\n            raise ValueError(\"at least one valid peer uid is required\")\n",
              "        if not allowed_peer_uids or any(uid < 0 for uid in allowed_peer_uids):\n            raise ValueError(\"at least one valid peer uid is required\")\n        if socket_access_gid is not None and socket_access_gid < 0:\n            raise ValueError(\"socket access gid must be non-negative\")\n",
              label="socket gid validation",
          )
          transport = replace_once(
              transport,
              "        self._peer_uid = peer_uid\n        self._max_workers = max_workers\n",
              "        self._peer_uid = peer_uid\n        self._socket_access_gid = socket_access_gid\n        self._max_workers = max_workers\n",
              label="socket gid field",
          )
          transport = replace_once(
              transport,
              "            listener.bind(str(self._path))\n            bound_inode = self._path.lstat().st_ino\n            self._path.chmod(0o660)\n            listener.listen(self._max_inflight_connections)\n",
              "            listener.bind(str(self._path))\n            bound_inode = self._path.lstat().st_ino\n            self._configure_filesystem_access()\n            listener.listen(self._max_inflight_connections)\n",
              label="socket filesystem ACL",
          )
          transport = replace_once(
              transport,
              "        effective_uid = getattr(os, \"geteuid\", lambda: 0)()\n        self._validate_directory_chain(TRUSTED_SOCKET_ROOT.parent, effective_uid)\n        try:\n            TRUSTED_SOCKET_ROOT.mkdir(mode=0o750, parents=False, exist_ok=False)\n        except FileExistsError:\n            pass\n        self._validate_directory_chain(TRUSTED_SOCKET_ROOT, effective_uid)\n",
              "        effective_uid = getattr(os, \"geteuid\", lambda: 0)()\n        self._validate_directory_chain(TRUSTED_SOCKET_ROOT.parent, effective_uid)\n        created_root = False\n        try:\n            TRUSTED_SOCKET_ROOT.mkdir(mode=0o750, parents=False, exist_ok=False)\n            created_root = True\n        except FileExistsError:\n            pass\n        if created_root and self._requires_group_access(effective_uid):\n            if self._socket_access_gid is None:\n                raise SupervisorTransportError(\n                    \"distinct lifecycle worker requires a dedicated filesystem group\"\n                )\n            try:\n                os.chown(TRUSTED_SOCKET_ROOT, -1, self._socket_access_gid)\n                TRUSTED_SOCKET_ROOT.chmod(0o750)\n            except OSError as exc:\n                raise SupervisorTransportError(\n                    \"could not configure trusted socket-root group ownership\"\n                ) from exc\n        self._validate_directory_chain(TRUSTED_SOCKET_ROOT, effective_uid)\n        self._validate_peer_directory_access(effective_uid)\n",
              label="trusted root peer access",
          )
          insertion = '''\n    def _requires_group_access(self, effective_uid: int) -> bool:\n        return any(uid != effective_uid for uid in self._allowed_peer_uids)\n\n    def _validate_peer_directory_access(self, effective_uid: int) -> None:\n        info = TRUSTED_SOCKET_ROOT.lstat()\n        if info.st_mode & 0o007:\n            raise SupervisorTransportError(\n                \"trusted socket root must not be accessible to unrelated identities\"\n            )\n        if not self._requires_group_access(effective_uid):\n            return\n        if self._socket_access_gid is None:\n            raise SupervisorTransportError(\n                \"distinct lifecycle worker requires a dedicated filesystem group\"\n            )\n        if info.st_gid != self._socket_access_gid or not info.st_mode & stat.S_IXGRP:\n            raise SupervisorTransportError(\n                \"trusted socket root does not grant the configured lifecycle-worker group\"\n            )\n\n    def _configure_filesystem_access(self) -> None:\n        effective_uid = getattr(os, \"geteuid\", lambda: 0)()\n        try:\n            if self._requires_group_access(effective_uid):\n                if self._socket_access_gid is None:\n                    raise SupervisorTransportError(\n                        \"distinct lifecycle worker requires a dedicated filesystem group\"\n                    )\n                os.chown(self._path, -1, self._socket_access_gid)\n                self._path.chmod(0o660)\n            else:\n                self._path.chmod(0o600)\n        except OSError as exc:\n            raise SupervisorTransportError(\n                \"could not configure supervisor socket filesystem access\"\n            ) from exc\n'''
          marker = "\n    @classmethod\n    def _validate_directory_chain"
          transport = replace_once(
              transport,
              marker,
              insertion + marker,
              label="peer access helpers",
          )
          transport_path.write_text(transport, encoding="utf-8")

          test_driver_path = Path("tests/ai_platform/portal/execution/test_driver.py")
          tests = test_driver_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              '''    runner = _Runner(\n        CommandResult(1, stderr="Error: No such object: runtime-1"),\n        CommandResult(1, stderr="No such image"),\n        CommandResult(1, stderr="Error: No such object: runtime-1"),\n    )\n''',
              '''    runner = _Runner(\n        CommandResult(1, stderr="Error: No such object: runtime-1"),\n        CommandResult(1, stderr="No such image"),\n    )\n''',
              label="missing image results",
          )
          tests = replace_once(
              tests,
              '''    assert exc_info.value.reason_code == "IMAGE_NOT_PRESENT"\n    assert runner.calls[-1] == ("docker", "rm", "-f", "runtime-1")\n    assert attestor.cleaned == [_network()]\n''',
              '''    assert exc_info.value.reason_code == "IMAGE_NOT_PRESENT"\n    assert all(call[:3] != ("docker", "rm", "-f") for call in runner.calls)\n    assert attestor.cleaned == [_network()]\n''',
              label="missing image no name cleanup",
          )
          for label in (
              "activation cleanup assertion",
              "structural cleanup assertion",
              "tampered structural cleanup assertion",
          ):
              tests = replace_once(
                  tests,
                  '    assert runner.calls[-1] == ("docker", "rm", "-f", "runtime-1")\n',
                  '    assert runner.calls[-1] == ("docker", "rm", "-f", "container-id")\n',
                  label=label,
              )
          tests = replace_once(
              tests,
              "    driver._plan_digests[spec.runtime_id] = plan.digest()\n\n    with pytest.raises(RuntimeDriverError) as exc_info:\n        driver.start(spec.runtime_id)\n",
              "    driver._plan_digests[spec.runtime_id] = plan.digest()\n    driver._container_ids[spec.runtime_id] = \"container-id\"\n\n    with pytest.raises(RuntimeDriverError) as exc_info:\n        driver.start(spec.runtime_id)\n",
              label="running tamper immutable id",
          )
          tests = replace_once(
              tests,
              '    assert runner.calls[-1] == ("docker", "rm", "-f", spec.runtime_id)\n\n\ndef test_running_generation_rejects_unbounded_active_log_backend',
              '    assert runner.calls[-1] == ("docker", "rm", "-f", "container-id")\n\n\ndef test_running_generation_rejects_unbounded_active_log_backend',
              label="running tamper cleanup assertion",
          )
          tests = replace_once(
              tests,
              "    driver._plan_digests[spec.runtime_id] = plan.digest()\n\n    with pytest.raises(RuntimeDriverError, match=\"log retention\"):\n",
              "    driver._plan_digests[spec.runtime_id] = plan.digest()\n    driver._container_ids[spec.runtime_id] = \"container-id\"\n\n    with pytest.raises(RuntimeDriverError, match=\"log retention\"):\n",
              label="running log immutable id",
          )
          tests = replace_once(
              tests,
              '    assert runner.calls[-1] == ("docker", "rm", "-f", spec.runtime_id)\n\n\ndef test_stop_stops_released_runtime',
              '    assert runner.calls[-1] == ("docker", "rm", "-f", "container-id")\n\n\ndef test_stop_stops_released_runtime',
              label="running log cleanup assertion",
          )
          tests = replace_once(
              tests,
              "    driver._plan_digests[spec.runtime_id] = plan.digest()\n\n    assert driver.provision(spec) is DriverRuntimeState.CREATED\n",
              "    driver._plan_digests[spec.runtime_id] = plan.digest()\n    driver._container_ids[spec.runtime_id] = \"container-id\"\n\n    assert driver.provision(spec) is DriverRuntimeState.CREATED\n",
              label="paused reprovision immutable id",
          )
          tests = replace_once(
              tests,
              '    assert ("docker", "rm", "-f", spec.runtime_id) in runner.calls\n',
              '    assert ("docker", "rm", "-f", "container-id") in runner.calls\n',
              label="paused cleanup assertion",
          )
          anchor = '''def test_retire_preserves_foreign_container_reusing_runtime_name() -> None:\n    runner = _Runner(\n        CommandResult(0, stdout="exited\\n"),\n        CommandResult(\n            0,\n            stdout=json.dumps(\n                {\n                    "Id": "foreign-container-id",\n                    "Config": {"Labels": {"ai.portal.runtime_id": "runtime-other"}},\n                }\n            ),\n        ),\n    )\n\n    with pytest.raises(RuntimeDriverError) as exc_info:\n        DockerCliRuntimeDriver(runner).retire("runtime-1")\n\n    assert exc_info.value.reason_code == "GENERATION_OWNERSHIP_CONFLICT"\n    assert all(call[:3] != ("docker", "rm", "-f") for call in runner.calls)\n\n\n'''
          addition = anchor + '''def test_failed_cleanup_uses_captured_immutable_container_id() -> None:\n    runner = _Runner(CommandResult(1, stderr="Error: No such object: owned-container-id"))\n    attestor = _Attestor()\n    driver = DockerCliRuntimeDriver(runner, external_attestor=attestor)\n    driver._container_ids["runtime-1"] = "owned-container-id"\n\n    driver._cleanup_failed_runtime("runtime-1", _network())\n\n    assert runner.calls == [("docker", "rm", "-f", "owned-container-id")]\n    assert all(call != ("docker", "rm", "-f", "runtime-1") for call in runner.calls)\n    assert attestor.cleaned == [_network()]\n\n\n'''
          tests = replace_once(tests, anchor, addition, label="immutable cleanup regression")
          test_driver_path.write_text(tests, encoding="utf-8")

          test_transport_path = Path("tests/ai_platform/portal/runtime_supervisor/test_transport.py")
          transport_tests = test_transport_path.read_text(encoding="utf-8")
          transport_tests = replace_once(
              transport_tests,
              "import json\nimport socket\n",
              "import json\nimport os\nimport socket\n",
              label="transport os import",
          )
          anchor = '''def test_linux_peer_uid_uses_kernel_authenticated_credentials() -> None:\n    if not hasattr(socket, "SO_PEERCRED"):\n        return\n    client, accepted = socket.socketpair()\n    try:\n        assert linux_peer_uid(accepted) == __import__("os").getuid()\n    finally:\n        client.close()\n        accepted.close()\n\n\n'''
          addition = anchor + '''def test_distinct_peer_requires_dedicated_filesystem_group(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    if not hasattr(socket, "AF_UNIX"):\n        return\n    path = tmp_path / "supervisor.sock"\n    listener = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)\n    listener.bind(str(path))\n    try:\n        distinct_uid = os.geteuid() + 1\n        missing_group = UnixSocketSupervisorServer(\n            path,\n            Supervisor(),\n            allowed_peer_uids=frozenset({distinct_uid}),\n            peer_uid=lambda _: distinct_uid,\n        )\n        with pytest.raises(SupervisorTransportError, match="dedicated filesystem group"):\n            missing_group._configure_filesystem_access()\n\n        chowns: list[tuple[Path, int, int]] = []\n        monkeypatch.setattr(\n            os,\n            "chown",\n            lambda target, uid, gid: chowns.append((Path(target), uid, gid)),\n        )\n        configured = UnixSocketSupervisorServer(\n            path,\n            Supervisor(),\n            allowed_peer_uids=frozenset({distinct_uid}),\n            peer_uid=lambda _: distinct_uid,\n            socket_access_gid=os.getegid(),\n        )\n        configured._configure_filesystem_access()\n        assert stat.S_IMODE(path.lstat().st_mode) == 0o660\n        assert chowns == [(path, -1, os.getegid())]\n    finally:\n        listener.close()\n        if path.exists():\n            path.unlink()\n\n\n'''
          transport_tests = replace_once(
              transport_tests,
              "import socket\nimport threading\n",
              "import socket\nimport stat\nimport threading\n",
              label="transport stat import",
          )
          transport_tests = replace_once(
              transport_tests, anchor, addition, label="filesystem group regression"
          )
          test_transport_path.write_text(transport_tests, encoding="utf-8")
          PY

      - name: Validate focused repair
        run: |
          set -euo pipefail
          python -m ruff check \
            ai_platform/portal/execution/driver.py \
            ai_platform/portal/runtime_supervisor/transport.py \
            tests/ai_platform/portal/execution/test_driver.py \
            tests/ai_platform/portal/runtime_supervisor/test_transport.py
          python -m mypy \
            ai_platform/portal/execution/driver.py \
            ai_platform/portal/runtime_supervisor/transport.py \
            tests/ai_platform/portal/execution/test_driver.py \
            tests/ai_platform/portal/runtime_supervisor/test_transport.py
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/execution/test_driver.py \
            tests/ai_platform/portal/runtime_supervisor
          git diff --check

      - name: Commit repair and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-runtime-supervisor-self-audit-repair.yml
          git add \
            ai_platform/portal/execution/driver.py \
            ai_platform/portal/runtime_supervisor/transport.py \
            tests/ai_platform/portal/execution/test_driver.py \
            tests/ai_platform/portal/runtime_supervisor/test_transport.py
          git commit -m "fix(portal): close supervisor self-audit ownership gaps"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
