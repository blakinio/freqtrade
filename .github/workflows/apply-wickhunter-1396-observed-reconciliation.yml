name: Apply WickHunter 1396 observed reconciliation

on:
  push:
    branches:
      - fix/wickhunter-1396-observed-generation-reconciliation-20260813
    paths:
      - .github/workflows/apply-wickhunter-1396-observed-reconciliation.yml

permissions: {}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Apply bounded product patch
        run: python .github/scripts/apply_wickhunter_1396_observed_reconciliation.py

      - name: Install focused validation toolchain
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet -e . \
            pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.15.20 mypy==2.1.0

      - name: Validate focused reconciliation repair
        run: |
          set -euo pipefail
          python -m ruff check \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m mypy \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py \
            tests/ai_platform/portal/control_plane/test_managed_runtime_mode_semantics.py
          git diff --check

      - name: Commit product repair and remove one-shot machinery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/apply-wickhunter-1396-observed-reconciliation.yml \
            .github/scripts/apply_wickhunter_1396_observed_reconciliation.py
          git add \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          git commit -m "fix(portal): reconcile observed runtime generation replacement"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"