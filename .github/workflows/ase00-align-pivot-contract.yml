name: ASE-00 Align Pivot Contract

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ase00-align-pivot-contract.yml
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
    paths:
      - .github/workflows/ase00-align-pivot-contract.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0
      - name: Align canonical pivot fields
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ai_platform/research/strategy_engine/ase00_adapter.py')
          text = path.read_text(encoding='utf-8')
          old_event_lookup = 'pivot_detected_event = market_events[pivot.detection_position]'
          if old_event_lookup not in text:
              raise SystemExit('legacy pivot event lookup not found')
          text = text.replace(
              old_event_lookup,
              'pivot_detected_event = market_events[pivot.detected_index]',
              1,
          )

          old_helper = '''    position = max(0, len(frame) - right_bars - 1)
    detection_position = min(len(frame) - 1, position + right_bars)
    event_time = cast(datetime, frame.index[position].to_pydatetime())
    detected_at = cast(datetime, frame.index[detection_position].to_pydatetime())
    return PivotEvent(
        kind="high",
        position=position,
        detection_position=detection_position,
        event_time=event_time,
        detected_at=detected_at,
        available_at=detected_at + processing_latency,
        price=float(frame["high"].iloc[position]),
        left_bars=cast(int, params["left_bars"]),
        right_bars=right_bars,
    )
'''
          new_helper = '''    pivot_index = max(0, len(frame) - right_bars - 1)
    detected_index = min(len(frame) - 1, pivot_index + right_bars)
    event_time = cast(datetime, frame.index[pivot_index].to_pydatetime())
    detected_at = cast(datetime, frame.index[detected_index].to_pydatetime())
    return PivotEvent(
        kind="high",
        level=float(frame["high"].iloc[pivot_index]),
        pivot_index=pivot_index,
        detected_index=detected_index,
        event_time=event_time,
        detected_at=detected_at,
        available_at=detected_at + processing_latency,
    )
'''
          if old_helper not in text:
              raise SystemExit('legacy unavailable pivot helper not found')
          text = text.replace(old_helper, new_helper, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ase00-align-pivot-contract.yml
          git add -A
          git commit -m "fix(ai-strategy): align canonical pivot event contract"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
