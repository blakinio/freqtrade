name: ASE-00 Align Record Factories

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ase00-align-record-factories.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0
      - name: Align canonical record factory calls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ai_platform/research/strategy_engine/ase00_adapter.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          output: list[str] = []
          call_kind: str | None = None

          for line in lines:
              stripped = line.strip()
              if stripped == 'record = make_feature_record(':
                  call_kind = 'feature'
              elif stripped == 'record = make_confirmed_pivot_record(':
                  call_kind = 'pivot'

              if call_kind and stripped == 'registry=self.registry,':
                  continue
              if call_kind == 'pivot' and stripped in {
                  'feature_id=pivot_ref.id,',
                  'source=pivot_detected_event.source,',
              }:
                  continue

              output.append(line)

              if call_kind == 'feature' and stripped == 'source=latest_event.source,':
                  feature_ref = 'squeeze_ref' if any(
                      candidate.strip() == 'feature_id=squeeze_ref.id,'
                      for candidate in output[-20:]
                  ) else 'supertrend_ref'
                  indent = line[: len(line) - len(line.lstrip())]
                  output.extend(
                      [
                          f'{indent}idempotency_key=(',
                          f'{indent}    f"feature:{{{feature_ref}.id}}:{{latest_event.symbol}}:"',
                          f'{indent}    f"{{latest_event.available_at.isoformat()}}"',
                          f'{indent}),',
                      ]
                  )
              elif call_kind == 'pivot' and stripped == 'decision_time=decision_time,':
                  indent = line[: len(line) - len(line.lstrip())]
                  output.extend(
                      [
                          f'{indent}idempotency_key=(',
                          f'{indent}    f"feature:{{pivot_ref.id}}:{{latest_event.symbol}}:"',
                          f'{indent}    f"{{pivot.available_at.isoformat()}}"',
                          f'{indent}),',
                      ]
                  )
              elif call_kind and stripped.startswith('source_event_id='):
                  indent = line[: len(line) - len(line.lstrip())]
                  output.insert(len(output) - 1, f'{indent}producer="ase00-feature-engine",')
              elif call_kind and stripped == ')':
                  call_kind = None

          transformed = '\n'.join(output) + '\n'
          required = (
              'idempotency_key=(\n                    f"feature:{squeeze_ref.id}',
              'idempotency_key=(\n                    f"feature:{supertrend_ref.id}',
              'idempotency_key=(\n                    f"feature:{pivot_ref.id}',
              'producer="ase00-feature-engine"',
          )
          for marker in required:
              if marker not in transformed:
                  raise SystemExit(f'missing transformed marker: {marker}')
          if 'registry=self.registry' in transformed:
              raise SystemExit('legacy registry argument remains')
          path.write_text(transformed, encoding='utf-8')
          PY
      - name: Commit repair and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ase00-align-record-factories.yml
          git add -A
          git commit -m "fix(ai-strategy): align canonical record factory calls"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
