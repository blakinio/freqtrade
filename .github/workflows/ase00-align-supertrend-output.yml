name: ASE-00 Align Supertrend Output

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ase00-align-supertrend-output.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0
      - name: Align canonical Supertrend output name
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ai_platform/research/strategy_engine/ase00_adapter.py')
          text = path.read_text(encoding='utf-8')
          count = text.count('                    "supertrend",\n')
          if count != 2:
              raise SystemExit(f'expected 2 legacy Supertrend field references, found {count}')
          text = text.replace('                    "supertrend",\n', '                    "supertrend_band",\n')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ase00-align-supertrend-output.yml
          git add -A
          git commit -m "fix(ai-strategy): align canonical Supertrend snapshot output"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
