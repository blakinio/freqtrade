name: ASE-00 Capture Adapter Ruff

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ase00-capture-adapter-ruff.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Run adapter validation
        shell: bash
        run: |
          set +e
          python -m pip install ruff >/tmp/install.log 2>&1
          python -m compileall -q ai_platform/research/strategy_engine > /tmp/compile.log 2>&1
          printf '%s' "$?" > /tmp/compile.rc
          ruff check ai_platform/research/strategy_engine > /tmp/ruff.log 2>&1
          printf '%s' "$?" > /tmp/ruff.rc
          set -e
      - name: Commit report and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          compile_rc = Path('/tmp/compile.rc').read_text()
          ruff_rc = Path('/tmp/ruff.rc').read_text()
          compile_output = Path('/tmp/compile.log').read_text(errors='replace')
          ruff_output = Path('/tmp/ruff.log').read_text(errors='replace')
          Path('ai_strategy_engine/docs/adapter-validation-finding.md').write_text(
              '# ASE-00 adapter validation finding\n\n'
              f'- compileall exit code: `{compile_rc}`\n'
              f'- Ruff exit code: `{ruff_rc}`\n\n'
              '## compileall\n\n```text\n' + compile_output + '\n```\n\n'
              '## Ruff\n\n```text\n' + ruff_output + '\n```\n',
              encoding='utf-8',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ase00-capture-adapter-ruff.yml
          git add -A
          git commit -m "docs(ai-strategy): capture adapter validation finding"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
