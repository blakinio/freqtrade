name: ASE-00 Capture Diagnostics

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/ase00-capture-diagnostics.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install diagnostic dependencies
        run: |
          python -m venv ai_strategy_engine/.venv
          . ai_strategy_engine/.venv/bin/activate
          pip install -e "ai_strategy_engine[dev]" sqlalchemy
      - name: Run and capture diagnostics
        shell: bash
        run: |
          set +e
          . ai_strategy_engine/.venv/bin/activate
          run_check() {
            name="$1"
            shift
            "$@" > "/tmp/${name}.log" 2>&1
            printf '%s' "$?" > "/tmp/${name}.rc"
          }
          run_check package_pytest bash -lc 'cd ai_strategy_engine && . .venv/bin/activate && pytest'
          run_check package_ruff bash -lc 'cd ai_strategy_engine && . .venv/bin/activate && ruff check .'
          run_check package_mypy bash -lc 'cd ai_strategy_engine && . .venv/bin/activate && mypy src/strategy_engine'
          run_check package_compile bash -lc 'cd ai_strategy_engine && . .venv/bin/activate && python -m compileall -q src tests'
          run_check platform_ruff ruff check ai_platform/research/strategy_engine tests/ai_platform_integration/conftest.py tests/ai_platform_integration/test_ase00_vertical_slice.py
          run_check platform_pytest pytest -q tests/ai_platform_integration/test_ase00_vertical_slice.py
          set -e
          python - <<'PY'
          from pathlib import Path

          checks = (
              'package_pytest',
              'package_ruff',
              'package_mypy',
              'package_compile',
              'platform_ruff',
              'platform_pytest',
          )
          lines = ['# ASE-00 current diagnostic report', '']
          for check in checks:
              rc = Path(f'/tmp/{check}.rc').read_text()
              output = Path(f'/tmp/{check}.log').read_text(errors='replace').splitlines()
              lines.extend(
                  [
                      f'## {check}',
                      '',
                      f'- exit code: `{rc}`',
                      '',
                      '```text',
                      *output[-250:],
                      '```',
                      '',
                  ]
              )
          Path('ai_strategy_engine/docs/diagnostic-report.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )
          PY
      - name: Commit report and remove capture workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ase00-capture-diagnostics.yml
          git add -A
          git commit -m "docs(ai-strategy): capture exact ASE-00 diagnostics"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
