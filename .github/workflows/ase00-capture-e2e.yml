name: ASE-00 Capture E2E Failure

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ase00-capture-e2e.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Run isolated vertical slice E2E
        shell: bash
        run: |
          set +e
          python -m venv ai_strategy_engine/.venv
          . ai_strategy_engine/.venv/bin/activate
          pip install -e "ai_strategy_engine[dev]" "SQLAlchemy>=2.0.6" >/tmp/install.log 2>&1
          PYTHONPATH="$PWD:$PWD/ai_strategy_engine/src" \
            pytest -vv -o addopts='' --confcutdir=tests/ai_platform_integration \
            tests/ai_platform_integration/test_ase00_vertical_slice.py \
            > /tmp/e2e.log 2>&1
          printf '%s' "$?" > /tmp/e2e.rc
          set -e
      - name: Commit report and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          rc = Path('/tmp/e2e.rc').read_text()
          output = Path('/tmp/e2e.log').read_text(errors='replace')
          Path('ai_strategy_engine/docs/e2e-failure.md').write_text(
              '# ASE-00 E2E diagnostic\n\n'
              f'- exit code: `{rc}`\n\n'
              '```text\n' + output + '\n```\n',
              encoding='utf-8',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ase00-capture-e2e.yml
          git add -A
          git commit -m "docs(ai-strategy): capture exact E2E failure"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
