name: ASE-00 Capture Pytest Failure

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ase00-capture-pytest-failure.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Run package pytest verbosely
        shell: bash
        run: |
          set +e
          cd ai_strategy_engine
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip >/tmp/install.log 2>&1
          pip install -e ".[dev]" >>/tmp/install.log 2>&1
          pytest -vv > /tmp/pytest.log 2>&1
          printf '%s' "$?" > /tmp/pytest.rc
          set -e
      - name: Commit diagnostic and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          rc = Path('/tmp/pytest.rc').read_text()
          output = Path('/tmp/pytest.log').read_text(errors='replace')
          Path('ai_strategy_engine/docs/pytest-failure.md').write_text(
              '# ASE-00 pytest diagnostic\n\n'
              f'- exit code: `{rc}`\n\n'
              '```text\n' + output + '\n```\n',
              encoding='utf-8',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ase00-capture-pytest-failure.yml
          git add -A
          git commit -m "docs(ai-strategy): capture exact pytest failure"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
