name: ASE-00 Current Validation

on:
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
    paths:
      - .github/workflows/ase00-current-validation.yml

permissions:
  contents: write

concurrency:
  group: ase00-current-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install exact developer environment
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ai_strategy_engine
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "SQLAlchemy>=2.0.6" "pytest-xdist>=3.6"

      - name: Run every validation independently
        shell: bash
        run: |
          set +e
          . ai_strategy_engine/.venv/bin/activate
          run_check() {
            name="$1"
            shift
            "$@" > "/tmp/${name}.log" 2>&1
            printf '%s' "$?" > "/tmp/${name}.rc"
          }
          run_check package_pytest bash -lc 'cd ai_strategy_engine && . .venv/bin/activate && pytest'
          run_check package_ruff bash -lc 'cd ai_strategy_engine && . .venv/bin/activate && ruff check .'
          run_check package_mypy bash -lc 'cd ai_strategy_engine && . .venv/bin/activate && mypy src/strategy_engine'
          run_check package_compile bash -lc 'cd ai_strategy_engine && . .venv/bin/activate && python -m compileall -q src tests'
          run_check platform_ruff ruff check ai_platform/research/strategy_engine tests/ai_platform_integration/conftest.py tests/ai_platform_integration/test_ase00_vertical_slice.py
          run_check platform_compile python -m compileall -q ai_platform/research/strategy_engine tests/ai_platform_integration/test_ase00_vertical_slice.py
          run_check platform_pytest pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration tests/ai_platform_integration/test_ase00_vertical_slice.py
          run_check json_yaml_schema python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          import yaml
          root = Path('ai_strategy_engine')
          for path in sorted(root.rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
          for path in sorted(root.rglob('*.yaml')) + sorted(root.rglob('*.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          schema = json.loads((root / 'schemas/strategy-definition.v1.schema.json').read_text())
          for path in sorted((root / 'examples').glob('strategy_*.json')):
              jsonschema.validate(json.loads(path.read_text()), schema)
          for example, schema_name in (
              ('feature_record.json', 'feature-record.v1.schema.json'),
              ('signal_event.json', 'signal-event.v1.schema.json'),
          ):
              jsonschema.validate(
                  json.loads((root / 'examples' / example).read_text()),
                  json.loads((root / 'schemas' / schema_name).read_text()),
              )
          print('JSON/YAML/JSON Schema validation passed')
          PY
          run_check security_architecture python - <<'PY'
          from __future__ import annotations
          import ast
          import re
          from pathlib import Path
          roots = [
              Path('ai_strategy_engine/src'),
              Path('ai_strategy_engine/tests'),
              Path('ai_strategy_engine/configs'),
              Path('ai_strategy_engine/examples'),
              Path('ai_platform/research/strategy_engine'),
              Path('tests/ai_platform_integration/test_ase00_vertical_slice.py'),
          ]
          files = []
          for root in roots:
              files.extend([root] if root.is_file() else [p for p in root.rglob('*') if p.is_file()])
          failures = []
          secret_patterns = {
              'private-key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'aws-key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'github-token': re.compile(r'gh[pousr]_[A-Za-z0-9_]{30,}'),
              'openai-key': re.compile(r'sk-[A-Za-z0-9]{32,}'),
          }
          for path in files:
              if path.suffix.lower() not in {'.py', '.json', '.yaml', '.yml', '.toml'}:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'luxalgo' in text.lower():
                  failures.append(f'{path}: LuxAlgo runtime/test reference')
              for label, pattern in secret_patterns.items():
                  if pattern.search(text):
                      failures.append(f'{path}: possible {label}')
              if path.suffix != '.py':
                  continue
              tree = ast.parse(text, filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id in {'eval', 'exec'}:
                      failures.append(f'{path}:{node.lineno}: prohibited {node.func.id}()')
                  modules = []
                  if isinstance(node, ast.ImportFrom) and node.module:
                      modules.append(node.module)
                  elif isinstance(node, ast.Import):
                      modules.extend(alias.name for alias in node.names)
                  for module in modules:
                      if module.startswith(('freqtrade', 'ai_platform.portal.execution')):
                          failures.append(f'{path}:{node.lineno}: direct execution import {module}')
          browser_changed = [
              line for line in __import__('subprocess').check_output(
                  ['git', 'diff', '--name-only', 'origin/develop...HEAD'], text=True
              ).splitlines()
              if line.startswith('ai_platform/portal/web/')
          ]
          if browser_changed:
              failures.append(f'Browser paths changed: {browser_changed}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Secrets/LuxAlgo/eval/exec/Browser-to-Freqtrade scans passed')
          PY
          set -e

      - name: Write exact diagnostic evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          checks = (
              'package_pytest', 'package_ruff', 'package_mypy', 'package_compile',
              'platform_ruff', 'platform_compile', 'platform_pytest',
              'json_yaml_schema', 'security_architecture',
          )
          lines = ['# ASE-00 current validation evidence', '']
          failed = False
          for check in checks:
              rc = Path(f'/tmp/{check}.rc').read_text()
              failed |= rc != '0'
              output = Path(f'/tmp/{check}.log').read_text(errors='replace').splitlines()
              lines.extend([
                  f'## {check}', '', f'- exit code: `{rc}`', '', '```text', *output[-350:], '```', ''
              ])
          Path('ai_strategy_engine/docs/current-validation-evidence.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )
          Path('/tmp/ase00_status').write_text('1' if failed else '0')
          PY

      - name: Commit evidence and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ase00-current-validation.yml
          git add -A
          git commit -m "docs(ai-strategy): record current complete validation"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
          test "$(cat /tmp/ase00_status)" = 0
