name: ASE-00 Diagnostic

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/ase00-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai_strategy_engine/pyproject.toml
      - name: Install developer dependencies
        working-directory: ai_strategy_engine
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e ".[dev]"
      - name: Compile
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          python -m compileall -q src tests
      - name: Tests
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          pytest
      - name: Ruff
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          ruff check .
      - name: Mypy
        working-directory: ai_strategy_engine
        run: |
          . .venv/bin/activate
          mypy src/strategy_engine
