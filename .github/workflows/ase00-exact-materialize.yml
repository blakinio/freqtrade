name: ASE-00 Exact Materialization

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ase00-exact-materialize.yml

permissions:
  contents: write

concurrency:
  group: ase00-exact-materialization-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out continued branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0

      - name: Merge latest develop without rewriting history
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          printf '%s\n' "$(git rev-parse origin/develop)" > /tmp/ase00_base_sha
          git merge --no-ff --no-edit origin/develop

      - name: Recover exact verified archive from preserved provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import subprocess
          from pathlib import Path

          SOURCE_COMMIT = "ff7ee5be1dc3997669ce7039790221384e08fbe2"
          EXPECTED = "73a0d99cab94ba116818a6aef9d818a710fb048a4c0b77f89b9819dd9ac7332f"
          names = [
              "strategy_engine_source.zip.b64.part01",
              "strategy_engine_source.zip.b64.part02a",
              "strategy_engine_source.zip.b64.part02b",
              "strategy_engine_source.zip.b64.part03a",
              "strategy_engine_source.zip.b64.part03b",
              "strategy_engine_source.zip.b64.part04",
              "strategy_engine_source.zip.b64.part05",
          ]
          contents: list[bytes] = []
          lengths: list[int] = []
          for name in names:
              path = f"ai_strategy_engine/bootstrap/{name}"
              result = subprocess.run(
                  ["git", "show", f"{SOURCE_COMMIT}:{path}"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=True,
              )
              content = result.stdout.strip()
              contents.append(content)
              lengths.append(len(content))
          payload = bytearray(base64.b64decode(b"".join(contents), validate=True))
          corrections = {
              5301: (0xB1, 0x89),
              34444: (0xB9, 0xB7),
              43749: (0xA2, 0xCA),
          }
          for offset, (before, after) in corrections.items():
              if payload[offset] != before:
                  raise RuntimeError(
                      f"provenance byte mismatch at {offset}: {payload[offset]:02x} != {before:02x}"
                  )
              payload[offset] = after
          digest = hashlib.sha256(payload).hexdigest()
          if digest != EXPECTED:
              raise RuntimeError(f"recovered archive checksum mismatch: {digest}")
          encoded = base64.b64encode(payload)
          if len(encoded) != sum(lengths):
              raise RuntimeError("recovered Base64 length mismatch")
          bootstrap = Path("ai_strategy_engine/bootstrap")
          bootstrap.mkdir(parents=True, exist_ok=True)
          cursor = 0
          for name, length in zip(names, lengths, strict=True):
              (bootstrap / name).write_bytes(encoded[cursor:cursor + length])
              cursor += length
          Path("/tmp/ase00_archive_sha").write_text(digest, encoding="ascii")
          PY

      - name: Run required materializer and verify required tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python ai_strategy_engine/materialize_starter.py
          test -f ai_strategy_engine/configs/feature_registry.v1.yaml
          test -f ai_strategy_engine/configs/search_spaces.v1.yaml
          test -f ai_strategy_engine/configs/miyagi_parameter_map.v1.yaml
          test -d ai_strategy_engine/schemas
          test -d ai_strategy_engine/examples
          test -d ai_strategy_engine/src/strategy_engine
          test -f ai_strategy_engine/src/strategy_engine/features/momentum.py
          test -d ai_strategy_engine/tests
          test -d ai_strategy_engine/docs

      - name: Record evidence, remove duplicate bundle, and push
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_SHA="$(cat /tmp/ase00_base_sha)"
          ARCHIVE_SHA="$(cat /tmp/ase00_archive_sha)"
          TREE_HASH="$(find ai_strategy_engine -type f ! -path '*/bootstrap/*' ! -path '*/.venv/*' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          cat > ai_strategy_engine/docs/materialization-evidence.md <<EOF
          # ASE-00 materialization evidence

          - status: \`complete\`
          - latest develop SHA merged: \`$BASE_SHA\`
          - required and recovered source ZIP SHA-256: \`$ARCHIVE_SHA\`
          - materialized source tree hash before later ASE-00 integration changes: \`$TREE_HASH\`
          - materializer command: \`python ai_strategy_engine/materialize_starter.py\`
          - path traversal protection: implemented by \`ai_strategy_engine/materialize_starter.py\` and exercised against the verified archive member list
          - required paths: all present
          - update method: ordinary non-force merge of \`origin/develop\`
          - provenance: corrupted bootstrap bytes remain recoverable from commit \`ff7ee5be1dc3997669ce7039790221384e08fbe2\`; exact corrections are recorded in \`docs/deflate-recovery.md\`
          - bootstrap bundle: removed after exact verified materialization to avoid source duplication
          EOF
          rm -f ai_strategy_engine/bootstrap/strategy_engine_source.zip.b64.part*
          rmdir ai_strategy_engine/bootstrap 2>/dev/null || true
          rm -f .github/workflows/ase00-stage1-materialize.yml
          rm -f .github/workflows/ase00-stage1-pr.yml
          rm -f .github/workflows/ase00-exact-materialize.yml
          git add -A
          git add -f ai_strategy_engine
          git commit -m "feat(ai-strategy): materialize exact verified ASE-00 starter"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
