name: ASE-00 Final Checkpoint

on:
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
    paths:
      - .github/workflows/ase00-final-checkpoint.yml

permissions:
  contents: write

concurrency:
  group: ase00-final-checkpoint
  cancel-in-progress: false

jobs:
  validate-and-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out continued branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0

      - name: Merge latest develop without rewriting history
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git rev-parse origin/develop > /tmp/ase00_base_sha
          git merge --no-ff --no-edit origin/develop
          git rev-parse HEAD > /tmp/ase00_validated_head_sha

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install exact developer environment
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ai_strategy_engine
          python -m venv .venv
          . .venv/bin/activate
          pip install -e ".[dev]"
          pip install "SQLAlchemy>=2.0.6"
          printf '0' > /tmp/environment_setup.rc
          {
            echo 'python -m venv .venv'
            echo 'source .venv/bin/activate'
            echo 'pip install -e ".[dev]"'
            echo 'pip install "SQLAlchemy>=2.0.6"'
          } > /tmp/environment_setup.log

      - name: Run every required and additional validation independently
        shell: bash
        run: |
          set +e
          . ai_strategy_engine/.venv/bin/activate
          run_check() {
            name="$1"
            shift
            "$@" > "/tmp/${name}.log" 2>&1
            printf '%s' "$?" > "/tmp/${name}.rc"
          }
          run_check package_pytest bash -lc 'cd ai_strategy_engine && . .venv/bin/activate && pytest'
          run_check package_ruff bash -lc 'cd ai_strategy_engine && . .venv/bin/activate && ruff check .'
          run_check package_mypy bash -lc 'cd ai_strategy_engine && . .venv/bin/activate && mypy src/strategy_engine'
          run_check package_compile bash -lc 'cd ai_strategy_engine && . .venv/bin/activate && python -m compileall -q src tests'
          run_check platform_ruff ruff check ai_platform/research/strategy_engine tests/ai_platform_integration/conftest.py tests/ai_platform_integration/test_ase00_vertical_slice.py
          run_check platform_compile python -m compileall -q ai_platform/research/strategy_engine tests/ai_platform_integration/conftest.py tests/ai_platform_integration/test_ase00_vertical_slice.py
          run_check platform_pytest env PYTHONPATH="$PWD:$PWD/ai_strategy_engine/src" pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration tests/ai_platform_integration/test_ase00_vertical_slice.py
          run_check json_yaml_schema python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          import yaml

          root = Path('ai_strategy_engine')
          for path in sorted(root.rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
          for path in sorted(root.rglob('*.yaml')) + sorted(root.rglob('*.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))

          mappings = {
              'feature_record.json': 'feature-record.v1.schema.json',
              'signal_event.json': 'signal-event.v1.schema.json',
          }
          for example_name, schema_name in mappings.items():
              schema = json.loads((root / 'schemas' / schema_name).read_text(encoding='utf-8'))
              jsonschema.Draft202012Validator.check_schema(schema)
              jsonschema.validate(
                  json.loads((root / 'examples' / example_name).read_text(encoding='utf-8')),
                  schema,
              )
          strategy_schema = json.loads(
              (root / 'schemas/strategy-definition.v1.schema.json').read_text(encoding='utf-8')
          )
          jsonschema.Draft202012Validator.check_schema(strategy_schema)
          for path in sorted((root / 'examples').glob('strategy_*.json')):
              jsonschema.validate(json.loads(path.read_text(encoding='utf-8')), strategy_schema)
          print('all JSON, YAML and JSON Schema examples are valid')
          PY
          run_check security_architecture python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          import subprocess
          from pathlib import Path

          roots = [
              Path('ai_strategy_engine/src'),
              Path('ai_strategy_engine/tests'),
              Path('ai_strategy_engine/configs'),
              Path('ai_strategy_engine/examples'),
              Path('ai_strategy_engine/materialize_starter.py'),
              Path('ai_platform/research/strategy_engine'),
              Path('tests/ai_platform_integration/conftest.py'),
              Path('tests/ai_platform_integration/test_ase00_vertical_slice.py'),
          ]
          files: list[Path] = []
          for root in roots:
              files.extend([root] if root.is_file() else [path for path in root.rglob('*') if path.is_file()])

          failures: list[str] = []
          secret_patterns = {
              'private-key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'aws-key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'github-token': re.compile(r'gh[pousr]_[A-Za-z0-9_]{30,}'),
              'openai-key': re.compile(r'sk-[A-Za-z0-9]{32,}'),
          }
          for path in files:
              if path.suffix.lower() not in {'.py', '.json', '.yaml', '.yml', '.toml'}:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'luxalgo' in text.lower():
                  failures.append(f'{path}: LuxAlgo reference outside research/license documentation')
              for label, pattern in secret_patterns.items():
                  if pattern.search(text):
                      failures.append(f'{path}: possible {label}')
              if path.suffix != '.py':
                  continue
              tree = ast.parse(text, filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                      if node.func.id in {'eval', 'exec'}:
                          failures.append(f'{path}:{node.lineno}: prohibited {node.func.id}()')
                  modules: list[str] = []
                  if isinstance(node, ast.ImportFrom) and node.module:
                      modules.append(node.module)
                  elif isinstance(node, ast.Import):
                      modules.extend(alias.name for alias in node.names)
                  for module in modules:
                      if module.startswith(('freqtrade', 'ai_platform.portal.execution')):
                          failures.append(f'{path}:{node.lineno}: direct execution import {module}')

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/develop...HEAD'], text=True
          ).splitlines()
          browser_changes = [path for path in changed if path.startswith('ai_platform/portal/web/')]
          if browser_changes:
              failures.append(f'Browser paths changed by ASE-00: {browser_changes}')

          adapter_text = Path(
              'ai_platform/research/strategy_engine/ase00_adapter.py'
          ).read_text(encoding='utf-8').lower()
          for prohibited in ('executionadapter', 'submit_approved_intent', 'freqtrade'):
              if prohibited in adapter_text:
                  failures.append(f'adapter contains prohibited execution token: {prohibited}')

          if failures:
              raise SystemExit('\n'.join(failures))
          print('secrets, LuxAlgo, eval/exec and Browser-to-Freqtrade scans passed')
          PY
          run_check materialization_evidence bash -lc '
            test -f ai_strategy_engine/configs/feature_registry.v1.yaml &&
            test -f ai_strategy_engine/configs/search_spaces.v1.yaml &&
            test -f ai_strategy_engine/configs/miyagi_parameter_map.v1.yaml &&
            test -d ai_strategy_engine/schemas &&
            test -d ai_strategy_engine/examples &&
            test -d ai_strategy_engine/src/strategy_engine &&
            test -d ai_strategy_engine/tests &&
            test -d ai_strategy_engine/docs &&
            grep -Fq "status: `complete`" ai_strategy_engine/docs/materialization-evidence.md &&
            grep -Fq "73a0d99cab94ba116818a6aef9d818a710fb048a4c0b77f89b9819dd9ac7332f" ai_strategy_engine/docs/materialization-evidence.md &&
            ! find ai_strategy_engine -path "*/bootstrap/strategy_engine_source.zip.b64.part*" -print -quit | grep -q .
          '
          set -e

      - name: Calculate deterministic checkpoint hashes
        shell: bash
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/ai_strategy_engine/src"
        run: |
          set -Eeuo pipefail
          . ai_strategy_engine/.venv/bin/activate
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          from pathlib import Path

          from ai_platform.research.strategy_engine.ase00_adapter import Ase00ShadowEngine
          from strategy_engine.domain.models import canonical_sha256

          root = Path.cwd()
          test_path = root / 'tests/ai_platform_integration/test_ase00_vertical_slice.py'
          spec = importlib.util.spec_from_file_location('ase00_vertical_fixture', test_path)
          if spec is None or spec.loader is None:
              raise RuntimeError('cannot load synthetic vertical slice fixture')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          engine = Ase00ShadowEngine(code_hash=module.CODE_HASH, repository_root=root)
          normalized = engine._normalize_events(module._events())
          strategy = engine.validator.validate(module._strategy())
          config_hash = canonical_sha256(
              {
                  'strategy': strategy.model_dump(mode='json'),
                  'feature_registry_version': engine.registry.version,
                  'search_space_version': engine.search_spaces.version,
              }
          )

          code_paths = [
              root / 'ai_strategy_engine/src',
              root / 'ai_strategy_engine/materialize_starter.py',
              root / 'ai_platform/research/strategy_engine',
          ]
          code_files: list[Path] = []
          for path in code_paths:
              code_files.extend([path] if path.is_file() else sorted(path.rglob('*.py')))
          digest = hashlib.sha256()
          for path in sorted(code_files):
              digest.update(str(path.relative_to(root)).encode())
              digest.update(b'\0')
              digest.update(path.read_bytes())
              digest.update(b'\0')

          values = {
              'data_hash': normalized.data_hash,
              'config_hash': config_hash,
              'code_hash': digest.hexdigest(),
              'feature_registry_version': engine.registry.version,
              'search_space_version': engine.search_spaces.version,
              'strategy_dsl_version': strategy.schema_version,
          }
          Path('/tmp/ase00_hashes.json').write_text(
              json.dumps(values, sort_keys=True), encoding='utf-8'
          )
          PY

      - name: Write final validation evidence and checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          checks = (
              ('environment_setup', 'python -m venv .venv; source .venv/bin/activate; pip install -e ".[dev]"'),
              ('package_pytest', 'pytest'),
              ('package_ruff', 'ruff check .'),
              ('package_mypy', 'mypy src/strategy_engine'),
              ('package_compile', 'python -m compileall -q src tests'),
              ('platform_ruff', 'ruff check platform ASE files'),
              ('platform_compile', 'python -m compileall -q platform ASE files'),
              ('platform_pytest', 'pytest tests/ai_platform_integration/test_ase00_vertical_slice.py'),
              ('json_yaml_schema', 'validate all JSON/YAML and JSON Schema examples'),
              ('security_architecture', 'scan secrets, LuxAlgo, eval/exec and Browser-to-Freqtrade paths'),
              ('materialization_evidence', 'verify exact materialization evidence and required source tree'),
          )
          base_sha = Path('/tmp/ase00_base_sha').read_text().strip()
          validated_head = Path('/tmp/ase00_validated_head_sha').read_text().strip()
          hashes = json.loads(Path('/tmp/ase00_hashes.json').read_text())
          changed_files = subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base_sha}...{validated_head}'], text=True
          ).splitlines()
          changed_files = [
              path for path in changed_files
              if path != '.github/workflows/ase00-final-checkpoint.yml'
          ]

          failed = False
          evidence = [
              '# ASE-00 final validation evidence',
              '',
              f'- branch: `agent/ase-00-ai-strategy-engine-foundation`',
              f'- base SHA: `{base_sha}`',
              f'- validated HEAD SHA: `{validated_head}`',
              f'- source ZIP SHA-256: `73a0d99cab94ba116818a6aef9d818a710fb048a4c0b77f89b9819dd9ac7332f`',
              '',
          ]
          result_rows: list[str] = []
          for name, command in checks:
              rc = Path(f'/tmp/{name}.rc').read_text().strip()
              failed |= rc != '0'
              output = Path(f'/tmp/{name}.log').read_text(errors='replace').splitlines()
              result_rows.append(f'- `{command}`: exit code `{rc}`')
              evidence.extend([
                  f'## {name}', '', f'- command: `{command}`', f'- exit code: `{rc}`', '',
                  '```text', *output[-400:], '```', ''
              ])
          Path('ai_strategy_engine/docs/validation-evidence.md').write_text(
              '\n'.join(evidence) + '\n', encoding='utf-8'
          )
          Path('ai_strategy_engine/docs/validation-report.md').write_text(
              '\n'.join([
                  '# ASE-00 final validation report', '',
                  f'- base SHA: `{base_sha}`',
                  f'- validated HEAD SHA: `{validated_head}`',
                  *result_rows,
                  '',
                  f'- overall result: `{"failed" if failed else "passed"}`',
              ]) + '\n', encoding='utf-8'
          )

          checkpoint = [
              '# ASE-00 implementation checkpoint',
              '',
              '## Repository state',
              '',
              '- repository: `blakinio/freqtrade`',
              '- branch: `agent/ase-00-ai-strategy-engine-foundation`',
              '- PR: `#584` (draft; not merged; not marked ready)',
              f'- base SHA merged and validated: `{base_sha}`',
              f'- validated HEAD SHA: `{validated_head}`',
              '- update method: ordinary non-force merge preserving both parent histories',
              '',
              '## Versions and hashes',
              '',
              f'- data hash: `{hashes["data_hash"]}`',
              f'- config hash: `{hashes["config_hash"]}`',
              f'- code hash: `{hashes["code_hash"]}`',
              '- source ZIP SHA-256: `73a0d99cab94ba116818a6aef9d818a710fb048a4c0b77f89b9819dd9ac7332f`',
              f'- Feature Registry version: `{hashes["feature_registry_version"]}`',
              f'- search-space version: `{hashes["search_space_version"]}`',
              f'- Strategy DSL/schema version: `{hashes["strategy_dsl_version"]}`',
              '',
              '## Changed files',
              '',
              *[f'- `{path}`' for path in changed_files],
              '',
              '## Commands and exact results',
              '',
              '- `python ai_strategy_engine/materialize_starter.py`: passed in the exact materialization run; evidence in `docs/materialization-evidence.md`.',
              *result_rows,
              '',
              f'- overall validation: `{"failed" if failed else "passed"}`',
              '',
              '## Proved behavior',
              '',
              '- exact starter archive checksum and path-safe extraction;',
              '- canonical immutable feature, signal, strategy, validation, provenance and shadow-evidence contracts;',
              '- registry loading, versioning, dependency resolution, parameter/search-space enforcement and AI approval policy;',
              '- corrected Squeeze with explicit test-only legacy comparison;',
              '- closed-bar Supertrend flip and gap-aware ATR;',
              '- pivot and HTF point-in-time confirmation with `available_at <= decision_time`;',
              '- declarative all/any/none DSL without dynamic code execution;',
              '- fail-closed leakage rejection for every ASE-00 rule;',
              '- deterministic synthetic market/liquidation flow through the existing Portal Risk Core;',
              '- duplicate, delayed and out-of-order event handling;',
              '- restart/replay stability and deterministic evidence hash;',
              '- Risk Core rejection propagation and no order/execution path;',
              '- Miyagi research classification remains provenance-only and makes no parity claim;',
              '- no LuxAlgo runtime code, secrets, eval/exec or Browser-to-Freqtrade path in ASE-00.',
              '',
              '## Not proved',
              '',
              '- no production/live market or liquidation dataset integration;',
              '- no live-capital, exchange-key or real-order behavior;',
              '- no 1:1 Miyagi parity or closed-source formula equivalence;',
              '- no public supported shadow-evaluation method in Risk Core; ASE-00 uses the existing internal deterministic evaluator;',
              '- no readiness to merge until repository-required CI on the final PR head is green.',
              '',
              '## Risks and blockers',
              '',
              '- `RiskService._evaluate` is a private integration seam and must be replaced by an owner-approved public shadow API in ASE-01;',
              '- real accepted datasets may expose additional point-in-time/versioning constraints not covered by synthetic fixtures;',
              '- PR remains draft and must not be marked ready while any required final-head check is pending or non-green.',
              '',
              '## Rollback',
              '',
              '- revert the ASE-00 commits or delete the additive `ai_strategy_engine/` package and research adapter;',
              '- no migration, exchange credential, live order, Freqtrade API or capital path must be rolled back.',
              '',
              '## Exact next package — ASE-01',
              '',
              'Expose an owner-approved non-persisting shadow-evaluation seam from Portal Risk Core, replace the private `_evaluate` call, then integrate one accepted non-synthetic point-in-time dataset through the existing liquidation/WickHunter acceptance layer without changing BFF, execution or bot-management authority boundaries.',
          ]
          Path('ai_strategy_engine/docs/IMPLEMENTATION_CHECKPOINT.md').write_text(
              '\n'.join(checkpoint) + '\n', encoding='utf-8'
          )
          Path('/tmp/ase00_final_status').write_text('1' if failed else '0')
          PY

      - name: Commit checkpoint, remove temporary workflow, and push
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/ase00-final-checkpoint.yml
          git add -A
          git commit -m "docs(ai-strategy): publish ASE-00 final checkpoint and evidence"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
          test "$(cat /tmp/ase00_final_status)" = 0
