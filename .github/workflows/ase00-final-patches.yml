name: ASE-00 Final Targeted Patches

on:
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
    paths:
      - .github/workflows/ase00-final-patches.yml

permissions:
  contents: write

concurrency:
  group: ase00-final-targeted-patches
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0

      - name: Apply bounded source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "ai_platform/research/strategy_engine/ase00_adapter.py",
              "            parameters=cast(dict[str, JsonValue], pivot_params),\n        )\n\n        latest_liquidation",
              "            parameters=cast(dict[str, JsonValue], pivot_params),\n"
              "            detection_event_confirmed=pivot_detected_event.is_confirmed,\n"
              "        )\n\n        latest_liquidation",
          )
          replace_once(
              "ai_strategy_engine/src/strategy_engine/registry.py",
              "            value = parameters[name] if name in parameters else spec.default\n",
              "            value = parameters.get(name, spec.default)\n",
          )
          replace_once(
              "ai_strategy_engine/src/strategy_engine/validation/leakage.py",
              "        parsed = datetime.fromisoformat(raw_value.replace(\"Z\", \"+00:00\"))\n",
              "        parsed = datetime.fromisoformat(raw_value)\n",
          )
          PY

      - name: Format and lint patched files
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.21
          ruff format \
            ai_platform/research/strategy_engine/ase00_adapter.py \
            ai_strategy_engine/src/strategy_engine/registry.py \
            ai_strategy_engine/src/strategy_engine/validation/leakage.py
          ruff check \
            ai_platform/research/strategy_engine/ase00_adapter.py \
            ai_strategy_engine/src/strategy_engine/registry.py \
            ai_strategy_engine/src/strategy_engine/validation/leakage.py

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ase00-final-patches.yml
          git add -A
          git commit -m "fix(ai-strategy): complete pivot and lint hardening"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
