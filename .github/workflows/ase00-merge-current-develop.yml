name: ASE-00 Merge Current Develop

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ase00-merge-current-develop.yml

permissions:
  contents: write

concurrency:
  group: ase00-merge-current-develop
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out continued branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0
      - name: Merge latest develop
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --no-ff --no-edit origin/develop
      - name: Remove temporary workflow and push
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/ase00-merge-current-develop.yml
          git add -A
          git commit -m "chore(ai-strategy): remove temporary develop merge workflow"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
