name: ASE-00 merge latest develop

on:
  push:
    branches:
      - agent/ase-00-ai-strategy-engine-foundation
    paths:
      - .github/workflows/ase00-merge-latest-develop.yml

permissions:
  contents: write

concurrency:
  group: ase00-merge-latest-develop
  cancel-in-progress: false

jobs:
  merge:
    name: Merge develop without force-push
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0
          persist-credentials: false

      - name: Merge latest develop and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --no-ff --no-commit origin/develop
          git rm .github/workflows/ase00-merge-latest-develop.yml
          git commit -m "chore(ai-strategy): merge latest develop for final validation"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
