name: ASE-00 Remove Adapter Unused Imports

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ase00-remove-unused-imports.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0
      - name: Remove unused imports
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ai_platform/research/strategy_engine/ase00_adapter.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from dataclasses import dataclass, replace\n', 'from dataclasses import dataclass\n')
          text = text.replace('from datetime import UTC, datetime, timedelta\n', 'from datetime import datetime, timedelta\n')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ase00-remove-unused-imports.yml
          git add -A
          git commit -m "fix(ai-strategy): remove unused adapter imports"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
