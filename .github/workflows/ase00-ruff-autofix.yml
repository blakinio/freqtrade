name: ASE-00 Ruff Autofix

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/ase00-ruff-autofix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: pip install ruff
      - name: Apply safe package fixes and formatting
        working-directory: ai_strategy_engine
        run: |
          ruff check --fix . || true
          ruff format .
      - name: Apply safe platform fixes and formatting
        run: |
          ruff check --fix ai_platform/research/strategy_engine \
            tests/ai_platform_integration/conftest.py \
            tests/ai_platform_integration/test_ase00_vertical_slice.py || true
          ruff format ai_platform/research/strategy_engine \
            tests/ai_platform_integration/conftest.py \
            tests/ai_platform_integration/test_ase00_vertical_slice.py
      - name: Commit autofixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ase00-ruff-autofix.yml
          git add -A
          git commit -m "style(ai-strategy): apply Ruff fixes and formatting"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
