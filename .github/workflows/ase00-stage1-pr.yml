name: ASE-00 Verified Member Recovery

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ase00-stage1-pr.yml

permissions:
  contents: write

concurrency:
  group: ase00-verified-member-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0

      - name: Recover every CRC-verified member
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import binascii
          import hashlib
          import io
          import struct
          import zlib
          import zipfile
          from pathlib import Path

          root = Path("ai_strategy_engine").resolve()
          part_paths = sorted((root / "bootstrap").glob("strategy_engine_source.zip.b64.part*"))
          payload = base64.b64decode(
              b"".join(path.read_bytes().strip() for path in part_paths), validate=True
          )
          damaged = {
              "examples/signal_event.json",
              "src/strategy_engine/features/momentum.py",
              "tests/unit/test_squeeze.py",
          }
          recovered: list[str] = []
          skipped: list[str] = []

          def raw_member(info: zipfile.ZipInfo) -> bytes:
              header = payload[info.header_offset:info.header_offset + 30]
              _, _, _, _, _, _, _, _, _, name_len, extra_len = struct.unpack(
                  "<IHHHHHIIIHH", header
              )
              start = info.header_offset + 30 + name_len + extra_len
              return payload[start:start + info.compress_size]

          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              for info in archive.infolist():
                  destination = (root / info.filename).resolve()
                  if root not in destination.parents and destination != root:
                      raise RuntimeError(f"unsafe archive path: {info.filename}")
                  if info.is_dir():
                      destination.mkdir(parents=True, exist_ok=True)
                      continue
                  if info.filename in damaged:
                      skipped.append(info.filename)
                      continue
                  content = archive.read(info)
                  actual_crc = binascii.crc32(content) & 0xFFFFFFFF
                  if actual_crc != info.CRC or len(content) != info.file_size:
                      raise RuntimeError(f"member verification failed: {info.filename}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(content)
                  recovered.append(info.filename)

              signal_info = archive.getinfo("examples/signal_event.json")
              signal_raw = raw_member(signal_info)
              signal_bad = zlib.decompress(signal_raw, -15)
              signal_good = signal_bad.replace(
                  b"OtRDROP_CONFIRMED", b"OI_DROP_CONFIRMED"
              )
              if len(signal_good) != signal_info.file_size:
                  raise RuntimeError("signal_event recovered size mismatch")
              if (binascii.crc32(signal_good) & 0xFFFFFFFF) != signal_info.CRC:
                  raise RuntimeError("signal_event recovered CRC mismatch")
              signal_path = root / signal_info.filename
              signal_path.parent.mkdir(parents=True, exist_ok=True)
              signal_path.write_bytes(signal_good)
              recovered.append(signal_info.filename)

              squeeze_info = archive.getinfo("tests/unit/test_squeeze.py")
              squeeze_path = root / squeeze_info.filename
              squeeze_content = squeeze_path.read_bytes()
              if len(squeeze_content) != squeeze_info.file_size:
                  raise RuntimeError("test_squeeze recovered size mismatch")
              if (binascii.crc32(squeeze_content) & 0xFFFFFFFF) != squeeze_info.CRC:
                  raise RuntimeError("test_squeeze recovered CRC mismatch")
              recovered.append(squeeze_info.filename)

          report = [
              "# ASE-00 verified-member recovery",
              "",
              f"- damaged archive SHA-256: `{hashlib.sha256(payload).hexdigest()}`",
              "- required archive SHA-256 remains: `73a0d99cab94ba116818a6aef9d818a710fb048a4c0b77f89b9819dd9ac7332f`",
              "- recovery rule: write only members whose uncompressed size and CRC match the ZIP central directory",
              "- `examples/signal_event.json`: corrected `OtRDROP_CONFIRMED` to `OI_DROP_CONFIRMED`; exact expected size and CRC proven",
              "- `tests/unit/test_squeeze.py`: restored from the already committed reference test; exact expected size and CRC proven",
              "- `src/strategy_engine/features/momentum.py`: not written; exact bytes still unresolved",
              "",
              "## Recovered members",
              *[f"- `{name}`" for name in sorted(set(recovered))],
              "",
              "## Intentionally unresolved members",
              *[f"- `{name}`" for name in sorted(set(skipped) - {"examples/signal_event.json", "tests/unit/test_squeeze.py"})],
          ]
          (root / "docs/verified-member-recovery.md").write_text(
              "\n".join(report) + "\n", encoding="utf-8"
          )
          PY

      - name: Commit recovered normal files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ai_strategy_engine
          git commit -m "feat(ai-strategy): recover CRC-verified ASE-00 starter files"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
