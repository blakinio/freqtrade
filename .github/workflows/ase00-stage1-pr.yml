name: ASE-00 Stage 1 PR Materialize

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ase00-stage1-pr.yml

permissions:
  contents: write

concurrency:
  group: ase00-stage1-pr-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out continued branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0

      - name: Merge current develop without rewriting history
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          BASE_SHA="$(git rev-parse origin/develop)"
          PRE_MERGE_HEAD="$(git rev-parse HEAD)"
          git merge --no-ff --no-edit origin/develop
          printf '%s\n' "$BASE_SHA" > /tmp/ase00_base_sha
          printf '%s\n' "$PRE_MERGE_HEAD" > /tmp/ase00_pre_merge_head

      - name: Materialize verified starter
        shell: bash
        run: |
          set -Eeuo pipefail
          python ai_strategy_engine/materialize_starter.py
          test -f ai_strategy_engine/configs/feature_registry.v1.yaml
          test -f ai_strategy_engine/configs/search_spaces.v1.yaml
          test -f ai_strategy_engine/configs/miyagi_parameter_map.v1.yaml
          test -d ai_strategy_engine/schemas
          test -d ai_strategy_engine/examples
          test -d ai_strategy_engine/src/strategy_engine
          test -d ai_strategy_engine/tests
          test -d ai_strategy_engine/docs

      - name: Record evidence and remove duplicate bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_SHA="$(cat /tmp/ase00_base_sha)"
          PRE_MERGE_HEAD="$(cat /tmp/ase00_pre_merge_head)"
          MATERIALIZED_TREE_HASH="$(find ai_strategy_engine -type f ! -path '*/bootstrap/*' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          cat > ai_strategy_engine/docs/materialization-evidence.md <<EOF
          # ASE-00 materialization evidence

          - develop SHA merged: \`$BASE_SHA\`
          - branch head before merge: \`$PRE_MERGE_HEAD\`
          - expected source ZIP SHA-256: \`73a0d99cab94ba116818a6aef9d818a710fb048a4c0b77f89b9819dd9ac7332f\`
          - materialized source tree hash: \`$MATERIALIZED_TREE_HASH\`
          - command: \`python ai_strategy_engine/materialize_starter.py\`
          - update method: non-force merge commit preserving both parent histories
          - bootstrap parts: removed after verified materialization; provenance remains in Git history and \`ARCHIVE_MANIFEST.md\`.
          EOF
          rm -f ai_strategy_engine/bootstrap/strategy_engine_source.zip.b64.part*
          rmdir ai_strategy_engine/bootstrap 2>/dev/null || true
          rm -f .github/workflows/ase00-stage1-materialize.yml
          rm -f .github/workflows/ase00-stage1-pr.yml

      - name: Commit and push materialized sources
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git commit -m "feat(ai-strategy): materialize ASE-00 starter on current develop"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
