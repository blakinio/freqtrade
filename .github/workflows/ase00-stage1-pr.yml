name: ASE-00 Stage 1 PR Materialize

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ase00-stage1-pr.yml

permissions:
  contents: write

concurrency:
  group: ase00-stage1-pr-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out continued branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0

      - name: Merge current develop without rewriting history
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          BASE_SHA="$(git rev-parse origin/develop)"
          PRE_MERGE_HEAD="$(git rev-parse HEAD)"
          git merge --no-ff --no-edit origin/develop
          printf '%s\n' "$BASE_SHA" > /tmp/ase00_base_sha
          printf '%s\n' "$PRE_MERGE_HEAD" > /tmp/ase00_pre_merge_head

      - name: Materialize and collect exact diagnostics
        shell: bash
        run: |
          set -u
          mkdir -p ai_strategy_engine/docs
          set +e
          python ai_strategy_engine/materialize_starter.py > /tmp/ase00-materialize.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/ase00_materialize_rc
          find ai_strategy_engine -maxdepth 5 -type f -print | LC_ALL=C sort > /tmp/ase00_file_inventory
          cat /tmp/ase00-materialize.log

      - name: Record evidence and commit observable state
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_SHA="$(cat /tmp/ase00_base_sha)"
          PRE_MERGE_HEAD="$(cat /tmp/ase00_pre_merge_head)"
          RC="$(cat /tmp/ase00_materialize_rc)"
          required=(
            ai_strategy_engine/configs/feature_registry.v1.yaml
            ai_strategy_engine/configs/search_spaces.v1.yaml
            ai_strategy_engine/configs/miyagi_parameter_map.v1.yaml
            ai_strategy_engine/schemas
            ai_strategy_engine/examples
            ai_strategy_engine/src/strategy_engine
            ai_strategy_engine/tests
            ai_strategy_engine/docs
          )
          : > /tmp/ase00_missing
          for path in "${required[@]}"; do
            if [[ ! -e "$path" ]]; then
              printf '%s\n' "$path" >> /tmp/ase00_missing
            fi
          done
          status=incomplete
          if [[ "$RC" == "0" && ! -s /tmp/ase00_missing ]]; then
            status=complete
          fi
          MATERIALIZED_TREE_HASH="$(find ai_strategy_engine -type f ! -path '*/bootstrap/*' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          {
            echo '# ASE-00 materialization evidence'
            echo
            echo "- status: \`$status\`"
            echo "- develop SHA merged in runner: \`$BASE_SHA\`"
            echo "- branch head before runner merge: \`$PRE_MERGE_HEAD\`"
            echo "- materializer exit code: \`$RC\`"
            echo '- expected source ZIP SHA-256: `73a0d99cab94ba116818a6aef9d818a710fb048a4c0b77f89b9819dd9ac7332f`'
            echo "- materialized source tree hash: \`$MATERIALIZED_TREE_HASH\`"
            echo '- command: `python ai_strategy_engine/materialize_starter.py`'
            echo '- update method: non-force merge preserving both parent histories'
            echo
            echo '## Missing required paths'
            if [[ -s /tmp/ase00_missing ]]; then
              sed 's/^/- `/' /tmp/ase00_missing | sed 's/$/`/'
            else
              echo '- none'
            fi
            echo
            echo '## Materializer output'
            echo '```text'
            cat /tmp/ase00-materialize.log
            echo '```'
            echo
            echo '## Materialized file inventory'
            echo '```text'
            cat /tmp/ase00_file_inventory
            echo '```'
          } > ai_strategy_engine/docs/materialization-evidence.md
          if [[ "$status" == "complete" ]]; then
            rm -f ai_strategy_engine/bootstrap/strategy_engine_source.zip.b64.part*
            rmdir ai_strategy_engine/bootstrap 2>/dev/null || true
            rm -f .github/workflows/ase00-stage1-materialize.yml
            rm -f .github/workflows/ase00-stage1-pr.yml
          fi
          printf '%s\n' "$status" > /tmp/ase00_materialize_status
          git add -A
          git commit -m "feat(ai-strategy): materialize ASE-00 starter on current develop"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation

      - name: Enforce complete materialization
        shell: bash
        run: test "$(cat /tmp/ase00_materialize_status)" = complete
