name: ASE-00 Deflate Recovery

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ase00-stage1-pr.yml

permissions:
  contents: write

concurrency:
  group: ase00-deflate-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0

      - name: Recover one-byte DEFLATE corruption and verify full archive
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import binascii
          import hashlib
          import io
          import struct
          import zlib
          import zipfile
          from pathlib import Path

          EXPECTED = "73a0d99cab94ba116818a6aef9d818a710fb048a4c0b77f89b9819dd9ac7332f"
          root = Path("ai_strategy_engine")
          part_paths = sorted((root / "bootstrap").glob("strategy_engine_source.zip.b64.part*"))
          part_lengths = [len(path.read_bytes().strip()) for path in part_paths]
          encoded = b"".join(path.read_bytes().strip() for path in part_paths)
          original_payload = base64.b64decode(encoded, validate=True)
          patched_payload = bytearray(original_payload)
          targets = (
              "examples/signal_event.json",
              "src/strategy_engine/features/momentum.py",
              "tests/unit/test_squeeze.py",
          )
          findings: list[str] = []

          def member_location(payload: bytes, info: zipfile.ZipInfo) -> tuple[int, bytes]:
              header = payload[info.header_offset:info.header_offset + 30]
              _, _, _, _, _, _, _, _, _, name_len, extra_len = struct.unpack(
                  "<IHHHHHIIIHH", header
              )
              start = info.header_offset + 30 + name_len + extra_len
              return start, payload[start:start + info.compress_size]

          def matches(info: zipfile.ZipInfo, raw: bytes) -> bool:
              try:
                  if info.compress_type == zipfile.ZIP_DEFLATED:
                      content = zlib.decompress(raw, -15)
                  elif info.compress_type == zipfile.ZIP_STORED:
                      content = raw
                  else:
                      return False
              except zlib.error:
                  return False
              return (
                  len(content) == info.file_size
                  and (binascii.crc32(content) & 0xFFFFFFFF) == info.CRC
              )

          with zipfile.ZipFile(io.BytesIO(original_payload)) as archive:
              for name in targets:
                  info = archive.getinfo(name)
                  start, raw = member_location(original_payload, info)
                  found: tuple[int, int, int, bytes] | None = None
                  candidate = bytearray(raw)
                  for offset, original in enumerate(raw):
                      for replacement in range(256):
                          if replacement == original:
                              continue
                          candidate[offset] = replacement
                          candidate_bytes = bytes(candidate)
                          if matches(info, candidate_bytes):
                              found = (offset, original, replacement, candidate_bytes)
                              break
                      candidate[offset] = original
                      if found is not None:
                          break
                  if found is None:
                      findings.append(f"- `{name}`: no one-byte compressed-stream correction found")
                      continue
                  offset, original, replacement, candidate_bytes = found
                  patched_payload[start:start + info.compress_size] = candidate_bytes
                  findings.append(
                      f"- `{name}`: compressed offset `{offset}` changed `{original:02x}` -> `{replacement:02x}`; "
                      f"absolute ZIP offset `{start + offset}`"
                  )

          patched_bytes = bytes(patched_payload)
          patched_sha = hashlib.sha256(patched_bytes).hexdigest()
          zip_ok = False
          bad_member: str | None = None
          try:
              with zipfile.ZipFile(io.BytesIO(patched_bytes)) as archive:
                  bad_member = archive.testzip()
                  zip_ok = bad_member is None
          except Exception as exc:
              bad_member = f"{type(exc).__name__}: {exc}"

          recovered_exactly = patched_sha == EXPECTED and zip_ok
          report = [
              "# ASE-00 DEFLATE recovery",
              "",
              f"- original ZIP SHA-256: `{hashlib.sha256(original_payload).hexdigest()}`",
              f"- expected ZIP SHA-256: `{EXPECTED}`",
              *findings,
              f"- patched ZIP SHA-256: `{patched_sha}`",
              f"- all ZIP members valid: `{str(zip_ok).lower()}`",
              f"- first invalid member/error: `{bad_member}`",
              f"- exact expected archive recovered: `{str(recovered_exactly).lower()}`",
          ]
          (root / "docs/deflate-recovery.md").write_text(
              "\n".join(report) + "\n", encoding="utf-8"
          )
          Path("/tmp/ase00_recovered_exactly").write_text(
              "1" if recovered_exactly else "0", encoding="ascii"
          )

          if recovered_exactly:
              repaired_encoded = base64.b64encode(patched_bytes)
              if len(repaired_encoded) != sum(part_lengths):
                  raise RuntimeError("repaired Base64 length changed")
              cursor = 0
              for path, length in zip(part_paths, part_lengths, strict=True):
                  path.write_bytes(repaired_encoded[cursor:cursor + length])
                  cursor += length
          PY

      - name: Run required materializer after exact recovery
        if: hashFiles('/tmp/ase00_recovered_exactly') != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$(cat /tmp/ase00_recovered_exactly)" == "1" ]]; then
            rm -rf ai_strategy_engine/configs ai_strategy_engine/schemas ai_strategy_engine/examples ai_strategy_engine/src
            python ai_strategy_engine/materialize_starter.py
            test -f ai_strategy_engine/configs/feature_registry.v1.yaml
            test -f ai_strategy_engine/configs/search_spaces.v1.yaml
            test -f ai_strategy_engine/configs/miyagi_parameter_map.v1.yaml
            test -d ai_strategy_engine/schemas
            test -d ai_strategy_engine/examples
            test -d ai_strategy_engine/src/strategy_engine
            test -d ai_strategy_engine/tests
            test -d ai_strategy_engine/docs
          fi

      - name: Commit recovery evidence and exact materialization
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$(cat /tmp/ase00_recovered_exactly)" == "1" ]]; then
            rm -f ai_strategy_engine/bootstrap/strategy_engine_source.zip.b64.part*
            rmdir ai_strategy_engine/bootstrap 2>/dev/null || true
            rm -f .github/workflows/ase00-stage1-materialize.yml
            rm -f .github/workflows/ase00-stage1-pr.yml
          fi
          git add -A
          git add -f ai_strategy_engine
          git commit -m "feat(ai-strategy): recover and materialize verified ASE-00 starter"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
