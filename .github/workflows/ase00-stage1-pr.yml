name: ASE-00 Corrupt Member Recovery

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/ase00-stage1-pr.yml

permissions:
  contents: write

concurrency:
  group: ase00-corrupt-member-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
          fetch-depth: 0

      - name: Inspect corrupted ZIP member
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import binascii
          import hashlib
          import json
          import struct
          import zlib
          import zipfile
          from pathlib import Path

          root = Path("ai_strategy_engine")
          parts = sorted((root / "bootstrap").glob("strategy_engine_source.zip.b64.part*"))
          payload = base64.b64decode(b"".join(path.read_bytes().strip() for path in parts), validate=True)
          archive_path = Path("/tmp/ase00-current.zip")
          archive_path.write_bytes(payload)
          target_name = "examples/signal_event.json"
          lines = [
              "# ASE-00 corrupted-member analysis",
              "",
              f"- archive sha256: `{hashlib.sha256(payload).hexdigest()}`",
              f"- archive bytes: `{len(payload)}`",
          ]

          with zipfile.ZipFile(archive_path) as archive:
              target = archive.getinfo(target_name)
              lines.extend([
                  f"- target: `{target.filename}`",
                  f"- expected CRC32: `{target.CRC:08x}`",
                  f"- uncompressed size: `{target.file_size}`",
                  f"- compressed size: `{target.compress_size}`",
                  f"- compression method: `{target.compress_type}`",
                  f"- flag bits: `{target.flag_bits}`",
                  f"- header offset: `{target.header_offset}`",
                  f"- timestamp: `{target.date_time}`",
              ])
              header = payload[target.header_offset:target.header_offset + 30]
              signature, version, flags, method, mtime, mdate, crc, csize, usize, name_len, extra_len = struct.unpack(
                  "<IHHHHHIIIHH", header
              )
              data_start = target.header_offset + 30 + name_len + extra_len
              raw = payload[data_start:data_start + target.compress_size]
              lines.extend([
                  f"- local header signature: `{signature:08x}`",
                  f"- local CRC32 field: `{crc:08x}`",
                  f"- data start: `{data_start}`",
                  f"- raw compressed sha256: `{hashlib.sha256(raw).hexdigest()}`",
                  f"- raw compressed hex: `{raw.hex()}`",
              ])
              try:
                  if method == zipfile.ZIP_DEFLATED:
                      decoded = zlib.decompress(raw, -15)
                  elif method == zipfile.ZIP_STORED:
                      decoded = raw
                  else:
                      raise RuntimeError(f"unsupported method {method}")
                  lines.extend([
                      f"- raw decompression: `success`",
                      f"- actual uncompressed bytes: `{len(decoded)}`",
                      f"- actual CRC32: `{binascii.crc32(decoded) & 0xffffffff:08x}`",
                      f"- actual sha256: `{hashlib.sha256(decoded).hexdigest()}`",
                      "",
                      "## Decompressed target content",
                      "```text",
                      decoded.decode("utf-8", errors="backslashreplace"),
                      "```",
                      "",
                      "## Decompressed target repr",
                      "```text",
                      repr(decoded),
                      "```",
                  ])
                  Path("/tmp/signal_event_corrupt.bin").write_bytes(decoded)
              except Exception as exc:
                  lines.append(f"- raw decompression: `failure: {type(exc).__name__}: {exc}`")

              lines.extend(["", "## Per-member validation"])
              for info in archive.infolist():
                  if info.is_dir():
                      continue
                  try:
                      content = archive.read(info)
                      status = f"ok crc={binascii.crc32(content) & 0xffffffff:08x}"
                  except Exception as exc:
                      status = f"FAIL {type(exc).__name__}: {exc}"
                  lines.append(f"- `{info.filename}`: {status}")

          Path("ai_strategy_engine/docs/corrupt-member-analysis.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

      - name: Commit analysis
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ai_strategy_engine/docs/corrupt-member-analysis.md
          git commit -m "docs(ai-strategy): inspect corrupted starter member"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
