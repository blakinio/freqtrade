name: ASE-00 Sync Canonical Contracts

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/ase00-sync-contracts.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/ase-00-ai-strategy-engine-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/ase-00-ai-strategy-engine-foundation
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install package
        working-directory: ai_strategy_engine
        run: pip install -e .
      - name: Generate schemas and canonical examples
        working-directory: ai_strategy_engine
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          from strategy_engine.domain.models import (
              FeatureRecord,
              SignalEvent,
              StrategyDefinition,
          )

          root = Path('.')
          schemas = {
              root / 'schemas/feature-record.v1.schema.json': FeatureRecord,
              root / 'schemas/signal-event.v1.schema.json': SignalEvent,
              root / 'schemas/strategy-definition.v1.schema.json': StrategyDefinition,
          }
          for path, model in schemas.items():
              path.write_text(
                  json.dumps(model.model_json_schema(), indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
              )

          for path in sorted((root / 'examples').glob('strategy*.json')):
              document = json.loads(path.read_text(encoding='utf-8'))
              previous = document.get('provenance', {})
              parent_experiments = previous.get('parent_experiments', [])
              document['schema_version'] = '1.0.0'
              document['provenance'] = {
                  'producer': 'ase00-research-spec',
                  'source_event_id': f'example:{path.stem}',
                  'lineage': parent_experiments,
                  'details': {
                      **previous,
                      'lineage_complete': True,
                      'future_shift': 0,
                      'research_only': True,
                  },
              }
              StrategyDefinition.model_validate(document)
              path.write_text(
                  json.dumps(document, indent=2, sort_keys=True) + '\n', encoding='utf-8'
              )

          signal_path = root / 'examples/signal_event.json'
          signal = json.loads(signal_path.read_text(encoding='utf-8'))
          previous_signal_provenance = signal.get('provenance', {})
          signal.update(
              {
                  'schema_version': '1.0.0',
                  'signal_version': '1',
                  'is_confirmed': True,
                  'idempotency_key': hashlib.sha256(b'ase00-example-signal').hexdigest(),
                  'code_version': hashlib.sha256(b'ase00-example-code').hexdigest(),
                  'data_version': hashlib.sha256(b'ase00-example-data').hexdigest(),
                  'configuration_hash': hashlib.sha256(b'ase00-example-config').hexdigest(),
                  'provenance': {
                      'producer': 'ase00-example',
                      'source_event_id': 'example:signal_event',
                      'lineage': [],
                      'details': {
                          **previous_signal_provenance,
                          'lineage_complete': True,
                          'future_shift': 0,
                          'research_only': True,
                      },
                  },
              }
          )
          SignalEvent.model_validate(signal)
          signal_path.write_text(
              json.dumps(signal, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          feature = {
              'schema_version': '1.0.0',
              'feature_id': 'squeeze_ratio.v1',
              'feature_version': '1',
              'symbol': 'BTC/USDT:USDT',
              'timeframe': '5m',
              'event_time': '2026-07-28T01:00:00Z',
              'detected_at': '2026-07-28T01:05:00Z',
              'available_at': '2026-07-28T01:05:00.025Z',
              'value': {'value': 0.83, 'squeeze_release': True},
              'source': 'ase00-clean-room-squeeze',
              'is_confirmed': True,
              'idempotency_key': hashlib.sha256(b'ase00-example-feature').hexdigest(),
              'code_version': hashlib.sha256(b'ase00-example-code').hexdigest(),
              'data_version': hashlib.sha256(b'ase00-example-data').hexdigest(),
              'configuration_hash': hashlib.sha256(b'ase00-example-config').hexdigest(),
              'parameters': {'bb_length': 20, 'bb_mult': 2.0},
              'provenance': {
                  'producer': 'ase00-example',
                  'source_event_id': 'example:market-bar',
                  'lineage': [],
                  'details': {'lineage_complete': True, 'future_shift': 0},
              },
          }
          FeatureRecord.model_validate(feature)
          (root / 'examples/feature_record.json').write_text(
              json.dumps(feature, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - name: Commit generated canonical artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ase00-sync-contracts.yml
          git add -A
          git commit -m "feat(ai-strategy): sync canonical schemas and examples"
          git push origin HEAD:agent/ase-00-ai-strategy-engine-foundation
