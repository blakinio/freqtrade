name: Narrow Freqtrade Runner Cutover Permissions

on:
  push:
    branches:
      - fix/freqtrade-synology-runner-dedicated-cutover-20260727
    paths:
      - ".github/workflows/autofix-freqtrade-runner-cutover-permissions.yml"

permissions:
  contents: read

jobs:
  apply-exact-fix:
    if: github.ref == 'refs/heads/fix/freqtrade-synology-runner-dedicated-cutover-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/freqtrade-synology-runner-dedicated-cutover-20260727

      - name: Apply exact permission narrowing and self-delete
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/freqtrade-synology-runner-dedicated-cutover.yml")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "permissions:\n  contents: read\n  statuses: write\n": (
                  "permissions:\n  contents: read\n"
              ),
              "  verify-live-cutover:\n"
              "    if: needs.stabilization-delay.result == 'success' && github.ref == 'refs/heads/develop'\n"
              "    needs: stabilization-delay\n"
              "    runs-on: [freqtrade-staging]\n": (
                  "  verify-live-cutover:\n"
                  "    if: needs.stabilization-delay.result == 'success' && github.ref == 'refs/heads/develop'\n"
                  "    needs: stabilization-delay\n"
                  "    permissions:\n"
                  "      contents: read\n"
                  "      statuses: write\n"
                  "    runs-on: [freqtrade-staging]\n"
              ),
              "  cutover-watchdog:\n"
              "    if: always() && github.ref == 'refs/heads/develop'\n"
              "    needs: launch-cutover\n"
              "    runs-on: ubuntu-latest\n": (
                  "  cutover-watchdog:\n"
                  "    if: always() && github.ref == 'refs/heads/develop'\n"
                  "    needs: launch-cutover\n"
                  "    permissions:\n"
                  "      contents: read\n"
                  "      statuses: write\n"
                  "    runs-on: ubuntu-latest\n"
              ),
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match for bounded replacement: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/autofix-freqtrade-runner-cutover-permissions.yml

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/autofix-freqtrade-runner-cutover-permissions.yml
            .github/workflows/freqtrade-synology-runner-dedicated-cutover.yml
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/freqtrade-synology-runner-dedicated-cutover.yml
          git commit -m "fix(deploy): narrow cutover status permissions"
          git push origin HEAD:fix/freqtrade-synology-runner-dedicated-cutover-20260727
