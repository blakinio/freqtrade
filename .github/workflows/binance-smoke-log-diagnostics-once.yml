name: Binance Smoke Log Diagnostics Once

on:
  pull_request:
    types: [synchronize]
    branches:
      - develop

permissions:
  actions: read
  contents: read

jobs:
  diagnostics:
    if: github.event.pull_request.head.ref == 'chore/binance-smoke-log-diagnostics-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print exact failed smoke exception
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/blakinio/freqtrade/actions/jobs/89912491614/logs \
            | grep -a -E -C 10 'Traceback \(most recent call last\)|urllib\.error\.|ssl\.SSLError|TimeoutError|ConnectionError|Binance Spot instrument smoke failed|Process completed with exit code' \
            | tail -n 100
