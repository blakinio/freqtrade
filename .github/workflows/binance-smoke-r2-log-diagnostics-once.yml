name: Binance Smoke R2 Log Diagnostics Once

on:
  pull_request:
    types: [opened]
    branches:
      - develop

permissions:
  actions: read
  contents: read

jobs:
  diagnostics:
    if: github.event.pull_request.head.ref == 'chore/binance-smoke-r2-log-diagnostics-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print exact second smoke exception
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/blakinio/freqtrade/actions/jobs/89917454366/logs \
            | grep -a -E -C 18 'Traceback \(most recent call last\)|urllib\.error\.|HTTPError|URLError|ssl\.SSLError|TimeoutError|ConnectionError|JSONDecodeError|ValueError:|RuntimeError:|Process completed with exit code' \
            | tail -n 140
