name: One-shot deploy Bitget Demo UTA sidecar

"on":
  push:
    branches:
      - ops/bitget-demo-uta-sidecar-deploy-20260912
    paths:
      - .github/workflows/bitget-demo-uta-sidecar-oneshot.yml

permissions:
  contents: read

concurrency:
  group: bitget-demo-uta-sidecar-oneshot-20260912
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated Bitget Demo UTA sidecar
    runs-on:
      - freqtrade-staging
    timeout-minutes: 15
    steps:
      - name: Validate bounded host inputs and WickHunter health
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/ops/bitget-demo-uta-sidecar-deploy-20260912" ]]
          [[ "$GITHUB_EVENT_NAME" == "push" ]]
          docker version >/dev/null
          ROOT=/volume1/docker/bitget-demo-uta-sidecar
          docker pull python:3.12-alpine >/dev/null
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-alpine)"
          [[ "$image_ref" == python@sha256:* || "$image_ref" == python:*@sha256:* ]]
          docker run --rm -i --network none \
            -v "$ROOT:/mnt:ro" \
            "$image_ref" python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('/mnt')
          expected={
              'app/bitget_demo_uta.py':'6d7d3086edd07dfa597f063f0dd86a9e05e8b4c2fbeeaaf4e7fa90fc3e685bb8',
              'app/bitget_demo_sidecar.py':'cafd8c1815c4f642855a7fd084e2cbf991cc9db7d79e6b8f4dd4504b7bfc621f',
          }
          for rel,digest in expected.items():
              p=root/rel
              assert p.is_file() and not p.is_symlink()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
          c=root/'credentials.json'
          assert c.is_file() and not c.is_symlink()
          payload=json.loads(c.read_text())
          assert set(payload)=={'api_key','api_secret','passphrase'}
          assert all(isinstance(v,str) and v for v in payload.values())
          PY
          docker run --rm -i --network host "$image_ref" python - <<'PY'
          import json, ssl, urllib.request
          ctx=ssl._create_unverified_context()
          with urllib.request.urlopen('https://192.168.1.2:8443/api/health',context=ctx,timeout=8) as r:
              p=json.loads(r.read().decode())
          assert p=={'ok':True,'version':'0.90.63'}
          PY
          echo "SIDECAR_IMAGE_REF=$image_ref" >> "$GITHUB_ENV"

      - name: Deploy hardened persistent sidecar
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/volume1/docker/bitget-demo-uta-sidecar
          NAME=bitget-demo-uta-sidecar
          image_ref="$SIDECAR_IMAGE_REF"
          existing="$(docker ps -aq --filter "name=^/${NAME}$")"
          if [[ -n "$existing" ]]; then
            [[ "$(docker inspect --format '{{index .Config.Labels "com.openai.task"}}' "$existing")" == "bitget-demo-uta-sidecar-20260912" ]]
            docker rm -f "$NAME" >/dev/null
          fi
          docker run --rm --network none -v "$ROOT:/mnt" "$image_ref" sh -ec '
            mkdir -p /mnt/control/inbox /mnt/control/outbox /mnt/control/processing
            chown -R 65532:65532 /mnt/control
            chmod -R u=rwX,g=rX,o= /mnt/control
            chown root:65532 /mnt/credentials.json
            chmod 0440 /mnt/credentials.json
            chown root:root /mnt/app/bitget_demo_uta.py /mnt/app/bitget_demo_sidecar.py
            chmod 0444 /mnt/app/bitget_demo_uta.py /mnt/app/bitget_demo_sidecar.py
          '
          docker run -d --name "$NAME" \
            --restart unless-stopped \
            --user 65532:65532 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 128m --memory-swap 128m --cpus 0.50 --pids-limit 64 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --label com.openai.task=bitget-demo-uta-sidecar-20260912 \
            --label com.openai.real_capital=false \
            --label com.openai.exchange=bitget-demo \
            -v "$ROOT/app:/app:ro" \
            -v "$ROOT/credentials.json:/run/secrets/bitget_demo.json:ro" \
            -v "$ROOT/control:/control:rw" \
            "$image_ref" python /app/bitget_demo_sidecar.py >/dev/null
          for _ in $(seq 1 60); do
            if docker exec "$NAME" python -c "from pathlib import Path; raise SystemExit(0 if Path('/control/ready.json').is_file() else 1)"; then
              break
            fi
            [[ "$(docker inspect --format '{{.State.Running}}' "$NAME")" == "true" ]]
            sleep 0.5
          done
          docker exec -i "$NAME" python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/control/ready.json').read_text())
          assert p['ok'] is True and p['real_capital'] is False
          d=p['data']
          assert d['accountMode'] in {'hybrid','unified'} and d['holdMode']=='hedge_mode'
          assert float(d['usdtEquity']) >= 1 and d['symbol']=='BTCUSDT'
          assert d['positions']==[] and d['openOrders']==0
          PY
      - name: Prove sidecar control path with read-only status
        shell: bash
        run: |
          set -euo pipefail
          NAME=bitget-demo-uta-sidecar
          docker exec -i "$NAME" python - <<'PY'
          import json, os, time
          from pathlib import Path
          root=Path('/control')
          rid='status'+str(int(time.time()*1000))
          tmp=root/'inbox'/f'{rid}.tmp'
          dst=root/'inbox'/f'{rid}.json'
          tmp.write_text(json.dumps({'request_id':rid,'action':'status'},separators=(',',':')),encoding='utf-8')
          os.replace(tmp,dst)
          out=root/'outbox'/f'{rid}.json'
          end=time.time()+20
          while time.time()<end and not out.exists():
              time.sleep(0.25)
          assert out.exists()
          result=json.loads(out.read_text())
          assert result['ok'] is True
          data=result['data']
          assert data['positions']==[] and data['openOrders']==0
          assert data['accountMode'] in {'hybrid','unified'} and data['holdMode']=='hedge_mode'
          print(json.dumps({'sidecar_status_ok':True,'usdtEquity':data['usdtEquity'],'positions':0,'openOrders':0},separators=(',',':')))
          PY
      - name: Remove task-owned sidecar after failed deployment
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          NAME=bitget-demo-uta-sidecar
          id="$(docker ps -aq --filter "name=^/${NAME}$")"
          [[ -z "$id" ]] && exit 0
          [[ "$(docker inspect --format '{{index .Config.Labels "com.openai.task"}}' "$id")" == "bitget-demo-uta-sidecar-20260912" ]]
          docker rm -f "$NAME" >/dev/null

      - name: Verify persistent sidecar hardening
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          NAME=bitget-demo-uta-sidecar
          [[ "$(docker inspect --format '{{.State.Running}}' "$NAME")" == "true" ]]
          [[ "$(docker inspect --format '{{.Config.User}}' "$NAME")" == "65532:65532" ]]
          [[ "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$NAME")" == "true" ]]
          [[ "$(docker inspect --format '{{.HostConfig.Privileged}}' "$NAME")" == "false" ]]
          [[ "$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$NAME")" == "unless-stopped" ]]
          [[ "$(docker inspect --format '{{index .Config.Labels "com.openai.real_capital"}}' "$NAME")" == "false" ]]
          [[ "$(docker inspect --format '{{index .Config.Labels "com.openai.exchange"}}' "$NAME")" == "bitget-demo" ]]
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$NAME" | grep -q 'ALL'
          ports="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$NAME")"
          [[ "$ports" == "{}" || "$ports" == "null" ]]

      - name: Verify WickHunter health after bounded mutation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${SIDECAR_IMAGE_REF:-$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-alpine)}"
          docker run --rm -i --network host "$image_ref" python - <<'PY'
          import json, ssl, urllib.request
          ctx=ssl._create_unverified_context()
          with urllib.request.urlopen('https://192.168.1.2:8443/api/health',context=ctx,timeout=8) as r:
              p=json.loads(r.read().decode())
          assert p=={'ok':True,'version':'0.90.63'}
          print(json.dumps({'wickhunter_health':'PASS','version':p['version']},separators=(',',':')))
          PY
