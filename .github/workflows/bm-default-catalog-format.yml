name: Format approved bot catalog package

on:
  pull_request:
    branches:
      - develop
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/portal-bm-default-catalog-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/portal-bm-default-catalog-v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --disable-pip-version-check -q ruff==0.15.21
          ruff format \
            ai_platform/portal/bot_catalog/default_catalog.py \
            ai_platform/portal/control_plane/bot_management.py \
            tests/ai_platform/portal/bot_catalog/test_default_catalog.py
          rm .github/workflows/bm-default-catalog-format.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/portal/bot_catalog/default_catalog.py \
            ai_platform/portal/control_plane/bot_management.py \
            tests/ai_platform/portal/bot_catalog/test_default_catalog.py \
            .github/workflows/bm-default-catalog-format.yml
          git commit -m "style(portal): format approved bot catalog package"
          git push origin HEAD:feat/portal-bm-default-catalog-v1
