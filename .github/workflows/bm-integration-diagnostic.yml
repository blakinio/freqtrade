name: Diagnose bot-management API integration

on:
  pull_request:
    branches:
      - develop
    types: [synchronize]

permissions:
  contents: read

jobs:
  focused:
    if: github.head_ref == 'feat/portal-bm-integration-owner-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Focused tests
        run: |
          python -m pip install --disable-pip-version-check -q \
            fastapi httpx pydantic pytest sqlalchemy
          pytest \
            tests/ai_platform/portal/control_plane/test_bot_management_api.py \
            tests/ai_platform/portal/control_plane/test_api.py \
            -q --tb=short
