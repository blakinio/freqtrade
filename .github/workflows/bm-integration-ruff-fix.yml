name: Apply bot-management integration Ruff fixes

on:
  pull_request:
    branches:
      - develop
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/portal-bm-integration-owner-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/portal-bm-integration-owner-v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply safe Ruff fixes and formatting
        run: |
          python -m pip install --disable-pip-version-check -q ruff==0.15.21
          ruff check --fix \
            ai_platform/portal/control_plane/api.py \
            ai_platform/portal/control_plane/database.py \
            ai_platform/portal/control_plane/bot_management.py \
            ai_platform/portal/control_plane/bot_management_errors.py \
            ai_platform/portal/bot_catalog/router.py \
            ai_platform/portal/bot_builder/router.py \
            ai_platform/portal/bot_operations/router.py \
            ai_platform/portal/signal_control/router.py \
            ai_platform/portal/grid_control/router.py \
            ai_platform/portal/exchange_connections/router.py \
            tests/ai_platform/portal/control_plane/test_bot_management_api.py \
            tests/ai_platform/portal/control_plane/test_api.py || true
          ruff format \
            ai_platform/portal/control_plane/api.py \
            ai_platform/portal/control_plane/database.py \
            ai_platform/portal/control_plane/bot_management.py \
            ai_platform/portal/control_plane/bot_management_errors.py \
            ai_platform/portal/bot_catalog/router.py \
            ai_platform/portal/bot_builder/router.py \
            ai_platform/portal/bot_operations/router.py \
            ai_platform/portal/signal_control/router.py \
            ai_platform/portal/grid_control/router.py \
            ai_platform/portal/exchange_connections/router.py \
            tests/ai_platform/portal/control_plane/test_bot_management_api.py \
            tests/ai_platform/portal/control_plane/test_api.py
          Path=.github/workflows/bm-integration-ruff-fix.yml
          rm "$Path"
      - name: Commit exact formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/portal tests/ai_platform/portal \
            .github/workflows/bm-integration-ruff-fix.yml
          git commit -m "style(portal): apply bot-management integration Ruff fixes"
          git push origin HEAD:feat/portal-bm-integration-owner-v1
