name: Report remaining bot-management Ruff findings

on:
  pull_request:
    branches:
      - develop
    types: [synchronize]

permissions:
  contents: read

jobs:
  report:
    if: github.head_ref == 'feat/portal-bm-integration-owner-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Capture remaining findings
        run: |
          python -m pip install --disable-pip-version-check -q ruff==0.15.21
          set +e
          ruff check \
            ai_platform/portal/control_plane/api.py \
            ai_platform/portal/control_plane/database.py \
            ai_platform/portal/control_plane/bot_management.py \
            ai_platform/portal/control_plane/bot_management_errors.py \
            ai_platform/portal/bot_catalog/router.py \
            ai_platform/portal/bot_builder/router.py \
            ai_platform/portal/bot_operations/router.py \
            ai_platform/portal/signal_control/router.py \
            ai_platform/portal/grid_control/router.py \
            ai_platform/portal/exchange_connections/router.py \
            tests/ai_platform/portal/control_plane/test_bot_management_api.py \
            tests/ai_platform/portal/control_plane/test_api.py \
            > bm-integration-ruff-report.txt 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > bm-integration-ruff-exit-code.txt
      - name: Upload Ruff report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bm-integration-ruff-report
          path: |
            bm-integration-ruff-report.txt
            bm-integration-ruff-exit-code.txt
          if-no-files-found: error
          retention-days: 1
