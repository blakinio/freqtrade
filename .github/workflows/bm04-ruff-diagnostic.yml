name: BM04 Ruff Diagnostic

on:
  push:
    branches:
      - diagnostic/bm04-ruff-exact-20260727

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - name: Capture exact diagnostics
        run: |
          set +e
          ruff check ai_platform/portal/signal_control tests/ai_platform/portal/signal_control > bm04-ruff.txt 2>&1
          ruff check --fix --unsafe-fixes ai_platform/portal/signal_control tests/ai_platform/portal/signal_control
          ruff format ai_platform/portal/signal_control tests/ai_platform/portal/signal_control
          git diff --binary -- ai_platform/portal/signal_control tests/ai_platform/portal/signal_control > bm04-ruff.patch
          test -s bm04-ruff.txt
      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bm04-ruff-diagnostic
          path: |
            bm04-ruff.txt
            bm04-ruff.patch
          if-no-files-found: error
          retention-days: 1
