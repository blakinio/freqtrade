name: BM05 Ruff Autofix

on:
  push:
    branches:
      - diagnostic/bm05-ruff-final-20260728
  pull_request:
    branches:
      - feat/portal-bm05-grid-capability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply exact Ruff changes and remove helper
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.21
          ruff check --fix --unsafe-fixes ai_platform/portal/grid_control tests/ai_platform/portal/grid_control
          ruff format ai_platform/portal/grid_control tests/ai_platform/portal/grid_control
          rm .github/workflows/bm05-ruff-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/portal/grid_control tests/ai_platform/portal/grid_control .github/workflows/bm05-ruff-autofix.yml
          git commit -m "style(portal): apply exact BM-05 Ruff fixes"
          git push origin HEAD:diagnostic/bm05-ruff-final-20260728
