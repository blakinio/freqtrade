name: BM05 Ruff Report

on:
  pull_request:
    branches:
      - feat/portal-bm05-grid-capability

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Capture exact Ruff output
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.21
          ruff check ai_platform/portal/grid_control tests/ai_platform/portal/grid_control > bm05-ruff.txt 2>&1 || true
          test -s bm05-ruff.txt
      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bm05-ruff-report
          path: bm05-ruff.txt
          if-no-files-found: error
          retention-days: 1
