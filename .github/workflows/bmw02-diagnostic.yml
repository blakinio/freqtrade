name: BMW-02 focused diagnostic

on:
  pull_request:
    branches: [develop]
    types: [synchronize]

permissions:
  contents: read

jobs:
  focused-tests:
    if: github.head_ref == 'feat/portal-bmw02-command-intent-v3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -q pytest fastapi httpx sqlalchemy pydantic
      - run: >-
          pytest -q
          tests/ai_platform/portal/bot_operations/test_intent_service.py
          tests/ai_platform/portal/bot_operations/test_intent_api.py
