name: BMW-02 focused diagnostic

on:
  pull_request:
    branches: [develop]
    types: [synchronize]

permissions:
  contents: write

jobs:
  focused-tests:
    if: github.head_ref == 'feat/portal-bmw02-command-intent-v3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/portal-bmw02-command-intent-v3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -q -e '.[develop]'
      - name: Capture focused result
        run: |
          set +e
          pytest -q \
            tests/ai_platform/portal/bot_operations/test_intent_service.py \
            tests/ai_platform/portal/bot_operations/test_intent_api.py \
            > docs/agents/tasks/FTAI-20260728-portal-bmw02-diagnostic.txt 2>&1
          status=$?
          echo "exit_status=$status" >> docs/agents/tasks/FTAI-20260728-portal-bmw02-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/agents/tasks/FTAI-20260728-portal-bmw02-diagnostic.txt
          git commit -m "test(portal): capture BMW-02 focused result"
          git push origin HEAD:feat/portal-bmw02-command-intent-v3
