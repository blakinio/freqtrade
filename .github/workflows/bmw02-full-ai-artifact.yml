name: BMW-02 full AI artifact diagnostic

on:
  pull_request:
    branches: [develop]
    types: [synchronize]

permissions:
  contents: read

jobs:
  full-tests:
    if: github.head_ref == 'feat/portal-bmw02-command-intent-v3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -q -e '.[develop]'
      - name: Capture full AI tests
        run: |
          set +e
          pytest -q tests/ai_platform --maxfail=20 > /tmp/bmw02-full-ai.txt 2>&1
          status=$?
          echo "exit_status=$status" >> /tmp/bmw02-full-ai.txt
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bmw02-full-ai-diagnostic
          path: /tmp/bmw02-full-ai.txt
          retention-days: 1
          if-no-files-found: error
