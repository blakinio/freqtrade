name: Apply BMW-02 v3 integration

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/portal-bmw02-command-intent-v3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/portal-bmw02-command-intent-v3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply exact BMW-02 patches
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path("ai_platform/portal/bot_operations/service.py")
          text = service.read_text()
          if "import json\n" not in text:
              text = text.replace("import hashlib\n", "import hashlib\nimport json\n", 1)
          marker = "Clock = Callable[[], datetime]\nIdFactory = Callable[[], UUID]\n\n\n"
          helper = '''Clock = Callable[[], datetime]
          IdFactory = Callable[[], UUID]


          def _command_business_digest(command: BotOperationCommand) -> str:
              payload = command.model_dump(
                  mode="json",
                  exclude={
                      "command_id": True,
                      "correlation": True,
                      "submitted_at": True,
                      "confirmation": {"confirmation_reference": True},
                  },
              )
              canonical = json.dumps(
                  payload,
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              )
              return hashlib.sha256(canonical.encode("utf-8")).hexdigest()


          '''
          if "def _command_business_digest" not in text:
              if marker not in text:
                  raise SystemExit("service type-alias marker missing")
              text = text.replace(marker, helper, 1)
          old = "        command_json = command.canonical_json()\n        digest = hashlib.sha256(command_json.encode()).hexdigest()\n"
          new = "        digest = _command_business_digest(command)\n"
          if old not in text:
              raise SystemExit("command digest marker missing")
          service.write_text(text.replace(old, new, 1))

          api = Path("ai_platform/portal/control_plane/api.py")
          text = api.read_text()
          old = "    app.include_router(build_bot_operations_router(bot_management.commands, context_dependency))\n"
          new = (
              "    app.include_router(\n"
              "        build_bot_operations_router(\n"
              "            bot_management.commands,\n"
              "            bot_management.command_intents,\n"
              "            context_dependency,\n"
              "        )\n"
              "    )\n"
          )
          if old not in text:
              raise SystemExit("bot operations composition marker missing")
          api.write_text(text.replace(old, new, 1))

          detail = Path("ai_platform/portal/web/app/bots/detail/[botId]/page.tsx")
          text = detail.read_text()
          old = "          botId={bot.bot_id}\n          desiredState={bot.desired_state}\n"
          new = (
              "          botId={bot.bot_id}\n"
              "          configRevision={bot.spec.config_revision}\n"
              "          desiredState={bot.desired_state}\n"
          )
          if old not in text:
              raise SystemExit("bot lifecycle component marker missing")
          detail.write_text(text.replace(old, new, 1))

          tests = Path("tests/ai_platform/portal/control_plane/test_api.py")
          text = tests.read_text()
          marker = '        "/v1/bot-management/commands/lifecycle",\n'
          addition = '        "/v1/bot-management/commands/lifecycle-intents",\n' + marker
          if addition not in text:
              if marker not in text:
                  raise SystemExit("OpenAPI lifecycle marker missing")
              text = text.replace(marker, addition, 1)
          tests.write_text(text)

          Path(".github/workflows/bmw02-v3-integration.yml").unlink()
          PY
          python -m pip install --disable-pip-version-check -q ruff==0.15.21
          ruff check --fix \
            ai_platform/portal/bot_operations/intent_service.py \
            ai_platform/portal/bot_operations/router.py \
            ai_platform/portal/bot_operations/service.py \
            ai_platform/portal/control_plane/bot_management.py \
            ai_platform/portal/control_plane/api.py \
            tests/ai_platform/portal/bot_operations/test_intent_service.py \
            tests/ai_platform/portal/bot_operations/test_intent_api.py \
            tests/ai_platform/portal/control_plane/test_api.py
          ruff format \
            ai_platform/portal/bot_operations/intent_service.py \
            ai_platform/portal/bot_operations/router.py \
            ai_platform/portal/bot_operations/service.py \
            ai_platform/portal/control_plane/bot_management.py \
            ai_platform/portal/control_plane/api.py \
            tests/ai_platform/portal/bot_operations/test_intent_service.py \
            tests/ai_platform/portal/bot_operations/test_intent_api.py \
            tests/ai_platform/portal/control_plane/test_api.py
      - name: Commit integrated BMW-02 package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/portal tests/ai_platform/portal .github/workflows/bmw02-v3-integration.yml
          git commit -m "feat(portal): integrate BMW-02 lifecycle intents"
          git push origin HEAD:feat/portal-bmw02-command-intent-v3
