name: BMW-03 Ruff diagnostics

on:
  pull_request:
    branches:
      - develop
    paths:
      - "ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/bmw03-ruff-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: "bmw03-ruff-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feat/portal-bmw03-safe-feature-convergence-v2'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Generate exact Ruff fix patch
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.21
          ruff format ai_platform tests/ai_platform
          ruff check --fix ai_platform tests/ai_platform
          git diff --binary -- ai_platform tests/ai_platform > ruff-fix.patch
          ruff check ai_platform tests/ai_platform > ruff-check-after.txt 2>&1
          ruff format --check ai_platform tests/ai_platform > ruff-format-after.txt 2>&1
          test -s ruff-fix.patch
          cat ruff-fix.patch

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bmw03-ruff-fix
          path: |
            ruff-fix.patch
            ruff-check-after.txt
            ruff-format-after.txt
          if-no-files-found: error
          retention-days: 1
