name: BMW-03 Ruff diagnostics

on:
  pull_request:
    branches:
      - develop
    paths:
      - "ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/bmw03-ruff-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: "bmw03-ruff-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feat/portal-bmw03-safe-feature-convergence-v2'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Capture exact Ruff diagnostics
        run: |
          set -uo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.21
          set +e
          ruff check ai_platform tests/ai_platform > ruff-check.txt 2>&1
          check_status=$?
          ruff format --check ai_platform tests/ai_platform > ruff-format.txt 2>&1
          format_status=$?
          set -e
          printf 'ruff_check_status=%s\nruff_format_status=%s\n' \
            "$check_status" "$format_status" > ruff-status.txt
          cat ruff-status.txt
          cat ruff-check.txt
          cat ruff-format.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bmw03-ruff-diagnostics
          path: |
            ruff-status.txt
            ruff-check.txt
            ruff-format.txt
          if-no-files-found: error
          retention-days: 1
