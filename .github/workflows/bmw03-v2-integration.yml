name: Apply BMW-03 v2 integration

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feat/portal-bmw03-safe-feature-convergence-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/portal-bmw03-safe-feature-convergence-v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply exact shared composition
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path("ai_platform/portal/control_plane/api.py")
          text = api.read_text()
          old = '''    app.include_router(build_signal_control_router(bot_management.signals, context_dependency))
          app.include_router(build_grid_control_router(bot_management.grid, context_dependency))
          '''
          new = '''    app.include_router(
              build_signal_control_router(
                  bot_management.signals,
                  bot_management.signal_overview,
                  context_dependency,
              )
          )
          app.include_router(
              build_grid_control_router(
                  bot_management.grid,
                  bot_management.grid_overview,
                  context_dependency,
              )
          )
          '''
          if old not in text:
              raise SystemExit("router composition marker missing")
          api.write_text(text.replace(old, new, 1))

          tests = Path("tests/ai_platform/portal/control_plane/test_api.py")
          text = tests.read_text()
          signal_marker = '        "/v1/bot-management/signals/endpoints",\n'
          signal_addition = '        "/v1/bot-management/signals/overview",\n' + signal_marker
          if signal_addition not in text:
              if signal_marker not in text:
                  raise SystemExit("signal OpenAPI marker missing")
              text = text.replace(signal_marker, signal_addition, 1)
          grid_marker = '        "/v1/bot-management/grid/preview",\n'
          grid_addition = '        "/v1/bot-management/grid/overview",\n' + grid_marker
          if grid_addition not in text:
              if grid_marker not in text:
                  raise SystemExit("grid OpenAPI marker missing")
              text = text.replace(grid_marker, grid_addition, 1)
          tests.write_text(text)

          Path(".github/workflows/bmw03-v2-integration.yml").unlink()
          PY
          python -m pip install --disable-pip-version-check -q ruff==0.15.21
          ruff check --fix \
            ai_platform/portal/control_plane/api.py \
            ai_platform/portal/control_plane/bot_management.py \
            tests/ai_platform/portal/control_plane/test_api.py
          ruff format \
            ai_platform/portal/control_plane/api.py \
            ai_platform/portal/control_plane/bot_management.py \
            tests/ai_platform/portal/control_plane/test_api.py
      - name: Commit integrated BMW-03 package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/portal tests/ai_platform/portal .github/workflows/bmw03-v2-integration.yml
          git commit -m "feat(portal): integrate BMW-03 safe feature views"
          git push origin HEAD:feat/portal-bmw03-safe-feature-convergence-v2
