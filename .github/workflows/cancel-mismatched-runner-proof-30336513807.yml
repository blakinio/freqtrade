name: Cancel mismatched runner proof 30336513807

on:
  pull_request:
    paths:
      - ".github/workflows/cancel-mismatched-runner-proof-30336513807.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel exact queued proof run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "30336513807"
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/cancel")"
          if [[ "$status" != "202" ]]; then
            cat "$response" >&2
            echo "Expected cancellation HTTP 202, received $status" >&2
            exit 1
          fi
          echo "Cancellation accepted for exact run $TARGET_RUN_ID"
