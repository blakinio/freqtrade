name: CI audit evidence refresh (temporary)

on:
  pull_request:
    branches: [develop]
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ci-audit-evidence-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'audit/ci-architecture-optimizer-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: audit/ci-architecture-optimizer-20260804
          persist-credentials: true
      - name: Generate and commit evidence from target workflow tree
        run: |
          rm .github/workflows/ci-evidence-refresh.yml
          python tools/ci/generate_ci_audit_evidence.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/evidence/FTAI-20260804-ci-architecture-optimizer
          if git diff --cached --quiet; then
            echo "Evidence is already current."
          else
            git commit -m "docs(ci): refresh final audit evidence"
            git push origin HEAD:audit/ci-architecture-optimizer-20260804
          fi
      - name: Upload refreshed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-audit-evidence-${{ github.sha }}
          path: docs/agents/evidence/FTAI-20260804-ci-architecture-optimizer
          if-no-files-found: error
          retention-days: 7
