name: Freqtrade CI

on:
  push:
    branches:
      - stable
      - develop
      - ci/*
  release:
    types: [published]
  pull_request:
  schedule:
    - cron: "0 3 * * 4"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: "CI scope"
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.scope.outputs.core }}
      exhaustive: ${{ steps.scope.outputs.exhaustive }}
      docs: ${{ steps.scope.outputs.docs }}
      online: ${{ steps.scope.outputs.online }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          core=false
          exhaustive=false
          docs=false
          online=false
          changed_files=()

          case "$EVENT_NAME" in
            schedule|release|workflow_dispatch)
              core=true
              exhaustive=true
              docs=true
              online=true
              ;;
            pull_request)
              mapfile -t changed_files < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
              ;;
            push)
              if [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                core=true
                exhaustive=true
                docs=true
                online=true
              else
                mapfile -t changed_files < <(git diff --name-only "$PUSH_BEFORE_SHA" "$CURRENT_SHA")
              fi
              ;;
            *)
              core=true
              exhaustive=true
              docs=true
              online=true
              ;;
          esac

          if [[ ${#changed_files[@]} -gt 0 ]]; then
            printf 'Changed files:\n'
            printf '  %s\n' "${changed_files[@]}"
            for file in "${changed_files[@]}"; do
              case "$file" in
                docs/*|*.md|README*|CONTRIBUTING*|SECURITY*) docs=true ;;
              esac

              case "$file" in
                ai_platform/*|docs/*|*.md|README*|CONTRIBUTING*|SECURITY*|.github/workflows/*|.github/dependabot.yml|.gitignore|.editorconfig)
                  ;;
                *)
                  core=true
                  ;;
              esac

              case "$file" in
                requirements*.txt|pyproject.toml|uv.lock|setup.py|setup.cfg|MANIFEST.in|freqtrade/exchange/*|freqtrade/freqai/*|freqtrade/optimize/*|freqtrade/data/*|Dockerfile*|docker/*|.github/workflows/ci.yml)
                  exhaustive=true
                  ;;
              esac

              case "$file" in
                freqtrade/exchange/*|requirements*.txt|pyproject.toml|uv.lock)
                  online=true
                  ;;
              esac
            done
          fi

          if [[ "$exhaustive" == "true" ]]; then
            core=true
          fi

          if [[ "$core" == "false" && "$docs" == "false" && ${#changed_files[@]} -eq 0 && "$EVENT_NAME" != "schedule" && "$EVENT_NAME" != "release" && "$EVENT_NAME" != "workflow_dispatch" ]]; then
            core=true
            exhaustive=true
          fi

          {
            echo "core=$core"
            echo "exhaustive=$exhaustive"
            echo "docs=$docs"
            echo "online=$online"
          } >> "$GITHUB_OUTPUT"
          echo "core=$core exhaustive=$exhaustive docs=$docs online=$online"

  pre-commit:
    name: "Pre-commit checks"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  docs-check:
    name: "Documentation build"
    needs: classify
    if: needs.classify.outputs.docs == 'true' || needs.classify.outputs.exhaustive == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Documentation syntax
        run: ./tests/test_docs.sh
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false
      - name: Documentation build
        run: |
          uv pip install -r docs/requirements-docs.txt
          mkdocs build

  core-tests:
    name: "Core tests (${{ matrix.os }}, ${{ matrix.python-version }})"
    needs: classify
    if: needs.classify.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
            coverage: false
            quality: false
          - os: ubuntu-24.04
            python-version: "3.12"
            coverage: true
            quality: false
          - os: ubuntu-24.04
            python-version: "3.13"
            coverage: false
            quality: true
          - os: ubuntu-24.04
            python-version: "3.14"
            coverage: false
            quality: false
          - os: macos-15
            python-version: "3.13"
            coverage: false
            quality: false
          - os: windows-2025
            python-version: "3.13"
            coverage: false
            quality: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: true # zizmor: ignore[cache-poisoning] - test-only cache
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "requirements**.txt"
          cache-suffix: "smart-ci-${{ matrix.os }}-${{ matrix.python-version }}"
      - name: Installation - macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Installation
        run: |
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .
      - name: Check for version alignment
        run: python build_helpers/freqtrade_client_version_align.py
      - name: Tests
        if: matrix.coverage == false
        run: pytest --random-order --durations 20 -n auto
      - name: Tests with coverage
        if: matrix.coverage == true
        run: pytest --random-order --cov=freqtrade --cov=freqtrade_client --cov-config=.coveragerc
      - name: Extract generated schema and docs
        if: matrix.quality == true
        run: |
          python build_helpers/extract_config_json_schema.py
          python build_helpers/create_command_partials.py
      - name: Check generated files are committed
        if: matrix.quality == true
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status
            git diff
            exit 1
          fi
      - name: Backtesting smoke test
        if: matrix.quality == true
        shell: bash
        run: |
          freqtrade create-userdir --userdir user_data
          cp tests/testdata/config.tests.json user_data/config.json
          freqtrade new-strategy -s AwesomeStrategy
          freqtrade new-strategy -s AwesomeStrategyMin --template minimal
          freqtrade new-strategy -s AwesomeStrategyAdv --template advanced
          freqtrade backtesting --datadir tests/testdata --strategy-list AwesomeStrategy AwesomeStrategyMin AwesomeStrategyAdv -i 5m
      - name: Hyperopt smoke test
        if: matrix.quality == true
        shell: bash
        run: |
          cp tests/testdata/config.tests.json config.json
          freqtrade create-userdir --userdir user_data
          freqtrade hyperopt --datadir tests/testdata -e 6 --strategy SampleStrategy --hyperopt-loss SharpeHyperOptLossDaily --print-all
      - name: Ruff
        if: matrix.quality == true
        run: ruff check --output-format=github
      - name: Ruff format
        if: matrix.quality == true
        run: ruff format --check
      - name: Mypy
        if: matrix.quality == true
        run: mypy freqtrade scripts tests
      - name: Pester tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSVersionTable
          Install-PSResource -Name Pester -Version '[5.7.1]' -TrustRepository -Reinstall
          $Error.clear()
          Function Clear-Host { }
          Invoke-Pester -Path "tests" -CI
          if ($Error.Length -gt 0) {exit 1}

  exhaustive-tests:
    name: "Compatibility sweep (${{ matrix.os }}, ${{ matrix.python-version }})"
    needs: classify
    if: needs.classify.outputs.exhaustive == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "ubuntu-24.04", "ubuntu-26.04", "ubuntu-24.04-arm", "macos-14", "macos-15", "windows-2022", "windows-2025"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: "ubuntu-22.04"
            python-version: "3.13"
          - os: "ubuntu-22.04"
            python-version: "3.14"
          - os: "ubuntu-24.04-arm"
            python-version: "3.11"
          - os: "ubuntu-24.04-arm"
            python-version: "3.12"
          - os: "ubuntu-26.04"
            python-version: "3.11"
          - os: "ubuntu-26.04"
            python-version: "3.12"
          - os: "ubuntu-26.04"
            python-version: "3.13"
          - os: "ubuntu-24.04"
            python-version: "3.11"
          - os: "ubuntu-24.04"
            python-version: "3.12"
          - os: "ubuntu-24.04"
            python-version: "3.13"
          - os: "ubuntu-24.04"
            python-version: "3.14"
          - os: "macos-15"
            python-version: "3.13"
          - os: "windows-2025"
            python-version: "3.13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: true # zizmor: ignore[cache-poisoning] - test-only cache
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "requirements**.txt"
          cache-suffix: "exhaustive-${{ matrix.os }}-${{ matrix.python-version }}"
      - name: Installation - macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Installation
        run: |
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .
      - name: Tests
        run: pytest --random-order --durations 20 -n auto

  online-tests:
    name: "Online / live compatibility tests"
    needs: classify
    if: needs.classify.outputs.online == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: true # zizmor: ignore[cache-poisoning] - test-only cache
          python-version: "3.12"
          cache-dependency-glob: "requirements**.txt"
          cache-suffix: "online-3.12"
      - name: Installation
        run: |
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .
      - name: Tests incl. ccxt compatibility tests
        env:
          CI_WEB_PROXY: http://152.67.66.8:13128
        run: pytest --random-order --longrun --durations 20 -n auto

  build:
    name: "Build distributions"
    needs: [classify, core-tests]
    if: always() && needs.classify.outputs.core == 'true' && needs.core-tests.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false
      - name: Build distributions
        run: |
          uv pip install $(grep -E "^build==" requirements-dev.txt)
          python -m build --sdist --wheel
          python -m build --sdist --wheel ft_client

  ci-gate:
    name: "CI Gate"
    needs:
      - classify
      - pre-commit
      - docs-check
      - core-tests
      - exhaustive-tests
      - online-tests
      - build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Validate required job outcomes
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          PRECOMMIT_RESULT: ${{ needs.pre-commit.result }}
          DOCS_RESULT: ${{ needs.docs-check.result }}
          CORE_RESULT: ${{ needs.core-tests.result }}
          EXHAUSTIVE_RESULT: ${{ needs.exhaustive-tests.result }}
          ONLINE_RESULT: ${{ needs.online-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CORE_SCOPE: ${{ needs.classify.outputs.core }}
          EXHAUSTIVE_SCOPE: ${{ needs.classify.outputs.exhaustive }}
          DOCS_SCOPE: ${{ needs.classify.outputs.docs }}
          ONLINE_SCOPE: ${{ needs.classify.outputs.online }}
        run: |
          set -euo pipefail
          failed=false
          for result in "$CLASSIFY_RESULT" "$PRECOMMIT_RESULT" "$DOCS_RESULT" "$CORE_RESULT" "$EXHAUSTIVE_RESULT" "$ONLINE_RESULT" "$BUILD_RESULT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              failed=true
            fi
          done
          echo "CI scope: core=$CORE_SCOPE exhaustive=$EXHAUSTIVE_SCOPE docs=$DOCS_SCOPE online=$ONLINE_SCOPE"
          if [[ "$failed" == "true" ]]; then
            echo "One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required checks for this change scope passed."
