name: Freqtrade CI

on:
  push:
    branches:
      - stable
      - develop
      - ci/*
  release:
    types: [published]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: "0 3 * * 4"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: "CI scope"
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      core_light: ${{ steps.scope.outputs.core_light }}
      core_matrix: ${{ steps.scope.outputs.core_matrix }}
      compatibility_sweep: ${{ steps.scope.outputs.compatibility_sweep }}
      online: ${{ steps.scope.outputs.online }}
      build_distribution: ${{ steps.scope.outputs.build_distribution }}
      full: ${{ steps.scope.outputs.full }}
      routing_json: ${{ steps.scope.outputs.routing_json }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files and risk
        id: scope
        uses: ./.github/actions/classify-changes
        with:
          event_name: ${{ github.event_name }}
          event_action: ${{ github.event.action }}
          base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          labels_json: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ref_name: ${{ github.ref_name }}
      - name: Upload routing decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-routing.json
          if-no-files-found: error
          retention-days: 14

  routing-contract:
    name: "Lightweight required PR gate"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install bounded validation tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 PyYAML==6.0.3 ruff==0.15.20 mypy==2.1.0
      - name: Compile and type-check classifier
        run: |
          python -m compileall -q tools/ci tests/ci
          mypy --config-file=/dev/null --ignore-missing-imports tools/ci/*.py
      - name: Lint classifier and routing tests
        run: |
          ruff check tools/ci tests/ci
          ruff format --check tools/ci tests/ci
      - name: Run routing contract tests
        run: python -m pytest -q -o addopts='' --confcutdir=tests/ci tests/ci
      - name: Validate workflow syntax, routing and action security
        run: python tools/ci/validate_workflows.py

  core-light:
    name: "Focused core compile, typing and unit validation"
    needs: classify
    if: needs.classify.outputs.core_light == 'true' && needs.classify.outputs.core_matrix != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: true # zizmor: ignore[cache-poisoning] - test-only cache
          python-version: "3.13"
          cache-dependency-glob: "requirements.txt"
          cache-suffix: "core-light-3.13"
      - name: Install bounded core dependencies
        run: |
          uv pip install -r requirements.txt
          uv pip install pytest==9.1.1 pytest-asyncio==1.4.0 pytest-mock==3.15.1 pytest-timeout==2.4.0 pytest-xdist==3.8.0 time-machine==3.2.0 ruff==0.15.20 mypy==2.1.0 pyyaml==6.0.3 plotly==6.8.0 optuna==4.9.0 datasieve==0.1.9 pip-audit==2.10.1
          uv pip install --no-deps -e ft_client/
          uv pip install --no-deps -e .
      - name: Compile and lint core
        run: |
          python -m compileall -q freqtrade ft_client
          ruff check freqtrade ft_client
          ruff format --check freqtrade ft_client
      - name: Focused typing
        run: mypy --ignore-missing-imports --follow-imports=skip freqtrade ft_client
      - name: Core unit validation without optional ML and optimization suites
        run: >-
          pytest -q --durations 20 -n auto
          --ignore=tests/ai_platform
          --ignore=tests/ai_platform_integration
          --ignore=tests/freqai
          --ignore=tests/optimize

  pre-commit:
    name: "Pre-commit checks"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  docs-check:
    name: "Documentation build"
    needs: classify
    if: needs.classify.outputs.docs == 'true' || needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Documentation syntax
        run: ./tests/test_docs.sh
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false
      - name: Documentation build
        run: |
          uv pip install -r docs/requirements-docs.txt
          mkdocs build

  core-tests:
    name: "Core tests (${{ matrix.os }}, ${{ matrix.python-version }})"
    needs: classify
    if: needs.classify.outputs.core_matrix == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
            coverage: false
            quality: false
          - os: ubuntu-24.04
            python-version: "3.12"
            coverage: true
            quality: false
          - os: ubuntu-24.04
            python-version: "3.13"
            coverage: false
            quality: true
          - os: ubuntu-24.04
            python-version: "3.14"
            coverage: false
            quality: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: true # zizmor: ignore[cache-poisoning] - test-only cache
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "requirements**.txt"
          cache-suffix: "smart-ci-${{ matrix.os }}-${{ matrix.python-version }}"
      - name: Installation
        run: |
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .
      - name: Check for version alignment
        run: python build_helpers/freqtrade_client_version_align.py
      - name: Tests
        if: matrix.coverage == false
        run: pytest --random-order --durations 20 -n auto
      - name: Tests with coverage
        if: matrix.coverage == true
        run: pytest --random-order --cov=freqtrade --cov=freqtrade_client --cov-config=.coveragerc
      - name: Extract generated schema and docs
        if: matrix.quality == true
        run: |
          python build_helpers/extract_config_json_schema.py
          python build_helpers/create_command_partials.py
      - name: Check generated files are committed
        if: matrix.quality == true
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status
            git diff
            exit 1
          fi
      - name: Backtesting smoke test
        if: matrix.quality == true
        shell: bash
        run: |
          freqtrade create-userdir --userdir user_data
          cp tests/testdata/config.tests.json user_data/config.json
          freqtrade new-strategy -s AwesomeStrategy
          freqtrade new-strategy -s AwesomeStrategyMin --template minimal
          freqtrade new-strategy -s AwesomeStrategyAdv --template advanced
          freqtrade backtesting --datadir tests/testdata --strategy-list AwesomeStrategy AwesomeStrategyMin AwesomeStrategyAdv -i 5m
      - name: Hyperopt smoke test
        if: matrix.quality == true
        shell: bash
        run: |
          cp tests/testdata/config.tests.json config.json
          freqtrade create-userdir --userdir user_data
          freqtrade hyperopt --datadir tests/testdata -e 6 --strategy SampleStrategy --hyperopt-loss SharpeHyperOptLossDaily --print-all
      - name: Ruff
        if: matrix.quality == true
        run: ruff check --output-format=github
      - name: Ruff format
        if: matrix.quality == true
        run: ruff format --check
      - name: Mypy
        if: matrix.quality == true
        run: mypy freqtrade scripts tests ai_platform/provenance/rl_v2_model_state_manifest.py ai_platform/provenance/rl_v2_torch.py ai_platform/provenance/rl_v2_torch_state_dict.py

  exhaustive-tests:
    name: "Compatibility sweep (${{ matrix.os }}, ${{ matrix.python-version }})"
    needs: classify
    if: needs.classify.outputs.compatibility_sweep == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "ubuntu-24.04", "ubuntu-26.04", "ubuntu-24.04-arm"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: "ubuntu-22.04"
            python-version: "3.13"
          - os: "ubuntu-22.04"
            python-version: "3.14"
          - os: "ubuntu-24.04-arm"
            python-version: "3.11"
          - os: "ubuntu-24.04-arm"
            python-version: "3.12"
          - os: "ubuntu-26.04"
            python-version: "3.11"
          - os: "ubuntu-26.04"
            python-version: "3.12"
          - os: "ubuntu-26.04"
            python-version: "3.13"
          - os: "ubuntu-24.04"
            python-version: "3.11"
          - os: "ubuntu-24.04"
            python-version: "3.12"
          - os: "ubuntu-24.04"
            python-version: "3.13"
          - os: "ubuntu-24.04"
            python-version: "3.14"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: true # zizmor: ignore[cache-poisoning] - test-only cache
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "requirements**.txt"
          cache-suffix: "exhaustive-${{ matrix.os }}-${{ matrix.python-version }}"
      - name: Installation
        run: |
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .
      - name: Tests
        run: pytest --random-order --durations 20 -n auto

  online-tests:
    name: "Online / live compatibility tests"
    needs: classify
    if: needs.classify.outputs.online == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: true # zizmor: ignore[cache-poisoning] - test-only cache
          python-version: "3.12"
          cache-dependency-glob: "requirements**.txt"
          cache-suffix: "online-3.12"
      - name: Installation
        run: |
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .
      - name: Tests incl. ccxt compatibility tests
        env:
          CI_WEB_PROXY: http://152.67.66.8:13128
        run: >-
          pytest --random-order --longrun --durations 20 -n auto
          --timeout=300

  build:
    name: "Build distributions"
    needs: [classify, core-tests]
    if: always() && needs.classify.outputs.build_distribution == 'true' && needs.core-tests.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false
      - name: Build distributions
        run: |
          uv pip install $(grep -E "^build==" requirements-dev.txt)
          python -m build --sdist --wheel
          python -m build --sdist --wheel ft_client

  ci-gate:
    name: "CI Gate"
    needs:
      - classify
      - routing-contract
      - pre-commit
      - docs-check
      - core-light
      - core-tests
      - exhaustive-tests
      - online-tests
      - build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Validate selected and skipped job outcomes
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          ROUTING_RESULT: ${{ needs.routing-contract.result }}
          PRECOMMIT_RESULT: ${{ needs.pre-commit.result }}
          DOCS_RESULT: ${{ needs.docs-check.result }}
          CORE_LIGHT_RESULT: ${{ needs.core-light.result }}
          CORE_MATRIX_RESULT: ${{ needs.core-tests.result }}
          EXHAUSTIVE_RESULT: ${{ needs.exhaustive-tests.result }}
          ONLINE_RESULT: ${{ needs.online-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCS_SCOPE: ${{ needs.classify.outputs.docs }}
          CORE_LIGHT_SCOPE: ${{ needs.classify.outputs.core_light }}
          CORE_MATRIX_SCOPE: ${{ needs.classify.outputs.core_matrix }}
          FULL_SCOPE: ${{ needs.classify.outputs.full }}
          COMPATIBILITY_SCOPE: ${{ needs.classify.outputs.compatibility_sweep }}
          ONLINE_SCOPE: ${{ needs.classify.outputs.online }}
          BUILD_SCOPE: ${{ needs.classify.outputs.build_distribution }}
        run: |
          set -euo pipefail
          require_success() {
            local selected="$1" result="$2" name="$3"
            if [[ "$selected" == "true" && "$result" != "success" ]]; then
              echo "$name was selected but finished as $result" >&2
              exit 1
            fi
            if [[ "$selected" != "true" && "$result" != "skipped" ]]; then
              echo "$name was not selected but finished as $result" >&2
              exit 1
            fi
          }
          [[ "$CLASSIFY_RESULT" == "success" ]]
          [[ "$ROUTING_RESULT" == "success" ]]
          [[ "$PRECOMMIT_RESULT" == "success" ]]
          require_success "$DOCS_SCOPE" "$DOCS_RESULT" "Documentation build"
          if [[ "$CORE_MATRIX_SCOPE" == "true" ]]; then
            require_success false "$CORE_LIGHT_RESULT" "Focused core validation"
          else
            require_success "$CORE_LIGHT_SCOPE" "$CORE_LIGHT_RESULT" "Focused core validation"
          fi
          require_success "$CORE_MATRIX_SCOPE" "$CORE_MATRIX_RESULT" "Core compatibility matrix"
          require_success "$COMPATIBILITY_SCOPE" "$EXHAUSTIVE_RESULT" "Exhaustive compatibility sweep"
          require_success "$ONLINE_SCOPE" "$ONLINE_RESULT" "Online compatibility"
          require_success "$BUILD_SCOPE" "$BUILD_RESULT" "Distribution build"
          echo "Routing: docs=$DOCS_SCOPE core_light=$CORE_LIGHT_SCOPE core_matrix=$CORE_MATRIX_SCOPE full=$FULL_SCOPE compatibility=$COMPATIBILITY_SCOPE online=$ONLINE_SCOPE build=$BUILD_SCOPE"
