name: Close out Runtime Supervisor #1355/#1496

on:
  push:
    branches:
      - closeout/portal-runtime-supervisor-1355-1496
    paths:
      - .github/workflows/closeout-1496-lifecycle.yml

permissions:
  contents: write

concurrency:
  group: closeout-1496-lifecycle
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact closeout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: closeout/portal-runtime-supervisor-1355-1496
          persist-credentials: false

      - name: Apply terminal lifecycle reconciliation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          merge_commit = "a51106eb0003910b393dd876ab68f3877eef16dc"
          final_pr_head = "b131a5c7ae46b0b05360071e44f5f21537e1f10a"
          audited_supervisor_head = "e1314db237768f8c7c4c1169b200988eca957d5a"

          task_specs = [
              (
                  Path("docs/agents/tasks/active/FTAI-20260812-portal-runtime-supervisor-1355.md"),
                  Path("docs/agents/tasks/archive/FTAI-20260812-portal-runtime-supervisor-1355.md"),
                  "blocked",
              ),
              (
                  Path("docs/agents/tasks/active/FTAI-20260813-portal-runtime-supervisor-audit-repair-1496.md"),
                  Path("docs/agents/tasks/archive/FTAI-20260813-portal-runtime-supervisor-audit-repair-1496.md"),
                  "validating",
              ),
          ]

          closeout_block = f'''\n\n## Terminal closeout — 2026-08-14\n\n```yaml\ncloseout:\n  implementation_complete: true\n  audit:\n    result: PASS\n    independent_validator_exact_head: {audited_supervisor_head}\n    material_findings_open: 0\n    scope_note: No Runtime Supervisor product source changed between the audited supervisor tree and PR final head; later PR commits touched unrelated WickHunter/deployment surfaces and tests only.\n  e2e:\n    result: PASS\n    evidence: Portal Runtime Isolation E2E succeeded on final PR head {final_pr_head}.\n  final_ci:\n    head: {final_pr_head}\n    result: PASS\n    required_workflows:\n      - Freqtrade CI 31811234612\n      - Risk-aware component CI 31811235038\n      - Portal Runtime Isolation E2E 31811234721\n      - Portal API Mode Browser 31811234563\n      - Portal WickHunter Browser E2E 31811234636\n      - Portal Exact-Image Supply Chain 31811234769\n      - CodeQL Security Analysis 31811234619\n      - GitHub Actions Security Analysis with zizmor 31811234758\n  pull_requests:\n    open_related_prs: 0\n    unresolved_review_threads: 0\n    terminal_prs:\n      - blakinio/freqtrade#1496 merged\n  merge:\n    pr: 1496\n    delivery_head: {final_pr_head}\n    merge_commit: {merge_commit}\n    merged_at: 2026-08-14T17:09:51Z\n  task_status: completed\n  task_archived: true\n  ownership_released: true\n  stale_branches_reconciled: true\n  live_capital_authorized: false\n  production_deployment_authorized: false\n```\n'''

          for src, dst, old_status in task_specs:
              if not src.exists():
                  raise SystemExit(f"missing active task record: {src}")
              if dst.exists():
                  raise SystemExit(f"archive target already exists: {dst}")
              text = src.read_text()
              marker = f"status: {old_status}"
              if marker not in text:
                  raise SystemExit(f"expected top-level status not found in {src}: {marker}")
              text = text.replace(marker, "status: completed", 1)
              text += closeout_block
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_text(text)
              src.unlink()

          registry = Path("ARCHITECTURE_REGISTRY.yaml")
          text = registry.read_text()
          text = text.replace('  lifecycle_reconciled_at: "2026-08-12"', '  lifecycle_reconciled_at: "2026-08-14"', 1)
          anchor = '''    - issue: 1354\n      id: FTAI-ARCH-RUNTIME-ISOLATION\n      status: completed\n      evidence_pr: 1464\n'''
          addition = anchor + '''    - issue: 1355\n      id: FTAI-ARCH-RUNTIME-SUPERVISOR\n      status: completed\n      evidence_pr: 1496\n      evidence_merge: a51106eb0003910b393dd876ab68f3877eef16dc\n'''
          if anchor not in text:
              raise SystemExit("registry resolved-findings anchor missing")
          text = text.replace(anchor, addition, 1)
          old_doc = '''    implementation_status: partially_implemented\n    owner_role: architecture-owner\n    last_reviewed_at: "2026-08-12"\n    evidence_rule: Runtime isolation finding #1354 is implemented and verified by PR #1464; Runtime Supervisor finding #1355 remains target-only and open. Exact code, tests and deployed-host evidence remain authoritative for current implementation state.\n'''
          new_doc = '''    implementation_status: implemented\n    owner_role: architecture-owner\n    last_reviewed_at: "2026-08-14"\n    evidence_rule: Runtime isolation finding #1354 is implemented and verified by PR #1464; Runtime Supervisor finding #1355 is implemented and merged by PR #1496 at a51106eb0003910b393dd876ab68f3877eef16dc. Exact code, tests and deployed-host evidence remain authoritative for current implementation state.\n'''
          if old_doc not in text:
              raise SystemExit("registry runtime contract status block missing")
          text = text.replace(old_doc, new_doc, 1)
          open_block = '''\nopen_architecture_findings:\n  - issue: 1355\n    id: FTAI-ARCH-RUNTIME-SUPERVISOR\n    severity: critical\n    status: open\n    summary: Isolate container-engine authority behind the Runtime Supervisor boundary required by ADR-020.\n'''
          if open_block not in text:
              raise SystemExit("registry open #1355 finding block missing")
          text = text.replace(open_block, '\nopen_architecture_findings: []\n', 1)
          registry.write_text(text)

          contract = Path("docs/ai_platform/portal/RUNTIME_ISOLATION_AND_SUPERVISOR_CONTRACT.md")
          text = contract.read_text()
          old = 'Implementation status: `target_only`  '
          new = 'Implementation status: `implemented` — runtime isolation #1354 via PR #1464; Runtime Supervisor #1355 via PR #1496 / merge `a51106eb0003910b393dd876ab68f3877eef16dc`  '
          if old not in text:
              raise SystemExit("runtime contract implementation status marker missing")
          contract.write_text(text.replace(old, new, 1))

          Path(".github/workflows/closeout-1496-lifecycle.yml").unlink()
          PY

          git diff --check
          test ! -e docs/agents/tasks/active/FTAI-20260812-portal-runtime-supervisor-1355.md
          test ! -e docs/agents/tasks/active/FTAI-20260813-portal-runtime-supervisor-audit-repair-1496.md
          test -e docs/agents/tasks/archive/FTAI-20260812-portal-runtime-supervisor-1355.md
          test -e docs/agents/tasks/archive/FTAI-20260813-portal-runtime-supervisor-audit-repair-1496.md
          grep -q 'issue: 1355' ARCHITECTURE_REGISTRY.yaml
          grep -q 'evidence_pr: 1496' ARCHITECTURE_REGISTRY.yaml
          grep -q 'open_architecture_findings: \[\]' ARCHITECTURE_REGISTRY.yaml
          grep -q 'Implementation status: `implemented`' docs/ai_platform/portal/RUNTIME_ISOLATION_AND_SUPERVISOR_CONTRACT.md

      - name: Commit terminal closeout and self-remove workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(portal): close Runtime Supervisor lifecycle"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:closeout/portal-runtime-supervisor-1355-1496
