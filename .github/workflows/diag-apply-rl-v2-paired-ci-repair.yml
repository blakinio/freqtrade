name: Apply RL-v2 Paired Attribution CI Repair

on:
  pull_request:
    types: [synchronize]
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply-repair:
    if: >-
      github.event.pull_request.number == 251 &&
      github.event.pull_request.head.ref == 'diag/rl-v2-paired-attribution-ci-markers'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic repair source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: diagnostic

      - name: Checkout exact target branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/rl-v2-roi-lifecycle-paired-attribution-infrastructure
          path: target

      - name: Verify unchanged target head
        working-directory: target
        shell: bash
        run: test "$(git rev-parse HEAD)" = "6e00a17e8783e978f51fe7efe5823efc27ed3bd9"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check --quiet ruff==0.15.21

      - name: Apply diagnosed repair
        shell: bash
        run: |
          python diagnostic/tools/agents/diag_apply_rl_v2_paired_ci_repair.py target
          ruff format \
            target/ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py \
            target/ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_evidence.py \
            target/tests/ai_platform/test_rl_v2_roi_lifecycle_paired_attribution.py
          ruff check \
            target/ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py \
            target/ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_evidence.py \
            target/tests/ai_platform/test_rl_v2_roi_lifecycle_paired_attribution.py

      - name: Commit repair to PR 248 branch
        working-directory: target
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py \
            ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_evidence.py \
            tests/ai_platform/test_rl_v2_roi_lifecycle_paired_attribution.py
          git diff --cached --check
          git commit -m "fix(ai-platform): satisfy paired attribution CI guards"
          git push origin HEAD:feat/rl-v2-roi-lifecycle-paired-attribution-infrastructure
