name: Diagnose Cutover Retry Formatting

on:
  pull_request:
    branches:
      - develop
    paths:
      - "tests/ai_platform/portal/deployment/test_freqtrade_synology_runner_cutover_retry.py"
      - ".github/workflows/diag-freqtrade-cutover-retry-format.yml"

permissions:
  contents: read

jobs:
  format-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Capture canonical Ruff patch
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff
          ruff format tests/ai_platform/portal/deployment/test_freqtrade_synology_runner_cutover_retry.py
          git diff -- tests/ai_platform/portal/deployment/test_freqtrade_synology_runner_cutover_retry.py > "$RUNNER_TEMP/cutover-retry-format.patch"
          test -s "$RUNNER_TEMP/cutover-retry-format.patch"

      - name: Upload formatting patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cutover-retry-format-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/cutover-retry-format.patch
          if-no-files-found: error
          retention-days: 1
