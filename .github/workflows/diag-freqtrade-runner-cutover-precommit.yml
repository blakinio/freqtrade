name: Diagnose Freqtrade Runner Cutover Pre-commit

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/diag-freqtrade-runner-cutover-precommit.yml"
      - ".github/workflows/freqtrade-synology-runner-dedicated-cutover.yml"
      - "tests/ai_platform/portal/deployment/test_freqtrade_synology_runner_isolation.py"
      - "docs/agents/tasks/FTAI-20260727-freqtrade-synology-runner-dedicated-cutover.md"

permissions:
  contents: read
  statuses: write

jobs:
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"

      - name: Run changed-file hooks independently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pre-commit

          files=(
            .github/workflows/freqtrade-synology-runner-dedicated-cutover.yml
            tests/ai_platform/portal/deployment/test_freqtrade_synology_runner_isolation.py
            docs/agents/tasks/FTAI-20260727-freqtrade-synology-runner-dedicated-cutover.md
          )
          hooks=(
            mypy
            ruff
            ruff-format
            end-of-file-fixer
            mixed-line-ending
            debug-statements
            check-ast
            trailing-whitespace
            codespell
            zizmor
          )

          post_status() {
            local hook="$1"
            local state="$2"
            local payload
            payload="$(printf '{\"state\":\"%s\",\"description\":\"pre-commit hook %s\",\"context\":\"diag/precommit/%s\"}' "$state" "$state" "$hook")"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              --data "$payload" >/dev/null
          }

          for hook in "${hooks[@]}"; do
            git restore --worktree --staged -- "${files[@]}"
            if pre-commit run "$hook" --files "${files[@]}"; then
              post_status "$hook" success
            else
              post_status "$hook" failure
            fi
          done
