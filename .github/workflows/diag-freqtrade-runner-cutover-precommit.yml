name: Diagnose Freqtrade Runner Cutover Zizmor

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/diag-freqtrade-runner-cutover-precommit.yml"
      - ".github/workflows/freqtrade-synology-runner-dedicated-cutover.yml"

permissions:
  contents: read
  issues: write

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"

      - name: Publish sanitized zizmor output
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pre-commit

          set +e
          pre-commit run zizmor \
            --files .github/workflows/freqtrade-synology-runner-dedicated-cutover.yml \
            > /tmp/zizmor-output.txt 2>&1
          hook_result=$?
          set -e

          python3 - /tmp/zizmor-output.txt "$hook_result" > /tmp/comment.json <<'PY'
          import json
          import re
          import sys

          ansi = re.compile(r"\x1b\[[0-9;]*m")
          with open(sys.argv[1], encoding="utf-8", errors="replace") as handle:
              text = ansi.sub("", handle.read())

          text = text[-6000:]
          body = (
              "Temporary sanitized zizmor diagnostic for the dedicated runner cutover "
              f"(exit {sys.argv[2]}):\n\n```text\n{text}\n```"
          )
          json.dump({"body": body}, sys.stdout)
          PY

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --data-binary @/tmp/comment.json >/dev/null
