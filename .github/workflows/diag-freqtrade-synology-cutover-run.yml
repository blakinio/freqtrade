name: Diagnose Failed Freqtrade Synology Cutover Run

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/diag-freqtrade-synology-cutover-run.yml"

permissions:
  contents: read

jobs:
  inspect-run:
    permissions:
      actions: read
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect exact failed push run and comment bounded evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 3127b1826d6e0827be6e1636ee5745d75583d9a3
          TARGET_WORKFLOW: Retry Freqtrade Synology Runner Cutover
          TARGET_PR: "509"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          import zipfile

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_workflow = os.environ["TARGET_WORKFLOW"]
          target_pr = os.environ["TARGET_PR"]
          api = "https://api.github.com"

          def request(path: str, *, method: str = "GET", payload: dict | None = None) -> bytes:
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "freqtrade-cutover-diagnostic",
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read()

          runs_payload = json.loads(
              request(f"/repos/{repository}/actions/runs?head_sha={target_sha}&per_page=100")
          )
          runs = [
              run
              for run in runs_payload.get("workflow_runs", [])
              if run.get("name") == target_workflow
          ]
          runs.sort(key=lambda run: run.get("run_attempt", 0), reverse=True)

          lines = [
              "## Bounded Synology cutover diagnostic",
              "",
              f"- target commit: `{target_sha}`",
              f"- workflow: `{target_workflow}`",
          ]

          if not runs:
              lines.append("- result: no matching workflow run found")
          else:
              run = runs[0]
              run_id = run["id"]
              lines.extend(
                  [
                      f"- run id: `{run_id}`",
                      f"- run status: `{run.get('status')}`",
                      f"- run conclusion: `{run.get('conclusion')}`",
                      "",
                      "### Jobs",
                  ]
              )
              jobs_payload = json.loads(
                  request(f"/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100")
              )
              jobs = jobs_payload.get("jobs", [])
              for job in jobs:
                  lines.append(
                      f"- `{job.get('name')}`: status=`{job.get('status')}`, "
                      f"conclusion=`{job.get('conclusion')}`, id=`{job.get('id')}`"
                  )
                  for step in job.get("steps") or []:
                      lines.append(
                          f"  - step `{step.get('name')}`: `{step.get('conclusion') or step.get('status')}`"
                      )

              failed_jobs = [
                  job
                  for job in jobs
                  if job.get("conclusion") not in (None, "success", "skipped")
              ]
              error_pattern = re.compile(
                  r"(##\[error\]|permission denied|operation not permitted|"
                  r"no such file|not found|cannot|failed|error|exit code)",
                  re.IGNORECASE,
              )
              redact_pattern = re.compile(
                  r"(?i)(authorization:\s*bearer\s+)[^\s]+|"
                  r"(?i)(token[=:]\s*)[^\s]+"
              )
              evidence: list[str] = []

              for job in failed_jobs:
                  try:
                      raw = request(f"/repos/{repository}/actions/jobs/{job['id']}/logs")
                  except urllib.error.HTTPError as exc:
                      evidence.append(f"job {job['id']}: log download failed with HTTP {exc.code}")
                      continue

                  text = ""
                  if raw.startswith(b"PK"):
                      with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                          for name in archive.namelist():
                              text += archive.read(name).decode("utf-8", errors="replace") + "\n"
                  else:
                      text = raw.decode("utf-8", errors="replace")

                  matched = [line.strip() for line in text.splitlines() if error_pattern.search(line)]
                  for line in matched[-60:]:
                      line = redact_pattern.sub(r"\1\2***", line)
                      evidence.append(line[:1000])

              lines.extend(["", "### Failure evidence", "", "```text"])
              lines.extend(evidence[-80:] or ["No matching error lines were extracted from failed job logs."])
              lines.append("```")

          body = "\n".join(lines)
          if len(body) > 60000:
              body = body[:60000] + "\n\n[diagnostic truncated]"
          request(
              f"/repos/{repository}/issues/{target_pr}/comments",
              method="POST",
              payload={"body": body},
          )
          PY
