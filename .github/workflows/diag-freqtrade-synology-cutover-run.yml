name: Diagnose Failed Freqtrade Synology Cutover Run

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/diag-freqtrade-synology-cutover-run.yml"

permissions:
  contents: read

jobs:
  inspect-run:
    permissions:
      actions: read
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect exact failed push run and comment job evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 3127b1826d6e0827be6e1636ee5745d75583d9a3
          TARGET_WORKFLOW: Retry Freqtrade Synology Runner Cutover
          TARGET_PR: "509"
        run: |
          set -euo pipefail

          runs="$(gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100")"

          run_id="$(python3 - "$runs" "$TARGET_WORKFLOW" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          name = sys.argv[2]
          matches = [run for run in payload.get("workflow_runs", []) if run.get("name") == name]
          matches.sort(key=lambda run: run.get("run_attempt", 0), reverse=True)
          if not matches:
              raise SystemExit("No matching workflow run found")
          print(matches[0]["id"])
          PY
          )"

          jobs="$(gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"

          python3 - "$jobs" "$TARGET_SHA" "$TARGET_WORKFLOW" "$run_id" > "$RUNNER_TEMP/comment.md" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          target_sha = sys.argv[2]
          workflow = sys.argv[3]
          run_id = sys.argv[4]

          lines = [
              "## Bounded Synology cutover diagnostic",
              "",
              f"- target commit: `{target_sha}`",
              f"- workflow: `{workflow}`",
              f"- run id: `{run_id}`",
              "",
              "### Jobs and steps",
          ]
          for job in payload.get("jobs", []):
              lines.append(
                  f"- `{job.get('name')}`: status=`{job.get('status')}`, "
                  f"conclusion=`{job.get('conclusion')}`, id=`{job.get('id')}`"
              )
              for step in job.get("steps") or []:
                  lines.append(
                      f"  - `{step.get('name')}`: "
                      f"status=`{step.get('status')}`, conclusion=`{step.get('conclusion')}`"
                  )
          print("\n".join(lines))
          PY

          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPOSITORY/issues/$TARGET_PR/comments" \
            --field body="$(cat "$RUNNER_TEMP/comment.md")" >/dev/null
