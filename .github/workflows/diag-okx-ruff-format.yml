name: Diagnostic OKX Ruff format

on:
  push:
    branches:
      - feat/liquidation-okx-shadow-source-v1

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff==0.15.11
      - name: Format focused files
        run: |
          ruff format \
            ai_platform/research/liquidations/okx.py \
            ai_platform/scripts/liquidation_okx_collector.py \
            tests/ai_platform_integration/test_liquidation_okx_source.py \
            tests/ai_platform_integration/test_liquidation_binance_source.py
      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: okx-ruff-formatted
          path: |
            ai_platform/research/liquidations/okx.py
            ai_platform/scripts/liquidation_okx_collector.py
            tests/ai_platform_integration/test_liquidation_okx_source.py
            tests/ai_platform_integration/test_liquidation_binance_source.py
          if-no-files-found: error
