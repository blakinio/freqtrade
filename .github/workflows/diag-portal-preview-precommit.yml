name: Diagnose Portal Preview Pre-commit

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/diag-portal-preview-precommit.yml"
      - ".github/workflows/portal-synology-lan-preview.yml"
      - "deploy/synology/portal/deploy-preview.sh"
      - "tests/ai_platform_integration/test_portal_synology_auth_probe.py"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"

      - name: Capture pre-commit output and patch
        id: capture
        run: |
          set +e
          python -m pip install --disable-pip-version-check pre-commit
          pre-commit run --all-files > "$RUNNER_TEMP/precommit.log" 2>&1
          rc=$?
          git diff --binary > "$RUNNER_TEMP/precommit.patch"
          printf 'exit_code=%s\n' "$rc" > "$RUNNER_TEMP/result.txt"
          exit 0

      - name: Upload bounded diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portal-preview-precommit-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/precommit.log
            ${{ runner.temp }}/precommit.patch
            ${{ runner.temp }}/result.txt
          if-no-files-found: error
          retention-days: 1
