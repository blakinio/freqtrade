name: Diagnose PR73 Pre-commit

on:
  pull_request:
    branches:
      - feat/experimental-model-historical-execution-preflight-v2
    paths:
      - ".github/workflows/diag-precommit-pr73.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: extract-config-json-schema
        continue-on-error: true
        run: pre-commit run 'Extract config json schema' --all-files
      - name: mypy
        continue-on-error: true
        run: pre-commit run mypy --all-files
      - name: ruff
        continue-on-error: true
        run: pre-commit run ruff --all-files
      - name: ruff-format
        continue-on-error: true
        run: pre-commit run ruff-format --all-files
      - name: end-of-file-fixer
        continue-on-error: true
        run: pre-commit run end-of-file-fixer --all-files
      - name: mixed-line-ending
        continue-on-error: true
        run: pre-commit run mixed-line-ending --all-files
      - name: debug-statements
        continue-on-error: true
        run: pre-commit run debug-statements --all-files
      - name: check-ast
        continue-on-error: true
        run: pre-commit run check-ast --all-files
      - name: trailing-whitespace
        continue-on-error: true
        run: pre-commit run trailing-whitespace --all-files
      - name: strip-exif
        continue-on-error: true
        run: pre-commit run strip-exif --all-files
      - name: codespell
        continue-on-error: true
        run: pre-commit run codespell --all-files
      - name: zizmor
        continue-on-error: true
        run: pre-commit run zizmor --all-files
