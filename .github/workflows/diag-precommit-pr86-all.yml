name: Diagnose PR86 Pre-commit Hooks

on:
  pull_request:
    branches:
      - research/experimental-model-historical-backtest-execution-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install exact pre-commit runtime
        run: python -m pip install --disable-pip-version-check --quiet pre-commit==4.6.0
      - name: Run hooks independently and capture status
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p precommit-diagnostic
          hooks=(
            "Extract config json schema"
            "mypy"
            "ruff"
            "ruff-format"
            "end-of-file-fixer"
            "mixed-line-ending"
            "debug-statements"
            "check-ast"
            "trailing-whitespace"
            "strip-exif"
            "codespell"
            "zizmor"
          )
          for hook in "${hooks[@]}"; do
            slug="$(printf '%s' "$hook" | tr '[:upper:] ' '[:lower:]-')"
            set +e
            pre-commit run "$hook" --all-files > "precommit-diagnostic/$slug.log" 2>&1
            status=$?
            set -e
            printf '%s\n' "$status" > "precommit-diagnostic/$slug.status"
            printf '%s: %s\n' "$hook" "$status"
          done
      - name: Upload hook diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr86-precommit-diagnostic-${{ github.sha }}
          path: precommit-diagnostic/
          if-no-files-found: error
          retention-days: 1
