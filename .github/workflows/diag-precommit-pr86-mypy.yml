name: Diagnose PR86 Mypy

on:
  pull_request:
    branches:
      - research/experimental-model-historical-backtest-execution-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --quiet pre-commit
      - name: Run Mypy hook and capture full output
        shell: bash
        run: |
          set +e
          pre-commit run mypy --all-files > mypy-output.txt 2>&1
          status=$?
          set -e
          echo "$status" > mypy-status.txt
          cat mypy-output.txt
      - name: Upload Mypy diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr86-mypy-diagnostic-${{ github.sha }}
          path: |
            mypy-output.txt
            mypy-status.txt
          if-no-files-found: error
          retention-days: 1
