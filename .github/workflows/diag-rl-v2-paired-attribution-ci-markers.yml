name: RL-v2 Paired Attribution CI Marker Diagnostic

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop

permissions:
  contents: read

jobs:
  ruff-markers:
    name: Capture exact Ruff markers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check --quiet ruff==0.15.21

      - name: Capture check and format output
        shell: bash
        run: |
          set +e
          files=(
            ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_run_request.py
            ai_platform/scripts/rl_v2_roi_lifecycle_paired_attribution_evidence.py
            tests/ai_platform/test_rl_v2_roi_lifecycle_paired_attribution.py
          )
          ruff check "${files[@]}" > ruff-check.txt 2>&1
          echo "$?" > ruff-check-status.txt
          ruff format --check --diff "${files[@]}" > ruff-format.txt 2>&1
          echo "$?" > ruff-format-status.txt
          cat ruff-check.txt
          cat ruff-format.txt
          exit 0

      - name: Upload exact Ruff markers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-paired-attribution-ruff-markers
          path: |
            ruff-check.txt
            ruff-check-status.txt
            ruff-format.txt
            ruff-format-status.txt
          if-no-files-found: error
          retention-days: 7

  windows-targeted-test:
    name: Capture targeted Windows test marker
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install project and targeted test dependencies
        shell: pwsh
        run: >-
          python -m pip install --disable-pip-version-check --quiet -e .
          pytest pytest-xdist pytest-mock pytest-asyncio

      - name: Capture targeted test output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          python -m pytest tests/ai_platform/test_rl_v2_roi_lifecycle_paired_attribution.py -q *> windows-targeted-pytest.txt
          $status = $LASTEXITCODE
          Set-Content -Path windows-targeted-pytest-status.txt -Value $status
          Get-Content windows-targeted-pytest.txt
          exit 0

      - name: Upload targeted Windows marker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-paired-attribution-windows-test-marker
          path: |
            windows-targeted-pytest.txt
            windows-targeted-pytest-status.txt
          if-no-files-found: error
          retention-days: 7
