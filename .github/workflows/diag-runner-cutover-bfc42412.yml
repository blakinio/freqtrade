name: Diagnose Runner Cutover bfc42412

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/diag-runner-cutover-bfc42412.yml"

permissions:
  contents: read

jobs:
  inspect:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print matching workflow runs and jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: bfc42412b8a4ffe233efcd7ba446c782fe092600
        run: |
          set -euo pipefail
          runs="$(gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100")"
          python3 - "$runs" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          matches = payload.get("workflow_runs", [])
          if not matches:
              raise SystemExit("No workflow runs found for target SHA")
          for run in matches:
              print(
                  f"RUN id={run.get('id')} name={run.get('name')} event={run.get('event')} "
                  f"status={run.get('status')} conclusion={run.get('conclusion')} attempt={run.get('run_attempt')}"
              )
          PY
          run_ids="$(python3 - "$runs" <<'PY'
          import json
          import sys
          for run in json.loads(sys.argv[1]).get("workflow_runs", []):
              print(run["id"])
          PY
          )"
          while read -r run_id; do
            test -n "$run_id" || continue
            echo "JOBS run_id=$run_id"
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              --jq '.jobs[] | "JOB id=\(.id) name=\(.name) status=\(.status) conclusion=\(.conclusion) runner=\(.runner_name)"'
          done <<< "$run_ids"
