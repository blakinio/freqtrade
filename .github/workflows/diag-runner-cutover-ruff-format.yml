name: Diagnose Runner Cutover Ruff Format

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/diag-runner-cutover-ruff-format.yml"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print canonical format diff
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python -m pip install --quiet ruff==0.15.21
          gh api \
            --header "Accept: application/vnd.github.raw+json" \
            "/repos/$REPOSITORY/contents/tests/ai_platform/portal/deployment/test_freqtrade_synology_runner_state_path_cutover.py?ref=$HEAD_REF" \
            > /tmp/runner-cutover-test.py
          ruff format --diff /tmp/runner-cutover-test.py
