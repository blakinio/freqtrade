name: Diagnose Bounded M1 V3

on:
  pull_request:
    branches: [develop]
    paths:
      - "ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/**"
      - "docs/agents/tasks/FTAI-20260728-residual-pytorch-bounded-m1-v3-generalization.md"

permissions:
  contents: write

jobs:
  diagnose-and-format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: false
          python-version: "3.12"
      - name: Install project and diagnostic dependencies
        run: uv pip install -e . numpy pandas pytest pytest-xdist pytest-mock pre-commit
      - name: Apply exact mechanical formatting fixes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            ai_platform/scripts/residual_pytorch_bounded_m1_v3_generalization.py
            ai_platform/scripts/residual_pytorch_bounded_m1_v3_run_request.py
            tests/ai_platform/test_residual_pytorch_bounded_m1_v3_generalization.py
          )
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/scripts/residual_pytorch_bounded_m1_v3_generalization.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from contextlib import contextmanager\n"
              "from pathlib import Path\n"
              "from typing import Any, Iterator\n",
              "from collections.abc import Iterator\n"
              "from contextlib import contextmanager\n"
              "from pathlib import Path\n"
              "from typing import Any\n",
          )
          path.write_text(text, encoding="utf-8")
          PY
          pre-commit run ruff --files "${files[@]}"
          pre-commit run ruff-format --files "${files[@]}" || true
          pre-commit run ruff --files "${files[@]}"
          pre-commit run ruff-format --files "${files[@]}"
          expected=$'ai_platform/scripts/residual_pytorch_bounded_m1_v3_generalization.py\nai_platform/scripts/residual_pytorch_bounded_m1_v3_run_request.py\ntests/ai_platform/test_residual_pytorch_bounded_m1_v3_generalization.py'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
      - name: Commit exact formatted files
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/scripts/residual_pytorch_bounded_m1_v3_generalization.py \
            ai_platform/scripts/residual_pytorch_bounded_m1_v3_run_request.py \
            tests/ai_platform/test_residual_pytorch_bounded_m1_v3_generalization.py
          git commit -m "style(ai-platform): format bounded M1 v3 package"
          git push origin HEAD:"$HEAD_BRANCH"
      - name: Run AI platform tests after formatting
        shell: bash
        run: |
          set +e
          python -m pytest tests/ai_platform -q > pytest.log 2>&1
          status=$?
          printf '%s\n' "$status" > pytest-exit-code.txt
          cat pytest.log
          exit "$status"
      - name: Upload diagnostic test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-m1-v3-diagnostic-${{ github.event.pull_request.number }}
          path: |
            pytest.log
            pytest-exit-code.txt
          if-no-files-found: warn
          retention-days: 1
