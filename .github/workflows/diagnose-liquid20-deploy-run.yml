name: Inspect Fixture Repair Helper Run

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-liquid20-deploy-run.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect exact helper push run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          sha = "b41dbe3e0089c33219acc59e380daaaca58db96a"
          repository = os.environ["GITHUB_REPOSITORY"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/runs?head_sha={sha}&event=push&per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          runs = [
              {
                  "id": item["id"],
                  "name": item["name"],
                  "status": item["status"],
                  "conclusion": item["conclusion"],
                  "head_sha": item["head_sha"],
              }
              for item in payload.get("workflow_runs", [])
              if item.get("name") == "Apply Portal Proof Fixture Session Repair"
          ]
          print("HELPER_RUNS=" + json.dumps(runs, sort_keys=True))
          if not runs:
              raise SystemExit("No exact helper run found")
          PY
