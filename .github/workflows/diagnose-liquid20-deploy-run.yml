name: Inspect Fixture Repair Helper Failure

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-liquid20-deploy-run.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read bounded helper failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/90236377897/logs" \
            --output /tmp/helper.log
          awk 'length($0) < 1600' /tmp/helper.log \
            | grep -E 'expected one|SystemExit|Traceback|Process completed|exit code|Error|found [0-9]+|fatal:' \
            | tail -n 60
