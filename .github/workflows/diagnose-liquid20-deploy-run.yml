name: Verify Portal Proof Bash Semantics

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-liquid20-deploy-run.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: freqtrade-staging
    timeout-minutes: 3
    steps:
      - name: Verify empty array expansion under nounset
        run: |
          set -uo pipefail
          bash --version | head -n 1
          set +e
          bash -Eeuo pipefail -c 'pids_limit_args=(); run_args=(docker run); run_args+=("${pids_limit_args[@]}"); printf "SAFE_COUNT=%s\n" "${#run_args[@]}"' >/tmp/array.out 2>/tmp/array.err
          status=$?
          set -e
          echo "ARRAY_PROBE_STATUS=$status"
          echo "ARRAY_PROBE_STDOUT=$(cat /tmp/array.out)"
          echo "ARRAY_PROBE_STDERR=$(cat /tmp/array.err)"
