name: Inspect Portal Proof Repair Failure

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-liquid20-deploy-run.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read bounded failed-job diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/90206827335/logs" \
            --output /tmp/failed-job.log
          echo '--- FILTERED FAILURE ---'
          awk 'length($0) < 1200' /tmp/failed-job.log \
            | grep -E 'Expected one replacement|Traceback|SystemExit|Process completed|exit code|Error|found [0-9]+' \
            | tail -n 30
