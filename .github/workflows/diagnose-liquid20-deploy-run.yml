name: Inspect Portal Proof Failure

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-liquid20-deploy-run.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: freqtrade-staging
    timeout-minutes: 5
    steps:
      - name: Read bounded proof failure diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/90215928048/logs" \
            --output /tmp/portal-proof-job.log
          echo '--- PROOF FAILURE TAIL ---'
          awk 'length($0) < 1800' /tmp/portal-proof-job.log \
            | grep -E 'Docker PID|Candidate|candidate|SESSION_MISSING|healthy|health|Error|SystemExit|Process completed|exit code|permission|group|mount|LIVE|heartbeat|status|not found|No such|failed|failure|curl:|test:' \
            | tail -n 100
