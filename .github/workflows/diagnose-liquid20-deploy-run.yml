name: Validate Portal Fixture Session Proof Candidate

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-liquid20-deploy-run.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: freqtrade-staging
    timeout-minutes: 12
    steps:
      - name: Check out exact PR 598 head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 7bb68bb1c32df6fc4a84506e3cba9791d7b6289c
          persist-credentials: false
          show-progress: false

      - name: Run isolated read-only portal proof
        env:
          PORTAL_CONTAINER_NAME: freqtrade-portal-staging
          PORTAL_LIQUIDATIONS_HOST_ROOT: /volume1/docker/freqtrade-liquidations/data
          PORTAL_LIVE_PROOF_REPORT_PATH: ${{ runner.temp }}/portal-fixture-session-proof.json
          PORTAL_LIVE_PROOF_DELAY_SECONDS: "12"
          PORTAL_LIVE_PROOF_CANDIDATE: portal-fixture-session-proof-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -o pipefail
          bash deploy/synology/portal/prove-liquidations-live.sh 2>&1 \
            | tee "${{ runner.temp }}/portal-fixture-session-proof.log"

      - name: Upload bounded proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portal-fixture-session-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/portal-fixture-session-proof.json
            ${{ runner.temp }}/portal-fixture-session-proof.log
          if-no-files-found: warn
          retention-days: 2
