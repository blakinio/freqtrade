name: Inspect Portal Fixture Identity Contract

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-liquid20-deploy-run.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: freqtrade-staging
    timeout-minutes: 8
    steps:
      - name: Check out exact repaired source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 60f84d1302c8cf8907deff13008da2f120939a4f
          persist-credentials: false

      - name: Inspect bounded identity contract
        env:
          PORTAL_CONTAINER: freqtrade-portal-staging
        run: |
          set -Eeuo pipefail
          echo '--- REPOSITORY IDENTITY MATCHES ---'
          grep -RInE --exclude-dir=.git --exclude-dir=node_modules \
            'PORTAL_IDENTITY_FIXTURE_MODE|SESSION_MISSING|fixture.*session|session.*fixture|IDENTITY_FIXTURE' \
            portal deploy tests 2>/dev/null | head -n 240 || true
          echo '--- PORTAL TREE CANDIDATES ---'
          find portal -maxdepth 5 -type f 2>/dev/null \
            | grep -Ei 'auth|identity|session|middleware|fixture' \
            | head -n 160 || true
          echo '--- RUNNING IMAGE ENV NAMES ---'
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$PORTAL_CONTAINER" \
            | sed 's/=.*$/=<redacted>/' \
            | grep -Ei 'PORTAL|AUTH|IDENTITY|SESSION' \
            | sort -u || true
          echo '--- RUNNING BUNDLE IDENTITY MATCHES ---'
          docker exec "$PORTAL_CONTAINER" sh -lc \
            "grep -RIlE 'PORTAL_IDENTITY_FIXTURE_MODE|SESSION_MISSING|IDENTITY_FIXTURE' /app 2>/dev/null | head -n 80" || true
