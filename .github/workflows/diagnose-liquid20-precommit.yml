name: Diagnose Liquid20 Pre-commit

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-liquid20-precommit.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Capture pre-commit result
        run: |
          set -uo pipefail
          python -m pip install --disable-pip-version-check pre-commit
          mkdir -p "$RUNNER_TEMP/liquid20-precommit"
          set +e
          pre-commit run --all-files > "$RUNNER_TEMP/liquid20-precommit/output.txt" 2>&1
          status=$?
          set -e
          git diff --binary > "$RUNNER_TEMP/liquid20-precommit/generated.patch"
          git status --short > "$RUNNER_TEMP/liquid20-precommit/status.txt"
          printf 'pre_commit_exit=%s\n' "$status" > "$RUNNER_TEMP/liquid20-precommit/result.txt"
          cat "$RUNNER_TEMP/liquid20-precommit/output.txt"
          echo "=== generated diff ==="
          cat "$RUNNER_TEMP/liquid20-precommit/generated.patch"
          exit 0

      - name: Upload bounded diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liquid20-precommit-${{ github.run_id }}
          path: ${{ runner.temp }}/liquid20-precommit
          if-no-files-found: error
          retention-days: 3
