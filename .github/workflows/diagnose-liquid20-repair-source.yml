name: Export Liquid20 Repair Sources

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-liquid20-repair-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR merge source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Stage repair sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/liquid20-repair-source"
          cp --parents \
            ai_platform/scripts/liquidation_live_stream.py \
            deploy/synology/liquid20/deploy-live.sh \
            deploy/synology/liquid20/live-entrypoint.sh \
            deploy/synology/liquid20/compose.yaml \
            deploy/synology/liquid20/.env.example \
            deploy/synology/liquid20/LIVE_STREAM.md \
            tests/ai_platform_integration/test_synology_liquid20_live_deployment.py \
            "$RUNNER_TEMP/liquid20-repair-source"
          find tests -type f -iname '*liquidation*live*' -print0 | \
            xargs -0 -r cp --parents --target-directory "$RUNNER_TEMP/liquid20-repair-source"

      - name: Upload source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liquid20-repair-source-${{ github.run_id }}
          path: ${{ runner.temp }}/liquid20-repair-source
          if-no-files-found: error
          retention-days: 3
