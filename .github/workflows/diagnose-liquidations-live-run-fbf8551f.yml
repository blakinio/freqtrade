name: Diagnose Liquidations Live Run fbf8551f

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-liquidations-live-run-fbf8551f.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Find trusted push run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: fbf8551f606f6868cb86d65432fb9ab4b11311c3
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/liquidations-live-synology.yml/runs?branch=develop&event=push&per_page=30")"
          match="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)]' <<<"$response")"
          echo "LIQUIDATIONS_LIVE_RUNS=$match"
          test "$(jq 'length' <<<"$match")" -ge 1
