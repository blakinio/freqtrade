name: Finalize PR1388 hygiene

on:
  pull_request:
    branches:
      - develop
    paths:
      - "ai_platform/portal/database/schema.py"
      - "tests/ai_platform/portal/control_plane/test_managed_runtime_mode_semantics.py"
      - ".github/workflows/diagnose-pr1388.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 1388 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/portal-runtime-generation-state-1357'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/portal-runtime-generation-state-1357
          fetch-depth: 1
          persist-credentials: true
      - name: Append required EOF and remove diagnostic workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/portal/database/schema.py")
          data = path.read_bytes()
          if not data.endswith(b"\n"):
              path.write_bytes(data + b"\n")
          PY
          git rm .github/workflows/diagnose-pr1388.yml
          git diff --check
      - name: Commit exact hygiene repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/portal/database/schema.py
          git commit -m "chore(portal): finalize PR1388 hygiene (#1357)"
          git push origin HEAD:refs/heads/feat/portal-runtime-generation-state-1357
