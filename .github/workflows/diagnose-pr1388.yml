name: Diagnose PR1388

on:
  pull_request:
    paths:
      - "ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/diagnose-pr1388.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6"
          "httpx>=0.24.1" fastapi pyjwt cryptography "PyYAML>=6.0"
          ruff==0.15.21 codespell==2.4.2
      - name: Diagnose pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q -o addopts='' --tb=short \
            --confcutdir=tests/ai_platform \
            --ignore=tests/ai_platform/portal/feature_registry \
            --ignore=tests/ai_platform/portal/strategy_lab \
            tests/ai_platform > /tmp/pytest.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            tail -c 45000 /tmp/pytest.log > /tmp/pytest-tail.log
            message=$(cat /tmp/pytest-tail.log)
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=PR1388 pytest diagnostic::$message"
          fi
          exit $status
      - name: Diagnose Ruff
        if: always()
        shell: bash
        run: |
          set +e
          {
            ruff check ai_platform tests/ai_platform
            ruff format --diff --check ai_platform tests/ai_platform
          } > /tmp/ruff.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            tail -c 45000 /tmp/ruff.log > /tmp/ruff-tail.log
            message=$(cat /tmp/ruff-tail.log)
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=PR1388 ruff diagnostic::$message"
          fi
          exit $status
      - name: Show exact Ruff repair diff
        if: always()
        shell: bash
        run: |
          set +e
          ruff check --fix \
            ai_platform/portal/control_plane/service.py \
            tests/ai_platform/portal/control_plane/test_managed_runtime_mode_semantics.py \
            >/tmp/ruff-fix.log 2>&1
          ruff format \
            ai_platform/portal/control_plane/service.py \
            tests/ai_platform/portal/control_plane/test_managed_runtime_mode_semantics.py \
            >>/tmp/ruff-fix.log 2>&1
          git diff -- \
            ai_platform/portal/control_plane/service.py \
            tests/ai_platform/portal/control_plane/test_managed_runtime_mode_semantics.py \
            >/tmp/ruff-fix.diff
          message=$(cat /tmp/ruff-fix.diff)
          message=${message//'%'/'%25'}
          message=${message//$'\r'/'%0D'}
          message=${message//$'\n'/'%0A'}
          echo "::notice title=PR1388 exact Ruff repair diff::$message"
