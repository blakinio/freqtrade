name: Diagnose PR594 Ruff

on:
  push:
    branches:
      - fix/liquidations-live-health-status-20260728
    paths:
      - .github/workflows/diagnose-pr594-ruff.yml
      - ai_platform/scripts/liquidation_portal_health.py
      - tests/ai_platform_integration/test_liquidation_portal_health.py
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/diagnose-pr594-ruff.yml
      - ai_platform/scripts/liquidation_portal_health.py
      - tests/ai_platform_integration/test_liquidation_portal_health.py

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Capture exact Ruff diagnostics and binary
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ruff==0.15.21"
          {
            ruff check \
              ai_platform/scripts/liquidation_portal_health.py \
              tests/ai_platform_integration/test_liquidation_portal_health.py || true
            ruff format --check \
              ai_platform/scripts/liquidation_portal_health.py \
              tests/ai_platform_integration/test_liquidation_portal_health.py || true
          } > "$RUNNER_TEMP/pr594-ruff.txt" 2>&1
          cp "$(command -v ruff)" "$RUNNER_TEMP/ruff-0.15.21"
          chmod 0755 "$RUNNER_TEMP/ruff-0.15.21"
      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr594-ruff-diagnostic
          path: |
            ${{ runner.temp }}/pr594-ruff.txt
            ${{ runner.temp }}/ruff-0.15.21
          retention-days: 1
          if-no-files-found: error
