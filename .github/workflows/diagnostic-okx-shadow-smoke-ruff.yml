name: Diagnostic OKX Shadow Smoke Ruff

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  ruff-report:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21

      - name: Capture lint and formatting reports
        shell: bash
        run: |
          set -euo pipefail
          files=(
            ai_platform/scripts/liquidation_okx_shadow_smoke.py
            tests/ai_platform_integration/test_liquidation_okx_shadow_smoke.py
          )
          ruff check "${files[@]}" --output-format=json > ruff-check.json || true
          ruff format --diff "${files[@]}" > ruff-format.diff || true

      - name: Upload reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: okx-shadow-smoke-ruff-${{ github.event.pull_request.number }}
          path: |
            ruff-check.json
            ruff-format.diff
          if-no-files-found: error
          retention-days: 1
