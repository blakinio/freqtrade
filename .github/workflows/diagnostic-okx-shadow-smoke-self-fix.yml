name: Diagnostic OKX Shadow Smoke Self Fix

on:
  push:
    branches:
      - feat/liquidation-okx-shadow-smoke-v1
    paths:
      - ".github/workflows/diagnostic-okx-shadow-smoke-self-fix.yml"

permissions:
  contents: write

jobs:
  exact-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/liquidation-okx-shadow-smoke-v1
          fetch-depth: 0

      - name: Apply exact mypy narrowing and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/scripts/liquidation_okx_shadow_smoke.py")
          text = path.read_text(encoding="utf-8")
          integer_old = '''def _integer(value: object, *, field: str) -> int:
              if isinstance(value, bool):
                  raise TypeError(f"{field} must be an integer")
              try:
                  parsed = int(value)
              except (TypeError, ValueError) as exc:
                  raise TypeError(f"{field} must be an integer") from exc
              if str(parsed) != str(value).strip() and not isinstance(value, int):
                  raise TypeError(f"{field} must be an integer")
              return parsed
          '''
          integer_new = '''def _integer(value: object, *, field: str) -> int:
              if isinstance(value, bool) or not isinstance(value, (int, str)):
                  raise TypeError(f"{field} must be an integer")
              try:
                  parsed = int(value)
              except ValueError as exc:
                  raise TypeError(f"{field} must be an integer") from exc
              if isinstance(value, str) and str(parsed) != value.strip():
                  raise TypeError(f"{field} must be an integer")
              return parsed
          '''
          number_old = '''def _number(value: object, *, field: str) -> float:
              if isinstance(value, bool):
                  raise TypeError(f"{field} must be numeric")
              try:
                  parsed = float(value)
              except (TypeError, ValueError) as exc:
                  raise TypeError(f"{field} must be numeric") from exc
              if not parsed == parsed or parsed in (float("inf"), float("-inf")):
                  raise ValueError(f"{field} must be finite")
              return parsed
          '''
          number_new = '''def _number(value: object, *, field: str) -> float:
              if isinstance(value, bool) or not isinstance(value, (int, float, str)):
                  raise TypeError(f"{field} must be numeric")
              try:
                  parsed = float(value)
              except ValueError as exc:
                  raise TypeError(f"{field} must be numeric") from exc
              if not parsed == parsed or parsed in (float("inf"), float("-inf")):
                  raise ValueError(f"{field} must be finite")
              return parsed
          '''
          if text.count(integer_old) != 1 or text.count(number_old) != 1:
              raise SystemExit("exact narrowing target did not match once")
          path.write_text(
              text.replace(integer_old, integer_new).replace(number_old, number_new),
              encoding="utf-8",
          )
          PY
          rm -f \
            .github/workflows/diagnostic-okx-shadow-smoke-precommit.yml \
            .github/workflows/diagnostic-okx-shadow-smoke-self-fix.yml

      - name: Commit exact branch-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/scripts/liquidation_okx_shadow_smoke.py \
            .github/workflows/diagnostic-okx-shadow-smoke-precommit.yml \
            .github/workflows/diagnostic-okx-shadow-smoke-self-fix.yml
          git diff --cached --check
          git commit -m "fix(ai-platform): narrow OKX smoke numeric inputs"
          git push origin HEAD:feat/liquidation-okx-shadow-smoke-v1
