name: Diagnostic OKX Smoke Evidence Pre-commit

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  report:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit

      - name: Capture report
        shell: bash
        run: |
          set -o pipefail
          pre-commit run --all-files --show-diff-on-failure > precommit.log 2>&1 || true
          git diff > precommit.diff

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: okx-smoke-evidence-precommit-${{ github.event.pull_request.number }}
          path: |
            precommit.log
            precommit.diff
          if-no-files-found: error
          retention-days: 1
