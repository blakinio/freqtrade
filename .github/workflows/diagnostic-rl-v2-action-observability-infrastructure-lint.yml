name: Diagnostic RL-v2 Action Observability Infrastructure Lint

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - feat/rl-v2-action-observability-execution-infrastructure

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          ref: diagnostic/rl-v2-action-observability-infrastructure-lint

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check --quiet ruff==0.15.21

      - name: Apply exact fail-closed complexity waiver and formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "ai_platform/scripts/rl_v2_action_observability_execution_run_request.py"
          )
          text = path.read_text(encoding="utf-8")
          old = (
              "def _validate_contract() -> "
              "tuple[dict[str, Any], dict[str, Any], dict[str, Any]]:\n"
          )
          new = (
              "def _validate_contract(  # noqa: C901\n"
              ") -> tuple[dict[str, Any], dict[str, Any], dict[str, Any]]:\n"
          )
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Expected _validate_contract signature not found")
          PY
          ruff format \
            ai_platform/strategies/AiDesiredPositionRLLifecycleAlignedObservableResearchStrategy.py \
            ai_platform/scripts/rl_v2_action_observability_execution_run_request.py \
            ai_platform/scripts/rl_v2_action_observability_execution_evidence.py \
            tests/ai_platform/test_rl_v2_action_observability_execution.py
          ruff check \
            ai_platform/strategies/AiDesiredPositionRLLifecycleAlignedObservableResearchStrategy.py \
            ai_platform/scripts/rl_v2_action_observability_execution_run_request.py \
            ai_platform/scripts/rl_v2_action_observability_execution_evidence.py \
            tests/ai_platform/test_rl_v2_action_observability_execution.py
          ruff format --check \
            ai_platform/strategies/AiDesiredPositionRLLifecycleAlignedObservableResearchStrategy.py \
            ai_platform/scripts/rl_v2_action_observability_execution_run_request.py \
            ai_platform/scripts/rl_v2_action_observability_execution_evidence.py \
            tests/ai_platform/test_rl_v2_action_observability_execution.py

      - name: Commit deterministic corrections
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No Ruff corrections remain"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ai_platform/strategies/AiDesiredPositionRLLifecycleAlignedObservableResearchStrategy.py \
            ai_platform/scripts/rl_v2_action_observability_execution_run_request.py \
            ai_platform/scripts/rl_v2_action_observability_execution_evidence.py \
            tests/ai_platform/test_rl_v2_action_observability_execution.py
          git commit -m "style(ai-platform): apply observability infrastructure Ruff fixes"
          git push origin HEAD:diagnostic/rl-v2-action-observability-infrastructure-lint
