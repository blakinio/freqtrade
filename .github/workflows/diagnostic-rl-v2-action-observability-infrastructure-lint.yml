name: Diagnostic RL-v2 Action Observability Infrastructure Lint

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - feat/rl-v2-action-observability-execution-infrastructure

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          ref: diagnostic/rl-v2-action-observability-infrastructure-lint

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Apply exact Ruff and mypy corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          request_path = Path(
              "ai_platform/scripts/rl_v2_action_observability_execution_run_request.py"
          )
          request = request_path.read_text(encoding="utf-8")
          replacements = (
              ("        keys: set[str] = set()\n", "        collected_keys: set[str] = set()\n"),
              ("            keys.update(_collect_keys(child))\n", "            collected_keys.update(_collect_keys(child))\n"),
              ("        return keys\n", "        return collected_keys\n"),
          )
          if "        keys: set[str] = set()\n" in request:
              for old, new in replacements:
                  request = request.replace(old, new, 1)
          elif "        collected_keys: set[str] = set()\n" not in request:
              raise SystemExit("Expected list key collector not found")
          request_path.write_text(request, encoding="utf-8")

          evidence_path = Path(
              "ai_platform/scripts/rl_v2_action_observability_execution_evidence.py"
          )
          evidence = evidence_path.read_text(encoding="utf-8")
          old = "        if position_long:\n            long_state_counts[state_key] += 1\n"
          new = "        if trade is not None:\n            long_state_counts[state_key] += 1\n"
          if old in evidence:
              evidence = evidence.replace(old, new, 1)
          elif new not in evidence:
              raise SystemExit("Expected optional trade block not found")
          evidence_path.write_text(evidence, encoding="utf-8")
          PY

      - name: Install exact validation tools
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            ruff==0.15.21 pre-commit

      - name: Format and validate exact changed files
        run: |
          ruff format \
            ai_platform/scripts/rl_v2_action_observability_execution_run_request.py \
            ai_platform/scripts/rl_v2_action_observability_execution_evidence.py
          ruff check \
            ai_platform/strategies/AiDesiredPositionRLLifecycleAlignedObservableResearchStrategy.py \
            ai_platform/scripts/rl_v2_action_observability_execution_run_request.py \
            ai_platform/scripts/rl_v2_action_observability_execution_evidence.py \
            tests/ai_platform/test_rl_v2_action_observability_execution.py
          ruff format --check \
            ai_platform/strategies/AiDesiredPositionRLLifecycleAlignedObservableResearchStrategy.py \
            ai_platform/scripts/rl_v2_action_observability_execution_run_request.py \
            ai_platform/scripts/rl_v2_action_observability_execution_evidence.py \
            tests/ai_platform/test_rl_v2_action_observability_execution.py
          pre-commit run --files \
            ai_platform/scripts/rl_v2_action_observability_execution_run_request.py \
            ai_platform/scripts/rl_v2_action_observability_execution_evidence.py \
            tests/ai_platform/test_rl_v2_action_observability_execution.py

      - name: Commit deterministic corrections
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No validation corrections remain"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ai_platform/scripts/rl_v2_action_observability_execution_run_request.py \
            ai_platform/scripts/rl_v2_action_observability_execution_evidence.py
          git commit -m "fix(ai-platform): satisfy observability infrastructure typing"
          git push origin HEAD:diagnostic/rl-v2-action-observability-infrastructure-lint
