name: Diagnostic RL-v2 Action Observability Infrastructure Lint

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - feat/rl-v2-action-observability-execution-infrastructure

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check --quiet ruff==0.15.21

      - name: Capture exact lint and format defects
        id: lint
        shell: bash
        run: |
          set +e
          ruff check \
            ai_platform/strategies/AiDesiredPositionRLLifecycleAlignedObservableResearchStrategy.py \
            ai_platform/scripts/rl_v2_action_observability_execution_run_request.py \
            ai_platform/scripts/rl_v2_action_observability_execution_evidence.py \
            tests/ai_platform/test_rl_v2_action_observability_execution.py \
            > ruff-output.txt 2>&1
          check_status=$?
          ruff format --check \
            ai_platform/strategies/AiDesiredPositionRLLifecycleAlignedObservableResearchStrategy.py \
            ai_platform/scripts/rl_v2_action_observability_execution_run_request.py \
            ai_platform/scripts/rl_v2_action_observability_execution_evidence.py \
            tests/ai_platform/test_rl_v2_action_observability_execution.py \
            >> ruff-output.txt 2>&1
          format_status=$?
          echo "check_status=$check_status" >> "$GITHUB_OUTPUT"
          echo "format_status=$format_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact Ruff output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-ruff-output
          path: ruff-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preserve diagnostic failure status
        if: steps.lint.outputs.check_status != '0' || steps.lint.outputs.format_status != '0'
        run: exit 1
