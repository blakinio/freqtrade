name: Diagnostic RL-v2 Action Observability Pre-commit

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - fix/rl-v2-action-observability-infrastructure-ruff

permissions:
  contents: read

jobs:
  precommit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --quiet pre-commit

      - name: Capture exact changed-file pre-commit output
        id: check
        shell: bash
        run: |
          set +e
          pre-commit run --files \
            ai_platform/scripts/rl_v2_action_observability_execution_run_request.py \
            ai_platform/scripts/rl_v2_action_observability_execution_evidence.py \
            tests/ai_platform/test_rl_v2_action_observability_execution.py \
            > precommit-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          git diff -- \
            ai_platform/scripts/rl_v2_action_observability_execution_run_request.py \
            ai_platform/scripts/rl_v2_action_observability_execution_evidence.py \
            tests/ai_platform/test_rl_v2_action_observability_execution.py \
            >> precommit-output.txt 2>&1
          exit 0

      - name: Upload exact pre-commit output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-precommit-output
          path: precommit-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preserve diagnostic status
        if: steps.check.outputs.status != '0'
        run: exit 1
