name: Experimental Model One-Shot Exact Ruff Autoformat

on:
  push:
    branches:
      - research/experimental-model-historical-backtest-execution-v1

permissions:
  contents: write

jobs:
  format-and-push:
    if: github.repository == 'blakinio/freqtrade'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: research/experimental-model-historical-backtest-execution-v1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install exact repository Ruff
        run: python -m pip install --disable-pip-version-check --quiet ruff==0.15.20

      - name: Apply exact lint fixes and formatting
        run: |
          ruff check --fix \
            ai_platform/scripts/experimental_model_historical_backtest_run_request.py \
            tests/ai_platform/test_experimental_model_historical_backtest_run_request.py
          ruff format \
            ai_platform/scripts/experimental_model_historical_backtest_run_request.py \
            tests/ai_platform/test_experimental_model_historical_backtest_run_request.py
          ruff check \
            ai_platform/scripts/experimental_model_historical_backtest_run_request.py \
            tests/ai_platform/test_experimental_model_historical_backtest_run_request.py
          ruff format --check \
            ai_platform/scripts/experimental_model_historical_backtest_run_request.py \
            tests/ai_platform/test_experimental_model_historical_backtest_run_request.py

      - name: Commit only formatter results
        shell: bash
        run: |
          set -euo pipefail
          git add \
            ai_platform/scripts/experimental_model_historical_backtest_run_request.py \
            tests/ai_platform/test_experimental_model_historical_backtest_run_request.py
          if git diff --cached --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(ai-platform): apply exact repository Ruff formatting"
          git push origin HEAD:research/experimental-model-historical-backtest-execution-v1
