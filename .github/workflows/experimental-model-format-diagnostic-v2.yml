name: Experimental Model Exact Ruff Format Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - "ai_platform/scripts/experimental_model_historical_backtest_run_request.py"
      - "tests/ai_platform/test_experimental_model_historical_backtest_run_request.py"
      - ".github/workflows/experimental-model-format-diagnostic-v2.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install exact repository Ruff
        run: python -m pip install --disable-pip-version-check --quiet ruff==0.15.20

      - name: Apply exact repository lint fixes and formatting
        run: |
          ruff check --fix \
            ai_platform/scripts/experimental_model_historical_backtest_run_request.py \
            tests/ai_platform/test_experimental_model_historical_backtest_run_request.py
          ruff format \
            ai_platform/scripts/experimental_model_historical_backtest_run_request.py \
            tests/ai_platform/test_experimental_model_historical_backtest_run_request.py
          ruff check \
            ai_platform/scripts/experimental_model_historical_backtest_run_request.py \
            tests/ai_platform/test_experimental_model_historical_backtest_run_request.py
          ruff format --check \
            ai_platform/scripts/experimental_model_historical_backtest_run_request.py \
            tests/ai_platform/test_experimental_model_historical_backtest_run_request.py

      - name: Upload exact formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experimental-model-exact-ruff-formatted-${{ github.sha }}
          path: |
            ai_platform/scripts/experimental_model_historical_backtest_run_request.py
            tests/ai_platform/test_experimental_model_historical_backtest_run_request.py
          if-no-files-found: error
          retention-days: 1
