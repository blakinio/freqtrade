name: Experimental Model Full Pre-commit Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/experimental-model-full-precommit-diagnostic.yml"
      - ".github/workflows/experimental-model-ruff-autofix-once.yml"
      - ".github/workflows/experimental-model-historical-backtest-execution.yml"
      - "ai_platform/experimental_model_research/historical-backtest-execution-contract-v1.json"
      - "ai_platform/scripts/experimental_model_historical_backtest_run_request.py"
      - "docs/agents/tasks/FTAI-20260721-experimental-model-historical-backtest-execution.md"
      - "docs/ai_platform/EXPERIMENTAL_MODEL_HISTORICAL_BACKTEST_EXECUTION.md"
      - "tests/ai_platform/test_experimental_model_historical_backtest_run_request.py"

permissions:
  contents: read

jobs:
  precommit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.13"

      - name: Install exact pre-commit runtime
        run: python -m pip install --disable-pip-version-check --quiet pre-commit==4.6.0

      - name: Capture exact full pre-commit output and modifications
        shell: bash
        run: |
          set +e
          pre-commit run --all-files > precommit.log 2>&1
          status=$?
          git diff --binary > precommit.diff
          echo "$status" > precommit.status
          cat precommit.log
          exit 0

      - name: Upload exact pre-commit diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experimental-model-full-precommit-${{ github.sha }}
          path: |
            precommit.log
            precommit.diff
            precommit.status
          if-no-files-found: error
          retention-days: 1
