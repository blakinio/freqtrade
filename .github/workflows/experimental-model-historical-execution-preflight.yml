name: Experimental Model Historical Execution Preflight

on:
  pull_request:
    branches:
      - develop
    paths:
      - "ai_platform/scripts/experimental_model_historical_execution_preflight.py"
      - "ai_platform/experiments/pytorch-research-v1.json"
      - "ai_platform/experiments/rl-research-v1.json"
      - "ai_platform/configs/freqai-pytorch-research.example.json"
      - "ai_platform/configs/freqai-rl-research.example.json"
      - "ai_platform/strategies/AiFrozenCandidateStrategy.py"
      - "ai_platform/strategies/AiLongOnlyRLResearchStrategy.py"
      - "ai_platform/freqaimodels/SeededPyTorchMLPRegressor.py"
      - "ai_platform/freqaimodels/LongOnlyReinforcementLearner.py"
      - "docs/agents/tasks/FTAI-20260721-experimental-model-historical-execution-preflight.md"
      - ".github/workflows/experimental-model-historical-execution-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-model-historical-execution-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify data and execution prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CONFIG_PATH: ai_platform/configs/freqai-pytorch-research.example.json
      DATA_DIR: user_data/data/kraken
      EVIDENCE_DIR: experimental-model-historical-preflight-evidence

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate active task checkpoint before runtime or data access
        run: >-
          python tools/agents/checkpoint.py
          docs/agents/tasks/FTAI-20260721-experimental-model-historical-execution-preflight.md
          --require-checkpoint

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependency-closed FreqAI and RL runtime
        run: python -m pip install --disable-pip-version-check --quiet -e ".[freqai,freqai_rl]"

      - name: Prepare research user directory
        run: freqtrade create-userdir --userdir user_data

      - name: Validate frozen experimental execution contract and command paths
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python -m ai_platform.scripts.experimental_model_historical_execution_preflight \
            contract > "$EVIDENCE_DIR/contract-preflight.json"

      - name: Verify custom model and strategy resolution without backtesting
        run: |
          python - <<'PY'
          from pathlib import Path

          from freqtrade.resolvers import StrategyResolver
          from freqtrade.resolvers.freqaimodel_resolver import FreqaiModelResolver

          config = {
              "user_data_dir": Path("user_data").resolve(),
              "freqaimodel_path": "ai_platform/freqaimodels",
              "strategy_path": "ai_platform/strategies",
          }
          model_names = {
              item["name"]
              for item in FreqaiModelResolver.search_all_objects(config, enum_failed=False)
          }
          strategy_names = {
              item["name"]
              for item in StrategyResolver.search_all_objects(config, enum_failed=False)
          }
          expected_models = {"SeededPyTorchMLPRegressor", "LongOnlyReinforcementLearner"}
          expected_strategies = {"AiFrozenCandidateStrategy", "AiLongOnlyRLResearchStrategy"}
          missing_models = expected_models - model_names
          missing_strategies = expected_strategies - strategy_names
          if missing_models or missing_strategies:
              raise SystemExit(
                  f"Resolver preflight failed: missing_models={sorted(missing_models)}, "
                  f"missing_strategies={sorted(missing_strategies)}"
              )
          print("EXPERIMENTAL_MODEL_RESOLVER_PREFLIGHT=pass")
          PY

      - name: Restore dedicated experimental Kraken historical data cache
        id: kraken-data-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DATA_DIR }}
          key: experimental-model-historical-preflight-v1-${{ runner.os }}-${{ hashFiles('ai_platform/experiments/pytorch-research-v1.json', 'ai_platform/experiments/rl-research-v1.json', 'ai_platform/configs/freqai-pytorch-research.example.json', 'ai_platform/configs/freqai-rl-research.example.json') }}

      - name: Download exact declared Kraken history through 2026-06-30
        if: steps.kraken-data-cache.outputs.cache-hit != 'true'
        run: |
          freqtrade download-data \
            --config "$CONFIG_PATH" \
            --pairs BTC/USDT ETH/USDT \
            --timeframes 15m 1h 4h \
            --timerange 20250801-20260630 \
            --dl-trades \
            --convert

      - name: Verify downloaded pair and timeframe coverage
        run: >-
          python -m ai_platform.scripts.experimental_model_historical_execution_preflight
          verify-data --datadir "$DATA_DIR"
          > "$EVIDENCE_DIR/data-availability.json"

      - name: Save dedicated experimental Kraken historical data cache
        if: steps.kraken-data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DATA_DIR }}
          key: ${{ steps.kraken-data-cache.outputs.cache-primary-key }}

      - name: Upload preflight evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experimental-model-historical-execution-preflight-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14
