name: Experimental Model Pre-commit Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/experimental-model-precommit-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mypy-output:
    name: Capture Mypy diagnostic output
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --quiet pre-commit

      - name: Capture isolated Mypy output
        id: mypy
        continue-on-error: true
        run: |
          set +e
          pre-commit run mypy --files \
            ai_platform/scripts/experimental_model_historical_execution_preflight.py \
            > mypy-diagnostic.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat mypy-diagnostic.txt
          exit "$status"

      - name: Upload Mypy diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experimental-model-mypy-diagnostic
          path: mypy-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Fail when Mypy failed
        if: steps.mypy.outputs.status != '0'
        run: exit 1
