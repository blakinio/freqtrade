name: Experimental Model Pre-commit Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/experimental-model-precommit-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hook:
    name: "Pre-commit diagnostic - ${{ matrix.hook }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        hook:
          - mypy
          - end-of-file-fixer
          - mixed-line-ending
          - debug-statements
          - check-ast
          - trailing-whitespace
          - strip-exif
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Run isolated pre-commit hook
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: "${{ matrix.hook }} --all-files"
