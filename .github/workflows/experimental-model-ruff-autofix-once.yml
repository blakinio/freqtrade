# Temporary one-shot security patcher; self-deletes after pushing the patch.
name: Experimental Model One-Shot Security Patch

on:
  push:
    branches:
      - research/experimental-model-historical-backtest-execution-v1

permissions:
  contents: write

jobs:
  patch-and-clean:
    if: github.repository == 'blakinio/freqtrade'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: research/experimental-model-historical-backtest-execution-v1

      - name: Patch template injection findings and remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/experimental-model-historical-backtest-execution.yml')
          text = path.read_text(encoding='utf-8')
          archive_expr = '$' + '{{ steps.execute.outputs.archive }}'
          run_dir_expr = '$' + '{{ steps.execute.outputs.run_dir }}'

          old_extract = (
              '      - name: Extract strict historical OOS evidence\n'
              '        run: |\n'
              '          python -m ai_platform.scripts.experimental_model_oos_result_extractor \\\n'
              f'            "{archive_expr}" \\\n'
              '            "$MANIFEST_PATH" \\\n'
              '            --output "$EVIDENCE_ROOT/$TRACK_SLUG/strict-oos-extraction.json"\n'
          )
          new_extract = (
              '      - name: Extract strict historical OOS evidence\n'
              '        env:\n'
              f'          ARCHIVE: {archive_expr}\n'
              '        run: |\n'
              '          python -m ai_platform.scripts.experimental_model_oos_result_extractor \\\n'
              '            "$ARCHIVE" \\\n'
              '            "$MANIFEST_PATH" \\\n'
              '            --output "$EVIDENCE_ROOT/$TRACK_SLUG/strict-oos-extraction.json"\n'
          )
          if text.count(old_extract) != 1:
              raise SystemExit('Expected exactly one strict OOS extraction block to patch')
          text = text.replace(old_extract, new_extract)

          old_failure = (
              '      - name: Collect failed track diagnostics\n'
              '        if: failure()\n'
              '        shell: bash\n'
              '        run: |\n'
              '          set +e\n'
              '          diagnostics="$EVIDENCE_ROOT/$TRACK_SLUG-failure"\n'
              '          mkdir -p "$diagnostics"\n'
              '          cp "$TRACK_SLUG-run-path.txt" "$diagnostics/" 2>/dev/null || true\n'
              '          cp "$TRACK_SLUG-run-error.txt" "$diagnostics/" 2>/dev/null || true\n'
              '          cp "$REQUEST_PATH" "$diagnostics/run-request.json" 2>/dev/null || true\n'
              '          cp "$CONTRACT_PATH" "$diagnostics/execution-contract.json" 2>/dev/null || true\n'
              f'          if [[ -n "{run_dir_expr}" && -d "{run_dir_expr}" ]]; then\n'
              f'            cp "{run_dir_expr}/run-summary.json" "$diagnostics/" 2>/dev/null || true\n'
              f'            cp "{run_dir_expr}/backtest.log" "$diagnostics/" 2>/dev/null || true\n'
              '          fi\n'
          )
          new_failure = (
              '      - name: Collect failed track diagnostics\n'
              '        if: failure()\n'
              '        shell: bash\n'
              '        env:\n'
              f'          RUN_DIR: {run_dir_expr}\n'
              '        run: |\n'
              '          set +e\n'
              '          diagnostics="$EVIDENCE_ROOT/$TRACK_SLUG-failure"\n'
              '          mkdir -p "$diagnostics"\n'
              '          cp "$TRACK_SLUG-run-path.txt" "$diagnostics/" 2>/dev/null || true\n'
              '          cp "$TRACK_SLUG-run-error.txt" "$diagnostics/" 2>/dev/null || true\n'
              '          cp "$REQUEST_PATH" "$diagnostics/run-request.json" 2>/dev/null || true\n'
              '          cp "$CONTRACT_PATH" "$diagnostics/execution-contract.json" 2>/dev/null || true\n'
              '          if [[ -n "$RUN_DIR" && -d "$RUN_DIR" ]]; then\n'
              '            cp "$RUN_DIR/run-summary.json" "$diagnostics/" 2>/dev/null || true\n'
              '            cp "$RUN_DIR/backtest.log" "$diagnostics/" 2>/dev/null || true\n'
              '          fi\n'
          )
          if text.count(old_failure) != 1:
              raise SystemExit('Expected exactly one failed diagnostics block to patch')
          path.write_text(text.replace(old_failure, new_failure), encoding='utf-8')
          PY

          rm -f \
            .github/workflows/experimental-model-ruff-autofix-once.yml \
            .github/workflows/experimental-model-mypy-diagnostic.yml \
            .github/workflows/experimental-model-precommit-diagnostic.yml \
            .github/workflows/experimental-model-ruff-check-diagnostic.yml

      - name: Commit security patch and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(ai-platform): harden experimental backtest output handling"
          git push origin HEAD:research/experimental-model-historical-backtest-execution-v1
