name: Format PR 1510 focused test

on:
  push:
    branches:
      - fix/wickhunter-1396-observed-generation-reconciliation-20260813
    paths:
      - .github/workflows/fix-1510-ruff-format.yml

permissions: {}

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Apply repository Ruff formatter to focused test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet ruff==0.15.21
          target=tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m ruff format "$target"
          python -m ruff format --check "$target"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git diff --cached --quiet && exit 0
          git commit -m "style(portal): format runtime adoption replacement test"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
