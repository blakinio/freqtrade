name: Apply Binance Smoke V2 Ruff Fixes

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/format-binance-smoke-v2-head-2bac927.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: feat/binance-spot-reduced-payload-smoke-v2
      EXPECTED_HEAD: 2bac9276508db2d198aa36e13eaec9e104659539
    steps:
      - name: Verify exact remote target head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          [[ "$actual" == "$EXPECTED_HEAD" ]]
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Checkout exact target head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Apply exact Ruff fixes and formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "ruff==0.15.21"
          files=(
            ai_platform/market_data/binance_spot_instrument_smoke.py
            tests/ai_platform_integration/test_market_data_binance_spot_instrument_smoke.py
          )
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"
          expected=$'ai_platform/market_data/binance_spot_instrument_smoke.py\ntests/ai_platform_integration/test_market_data_binance_spot_instrument_smoke.py'
          actual="$(git diff --name-only | sort)"
          [[ "$actual" == "$expected" ]]
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"

      - name: Commit and fast-forward exact target branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          actual="$(git ls-remote "$remote" "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          [[ "$actual" == "$EXPECTED_HEAD" ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/market_data/binance_spot_instrument_smoke.py \
            tests/ai_platform_integration/test_market_data_binance_spot_instrument_smoke.py
          git commit -m "style(ai-platform): apply Binance smoke v2 Ruff fixes"
          git push "$remote" "HEAD:refs/heads/${TARGET_BRANCH}"
