name: Format Bounded M1 V3 Test

on:
  pull_request:
    branches: [develop]
    paths:
      - "tests/ai_platform/test_residual_pytorch_bounded_m1_v3_generalization.py"
      - ".github/workflows/format-bounded-m1-v3-test.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: false
          python-version: "3.12"
      - name: Format exactly the v3 test
        shell: bash
        run: |
          set -euo pipefail
          uv pip install ruff==0.15.21
          file=tests/ai_platform/test_residual_pytorch_bounded_m1_v3_generalization.py
          ruff format "$file"
          test "$(git diff --name-only)" = "$file"
          ruff check "$file"
          ruff format --check "$file"
      - name: Commit exact formatting
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          file=tests/ai_platform/test_residual_pytorch_bounded_m1_v3_generalization.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "style(ai-platform): format bounded M1 v3 test"
          git push origin HEAD:"$HEAD_BRANCH"
