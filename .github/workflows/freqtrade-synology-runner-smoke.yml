name: Freqtrade Synology Runner Smoke

on:
  push:
    branches:
      - ops/freqtrade-runner-smoke
    paths:
      - .github/workflows/freqtrade-synology-runner-smoke.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: freqtrade-synology-runner-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: freqtrade-staging
    timeout-minutes: 10

    steps:
      - name: Validate runner and Docker access
        run: |
          set -euo pipefail
          uname -a
          docker version
          docker compose version
          test -S /var/run/docker.sock

      - name: Run disposable container
        run: |
          set -euo pipefail
          name="freqtrade-runner-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run --name "$name" --rm alpine:3.20 sh -c 'echo runner-smoke-ok'

      - name: Verify staging state mount
        run: |
          set -euo pipefail
          marker="/var/lib/freqtrade-staging-state/runner-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'ok\n' > "$marker"
          test "$(cat "$marker")" = "ok"
          rm -f "$marker"

      - name: Publish smoke result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          payload=$(cat <<EOF
          {"state":"$state","context":"freqtrade-synology-runner-smoke","description":"Synology runner smoke: $JOB_STATUS","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"
