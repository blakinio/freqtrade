name: FTAI 1116 Attestation Mode Fix

on:
  push:
    branches:
      - repair/1116-portal-supply-chain
    paths:
      - ".github/workflows/ftai-1116-attestation-mode-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Use native GitHub build provenance attestation mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/portal-supply-chain.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '- name: Verify approval and derive attestation predicates',
              '- name: Verify approval and validate local SLSA provenance',
              1,
          )
          old = '''              predicate = statement.get("predicate")\n              if not isinstance(predicate, dict):\n                  raise SystemExit(f"missing provenance predicate: {name}")\n              output = root / f"{name}.provenance-predicate.json"\n              output.write_text(json.dumps(predicate, indent=2, sort_keys=True) + "\\n", encoding="utf-8")\n'''
          new = '''              predicate = statement.get("predicate")\n              if not isinstance(predicate, dict):\n                  raise SystemExit(f"missing provenance predicate: {name}")\n'''
          if text.count(old) != 1:
              raise SystemExit('local provenance validation block drifted')
          text = text.replace(old, new, 1)

          control_old = '''          subject-name: portal-control-plane\n          subject-digest: ${{ steps.images.outputs.control_digest }}\n          predicate-type: https://slsa.dev/provenance/v1\n          predicate-path: ${{ runner.temp }}/portal-supply-chain/control-plane.provenance-predicate.json\n'''
          control_new = '''          subject-name: portal-control-plane\n          subject-digest: ${{ steps.images.outputs.control_digest }}\n'''
          if text.count(control_old) != 1:
              raise SystemExit('control provenance attestation block drifted')
          text = text.replace(control_old, control_new, 1)

          web_old = '''          subject-name: portal-web\n          subject-digest: ${{ steps.images.outputs.web_digest }}\n          predicate-type: https://slsa.dev/provenance/v1\n          predicate-path: ${{ runner.temp }}/portal-supply-chain/web.provenance-predicate.json\n'''
          web_new = '''          subject-name: portal-web\n          subject-digest: ${{ steps.images.outputs.web_digest }}\n'''
          if text.count(web_old) != 1:
              raise SystemExit('web provenance attestation block drifted')
          text = text.replace(web_old, web_new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/portal-supply-chain.yml').read_text(encoding='utf-8')
          assert 'predicate-path:' not in text
          assert 'predicate-type: https://slsa.dev/provenance/v1' not in text
          assert text.count('id: control_provenance_attest') == 1
          assert text.count('id: web_provenance_attest') == 1
          assert 'control-plane.provenance.json' in text
          assert 'web.provenance.json' in text
          PY
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ftai-1116-attestation-mode-fix.yml
          git add .github/workflows/portal-supply-chain.yml
          git commit -m "fix(portal): use native provenance attestations"
          git push origin HEAD:refs/heads/repair/1116-portal-supply-chain
