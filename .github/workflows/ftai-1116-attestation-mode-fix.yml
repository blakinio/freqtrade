name: FTAI 1116 Attestation Mode Fix

on:
  push:
    branches:
      - repair/1116-portal-supply-chain
    paths:
      - ".github/workflows/ftai-1116-attestation-mode-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Use native GitHub build provenance attestation mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/portal-supply-chain.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          removed_type = 0
          removed_path = 0
          output: list[str] = []
          for line in lines:
              stripped = line.strip()
              if stripped == 'predicate-type: https://slsa.dev/provenance/v1':
                  removed_type += 1
                  continue
              if stripped.startswith('predicate-path:'):
                  removed_path += 1
                  continue
              output.append(line)
          if removed_type != 2 or removed_path != 2:
              raise SystemExit(
                  f'expected two provenance predicate-type/path pairs, got type={removed_type}, path={removed_path}'
              )
          text = '\n'.join(output) + '\n'
          if text.count('id: control_provenance_attest') != 1:
              raise SystemExit('control provenance attestation step missing')
          if text.count('id: web_provenance_attest') != 1:
              raise SystemExit('web provenance attestation step missing')
          if 'control-plane.provenance.json' not in text or 'web.provenance.json' not in text:
              raise SystemExit('local SLSA evidence validation was lost')
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ftai-1116-attestation-mode-fix.yml
          git add .github/workflows/portal-supply-chain.yml
          git commit -m "fix(portal): use native provenance attestations"
          git push origin HEAD:refs/heads/repair/1116-portal-supply-chain
