name: FTAI 1116 Closeout V2

on:
  push:
    branches:
      - repair/1116-portal-supply-chain
    paths:
      - ".github/workflows/ftai-1116-closeout-v2.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Reconcile ledger, projection and archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          ISSUE = 1116
          DR = 1139
          EVIDENCE_SHA = "ba7b339572bc9e2a96b50614b56037715ec53365"
          jp = Path("docs/ai_platform/portal/FEATURE_COMPLETENESS_LEDGER.json")
          mp = Path("docs/ai_platform/portal/FEATURE_COMPLETENESS_LEDGER.md")
          active = Path("docs/agents/tasks/active/FTAI-CA-1116-portal-supply-chain.md")
          archive = Path("docs/agents/tasks/archive/FTAI-CA-1116-portal-supply-chain.md")
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          ledger = json.loads(jp.read_text(encoding="utf-8"))
          ledger["as_of_sha"] = EVIDENCE_SHA
          ledger["generated_at"] = now
          ledger["open_audit_issues"] = [i for i in ledger["open_audit_issues"] if i != ISSUE]
          evidence = ledger["evidence_contract"]["source_evidence"]
          for item in (
              "issue:1116", "pull:1307", "workflow:31172539595",
              "workflow:31172539863", "workflow:31172539567",
              "workflow:31172539813", "workflow:31172539652",
          ):
              if item not in evidence:
                  evidence.append(item)

          for section in ("packages", "surfaces", "cross_cutting_controls"):
              bi = 5 if section == "surfaces" else 4
              for rec in ledger["records"][section]:
                  rec[bi] = [[i for i in blockers if i != ISSUE] for blockers in rec[bi]]

          control = next(
              rec for rec in ledger["records"]["cross_cutting_controls"]
              if rec[0] == "CONTROL-SUPPLY-CHAIN-DR"
          )
          control[2] = "PARTIAL"
          control[3] = [
              "PARTIAL", "NOT_APPLICABLE", "NOT_APPLICABLE",
              "PARTIAL", "EXTERNAL_ACCEPTANCE_REQUIRED",
          ]
          control[4] = [[DR], [], [], [DR], [DR]]

          assert ISSUE not in ledger["open_audit_issues"]
          assert DR in ledger["open_audit_issues"]
          for section in ("packages", "surfaces", "cross_cutting_controls"):
              bi = 5 if section == "surfaces" else 4
              for rec in ledger["records"][section]:
                  assert all(ISSUE not in blockers for blockers in rec[bi])
          jp.write_text(json.dumps(ledger, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")

          def issue_cell(blockers: list[list[int]]) -> str:
              values = sorted({i for group in blockers for i in group})
              return ", ".join(f"#{i}" for i in values) if values else "—"

          rows: dict[str, str] = {}
          status_counts: Counter[str] = Counter()
          package_ids: set[str] = set()
          surface_ids: set[str] = set()
          control_ids: set[str] = set()

          for rec in ledger["records"]["packages"]:
              rid, name, status, dims, blockers, _owner = rec
              package_ids.add(rid); status_counts[status] += 1
              rows[rid] = f"| `{rid}` | {name} | `{status}` | " + " | ".join(f"`{d}`" for d in dims) + f" | {issue_cell(blockers)} |"
          for rec in ledger["records"]["surfaces"]:
              rid, name, route, status, dims, blockers, _owner = rec
              surface_ids.add(rid); status_counts[status] += 1
              rows[rid] = f"| `{rid}` | {name} | `{route}` | `{status}` | " + " | ".join(f"`{d}`" for d in dims) + f" | {issue_cell(blockers)} |"
          for rec in ledger["records"]["cross_cutting_controls"]:
              rid, name, status, dims, blockers, _owner = rec
              control_ids.add(rid); status_counts[status] += 1
              rows[rid] = f"| `{rid}` | {name} | `{status}` | " + " | ".join(f"`{d}`" for d in dims) + f" | {issue_cell(blockers)} |"

          md = mp.read_text(encoding="utf-8")
          md = re.sub(r"(?m)^as_of_sha: [0-9a-f]{40}$", f"as_of_sha: {EVIDENCE_SHA}", md, count=1)
          md = re.sub(r"(?m)^generated_at: .+$", f"generated_at: {now}", md, count=1)
          md = re.sub(r"(?m)^open_audit_issues: \d+$", f"open_audit_issues: {len(ledger['open_audit_issues'])}", md, count=1)

          lines = md.splitlines()
          seen: set[str] = set()
          for idx, line in enumerate(lines):
              match = re.match(r"\| `([^`]+)` \|", line)
              if match and match.group(1) in rows:
                  rid = match.group(1)
                  lines[idx] = rows[rid]
                  seen.add(rid)

          missing_packages = package_ids - seen
          missing_surfaces = surface_ids - seen
          if missing_packages or missing_surfaces:
              raise SystemExit(f"missing projection rows packages={sorted(missing_packages)} surfaces={sorted(missing_surfaces)}")

          missing_controls = sorted(control_ids - seen)
          if missing_controls:
              start = lines.index("## Cross-cutting control records")
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
              insert_at = end
              while insert_at > start and lines[insert_at - 1] == "":
                  insert_at -= 1
              for rid in missing_controls:
                  lines.insert(insert_at, rows[rid])
                  insert_at += 1
                  seen.add(rid)

          md = "\n".join(lines) + "\n"
          for status, count in status_counts.items():
              md = re.sub(rf"(?m)^- `{re.escape(status)}`: \d+ records$", f"- `{status}`: {count} records", md, count=1)
          md = re.sub(
              r"The following Issues are open at snapshot `[0-9a-f]{40}`",
              f"The following Issues are open at snapshot `{EVIDENCE_SHA}`",
              md,
              count=1,
          )
          inventory = ", ".join(f"#{i}" for i in ledger["open_audit_issues"])
          pattern = r"(?m)^#\d{4}(?:, #\d{4})+$"
          if not re.search(pattern, md):
              raise SystemExit("open audit issue inventory line not found")
          md = re.sub(pattern, inventory, md, count=1)
          if "#1116" in md or "#1139" not in md:
              raise SystemExit("human ledger issue projection is inconsistent")
          if rows["CONTROL-SUPPLY-CHAIN-DR"] not in md:
              raise SystemExit("supply-chain/DR row not projected")
          if rows["CONTROL-BROWSER-HEADERS"] not in md:
              raise SystemExit("browser-headers control row not projected")
          mp.write_text(md, encoding="utf-8")

          if not active.exists() or archive.exists():
              raise SystemExit("task archive transition precondition failed")
          task = active.read_text(encoding="utf-8")
          task = task.replace("phase: finalization", "phase: archive_transition", 1)
          task = task.replace("status: awaiting_exact_head_ci_and_final_audit", "status: complete_on_merge", 1)
          task = task.replace("claim_state: claimed\n", "ownership_release: on_merge\n", 1)
          task += f'''\n\n## Final closeout evidence\n\n```yaml\nvalidated_implementation_head: {EVIDENCE_SHA}\nimplementation_exact_head_ci:\n  freqtrade_ci: 31172539595\n  risk_aware_component_ci: 31172539863\n  codeql: 31172539567\n  zizmor: 31172539813\n  portal_exact_image_supply_chain: 31172539652\nimplementation_gate_result: PASS\nindependent_final_audit: PASS_ZERO_MATERIAL_FINDINGS\nunresolved_review_threads: 0\nledger_reconciliation:\n  issue_1116_removed: true\n  control_supply_chain_dr: PARTIAL\n  remaining_dr_blocker: 1139\nprotected_target_acceptance_inferred: false\nlive_capital_authorized: false\nprotected_production_deployment_authorized: false\nownership_release: on_merge\nfinal_archive_ci: REQUIRED_ON_ARCHIVE_HEAD\n```\n'''
          archive.write_text(task, encoding="utf-8")
          active.unlink()
          PY

          python3 tools/agents/check_portal_completeness_ledger.py
          git diff --check
          test ! -e docs/agents/tasks/active/FTAI-CA-1116-portal-supply-chain.md
          test -e docs/agents/tasks/archive/FTAI-CA-1116-portal-supply-chain.md
          ! grep -q '#1116' docs/ai_platform/portal/FEATURE_COMPLETENESS_LEDGER.md
          grep -q '#1139' docs/ai_platform/portal/FEATURE_COMPLETENESS_LEDGER.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/ai_platform/portal/FEATURE_COMPLETENESS_LEDGER.json \
            docs/ai_platform/portal/FEATURE_COMPLETENESS_LEDGER.md \
            docs/agents/tasks/active/FTAI-CA-1116-portal-supply-chain.md \
            docs/agents/tasks/archive/FTAI-CA-1116-portal-supply-chain.md
          git commit -m "docs(agent): archive FTAI-1116 supply-chain repair"
          git push origin HEAD:refs/heads/repair/1116-portal-supply-chain
