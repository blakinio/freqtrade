name: FTAI 1116 Evidence Scan Fix

on:
  push:
    branches:
      - repair/1116-portal-supply-chain
    paths:
      - ".github/workflows/ftai-1116-evidence-scan-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Make infrastructure-value scanning context aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          policy_path = Path("docs/ai_platform/portal/portal-supply-chain-policy.json")
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          evidence = policy["evidence"]
          old_ip = r"\b(?:10|127|169\.254|172\.(?:1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9.]+\b"
          patterns = evidence["forbidden_value_patterns"]
          if old_ip in patterns:
              patterns.remove(old_ip)
          evidence["contextual_value_patterns"] = [
              {
                  "id": "private-ipv4-endpoint",
                  "path_pattern": r"(?:^|[._-])(?:host|hostname|url|uri|endpoint|address|server|issuer|origin|target|location|dsn|connection)(?:$|[._\[\]-])",
                  "value_pattern": r"\b(?:10(?:\.[0-9]{1,3}){3}|127(?:\.[0-9]{1,3}){3}|169\.254(?:\.[0-9]{1,3}){2}|172\.(?:1[6-9]|2[0-9]|3[01])(?:\.[0-9]{1,3}){2}|192\.168(?:\.[0-9]{1,3}){2})\b",
              }
          ]
          policy_path.write_text(json.dumps(policy, indent=2) + "\n", encoding="utf-8")

          tool_path = Path("tools/agents/portal_supply_chain_policy.py")
          text = tool_path.read_text(encoding="utf-8")
          old_validate = '''def _validate_evidence_policy(evidence: dict[str, Any]) -> None:\n    keys = evidence.get("forbidden_keys")\n    patterns = evidence.get("forbidden_value_patterns")\n    if not isinstance(keys, list) or not all(isinstance(item, str) for item in keys):\n        raise PolicyError("evidence.forbidden_keys must be a string list")\n    if not isinstance(patterns, list) or not all(isinstance(item, str) for item in patterns):\n        raise PolicyError("evidence.forbidden_value_patterns must be a string list")\n    for pattern in patterns:\n        _compile(pattern, "evidence.forbidden_value_patterns")\n'''
          new_validate = '''def _validate_evidence_policy(evidence: dict[str, Any]) -> None:\n    keys = evidence.get("forbidden_keys")\n    patterns = evidence.get("forbidden_value_patterns")\n    contextual = evidence.get("contextual_value_patterns", [])\n    if not isinstance(keys, list) or not all(isinstance(item, str) for item in keys):\n        raise PolicyError("evidence.forbidden_keys must be a string list")\n    if not isinstance(patterns, list) or not all(isinstance(item, str) for item in patterns):\n        raise PolicyError("evidence.forbidden_value_patterns must be a string list")\n    for pattern in patterns:\n        _compile(pattern, "evidence.forbidden_value_patterns")\n    if not isinstance(contextual, list):\n        raise PolicyError("evidence.contextual_value_patterns must be a list")\n    seen_ids: set[str] = set()\n    for index, item in enumerate(contextual):\n        context = f"evidence.contextual_value_patterns[{index}]"\n        if not isinstance(item, dict):\n            raise PolicyError(f"{context} must be an object")\n        required = ("id", "path_pattern", "value_pattern")\n        for field in required:\n            if not isinstance(item.get(field), str) or not item[field].strip():\n                raise PolicyError(f"{context}.{field} must be non-empty")\n        if item["id"] in seen_ids:\n            raise PolicyError(f"duplicate contextual evidence pattern id: {item['id']}")\n        seen_ids.add(item["id"])\n        _compile(item["path_pattern"], f"{context}.path_pattern")\n        _compile(item["value_pattern"], f"{context}.value_pattern")\n'''
          if text.count(old_validate) != 1:
              raise SystemExit("evidence validation block drifted")
          text = text.replace(old_validate, new_validate, 1)

          old_scan = '''    forbidden_keys = {value.casefold() for value in policy["evidence"]["forbidden_keys"]}\n    patterns = [\n        re.compile(value, re.IGNORECASE) for value in policy["evidence"]["forbidden_value_patterns"]\n    ]\n    violations: list[str] = []\n\n    def visit(document: str, value: Any, path: str) -> None:\n        if isinstance(value, dict):\n            for key, item in value.items():\n                child = f"{path}.{key}" if path else str(key)\n                if str(key).casefold() in forbidden_keys:\n                    violations.append(f"{document}:{child}:forbidden-key")\n                visit(document, item, child)\n        elif isinstance(value, list):\n            for index, item in enumerate(value):\n                visit(document, item, f"{path}[{index}]")\n        elif isinstance(value, str):\n            for pattern in patterns:\n                if pattern.search(value):\n                    violations.append(f"{document}:{path}:forbidden-value")\n\n    for document, value in documents:\n        visit(document, value, "")\n    return violations\n'''
          new_scan = '''    evidence = policy["evidence"]\n    forbidden_keys = {value.casefold() for value in evidence["forbidden_keys"]}\n    patterns = [re.compile(value, re.IGNORECASE) for value in evidence["forbidden_value_patterns"]]\n    contextual_patterns = [\n        (\n            str(item["id"]),\n            re.compile(item["path_pattern"], re.IGNORECASE),\n            re.compile(item["value_pattern"], re.IGNORECASE),\n        )\n        for item in evidence.get("contextual_value_patterns", [])\n    ]\n    violations: list[str] = []\n\n    def visit(document: str, value: Any, path: str) -> None:\n        if isinstance(value, dict):\n            for key, item in value.items():\n                child = f"{path}.{key}" if path else str(key)\n                if str(key).casefold() in forbidden_keys:\n                    violations.append(f"{document}:{child}:forbidden-key")\n                visit(document, item, child)\n        elif isinstance(value, list):\n            for index, item in enumerate(value):\n                visit(document, item, f"{path}[{index}]")\n        elif isinstance(value, str):\n            for pattern in patterns:\n                if pattern.search(value):\n                    violations.append(f"{document}:{path}:forbidden-value")\n            for pattern_id, path_pattern, value_pattern in contextual_patterns:\n                if path_pattern.search(path) and value_pattern.search(value):\n                    violations.append(\n                        f"{document}:{path}:forbidden-contextual-value:{pattern_id}"\n                    )\n\n    for document, value in documents:\n        visit(document, value, "")\n    return violations\n'''
          if text.count(old_scan) != 1:
              raise SystemExit("evidence scan block drifted")
          tool_path.write_text(text.replace(old_scan, new_scan, 1), encoding="utf-8")

          test_path = Path("tests/ci/test_portal_supply_chain.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              '            "forbidden_value_patterns": [r"/volume1/", r"192\\.168\\."],\n',
              '            "forbidden_value_patterns": [r"/volume1/"],\n'
              '            "contextual_value_patterns": [\n'
              '                {\n'
              '                    "id": "private-ipv4-endpoint",\n'
              '                    "path_pattern": r"(?:host|url|uri|endpoint|address|server)",\n'
              '                    "value_pattern": r"\\b192\\.168(?:\\.[0-9]{1,3}){2}\\b",\n'
              '                }\n'
              '            ],\n',
              1,
          )
          marker = '''def test_base_images_must_be_digest_pinned(tmp_path: Path) -> None:\n'''
          insertion = '''def test_evidence_scan_rejects_private_ip_in_endpoint_context() -> None:\n    tool = _load_tool()\n    violations = tool.scan_evidence(\n        [("report", {"control_plane_url": "http://192.168.1.10:8000"})],\n        _policy(),\n    )\n    assert violations == [\n        "report:control_plane_url:forbidden-contextual-value:private-ipv4-endpoint"\n    ]\n\n\ndef test_evidence_scan_does_not_treat_package_versions_as_private_endpoints() -> None:\n    tool = _load_tool()\n    document = {\n        "components": [\n            {\n                "bom-ref": "pkg:example/component@10.0.0.1",\n                "version": "10.0.0.1",\n                "cpe": "cpe:2.3:a:example:component:10.0.0.1:*:*:*:*:*:*:*",\n                "purl": "pkg:generic/component@10.0.0.1",\n                "properties": [{"name": "syft:package:release", "value": "10.0.0.1"}],\n            }\n        ]\n    }\n    assert tool.scan_evidence([("sbom", document)], _policy()) == []\n\n\n'''
          if insertion not in tests:
              if marker not in tests:
                  raise SystemExit("test insertion marker drifted")
              tests = tests.replace(marker, insertion + marker, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

          python3 -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.15.20
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ci tests/ci/test_portal_supply_chain.py
          ruff check --fix tools/agents/portal_supply_chain_policy.py tests/ci/test_portal_supply_chain.py
          ruff format tools/agents/portal_supply_chain_policy.py tests/ci/test_portal_supply_chain.py
          ruff check tools/agents/portal_supply_chain_policy.py tests/ci/test_portal_supply_chain.py
          python3 -m py_compile tools/agents/portal_supply_chain_policy.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ftai-1116-evidence-scan-fix.yml
          git add \
            docs/ai_platform/portal/portal-supply-chain-policy.json \
            tools/agents/portal_supply_chain_policy.py \
            tests/ci/test_portal_supply_chain.py
          git commit -m "fix(portal): scope private-endpoint evidence detection"
          git push origin HEAD:refs/heads/repair/1116-portal-supply-chain
