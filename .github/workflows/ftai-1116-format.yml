name: FTAI 1116 Format

on:
  push:
    branches:
      - repair/1116-portal-supply-chain
    paths:
      - ".github/workflows/ftai-1116-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Format focused test with gate Ruff version
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ghcr.io/astral-sh/ruff:0.15.20 \
            format tests/ci/test_portal_supply_chain.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ci/test_portal_supply_chain.py
          git commit -m "style(portal): format supply-chain focused tests"
          git push origin HEAD:refs/heads/repair/1116-portal-supply-chain
