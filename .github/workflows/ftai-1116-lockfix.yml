name: FTAI 1116 Lockfile Fix

on:
  push:
    branches:
      - repair/1116-portal-supply-chain
    paths:
      - ".github/workflows/ftai-1116-lockfix.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: [freqtrade-staging]
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Override vulnerable transitive sharp and regenerate lockfile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("ai_platform/portal/web/package.json")
          package = json.loads(path.read_text(encoding="utf-8"))
          package["overrides"] = {"next": {"sharp": "0.35.3"}}
          path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")
          PY
          docker run --rm \
            -v "$GITHUB_WORKSPACE/ai_platform/portal/web:/app" \
            -w /app \
            node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3 \
            sh -ceu 'npm install --package-lock-only --ignore-scripts && npm ci --ignore-scripts && node -e "const p=require(\"./node_modules/next/node_modules/sharp/package.json\"); if (p.version !== \"0.35.3\") process.exit(2)"'
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/portal/web/package.json ai_platform/portal/web/package-lock.json
          git commit -m "fix(portal): override vulnerable transitive sharp"
          git push origin HEAD:refs/heads/repair/1116-portal-supply-chain
