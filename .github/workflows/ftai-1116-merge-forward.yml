name: FTAI 1116 Merge Forward

on:
  push:
    branches:
      - repair/1116-portal-supply-chain
    paths:
      - ".github/workflows/ftai-1116-merge-forward.yml"

permissions:
  contents: write

jobs:
  merge-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Merge current develop and self-clean
        shell: bash
        run: |
          set -euo pipefail
          branch="repair/1116-portal-supply-chain"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop "$branch"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/$branch)" = "${GITHUB_SHA}"
          git merge --no-commit --no-ff origin/develop
          git rm .github/workflows/ftai-1116-merge-forward.yml
          git diff --check --cached
          git commit -m "chore(portal): merge-forward supply-chain repair"
          git push origin HEAD:"refs/heads/$branch"
