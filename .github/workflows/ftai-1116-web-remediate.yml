name: FTAI 1116 Web Remediation

on:
  push:
    branches:
      - repair/1116-portal-supply-chain
    paths:
      - ".github/workflows/ftai-1116-web-remediate.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Patch runtime and regenerate lockfile
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/agents/ftai_1116_web_remediate.py
          cd ai_platform/portal/web
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          cd ../../..
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/portal/web/package.json ai_platform/portal/web/package-lock.json deploy/synology/portal/Dockerfile
          git commit -m "security(portal): remediate web image dependencies"
          git push origin HEAD:refs/heads/repair/1116-portal-supply-chain
