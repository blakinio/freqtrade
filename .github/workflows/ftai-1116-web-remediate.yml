name: FTAI 1116 Web Remediation

on:
  push:
    branches:
      - repair/1116-portal-supply-chain
    paths:
      - ".github/workflows/ftai-1116-web-remediate.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Update web runtime and lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd ai_platform/portal/web
          npm install sharp@0.35.3 --save-exact --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          cd ../../..
          python3 - <<'PY'
          from pathlib import Path

          path = Path("deploy/synology/portal/Dockerfile")
          text = path.read_text(encoding="utf-8")
          old = "FROM node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3 AS runtime\n\nWORKDIR /app\n"
          new = '''FROM node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3 AS node-security-runtime

ARG NODE_VERSION=22.23.2
ARG NODE_LINUX_X64_SHA256=d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307
RUN apt-get update \\
    && apt-get install -y --no-install-recommends ca-certificates curl xz-utils \\
    && curl --fail --location --proto '=https' --tlsv1.2 \\
        "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \\
        --output /tmp/node.tar.xz \\
    && echo "${NODE_LINUX_X64_SHA256}  /tmp/node.tar.xz" | sha256sum --check --strict \\
    && tar --extract --xz --file /tmp/node.tar.xz --directory /tmp \\
    && install -m 0755 "/tmp/node-v${NODE_VERSION}-linux-x64/bin/node" /usr/local/bin/node \\
    && test "$(node --version)" = "v${NODE_VERSION}" \\
    && rm -rf /tmp/node.tar.xz "/tmp/node-v${NODE_VERSION}-linux-x64" \\
    && rm -rf /var/lib/apt/lists/*

FROM node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3 AS runtime

COPY --from=node-security-runtime /usr/local/bin/node /usr/local/bin/node
RUN rm -rf \\
      /usr/local/lib/node_modules/npm \\
      /usr/local/lib/node_modules/corepack \\
      /usr/local/bin/npm \\
      /usr/local/bin/npx \\
      /usr/local/bin/corepack \\
      /usr/local/bin/yarn \\
      /usr/local/bin/yarnpkg \\
    && test "$(node --version)" = "v22.23.2"

WORKDIR /app
'''
          if old not in text:
              raise SystemExit("expected runtime stage marker not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/portal/web/package.json \
            ai_platform/portal/web/package-lock.json \
            deploy/synology/portal/Dockerfile
          git commit -m "security(portal): remediate web image dependencies"
          git push origin HEAD:refs/heads/repair/1116-portal-supply-chain
