name: FTAI-CI-001 bounded Ruff repair

on:
  push:
    branches:
      - feat/FTAI-CI-001-workflow-lifecycle-20260805
    paths:
      - .github/workflows/ftai-ci-001-ruff-fix.yml

concurrency:
  group: ftai-ci-001-bounded-ruff-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true # bounded branch-only repair helper
      - name: Repair and verify owned workflow catalog module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/ci/workflow_catalog.py")
          text = path.read_text(encoding="utf-8")
          old = "# This module is a bounded GitHub API client; its URL handling is constrained by the configured API base.\n"
          new = (
              "# This module is a bounded GitHub API client.\n"
              "# Its URL handling is constrained by the configured API base.\n"
          )
          if text.count(old) != 1:
              raise SystemExit("expected Ruff repair target was not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check ruff==0.15.20 mypy==2.1.0 PyYAML==6.0.3
          python -m compileall -q tools/ci tests/ci
          mypy --config-file=/dev/null --ignore-missing-imports tools/ci/*.py
          ruff check tools/ci tests/ci
          ruff format --check tools/ci tests/ci
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ci/workflow_catalog.py
          git diff --cached --check
          git commit -m "fix(ci): satisfy workflow catalog Ruff contract"
          git push origin HEAD:${{ github.ref_name }}
