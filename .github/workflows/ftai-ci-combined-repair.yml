name: FTAI bounded combined CI repair

on:
  push:
    branches:
      - fix/ci-core-light-xdist-1265
    paths:
      - .github/workflows/ftai-ci-combined-repair.yml

concurrency:
  group: ftai-bounded-combined-ci-repair
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  combine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true # bounded branch-only helper; self-disables and removes itself
          fetch-depth: 0
      - name: Apply bounded online compatibility contract
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/ci.yml")
          text = workflow.read_text(encoding="utf-8")
          start = text.index("  online-tests:\n")
          end = text.index("\n  build:\n", start)
          block = text[start:end]
          block = block.replace(
              "    runs-on: ubuntu-24.04\n    steps:\n",
              "    runs-on: ubuntu-24.04\n    timeout-minutes: 30\n    steps:\n",
              1,
          )
          block = block.replace(
              "        run: pytest --random-order --longrun --durations 20 -n auto\n",
              "        run: >-\n"
              "          pytest --random-order --longrun --durations 20 -n auto\n"
              "          --timeout=300\n",
              1,
          )
          if "timeout-minutes: 30" not in block or "--timeout=300" not in block:
              raise SystemExit("online compatibility bounds were not applied")
          workflow.write_text(text[:start] + block + text[end:], encoding="utf-8")

          Path("tests/ci/test_online_job_bounds.py").write_text(
              '''from pathlib import Path

import yaml


WORKFLOW_PATH = Path(".github/workflows/ci.yml")


def _workflow_jobs() -> dict:
    workflow = yaml.safe_load(WORKFLOW_PATH.read_text(encoding="utf-8"))
    jobs = workflow.get("jobs")
    assert isinstance(jobs, dict)
    return jobs


def test_online_compatibility_job_is_bounded_and_fail_closed() -> None:
    jobs = _workflow_jobs()
    online_job = jobs["online-tests"]

    assert online_job["timeout-minutes"] == 30
    assert online_job.get("continue-on-error") is not True

    test_step = next(
        step
        for step in online_job["steps"]
        if step.get("name") == "Tests incl. ccxt compatibility tests"
    )
    command = test_step["run"]
    assert "--timeout=300" in command

    ci_gate = jobs["ci-gate"]
    assert "online-tests" in ci_gate["needs"]
    gate_step = next(
        step
        for step in ci_gate["steps"]
        if step.get("name") == "Validate selected and skipped job outcomes"
    )
    assert 'require_success "$ONLINE_SCOPE" "$ONLINE_RESULT"' in gate_step["run"]
''',
              encoding="utf-8",
          )
          PY
      - name: Self-disable bounded helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ftai-ci-combined-repair.yml/disable"
      - name: Remove helper and commit final combined repair
        run: |
          rm .github/workflows/ftai-ci-combined-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/ftai-ci-combined-repair.yml \
            tests/ci/test_online_job_bounds.py
          git commit -m "fix(ci): bound online lane and install xdist"
          git push origin HEAD:${{ github.ref_name }}
