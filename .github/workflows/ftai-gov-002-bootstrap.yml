name: FTAI GOV 002 Bootstrap

on:
  push:
    branches:
      - ci/FTAI-GOV-002-codeql-20260806

concurrency:
  group: ftai-gov-002-bootstrap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'blakinio/freqtrade' && github.ref == 'refs/heads/ci/FTAI-GOV-002-codeql-20260806'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ci/FTAI-GOV-002-codeql-20260806
          fetch-depth: 0

      - name: Register CodeQL and retire bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json; from pathlib import Path; p=Path(".github/workflow-registry.yaml"); r=json.loads(p.read_text(encoding="utf-8")); path=".github/workflows/codeql.yml"; e={"classification":"canonical","lifecycle":"active","name":"CodeQL Security Analysis","owner":"platform-ci","path":path,"permissions":{"contents":"read","packages":"read","security-events":"write"},"review_date":"2027-02-02","risk_class":"low","triggers":["pull_request","push","schedule","workflow_dispatch"]}; r["workflows"]=sorted([x for x in r["workflows"] if x.get("path") != path]+[e], key=lambda x:x["path"]); r["canonical_entry_points"]=sorted(set(r["canonical_entry_points"]+[path])); p.write_text(json.dumps(r, indent=2)+"\n", encoding="utf-8")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ftai-gov-002-bootstrap.yml
          git add .github/workflow-registry.yaml
          git commit -m "ci(security): register explicit CodeQL analysis"
          git push origin HEAD:ci/FTAI-GOV-002-codeql-20260806
