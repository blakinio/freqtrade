name: FTAI PR 1271 bounded branch update

on:
  push:
    branches:
      - fix/ci-core-light-xdist-1265
    paths:
      - .github/workflows/ftai-pr1271-update-branch.yml

concurrency:
  group: ftai-pr1271-bounded-branch-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Update PR branch through GitHub server-side merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"expected_head_sha\":\"${EXPECTED_HEAD_SHA}\"}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/1271/update-branch"
