name: Inspect Binance Acceptance Core Failure

on:
  pull_request:
    types: [opened]
    paths:
      - ".github/workflows/inspect-binance-acceptance-core-failure-90284150778.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract exact failed-test diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_JOB_ID: "90284150778"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$TARGET_JOB_ID/logs" \
            --output full.log
          python - <<'PY'
          from pathlib import Path

          lines = Path("full.log").read_text(encoding="utf-8", errors="replace").splitlines()
          markers = (
              " FAILURES ",
              " short test summary info ",
              "FAILED ",
              "ERROR ",
              "E   ",
              "Traceback",
          )
          selected = []
          for index, line in enumerate(lines):
              if any(marker in line for marker in markers):
                  start = max(0, index - 8)
                  end = min(len(lines), index + 20)
                  selected.extend(lines[start:end])
          if not selected:
              selected = lines[-250:]
          deduplicated = []
          previous = None
          for line in selected:
              if line != previous:
                  deduplicated.append(line)
              previous = line
          Path("failure.txt").write_text("\n".join(deduplicated[-1000:]) + "\n", encoding="utf-8")
          PY
      - name: Upload exact failure excerpt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binance-acceptance-core-failure-90284150778
          path: failure.txt
          if-no-files-found: error
          retention-days: 1
