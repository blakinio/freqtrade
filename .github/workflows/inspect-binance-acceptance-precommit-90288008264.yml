name: Apply Binance Acceptance Typed Summary Fix

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/inspect-binance-acceptance-precommit-90288008264.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_BRANCH: feat/binance-spot-instrument-shadow-acceptance-v1
      EXPECTED_HEAD: ec569a0521fc46e382fa5c41cda9bb64d22a00f9
      PATCH_COMMIT: e2f371fa24542b370b15080465d4be1a42208820
      WORKFLOW_PATH: .github/workflows/inspect-binance-acceptance-precommit-90288008264.yml
    steps:
      - name: Verify exact remote target head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          actual="$(git ls-remote "$remote" "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          [[ "$actual" == "$EXPECTED_HEAD" ]]

      - name: Checkout exact target head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Apply previously verified guarded transformation
        run: |
          set -euo pipefail
          git fetch origin "$PATCH_COMMIT" --depth=1
          git show "$PATCH_COMMIT:$WORKFLOW_PATH" > /tmp/guarded-apply.yml
          python - <<'PY'
          from pathlib import Path

          workflow = Path("/tmp/guarded-apply.yml").read_text(encoding="utf-8")
          opening = "          python - <<'PY'\n"
          closing = "\n          PY"
          if workflow.count(opening) != 1:
              raise SystemExit("guarded transformation block was not found exactly once")
          block = workflow.split(opening, 1)[1].split(closing, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(script, "guarded-binance-acceptance-transform", "exec"))
          PY

      - name: Validate exact static repair
        run: |
          set -euo pipefail
          python -m pip install --quiet \
            "ruff==0.15.21" \
            "mypy==2.3.0" \
            "SQLAlchemy==2.0.46"
          file=ai_platform/market_data/binance_spot_instrument_acceptance.py
          ruff check --fix "$file"
          ruff format "$file"
          ruff check "$file"
          ruff format --check "$file"
          mypy "$file"
          [[ "$(git diff --name-only)" == "$file" ]]

      - name: Commit and fast-forward exact target branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          actual="$(git ls-remote "$remote" "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          [[ "$actual" == "$EXPECTED_HEAD" ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/market_data/binance_spot_instrument_acceptance.py
          git commit -m "fix(ai-platform): validate Binance acceptance summary types"
          git push "$remote" "HEAD:refs/heads/${TARGET_BRANCH}"
