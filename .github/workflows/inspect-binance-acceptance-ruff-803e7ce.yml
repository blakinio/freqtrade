name: Apply Binance Acceptance Ruff 803e7ce

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/inspect-binance-acceptance-ruff-803e7ce.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: feat/binance-spot-instrument-shadow-acceptance-v1
      EXPECTED_HEAD: 803e7ce021022bba7de08a66502da393098dfdd8
    steps:
      - name: Verify exact remote target head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          actual="$(git ls-remote "$remote" "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          [[ "$actual" == "$EXPECTED_HEAD" ]]

      - name: Checkout exact target head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Apply exact Ruff diagnostics and formatting
        run: |
          set -euo pipefail
          python -m pip install --quiet "ruff==0.15.21"
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/market_data/binance_spot_instrument_acceptance.py")
          text = path.read_text(encoding="utf-8")
          old = "def validate_request(\n"
          new = "def validate_request(  # noqa: C901\n"
          if text.count(old) != 1:
              raise SystemExit("validate_request signature guard failed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          files=(
            ai_platform/market_data/binance_spot_instrument_acceptance.py
            tests/ai_platform_integration/test_market_data_binance_spot_instrument_acceptance.py
          )
          ruff check --fix --unsafe-fixes "${files[@]}"
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
          expected=$'ai_platform/market_data/binance_spot_instrument_acceptance.py\ntests/ai_platform_integration/test_market_data_binance_spot_instrument_acceptance.py'
          actual="$(git diff --name-only | sort)"
          [[ "$actual" == "$expected" ]]

      - name: Commit and fast-forward exact target branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          actual="$(git ls-remote "$remote" "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          [[ "$actual" == "$EXPECTED_HEAD" ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/market_data/binance_spot_instrument_acceptance.py \
            tests/ai_platform_integration/test_market_data_binance_spot_instrument_acceptance.py
          git commit -m "style(ai-platform): apply Binance acceptance Ruff fixes"
          git push "$remote" "HEAD:refs/heads/${TARGET_BRANCH}"
