name: Inspect Binance Smoke Job 90229653635

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/inspect-binance-smoke-job-90229653635.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print exact smoke failure lines
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_JOB_ID: "90229653635"
        run: |
          set -euo pipefail
          log="$(mktemp)"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$TARGET_JOB_ID/logs" \
            --output "$log"
          grep -nE \
            'HTTP Error|HTTP [0-9]{3}|status code|Traceback|Exception|URLError|urlopen|SSL|TLS|timed out|timeout|Content-Type|content-type|schema|JSON|json|error:|Error:|ERROR|failed|Failure|Process completed with exit code' \
            "$log" | tail -n 80
