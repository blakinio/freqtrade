name: Liquid20 acceptance validation

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/liquid20-acceptance-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/liquid20-multi-source-acceptance-v1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: |
          python -m pip install -q \
            "pytest==9.0.2" \
            "pytest-xdist>=3.8,<4" \
            "ruff==0.16.0" \
            "websockets>=15,<17"
      - name: Compile
        run: |
          python -m compileall -q \
            ai_platform/research/liquidations/multi_source_acceptance.py \
            ai_platform/scripts/liquidation_multi_source_runner.py \
            ai_platform/scripts/liquidation_multi_source_evaluator.py
      - name: Focused tests
        run: |
          pytest -q \
            --confcutdir=tests/ai_platform_integration \
            tests/ai_platform_integration/test_liquidation_multi_source_acceptance.py \
            tests/ai_platform_integration/test_liquidation_symbol_universe.py
      - name: Ruff check
        run: |
          ruff check \
            ai_platform/research/liquidations/multi_source_acceptance.py \
            ai_platform/scripts/liquidation_multi_source_runner.py \
            ai_platform/scripts/liquidation_multi_source_evaluator.py \
            tests/ai_platform_integration/test_liquidation_multi_source_acceptance.py \
            tests/ai_platform_integration/test_liquidation_symbol_universe.py
      - name: Ruff format
        run: |
          ruff format --check \
            ai_platform/research/liquidations/multi_source_acceptance.py \
            ai_platform/scripts/liquidation_multi_source_runner.py \
            ai_platform/scripts/liquidation_multi_source_evaluator.py \
            tests/ai_platform_integration/test_liquidation_multi_source_acceptance.py \
            tests/ai_platform_integration/test_liquidation_symbol_universe.py
      - name: Checkpoint
        run: |
          python tools/agents/checkpoint.py \
            docs/agents/tasks/FTAI-20260724-liquid20-multi-source-acceptance-v1.md \
            --require-checkpoint
