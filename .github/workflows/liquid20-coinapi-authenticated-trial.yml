name: Liquid20 CoinAPI Authenticated Trial

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquid20-coinapi-authenticated-trial.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COINAPI_KEY: ${{ secrets.COINAPI_KEY }}
    steps:
      - name: Identify exact CoinAPI quota blocker
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output /tmp/coinapi-error.json \
            --write-out '%{http_code}' \
            --header "X-CoinAPI-Key: $COINAPI_KEY" \
            'https://rest.coinapi.io/v1/metrics/symbol/listing?symbol_id=BYBIT_PERP_BTC_USDT')"
          echo "COINAPI_HTTP_STATUS=$status"
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/coinapi-error.json').read_text())
          allowed = (
              'QuotaKey',
              'QuotaName',
              'QuotaType',
              'QuotaValue',
              'QuotaValueAdjustable',
              'QuotaValueCurrentUsage',
              'QuotaValueUnit',
              'status',
              'title',
          )
          summary = {key: payload.get(key) for key in allowed if key in payload}
          print('COINAPI_QUOTA_SUMMARY=' + json.dumps(summary, sort_keys=True))
          PY
