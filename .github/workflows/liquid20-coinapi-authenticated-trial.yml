name: Liquid20 CoinAPI Authenticated Trial

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquid20-coinapi-authenticated-trial.yml
      - .github/scripts/liquid20_coinapi_authenticated_trial.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COINAPI_KEY: ${{ secrets.COINAPI_KEY }}
    steps:
      - name: Probe exact CoinAPI liquidation coverage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/blakinio/freqtrade/070d31efb84c309781f21786d22532c7bca8fd7b/.github/scripts/liquid20_coinapi_authenticated_trial.py \
            --output /tmp/liquid20_coinapi_authenticated_trial.py
          python /tmp/liquid20_coinapi_authenticated_trial.py
