name: Liquid20 CoinAPI Authenticated Trial

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquid20-coinapi-authenticated-trial.yml
      - .github/scripts/liquid20_coinapi_authenticated_trial.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COINAPI_KEY: ${{ secrets.COINAPI_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Probe exact CoinAPI liquidation coverage
        run: python .github/scripts/liquid20_coinapi_authenticated_trial.py
