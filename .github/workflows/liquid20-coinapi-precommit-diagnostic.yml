name: Liquid20 CoinAPI Pre-commit Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquid20-coinapi-precommit-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Show exact formatter patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          curl --fail --silent --show-error --location \
            https://api.github.com/repos/blakinio/freqtrade/tarball/c0469091c1dd9f283df58650c7251869b542963f \
            | tar --extract --gzip --strip-components=1 --directory=source
          (
            cd source
            git init --quiet
            git config user.name ci
            git config user.email ci@example.invalid
            git add --all
            git commit --quiet --message snapshot
          )
          python -m pip install --quiet pre-commit
          set +e
          (
            cd source
            pre-commit run ruff-format --all-files
          ) > /tmp/precommit.log 2>&1
          rc=$?
          set -e
          cat /tmp/precommit.log
          (
            cd source
            git diff -- tests/ai_platform_integration/test_liquidation_historical_coinapi_authenticated_trial.py
          )
          exit "$rc"
