name: Liquid20 H0 Precommit Tail

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquid20-h0-precommit-tail.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run full pre-commit and show compact result
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/blakinio/freqtrade/archive/a4c29686e5376eb8197dba39cb87c46cb676bf16.tar.gz \
            -o /tmp/source.tar.gz
          mkdir /tmp/source
          tar -xzf /tmp/source.tar.gz --strip-components=1 -C /tmp/source
          cd /tmp/source
          git init --quiet
          git add --all
          python -m pip install --disable-pip-version-check --quiet pre-commit
          if ! pre-commit run --all-files > /tmp/precommit.log 2>&1; then
            tail -n 45 /tmp/precommit.log
            exit 1
          fi
          tail -n 30 /tmp/precommit.log
