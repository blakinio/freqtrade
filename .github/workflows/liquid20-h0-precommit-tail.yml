name: Liquid20 H0 Precommit Tail

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquid20-h0-precommit-tail.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Show exact repository Ruff patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/blakinio/freqtrade/archive/a4c29686e5376eb8197dba39cb87c46cb676bf16.tar.gz \
            -o /tmp/source.tar.gz
          mkdir /tmp/source
          tar -xzf /tmp/source.tar.gz --strip-components=1 -C /tmp/source
          cd /tmp/source
          target=tests/ai_platform_integration/test_liquidation_historical_provider_preflight.py
          cp "$target" /tmp/before.py
          python -m pip install --disable-pip-version-check --quiet ruff==0.15.21
          ruff check --fix "$target"
          ruff format "$target"
          diff -u /tmp/before.py "$target" || true
