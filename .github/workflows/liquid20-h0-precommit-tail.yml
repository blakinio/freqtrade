name: Liquid20 H0 Precommit Tail

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquid20-h0-precommit-tail.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Show exact Ruff patch
        shell: bash
        run: |
          set -euo pipefail
          target=/tmp/test_liquidation_historical_provider_preflight.py
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/blakinio/freqtrade/a4c29686e5376eb8197dba39cb87c46cb676bf16/tests/ai_platform_integration/test_liquidation_historical_provider_preflight.py \
            -o "$target"
          cp "$target" /tmp/before.py
          python -m pip install --disable-pip-version-check --quiet ruff==0.15.21
          ruff check --fix "$target"
          ruff format "$target"
          diff -u /tmp/before.py "$target" || true
