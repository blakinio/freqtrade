name: Liquid20 H0 Public Sample Preflight

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquid20-h0-public-sample-preflight.yml

permissions:
  contents: read

jobs:
  inspect-public-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and inspect public metadata and samples
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            https://raw.githubusercontent.com/blakinio/freqtrade/c996cf18fe2e5eaa1babd83ee7ff6b18efb76f7e/.github/scripts/liquid20_h0_public_sample_preflight.py \
            -o /tmp/liquid20_h0_public_sample_preflight.py
          python /tmp/liquid20_h0_public_sample_preflight.py
