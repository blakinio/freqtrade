name: Liquid20 H0 Public Sample Preflight

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquid20-h0-public-sample-preflight.yml
      - .github/scripts/liquid20_h0_public_sample_preflight.py

permissions:
  contents: read

jobs:
  inspect-public-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download and inspect public metadata and samples
        shell: bash
        run: python .github/scripts/liquid20_h0_public_sample_preflight.py
