name: Liquid20 H1 Format Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquid20-h1-format-diagnostic.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Apply exact Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet ruff==0.15.21
          ruff format \
            ai_platform/research/liquidations/historical \
            tests/ai_platform_integration/test_liquidation_history_contracts.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ai_platform/research/liquidations/historical \
            tests/ai_platform_integration/test_liquidation_history_contracts.py
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit --message "style(ai-platform): format Liquid20 H1 contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
