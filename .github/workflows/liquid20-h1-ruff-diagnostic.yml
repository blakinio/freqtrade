name: Liquid20 H1 Ruff Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquid20-h1-ruff-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run focused Ruff diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          curl --fail --silent --show-error --location \
            https://api.github.com/repos/blakinio/freqtrade/tarball/4fec76fe2aa5eb62acad58945f6cca11755b98d4 \
            | tar --extract --gzip --strip-components=1 --directory=source
          python -m pip install --quiet ruff==0.15.21
          set +e
          ruff check \
            source/ai_platform/research/liquidations/historical \
            source/tests/ai_platform_integration/test_liquidation_history_contracts.py
          check_rc=$?
          ruff format --check --diff \
            source/ai_platform/research/liquidations/historical \
            source/tests/ai_platform_integration/test_liquidation_history_contracts.py
          format_rc=$?
          set -e
          if [ "$check_rc" -ne 0 ] || [ "$format_rc" -ne 0 ]; then
            exit 1
          fi
