name: Liquid20 H2 Public Samples

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquid20-h2-public-samples.yml
      - ai_platform/research/liquidations/historical/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Validate frozen public samples
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import tempfile
          import urllib.request
          from pathlib import Path

          from ai_platform.research.liquidations.historical.manifests import RawFileDescriptor
          from ai_platform.research.liquidations.historical.providers.base import ProviderParseContext
          from ai_platform.research.liquidations.historical.providers.tardis import TardisLiquidationsAdapter
          from ai_platform.research.liquidations.historical.semantic_eras import DEFAULT_SEMANTIC_ERAS

          samples = (
              (
                  "bybit",
                  "BTCUSDT",
                  2092,
                  "7fae926819808b32cd08c7d55b8a875a3aec13d28c63cfcdab42971523371e1f",
              ),
              (
                  "bybit",
                  "ETHUSDT",
                  1283,
                  "ef25b4b786a03b82007e65bc3a87bea15304519646cf756b83fcb4885e04c861",
              ),
              (
                  "binance-futures",
                  "BTCUSDT",
                  1082,
                  "59c546d4d65ae682b50697ac63715970b1974a72190b3c4827e8358915b381ba",
              ),
              (
                  "binance-futures",
                  "ETHUSDT",
                  1128,
                  "f89832b8c7d0c59eb687f957e3b74e72de16cb0b623ee9756f9b6b0250f1b79a",
              ),
          )
          adapter = TardisLiquidationsAdapter()
          summaries = []
          with tempfile.TemporaryDirectory(prefix="liquid20-h2-public-") as temporary:
              root = Path(temporary)
              for exchange, symbol, expected_rows, expected_sha in samples:
                  url = (
                      f"https://datasets.tardis.dev/v1/{exchange}/liquidations/"
                      f"2025/03/01/{symbol}.csv.gz"
                  )
                  path = root / f"{exchange}-{symbol}.csv.gz"
                  with urllib.request.urlopen(url, timeout=60) as response:
                      path.write_bytes(response.read())
                  actual_sha = hashlib.sha256(path.read_bytes()).hexdigest()
                  if actual_sha != expected_sha:
                      raise AssertionError(
                          f"frozen hash mismatch for {exchange}/{symbol}: {actual_sha}"
                      )
                  descriptor = RawFileDescriptor(
                      relative_path=path.name,
                      sha256=actual_sha,
                      size_bytes=path.stat().st_size,
                      provider_id="tardis",
                      provider_exchange=exchange,
                      symbol=symbol,
                      requested_date="2025-03-01",
                      content_encoding="gzip",
                      parser_hint="liquidations-csv-v1",
                  )
                  result = adapter.parse_file(
                      path,
                      context=ProviderParseContext(
                          import_run_id="liquid20-h2-public-samples",
                          raw_file=descriptor,
                          semantic_eras=DEFAULT_SEMANTIC_ERAS,
                      ),
                  )
                  if result.rejections:
                      raise AssertionError(
                          f"parser rejections for {exchange}/{symbol}: {len(result.rejections)}"
                      )
                  if len(result.events) != expected_rows:
                      raise AssertionError(
                          f"row count mismatch for {exchange}/{symbol}: {len(result.events)}"
                      )
                  if any(event.availability_latency_ms < 0 for event in result.events):
                      raise AssertionError(
                          f"negative provider latency for {exchange}/{symbol}"
                      )
                  summaries.append(
                      {
                          "exchange": exchange,
                          "symbol": symbol,
                          "sha256": actual_sha,
                          "records": len(result.events),
                          "rejections": 0,
                      }
                  )
          print("LIQUID20_H2_PUBLIC_SAMPLES=" + json.dumps(summaries, sort_keys=True))
          PY
