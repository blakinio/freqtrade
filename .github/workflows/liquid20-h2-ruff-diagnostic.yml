name: Liquid20 H2 Ruff Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquid20-h2-ruff-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Show non-fixable Ruff failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          curl --fail --silent --show-error --location \
            https://api.github.com/repos/blakinio/freqtrade/tarball/fc3c258a15d9376ddac9dfc4a98c6b919275a5b1 \
            | tar --extract --gzip --strip-components=1 --directory=source
          python -m pip install --quiet ruff==0.15.21
          ruff check \
            source/ai_platform/research/liquidations/historical \
            source/tests/ai_platform_integration/test_liquidation_history_tardis_importer.py
