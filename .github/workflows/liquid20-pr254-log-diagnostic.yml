name: Liquid20 prior CI diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/liquid20-pr254-log-diagnostic.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Extract prior first-failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/blakinio/freqtrade/actions/jobs/89469318418/logs > job.log
          python - <<'PY'
          from pathlib import Path

          lines = Path("job.log").read_text(encoding="utf-8", errors="replace").splitlines()
          markers = (
              "FAILED ",
              "ERROR ",
              "short test summary info",
              "test_liquidation_symbol_universe",
              "Traceback (most recent call last)",
          )
          selected: set[int] = set()
          for index, line in enumerate(lines):
              if any(marker in line for marker in markers):
                  selected.update(range(max(0, index - 3), min(len(lines), index + 12)))
          if not selected:
              raise SystemExit("no failure markers found in prior job log")
          print("PR254_CORE_FAILURE_BEGIN")
          for index in sorted(selected):
              print(lines[index])
          print("PR254_CORE_FAILURE_END")
          PY
