name: Liquid20 acceptance Ruff autofix

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/liquid20-ruff-autofix.yml"

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/liquid20-multi-source-acceptance-v1
          persist-credentials: true
      - name: Apply exact findings
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          acceptance = Path("ai_platform/research/liquidations/multi_source_acceptance.py")
          text = acceptance.read_text(encoding="utf-8")
          text = text.replace(
              '    if not parsed == parsed or parsed in (float("inf"), float("-inf")):\n',
              '    if parsed != parsed or parsed in (float("inf"), float("-inf")):  # noqa: PLR0124\n',
          )
          text = text.replace(
              '        or bool(run_id)\n        and run_id not in {"unknown", "unspecified"},\n',
              '        or (bool(run_id) and run_id not in {"unknown", "unspecified"}),\n',
          )
          text = text.replace(
              '        or bool(host_id)\n        and host_id not in {"unknown", "unspecified"},\n',
              '        or (bool(host_id) and host_id not in {"unknown", "unspecified"}),\n',
          )
          acceptance.write_text(text, encoding="utf-8")

          runner = Path("ai_platform/scripts/liquidation_multi_source_runner.py")
          text = runner.read_text(encoding="utf-8")
          text = text.replace(
              "    normalization_result: None | BaseException,\n",
              "    normalization_result: BaseException | None,\n",
          )
          runner.write_text(text, encoding="utf-8")
          PY
          python -m pip install -q "ruff==0.16.0"
          ruff check \
            ai_platform/research/liquidations/multi_source_acceptance.py \
            ai_platform/scripts/liquidation_multi_source_runner.py \
            ai_platform/scripts/liquidation_multi_source_evaluator.py \
            tests/ai_platform_integration/test_liquidation_multi_source_acceptance.py \
            tests/ai_platform_integration/test_liquidation_symbol_universe.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/research/liquidations/multi_source_acceptance.py \
            ai_platform/scripts/liquidation_multi_source_runner.py
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "style(ai-platform): satisfy liquid20 Ruff checks"
          git push origin HEAD:feat/liquid20-multi-source-acceptance-v1
