name: Liquid20 final Ruff diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/liquid20-ruff-full-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print repository-scope Ruff findings
        run: |
          set -euo pipefail
          git clone -q --depth 1 \
            --branch feat/liquid20-multi-source-acceptance-v1 \
            https://github.com/blakinio/freqtrade.git repo
          cd repo
          python -m pip install -q "ruff==0.16.0"
          ruff check --output-format concise ai_platform tests/ai_platform_integration
