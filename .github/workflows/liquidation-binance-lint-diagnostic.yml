name: Binance liquidation lint diagnostic

on:
  push:
    branches:
      - feat/liquidation-binance-source-v1
    paths:
      - ".github/workflows/liquidation-binance-lint-diagnostic.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/liquidation-binance-source-v1
      - name: Apply exact Ruff findings
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          collector = Path("ai_platform/scripts/liquidation_binance_collector.py")
          text = collector.read_text(encoding="utf-8")
          text = text.replace("from typing import Any\n\n", "")
          text = text.replace(
              "        request = urllib.request.Request(\n",
              "        request = urllib.request.Request(  # noqa: S310\n",
          )
          collector.write_text(text, encoding="utf-8")

          tests = Path("tests/ai_platform_integration/test_liquidation_binance_source.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace('Decimal("70000")', "Decimal(70000)")
          text = text.replace('Decimal("68000")', "Decimal(68000)")
          tests.write_text(text, encoding="utf-8")
          PY
          python -m pip install -q "ruff==0.16.0"
          ruff check \
            ai_platform/research/liquidations/binance.py \
            ai_platform/scripts/liquidation_binance_collector.py \
            tests/ai_platform_integration/test_liquidation_binance_source.py
          ruff format \
            ai_platform/research/liquidations/binance.py \
            ai_platform/scripts/liquidation_binance_collector.py \
            tests/ai_platform_integration/test_liquidation_binance_source.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/research/liquidations/binance.py \
            ai_platform/scripts/liquidation_binance_collector.py \
            tests/ai_platform_integration/test_liquidation_binance_source.py
          git commit -m "style(ai-platform): satisfy Binance source lint"
          git push origin HEAD:feat/liquidation-binance-source-v1
