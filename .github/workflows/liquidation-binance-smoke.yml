name: Binance liquidation public smoke

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/liquidation-binance-smoke.yml"

permissions:
  contents: read

jobs:
  clock-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Diagnose public Binance server-time probe
        run: |
          set -euo pipefail
          git clone -q --depth 1 \
            --branch feat/liquidation-binance-source-v1 \
            https://github.com/blakinio/freqtrade.git repo
          cd repo
          PYTHONPATH=. python - <<'PY'
          import json

          from ai_platform.scripts.liquidation_binance_collector import probe_binance_clock

          result = probe_binance_clock()
          print("BINANCE_CLOCK=" + json.dumps(result.as_json_dict(), sort_keys=True))
          raise SystemExit(0 if result.synchronized is True else 1)
          PY
