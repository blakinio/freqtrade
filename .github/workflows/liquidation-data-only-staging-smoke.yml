name: Liquidation data-only staging smoke

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/liquidation-data-only-staging-smoke.yml"

permissions:
  contents: read

jobs:
  public-clock-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Diagnose public Bybit server-time probe
        run: |
          set -euo pipefail
          git clone -q --depth 1 \
            --branch feat/liquidation-data-only-staging-v1 \
            https://github.com/blakinio/freqtrade.git repo
          cd repo
          PYTHONPATH=. python - <<'PY'
          import json

          from ai_platform.research.liquidations.staging import probe_bybit_clock

          result = probe_bybit_clock()
          print("CLOCK_PROBE=" + json.dumps(result.as_json_dict(), sort_keys=True))
          raise SystemExit(0 if result.synchronized is True else 1)
          PY
