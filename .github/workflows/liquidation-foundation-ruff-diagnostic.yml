name: Liquidation foundation Ruff diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - "ai_platform/research/liquidations/**"
      - "ai_platform/scripts/liquidation_collector.py"
      - "tests/ai_platform_integration/test_liquidation_research_foundation.py"
      - ".github/workflows/liquidation-foundation-ruff-diagnostic.yml"

permissions:
  contents: read

jobs:
  ruff-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print exact Ruff diagnostics
        run: |
          git clone -q --depth 1 \
            --branch feat/liquidation-reversal-foundation-v1 \
            https://github.com/blakinio/freqtrade.git repo
          cd repo
          python -m pip install -q "ruff==0.16.0"
          ruff check \
            ai_platform/research/liquidations \
            ai_platform/scripts/liquidation_collector.py \
            tests/ai_platform_integration/test_liquidation_research_foundation.py
