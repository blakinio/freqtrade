name: Liquidation symbol lint diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/liquidation-symbol-lint-diagnostic.yml"

permissions:
  contents: read

jobs:
  lint-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print exact Ruff findings
        run: |
          set -euo pipefail
          git clone -q --depth 1 \
            --branch feat/liquidation-symbol-universe-v1 \
            https://github.com/blakinio/freqtrade.git repo
          cd repo
          python -m pip install -q "ruff==0.16.0"
          ruff check --output-format concise \
            ai_platform/research/liquidations/symbol_universe.py \
            ai_platform/scripts/liquidation_multi_source_runner.py \
            tests/ai_platform_integration/test_liquidation_symbol_universe.py
