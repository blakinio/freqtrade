name: Liquidations Live Codespell Repair

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquidations-live-codespell-diagnostic.yml

permissions: {}

jobs:
  repair:
    name: Repair codespell finding
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"
      - name: Repair and validate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/portal/web/components/liquidations-live-dashboard.tsx")
          text = path.read_text(encoding="utf-8")
          old = '<p>Symbole: {sourceHealth?.observed_symbols ?? 0}</p>'
          new = '<p>Liczba symboli: {sourceHealth?.observed_symbols ?? 0}</p>'
          if old not in text:
              raise SystemExit("codespell repair anchor missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check codespell==2.4.2 tomli
          codespell ai_platform tests/ai_platform_integration/test_liquidation_live_stream.py tests/ai_platform_integration/test_synology_liquid20_live_deployment.py
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/portal/web/components/liquidations-live-dashboard.tsx
          git commit -m "fix(portal): avoid codespell false positive"
          git push origin "HEAD:${{ github.head_ref }}"
