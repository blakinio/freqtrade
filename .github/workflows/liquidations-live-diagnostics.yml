name: Liquidations Live Repair

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquidations-live-diagnostics.yml

permissions: {}

jobs:
  repair:
    name: Apply verified lint and type repairs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ai_platform/portal/web/package-lock.json

      - name: Apply exact repairs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          collector = Path("ai_platform/scripts/liquidation_live_stream.py")
          text = collector.read_text(encoding="utf-8")
          replacements = {
              "from collections.abc import Callable, Mapping, Sequence": "from collections.abc import Callable, Sequence",
              "from ai_platform.scripts.liquidation_binance_collector import trading_credentials_present\n\nLIVE_CONTRACT": "from ai_platform.scripts.liquidation_binance_collector import trading_credentials_present\n\n\nLIVE_CONTRACT",
              '    request = urllib.request.Request(url, headers={"User-Agent": "freqtrade-liquidations-live/1"})': '    request = urllib.request.Request(  # noqa: S310\n        url,\n        headers={"User-Agent": "freqtrade-liquidations-live/1"},\n    )',
              "async def run_bybit_source(\n": "async def run_bybit_source(  # noqa: C901\n",
              "    bybit_discovery = lambda: discover_bybit_symbols(maximum_symbols=maximum_symbols)\n    binance_discovery = lambda: discover_binance_symbols(maximum_symbols=maximum_symbols)": "    def bybit_discovery() -> tuple[str, ...]:\n        return discover_bybit_symbols(maximum_symbols=maximum_symbols)\n\n    def binance_discovery() -> tuple[str, ...]:\n        return discover_binance_symbols(maximum_symbols=maximum_symbols)",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing collector repair anchor: {old[:80]}")
              text = text.replace(old, new, 1)
          collector.write_text(text, encoding="utf-8")

          deployment_test = Path(
              "tests/ai_platform_integration/test_synology_liquid20_live_deployment.py"
          )
          text = deployment_test.read_text(encoding="utf-8")
          text = text.replace(
              '    assert "--restart \\\"$restart_policy\\\"" in script',
              "    assert '--restart \"$restart_policy\"' in script",
          ).replace(
              '    assert "--user \\\"${puid}:${pgid}\\\"" in script',
              "    assert '--user \"${puid}:${pgid}\"' in script",
          )
          deployment_test.write_text(text, encoding="utf-8")

          portal_test = Path("ai_platform/portal/web/e2e/liquidation-live-read-model.spec.ts")
          text = portal_test.read_text(encoding="utf-8")
          replacements = {
              "    advanced.state.last_event_at_ms = firstEvent;": "    advanced.state.last_event_at_ms = firstEvent ?? now;",
              "    advanced.state.last_event_received_at_ms = first.last_event_received_at_ms ?? null;": "    advanced.state.last_event_received_at_ms =\n      first.last_event_received_at_ms ?? now;",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing portal repair anchor: {old}")
              text = text.replace(old, new, 1)
          portal_test.write_text(text, encoding="utf-8")
          PY

      - name: Validate repaired source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.21
          ruff check ai_platform tests/ai_platform_integration/test_liquidation_live_stream.py tests/ai_platform_integration/test_synology_liquid20_live_deployment.py
          ruff format --check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_stream.py tests/ai_platform_integration/test_synology_liquid20_live_deployment.py
          npm --prefix ai_platform/portal/web ci
          npm --prefix ai_platform/portal/web run typecheck

      - name: Commit repaired source and remove one-time workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/liquidations-live-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/scripts/liquidation_live_stream.py \
            ai_platform/portal/web/e2e/liquidation-live-read-model.spec.ts \
            tests/ai_platform_integration/test_synology_liquid20_live_deployment.py
          git commit -m "fix(liquidations): satisfy lint and portal types"
          git push origin "HEAD:${{ github.head_ref }}"
