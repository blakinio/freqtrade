name: Liquidations Live Repair

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquidations-live-diagnostics.yml

permissions: {}

jobs:
  repair:
    name: Apply final Ruff repairs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"

      - name: Apply and validate exact Ruff repairs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/scripts/liquidation_live_stream.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "    request = urllib.request.Request(\n",
              "    request = urllib.request.Request(  # noqa: S310\n",
              1,
          )
          text = text.replace(
              "async def run_bybit_source(\n",
              "async def run_bybit_source(  # noqa: C901\n",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check ruff==0.15.21
          ruff check --fix ai_platform/scripts/liquidation_live_stream.py \
            tests/ai_platform_integration/test_liquidation_live_stream.py \
            tests/ai_platform_integration/test_synology_liquid20_live_deployment.py
          ruff format ai_platform/scripts/liquidation_live_stream.py \
            tests/ai_platform_integration/test_liquidation_live_stream.py \
            tests/ai_platform_integration/test_synology_liquid20_live_deployment.py
          ruff check ai_platform tests/ai_platform_integration/test_liquidation_live_stream.py \
            tests/ai_platform_integration/test_synology_liquid20_live_deployment.py
          ruff format --check ai_platform/scripts/liquidation_live_stream.py \
            tests/ai_platform_integration/test_liquidation_live_stream.py \
            tests/ai_platform_integration/test_synology_liquid20_live_deployment.py

      - name: Commit repaired source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/scripts/liquidation_live_stream.py \
            tests/ai_platform_integration/test_liquidation_live_stream.py \
            tests/ai_platform_integration/test_synology_liquid20_live_deployment.py
          git commit -m "fix(liquidations): satisfy final Ruff checks"
          git push origin "HEAD:${{ github.head_ref }}"
