name: Liquidations Live Health

"on":
  push:
    branches:
      - develop
    paths:
      - .github/workflows/liquidations-live-operational-health.yml
      - ai_platform/scripts/liquidation_live_health.py
      - ai_platform/scripts/liquidation_operational_health.py
      - ai_platform/scripts/liquidation_portal_health.py
      - deploy/synology/liquid20/LIVE_STREAM.md
      - deploy/synology/portal/probe-liquidations-live-operational.sh
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: liquidations-live-health
  cancel-in-progress: true

jobs:
  control_plane:
    name: Publish Liquidations health control status
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      statuses: write

    steps:
      - name: Publish pending health status
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "state": "pending",
              "context": "liquidations-live-health",
              "description": "Waiting for Synology Liquid20 collector and portal health",
              "target_url": os.environ["STATUS_URL"],
          }))
          PY
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
            --data "$payload" >/dev/null

  health:
    name: Check Synology collector and portal
    needs: control_plane
    runs-on: freqtrade-staging
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      statuses: write

    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Check combined health and reconcile alert
        id: health
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LIQUID20_CONTAINER_NAME: liquid20-live
          LIQUID20_DATA_ROOT: /volume1/docker/freqtrade-liquidations/data
          LIQUID20_DISK_FREE_BYTES_MIN: "21474836480"
          LIQUID20_DISK_USED_PERCENT_MAX: "90"
          LIQUID20_HEALTH_REPORT: ${{ runner.temp }}/liquidations-live-health.json
          LIQUID20_HEARTBEAT_STALE_SECONDS: "60"
          LIQUID20_PORTAL_HEALTH_REPORT: ${{ runner.temp }}/liquidations-live-portal-health.json
          LIQUID20_PORTAL_PROOF_SCRIPT: deploy/synology/portal/probe-liquidations-live-operational.sh
          LIQUID20_RECONNECTS_PER_HOUR_MAX: "100"
          LIQUID20_REQUIRE_PORTAL_HEALTH: "true"
          LIQUID20_SOURCE_STALE_SECONDS: "60"
          PORTAL_LIVE_PROOF_DELAY_SECONDS: "12"
          PORTAL_OPERATIONAL_PROBE_TIMEOUT_SECONDS: "15"
        run: |
          set +e
          python -m ai_platform.scripts.liquidation_operational_health
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish health summary
        if: always()
        env:
          REPORT: ${{ runner.temp }}/liquidations-live-health.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["REPORT"])
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not report_path.is_file():
              summary_path.write_text(
                  "## Liquidations live health\n\nHealth report was not created.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          alerts = report.get("alerts", [])
          portal = report.get("checks", {}).get("portal", {})
          production = portal.get("production", {})
          lines = [
              "## Liquidations live health",
              "",
              f"- Healthy: `{report.get('healthy')}`",
              f"- Checked at: `{report.get('checked_at_ms')}`",
              f"- Portal mode: `{portal.get('mode')}`",
              f"- Portal probe exit: `{portal.get('proof_exit_code')}`",
              f"- Production page: `{production.get('page_status')}`",
              (
                  "- Production protected health: "
                  f"`{production.get('protected_health_status')} "
                  f"{production.get('protected_health_code')}`"
              ),
              f"- GitHub alert action: `{report.get('github_alert_action')}`",
              f"- Alert count: `{len(alerts) if isinstance(alerts, list) else 'unknown'}`",
          ]
          if alerts:
              lines.extend(["", "### Alerts"])
              for alert in alerts:
                  lines.append(f"- `{alert.get('code')}`: {alert.get('message')}")
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload unhealthy evidence
        if: always() && steps.health.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liquidations-live-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/liquidations-live-health.json
            ${{ runner.temp }}/liquidations-live-portal-health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish final health status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_EXIT_CODE: ${{ steps.health.outputs.exit_code }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$HEALTH_EXIT_CODE" == "0" ]]; then
            state=success
            description="Synology Liquid20 collector and portal are healthy"
          else
            state=failure
            description="Synology Liquid20 collector or portal health failed"
          fi
          export state description
          payload=$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "state": os.environ["state"],
              "context": "liquidations-live-health",
              "description": os.environ["description"],
              "target_url": os.environ["STATUS_URL"],
          }))
          PY
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
            --data "$payload" >/dev/null

      - name: Enforce healthy result
        if: always()
        env:
          HEALTH_EXIT_CODE: ${{ steps.health.outputs.exit_code }}
        run: |
          if [[ "$HEALTH_EXIT_CODE" != "0" ]]; then
            echo "Liquidations live health check failed with exit code ${HEALTH_EXIT_CODE:-missing}" >&2
            exit 1
          fi

  runner_watchdog:
    name: Watch freqtrade-staging assignment
    needs: control_plane
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      issues: write
      statuses: write

    steps:
      - name: Fail closed if Synology health job never starts
        env:
          ALERT_TITLE: "[liquidations-live] operational health alert"
          GH_TOKEN: ${{ github.token }}
          HEALTH_JOB_NAME: Check Synology collector and portal
          STATUS_SHA: ${{ github.sha }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          health_status=missing
          for _ in $(seq 1 12); do
            jobs_json=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100")
            health_status=$(JOBS_JSON="$jobs_json" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["JOBS_JSON"])
          expected = os.environ["HEALTH_JOB_NAME"]
          status = next(
              (
                  str(job.get("status", "missing"))
                  for job in payload.get("jobs", [])
                  if job.get("name") == expected
              ),
              "missing",
          )
          print(status)
          PY
            )
            if [[ "$health_status" == "in_progress" || "$health_status" == "completed" ]]; then
              echo "Synology health job reached status: $health_status"
              exit 0
            fi
            sleep 10
          done

          description="freqtrade-staging runner did not start health job"
          export description
          status_payload=$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "state": "failure",
              "context": "liquidations-live-health",
              "description": os.environ["description"],
              "target_url": os.environ["STATUS_URL"],
          }))
          PY
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
            --data "$status_payload" >/dev/null

          alert_body=$(cat <<EOF
          ## Liquidations Live operational health failure

          - Code: \`LIQUIDATIONS_HEALTH_RUNNER_UNAVAILABLE\`
          - Runner label: \`freqtrade-staging\`
          - Observed health job status: \`$health_status\`
          - Workflow run: $STATUS_URL

          The trusted Synology health job did not start within 120 seconds. Collector and portal state remain unverified.
          EOF
          )
          issues_response="$RUNNER_TEMP/liquidations-live-open-issues.json"
          issues_http_code=$(curl --silent --show-error \
            --output "$issues_response" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100") \
            || issues_http_code=000

          if [[ "$issues_http_code" == "200" ]]; then
            issues_json=$(cat "$issues_response")
            issue_number=$(ISSUES_JSON="$issues_json" python - <<'PY'
          import json
          import os

          title = os.environ["ALERT_TITLE"]
          issues = json.loads(os.environ["ISSUES_JSON"])
          number = next(
              (
                  issue.get("number")
                  for issue in issues
                  if issue.get("title") == title and "pull_request" not in issue
              ),
              "",
          )
          print(number)
          PY
            )
            issue_payload=$(ALERT_BODY="$alert_body" python - <<'PY'
          import json
          import os

          print(json.dumps({
              "title": os.environ["ALERT_TITLE"],
              "body": os.environ["ALERT_BODY"],
          }))
          PY
            )
            if [[ -n "$issue_number" ]]; then
              if ! curl --fail --silent --show-error \
                --request PATCH \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$issue_number" \
                --data "$issue_payload" >/dev/null; then
                echo "::warning::Unable to update Liquidations health alert issue; commit status remains authoritative."
              fi
            elif ! curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues" \
              --data "$issue_payload" >/dev/null; then
              echo "::warning::Unable to create Liquidations health alert issue; commit status remains authoritative."
            fi
          else
            echo "::warning::GitHub Issues API returned HTTP $issues_http_code; commit status remains authoritative."
          fi

          echo "$description" >&2
          exit 1
