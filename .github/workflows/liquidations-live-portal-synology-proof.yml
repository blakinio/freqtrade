name: Liquidations Live Portal Synology Proof

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/liquidations-live-portal-synology-proof.yml
      - deploy/synology/portal/prove-liquidations-live.sh
  workflow_dispatch:

permissions: {}

concurrency:
  group: liquidations-live-portal-synology-proof
  cancel-in-progress: false

jobs:
  prove:
    name: Prove live portal read path
    runs-on: freqtrade-staging
    timeout-minutes: 20
    environment: synology-staging
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(cat <<EOF
          {"state":"pending","context":"liquidations-live-portal-synology-proof","description":"Proving read-only live portal path","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload" >/dev/null

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prove production boundary and isolated authenticated read path
        id: proof
        env:
          PORTAL_CONTAINER_NAME: freqtrade-portal-staging
          PORTAL_LIQUIDATIONS_HOST_ROOT: /volume1/docker/freqtrade-liquidations/data
          PORTAL_LIVE_PROOF_REPORT_PATH: ${{ runner.temp }}/liquidations-live-portal-synology-proof.json
          PORTAL_LIVE_PROOF_DELAY_SECONDS: "12"
        run: |
          set -o pipefail
          bash deploy/synology/portal/prove-liquidations-live.sh 2>&1 \
            | tee "${{ runner.temp }}/liquidations-live-portal-synology-proof.log"

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          state=failure
          if [[ "$PROOF_OUTCOME" == "success" ]]; then
            state=success
          fi
          description="Liquidations live portal proof: $PROOF_OUTCOME"
          payload=$(cat <<EOF
          {"state":"$state","context":"liquidations-live-portal-synology-proof","description":"$description","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload" >/dev/null

      - name: Upload operational evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liquidations-live-portal-synology-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/liquidations-live-portal-synology-proof.json
            ${{ runner.temp }}/liquidations-live-portal-synology-proof.log
          if-no-files-found: warn
          retention-days: 30
