name: Liquidations Live Ruff Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/liquidations-live-ruff-diagnostic.yml

permissions: {}

jobs:
  diagnose:
    name: Capture Ruff output
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"
      - name: Capture Ruff
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.21
          set +e
          ruff check ai_platform tests/ai_platform_integration/test_liquidation_live_stream.py tests/ai_platform_integration/test_synology_liquid20_live_deployment.py > "$RUNNER_TEMP/ruff-check.log" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/ruff-check.status"
          ruff format --check ai_platform tests/ai_platform_integration/test_liquidation_live_stream.py tests/ai_platform_integration/test_synology_liquid20_live_deployment.py > "$RUNNER_TEMP/ruff-format.log" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/ruff-format.status"
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquidations-live-ruff-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/ruff-check.log
            ${{ runner.temp }}/ruff-check.status
            ${{ runner.temp }}/ruff-format.log
            ${{ runner.temp }}/ruff-format.status
          if-no-files-found: error
          retention-days: 1
