name: Liquidations Live Synology

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/liquidations-live-synology.yml
      - ai_platform/research/liquidations/**
      - ai_platform/scripts/liquidation_live_stream.py
      - ai_platform/scripts/liquidation_collector.py
      - ai_platform/scripts/liquidation_binance_collector.py
      - deploy/synology/liquid20/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: liquidations-live-synology
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy exact SHA
    runs-on: freqtrade-staging
    timeout-minutes: 45
    environment: synology-staging
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(cat <<EOF
          {"state":"pending","context":"liquidations-live-synology","description":"Validating continuous liquidation collector","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload" >/dev/null

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate and deploy live collector
        id: deploy
        env:
          LIQUID20_PUID: ${{ vars.LIQUID20_PUID }}
          LIQUID20_PGID: ${{ vars.LIQUID20_PGID }}
          LIQUID20_HOST_ID: ${{ vars.LIQUID20_HOST_ID }}
          LIQUID20_DATA_ROOT: /volume1/docker/freqtrade-liquidations/data
          LIQUID20_DEPLOY_REPORT: ${{ runner.temp }}/liquidations-live-synology-report.json
          LIQUID20_DEPLOY_LOG: ${{ runner.temp }}/liquidations-live-synology.log
        run: |
          set -o pipefail
          bash deploy/synology/liquid20/deploy-live.sh 2>&1 | tee "$LIQUID20_DEPLOY_LOG"

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_OUTCOME" == "success" ]]; then
            state=success
          else
            state=failure
          fi
          description="Liquidations live Synology: deploy=$DEPLOY_OUTCOME"
          payload=$(cat <<EOF
          {"state":"$state","context":"liquidations-live-synology","description":"$description","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload" >/dev/null

      - name: Upload operational evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liquidations-live-synology-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/liquidations-live-synology-report.json
            ${{ runner.temp }}/liquidations-live-synology.log
          if-no-files-found: warn
          retention-days: 30
