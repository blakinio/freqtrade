name: Market Data Pre-commit Diagnostics

on:
  pull_request:
    paths:
      - "ai_platform/market_data/**"
      - "tests/ai_platform_integration/test_market_data_*.py"
      - "docs/agents/tasks/FTAI-20260726-market-data-fabric-foundation-v1.md"
      - ".github/workflows/market-data-precommit-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit
      - name: Capture pre-commit diagnostics
        shell: bash
        run: |
          set +e
          pre-commit run --all-files > precommit.log 2>&1
          status=$?
          git diff > precommit.patch
          printf '\nexit_code=%s\n' "$status" >> precommit.log
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: market-data-precommit-diagnostics
          path: |
            precommit.log
            precommit.patch
          if-no-files-found: error
          retention-days: 1
