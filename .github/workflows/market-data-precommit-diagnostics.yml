name: Market Data Pre-commit Diagnostics

on:
  pull_request:
    paths:
      - "ai_platform/market_data/**"
      - ".github/workflows/market-data-precommit-diagnostics.yml"

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply Mypy narrowing fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/market_data/universe.py")
          text = path.read_text(encoding="utf-8")
          old = "    for metric in metrics:\n        if metric.measured_at_ms > selection_timestamp_ms:\n"
          new = "    for metric_snapshot in metrics:\n        if metric_snapshot.measured_at_ms > selection_timestamp_ms:\n"
          if old not in text:
              raise SystemExit("expected Mypy narrowing target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/market_data/universe.py
          git commit -m "fix(ai-platform): avoid metric type narrowing collision"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
