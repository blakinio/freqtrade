name: Market Data Ruff Diagnostics

on:
  pull_request:
    paths:
      - "ai_platform/market_data/**"
      - "tests/ai_platform_integration/test_market_data_*.py"
      - ".github/workflows/market-data-ruff-diagnostics.yml"

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - name: Apply Ruff import fixes
        shell: bash
        run: |
          ruff check ai_platform/market_data tests/ai_platform_integration/test_market_data_*.py --fix
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/market_data tests/ai_platform_integration/test_market_data_*.py
          git commit -m "style(ai-platform): apply Ruff import fixes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
