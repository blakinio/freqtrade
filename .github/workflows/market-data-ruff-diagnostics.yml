name: Market Data Ruff Diagnostics

on:
  pull_request:
    paths:
      - "ai_platform/market_data/**"
      - "tests/ai_platform_integration/test_market_data_*.py"
      - ".github/workflows/market-data-ruff-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - name: Capture Ruff diagnostics
        shell: bash
        run: |
          set +e
          ruff check ai_platform/market_data tests/ai_platform_integration/test_market_data_*.py --output-format=full > ruff-diagnostics.txt 2>&1
          status=$?
          printf '\nexit_code=%s\n' "$status" >> ruff-diagnostics.txt
          exit 0
      - name: Upload Ruff diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: market-data-ruff-diagnostics
          path: ruff-diagnostics.txt
          if-no-files-found: error
          retention-days: 1
