name: Market Data Ruff Diagnostics

on:
  pull_request:
    paths:
      - "ai_platform/market_data/**"
      - "tests/ai_platform_integration/test_market_data_*.py"
      - ".github/workflows/market-data-ruff-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - name: Generate Ruff fix patch
        shell: bash
        run: |
          ruff check ai_platform/market_data tests/ai_platform_integration/test_market_data_*.py --fix --exit-zero
          git diff -- ai_platform/market_data tests/ai_platform_integration/test_market_data_*.py > ruff-fixes.patch
          test -s ruff-fixes.patch
      - name: Upload Ruff fix patch
        uses: actions/upload-artifact@v4
        with:
          name: market-data-ruff-fixes
          path: ruff-fixes.patch
          if-no-files-found: error
          retention-days: 1
