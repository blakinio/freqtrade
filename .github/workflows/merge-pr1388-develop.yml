name: Merge PR1388 Develop

on:
  push:
    branches:
      - feat/portal-runtime-generation-state-1357
    paths:
      - ".github/workflows/merge-pr1388-develop.yml"
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/merge-pr1388-develop.yml"

permissions:
  contents: write

jobs:
  merge-develop:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'feat/portal-runtime-generation-state-1357'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/portal-runtime-generation-state-1357
          fetch-depth: 0
      - name: Merge latest develop and reconcile living audit ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          develop_sha="$(git rev-parse origin/develop)"
          if git merge-base --is-ancestor "$develop_sha" HEAD; then
            echo "develop already merged: $develop_sha"
          else
            set +e
            git merge --no-commit --no-ff "$develop_sha"
            merge_status=$?
            set -e
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected=$'tools/portal_audit/ledger/backend_routes.json\ntools/portal_audit/ledger/index.json'
            if [[ $merge_status -ne 0 && "$conflicts" != "$expected" ]]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi

            python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          path = "tools/portal_audit/ledger/backend_routes.json"

          def from_git(ref: str) -> dict[str, object]:
              raw = subprocess.check_output(["git", "show", f"{ref}:{path}"], text=True)
              return json.loads(raw)

          ours = from_git("HEAD")
          theirs = from_git("origin/develop")
          rows = {row.split("|", 1)[0]: row for row in theirs["rows"]}
          for row in ours["rows"]:
              rows.setdefault(row.split("|", 1)[0], row)
          absent = {
              row.split("|", 1)[0]: row for row in theirs.get("expected_absent", [])
          }
          for row in ours.get("expected_absent", []):
              absent.setdefault(row.split("|", 1)[0], row)
          merged = {
              "expected_absent": [absent[key] for key in sorted(absent)],
              "rows": [rows[key] for key in sorted(rows)],
          }
          Path(path).write_text(
              json.dumps(merged, separators=(",", ":"), ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

            git add tools/portal_audit/ledger/backend_routes.json
            git checkout --theirs tools/portal_audit/ledger/index.json
            git add tools/portal_audit/ledger/index.json

            python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("tools/portal_audit").resolve()))
          import audit_ledger  # type: ignore[import-not-found]
          import deep_inventory  # type: ignore[import-not-found]

          tests = deep_inventory.test_inventory()
          data = {
              "backend_modules": deep_inventory.backend_modules(tests),
              "backend_routes": deep_inventory.backend_routes(),
              "frontend_pages": deep_inventory.frontend_pages(),
              "bff_handlers": deep_inventory.bff_inventory(),
              "composition_evidence": deep_inventory.composition_evidence(),
          }
          actual = audit_ledger._inventory(data)
          index_path = Path("tools/portal_audit/ledger/index.json")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          for key, values in actual.items():
              index["inventory"][key]["count"] = len(values)
              index["inventory"][key]["sha256"] = audit_ledger.canonical_digest(values)
          index["inventory"]["composition_signature_sha256"] = audit_ledger.canonical_digest(
              audit_ledger.composition_signature(data["composition_evidence"])
          )
          index["ledger_version"] = "2026-08-09.2"
          index_path.write_text(
              json.dumps(index, separators=(",", ":"), sort_keys=True) + "\n",
              encoding="utf-8",
          )

          ledger = audit_ledger.load_ledger()
          audit_ledger.validate_inventory(data, ledger)
          print(
              json.dumps(
                  {
                      key: {
                          "count": len(values),
                          "sha256": audit_ledger.canonical_digest(values),
                      }
                      for key, values in actual.items()
                  },
                  sort_keys=True,
              )
          )
          PY

            git add tools/portal_audit/ledger/index.json
          fi

          git rm .github/workflows/merge-pr1388-develop.yml
          git diff --check
          if git diff --cached --quiet; then
            echo "No merge changes to commit"
            exit 0
          fi
          git commit -m "merge: reconcile latest develop with runtime generation (#1357)"
          git push origin HEAD:feat/portal-runtime-generation-state-1357
