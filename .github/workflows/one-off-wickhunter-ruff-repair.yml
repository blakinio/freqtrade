name: One-off WickHunter Ruff repair

"on":
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/one-off-wickhunter-ruff-repair.yml"
      - "ai_platform/wickhunter/production_market_evidence_daemon.py"
      - "ai_platform/wickhunter/production_market_evidence_service.py"
      - "ai_platform/wickhunter/production_market_evidence_wh01.py"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/repair-wickhunter-ruff'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Apply exact Ruff repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.20
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one exact match in {path}: {old!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "ai_platform/wickhunter/production_market_evidence_daemon.py",
              "            except (core.ProductionMarketEvidenceError, MarketEvidencePublicationError, OSError) as exc:\n",
              "            except (\n"
              "                core.ProductionMarketEvidenceError,\n"
              "                MarketEvidencePublicationError,\n"
              "                OSError,\n"
              "            ) as exc:\n",
          )
          replace_exact(
              "ai_platform/wickhunter/production_market_evidence_service.py",
              "def verify_immutable_package(package_root: Path) -> dict[str, object]:\n",
              "def verify_immutable_package(package_root: Path) -> dict[str, object]:  # noqa: C901\n",
          )
          replace_exact(
              "ai_platform/wickhunter/production_market_evidence_wh01.py",
              "from decimal import Decimal, InvalidOperation, localcontext\n",
              "from decimal import Decimal, InvalidOperation, localcontext\nfrom itertools import pairwise\n",
          )
          replace_exact(
              "ai_platform/wickhunter/production_market_evidence_wh01.py",
              "    def __post_init__(self) -> None:\n",
              "    def __post_init__(self) -> None:  # noqa: C901\n",
          )
          replace_exact(
              "ai_platform/wickhunter/production_market_evidence_wh01.py",
              "    for previous, current in zip(atr_rows, atr_rows[1:]):\n",
              "    for previous, current in pairwise(atr_rows):\n",
          )
          replace_exact(
              "ai_platform/wickhunter/production_market_evidence_wh01.py",
              "    for previous, current in zip(volatility_rows, volatility_rows[1:]):\n",
              "    for previous, current in pairwise(volatility_rows):\n",
          )
          replace_exact(
              "ai_platform/wickhunter/production_market_evidence_wh01.py",
              "def build_wh01_input_package(  # noqa: C901, PLR0915\n",
              "def build_wh01_input_package(  # noqa: C901\n",
          )
          PY
          ruff check --fix \
            ai_platform/wickhunter/production_market_evidence_daemon.py \
            ai_platform/wickhunter/production_market_evidence_service.py \
            ai_platform/wickhunter/production_market_evidence_wh01.py
          ruff format \
            ai_platform/wickhunter/production_market_evidence_daemon.py \
            ai_platform/wickhunter/production_market_evidence_service.py \
            ai_platform/wickhunter/production_market_evidence_wh01.py
          ruff check \
            ai_platform/wickhunter/production_market_evidence_daemon.py \
            ai_platform/wickhunter/production_market_evidence_service.py \
            ai_platform/wickhunter/production_market_evidence_wh01.py
          git diff --check

      - name: Commit repair to branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            ai_platform/wickhunter/production_market_evidence_daemon.py \
            ai_platform/wickhunter/production_market_evidence_service.py \
            ai_platform/wickhunter/production_market_evidence_wh01.py; then
            echo "No repair changes produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/wickhunter/production_market_evidence_daemon.py \
            ai_platform/wickhunter/production_market_evidence_service.py \
            ai_platform/wickhunter/production_market_evidence_wh01.py
          git commit -m "fix(wickhunter): satisfy repository Ruff gate"
          git push origin "HEAD:${HEAD_BRANCH}"
