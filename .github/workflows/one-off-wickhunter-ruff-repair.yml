name: One-off WickHunter gate repair

"on":
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/one-off-wickhunter-ruff-repair.yml"
      - "ai_platform/wickhunter/production_market_evidence_daemon.py"
      - "ai_platform/wickhunter/production_market_evidence_service.py"
      - "ai_platform/wickhunter/production_market_evidence_wh01.py"
      - "tests/ai_platform_integration/test_wickhunter_production_market_evidence_service.py"
      - "tests/ai_platform_integration/test_wickhunter_production_market_evidence_wh01.py"
      - "ai_platform/portal/web/components/market-evidence-dashboard.tsx"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/repair-wickhunter-ruff'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Apply exact proven repairs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.20
          python - <<'PY'
          from pathlib import Path

          service_path = Path("ai_platform/wickhunter/production_market_evidence_service.py")
          service = service_path.read_text(encoding="utf-8")
          if "from typing import Any\n" not in service:
              raise SystemExit("service typing import did not match expected repair state")
          service = service.replace("from typing import Any\n", "from typing import Any, cast\n", 1)
          keys = (
              "decision_start_ms",
              "pre_roll_start_ms",
              "sample_interval_seconds",
              "max_sample_lateness_seconds",
          )
          replacement_count = 0
          for key in keys:
              old = f'int(request["{key}"])'
              count = service.count(old)
              replacement_count += count
              service = service.replace(old, f'int(cast(Any, request["{key}"]))')
          if replacement_count != 7:
              raise SystemExit(f"expected 7 request integer conversions, found {replacement_count}")
          service_path.write_text(service, encoding="utf-8")

          dashboard_path = Path(
              "ai_platform/portal/web/components/market-evidence-dashboard.tsx"
          )
          dashboard = dashboard_path.read_text(encoding="utf-8")
          old_label = "<span>Symbole</span>"
          if dashboard.count(old_label) != 1:
              raise SystemExit("dashboard label did not match expected repair state")
          dashboard_path.write_text(
              dashboard.replace(old_label, "<span>Symbol</span>"),
              encoding="utf-8",
          )
          PY
          ruff format \
            ai_platform/wickhunter/production_market_evidence_daemon.py \
            ai_platform/wickhunter/production_market_evidence_service.py \
            ai_platform/wickhunter/production_market_evidence_wh01.py \
            tests/ai_platform_integration/test_wickhunter_production_market_evidence_service.py \
            tests/ai_platform_integration/test_wickhunter_production_market_evidence_wh01.py
          ruff check --fix \
            ai_platform/wickhunter/production_market_evidence_daemon.py \
            ai_platform/wickhunter/production_market_evidence_service.py \
            ai_platform/wickhunter/production_market_evidence_wh01.py \
            tests/ai_platform_integration/test_wickhunter_production_market_evidence_service.py \
            tests/ai_platform_integration/test_wickhunter_production_market_evidence_wh01.py
          ruff check ai_platform tests/ai_platform tests/ai_platform_integration
          git diff --check

      - name: Commit repair to branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/wickhunter/production_market_evidence_daemon.py \
            ai_platform/wickhunter/production_market_evidence_service.py \
            ai_platform/wickhunter/production_market_evidence_wh01.py \
            tests/ai_platform_integration/test_wickhunter_production_market_evidence_service.py \
            tests/ai_platform_integration/test_wickhunter_production_market_evidence_wh01.py \
            ai_platform/portal/web/components/market-evidence-dashboard.tsx
          if git diff --cached --quiet; then
            echo "No repair changes produced" >&2
            exit 1
          fi
          git commit -m "fix(wickhunter): satisfy repository quality gates"
          git push origin "HEAD:${HEAD_BRANCH}"
