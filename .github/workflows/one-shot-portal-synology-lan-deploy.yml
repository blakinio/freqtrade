name: One-shot Portal Synology LAN Deploy

on:
  push:
    branches:
      - feat/portal-synology-lan-staging
    paths:
      - .github/workflows/one-shot-portal-synology-lan-deploy.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: one-shot-portal-synology-lan-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: freqtrade-staging
    timeout-minutes: 45

    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(cat <<EOF
          {"state":"pending","context":"one-shot-portal-synology-lan-deploy","description":"Building and deploying portal preview","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload" >/dev/null

      - name: Fetch exact public source
        run: |
          set -euo pipefail
          source_dir=/tmp/freqtrade-portal-source
          rm -rf "$source_dir"
          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$source_dir" fetch --quiet --depth 1 origin "$GITHUB_SHA"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD

      - name: Build and deploy preview
        id: deploy
        continue-on-error: true
        env:
          PORTAL_BIND_ADDRESS: 192.168.1.2
          PORTAL_PORT: "3000"
        run: |
          set -o pipefail
          cd /tmp/freqtrade-portal-source
          bash deploy/synology/portal/deploy-preview.sh > /tmp/portal-synology-deploy.log 2>&1

      - name: Print bounded deployment evidence
        if: always()
        run: |
          set -euo pipefail
          if [[ "${{ steps.deploy.outcome }}" == "success" ]]; then
            tail -n 25 /tmp/portal-synology-deploy.log
          else
            echo "Deployment failed; bounded log tail follows:" >&2
            tail -n 100 /tmp/portal-synology-deploy.log >&2
          fi

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          case "$DEPLOY_OUTCOME" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          payload=$(cat <<EOF
          {"state":"$state","context":"one-shot-portal-synology-lan-deploy","description":"Portal Synology deploy: $DEPLOY_OUTCOME","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload" >/dev/null

      - name: Fail after reporting
        if: steps.deploy.outcome != 'success'
        run: exit 1
