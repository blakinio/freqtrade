name: One-shot Portal Synology LAN Deploy

on:
  push:
    branches:
      - feat/portal-synology-lan-staging
    paths:
      - .github/workflows/one-shot-portal-synology-lan-deploy.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: one-shot-portal-synology-lan-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: freqtrade-staging
    timeout-minutes: 45

    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(cat <<EOF
          {"state":"pending","context":"one-shot-portal-synology-lan-deploy","description":"Building and deploying portal preview","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"

      - name: Check out exact source
        uses: actions/checkout@v7

      - name: Build and deploy preview
        env:
          PORTAL_BIND_ADDRESS: 192.168.1.2
          PORTAL_PORT: "3000"
        run: bash deploy/synology/portal/deploy-preview.sh

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          payload=$(cat <<EOF
          {"state":"$state","context":"one-shot-portal-synology-lan-deploy","description":"Portal Synology deploy: $JOB_STATUS","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"
