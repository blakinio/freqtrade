name: Cleanup Packages

on:
  workflow_call:
    inputs:
      package_name:
        description: 'Package name to clean up'
        required: false
        default: 'freqtrade'
        type: string

  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package name to clean up'
        required: false
        default: 'freqtrade'
        type: choice
        options:
          - 'freqtrade'
          - 'freqtrade-devcontainer'
          - 'freqtrade-portal-control-plane'
          - 'freqtrade-portal-web'
          - 'wickhunter-production-research-runtime'
          - 'liquid20-collector'
      delete-untagged:
        description: 'Whether to delete only untagged images'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: "freqtrade"

permissions: {}

jobs:
  deploy-docker:
    name: "Delete Packages"
    runs-on: ubuntu-24.04
    if: github.repository == 'freqtrade/freqtrade'
    permissions:
      packages: write  # Needed to delete package versions

    steps:
      - name: "Delete untagged Package Versions"
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ inputs.package_name || env.PACKAGE_NAME }}
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: ${{ inputs.delete-untagged || 'true' }}

  cleanup-fork-build-plane:
    name: "Retain latest fork build-plane package versions"
    runs-on: ubuntu-24.04
    if: >-
      github.repository == 'blakinio/freqtrade' &&
      (
        inputs.package_name == 'freqtrade-portal-control-plane' ||
        inputs.package_name == 'freqtrade-portal-web' ||
        inputs.package_name == 'wickhunter-production-research-runtime' ||
        inputs.package_name == 'liquid20-collector'
      )
    permissions:
      packages: write

    steps:
      - name: "Retain only the latest 10 package versions"
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ inputs.package_name }}
          package-type: 'container'
          min-versions-to-keep: 10
