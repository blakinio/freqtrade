name: Apply Portal Proof Fixture Session Repair

on:
  push:
    branches:
      - fix/portal-proof-fixture-session-20260728
    paths:
      - .github/workflows/patch-portal-proof-fixture-session.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/portal-proof-fixture-session-20260728
          persist-credentials: false

      - name: Apply exact repair and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/portal-proof-fixture-session-20260728
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          script_path = Path("deploy/synology/portal/prove-liquidations-live.sh")
          test_path = Path(
              "tests/ai_platform/portal/deployment/"
              "test_liquidations_live_portal_synology_proof.py"
          )

          lines = script_path.read_text(encoding="utf-8").splitlines()
          probe_idx = lines.index("probe() {")
          if lines[probe_idx + 1] != "  docker exec \"$candidate\" node -e '":
              raise SystemExit(f"unexpected probe exec line: {lines[probe_idx + 1]!r}")

          fixture_block = '''fixture_cookie="$(
            docker exec "$candidate" node -e '
              (async () => {
                const unauthenticated = await fetch(
                  "http://127.0.0.1:3000/api/market/liquidations/health",
                  {cache:"no-store", headers:{accept:"application/json"}},
                );
                const unauthenticatedPayload = await unauthenticated.json().catch(() => ({}));
                if (unauthenticated.status !== 401 || unauthenticatedPayload.code !== "SESSION_MISSING") {
                  throw new Error("isolated candidate did not reject the unauthenticated API request");
                }
                const login = await fetch(
                  "http://127.0.0.1:3000/api/identity/login?return_to=%2Fplatform%2Fadmin",
                  {redirect:"manual"},
                );
                if (login.status !== 303) throw new Error(`fixture login status ${login.status}`);
                const location = login.headers.get("location");
                if (!location || new URL(location, "http://127.0.0.1:3000").pathname !== "/platform/admin") {
                  throw new Error("fixture login redirect mismatch");
                }
                const setCookies = login.headers.getSetCookie?.() ?? [];
                if (!setCookies.some((value) => value.startsWith("portal_fixture_session="))) {
                  throw new Error("fixture session cookie missing");
                }
                if (!setCookies.some((value) => value.startsWith("portal_fixture_csrf="))) {
                  throw new Error("fixture CSRF cookie missing");
                }
                const cookie = setCookies.map((value) => value.split(";", 1)[0]).join("; ");
                const session = await fetch("http://127.0.0.1:3000/api/identity/session", {
                  cache:"no-store",
                  headers:{cookie},
                });
                const sessionPayload = await session.json().catch(() => ({}));
                if (session.status !== 200 || sessionPayload.tenant_id !== "tenant-demo") {
                  throw new Error("fixture session validation failed");
                }
                process.stdout.write(cookie);
              })().catch((error) => { console.error(error); process.exit(1); });
            '
          )"
          test -n "$fixture_cookie"
          [[ "$fixture_cookie" == *"portal_fixture_session="* ]]
          [[ "$fixture_cookie" == *"portal_fixture_csrf="* ]]'''.splitlines()
          lines[probe_idx:probe_idx] = fixture_block + [""]
          probe_idx += len(fixture_block) + 1
          lines[probe_idx + 1] = (
              '  docker exec --env "PORTAL_FIXTURE_COOKIE=$fixture_cookie" '
              '"$candidate" node -e \''
          )

          path_idx = lines.index('    const path = require("node:path");', probe_idx)
          lines[path_idx + 1:path_idx + 1] = [
              '    const fixtureCookie = process.env.PORTAL_FIXTURE_COOKIE ?? "";',
              '    if (!fixtureCookie.includes("portal_fixture_session=")) '
              'throw new Error("fixture session is unavailable");',
          ]
          request_idx = lines.index("    async function requestJson(route) {", path_idx)
          response_idx = request_idx + 1
          if 'headers:{accept:"application/json"}' not in lines[response_idx]:
              raise SystemExit(f"unexpected request line: {lines[response_idx]!r}")
          lines[response_idx:response_idx + 1] = [
              '      const response = await fetch(`http://127.0.0.1:3000${route}`, {',
              '        cache:"no-store",',
              '        headers:{accept:"application/json",cookie:fixtureCookie},',
              '      });',
          ]
          page_idx = next(
              index
              for index in range(request_idx, len(lines))
              if 'fetch("http://127.0.0.1:3000/market/liquidations", '
              '{cache:"no-store"}),' in lines[index]
          )
          indent = lines[page_idx].split("fetch(", 1)[0]
          lines[page_idx:page_idx + 1] = [
              f'{indent}fetch("http://127.0.0.1:3000/market/liquidations", {{',
              f'{indent}  cache:"no-store",',
              f'{indent}  headers:{{cookie:fixtureCookie}},',
              f'{indent}}}),',
          ]
          report_idx = lines.index('        "fixture_identity": True,')
          lines[report_idx + 1:report_idx + 1] = [
              '        "fixture_session_validated": True,',
              '        "unauthenticated_api_rejected": True,',
          ]
          script_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          test_lines = test_path.read_text(encoding="utf-8").splitlines()
          identity_idx = test_lines.index(
              "    assert 'fixture_identity\": True' in text"
          )
          test_lines[identity_idx + 1:identity_idx + 1] = [
              "    assert '\"fixture_session_validated\": True' in text",
              "    assert '\"unauthenticated_api_rejected\": True' in text",
              '    assert "/api/identity/login?return_to=%2Fplatform%2Fadmin" in text',
              '    assert "portal_fixture_session=" in text',
              '    assert "portal_fixture_csrf=" in text',
              '    assert "/api/identity/session" in text',
              "    assert 'sessionPayload.tenant_id !== \"tenant-demo\"' in text",
              "    assert 'docker exec --env \"PORTAL_FIXTURE_COOKIE=$fixture_cookie\"' in text",
              "    assert 'headers:{accept:\"application/json\",cookie:fixtureCookie}' in text",
              "    assert '\"fixture_cookie\":' not in text",
              "    assert '\"PORTAL_FIXTURE_COOKIE\":' not in text",
          ]
          test_path.write_text("\n".join(test_lines) + "\n", encoding="utf-8")
          PY
          rm .github/workflows/patch-portal-proof-fixture-session.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/synology/portal/prove-liquidations-live.sh \
            tests/ai_platform/portal/deployment/test_liquidations_live_portal_synology_proof.py \
            .github/workflows/patch-portal-proof-fixture-session.yml
          git commit -m 'fix(portal): authenticate isolated live proof candidate'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin "HEAD:$BRANCH"
