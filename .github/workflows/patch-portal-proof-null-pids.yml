name: Apply Portal Proof Null PID Repair

on:
  push:
    branches:
      - fix/portal-proof-null-pids-20260728
    paths:
      - .github/workflows/patch-portal-proof-null-pids.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/portal-proof-null-pids-20260728

      - name: Apply exact null PID repair
        run: |
          printf '%s' '' | base64 --decode > /tmp/patch_portal_null_pids.py
          python /tmp/patch_portal_null_pids.py
          bash -n deploy/synology/portal/prove-liquidations-live.sh
          python -m py_compile tests/ai_platform/portal/deployment/test_liquidations_live_portal_synology_proof.py

      - name: Commit repair and remove helper workflow
        run: |
          set -euo pipefail
          rm .github/workflows/patch-portal-proof-null-pids.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/synology/portal/prove-liquidations-live.sh \
            tests/ai_platform/portal/deployment/test_liquidations_live_portal_synology_proof.py \
            .github/workflows/patch-portal-proof-null-pids.yml
          git commit -m "fix(portal): accept null unlimited PID inspect value"
          git push origin HEAD:fix/portal-proof-null-pids-20260728
