name: Apply Portal Proof PID Repair

on:
  push:
    branches:
      - test/liquidations-live-portal-synology-proof-20260727
    paths:
      - .github/workflows/patch-portal-proof-pids.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/liquidations-live-portal-synology-proof-20260727

      - name: Apply exact PID capability repair
        run: |
          printf '%s' '' | base64 --decode > /tmp/patch_portal_pid.py
          python /tmp/patch_portal_pid.py
          bash -n deploy/synology/portal/prove-liquidations-live.sh

      - name: Commit repair and remove helper workflow
        run: |
          set -euo pipefail
          rm .github/workflows/patch-portal-proof-pids.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/synology/portal/prove-liquidations-live.sh \
            tests/ai_platform/portal/deployment/test_liquidations_live_portal_synology_proof.py \
            .github/workflows/patch-portal-proof-pids.yml
          git commit -m "fix(portal): probe Synology PID limit in live proof"
          git push origin HEAD:test/liquidations-live-portal-synology-proof-20260727
