name: Apply Portal Proof PID Repair

on:
  pull_request:
    paths:
      - .github/workflows/patch-portal-proof-pids.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply exact PID capability repair
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path("deploy/synology/portal/prove-liquidations-live.sh")
          text = script_path.read_text(encoding="utf-8")

          replacements = [
              (
                  'trap cleanup EXIT\n\ndocker version >/dev/null',
                  '''trap cleanup EXIT

pids_limit_supported=false
pids_limit_args=()

configure_pids_limit() {
  local probe_output=""
  local probe_status=0
  set +e
  probe_output="$(docker run --rm --pids-limit 32 --entrypoint /bin/true "$portal_image" 2>&1)"
  probe_status=$?
  set -e
  if grep -Eiq \\
    'kernel does not support PIDs limit capabilities|PIDs limit discarded|pids cgroup is not mounted' \\
    <<< "$probe_output"; then
    pids_limit_supported=false
    pids_limit_args=()
    echo "Docker PID limit is unavailable on this Synology kernel; retaining the memory limit."
    return 0
  fi
  if [[ "$probe_status" -eq 0 ]]; then
    pids_limit_supported=true
    pids_limit_args=(--pids-limit 256)
    echo "Docker PID limit supported; applying a 256 process limit."
    return 0
  fi
  printf '%s\\n' "$probe_output" >&2
  echo "Docker PID limit capability probe failed for an unexpected reason" >&2
  return 1
}

docker version >/dev/null''',
              ),
              (
                  'test "$portal_restart" = "unless-stopped"\n\ndata_gid="$(',
                  'test "$portal_restart" = "unless-stopped"\nconfigure_pids_limit\n\ndata_gid="$(',
              ),
              (
                  '''docker run -d \\
  --name "$candidate" \\
  --restart no \\
  --read-only \\
  --tmpfs /tmp:size=64m,mode=1777 \\
  --tmpfs /app/.next/cache:size=64m,mode=0755 \\
  --cap-drop ALL \\
  --security-opt no-new-privileges:true \\
  --pids-limit 256 \\
  --memory 768m \\
  --group-add "$data_gid" \\
  --mount "type=bind,src=${liquidations_host_root},dst=${liquidations_container_root},readonly" \\
  --env PORTAL_WEB_DATA_MODE=fixture \\
  --env PORTAL_ENVIRONMENT=test \\
  --env PORTAL_IDENTITY_FIXTURE_MODE=enabled \\
  --env "PORTAL_LIQUIDATIONS_DATA_ROOT=${liquidations_container_root}" \\
  --label io.freqtrade.portal.liquidations-live-proof=true \\
  --label "io.freqtrade.portal.proof-commit=${GITHUB_SHA:-unknown}" \\
  "$portal_image" >/dev/null''',
                  '''run_args=(
  docker run -d
  --name "$candidate"
  --restart no
  --read-only
  --tmpfs /tmp:size=64m,mode=1777
  --tmpfs /app/.next/cache:size=64m,mode=0755
  --cap-drop ALL
  --security-opt no-new-privileges:true
  --memory 768m
)
run_args+=("${pids_limit_args[@]}")
run_args+=(
  --group-add "$data_gid"
  --mount "type=bind,src=${liquidations_host_root},dst=${liquidations_container_root},readonly"
  --env PORTAL_WEB_DATA_MODE=fixture
  --env PORTAL_ENVIRONMENT=test
  --env PORTAL_IDENTITY_FIXTURE_MODE=enabled
  --env "PORTAL_LIQUIDATIONS_DATA_ROOT=${liquidations_container_root}"
  --label io.freqtrade.portal.liquidations-live-proof=true
  --label "io.freqtrade.portal.proof-commit=${GITHUB_SHA:-unknown}"
  "$portal_image"
)
"${run_args[@]}" >/dev/null''',
              ),
              (
                  '[[ " $(docker exec "$candidate" id -G) " == *" $data_gid "* ]]\n\nprobe() {',
                  '''[[ " $(docker exec "$candidate" id -G) " == *" $data_gid "* ]]
candidate_pids_limit="$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$candidate")"
if [[ "$pids_limit_supported" == true ]]; then
  test "$candidate_pids_limit" = "256"
else
  test "$candidate_pids_limit" = "0"
fi

probe() {''',
              ),
              (
                  'DATA_GID="$data_gid" \\\nMOUNT_SOURCE="$mount_source" \\',
                  'DATA_GID="$data_gid" \\\nPIDS_LIMIT_SUPPORTED="$pids_limit_supported" \\\nCANDIDATE_PIDS_LIMIT="$candidate_pids_limit" \\\nMOUNT_SOURCE="$mount_source" \\',
              ),
              (
                  '        "docker_socket_mounted": False,\n        "first": first,',
                  '        "docker_socket_mounted": False,\n        "pids_limit_supported": os.environ["PIDS_LIMIT_SUPPORTED"] == "true",\n        "pids_limit": int(os.environ["CANDIDATE_PIDS_LIMIT"]),\n        "first": first,',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one replacement target, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)
          script_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/ai_platform/portal/deployment/test_liquidations_live_portal_synology_proof.py")
          tests = test_path.read_text(encoding="utf-8")
          addition = '''\n\ndef test_script_probes_synology_pid_limit_and_records_runtime_setting() -> None:\n    text = SCRIPT.read_text(encoding="utf-8")\n\n    assert "configure_pids_limit" in text\n    assert "PIDs limit discarded" in text\n    assert "pids cgroup is not mounted" in text\n    assert "pids_limit_args=(--pids-limit 256)" in text\n    assert 'run_args+=("${pids_limit_args[@]}")' in text\n    assert 'candidate_pids_limit="$(docker inspect' in text\n    assert '"pids_limit_supported":' in text\n    assert '"pids_limit": int(' in text\n'''
          if "test_script_probes_synology_pid_limit_and_records_runtime_setting" in tests:
              raise SystemExit("PID capability test already exists")
          test_path.write_text(tests.rstrip() + addition, encoding="utf-8")
          PY

          bash -n deploy/synology/portal/prove-liquidations-live.sh
          python - <<'PY'
          from pathlib import Path
          text = Path("deploy/synology/portal/prove-liquidations-live.sh").read_text(encoding="utf-8")
          required = [
              "configure_pids_limit",
              "PIDs limit discarded",
              'run_args+=("${pids_limit_args[@]}")',
              '"pids_limit_supported":',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"missing repaired contracts: {missing}")
          PY

      - name: Commit repair and remove helper workflow
        run: |
          set -euo pipefail
          rm .github/workflows/patch-portal-proof-pids.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/synology/portal/prove-liquidations-live.sh \
            tests/ai_platform/portal/deployment/test_liquidations_live_portal_synology_proof.py \
            .github/workflows/patch-portal-proof-pids.yml
          git commit -m "fix(portal): probe Synology PID limit in live proof"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
