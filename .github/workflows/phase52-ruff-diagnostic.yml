name: Phase 5.2 Ruff Diagnostic

on:
  pull_request:
    paths:
      - "ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/phase52-ruff-diagnostic.yml"

permissions:
  contents: read

jobs:
  ruff-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21

      - name: Generate exact import-order patch
        run: |
          ruff check --select I --fix \
            ai_platform/scripts/run_exit_optimization.py \
            ai_platform/strategies/AiPhase52ExitStrategy.py \
            tests/ai_platform/test_run_exit_optimization.py
          git diff -- \
            ai_platform/scripts/run_exit_optimization.py \
            ai_platform/strategies/AiPhase52ExitStrategy.py \
            tests/ai_platform/test_run_exit_optimization.py \
            > phase52-ruff-import-fix.patch
          cat phase52-ruff-import-fix.patch

      - name: Upload exact import-order patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase52-ruff-import-fix
          path: phase52-ruff-import-fix.patch
          if-no-files-found: error
          retention-days: 1
