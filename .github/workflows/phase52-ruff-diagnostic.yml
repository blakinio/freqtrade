name: Phase 5.2 Ruff Diagnostic

on:
  pull_request:
    paths:
      - "ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/phase52-ruff-diagnostic.yml"

permissions:
  contents: read

jobs:
  ruff-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21

      - name: Capture Ruff output
        id: ruff
        shell: bash
        run: |
          set +e
          ruff check ai_platform tests/ai_platform --output-format=concise > phase52-ruff.txt 2>&1
          status=$?
          set -e
          cat phase52-ruff.txt
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase52-ruff-diagnostics
          path: phase52-ruff.txt
          if-no-files-found: error
          retention-days: 1

      - name: Enforce Ruff result
        env:
          RUFF_STATUS: ${{ steps.ruff.outputs.status }}
        run: test "$RUFF_STATUS" -eq 0
