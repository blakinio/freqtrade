name: PI-02 Ruff Autofix

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/portal-pi02-authoritative-valuation-20260724'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install -q --disable-pip-version-check ruff==0.15.21
      - name: Apply safe fixes and formatter
        run: |
          ruff check --fix \
            ai_platform/portal/valuation/__init__.py \
            tests/ai_platform/portal/valuation/test_runtime.py \
            tests/ai_platform/portal/valuation/test_runtime_api.py
          ruff format \
            tests/ai_platform/portal/valuation/test_runtime.py \
            tests/ai_platform/portal/valuation/test_runtime_api.py
      - name: Commit fixes when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/portal/valuation/__init__.py tests/ai_platform/portal/valuation
          git diff --cached --check
          git commit -m "style(portal): apply PI-02 Ruff fixes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
