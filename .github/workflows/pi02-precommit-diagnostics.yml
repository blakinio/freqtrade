name: PI-02 Pre-commit Diagnostics

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/portal-pi02-authoritative-valuation-20260724'
    runs-on: ubuntu-24.04
    outputs:
      log_b64: ${{ steps.check.outputs.log_b64 }}
      exit_code: ${{ steps.check.outputs.exit_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install -q --disable-pip-version-check pre-commit
      - name: Capture pre-commit result
        id: check
        shell: bash
        run: |
          set +e
          pre-commit run --all-files --show-diff-on-failure > /tmp/pi02-precommit.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "log_b64=$(base64 -w0 /tmp/pi02-precommit.log)" >> "$GITHUB_OUTPUT"
          exit 0

  report:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Report pre-commit result
        env:
          LOG_B64: ${{ needs.validate.outputs.log_b64 }}
          EXIT_CODE: ${{ needs.validate.outputs.exit_code }}
        run: |
          echo "$LOG_B64" | base64 -d
          test "$EXIT_CODE" = "0"
