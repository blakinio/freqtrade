name: PI-03 CI Log Diagnostic

on:
  push:
    branches:
      - diag/pi03-ci-1174-logs

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - name: Download failed job logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pi03-ci-logs"
          while read -r label job_id; do
            curl --fail-with-body --location --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
              --output "${RUNNER_TEMP}/pi03-ci-logs/${label}.log"
          done <<'EOF'
          macos-313 89470678368
          ubuntu-311 89470678213
          ubuntu-313 89470678224
          ubuntu-314 89470678225
          windows-313 89470678249
          ubuntu-312-coverage 89470678280
          EOF

      - name: Extract failure markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("${{ runner.temp }}/pi03-ci-logs")
          markers = (
              "= FAILURES =",
              "= ERRORS =",
              "short test summary info",
              "FAILED ",
              "ERROR ",
              "AssertionError",
              "##[error]",
              "Process completed with exit code",
          )
          output = []
          for path in sorted(root.glob("*.log")):
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              hits = [i for i, line in enumerate(lines) if any(marker in line for marker in markers)]
              if hits:
                  start = max(0, min(hits) - 30)
                  end = min(len(lines), max(hits) + 80)
              else:
                  start = max(0, len(lines) - 250)
                  end = len(lines)
              output.append(f"===== {path.name} lines {start + 1}-{end} of {len(lines)} =====")
              output.extend(lines[start:end])
              output.append("")
          (root / "failure-extract.txt").write_text("\n".join(output), encoding="utf-8")
          PY

      - name: Upload failure extract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi03-ci-1174-failure-extract
          path: ${{ runner.temp }}/pi03-ci-logs/failure-extract.txt
          if-no-files-found: error
          retention-days: 1
