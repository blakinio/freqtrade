name: PI-03 CI Log Diagnostic

on:
  push:
    branches:
      - diag/pi03-ci-1174-logs
    paths:
      - .github/workflows/pi03-ci-log-diagnostic.yml

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: diag/pi03-ci-1174-logs

      - name: Download failed job logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pi03-ci-logs"
          while read -r label job_id; do
            curl --fail-with-body --location --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
              --output "${RUNNER_TEMP}/pi03-ci-logs/${label}.log"
          done <<'EOF'
          macos-313 89470678368
          ubuntu-311 89470678213
          ubuntu-313 89470678224
          ubuntu-314 89470678225
          windows-313 89470678249
          ubuntu-312-coverage 89470678280
          EOF

      - name: Extract failure markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("${{ runner.temp }}/pi03-ci-logs")
          markers = (
              "= FAILURES =",
              "= ERRORS =",
              "short test summary info",
              "FAILED ",
              "ERROR ",
              "AssertionError",
              "##[error]",
              "Process completed with exit code",
          )
          output = []
          for path in sorted(root.glob("*.log")):
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              hits = [i for i, line in enumerate(lines) if any(marker in line for marker in markers)]
              if hits:
                  start = max(0, min(hits) - 30)
                  end = min(len(lines), max(hits) + 80)
              else:
                  start = max(0, len(lines) - 250)
                  end = len(lines)
              output.append(f"===== {path.name} lines {start + 1}-{end} of {len(lines)} =====")
              output.extend(lines[start:end])
              output.append("")
          Path("docs/agents/tasks/PI03_CI_1174_FAILURE_EXTRACT.txt").write_text(
              "\n".join(output), encoding="utf-8"
          )
          PY

      - name: Commit diagnostic extract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/tasks/PI03_CI_1174_FAILURE_EXTRACT.txt
          git commit -m "docs(agents): capture PI-03 final CI failure"
          git push origin HEAD:diag/pi03-ci-1174-logs
