name: PI-03 Compact Handover

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions:
  contents: read

jobs:
  validate-and-resume:
    if: github.event.pull_request.head.ref == 'feat/portal-pi03-inference-drift-telemetry-20260724'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Validate active task checkpoint
        run: >-
          python tools/agents/checkpoint.py
          docs/agents/tasks/FTAI-20260724-portal-pi03-inference-drift-telemetry.md
          --require-checkpoint
      - name: Generate compact resume prompt
        run: >-
          python tools/agents/resume.py --task
          docs/agents/tasks/FTAI-20260724-portal-pi03-inference-drift-telemetry.md
