name: PI-03 Ruff Diagnostic

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'feat/portal-pi03-inference-drift-telemetry-20260724'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21

      - name: Capture diagnostics and fixed patch
        shell: bash
        run: |
          set -u
          artifact_dir="${RUNNER_TEMP}/pi03-ruff"
          mkdir -p "${artifact_dir}/fixed"
          git rev-parse 'HEAD^{tree}' > "${artifact_dir}/base-tree.txt"
          ruff check ai_platform tests/ai_platform --output-format=full \
            > "${artifact_dir}/ruff-check-before.txt" 2>&1 || true
          ruff format --check ai_platform tests/ai_platform \
            > "${artifact_dir}/ruff-format-before.txt" 2>&1 || true
          ruff check --fix ai_platform tests/ai_platform \
            > "${artifact_dir}/ruff-fix.txt" 2>&1 || true
          ruff format ai_platform tests/ai_platform \
            > "${artifact_dir}/ruff-format.txt" 2>&1
          ruff check ai_platform tests/ai_platform --output-format=full \
            > "${artifact_dir}/ruff-check-after.txt" 2>&1 || true
          ruff format --check ai_platform tests/ai_platform \
            > "${artifact_dir}/ruff-format-after.txt" 2>&1 || true
          git diff --binary -- ai_platform tests/ai_platform \
            > "${artifact_dir}/ruff-fix.patch"
          git diff --name-only -- ai_platform tests/ai_platform \
            > "${artifact_dir}/changed-files.txt"
          while IFS= read -r path; do
            if [[ -n "${path}" ]]; then
              mkdir -p "${artifact_dir}/fixed/$(dirname "${path}")"
              cp "${path}" "${artifact_dir}/fixed/${path}"
            fi
          done < "${artifact_dir}/changed-files.txt"

      - name: Upload Ruff diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi03-ruff-diagnostic
          path: ${{ runner.temp }}/pi03-ruff
          if-no-files-found: error
          retention-days: 1
