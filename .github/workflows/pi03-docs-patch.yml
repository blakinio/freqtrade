name: PI-03 Documentation Patch

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-clean:
    if: github.event.pull_request.head.ref == 'feat/portal-pi03-inference-drift-telemetry-20260724'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/portal-pi03-inference-drift-telemetry-20260724
          persist-credentials: true
      - name: Apply canonical PI-03 documentation and clean temporary files
        run: |
          set -euo pipefail
          python tools/agents/pi03_docs_patch.py
          git rm -f .github/workflows/pi03-docs-patch.yml
          git rm -f tools/agents/pi03_docs_patch.py
          git rm -f docs/agents/tasks/PI03_DOCS_TRIGGER.txt
          git rm -f docs/agents/tasks/PI03_DOCS_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(portal): activate PI-03 inference telemetry package"
          git push origin HEAD:feat/portal-pi03-inference-drift-telemetry-20260724
