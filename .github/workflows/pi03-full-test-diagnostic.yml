name: PI-03 Compatibility Fix Cleanup

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix-and-clean:
    if: github.event.pull_request.head.ref == 'feat/portal-pi03-inference-drift-telemetry-20260724'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/portal-pi03-inference-drift-telemetry-20260724
          persist-credentials: true
      - name: Preserve historical reason code and remove diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/portal/telemetry/service.py")
          text = path.read_text(encoding="utf-8")
          old = 'drift_reason="CANONICAL_INFERENCE_TELEMETRY_SOURCE_NOT_CONFIGURED"'
          new = 'drift_reason="CANONICAL_DRIFT_TELEMETRY_SOURCE_NOT_CONFIGURED"'
          if old not in text:
              if new not in text:
                  raise SystemExit("expected model-health compatibility reason code not found")
          else:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git rm -f .github/workflows/pi03-full-test-diagnostic.yml
          git rm -f docs/agents/tasks/PI03_FULL_TEST_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/portal/telemetry/service.py
          git commit -m "fix(portal): preserve model health unavailable reason code"
          git push origin HEAD:feat/portal-pi03-inference-drift-telemetry-20260724
