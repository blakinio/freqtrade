name: PI-03 PR Patch Runner

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/portal-pi03-inference-drift-telemetry-20260724'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/portal-pi03-inference-drift-telemetry-20260724
          persist-credentials: true
      - name: Extract verified branch patch
        run: |
          sed -n '20,312p' .github/workflows/pi03-branch-patch.yml |
            awk '{ if (substr($0, 1, 10) == "          ") print substr($0, 11); else print $0 }' \
            > /tmp/pi03-apply.sh
          test "$(head -n 1 /tmp/pi03-apply.sh)" = "python - <<'PY'"
          test "$(tail -n 1 /tmp/pi03-apply.sh)" = "PY"
      - name: Run patch and capture exact failure
        run: |
          set +e
          bash /tmp/pi03-apply.sh > /tmp/pi03-patch.log 2>&1
          code=$?
          cat /tmp/pi03-patch.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/pi03-patch.log docs/agents/tasks/PI03_PATCH_DIAGNOSTIC.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/agents/tasks/PI03_PATCH_DIAGNOSTIC.txt
            if ! git diff --cached --quiet; then
              git commit -m "chore(ci): capture PI-03 patch diagnostic"
              git push origin HEAD:feat/portal-pi03-inference-drift-telemetry-20260724
            fi
            exit "$code"
          fi
      - name: Commit integration patch
        run: |
          rm -f docs/agents/tasks/PI03_PATCH_DIAGNOSTIC.txt
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ai_platform tests docs/agents/tasks/PI03_PATCH_DIAGNOSTIC.txt
          git commit -m "feat(portal): integrate inference telemetry API and model health UI"
          git push origin HEAD:feat/portal-pi03-inference-drift-telemetry-20260724
