name: PI-03 PR Patch Runner

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/portal-pi03-inference-drift-telemetry-20260724'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/portal-pi03-inference-drift-telemetry-20260724
          persist-credentials: true
      - name: Extract branch patch
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/pi03-branch-patch.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply exact integration patch\n        run: |\n'
          start = source.index(marker) + len(marker)
          end = source.index('      - name: Commit patch\n', start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              if line and not line.startswith('          '):
                  raise SystemExit(f'unexpected patch indentation: {line!r}')
              lines.append(line[10:] if line else '')
          Path('/tmp/pi03-apply.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Run patch and capture exact failure
        run: |
          set +e
          bash /tmp/pi03-apply.sh > /tmp/pi03-patch.log 2>&1
          code=$?
          cat /tmp/pi03-patch.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/pi03-patch.log docs/agents/tasks/PI03_PATCH_DIAGNOSTIC.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/agents/tasks/PI03_PATCH_DIAGNOSTIC.txt
            if ! git diff --cached --quiet; then
              git commit -m "chore(ci): capture PI-03 patch diagnostic"
              git push origin HEAD:feat/portal-pi03-inference-drift-telemetry-20260724
            fi
            exit "$code"
          fi
      - name: Commit integration patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform tests
          git commit -m "feat(portal): integrate inference telemetry API and model health UI"
          git push origin HEAD:feat/portal-pi03-inference-drift-telemetry-20260724
