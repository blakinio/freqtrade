name: PI-03 Test Diagnostic

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feat/portal-pi03-inference-drift-telemetry-20260724'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/portal-pi03-inference-drift-telemetry-20260724
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6"
          "httpx>=0.24.1" fastapi
      - name: Run focused telemetry and API tests
        run: |
          set +e
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/telemetry/test_inference_telemetry.py \
            tests/ai_platform/portal/control_plane/test_api.py \
            > docs/agents/tasks/PI03_TEST_DIAGNOSTIC.txt 2>&1
          code=$?
          cat docs/agents/tasks/PI03_TEST_DIAGNOSTIC.txt
          echo "exit_code=$code" >> docs/agents/tasks/PI03_TEST_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/tasks/PI03_TEST_DIAGNOSTIC.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): capture PI-03 test diagnostic"
            git push origin HEAD:feat/portal-pi03-inference-drift-telemetry-20260724
          fi
