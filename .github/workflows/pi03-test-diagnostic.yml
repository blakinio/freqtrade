name: PI-03 Diagnostic Cleanup

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'feat/portal-pi03-inference-drift-telemetry-20260724'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/portal-pi03-inference-drift-telemetry-20260724
          persist-credentials: true
      - name: Remove diagnostic artifacts
        run: |
          git rm -f .github/workflows/pi03-test-diagnostic.yml
          git rm -f docs/agents/tasks/PI03_TEST_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove PI-03 diagnostic artifacts"
          git push origin HEAD:feat/portal-pi03-inference-drift-telemetry-20260724
