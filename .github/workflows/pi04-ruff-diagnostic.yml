name: PI-04 Ruff Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-diagnostic:
    if: github.event.pull_request.number == 261
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Report PI-04 Ruff findings
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://api.github.com/repos/blakinio/freqtrade/tarball/${TARGET_SHA}" \
            | tar -xz --strip-components=1
          python -m pip install --quiet ruff==0.15.21
          ruff check \
            ai_platform/portal/control_plane/api.py \
            ai_platform/portal/observability/runtime.py \
            tests/ai_platform/portal/control_plane/test_api.py \
            tests/ai_platform/portal/observability/test_runtime.py \
            tests/ai_platform/portal/observability/test_runtime_api.py \
            --output-format=concise
