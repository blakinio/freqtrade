name: PI-06 diagnostic

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  full-ai-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6"
          "httpx>=0.24.1" fastapi pyjwt cryptography
      - name: Capture full AI pytest
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform tests/ai_platform > pi06-pytest.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload exact failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi06-full-pytest
          path: pi06-pytest.txt
          if-no-files-found: error
      - name: Fail when pytest failed
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
