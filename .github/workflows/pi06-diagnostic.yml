name: PI-06 diagnostic

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  formatted-files:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - name: Format PI-06 files
        run: ruff format ai_platform/portal/identity ai_platform/portal/control_plane/database.py tests/ai_platform/portal/identity
      - name: Capture formatted files
        run: |
          mkdir -p pi06-formatted
          cp --parents ai_platform/portal/identity/*.py pi06-formatted/
          cp --parents ai_platform/portal/control_plane/database.py pi06-formatted/
          cp --parents tests/ai_platform/portal/identity/*.py pi06-formatted/
      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi06-formatted
          path: pi06-formatted
          if-no-files-found: error
