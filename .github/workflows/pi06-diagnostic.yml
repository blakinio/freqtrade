name: PI-06 diagnostic

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  identity-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: python -m pip install --disable-pip-version-check ruff==0.15.21 codespell==2.4.2
      - name: Capture Ruff and format
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo '=== ruff check ==='
            ruff check ai_platform/portal/identity ai_platform/portal/control_plane/database.py tests/ai_platform/portal/identity
            check_code=$?
            echo '=== ruff format ==='
            ruff format --check ai_platform/portal/identity ai_platform/portal/control_plane/database.py tests/ai_platform/portal/identity
            format_code=$?
            echo '=== codespell ==='
            codespell ai_platform/portal/identity docs/ai_platform/portal/PI06_PRODUCT_IDENTITY_IMPLEMENTATION.md tests/ai_platform/portal/identity
            spell_code=$?
          } > pi06-lint.txt 2>&1
          if [ "$check_code" -ne 0 ] || [ "$format_code" -ne 0 ] || [ "$spell_code" -ne 0 ]; then
            echo 'exit_code=1' >> "$GITHUB_OUTPUT"
          else
            echo 'exit_code=0' >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Upload exact lint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi06-lint
          path: pi06-lint.txt
          if-no-files-found: error
      - name: Fail when lint failed
        if: steps.lint.outputs.exit_code != '0'
        run: exit 1
