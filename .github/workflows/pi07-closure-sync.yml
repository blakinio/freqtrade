name: PI-07 closure status sync

on:
  push:
    branches:
      - docs/close-pi07-20260728
    paths:
      - .github/workflows/pi07-closure-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: docs/close-pi07-20260728
          persist-credentials: true
      - name: Synchronize canonical statuses and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text missing in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          backlog = "docs/ai_platform/portal/POST_P12_INTEGRATION_BACKLOG.md"
          replace(
              backlog,
              "| 7 | `PI-07` Runtime Credential Broker and Rotation | `planned` | secret-store-backed credential injection and revocation | P1 secret references, P3 isolation, security review |",
              "| 7 | `PI-07` Runtime Credential Broker and Rotation | `done` | Vault-backed tenant-scoped credential resolution, revocation and rotation | P1 secret references, P3 isolation, owner-approved Vault policy |",
          )
          replace(
              backlog,
              "Status: `planned`.\n\nEntry gates:\n\n- select secret store/KMS and deployment environment;\n- review withdrawal-disabled policy;\n- make runtime and tenant identity deterministic;\n- approve rotation, revocation and incident procedures;\n- prove research/training denial.",
              "Status: `done` for repository-side PI-07 software and deployment contracts, PR #666, squash merge `436b5350e54a33cbf070738a2328b142ffcd5174`. Real Synology initialization, unseal, certificates, audit retention, credential enrollment and restore acceptance remain owner-managed target evidence.\n\nAccepted decision and delivered controls:\n\n- HashiCorp Vault KV v2 with integrated Raft storage;\n- TLS-only private networking and no host-published Vault port;\n- AppRole with bounded token leases and read-only tenant paths;\n- dual audit devices and explicit target runbook;\n- withdrawal-disabled, dry-run-only and 90-day maximum credential age;\n- secret-free public evidence, tenant isolation and deterministic revocation/rotation states.",
          )
          replace(
              backlog,
              "Recommended task: `FTAI-YYYYMMDD-portal-pi07-runtime-credential-broker`.",
              "Completed task: `FTAI-20260728-portal-pi07-vault-credential-broker`. Next software package: `FTAI-YYYYMMDD-portal-pi08-private-dry-run-submission`.",
          )
          replace(
              backlog,
              "Declare PI-07 before PI-08. No live-capital path exists.",
              "PI-07 repository acceptance is complete. Declare PI-08 next; keep submission private, risk-gated, audited, reconciled and dry-run-only. No live-capital path exists.",
          )

          plan = "docs/ai_platform/portal/NEXT_WORK_AND_REPAIR_PLAN.md"
          replace(
              plan,
              "- PI-07 Runtime Credential Broker and Rotation: `planned`; requires a selected secret backend and security review.\n- PI-08 Private Dry-Run Approved Execution Submission: `planned`; depends on PI-07 and must remain dry-run-only.",
              "- PI-07 Runtime Credential Broker and Rotation: `done` for repository-side software and deployment contracts, PR #666, squash merge `436b5350e54a33cbf070738a2328b142ffcd5174`; real Synology Vault initialization and target acceptance remain owner-managed.\n- PI-08 Private Dry-Run Approved Execution Submission: `planned` and now the next authorized software package; it must remain private, risk-gated, reconciled and dry-run-only.",
          )
          replace(
              plan,
              "- runtime credential injection requires PI-07 and a security-reviewed secret backend;",
              "- PI-07 repository credential brokering is complete; real Vault initialization, certificates, credential enrollment and restore acceptance remain owner-managed target work;",
          )
          replace(
              plan,
              "3. declare PI-07 only after the secret backend, rotation policy and security review are resolved;\n4. implement PI-08 only after PI-07, keeping execution private, risk-gated, audited and dry-run-only;",
              "3. keep the merged PI-07 Vault boundary unchanged unless a separate reviewed credential package is declared;\n4. implement PI-08 now that PI-07 repository acceptance is complete, keeping execution private, risk-gated, audited, reconciled and dry-run-only;",
          )
          replace(
              plan,
              "- Cloudflare P11 acceptance, PI-07, PI-08 and P14 remain separate.",
              "- Cloudflare P11 acceptance, real PI-07 target acceptance, PI-08 and P14 remain separate.",
          )
          replace(
              plan,
              "BM-08 is complete. Do not start BM-07 or claim final BM-09 completion before PI-07 and PI-08. Do not create another repository-only Authentik deployment package. When the owner intentionally supplies Synology access, protected runtime secrets, DNS/TLS routing, test users, MFA devices, an offline `age` recovery key and an isolated restore target, declare `FTAI-YYYYMMDD-portal-pi06-authentik-synology-target-acceptance`. Separately, declare PI-07 only after the secret backend, rotation policy and security review are resolved. Keep Cloudflare P11 acceptance, PI-08 and live capital separate.",
              "PI-07 repository acceptance is complete. Declare and implement `FTAI-YYYYMMDD-portal-pi08-private-dry-run-submission` next. Do not activate BM-07 or claim final BM-09 completion before PI-08 acceptance. Keep real Synology Vault target acceptance, PI-06 target acceptance, Cloudflare P11 and live capital as separate owner-gated boundaries.",
          )

          program = "docs/agents/programs/FTAI_AI_TRADING_PORTAL_PROGRAM.md"
          replace(
              program,
              "Repository-backed implementation has progressed through P12 simulation-first acceptance, the remaining software-addressable portal product surfaces merged in PR #232, completed PI-01 through PI-04 repository-side integration packages, completed Bot Operations convergence in PR #320, completed the bounded PI-06 repository identity backend in PR #341, completed the same-origin BFF/browser-session package in PR #361 and completed the secret-free Authentik/Synology repository deployment package in PR #385.",
              "Repository-backed implementation has progressed through P12 simulation-first acceptance, the remaining software-addressable portal product surfaces merged in PR #232, completed PI-01 through PI-04 repository-side integration packages, completed Bot Operations convergence in PR #320, completed the bounded PI-06 repository identity and deployment packages, and completed the owner-approved PI-07 HashiCorp Vault credential broker in PR #666.",
          )
          replace(
              program,
              "The remaining authoritative-source, private-runtime, identity, observability and provider integrations are specified in `docs/ai_platform/portal/POST_P12_INTEGRATION_BACKLOG.md` as PI-01 through PI-08. PI-01, PI-02, PI-03 and PI-04 are complete. PI-06 is active: the architecture decision, repository identity backend, same-origin BFF/browser-session integration and Authentik/Synology repository deployment package are complete, while real owner-managed provisioning, MFA enrollment, recovery, encrypted backup/restore and target-environment acceptance remain. PI-05, PI-07 and PI-08 remain separately planned and gated.",
              "The remaining authoritative-source, private-runtime, identity, observability and provider integrations are specified in `docs/ai_platform/portal/POST_P12_INTEGRATION_BACKLOG.md` as PI-01 through PI-08. PI-01, PI-02, PI-03, PI-04 and repository-side PI-07 are complete. PI-06 remains active at its owner-managed target-acceptance boundary. PI-05 remains provider-gated. PI-08 is now the next authorized software package and remains dry-run-only; real PI-07 Synology target acceptance is separate.",
          )
          replace(
              program,
              "Current task selection, repair priorities and the exact next authorized route are maintained in `docs/ai_platform/portal/NEXT_WORK_AND_REPAIR_PLAN.md`. No further repository-only Authentik deployment package is authorized. The next PI-06 action is real owner-managed target acceptance and may begin only when Synology access, protected runtime secrets, DNS/TLS routing, test users, MFA devices, an offline `age` recovery key and an isolated restore target are intentionally available. Cloudflare P11 remains separate.",
              "Current task selection, repair priorities and the exact next authorized route are maintained in `docs/ai_platform/portal/NEXT_WORK_AND_REPAIR_PLAN.md`. PI-08 private risk-approved dry-run submission is the next software package. Real PI-06 and PI-07 target acceptance require intentional owner-managed resources and remain separate from Cloudflare P11.",
          )
          PY
          rm .github/workflows/pi07-closure-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows/pi07-closure-sync.yml
          git commit -m "docs(portal): synchronize PI-07 completion status"
          git push origin HEAD:docs/close-pi07-20260728
