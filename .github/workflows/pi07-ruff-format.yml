name: PI-07 exact Ruff format

on:
  push:
    branches:
      - feat/portal-pi07-vault-credential-broker
    paths:
      - .github/workflows/pi07-ruff-format.yml

permissions:
  contents: write

concurrency:
  group: pi07-exact-ruff-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/portal-pi07-vault-credential-broker
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply exact formatter and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.21
          ruff format \
            ai_platform/portal/credentials/broker.py \
            tests/ai_platform/portal/credentials/test_vault_broker.py \
            tests/ai_platform/portal/deployment/test_vault_synology_deployment.py
          rm .github/workflows/pi07-ruff-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/portal/credentials/broker.py \
            tests/ai_platform/portal/credentials/test_vault_broker.py \
            tests/ai_platform/portal/deployment/test_vault_synology_deployment.py \
            .github/workflows/pi07-ruff-format.yml
          git commit -m "style(portal): apply exact Ruff formatting"
          git push origin HEAD:feat/portal-pi07-vault-credential-broker
