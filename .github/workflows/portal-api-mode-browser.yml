name: Portal API Mode Browser

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/portal-api-mode-browser.yml"
      - "ai_platform/portal/**"
      - "deploy/synology/portal/**"
      - "deploy/synology/portal-oidc/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "portal-api-mode-browser-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  chromium-api-mode:
    name: Real authenticated Chromium API-mode journey
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: docker.io/library/postgres:16.13-alpine3.23@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: portal_browser
          POSTGRES_USER: portal_browser
          POSTGRES_PASSWORD: ci-only-synthetic-browser-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_browser -d portal_browser"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      PORTAL_DATABASE_URL: postgresql+psycopg://portal_browser:ci-only-synthetic-browser-password@127.0.0.1:5432/portal_browser
      PORTAL_ENVIRONMENT: production
      PORTAL_IDENTITY_CLIENT_ID: synthetic-client
      PORTAL_IDENTITY_CLIENT_SECRET: synthetic-client-secret
      PORTAL_IDENTITY_FLOW_ENCRYPTION_KEY_B64: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA
      PORTAL_IDENTITY_ISSUER: https://issuer.example/application/o/portal/
      PORTAL_IDENTITY_REDIRECT_URI: https://portal.example/api/identity/callback
      PORTAL_IDENTITY_SESSION_HMAC_KEY_B64: MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE
      PORTAL_IDENTITY_TRANSPORT_MODE: secure_https

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build exact control-plane and web images
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --pull=false \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --file deploy/synology/portal-oidc/Dockerfile.control-plane \
            --tag "portal-control-browser:${SOURCE_SHA}" \
            .
          docker build \
            --pull=false \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --file deploy/synology/portal/Dockerfile \
            --tag "portal-web-browser:${SOURCE_SHA}" \
            ai_platform/portal/web

      - name: Migrate PostgreSQL and seed real identity session plus dry-run bot
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm --network host \
            --env PORTAL_DATABASE_URL \
            --entrypoint python \
            "portal-control-browser:${SOURCE_SHA}" \
            -m ai_platform.portal.database.cli migrate \
            > artifacts/browser-schema-migrate.json
          docker run --rm -i --network host \
            --env PORTAL_DATABASE_URL \
            --entrypoint python \
            "portal-control-browser:${SOURCE_SHA}" - <<'PY'
          from datetime import UTC, datetime, timedelta

          from sqlalchemy import text

          from ai_platform.portal.contracts.bots import BotSpec
          from ai_platform.portal.contracts.environment import Environment, ExecutionMode
          from ai_platform.portal.contracts.identity import RoleName
          from ai_platform.portal.control_plane.database import build_engine, build_session_factory
          from ai_platform.portal.identity.crypto import IdentityCrypto, IdentitySecrets
          from ai_platform.portal.identity.repository import IdentityRepository

          import os

          session_token = "browser-real-session-token-" + "s" * 40
          csrf_token = "browser-real-csrf-token-" + "c" * 40
          crypto = IdentityCrypto(
              IdentitySecrets(
                  session_hmac_key=b"1" * 32,
                  flow_encryption_key=b"0" * 32,
              )
          )
          engine = build_engine(os.environ["PORTAL_DATABASE_URL"])
          session_factory = build_session_factory(engine)
          now = datetime.now(UTC)
          try:
              with session_factory() as session:
                  repository = IdentityRepository(session)
                  principal = repository.create_principal(
                      principal_id="browser-principal",
                      issuer="https://issuer.example/application/o/portal/",
                      subject="browser-subject",
                      display_name="Browser Operator",
                      email=None,
                      now=now,
                  )
                  membership = repository.create_membership(
                      membership_id="browser-membership",
                      principal_id=principal.principal_id,
                      tenant_id="browser-tenant",
                      roles=(RoleName.TRADER,),
                      valid_from=now,
                      valid_until=None,
                      now=now,
                  )
                  repository.create_session(
                      session_id_hash=crypto.hash_token(session_token),
                      csrf_token_hash=crypto.hash_token(csrf_token),
                      principal_id=principal.principal_id,
                      membership_id=membership.membership_id,
                      membership_version=membership.membership_version,
                      idp_session_id="browser-idp-session",
                      authentication_time=now,
                      mfa_satisfied=True,
                      created_at=now,
                      idle_expires_at=now + timedelta(minutes=30),
                      absolute_expires_at=now + timedelta(hours=4),
                  )
                  session.commit()

              spec = BotSpec(
                  tenant_id="browser-tenant",
                  strategy_version="browser-strategy-v1",
                  model_version="browser-model-v1",
                  risk_policy_version="browser-risk-v1",
                  exchange_connection_ref="browser-exchange-reference",
                  pair_universe=("BTC/USDT",),
                  timeframe="5m",
                  capital_allocation="100",
                  capital_currency="USDT",
                  runtime_version="browser-runtime-v1",
                  config_revision=1,
                  environment=Environment.PRODUCTION,
                  execution_mode=ExecutionMode.DRY_RUN,
              )
              with engine.begin() as connection:
                  connection.execute(
                      text(
                          "INSERT INTO portal_bots "
                          "(tenant_id, bot_id, name, spec_json, desired_state, observed_state, current_revision) "
                          "VALUES (:tenant_id, :bot_id, :name, :spec_json, :desired_state, :observed_state, :current_revision)"
                      ),
                      {
                          "tenant_id": "browser-tenant",
                          "bot_id": "browser-preserved-bot",
                          "name": "Browser preserved dry-run bot",
                          "spec_json": spec.canonical_json(),
                          "desired_state": "STOPPED",
                          "observed_state": "STOPPED",
                          "current_revision": 1,
                      },
                  )
          finally:
              engine.dispose()
          PY

      - name: Boot exact production API-mode candidate
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          control="portal-browser-control-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          web="portal-browser-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CONTROL_CONTAINER=$control" >> "$GITHUB_ENV"
          echo "WEB_CONTAINER=$web" >> "$GITHUB_ENV"
          docker run --detach --name "$control" --network host \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env PORTAL_DATABASE_URL \
            --env PORTAL_ENVIRONMENT \
            --env PORTAL_IDENTITY_CLIENT_ID \
            --env PORTAL_IDENTITY_CLIENT_SECRET \
            --env PORTAL_IDENTITY_FLOW_ENCRYPTION_KEY_B64 \
            --env PORTAL_IDENTITY_ISSUER \
            --env PORTAL_IDENTITY_REDIRECT_URI \
            --env PORTAL_IDENTITY_SESSION_HMAC_KEY_B64 \
            --env PORTAL_IDENTITY_TRANSPORT_MODE \
            "portal-control-browser:${SOURCE_SHA}"
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/readyz > artifacts/browser-ready.json; then
              break
            fi
            sleep 2
          done
          test -s artifacts/browser-ready.json

          docker run --detach --name "$web" --network host \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env PORTAL_WEB_DATA_MODE=api \
            --env PORTAL_ENVIRONMENT=production \
            --env PORTAL_IDENTITY_FIXTURE_MODE=disabled \
            --env PORTAL_IDENTITY_TRANSPORT_MODE=https \
            --env PORTAL_IDENTITY_ISSUER=https://issuer.example/application/o/portal/ \
            --env PORTAL_CONTROL_PLANE_URL=http://127.0.0.1:8000 \
            --env PORTAL_LIQUIDATIONS_DATA_ROOT=/tmp/no-liquidations \
            "portal-web-browser:${SOURCE_SHA}"
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$web")"
            [[ "$status" == "healthy" ]] && break
            [[ "$status" =~ ^(unhealthy|exited|dead)$ ]] && {
              docker logs "$web"
              exit 1
            }
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$web")" = "healthy"

      - name: Install Chromium test runtime
        working-directory: ai_platform/portal/web
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Run real authenticated Chromium read and mutation journey
        working-directory: ai_platform/portal/web
        run: |
          set -euo pipefail
          mkdir -p ../../../artifacts
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/portal-browser.key" \
            -out "$RUNNER_TEMP/portal-browser.crt" \
            -days 1 \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1" >/dev/null 2>&1
          cat > "$RUNNER_TEMP/portal-browser-proxy.mjs" <<'JS'
          import fs from "node:fs";
          import http from "node:http";
          import https from "node:https";

          const [keyPath, certPath] = process.argv.slice(2);
          const server = https.createServer(
            { key: fs.readFileSync(keyPath), cert: fs.readFileSync(certPath) },
            (request, response) => {
              const upstream = http.request(
                {
                  hostname: "127.0.0.1",
                  port: 3000,
                  path: request.url,
                  method: request.method,
                  headers: { ...request.headers, host: "127.0.0.1:3000" },
                },
                (upstreamResponse) => {
                  response.writeHead(upstreamResponse.statusCode ?? 502, upstreamResponse.headers);
                  upstreamResponse.pipe(response);
                },
              );
              upstream.on("error", () => {
                response.writeHead(502);
                response.end();
              });
              request.pipe(upstream);
            },
          );
          server.listen(3443, "127.0.0.1");
          JS
          node "$RUNNER_TEMP/portal-browser-proxy.mjs" \
            "$RUNNER_TEMP/portal-browser.key" "$RUNNER_TEMP/portal-browser.crt" \
            > "$RUNNER_TEMP/portal-browser-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            curl --insecure --fail --silent https://127.0.0.1:3443/login >/dev/null && break
            sleep 1
          done

          cat > "$RUNNER_TEMP/portal-api-mode-browser.mjs" <<'JS'
          import { chromium } from "@playwright/test";
          import fs from "node:fs";

          const origin = "https://127.0.0.1:3443";
          const sessionToken = "browser-real-session-token-" + "s".repeat(40);
          const csrfToken = "browser-real-csrf-token-" + "c".repeat(40);
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ ignoreHTTPSErrors: true });
          await context.addCookies([
            {
              name: "__Host-portal_session",
              value: sessionToken,
              url: origin,
              secure: true,
              httpOnly: true,
              sameSite: "Lax",
            },
            {
              name: "__Host-portal_csrf",
              value: csrfToken,
              url: origin,
              secure: true,
              httpOnly: false,
              sameSite: "Lax",
            },
          ]);
          const page = await context.newPage();
          const response = await page.goto(`${origin}/bots`, { waitUntil: "networkidle" });
          if (!response || response.status() !== 200) {
            throw new Error(`bots page failed: ${response?.status()}`);
          }
          await page.getByText("Browser preserved dry-run bot", { exact: true }).waitFor();
          await page.getByText("browser-preserved-bot", { exact: true }).waitFor();

          const mutation = await page.evaluate(async (token) => {
            const response = await fetch("/api/bots", {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "x-csrf-token": token,
              },
              body: JSON.stringify({
                bot_id: "browser-created-bot",
                name: "Browser created dry-run bot",
                spec: {
                  tenant_id: "browser-tenant",
                  strategy_version: "browser-strategy-v1",
                  model_version: "browser-model-v1",
                  risk_policy_version: "browser-risk-v1",
                  exchange_connection_ref: "browser-exchange-reference",
                  pair_universe: ["ETH/USDT"],
                  timeframe: "5m",
                  capital_allocation: "50",
                  capital_currency: "USDT",
                  runtime_version: "browser-runtime-v1",
                  config_revision: 1,
                  environment: "production",
                  execution_mode: "dry_run",
                },
              }),
            });
            return { status: response.status, body: await response.text() };
          }, csrfToken);
          if (mutation.status !== 201) {
            throw new Error(`browser mutation failed: ${mutation.status}: ${mutation.body}`);
          }

          await page.reload({ waitUntil: "networkidle" });
          await page.getByText("Browser created dry-run bot", { exact: true }).waitFor();
          await page.getByText("browser-created-bot", { exact: true }).waitFor();
          if ((await page.locator("body").innerText()).includes("fixture-session")) {
            throw new Error("fixture identity marker leaked into API-mode journey");
          }
          fs.writeFileSync(
            "../../../artifacts/browser-api-mode-e2e.json",
            JSON.stringify(
              {
                status: "pass",
                chromium: "pass",
                web_data_mode: "api",
                identity_fixture_mode: "disabled",
                authenticated_backend_read: "pass",
                authenticated_dry_run_mutation: "pass",
                refresh_persistence: "pass",
                request_interception: false,
                live_capital_authorized: false,
                secret_values_recorded: false,
              },
              null,
              2,
            ) + "\n",
          );
          await browser.close();
          JS
          node "$RUNNER_TEMP/portal-api-mode-browser.mjs"

      - name: Verify database persistence after browser journey
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docker run --rm -i --network host \
            --env PORTAL_DATABASE_URL \
            --entrypoint python \
            "portal-control-browser:${SOURCE_SHA}" - <<'PY' \
            > artifacts/browser-persistence.json
          import json
          import os
          from sqlalchemy import text
          from ai_platform.portal.control_plane.database import build_engine

          engine = build_engine(os.environ["PORTAL_DATABASE_URL"])
          try:
              with engine.connect() as connection:
                  rows = dict(
                      connection.execute(
                          text(
                              "SELECT bot_id, count(*) FROM portal_bots "
                              "WHERE tenant_id = 'browser-tenant' GROUP BY bot_id"
                          )
                      ).all()
                  )
              expected = {"browser-created-bot": 1, "browser-preserved-bot": 1}
              assert rows == expected, rows
              print(
                  json.dumps(
                      {
                          "status": "pass",
                          "rows": rows,
                          "live_capital_authorized": False,
                          "secret_values_recorded": False,
                      },
                      sort_keys=True,
                  )
              )
          finally:
              engine.dispose()
          PY

      - name: Upload secret-free browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-api-mode-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/browser-schema-migrate.json
            artifacts/browser-ready.json
            artifacts/browser-api-mode-e2e.json
            artifacts/browser-persistence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove candidate containers
        if: always()
        run: |
          docker rm -f "${WEB_CONTAINER:-missing}" "${CONTROL_CONTAINER:-missing}" >/dev/null 2>&1 || true
