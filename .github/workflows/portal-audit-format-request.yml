name: Portal Audit Format Request

on:
  pull_request:
    paths:
      - "tools/portal_audit/completeness_audit.py"
      - ".github/workflows/portal-audit-format-request.yml"

permissions:
  contents: write

jobs:
  format-audit-tool:
    if: github.head_ref == 'audit/portal-e2e-completeness-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Apply repository Ruff formatting
        run: |
          python -m pip install ruff==0.15.21
          ruff check --fix tools/portal_audit/completeness_audit.py
          ruff format tools/portal_audit/completeness_audit.py
          git diff --check

      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- tools/portal_audit/completeness_audit.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/portal_audit/completeness_audit.py
          git commit -m "style(portal-audit): apply repository formatter"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
