name: Portal Auth Probe Pre-commit Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/portal-auth-probe-precommit-diagnostic.yml

permissions: {}

jobs:
  diagnose:
    name: Capture pre-commit output and patch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"

      - name: Capture pre-commit result
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pre-commit==4.5.1
          set +e
          pre-commit run --all-files > "$RUNNER_TEMP/pre-commit.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/pre-commit.status"
          git diff --binary > "$RUNNER_TEMP/pre-commit.patch"
          exit 0

      - name: Upload bounded diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portal-auth-probe-precommit-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/pre-commit.log
            ${{ runner.temp }}/pre-commit.status
            ${{ runner.temp }}/pre-commit.patch
          if-no-files-found: error
          retention-days: 1
