name: Portal Authentik Deployment

on:
  pull_request:
    paths:
      - "deploy/synology/portal-authentik/**"
      - "tests/ai_platform/portal/deployment/test_authentik_synology_deployment.py"
      - "docs/ai_platform/portal/PI06_AUTHENTIK_SYNOLOGY_DEPLOYMENT.md"
      - "docs/ai_platform/portal/runbooks/PI06_AUTHENTIK_SYNOLOGY.md"
      - "docs/agents/tasks/FTAI-20260726-portal-pi06-authentik-synology-deployment.md"
      - ".github/workflows/portal-authentik-deployment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-deployment:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Create deterministic non-production runtime fixture
        shell: bash
        run: |
          cat > /tmp/portal-authentik-ci.env <<'ENV'
          AUTHENTIK_IMAGE=docker.io/authentik/server:2026.5.5@sha256:50a833c48a714709f15d4f8846ec6b81a41d0d6a6bd2975087dfed3000d0d72e
          POSTGRES_IMAGE=docker.io/library/postgres:16.13-alpine3.23@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          AUTHENTIK_POSTGRESQL__NAME=authentik
          AUTHENTIK_POSTGRESQL__USER=authentik
          AUTHENTIK_POSTGRESQL__PASSWORD=ci-only-synthetic-postgresql-password-000000000000
          AUTHENTIK_SECRET_KEY=ci-only-synthetic-authentik-secret-key-000000000000000000000000
          AUTHENTIK_BIND_ADDRESS=127.0.0.1
          AUTHENTIK_HTTP_PORT=9000
          AUTHENTIK_BOOTSTRAP_PASSWORD_HASH=
          ENV
          chmod 600 /tmp/portal-authentik-ci.env

      - name: Validate checked example and runtime fixture
        run: |
          python deploy/synology/portal-authentik/validate.py \
            --env-file deploy/synology/portal-authentik/.env.example --example
          python deploy/synology/portal-authentik/validate.py \
            --env-file /tmp/portal-authentik-ci.env

      - name: Render Compose without pulling images
        run: >-
          docker compose
          --env-file /tmp/portal-authentik-ci.env
          -f deploy/synology/portal-authentik/compose.yml
          config --quiet

      - name: Run focused tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/deployment/test_authentik_synology_deployment.py
