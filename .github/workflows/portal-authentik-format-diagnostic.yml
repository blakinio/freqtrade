name: Portal Authentik Format Diagnostic

on:
  pull_request:
    paths:
      - "deploy/synology/portal-authentik/validate.py"
      - "tests/ai_platform/portal/deployment/test_authentik_synology_deployment.py"
      - ".github/workflows/portal-authentik-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply exact Ruff format
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.21
          ruff check --fix \
            deploy/synology/portal-authentik/validate.py \
            tests/ai_platform/portal/deployment/test_authentik_synology_deployment.py
          ruff format \
            deploy/synology/portal-authentik/validate.py \
            tests/ai_platform/portal/deployment/test_authentik_synology_deployment.py
      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portal-authentik-exact-format
          path: |
            deploy/synology/portal-authentik/validate.py
            tests/ai_platform/portal/deployment/test_authentik_synology_deployment.py
          retention-days: 1
