name: Portal Completeness Audit

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  static-completeness-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUDIT_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Checkout exact audited head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          persist-credentials: false

      - name: Validate audit tools
        run: >-
          python -m py_compile
          tools/portal_audit/audit_ledger.py
          tools/portal_audit/completeness_audit.py
          tools/portal_audit/deep_inventory.py
          tools/portal_audit/classified_matrices.py
          tools/portal_audit/navigation_matrix.py
          tools/portal_audit/validate_issue_states.py

      - name: Run audit-tool regression tests
        run: python -m unittest discover -s tools/portal_audit/tests -v

      - name: Resolve audit authority
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if PYTHONPATH=tools/portal_audit python -c \
            'from validate_issue_states import legacy_issue_state_gate_is_applicable; raise SystemExit(0 if not legacy_issue_state_gate_is_applicable() else 1)'; then
            echo "legacy_gate=false" >> "$GITHUB_OUTPUT"
            echo "mode=adr023_diagnostic" >> "$GITHUB_OUTPUT"
            echo "ADR-023 is current Portal product authority; legacy completeness ledger is diagnostic-only."
          else
            echo "legacy_gate=true" >> "$GITHUB_OUTPUT"
            echo "mode=legacy_gate" >> "$GITHUB_OUTPUT"
            echo "ADR-023 current-product authority not proven; legacy completeness ledger remains fail-closed."
          fi

      - name: Reject closed Issue mappings
        if: steps.authority.outputs.legacy_gate == 'true'
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: >-
          python tools/portal_audit/validate_issue_states.py
          --repository "${{ github.repository }}"

      - name: Generate ADR-023 diagnostic completeness report
        if: steps.authority.outputs.legacy_gate == 'false'
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          python tools/portal_audit/validate_issue_states.py --repository "${{ github.repository }}"
          python tools/portal_audit/completeness_audit.py --head "$AUDIT_HEAD"
          cat artifacts/portal-completeness-audit.md

      - name: Upload ADR-023 diagnostic audit evidence
        if: steps.authority.outputs.legacy_gate == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portal-completeness-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/portal-completeness-audit.json
            artifacts/portal-completeness-audit.md
          if-no-files-found: error
          retention-days: 30

      - name: Generate exact-head portal completeness reports
        if: steps.authority.outputs.legacy_gate == 'true'
        run: |
          python tools/portal_audit/completeness_audit.py --head "$AUDIT_HEAD"
          python tools/portal_audit/deep_inventory.py --head "$AUDIT_HEAD"
          python tools/portal_audit/classified_matrices.py --head "$AUDIT_HEAD"
          python tools/portal_audit/navigation_matrix.py --head "$AUDIT_HEAD"

      - name: Prove report reproducibility
        if: steps.authority.outputs.legacy_gate == 'true'
        run: |
          report_files=(
            portal-completeness-audit.json
            portal-completeness-audit.md
            portal-deep-inventory.json
            portal-deep-inventory.md
            portal-backend-matrix.md
            portal-frontend-bff-matrix.md
            portal-runtime-test-deployment-matrix.md
            portal-navigation-completeness-matrix.json
            portal-navigation-completeness-matrix.md
          )
          mkdir -p /tmp/portal-audit-first
          for file in "${report_files[@]}"; do
            cp "artifacts/$file" "/tmp/portal-audit-first/$file"
          done
          python tools/portal_audit/completeness_audit.py --head "$AUDIT_HEAD"
          python tools/portal_audit/deep_inventory.py --head "$AUDIT_HEAD"
          python tools/portal_audit/classified_matrices.py --head "$AUDIT_HEAD"
          python tools/portal_audit/navigation_matrix.py --head "$AUDIT_HEAD"
          for file in "${report_files[@]}"; do
            cmp "/tmp/portal-audit-first/$file" "artifacts/$file"
          done

      - name: Print bounded composition evidence
        if: steps.authority.outputs.legacy_gate == 'true'
        run: |
          echo "== PI-08 and private-runtime composition references =="
          grep -R -n -E \
            "PrivateSubmissionExecutionAdapter|PrivateDryRunApprovedIntentSubmitter|execution_submitter=|BotCommandActivationService|HttpPrivateRuntimeTransport|HttpPrivateRuntimeValuationSource|LokiRuntimeObservabilitySource|VaultCredentialBroker|FreqtradeExecutionAdapter|OutboxPublisher" \
            ai_platform/portal deploy tests \
            --exclude-dir=.git \
            | head -n 500 || true
          echo "== Strategy catalog producer/consumer references =="
          grep -R -n -E "/v1/strategy-catalog|strategy-catalog" \
            ai_platform/portal tests \
            --exclude-dir=.git \
            | head -n 250 || true
          echo "== Canonical in-memory composition references =="
          grep -R -n -E \
            "InMemoryBotConfigurationRepository|InMemorySignalControlRepository|InMemoryGridControlRepository|InMemoryExchangeConnectionRepository|UnavailableBotRuntimeStateProvider|UnavailableRuntimeValuationSource|UnavailableRuntimeObservabilitySource" \
            ai_platform/portal deploy tests \
            --exclude-dir=.git \
            | head -n 400 || true

      - name: Build reproducible exact-head audit source snapshot
        if: steps.authority.outputs.legacy_gate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          snapshot_paths=(
            AGENTS.md
            pyproject.toml
            docs/agents/CONTEXT_HANDOFF.md
            docs/agents/ANTI_STALL_AND_EXECUTION_BUDGET.md
            docs/agents/AUTONOMOUS_PROGRAM_CONTINUATION.md
            docs/agents/DELIVERY_COMPLETENESS_AND_CLOSEOUT.md
            docs/agents/GITHUB_ONLY_EXECUTION.md
            docs/agents/programs/FTAI_AI_TRADING_PORTAL_PROGRAM.md
            docs/agents/programs/FTAI_PORTAL_REMEDIATION_PROGRAM.md
            docs/ai_platform/ARCHITECTURE.md
            docs/ai_platform/ROADMAP.md
            docs/ai_platform/portal
            ai_platform/portal
            deploy
            tests/ai_platform/portal
            tests/ai_platform_integration
            .github/workflows
            tools/portal_audit
          )
          for candidate in Dockerfile docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
            if [[ -e "$candidate" ]]; then
              snapshot_paths+=("$candidate")
            fi
          done

          build_snapshot() {
            local archive="$1"
            local manifest="$2"
            local list_file="$3"
            find "${snapshot_paths[@]}" -type f \
              ! -path '*/node_modules/*' \
              ! -path '*/__pycache__/*' \
              ! -name '*.pyc' \
              ! -name '*.env' \
              -print0 | LC_ALL=C sort -z > "$list_file"
            xargs -0 sha256sum < "$list_file" > "$manifest"
            tar \
              --null \
              --files-from="$list_file" \
              --sort=name \
              --format=posix \
              --pax-option=delete=atime,delete=ctime \
              --mtime='UTC 1970-01-01' \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --mode='u+rwX,go+rX,go-w' \
              -cf - | gzip -n > "$archive"
          }

          build_snapshot \
            artifacts/portal-audit-source.tar.gz \
            artifacts/portal-audit-source.manifest.sha256 \
            /tmp/portal-audit-source-files-1
          build_snapshot \
            /tmp/portal-audit-source-2.tar.gz \
            /tmp/portal-audit-source-2.manifest.sha256 \
            /tmp/portal-audit-source-files-2
          cmp artifacts/portal-audit-source.tar.gz /tmp/portal-audit-source-2.tar.gz
          cmp artifacts/portal-audit-source.manifest.sha256 /tmp/portal-audit-source-2.manifest.sha256
          sha256sum artifacts/portal-audit-source.tar.gz > artifacts/portal-audit-source.sha256
          sha256sum artifacts/portal-audit-source.manifest.sha256 > artifacts/portal-audit-source.manifest.digest

      - name: Print bounded report
        if: steps.authority.outputs.legacy_gate == 'true'
        run: |
          cat artifacts/portal-completeness-audit.md
          sed -n '1,260p' artifacts/portal-deep-inventory.md
          sed -n '1,220p' artifacts/portal-backend-matrix.md
          sed -n '1,180p' artifacts/portal-frontend-bff-matrix.md
          sed -n '1,180p' artifacts/portal-runtime-test-deployment-matrix.md
          sed -n '1,240p' artifacts/portal-navigation-completeness-matrix.md

      - name: Upload audit evidence
        if: steps.authority.outputs.legacy_gate == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portal-completeness-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/portal-completeness-audit.json
            artifacts/portal-completeness-audit.md
            artifacts/portal-deep-inventory.json
            artifacts/portal-deep-inventory.md
            artifacts/portal-backend-matrix.md
            artifacts/portal-frontend-bff-matrix.md
            artifacts/portal-runtime-test-deployment-matrix.md
            artifacts/portal-navigation-completeness-matrix.json
            artifacts/portal-navigation-completeness-matrix.md
            artifacts/portal-audit-source.tar.gz
            artifacts/portal-audit-source.sha256
            artifacts/portal-audit-source.manifest.sha256
            artifacts/portal-audit-source.manifest.digest
          if-no-files-found: error
          retention-days: 30
