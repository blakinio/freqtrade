name: Temporary Portal Fixup Helper

on:
  push:
    branches:
      - repair/1089-portal-api-mode-deployment

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: repair/1089-portal-api-mode-deployment
          persist-credentials: true

      - name: Apply bounded mechanical fixup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/portal-schema-exact-image.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = '      - name: Upload secret-free exact-image evidence\n'
          insert = (
              '      - name: Run real authenticated Chromium API-mode journey\n'
              '        run: bash tools/portal_schema/api_mode_browser_acceptance.sh\n\n'
          )
          if insert not in text:
              if marker not in text:
                  raise SystemExit('exact-image upload marker missing')
              text = text.replace(marker, insert + marker, 1)
          artifact_marker = '            artifacts/exact-image-summary.json\n'
          artifact_insert = (
              '            artifacts/api-mode-browser-ready.json\n'
              '            artifacts/api-mode-browser-e2e.json\n'
              '            artifacts/api-mode-browser-persistence.json\n'
          )
          if artifact_insert not in text:
              if artifact_marker not in text:
                  raise SystemExit('exact-image artifact marker missing')
              text = text.replace(artifact_marker, artifact_marker + artifact_insert, 1)
          workflow.write_text(text, encoding='utf-8')

          deployer = Path('deploy/synology/portal-oidc/deploy.py')
          source = deployer.read_text(encoding='utf-8')
          old = '    return _run(["docker", "inspect", "--format", "{{.State.Running}}", name]).stdout.strip() == "true"\n'
          new = (
              '    return (\n'
              '        _run(["docker", "inspect", "--format", "{{.State.Running}}", name]).stdout.strip() == "true"\n'
              '    )\n'
          )
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('expected deployer formatting target missing')
          deployer.write_text(source, encoding='utf-8')

          task = Path('docs/agents/tasks/active/FTAI-20260808-portal-remediation-1089.md')
          body = task.read_text(encoding='utf-8')
          body = body.replace('  - .github/workflows/portal-api-mode-browser.yml\n', '')
          body = body.replace(
              'A dedicated Chromium workflow now exercises a real production API-mode web image through HTTPS,',
              'The registered Portal Schema Exact Image workflow now also exercises a real production API-mode web image through HTTPS,',
          )
          body = body.replace(
              'Real API-mode Chromium acceptance workflow exists with no request interception or fixture identity/data path.',
              'The registered exact-image gate contains a real API-mode Chromium acceptance journey with no request interception or fixture identity/data path.',
          )
          task.write_text(body, encoding='utf-8')
          PY

          git rm .github/workflows/portal-api-mode-browser.yml
          git rm .github/workflows/portal-fixup-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/portal-schema-exact-image.yml \
            deploy/synology/portal-oidc/deploy.py \
            docs/agents/tasks/active/FTAI-20260808-portal-remediation-1089.md \
            tools/portal_schema/api_mode_browser_acceptance.sh
          git diff --cached --check
          git commit -m 'ci(portal): fold API-mode browser acceptance into registered gate'
          git push origin HEAD:repair/1089-portal-api-mode-deployment
