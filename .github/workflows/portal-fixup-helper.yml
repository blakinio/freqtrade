name: Temporary Portal Fixup Helper

on:
  push:
    branches:
      - repair/1089-portal-api-mode-deployment

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: repair/1089-portal-api-mode-deployment
          persist-credentials: true

      - name: Register browser gate and format deployer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          deployer = Path('deploy/synology/portal-oidc/deploy.py')
          source = deployer.read_text(encoding='utf-8')
          old = '    return _run(["docker", "inspect", "--format", "{{.State.Running}}", name]).stdout.strip() == "true"\n'
          new = (
              '    return (\n'
              '        _run(["docker", "inspect", "--format", "{{.State.Running}}", name]).stdout.strip() == "true"\n'
              '    )\n'
          )
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('expected deployer formatting target missing')
          deployer.write_text(source, encoding='utf-8')

          registry_path = Path('.github/workflow-registry.yaml')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          browser_path = '.github/workflows/portal-api-mode-browser.yml'
          entries = registry['workflows']
          existing = [row for row in entries if row.get('path') == browser_path]
          expected = {
              'classification': 'canonical',
              'lifecycle': 'active',
              'name': 'Portal API Mode Browser',
              'owner': 'portal',
              'path': browser_path,
              'permissions': {'contents': 'read'},
              'review_date': '2027-02-04',
              'risk_class': 'low',
              'triggers': ['pull_request', 'workflow_dispatch'],
          }
          if not existing:
              entries.append(expected)
          elif existing != [expected]:
              raise SystemExit('browser workflow registry entry differs from expected contract')
          registry['workflows'] = sorted(entries, key=lambda row: row['path'])
          registry_path.write_text(
              json.dumps(registry, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/synology/portal-oidc/deploy.py .github/workflow-registry.yaml
          git diff --cached --check
          git commit -m 'ci(portal): register API-mode browser gate and format deployer'
          git push origin HEAD:repair/1089-portal-api-mode-deployment
