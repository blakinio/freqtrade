name: Portal ledger index finalize 1540

on:
  push:
    branches:
      - fix/portal-ledger-runtime-supervisor-1355-20260815
    paths:
      - .github/workflows/portal-ledger-index-finalize-1540.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: [freqtrade-staging]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/portal-ledger-runtime-supervisor-1355-20260815
          fetch-depth: 0
          persist-credentials: true
      - name: Recompute canonical ledger fingerprint and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          index_path = Path('tools/portal_audit/ledger/index.json')
          modules_path = Path('tools/portal_audit/ledger/backend_modules.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          modules = json.loads(modules_path.read_text(encoding='utf-8'))
          if index.get('ledger_version') != '2026-08-13.1':
              raise SystemExit(f"unexpected ledger version: {index.get('ledger_version')!r}")
          raw = json.dumps(modules, sort_keys=True, separators=(',', ':')) + '\n'
          index['inventory']['backend_modules']['sha256'] = hashlib.sha256(raw.encode()).hexdigest()
          index['ledger_version'] = '2026-08-15.1'
          index_path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          python3 - <<'PY'
          from tools.portal_audit.audit_ledger import load_ledger
          ledger = load_ledger()
          assert ledger['ledger_version'] == '2026-08-15.1'
          PY
          git diff --check
      - name: Commit clean head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/portal-ledger-index-finalize-1540.yml
          git add tools/portal_audit/ledger/index.json
          git commit -m 'fix(portal): version Runtime Supervisor ledger repair'
          git push origin HEAD:fix/portal-ledger-runtime-supervisor-1355-20260815
