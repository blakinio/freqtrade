name: Portal runtime supervisor ledger repair validation

on:
  push:
    branches:
      - fix/portal-ledger-runtime-supervisor-1355-20260815
    paths:
      - .github/workflows/portal-ledger-runtime-supervisor-1355-validate.yml

permissions:
  contents: write
  issues: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/portal-ledger-runtime-supervisor-1355-20260815
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.13'
      - name: Validate ledger repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q -o addopts='' tests/ci/test_portal_runtime_supervisor_ledger.py tools/portal_audit/tests
          python tools/portal_audit/validate_issue_states.py --repository blakinio/freqtrade
      - name: Commit self-cleaned validated head
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/portal-ledger-runtime-supervisor-1355-validate.yml
          git commit -m 'chore(portal): retire ledger repair validator'
          git push origin HEAD:fix/portal-ledger-runtime-supervisor-1355-20260815
