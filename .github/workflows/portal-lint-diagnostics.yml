name: Portal Lint Diagnostics

on:
  pull_request:
    paths:
      - "ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/portal-lint-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: "portal-lint-diagnostics-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - name: Capture Ruff report
        run: ruff check ai_platform tests/ai_platform > ruff-report.txt 2>&1 || true
      - name: Upload Ruff report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ruff-report
          path: ruff-report.txt

  web-lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai_platform/portal/web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai_platform/portal/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Capture ESLint report
        run: npm run lint > eslint-report.txt 2>&1 || true
      - name: Upload ESLint report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: eslint-report
          path: ai_platform/portal/web/eslint-report.txt

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai_platform/portal/web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai_platform/portal/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture Playwright report
        env:
          PORTAL_WEB_DATA_MODE: fixture
          PORTAL_ENVIRONMENT: test
        run: npm run test:e2e > playwright-report.txt 2>&1 || true
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-text
          path: ai_platform/portal/web/playwright-report.txt
