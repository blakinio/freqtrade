name: Portal Navigation Audit Apply

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/portal-nav-audit-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out audit branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: audit/portal-e2e-completeness-20260802
          fetch-depth: 0

      - name: Apply and validate audit update
        shell: bash
        run: |
          set -euo pipefail
          cat .github/portal-nav-update.chunk{00..06} | tr -d '\n' | base64 -d > /tmp/portal-nav-update.tgz
          echo 'd25fc4da8d31a1b3f891f2d1e73022d37af9b352425ce216313ab336e901b6fb  /tmp/portal-nav-update.tgz' | sha256sum -c -
          tar -xzf /tmp/portal-nav-update.tgz
          rm -f .github/portal-nav-update.part{1..5}
          rm .github/portal-nav-update.chunk{00..06}
          rm .github/workflows/portal-nav-audit-apply.yml

          python -m py_compile \
            tools/portal_audit/completeness_audit.py \
            tools/portal_audit/deep_inventory.py \
            tools/portal_audit/classified_matrices.py \
            tools/portal_audit/navigation_matrix.py
          rm -rf artifacts
          python tools/portal_audit/deep_inventory.py
          python tools/portal_audit/classified_matrices.py
          python tools/portal_audit/navigation_matrix.py

          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          deep = json.loads(Path('artifacts/portal-deep-inventory.json').read_text())
          nav = json.loads(Path('artifacts/portal-navigation-completeness-matrix.json').read_text())
          assert deep['summary']['backend_modules'] == 30
          assert deep['summary']['backend_routes'] == 92
          assert deep['summary']['frontend_pages'] == 33
          assert deep['summary']['bff_handlers'] == 28
          assert deep['summary']['tests'] == 225
          assert nav['count'] == 28
          assert Counter(item['overall'] for item in nav['surfaces']) == Counter({
              'DISCONNECTED': 15,
              'PARTIAL': 9,
              'EXTERNAL_ACCEPTANCE_REQUIRED': 3,
              'MISSING': 1,
          })
          PY

          python -m pip install pre-commit
          set +e
          pre-commit run --all-files
          set -e
          pre-commit run --all-files
          rm -rf artifacts

          allowed='^(tools/portal_audit/(deep_inventory|classified_matrices|navigation_matrix)\.py|\.github/workflows/portal-completeness-audit\.yml|docs/ai_platform/portal/AUDIT_2026-08-0(2_END_TO_END_COMPLETENESS|3_LEFT_NAVIGATION_COMPLETENESS)\.md|docs/agents/tasks/FTAI-20260802-portal-end-to-end-completeness-audit\.md|\.github/portal-nav-update\.(part[1-5]|chunk0[0-6])|\.github/workflows/portal-nav-audit-apply\.yml)$'
          unexpected=$(git status --short | cut -c4- | grep -Ev "$allowed" || true)
          test -z "$unexpected" || { echo 'Unexpected paths:'; echo "$unexpected"; exit 1; }

      - name: Publish exact validated tree through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: audit/portal-e2e-completeness-20260802
        run: |
          set -euo pipefail
          parent_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')
          base_tree=$(gh api "repos/$REPOSITORY/git/commits/$parent_sha" --jq '.tree.sha')
          entries='[]'

          files=(
            tools/portal_audit/deep_inventory.py
            tools/portal_audit/classified_matrices.py
            tools/portal_audit/navigation_matrix.py
            .github/workflows/portal-completeness-audit.yml
            docs/ai_platform/portal/AUDIT_2026-08-02_END_TO_END_COMPLETENESS.md
            docs/ai_platform/portal/AUDIT_2026-08-03_LEFT_NAVIGATION_COMPLETENESS.md
            docs/agents/tasks/FTAI-20260802-portal-end-to-end-completeness-audit.md
          )
          for path in "${files[@]}"; do
            blob_sha=$(jq -Rs '{content: ., encoding: "utf-8"}' < "$path" \
              | gh api --method POST "repos/$REPOSITORY/git/blobs" --input - --jq '.sha')
            echo "blob[$path]=$blob_sha"
            entries=$(jq -c \
              --arg path "$path" \
              --arg sha "$blob_sha" \
              '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]' \
              <<< "$entries")
          done

          removals=(
            .github/portal-nav-update.part1
            .github/portal-nav-update.part2
            .github/portal-nav-update.part3
            .github/portal-nav-update.part4
            .github/portal-nav-update.part5
            .github/portal-nav-update.chunk00
            .github/portal-nav-update.chunk01
            .github/portal-nav-update.chunk02
            .github/portal-nav-update.chunk03
            .github/portal-nav-update.chunk04
            .github/portal-nav-update.chunk05
            .github/portal-nav-update.chunk06
            .github/workflows/portal-nav-audit-apply.yml
          )
          for path in "${removals[@]}"; do
            entries=$(jq -c \
              --arg path "$path" \
              '. + [{path: $path, mode: "100644", type: "blob", sha: null}]' \
              <<< "$entries")
          done

          tree_sha=$(jq -n \
            --arg base "$base_tree" \
            --argjson tree "$entries" \
            '{base_tree: $base, tree: $tree}' \
            | gh api --method POST "repos/$REPOSITORY/git/trees" --input - --jq '.sha')
          echo "created_tree=$tree_sha"
          commit_sha=$(jq -n \
            --arg message 'audit(portal): classify every left-navigation module' \
            --arg tree "$tree_sha" \
            --arg parent "$parent_sha" \
            '{message: $message, tree: $tree, parents: [$parent]}' \
            | gh api --method POST "repos/$REPOSITORY/git/commits" --input - --jq '.sha')
          echo "created_commit=$commit_sha"
          jq -n --arg sha "$commit_sha" '{sha: $sha, force: false}' \
            | gh api --method PATCH "repos/$REPOSITORY/git/refs/heads/$BRANCH" --input - >/dev/null
          echo "published_commit=$commit_sha"
