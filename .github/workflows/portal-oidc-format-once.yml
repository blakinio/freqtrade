name: Portal OIDC Format Once

on:
  push:
    branches:
      - feat/portal-authentik-public-oidc-20260801
    paths:
      - .github/workflows/portal-oidc-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out formatter trigger head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/portal-authentik-public-oidc-20260801
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Apply exact repository Ruff fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.21
          ruff check --fix deploy/synology/portal-oidc/deploy.py
          ruff format deploy/synology/portal-oidc/deploy.py
          ruff check deploy/synology/portal-oidc/deploy.py
          ruff format --check deploy/synology/portal-oidc/deploy.py

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatter produced no changes" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/synology/portal-oidc/deploy.py
          git commit -m "style(portal): apply repository Ruff hooks to deployer"
          git push origin HEAD:feat/portal-authentik-public-oidc-20260801
