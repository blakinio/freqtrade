name: Portal OIDC Mount Syntax Repair Once

on:
  push:
    branches:
      - fix/portal-oidc-docker-mount-rw-20260801

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'blakinio/freqtrade'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Apply exact Docker mount syntax repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          deploy_path = Path("deploy/synology/portal-oidc/deploy.py")
          deploy = deploy_path.read_text(encoding="utf-8")
          old_mount = '        f"type=bind,src={PORTAL_DATA_DIR},dst=/state,rw",\n'
          new_mount = '        f"type=bind,src={PORTAL_DATA_DIR},dst=/state",\n'
          if old_mount in deploy:
              deploy = deploy.replace(old_mount, new_mount, 1)
          elif new_mount not in deploy:
              raise SystemExit("expected control-plane mount target not found")
          deploy_path.write_text(deploy, encoding="utf-8")

          test_path = Path(
              "tests/ai_platform/portal/deployment/test_portal_oidc_public_deploy.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          test_name = "test_control_bind_mount_uses_valid_default_read_write_syntax"
          if test_name not in tests:
              marker = "\ndef test_control_plane_is_internal_and_only_web_is_published() -> None:\n"
              addition = '''

def test_control_bind_mount_uses_valid_default_read_write_syntax() -> None:
    args = module._control_run_args("image", "candidate")
    mount_index = args.index("--mount")
    assert args[mount_index + 1] == (
        f"type=bind,src={module.PORTAL_DATA_DIR},dst=/state"
    )
    assert not args[mount_index + 1].endswith(",rw")
'''
              if marker not in tests:
                  raise SystemExit("expected test insertion marker not found")
              tests = tests.replace(marker, addition + marker, 1)
              test_path.write_text(tests, encoding="utf-8")
          PY
          python3 -m py_compile \
            deploy/synology/portal-oidc/deploy.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_public_deploy.py
          git diff --check

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            deploy/synology/portal-oidc/deploy.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_public_deploy.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(portal): use valid read-write bind mount syntax"
          git push origin HEAD:fix/portal-oidc-docker-mount-rw-20260801
