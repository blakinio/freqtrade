name: Portal Owner Membership Bootstrap

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop
    paths:
      - "deploy/synology/portal-oidc/run-requests/owner-membership-bootstrap-20260801-v1.json"

permissions:
  contents: read

concurrency:
  group: portal-owner-membership-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  REQUEST_PATH: deploy/synology/portal-oidc/run-requests/owner-membership-bootstrap-20260801-v1.json

jobs:
  bootstrap:
    name: Bootstrap exact Portal owner membership
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 15

    steps:
      - name: Checkout exact request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact-one-file frozen owner request
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expected=$'A\tdeploy/synology/portal-oidc/run-requests/owner-membership-bootstrap-20260801-v1.json'
          actual="$(git diff --name-status "$BASE_SHA...$HEAD_SHA")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Owner membership bootstrap must add exactly one frozen request file" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          python3 - "$REQUEST_PATH" "$BASE_SHA" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          base_sha = sys.argv[2]
          request = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "request_id": "portal-authentik-owner-membership-bootstrap-20260801-v1",
              "environment": "synology-staging",
              "runner": "freqtrade-staging",
              "implementation_sha": base_sha,
              "target_username": "akadmin",
              "target_tenant_id": "tenant-local",
              "target_role": "admin",
              "subject_mode": "user_uuid",
              "bootstrap_membership_authorized": True,
              "browser_acceptance_authorized": False,
              "public_ingress_authorized": True,
              "live_capital_authorized": False,
              "restore_authorized": False,
              "secret_values_in_request": False,
          }
          if request != expected:
              raise SystemExit("frozen owner bootstrap request does not match the exact contract")
          PY

      - name: Refuse trading and live-capital credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            if [[ -n "${!name:-}" ]]; then
              echo "Recognized trading credential environment is present: $name" >&2
              exit 1
            fi
          done

      - name: Resolve exact owner subject and bootstrap membership
        id: bootstrap
        continue-on-error: true
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/portal-owner-membership-bootstrap-report.json
          IMPLEMENTATION_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 deploy/synology/portal-oidc/bootstrap_owner_membership.py \
            --repository "$GITHUB_WORKSPACE" \
            --request "$REQUEST_PATH" \
            --expected-repository-sha "$IMPLEMENTATION_SHA" \
            --report "$REPORT_PATH"

      - name: Upload secret-free owner bootstrap report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-owner-membership-bootstrap-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/portal-owner-membership-bootstrap-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish owner bootstrap evidence summary
        if: always()
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/portal-owner-membership-bootstrap-report.json
          ARTIFACT_ID: ${{ steps.upload-report.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-report.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            echo "### Portal exact owner membership bootstrap"
            echo
            echo "- Artifact ID: \`${ARTIFACT_ID:-unavailable}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST:-unavailable}\`"
            if [[ -f "$REPORT_PATH" ]]; then
              python3 - "$REPORT_PATH" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"- Status: `{report.get('status', 'unknown')}`")
          print(f"- Target username: `{report.get('target_username', 'unknown')}`")
          print(f"- Membership created: `{report.get('membership_created', 'unknown')}`")
          print(f"- Audit present: `{report.get('audit_present', False)}`")
          print(f"- Browser acceptance: `{report.get('browser_acceptance', 'unknown')}`")
          print(f"- Secret values recorded: `{report.get('secret_values_recorded', True)}`")
          print(f"- Live capital authorized: `{report.get('live_capital_authorized', True)}`")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce owner bootstrap result
        if: always()
        shell: bash
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          REPORT_PATH: ${{ runner.temp }}/portal-owner-membership-bootstrap-report.json
        run: |
          set -euo pipefail
          if [[ "$BOOTSTRAP_OUTCOME" != "success" ]]; then
            echo "Portal exact owner membership bootstrap failed closed" >&2
            exit 1
          fi
          python3 - "$REPORT_PATH" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          required = {
              "status": "success",
              "target_username": "akadmin",
              "target_tenant_id": "tenant-local",
              "target_role": "admin",
              "subject_mode": "user_uuid",
              "audit_action": "identity.membership_bootstrapped",
              "audit_present": True,
              "browser_acceptance": "explicit_owner_action_required",
              "logout_validation": "explicit_owner_action_required",
              "secret_values_recorded": False,
              "live_capital_authorized": False,
              "restore_authorized": False,
              "public_ingress_authorized": True,
          }
          for key, expected in required.items():
              if report.get(key) != expected:
                  raise SystemExit(f"owner bootstrap report invariant failed: {key}")
          PY
