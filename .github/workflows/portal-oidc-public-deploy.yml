name: Portal Public Authentik OIDC Deploy

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop
    paths:
      - "deploy/synology/portal-oidc/run-requests/public-oidc-20260801-v1.json"

permissions:
  contents: read

concurrency:
  group: portal-public-authentik-oidc-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  REQUEST_PATH: deploy/synology/portal-oidc/run-requests/public-oidc-20260801-v1.json
  SYFT_VERSION: "1.50.0"
  SYFT_LINUX_AMD64_SHA256: "bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788"
  GRYPE_VERSION: "0.116.1"
  GRYPE_LINUX_AMD64_SHA256: "0122df7b655981abe547ad3d2190d65551dac6a2bfc80b4dc2a989b5d0587458"

jobs:
  deploy:
    name: Deploy public Portal OIDC on Synology
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 60

    steps:
      - name: Checkout exact request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact-one-file frozen request
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expected=$'A\tdeploy/synology/portal-oidc/run-requests/public-oidc-20260801-v1.json'
          actual="$(git diff --name-status "$BASE_SHA...$HEAD_SHA")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Public OIDC deployment must add exactly one frozen request file" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          python3 - "$REQUEST_PATH" "$BASE_SHA" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          base_sha = sys.argv[2]
          request = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "implementation_sha": base_sha,
              "portal_origin": "https://quant.molehill.cloud",
              "authentik_origin": "https://auth.molehill.cloud",
              "identity_transport": "https",
              "identity_fixture_mode": "disabled",
              "bootstrap_membership_authorized": False,
              "public_ingress_authorized": True,
              "live_capital_authorized": False,
              "restore_authorized": False,
              "secret_values_in_request": False,
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f"frozen request invariant failed: {key}")
          PY

      - name: Refuse trading and live-capital credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            if [[ -n "${!name:-}" ]]; then
              echo "Recognized trading credential environment is present: $name" >&2
              exit 1
            fi
          done

      - name: Install checksum-pinned Syft and Grype
        shell: bash
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/portal-tools"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/syft.tar.gz"
          echo "${SYFT_LINUX_AMD64_SHA256}  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/syft.tar.gz" \
            --directory "$RUNNER_TEMP/portal-tools" syft
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/grype.tar.gz"
          echo "${GRYPE_LINUX_AMD64_SHA256}  $RUNNER_TEMP/grype.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/grype.tar.gz" \
            --directory "$RUNNER_TEMP/portal-tools" grype
          echo "$RUNNER_TEMP/portal-tools" >> "$GITHUB_PATH"

      - name: Build and approve exact deployment images
        id: supply-chain
        shell: bash
        env:
          IMPLEMENTATION_SHA: ${{ github.event.pull_request.base.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/portal-supply-chain
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python3 tools/agents/portal_supply_chain.py build-verify \
            --repository "$GITHUB_WORKSPACE" \
            --source-sha "$IMPLEMENTATION_SHA" \
            --output-dir "$EVIDENCE_DIR" \
            --approval "$EVIDENCE_DIR/approval.json"
          python3 tools/agents/portal_supply_chain.py verify-approval \
            --approval "$EVIDENCE_DIR/approval.json" \
            --expected-source-sha "$IMPLEMENTATION_SHA"

      - name: Prepare Synology host Portal state directory
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/synology/portal-oidc/prepare_host_state.py \
            --repository "$GITHUB_WORKSPACE"

      - name: Apply provider and deploy public Portal OIDC
        id: deploy
        continue-on-error: true
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/portal-public-authentik-oidc-report.json
          IMPLEMENTATION_SHA: ${{ github.event.pull_request.base.sha }}
          APPROVAL_PATH: ${{ runner.temp }}/portal-supply-chain/approval.json
        run: |
          set -euo pipefail
          # Approved-image wrapper invokes the canonical deployer without rebuilding:
          # python3 deploy/synology/portal-oidc/deploy_entrypoint.py
          python3 tools/agents/portal_supply_chain.py deploy-approved \
            --approved-images "$APPROVAL_PATH" \
            --repository "$GITHUB_WORKSPACE" \
            --request "$REQUEST_PATH" \
            --expected-repository-sha "$IMPLEMENTATION_SHA" \
            --report "$REPORT_PATH"

      - name: Verify authorization-code-only Authentik provider
        id: verify-grants
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/portal-public-authentik-oidc-report.json
        run: |
          set -euo pipefail
          python3 deploy/synology/portal-oidc/verify_provider_grant_types.py \
            --repository "$GITHUB_WORKSPACE" \
            --report "$REPORT_PATH"

      - name: Diagnose discovery and JWKS failure safely
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/synology/portal-oidc/diagnose_discovery.py

      - name: Upload secret-free deployment and supply-chain evidence
        id: upload-report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-public-authentik-oidc-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/portal-public-authentik-oidc-report.json
            ${{ runner.temp }}/portal-supply-chain
          if-no-files-found: error
          retention-days: 30

      - name: Publish deployment evidence summary
        if: always()
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/portal-public-authentik-oidc-report.json
          ARTIFACT_ID: ${{ steps.upload-report.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-report.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            echo "### Portal public Authentik OIDC deployment"
            echo
            echo "- Artifact ID: \`${ARTIFACT_ID:-unavailable}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST:-unavailable}\`"
            if [[ -f "$REPORT_PATH" ]]; then
              python3 - "$REPORT_PATH" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          authentik = report.get("authentik", {})
          supply_chain = report.get("supply_chain", {})
          print(f"- Status: `{report.get('status', 'unknown')}`")
          print(f"- Supply chain: `{supply_chain.get('status', 'unknown')}`")
          print(f"- Rebuilt during deploy: `{supply_chain.get('rebuilt_during_deploy', True)}`")
          print(f"- Grant types: `{authentik.get('grant_types', 'unknown')}`")
          print(f"- Legacy grants disabled: `{authentik.get('legacy_grants_disabled', False)}`")
          print(f"- Identity fixture disabled: `{report.get('identity_fixture_disabled', False)}`")
          print(f"- Membership bootstrap: `{report.get('membership_bootstrap', 'unknown')}`")
          print(f"- Secret values recorded: `{report.get('secret_values_recorded', True)}`")
          print(f"- Live capital authorized: `{report.get('live_capital_authorized', True)}`")
          print(f"- Browser acceptance: `{report.get('browser_acceptance', 'unknown')}`")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          GRANT_TYPES_OUTCOME: ${{ steps.verify-grants.outcome }}
          REPORT_PATH: ${{ runner.temp }}/portal-public-authentik-oidc-report.json
          APPROVAL_PATH: ${{ runner.temp }}/portal-supply-chain/approval.json
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_OUTCOME" != "success" ]]; then
            echo "Public Portal OIDC deployment failed closed" >&2
            exit 1
          fi
          if [[ "$GRANT_TYPES_OUTCOME" != "success" ]]; then
            echo "Authentik grant-type verification failed closed" >&2
            exit 1
          fi
          python3 - "$REPORT_PATH" "$APPROVAL_PATH" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          approval = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          required = {
              "status": "success",
              "identity_fixture_disabled": True,
              "secret_values_recorded": False,
              "live_capital_authorized": False,
              "public_ingress_authorized": True,
              "restore_authorized": False,
              "membership_bootstrap": "explicit_owner_action_required",
          }
          for key, expected in required.items():
              if report.get(key) != expected:
                  raise SystemExit(f"deployment report invariant failed: {key}")
          authentik = report.get("authentik")
          if not isinstance(authentik, dict):
              raise SystemExit("deployment report Authentik section is missing")
          if authentik.get("grant_types") != ["authorization_code"]:
              raise SystemExit("authorization-code grant was not proven")
          if authentik.get("authorization_code_enabled") is not True:
              raise SystemExit("authorization-code grant is not enabled")
          if authentik.get("legacy_grants_disabled") is not True:
              raise SystemExit("legacy Authentik grants are not disabled")
          supply_chain = report.get("supply_chain")
          if not isinstance(supply_chain, dict):
              raise SystemExit("deployment report supply-chain section is missing")
          if supply_chain.get("status") != "approved_exact_images":
              raise SystemExit("approved exact images were not proven")
          if supply_chain.get("rebuilt_during_deploy") is not False:
              raise SystemExit("deployment rebuilt images after approval")
          portal = report.get("portal", {})
          expected_images = {
              "control_plane_image_id": approval["images"]["control-plane"]["digest"],
              "web_image_id": approval["images"]["web"]["digest"],
          }
          for key, expected in expected_images.items():
              if portal.get(key) != expected:
                  raise SystemExit(f"deployed image digest mismatch: {key}")
          PY
