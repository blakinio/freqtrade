name: Portal OIDC State Bind Repair PR Trigger

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop
    paths:
      - .github/workflows/portal-oidc-state-bind-repair-pr-trigger.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/portal-oidc-synology-state-bind-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/portal-oidc-synology-state-bind-20260801
          persist-credentials: true
          fetch-depth: 0

      - name: Apply host-visible state and diagnostics repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path


          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label} matched {count} times instead of once")
              return source.replace(old, new)


          deploy_path = Path("deploy/synology/portal-oidc/deploy.py")
          deploy = deploy_path.read_text(encoding="utf-8")
          deploy = replace_once(
              deploy,
              'PORTAL_DATA_DIR = PORTAL_STATE_DIR / "data"\n',
              (
                  'PORTAL_DATA_DIR = Path("/volume1/docker/freqtrade-portal-oidc/data")\n'
                  "PORTAL_UID = 10001\n"
                  "PORTAL_GID = 10001\n"
              ),
              "Portal data path",
          )
          deploy = replace_once(
              deploy,
              (
                  '        detail = (result.stderr or result.stdout).strip().splitlines()[-1:] or ["no output"]\n'
                  '        rendered = " ".join(command)\n'
                  '        raise DeploymentError(f"command failed ({result.returncode}): {rendered}: {detail[0]}")\n'
              ),
              (
                  "        output = result.stderr or result.stdout\n"
                  "        lines = [line.strip() for line in output.splitlines() if line.strip()]\n"
                  '        detail = " | ".join(lines[:3]) if lines else "no output"\n'
                  "        if len(detail) > 1000:\n"
                  '            detail = f"{detail[:997]}..."\n'
                  '        rendered = " ".join(command)\n'
                  '        raise DeploymentError(f"command failed ({result.returncode}): {rendered}: {detail}")\n'
              ),
              "Docker diagnostics",
          )
          deploy = replace_once(
              deploy,
              (
                  "    _write_env_atomic(PORTAL_RUNTIME_ENV, values)\n"
                  "    PORTAL_DATA_DIR.mkdir(parents=True, exist_ok=True)\n"
              ),
              (
                  "    _write_env_atomic(PORTAL_RUNTIME_ENV, values)\n"
                  "    PORTAL_DATA_DIR.mkdir(parents=True, exist_ok=True)\n"
                  "    os.chown(PORTAL_DATA_DIR, PORTAL_UID, PORTAL_GID)\n"
                  "    PORTAL_DATA_DIR.chmod(0o700)\n"
              ),
              "Portal data ownership",
          )
          deploy = replace_once(
              deploy,
              (
                  "def _control_run_args(image: str, name: str) -> list[str]:\n"
                  "    uid = str(os.getuid())\n"
                  "    gid = str(os.getgid())\n"
                  "    return [\n"
              ),
              (
                  "def _control_run_args(image: str, name: str) -> list[str]:\n"
                  "    return [\n"
              ),
              "Control-plane runtime identity",
          )
          deploy = replace_once(
              deploy,
              '        f"{uid}:{gid}",\n',
              '        f"{PORTAL_UID}:{PORTAL_GID}",\n',
              "Control-plane user argument",
          )
          deploy_path.write_text(deploy, encoding="utf-8")

          unit_path = Path("tests/ai_platform/portal/deployment/test_portal_oidc_public_deploy.py")
          unit = unit_path.read_text(encoding="utf-8")
          unit = replace_once(
              unit,
              "def test_blueprint_has_exact_public_provider_scopes_and_redirect() -> None:\n",
              (
                  "def test_run_preserves_actionable_nonsensitive_error(monkeypatch) -> None:\n"
                  "    def fake_run(*_args, **_kwargs):\n"
                  "        return module.subprocess.CompletedProcess(\n"
                  '            args=["docker", "run"],\n'
                  "            returncode=125,\n"
                  '            stdout="",\n'
                  "            stderr=(\n"
                  '                "docker: invalid mount config for type bind: source path does not exist\\n"\n'
                  '                "Run \'docker run --help\' for more information\\n"\n'
                  "            ),\n"
                  "        )\n"
                  "\n"
                  '    monkeypatch.setattr(module.subprocess, "run", fake_run)\n'
                  '    with pytest.raises(module.DeploymentError, match="source path does not exist"):\n'
                  '        module._run(["docker", "run", "redacted-image"])\n'
                  "\n"
                  "\n"
                  "def test_blueprint_has_exact_public_provider_scopes_and_redirect() -> None:\n"
              ),
              "Diagnostic regression test insertion",
          )
          unit = replace_once(
              unit,
              (
                  '    assert module.ISSUER == "https://auth.molehill.cloud/application/o/freqtrade-portal/"\n'
                  '    assert "0o600" in source\n'
              ),
              (
                  '    assert module.ISSUER == "https://auth.molehill.cloud/application/o/freqtrade-portal/"\n'
                  '    assert module.PORTAL_DATA_DIR == Path("/volume1/docker/freqtrade-portal-oidc/data")\n'
                  "    assert module.PORTAL_UID == 10001\n"
                  "    assert module.PORTAL_GID == 10001\n"
                  '    assert "os.chown(PORTAL_DATA_DIR, PORTAL_UID, PORTAL_GID)" in source\n'
                  '    assert \'f"{PORTAL_UID}:{PORTAL_GID}"\' in source\n'
                  '    assert "os.getuid()" not in source\n'
                  '    assert "os.getgid()" not in source\n'
                  '    assert \'detail = " | ".join(lines[:3])\' in source\n'
                  '    assert "0o600" in source\n'
              ),
              "Hardening regression assertions",
          )
          unit_path.write_text(unit, encoding="utf-8")

          integration_path = Path("tests/ai_platform_integration/test_portal_synology_auth_probe.py")
          integration = integration_path.read_text(encoding="utf-8")
          integration = replace_once(
              integration,
              (
                  '    assert "PORTAL_IDENTITY_TRANSPORT_MODE=https" in script\n'
                  '    assert "PORTAL_CONTROL_PLANE_URL=http://" in script\n'
              ),
              (
                  '    assert "PORTAL_IDENTITY_TRANSPORT_MODE=https" in script\n'
                  '    assert \'PORTAL_DATA_DIR = Path("/volume1/docker/freqtrade-portal-oidc/data")\' in script\n'
                  '    assert "PORTAL_UID = 10001" in script\n'
                  '    assert "PORTAL_GID = 10001" in script\n'
                  '    assert "os.getuid()" not in script\n'
                  '    assert "os.getgid()" not in script\n'
                  '    assert "PORTAL_CONTROL_PLANE_URL=http://" in script\n'
              ),
              "Integration state-bind assertions",
          )
          integration_path.write_text(integration, encoding="utf-8")
          PY

      - name: Apply formatting and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check ruff==0.15.21 pytest==8.4.2
          ruff check --fix \
            deploy/synology/portal-oidc/deploy.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_public_deploy.py \
            tests/ai_platform_integration/test_portal_synology_auth_probe.py
          ruff format \
            deploy/synology/portal-oidc/deploy.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_public_deploy.py \
            tests/ai_platform_integration/test_portal_synology_auth_probe.py
          pytest -q \
            --confcutdir=tests/ai_platform/portal/deployment \
            tests/ai_platform/portal/deployment/test_portal_oidc_public_deploy.py
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            deploy/synology/portal-oidc/deploy.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_public_deploy.py \
            tests/ai_platform_integration/test_portal_synology_auth_probe.py
          git commit -m "fix(portal): use Synology host-visible OIDC state bind"
          git push origin HEAD:fix/portal-oidc-synology-state-bind-20260801
