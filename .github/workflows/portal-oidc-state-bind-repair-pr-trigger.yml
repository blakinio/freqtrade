name: Portal OIDC State Bind Repair PR Trigger

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop
    paths:
      - .github/workflows/portal-oidc-state-bind-repair-pr-trigger.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/portal-oidc-synology-state-bind-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/portal-oidc-synology-state-bind-20260801
          persist-credentials: true
          fetch-depth: 0

      - name: Execute the frozen repair payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/portal-oidc-state-bind-repair-once.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          payload = text[start:end]
          code = "\n".join(
              line.removeprefix("          ") for line in payload.splitlines()
          )
          exec(compile(code, str(workflow), 'exec'))
          PY

      - name: Apply formatting and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check ruff==0.15.21 pytest==8.4.2
          ruff check --fix \
            deploy/synology/portal-oidc/deploy.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_public_deploy.py \
            tests/ai_platform_integration/test_portal_synology_auth_probe.py
          ruff format \
            deploy/synology/portal-oidc/deploy.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_public_deploy.py \
            tests/ai_platform_integration/test_portal_synology_auth_probe.py
          pytest -q tests/ai_platform/portal/deployment/test_portal_oidc_public_deploy.py
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            deploy/synology/portal-oidc/deploy.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_public_deploy.py \
            tests/ai_platform_integration/test_portal_synology_auth_probe.py
          git commit -m "fix(portal): use Synology host-visible OIDC state bind"
          git push origin HEAD:fix/portal-oidc-synology-state-bind-20260801
