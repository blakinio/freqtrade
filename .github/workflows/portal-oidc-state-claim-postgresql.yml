name: Portal OIDC State Claim PostgreSQL

on:
  pull_request:
    paths:
      - "ai_platform/portal/identity/**"
      - ".github/workflows/portal-oidc-state-claim-postgresql.yml"
  push:
    branches:
      - develop
    paths:
      - "ai_platform/portal/identity/**"
      - ".github/workflows/portal-oidc-state-claim-postgresql.yml"

permissions:
  contents: read

concurrency:
  group: "portal-oidc-state-claim-postgresql-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  independent-connections:
    name: PostgreSQL independent-connection claim probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: docker.io/library/postgres:16.13-alpine3.23@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: portal_claim
          POSTGRES_USER: portal_claim
          POSTGRES_PASSWORD: ci-only-synthetic-portal-claim-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_claim -d portal_claim"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install bounded validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r deploy/synology/portal-oidc/requirements.txt
          "psycopg[binary]==3.3.4"

      - name: Prove exactly one PostgreSQL claim owner
        env:
          PORTAL_TEST_POSTGRES_URL: postgresql+psycopg://portal_claim:ci-only-synthetic-portal-claim-password@127.0.0.1:5432/portal_claim
          REPORT_PATH: artifacts/postgresql-oidc-state-claim.json
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from datetime import UTC, datetime, timedelta
          from json import dumps
          from os import environ
          from pathlib import Path
          from threading import Barrier
          from uuid import uuid4

          from ai_platform.portal.control_plane.database import (
              build_engine,
              build_session_factory,
          )
          from ai_platform.portal.identity.models import OidcLoginFlowRow
          from ai_platform.portal.identity.repository import (
              IdentityNotFoundError,
              IdentityRepository,
          )


          database_url = environ["PORTAL_TEST_POSTGRES_URL"]
          report_path = Path(environ["REPORT_PATH"])
          engine = build_engine(database_url)
          session_factory = build_session_factory(engine)
          OidcLoginFlowRow.__table__.create(engine, checkfirst=True)

          now = datetime(2026, 8, 3, 12, 0, tzinfo=UTC)
          state_hash = f"postgresql-claim-{uuid4().hex}"
          with session_factory() as session:
              IdentityRepository(session).store_login_flow(
                  state_hash=state_hash,
                  nonce="synthetic-nonce",
                  verifier_ciphertext="synthetic-ciphertext",
                  requested_tenant_id="synthetic-tenant",
                  return_to="/bots",
                  created_at=now,
                  expires_at=now + timedelta(minutes=10),
              )
              session.commit()

          start = Barrier(2)

          def claim() -> str:
              with session_factory() as session:
                  session.connection()
                  start.wait(timeout=5)
                  try:
                      IdentityRepository(session).consume_login_flow(state_hash, now)
                      session.commit()
                      return "claimed"
                  except IdentityNotFoundError:
                      session.rollback()
                      return "rejected"

          try:
              with ThreadPoolExecutor(max_workers=2) as executor:
                  outcomes = tuple(executor.map(lambda _: claim(), range(2)))

              assert sorted(outcomes) == ["claimed", "rejected"]
              with session_factory() as session:
                  row = session.get(OidcLoginFlowRow, state_hash)
                  assert row is not None
                  assert row.consumed_at is not None
                  session.delete(row)
                  session.commit()

              report_path.write_text(
                  dumps(
                      {
                          "database": "postgresql",
                          "independent_connections": 2,
                          "outcomes": sorted(outcomes),
                          "durable_claim_count": 1,
                          "raw_state_recorded": False,
                          "secret_values_recorded": False,
                          "live_capital_authorized": False,
                      },
                      sort_keys=True,
                  ),
                  encoding="utf-8",
              )
          finally:
              engine.dispose()
          PY

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/postgresql-oidc-state-claim.json").read_text(encoding="utf-8")
          )
          assert payload == {
              "database": "postgresql",
              "durable_claim_count": 1,
              "independent_connections": 2,
              "live_capital_authorized": False,
              "outcomes": ["claimed", "rejected"],
              "raw_state_recorded": False,
              "secret_values_recorded": False,
          }
          PY

      - name: Upload value-free PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-oidc-state-claim-postgresql-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/postgresql-oidc-state-claim.json
          if-no-files-found: error
          retention-days: 14
