name: Portal OIDC Test Migration Once

on:
  push:
    branches:
      - feat/portal-authentik-public-oidc-20260801
    paths:
      - .github/workflows/portal-oidc-test-migration-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/portal-authentik-public-oidc-20260801
          persist-credentials: true
          fetch-depth: 0

      - name: Replace retired fixture tests with public OIDC contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          portal_probe = Path("tests/ai_platform_integration/test_portal_synology_auth_probe.py")
          portal_probe.write_text(
              '''from pathlib import Path


          REPO_ROOT = Path(__file__).resolve().parents[2]
          DEPLOY_SCRIPT = REPO_ROOT / "deploy" / "synology" / "portal-oidc" / "deploy.py"
          WORKFLOW = REPO_ROOT / ".github" / "workflows" / "portal-oidc-public-deploy.yml"
          BLUEPRINT = (
              REPO_ROOT
              / "deploy"
              / "synology"
              / "portal-oidc"
              / "blueprints"
              / "freqtrade-portal-public.yaml"
          )


          def test_deploy_probe_requires_public_https_authorization_boundary() -> None:
              script = DEPLOY_SCRIPT.read_text(encoding="utf-8")

              assert 'PORTAL_ORIGIN = "https://quant.molehill.cloud"' in script
              assert 'AUTHENTIK_ORIGIN = "https://auth.molehill.cloud"' in script
              assert "def _probe_web_login" in script
              assert "def _probe_public_portal" in script
              assert "class NoRedirect" in script
              assert 'parsed.scheme != "https"' in script
              assert 'parsed.netloc != "auth.molehill.cloud"' in script
              assert "public Portal login did not redirect to public Authen­tik" in script


          def test_deploy_disables_fixture_and_keeps_control_plane_internal() -> None:
              script = DEPLOY_SCRIPT.read_text(encoding="utf-8")
              control_section = script[
                  script.index("def _control_run_args") : script.index("def _start_control_candidate")
              ]
              web_section = script[
                  script.index("def _web_run_args") : script.index("def _probe_web_login")
              ]

              assert "PORTAL_IDENTITY_FIXTURE_MODE=disabled" in script
              assert "PORTAL_IDENTITY_TRANSPORT_MODE=https" in script
              assert "PORTAL_CONTROL_PLANE_URL=http://" in script
              assert "--publish" not in control_section
              assert "--publish" in web_section
              assert '"--read-only"' in script
              assert '"--cap-drop"' in script
              assert "no-new-privileges:true" in script
              assert "dst={LIQUIDATIONS_CONTAINER_ROOT},readonly" in script
              assert '"unless-stopped"' in script


          def test_workflow_and_blueprint_enforce_public_secret_free_oidc() -> None:
              workflow = WORKFLOW.read_text(encoding="utf-8")
              blueprint = BLUEPRINT.read_text(encoding="utf-8")

              assert "runs-on: [freqtrade-staging]" in workflow
              assert "environment: synology-staging" in workflow
              assert "git diff --name-status" in workflow
              assert "public-oidc-20260801-v1.json" in workflow
              assert '"bootstrap_membership_authorized": False' in workflow
              assert '"secret_values_in_request": False' in workflow
              assert '"live_capital_authorized": False' in workflow
              assert "if: always()" in workflow
              assert "https://quant.molehill.cloud/api/identity/callback" in blueprint
              assert "client_secret:" not in blueprint
              assert "PORTAL_IDENTITY_FIXTURE_MODE=enabled" not in workflow
          ''',
              encoding="utf-8",
          )

          notifications = Path(
              "tests/ai_platform_integration/test_liquidation_alert_notifications.py"
          )
          source = notifications.read_text(encoding="utf-8")
          old = '''def test_portal_restart_contract_is_persistent_without_weakened_security() -> None:
              from pathlib import Path

              root = Path(__file__).resolve().parents[2]
              proof = (root / "deploy" / "synology" / "portal" / "prove-liquidations-live.sh").read_text(
                  encoding="utf-8"
              )
              deployment = (root / "deploy" / "synology" / "portal" / "deploy-preview.sh").read_text(
                  encoding="utf-8"
              )
              repair = (root / ".github" / "workflows" / "repair-synology-autostart.yml").read_text(
                  encoding="utf-8"
              )

              assert 'test "$portal_restart" = "always"' in proof
              assert 'test "$portal_restart" = "unless-stopped"' not in proof
              assert '"$container_name" "$image" "$bind_address" "$portal_port" always' in deployment
              assert "unless-stopped" not in deployment
              assert "workflow_run:" not in repair
              assert "--read-only" in proof
              assert "--cap-drop ALL" in proof
              assert "--security-opt no-new-privileges:true" in proof
              assert "dst=${liquidations_container_root},readonly" in proof
              assert 'test -z "$candidate_docker_socket_mount"' in proof
          '''
          new = '''def test_portal_restart_contract_is_persistent_without_weakened_security() -> None:
              from pathlib import Path

              root = Path(__file__).resolve().parents[2]
              proof = (root / "deploy" / "synology" / "portal" / "prove-liquidations-live.sh").read_text(
                  encoding="utf-8"
              )
              deployment = (root / "deploy" / "synology" / "portal-oidc" / "deploy.py").read_text(
                  encoding="utf-8"
              )
              repair = (root / ".github" / "workflows" / "repair-synology-autostart.yml").read_text(
                  encoding="utf-8"
              )

              assert 'test "$portal_restart" = "unless-stopped"' in proof
              assert 'test "$portal_restart" = "always"' not in proof
              assert '"unless-stopped"' in deployment
              assert '"--restart"' in deployment
              assert "workflow_run:" not in repair
              assert "--read-only" in proof
              assert "--cap-drop ALL" in proof
              assert "--security-opt no-new-privileges:true" in proof
              assert "dst=${liquidations_container_root},readonly" in proof
              assert 'test -z "$candidate_docker_socket_mount"' in proof
              assert '"--read-only"' in deployment
              assert '"--cap-drop"' in deployment
              assert "no-new-privileges:true" in deployment
          '''
          if source.count(old) != 1:
              raise SystemExit("retired restart-contract test block did not match exactly once")
          notifications.write_text(source.replace(old, new), encoding="utf-8")

          proof = Path("deploy/synology/portal/prove-liquidations-live.sh")
          proof_source = proof.read_text(encoding="utf-8")
          old_restart = 'test "$portal_restart" = "always"'
          new_restart = 'test "$portal_restart" = "unless-stopped"'
          if proof_source.count(old_restart) != 1:
              raise SystemExit("production restart assertion did not match exactly once")
          proof.write_text(proof_source.replace(old_restart, new_restart), encoding="utf-8")
          PY

      - name: Validate focused migrated tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tests/ai_platform_integration/test_portal_synology_auth_probe.py
          git diff --check

      - name: Commit migrated contract tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/ai_platform_integration/test_portal_synology_auth_probe.py \
            tests/ai_platform_integration/test_liquidation_alert_notifications.py \
            deploy/synology/portal/prove-liquidations-live.sh
          git commit -m "test(portal): migrate fixture deployment assertions to public OIDC"
          git push origin HEAD:feat/portal-authentik-public-oidc-20260801
