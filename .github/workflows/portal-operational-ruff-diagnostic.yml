name: Portal Operational Ruff Diagnostic

on:
  pull_request:
    paths:
      - "ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/portal-operational-ruff-diagnostic.yml"

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21 >/dev/null 2>&1
      - name: Capture Ruff output
        run: ruff check ai_platform tests/ai_platform > /tmp/ruff.txt 2>&1 || true
      - name: Upload Ruff output
        uses: actions/upload-artifact@v4
        with:
          name: portal-operational-ruff-output
          path: /tmp/ruff.txt
