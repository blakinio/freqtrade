name: Portal P10 Final Format Bootstrap

on:
  pull_request:
    paths:
      - "ai_platform/portal/simulator/**"
      - "tests/ai_platform/portal/simulator/**"
      - ".github/workflows/portal-p10-final-format-bootstrap.yml"

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor == 'blakinio' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - name: Format P10 paths
        run: ruff format ai_platform/portal/simulator tests/ai_platform/portal/simulator
      - name: Commit formatter output
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/portal/simulator tests/ai_platform/portal/simulator
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(ai-platform): format final P10 simulator E2E"
          git push origin "HEAD:${HEAD_REF}"
