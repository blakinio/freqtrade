name: Portal P11 Ruff Diagnostic

on:
  pull_request:
    paths:
      - "ai_platform/portal/deploy/cloudflare/**"
      - "tests/ai_platform/portal/deploy/cloudflare/**"
      - ".github/workflows/portal-p11-ruff-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Capture Ruff output
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.21
          set +e
          ruff check ai_platform tests/ai_platform --output-format=full > /tmp/ruff.log 2>&1
          status=$?
          echo "$status" > /tmp/ruff.exit
          cat /tmp/ruff.log
          exit "$status"
      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portal-p11-ruff-diagnostic
          path: |
            /tmp/ruff.log
            /tmp/ruff.exit
          if-no-files-found: error
          retention-days: 1
