name: Portal P7 Precommit Diagnostic

on:
  pull_request:
    paths:
      - "ai_platform/portal/risk/**"
      - "tests/ai_platform/portal/risk/**"
      - "docs/ai_platform/portal/RISK_ENGINE_FOUNDATION.md"
      - "docs/agents/tasks/FTAI-20260722-portal-p7-risk-terminal.md"
      - ".github/workflows/portal-p7-precommit-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Capture pre-commit output
        continue-on-error: true
        run: |
          python -m pip install pre-commit
          set +e
          pre-commit run --all-files --show-diff-on-failure --color=never > /tmp/precommit.log 2>&1
          status=$?
          echo "$status" > /tmp/precommit.exit
          cat /tmp/precommit.log
          exit "$status"

      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portal-p7-precommit-diagnostic
          path: |
            /tmp/precommit.log
            /tmp/precommit.exit
          if-no-files-found: error
          retention-days: 1
