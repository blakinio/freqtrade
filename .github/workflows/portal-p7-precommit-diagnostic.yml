name: Portal P7 Mypy Alias Bootstrap

on:
  pull_request:
    paths:
      - "ai_platform/portal/risk/service.py"
      - ".github/workflows/portal-p7-precommit-diagnostic.yml"

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor == 'blakinio' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply exact TypeAlias fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/portal/risk/service.py")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              "from decimal import Decimal\nfrom uuid import uuid4\n",
              "from decimal import Decimal\nfrom typing import TypeAlias\nfrom uuid import uuid4\n",
          )
          content = content.replace(
              "RiskEvaluationResult = ApprovedExecutionIntent | RejectedExecutionIntent",
              "RiskEvaluationResult: TypeAlias = ApprovedExecutionIntent | RejectedExecutionIntent",
          )
          path.write_text(content, encoding="utf-8")
          PY

      - name: Commit exact fix
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/portal/risk/service.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(ai-platform): mark P7 risk result union as type alias"
          git push origin "HEAD:${HEAD_REF}"
