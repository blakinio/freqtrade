name: Portal P7 Terminal Format Bootstrap

on:
  pull_request:
    paths:
      - "ai_platform/portal/risk/terminal.py"
      - "ai_platform/portal/control_plane/api.py"
      - "tests/ai_platform/portal/risk/test_terminal.py"
      - "tests/ai_platform/portal/control_plane/test_api.py"
      - ".github/workflows/portal-p7-terminal-format-bootstrap.yml"

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor == 'blakinio' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - name: Fix and format terminal Python
        run: |
          ruff check --fix --exit-zero ai_platform/portal/risk/terminal.py ai_platform/portal/control_plane/api.py tests/ai_platform/portal/risk/test_terminal.py tests/ai_platform/portal/control_plane/test_api.py
          ruff format ai_platform/portal/risk/terminal.py ai_platform/portal/control_plane/api.py tests/ai_platform/portal/risk/test_terminal.py tests/ai_platform/portal/control_plane/test_api.py
      - name: Commit output
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/portal/risk/terminal.py ai_platform/portal/control_plane/api.py tests/ai_platform/portal/risk/test_terminal.py tests/ai_platform/portal/control_plane/test_api.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(ai-platform): normalize P7 terminal Python"
          git push origin "HEAD:${HEAD_REF}"
