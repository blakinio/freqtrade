name: Portal P8 Format Bootstrap
on:
  pull_request:
    paths:
      - "ai_platform/portal/intelligence/**"
      - "tests/ai_platform/portal/intelligence/**"
      - ".github/workflows/portal-p8-format-bootstrap.yml"
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.actor == 'blakinio' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - run: |
          ruff check --fix --exit-zero ai_platform/portal/intelligence tests/ai_platform/portal/intelligence
          ruff format ai_platform/portal/intelligence tests/ai_platform/portal/intelligence
      - env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/portal/intelligence tests/ai_platform/portal/intelligence
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(ai-platform): normalize P8 trade intelligence"
          git push origin "HEAD:${HEAD_REF}"
