name: Portal P9 Ruff Diagnostic
on:
  pull_request:
    paths:
      - "ai_platform/portal/learning/**"
      - "tests/ai_platform/portal/learning/**"
      - ".github/workflows/portal-p9-ruff-diagnostic.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - run: |
          set +e
          ruff check ai_platform/portal/learning tests/ai_platform/portal/learning --output-format concise > /tmp/ruff.log 2>&1
          echo $? > /tmp/ruff.exit
          cat /tmp/ruff.log
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portal-p9-ruff-diagnostic
          path: |
            /tmp/ruff.log
            /tmp/ruff.exit
          if-no-files-found: error
          retention-days: 1
