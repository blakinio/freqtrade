name: Portal PI-06 Emulated Target Acceptance

on:
  pull_request:
    paths:
      - "deploy/synology/portal-authentik/compose.emulated.yml"
      - "deploy/synology/portal-authentik/emulated_acceptance.sh"
      - "deploy/synology/portal-authentik/emulated-acceptance-contract-v1.json"
      - "tests/ai_platform/portal/deployment/test_pi06_emulated_target_acceptance.py"
      - "docs/ai_platform/portal/runbooks/PI06_EMULATED_TARGET_ACCEPTANCE.md"
      - "docs/agents/tasks/FTAI-20260729-portal-pi06-emulated-target-acceptance.md"
      - ".github/workflows/portal-pi06-emulated-target-acceptance.yml"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulated-authentik-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Create deterministic emulated runtime
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/portal-authentik-emulated.env" <<'ENV'
          AUTHENTIK_IMAGE=docker.io/authentik/server:2026.5.5@sha256:50a833c48a714709f15d4f8846ec6b81a41d0d6a6bd2975087dfed3000d0d72e
          POSTGRES_IMAGE=docker.io/library/postgres:16.13-alpine3.23@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          AUTHENTIK_POSTGRESQL__NAME=authentik
          AUTHENTIK_POSTGRESQL__USER=authentik
          AUTHENTIK_POSTGRESQL__PASSWORD=ci-only-synthetic-postgresql-password-000000000000
          AUTHENTIK_SECRET_KEY=ci-only-synthetic-authentik-secret-key-000000000000000000000000
          AUTHENTIK_BIND_ADDRESS=127.0.0.1
          AUTHENTIK_HTTP_PORT=19000
          AUTHENTIK_BOOTSTRAP_PASSWORD_HASH=
          ENV
          chmod 600 "$RUNNER_TEMP/portal-authentik-emulated.env"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff==0.15.21

      - name: Validate acceptance contract
        run: |
          ruff check tests/ai_platform/portal/deployment/test_pi06_emulated_target_acceptance.py
          ruff format --check --diff tests/ai_platform/portal/deployment/test_pi06_emulated_target_acceptance.py
          python -m pytest -q -o addopts='' \
            --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/deployment/test_authentik_synology_deployment.py \
            tests/ai_platform/portal/deployment/test_pi06_emulated_target_acceptance.py

      - name: Run real-container emulation
        env:
          ENV_FILE: ${{ runner.temp }}/portal-authentik-emulated.env
          REPORT_FILE: ${{ runner.temp }}/pi06-emulated-acceptance.json
          PI06_EMULATED_RESOURCE_PREFIX: pi06_${{ github.run_id }}_${{ github.run_attempt }}
        run: sh deploy/synology/portal-authentik/emulated_acceptance.sh

      - name: Upload bounded acceptance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pi06-emulated-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pi06-emulated-acceptance.json
          if-no-files-found: error
          retention-days: 14

  emulated-portal-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ai_platform/portal/web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run identity and MFA policy emulation
        env:
          PORTAL_WEB_DATA_MODE: fixture
          PORTAL_ENVIRONMENT: test
          PORTAL_IDENTITY_FIXTURE_MODE: enabled
        run: npx playwright test e2e/specs/security/identity-session.spec.ts --project=chromium-desktop

      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pi06-identity-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: ai_platform/portal/web/artifacts
          if-no-files-found: ignore
          retention-days: 7
