name: Portal Schema Integrity

on:
  pull_request:
    paths:
      - "ai_platform/portal/**"
      - "deploy/**"
      - "tests/ai_platform/portal/**"
      - "tests/ai_platform_integration/**"
      - "tools/portal_schema/**"
      - "docs/ai_platform/portal/**"
      - "docs/agents/tasks/active/FTAI-20260803-portal-remediation-1122.md"
      - ".github/workflows/portal-schema-integrity.yml"
  push:
    branches:
      - develop
    paths:
      - "ai_platform/portal/**"
      - "deploy/**"
      - "tests/ai_platform/portal/**"
      - "tests/ai_platform_integration/**"
      - "tools/portal_schema/**"
      - "docs/ai_platform/portal/**"
      - ".github/workflows/portal-schema-integrity.yml"

permissions:
  contents: read

concurrency:
  group: "portal-schema-integrity-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  inventory:
    name: Deterministic ORM and migration inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install bounded Portal dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r deploy/synology/portal-oidc/requirements.txt

      - name: Generate deterministic schema inventory
        env:
          PYTHONPATH: .:ai_platform
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/portal_schema/inventory.py \
            tools/portal_schema/model_provenance.py
          python tools/portal_schema/inventory.py \
            --output artifacts/portal-schema-inventory.json
          python tools/portal_schema/model_provenance.py \
            > artifacts/portal-schema-model-provenance.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/portal-schema-inventory.json").read_text(encoding="utf-8")
          )
          provenance = json.loads(
              Path("artifacts/portal-schema-model-provenance.json").read_text(
                  encoding="utf-8"
              )
          )
          assert payload["format_version"] == 1
          assert payload["orm"]["table_count"] == 41
          assert payload["migrations"]["table_count"] == 41
          assert payload["drift"] == {
              "duplicate_migration_owners": {},
              "migration_without_orm": [],
              "orm_without_migration": [],
          }
          assert payload["create_all_calls"] == []
          assert set(payload["orm"]["tables"]) == set(provenance)
          assert payload["safety"] == {
              "live_capital_authorized": False,
              "protected_production_mutated": False,
              "secret_values_recorded": False,
          }
          PY

      - name: Upload secret-free schema inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-schema-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/portal-schema-inventory.json
            artifacts/portal-schema-model-provenance.json
          if-no-files-found: error
          retention-days: 14

  sqlite-integrity:
    name: SQLite semantic parity and fail-closed readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install bounded test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r deploy/synology/portal-oidc/requirements.txt
          pytest==8.4.1

      - name: Run SQLite schema authority tests
        env:
          PYTHONPATH: .:ai_platform
        run: |
          set -euo pipefail
          pytest -q \
            tests/ai_platform/portal/control_plane/test_database_integrity.py \
            tests/ai_platform/portal/database/test_schema_authority.py

  postgresql-integrity:
    name: PostgreSQL concurrency, rollback and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: docker.io/library/postgres:16.13-alpine3.23@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: portal_schema
          POSTGRES_USER: portal_schema
          POSTGRES_PASSWORD: ci-only-synthetic-schema-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_schema -d portal_schema"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install bounded test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r deploy/synology/portal-oidc/requirements.txt
          pytest==8.4.1

      - name: Prove PostgreSQL migration and recovery boundaries
        env:
          PYTHONPATH: .:ai_platform
          PORTAL_TEST_POSTGRES_URL: postgresql+psycopg://portal_schema:ci-only-synthetic-schema-password@127.0.0.1:5432/portal_schema
        run: |
          set -euo pipefail
          pytest -q tests/ai_platform/portal/database/test_schema_postgresql.py

      - name: Create source schema for backup and restore
        env:
          PYTHONPATH: .:ai_platform
          PORTAL_DATABASE_URL: postgresql+psycopg://portal_schema:ci-only-synthetic-schema-password@127.0.0.1:5432/portal_schema
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m ai_platform.portal.database.cli migrate \
            --output artifacts/postgresql-source-readiness.json

      - name: Prove backup and restore revision integrity
        env:
          PGPASSWORD: ci-only-synthetic-schema-password
          PYTHONPATH: .:ai_platform
        run: |
          set -euo pipefail
          pg_dump \
            --host 127.0.0.1 \
            --username portal_schema \
            --format custom \
            --file artifacts/portal-schema.backup \
            portal_schema
          createdb \
            --host 127.0.0.1 \
            --username portal_schema \
            portal_schema_restore
          pg_restore \
            --host 127.0.0.1 \
            --username portal_schema \
            --dbname portal_schema_restore \
            --no-owner \
            --exit-on-error \
            artifacts/portal-schema.backup
          PORTAL_DATABASE_URL="postgresql+psycopg://portal_schema:ci-only-synthetic-schema-password@127.0.0.1:5432/portal_schema_restore" \
            python -m ai_platform.portal.database.cli check \
            --output artifacts/postgresql-restored-readiness.json

      - name: Upload secret-free PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-schema-postgresql-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/postgresql-source-readiness.json
            artifacts/postgresql-restored-readiness.json
          if-no-files-found: error
          retention-days: 14

  branch-repair:
    name: One-shot exact-head branch repair
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/portal-1122-migration-schema-integrity'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout producer branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/portal-1122-migration-schema-integrity
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version: "3.13"

      - name: Apply semantic repairs and restore workflow surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "ai_platform/portal/control_plane/service.py",
              "                self._repository.add_bot(session, bot)\n                self._repository.add_revision(session, revision)",
              "                self._repository.add_bot(session, bot)\n                session.flush()\n                self._repository.add_revision(session, revision)",
          )
          replace_once(
              "ai_platform/portal/database/schema.py",
              "from datetime import datetime, timezone",
              "from datetime import UTC, datetime",
          )
          replace_once(
              "ai_platform/portal/database/schema.py",
              "None if column.server_default is None else column.server_default.arg",
              "None\n                if column.server_default is None\n                else getattr(column.server_default, \"arg\", column.server_default)",
          )
          replace_once(
              "ai_platform/portal/database/schema.py",
              "datetime.now(timezone.utc)",
              "datetime.now(UTC)",
          )
          replace_once(
              "tests/ai_platform/portal/database/test_schema_postgresql.py",
              "from __future__ import annotations\n\nimport os",
              "from __future__ import annotations\n\nimport os\nfrom collections.abc import Iterator",
          )
          replace_once(
              "tests/ai_platform/portal/database/test_schema_postgresql.py",
              "def clean_postgres_schema() -> None:",
              "def clean_postgres_schema() -> Iterator[None]:",
          )
          PY
          rm -f .github/workflows/portal-1122-autofix.yml
          git checkout HEAD^ -- .github/workflows/portal-schema-integrity.yml

      - name: Apply and verify repository hooks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pre-commit
          pre-commit run --all-files || true
          pre-commit run --all-files

      - name: Commit repaired exact head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(portal): stabilize schema integrity validation"
          git push origin HEAD:fix/portal-1122-migration-schema-integrity
