name: Portal Schema Integrity

on:
  pull_request:
    paths:
      - "ai_platform/portal/**"
      - "deploy/**"
      - "tests/ai_platform/portal/**"
      - "tests/ai_platform_integration/**"
      - "tools/portal_schema/**"
      - "docs/ai_platform/portal/**"
      - "docs/agents/tasks/active/FTAI-20260803-portal-remediation-1122.md"
      - ".github/workflows/portal-schema-integrity.yml"
  push:
    branches:
      - develop
    paths:
      - "ai_platform/portal/**"
      - "deploy/**"
      - "tests/ai_platform/portal/**"
      - "tests/ai_platform_integration/**"
      - "tools/portal_schema/**"
      - "docs/ai_platform/portal/**"
      - ".github/workflows/portal-schema-integrity.yml"

permissions:
  contents: read

concurrency:
  group: "portal-schema-integrity-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  inventory:
    name: Deterministic ORM and migration inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install bounded Portal dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r deploy/synology/portal-oidc/requirements.txt

      - name: Generate deterministic schema inventory
        run: |
          set -euo pipefail
          python -m py_compile tools/portal_schema/inventory.py
          python tools/portal_schema/inventory.py \
            --output artifacts/portal-schema-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/portal-schema-inventory.json").read_text(encoding="utf-8")
          )
          assert payload["format_version"] == 1
          assert payload["orm"]["table_count"] > 0
          assert payload["migrations"]["file_count"] > 0
          assert payload["safety"] == {
              "live_capital_authorized": False,
              "protected_production_mutated": False,
              "secret_values_recorded": False,
          }
          PY

      - name: Upload secret-free schema inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-schema-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/portal-schema-inventory.json
          if-no-files-found: error
          retention-days: 14
