name: Portal Staging External E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-staging-external-e2e
  cancel-in-progress: false

jobs:
  protected-ingress:
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pydantic>=2.2" "httpx>=0.24.1"
      - name: Probe Cloudflare staging boundaries
        env:
          PORTAL_STAGING_BASE_URL: ${{ vars.PORTAL_STAGING_BASE_URL }}
          PORTAL_STAGING_PRIVILEGED_PATH: ${{ vars.PORTAL_STAGING_PRIVILEGED_PATH }}
          PORTAL_STAGING_ORIGIN_PROBE_URL: ${{ secrets.PORTAL_STAGING_ORIGIN_PROBE_URL }}
          PORTAL_STAGING_FREQTRADE_PROBE_URL: ${{ secrets.PORTAL_STAGING_FREQTRADE_PROBE_URL }}
          PORTAL_STAGING_CF_ACCESS_CLIENT_ID: ${{ secrets.PORTAL_STAGING_CF_ACCESS_CLIENT_ID }}
          PORTAL_STAGING_CF_ACCESS_CLIENT_SECRET: ${{ secrets.PORTAL_STAGING_CF_ACCESS_CLIENT_SECRET }}
        run: >-
          python -m ai_platform.portal.deploy.cloudflare.probe
          --policy ai_platform/portal/deploy/cloudflare/staging-policy.example.json
