name: Portal Staging Policy

on:
  pull_request:
    paths:
      - "ai_platform/portal/deploy/cloudflare/**"
      - "tests/ai_platform/portal/deploy/cloudflare/**"
      - "docs/ai_platform/portal/PRODUCTION_LIKE_STAGING.md"
      - "docs/ai_platform/portal/runbooks/STAGING_*.md"
      - ".github/workflows/portal-staging-policy.yml"
      - ".github/workflows/portal-staging-external-e2e.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest "pydantic>=2.2" "httpx>=0.24.1"
      - name: Validate staging policy
        run: >-
          python -m ai_platform.portal.deploy.cloudflare.policy
          ai_platform/portal/deploy/cloudflare/staging-policy.example.json
      - name: Run staging policy tests
        run: >-
          python -m pytest -q -o addopts=''
          --confcutdir=tests/ai_platform
          tests/ai_platform/portal/deploy/cloudflare
