name: Portal Exact-Image Supply Chain

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/portal-supply-chain.yml"
      - ".github/workflows/portal-oidc-public-deploy.yml"
      - ".github/dependabot.yml"
      - "ai_platform/portal/**"
      - "ai_strategy_engine/src/strategy_engine/**"
      - "deploy/synology/portal/**"
      - "deploy/synology/portal-oidc/**"
      - "docs/agents/tasks/active/FTAI-CA-1116-portal-supply-chain.md"
      - "docs/ai_platform/portal/PORTAL_SUPPLY_CHAIN_POLICY.md"
      - "docs/ai_platform/portal/portal-supply-chain-policy.json"
      - "tools/agents/portal_supply_chain*.py"
      - "tests/ci/test_portal_supply_chain.py"
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/portal-supply-chain.yml"
      - ".github/workflows/portal-oidc-public-deploy.yml"
      - ".github/dependabot.yml"
      - "ai_platform/portal/**"
      - "ai_strategy_engine/src/strategy_engine/**"
      - "deploy/synology/portal/**"
      - "deploy/synology/portal-oidc/**"
      - "docs/agents/tasks/active/FTAI-CA-1116-portal-supply-chain.md"
      - "docs/ai_platform/portal/PORTAL_SUPPLY_CHAIN_POLICY.md"
      - "docs/ai_platform/portal/portal-supply-chain-policy.json"
      - "tools/agents/portal_supply_chain*.py"
      - "tests/ci/test_portal_supply_chain.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SYFT_VERSION: "1.50.0"
  SYFT_LINUX_AMD64_SHA256: "bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788"
  GRYPE_VERSION: "0.116.1"
  GRYPE_LINUX_AMD64_SHA256: "0122df7b655981abe547ad3d2190d65551dac6a2bfc80b4dc2a989b5d0587458"

jobs:
  policy-tests:
    name: Portal supply-chain policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile policy tool
        run: python3 -m py_compile tools/agents/portal_supply_chain*.py
      - name: Install focused test runner
        run: python3 -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Run focused policy tests
        run: python3 -m pytest -q -o addopts='' --confcutdir=tests/ci tests/ci/test_portal_supply_chain.py

  exact-images:
    name: Build, scan and smoke exact Portal images
    needs: policy-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      control-digest: ${{ steps.images.outputs.control_digest }}
      web-digest: ${{ steps.images.outputs.web_digest }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install checksum-pinned Syft and Grype
        shell: bash
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/portal-tools"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/syft.tar.gz"
          echo "${SYFT_LINUX_AMD64_SHA256}  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/syft.tar.gz" \
            --directory "$RUNNER_TEMP/portal-tools" syft
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/grype.tar.gz"
          echo "${GRYPE_LINUX_AMD64_SHA256}  $RUNNER_TEMP/grype.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/grype.tar.gz" \
            --directory "$RUNNER_TEMP/portal-tools" grype
          echo "$RUNNER_TEMP/portal-tools" >> "$GITHUB_PATH"

      - name: Build and verify exact final images
        id: images
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/portal-supply-chain
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python3 tools/agents/portal_supply_chain.py build-verify \
            --repository "$GITHUB_WORKSPACE" \
            --source-sha "$SOURCE_SHA" \
            --output-dir "$EVIDENCE_DIR" \
            --approval "$EVIDENCE_DIR/approval.json"
          python3 - "$EVIDENCE_DIR/approval.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys

          approval = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"control_digest={approval['images']['control-plane']['digest']}")
          print(f"web_digest={approval['images']['web']['digest']}")
          PY

      - name: Smoke exact images together in API mode
        shell: bash
        env:
          CONTROL_DIGEST: ${{ steps.images.outputs.control_digest }}
          WEB_DIGEST: ${{ steps.images.outputs.web_digest }}
        run: |
          set -euo pipefail
          network="portal-supply-chain-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          control="portal-control-supply-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          web="portal-web-supply-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state="$RUNNER_TEMP/portal-control-state"
          cleanup() {
            docker rm -f "$web" "$control" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p "$state"
          sudo chown 10001:10001 "$state"
          key="$(python3 - <<'PY'
          import base64
          print(base64.urlsafe_b64encode(b"x" * 32).decode("ascii").rstrip("="))
          PY
          )"
          docker run --rm \
            --user 10001:10001 \
            --mount "type=bind,src=$state,dst=/state" \
            --env PORTAL_DATABASE_URL=sqlite+pysqlite:////state/portal.db \
            --entrypoint python \
            "$CONTROL_DIGEST" \
            -m ai_platform.portal.database.cli migrate
          docker network create "$network" >/dev/null
          docker run --detach --name "$control" \
            --network "$network" --network-alias portal-control-plane \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --user 10001:10001 \
            --mount "type=bind,src=$state,dst=/state" \
            --env PORTAL_DATABASE_URL=sqlite+pysqlite:////state/portal.db \
            --env PORTAL_ENVIRONMENT=staging \
            --env PORTAL_IDENTITY_ISSUER=https://identity.example.invalid/application/o/portal/ \
            --env PORTAL_IDENTITY_CLIENT_ID=portal \
            --env PORTAL_IDENTITY_CLIENT_SECRET=synthetic-not-a-production-secret \
            --env PORTAL_IDENTITY_REDIRECT_URI=https://portal.example.invalid/api/identity/callback \
            --env PORTAL_IDENTITY_SESSION_HMAC_KEY_B64="$key" \
            --env PORTAL_IDENTITY_FLOW_ENCRYPTION_KEY_B64="$key" \
            --env PORTAL_IDENTITY_TRANSPORT_MODE=https \
            "$CONTROL_DIGEST"
          docker run --detach --name "$web" \
            --network "$network" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000 \
            --env PORTAL_WEB_DATA_MODE=api \
            --env PORTAL_ENVIRONMENT=staging \
            --env PORTAL_IDENTITY_FIXTURE_MODE=disabled \
            --env PORTAL_IDENTITY_TRANSPORT_MODE=https \
            --env PORTAL_IDENTITY_ISSUER=https://identity.example.invalid/application/o/portal/ \
            --env PORTAL_CONTROL_PLANE_URL=http://portal-control-plane:8000 \
            --env PORTAL_LIQUIDATIONS_DATA_ROOT=/tmp/no-liquidations \
            "$WEB_DIGEST"
          for container in "$control" "$web"; do
            ready=false
            for _ in $(seq 1 90); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
              if [[ "$status" == "healthy" ]]; then
                ready=true
                break
              fi
              if [[ "$status" =~ ^(unhealthy|exited|dead)$ ]]; then
                docker logs "$container" >&2 || true
                exit 1
              fi
              sleep 2
            done
            [[ "$ready" == "true" ]] || {
              docker logs "$container" >&2 || true
              exit 1
            }
          done
          docker exec -i "$control" python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=5) as response:
              payload = json.load(response)
          assert payload["status"] == "ok"
          assert payload["identity_fixture"] is False
          assert payload["live_capital_authorized"] is False
          PY
          docker exec -i "$web" node - <<'JS'
          Promise.all([
            fetch("http://127.0.0.1:3000/login"),
            fetch("http://portal-control-plane:8000/healthz"),
          ])
            .then(async ([login, health]) => {
              if (!login.ok || !health.ok) process.exit(2);
              const body = await login.text();
              const payload = await health.json();
              if (!body.includes("<html") || payload.status !== "ok") process.exit(3);
            })
            .catch(() => process.exit(4));
          JS

      - name: Verify approval and derive attestation predicates
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/portal-supply-chain
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/agents/portal_supply_chain.py verify-approval \
            --approval "$EVIDENCE_DIR/approval.json" \
            --expected-source-sha "$SOURCE_SHA"
          python3 - "$EVIDENCE_DIR" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          for name in ("control-plane", "web"):
              statement_path = root / f"{name}.provenance.json"
              statement = json.loads(statement_path.read_text(encoding="utf-8"))
              if statement.get("_type") != "https://in-toto.io/Statement/v1":
                  raise SystemExit(f"invalid provenance statement type: {name}")
              if statement.get("predicateType") != "https://slsa.dev/provenance/v1":
                  raise SystemExit(f"invalid provenance predicate type: {name}")
              predicate = statement.get("predicate")
              if not isinstance(predicate, dict):
                  raise SystemExit(f"missing provenance predicate: {name}")
              output = root / f"{name}.provenance-predicate.json"
              output.write_text(json.dumps(predicate, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Attest control-plane SBOM
        id: control_sbom_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: portal-control-plane
          subject-digest: ${{ steps.images.outputs.control_digest }}
          sbom-path: ${{ runner.temp }}/portal-supply-chain/control-plane.sbom.cdx.json

      - name: Attest control-plane provenance
        id: control_provenance_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: portal-control-plane
          subject-digest: ${{ steps.images.outputs.control_digest }}

      - name: Attest web SBOM
        id: web_sbom_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: portal-web
          subject-digest: ${{ steps.images.outputs.web_digest }}
          sbom-path: ${{ runner.temp }}/portal-supply-chain/web.sbom.cdx.json

      - name: Attest web provenance
        id: web_provenance_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: portal-web
          subject-digest: ${{ steps.images.outputs.web_digest }}

      - name: Preserve attestation bundles with evidence
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/portal-supply-chain
          CONTROL_SBOM_BUNDLE: ${{ steps.control_sbom_attest.outputs.bundle-path }}
          CONTROL_PROVENANCE_BUNDLE: ${{ steps.control_provenance_attest.outputs.bundle-path }}
          WEB_SBOM_BUNDLE: ${{ steps.web_sbom_attest.outputs.bundle-path }}
          WEB_PROVENANCE_BUNDLE: ${{ steps.web_provenance_attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$CONTROL_SBOM_BUNDLE" "$EVIDENCE_DIR/control-plane.sbom.bundle.jsonl"
          cp "$CONTROL_PROVENANCE_BUNDLE" "$EVIDENCE_DIR/control-plane.provenance.bundle.jsonl"
          cp "$WEB_SBOM_BUNDLE" "$EVIDENCE_DIR/web.sbom.bundle.jsonl"
          cp "$WEB_PROVENANCE_BUNDLE" "$EVIDENCE_DIR/web.provenance.bundle.jsonl"
          find "$EVIDENCE_DIR" -maxdepth 1 -type f ! -name evidence.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$EVIDENCE_DIR/evidence.sha256"

      - name: Upload exact-image evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-supply-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portal-supply-chain
          if-no-files-found: error
          retention-days: 30
