name: Portal Synology LAN Preview

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/portal-synology-lan-preview.yml
      - deploy/synology/portal/Dockerfile
      - deploy/synology/portal/deploy-preview.sh
      - ai_platform/portal/web/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: portal-synology-lan-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy on Synology
    runs-on: freqtrade-staging
    timeout-minutes: 45
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(cat <<EOF
          {"state":"pending","context":"portal-synology-lan-preview","description":"Building portal with read-only Liquid20 data","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload" >/dev/null

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build and deploy preview
        id: deploy
        env:
          PORTAL_BIND_ADDRESS: 192.168.1.2
          PORTAL_PORT: "3031"
          PORTAL_LIQUIDATIONS_HOST_ROOT: /volume1/docker/freqtrade-liquidations/data
          PORTAL_DEPLOY_LOG: ${{ runner.temp }}/portal-synology-deploy.log
        run: |
          set -o pipefail
          bash deploy/synology/portal/deploy-preview.sh 2>&1 | tee "$PORTAL_DEPLOY_LOG"

      - name: Capture failed Liquid20 BFF diagnostics
        if: failure() && steps.deploy.outcome == 'failure'
        continue-on-error: true
        env:
          PORTAL_IMAGE: local/freqtrade-portal-web:sha-${{ github.sha }}
          PORTAL_LIQUIDATIONS_HOST_ROOT: /volume1/docker/freqtrade-liquidations/data
          PORTAL_DEPLOY_LOG: ${{ runner.temp }}/portal-synology-deploy.log
        run: |
          set +e
          diagnostic="freqtrade-portal-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "$diagnostic" >/dev/null 2>&1 || true
          {
            echo
            echo "=== failed Liquid20 BFF diagnostics ==="
            group_id="$(docker run --rm \
              --user 0 \
              --entrypoint node \
              --mount "type=bind,src=${PORTAL_LIQUIDATIONS_HOST_ROOT},dst=/liquid20-data,readonly" \
              "$PORTAL_IMAGE" \
              -e 'const fs=require("node:fs"); process.stdout.write(String(fs.lstatSync("/liquid20-data").gid));')"
            echo "diagnostic_read_group=${group_id}"
            docker run -d \
              --name "$diagnostic" \
              --restart no \
              --read-only \
              --tmpfs /tmp:size=64m,mode=1777 \
              --tmpfs /app/.next/cache:size=64m,mode=0755 \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --group-add "$group_id" \
              --mount "type=bind,src=${PORTAL_LIQUIDATIONS_HOST_ROOT},dst=/liquid20-data,readonly" \
              --env PORTAL_WEB_DATA_MODE=fixture \
              --env PORTAL_ENVIRONMENT=staging \
              --env PORTAL_LIQUIDATIONS_DATA_ROOT=/liquid20-data \
              "$PORTAL_IMAGE" >/dev/null
            for _ in $(seq 1 30); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$diagnostic" 2>/dev/null || true)"
              [[ "$status" == "healthy" || "$status" == "running" ]] && break
              sleep 1
            done
            echo "diagnostic_container_status=${status:-missing}"
            docker exec "$diagnostic" node -e '
              const paths = [
                "/api/market/liquidations/health",
                "/api/market/liquidations/summary",
                "/api/market/liquidations?limit=1",
                "/market/liquidations",
              ];
              (async () => {
                for (const path of paths) {
                  try {
                    const response = await fetch(`http://127.0.0.1:3000${path}`);
                    const body = (await response.text()).slice(0, 2000);
                    console.log(JSON.stringify({path, status: response.status, body}));
                  } catch (error) {
                    console.log(JSON.stringify({path, fetch_error: String(error)}));
                  }
                }
              })().catch((error) => {
                console.error(error);
                process.exit(1);
              });
            '
            docker exec "$diagnostic" node -e '
              const fs = require("node:fs");
              const inspect = (path) => {
                try {
                  const stat = fs.lstatSync(path);
                  const result = {
                    path,
                    mode: (stat.mode & 0o777).toString(8),
                    uid: stat.uid,
                    gid: stat.gid,
                    size: stat.size,
                    type: stat.isDirectory() ? "directory" : stat.isFile() ? "file" : "other",
                  };
                  if (stat.isDirectory()) {
                    result.entries = fs.readdirSync(path).slice(0, 30);
                  }
                  console.log(JSON.stringify(result));
                } catch (error) {
                  console.log(JSON.stringify({path, error: String(error)}));
                }
              };
              for (const path of [
                "/liquid20-data",
                "/liquid20-data/runs",
                "/liquid20-data/live",
                "/liquid20-data/live/live-state-v1.json",
                "/liquid20-data/live/runs",
              ]) inspect(path);
              try {
                const pointer = fs.readFileSync("/liquid20-data/live/live-state-v1.json", "utf8");
                console.log(JSON.stringify({live_pointer: pointer.slice(0, 4000)}));
              } catch (error) {
                console.log(JSON.stringify({live_pointer_error: String(error)}));
              }
            '
            docker logs --tail 160 "$diagnostic" 2>&1 || true
            echo "=== end failed Liquid20 BFF diagnostics ==="
          } >> "$PORTAL_DEPLOY_LOG" 2>&1
          docker rm -f "$diagnostic" >/dev/null 2>&1 || true
          exit 0

      - name: Verify LAN Liquid20 surface and session boundary
        id: probe
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            "http://192.168.1.2:3031/market/liquidations" >/dev/null
          docker exec freqtrade-portal-staging node -e '
            const paths = [
              "/api/market/liquidations/health",
              "/api/market/liquidations/summary",
              "/api/market/liquidations?limit=1",
            ];
            (async () => {
              for (const path of paths) {
                const response = await fetch(`http://127.0.0.1:3000${path}`);
                const payload = await response.json().catch(() => null);
                if (response.status !== 401 || payload?.code !== "SESSION_MISSING") {
                  process.exit(1);
                }
              }
            })().catch(() => process.exit(1));
          '

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_OUTCOME" == "success" && "$PROBE_OUTCOME" == "success" ]]; then
            state=success
          else
            state=failure
          fi
          description="Portal Liquid20 preview: deploy=$DEPLOY_OUTCOME probe=$PROBE_OUTCOME"
          payload=$(cat <<EOF
          {"state":"$state","context":"portal-synology-lan-preview","description":"$description","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload" >/dev/null

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portal-synology-deploy-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portal-synology-deploy.log
          if-no-files-found: warn
          retention-days: 7
