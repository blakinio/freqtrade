name: Portal Synology LAN Preview

on:
  push:
    branches:
      - develop
      - feat/portal-liquidations-synology-20260725
    paths:
      - .github/workflows/portal-synology-lan-preview.yml
      - deploy/synology/portal/Dockerfile
      - deploy/synology/portal/deploy-preview.sh
      - ai_platform/portal/web/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: portal-synology-lan-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy on Synology
    runs-on: freqtrade-staging
    timeout-minutes: 45
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(cat <<EOF
          {"state":"pending","context":"portal-synology-lan-preview","description":"Building portal with read-only Liquid20 data","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload" >/dev/null

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build and deploy preview
        id: deploy
        env:
          PORTAL_BIND_ADDRESS: 192.168.1.2
          PORTAL_PORT: "3031"
          PORTAL_LIQUIDATIONS_HOST_ROOT: /volume1/docker/freqtrade-liquidations/data
        run: bash deploy/synology/portal/deploy-preview.sh

      - name: Verify LAN Liquid20 surface
        id: probe
        run: |
          set -euo pipefail
          for path in \
            /market/liquidations \
            /api/market/liquidations/health \
            /api/market/liquidations/summary \
            '/api/market/liquidations?limit=1'; do
            curl --fail --silent --show-error --max-time 15 \
              "http://192.168.1.2:3031${path}" >/dev/null
          done
          docker exec freqtrade-portal-staging node -e '
            fetch("http://127.0.0.1:3000/api/market/liquidations/health")
              .then(async (response) => {
                if (!response.ok) process.exit(1);
                const health = await response.json();
                if (health.schema_version !== 1) process.exit(1);
                if (health.research_preview !== true) process.exit(1);
                if (health.trading_authorized !== false) process.exit(1);
                if (!health.run_id || !Array.isArray(health.active_sources)) process.exit(1);
              })
              .catch(() => process.exit(1));
          '

      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_OUTCOME" == "success" && "$PROBE_OUTCOME" == "success" ]]; then
            state=success
          else
            state=failure
          fi
          description="Portal Liquid20 preview: deploy=$DEPLOY_OUTCOME probe=$PROBE_OUTCOME"
          payload=$(cat <<EOF
          {"state":"$state","context":"portal-synology-lan-preview","description":"$description","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload" >/dev/null
