name: Portal Synology Port Probe

on:
  push:
    branches:
      - fix/portal-synology-port-3030
    paths:
      - .github/workflows/portal-synology-port-probe.yml

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: freqtrade-staging
    timeout-minutes: 5
    steps:
      - name: Probe candidate LAN ports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for port in 3030 3031 3032 8088; do
            mapped="$(docker ps --format '{{.Ports}}' | grep -E "(^|, |:)${port}->|:${port}-" | head -n 1 || true)"
            response="$(curl --silent --show-error --max-time 3 --output /dev/null --write-out '%{http_code}' "http://192.168.1.2:${port}/" 2>/dev/null || true)"
            if [[ -n "$mapped" || ( -n "$response" && "$response" != "000" ) ]]; then
              state=failure
              description="Port ${port} occupied; HTTP ${response:-n/a}"
            else
              state=success
              description="Port ${port} appears free"
            fi
            payload=$(cat <<EOF
            {"state":"$state","context":"portal-port-${port}","description":"$description","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
            EOF
            )
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              --data "$payload" >/dev/null
          done
