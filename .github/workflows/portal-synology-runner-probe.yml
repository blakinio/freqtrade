name: Portal Synology Runner Probe

on:
  push:
    branches:
      - feat/portal-synology-lan-staging
    paths:
      - .github/workflows/portal-synology-runner-probe.yml

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: freqtrade-staging
    timeout-minutes: 5
    steps:
      - name: Probe runner
        run: |
          set -euo pipefail
          docker version >/dev/null
          test -S /var/run/docker.sock

      - name: Publish probe result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          payload=$(cat <<EOF
          {"state":"$state","context":"portal-synology-runner-probe","description":"Portal runner probe: $JOB_STATUS","target_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          EOF
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"
