name: Portal Target Preflight Format Diagnostic

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop
    paths:
      - ".github/workflows/portal-target-preflight-format-diagnostic.yml"
      - "deploy/synology/portal-authentik/target_preflight.py"
      - "tests/ai_platform/portal/deployment/test_authentik_synology_target_preflight.py"

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - name: Format owned Python files
        run: |
          ruff format \
            deploy/synology/portal-authentik/target_preflight.py \
            tests/ai_platform/portal/deployment/test_authentik_synology_target_preflight.py
      - name: Upload exact formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-target-preflight-formatted-${{ github.event.pull_request.number }}
          path: |
            deploy/synology/portal-authentik/target_preflight.py
            tests/ai_platform/portal/deployment/test_authentik_synology_target_preflight.py
          if-no-files-found: error
          retention-days: 1
