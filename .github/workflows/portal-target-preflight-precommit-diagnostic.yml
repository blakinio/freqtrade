name: Portal Target Preflight Apply Confirmed Fix

on:
  pull_request:
    types: [synchronize]
    branches:
      - develop
    paths:
      - ".github/workflows/portal-target-preflight-precommit-diagnostic.yml"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/portal-pi06-authentik-synology-target-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install exact validation tools
        run: python -m pip install --disable-pip-version-check pytest ruff==0.15.21
      - name: Apply bounded Docker inventory refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("deploy/synology/portal-authentik/target_preflight.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def check_docker(")
          end = text.index("\n\ndef validate_runtime_render", start)
          replacement = '''def docker_host_capacity(blockers: list[str]) -> tuple[str, int, int]:
              info = run_command("docker", "info", "--format", "{{.Architecture}}|{{.NCPU}}|{{.MemTotal}}")
              if info.returncode:
                  blockers.append("docker_info_unavailable")
                  return "", 0, 0
              try:
                  architecture, cpu, memory = info.stdout.strip().split("|")
                  cpu_count = int(cpu)
                  memory_bytes = int(memory)
              except (ValueError, TypeError):
                  blockers.append("docker_info_unparseable")
                  return "", 0, 0
              if architecture not in {"x86_64", "aarch64", "amd64", "arm64"}:
                  blockers.append("unsupported_docker_architecture")
              if cpu_count < 2:
                  blockers.append("fewer_than_2_cpu_cores")
              if memory_bytes < 2 * 1024**3:
                  blockers.append("less_than_2_gib_memory")
              return architecture, cpu_count, memory_bytes


          def docker_named_inventory(
              kind: str,
              expected: set[str],
              blockers: list[str],
              *,
              failure: str,
              partial: str,
          ) -> set[str]:
              inventory = run_command("docker", kind, "ls", "--format", "{{.Name}}")
              if inventory.returncode:
                  blockers.append(failure)
                  return set()
              present = expected & set(inventory.stdout.splitlines())
              if 0 < len(present) < len(expected):
                  blockers.append(partial)
              return present


          def docker_container_inventory(
              request: dict[str, Any], blockers: list[str]
          ) -> tuple[int, int]:
              containers = run_command("docker", "ps", "--format", "{{.Names}}\\t{{.Ports}}")
              if containers.returncode:
                  blockers.append("docker_container_inventory_failed")
                  return 0, 0
              matching_containers = 0
              port_conflicts = 0
              token = f":{request['authentik_http_port']}->"
              for line in containers.stdout.splitlines():
                  name, _, ports = line.partition("\\t")
                  if name.startswith("portal-authentik"):
                      matching_containers += 1
                  elif token in ports:
                      port_conflicts += 1
              if port_conflicts:
                  blockers.append("authentik_http_port_conflict")
              return matching_containers, port_conflicts


          def check_docker(request: dict[str, Any]) -> tuple[list[str], dict[str, Any]]:
              blockers: list[str] = []
              socket_path = Path("/var/run/docker.sock")
              if not socket_path.exists():
                  blockers.append("docker_socket_missing")
              elif not os.access(socket_path, os.R_OK | os.W_OK):
                  blockers.append("docker_socket_not_accessible")
              version = run_command("docker", "version", "--format", "{{.Server.Version}}")
              compose = run_command("docker", "compose", "version", "--short")
              if version.returncode:
                  blockers.append("docker_server_unavailable")
              if compose.returncode:
                  blockers.append("docker_compose_v2_unavailable")
              architecture, cpu_count, memory_bytes = docker_host_capacity(blockers)
              present_volumes = docker_named_inventory(
                  "volume",
                  EXPECTED_VOLUMES,
                  blockers,
                  failure="docker_volume_inventory_failed",
                  partial="partial_existing_authentik_volume_state",
              )
              present_networks = docker_named_inventory(
                  "network",
                  EXPECTED_NETWORKS,
                  blockers,
                  failure="docker_network_inventory_failed",
                  partial="partial_existing_authentik_network_state",
              )
              matching_containers, port_conflicts = docker_container_inventory(request, blockers)
              return sorted(set(blockers)), {
                  "socket_present": socket_path.exists(),
                  "server_version_present": not version.returncode,
                  "compose_v2_present": not compose.returncode,
                  "architecture": architecture,
                  "cpu_count": cpu_count,
                  "memory_bytes": memory_bytes,
                  "expected_volumes_present": len(present_volumes),
                  "expected_networks_present": len(present_networks),
                  "matching_running_containers": matching_containers,
                  "conflicting_port_publishers": port_conflicts,
              }
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
          ruff check --fix deploy/synology/portal-authentik/target_preflight.py
          ruff format \
            deploy/synology/portal-authentik/target_preflight.py \
            tests/ai_platform/portal/deployment/test_authentik_synology_target_preflight.py
      - name: Validate confirmed fix
        run: |
          python -m py_compile deploy/synology/portal-authentik/target_preflight.py
          ruff check deploy/synology/portal-authentik/target_preflight.py \
            tests/ai_platform/portal/deployment/test_authentik_synology_target_preflight.py
          ruff format --check deploy/synology/portal-authentik/target_preflight.py \
            tests/ai_platform/portal/deployment/test_authentik_synology_target_preflight.py
          pytest -q tests/ai_platform/portal/deployment/test_authentik_synology_target_preflight.py
      - name: Remove one-shot workflow and push exact fix
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/portal-target-preflight-precommit-diagnostic.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/synology/portal-authentik/target_preflight.py \
            tests/ai_platform/portal/deployment/test_authentik_synology_target_preflight.py
          git commit -m "fix(portal): satisfy PI-06 pre-commit invariants"
          git push origin "HEAD:$HEAD_BRANCH"
