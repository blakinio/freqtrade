name: Portal UI Codespell Diagnostic

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "ai_platform/**"
      - "docs/ai_platform/**"
      - "tests/ai_platform/**"
      - ".github/workflows/portal-ui-codespell-diagnostic.yml"

permissions:
  contents: read

jobs:
  codespell:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install codespell
        run: python -m pip install --disable-pip-version-check codespell==2.4.2

      - name: Codespell only
        run: codespell AGENTS.md ai_platform docs/ai_platform tests/ai_platform
