name: Portal Universal E2E

on:
  pull_request:
    paths:
      - "ai_platform/portal/simulator/**"
      - "tests/ai_platform/portal/simulator/**"
      - "ai_platform/portal/intelligence/**"
      - "ai_platform/portal/learning/**"
      - "ai_platform/portal/web/**"
      - ".github/workflows/portal-universal-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-scenario:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest "pydantic>=2.2" "SQLAlchemy>=2.0.6" "httpx>=0.24.1" fastapi
      - name: Run deterministic universal scenario
        run: >-
          python -m pytest -q -o addopts=''
          --confcutdir=tests/ai_platform tests/ai_platform/portal/simulator

  chromium-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai_platform/portal/web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run critical Chromium E2E
        env:
          PORTAL_WEB_DATA_MODE: fixture
          PORTAL_ENVIRONMENT: test
        run: npm run test:e2e
