name: Portal Universal E2E

on:
  pull_request:
    paths:
      - "ai_platform/portal/simulator/**"
      - "tests/ai_platform/portal/simulator/**"
      - "ai_platform/portal/e2e/**"
      - "tests/ai_platform/portal/e2e/**"
      - "ai_platform/portal/intelligence/**"
      - "ai_platform/portal/learning/**"
      - "ai_platform/portal/web/**"
      - ".github/workflows/portal-universal-e2e.yml"
      - "docs/ai_platform/portal/E2E_TEST_ARCHITECTURE.md"
      - "docs/ai_platform/portal/BM09_BOT_MANAGEMENT_E2E_CLOSURE.md"
      - "docs/agents/tasks/FTAI-20260727-portal-e2e-architecture.md"
      - "docs/agents/tasks/FTAI-20260729-portal-bm09-bot-management-e2e-closure.md"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-scenario:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest "pydantic>=2.2" "SQLAlchemy>=2.0.6" "httpx>=0.24.1"
          fastapi jsonschema pyjwt "PyYAML>=6.0"
      - name: Run deterministic universal and BM-09 closure scenarios
        run: >-
          python -m pytest -q -o addopts=''
          --confcutdir=tests/ai_platform
          tests/ai_platform/portal/simulator
          tests/ai_platform/portal/e2e

  chromium-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai_platform/portal/web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run critical Chromium E2E
        env:
          PORTAL_WEB_DATA_MODE: fixture
          PORTAL_ENVIRONMENT: test
          PORTAL_IDENTITY_FIXTURE_MODE: enabled
        run: npm run test:e2e:critical
      - name: Upload failed Playwright evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portal-universal-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: ai_platform/portal/web/artifacts
          if-no-files-found: ignore
          retention-days: 7
