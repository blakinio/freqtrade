name: Portal WickHunter Liquid20 Review Repair

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml

permissions:
  contents: write

concurrency:
  group: portal-wickhunter-1396-liquid20-review-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair dangling symlink fail-closed review finding
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 1

      - name: Install bounded validation tools
        run: |
          python -m pip install ruff==0.15.21 pytest==9.1.1
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Apply exact fail-closed source and regression-test repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("ai_platform/scripts/liquidation_live_stream.py")
          text = source.read_text(encoding="utf-8")
          start = text.index("def _seal_committed_ndjson(")
          end = text.index("\n\nclass LiveRunManager:", start)
          block = text[start:end]
          missing = "    if not path.exists():\n"
          regular = "    if path.is_symlink() or not path.is_file():\n"
          if block.count(missing) != 1 or block.count(regular) != 1:
              raise SystemExit("seal function shape changed unexpectedly")
          block = block.replace(
              missing,
              "    if path.is_symlink():\n"
              "        raise RuntimeError(f\"previous {source} source path is not a regular file\")\n"
              "    if not path.exists():\n",
              1,
          )
          block = block.replace(regular, "    if not path.is_file():\n", 1)
          source.write_text(text[:start] + block + text[end:], encoding="utf-8")

          test = Path("tests/ai_platform_integration/test_liquidation_live_restart_durability.py")
          marker = "\n\ndef test_restart_fails_closed_when_committed_rows_are_missing(tmp_path: Path) -> None:\n"
          addition = '''

          def test_restart_rejects_dangling_symlink_even_with_zero_committed_rows(
              tmp_path: Path,
          ) -> None:
              old_run_id, old_run_root = _write_previous_active_run(
                  tmp_path,
                  committed_rows={BINANCE_SOURCE: 0, BYBIT_SOURCE: 0, OKX_SOURCE: 0},
                  actual_rows={BINANCE_SOURCE: 0, BYBIT_SOURCE: 0, OKX_SOURCE: 0},
              )
              okx_path = old_run_root / f"{OKX_SOURCE}.ndjson"
              okx_path.unlink()
              okx_path.symlink_to(old_run_root / "missing-okx.ndjson")
              manager = OkxLiveRunManager(
                  data_root=tmp_path,
                  collector_commit="4" * 40,
                  host_id="synology-test",
                  now_ms=lambda: 1_786_384_683_792,
              )

              with pytest.raises(RuntimeError, match="okx-swap source path is not a regular file"):
                  asyncio.run(manager.start())

              persisted = json.loads(
                  (old_run_root / "run-state-v1.json").read_text(encoding="utf-8")
              )
              assert persisted["run_state"] == "active"
              pointer = json.loads(
                  (tmp_path / "live" / LIVE_STATE_FILE).read_text(encoding="utf-8")
              )
              assert pointer["active_run_id"] == old_run_id
              assert sorted(path.name for path in (tmp_path / "live" / "runs").iterdir()) == [
                  old_run_id
              ]
          '''
          text = test.read_text(encoding="utf-8")
          if text.count(marker) != 1:
              raise SystemExit("expected exactly one test insertion marker")
          test.write_text(text.replace(marker, addition + marker), encoding="utf-8")
          PY
          ruff format ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          ruff check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git diff --check
          git diff -- ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py

      - name: Run focused regression suite
        run: >-
          python -m pytest -q -o addopts=''
          --confcutdir=tests/ai_platform_integration
          tests/ai_platform_integration/test_liquidation_live_restart_durability.py

      - name: Commit review repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git diff --cached --quiet && exit 1
          git commit -m "fix(liquidations): reject dangling restart source symlinks"
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
