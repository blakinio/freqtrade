name: Portal WickHunter WH09 Readonly Health Diagnostic

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml

permissions:
  contents: read

concurrency:
  group: portal-wickhunter-buildkit-cache-recovery
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose WH09 health without runtime mutation
    runs-on:
      - freqtrade-staging
    timeout-minutes: 10
    env:
      WH09_EXPECTED_ID: ebb3bc5151c6041cc557395f77b3001230f881bc39c2e9a5c4789fcd920e3b37
      WH09_PROJECT: wickhunter-production-research-runtime
      WH09_SERVICE: wickhunter-production-research-runtime
      WH09_EXPECTED_REVISION: 90cfc5ded10b0c6cb6406d00042817aca611e900
      LIQUID20_CONTAINER: liquid20-live
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Capture bounded read-only WH09 health evidence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(
            docker ps -aq --no-trunc \
              --filter "label=com.docker.compose.project=$WH09_PROJECT" \
              --filter "label=com.docker.compose.service=$WH09_SERVICE" \
              | sed '/^$/d'
          )
          printf 'WH09_MATCHING_COUNT=%s\n' "${#ids[@]}"
          [[ ${#ids[@]} -eq 1 ]]
          wh09_id="${ids[0]}"
          [[ "$wh09_id" == "$WH09_EXPECTED_ID" ]]
          [[ "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$wh09_id")" == "$WH09_EXPECTED_REVISION" ]]
          [[ "$(docker inspect --format '{{.State.Running}}' "$wh09_id")" == 'true' ]]

          docker inspect "$wh09_id" > "$RUNNER_TEMP/wh09-diagnostic-inspect.json"
          python3 - "$RUNNER_TEMP/wh09-diagnostic-inspect.json" <<'PY'
          import json
          import sys

          item = json.load(open(sys.argv[1], encoding="utf-8"))[0]
          state = item.get("State") or {}
          health = state.get("Health") or {}
          config = item.get("Config") or {}
          print("WH09_STATE=" + str(state.get("Status")))
          print("WH09_RUNNING=" + str(state.get("Running")))
          print("WH09_HEALTH=" + str(health.get("Status")))
          print("WH09_STARTED_AT=" + str(state.get("StartedAt")))
          print("WH09_RESTART_COUNT=" + str(item.get("RestartCount")))
          print("WH09_HEALTHCHECK_TEST=" + json.dumps((config.get("Healthcheck") or {}).get("Test")))
          for index, entry in enumerate((health.get("Log") or [])[-5:], start=1):
              output = str(entry.get("Output") or "").replace("\n", " | ")[:500]
              print(
                  f"WH09_HEALTH_LOG_{index}=start:{entry.get('Start')} end:{entry.get('End')} "
                  f"exit:{entry.get('ExitCode')} output:{output}"
              )
          PY

          set +e
          manual_output="$(docker exec "$wh09_id" \
            python /app/deploy/synology/wickhunter-production-research-runtime/research_runtime_healthcheck.py 2>&1)"
          manual_rc=$?
          set -e
          printf 'WH09_MANUAL_HEALTH_RC=%s\n' "$manual_rc"
          printf 'WH09_MANUAL_HEALTH_OUTPUT=%s\n' "$(printf '%s' "$manual_output" | tr '\n' ' ' | cut -c1-1000)"
          printf 'MANUAL_HEALTH_RC=%s\n' "$manual_rc" >> "$GITHUB_ENV"
          printf 'WH09_CONTAINER_ID=%s\n' "$wh09_id" >> "$GITHUB_ENV"

          docker exec -i "$wh09_id" python - <<'PY'
          import json
          import time
          from pathlib import Path

          now_ms = time.time_ns() // 1_000_000
          zero_fields = (
              "protected_holdout_accessed",
              "automatic_promotion_enabled",
              "trading_credentials_present",
              "order_adapter_present",
              "execution_enabled",
              "orders_submitted",
              "live_capital_authorized",
          )
          for label, path_text in (
              ("HEALTH", "/runtime/operator/health.json"),
              ("TELEMETRY", "/runtime/journal/telemetry.json"),
          ):
              path = Path(path_text)
              print(f"WH09_{label}_FILE_EXISTS={path.is_file() and not path.is_symlink()}")
              if not path.is_file() or path.is_symlink():
                  continue
              stat = path.stat()
              print(f"WH09_{label}_FILE_MTIME_NS={stat.st_mtime_ns}")
              payload = json.loads(path.read_text(encoding="utf-8"))
              safe = {
                  key: payload.get(key)
                  for key in (
                      "schema_version",
                      "status",
                      "runtime_health",
                      "mode",
                      "generation",
                      "checked_at_ms",
                      "last_success_at_ms",
                      "last_observed_at_ms",
                      "circuit_breaker_active",
                      "no_trade_confidence",
                      "outcome_horizon_ms",
                  )
                  if key in payload
              }
              for key in zero_fields:
                  if key in payload:
                      safe[key] = payload.get(key)
              for key in ("checked_at_ms", "last_success_at_ms", "last_observed_at_ms"):
                  value = payload.get(key)
                  if isinstance(value, int) and not isinstance(value, bool):
                      safe[f"{key}_age_seconds"] = round((now_ms - value) / 1000, 3)
              print(f"WH09_{label}_SAFE=" + json.dumps(safe, sort_keys=True))
          PY

          echo 'WH09_PROCESS_SNAPSHOT_BEGIN'
          docker top "$wh09_id" -eo pid,etime,stat,comm 2>&1 | head -n 20 || true
          echo 'WH09_PROCESS_SNAPSHOT_END'

          if docker inspect "$LIQUID20_CONTAINER" >/dev/null 2>&1; then
            liquid_running="$(docker inspect --format '{{.State.Running}}' "$LIQUID20_CONTAINER")"
            printf 'LIQUID20_RUNNING=%s\n' "$liquid_running"
            if [[ "$liquid_running" == 'true' ]]; then
              docker exec -i "$LIQUID20_CONTAINER" python - <<'PY'
              import json
              import time
              from pathlib import Path

              pointer = Path("/data/live/live-state-v1.json")
              print(f"LIQUID20_POINTER_EXISTS={pointer.is_file() and not pointer.is_symlink()}")
              if pointer.is_file() and not pointer.is_symlink():
                  payload = json.loads(pointer.read_text(encoding="utf-8"))
                  state = payload.get("state") if isinstance(payload.get("state"), dict) else {}
                  safe = {
                      "schema_version": payload.get("schema_version"),
                      "contract": payload.get("contract"),
                      "active_run_id": payload.get("active_run_id"),
                      "run_id": state.get("run_id"),
                      "run_state": state.get("run_state"),
                      "execution_enabled": state.get("execution_enabled"),
                      "trading_authorized": state.get("trading_authorized"),
                      "trading_credentials_present": state.get("trading_credentials_present"),
                      "pointer_mtime_age_seconds": round(time.time() - pointer.stat().st_mtime, 3),
                  }
                  print("LIQUID20_SAFE=" + json.dumps(safe, sort_keys=True))
              PY
            fi
          else
            echo 'LIQUID20_CONTAINER_MISSING=true'
          fi

      - name: Prove diagnostic made no WH09 mutation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(
            docker ps -aq --no-trunc \
              --filter "label=com.docker.compose.project=$WH09_PROJECT" \
              --filter "label=com.docker.compose.service=$WH09_SERVICE" \
              | sed '/^$/d'
          )
          [[ ${#ids[@]} -eq 1 ]]
          [[ "${ids[0]}" == "$WH09_EXPECTED_ID" ]]
          [[ "$(docker inspect --format '{{.State.Running}}' "$WH09_EXPECTED_ID")" == 'true' ]]
          [[ "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$WH09_EXPECTED_ID")" == "$WH09_EXPECTED_REVISION" ]]

      - name: Fail closed while WH09 healthcheck is failing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${MANUAL_HEALTH_RC:-1}" == '0' ]] || {
            echo 'WH09 healthcheck remains non-zero; no recovery mutation is authorized.' >&2
            exit 1
          }
