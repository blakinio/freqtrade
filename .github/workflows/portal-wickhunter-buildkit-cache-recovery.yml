name: Portal WickHunter Startup Root And Source Metadata Repair

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml

permissions:
  contents: write

jobs:
  repair:
    name: Fail closed before startup writes and malformed configured state
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 20

      - name: Apply startup-root and configured-state repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("ai_platform/scripts/liquidation_live_stream.py")
          source = source_path.read_text(encoding="utf-8")

          helper_marker = "\n\nclass LiveRunManager:\n"
          helpers = (
              "\n\ndef _prepare_live_roots(\n"
              "    *, data_root: Path, live_root: Path, runs_root: Path\n"
              ") -> None:\n"
              "    for path, label in (\n"
              "        (data_root, \"Liquid20 data root\"),\n"
              "        (live_root, \"Liquid20 live root\"),\n"
              "        (runs_root, \"Liquid20 runs root\"),\n"
              "    ):\n"
              "        try:\n"
              "            item = path.lstat()\n"
              "        except FileNotFoundError:\n"
              "            try:\n"
              "                path.mkdir(parents=False, exist_ok=False)\n"
              "            except FileExistsError:\n"
              "                pass\n"
              "            item = path.lstat()\n"
              "        if not stat.S_ISDIR(item.st_mode) or stat.S_ISLNK(item.st_mode):\n"
              "            raise RuntimeError(f\"{label} is not a regular directory\")\n"
              "\n\n"
              "def _restart_source_commit_state(\n"
              "    source_state: object, *, source: str\n"
              ") -> tuple[int, bool]:\n"
              "    if not isinstance(source_state, dict):\n"
              "        raise RuntimeError(f\"previous {source} source state is invalid\")\n"
              "    if \"events_written\" not in source_state:\n"
              "        raise RuntimeError(f\"previous {source} events_written is missing\")\n"
              "    configured = source_state.get(\"configured\")\n"
              "    if not isinstance(configured, bool):\n"
              "        raise RuntimeError(f\"previous {source} configured is invalid\")\n"
              "    allow_missing = (\n"
              "        configured is False\n"
              "        and source_state.get(\"last_event_received_at_ms\") is None\n"
              "    )\n"
              "    return source_state[\"events_written\"], allow_missing\n"
          )
          if "def _prepare_live_roots(" not in source:
              if source.count(helper_marker) != 1:
                  raise SystemExit("startup helper insertion marker mismatch")
              source = source.replace(helper_marker, helpers + helper_marker, 1)

          old_init = "        self.live_root = data_root / \"live\"\n        self.runs_root = self.live_root / \"runs\"\n"
          new_init = "        self.data_root = data_root\n        self.live_root = data_root / \"live\"\n        self.runs_root = self.live_root / \"runs\"\n"
          if new_init not in source:
              if source.count(old_init) != 1:
                  raise SystemExit("data_root assignment target mismatch")
              source = source.replace(old_init, new_init, 1)

          old_start = (
              "    async def start(self) -> None:\n"
              "        async with self._lock:\n"
              "            self.runs_root.mkdir(parents=True, exist_ok=True)\n"
              "            await asyncio.to_thread(self._complete_previous_active_run)\n"
          )
          new_start = (
              "    async def start(self) -> None:\n"
              "        async with self._lock:\n"
              "            await asyncio.to_thread(\n"
              "                _prepare_live_roots,\n"
              "                data_root=self.data_root,\n"
              "                live_root=self.live_root,\n"
              "                runs_root=self.runs_root,\n"
              "            )\n"
              "            await asyncio.to_thread(self._complete_previous_active_run)\n"
          )
          if new_start not in source:
              if source.count(old_start) != 1:
                  raise SystemExit("start root preparation target mismatch")
              source = source.replace(old_start, new_start, 1)

          old_source_state = (
              "            source_state = sources[source]\n"
              "            if not isinstance(source_state, dict):\n"
              "                raise RuntimeError(f\"previous {source} source state is invalid\")\n"
              "            if \"events_written\" not in source_state:\n"
              "                raise RuntimeError(f\"previous {source} events_written is missing\")\n"
              "            committed_rows = source_state[\"events_written\"]\n"
              "            allow_missing = (\n"
              "                source_state.get(\"configured\") is not True\n"
              "                and source_state.get(\"last_event_received_at_ms\") is None\n"
              "            )\n"
          )
          new_source_state = (
              "            committed_rows, allow_missing = _restart_source_commit_state(\n"
              "                sources[source], source=source\n"
              "            )\n"
          )
          if new_source_state not in source:
              if source.count(old_source_state) != 1:
                  raise SystemExit("configured-state extraction target mismatch")
              source = source.replace(old_source_state, new_source_state, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/ai_platform_integration/test_liquidation_live_restart_durability.py")
          tests = test_path.read_text(encoding="utf-8")
          if "test_start_rejects_symlinked_runtime_root_before_any_write" not in tests:
              marker = "\n\ndef test_restart_rejects_symlinked_run_root_without_mutating_external_target("
              if tests.count(marker) != 1:
                  raise SystemExit("startup root test marker mismatch")
              lines = [
                  "", "",
                  "@pytest.mark.parametrize(\"component\", [\"live\", \"runs\"])",
                  "def test_start_rejects_symlinked_runtime_root_before_any_write(",
                  "    tmp_path: Path, component: str",
                  ") -> None:",
                  "    external = tmp_path / f\"external-{component}\"",
                  "    external.mkdir()",
                  "    if component == \"live\":",
                  "        (tmp_path / \"live\").symlink_to(external, target_is_directory=True)",
                  "        expected = \"Liquid20 live root is not a regular directory\"",
                  "    else:",
                  "        live_root = tmp_path / \"live\"",
                  "        live_root.mkdir()",
                  "        (live_root / \"runs\").symlink_to(external, target_is_directory=True)",
                  "        expected = \"Liquid20 runs root is not a regular directory\"",
                  "    manager = OkxLiveRunManager(",
                  "        data_root=tmp_path,",
                  "        collector_commit=\"b\" * 40,",
                  "        host_id=\"synology-test\",",
                  "        now_ms=lambda: 1_786_384_683_792,",
                  "    )", "",
                  "    with pytest.raises(RuntimeError, match=expected):",
                  "        asyncio.run(manager.start())", "",
                  "    assert list(external.iterdir()) == []",
              ]
              tests = tests.replace(marker, "\n".join(lines) + marker, 1)

          if "test_restart_rejects_malformed_configured_without_mutating_source" not in tests:
              marker = "\n\ndef test_restart_rejects_missing_configured_zero_row_source(tmp_path: Path) -> None:\n"
              if tests.count(marker) != 1:
                  raise SystemExit("configured metadata test marker mismatch")
              lines = [
                  "", "",
                  "@pytest.mark.parametrize(\"configured_value\", [\"__missing__\", None, \"false\", 0])",
                  "def test_restart_rejects_malformed_configured_without_mutating_source(",
                  "    tmp_path: Path, configured_value: object",
                  ") -> None:",
                  "    old_run_id, old_run_root = _write_previous_active_run(",
                  "        tmp_path,",
                  "        committed_rows={BINANCE_SOURCE: 1, BYBIT_SOURCE: 0, OKX_SOURCE: 0},",
                  "        actual_rows={BINANCE_SOURCE: 2, BYBIT_SOURCE: 0, OKX_SOURCE: 0},",
                  "    )",
                  "    state_path = old_run_root / \"run-state-v1.json\"",
                  "    state = json.loads(state_path.read_text(encoding=\"utf-8\"))",
                  "    if configured_value == \"__missing__\":",
                  "        del state[\"sources\"][BINANCE_SOURCE][\"configured\"]",
                  "    else:",
                  "        state[\"sources\"][BINANCE_SOURCE][\"configured\"] = configured_value",
                  "    state_path.write_text(json.dumps(state), encoding=\"utf-8\")",
                  "    source_path = old_run_root / f\"{BINANCE_SOURCE}.ndjson\"",
                  "    original = source_path.read_bytes()",
                  "    manager = OkxLiveRunManager(",
                  "        data_root=tmp_path,",
                  "        collector_commit=\"c\" * 40,",
                  "        host_id=\"synology-test\",",
                  "        now_ms=lambda: 1_786_384_683_792,",
                  "    )", "",
                  "    with pytest.raises(RuntimeError, match=\"binance-usdm configured is invalid\"):",
                  "        asyncio.run(manager.start())", "",
                  "    assert source_path.read_bytes() == original",
                  "    persisted = json.loads(state_path.read_text(encoding=\"utf-8\"))",
                  "    assert persisted[\"run_state\"] == \"active\"",
                  "    pointer = json.loads((tmp_path / \"live\" / LIVE_STATE_FILE).read_text(encoding=\"utf-8\"))",
                  "    assert pointer[\"active_run_id\"] == old_run_id",
              ]
              tests = tests.replace(marker, "\n".join(lines) + marker, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.15.21

      - name: Format and validate combined repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff format ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m py_compile ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff format --check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          git diff --check

      - name: Record compact evidence and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          task = Path("docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md")
          text = task.read_text(encoding="utf-8")
          prefix = "## Context checkpoint\n\n```yaml\n"
          suffix = "\n```\n\n## Recovery checkpoint"
          start = text.index(prefix) + len(prefix)
          end = text.index(suffix, start)
          cp = text[start:end]
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          now = datetime.now(ZoneInfo("Europe/Warsaw")).replace(microsecond=0).isoformat()
          rows = cp.splitlines()
          for index, line in enumerate(rows):
              if line.startswith("updated_at:"):
                  rows[index] = f"updated_at: {now}"
              elif line.startswith("head:"):
                  rows[index] = f"head: {head}"
          cp = "\n".join(rows)
          validation = (
              "  - command: Startup-root and configured metadata fail-closed validation\n"
              "    result: PASS\n"
              f"    evidence: GitHub Actions run {os.environ['GITHUB_RUN_ID']} passed combined restart and legacy migration regression suite Ruff check format compile checkpoint and diff hygiene\n"
          )
          if "Startup-root and configured metadata fail-closed validation" not in cp:
              cp = cp.replace("blockers: []\n", validation + "blockers: []\n", 1)
          rows = cp.splitlines()
          for index, line in enumerate(rows):
              if line.startswith("next_action:"):
                  rows[index] = "next_action: Run retained ci:full exact-head CI plus a fresh independent Codex review with zero material findings, then squash-merge PR 1450 and continue protected Liquid20 recovery."
                  break
          text = text[:start] + "\n".join(rows) + text[end:]
          text = text.replace("  generation: 9\n", "  generation: 10\n", 1)
          task.write_text(text, encoding="utf-8")
          PY
          python3 tools/agents/checkpoint.py docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md --require-checkpoint
          git rm .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml
          git diff --check

      - name: Commit validated permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(liquidations): harden live restart root metadata"
          git pull --rebase origin fix/wickhunter-1396-synology-recovery-v2
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
