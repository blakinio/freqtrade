name: Portal WickHunter Restart FD Anchoring Repair

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml

permissions:
  contents: write

jobs:
  repair:
    name: Anchor recovered run and source opens to non-following descriptors
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 20

      - name: Apply descriptor-anchored repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          block_b64 = ""
          method_b64 = ""
          test_b64 = ""
          source_path = Path("ai_platform/scripts/liquidation_live_stream.py")
          text = source_path.read_text(encoding="utf-8")
          start = text.index("\ndef _seal_committed_ndjson(")
          end = text.index("\ndef _prepare_live_roots(", start)
          block = base64.b64decode(block_b64).decode()
          text = text[:start] + "\n" + block + text[end:]
          method_start = text.index("    def _complete_previous_active_run(self) -> None:\n")
          method_end = text.index("\n    def _start_new_run(self, now_ms: int) -> None:\n", method_start)
          method = base64.b64decode(method_b64).decode()
          text = text[:method_start] + method + text[method_end:]
          source_path.write_text(text, encoding="utf-8")
          test_path = Path("tests/ai_platform_integration/test_liquidation_live_restart_durability.py")
          tests = test_path.read_text(encoding="utf-8")
          if "import os\n" not in tests:
              tests = tests.replace("import json\n", "import json\nimport os\n", 1)
          if "test_seal_anchors_source_to_open_run_directory_after_path_swap" not in tests:
              marker = "\n\ndef test_restart_rejects_symlinked_run_root_without_mutating_external_target("
              if tests.count(marker) != 1:
                  raise SystemExit("descriptor race regression insertion marker mismatch")
              tests = tests.replace(marker, base64.b64decode(test_b64).decode() + marker, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install and validate focused repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.15.21
          python3 -m ruff format ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m py_compile ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff format --check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          git diff --check

      - name: Record evidence, self-clean, and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          task = Path("docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md")
          text = task.read_text(encoding="utf-8")
          prefix = "## Context checkpoint\n\n```yaml\n"
          suffix = "\n```\n\n## Recovery checkpoint"
          start = text.index(prefix) + len(prefix)
          end = text.index(suffix, start)
          cp = text[start:end]
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          now = datetime.now(ZoneInfo("Europe/Warsaw")).replace(microsecond=0).isoformat()
          rows = cp.splitlines()
          for index, line in enumerate(rows):
              if line.startswith("updated_at:"):
                  rows[index] = f"updated_at: {now}"
              elif line.startswith("head:"):
                  rows[index] = f"head: {head}"
              elif line.startswith("next_action:"):
                  rows[index] = "next_action: Run final retained ci:full exact-head CI plus fresh independent Codex review with zero material findings, then squash-merge PR 1450 and continue protected Liquid20 recovery."
          cp = "\n".join(rows)
          validation = "  - command: Descriptor-anchored restart sealing TOCTOU regression validation\n    result: PASS\n    evidence: GitHub Actions run " + os.environ["GITHUB_RUN_ID"] + " passed focused restart and legacy migration tests Ruff check format compile checkpoint and diff hygiene\n"
          if "Descriptor-anchored restart sealing TOCTOU regression validation" not in cp:
              cp = cp.replace("blockers: []\n", validation + "blockers: []\n", 1)
          text = text[:start] + cp + text[end:]
          text = text.replace("  generation: 11\n", "  generation: 12\n", 1)
          task.write_text(text, encoding="utf-8")
          PY
          python3 tools/agents/checkpoint.py docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md --require-checkpoint
          git rm .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(liquidations): anchor restart sealing to directory descriptors"
          git pull --rebase origin fix/wickhunter-1396-synology-recovery-v2
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
