name: Portal WickHunter Legacy Fixture Bookkeeping

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml

permissions:
  contents: write

jobs:
  finalize:
    name: Update checkpoint and self-clean
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 20

      - name: Update context checkpoint by section
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md")
          text = path.read_text(encoding="utf-8")
          prefix = "## Context checkpoint\n\n```yaml\n"
          suffix = "\n```\n\n## Recovery checkpoint"
          start = text.index(prefix) + len(prefix)
          end = text.index(suffix, start)
          lines = text[start:end].splitlines()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          now = datetime.now(ZoneInfo("Europe/Warsaw")).replace(microsecond=0).isoformat()

          current = None
          output = []
          inserted = {"context_routes": False, "owned_paths": False, "changed_paths": False, "proven": False, "validation": False}
          new_path = "  - tests/ai_platform_integration/test_liquidation_okx_live_source.py"
          validation_marker = "  - command: Focused restart and legacy OKX migration fixture validation"

          for line in lines:
              if line.startswith("updated_at:"):
                  line = f"updated_at: {now}"
              elif line.startswith("head:"):
                  line = f"head: {head}"

              if line.startswith("blockers:") and not inserted["validation"]:
                  output.extend([
                      validation_marker,
                      "    result: PASS",
                      "    evidence: GitHub Actions run 31434035985 job 93603982630 passed 14 focused integration tests plus Ruff check and format before the bookkeeping-only failure",
                  ])
                  inserted["validation"] = True

              if line and not line.startswith(" ") and line.endswith(":"):
                  current = line[:-1]

              output.append(line)

              if current in {"context_routes", "owned_paths", "changed_paths"} and line == "  - tests/ai_platform_integration/test_liquidation_live_restart_durability.py":
                  output.append(new_path)
                  inserted[current] = True

              if current == "proven" and "exact focused validation passed on head 2c3cb8387c22e3fb3864abeea312aa79476c84b1" in line:
                  output.append("  - full ci:full compatibility testing exposed a stale legacy migration fixture that declared configured zero-row Bybit and Binance sources without their regular empty files; the fixture now models the valid historical contract without weakening production fail-closed behavior")
                  inserted["proven"] = True

          missing = [name for name, done in inserted.items() if not done]
          if missing:
              raise SystemExit(f"checkpoint section update incomplete: {missing}")

          rows = output
          for index, line in enumerate(rows):
              if line.startswith("next_action:"):
                  rows[index] = "next_action: Run retained ci:full exact-head CI and a fresh independent Codex review on the final four-path permanent diff, then squash-merge PR 1450 and continue the authorized protected Liquid20 recovery chain."
                  break
          else:
              raise SystemExit("context checkpoint next_action missing")

          text = text[:start] + "\n".join(rows) + text[end:]
          text = text.replace("  generation: 6\n", "  generation: 7\n", 1)
          path.write_text(text, encoding="utf-8")
          PY
          python3 tools/agents/checkpoint.py docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md --require-checkpoint
          git rm .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml
          git diff --check

      - name: Commit final bookkeeping and self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(wickhunter): record legacy fixture validation"
          git pull --rebase origin fix/wickhunter-1396-synology-recovery-v2
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
