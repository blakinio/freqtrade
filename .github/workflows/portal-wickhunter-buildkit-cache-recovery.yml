name: Portal WickHunter Liquid20 Restart Sealing Validation

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml
      - ai_platform/scripts/liquidation_live_stream.py
      - tests/ai_platform_integration/test_liquidation_live_restart_durability.py

permissions:
  contents: read

concurrency:
  group: portal-wickhunter-1396-liquid20-restart-sealing
  cancel-in-progress: true

jobs:
  validate:
    name: Focused restart durability tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: false
          python-version: "3.12"

      - name: Install bounded dependencies
        run: |
          uv pip install -r requirements.txt
          uv pip install pytest==9.1.1 ruff==0.15.21
          uv pip install --no-deps -e .

      - name: Compile touched Python
        run: |
          python -m py_compile ai_platform/scripts/liquidation_live_stream.py
          python -m py_compile tests/ai_platform_integration/test_liquidation_live_restart_durability.py

      - name: Run focused restart durability tests
        run: >-
          python -m pytest -q -o addopts=''
          --confcutdir=tests/ai_platform_integration
          tests/ai_platform_integration/test_liquidation_live_restart_durability.py

      - name: Ruff touched Python
        run: >-
          ruff check
          ai_platform/scripts/liquidation_live_stream.py
          tests/ai_platform_integration/test_liquidation_live_restart_durability.py

      - name: Ruff format touched Python
        run: >-
          ruff format --check
          ai_platform/scripts/liquidation_live_stream.py
          tests/ai_platform_integration/test_liquidation_live_restart_durability.py
