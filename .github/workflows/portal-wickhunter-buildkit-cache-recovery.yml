name: Portal WickHunter Run Root Integrity Repair

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml

permissions:
  contents: write

jobs:
  repair:
    name: Reject symlinked run roots before source mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 20

      - name: Apply run-root integrity guard and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("ai_platform/scripts/liquidation_live_stream.py")
          source = source_path.read_text(encoding="utf-8")
          if "import stat\n" not in source:
              source = source.replace("import re\n", "import re\nimport stat\n", 1)
          old = (
              "            run_root = self.runs_root / run_id\n"
              "            state_path = run_root / RUN_STATE_FILE\n"
          )
          new = (
              "            run_root = self.runs_root / run_id\n"
              "            try:\n"
              "                runs_root_stat = self.runs_root.lstat()\n"
              "                run_root_stat = run_root.lstat()\n"
              "            except FileNotFoundError:\n"
              "                return\n"
              "            if (\n"
              "                not stat.S_ISDIR(runs_root_stat.st_mode)\n"
              "                or stat.S_ISLNK(runs_root_stat.st_mode)\n"
              "                or not stat.S_ISDIR(run_root_stat.st_mode)\n"
              "                or stat.S_ISLNK(run_root_stat.st_mode)\n"
              "            ):\n"
              "                raise RuntimeError(\"previous live run root is not a regular directory\")\n"
              "            state_path = run_root / RUN_STATE_FILE\n"
          )
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit("run-root guard insertion target mismatch")
              source = source.replace(old, new, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/ai_platform_integration/test_liquidation_live_restart_durability.py")
          tests = test_path.read_text(encoding="utf-8")
          test_name = "test_restart_rejects_symlinked_run_root_without_mutating_external_target"
          if test_name not in tests:
              marker = "\n\ndef test_restart_rejects_dangling_symlink_even_with_zero_committed_rows("
              if tests.count(marker) != 1:
                  raise SystemExit("run-root regression marker mismatch")
              lines = [
                  "", "",
                  "def test_restart_rejects_symlinked_run_root_without_mutating_external_target(",
                  "    tmp_path: Path,",
                  ") -> None:",
                  "    old_run_id, old_run_root = _write_previous_active_run(",
                  "        tmp_path,",
                  "        committed_rows={BINANCE_SOURCE: 1, BYBIT_SOURCE: 0, OKX_SOURCE: 0},",
                  "        actual_rows={BINANCE_SOURCE: 2, BYBIT_SOURCE: 0, OKX_SOURCE: 0},",
                  "    )",
                  "    external_root = tmp_path / \"external-run\"",
                  "    old_run_root.rename(external_root)",
                  "    old_run_root.symlink_to(external_root, target_is_directory=True)",
                  "    external_source = external_root / f\"{BINANCE_SOURCE}.ndjson\"",
                  "    original = external_source.read_bytes()",
                  "    manager = OkxLiveRunManager(",
                  "        data_root=tmp_path,",
                  "        collector_commit=\"a\" * 40,",
                  "        host_id=\"synology-test\",",
                  "        now_ms=lambda: 1_786_384_683_792,",
                  "    )", "",
                  "    with pytest.raises(RuntimeError, match=\"previous live run root is not a regular directory\"):",
                  "        asyncio.run(manager.start())", "",
                  "    assert external_source.read_bytes() == original",
                  "    pointer = json.loads((tmp_path / \"live\" / LIVE_STATE_FILE).read_text(encoding=\"utf-8\"))",
                  "    assert pointer[\"active_run_id\"] == old_run_id",
                  "    assert old_run_root.is_symlink()",
              ]
              tests = tests.replace(marker, "\n".join(lines) + marker, 1)
              test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.15.21

      - name: Format and validate run-root repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff format ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m py_compile ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py \
            tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff format --check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          git diff --check

      - name: Record evidence and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          task = Path("docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md")
          text = task.read_text(encoding="utf-8")
          prefix = "## Context checkpoint\n\n```yaml\n"
          suffix = "\n```\n\n## Recovery checkpoint"
          start = text.index(prefix) + len(prefix)
          end = text.index(suffix, start)
          cp = text[start:end]
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          now = datetime.now(ZoneInfo("Europe/Warsaw")).replace(microsecond=0).isoformat()
          rows = cp.splitlines()
          for index, line in enumerate(rows):
              if line.startswith("updated_at:"):
                  rows[index] = f"updated_at: {now}"
              elif line.startswith("head:"):
                  rows[index] = f"head: {head}"
          cp = "\n".join(rows)
          proof = "  - restart now rejects symlinked live/runs and active run directories before reading state or opening source files, preventing truncation through a symlinked run-root ancestor"
          if proof not in cp:
              cp = cp.replace("derived:\n", proof + "\nderived:\n", 1)
          validation = (
              "  - command: Symlinked run-root fail-closed regression validation\n"
              "    result: PASS\n"
              f"    evidence: GitHub Actions run {os.environ['GITHUB_RUN_ID']} passed focused restart and legacy migration tests Ruff check format compile checkpoint and diff hygiene\n"
          )
          if "Symlinked run-root fail-closed regression validation" not in cp:
              cp = cp.replace("blockers: []\n", validation + "blockers: []\n", 1)
          rows = cp.splitlines()
          for index, line in enumerate(rows):
              if line.startswith("next_action:"):
                  rows[index] = "next_action: Run retained ci:full exact-head CI plus a fresh independent Codex review with zero material findings, then squash-merge PR 1450 and continue protected Liquid20 recovery."
                  break
          text = text[:start] + "\n".join(rows) + text[end:]
          text = text.replace("  generation: 8\n", "  generation: 9\n", 1)
          task.write_text(text, encoding="utf-8")
          PY
          python3 tools/agents/checkpoint.py docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md --require-checkpoint
          git rm .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml
          git diff --check

      - name: Commit validated run-root repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(liquidations): reject symlinked restart run roots"
          git pull --rebase origin fix/wickhunter-1396-synology-recovery-v2
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
