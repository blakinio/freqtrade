name: Portal WickHunter Liquid20 Exact Lint Repair

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml

permissions:
  contents: write

concurrency:
  group: portal-wickhunter-1396-liquid20-lint-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Apply two proven E501 repairs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 1

      - name: Apply exact source formatting repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("ai_platform/scripts/liquidation_live_stream.py"): (
                  "    if isinstance(committed_rows, bool) or not isinstance(committed_rows, int) or committed_rows < 0:\n",
                  "    if (\n"
                  "        isinstance(committed_rows, bool)\n"
                  "        or not isinstance(committed_rows, int)\n"
                  "        or committed_rows < 0\n"
                  "    ):\n",
              ),
              Path("tests/ai_platform_integration/test_liquidation_live_restart_durability.py"): (
                  "    with pytest.raises(RuntimeError, match=\"binance-usdm source file has fewer rows than committed\"):\n",
                  "    with pytest.raises(\n"
                  "        RuntimeError, match=\"binance-usdm source file has fewer rows than committed\"\n"
                  "    ):\n",
              ),
          }
          for path, (before, after) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if text.count(before) != 1:
                  raise SystemExit(f"expected exactly one target in {path}")
              path.write_text(text.replace(before, after), encoding="utf-8")
          PY
          git diff --check
          git diff -- ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py

      - name: Commit exact repairs to recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git diff --cached --quiet && exit 1
          git commit -m "style(liquidations): satisfy focused restart lint"
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
