name: Portal WickHunter Permanent Diff Bookkeeping

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml

permissions:
  contents: write

jobs:
  checkpoint:
    name: Remove temporary workflow from permanent task paths
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 20

      - name: Finalize task bookkeeping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md")
          text = path.read_text(encoding="utf-8")
          temp_line = "  - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml\n"
          if text.count(temp_line) != 2:
              raise SystemExit("expected temporary workflow in owned_paths and changed_paths only")
          text = text.replace(temp_line, "")
          old = ".github/workflows/portal-wickhunter-buildkit-cache-recovery.yml` was used only for bounded recovery diagnostics and focused repository validation. Exact focused validation passed in run `31433026457` / job `93600693019` after the final durability and formatting repairs. The workflow is now scheduled for deletion before retained exact-head CI and cannot serve as final merge evidence."
          new = ".github/workflows/portal-wickhunter-buildkit-cache-recovery.yml` was used only for bounded recovery diagnostics and focused repository validation. Exact focused validation passed in run `31433026457` / job `93600693019` after the final durability and formatting repairs. The temporary workflow is intentionally absent from the permanent merge diff and cannot serve as final merge evidence."
          if text.count(old) != 1:
              raise SystemExit("temporary workflow prose target mismatch")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python3 tools/agents/checkpoint.py docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md --require-checkpoint
          git diff --check

      - name: Commit task bookkeeping only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md
          git diff --cached --quiet && exit 1
          git commit -m "docs(wickhunter): finalize permanent recovery diff"
          git pull --rebase origin fix/wickhunter-1396-synology-recovery-v2
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
