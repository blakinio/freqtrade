name: Portal WickHunter Liquid20 Exact Format Repair

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml

permissions:
  contents: write

concurrency:
  group: portal-wickhunter-1396-liquid20-format-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Apply formatter to proven test only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 1

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.15.21

      - name: Format only the proven failing test
        shell: bash
        run: |
          set -euo pipefail
          ruff format tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          ruff format --check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          ruff check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git diff --check
          git diff -- tests/ai_platform_integration/test_liquidation_live_restart_durability.py

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git diff --cached --quiet && exit 1
          git commit -m "style(liquidations): apply ruff format to restart test"
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
