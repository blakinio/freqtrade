name: Portal WickHunter Liquid20 Hardened Restart Validation

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml
      - ai_platform/scripts/liquidation_live_stream.py
      - tests/ai_platform_integration/test_liquidation_live_restart_durability.py
      - docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md

permissions:
  contents: read

concurrency:
  group: portal-wickhunter-1396-liquid20-hardened-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact hardened restart contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: false
          python-version: "3.12"

      - name: Install bounded dependencies
        run: |
          uv pip install -r requirements.txt
          uv pip install pytest==9.1.1 ruff==0.15.21
          uv pip install --no-deps -e .

      - name: Validate canonical recovery checkpoint
        run: >-
          python tools/agents/checkpoint.py
          docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md
          --require-checkpoint

      - name: Compile touched Python
        run: |
          python -m py_compile ai_platform/scripts/liquidation_live_stream.py
          python -m py_compile tests/ai_platform_integration/test_liquidation_live_restart_durability.py

      - name: Run focused restart durability suite
        run: >-
          python -m pytest -q -o addopts=''
          --confcutdir=tests/ai_platform_integration
          tests/ai_platform_integration/test_liquidation_live_restart_durability.py

      - name: Ruff touched Python
        run: >-
          ruff check
          ai_platform/scripts/liquidation_live_stream.py
          tests/ai_platform_integration/test_liquidation_live_restart_durability.py

      - name: Ruff format touched Python
        run: >-
          ruff format --check
          ai_platform/scripts/liquidation_live_stream.py
          tests/ai_platform_integration/test_liquidation_live_restart_durability.py

      - name: Verify producer-consumer restart invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          producer = Path("ai_platform/scripts/liquidation_live_stream.py").read_text(encoding="utf-8")
          consumer = Path("ai_platform/wickhunter/candidate_paper_runtime_operator.py").read_text(encoding="utf-8")
          required_producer = [
              "if set(sources) != expected_sources:",
              "if allow_missing and committed_rows == 0:",
              "if path.is_symlink():",
              "handle.truncate(committed_end)",
              "os.fsync(handle.fileno())",
          ]
          required_consumer = [
              "if tuple(sorted(source_payloads)) != EXPECTED_LIVE_SOURCES:",
              "events_written == 0",
              "and not configured",
              "source_row.get(\"last_event_received_at_ms\") is None",
          ]
          for marker in required_producer:
              if marker not in producer:
                  raise SystemExit(f"missing producer invariant: {marker}")
          for marker in required_consumer:
              if marker not in consumer:
                  raise SystemExit(f"missing consumer invariant: {marker}")
          print("PRODUCER_CONSUMER_RESTART_CONTRACT=PASS")
          PY

      - name: Validate diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          echo "VALIDATED_HEAD=$GITHUB_SHA"
