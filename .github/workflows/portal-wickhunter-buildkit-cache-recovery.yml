name: Portal WickHunter Durability Repair Checkpoint

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml

permissions:
  contents: write

concurrency:
  group: portal-wickhunter-1396-durability-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint:
    name: Persist pending durability repair state
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 20

      - name: Update canonical checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one checkpoint target: {old[:96]}")
              text = text.replace(old, new, 1)

          replace_once(
              "updated_at: 2026-08-10T22:16:00+02:00\nhead: 1bb288c9e7f4f8b858b5cdd3054f8d09b27ab61a",
              "updated_at: 2026-08-10T22:50:00+02:00\nhead: 91a96ce32c9e9e7e7fd64c05d890dc860572f210",
          )
          replace_once("status: validating\ncontext_routes:", "status: waiting\ncontext_routes:")
          replace_once(
              "  - focused restart durability regression coverage passes after the review repair\nderived:",
              "  - focused restart durability regression coverage passes after the review repair\n"
              "  - static durability audit proved state-writing paths can persist events_written while NDJSON writes are still pending because _write_state does not centrally flush writers\n"
              "derived:",
          )
          replace_once(
              "unknown:\n  - final exact-head PR 1450 standard CI result after temporary workflow removal",
              "unknown:\n"
              "  - terminal result and pushed commit from durability repair run 31430668536\n"
              "  - final exact-head PR 1450 standard CI result after temporary workflow removal",
          )
          replace_once(
              "next_action: Complete PR 1450 exact-head validation and review, remove the temporary recovery workflow, merge only when gates pass, then observe canonical Liquid20 deployment before applying the single guarded completed-history commit-boundary repair through the protected Synology environment.",
              "next_action: Inspect durability repair run 31430668536 once when terminal; on PASS verify its pushed code commit and run exact focused validation, otherwise inspect only its first actionable failure.",
          )
          path.write_text(text, encoding="utf-8")
          PY
          python tools/agents/checkpoint.py \
            docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md \
            --require-checkpoint
          git diff --check

      - name: Commit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md
          git diff --cached --quiet && exit 1
          git commit -m "docs(wickhunter): checkpoint pending durability repair"
          git pull --rebase origin fix/wickhunter-1396-synology-recovery-v2
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
