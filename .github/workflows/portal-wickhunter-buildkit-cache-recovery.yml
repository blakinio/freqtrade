name: Portal WickHunter Restart FD Anchoring Repair

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml

permissions:
  contents: write

jobs:
  repair:
    name: Anchor recovered run and source opens to non-following descriptors
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 20

      - name: Apply descriptor-anchored restart sealing repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("ai_platform/scripts/liquidation_live_stream.py")
          text = source_path.read_text(encoding="utf-8")

          seal_start = text.index("\ndef _seal_committed_ndjson(")
          seal_end = text.index("\ndef _prepare_live_roots(", seal_start)
          replacement = '''

def _secure_directory_flags() -> int:
    directory_flag = getattr(os, "O_DIRECTORY", None)
    nofollow_flag = getattr(os, "O_NOFOLLOW", None)
    if directory_flag is None or nofollow_flag is None:
        raise RuntimeError("secure Liquid20 restart filesystem traversal is unsupported")
    return os.O_RDONLY | directory_flag | nofollow_flag | getattr(os, "O_CLOEXEC", 0)


def _open_restart_run_root_fd(data_root: Path, run_id: str) -> int | None:
    flags = _secure_directory_flags()
    opened: list[int] = []
    try:
        current_fd = os.open(data_root, flags)
        opened.append(current_fd)
        if not stat.S_ISDIR(os.fstat(current_fd).st_mode):
            raise RuntimeError("Liquid20 data root is not a regular directory")
        for component in ("live", "runs", run_id):
            current_fd = os.open(component, flags, dir_fd=current_fd)
            opened.append(current_fd)
            if not stat.S_ISDIR(os.fstat(current_fd).st_mode):
                raise RuntimeError("previous live run root is not a regular directory")
        run_root_fd = opened.pop()
        return run_root_fd
    except FileNotFoundError:
        return None
    except OSError as exc:
        raise RuntimeError("previous live run root is not a regular directory") from exc
    finally:
        for descriptor in reversed(opened):
            os.close(descriptor)


def _read_json_regular_at(directory_fd: int, file_name: str) -> dict[str, object] | None:
    nofollow_flag = getattr(os, "O_NOFOLLOW", None)
    if nofollow_flag is None:
        raise RuntimeError("secure Liquid20 restart file access is unsupported")
    try:
        descriptor = os.open(
            file_name,
            os.O_RDONLY | nofollow_flag | getattr(os, "O_CLOEXEC", 0),
            dir_fd=directory_fd,
        )
    except FileNotFoundError:
        return None
    except OSError as exc:
        raise RuntimeError("previous live state path is not a regular file") from exc
    item = os.fstat(descriptor)
    if not stat.S_ISREG(item.st_mode):
        os.close(descriptor)
        raise RuntimeError("previous live state path is not a regular file")
    with os.fdopen(descriptor, "r", encoding="utf-8") as handle:
        payload = json.load(handle)
    if not isinstance(payload, dict):
        raise TypeError("previous live state is invalid")
    return payload


def _write_json_atomic_at(
    directory_fd: int, file_name: str, payload: dict[str, object]
) -> None:
    nofollow_flag = getattr(os, "O_NOFOLLOW", None)
    if nofollow_flag is None:
        raise RuntimeError("secure Liquid20 restart file access is unsupported")
    temporary_name = f".{file_name}.{os.getpid()}.{time.time_ns()}.tmp"
    descriptor = -1
    try:
        descriptor = os.open(
            temporary_name,
            os.O_WRONLY
            | os.O_CREAT
            | os.O_EXCL
            | nofollow_flag
            | getattr(os, "O_CLOEXEC", 0),
            0o600,
            dir_fd=directory_fd,
        )
        with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
            descriptor = -1
            json.dump(payload, handle, indent=2, sort_keys=True)
            handle.write("\n")
            handle.flush()
            os.fsync(handle.fileno())
        os.replace(
            temporary_name,
            file_name,
            src_dir_fd=directory_fd,
            dst_dir_fd=directory_fd,
        )
        os.fsync(directory_fd)
    finally:
        if descriptor >= 0:
            os.close(descriptor)
        try:
            os.unlink(temporary_name, dir_fd=directory_fd)
        except FileNotFoundError:
            pass


def _seal_committed_ndjson(
    path: Path,
    *,
    committed_rows: int,
    source: str,
    allow_missing: bool,
    directory_fd: int | None = None,
) -> None:
    if (
        isinstance(committed_rows, bool)
        or not isinstance(committed_rows, int)
        or committed_rows < 0
    ):
        raise RuntimeError(f"previous {source} events_written is invalid")
    nofollow_flag = getattr(os, "O_NOFOLLOW", None)
    if nofollow_flag is None:
        raise RuntimeError("secure Liquid20 restart file access is unsupported")

    owned_directory_fd: int | None = None
    if directory_fd is None:
        try:
            owned_directory_fd = os.open(path.parent, _secure_directory_flags())
        except OSError as exc:
            raise RuntimeError(f"previous {source} source path is not a regular file") from exc
        directory_fd = owned_directory_fd

    try:
        try:
            descriptor = os.open(
                path.name,
                os.O_RDWR | nofollow_flag | getattr(os, "O_CLOEXEC", 0),
                dir_fd=directory_fd,
            )
        except FileNotFoundError:
            if allow_missing and committed_rows == 0:
                return
            if committed_rows == 0:
                raise RuntimeError(f"previous {source} source file is missing")
            raise RuntimeError(f"previous {source} source file is missing committed rows")
        except OSError as exc:
            raise RuntimeError(f"previous {source} source path is not a regular file") from exc

        item = os.fstat(descriptor)
        if not stat.S_ISREG(item.st_mode):
            os.close(descriptor)
            raise RuntimeError(f"previous {source} source path is not a regular file")
        with os.fdopen(descriptor, "r+b") as handle:
            committed_end = 0
            for _ in range(committed_rows):
                row = handle.readline()
                if not row or not row.endswith(b"\n") or not row.strip():
                    raise RuntimeError(
                        f"previous {source} source file has fewer rows than committed"
                    )
                committed_end = handle.tell()
            if handle.read(1):
                handle.truncate(committed_end)
            handle.flush()
            os.fsync(handle.fileno())
    finally:
        if owned_directory_fd is not None:
            os.close(owned_directory_fd)
'''
          text = text[:seal_start] + replacement + text[seal_end:]

          method_start = text.index("    def _complete_previous_active_run(self) -> None:\n")
          method_end = text.index("\n    def _start_new_run(self, now_ms: int) -> None:\n", method_start)
          method = '''    def _complete_previous_active_run(self) -> None:
        pointer = self.live_root / LIVE_STATE_FILE
        if not pointer.exists() or pointer.is_symlink():
            return
        try:
            payload = json.loads(pointer.read_text(encoding="utf-8"))
            run_id = payload.get("active_run_id")
            if not isinstance(run_id, str) or not RUN_ID_PATTERN.fullmatch(run_id):
                return
        except (OSError, TypeError, ValueError, json.JSONDecodeError):
            return

        run_root_fd = _open_restart_run_root_fd(self.data_root, run_id)
        if run_root_fd is None:
            return
        try:
            try:
                state = _read_json_regular_at(run_root_fd, RUN_STATE_FILE)
            except (TypeError, ValueError, json.JSONDecodeError):
                return
            if state is None or state.get("run_state") != "active":
                return

            sources = state.get("sources")
            if not isinstance(sources, dict):
                raise RuntimeError("previous live source state is invalid")
            expected_sources = {BYBIT_SOURCE, BINANCE_SOURCE, OKX_SOURCE}
            if set(sources) != expected_sources:
                raise RuntimeError("previous live source set is invalid")
            run_root = self.runs_root / run_id
            for source in (BYBIT_SOURCE, BINANCE_SOURCE, OKX_SOURCE):
                committed_rows, allow_missing = _restart_source_commit_state(
                    sources[source], source=source
                )
                _seal_committed_ndjson(
                    run_root / f"{source}.ndjson",
                    committed_rows=committed_rows,
                    source=source,
                    allow_missing=allow_missing,
                    directory_fd=run_root_fd,
                )

            state["run_state"] = "completed"
            state["data_mode"] = "historical"
            state["completed_at_ms"] = self._now_ms()
            state["completion_reason"] = "collector-restart"
            _write_json_atomic_at(run_root_fd, RUN_STATE_FILE, state)
        finally:
            os.close(run_root_fd)
'''
          text = text[:method_start] + method + text[method_end:]
          source_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/ai_platform_integration/test_liquidation_live_restart_durability.py")
          tests = test_path.read_text(encoding="utf-8")
          if "import os\n" not in tests:
              tests = tests.replace("import json\n", "import json\nimport os\n", 1)
          test_name = "test_seal_anchors_source_to_open_run_directory_after_path_swap"
          if test_name not in tests:
              marker = "\n\ndef test_restart_rejects_symlinked_run_root_without_mutating_external_target("
              if tests.count(marker) != 1:
                  raise SystemExit("descriptor race regression insertion marker mismatch")
              addition = '''


def test_seal_anchors_source_to_open_run_directory_after_path_swap(tmp_path: Path) -> None:
    run_root = tmp_path / "run"
    run_root.mkdir()
    source_path = run_root / f"{BINANCE_SOURCE}.ndjson"
    source_path.write_text('{"row":1}\n{"row":2}\n', encoding="utf-8")
    external_root = tmp_path / "external"
    external_root.mkdir()
    external_source = external_root / f"{BINANCE_SOURCE}.ndjson"
    external_payload = b'{"external":1}\n{"external":2}\n'
    external_source.write_bytes(external_payload)
    run_root_fd = os.open(
        run_root,
        os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,
    )
    archived_root = tmp_path / "archived-run"
    try:
        run_root.rename(archived_root)
        run_root.symlink_to(external_root, target_is_directory=True)
        _seal_committed_ndjson(
            run_root / f"{BINANCE_SOURCE}.ndjson",
            committed_rows=1,
            source=BINANCE_SOURCE,
            allow_missing=False,
            directory_fd=run_root_fd,
        )
    finally:
        os.close(run_root_fd)

    assert external_source.read_bytes() == external_payload
    assert (archived_root / f"{BINANCE_SOURCE}.ndjson").read_text(encoding="utf-8") == (
        '{"row":1}\n'
    )
'''
              tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install focused validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.15.21

      - name: Format and validate descriptor repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff format ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m py_compile ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py \
            tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff format --check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          git diff --check

      - name: Record compact evidence and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          task = Path("docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md")
          text = task.read_text(encoding="utf-8")
          prefix = "## Context checkpoint\n\n```yaml\n"
          suffix = "\n```\n\n## Recovery checkpoint"
          start = text.index(prefix) + len(prefix)
          end = text.index(suffix, start)
          cp = text[start:end]
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          now = datetime.now(ZoneInfo("Europe/Warsaw")).replace(microsecond=0).isoformat()
          rows = cp.splitlines()
          for index, line in enumerate(rows):
              if line.startswith("updated_at:"):
                  rows[index] = f"updated_at: {now}"
              elif line.startswith("head:"):
                  rows[index] = f"head: {head}"
          cp = "\n".join(rows)
          validation = (
              "  - command: Descriptor-anchored restart sealing TOCTOU regression validation\n"
              "    result: PASS\n"
              f"    evidence: GitHub Actions run {os.environ['GITHUB_RUN_ID']} passed focused restart and legacy migration tests Ruff check format compile checkpoint and diff hygiene\n"
          )
          if "Descriptor-anchored restart sealing TOCTOU regression validation" not in cp:
              if "blockers: []\n" not in cp:
                  raise SystemExit("blockers marker missing")
              cp = cp.replace("blockers: []\n", validation + "blockers: []\n", 1)
          rows = cp.splitlines()
          for index, line in enumerate(rows):
              if line.startswith("next_action:"):
                  rows[index] = "next_action: Run final retained ci:full exact-head CI plus fresh independent Codex review with zero material findings, then squash-merge PR 1450 and continue protected Liquid20 recovery."
                  break
          text = text[:start] + "\n".join(rows) + text[end:]
          text = text.replace("  generation: 11\n", "  generation: 12\n", 1)
          task.write_text(text, encoding="utf-8")
          PY
          python3 tools/agents/checkpoint.py docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md --require-checkpoint
          git rm .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml
          git diff --check

      - name: Commit validated permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(liquidations): anchor restart sealing to directory descriptors"
          git pull --rebase origin fix/wickhunter-1396-synology-recovery-v2
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
