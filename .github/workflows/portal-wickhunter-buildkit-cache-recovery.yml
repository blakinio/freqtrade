name: Portal WickHunter Post-Repair Checkpoint

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml

permissions:
  contents: write

concurrency:
  group: portal-wickhunter-1396-post-repair-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint:
    name: Persist exact post-repair durable state
    runs-on:
      - freqtrade-staging
    timeout-minutes: 8
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 20

      - name: Verify repair markers and update checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          task = Path("docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md")
          source = Path("ai_platform/scripts/liquidation_live_stream.py").read_text(encoding="utf-8")
          tests = Path("tests/ai_platform_integration/test_liquidation_live_restart_durability.py").read_text(encoding="utf-8")
          text = task.read_text(encoding="utf-8")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          repair_present = all(
              marker in source
              for marker in (
                  "    def closed(self) -> bool:\n",
                  "        if not writer.closed:\n",
                  "            writer.flush()\n",
              )
          ) and "test_state_commit_flushes_pending_ndjson_before_events_written" in tests

          match = re.search(
              r"(?ms)^## Context checkpoint\s*$.*?^```(?:yaml|yml)\s*$\n(.*?)^```\s*$",
              text,
          )
          if match is None:
              raise SystemExit("canonical Context checkpoint not found")
          block = match.group(1)

          block = re.sub(r"(?m)^updated_at: .*?$", "updated_at: 2026-08-10T22:56:00+02:00", block, count=1)
          block = re.sub(r"(?m)^head: .*?$", f"head: {head}", block, count=1)
          block = re.sub(
              r"(?m)^status: .*?$",
              "status: ready" if repair_present else "status: waiting",
              block,
              count=1,
          )

          old_unknown = "  - terminal result and pushed commit from durability repair run 31430668536\n"
          if old_unknown in block:
              block = block.replace(old_unknown, "", 1)

          proof = (
              "  - durability repair is present in source and regression test on the exact pre-checkpoint head\n"
          )
          anchor = (
              "  - static durability audit proved state-writing paths can persist events_written while NDJSON writes are still pending because _write_state does not centrally flush writers\n"
          )
          if repair_present and proof not in block:
              if anchor not in block:
                  raise SystemExit("durability audit anchor missing")
              block = block.replace(anchor, anchor + proof, 1)

          next_action = (
              "next_action: Run exact focused tests lint format checkpoint validation and producer-consumer durability assertions on the current branch head, then remove the temporary recovery workflow before retained full CI and fresh independent audit."
              if repair_present
              else "next_action: Inspect the repo-only durability repair execution once terminal and repair only its first actionable failure; do not proceed to final CI until source and regression markers are present."
          )
          if re.search(r"(?m)^next_action: .*?$", block) is None:
              raise SystemExit("next_action missing from checkpoint")
          block = re.sub(r"(?m)^next_action: .*?$", next_action, block, count=1)

          new_text = text[: match.start(1)] + block + text[match.end(1) :]
          task.write_text(new_text, encoding="utf-8")
          print(f"POST_REPAIR_CHECKPOINT_STATUS={'ready' if repair_present else 'waiting'}")
          print(f"POST_REPAIR_CHECKPOINT_HEAD={head}")
          PY
          python3 tools/agents/checkpoint.py \
            docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md \
            --require-checkpoint
          git diff --check

      - name: Commit checkpoint when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md
          if git diff --cached --quiet; then
            echo "POST_REPAIR_CHECKPOINT_COMMIT=unchanged"
            exit 0
          fi
          git commit -m "docs(wickhunter): persist post-repair checkpoint"
          git pull --rebase origin fix/wickhunter-1396-synology-recovery-v2
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
