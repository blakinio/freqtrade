name: Portal WickHunter Durability Formatter

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml

permissions:
  contents: write

concurrency:
  group: portal-wickhunter-1396-durability-formatter
  cancel-in-progress: false

jobs:
  format:
    name: Apply Ruff formatting only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 20

      - name: Format exact test file
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check ruff==0.15.21
          python3 -m ruff format tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m ruff check \
            ai_platform/scripts/liquidation_live_stream.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m ruff format --check \
            ai_platform/scripts/liquidation_live_stream.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git diff --check
          git diff -- tests/ai_platform_integration/test_liquidation_live_restart_durability.py

      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          if git diff --cached --quiet; then
            echo "FORMAT_ALREADY_CLEAN=true"
            exit 0
          fi
          git commit -m "style(liquidations): format durability regression"
          git pull --rebase origin fix/wickhunter-1396-synology-recovery-v2
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
