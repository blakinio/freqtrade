name: Portal WickHunter Recovery Checkpoint Update V2

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-buildkit-cache-recovery.yml

permissions:
  contents: write

concurrency:
  group: portal-wickhunter-1396-checkpoint-update-v2
  cancel-in-progress: false

jobs:
  checkpoint:
    name: Persist validator-compatible recovery checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 1

      - name: Apply bounded checkpoint updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one checkpoint target: {old[:80]}")
              text = text.replace(old, new, 1)

          replace_once(
              "updated_at: 2026-08-10T22:16:00+02:00\nhead: 1bb288c9e7f4f8b858b5cdd3054f8d09b27ab61a",
              "updated_at: 2026-08-10T22:44:00+02:00\nhead: 7e17e50aebfab93c882c80aa0e62a6cd0cedb5b7",
          )
          replace_once(
              "  - dangling source symlinks are rejected before the zero-row missing-file shortcut\n  - focused restart durability regression coverage passes after the review repair",
              "  - dangling source symlinks are rejected before the zero-row missing-file shortcut\n"
              "  - configured zero-row missing sources now fail closed while an unconfigured absent source is allowed only with no receipt timestamp\n"
              "  - restart finalization now requires the exact historical-consumer source set\n"
              "  - focused restart durability regression coverage passes after the review repair\n"
              "  - exact hardened focused validation passed on head 7e17e50aebfab93c882c80aa0e62a6cd0cedb5b7",
          )
          replace_once(
              "derived:\n  - after the permanent producer fix is integrated a guarded repair of only the already completed inconsistent history should allow WH09 to recover naturally without weakening fail-closed behavior",
              "derived:\n"
              "  - after the permanent producer fix is integrated a guarded repair of only the already completed inconsistent history should allow WH09 to recover naturally without weakening fail-closed behavior\n"
              "  - the hardened producer missing-file and source-set rules now align with the historical consumer contract",
          )
          replace_once(
              "  - final independent audit exact-head CI archive and Issue closure result\nconflicts: []",
              "  - final independent audit exact-head CI archive and Issue closure result\n"
              "  - explicit authority for the merge-triggered Liquidations Live Synology deployment\n"
              "conflicts: []",
          )
          replace_once(
              "  - command: Dangling symlink fail-closed review repair workflow\n    result: PASS\n    evidence: GitHub Actions run 31427855045 job 93583737395 completed source repair lint format and focused regression validation\nblockers: []",
              "  - command: Dangling symlink fail-closed review repair workflow\n"
              "    result: PASS\n"
              "    evidence: GitHub Actions run 31427855045 job 93583737395 completed source repair lint format and focused regression validation\n"
              "  - command: Hardened restart exact-head focused tests lint format checkpoint and producer-consumer invariants\n"
              "    result: PASS\n"
              "    evidence: GitHub Actions run 31430073700 on head 7e17e50aebfab93c882c80aa0e62a6cd0cedb5b7\n"
              "blockers:\n"
              "  - merging ai_platform/scripts/liquidation_live_stream.py to develop triggers Liquidations Live Synology deployment and repository merge authority alone does not establish protected live-operation authority",
          )
          replace_once(
              "next_action: Complete PR 1450 exact-head validation and review, remove the temporary recovery workflow, merge only when gates pass, then observe canonical Liquid20 deployment before applying the single guarded completed-history commit-boundary repair through the protected Synology environment.",
              "next_action: Remove the temporary recovery workflow, run retained full exact-head CI and fresh independent audit, then stop before merge unless explicit authority for the merge-triggered Liquidations Live Synology deployment is established.",
          )
          path.write_text(text, encoding="utf-8")
          PY
          python tools/agents/checkpoint.py \
            docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md \
            --require-checkpoint
          git diff --check

      - name: Commit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md
          git diff --cached --quiet && exit 1
          git commit -m "docs(wickhunter): checkpoint hardened Liquid20 recovery"
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
