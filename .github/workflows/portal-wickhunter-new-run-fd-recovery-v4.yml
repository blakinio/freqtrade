name: Portal WickHunter New Run FD Lifecycle Repair v4

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-new-run-fd-recovery-v4.yml

permissions:
  contents: write

jobs:
  repair:
    name: Validate retained FD lifecycle on staging runner without host mutation
    runs-on:
      - freqtrade-staging
    timeout-minutes: 25
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 20

      - name: Recover and apply exact retained-FD patch payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          source = Path('.github/workflows/portal-wickhunter-new-run-fd-recovery-v2.yml').read_text(encoding='utf-8')
          match = re.search(r"printf '%s' '([^']+)' \| base64 -d", source, re.S)
          if match is None:
              raise SystemExit('embedded retained-FD payload not found')
          encoded = ''.join(match.group(1).split())
          payload = base64.b64decode(encoded, validate=True)
          target = Path('/tmp/patch-retained-fd.py')
          target.write_bytes(payload)
          compile(payload, str(target), 'exec')
          PY
          python3 /tmp/patch-retained-fd.py

      - name: Install isolated validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/wickhunter-retained-fd-deps"
          rm -rf "$deps"
          mkdir -p "$deps"
          python3 -m pip install --disable-pip-version-check --target "$deps" -r requirements.txt
          python3 -m pip install --disable-pip-version-check --target "$deps" pytest==9.1.1 ruff==0.15.21
          printf 'PYTHONPATH=%s\n' "$deps${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          printf 'PATH=%s\n' "$deps/bin:$PATH" >> "$GITHUB_ENV"

      - name: Format and validate retained FD lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff format ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m py_compile ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff check ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff format --check ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          git diff --check

      - name: Record evidence and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          task = Path('docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md')
          text = task.read_text(encoding='utf-8')
          prefix = '## Context checkpoint\n\n```yaml\n'
          suffix = '\n```\n\n## Recovery checkpoint'
          start = text.index(prefix) + len(prefix)
          end = text.index(suffix, start)
          cp = text[start:end]
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          now = datetime.now(ZoneInfo('Europe/Warsaw')).replace(microsecond=0).isoformat()
          rows = cp.splitlines()
          for index, line in enumerate(rows):
              if line.startswith('updated_at:'):
                  rows[index] = f'updated_at: {now}'
              elif line.startswith('head:'):
                  rows[index] = f'head: {head}'
          cp = '\n'.join(rows)
          if '  - ai_platform/scripts/liquidation_live_stream_okx.py\n' not in cp:
              cp = cp.replace('changed_paths:\n', 'changed_paths:\n  - ai_platform/scripts/liquidation_live_stream_okx.py\n', 1)
          validation = (
              '  - command: Retained FD lifecycle new-run TOCTOU validation\n'
              '    result: PASS\n'
              f"    evidence: GitHub Actions run {os.environ['GITHUB_RUN_ID']} passed focused restart and OKX tests Ruff check format compile checkpoint and diff hygiene\n"
          )
          if 'Retained FD lifecycle new-run TOCTOU validation' not in cp:
              cp = cp.replace('blockers: []\n', validation + 'blockers: []\n', 1)
          rows = cp.splitlines()
          for index, line in enumerate(rows):
              if line.startswith('next_action:'):
                  rows[index] = 'next_action: Reconcile latest develop, run final retained ci:full exact-head CI plus fresh independent Codex review with zero material findings, then squash-merge PR 1450 and continue protected Liquid20 recovery.'
                  break
          text = text[:start] + '\n'.join(rows) + text[end:]
          text = text.replace('  generation: 12\n', '  generation: 13\n', 1)
          task.write_text(text, encoding='utf-8')
          PY
          python3 tools/agents/checkpoint.py docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md --require-checkpoint
          git rm .github/workflows/portal-wickhunter-new-run-fd-recovery.yml
          git rm .github/workflows/portal-wickhunter-new-run-fd-recovery-v2.yml
          git rm .github/workflows/portal-wickhunter-new-run-fd-recovery-v3.yml
          git rm .github/workflows/portal-wickhunter-new-run-fd-recovery-v4.yml
          git diff --check

      - name: Commit validated permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(liquidations): retain directory FDs through live run lifecycle'
          git pull --rebase origin fix/wickhunter-1396-synology-recovery-v2
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
