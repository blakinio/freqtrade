name: Portal WickHunter New Run FD Lifecycle Repair

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-new-run-fd-recovery.yml

permissions:
  contents: write

jobs:
  repair:
    name: Anchor new-run creation writers and state to retained directory FDs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 20

      - name: Apply retained-FD lifecycle repair and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("ai_platform/scripts/liquidation_live_stream.py")
          text = source_path.read_text(encoding="utf-8")

          old_writer = '''        path.parent.mkdir(parents=True, exist_ok=True)
        self.path = path
        self._handle = path.open("a", encoding="utf-8")
'''
          new_writer = '''        self.path = path
        directory_fd = kwargs_directory_fd
        if directory_fd is None:
            path.parent.mkdir(parents=True, exist_ok=True)
            self._handle = path.open("a", encoding="utf-8")
        else:
            nofollow_flag = getattr(os, "O_NOFOLLOW", None)
            if nofollow_flag is None:
                raise RuntimeError("secure Liquid20 writer file access is unsupported")
            descriptor = os.open(
                path.name,
                os.O_WRONLY
                | os.O_CREAT
                | os.O_APPEND
                | nofollow_flag
                | getattr(os, "O_CLOEXEC", 0),
                0o600,
                dir_fd=directory_fd,
            )
            if not stat.S_ISREG(os.fstat(descriptor).st_mode):
                os.close(descriptor)
                raise RuntimeError("Liquid20 writer target is not a regular file")
            self._handle = os.fdopen(descriptor, "a", encoding="utf-8")
'''
          old_signature = '''        path: Path,
        *,
        flush_interval_seconds: float = 1.0,
        flush_event_count: int = 100,
    ) -> None:
'''
          new_signature = '''        path: Path,
        *,
        flush_interval_seconds: float = 1.0,
        flush_event_count: int = 100,
        directory_fd: int | None = None,
    ) -> None:
'''
          if new_signature not in text:
              if text.count(old_signature) != 1:
                  raise SystemExit("writer signature target mismatch")
              text = text.replace(old_signature, new_signature, 1)
          if "kwargs_directory_fd" not in text:
              new_writer = new_writer.replace("directory_fd = kwargs_directory_fd", "directory_fd = directory_fd")
              if text.count(old_writer) != 1:
                  raise SystemExit("writer open target mismatch")
              text = text.replace(old_writer, new_writer, 1)

          helper_marker = "\n\ndef _read_json_regular_at("
          runtime_helper = '''

def _open_live_runtime_fds(data_root: Path) -> tuple[int, int]:
    flags = _secure_directory_flags()
    data_fd = os.open(data_root, flags)
    try:
        live_fd = os.open("live", flags, dir_fd=data_fd)
    finally:
        os.close(data_fd)
    try:
        runs_fd = os.open("runs", flags, dir_fd=live_fd)
    except BaseException:
        os.close(live_fd)
        raise
    return live_fd, runs_fd


def _open_child_directory_fd(parent_fd: int, name: str, *, label: str) -> int:
    try:
        descriptor = os.open(name, _secure_directory_flags(), dir_fd=parent_fd)
    except OSError as exc:
        raise RuntimeError(f"{label} is not a regular directory") from exc
    if not stat.S_ISDIR(os.fstat(descriptor).st_mode):
        os.close(descriptor)
        raise RuntimeError(f"{label} is not a regular directory")
    return descriptor
'''
          if "def _open_live_runtime_fds(" not in text:
              if helper_marker not in text:
                  raise SystemExit("runtime FD helper marker missing")
              text = text.replace(helper_marker, runtime_helper + helper_marker, 1)

          init_anchor = '''        self._writers: dict[str, AppendOnlyNdjsonWriter] = {}
'''
          init_new = '''        self._writers: dict[str, AppendOnlyNdjsonWriter] = {}
        self._live_root_fd: int | None = None
        self._runs_root_fd: int | None = None
        self._run_root_fd: int | None = None
'''
          if "self._live_root_fd" not in text:
              if text.count(init_anchor) != 1:
                  raise SystemExit("manager FD field target mismatch")
              text = text.replace(init_anchor, init_new, 1)

          property_marker = '''    async def start(self) -> None:
'''
          manager_helpers = '''    def _require_fd(self, descriptor: int | None, *, label: str) -> int:
        if descriptor is None:
            raise RuntimeError(f"{label} is not open")
        return descriptor

    def _open_runtime_root_fds(self) -> None:
        self._close_runtime_root_fds()
        self._live_root_fd, self._runs_root_fd = _open_live_runtime_fds(self.data_root)

    def _close_run_root_fd(self) -> None:
        if self._run_root_fd is not None:
            os.close(self._run_root_fd)
            self._run_root_fd = None

    def _close_runtime_root_fds(self) -> None:
        self._close_run_root_fd()
        if self._runs_root_fd is not None:
            os.close(self._runs_root_fd)
            self._runs_root_fd = None
        if self._live_root_fd is not None:
            os.close(self._live_root_fd)
            self._live_root_fd = None

'''
          if "def _open_runtime_root_fds(" not in text:
              if text.count(property_marker) != 1:
                  raise SystemExit("manager helper insertion target mismatch")
              text = text.replace(property_marker, manager_helpers + property_marker, 1)

          old_start = '''            await asyncio.to_thread(self._complete_previous_active_run)
            self._start_new_run(self._now_ms())
'''
          new_start = '''            await asyncio.to_thread(self._open_runtime_root_fds)
            await asyncio.to_thread(self._complete_previous_active_run)
            self._start_new_run(self._now_ms())
'''
          if new_start not in text:
              if text.count(old_start) != 1:
                  raise SystemExit("start FD anchor target mismatch")
              text = text.replace(old_start, new_start, 1)

          old_stop_tail = '''            await asyncio.to_thread(self._write_state)
            self._writers.clear()
'''
          new_stop_tail = '''            await asyncio.to_thread(self._write_state)
            self._writers.clear()
            await asyncio.to_thread(self._close_runtime_root_fds)
'''
          if new_stop_tail not in text:
              if text.count(old_stop_tail) != 1:
                  raise SystemExit("stop FD close target mismatch")
              text = text.replace(old_stop_tail, new_stop_tail, 1)

          method_start = text.index("    def _complete_previous_active_run(self) -> None:\n")
          method_end = text.index("\n    def _start_new_run(self, now_ms: int) -> None:\n", method_start)
          complete_method = '''    def _complete_previous_active_run(self) -> None:
        live_fd = self._require_fd(self._live_root_fd, label="Liquid20 live root")
        runs_fd = self._require_fd(self._runs_root_fd, label="Liquid20 runs root")
        try:
            payload = _read_json_regular_at(live_fd, LIVE_STATE_FILE)
        except (TypeError, ValueError, json.JSONDecodeError):
            return
        if payload is None:
            return
        run_id = payload.get("active_run_id")
        if not isinstance(run_id, str) or not RUN_ID_PATTERN.fullmatch(run_id):
            return
        try:
            run_root_fd = _open_child_directory_fd(
                runs_fd, run_id, label="previous live run root"
            )
        except RuntimeError as exc:
            if not (self.runs_root / run_id).exists():
                return
            raise exc
        try:
            try:
                state = _read_json_regular_at(run_root_fd, RUN_STATE_FILE)
            except (TypeError, ValueError, json.JSONDecodeError):
                return
            if state is None or state.get("run_state") != "active":
                return
            sources = state.get("sources")
            if not isinstance(sources, dict):
                raise RuntimeError("previous live source state is invalid")
            expected_sources = {BYBIT_SOURCE, BINANCE_SOURCE, OKX_SOURCE}
            if set(sources) != expected_sources:
                raise RuntimeError("previous live source set is invalid")
            run_root = self.runs_root / run_id
            for source in (BYBIT_SOURCE, BINANCE_SOURCE, OKX_SOURCE):
                committed_rows, allow_missing = _restart_source_commit_state(
                    sources[source], source=source
                )
                _seal_committed_ndjson(
                    run_root / f"{source}.ndjson",
                    committed_rows=committed_rows,
                    source=source,
                    allow_missing=allow_missing,
                    directory_fd=run_root_fd,
                )
            state["run_state"] = "completed"
            state["data_mode"] = "historical"
            state["completed_at_ms"] = self._now_ms()
            state["completion_reason"] = "collector-restart"
            _write_json_atomic_at(run_root_fd, RUN_STATE_FILE, state)
        finally:
            os.close(run_root_fd)
'''
          text = text[:method_start] + complete_method + text[method_end:]

          start_new = text.index("    def _start_new_run(self, now_ms: int) -> None:\n")
          rotate = text.index("\n    def _rotate_if_needed(self, now_ms: int) -> None:\n", start_new)
          start_method = '''    def _start_new_run(self, now_ms: int) -> None:
        runs_fd = self._require_fd(self._runs_root_fd, label="Liquid20 runs root")
        instant = datetime.fromtimestamp(now_ms / 1000, tz=UTC)
        day = instant.strftime("%Y%m%d")
        base = f"liquid20-{day}T000000Z"
        attempt = 0
        while True:
            run_id = f"{base}-{attempt}"
            try:
                os.mkdir(run_id, mode=0o700, dir_fd=runs_fd)
                break
            except FileExistsError:
                attempt += 1
        self._close_run_root_fd()
        run_root_fd = _open_child_directory_fd(runs_fd, run_id, label="new live run root")
        self._run_root_fd = run_root_fd
        run_root = self.runs_root / run_id
        self._run_id = run_id
        self._run_root = run_root
        self._collector_started_at_ms = now_ms
        self._completed_at_ms = None
        self._run_state = "active"
        self._completion_reason = None
        self._rotation_day = day
        self._last_event_at_ms = None
        self._last_event_received_at_ms = None
        self._writers = {
            BYBIT_SOURCE: AppendOnlyNdjsonWriter(
                run_root / "bybit-linear.ndjson",
                flush_interval_seconds=self._flush_interval_seconds,
                directory_fd=run_root_fd,
            ),
            BINANCE_SOURCE: AppendOnlyNdjsonWriter(
                run_root / "binance-usdm.ndjson",
                flush_interval_seconds=self._flush_interval_seconds,
                directory_fd=run_root_fd,
            ),
        }
        for state in self.sources.values():
            state.connected = False
            state.last_event_at_ms = None
            state.last_event_received_at_ms = None
            state.last_heartbeat_at_ms = now_ms if state.configured else None
            state.reconnect_count = 0
            state.observed_symbols.clear()
            state.subscription_symbol_count = 0
            state.latest_error = None
            state.ingest_lag_ms = None
            state.events_written = 0
            state.error_count = 0
            state.parse_error_count = 0
'''
          text = text[:start_new] + start_method + text[rotate:]

          write_start = text.index("    def _write_state(self) -> None:\n")
          redact = text.index("\n\ndef redact_error(", write_start)
          write_method = '''    def _write_state(self) -> None:
        run_fd = self._require_fd(self._run_root_fd, label="Liquid20 active run root")
        live_fd = self._require_fd(self._live_root_fd, label="Liquid20 live root")
        for writer in self._writers.values():
            if not writer.closed:
                writer.flush()
        payload = self._state_payload()
        _write_json_atomic_at(run_fd, RUN_STATE_FILE, payload)
        for source in (BYBIT_SOURCE, BINANCE_SOURCE):
            source_payload = {
                "schema_version": 1,
                "source": {"id": source},
                "run_id": self.run_id,
                "run_state": self._run_state,
                "stats": self.sources[source].as_json_dict(),
                "trading_credentials_present": False,
                "execution_enabled": False,
            }
            _write_json_atomic_at(run_fd, f"{source}-summary.json", source_payload)
        pointer_payload = {
            "schema_version": 1,
            "contract": LIVE_CONTRACT,
            "active_run_id": self.run_id if self._run_state == "active" else None,
            "collector_heartbeat_at_ms": payload["collector_heartbeat_at_ms"],
            "state": payload,
        }
        _write_json_atomic_at(live_fd, LIVE_STATE_FILE, pointer_payload)
'''
          text = text[:write_start] + write_method + text[redact:]
          source_path.write_text(text, encoding="utf-8")

          okx_path = Path("ai_platform/scripts/liquidation_live_stream_okx.py")
          okx = okx_path.read_text(encoding="utf-8")
          if "    _write_json_atomic_at,\n" not in okx:
              anchor = "    _fetch_json,\n"
              if okx.count(anchor) != 1:
                  raise SystemExit("OKX import anchor mismatch")
              okx = okx.replace(anchor, anchor + "    _write_json_atomic_at,\n", 1)
          okx = okx.replace(
              "            write_json_atomic(\n                self.run_root / OKX_INSTRUMENT_SNAPSHOT_FILE,\n                self._okx_instrument_snapshot,\n            )",
              "            _write_json_atomic_at(\n                self._require_fd(self._run_root_fd, label=\"Liquid20 active run root\"),\n                OKX_INSTRUMENT_SNAPSHOT_FILE,\n                self._okx_instrument_snapshot,\n            )",
          )
          okx = okx.replace(
              "            flush_interval_seconds=self._flush_interval_seconds,\n        )\n        self._write_okx_snapshot()",
              "            flush_interval_seconds=self._flush_interval_seconds,\n            directory_fd=self._require_fd(self._run_root_fd, label=\"Liquid20 active run root\"),\n        )\n        self._write_okx_snapshot()",
              1,
          )
          okx = okx.replace(
              "        write_json_atomic(self.run_root / \"okx-swap-summary.json\", source_payload)",
              "        _write_json_atomic_at(\n            self._require_fd(self._run_root_fd, label=\"Liquid20 active run root\"),\n            \"okx-swap-summary.json\",\n            source_payload,\n        )",
          )
          okx_path.write_text(okx, encoding="utf-8")

          test_path = Path("tests/ai_platform_integration/test_liquidation_live_restart_durability.py")
          tests = test_path.read_text(encoding="utf-8")
          name = "test_new_run_creation_remains_anchored_after_runs_path_swap"
          if name not in tests:
              marker = "\n\ndef test_start_rejects_symlinked_runtime_root_before_any_write("
              if tests.count(marker) != 1:
                  raise SystemExit("new-run race test marker mismatch")
              addition = '''


def test_new_run_creation_remains_anchored_after_runs_path_swap(
    tmp_path: Path, monkeypatch: pytest.MonkeyPatch
) -> None:
    manager = OkxLiveRunManager(
        data_root=tmp_path,
        collector_commit="d" * 40,
        host_id="synology-test",
        now_ms=lambda: 1_786_384_683_792,
    )
    archived_runs = tmp_path / "archived-runs"
    external_runs = tmp_path / "external-runs"
    external_runs.mkdir()

    def swap_runs_after_fds_are_opened() -> None:
        runs_root = tmp_path / "live" / "runs"
        runs_root.rename(archived_runs)
        runs_root.symlink_to(external_runs, target_is_directory=True)

    monkeypatch.setattr(manager, "_complete_previous_active_run", swap_runs_after_fds_are_opened)
    asyncio.run(manager.start())
    try:
        assert list(external_runs.iterdir()) == []
        run_dirs = list(archived_runs.iterdir())
        assert len(run_dirs) == 1
        assert (run_dirs[0] / "run-state-v1.json").is_file()
        assert (run_dirs[0] / f"{BINANCE_SOURCE}.ndjson").is_file()
    finally:
        asyncio.run(manager.stop())
'''
              tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.15.21

      - name: Format and validate retained-FD lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff format ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m py_compile ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff check ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff format --check ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          git diff --check

      - name: Update compact task evidence and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          task = Path("docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md")
          text = task.read_text(encoding="utf-8")
          prefix = "## Context checkpoint\n\n```yaml\n"
          suffix = "\n```\n\n## Recovery checkpoint"
          start = text.index(prefix) + len(prefix)
          end = text.index(suffix, start)
          cp = text[start:end]
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          now = datetime.now(ZoneInfo("Europe/Warsaw")).replace(microsecond=0).isoformat()
          rows = cp.splitlines()
          for index, line in enumerate(rows):
              if line.startswith("updated_at:"):
                  rows[index] = f"updated_at: {now}"
              elif line.startswith("head:"):
                  rows[index] = f"head: {head}"
              elif line.startswith("next_action:"):
                  rows[index] = "next_action: Run final retained ci:full exact-head CI plus fresh independent Codex review with zero material findings, then squash-merge PR 1450 and continue protected Liquid20 recovery."
          cp = "\n".join(rows)
          for section in ("context_routes:", "owned_paths:", "changed_paths:"):
              marker = "  - ai_platform/scripts/liquidation_live_stream.py\n"
              insertion = marker + "  - ai_platform/scripts/liquidation_live_stream_okx.py\n"
              section_start = cp.index(section)
              next_start = cp.find("\n", section_start) + 1
              if "  - ai_platform/scripts/liquidation_live_stream_okx.py\n" not in cp[next_start:cp.find("\n", next_start + 1) + 500]:
                  local = cp[section_start:]
                  local = local.replace(marker, insertion, 1)
                  cp = cp[:section_start] + local
          validation = (
              "  - command: Retained-FD new-run lifecycle TOCTOU regression validation\n"
              "    result: PASS\n"
              f"    evidence: GitHub Actions run {os.environ['GITHUB_RUN_ID']} passed focused restart and legacy migration tests Ruff check format compile checkpoint and diff hygiene\n"
          )
          if "Retained-FD new-run lifecycle TOCTOU regression validation" not in cp:
              cp = cp.replace("blockers: []\n", validation + "blockers: []\n", 1)
          text = text[:start] + cp + text[end:]
          text = text.replace("  generation: 12\n", "  generation: 13\n", 1)
          task.write_text(text, encoding="utf-8")
          PY
          python3 tools/agents/checkpoint.py docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md --require-checkpoint
          git rm .github/workflows/portal-wickhunter-new-run-fd-recovery.yml
          git diff --check

      - name: Commit validated permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(liquidations): retain safe root descriptors through live writes"
          git pull --rebase origin fix/wickhunter-1396-synology-recovery-v2
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
