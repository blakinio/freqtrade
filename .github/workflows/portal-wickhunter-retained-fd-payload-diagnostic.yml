name: Portal WickHunter Retained FD Payload Diagnostic

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/portal-wickhunter-retained-fd-payload-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path
          source = Path('.github/workflows/portal-wickhunter-new-run-fd-recovery-v2.yml').read_text(encoding='utf-8')
          match = re.search(r"printf '%s' '([^']+)' \| base64 -d", source, re.S)
          if match is None:
              raise SystemExit('payload not found')
          payload = base64.b64decode(''.join(match.group(1).split()), validate=True).decode('utf-8')
          lines = payload.splitlines()
          init_index = next(i for i, line in enumerate(lines) if line.startswith("init_new = '''"))
          for i in range(init_index + 1, min(init_index + 20, len(lines))):
              if lines[i] == "''":
                  lines[i] = "'''"
                  break
          for i in range(325, min(len(lines), 380)):
              print(f'{i+1:04d}: {lines[i]}')
          PY
