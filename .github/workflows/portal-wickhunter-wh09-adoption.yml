name: Portal WickHunter WH09 Adoption

"on":
  push:
    branches:
      - develop
    paths:
      - deploy/synology/portal-oidc/run-requests/wickhunter-wh09-portal-adoption-20260810-v1.json

permissions:
  contents: read

concurrency:
  group: portal-wickhunter-wh09-adoption
  cancel-in-progress: false

env:
  REQUEST_PATH: deploy/synology/portal-oidc/run-requests/wickhunter-wh09-portal-adoption-20260810-v1.json
  LEGACY_DEPLOY_REQUEST: deploy/synology/portal-oidc/run-requests/public-oidc-20260801-v1.json
  WH09_COMPOSE_PROJECT: wickhunter-production-research-runtime
  WH09_COMPOSE_SERVICE: wickhunter-production-research-runtime
  WH09_EXPECTED_REVISION: 90cfc5ded10b0c6cb6406d00042817aca611e900
  WH09_RUNTIME_UID: "65531"
  WH09_RUNTIME_GID: "65531"
  OBSERVER_CONTAINER: portal-wh09-runtime-observer
  PORTAL_CONTROL_CONTAINER: freqtrade-portal-control-plane
  PORTAL_WEB_CONTAINER: freqtrade-portal-staging
  PORTAL_NETWORK: portal_oidc_public
  SYFT_VERSION: "1.50.0"
  SYFT_LINUX_AMD64_SHA256: "bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788"
  GRYPE_VERSION: "0.116.1"
  GRYPE_LINUX_AMD64_SHA256: "0122df7b655981abe547ad3d2190d65551dac6a2bfc80b4dc2a989b5d0587458"

jobs:
  adopt:
    name: Deploy Portal and adopt existing WH09 without runtime replacement
    runs-on:
      - freqtrade-staging
    environment: synology-staging
    timeout-minutes: 75
    steps:
      - name: Checkout exact merged authorization
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Validate one-shot zero-authority adoption authorization
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/develop" ]]
          git cat-file -e "$GITHUB_SHA:$REQUEST_PATH"
          if git cat-file -e "$GITHUB_SHA^:$REQUEST_PATH" 2>/dev/null; then
            echo "WH09 Portal adoption request is not one-shot newly introduced material" >&2
            exit 1
          fi
          python3 - "$REQUEST_PATH" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schema_version": 1,
              "request_id": "wickhunter-wh09-portal-adoption-20260810-v1",
              "portal_origin": "https://quant.molehill.cloud",
              "tenant_id": "tenant-local",
              "bot_id": "wickhunter",
              "bot_name": "WickHunter",
              "existing_runtime_required": True,
              "existing_runtime_adoption_authorized": True,
              "portal_deploy_authorized": True,
              "wh09_redeploy_authorized": False,
              "compose_project": "wickhunter-production-research-runtime",
              "compose_service": "wickhunter-production-research-runtime",
              "runtime_user": "65531:65531",
              "expected_runtime_revision": "90cfc5ded10b0c6cb6406d00042817aca611e900",
              "mode": "shadow",
              "candidate_identity": "H900",
              "no_trade_confidence": "0.60",
              "paper_activation_authorized": False,
              "trading_credentials_present": False,
              "order_adapter_present": False,
              "execution_enabled": False,
              "orders_submitted": 0,
              "live_capital_authorized": False,
              "mfa_required": True,
              "rollback_required": True,
              "runtime_e2e_required": True,
          }
          if payload != expected:
              raise SystemExit("WH09 Portal adoption authorization contract mismatch")
          PY

      - name: Refuse trading credentials and capture existing WH09 identity
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            EXCHANGE_API_KEY EXCHANGE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            [[ -z "${!name:-}" ]] || { echo "Forbidden trading credential environment: $name" >&2; exit 1; }
          done

          mapfile -t ids < <(
            docker ps -aq --no-trunc \
              --filter "label=com.docker.compose.project=$WH09_COMPOSE_PROJECT" \
              --filter "label=com.docker.compose.service=$WH09_COMPOSE_SERVICE" \
              | sed '/^$/d'
          )
          [[ ${#ids[@]} -eq 1 ]] || { echo "Expected exactly one existing WH09 runtime" >&2; exit 1; }
          wh09_id="${ids[0]}"
          [[ "$wh09_id" =~ ^[0-9a-f]{64}$ ]]
          docker inspect "$wh09_id" > "$RUNNER_TEMP/wh09-inspect.json"
          python3 - "$RUNNER_TEMP/wh09-inspect.json" "$RUNNER_TEMP/wh09-descriptor.json" <<'PY'
          import json
          import pathlib
          import re
          import sys

          source = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))[0]
          labels = source["Config"].get("Labels") or {}
          host = source["HostConfig"]
          state = source["State"]
          expected = {
              "compose_project": "wickhunter-production-research-runtime",
              "compose_service": "wickhunter-production-research-runtime",
              "runtime_user": "65531:65531",
          }
          if labels.get("com.docker.compose.project") != expected["compose_project"]:
              raise SystemExit("WH09 compose project mismatch")
          if labels.get("com.docker.compose.service") != expected["compose_service"]:
              raise SystemExit("WH09 compose service mismatch")
          if source["Config"].get("User") != expected["runtime_user"]:
              raise SystemExit("WH09 runtime user mismatch")
          if state.get("Running") is not True or (state.get("Health") or {}).get("Status") != "healthy":
              raise SystemExit("WH09 runtime is not running and healthy")
          if host.get("ReadonlyRootfs") is not True or host.get("Privileged") is not False:
              raise SystemExit("WH09 rootfs/privilege hardening mismatch")
          if "ALL" not in (host.get("CapDrop") or []):
              raise SystemExit("WH09 does not drop all Linux capabilities")
          if not any("no-new-privileges" in item for item in (host.get("SecurityOpt") or [])):
              raise SystemExit("WH09 no-new-privileges is absent")
          image = source.get("Image", "")
          if re.fullmatch(r"sha256:[0-9a-f]{64}", image) is None:
              raise SystemExit("WH09 image identity is invalid")
          revision = labels.get("org.opencontainers.image.revision")
          if revision != "90cfc5ded10b0c6cb6406d00042817aca611e900":
              raise SystemExit("WH09 image revision differs from final accepted runtime")
          mounts = {entry.get("Destination"): entry for entry in source.get("Mounts") or []}
          required = {}
          for destination in ("/runtime/journal", "/runtime/operator"):
              mount = mounts.get(destination)
              if not isinstance(mount, dict) or mount.get("Type") != "bind" or mount.get("RW") is not True:
                  raise SystemExit(f"WH09 writable evidence source mount mismatch: {destination}")
              host_source = mount.get("Source")
              if not isinstance(host_source, str) or not host_source.startswith("/volume1/docker/"):
                  raise SystemExit(f"WH09 evidence host source is unsafe: {destination}")
              required[destination] = host_source
          descriptor = {
              "tenant_id": "tenant-local",
              "runtime_instance_id": source["Id"],
              "runtime_image_digest": image.removeprefix("sha256:"),
              "image_revision": revision,
              "compose_project": expected["compose_project"],
              "compose_service": expected["compose_service"],
              "runtime_user": expected["runtime_user"],
              "matching_container_count": 1,
              "running": True,
              "docker_health": "healthy",
              "read_only_rootfs": True,
              "privileged": False,
              "cap_drop_all": True,
              "no_new_privileges": True,
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(descriptor, sort_keys=True), encoding="utf-8")
          print(f"JOURNAL_HOST={required['/runtime/journal']}")
          print(f"OPERATOR_HOST={required['/runtime/operator']}")
          print(f"WH09_CONTAINER_ID={source['Id']}")
          PY
          python3 - "$RUNNER_TEMP/wh09-inspect.json" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys
          source = json.load(open(sys.argv[1], encoding="utf-8"))[0]
          mounts = {entry.get("Destination"): entry for entry in source.get("Mounts") or []}
          print(f"JOURNAL_HOST={mounts['/runtime/journal']['Source']}")
          print(f"OPERATOR_HOST={mounts['/runtime/operator']['Source']}")
          print(f"WH09_CONTAINER_ID={source['Id']}")
          PY

      - name: Install checksum-pinned Syft and Grype
        shell: bash
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/portal-tools"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/syft.tar.gz"
          echo "${SYFT_LINUX_AMD64_SHA256}  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/syft.tar.gz" --directory "$RUNNER_TEMP/portal-tools" syft
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/grype.tar.gz"
          echo "${GRYPE_LINUX_AMD64_SHA256}  $RUNNER_TEMP/grype.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/grype.tar.gz" --directory "$RUNNER_TEMP/portal-tools" grype
          echo "$RUNNER_TEMP/portal-tools" >> "$GITHUB_PATH"

      - name: Build and approve exact merged Portal images
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/portal-wh09-supply-chain
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python3 tools/agents/portal_supply_chain.py build-verify \
            --repository "$GITHUB_WORKSPACE" \
            --source-sha "$GITHUB_SHA" \
            --output-dir "$EVIDENCE_DIR" \
            --approval "$EVIDENCE_DIR/approval.json"
          python3 tools/agents/portal_supply_chain.py verify-approval \
            --approval "$EVIDENCE_DIR/approval.json" \
            --expected-source-sha "$GITHUB_SHA"

      - name: Deploy exact merged Portal with canonical protected deployer
        shell: bash
        env:
          APPROVAL_PATH: ${{ runner.temp }}/portal-wh09-supply-chain/approval.json
          REPORT_PATH: ${{ runner.temp }}/portal-wh09-deploy-report.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$LEGACY_DEPLOY_REQUEST")"
          python3 - "$LEGACY_DEPLOY_REQUEST" "$GITHUB_SHA" <<'PY'
          import json
          import pathlib
          import sys
          payload = {
              "request_id": "portal-authentik-public-oidc-20260801-v1",
              "environment": "synology-staging",
              "runner": "freqtrade-staging",
              "implementation_sha": sys.argv[2],
              "portal_origin": "https://quant.molehill.cloud",
              "authentik_origin": "https://auth.molehill.cloud",
              "identity_transport": "https",
              "identity_fixture_mode": "disabled",
              "bootstrap_membership_authorized": False,
              "dry_run_required": True,
              "public_ingress_authorized": True,
              "live_capital_authorized": False,
              "restore_authorized": False,
              "secret_values_in_request": False,
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(payload, sort_keys=True), encoding="utf-8")
          PY
          python3 deploy/synology/portal-oidc/prepare_host_state.py --repository "$GITHUB_WORKSPACE"
          python3 tools/agents/portal_supply_chain.py deploy-approved \
            --approved-images "$APPROVAL_PATH" \
            --repository "$GITHUB_WORKSPACE" \
            --request "$LEGACY_DEPLOY_REQUEST" \
            --expected-repository-sha "$GITHUB_SHA" \
            --report "$REPORT_PATH"
          python3 - "$REPORT_PATH" "$GITHUB_SHA" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          if report.get("status") != "success" or report.get("implementation_sha") != sys.argv[2]:
              raise SystemExit("Portal exact merged deployment did not succeed")
          if report.get("live_capital_authorized") is not False:
              raise SystemExit("Portal deployment unexpectedly authorized live capital")
          PY

      - name: Start private read-only WH09 observer and adopt runtime
        shell: bash
        run: |
          set -euo pipefail
          control_image="$(docker inspect --format '{{.Image}}' "$PORTAL_CONTROL_CONTAINER")"
          [[ "$control_image" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$control_image")" == "$GITHUB_SHA" ]]
          docker rm -f "$OBSERVER_CONTAINER" >/dev/null 2>&1 || true
          docker run --detach \
            --name "$OBSERVER_CONTAINER" \
            --restart unless-stopped \
            --network "$PORTAL_NETWORK" \
            --network-alias portal-wh09-runtime-observer \
            --user 10001:10001 \
            --group-add "$WH09_RUNTIME_GID" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env PORTAL_WICKHUNTER_WH09_ROOT=/runtime \
            --mount "type=bind,src=$JOURNAL_HOST,dst=/runtime/journal,readonly" \
            --mount "type=bind,src=$OPERATOR_HOST,dst=/runtime/operator,readonly" \
            --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()\"" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 12 \
            --entrypoint python \
            "$control_image" \
            -m ai_platform.portal.control_plane.wh09_runtime_observer
          for _ in $(seq 1 60); do
            observer_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$OBSERVER_CONTAINER")"
            [[ "$observer_health" == "healthy" ]] && break
            [[ "$observer_health" =~ ^(unhealthy|exited|dead)$ ]] && { docker logs "$OBSERVER_CONTAINER"; exit 1; }
            sleep 2
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$OBSERVER_CONTAINER")" == "healthy" ]]
          [[ -z "$(docker port "$OBSERVER_CONTAINER")" ]]
          [[ "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$OBSERVER_CONTAINER")" == "true" ]]
          [[ "$(docker inspect --format '{{.HostConfig.Privileged}}' "$OBSERVER_CONTAINER")" == "false" ]]
          docker inspect "$OBSERVER_CONTAINER" > "$RUNNER_TEMP/wh09-observer-inspect.json"
          python3 - "$RUNNER_TEMP/wh09-observer-inspect.json" <<'PY'
          import json
          import sys
          observer = json.load(open(sys.argv[1], encoding="utf-8"))[0]
          mounts = {entry.get("Destination"): entry for entry in observer.get("Mounts") or []}
          for destination in ("/runtime/journal", "/runtime/operator"):
              mount = mounts.get(destination)
              if not isinstance(mount, dict) or mount.get("Type") != "bind" or mount.get("RW") is not False:
                  raise SystemExit(f"WH09 observer evidence mount is not read-only: {destination}")
          PY

          docker exec -i "$PORTAL_CONTROL_CONTAINER" \
            python -m ai_platform.portal.control_plane.wh09_bootstrap \
            < "$RUNNER_TEMP/wh09-descriptor.json" \
            > "$RUNNER_TEMP/wh09-bootstrap.json"
          python3 - "$RUNNER_TEMP/wh09-bootstrap.json" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "status": "adopted",
              "bot_id": "wickhunter",
              "bot_name": "WickHunter",
              "managed_mode": "shadow",
              "candidate_identity": "H900",
              "no_trade_confidence": "0.60",
              "health": "HEALTHY",
              "paper_active": False,
              "paper_activation_authorized": False,
              "live_status": "BLOCKED",
              "trading_credentials_present": False,
              "order_adapter_present": False,
              "execution_enabled": False,
              "orders_submitted": 0,
              "live_capital_authorized": False,
              "adoption_provenance": "EXTERNAL_RUNTIME_ADOPTED",
          }
          for key, value in expected.items():
              if payload.get(key) != value:
                  raise SystemExit(f"WH09 bootstrap invariant failed: {key}")
          if not payload.get("desired_runtime_generation_id") or (
              payload["desired_runtime_generation_id"] != payload.get("observed_runtime_generation_id")
          ):
              raise SystemExit("WH09 desired/observed RuntimeGeneration did not converge")
          PY

      - name: Prove live API truth persistence and unchanged WH09 container
        shell: bash
        run: |
          set -euo pipefail
          docker restart "$PORTAL_CONTROL_CONTAINER" >/dev/null
          for _ in $(seq 1 60); do
            control_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$PORTAL_CONTROL_CONTAINER")"
            [[ "$control_health" == "healthy" ]] && break
            [[ "$control_health" =~ ^(unhealthy|exited|dead)$ ]] && { docker logs "$PORTAL_CONTROL_CONTAINER"; exit 1; }
            sleep 2
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$PORTAL_CONTROL_CONTAINER")" == "healthy" ]]

          docker exec -i "$PORTAL_CONTROL_CONTAINER" python - <<'PY' > "$RUNNER_TEMP/wh09-live-api.json"
          import json
          import os
          from uuid import uuid4
          from fastapi.testclient import TestClient
          from ai_platform.portal.contracts.identity import ActorType, Permission
          from ai_platform.portal.control_plane.api import create_app
          from ai_platform.portal.control_plane.context import RequestContext
          from ai_platform.portal.control_plane.database import build_engine, build_session_factory

          context = RequestContext(
              tenant_id="tenant-local",
              actor_id="system-wh09-post-merge-e2e",
              actor_type=ActorType.SYSTEM,
              permissions=(Permission.BOT_READ, Permission.AUDIT_READ),
              request_id=uuid4(),
              correlation_id=uuid4(),
              causation_id=None,
          )
          session_factory = build_session_factory(build_engine(os.environ["PORTAL_DATABASE_URL"]))
          app = create_app(session_factory, identity_context_provider=lambda: context)
          client = TestClient(app)
          bots = client.get("/v1/bots")
          truth = client.get("/v1/bots/wickhunter/runtime-truth")
          runtime = client.get("/v1/bots/wickhunter/wickhunter-runtime-evidence")
          if bots.status_code != 200 or truth.status_code != 200 or runtime.status_code != 200:
              raise SystemExit("live Portal API read failed")
          bot_rows = [item for item in bots.json() if item.get("bot_id") == "wickhunter"]
          if len(bot_rows) != 1:
              raise SystemExit("live Portal does not contain exactly one WickHunter BotInstance")
          truth_payload = truth.json()
          runtime_payload = runtime.json()
          if truth_payload["pending_rollout"] is not False:
              raise SystemExit("live runtime truth is not converged")
          if runtime_payload["runtime"]["health"] != "HEALTHY":
              raise SystemExit("live WH09 runtime evidence is not healthy")
          if runtime_payload["runtime"]["no_trade_confidence"] != "0.60":
              raise SystemExit("live WH09 no-trade threshold changed")
          if runtime_payload["runtime"]["execution_enabled"] is not False:
              raise SystemExit("live WH09 execution became enabled")
          print(json.dumps({"bots": bot_rows, "truth": truth_payload, "runtime": runtime_payload}, sort_keys=True))
          PY

          mapfile -t ids < <(
            docker ps -aq --no-trunc \
              --filter "label=com.docker.compose.project=$WH09_COMPOSE_PROJECT" \
              --filter "label=com.docker.compose.service=$WH09_COMPOSE_SERVICE" \
              | sed '/^$/d'
          )
          [[ ${#ids[@]} -eq 1 ]]
          [[ "${ids[0]}" == "$WH09_CONTAINER_ID" ]]
          [[ "$(docker inspect --format '{{.State.Running}}' "$WH09_CONTAINER_ID")" == "true" ]]
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$WH09_CONTAINER_ID")" == "healthy" ]]

          python3 - "$RUNNER_TEMP/wh09-bootstrap.json" "$RUNNER_TEMP/wh09-live-api.json" "$RUNNER_TEMP/portal-wh09-final-report.json" <<'PY'
          import json
          import os
          import pathlib
          import sys
          bootstrap = json.load(open(sys.argv[1], encoding="utf-8"))
          api = json.load(open(sys.argv[2], encoding="utf-8"))
          runtime = api["runtime"]["runtime"]
          report = {
              "schema_version": 1,
              "result": "PASS",
              "portal_commit": os.environ["GITHUB_SHA"],
              "bot_id": bootstrap["bot_id"],
              "adoption_provenance": bootstrap["adoption_provenance"],
              "desired_runtime_generation_id": bootstrap["desired_runtime_generation_id"],
              "observed_runtime_generation_id": bootstrap["observed_runtime_generation_id"],
              "runtime_instance_id": bootstrap["runtime_instance_id"],
              "runtime_container_unchanged": True,
              "single_wh09_container": True,
              "mode": runtime["mode"],
              "health": runtime["health"],
              "candidate_identity": runtime["candidate_identity"],
              "no_trade_confidence": runtime["no_trade_confidence"],
              "paper_active": runtime["paper_active"],
              "live_status": runtime["live_status"],
              "trading_credentials_present": runtime["trading_credentials_present"],
              "order_adapter_present": runtime["order_adapter_present"],
              "execution_enabled": runtime["execution_enabled"],
              "orders_submitted": runtime["orders_submitted"],
              "live_capital_authorized": runtime["live_capital_authorized"],
          }
          pathlib.Path(sys.argv[3]).write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload secret-free WH09 adoption evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-wickhunter-wh09-adoption-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/portal-wh09-deploy-report.json
            ${{ runner.temp }}/wh09-bootstrap.json
            ${{ runner.temp }}/wh09-live-api.json
            ${{ runner.temp }}/portal-wh09-final-report.json
            ${{ runner.temp }}/portal-wh09-supply-chain
          if-no-files-found: error
          retention-days: 30

      - name: Enforce terminal zero-authority evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/portal-wh09-final-report.json" <<'PY'
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit("terminal WH09 Portal adoption report is missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "result": "PASS",
              "runtime_container_unchanged": True,
              "single_wh09_container": True,
              "mode": "shadow",
              "health": "HEALTHY",
              "candidate_identity": "H900",
              "no_trade_confidence": "0.60",
              "paper_active": False,
              "live_status": "BLOCKED",
              "trading_credentials_present": False,
              "order_adapter_present": False,
              "execution_enabled": False,
              "orders_submitted": 0,
              "live_capital_authorized": False,
              "adoption_provenance": "EXTERNAL_RUNTIME_ADOPTED",
          }
          for key, value in expected.items():
              if report.get(key) != value:
                  raise SystemExit(f"terminal adoption evidence failed: {key}")
          if report.get("desired_runtime_generation_id") != report.get("observed_runtime_generation_id"):
              raise SystemExit("terminal desired/observed generation mismatch")
          PY
