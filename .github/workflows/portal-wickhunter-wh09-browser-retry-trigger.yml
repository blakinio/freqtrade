name: Portal WickHunter WH09 Browser Retry Trigger

on:
  push:
    branches: [develop]
    paths:
      - deploy/synology/portal-oidc/run-requests/wickhunter-wh09-browser-acceptance-20260820-v4.json

permissions:
  contents: read

concurrency:
  group: portal-wickhunter-wh09-browser-retry-trigger
  cancel-in-progress: false

env:
  REQUEST_PATH: deploy/synology/portal-oidc/run-requests/wickhunter-wh09-browser-acceptance-20260820-v4.json
  TARGET_AUTHORIZATION_SHA: eafc198857c90caf89a5920da60ae7661c1061ba
  ADOPTION_RUN_ID: "32373954360"
  PORTAL_CONTROL_CONTAINER: freqtrade-portal-control-plane
  PORTAL_WEB_CONTAINER: freqtrade-portal-staging
  PORTAL_ORIGIN: https://quant.molehill.cloud

jobs:
  validate:
    name: Validate browser-only v4 authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      harness_sha: ${{ steps.authority.outputs.harness_sha }}
    steps:
      - name: Checkout exact one-shot trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Validate browser-only authorization
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/develop" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$GITHUB_SHA:$REQUEST_PATH"
          if git cat-file -e "$GITHUB_SHA^:$REQUEST_PATH" 2>/dev/null; then
            echo "browser-only v4 request is not newly introduced one-shot material" >&2
            exit 1
          fi
          python3 - "$REQUEST_PATH" "$TARGET_AUTHORIZATION_SHA" "$ADOPTION_RUN_ID" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = {
            "schema_version": 4, "request_id": "wickhunter-wh09-browser-acceptance-20260820-v4",
            "target_authorization_sha": sys.argv[2], "harness_source": "trigger_merge_sha",
            "session_token_format": "urlsafe", "acceptance_timeout_minutes": 50,
            "adoption_run_id": int(sys.argv[3]), "portal_origin": "https://quant.molehill.cloud",
            "browser_only": True, "runtime_e2e_required": True, "portal_deploy_authorized": False,
            "wh09_redeploy_authorized": False, "paper_activation_authorized": False,
            "trading_credentials_present": False, "order_adapter_present": False,
            "execution_enabled": False, "orders_submitted": 0, "live_capital_authorized": False,
          }
          if payload != expected: raise SystemExit("browser-only v4 authorization contract mismatch")
          PY
          echo "harness_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify accepted adoption provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          readarray -t a < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ADOPTION_RUN_ID" --jq '[.name,.event,.head_branch,.head_sha,.status,.conclusion]|.[]')
          [[ "${a[0]}" == "Portal WickHunter WH09 Adoption" && "${a[1]}" == "push" && "${a[2]}" == "develop" ]]
          [[ "${a[3]}" == "$TARGET_AUTHORIZATION_SHA" && "${a[4]}" == "completed" && "${a[5]}" == "success" ]]

  build-browser-image:
    name: Build exact v4 browser helper image
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - name: Checkout exact harness source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.harness_sha }}
      - name: Build and package dual-provenance helper
        id: package
        env:
          HARNESS_SHA: ${{ needs.validate.outputs.harness_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HARNESS_SHA" ]]
          image="portal-wh09-deployed-browser-v4:$HARNESS_SHA"
          out="$RUNNER_TEMP/portal-wh09-browser-image"; mkdir -p "$out"
          artifact_name="portal-wh09-browser-v4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --pull=false --label "org.opencontainers.image.revision=$HARNESS_SHA" --label "ftai.target_authorization_sha=$TARGET_AUTHORIZATION_SHA" --file deploy/synology/portal-oidc/Dockerfile.wickhunter-browser --tag "$image" .
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" == "$HARNESS_SHA" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "ftai.target_authorization_sha"}}' "$image")" == "$TARGET_AUTHORIZATION_SHA" ]]
          docker save "$image" | gzip -9 > "$out/browser-image.tar.gz"
          tar_sha="$(sha256sum "$out/browser-image.tar.gz" | awk '{print $1}')"
          python3 - "$out/approval.json" "$HARNESS_SHA" "$TARGET_AUTHORIZATION_SHA" "$image_id" "$tar_sha" "$image" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({"schema_version":4,"harness_source_sha":sys.argv[2],"target_authorization_sha":sys.argv[3],"image_id":sys.argv[4],"tar_sha256":sys.argv[5],"image_tag":sys.argv[6],"persistent_runtime":False},sort_keys=True)+"\n")
          PY
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Upload bounded v4 browser helper image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/portal-wh09-browser-image
          if-no-files-found: error
          retention-days: 1

  accept:
    name: Real authenticated Chromium v4 against deployed Portal
    needs: [validate, build-browser-image]
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Download exact v4 browser helper image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build-browser-image.outputs.artifact_name }}
          path: ${{ runner.temp }}/portal-wh09-browser-image
      - name: Validate dual provenance and deployed target
        id: target
        env:
          HARNESS_SHA: ${{ needs.validate.outputs.harness_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$HARNESS_SHA" ]]
          approval="$RUNNER_TEMP/portal-wh09-browser-image/approval.json"; archive="$RUNNER_TEMP/portal-wh09-browser-image/browser-image.tar.gz"
          readarray -t x < <(python3 - "$approval" "$HARNESS_SHA" "$TARGET_AUTHORIZATION_SHA" <<'PY'
          import json, pathlib, sys
          a=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if a.get("schema_version") != 4 or a.get("harness_source_sha") != sys.argv[2] or a.get("target_authorization_sha") != sys.argv[3] or a.get("persistent_runtime") is not False: raise SystemExit("browser helper approval mismatch")
          print(a["image_id"]); print(a["tar_sha256"]); print(a["image_tag"])
          PY
          )
          [[ "$(sha256sum "$archive"|awk '{print $1}')" == "${x[1]}" ]]
          gzip -dc "$archive" | docker load >/dev/null
          browser_image="${x[2]}"; [[ "$(docker image inspect --format '{{.Id}}' "$browser_image")" == "${x[0]}" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$browser_image")" == "$HARNESS_SHA" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "ftai.target_authorization_sha"}}' "$browser_image")" == "$TARGET_AUTHORIZATION_SHA" ]]
          echo "browser_image=$browser_image" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 90); do
            cr="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$PORTAL_CONTROL_CONTAINER" 2>/dev/null||true)"; wr="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$PORTAL_WEB_CONTAINER" 2>/dev/null||true)"
            ch="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$PORTAL_CONTROL_CONTAINER" 2>/dev/null||true)"; wh="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$PORTAL_WEB_CONTAINER" 2>/dev/null||true)"
            [[ "$cr" == "$TARGET_AUTHORIZATION_SHA" && "$wr" == "$TARGET_AUTHORIZATION_SHA" && "$ch" == healthy && "$wh" == healthy ]] && break; sleep 2
          done
          [[ "$cr" == "$TARGET_AUTHORIZATION_SHA" && "$wr" == "$TARGET_AUTHORIZATION_SHA" && "$ch" == healthy && "$wh" == healthy ]]
          docker inspect "$PORTAL_WEB_CONTAINER" | python3 -c 'import json,sys; e=set(json.load(sys.stdin)[0]["Config"].get("Env") or []); assert "PORTAL_WEB_DATA_MODE=api" in e and "PORTAL_IDENTITY_FIXTURE_MODE=disabled" in e'
      - name: Verify canonical WickHunter truth with bounded convergence
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$PORTAL_CONTROL_CONTAINER" python - <<'PY'
          import os,time
          from uuid import uuid4
          from fastapi.testclient import TestClient
          from ai_platform.portal.contracts.identity import ActorType,Permission
          from ai_platform.portal.control_plane.api import create_app
          from ai_platform.portal.control_plane.context import RequestContext
          from ai_platform.portal.control_plane.database import build_engine,build_session_factory
          ctx=RequestContext(tenant_id="tenant-local",actor_id="system-wh09-browser-v4-preflight",actor_type=ActorType.SYSTEM,permissions=(Permission.BOT_READ,Permission.AUDIT_READ),request_id=uuid4(),correlation_id=uuid4(),causation_id=None)
          factory=build_session_factory(build_engine(os.environ["PORTAL_DATABASE_URL"])); client=TestClient(create_app(factory,identity_context_provider=lambda:ctx)); last="not sampled"
          for attempt in range(181):
              bots=client.get("/v1/bots"); truth=client.get("/v1/bots/wickhunter/runtime-truth"); runtime=client.get("/v1/bots/wickhunter/wickhunter-runtime-evidence")
              if bots.status_code==truth.status_code==runtime.status_code==200:
                  rows=[r for r in bots.json() if r.get("bot_id")=="wickhunter"]
                  if len(rows)!=1: raise SystemExit("canonical WickHunter identity is not unique")
                  e=runtime.json().get("runtime") or {}
                  if e.get("trading_credentials_present") is not False or e.get("order_adapter_present") is not False or e.get("execution_enabled") is not False or e.get("orders_submitted")!=0 or e.get("live_capital_authorized") is not False: raise SystemExit("WickHunter zero-authority invariant changed")
                  if truth.json().get("pending_rollout") is False and e.get("health")=="HEALTHY" and e.get("decision_count",0)>0 and e.get("no_trade_count",0)>0: break
                  last=f"health={e.get('health')} pending={truth.json().get('pending_rollout')}"
              else: last=f"status={bots.status_code}/{truth.status_code}/{runtime.status_code}"
              if attempt<180: time.sleep(5)
          else: raise SystemExit(f"canonical WickHunter truth did not converge: {last}")
          PY
      - name: Seed session, run v4 Chromium, cleanup and verify evidence
        env:
          HARNESS_SHA: ${{ needs.validate.outputs.harness_sha }}
          BROWSER_IMAGE: ${{ steps.target.outputs.browser_image }}
        shell: bash
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/portal-wh09-browser-v4-token"; evidence="$RUNNER_TEMP/portal-wh09-browser-v4.json"; browser_name="portal-wh09-browser-v4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          key="$(printf '%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"|sha256sum|awk '{print substr($1,1,24)}')"; principal_id="wh09-vp-$key"; membership_id="wh09-vm-$key"; subject="urn:freqtrade:wh09-browser-v4:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          umask 077; python3 -c 'import secrets; print(secrets.token_urlsafe(48))' > "$token_file"; session_token="$(cat "$token_file")"; echo "::add-mask::$session_token"; [[ "$session_token" =~ ^[A-Za-z0-9_-]+$ ]]
          docker exec -i --env "T=$session_token" --env "P=$principal_id" --env "M=$membership_id" --env "S=$subject" "$PORTAL_CONTROL_CONTAINER" python - <<'PY'
          from datetime import UTC,datetime,timedelta
          import os
          from ai_platform.portal.contracts.identity import RoleName
          from ai_platform.portal.control_plane.database import build_engine,build_session_factory
          from ai_platform.portal.identity.crypto import IdentityCrypto,IdentitySecrets
          from ai_platform.portal.identity.repository import IdentityRepository
          from ai_platform.portal.identity.runtime import IdentityRuntimeConfig
          c=IdentityRuntimeConfig.from_environment(); crypto=IdentityCrypto(IdentitySecrets(session_hmac_key=c.session_hmac_key,flow_encryption_key=c.flow_encryption_key)); eng=build_engine(os.environ["PORTAL_DATABASE_URL"]); f=build_session_factory(eng); now=datetime.now(UTC)
          try:
            with f() as s:
              r=IdentityRepository(s); p=r.create_principal(principal_id=os.environ["P"],issuer=c.issuer,subject=os.environ["S"],display_name="WH09 browser v4 acceptance",email=None,now=now); m=r.create_membership