name: Portal WickHunter WH09 Browser Retry Trigger

on:
  push:
    branches: [develop]
    paths:
      - deploy/synology/portal-oidc/run-requests/wickhunter-wh09-browser-acceptance-20260821-v6.json

permissions:
  contents: read

concurrency:
  group: portal-wickhunter-wh09-browser-retry-trigger
  cancel-in-progress: false

env:
  REQUEST_PATH: deploy/synology/portal-oidc/run-requests/wickhunter-wh09-browser-acceptance-20260821-v6.json
  TARGET_AUTHORIZATION_SHA: eafc198857c90caf89a5920da60ae7661c1061ba
  ADOPTION_RUN_ID: "32373954360"
  PORTAL_CONTROL_CONTAINER: freqtrade-portal-control-plane
  PORTAL_WEB_CONTAINER: freqtrade-portal-staging
  PORTAL_ORIGIN: https://quant.molehill.cloud

jobs:
  validate:
    name: Validate browser-only v6 authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      harness_sha: ${{ steps.authority.outputs.harness_sha }}
    steps:
      - name: Checkout exact one-shot trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Validate browser-only authorization
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/develop" && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$GITHUB_SHA:$REQUEST_PATH"
          if git cat-file -e "$GITHUB_SHA^:$REQUEST_PATH" 2>/dev/null; then echo "browser-only v6 request is not newly introduced one-shot material" >&2; exit 1; fi
          python3 - "$REQUEST_PATH" "$TARGET_AUTHORIZATION_SHA" "$ADOPTION_RUN_ID" <<'PY'
          import json,pathlib,sys
          p=json.loads(pathlib.Path(sys.argv[1]).read_text()); expected={"schema_version":3,"request_id":"wickhunter-wh09-browser-acceptance-20260821-v6","target_authorization_sha":sys.argv[2],"harness_source":"trigger_merge_sha","session_token_format":"urlsafe","acceptance_timeout_minutes":50,"adoption_run_id":int(sys.argv[3]),"portal_origin":"https://quant.molehill.cloud","browser_only":True,"runtime_e2e_required":True,"portal_deploy_authorized":False,"wh09_redeploy_authorized":False,"paper_activation_authorized":False,"trading_credentials_present":False,"order_adapter_present":False,"execution_enabled":False,"orders_submitted":0,"live_capital_authorized":False}
          if p!=expected: raise SystemExit("browser-only v6 authorization contract mismatch")
          PY
          printf 'harness_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify accepted adoption provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          readarray -t a < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ADOPTION_RUN_ID" --jq '[.name,.event,.head_branch,.head_sha,.status,.conclusion]|.[]')
          [[ "${a[0]}" == "Portal WickHunter WH09 Adoption" && "${a[1]}" == push && "${a[2]}" == develop && "${a[3]}" == "$TARGET_AUTHORIZATION_SHA" && "${a[4]}" == completed && "${a[5]}" == success ]]

  build-browser-image:
    name: Build exact v6 browser helper image
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - name: Checkout exact harness source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.harness_sha }}
      - name: Build and package dual-provenance helper
        id: package
        shell: bash
        env:
          HARNESS_SHA: ${{ needs.validate.outputs.harness_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HARNESS_SHA" ]]
          image="portal-wh09-deployed-browser-v6:$HARNESS_SHA"; out="$RUNNER_TEMP/portal-wh09-browser-image"; mkdir -p "$out"; artifact_name="portal-wh09-browser-v6-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --pull=false --label "org.opencontainers.image.revision=$HARNESS_SHA" --label "ftai.target_authorization_sha=$TARGET_AUTHORIZATION_SHA" --label "org.opencontainers.image.title=portal-wh09-deployed-browser-v6" -f deploy/synology/portal-oidc/Dockerfile.wickhunter-browser -t "$image" .
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"; [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" == "$HARNESS_SHA" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "ftai.target_authorization_sha"}}' "$image")" == "$TARGET_AUTHORIZATION_SHA" ]]
          docker save "$image"|gzip -9 > "$out/browser-image.tar.gz"; cp deploy/synology/portal-oidc/wickhunter-browser-accept-v6.sh "$out/accept.sh"; chmod 0755 "$out/accept.sh"
          tar_sha="$(sha256sum "$out/browser-image.tar.gz"|awk '{print $1}')"; script_sha="$(sha256sum "$out/accept.sh"|awk '{print $1}')"
          python3 - "$out/approval.json" "$HARNESS_SHA" "$TARGET_AUTHORIZATION_SHA" "$image_id" "$tar_sha" "$script_sha" "$image" <<'PY'
          import json,pathlib,sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({"schema_version":3,"harness_source_sha":sys.argv[2],"target_authorization_sha":sys.argv[3],"image_id":sys.argv[4],"tar_sha256":sys.argv[5],"accept_script_sha256":sys.argv[6],"image_tag":sys.argv[7],"persistent_runtime":False},sort_keys=True)+"\n")
          PY
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Upload bounded v6 browser helper image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/portal-wh09-browser-image
          if-no-files-found: error
          retention-days: 1

  accept:
    name: Real authenticated Chromium v6 against deployed Portal
    needs: [validate, build-browser-image]
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Download exact v6 browser helper image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-browser-image.outputs.artifact_name }}
          path: ${{ runner.temp }}/portal-wh09-browser-image
      - name: Validate dual provenance and deployed target
        id: target
        shell: bash
        env:
          HARNESS_SHA: ${{ needs.validate.outputs.harness_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$HARNESS_SHA" ]]; dir="$RUNNER_TEMP/portal-wh09-browser-image"
          readarray -t x < <(python3 - "$dir/approval.json" "$HARNESS_SHA" "$TARGET_AUTHORIZATION_SHA" <<'PY'
          import json,pathlib,sys
          a=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if a.get("schema_version")!=3 or a.get("harness_source_sha")!=sys.argv[2] or a.get("target_authorization_sha")!=sys.argv[3] or a.get("persistent_runtime") is not False: raise SystemExit("browser helper approval mismatch")
          print(a["image_id"]); print(a["tar_sha256"]); print(a["accept_script_sha256"]); print(a["image_tag"])
          PY
          )
          [[ "$(sha256sum "$dir/browser-image.tar.gz"|awk '{print $1}')" == "${x[1]}" && "$(sha256sum "$dir/accept.sh"|awk '{print $1}')" == "${x[2]}" ]]
          gzip -dc "$dir/browser-image.tar.gz"|docker load >/dev/null; image="${x[3]}"; [[ "$(docker image inspect --format '{{.Id}}' "$image")" == "${x[0]}" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" == "$HARNESS_SHA" && "$(docker image inspect --format '{{index .Config.Labels "ftai.target_authorization_sha"}}' "$image")" == "$TARGET_AUTHORIZATION_SHA" ]]
          printf 'browser_image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Run bounded v6 deployed acceptance
        shell: bash
        env:
          HARNESS_SHA: ${{ needs.validate.outputs.harness_sha }}
          BROWSER_IMAGE: ${{ steps.target.outputs.browser_image }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/portal-wh09-browser-image/accept.sh"
      - name: Upload secret-free v6 deployed browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-wh09-deployed-browser-v6-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portal-wh09-browser-v6.json
          if-no-files-found: warn
          retention-days: 30
