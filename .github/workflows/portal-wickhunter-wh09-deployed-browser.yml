name: Portal WickHunter WH09 Deployed Browser Acceptance

on:
  push:
    branches:
      - develop
    paths:
      - deploy/synology/portal-oidc/run-requests/wickhunter-wh09-portal-adoption-20260819-v2.json
  workflow_dispatch:
    inputs:
      authorization_sha:
        description: Exact develop commit that newly introduced the v2 adoption request
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portal-wickhunter-wh09-deployed-browser
  cancel-in-progress: false

env:
  REQUEST_PATH: deploy/synology/portal-oidc/run-requests/wickhunter-wh09-portal-adoption-20260819-v2.json
  PORTAL_CONTROL_CONTAINER: freqtrade-portal-control-plane
  PORTAL_WEB_CONTAINER: freqtrade-portal-staging
  PORTAL_ORIGIN: https://quant.molehill.cloud

jobs:
  wait-adoption:
    name: Wait for exact Portal adoption
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    outputs:
      authorization_sha: ${{ steps.authority.outputs.authorization_sha }}
    steps:
      - name: Resolve exact one-shot authorization
        id: authority
        shell: bash
        env:
          PUSH_SHA: ${{ github.sha }}
          DISPATCH_SHA: ${{ inputs.authorization_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            authorization_sha="$PUSH_SHA"
          else
            authorization_sha="$DISPATCH_SHA"
          fi
          [[ "$authorization_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'authorization_sha=%s\n' "$authorization_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact merged authorization
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ steps.authority.outputs.authorization_sha }}

      - name: Validate one-shot request identity
        shell: bash
        env:
          AUTHORIZATION_SHA: ${{ steps.authority.outputs.authorization_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$AUTHORIZATION_SHA" ]]
          git cat-file -e "$AUTHORIZATION_SHA:$REQUEST_PATH"
          if git cat-file -e "$AUTHORIZATION_SHA^:$REQUEST_PATH" 2>/dev/null; then
            echo "deployed-browser acceptance is not bound to a newly introduced one-shot request" >&2
            exit 1
          fi
          python3 - "$REQUEST_PATH" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          required = {
              "request_id": "wickhunter-wh09-portal-adoption-20260819-v2",
              "portal_origin": "https://quant.molehill.cloud",
              "bot_id": "wickhunter",
              "existing_runtime_adoption_authorized": True,
              "portal_deploy_authorized": True,
              "runtime_e2e_required": True,
              "trading_credentials_present": False,
              "order_adapter_present": False,
              "execution_enabled": False,
              "orders_submitted": 0,
              "live_capital_authorized": False,
          }
          for key, expected in required.items():
              if payload.get(key) != expected:
                  raise SystemExit(f"deployed-browser authorization mismatch: {key}")
          PY

      - name: Wait for exact Portal adoption success
        shell: bash
        env:
          AUTHORIZATION_SHA: ${{ steps.authority.outputs.authorization_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 120); do
            run_id="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/portal-wickhunter-wh09-adoption.yml/runs?branch=develop&event=push&per_page=20" \
                --jq '.workflow_runs[] | [.head_sha, (.id | tostring)] | @tsv' \
                | awk -F '\t' -v sha="$AUTHORIZATION_SHA" '$1 == sha {print $2; exit}'
            )"
            if [[ "$run_id" =~ ^[0-9]+$ ]]; then
              break
            fi
            sleep 5
          done
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "Waiting for exact Portal adoption run $run_id"
          for _ in $(seq 1 540); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // ""')"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]]
              exit 0
            fi
            sleep 10
          done
          echo "exact Portal adoption did not complete inside the bounded wait" >&2
          exit 1

  build-browser-image:
    name: Build exact deployed-browser helper image
    needs: wait-adoption
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - name: Checkout exact merged Portal
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.wait-adoption.outputs.authorization_sha }}

      - name: Build and package exact browser helper
        id: package
        shell: bash
        env:
          AUTHORIZATION_SHA: ${{ needs.wait-adoption.outputs.authorization_sha }}
        run: |
          set -euo pipefail
          image="portal-wh09-deployed-browser:$AUTHORIZATION_SHA"
          out="$RUNNER_TEMP/portal-wh09-browser-image"
          artifact_name="portal-wh09-browser-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$out"
          docker build \
            --pull=false \
            --label "org.opencontainers.image.revision=$AUTHORIZATION_SHA" \
            --label "org.opencontainers.image.title=portal-wh09-deployed-browser" \
            --file deploy/synology/portal-oidc/Dockerfile.wickhunter-browser \
            --tag "$image" \
            .
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$revision" == "$AUTHORIZATION_SHA" ]]
          docker save "$image" | gzip -9 > "$out/browser-image.tar.gz"
          tar_sha256="$(sha256sum "$out/browser-image.tar.gz" | awk '{print $1}')"
          python3 - "$out/approval.json" "$AUTHORIZATION_SHA" "$image_id" "$tar_sha256" "$image" <<'PY'
          import json
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "source_sha": sys.argv[2],
                      "image_id": sys.argv[3],
                      "tar_sha256": sys.argv[4],
                      "image_tag": sys.argv[5],
                      "purpose": "task-owned deployed Chromium acceptance",
                      "persistent_runtime": False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload bounded browser helper image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/portal-wh09-browser-image
          if-no-files-found: error
          retention-days: 1

  accept:
    name: Real authenticated Chromium against deployed Portal
    needs:
      - wait-adoption
      - build-browser-image
    runs-on:
      - freqtrade-staging
    environment: synology-staging
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact merged authorization
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ needs.wait-adoption.outputs.authorization_sha }}

      - name: Download exact browser helper image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-browser-image.outputs.artifact_name }}
          path: ${{ runner.temp }}/portal-wh09-browser-image

      - name: Validate helper provenance and deployed target
        id: target
        shell: bash
        env:
          AUTHORIZATION_SHA: ${{ needs.wait-adoption.outputs.authorization_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$AUTHORIZATION_SHA" ]]
          approval="$RUNNER_TEMP/portal-wh09-browser-image/approval.json"
          archive="$RUNNER_TEMP/portal-wh09-browser-image/browser-image.tar.gz"
          readarray -t expected < <(python3 - "$approval" "$AUTHORIZATION_SHA" <<'PY'
          import json
          import pathlib
          import sys

          approval = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if approval.get("schema_version") != 1 or approval.get("source_sha") != sys.argv[2]:
              raise SystemExit("browser helper approval source mismatch")
          if approval.get("persistent_runtime") is not False:
              raise SystemExit("browser helper unexpectedly claims persistent runtime authority")
          print(approval["image_id"])
          print(approval["tar_sha256"])
          print(approval["image_tag"])
          PY
          )
          expected_id="${expected[0]}"
          expected_tar_sha="${expected[1]}"
          browser_image="${expected[2]}"
          [[ "$(sha256sum "$archive" | awk '{print $1}')" == "$expected_tar_sha" ]]
          gzip -dc "$archive" | docker load >/dev/null
          [[ "$(docker image inspect --format '{{.Id}}' "$browser_image")" == "$expected_id" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$browser_image")" == "$AUTHORIZATION_SHA" ]]
          printf 'browser_image=%s\n' "$browser_image" >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 90); do
            control_revision="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$PORTAL_CONTROL_CONTAINER" 2>/dev/null || true)"
            web_revision="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$PORTAL_WEB_CONTAINER" 2>/dev/null || true)"
            control_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$PORTAL_CONTROL_CONTAINER" 2>/dev/null || true)"
            web_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$PORTAL_WEB_CONTAINER" 2>/dev/null || true)"
            if [[ "$control_revision" == "$AUTHORIZATION_SHA" && "$web_revision" == "$AUTHORIZATION_SHA" && "$control_health" == "healthy" && "$web_health" == "healthy" ]]; then
              break
            fi
            sleep 2
          done
          [[ "$control_revision" == "$AUTHORIZATION_SHA" ]]
          [[ "$web_revision" == "$AUTHORIZATION_SHA" ]]
          [[ "$control_health" == "healthy" ]]
          [[ "$web_health" == "healthy" ]]
          docker inspect "$PORTAL_WEB_CONTAINER" > "$RUNNER_TEMP/portal-web-inspect.json"
          python3 - "$RUNNER_TEMP/portal-web-inspect.json" <<'PY'
          import json
          import sys

          container = json.load(open(sys.argv[1], encoding="utf-8"))[0]
          env = set(container["Config"].get("Env") or [])
          if "PORTAL_WEB_DATA_MODE=api" not in env:
              raise SystemExit("deployed Portal web is not in API mode")
          if "PORTAL_IDENTITY_FIXTURE_MODE=disabled" not in env:
              raise SystemExit("deployed Portal identity fixture mode is not disabled")
          PY

      - name: Verify canonical WickHunter truth before browser session
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$PORTAL_CONTROL_CONTAINER" python - <<'PY'
          import os
          from uuid import uuid4

          from fastapi.testclient import TestClient

          from ai_platform.portal.contracts.identity import ActorType, Permission
          from ai_platform.portal.control_plane.api import create_app
          from ai_platform.portal.control_plane.context import RequestContext
          from ai_platform.portal.control_plane.database import build_engine, build_session_factory

          context = RequestContext(
              tenant_id="tenant-local",
              actor_id="system-wh09-deployed-browser-preflight",
              actor_type=ActorType.SYSTEM,
              permissions=(Permission.BOT_READ, Permission.AUDIT_READ),
              request_id=uuid4(),
              correlation_id=uuid4(),
              causation_id=None,
          )
          factory = build_session_factory(build_engine(os.environ["PORTAL_DATABASE_URL"]))
          client = TestClient(create_app(factory, identity_context_provider=lambda: context))
          bots = client.get("/v1/bots")
          truth = client.get("/v1/bots/wickhunter/runtime-truth")
          runtime = client.get("/v1/bots/wickhunter/wickhunter-runtime-evidence")
          if bots.status_code != 200 or truth.status_code != 200 or runtime.status_code != 200:
              raise SystemExit("canonical WickHunter preflight API is unavailable")
          rows = [row for row in bots.json() if row.get("bot_id") == "wickhunter"]
          if len(rows) != 1:
              raise SystemExit("canonical WickHunter bot identity is not unique")
          if truth.json().get("pending_rollout") is not False:
              raise SystemExit("RuntimeGeneration is not converged")
          evidence = runtime.json().get("runtime") or {}
          if evidence.get("health") != "HEALTHY":
              raise SystemExit("WickHunter runtime is not HEALTHY")
          if evidence.get("decision_count", 0) <= 0 or evidence.get("no_trade_count", 0) <= 0:
              raise SystemExit("durable decision/NO_TRADE evidence is empty")
          if evidence.get("execution_enabled") is not False or evidence.get("orders_submitted") != 0:
              raise SystemExit("WickHunter execution authority changed")
          if evidence.get("trading_credentials_present") is not False:
              raise SystemExit("WickHunter trading credentials unexpectedly appeared")
          if evidence.get("live_capital_authorized") is not False:
              raise SystemExit("WickHunter live-capital authority unexpectedly appeared")
          PY

      - name: Seed session, run deployed Chromium and capture evidence
        shell: bash
        env:
          AUTHORIZATION_SHA: ${{ needs.wait-adoption.outputs.authorization_sha }}
          BROWSER_IMAGE: ${{ steps.target.outputs.browser_image }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/portal-wh09-browser-session-token"
          evidence="$RUNNER_TEMP/portal-wh09-deployed-browser.json"
          browser_name="portal-wh09-deployed-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          principal_id="wh09-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          membership_id="wh09-browser-membership-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          subject="urn:freqtrade:wh09-browser:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          umask 077
          openssl rand -base64 48 | tr -d '\n' > "$token_file"
          session_token="$(cat "$token_file")"
          echo "::add-mask::$session_token"
          [[ ${#session_token} -ge 48 ]]

          docker exec -i \
            --env "PORTAL_WH09_ACCEPTANCE_SESSION_TOKEN=$session_token" \
            --env "PORTAL_WH09_ACCEPTANCE_PRINCIPAL_ID=$principal_id" \
            --env "PORTAL_WH09_ACCEPTANCE_MEMBERSHIP_ID=$membership_id" \
            --env "PORTAL_WH09_ACCEPTANCE_SUBJECT=$subject" \
            "$PORTAL_CONTROL_CONTAINER" python - <<'PY'
          from datetime import UTC, datetime, timedelta
          import os

          from ai_platform.portal.contracts.identity import RoleName
          from ai_platform.portal.control_plane.database import build_engine, build_session_factory
          from ai_platform.portal.identity.crypto import IdentityCrypto, IdentitySecrets
          from ai_platform.portal.identity.repository import IdentityRepository
          from ai_platform.portal.identity.runtime import IdentityRuntimeConfig

          token = os.environ["PORTAL_WH09_ACCEPTANCE_SESSION_TOKEN"]
          config = IdentityRuntimeConfig.from_environment()
          crypto = IdentityCrypto(
              IdentitySecrets(
                  session_hmac_key=config.session_hmac_key,
                  flow_encryption_key=config.flow_encryption_key,
              )
          )
          engine = build_engine(os.environ["PORTAL_DATABASE_URL"])
          factory = build_session_factory(engine)
          now = datetime.now(UTC)
          try:
              with factory() as session:
                  repository = IdentityRepository(session)
                  principal = repository.create_principal(
                      principal_id=os.environ["PORTAL_WH09_ACCEPTANCE_PRINCIPAL_ID"],
                      issuer=config.issuer,
                      subject=os.environ["PORTAL_WH09_ACCEPTANCE_SUBJECT"],
                      display_name="WickHunter browser acceptance",
                      email=None,
                      now=now,
                  )
                  membership = repository.create_membership(
                      membership_id=os.environ["PORTAL_WH09_ACCEPTANCE_MEMBERSHIP_ID"],
                      principal_id=principal.principal_id,
                      tenant_id="tenant-local",
                      roles=(RoleName.USER,),
                      valid_from=now,
                      valid_until=now + timedelta(minutes=30),
                      now=now,
                  )
                  repository.create_session(
                      session_id_hash=crypto.hash_token(token),
                      csrf_token_hash=crypto.hash_token(token + ":csrf"),
                      principal_id=principal.principal_id,
                      membership_id=membership.membership_id,
                      membership_version=membership.membership_version,
                      idp_session_id=None,
                      authentication_time=now,
                      mfa_satisfied=True,
                      created_at=now,
                      idle_expires_at=now + timedelta(minutes=15),
                      absolute_expires_at=now + timedelta(minutes=30),
                  )
                  session.commit()
          finally:
              engine.dispose()
          PY

          browser_rc=0
          docker create \
            --name "$browser_name" \
            --label "ftai.task=FTAI-20260819-wickhunter-portal-real-integration-1561" \
            --label "ftai.authorization_sha=$AUTHORIZATION_SHA" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --shm-size 256m \
            --env WICKHUNTER_BROWSER_ORIGIN="$PORTAL_ORIGIN" \
            --env WICKHUNTER_SESSION_TOKEN="$session_token" \
            --env WICKHUNTER_CSRF_TOKEN="${session_token}:csrf" \
            --env WICKHUNTER_BROWSER_EXECUTABLE_PATH=/usr/bin/chromium \
            --env WICKHUNTER_BROWSER_EVIDENCE_PATH=/tmp/evidence.json \
            "$BROWSER_IMAGE" >/dev/null
          docker start --attach "$browser_name" || browser_rc=$?
          if docker cp "$browser_name:/tmp/evidence.json" "$evidence" 2>/dev/null; then
            chmod 0600 "$evidence"
          fi

          cleanup_rc=0
          docker exec -i \
            --env "PORTAL_WH09_ACCEPTANCE_SESSION_TOKEN=$session_token" \
            --env "PORTAL_WH09_ACCEPTANCE_PRINCIPAL_ID=$principal_id" \
            --env "PORTAL_WH09_ACCEPTANCE_MEMBERSHIP_ID=$membership_id" \
            --env "PORTAL_WH09_ACCEPTANCE_SUBJECT=$subject" \
            "$PORTAL_CONTROL_CONTAINER" python - <<'PY' || cleanup_rc=$?
          import os

          from ai_platform.portal.control_plane.database import build_engine, build_session_factory
          from ai_platform.portal.identity.crypto import IdentityCrypto, IdentitySecrets
          from ai_platform.portal.identity.models import (
              IdentityPrincipalRow,
              PortalSessionRow,
              TenantMembershipRow,
          )
          from ai_platform.portal.identity.runtime import IdentityRuntimeConfig

          token = os.environ["PORTAL_WH09_ACCEPTANCE_SESSION_TOKEN"]
          principal_id = os.environ["PORTAL_WH09_ACCEPTANCE_PRINCIPAL_ID"]
          membership_id = os.environ["PORTAL_WH09_ACCEPTANCE_MEMBERSHIP_ID"]
          subject = os.environ["PORTAL_WH09_ACCEPTANCE_SUBJECT"]
          config = IdentityRuntimeConfig.from_environment()
          crypto = IdentityCrypto(
              IdentitySecrets(
                  session_hmac_key=config.session_hmac_key,
                  flow_encryption_key=config.flow_encryption_key,
              )
          )
          session_hash = crypto.hash_token(token)
          engine = build_engine(os.environ["PORTAL_DATABASE_URL"])
          factory = build_session_factory(engine)
          try:
              with factory() as session:
                  portal_session = session.get(PortalSessionRow, session_hash)
                  if portal_session is not None:
                      if (
                          portal_session.principal_id != principal_id
                          or portal_session.membership_id != membership_id
                      ):
                          raise SystemExit("refusing to remove non-task-owned Portal session")
                      session.delete(portal_session)
                      session.flush()
                  membership = session.get(TenantMembershipRow, membership_id)
                  if membership is not None:
                      if membership.principal_id != principal_id or membership.tenant_id != "tenant-local":
                          raise SystemExit("refusing to remove non-task-owned membership")
                      session.delete(membership)
                      session.flush()
                  principal = session.get(IdentityPrincipalRow, principal_id)
                  if principal is not None:
                      if principal.subject != subject:
                          raise SystemExit("refusing to remove non-task-owned principal")
                      session.delete(principal)
                  session.commit()
                  if session.get(PortalSessionRow, session_hash) is not None:
                      raise SystemExit("task-owned Portal session cleanup failed")
                  if session.get(TenantMembershipRow, membership_id) is not None:
                      raise SystemExit("task-owned membership cleanup failed")
                  if session.get(IdentityPrincipalRow, principal_id) is not None:
                      raise SystemExit("task-owned principal cleanup failed")
          finally:
              engine.dispose()
          PY
          rm -f "$token_file"
          docker rm -f "$browser_name" >/dev/null 2>&1 || true
          docker image rm "$BROWSER_IMAGE" >/dev/null 2>&1 || true
          [[ "$cleanup_rc" -eq 0 ]]
          [[ "$browser_rc" -eq 0 ]]
          test -s "$evidence"
          python3 - "$evidence" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          required = {
              "result": "PASS",
              "origin": "https://quant.molehill.cloud",
              "mode": "shadow",
              "authenticated": True,
              "fixture_cookie_present": False,
              "health_visible": True,
              "runtime_generation_converged": True,
              "reload_persistence": True,
          }
          for key, expected in required.items():
              if evidence.get(key) != expected:
                  raise SystemExit(f"deployed browser evidence mismatch: {key}")
          if evidence.get("decision_count", 0) <= 0 or evidence.get("no_trade_count", 0) <= 0:
              raise SystemExit("deployed browser did not expose decision/NO_TRADE evidence")
          PY

      - name: Upload secret-free deployed browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portal-wh09-deployed-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portal-wh09-deployed-browser.json
          if-no-files-found: warn
          retention-days: 30
