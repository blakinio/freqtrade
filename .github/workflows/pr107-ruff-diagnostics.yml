name: PR107 Ruff diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/pr107-ruff-diagnostics.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21

      - name: Capture Ruff JSON
        shell: bash
        run: |
          set +e
          ruff check \
            ai_platform/scripts/rl_v2_synthetic_reference.py \
            tests/ai_platform/test_rl_v2_synthetic_reference.py \
            --output-format=json > ruff-output.json
          printf '%s\n' "$?" > ruff-exit-code.txt
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr107-ruff-diagnostics
          path: |
            ruff-output.json
            ruff-exit-code.txt
          if-no-files-found: error
