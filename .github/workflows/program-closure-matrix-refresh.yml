name: One-off Gate 0 matrix refresh

on:
  push:
    branches:
      - agent/program-closure-preflight

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Gate 0 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/program-closure-preflight
          fetch-depth: 0

      - name: Refresh matrix live-state evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/ai_platform/PROGRAM_CLOSURE_MATRIX.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "- evidence anchor: `develop@0208666d98849386e2f2d9acf534b13891e4afa2`;":
                  "- evidence anchor: `develop@d57c12b030259d0ae5931306c3e3046713e2e8aa`;",
              "- normal synchronization: PR #768 merged into this branch as `6515346ca1e2a44b059cb1e7c2585285e1fc0c17`;":
                  "- normal synchronization: PR #768 merged as `6515346ca1e2a44b059cb1e7c2585285e1fc0c17`; PR #774 merged current `develop` as `354c21832d2bfd60d38baef4c7bccd513ba6386f`;",
              "- live adjacent work: PR #761, PR #762 and PR #758 are open; PR #753 is merged in current `develop`;":
                  "- live adjacent work: PR #761, PR #762 and PR #758 are open; PR #753, repair PR #766 and archival PR #773 are merged in current `develop`;",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one exact matrix line: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

          tasks=(
            docs/agents/tasks/FTAI-20260730-program-closure-preflight.md
            docs/agents/tasks/FTAI-20260730-closure-contracts.md
            docs/agents/tasks/FTAI-20260730-closure-time-leakage.md
            docs/agents/tasks/FTAI-20260730-closure-feature-engine.md
            docs/agents/tasks/FTAI-20260730-closure-simulator.md
            docs/agents/tasks/FTAI-20260730-closure-research-data.md
            docs/agents/tasks/FTAI-20260730-closure-ai-routing-ranking.md
            docs/agents/tasks/FTAI-20260730-closure-ui-signal-wizard.md
            docs/agents/tasks/FTAI-20260730-closure-ui-strategy-catalog.md
            docs/agents/tasks/FTAI-20260730-closure-integration-e2e.md
            docs/agents/tasks/FTAI-20260730-closure-external-staging.md
          )
          for task in "${tasks[@]}"; do
            python tools/agents/checkpoint.py "$task" --require-checkpoint
          done
          git diff --check

      - name: Commit durable refresh and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/program-closure-matrix-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/program-closure-matrix-refresh.yml docs/ai_platform/PROGRAM_CLOSURE_MATRIX.md
          git commit -m "docs(ai-platform): refresh Gate 0 live-state anchor"
          git push origin HEAD:agent/program-closure-preflight
