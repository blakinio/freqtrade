name: Program closure preflight live refresh

on:
  push:
    branches:
      - agent/program-closure-preflight

permissions:
  contents: write

concurrency:
  group: program-closure-preflight-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Gate 0 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh exact live-state evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence of {old!r}, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          matrix = "docs/ai_platform/PROGRAM_CLOSURE_MATRIX.md"
          replace_once(
              matrix,
              "- evidence anchor: `develop@0208666d98849386e2f2d9acf534b13891e4afa2`;",
              "- evidence anchor: `develop@ac545041046e618c477e0ab5d999e11d261a742e`;",
          )
          replace_once(
              matrix,
              "- normal synchronization: PR #768 merged into this branch as `6515346ca1e2a44b059cb1e7c2585285e1fc0c17`;",
              "- normal synchronization: PR #768 merged as `6515346ca1e2a44b059cb1e7c2585285e1fc0c17`; PR #774 then merged repaired `develop` as `354c21832d2bfd60d38baef4c7bccd513ba6386f`;",
          )
          replace_once(
              matrix,
              "- live adjacent work: PR #761, PR #762 and PR #758 are open; PR #753 is merged in current `develop`;",
              "- live adjacent work: PR #761, PR #762 and PR #758 are open; PR #753 and validation repair PR #766 are merged in current `develop`;",
          )

          task = "docs/agents/tasks/FTAI-20260730-program-closure-preflight.md"
          replace_once(
              task,
              "- The existing Gate 0 branch was synchronized normally with current `develop` through PR #768.",
              "- The Gate 0 branch was synchronized normally through PR #768 and PR #774 with repaired `develop@ac545041046e618c477e0ab5d999e11d261a742e`.",
          )
          replace_once(task, "updated_at: 2026-07-30T11:50:00+02:00", "updated_at: 2026-07-30T12:20:00+02:00")
          replace_once(task, "head: f07ee8f53be18f902c1d3ead4d2bdac57cbb79fd", "head: 354c21832d2bfd60d38baef4c7bccd513ba6386f")
          replace_once(
              task,
              "  - PR #759 merged normally and PR #768 synchronized current develop into this Gate 0 branch.",
              "  - PR #759 merged normally; PR #768 and PR #774 synchronized current develop, including merged validation repair PR #766, into this Gate 0 branch.",
          )
          replace_once(
              task,
              "  - Exact-head CI conclusions and unresolved review-thread state after this checkpoint commit.",
              "  - Exact-head CI conclusions and unresolved review-thread state after this live-state checkpoint commit.",
          )
          replace_once(
              task,
              "  evidence: The Gate 0 PR head moved after the exact dispatch-path correction and must complete required CI and review verification before merge.",
              "  evidence: The Gate 0 PR head moved after normal synchronization with repaired develop and must complete required CI and review verification before merge.",
          )
          replace_once(
              task,
              "  - Exact-head required CI and review-thread verification remain pending after this commit.",
              "  - Exact-head required CI and review-thread verification remain pending after the live-state refresh commit.",
          )
          PY

      - name: Validate all Gate 0 checkpoints
        shell: bash
        run: |
          tasks=(
            docs/agents/tasks/FTAI-20260730-program-closure-preflight.md
            docs/agents/tasks/FTAI-20260730-closure-contracts.md
            docs/agents/tasks/FTAI-20260730-closure-time-leakage.md
            docs/agents/tasks/FTAI-20260730-closure-feature-engine.md
            docs/agents/tasks/FTAI-20260730-closure-simulator.md
            docs/agents/tasks/FTAI-20260730-closure-research-data.md
            docs/agents/tasks/FTAI-20260730-closure-ai-routing-ranking.md
            docs/agents/tasks/FTAI-20260730-closure-ui-signal-wizard.md
            docs/agents/tasks/FTAI-20260730-closure-ui-strategy-catalog.md
            docs/agents/tasks/FTAI-20260730-closure-integration-e2e.md
            docs/agents/tasks/FTAI-20260730-closure-external-staging.md
          )
          for task in "${tasks[@]}"; do
            python tools/agents/checkpoint.py "$task" --require-checkpoint
          done

      - name: Validate exact ownership and coverage invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          tasks = sorted(Path("docs/agents/tasks").glob("FTAI-20260730-closure-*.md"))
          paths: dict[str, str] = {}
          for task in tasks:
              text = task.read_text(encoding="utf-8")
              frontmatter = yaml.safe_load(text.split("---", 2)[1])
              for path in frontmatter.get("owned_paths", []):
                  previous = paths.setdefault(path, task.name)
                  if previous != task.name:
                      raise SystemExit(f"owned path collision: {path}: {previous}, {task.name}")
              if len(re.findall(r"^next_action:", text, flags=re.MULTILINE)) != 1:
                  raise SystemExit(f"next_action cardinality failed: {task}")

          matrix = Path("docs/ai_platform/PROGRAM_CLOSURE_MATRIX.md").read_text(encoding="utf-8")
          rows = re.findall(r"^\| P[012]\.[^\n]+$", matrix, flags=re.MULTILINE)
          if len(rows) != 73:
              raise SystemExit(f"expected 73 classified P0/P1/P2 rows, found {len(rows)}")
          allowed = (
              "PROVEN_COMPLETE",
              "REAL_GAP",
              "DUPLICATE_OR_SUPERSEDED",
              "EXTERNAL_OWNER_ACTION",
              "DEFERRED_BY_POLICY",
              "BLOCKED",
          )
          for row in rows:
              if sum(f"**{status}**" in row for status in allowed) != 1:
                  raise SystemExit(f"invalid status cardinality: {row}")
          print(f"classified_rows={len(rows)} owned_paths={len(paths)}")
          PY

      - name: Commit refresh and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/program-closure-preflight-refresh.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add \
            .github/workflows/program-closure-preflight-refresh.yml \
            docs/ai_platform/PROGRAM_CLOSURE_MATRIX.md \
            docs/agents/tasks/FTAI-20260730-program-closure-preflight.md
          git diff --cached --check
          git commit -m "docs(agents): refresh Gate 0 live validation state"
          git push origin HEAD:agent/program-closure-preflight
