name: Prove Binance Smoke setup-uv Runtime

on:
  pull_request:
    types: [opened]
    paths:
      - ".github/workflows/prove-binance-smoke-setup-uv-runtime-20260728.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: freqtrade-staging
    environment: synology-staging
    timeout-minutes: 5
    steps:
      - name: Verify exact runner identity
        env:
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME_VALUE" == "freqtrade-synology-staging" ]]
          [[ "$RUNNER_OS_VALUE" == "Linux" ]]
          [[ "$RUNNER_ARCH_VALUE" == "X64" || "$RUNNER_ARCH_VALUE" == "ARM64" ]]

      - name: Install isolated Python runtime
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.12"
          enable-cache: false

      - name: Verify pinned validation dependency
        run: |
          set -euo pipefail
          python --version
          uv pip install "jsonschema==4.26.0"
          python -c "from jsonschema import Draft202012Validator; print(Draft202012Validator.__name__)"

      - name: Remove isolated runtime
        if: always()
        run: rm -rf .venv
