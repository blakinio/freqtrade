name: Repair PR1496 CI regressions

on:
  push:
    branches:
      - codex/portal-runtime-supervisor-1355
    paths:
      - ".github/workflows/repair-1496-ci.yml"

permissions:
  contents: write

concurrency:
  group: repair-pr1496-ci
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'blakinio/freqtrade'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/portal-runtime-supervisor-1355
          fetch-depth: 0

      - name: Apply bounded test-contract repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cleanup = Path("tests/ai_platform/portal/execution/test_driver_cleanup.py")
          text = cleanup.read_text(encoding="utf-8")
          old = '    assert "runtime-1" not in driver._container_ids\n'
          new = '    assert driver._container_ids["runtime-1"] == "container-id-1"\n'
          if new not in text:
              if old not in text:
                  raise SystemExit("cleanup stale expectation marker not found")
              text = text.replace(old, new, 1)
          cleanup.write_text(text, encoding="utf-8")

          host = Path("tests/ai_platform/portal/execution/test_host_isolation.py")
          text = host.read_text(encoding="utf-8")
          marker = '    backend._network_ids["runtime-1"] = NETWORK_ID\n'
          targets = (
              "test_network_attestation_accepts_exact_staged_canonical_ruleset",
              "test_network_attestation_rejects_noncanonical_staged_ruleset",
              "test_network_attestation_rejects_copied_runtime_labels_on_wrong_container",
              "test_network_attestation_rejects_unrelated_container",
          )
          for name in targets:
              start = text.find(f"def {name}")
              if start < 0:
                  raise SystemExit(f"function not found: {name}")
              next_def = text.find("\ndef ", start + 1)
              if next_def < 0:
                  next_def = len(text)
              block = text[start:next_def]
              if marker in block:
                  continue
              ctor = text.find("    backend = LinuxNftablesBtrfsIsolationAttestor(\n", start, next_def)
              if ctor < 0:
                  raise SystemExit(f"backend constructor not found: {name}")
              close = text.find("    )\n", ctor, next_def)
              if close < 0:
                  raise SystemExit(f"backend constructor close not found: {name}")
              insert_at = close + len("    )\n")
              text = text[:insert_at] + marker + text[insert_at:]
          host.write_text(text, encoding="utf-8")
          PY

      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.15.21
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/execution/test_driver_cleanup.py \
            tests/ai_platform/portal/execution/test_host_isolation.py \
            tests/ai_platform/portal/execution/test_immutable_runtime_identity.py \
            tests/ai_platform/portal/execution/test_runtime_identity_retention.py \
            tests/ai_platform/portal/runtime_supervisor/test_durable_ownership_restart.py
          ruff check \
            tests/ai_platform/portal/execution/test_driver_cleanup.py \
            tests/ai_platform/portal/execution/test_host_isolation.py
          git diff --check

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-1496-ci.yml
          git add \
            tests/ai_platform/portal/execution/test_driver_cleanup.py \
            tests/ai_platform/portal/execution/test_host_isolation.py
          if git diff --cached --quiet; then
            echo "No repair changes produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(portal): align immutable ownership regressions"
          git push origin HEAD:codex/portal-runtime-supervisor-1355
