name: PR1496 bounded outcome binding repair

on:
  push:
    branches:
      - codex/portal-runtime-supervisor-1355
    paths:
      - .github/workflows/repair-1496-outcome-binding.yml

permissions:
  contents: write

concurrency:
  group: repair-1496-outcome-binding
  cancel-in-progress: false

jobs:
  repair:
    name: Repair and validate Supervisor outcome binding
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/portal-runtime-supervisor-1355
          fetch-depth: 2
          persist-credentials: true # zizmor: ignore[artipacked] - lifecycle-bounded self-removing repair push

      - name: Verify exact audited parent and bounded trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b3d7a271ae00d7ab8873a9c0d6672ca3849cfd49"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-1496-outcome-binding.yml"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install bounded validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6"
          "httpx>=0.24.1" fastapi pyjwt cryptography "PyYAML>=6.0"
          ruff==0.15.21 mypy==2.1.0

      - name: Apply exact response-binding repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo


          def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} exact anchors, found {actual}")
              target.write_text(text.replace(old, new), encoding="utf-8")


          replace_exact(
              "ai_platform/portal/runtime_supervisor/types.py",
              """    command_id: UUID\n    correlation_id: UUID\n    state: DriverRuntimeState | None = None\n""",
              """    command_id: UUID\n    correlation_id: UUID\n    expected_generation_ordinal: PositiveInt | None = None\n    expected_state_version: NonNegativeInt | None = None\n    causation_id: UUID | None = None\n    state: DriverRuntimeState | None = None\n""",
          )

          replace_exact(
              "ai_platform/portal/runtime_supervisor/service.py",
              """            \"command_id\": str(request.command_id),\n            \"state\": state.value if state else None,\n""",
              """            \"command_id\": str(request.command_id),\n            \"expected_generation_ordinal\": request.expected_generation_ordinal,\n            \"expected_state_version\": request.expected_state_version,\n            \"correlation_id\": str(request.correlation_id),\n            \"causation_id\": (\n                str(request.causation_id) if request.causation_id is not None else None\n            ),\n            \"state\": state.value if state else None,\n""",
          )
          replace_exact(
              "ai_platform/portal/runtime_supervisor/service.py",
              """        return SupervisorOutcome(\n            **evidence, correlation_id=request.correlation_id, evidence_digest=digest\n        )\n""",
              """        return SupervisorOutcome(**evidence, evidence_digest=digest)\n""",
          )

          replace_exact(
              "ai_platform/portal/execution/adapter.py",
              """            or outcome.command_id != request.command_id\n            or outcome.correlation_id != request.correlation_id\n""",
              """            or outcome.command_id != request.command_id\n            or outcome.expected_generation_ordinal != request.expected_generation_ordinal\n            or outcome.expected_state_version != request.expected_state_version\n            or outcome.correlation_id != request.correlation_id\n            or outcome.causation_id != request.causation_id\n""",
          )

          replace_exact(
              "tests/ai_platform/portal/execution/test_adapter.py",
              """                command_id=request.command_id,\n                correlation_id=request.correlation_id,\n""",
              """                command_id=request.command_id,\n                correlation_id=request.correlation_id,\n                expected_generation_ordinal=request.expected_generation_ordinal,\n                expected_state_version=request.expected_state_version,\n                causation_id=request.causation_id,\n""",
              count=1,
          )
          replace_exact(
              "tests/ai_platform/portal/execution/test_adapter.py",
              """            command_id=request.command_id,\n            correlation_id=request.correlation_id,\n""",
              """            command_id=request.command_id,\n            correlation_id=request.correlation_id,\n            expected_generation_ordinal=request.expected_generation_ordinal,\n            expected_state_version=request.expected_state_version,\n            causation_id=request.causation_id,\n""",
              count=1,
          )
          replace_exact(
              "tests/ai_platform/portal/execution/test_adapter.py",
              """class _MismatchedSupervisor(_FakeSupervisor):\n    def execute(self, request: SupervisorRequest) -> SupervisorOutcome:\n        outcome = super().execute(request)\n        return outcome.model_copy(update={\"generation_id\": \"generation-other\"})\n""",
              """class _MismatchedSupervisor(_FakeSupervisor):\n    def __init__(self, field: str, value: object) -> None:\n        super().__init__()\n        self.field = field\n        self.value = value\n\n    def execute(self, request: SupervisorRequest) -> SupervisorOutcome:\n        outcome = super().execute(request)\n        return outcome.model_copy(update={self.field: self.value})\n""",
          )
          replace_exact(
              "tests/ai_platform/portal/execution/test_adapter.py",
              """def test_mismatched_supervisor_outcome_identity_is_rejected(tmp_path: Path) -> None:\n    resolver = _Resolver()\n    resolver.register(_material())\n    adapter = FreqtradeExecutionAdapter(\n        _MismatchedSupervisor(),\n        resolver,\n        RuntimeWorkspaceStore(tmp_path),\n        clock=lambda: NOW,\n    )\n\n    with pytest.raises(RuntimeRevisionConflictError, match=\"outcome identity mismatch\"):\n        adapter.provision_bot(_bot(), _context())\n""",
              """@pytest.mark.parametrize(\n    (\"field\", \"value\"),\n    [\n        (\"tenant_id\", \"tenant-other\"),\n        (\"bot_id\", \"bot-other\"),\n        (\"generation_id\", \"generation-other\"),\n        (\"generation_spec_digest\", \"f\" * 64),\n        (\"operation\", SupervisorOperation.ENSURE_STOPPED),\n        (\"command_id\", uuid4()),\n        (\"expected_generation_ordinal\", 2),\n        (\"expected_state_version\", 2),\n        (\"correlation_id\", uuid4()),\n        (\"causation_id\", None),\n    ],\n)\ndef test_mismatched_supervisor_outcome_identity_is_rejected(\n    tmp_path: Path, field: str, value: object\n) -> None:\n    resolver = _Resolver()\n    resolver.register(_material())\n    adapter = FreqtradeExecutionAdapter(\n        _MismatchedSupervisor(field, value),\n        resolver,\n        RuntimeWorkspaceStore(tmp_path),\n        clock=lambda: NOW,\n    )\n\n    with pytest.raises(RuntimeRevisionConflictError, match=\"outcome identity mismatch\"):\n        adapter.provision_bot(_bot(), _context())\n""",
          )

          binding_test = Path(
              "tests/ai_platform/portal/runtime_supervisor/test_outcome_binding.py"
          )
          if binding_test.exists():
              raise SystemExit(f"unexpected pre-existing file: {binding_test}")
          binding_test.write_text(
              '''from __future__ import annotations\n\nfrom uuid import uuid4\n\nfrom ai_platform.portal.execution.runtime import DriverRuntimeState\nfrom ai_platform.portal.runtime_supervisor import (\n    SupervisorOperation,\n    SupervisorOutcome,\n    SupervisorOutcomeCode,\n    SupervisorRequest,\n)\nfrom ai_platform.portal.runtime_supervisor.service import RuntimeSupervisor\n\n\ndef _request(**updates: object) -> SupervisorRequest:\n    values: dict[str, object] = {\n        "tenant_id": "tenant-1",\n        "bot_id": "bot-1",\n        "generation_id": "generation-1",\n        "generation_spec_digest": "a" * 64,\n        "operation": SupervisorOperation.INSPECT_GENERATION,\n        "command_id": uuid4(),\n        "expected_generation_ordinal": 2,\n        "expected_state_version": 7,\n        "correlation_id": uuid4(),\n        "causation_id": uuid4(),\n    }\n    values.update(updates)\n    return SupervisorRequest.model_validate(values)\n\n\ndef _outcome(request: SupervisorRequest) -> SupervisorOutcome:\n    return RuntimeSupervisor._outcome(\n        request,\n        SupervisorOutcomeCode.OBSERVED,\n        True,\n        DriverRuntimeState.RUNNING,\n        7,\n    )\n\n\ndef test_outcome_echoes_and_serializes_full_authoritative_request_binding() -> None:\n    request = _request()\n    outcome = _outcome(request)\n\n    assert outcome.expected_generation_ordinal == request.expected_generation_ordinal\n    assert outcome.expected_state_version == request.expected_state_version\n    assert outcome.correlation_id == request.correlation_id\n    assert outcome.causation_id == request.causation_id\n\n    recovered = SupervisorOutcome.model_validate_json(outcome.model_dump_json())\n    assert recovered == outcome\n\n\ndef test_evidence_digest_changes_for_each_new_request_binding_field() -> None:\n    request = _request()\n    baseline = _outcome(request).evidence_digest\n\n    variants = [\n        request.model_copy(update={"expected_generation_ordinal": 3}),\n        request.model_copy(update={"expected_state_version": 8}),\n        request.model_copy(update={"correlation_id": uuid4()}),\n        request.model_copy(update={"causation_id": uuid4()}),\n    ]\n\n    assert all(_outcome(candidate).evidence_digest != baseline for candidate in variants)\n''',
              encoding="utf-8",
          )

          task_path = Path(
              "docs/agents/tasks/active/FTAI-20260813-portal-runtime-supervisor-audit-repair-1496.md"
          )
          task = task_path.read_text(encoding="utf-8")
          finding_anchor = (
              "- `RS-FRESH-CLOSEOUT-20260813-01 / P1` — **REPAIRED IN CODE, FINAL "
              "VALIDATION PENDING**: immutable container/network ownership is persisted through "
              "the Supervisor ownership store so a fresh driver/Supervisor can reconcile a "
              "surviving generation after restart without trusting mutable names.\n"
          )
          if task.count(finding_anchor) != 1:
              raise SystemExit("task finding anchor mismatch")
          task = task.replace(
              finding_anchor,
              finding_anchor
              + "- `RS-FINAL-AUDIT-20260814-01 / MEDIUM` — **REPAIRED IN CODE, FINAL VALIDATION "
              "PENDING**: Supervisor outcomes echo generation ordinal, state-version precondition, "
              "correlation and causation identity; the adapter rejects any one-field mismatch "
              "before trusting returned state/state_version.\n",
          )
          safety_anchor = "\n## Safety\n"
          if task.count(safety_anchor) != 1:
              raise SystemExit("task safety anchor mismatch")
          run_id = os.environ["GITHUB_RUN_ID"]
          task = task.replace(
              safety_anchor,
              f'''\n## Final-audit response-binding repair evidence\n\n- `ai_platform/portal/runtime_supervisor/types.py` extends `SupervisorOutcome` with the authoritative request precondition/causation echo fields while retaining fail-closed compatibility for legacy serialized outcomes.\n- `ai_platform/portal/runtime_supervisor/service.py` emits those fields and includes them, correlation identity and causation identity in `evidence_digest`.\n- `ai_platform/portal/execution/adapter.py` rejects mismatched generation ordinal, expected state version or causation identity before any returned runtime state/version is trusted.\n- `tests/ai_platform/portal/execution/test_adapter.py` now mutates every authoritative identity field one at a time, including the newly repaired fields.\n- `tests/ai_platform/portal/runtime_supervisor/test_outcome_binding.py` proves serialization and digest binding for the new fields.\n- Lifecycle-bounded focused repair workflow run `{run_id}` executes compile, focused tests, Ruff, Ruff format, mypy and `git diff --check` before creating the repair commit, then removes itself from the final tree.\n''' + safety_anchor,
          )

          now = datetime.now(ZoneInfo("Europe/Warsaw")).isoformat(timespec="seconds")
          checkpoint_pattern = re.compile(
              r"## Context checkpoint\n\n```yaml\n.*?\n```\n\n## Recovery checkpoint\n\n```yaml\n.*?\n```\n",
              re.DOTALL,
          )
          checkpoint = f'''## Context checkpoint\n\n```yaml\ncheckpoint_version: 9\nupdated_at: {now}\npre_checkpoint_head: b3d7a271ae00d7ab8873a9c0d6672ca3849cfd49\ncurrent_develop: 15a4b3e02e7e431d04f0b5c6d861a669c4de4743\nbranch: codex/portal-runtime-supervisor-1355\npr: 1496\nstatus: validating\nphase: exact_head_ci_then_fresh_audit\nsession_id: chat-20260814-1418\nsession_role: implementer\nexecution_mode: github_only\npolicy_version: 2\ncontext_pressure: medium\ncontext_growth: stable\ndecomposition_decision: phased\nvalidation_level: focused_repair_complete_exact_head_pending\ninvocation_started_at: 2026-08-14T14:18:00+02:00\nlast_progress_at: {now}\nci_checks_for_current_head: 0\nunchanged_state_checks: 0\nidentical_failure_retries: 0\nrepair_cycles_for_current_gate: 0\ncontext_reconstruction_attempts: 0\nstall_warnings: 0\nproven:\n  - prior durable immutable container/network ownership restart repair remains present\n  - RS-FINAL-AUDIT-20260814-01 response-boundary repair is present in production code\n  - Supervisor outcome carries and evidence-digest binds expected generation ordinal, expected state version, correlation and causation identity\n  - execution adapter rejects one-field-at-a-time authoritative outcome mismatches before trusting state/state_version\n  - bounded workflow run {run_id} performs focused tests, compile, Ruff, Ruff format, mypy and diff-check before commit\n  - task-owned one-shot repair workflow is removed from the intended final tree\nwaiting_on:\n  - terminal required exact-head CI/E2E on the response-binding repair successor\n  - genuinely fresh independent post-repair audit with independent context; this implementing session cannot self-certify that gate\nblockers: []\nnext_action: Verify every required exact-head CI/E2E workflow on the repair successor. If terminal green, verify base freshness, mergeability, zero unresolved threads and temporary-workflow absence, then hand the exact SHA to a genuinely fresh AUDIT ONLY validator; do not merge without PASS_ZERO_MATERIAL_FINDINGS.\n```\n\n## Recovery checkpoint\n\n```yaml\npolicy_version: 1\ngeneration: 4\nsession_id: chat-20260814-1418\nsession_started_at: 2026-08-14T14:18:00+02:00\ncheckpointed_at: {now}\nlast_progress_at: {now}\nphase: exact_head_ci_then_fresh_audit\nexact_head_parent: b3d7a271ae00d7ab8873a9c0d6672ca3849cfd49\npull_request: 1496\nactive_operation: exact_head_ci\nexternal_run_ids:\n  - {run_id}\noperation_started_at: {now}\nwait_deadline_at: null\ncheck_generation: outcome-binding-final-ci-1\nchecks_used: 0\nstatus: waiting\nsafe_to_resume: true\nresume_condition: PR #1496 remains on the same delivery branch and the repair-successor exact SHA is unchanged; inspect terminal workflow outcomes or the first relevant failure.\nnext_action: Verify the repair-successor exact-head workflow matrix and inspect the first relevant failure if any.\n```\n'''
          task, substitutions = checkpoint_pattern.subn(checkpoint, task)
          if substitutions != 1:
              raise SystemExit(f"task checkpoint replacement count: {substitutions}")
          task_path.write_text(task, encoding="utf-8")
          PY

      - name: Compile focused production and tests
        run: >-
          python -m compileall -q
          ai_platform/portal/runtime_supervisor
          ai_platform/portal/execution/adapter.py
          tests/ai_platform/portal/runtime_supervisor
          tests/ai_platform/portal/execution/test_adapter.py

      - name: Run focused response-boundary regressions
        run: >-
          python -m pytest -q -o addopts=''
          --confcutdir=tests/ai_platform
          tests/ai_platform/portal/runtime_supervisor
          tests/ai_platform/portal/execution/test_adapter.py

      - name: Ruff focused repair
        run: >-
          ruff check
          ai_platform/portal/runtime_supervisor/types.py
          ai_platform/portal/runtime_supervisor/service.py
          ai_platform/portal/execution/adapter.py
          tests/ai_platform/portal/runtime_supervisor/test_outcome_binding.py
          tests/ai_platform/portal/execution/test_adapter.py

      - name: Ruff format focused repair
        run: >-
          ruff format --check
          ai_platform/portal/runtime_supervisor/types.py
          ai_platform/portal/runtime_supervisor/service.py
          ai_platform/portal/execution/adapter.py
          tests/ai_platform/portal/runtime_supervisor/test_outcome_binding.py
          tests/ai_platform/portal/execution/test_adapter.py

      - name: Mypy focused repair
        run: >-
          mypy --ignore-missing-imports
          ai_platform/portal/runtime_supervisor/types.py
          ai_platform/portal/runtime_supervisor/service.py
          ai_platform/portal/execution/adapter.py
          tests/ai_platform/portal/runtime_supervisor/test_outcome_binding.py
          tests/ai_platform/portal/execution/test_adapter.py

      - name: Validate diff hygiene
        run: git diff --check

      - name: Remove lifecycle-bounded repair workflow
        run: rm .github/workflows/repair-1496-outcome-binding.yml

      - name: Commit exact repair and self-removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "blakinio"
          git config user.email "75369544+blakinio@users.noreply.github.com"
          git add \
            ai_platform/portal/runtime_supervisor/types.py \
            ai_platform/portal/runtime_supervisor/service.py \
            ai_platform/portal/execution/adapter.py \
            tests/ai_platform/portal/execution/test_adapter.py \
            tests/ai_platform/portal/runtime_supervisor/test_outcome_binding.py \
            docs/agents/tasks/active/FTAI-20260813-portal-runtime-supervisor-audit-repair-1496.md \
            .github/workflows/repair-1496-outcome-binding.yml
          git commit -m "fix(portal): bind supervisor outcomes to request identity"
          git push origin HEAD:codex/portal-runtime-supervisor-1355
