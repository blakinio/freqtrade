name: PR1496 private-read fixture repair

on:
  push:
    branches:
      - codex/portal-runtime-supervisor-1355
    paths:
      - .github/workflows/repair-1496-private-read-fixture.yml

permissions:
  contents: write

concurrency:
  group: repair-1496-private-read-fixture
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/portal-runtime-supervisor-1355
          fetch-depth: 2
          persist-credentials: true # zizmor: ignore[artipacked] - lifecycle-bounded self-removing repair push

      - name: Verify bounded trigger parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "073e1534cd80ddc49455ac3ffd6290da6f4ffd41"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-1496-private-read-fixture.yml"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install bounded test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest "pydantic>=2.2" "SQLAlchemy>=2.0.6" "httpx>=0.24.1"
          fastapi pyjwt cryptography "PyYAML>=6.0" ruff

      - name: Patch stale Supervisor fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/ai_platform/portal/execution/test_private_read.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "            generation_spec_digest=request.generation_spec_digest,\n"
              "            command_id=request.command_id,\n"
              "            correlation_id=request.correlation_id,\n"
              "            state=current,\n"
              "            state_version=max(1, request.expected_state_version),\n"
          )
          new = (
              "            generation_spec_digest=request.generation_spec_digest,\n"
              "            command_id=request.command_id,\n"
              "            correlation_id=request.correlation_id,\n"
              "            expected_generation_ordinal=request.expected_generation_ordinal,\n"
              "            expected_state_version=request.expected_state_version,\n"
              "            causation_id=request.causation_id,\n"
              "            state=current,\n"
              "            state_version=max(1, request.expected_state_version),\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one stale fixture anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Validate focused private-read regressions
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform
          tests/ai_platform/portal/execution/test_private_read.py::test_adapter_read_success_and_submission_remains_fail_closed
          tests/ai_platform/portal/execution/test_private_read.py::test_adapter_missing_collector_and_stopped_runtime_fail_closed
          tests/ai_platform/portal/execution/test_private_read.py::test_adapter_cross_tenant_read_is_denied_before_transport

      - name: Lint fixture and diff
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check tests/ai_platform/portal/execution/test_private_read.py
          git diff --check

      - name: Remove lifecycle-bounded workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-1496-private-read-fixture.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ai_platform/portal/execution/test_private_read.py .github/workflows/repair-1496-private-read-fixture.yml
          git commit -m "test(portal): align private-read supervisor outcome fixture"
          git push origin HEAD:codex/portal-runtime-supervisor-1355
