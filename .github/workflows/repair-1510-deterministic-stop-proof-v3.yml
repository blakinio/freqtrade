name: Repair PR 1510 deterministic stop proof v3

on:
  push:
    branches:
      - fix/wickhunter-1396-observed-generation-reconciliation-20260813
    paths:
      - .github/workflows/repair-1510-deterministic-stop-proof-v3.yml

permissions: {}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync current develop and repair deterministic stop proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop
          git merge --no-edit origin/develop
          python - <<'PY'
          from pathlib import Path

          path = Path('ai_platform/portal/control_plane/runtime_adoption.py')
          text = path.read_text(encoding='utf-8')
          old = '''                latest_previous = session.scalar(\n                    select(RuntimeGenerationObservationRow)\n                    .where(\n                        RuntimeGenerationObservationRow.generation_id\n                        == previous_observed_generation_id\n                    )\n                    .order_by(\n                        RuntimeGenerationObservationRow.reconciled_at.desc(),\n                        RuntimeGenerationObservationRow.observation_id.desc(),\n                    )\n                    .limit(1)\n                )\n                if (\n                    latest_previous is None\n                    or latest_previous.observed_state != BotObservedState.STOPPED.value\n                    or (\n                        _restore_utc(latest_previous.reconciled_at)\n                        or datetime.max.replace(tzinfo=UTC)\n                    )\n                    > observation.reconciled_at\n                ):\n                    raise ControlPlaneConflictError(\n                        "previous runtime STOPPED observation is missing or newer than replacement"\n                    )\n'''
          new = '''                stopped_previous = session.scalar(\n                    select(RuntimeGenerationObservationRow)\n                    .where(\n                        RuntimeGenerationObservationRow.generation_id\n                        == previous_observed_generation_id,\n                        RuntimeGenerationObservationRow.observed_state\n                        == BotObservedState.STOPPED.value,\n                    )\n                    .order_by(\n                        RuntimeGenerationObservationRow.reconciled_at.desc(),\n                        RuntimeGenerationObservationRow.observation_id.desc(),\n                    )\n                    .limit(1)\n                )\n                if (\n                    stopped_previous is None\n                    or (\n                        _restore_utc(stopped_previous.reconciled_at)\n                        or datetime.max.replace(tzinfo=UTC)\n                    )\n                    > observation.reconciled_at\n                ):\n                    raise ControlPlaneConflictError(\n                        "previous runtime STOPPED observation is missing or newer than replacement"\n                    )\n'''
          if text.count(old) != 1:
              raise SystemExit('deterministic STOPPED proof anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py')
          data = test.read_text(encoding='utf-8')
          anchor = '''def test_previous_runtime_stop_proof_rejects_different_runtime_instance(\n'''
          extra = '''def test_replacement_uses_stopped_proof_when_timestamp_ties_running_observation(\n    session_factory: SessionFactory,\n) -> None:\n    _, _, shadow, paper, _, _ = _shadow_then_paper(session_factory)\n\n    stopped = _observation(\n        shadow,\n        runtime_instance_id="sha256:" + "1" * 64,\n        observed_state="STOPPED",\n    ).model_copy(update={"observation_id": "00000000-0000-0000-0000-000000000001"})\n    record_external_runtime_stop_observation(\n        session_factory,\n        _context(admin=True),\n        BOT_ID,\n        stopped,\n    )\n\n    result = reconcile_external_runtime_observation(\n        session_factory,\n        _context(admin=True),\n        BOT_ID,\n        _observation(paper, runtime_instance_id="sha256:" + "2" * 64),\n    )\n\n    assert result.bot.observed_runtime_generation_id == paper.generation_id\n    assert result.generation.managed_mode is BotMode.PAPER\n\n\n'''
          if data.count(anchor) != 1:
              raise SystemExit('deterministic regression test anchor mismatch')
          test.write_text(data.replace(anchor, extra + anchor, 1), encoding='utf-8')
          PY

          python -m pip install --disable-pip-version-check --quiet -e . \
            pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.15.21 mypy==2.1.0
          python -m ruff format \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m ruff check \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m mypy \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py \
            tests/ai_platform/portal/control_plane/test_managed_runtime_mode_semantics.py
          git diff --check

      - name: Commit and push validated repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          git commit -m "fix(portal): make stop proof ordering deterministic"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
