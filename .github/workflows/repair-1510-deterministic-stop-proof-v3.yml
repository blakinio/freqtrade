name: Repair PR 1510 deterministic stop proof v3

on:
  push:
    branches:
      - fix/wickhunter-1396-observed-generation-reconciliation-20260813
    paths:
      - .github/workflows/repair-1510-deterministic-stop-proof-v3.yml

permissions: {}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sync current develop and harden deterministic stop proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin develop
          git merge --no-edit origin/develop
          python - <<'PY'
          from pathlib import Path

          path = Path('ai_platform/portal/control_plane/runtime_adoption.py')
          text = path.read_text(encoding='utf-8')

          old = '''            if (\n                _restore_utc(latest.reconciled_at) or datetime.max.replace(tzinfo=UTC)\n            ) > observation.reconciled_at:\n                raise ControlPlaneConflictError(\n                    "previous runtime stop proof predates the current RUNNING observation"\n                )\n'''
          new = '''            latest_running_at = _restore_utc(latest.reconciled_at)\n            if latest_running_at is None or latest_running_at >= observation.reconciled_at:\n                raise ControlPlaneConflictError(\n                    "previous runtime stop proof must strictly follow the current RUNNING observation"\n                )\n'''
          if text.count(old) != 1:
              raise SystemExit('strict stop ordering anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''                latest_previous = session.scalar(\n                    select(RuntimeGenerationObservationRow)\n                    .where(\n                        RuntimeGenerationObservationRow.generation_id\n                        == previous_observed_generation_id\n                    )\n                    .order_by(\n                        RuntimeGenerationObservationRow.reconciled_at.desc(),\n                        RuntimeGenerationObservationRow.observation_id.desc(),\n                    )\n                    .limit(1)\n                )\n                if (\n                    latest_previous is None\n                    or latest_previous.observed_state != BotObservedState.STOPPED.value\n                    or (\n                        _restore_utc(latest_previous.reconciled_at)\n                        or datetime.max.replace(tzinfo=UTC)\n                    )\n                    > observation.reconciled_at\n                ):\n                    raise ControlPlaneConflictError(\n                        "previous runtime STOPPED observation is missing or newer than replacement"\n                    )\n'''
          new = '''                latest_previous = session.scalar(\n                    select(RuntimeGenerationObservationRow)\n                    .where(\n                        RuntimeGenerationObservationRow.generation_id\n                        == previous_observed_generation_id\n                    )\n                    .order_by(\n                        RuntimeGenerationObservationRow.reconciled_at.desc(),\n                        RuntimeGenerationObservationRow.observation_id.desc(),\n                    )\n                    .limit(1)\n                )\n                latest_previous_running = session.scalar(\n                    select(RuntimeGenerationObservationRow)\n                    .where(\n                        RuntimeGenerationObservationRow.generation_id\n                        == previous_observed_generation_id,\n                        RuntimeGenerationObservationRow.observed_state\n                        == BotObservedState.RUNNING.value,\n                    )\n                    .order_by(\n                        RuntimeGenerationObservationRow.reconciled_at.desc(),\n                        RuntimeGenerationObservationRow.observation_id.desc(),\n                    )\n                    .limit(1)\n                )\n                latest_previous_at = (\n                    _restore_utc(latest_previous.reconciled_at)\n                    if latest_previous is not None\n                    else None\n                )\n                latest_previous_running_at = (\n                    _restore_utc(latest_previous_running.reconciled_at)\n                    if latest_previous_running is not None\n                    else None\n                )\n                if (\n                    latest_previous is None\n                    or latest_previous.observed_state != BotObservedState.STOPPED.value\n                    or latest_previous_at is None\n                    or latest_previous_at >= observation.reconciled_at\n                    or latest_previous_running_at is None\n                    or latest_previous_running_at >= latest_previous_at\n                ):\n                    raise ControlPlaneConflictError(\n                        "previous runtime STOPPED observation is missing, stale, or superseded"\n                    )\n'''
          if text.count(old) != 1:
              raise SystemExit('replacement stop-proof anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py')
          data = test.read_text(encoding='utf-8')
          old = 'from datetime import UTC, datetime\n'
          new = 'from datetime import UTC, datetime, timedelta\n'
          if data.count(old) != 1:
              raise SystemExit('datetime import anchor mismatch')
          data = data.replace(old, new, 1)

          old = '''def _observation(\n    generation,\n    *,\n    runtime_instance_id: str,\n    observed_state: str = "RUNNING",\n) -> RuntimeGenerationObservation:\n'''
          new = '''def _observation(\n    generation,\n    *,\n    runtime_instance_id: str,\n    observed_state: str = "RUNNING",\n    reconciled_at: datetime = NOW,\n) -> RuntimeGenerationObservation:\n'''
          if data.count(old) != 1:
              raise SystemExit('observation helper anchor mismatch')
          data = data.replace(old, new, 1)
          if data.count('        source_observed_at=NOW,\n        reconciled_at=NOW,\n') != 1:
              raise SystemExit('observation timestamps anchor mismatch')
          data = data.replace(
              '        source_observed_at=NOW,\n        reconciled_at=NOW,\n',
              '        source_observed_at=reconciled_at,\n        reconciled_at=reconciled_at,\n',
              1,
          )

          old = '''    paper_observation = _observation(\n        paper,\n        runtime_instance_id="sha256:" + "2" * 64,\n    )\n'''
          new = '''    paper_observation = _observation(\n        paper,\n        runtime_instance_id="sha256:" + "2" * 64,\n        reconciled_at=NOW + timedelta(seconds=2),\n    )\n'''
          if data.count(old) != 1:
              raise SystemExit('paper observation timing anchor mismatch')
          data = data.replace(old, new, 1)

          old = '''    stopped = _observation(\n        shadow,\n        runtime_instance_id="sha256:" + "1" * 64,\n        observed_state="STOPPED",\n    )\n'''
          new = '''    stopped = _observation(\n        shadow,\n        runtime_instance_id="sha256:" + "1" * 64,\n        observed_state="STOPPED",\n        reconciled_at=NOW + timedelta(seconds=1),\n    )\n'''
          if data.count(old) != 1:
              raise SystemExit('stop observation timing anchor mismatch')
          data = data.replace(old, new, 1)

          anchor = '''def test_previous_runtime_stop_proof_rejects_different_runtime_instance(\n'''
          extra = '''def test_previous_runtime_stop_proof_rejects_non_monotonic_timestamp(\n    session_factory: SessionFactory,\n) -> None:\n    _, _, shadow, _, _, _ = _shadow_then_paper(session_factory)\n\n    with pytest.raises(ControlPlaneConflictError, match="strictly follow"):\n        record_external_runtime_stop_observation(\n            session_factory,\n            _context(admin=True),\n            BOT_ID,\n            _observation(\n                shadow,\n                runtime_instance_id="sha256:" + "1" * 64,\n                observed_state="STOPPED",\n                reconciled_at=NOW,\n            ),\n        )\n\n    with session_factory() as session:\n        row = session.get(BotRow, ("tenant-a", BOT_ID))\n        assert row is not None\n        assert row.observed_runtime_generation_id == shadow.generation_id\n        assert row.observed_state == "RUNNING"\n\n\n'''
          if data.count(anchor) != 1:
              raise SystemExit('monotonic regression test anchor mismatch')
          data = data.replace(anchor, extra + anchor, 1)

          old = '''            _observation(\n                shadow,\n                runtime_instance_id="sha256:" + "9" * 64,\n                observed_state="STOPPED",\n            ),\n'''
          new = '''            _observation(\n                shadow,\n                runtime_instance_id="sha256:" + "9" * 64,\n                observed_state="STOPPED",\n                reconciled_at=NOW + timedelta(seconds=1),\n            ),\n'''
          if data.count(old) != 1:
              raise SystemExit('different-instance timing anchor mismatch')
          data = data.replace(old, new, 1)
          test.write_text(data, encoding='utf-8')
          PY

          python -m pip install --disable-pip-version-check --quiet -e . \
            pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.15.21 mypy==2.1.0
          python -m ruff format \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m ruff check \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m mypy \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py \
            tests/ai_platform/portal/control_plane/test_managed_runtime_mode_semantics.py
          git diff --check

      - name: Commit and push validated repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          git commit -m "fix(portal): enforce monotonic previous runtime stop proof"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
