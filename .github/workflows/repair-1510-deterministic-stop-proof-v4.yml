name: Repair PR 1510 deterministic stop proof v4

on:
  push:
    branches:
      - fix/wickhunter-1396-observed-generation-reconciliation-20260813
    paths:
      - .github/workflows/repair-1510-deterministic-stop-proof-v4.yml

permissions: {}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Apply final monotonic stop-proof repair and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin develop
          git merge --no-edit origin/develop
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/repair-1510-deterministic-stop-proof-v3.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, str(workflow), 'exec'), {})

          path = Path('ai_platform/portal/control_plane/runtime_adoption.py')
          product = path.read_text(encoding='utf-8')
          old = '                    "previous runtime stop proof must strictly follow the current RUNNING observation"\n'
          new = (
              '                    "previous runtime stop proof must strictly follow "\n'
              '                    "the current RUNNING observation"\n'
          )
          if product.count(old) != 1:
              raise SystemExit('Ruff message anchor mismatch')
          path.write_text(product.replace(old, new, 1), encoding='utf-8')
          PY

          python -m pip install --disable-pip-version-check --quiet -e . \
            pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.15.21 mypy==2.1.0
          python -m ruff format \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m ruff check \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m mypy \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py \
            tests/ai_platform/portal/control_plane/test_managed_runtime_mode_semantics.py
          git diff --check

      - name: Commit and push validated product repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          git commit -m "fix(portal): enforce monotonic previous runtime stop proof"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
