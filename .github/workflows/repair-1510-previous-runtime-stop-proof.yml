name: Repair PR 1510 previous runtime stop proof

on:
  push:
    branches:
      - fix/wickhunter-1396-observed-generation-reconciliation-20260813
    paths:
      - .github/workflows/repair-1510-previous-runtime-stop-proof.yml

permissions: {}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Apply fail-closed previous-runtime stop proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/portal/control_plane/runtime_adoption.py")
          text = path.read_text(encoding="utf-8")

          old = '''from ai_platform.portal.contracts.runtime_generation import (\n    ReconciliationCompletenessStatus,\n'''
          new = '''from ai_platform.portal.contracts.runtime_generation import (\n    BotRolloutStatus,\n    ReconciliationCompletenessStatus,\n'''
          if text.count(old) != 1:
              raise SystemExit("runtime_generation import anchor mismatch")
          text = text.replace(old, new, 1)

          old = '''EXTERNAL_ADOPTION_REASON = "EXTERNAL_RUNTIME_ADOPTED"\n_PENDING_ADOPTION_ROLLOUT_STATES = {\n    "REQUESTED",\n    "PRECHECK",\n    "PROVISIONING",\n    "STARTING",\n    "VERIFYING",\n}\n'''
          new = '''EXTERNAL_ADOPTION_REASON = "EXTERNAL_RUNTIME_ADOPTED"\nEXTERNAL_STOP_REASON = "EXTERNAL_PREVIOUS_RUNTIME_STOPPED"\n_PREVIOUS_STOP_ATTESTATION_ROLLOUT_STATES = {\n    BotRolloutStatus.REQUESTED.value,\n    BotRolloutStatus.PRECHECK.value,\n    BotRolloutStatus.STOPPING_PREVIOUS.value,\n}\n_PENDING_ADOPTION_ROLLOUT_STATES = {\n    BotRolloutStatus.REQUESTED.value,\n    BotRolloutStatus.PRECHECK.value,\n    BotRolloutStatus.PREVIOUS_STOPPED.value,\n    BotRolloutStatus.PROVISIONING.value,\n    BotRolloutStatus.STARTING.value,\n    BotRolloutStatus.VERIFYING.value,\n}\n'''
          if text.count(old) != 1:
              raise SystemExit("rollout constants anchor mismatch")
          text = text.replace(old, new, 1)

          old = '''def _validate_exact_observation(\n    *, generation: RuntimeGeneration, observation: RuntimeGenerationObservation\n) -> BotObservedState:\n'''
          new = '''def _validate_exact_observation(\n    *,\n    generation: RuntimeGeneration,\n    observation: RuntimeGenerationObservation,\n    required_state: BotObservedState = BotObservedState.RUNNING,\n) -> BotObservedState:\n'''
          if text.count(old) != 1:
              raise SystemExit("observation validator signature anchor mismatch")
          text = text.replace(old, new, 1)

          old = '''    if observed_state is not BotObservedState.RUNNING:\n        raise ControlPlaneConflictError("external runtime adoption requires RUNNING observation")\n    return observed_state\n'''
          new = '''    if observed_state is not required_state:\n        raise ControlPlaneConflictError(\n            f"external runtime reconciliation requires {required_state.value} observation"\n        )\n    return observed_state\n'''
          if text.count(old) != 1:
              raise SystemExit("observation state anchor mismatch")
          text = text.replace(old, new, 1)

          anchor = '''    def adopt_external_runtime(  # noqa: C901 - explicit fail-closed checks stay visible\n'''
          if text.count(anchor) != 1:
              raise SystemExit("adopt method anchor mismatch")
          method = '''    def record_previous_runtime_stopped(  # noqa: C901 - fail-closed proof checks stay visible\n        self,\n        context: RequestContext,\n        bot_id: str,\n        observation: RuntimeGenerationObservation,\n    ) -> RuntimeGenerationObservation:\n        """Record exact host proof that the currently observed runtime stopped.\n\n        The observed generation pointer intentionally remains on the previous generation.\n        This operation only records STOPPED truth and advances the canonical replacement\n        rollout to PREVIOUS_STOPPED. A later exact RUNNING observation for the desired\n        generation is still required before Portal may move the observed pointer.\n        """\n\n        require_permission(context.permissions, Permission.ADMIN_MANAGE)\n\n        with self._session_factory() as session, session.begin():\n            bot = self._repository.get_bot(session, context.tenant_id, bot_id)\n            if bot is None:\n                raise BotNotFoundError("bot not found")\n            if bot.observed_runtime_generation_id != observation.generation_id:\n                raise ControlPlaneConflictError(\n                    "stop observation must target the current observed RuntimeGeneration"\n                )\n            if (\n                bot.desired_runtime_generation_id is None\n                or bot.desired_runtime_generation_id == observation.generation_id\n            ):\n                raise ControlPlaneConflictError(\n                    "previous-runtime stop proof requires a different desired RuntimeGeneration"\n                )\n            generation = self._repository.get_runtime_generation(\n                session, context.tenant_id, observation.generation_id\n            )\n            if generation is None or generation.bot_id != bot_id:\n                raise ControlPlaneConflictError("runtime generation does not belong to bot")\n            _validate_exact_observation(\n                generation=generation,\n                observation=observation,\n                required_state=BotObservedState.STOPPED,\n            )\n\n            existing = session.get(RuntimeGenerationObservationRow, observation.observation_id)\n            if existing is not None:\n                persisted = _observation_from_row(existing)\n                if persisted != observation:\n                    raise ControlPlaneConflictError(\n                        "runtime observation id already has different immutable evidence"\n                    )\n                row = session.get(BotRow, (context.tenant_id, bot_id))\n                if (\n                    row is None\n                    or row.observed_runtime_generation_id != generation.generation_id\n                    or row.observed_state != BotObservedState.STOPPED.value\n                ):\n                    raise ControlPlaneConflictError(\n                        "persisted stop observation does not match current observed runtime state"\n                    )\n                return persisted\n\n            latest = session.scalar(\n                select(RuntimeGenerationObservationRow)\n                .where(RuntimeGenerationObservationRow.generation_id == generation.generation_id)\n                .order_by(\n                    RuntimeGenerationObservationRow.reconciled_at.desc(),\n                    RuntimeGenerationObservationRow.observation_id.desc(),\n                )\n                .limit(1)\n            )\n            if latest is None or latest.observed_state != BotObservedState.RUNNING.value:\n                raise ControlPlaneConflictError(\n                    "previous runtime stop proof requires a prior RUNNING observation"\n                )\n            if latest.runtime_instance_id != observation.runtime_instance_id:\n                raise ControlPlaneConflictError(\n                    "previous runtime stop proof does not match the observed runtime instance"\n                )\n            if latest.reconciled_at > observation.reconciled_at:\n                raise ControlPlaneConflictError(\n                    "previous runtime stop proof predates the current RUNNING observation"\n                )\n\n            rollout = session.scalar(\n                select(BotRolloutRow)\n                .where(\n                    BotRolloutRow.tenant_id == context.tenant_id,\n                    BotRolloutRow.bot_id == bot_id,\n                    BotRolloutRow.to_generation_id == bot.desired_runtime_generation_id,\n                )\n                .order_by(BotRolloutRow.updated_at.desc(), BotRolloutRow.rollout_id.desc())\n                .limit(1)\n            )\n            if rollout is None:\n                raise ControlPlaneConflictError(\n                    "previous runtime stop proof requires a canonical replacement rollout"\n                )\n            if rollout.from_generation_id != generation.generation_id:\n                raise ControlPlaneConflictError(\n                    "replacement rollout does not start from the stopped RuntimeGeneration"\n                )\n            if rollout.status not in _PREVIOUS_STOP_ATTESTATION_ROLLOUT_STATES:\n                raise ControlPlaneConflictError(\n                    "rollout state does not permit previous runtime stop attestation"\n                )\n\n            _add_observation(session, observation)\n            row = session.get(BotRow, (context.tenant_id, bot_id))\n            if row is None:\n                raise BotNotFoundError("bot not found")\n            row.observed_state = BotObservedState.STOPPED.value\n            row.state_version = (row.state_version or 0) + 1\n            rollout.status = BotRolloutStatus.PREVIOUS_STOPPED.value\n            rollout.reason_code = EXTERNAL_STOP_REASON\n            rollout.updated_at = observation.reconciled_at\n\n            self._repository.add_audit_event(\n                session,\n                AuditEvent(\n                    audit_id=uuid4(),\n                    occurred_at=observation.reconciled_at,\n                    actor_type=context.actor_type,\n                    actor_id=context.actor_id,\n                    tenant_id=context.tenant_id,\n                    resource_type="bot",\n                    resource_id=bot_id,\n                    action=AuditAction.BOT_STOPPED,\n                    result=AuditResult.SUCCEEDED,\n                    request_id=context.request_id,\n                    correlation_id=context.correlation_id,\n                    causation_id=context.causation_id,\n                    reason_code=EXTERNAL_STOP_REASON,\n                    details={\n                        "generation_id": generation.generation_id,\n                        "runtime_instance_id": observation.runtime_instance_id,\n                        "observation_id": observation.observation_id,\n                        "evidence_hash": observation.evidence_hash,\n                        "desired_generation_id": bot.desired_runtime_generation_id,\n                    },\n                ),\n            )\n            session.flush()\n\n        return observation\n\n'''
          text = text.replace(anchor, method + anchor, 1)

          old = '''                if previous_generation is None or previous_generation.bot_id != bot_id:\n                    raise ControlPlaneConflictError(\n                        "current observed RuntimeGeneration does not belong to bot"\n                    )\n            if rollout.status == "SUCCEEDED":\n'''
          new = '''                if previous_generation is None or previous_generation.bot_id != bot_id:\n                    raise ControlPlaneConflictError(\n                        "current observed RuntimeGeneration does not belong to bot"\n                    )\n                if rollout.status != BotRolloutStatus.PREVIOUS_STOPPED.value:\n                    raise ControlPlaneConflictError(\n                        "previous runtime stop evidence is required before replacement adoption"\n                    )\n                latest_previous = session.scalar(\n                    select(RuntimeGenerationObservationRow)\n                    .where(\n                        RuntimeGenerationObservationRow.generation_id\n                        == previous_observed_generation_id\n                    )\n                    .order_by(\n                        RuntimeGenerationObservationRow.reconciled_at.desc(),\n                        RuntimeGenerationObservationRow.observation_id.desc(),\n                    )\n                    .limit(1)\n                )\n                if (\n                    latest_previous is None\n                    or latest_previous.observed_state != BotObservedState.STOPPED.value\n                    or latest_previous.reconciled_at > observation.reconciled_at\n                ):\n                    raise ControlPlaneConflictError(\n                        "previous runtime STOPPED observation is missing or newer than replacement"\n                    )\n            if rollout.status == "SUCCEEDED":\n'''
          if text.count(old) != 1:
              raise SystemExit("replacement validation anchor mismatch")
          text = text.replace(old, new, 1)

          old = '''def reconcile_external_runtime_observation(\n    session_factory: SessionFactory,\n'''
          wrapper = '''def record_external_runtime_stop_observation(\n    session_factory: SessionFactory,\n    context: RequestContext,\n    bot_id: str,\n    observation: RuntimeGenerationObservation,\n) -> RuntimeGenerationObservation:\n    return RuntimeAdoptionService(session_factory).record_previous_runtime_stopped(\n        context,\n        bot_id,\n        observation,\n    )\n\n\n'''
          if text.count(old) != 1:
              raise SystemExit("wrapper anchor mismatch")
          text = text.replace(old, wrapper + old, 1)
          path.write_text(text, encoding="utf-8")

          test = Path("tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py")
          data = test.read_text(encoding="utf-8")
          old = '''from ai_platform.portal.control_plane.runtime_adoption import (\n    latest_runtime_observation,\n    reconcile_external_runtime_observation,\n)\n'''
          new = '''from ai_platform.portal.control_plane.runtime_adoption import (\n    latest_runtime_observation,\n    reconcile_external_runtime_observation,\n    record_external_runtime_stop_observation,\n)\n'''
          if data.count(old) != 1:
              raise SystemExit("test import anchor mismatch")
          data = data.replace(old, new, 1)

          old = '''def _observation(generation, *, runtime_instance_id: str) -> RuntimeGenerationObservation:\n    return RuntimeGenerationObservation(\n        observation_id=str(uuid4()),\n'''
          new = '''def _observation(\n    generation,\n    *,\n    runtime_instance_id: str,\n    observed_state: str = "RUNNING",\n) -> RuntimeGenerationObservation:\n    return RuntimeGenerationObservation(\n        observation_id=str(uuid4()),\n'''
          if data.count(old) != 1:
              raise SystemExit("test observation signature anchor mismatch")
          data = data.replace(old, new, 1)
          old = '''        observed_state="RUNNING",\n'''
          if data.count(old) != 1:
              raise SystemExit("test observed state anchor mismatch")
          data = data.replace(old, '''        observed_state=observed_state,\n''', 1)

          old = '''    paper_observation = _observation(\n        paper,\n        runtime_instance_id="sha256:" + "2" * 64,\n    )\n    result = reconcile_external_runtime_observation(\n        session_factory,\n        _context(admin=True),\n        BOT_ID,\n        paper_observation,\n    )\n'''
          new = '''    paper_observation = _observation(\n        paper,\n        runtime_instance_id="sha256:" + "2" * 64,\n    )\n    with pytest.raises(ControlPlaneConflictError, match="stop evidence is required"):\n        reconcile_external_runtime_observation(\n            session_factory,\n            _context(admin=True),\n            BOT_ID,\n            paper_observation,\n        )\n\n    stopped = _observation(\n        shadow,\n        runtime_instance_id="sha256:" + "1" * 64,\n        observed_state="STOPPED",\n    )\n    recorded = record_external_runtime_stop_observation(\n        session_factory,\n        _context(admin=True),\n        BOT_ID,\n        stopped,\n    )\n    assert recorded == stopped\n    with session_factory() as session:\n        stopped_bot = session.get(BotRow, ("tenant-a", BOT_ID))\n        stopped_rollout = session.get(BotRolloutRow, rollout.rollout_id)\n        assert stopped_bot is not None\n        assert stopped_rollout is not None\n        assert stopped_bot.observed_runtime_generation_id == shadow.generation_id\n        assert stopped_bot.observed_state == "STOPPED"\n        assert stopped_rollout.status == "PREVIOUS_STOPPED"\n\n    result = reconcile_external_runtime_observation(\n        session_factory,\n        _context(admin=True),\n        BOT_ID,\n        paper_observation,\n    )\n'''
          if data.count(old) != 1:
              raise SystemExit("replacement success anchor mismatch")
          data = data.replace(old, new, 1)

          insert_anchor = '''def test_external_runtime_replacement_fails_closed_on_wrong_rollout_lineage(\n'''
          extra = '''def test_previous_runtime_stop_proof_rejects_different_runtime_instance(\n    session_factory: SessionFactory,\n) -> None:\n    _, _, shadow, _, _, _ = _shadow_then_paper(session_factory)\n\n    with pytest.raises(ControlPlaneConflictError, match="does not match"):\n        record_external_runtime_stop_observation(\n            session_factory,\n            _context(admin=True),\n            BOT_ID,\n            _observation(\n                shadow,\n                runtime_instance_id="sha256:" + "9" * 64,\n                observed_state="STOPPED",\n            ),\n        )\n\n    with session_factory() as session:\n        row = session.get(BotRow, ("tenant-a", BOT_ID))\n        assert row is not None\n        assert row.observed_runtime_generation_id == shadow.generation_id\n        assert row.observed_state == "RUNNING"\n\n\n'''
          if data.count(insert_anchor) != 1:
              raise SystemExit("test insertion anchor mismatch")
          data = data.replace(insert_anchor, extra + insert_anchor, 1)
          test.write_text(data, encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check --quiet -e . \
            pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.15.21 mypy==2.1.0
          python -m ruff format \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m ruff check \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m mypy \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/control_plane/test_runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py \
            tests/ai_platform/portal/control_plane/test_managed_runtime_mode_semantics.py
          git diff --check

      - name: Commit validated product repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/portal/control_plane/runtime_adoption.py \
            tests/ai_platform/portal/control_plane/test_runtime_adoption_replacement.py
          git commit -m "fix(portal): require previous runtime stop proof"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
