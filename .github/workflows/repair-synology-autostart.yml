name: Repair Synology Autostart

"on":
  push:
    branches:
      - develop
    paths:
      - .github/workflows/repair-synology-autostart.yml
      - deploy/synology/freqtrade-runner/compose.yml
      - deploy/synology/liquid20/compose.yaml
      - deploy/synology/portal/deploy-preview.sh
      - deploy/synology/portal/probe-liquidations-live-operational.sh
      - deploy/synology/portal/prove-liquidations-live.sh
      - deploy/synology/portal-oidc/upgrade-wh09-observer-v10.sh
      - deploy/synology/wickhunter-production-research-runtime/compose.yaml
  workflow_dispatch:

permissions: {}

env:
  WH09_COMPOSE_PROJECT: wickhunter-production-research-runtime
  WH09_COMPOSE_SERVICE: wickhunter-production-research-runtime
  WH09_EXPECTED_REVISION: 1af35b4ccef6bbd06c771603a80760c342d334aa
  WH09_EXPECTED_USER: "65531:65531"
  WH09_OBSERVER_CONTAINER: portal-wh09-runtime-observer
  WH09_OBSERVER_EXPECTED_REVISION: eafc198857c90caf89a5920da60ae7661c1061ba
  SYFT_VERSION: "1.50.0"
  SYFT_LINUX_AMD64_SHA256: "bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788"
  GRYPE_VERSION: "0.116.1"
  GRYPE_LINUX_AMD64_SHA256: "0122df7b655981abe547ad3d2190d65551dac6a2bfc80b4dc2a989b5d0587458"

concurrency:
  group: freqtrade-synology-autostart-repair
  cancel-in-progress: false

jobs:
  build-wh09-observer-image:
    name: Build, scan and publish exact WH09 observer image
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    outputs:
      control_ref: ${{ steps.publish.outputs.control_ref }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install checksum-pinned Syft and Grype
        shell: bash
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/portal-tools"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/syft.tar.gz"
          echo "${SYFT_LINUX_AMD64_SHA256}  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/syft.tar.gz" \
            --directory "$RUNNER_TEMP/portal-tools" syft
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/grype.tar.gz"
          echo "${GRYPE_LINUX_AMD64_SHA256}  $RUNNER_TEMP/grype.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/grype.tar.gz" \
            --directory "$RUNNER_TEMP/portal-tools" grype
          echo "$RUNNER_TEMP/portal-tools" >> "$GITHUB_PATH"

      - name: Build, scan and approve exact Portal images
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/portal-wh09-observer-supply-chain
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python3 tools/agents/portal_supply_chain.py build-verify \
            --repository "$GITHUB_WORKSPACE" \
            --source-sha "$GITHUB_SHA" \
            --output-dir "$EVIDENCE_DIR" \
            --approval "$EVIDENCE_DIR/approval.json"
          python3 tools/agents/portal_supply_chain.py verify-approval \
            --approval "$EVIDENCE_DIR/approval.json" \
            --expected-source-sha "$GITHUB_SHA"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish immutable control-plane image for observer-only delivery
        id: publish
        shell: bash
        env:
          APPROVAL_PATH: ${{ runner.temp }}/portal-wh09-observer-supply-chain/approval.json
        run: |
          set -euo pipefail
          control_id="$(python3 - "$APPROVAL_PATH" <<'PY'
          import json
          import pathlib
          import sys

          approval = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(approval["images"]["control-plane"]["digest"])
          PY
          )"
          [[ "$control_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          control_repo="ghcr.io/blakinio/freqtrade-portal-control-plane"
          control_tag="${control_repo}:wh09-observer-v10-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          docker tag "$control_id" "$control_tag"
          docker push "$control_tag"
          docker pull "$control_tag" >/dev/null
          [[ "$(docker image inspect --format '{{.Id}}' "$control_tag")" == "$control_id" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$control_tag")" == "$GITHUB_SHA" ]]
          control_ref="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$control_tag" \
            | grep -E "^${control_repo}@sha256:[0-9a-f]{64}$" | head -n 1)"
          [[ -n "$control_ref" ]]
          printf 'control_ref=%s\n' "$control_ref" >> "$GITHUB_OUTPUT"
          echo "WH09_OBSERVER_HOSTED_IMAGE_PASS ref=${control_ref} revision=${GITHUB_SHA}"

  repair:
    name: Enforce Docker restart policies and portal health
    needs: build-wh09-observer-image
    runs-on: freqtrade-staging
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Materialize exact hosted-built observer image
        shell: bash
        env:
          CONTROL_REF: ${{ needs.build-wh09-observer-image.outputs.control_ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$CONTROL_REF" =~ ^ghcr\.io/blakinio/freqtrade-portal-control-plane@sha256:[0-9a-f]{64}$ ]]
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$CONTROL_REF" >/dev/null
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$CONTROL_REF")" == "$GITHUB_SHA" ]]
          echo "WH09_OBSERVER_IMAGE_REF=$CONTROL_REF" >> "$GITHUB_ENV"

      - name: Recover persistent Portal Authentik and WickHunter evidence services
        shell: bash
        run: |
          set -Eeuo pipefail

          resolve_compose_service() {
            local project="$1"
            local service="$2"
            local -a matches=()
            mapfile -t matches < <(
              docker ps -aq \
                --filter "label=com.docker.compose.project=${project}" \
                --filter "label=com.docker.compose.service=${service}"
            )
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one ${project}/${service} container, found ${#matches[@]}" >&2
              return 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          resolve_named_container() {
            local name="$1"
            local container
            if ! container="$(docker inspect --format '{{.Id}}' "$name" 2>/dev/null)"; then
              echo "Required container is missing: ${name}" >&2
              return 1
            fi
            printf '%s\n' "$container"
          }

          wait_running_healthy() {
            local container="$1"
            local attempts="${2:-60}"
            local name running health
            name="$(docker inspect --format '{{.Name}}' "$container" | sed 's#^/##')"
            for _ in $(seq 1 "$attempts"); do
              running="$(docker inspect --format '{{.State.Running}}' "$container" 2>/dev/null || true)"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              if [[ "$running" == "true" && ( "$health" == "healthy" || "$health" == "running" ) ]]; then
                printf '%s running=%s health=%s\n' "$name" "$running" "$health"
                return 0
              fi
              sleep 2
            done
            echo "${name}: did not become running and healthy" >&2
            docker inspect "$container" >&2 || true
            docker logs --tail 120 "$container" >&2 || true
            return 1
          }

          runner="$(resolve_compose_service freqtrade-deploy-runner runner)"
          authentik_postgresql="$(resolve_compose_service portal-authentik-local-test postgresql)"
          authentik_server="$(resolve_compose_service portal-authentik-local-test server)"
          authentik_worker="$(resolve_compose_service portal-authentik-local-test worker)"
          liquid20="$(resolve_named_container liquid20-live)"
          portal_postgresql="$(resolve_named_container freqtrade-portal-postgresql)"
          portal_control="$(resolve_named_container freqtrade-portal-control-plane)"
          portal_web="$(resolve_named_container freqtrade-portal-staging)"
          wh09_runtime="$(resolve_compose_service "$WH09_COMPOSE_PROJECT" "$WH09_COMPOSE_SERVICE")"
          wh09_observer="$(resolve_named_container "$WH09_OBSERVER_CONTAINER")"

          declare -a persistent_containers=(
            "$runner"
            "$liquid20"
            "$authentik_postgresql"
            "$authentik_server"
            "$authentik_worker"
            "$portal_postgresql"
            "$portal_control"
            "$portal_web"
          )
          docker update --restart=always "${persistent_containers[@]}" >/dev/null

          wh09_revision="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$wh09_runtime")"
          wh09_user="$(docker inspect --format '{{.Config.User}}' "$wh09_runtime")"
          wh09_policy="$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$wh09_runtime")"
          wh09_read_only="$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$wh09_runtime")"
          wh09_privileged="$(docker inspect --format '{{.HostConfig.Privileged}}' "$wh09_runtime")"
          [[ "$wh09_revision" == "$WH09_EXPECTED_REVISION" ]]
          [[ "$wh09_user" == "$WH09_EXPECTED_USER" ]]
          [[ "$wh09_policy" == "unless-stopped" ]]
          [[ "$wh09_read_only" == "true" && "$wh09_privileged" == "false" ]]

          observer_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$(docker inspect --format '{{.Image}}' "$wh09_observer")")"
          observer_policy="$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$wh09_observer")"
          observer_read_only="$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$wh09_observer")"
          observer_privileged="$(docker inspect --format '{{.HostConfig.Privileged}}' "$wh09_observer")"
          observer_ports="$(docker port "$wh09_observer")"
          [[ "$observer_revision" == "$WH09_OBSERVER_EXPECTED_REVISION" ]]
          [[ "$observer_policy" == "unless-stopped" ]]
          [[ "$observer_read_only" == "true" && "$observer_privileged" == "false" ]]
          [[ -z "$observer_ports" ]]

          docker start "$runner" "$liquid20" "$authentik_postgresql" "$portal_postgresql" >/dev/null
          wait_running_healthy "$authentik_postgresql"
          wait_running_healthy "$portal_postgresql"

          if [[ "$(docker inspect --format '{{.State.Running}}' "$wh09_runtime")" != "true" ]]; then
            docker start "$wh09_runtime" >/dev/null
          fi
          wait_running_healthy "$wh09_runtime" 240
          docker exec -i "$wh09_runtime" python - <<'PY'
          import json
          import time
          from pathlib import Path

          health = json.loads(Path('/runtime/operator/health.json').read_text(encoding='utf-8'))
          telemetry = json.loads(Path('/runtime/journal/telemetry.json').read_text(encoding='utf-8'))
          zero_authority = {
              'trading_credentials_present': False,
              'order_adapter_present': False,
              'execution_enabled': False,
              'orders_submitted': 0,
              'live_capital_authorized': False,
          }
          for label, payload in (('health', health), ('telemetry', telemetry)):
              if not isinstance(payload, dict):
                  raise SystemExit(f'{label} payload is not an object')
              for key, expected in zero_authority.items():
                  if payload.get(key) != expected:
                      raise SystemExit(f'{label} zero-authority mismatch: {key}')
          if health.get('status') != 'healthy':
              raise SystemExit('WH09 health payload is not healthy')
          if int(telemetry.get('decision_count', 0)) <= 0:
              raise SystemExit('WH09 telemetry has no decisions')
          checked_at_ms = int(telemetry.get('checked_at_ms', 0))
          health_checked_at_ms = int(health.get('checked_at_ms', 0))
          now_ms = int(time.time() * 1000)
          if checked_at_ms <= 0 or health_checked_at_ms < checked_at_ms:
              raise SystemExit('WH09 evidence timestamps are invalid')
          if now_ms - checked_at_ms > 600_000:
              raise SystemExit('WH09 telemetry is stale after recovery')
          print('WH09_ZERO_AUTHORITY_FRESH_EVIDENCE_PASS')
          PY

          docker start "$authentik_server" "$authentik_worker" "$portal_control" >/dev/null
          wait_running_healthy "$authentik_server"
          wait_running_healthy "$authentik_worker"
          wait_running_healthy "$portal_control"

          if [[ "$(docker inspect --format '{{.State.Running}}' "$wh09_observer")" != "true" ]]; then
            docker start "$wh09_observer" >/dev/null
          fi
          wait_running_healthy "$wh09_observer"

          bash deploy/synology/portal-oidc/upgrade-wh09-observer-v10.sh \
            "$WH09_OBSERVER_CONTAINER" \
            "$GITHUB_SHA" \
            "$WH09_OBSERVER_EXPECTED_REVISION" \
            "65531" \
            "$WH09_OBSERVER_IMAGE_REF"
          wh09_observer="$(resolve_named_container "$WH09_OBSERVER_CONTAINER")"

          docker exec -i "$wh09_observer" python - <<'PY'
          from pathlib import Path

          from ai_platform.portal.control_plane.wh09_runtime import Wh09RuntimeEvidenceError
          from ai_platform.portal.control_plane.wh09_runtime_observer_reader import (
              Wh09ObserverRuntimeEvidenceReader,
          )

          try:
              evidence = Wh09ObserverRuntimeEvidenceReader(Path('/runtime')).read()
          except Wh09RuntimeEvidenceError as exc:
              raise SystemExit(f'WH09 observer full evidence failed: {exc}') from exc
          if evidence.health != 'HEALTHY':
              raise SystemExit(f'WH09 observer full evidence health={evidence.health}')
          if evidence.decision_count <= 0 or evidence.no_trade_count <= 0:
              raise SystemExit('WH09 observer full evidence has no decision truth')
          if (
              evidence.trading_credentials_present is not False
              or evidence.order_adapter_present is not False
              or evidence.execution_enabled is not False
              or evidence.orders_submitted != 0
              or evidence.live_capital_authorized is not False
          ):
              raise SystemExit('WH09 observer full evidence changed zero-authority invariants')
          print('WH09_OBSERVER_FULL_EVIDENCE_PASS')
          PY

          docker exec -i "$portal_control" python - <<'PY'
          from uuid import uuid4

          from fastapi.testclient import TestClient

          from ai_platform.portal.contracts.identity import ActorType, Permission
          from ai_platform.portal.control_plane.api import create_app
          from ai_platform.portal.control_plane.context import RequestContext
          from ai_platform.portal.control_plane.database import build_engine, build_session_factory
          from ai_platform.portal.control_plane.wh09_runtime import (
              Wh09RuntimeEvidenceError,
              Wh09RuntimeEvidenceHttpClient,
              configured_wh09_source,
          )

          source = configured_wh09_source()
          if not isinstance(source, Wh09RuntimeEvidenceHttpClient):
              raise SystemExit(f'WH09 control-plane source is not private observer HTTP: {type(source).__name__}')
          try:
              evidence = source.read()
          except Wh09RuntimeEvidenceError as exc:
              raise SystemExit(f'WH09 control-plane observer read failed: {exc}') from exc
          if evidence.health != 'HEALTHY':
              raise SystemExit(f'WH09 control-plane observer health={evidence.health}')
          print('WH09_CONTROL_TO_OBSERVER_PASS')

          context = RequestContext(
              tenant_id='tenant-local',
              actor_id='system-wh09-autostart-recovery',
              actor_type=ActorType.SYSTEM,
              permissions=(Permission.BOT_READ, Permission.AUDIT_READ),
              request_id=uuid4(),
              correlation_id=uuid4(),
              causation_id=None,
          )
          engine = build_engine()
          try:
              factory = build_session_factory(engine)
              client = TestClient(create_app(factory, identity_context_provider=lambda: context))
              response = client.get('/v1/bots/wickhunter/wickhunter-runtime-evidence')
              if response.status_code != 200:
                  try:
                      detail = response.json().get('detail')
                  except ValueError:
                      detail = response.text[:240]
                  raise SystemExit(
                      f'WH09 Portal runtime evidence endpoint failed: status={response.status_code} detail={detail}'
                  )
              payload = response.json()
              runtime = payload.get('runtime') or {}
              if (
                  runtime.get('trading_credentials_present') is not False
                  or runtime.get('order_adapter_present') is not False
                  or runtime.get('execution_enabled') is not False
                  or runtime.get('orders_submitted') != 0
                  or runtime.get('live_capital_authorized') is not False
              ):
                  raise SystemExit('WH09 Portal runtime evidence changed zero-authority invariants')
              print('WH09_PORTAL_RUNTIME_EVIDENCE_PASS')
          finally:
              engine.dispose()
          PY

          docker start "$portal_web" >/dev/null
          wait_running_healthy "$portal_web"

          for container in "${persistent_containers[@]}"; do
            policy="$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$container")"
            running="$(docker inspect --format '{{.State.Running}}' "$container")"
            name="$(docker inspect --format '{{.Name}}' "$container")"
            [[ "$policy" == "always" && "$running" == "true" ]]
            printf '%s policy=%s running=%s\n' "$name" "$policy" "$running"
          done

          [[ "$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$wh09_runtime")" == "unless-stopped" ]]
          [[ "$(docker inspect --format '{{.State.Running}}' "$wh09_runtime")" == "true" ]]
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$wh09_runtime")" == "healthy" ]]
          [[ "$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$wh09_observer")" == "unless-stopped" ]]
          [[ "$(docker inspect --format '{{.State.Running}}' "$wh09_observer")" == "true" ]]
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$wh09_observer")" == "healthy" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$(docker inspect --format '{{.Image}}' "$wh09_observer")")" == "$GITHUB_SHA" ]]

      - name: Recover an unresponsive portal once
        shell: bash
        env:
          PORTAL_LIVE_PROOF_REPORT_PATH: ${{ runner.temp }}/liquidations-portal-operational-repair.json
          PORTAL_OPERATIONAL_PROBE_TIMEOUT_SECONDS: "10"
        run: |
          set -Eeuo pipefail
          probe_script=deploy/synology/portal/probe-liquidations-live-operational.sh

          if bash "$probe_script"; then
            echo "Portal operational boundary is already healthy."
            exit 0
          fi

          echo "Portal operational boundary failed; restarting the existing portal container once."
          docker restart --time 20 freqtrade-portal-staging >/dev/null

          for _ in $(seq 1 12); do
            running="$(docker inspect --format '{{.State.Running}}' freqtrade-portal-staging 2>/dev/null || true)"
            if [[ "$running" == "true" ]] && bash "$probe_script"; then
              echo "Portal recovered after the bounded restart."
              exit 0
            fi
            sleep 5
          done

          docker inspect freqtrade-portal-staging >&2 || true
          docker logs --tail 160 freqtrade-portal-staging >&2 || true
          echo "Portal remained unhealthy after one bounded restart." >&2
          exit 1
