name: Repository Lifecycle Approval Auto-Merge

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/repository-lifecycle-approval-automerge.yml"
      - ".github/workflows/repository-lifecycle-approval-proposal.yml"
      - "docs/agents/tasks/active/FTAI-20260815-repository-lifecycle-hygiene.md"
      - "docs/agents/REPOSITORY_LIFECYCLE_POLICY.json"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: repository-lifecycle-approval-automerge
  cancel-in-progress: false

jobs:
  arm-auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false

      - name: Detect applicability
        id: gate
        shell: bash
        run: |
          if [[ ! -f docs/agents/tasks/active/FTAI-20260815-repository-lifecycle-hygiene.md ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Lifecycle task is no longer active; auto-merge helper is NOT_APPLICABLE."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Arm auto-merge for the exact approval PR
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PR_URL=""
          for _ in $(seq 1 18); do
            PR_URL="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base develop \
              --head governance/repository-lifecycle-approval-1559 \
              --json url \
              --jq '.[0].url // empty')"
            if [[ -n "$PR_URL" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$PR_URL" ]]; then
            echo "Approval PR was not created within the bounded observation window."
            exit 1
          fi
          gh pr merge \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            "$PR_URL"
