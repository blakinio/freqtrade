name: Repository Lifecycle One-shot Format Fix

on:
  push:
    branches:
      - governance/repository-lifecycle-hygiene-1559

permissions:
  contents: write

concurrency:
  group: repository-lifecycle-format-fix
  cancel-in-progress: true

jobs:
  format-fix:
    if: github.actor == 'blakinio'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: governance/repository-lifecycle-hygiene-1559
          fetch-depth: 1
          persist-credentials: false

      - name: Install canonical pre-commit runner
        run: python -m pip install 'pre-commit==4.6.2'

      - name: Apply canonical formatter then bounded E501 exceptions
        shell: bash
        run: |
          set -euo pipefail
          pre-commit run --all-files || true
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tools/agents/repository_lifecycle.py'): [
                  (
                      '            f"/repos/{self.repo}/pulls?state={state_param}&per_page=100&sort=updated&direction=desc"\n',
                      '            f"/repos/{self.repo}/pulls?state={state_param}&per_page=100&sort=updated&direction=desc"  # noqa: E501\n',
                  ),
              ],
              Path('tools/agents/repository_lifecycle_apply.py'): [
                  (
                      '            f"default branch moved during apply: expected {approved_base_sha}, got {current_base_sha}"\n',
                      '            f"default branch moved during apply: expected {approved_base_sha}, got {current_base_sha}"  # noqa: E501\n',
                  ),
              ],
              Path('tools/agents/repository_lifecycle_preflight.py'): [
                  (
                      '                    f"source ref drift during preflight: {local_ref} expected {expected_sha}, got {actual_sha}"\n',
                      '                    f"source ref drift during preflight: {local_ref} expected {expected_sha}, got {actual_sha}"  # noqa: E501\n',
                  ),
                  (
                      '                f"default branch moved during historical preflight: expected {base_sha}, got {final_base_sha}"\n',
                      '                f"default branch moved during historical preflight: expected {base_sha}, got {final_base_sha}"  # noqa: E501\n',
                  ),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected formatter target missing in {path}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          pre-commit run --all-files

      - name: Remove one-shot helper and commit verified formatting
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/repository-lifecycle-format-fix.yml
          git add tools/agents/repository_lifecycle.py \
                  tools/agents/repository_lifecycle_apply.py \
                  tools/agents/repository_lifecycle_approval.py \
                  tools/agents/repository_lifecycle_preflight.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(governance): apply canonical lifecycle formatting'
          basic="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            push origin HEAD:refs/heads/governance/repository-lifecycle-hygiene-1559
