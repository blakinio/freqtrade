name: Request-only #1561 deployed browser page diagnostic

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose authenticated deployed /bots page
    if: github.head_ref == 'audit/1561-browser-page-diagnostic'
    runs-on:
      - freqtrade-staging
    environment: synology-staging
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PORTAL_CONTROL_CONTAINER: freqtrade-portal-control-plane
      PORTAL_ORIGIN: https://quant.molehill.cloud
    steps:
      - name: Seed bounded session, inspect page shape, cleanup
        shell: bash
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/wh09-page-diag-token"
          body_file="$RUNNER_TEMP/wh09-page-diag-body"
          headers_file="$RUNNER_TEMP/wh09-page-diag-headers"
          key="$(printf '%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha256sum | awk '{print substr($1,1,24)}')"
          principal_id="wh09-dp-${key}"
          membership_id="wh09-dm-${key}"
          subject="urn:freqtrade:wh09-browser-page-diag:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          [[ ${#principal_id} -le 36 ]]
          [[ ${#membership_id} -le 36 ]]
          umask 077
          openssl rand -base64 48 | tr -d '\n' > "$token_file"
          session_token="$(cat "$token_file")"
          echo "::add-mask::$session_token"

          docker exec -i \
            --env "PORTAL_WH09_DIAG_TOKEN=$session_token" \
            --env "PORTAL_WH09_DIAG_PRINCIPAL=$principal_id" \
            --env "PORTAL_WH09_DIAG_MEMBERSHIP=$membership_id" \
            --env "PORTAL_WH09_DIAG_SUBJECT=$subject" \
            "$PORTAL_CONTROL_CONTAINER" python - <<'PY'
          from datetime import UTC, datetime, timedelta
          import os
          from ai_platform.portal.contracts.identity import RoleName
          from ai_platform.portal.control_plane.database import build_engine, build_session_factory
          from ai_platform.portal.identity.crypto import IdentityCrypto, IdentitySecrets
          from ai_platform.portal.identity.repository import IdentityRepository
          from ai_platform.portal.identity.runtime import IdentityRuntimeConfig

          cfg = IdentityRuntimeConfig.from_environment()
          crypto = IdentityCrypto(IdentitySecrets(session_hmac_key=cfg.session_hmac_key, flow_encryption_key=cfg.flow_encryption_key))
          engine = build_engine(os.environ["PORTAL_DATABASE_URL"])
          factory = build_session_factory(engine)
          now = datetime.now(UTC)
          try:
              with factory() as session:
                  repo = IdentityRepository(session)
                  principal = repo.create_principal(
                      principal_id=os.environ["PORTAL_WH09_DIAG_PRINCIPAL"], issuer=cfg.issuer,
                      subject=os.environ["PORTAL_WH09_DIAG_SUBJECT"], display_name="WH09 page diagnostic",
                      email=None, now=now,
                  )
                  membership = repo.create_membership(
                      membership_id=os.environ["PORTAL_WH09_DIAG_MEMBERSHIP"], principal_id=principal.principal_id,
                      tenant_id="tenant-local", roles=(RoleName.USER,), valid_from=now,
                      valid_until=now + timedelta(minutes=15), now=now,
                  )
                  token = os.environ["PORTAL_WH09_DIAG_TOKEN"]
                  repo.create_session(
                      session_id_hash=crypto.hash_token(token), csrf_token_hash=crypto.hash_token(token + ":csrf"),
                      principal_id=principal.principal_id, membership_id=membership.membership_id,
                      membership_version=membership.membership_version, idp_session_id=None,
                      authentication_time=now, mfa_satisfied=True, created_at=now,
                      idle_expires_at=now + timedelta(minutes=15), absolute_expires_at=now + timedelta(minutes=15),
                  )
                  session.commit()
          finally:
              engine.dispose()
          PY

          curl_rc=0
          result="$(curl -k -sS -L --max-time 90 \
            --cookie "__Host-portal_session=$session_token" \
            -D "$headers_file" -o "$body_file" \
            -w '%{http_code}|%{url_effective}' \
            "$PORTAL_ORIGIN/bots")" || curl_rc=$?
          echo "curl_rc=$curl_rc"
          echo "http_and_final_url=$result"
          python3 - "$body_file" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace") if pathlib.Path(sys.argv[1]).exists() else ""
          probes = {
              "body_nonempty": bool(text),
              "contains_bot_fleet": "Bot fleet" in text,
              "contains_wickhunter_id": "wickhunter" in text,
              "contains_wickhunter_name": "WickHunter" in text,
              "contains_canonical_runtime": "Canonical RuntimeGeneration" in text,
              "contains_login": "login" in text.lower() or "sign in" in text.lower(),
              "contains_error_marker": "internal server error" in text.lower() or "application error" in text.lower(),
          }
          for key, value in probes.items():
              print(f"{key}={str(value).lower()}")
          print(f"body_bytes={len(text.encode('utf-8'))}")
          PY

          cleanup_rc=0
          docker exec -i \
            --env "PORTAL_WH09_DIAG_TOKEN=$session_token" \
            --env "PORTAL_WH09_DIAG_PRINCIPAL=$principal_id" \
            --env "PORTAL_WH09_DIAG_MEMBERSHIP=$membership_id" \
            --env "PORTAL_WH09_DIAG_SUBJECT=$subject" \
            "$PORTAL_CONTROL_CONTAINER" python - <<'PY' || cleanup_rc=$?
          import os
          from ai_platform.portal.control_plane.database import build_engine, build_session_factory
          from ai_platform.portal.identity.crypto import IdentityCrypto, IdentitySecrets
          from ai_platform.portal.identity.models import IdentityPrincipalRow, PortalSessionRow, TenantMembershipRow
          from ai_platform.portal.identity.runtime import IdentityRuntimeConfig
          cfg = IdentityRuntimeConfig.from_environment()
          crypto = IdentityCrypto(IdentitySecrets(session_hmac_key=cfg.session_hmac_key, flow_encryption_key=cfg.flow_encryption_key))
          engine = build_engine(os.environ["PORTAL_DATABASE_URL"])
          factory = build_session_factory(engine)
          token_hash = crypto.hash_token(os.environ["PORTAL_WH09_DIAG_TOKEN"])
          principal_id = os.environ["PORTAL_WH09_DIAG_PRINCIPAL"]
          membership_id = os.environ["PORTAL_WH09_DIAG_MEMBERSHIP"]
          subject = os.environ["PORTAL_WH09_DIAG_SUBJECT"]
          try:
              with factory() as session:
                  row = session.get(PortalSessionRow, token_hash)
                  if row is not None:
                      if row.principal_id != principal_id or row.membership_id != membership_id:
                          raise SystemExit("refusing non-task session cleanup")
                      session.delete(row); session.flush()
                  membership = session.get(TenantMembershipRow, membership_id)
                  if membership is not None:
                      if membership.principal_id != principal_id or membership.tenant_id != "tenant-local":
                          raise SystemExit("refusing non-task membership cleanup")
                      session.delete(membership); session.flush()
                  principal = session.get(IdentityPrincipalRow, principal_id)
                  if principal is not None:
                      if principal.subject != subject:
                          raise SystemExit("refusing non-task principal cleanup")
                      session.delete(principal)
                  session.commit()
                  assert session.get(PortalSessionRow, token_hash) is None
                  assert session.get(TenantMembershipRow, membership_id) is None
                  assert session.get(IdentityPrincipalRow, principal_id) is None
          finally:
              engine.dispose()
          PY
          rm -f "$token_file" "$body_file" "$headers_file"
          [[ "$cleanup_rc" -eq 0 ]]
          [[ "$curl_rc" -eq 0 ]]
