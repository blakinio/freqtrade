name: Request-only PR1619 independent Qwen audit

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: request-only-pr1619-independent-audit
  cancel-in-progress: true

env:
  AUDIT_BASE: 1af35b4ccef6bbd06c771603a80760c342d334aa
  AUDIT_HEAD: d5da8d923bec4e05095d3ab2bf0f632203dc65c8
  OLLAMA_VERSION: 0.32.7
  AUDIT_MODEL: qwen2.5-coder:7b

jobs:
  independent-audit:
    name: Fresh read-only exact-diff audit
    if: github.head_ref == 'audit/1619-final-qwen'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact audited head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.AUDIT_HEAD }}

      - name: Materialize bounded exact diff and audit contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$AUDIT_HEAD" ]]
          git cat-file -e "$AUDIT_BASE^{commit}"
          git diff --no-ext-diff --unified=8 "$AUDIT_BASE...$AUDIT_HEAD" -- \
            .github/workflow-registry.yaml \
            .github/workflows/ai-platform-wickhunter-wh09-production-research-runtime-deploy.yml \
            .github/workflows/portal-wickhunter-browser-e2e.yml \
            .github/workflows/portal-wickhunter-wh09-adoption.yml \
            .github/workflows/portal-wickhunter-wh09-deployed-browser.yml \
            deploy/synology/portal-oidc/Dockerfile.wickhunter-browser \
            deploy/synology/portal-oidc/run-requests/wickhunter-wh09-portal-adoption-20260819-v2.json \
            deploy/synology/wickhunter-production-research-runtime/run-requests/retry-wh09-production-research-20260819-v7.json \
            ai_platform/portal/web/app/bots/page.tsx \
            ai_platform/portal/web/e2e/wickhunter-api-mode-ci.mjs \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py \
            tests/ci/test_github_build_plane.py \
            tests/ci/test_portal_wickhunter_deployed_browser.py \
            docs/agents/tasks/active/FTAI-20260819-wickhunter-portal-real-integration-1561.md \
            > "$RUNNER_TEMP/pr1619.diff"
          test -s "$RUNNER_TEMP/pr1619.diff"
          sha256sum "$RUNNER_TEMP/pr1619.diff" | tee "$RUNNER_TEMP/pr1619.diff.sha256"
          cat > "$RUNNER_TEMP/audit-contract.txt" <<'EOF'
          You are a fresh independent read-only reviewer. Audit only the exact BASE...HEAD diff supplied below. Do not trust implementer summaries or checkpoint conclusions.

          Binding requirements:
          - ADR-023 + ADR-025: Synology is the persistent runtime/storage host; GitHub-hosted Actions is stateless CI/build/image-publication/disposable compute.
          - No real exchange order submission, withdrawals, private trading credentials, live capital, or automatic model activation.
          - Persistent/shared Synology mutation and deployment must be bounded, attributable, fail-closed, restart-safe, and preserve durable state.
          - Portal must consume the real persistent WickHunter runtime with canonical bot_id=wickhunter exactly once, converged RuntimeGeneration, durable decisions including NO_TRADE, and no fixture substitution.
          - Image/source provenance must be immutable and exact; untrusted inputs must not gain package-write, deployment, target-host, or secret authority.
          - Real user-workflow acceptance must use authenticated Chromium against the actually deployed https://quant.molehill.cloud path, prove API mode and fixture-disabled behavior, surface HEALTHY/decision/NO_TRADE truth, survive reload/restart, and clean up any task-owned temporary identity/container/image resources.
          - Governance/CI self-change remains governed by trusted base 1af35b4ccef6bbd06c771603a80760c342d334aa; the PR may not weaken its own required gates.
          - Historical SHADOW/PAPER literals are compatibility vocabulary only and do not grant current capital authority.

          Find only material P0/P1/P2 issues actually evidenced by the diff. Reject speculative findings already prevented by the implementation. For every finding provide severity, stable ID, exact path/construct, concrete failure or exploit scenario, why current checks do not prevent it, and minimal remediation.

          Output exactly one of:
          RESULT=PASS
          FINDINGS=0
          SUMMARY=<brief evidence-based summary>

          or:
          RESULT=FAIL
          FINDINGS=<integer>
          <findings>
          EOF

      - name: Install bounded local Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/install.sh" \
            --output "$RUNNER_TEMP/ollama-install.sh"
          test -s "$RUNNER_TEMP/ollama-install.sh"
          OLLAMA_VERSION="$OLLAMA_VERSION" sh "$RUNNER_TEMP/ollama-install.sh"
          ollama --version
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$AUDIT_MODEL"

      - name: Run fresh independent model audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/audit-contract.txt" "$RUNNER_TEMP/pr1619.diff" "$RUNNER_TEMP/audit-result.txt" <<'PY'
          import json
          import pathlib
          import sys
          import urllib.request

          contract = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          diff = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          prompt = contract + "\n\nEXACT DIFF:\n" + diff
          payload = json.dumps(
              {
                  "model": "qwen2.5-coder:7b",
                  "prompt": prompt,
                  "stream": False,
                  "options": {"temperature": 0.1, "num_ctx": 32768},
              }
          ).encode()
          request = urllib.request.Request(
              "http://127.0.0.1:11434/api/generate",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=1800) as response:
              result = json.load(response).get("response", "").strip()
          pathlib.Path(sys.argv[3]).write_text(result + "\n", encoding="utf-8")
          print(result)
          PY
          sha256sum "$RUNNER_TEMP/audit-result.txt"
          grep -Fx 'RESULT=PASS' "$RUNNER_TEMP/audit-result.txt"
          grep -Fx 'FINDINGS=0' "$RUNNER_TEMP/audit-result.txt"
          {
            echo '### Fresh independent audit'
            echo
            echo "- base: \`$AUDIT_BASE\`"
            echo "- head: \`$AUDIT_HEAD\`"
            echo "- model: \`$AUDIT_MODEL\`"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/audit-result.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
