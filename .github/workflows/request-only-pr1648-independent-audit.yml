name: Request-only PR1648 independent Qwen audit

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: request-only-pr1648-independent-audit
  cancel-in-progress: true

env:
  AUDIT_BASE: 3fc65d7da9511e0bd15c0ab924f6d8dacd1829cc
  AUDIT_HEAD: ba7eacbeb309582038c4a7cad2ab9f395de499b2
  OLLAMA_VERSION: 0.32.7
  AUDIT_MODEL: qwen2.5-coder:7b

jobs:
  independent-audit:
    name: Fresh read-only exact-diff audit PR1648
    if: github.head_ref == 'audit/1648-final-qwen-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact audited head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.AUDIT_HEAD }}

      - name: Materialize exact diff and audit contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$AUDIT_HEAD" ]]
          git cat-file -e "$AUDIT_BASE^{commit}"
          git diff --no-ext-diff --unified=8 "$AUDIT_BASE...$AUDIT_HEAD" > "$RUNNER_TEMP/pr1648.diff"
          test -s "$RUNNER_TEMP/pr1648.diff"
          sha256sum "$RUNNER_TEMP/pr1648.diff" | tee "$RUNNER_TEMP/pr1648.diff.sha256"
          cat > "$RUNNER_TEMP/audit-contract.txt" <<'EOF'
          You are a fresh independent read-only reviewer. Audit only the exact BASE...HEAD diff supplied below.

          Acceptance criteria:
          - This is a browser-only WH09 acceptance repair for Issue #1561. Persistent Portal/WH09 target remains authorized at eafc198857c90caf89a5920da60ae7661c1061ba with adoption run 32373954360.
          - No Portal deploy, WH09 redeploy/restart, PAPER/LIVE/model activation, private trading credentials, order adapter, orders, withdrawals, or live-capital authority may be introduced.
          - Required invariants: trading_credentials_present=false, order_adapter_present=false, execution_enabled=false, orders_submitted=0, live_capital_authorized=false.
          - The v4 request must be one-shot browser-only material. Harness provenance and target authorization must remain distinct and exact.
          - Helper approval producer/consumer schema must agree. The downloaded acceptance script must be cryptographically bound to the helper approval and exact harness source.
          - Synology must not need repository checkout/build work. Disposable helper/container/session/principal/membership/image cleanup must remain exact and fail closed.
          - Synthetic session token must be URL-safe, bounded, masked, USER-only, and task-owned.
          - Acceptance must require real Chromium at https://quant.molehill.cloud/bots, authenticated=true, no fixture cookies, canonical WickHunter markers, HEALTHY, positive decision/no-trade counts, generation convergence, execution disabled/orders 0/live capital false, and reload persistence.
          - Failure evidence must be secret-free. Workflow token permissions must stay least privilege.

          Find only material P0/P1/P2 issues actually evidenced by the diff. Output exactly:
          RESULT=PASS
          FINDINGS=0
          SUMMARY=<brief evidence-based summary>

          or RESULT=FAIL with FINDINGS=<integer> and concrete findings.
          EOF
          sha256sum "$RUNNER_TEMP/audit-contract.txt" | tee "$RUNNER_TEMP/audit-contract.sha256"

      - name: Install bounded local Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/install.sh" \
            --output "$RUNNER_TEMP/ollama-install.sh"
          OLLAMA_VERSION="$OLLAMA_VERSION" sh "$RUNNER_TEMP/ollama-install.sh"
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$AUDIT_MODEL"

      - name: Run fresh independent model audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/audit-contract.txt" "$RUNNER_TEMP/pr1648.diff" "$RUNNER_TEMP/audit-result.txt" <<'PY'
          import json
          import pathlib
          import sys
          import urllib.request

          contract = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          diff = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          payload = json.dumps({
              "model": "qwen2.5-coder:7b",
              "prompt": contract + "\n\nEXACT DIFF:\n" + diff,
              "stream": False,
              "options": {"temperature": 0.1, "num_ctx": 32768, "num_predict": 1024},
          }).encode()
          request = urllib.request.Request(
              "http://127.0.0.1:11434/api/generate",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=1800) as response:
              result = json.load(response).get("response", "").strip()
          normalized = "\n".join(line.rstrip() for line in result.splitlines())
          pathlib.Path(sys.argv[3]).write_text(normalized + "\n", encoding="utf-8")
          print(normalized)
          PY
          sha256sum "$RUNNER_TEMP/audit-result.txt" | tee "$RUNNER_TEMP/audit-result.sha256"
          grep -Fx 'RESULT=PASS' "$RUNNER_TEMP/audit-result.txt"
          grep -Fx 'FINDINGS=0' "$RUNNER_TEMP/audit-result.txt"
          grep -Eq '^SUMMARY=.+$' "$RUNNER_TEMP/audit-result.txt"

      - name: Upload exact audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr1648-independent-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr1648.diff.sha256
            ${{ runner.temp }}/audit-contract.sha256
            ${{ runner.temp }}/audit-result.txt
            ${{ runner.temp }}/audit-result.sha256
          if-no-files-found: warn
          retention-days: 30
