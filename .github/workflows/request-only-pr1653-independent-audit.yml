name: Request-only PR1653 independent Qwen audit

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: request-only-pr1653-independent-audit
  cancel-in-progress: true

env:
  AUDIT_BASE: affeab4cdfa053e9f9765dd307b6d6ea4b5d6c49
  AUDIT_HEAD: 1f3b6c2a6d0ab8b0dddbaf67fc731924bee9c4fe
  OLLAMA_VERSION: 0.32.7
  AUDIT_MODEL: qwen2.5-coder:7b

jobs:
  independent-audit:
    name: Fresh read-only exact-diff audit PR1653
    if: github.head_ref == 'audit/1653-final-qwen'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact audited head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.AUDIT_HEAD }}
      - name: Materialize exact diff and contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$AUDIT_HEAD" ]]
          git cat-file -e "$AUDIT_BASE^{commit}"
          git diff --no-ext-diff --unified=8 "$AUDIT_BASE...$AUDIT_HEAD" > "$RUNNER_TEMP/audit.diff"
          test -s "$RUNNER_TEMP/audit.diff"
          sha256sum "$RUNNER_TEMP/audit.diff" > "$RUNNER_TEMP/diff.sha256"
          cat > "$RUNNER_TEMP/contract.txt" <<'EOF'
          Review only the exact supplied BASE...HEAD diff as a fresh independent read-only reviewer.

          Context: Issue #1561 browser-only WH09 -> Developer Quant Portal acceptance. The accepted persistent Portal/WH09 target stays pinned to eafc198857c90caf89a5920da60ae7661c1061ba and adoption run 32373954360. The previous v4 run reached exact target provenance but failed before acceptance because an Actions artifact did not preserve executable permission on accept.sh.

          Required properties:
          - v5 must fix only that transport/permission boundary, safely invoking cryptographically verified accept.sh without relying on executable mode.
          - fresh request is one-shot, browser_only=true, no Portal deploy, no WH09 redeploy/restart, no PAPER/LIVE/model activation.
          - URL-safe synthetic session is task-owned USER authority only.
          - helper approval binds harness SHA, target authorization SHA, image ID/tar digest and accept-script digest; Synology does no repo checkout/build.
          - real Chromium acceptance remains meaningful: exact /bots, authenticated, no fixture cookies, canonical WickHunter/runtime-generation/HEALTHY markers, positive decisions and NO_TRADE, reload persistence.
          - exact cleanup of task session/membership/principal/container/helper image remains fail closed.
          - trading_credentials_present=false; order_adapter_present=false; execution_enabled=false; orders_submitted=0; live_capital_authorized=false.
          - no secret material may be persisted in evidence.

          Find only material P0/P1/P2 defects supported by the diff. Output exactly:
          RESULT=PASS
          FINDINGS=0
          SUMMARY=<brief evidence-based summary>
          or RESULT=FAIL with FINDINGS=<integer> and concrete findings.
          EOF
      - name: Install bounded local reviewer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/install.sh" -o "$RUNNER_TEMP/ollama-install.sh"
          OLLAMA_VERSION="$OLLAMA_VERSION" sh "$RUNNER_TEMP/ollama-install.sh"
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$AUDIT_MODEL"
      - name: Run independent model audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/contract.txt" "$RUNNER_TEMP/audit.diff" "$RUNNER_TEMP/result.txt" <<'PY'
          import json,pathlib,sys,urllib.request
          contract=pathlib.Path(sys.argv[1]).read_text(); diff=pathlib.Path(sys.argv[2]).read_text()
          payload=json.dumps({"model":"qwen2.5-coder:7b","prompt":contract+"\n\nEXACT DIFF:\n"+diff,"stream":False,"options":{"temperature":0.1,"num_ctx":32768,"num_predict":1024}}).encode()
          req=urllib.request.Request("http://127.0.0.1:11434/api/generate",data=payload,headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=1800) as response: result=json.load(response).get("response","").strip()
          normalized="\n".join(line.rstrip() for line in result.splitlines()); pathlib.Path(sys.argv[3]).write_text(normalized+"\n"); print(normalized)
          PY
          sha256sum "$RUNNER_TEMP/result.txt" > "$RUNNER_TEMP/result.sha256"
          cat "$RUNNER_TEMP/result.txt"
          grep -Fx 'RESULT=PASS' "$RUNNER_TEMP/result.txt"
          grep -Fx 'FINDINGS=0' "$RUNNER_TEMP/result.txt"
          grep -Eq '^SUMMARY=.+$' "$RUNNER_TEMP/result.txt"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr1653-independent-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/diff.sha256
            ${{ runner.temp }}/result.txt
            ${{ runner.temp }}/result.sha256
          if-no-files-found: warn
          retention-days: 30
