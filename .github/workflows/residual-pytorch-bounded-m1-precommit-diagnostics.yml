name: Residual PyTorch Bounded M1 Pre-commit Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/residual-pytorch-bounded-m1-execution.yml"
      - "ai_platform/**"
      - "docs/agents/tasks/FTAI-20260726-residual-pytorch-bounded-m1-execution.md"
      - "docs/ai_platform/RESIDUAL_PYTORCH_BOUNDED_M1_EXECUTION.md"
      - "tests/ai_platform/test_residual_pytorch_bounded_m1_execution.py"
      - ".github/workflows/residual-pytorch-bounded-m1-precommit-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pre-commit
      - name: Capture pre-commit diagnostics
        shell: bash
        run: |
          set +e
          pre-commit run --all-files --show-diff-on-failure > precommit.txt 2>&1
          echo "$?" > precommit-exit-code.txt
          git diff --binary > precommit.diff
          git status --short > precommit-status.txt
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: residual-pytorch-bounded-m1-precommit-${{ github.event.pull_request.number }}
          path: |
            precommit.txt
            precommit-exit-code.txt
            precommit.diff
            precommit-status.txt
          if-no-files-found: error
          retention-days: 1
