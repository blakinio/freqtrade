name: Residual PyTorch Bounded M1 Request Generator

on:
  push:
    branches:
      - exec/residual-pytorch-bounded-m1-request
    paths:
      - ".github/workflows/residual-pytorch-bounded-m1-request-generator.yml"

permissions:
  contents: write

jobs:
  generate:
    if: >-
      github.repository == 'blakinio/freqtrade' &&
      github.ref == 'refs/heads/exec/residual-pytorch-bounded-m1-request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REQUEST_PATH: ai_platform/experimental_model_research/run-requests/residual-pytorch-bounded-m1-execution-v1.json

    steps:
      - name: Checkout request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: exec/residual-pytorch-bounded-m1-request
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: false
          python-version: "3.12"

      - name: Install canonical-request dependencies
        run: uv pip install numpy pandas

      - name: Generate and validate canonical request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$REQUEST_PATH")"
          python -m ai_platform.scripts.residual_pytorch_bounded_m1_run_request \
            --print-canonical > "$REQUEST_PATH"
          python -m ai_platform.scripts.residual_pytorch_bounded_m1_run_request \
            "$REQUEST_PATH"

      - name: Commit canonical request
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REQUEST_PATH"
          git commit -m "chore(ai-platform): request bounded M1 execution"
          git push origin HEAD:exec/residual-pytorch-bounded-m1-request
