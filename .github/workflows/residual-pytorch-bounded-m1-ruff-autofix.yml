name: Residual PyTorch Bounded M1 Ruff Autofix

on:
  push:
    branches:
      - feat/residual-pytorch-bounded-m1-execution
    paths:
      - "ai_platform/freqaimodels/M1ResidualPyTorchRegressor.py"
      - "ai_platform/freqaimodels/M1SeededPyTorchMLPRegressor.py"
      - "ai_platform/freqaimodels/residual_pytorch_m1_instrumentation.py"
      - "ai_platform/scripts/residual_pytorch_bounded_m1_execution.py"
      - "ai_platform/scripts/residual_pytorch_bounded_m1_run_request.py"
      - "tests/ai_platform/test_residual_pytorch_bounded_m1_execution.py"
      - ".github/workflows/residual-pytorch-bounded-m1-ruff-autofix.yml"

permissions:
  contents: write

jobs:
  autofix:
    if: >-
      github.repository == 'blakinio/freqtrade' &&
      github.ref == 'refs/heads/feat/residual-pytorch-bounded-m1-execution'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/residual-pytorch-bounded-m1-execution
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - name: Apply bounded fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/scripts/residual_pytorch_bounded_m1_execution.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "def _load_and_validate_config(track: dict[str, Any]) -> dict[str, Any]:  # noqa: C901",
              "def _load_and_validate_config(track: dict[str, Any]) -> dict[str, Any]:",
          )
          text = text.replace(
              "def build_raw_matrix_audit(\n",
              "def build_raw_matrix_audit(  # noqa: C901\n",
              1,
          )
          text = text.replace(
              ") -> dict[str, Any]:  # noqa: C901\n    \"\"\"Audit the exact expanded raw training matrix",
              ") -> dict[str, Any]:\n    \"\"\"Audit the exact expanded raw training matrix",
              1,
          )
          text = text.replace(
              "def build_prediction_diagnostics(path: Path, *, track_id: str) -> dict[str, Any]:  # noqa: C901",
              "def build_prediction_diagnostics(path: Path, *, track_id: str) -> dict[str, Any]:",
          )
          text = text.replace(
              "def validate_training_directory(path: Path, *, track_id: str) -> dict[str, Any]:",
              "def validate_training_directory(  # noqa: C901\n    path: Path, *, track_id: str\n) -> dict[str, Any]:",
          )
          path.write_text(text, encoding="utf-8")
          PY

          files=(
            ai_platform/freqaimodels/M1ResidualPyTorchRegressor.py
            ai_platform/freqaimodels/M1SeededPyTorchMLPRegressor.py
            ai_platform/freqaimodels/residual_pytorch_m1_instrumentation.py
            ai_platform/scripts/residual_pytorch_bounded_m1_execution.py
            ai_platform/scripts/residual_pytorch_bounded_m1_run_request.py
            tests/ai_platform/test_residual_pytorch_bounded_m1_execution.py
          )
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"

      - name: Commit fixes when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/freqaimodels/M1ResidualPyTorchRegressor.py \
            ai_platform/freqaimodels/M1SeededPyTorchMLPRegressor.py \
            ai_platform/freqaimodels/residual_pytorch_m1_instrumentation.py \
            ai_platform/scripts/residual_pytorch_bounded_m1_execution.py \
            ai_platform/scripts/residual_pytorch_bounded_m1_run_request.py \
            tests/ai_platform/test_residual_pytorch_bounded_m1_execution.py
          git commit -m "style(ai-platform): apply bounded M1 Ruff fixes"
          git push origin HEAD:feat/residual-pytorch-bounded-m1-execution
