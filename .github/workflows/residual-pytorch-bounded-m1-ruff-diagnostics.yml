name: Residual PyTorch Bounded M1 Ruff Diagnostics

on:
  pull_request:
    paths:
      - "ai_platform/**residual_pytorch_bounded_m1**"
      - "ai_platform/**ResidualPyTorchM1**"
      - "ai_platform/**M1LightGBMRegressor.py"
      - "ai_platform/**M1SeededPyTorchMLPRegressor.py"
      - "ai_platform/**M1ResidualPyTorchRegressor.py"
      - "tests/ai_platform/test_residual_pytorch_bounded_m1_execution.py"
      - ".github/workflows/residual-pytorch-bounded-m1-ruff-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - name: Capture Ruff diagnostics
        shell: bash
        run: |
          set +e
          ruff check ai_platform tests/ai_platform --output-format=json > ruff.json
          echo "$?" > ruff-exit-code.txt
          ruff format --check --diff ai_platform tests/ai_platform > ruff-format.diff
          echo "$?" > ruff-format-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: residual-pytorch-bounded-m1-ruff-${{ github.event.pull_request.number }}
          path: |
            ruff.json
            ruff-exit-code.txt
            ruff-format.diff
            ruff-format-exit-code.txt
          if-no-files-found: error
          retention-days: 1
