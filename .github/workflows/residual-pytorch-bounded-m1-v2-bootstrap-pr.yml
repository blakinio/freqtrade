name: Residual PyTorch Bounded M1 V2 PR Bootstrap

on:
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - ".github/workflows/residual-pytorch-bounded-m1-v2-bootstrap-pr.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/residual-pytorch-bounded-m1-v2-volume-change'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/residual-pytorch-bounded-m1-v2-volume-change
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Apply bounded v2 remediation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply-v2.py.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/apply-v2.py.gz.b64 | gzip --decompress > /tmp/apply-v2.py
          python -m py_compile /tmp/apply-v2.py
          python /tmp/apply-v2.py
          rm -f .github/workflows/residual-pytorch-bounded-m1-v2-bootstrap-pr.yml
          python -m py_compile \
            ai_platform/strategies/AiFrozenCandidateStrategyV2.py \
            ai_platform/scripts/residual_pytorch_bounded_m1_v2_execution.py \
            ai_platform/scripts/residual_pytorch_bounded_m1_v2_run_request.py \
            tests/ai_platform/test_residual_pytorch_bounded_m1_v2_remediation.py

      - name: Commit verified infrastructure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ai-platform): version finite bounded M1 volume change"
          git push origin HEAD:fix/residual-pytorch-bounded-m1-v2-volume-change
