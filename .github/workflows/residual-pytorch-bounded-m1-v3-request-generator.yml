name: CI reusable-concurrency final tree probe (temporary)

on:
  pull_request:
    branches:
      - develop
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ci-reusable-concurrency-final-tree-probe
  cancel-in-progress: false

jobs:
  prepare-tree:
    if: github.event.pull_request.head.ref == 'audit/ci-architecture-optimizer-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: audit/ci-architecture-optimizer-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Build reviewed target tree
        shell: bash
        run: |
          set -uo pipefail
          status=0
          (
            set -euxo pipefail
            python - <<'PY'
          from pathlib import Path

          replacements = {
              ".github/workflows/ai-program-closure-e2e.yml": "ai-program-closure-e2e",
              ".github/workflows/ai-strategy-engine.yml": "ai-strategy-engine",
              ".github/workflows/portal-completeness-audit.yml": "portal-completeness-audit",
              ".github/workflows/portal-universal-e2e.yml": "portal-universal-e2e",
              ".github/workflows/portal-web.yml": "portal-web",
          }
          old = 'group: "${{ github.workflow }}-${{ github.ref }}"'
          for name, prefix in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected concurrency contract in {name}")
              path.write_text(
                  text.replace(old, f'group: "{prefix}-${{{{ github.ref }}}}"'),
                  encoding="utf-8",
              )

          validator = Path("tools/ci/validate_workflows.py")
          text = validator.read_text(encoding="utf-8")
          text = text.replace(
              "def _validate_reusable_components(workflows: dict[str, dict[str, Any]]) -> list[str]:",
              "def _validate_reusable_components(\n    root: Path, workflows: dict[str, dict[str, Any]]\n) -> list[str]:",
          )
          marker = '''        if isinstance(triggers, dict) and "pull_request" in triggers:\n            failures.append(f"{name}: direct PR trigger bypasses central component routing")\n'''
          replacement = marker + '''        text = (root / ".github" / "workflows" / name).read_text(encoding="utf-8")\n        generic = 'group: "${{ github.workflow }}-${{ github.ref }}"'\n        if generic in text:\n            failures.append(f"{name}: reusable workflow uses caller-shared concurrency group")\n'''
          if text.count(marker) != 1:
              raise SystemExit("validator marker mismatch")
          text = text.replace(marker, replacement)
          text = text.replace(
              "failures.extend(_validate_reusable_components(workflows))",
              "failures.extend(_validate_reusable_components(root, workflows))",
          )
          validator.write_text(text, encoding="utf-8")
          PY
            git show HEAD^:.github/workflows/residual-pytorch-bounded-m1-v3-request-generator.yml > .github/workflows/residual-pytorch-bounded-m1-v3-request-generator.yml
            python -m pip install --disable-pip-version-check ruff==0.15.20 pytest==9.1.1 PyYAML==6.0.3
            ruff check --fix tools/ci tests/ci
            ruff format tools/ci tests/ci
            python -m pytest -q -o addopts='' tests/ci
            python tools/ci/validate_workflows.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git diff --cached --check
            git commit -m "fix(ci): isolate reusable workflow concurrency"
            echo "BASE_COMMIT=$(git rev-parse HEAD^)"
            echo "TARGET_COMMIT=$(git rev-parse HEAD)"
            echo "TARGET_TREE=$(git rev-parse 'HEAD^{tree}')"
            git push origin HEAD:audit/ci-architecture-optimizer-20260804
          ) 2>&1 | tee /tmp/ci-concurrency-final-tree.log || status=${PIPESTATUS[0]}
          exit "$status"
