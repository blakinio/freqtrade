name: CI reusable-concurrency tree probe (temporary)

on:
  pull_request:
    branches:
      - develop
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ci-reusable-concurrency-tree-probe
  cancel-in-progress: false

jobs:
  prepare-tree:
    if: github.event.pull_request.head.ref == 'audit/ci-architecture-optimizer-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: audit/ci-architecture-optimizer-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Build reviewed target tree
        shell: bash
        run: |
          set -uo pipefail
          status=0
          (
            set -euxo pipefail
            python - <<'PY'
          from pathlib import Path

          replacements = {
              ".github/workflows/ai-program-closure-e2e.yml": (
                  'group: "${{ github.workflow }}-${{ github.ref }}"',
                  'group: "ai-program-closure-e2e-${{ github.ref }}"',
              ),
              ".github/workflows/ai-strategy-engine.yml": (
                  'group: "${{ github.workflow }}-${{ github.ref }}"',
                  'group: "ai-strategy-engine-${{ github.ref }}"',
              ),
              ".github/workflows/portal-completeness-audit.yml": (
                  'group: "${{ github.workflow }}-${{ github.ref }}"',
                  'group: "portal-completeness-audit-${{ github.ref }}"',
              ),
              ".github/workflows/portal-universal-e2e.yml": (
                  'group: "${{ github.workflow }}-${{ github.ref }}"',
                  'group: "portal-universal-e2e-${{ github.ref }}"',
              ),
              ".github/workflows/portal-web.yml": (
                  'group: "${{ github.workflow }}-${{ github.ref }}"',
                  'group: "portal-web-${{ github.ref }}"',
              ),
          }
          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected concurrency contract in {name}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
            git show HEAD^:.github/workflows/residual-pytorch-bounded-m1-v3-request-generator.yml > .github/workflows/residual-pytorch-bounded-m1-v3-request-generator.yml
            python -m py_compile tools/ci/*.py tests/ci/*.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git diff --cached --check
            git commit -m "fix(ci): isolate reusable workflow concurrency"
            echo "BASE_COMMIT=$(git rev-parse HEAD^)"
            echo "TARGET_COMMIT=$(git rev-parse HEAD)"
            echo "TARGET_TREE=$(git rev-parse 'HEAD^{tree}')"
            git push origin HEAD:audit/ci-architecture-optimizer-20260804
          ) 2>&1 | tee /tmp/ci-concurrency-tree.log || status=${PIPESTATUS[0]}
          exit "$status"
