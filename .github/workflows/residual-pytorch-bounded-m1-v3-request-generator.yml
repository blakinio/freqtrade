name: Residual PyTorch Bounded M1 V3 Request Generator

on:
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - "ai_platform/experimental_model_research/run-requests/generate-residual-pytorch-bounded-m1-v3.txt"

permissions:
  contents: write

concurrency:
  group: residual-pytorch-bounded-m1-v3-request-generator
  cancel-in-progress: false

env:
  MARKER_PATH: ai_platform/experimental_model_research/run-requests/generate-residual-pytorch-bounded-m1-v3.txt
  REQUEST_PATH: ai_platform/experimental_model_research/run-requests/residual-pytorch-bounded-m1-generalization-v3.json
  REQUEST_BRANCH: run/residual-pytorch-bounded-m1-v3-generalization
  TASK_PATH: docs/agents/tasks/FTAI-20260728-residual-pytorch-bounded-m1-v3-generalization.md

jobs:
  generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact marker commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact marker scope and active task
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expected=$'A\tai_platform/experimental_model_research/run-requests/generate-residual-pytorch-bounded-m1-v3.txt'
          actual="$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Generator PR must add exactly the canonical v3 marker" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          test "$(cat "$MARKER_PATH")" = "generate residual-pytorch-bounded-m1-generalization-v3"
          python tools/agents/checkpoint.py "$TASK_PATH" --require-checkpoint

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: false
          python-version: "3.12"

      - name: Install numeric request dependencies
        run: uv pip install numpy pandas

      - name: Generate canonical request bytes
        run: |
          python -m ai_platform.scripts.residual_pytorch_bounded_m1_v3_run_request \
            --print-canonical > /tmp/residual-pytorch-bounded-m1-generalization-v3.json

      - name: Commit exactly the request to the prepared branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$REQUEST_BRANCH"
          git checkout -B "$REQUEST_BRANCH" "origin/$REQUEST_BRANCH"
          test ! -e "$REQUEST_PATH"
          mkdir -p "$(dirname "$REQUEST_PATH")"
          cp /tmp/residual-pytorch-bounded-m1-generalization-v3.json "$REQUEST_PATH"
          python -m ai_platform.scripts.residual_pytorch_bounded_m1_v3_run_request "$REQUEST_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REQUEST_PATH"
          expected=$'A\tai_platform/experimental_model_research/run-requests/residual-pytorch-bounded-m1-generalization-v3.json'
          actual="$(git diff --cached --name-status)"
          test "$actual" = "$expected"
          git commit -m "run(ai-platform): execute bounded M1 v3 generalization"
          git push origin HEAD:"$REQUEST_BRANCH"
