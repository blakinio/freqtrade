name: Residual PyTorch M1 Audit Failure Log

on:
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - ".github/workflows/residual-pytorch-m1-audit-failure-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact terminal audit job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/89858984806/logs" \
            --output evidence/job.log
          grep -nEi \
            'traceback|error|exception|failed|failure|fatal|invalid|missing|not found|no such|valueerror|runtimeerror|systemexit' \
            evidence/job.log | tail -n 300 > evidence/failures.txt || true
          tail -n 500 evidence/job.log > evidence/tail.txt
      - name: Upload exact audit failure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: residual-pytorch-m1-audit-failure-log
          path: evidence/
          if-no-files-found: error
          retention-days: 1
