name: Residual PyTorch M1 Canonical Request After Epoch Fix

on:
  pull_request:
    types: [synchronize]
    branches:
      - develop
    paths:
      - ".github/workflows/residual-pytorch-m1-canonical-request-after-epoch-fix.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact probe commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependency-light generator requirements
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Generate current canonical request
        run: |
          request_path="ai_platform/experimental_model_research/run-requests/residual-pytorch-bounded-m1-execution-v1.json"
          mkdir -p "$(dirname "$request_path")"
          python -m ai_platform.scripts.residual_pytorch_bounded_m1_run_request \
            --print-canonical > "$request_path"
          python -m ai_platform.scripts.residual_pytorch_bounded_m1_run_request \
            "$request_path"
          cp "$request_path" canonical-request.json
      - name: Upload canonical request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: residual-pytorch-m1-canonical-request-after-epoch-fix
          path: canonical-request.json
          if-no-files-found: error
          retention-days: 1
