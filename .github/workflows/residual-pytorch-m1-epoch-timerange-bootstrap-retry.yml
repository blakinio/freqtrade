name: Residual PyTorch M1 Epoch Timerange Bootstrap Retry

on:
  pull_request:
    types: [synchronize]
    branches:
      - develop
    paths:
      - ".github/workflows/residual-pytorch-m1-epoch-timerange-bootstrap-retry.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact fix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Reapply exact verified correction
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BOOTSTRAP_HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path(
              ".github/workflows/residual-pytorch-m1-epoch-timerange-bootstrap.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Validate corrected orchestration"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          Path("/tmp/apply-epoch-timerange.py").write_text(
              dedent(source[start:end]), encoding="utf-8"
          )
          PY
          python /tmp/apply-epoch-timerange.py
      - name: Validate corrected orchestration
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[develop]"
          pytest -q \
            tests/ai_platform/test_run_experiment.py \
            tests/ai_platform/test_protected_final_holdout.py \
            tests/ai_platform/test_residual_pytorch_bounded_m1_execution.py
          python tools/agents/checkpoint.py \
            docs/agents/tasks/FTAI-20260726-residual-pytorch-bounded-m1-execution.md \
            --require-checkpoint
          python -m ai_platform.scripts.residual_pytorch_bounded_m1_execution contract
      - name: Commit verified non-workflow changes
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/experiments/schema-v1.json \
            ai_platform/scripts/protected_final_holdout.py \
            ai_platform/scripts/run_experiment.py \
            docs/agents/tasks/FTAI-20260726-residual-pytorch-bounded-m1-execution.md \
            tests/ai_platform/test_protected_final_holdout.py \
            tests/ai_platform/test_run_experiment.py
          git commit -m "fix(ai-platform): accept epoch timeranges in orchestration"
          git push origin "HEAD:${BRANCH_NAME}"
