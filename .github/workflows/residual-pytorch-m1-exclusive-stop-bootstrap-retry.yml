name: Residual PyTorch M1 Exclusive Stop Bootstrap Retry

on:
  pull_request:
    types: [synchronize]
    branches:
      - develop
    paths:
      - ".github/workflows/residual-pytorch-m1-exclusive-stop-bootstrap-retry.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact fix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Reapply exact fail-closed patch
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BOOTSTRAP_HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path(
              ".github/workflows/residual-pytorch-m1-exclusive-stop-bootstrap.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Validate corrected bounded infrastructure"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          Path("/tmp/apply-exclusive-stop.py").write_text(
              dedent(source[start:end]), encoding="utf-8"
          )
          PY
          sed -i 's/status: active/status: validating/' /tmp/apply-exclusive-stop.py
          python /tmp/apply-exclusive-stop.py
      - name: Validate corrected bounded infrastructure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e .
          python -m unittest discover -s tests/ai_platform \
            -p 'test_residual_pytorch_bounded_m1_execution.py'
          python tools/agents/checkpoint.py \
            docs/agents/tasks/FTAI-20260726-residual-pytorch-bounded-m1-execution.md \
            --require-checkpoint
          python -m ai_platform.scripts.residual_pytorch_bounded_m1_execution contract
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("ai_platform/experimental_model_research/residual-pytorch-bounded-m1-execution-contract-v1.json"),
              *Path("ai_platform/experiments").glob("residual-pytorch-m1-*-v1.json"),
          ]
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          PY
      - name: Commit corrected non-workflow infrastructure
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD -- \
            .github/workflows/residual-pytorch-bounded-m1-execution.yml
          git add \
            ai_platform/experimental_model_research/residual-pytorch-bounded-m1-execution-contract-v1.json \
            ai_platform/experiments/residual-pytorch-m1-data-audit-v1.json \
            ai_platform/experiments/residual-pytorch-m1-lightgbm-v1.json \
            ai_platform/experiments/residual-pytorch-m1-residual-mlp-v1.json \
            ai_platform/experiments/residual-pytorch-m1-seeded-mlp-v1.json \
            ai_platform/scripts/residual_pytorch_bounded_m1_execution.py \
            docs/agents/tasks/FTAI-20260726-residual-pytorch-bounded-m1-execution.md \
            docs/ai_platform/RESIDUAL_PYTORCH_BOUNDED_M1_EXECUTION.md \
            tests/ai_platform/test_residual_pytorch_bounded_m1_execution.py
          git commit -m "fix(ai-platform): enforce bounded M1 exclusive stop"
          git push origin "HEAD:${BRANCH_NAME}"
