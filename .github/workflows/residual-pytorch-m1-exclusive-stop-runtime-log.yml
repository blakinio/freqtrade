name: Residual PyTorch M1 Exclusive Stop Runtime Log

on:
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - ".github/workflows/residual-pytorch-m1-exclusive-stop-runtime-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact runtime validation failure log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p failure-log
          curl --fail-with-body --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/89849257668/logs" \
            --output failure-log/runtime.log
          tail -n 320 failure-log/runtime.log > failure-log/runtime-tail.log
          grep -E "FAILED|ERROR|Traceback|AssertionError|checkpoint|validation failed|SystemExit|ModuleNotFoundError|ImportError|Bounded M1" \
            failure-log/runtime.log > failure-log/failure-lines.txt || true
      - name: Upload exact runtime failure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: residual-pytorch-m1-exclusive-stop-runtime-log
          path: failure-log/
          if-no-files-found: error
          retention-days: 1
