name: Residual PyTorch M1 Failure Evidence Bootstrap

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop
    paths:
      - ".github/workflows/residual-pytorch-m1-failure-evidence-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact fix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply minimal bounded log-tail correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runner = Path("ai_platform/scripts/run_experiment.py")
          text = runner.read_text(encoding="utf-8")
          constants_anchor = 'REPO_ROOT = Path(__file__).resolve().parents[2]\nEXPERIMENT_ID_PATTERN'
          constants_replacement = (
              'REPO_ROOT = Path(__file__).resolve().parents[2]\n'
              'LOG_TAIL_LINES = 40\n'
              'LOG_TAIL_CHAR_LIMIT = 8_000\n'
              'EXPERIMENT_ID_PATTERN'
          )
          if constants_anchor not in text:
              raise SystemExit("run_experiment constants anchor missing")
          text = text.replace(constants_anchor, constants_replacement, 1)

          helper_anchor = '''def _sha256(path: Path) -> str:\n'''
          helper = '''def _bounded_log_tail(log_path: Path) -> str:\n    try:\n        lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()\n    except OSError as exc:\n        return f"<unable to read command log: {exc}>"\n    tail = "\\n".join(lines[-LOG_TAIL_LINES:])\n    if len(tail) > LOG_TAIL_CHAR_LIMIT:\n        tail = tail[-LOG_TAIL_CHAR_LIMIT:]\n    return tail\n\n\n'''
          if helper_anchor not in text:
              raise SystemExit("run_experiment helper anchor missing")
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          failure_anchor = '''    if result.returncode != 0:\n        raise ExperimentError(f"Command failed with exit code {result.returncode}. See {log_path}")\n'''
          failure_replacement = '''    if result.returncode != 0:\n        message = f"Command failed with exit code {result.returncode}. See {log_path}"\n        tail = _bounded_log_tail(log_path)\n        if tail:\n            message += f"\\n--- bounded log tail ---\\n{tail}"\n        raise ExperimentError(message)\n'''
          if failure_anchor not in text:
              raise SystemExit("run_experiment failure anchor missing")
          runner.write_text(text.replace(failure_anchor, failure_replacement, 1), encoding="utf-8")

          tests = Path("tests/ai_platform/test_run_experiment.py")
          test_text = tests.read_text(encoding="utf-8")
          import_anchor = 'from pathlib import Path\n'
          if import_anchor not in test_text:
              raise SystemExit("test import anchor missing")
          test_text = test_text.replace(import_anchor, import_anchor + 'from types import SimpleNamespace\n', 1)
          runner_import_anchor = '''    load_manifest,\n    validate_research_config,\n'''
          if runner_import_anchor not in test_text:
              raise SystemExit("test runner import anchor missing")
          test_text = test_text.replace(
              runner_import_anchor,
              '''    load_manifest,\n    run_logged,\n    validate_research_config,\n''',
              1,
          )
          test_case = '''\n\ndef test_run_logged_includes_only_bounded_failure_tail(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    log_path = tmp_path / "failed.log"\n\n    def fake_run(*args, stdout, **kwargs):\n        for index in range(80):\n            stdout.write(f"line-{index:03d}\\n")\n        return SimpleNamespace(returncode=2)\n\n    monkeypatch.setattr("ai_platform.scripts.run_experiment.subprocess.run", fake_run)\n\n    with pytest.raises(ExperimentError) as exc_info:\n        run_logged(["freqtrade", "backtesting"], log_path=log_path)\n\n    message = str(exc_info.value)\n    assert "--- bounded log tail ---" in message\n    assert "line-079" in message\n    assert "line-040" in message\n    assert "line-039" not in message\n    assert "line-000" not in message\n'''
          if "test_run_logged_includes_only_bounded_failure_tail" in test_text:
              raise SystemExit("bounded failure-tail test already present")
          tests.write_text(test_text.rstrip() + test_case + "\n", encoding="utf-8")
          PY
      - name: Validate minimal correction
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python -m pip install --disable-pip-version-check -e ".[develop]"
            pytest -q \
              tests/ai_platform/test_run_experiment.py \
              tests/ai_platform/test_protected_final_holdout.py \
              tests/ai_platform/test_residual_pytorch_bounded_m1_execution.py
            python -m ai_platform.scripts.residual_pytorch_bounded_m1_execution contract
            pre-commit run --files \
              ai_platform/scripts/run_experiment.py \
              tests/ai_platform/test_run_experiment.py
          } 2>&1 | tee validation.log
      - name: Upload bootstrap validation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: residual-pytorch-m1-failure-evidence-bootstrap-validation
          path: validation.log
          if-no-files-found: warn
          retention-days: 1
      - name: Commit verified target changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/scripts/run_experiment.py tests/ai_platform/test_run_experiment.py
          git commit -m "fix(ai-platform): surface bounded experiment log tails"
          git push origin "HEAD:${HEAD_BRANCH}"
