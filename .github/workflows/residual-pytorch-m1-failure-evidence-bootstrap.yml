name: Residual PyTorch M1 Failure Evidence Bootstrap

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop
    paths:
      - ".github/workflows/residual-pytorch-m1-failure-evidence-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PATCH_SCRIPT_ZLIB_B64: 
    steps:
      - name: Checkout exact fix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply bounded failure-evidence correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          import zlib

          source = zlib.decompress(base64.b64decode(os.environ["PATCH_SCRIPT_ZLIB_B64"]))
          exec(compile(source, "<failure-evidence-bootstrap>", "exec"))
          PY
      - name: Validate bounded correction
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[develop]"
          pytest -q \
            tests/ai_platform/test_run_experiment.py \
            tests/ai_platform/test_protected_final_holdout.py \
            tests/ai_platform/test_residual_pytorch_bounded_m1_execution.py
          python tools/agents/checkpoint.py \
            docs/agents/tasks/FTAI-20260726-residual-pytorch-bounded-m1-execution.md \
            --require-checkpoint
          python -m ai_platform.scripts.residual_pytorch_bounded_m1_execution contract
          pre-commit run --files \
            ai_platform/scripts/run_experiment.py \
            .github/workflows/residual-pytorch-bounded-m1-execution.yml \
            docs/agents/tasks/FTAI-20260726-residual-pytorch-bounded-m1-execution.md \
            tests/ai_platform/test_run_experiment.py
      - name: Commit verified non-bootstrap changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/scripts/run_experiment.py \
            .github/workflows/residual-pytorch-bounded-m1-execution.yml \
            docs/agents/tasks/FTAI-20260726-residual-pytorch-bounded-m1-execution.md \
            tests/ai_platform/test_run_experiment.py
          git commit -m "fix(ai-platform): persist bounded experiment failures"
          git push origin "HEAD:${HEAD_BRANCH}"
