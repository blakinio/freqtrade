name: Residual PyTorch M1 Matrix Audit Failure Log

on:
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - ".github/workflows/residual-pytorch-m1-matrix-audit-failure-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact terminal matrix-audit job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/89936807295/logs" \
            --output evidence/job.log
          grep -nE "Traceback|Error|ERROR|error|failed|Failure|matrix|Matrix|feature|Feature|timerange|ResidualPyTorch" \
            evidence/job.log | tail -n 250 > evidence/grep-tail.txt || true
          tail -n 350 evidence/job.log > evidence/job-tail.txt
      - name: Upload exact matrix-audit failure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: residual-pytorch-m1-matrix-audit-failure-log
          path: evidence
          if-no-files-found: error
          retention-days: 1
