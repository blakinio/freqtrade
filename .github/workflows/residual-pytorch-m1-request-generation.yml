name: Residual PyTorch M1 Request Generation

on:
  push:
    branches:
      - tmp/residual-pytorch-m1-request-generation

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact generator commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install numeric validation dependencies
        run: python -m pip install --disable-pip-version-check --quiet numpy pandas

      - name: Generate canonical request from merged inputs
        run: |
          mkdir -p generated
          python -m ai_platform.scripts.residual_pytorch_bounded_m1_run_request \
            --print-canonical > generated/residual-pytorch-bounded-m1-execution-v1.json
          python -m json.tool generated/residual-pytorch-bounded-m1-execution-v1.json > /dev/null

      - name: Upload canonical request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: residual-pytorch-m1-canonical-request-${{ github.sha }}
          path: generated/residual-pytorch-bounded-m1-execution-v1.json
          if-no-files-found: error
          retention-days: 1
