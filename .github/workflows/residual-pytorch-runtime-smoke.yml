name: Residual PyTorch Runtime Smoke

on:
  pull_request:
    branches:
      - develop
    paths:
      - "ai_platform/configs/freqai-residual-pytorch-research.example.json"
      - "ai_platform/experimental_model_research/residual-pytorch-runtime-smoke-contract-v1.json"
      - "ai_platform/freqaimodels/ResidualPyTorchRegressor.py"
      - "ai_platform/freqaimodels/residual_mlp_components.py"
      - "ai_platform/scripts/residual_pytorch_runtime_smoke.py"
      - "ai_platform/scripts/residual_pytorch_runtime_smoke_contract.py"
      - "docs/agents/tasks/FTAI-20260726-residual-pytorch-runtime-smoke.md"
      - "docs/ai_platform/RESIDUAL_PYTORCH_RUNTIME_SMOKE.md"
      - "tests/ai_platform/test_residual_pytorch_runtime_smoke_contract.py"
      - ".github/workflows/residual-pytorch-runtime-smoke.yml"
      - "pyproject.toml"
  push:
    branches:
      - develop
    paths:
      - "ai_platform/configs/freqai-residual-pytorch-research.example.json"
      - "ai_platform/experimental_model_research/residual-pytorch-runtime-smoke-contract-v1.json"
      - "ai_platform/freqaimodels/ResidualPyTorchRegressor.py"
      - "ai_platform/freqaimodels/residual_mlp_components.py"
      - "ai_platform/scripts/residual_pytorch_runtime_smoke.py"
      - "ai_platform/scripts/residual_pytorch_runtime_smoke_contract.py"
      - "docs/ai_platform/RESIDUAL_PYTORCH_RUNTIME_SMOKE.md"
      - "tests/ai_platform/test_residual_pytorch_runtime_smoke_contract.py"
      - ".github/workflows/residual-pytorch-runtime-smoke.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: residual-pytorch-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    name: Residual PyTorch synthetic lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Validate active task checkpoint
        if: github.event_name == 'pull_request'
        run: >-
          python tools/agents/checkpoint.py
          docs/agents/tasks/FTAI-20260726-residual-pytorch-runtime-smoke.md
          --require-checkpoint

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FreqAI runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --quiet
          -e ".[freqai,freqai_rl,develop]" ruff==0.15.21

      - name: Validate bounded runtime-smoke contract
        run: python -m ai_platform.scripts.residual_pytorch_runtime_smoke_contract

      - name: Run AI platform tests
        id: ai-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -o addopts='' \
            --confcutdir=tests/ai_platform tests/ai_platform \
            2>&1 | tee residual-pytorch-ai-platform-tests.log

      - name: Run Ruff
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check ai_platform tests/ai_platform \
            2>&1 | tee residual-pytorch-ruff.log

      - name: Run Ruff format check
        id: ruff-format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ruff format --check ai_platform tests/ai_platform \
            2>&1 | tee residual-pytorch-ruff-format.log

      - name: Run pre-commit
        id: pre-commit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pre_commit run --all-files \
            2>&1 | tee residual-pytorch-pre-commit.log

      - name: Run Residual PyTorch runtime smoke
        id: runtime-smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ai_platform.scripts.residual_pytorch_runtime_smoke \
            --output residual-pytorch-runtime-smoke-report.json \
            2>&1 | tee residual-pytorch-runtime-smoke.log

      - name: Upload runtime-smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: residual-pytorch-runtime-smoke-${{ github.event.pull_request.number || github.run_number }}
          path: |
            residual-pytorch-runtime-smoke-report.json
            residual-pytorch-runtime-smoke.log
            residual-pytorch-ai-platform-tests.log
            residual-pytorch-ruff.log
            residual-pytorch-ruff-format.log
            residual-pytorch-pre-commit.log
          if-no-files-found: error
          retention-days: 30

      - name: Verify supported outcome
        if: always()
        env:
          AI_TESTS_OUTCOME: ${{ steps.ai-tests.outcome }}
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          RUFF_FORMAT_OUTCOME: ${{ steps.ruff-format.outcome }}
          PRE_COMMIT_OUTCOME: ${{ steps.pre-commit.outcome }}
          RUNTIME_SMOKE_OUTCOME: ${{ steps.runtime-smoke.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          validations = {
              "AI platform tests": os.environ["AI_TESTS_OUTCOME"],
              "Ruff": os.environ["RUFF_OUTCOME"],
              "Ruff format": os.environ["RUFF_FORMAT_OUTCOME"],
              "pre-commit": os.environ["PRE_COMMIT_OUTCOME"],
          }
          failed = [name for name, outcome in validations.items() if outcome != "success"]
          if failed:
              raise SystemExit(
                  "Repository validation failed: " + ", ".join(failed)
                  + "; inspect uploaded diagnostics"
              )
          report_path = Path("residual-pytorch-runtime-smoke-report.json")
          if not report_path.is_file():
              raise SystemExit("Runtime smoke did not produce a machine-readable report")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if os.environ["RUNTIME_SMOKE_OUTCOME"] != "success":
              raise SystemExit(
                  f"Runtime smoke failed with outcome: {report.get('outcome')}"
              )
          if report.get("outcome") != "runtime_supported":
              raise SystemExit(f"Unexpected runtime outcome: {report.get('outcome')}")
          PY
