name: RL-v2 Canonical Request After Python Path Repair Diagnostic

on:
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - ".github/workflows/rl-v2-canonical-request-after-pythonpath-repair-diagnostic.yml"

permissions:
  contents: read

jobs:
  generate-canonical-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Generate and validate canonical request
        run: |
          set -euo pipefail
          python -m ai_platform.scripts.rl_v2_historical_training_execution_run_request \
            --print-canonical > rl-v2-historical-training-execution-v1.json
          python -m ai_platform.scripts.rl_v2_historical_training_execution_run_request \
            rl-v2-historical-training-execution-v1.json
          sha256sum rl-v2-historical-training-execution-v1.json

      - name: Upload canonical request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-canonical-request-after-pythonpath-repair
          path: rl-v2-historical-training-execution-v1.json
          if-no-files-found: error
          retention-days: 1
