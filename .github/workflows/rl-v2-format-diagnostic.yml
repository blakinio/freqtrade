name: RL-v2 Format Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - "tests/ai_platform/test_rl_v2_execution_preflight.py"
      - ".github/workflows/rl-v2-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  ruff-format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check --quiet ruff==0.15.21

      - name: Capture Ruff format diff
        run: >-
          python -m ruff format --diff tests/ai_platform/test_rl_v2_execution_preflight.py
          > rl-v2-ruff-format-test.diff || true

      - name: Upload Ruff format diff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rl-v2-ruff-format-test-diff
          path: rl-v2-ruff-format-test.diff
          if-no-files-found: error
          retention-days: 1
