name: RL-v2 Format Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
    paths:
      - ".github/workflows/rl-v2-format-diagnostic.yml"
      - "ai_platform/freqaimodels/DesiredPositionReinforcementLearner.py"
      - "ai_platform/strategies/AiDesiredPositionRLResearchStrategy.py"
      - "tests/ai_platform/test_rl_v2_runtime_integration.py"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check --quiet ruff==0.15.21
      - name: Capture formatter diff
        run: |
          mkdir -p ruff-format-diagnostic
          ruff format --diff \
            ai_platform/freqaimodels/DesiredPositionReinforcementLearner.py \
            ai_platform/strategies/AiDesiredPositionRLResearchStrategy.py \
            tests/ai_platform/test_rl_v2_runtime_integration.py \
            > ruff-format-diagnostic/ruff-format.diff || true
      - name: Upload formatter diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-ruff-format-diagnostic
          path: ruff-format-diagnostic/ruff-format.diff
          if-no-files-found: error
          retention-days: 1
