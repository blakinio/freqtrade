name: RL-v2 Historical Execution Pre-commit Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/rl-v2-historical-execution-precommit-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose-precommit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --quiet pre-commit

      - name: Capture complete pre-commit output
        shell: bash
        run: |
          set +e
          pre-commit run --all-files > precommit-output.txt 2>&1
          status=$?
          cat precommit-output.txt
          printf '%s\n' "$status" > precommit-status.txt
          exit 0

      - name: Upload diagnostic output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rl-v2-historical-execution-precommit-output
          path: |
            precommit-output.txt
            precommit-status.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preserve pre-commit result
        shell: bash
        run: test "$(cat precommit-status.txt)" -eq 0
