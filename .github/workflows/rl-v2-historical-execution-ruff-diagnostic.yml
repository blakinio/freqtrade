name: RL-v2 Historical Execution Ruff Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/rl-v2-historical-execution-ruff-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose-ruff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check --quiet ruff==0.15.21

      - name: Capture Ruff output
        shell: bash
        run: |
          set +e
          ruff check ai_platform tests/ai_platform > ruff-output.txt 2>&1
          status=$?
          cat ruff-output.txt
          printf '%s\n' "$status" > ruff-status.txt
          exit 0

      - name: Upload diagnostic output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rl-v2-historical-execution-ruff-output
          path: |
            ruff-output.txt
            ruff-status.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preserve Ruff result
        shell: bash
        run: test "$(cat ruff-status.txt)" -eq 0
