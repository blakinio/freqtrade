name: RL-v2 Lifecycle Format Diff V2 Diagnostic

on:
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - ".github/workflows/rl-v2-lifecycle-format-diff-v2-diagnostic.yml"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: 6631ebc03b6cff42b3fa59a5ead9646ec366fb2c

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Produce Ruff format diff without failing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.15.21
          ruff format --diff tests/ai_platform/test_rl_v2_roi_lifecycle_alignment.py \
            > format-diff.txt || true
          test -s format-diff.txt

      - name: Upload format diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-lifecycle-format-diff-v2
          path: format-diff.txt
          retention-days: 1
          if-no-files-found: error
