name: RL-v2 Lifecycle Ruff Failure Diagnostic

on:
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - ".github/workflows/rl-v2-lifecycle-ruff-failure-diagnostic.yml"

permissions:
  actions: read
  contents: read

jobs:
  collect-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download failed AI Platform job log and extract Ruff failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/jobs/89438304479/logs \
            > job.log
          {
            grep -n -E "tests/ai_platform/test_rl_v2_roi_lifecycle_alignment|ai_platform/strategies/AiDesiredPositionRLLifecycleAlignedResearchStrategy|Found [0-9]+ error|^[A-Z][0-9]+" job.log || true
            printf '\n--- final 140 lines ---\n'
            tail -n 140 job.log
          } > ruff-tail.txt

      - name: Upload Ruff failure tail
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-lifecycle-ruff-failure-tail
          path: ruff-tail.txt
          retention-days: 1
          if-no-files-found: error
