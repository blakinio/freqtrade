name: RL-v2 Lifecycle Test Failure Diagnostic

on:
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - ".github/workflows/rl-v2-lifecycle-test-failure-diagnostic.yml"

permissions:
  actions: read
  contents: read

jobs:
  collect-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download failed AI Platform job log and extract failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/jobs/89437421195/logs \
            > job.log
          {
            grep -n -E "FAILURES|FAILED|ERROR|AssertionError|test_rl_v2_roi_lifecycle_alignment" job.log || true
            printf '\n--- final 180 lines ---\n'
            tail -n 180 job.log
          } > failure-tail.txt

      - name: Upload failure tail
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-v2-lifecycle-test-failure-tail
          path: failure-tail.txt
          retention-days: 1
          if-no-files-found: error
