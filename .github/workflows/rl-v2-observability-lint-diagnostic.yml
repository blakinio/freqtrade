name: RL-v2 observability formatting diagnostic

on:
  push:
    branches:
      - diagnostic/rl-v2-observability-lint

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: diagnostic/rl-v2-observability-lint
      - name: Apply exact Ruff fixes
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet ruff==0.15.21 >/dev/null
          ruff check --fix \
            ai_platform/scripts/rl_v2_action_observability.py \
            tests/ai_platform/test_rl_v2_action_observability.py
          ruff format \
            ai_platform/scripts/rl_v2_action_observability.py \
            tests/ai_platform/test_rl_v2_action_observability.py
      - name: Commit diagnostic formatting
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            ai_platform/scripts/rl_v2_action_observability.py \
            tests/ai_platform/test_rl_v2_action_observability.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ai_platform/scripts/rl_v2_action_observability.py \
            tests/ai_platform/test_rl_v2_action_observability.py
          git commit -m 'style(diagnostic): apply Ruff formatting'
          git push origin HEAD:diagnostic/rl-v2-observability-lint
