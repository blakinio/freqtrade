name: RL-v2 Pytest Diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - "tests/ai_platform/test_rl_v2_execution_preflight.py"
      - "ai_platform/scripts/rl_v2_execution_preflight.py"
      - "ai_platform/experimental_model_research/rl-v2-execution-preflight-v1.json"
      - ".github/workflows/rl-v2-pytest-diagnostic.yml"

permissions:
  contents: read

jobs:
  pytest-output:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime and validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check --quiet
          -e ".[freqai,freqai_rl]" pytest pytest-xdist pytest-asyncio

      - name: Capture targeted pytest output
        run: >-
          python -m pytest -q tests/ai_platform/test_rl_v2_execution_preflight.py
          > rl-v2-pytest-output.txt 2>&1 || true

      - name: Upload targeted pytest output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rl-v2-pytest-output
          path: rl-v2-pytest-output.txt
          if-no-files-found: error
          retention-days: 1
