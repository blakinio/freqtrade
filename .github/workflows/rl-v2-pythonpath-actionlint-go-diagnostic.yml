name: RL-v2 Python Path Repair Actionlint Go Install

on:
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - ".github/workflows/rl-v2-pythonpath-actionlint-go-diagnostic.yml"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: 5411ad46f9b38de8c99cce04416684e5a984a1f1

      - name: Install actionlint v1.7.12
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate repaired workflow
        run: actionlint .github/workflows/ai-platform-rl-v2-historical-training-execution.yml
