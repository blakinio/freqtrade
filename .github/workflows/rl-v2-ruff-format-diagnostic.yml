name: RL-v2 Ruff Format Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "ai_platform/freqaimodels/DesiredPositionReinforcementLearner.py"
      - "ai_platform/strategies/AiDesiredPositionRLResearchStrategy.py"
      - "tests/ai_platform/test_rl_v2_runtime_integration.py"
      - ".github/workflows/rl-v2-ruff-format-diagnostic.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install exact Ruff version
        run: python -m pip install --disable-pip-version-check ruff==0.15.21

      - name: Format RL-v2 owned Python files
        run: >-
          ruff format
          ai_platform/freqaimodels/DesiredPositionReinforcementLearner.py
          ai_platform/strategies/AiDesiredPositionRLResearchStrategy.py
          tests/ai_platform/test_rl_v2_runtime_integration.py

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            ai_platform/freqaimodels/DesiredPositionReinforcementLearner.py
            ai_platform/strategies/AiDesiredPositionRLResearchStrategy.py
            tests/ai_platform/test_rl_v2_runtime_integration.py
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Files already match Ruff 0.15.21."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "style(ai-platform): apply Ruff 0.15.21 formatter"
          git push origin "HEAD:${{ github.head_ref }}"
