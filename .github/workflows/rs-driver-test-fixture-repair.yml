name: RS driver test fixture repair

on:
  push:
    branches:
      - codex/portal-runtime-supervisor-1355
    paths:
      - ".github/workflows/rs-driver-test-fixture-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - run: python tools/portal_audit/rs_fix_driver_tests.py
      - run: python -m py_compile tests/ai_platform/portal/execution/test_driver.py
      - name: Commit fixture repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ai_platform/portal/execution/test_driver.py
          git diff --cached --check
          git commit -m "test(portal): align driver fixtures with immutable identities"
          git push origin HEAD:"$GITHUB_REF_NAME"
