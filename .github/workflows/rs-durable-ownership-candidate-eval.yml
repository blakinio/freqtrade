name: RS Durable Ownership Finalize

on:
  push:
    branches:
      - codex/portal-runtime-supervisor-1355

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install focused validation dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff mypy jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6" "httpx>=0.24.1" fastapi pyjwt cryptography "PyYAML>=6.0"
      - name: Apply durable ownership repair
        run: python tools/rs_durable_ownership_repair.py
      - name: Format generated files
        run: python -m ruff format ai_platform/portal/runtime_supervisor/service.py ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
      - name: Ruff focused scope
        run: python -m ruff check --ignore BLE001,TRY004 ai_platform/portal/runtime_supervisor/service.py ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py tests/ai_platform/portal/execution/test_immutable_runtime_identity.py tests/ai_platform/portal/runtime_supervisor/test_durable_ownership_restart.py
      - name: Mypy production scope
        run: python -m mypy ai_platform/portal/runtime_supervisor/service.py ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py
      - name: Focused regression suite
        run: python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform tests/ai_platform/portal/runtime_supervisor tests/ai_platform/portal/execution/test_driver.py tests/ai_platform/portal/execution/test_host_isolation_cleanup.py tests/ai_platform/portal/execution/test_immutable_runtime_identity.py
      - name: Verify generated diff is bounded
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              "ai_platform/portal/runtime_supervisor/service.py",
              "ai_platform/portal/execution/driver.py",
              "ai_platform/portal/execution/host_isolation.py",
              "tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py",
          }
          changed = set(subprocess.run(
              ["git", "diff", "--name-only"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines())
          if changed != expected:
              raise SystemExit(f"unexpected generated diff: {sorted(changed)}")
          PY
      - name: Commit verified repair and remove staging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/codex/portal-runtime-supervisor-1355 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git rm tools/rs_durable_ownership_repair.py .github/workflows/rs-durable-ownership-candidate-eval.yml
          git add ai_platform/portal/runtime_supervisor/service.py \
            ai_platform/portal/execution/driver.py \
            ai_platform/portal/execution/host_isolation.py \
            tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(portal): persist runtime ownership across supervisor restart"
          gh auth setup-git
          git push origin HEAD:refs/heads/codex/portal-runtime-supervisor-1355
