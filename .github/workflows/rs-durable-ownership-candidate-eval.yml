name: RS Durable Ownership Candidate Eval

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install focused validation dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff mypy jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6" "httpx>=0.24.1" fastapi pyjwt cryptography "PyYAML>=6.0"
      - name: Apply bounded candidate patch in checkout
        run: python tools/rs_durable_ownership_repair.py
      - name: Format candidate
        run: python -m ruff format ai_platform/portal/runtime_supervisor/service.py ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
      - name: Ruff candidate
        run: python -m ruff check ai_platform/portal/runtime_supervisor/service.py ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
      - name: Mypy candidate
        run: python -m mypy ai_platform/portal/runtime_supervisor/service.py ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py
      - name: Focused tests
        run: python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform tests/ai_platform/portal/runtime_supervisor tests/ai_platform/portal/execution/test_driver.py tests/ai_platform/portal/execution/test_host_isolation_cleanup.py tests/ai_platform/portal/execution/test_immutable_runtime_identity.py
      - name: Emit candidate files
        shell: bash
        run: |
          set -euo pipefail
          for path in ai_platform/portal/runtime_supervisor/service.py ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py; do
            echo "BEGIN_FILE_BASE64:$path"
            base64 -w0 "$path"
            echo
            echo "END_FILE_BASE64:$path"
          done
