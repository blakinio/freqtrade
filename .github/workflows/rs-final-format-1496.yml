name: RS final format 1496

on:
  push:
    branches:
      - codex/portal-runtime-supervisor-1355

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/portal-runtime-supervisor-1355
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply exact repository Ruff formatting
        run: |
          python -m pip install 'ruff==0.15.21'
          ruff format ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py tests/ai_platform/portal/execution/test_host_isolation_cleanup.py
          ruff check ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py tests/ai_platform/portal/execution/test_host_isolation_cleanup.py
      - name: Commit formatting and remove one-shot workflow
        run: |
          rm .github/workflows/rs-final-format-1496.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py tests/ai_platform/portal/execution/test_host_isolation_cleanup.py .github/workflows/rs-final-format-1496.yml
          git diff --cached --quiet && exit 0
          git commit -m 'style(portal): apply final runtime supervisor formatting'
          git push origin HEAD:codex/portal-runtime-supervisor-1355
