name: RS final immutable identity formatting v2

on:
  push:
    branches:
      - codex/portal-runtime-supervisor-1355
    paths:
      - ".github/workflows/rs-final-format-v2.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Apply only known formatter deltas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          driver = Path("ai_platform/portal/execution/driver.py")
          s = driver.read_text()
          s = s.replace(
              "    def has_current_generation_evidence(self, runtime_id: str, spec: RuntimeContainerSpec) -> bool:\n",
              "    def has_current_generation_evidence(\n        self, runtime_id: str, spec: RuntimeContainerSpec\n    ) -> bool:\n",
          )
          s = s.replace(
              '        result = self._runner.run(("docker", "inspect", "--format", "{{.State.Status}}", container_id))\n',
              '        result = self._runner.run(\n            ("docker", "inspect", "--format", "{{.State.Status}}", container_id)\n        )\n',
          )
          s = s.replace(
              "    def _clear_generation_evidence(self, runtime_id: str, *, keep_container_id: bool = False) -> None:\n",
              "    def _clear_generation_evidence(\n        self, runtime_id: str, *, keep_container_id: bool = False\n    ) -> None:\n",
          )
          driver.write_text(s)

          host = Path("ai_platform/portal/execution/host_isolation.py")
          s = host.read_text()
          s = s.replace(
              '        current = self._runner.run(("docker", "network", "inspect", "--format", "{{json .}}", network_name))\n',
              '        current = self._runner.run(\n            ("docker", "network", "inspect", "--format", "{{json .}}", network_name)\n        )\n',
          )
          s = s.replace(
              "    def _require_network_identity(\n        network: dict[str, Any], runtime_id: str, expected: str\n    ) -> None:\n",
              "    def _require_network_identity(network: dict[str, Any], runtime_id: str, expected: str) -> None:\n",
          )
          host.write_text(s)

          tests = Path("tests/ai_platform/portal/execution/test_host_isolation_cleanup.py")
          s = tests.read_text()
          s = s.replace(
              "def _owned_backend(runner: _Runner, tmp_path: Path) -> LinuxNftablesBtrfsIsolationAttestor:\n",
              "def _owned_backend(\n    runner: _Runner, tmp_path: Path\n) -> LinuxNftablesBtrfsIsolationAttestor:\n",
          )
          tests.write_text(s)
          PY
          python -m py_compile \
            ai_platform/portal/execution/driver.py \
            ai_platform/portal/execution/host_isolation.py \
            tests/ai_platform/portal/execution/test_host_isolation_cleanup.py
          git diff --check
      - name: Remove temporary workflows and push clean head
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            .github/workflows/rs-final-format.yml \
            .github/workflows/rs-final-format-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/portal/execution/driver.py \
            ai_platform/portal/execution/host_isolation.py \
            tests/ai_platform/portal/execution/test_host_isolation_cleanup.py
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(portal): finalize immutable identity repair"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase "origin/$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
