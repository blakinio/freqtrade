name: RS final immutable identity formatting

on:
  push:
    branches:
      - codex/portal-runtime-supervisor-1355
    paths:
      - ".github/workflows/rs-final-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Format only repaired Python files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pre-commit
          pre-commit run ruff-format --files \
            ai_platform/portal/execution/driver.py \
            ai_platform/portal/execution/host_isolation.py \
            tests/ai_platform/portal/execution/test_host_isolation_cleanup.py || true
          pre-commit run ruff --files \
            ai_platform/portal/execution/driver.py \
            ai_platform/portal/execution/host_isolation.py \
            tests/ai_platform/portal/execution/test_host_isolation_cleanup.py
          pre-commit run ruff-format --files \
            ai_platform/portal/execution/driver.py \
            ai_platform/portal/execution/host_isolation.py \
            tests/ai_platform/portal/execution/test_host_isolation_cleanup.py
          git rm .github/workflows/rs-final-format.yml
          git diff --check
      - name: Commit final formatting and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/portal/execution/driver.py \
            ai_platform/portal/execution/host_isolation.py \
            tests/ai_platform/portal/execution/test_host_isolation_cleanup.py \
            .github/workflows/rs-final-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(portal): format immutable identity repair"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
