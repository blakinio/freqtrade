name: RS temporary artifact cleanup

on:
  push:
    branches:
      - codex/portal-runtime-supervisor-1355
    paths:
      - ".github/workflows/rs-temp-artifact-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Remove repair-only artifacts
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            tools/portal_audit/rs_fix_driver_attestation.py \
            tools/portal_audit/rs_fix_driver_capture_only.py \
            tools/portal_audit/rs_fix_driver_identity.py \
            tools/portal_audit/rs_fix_driver_inspect.py \
            tools/portal_audit/rs_fix_driver_targets.py \
            tools/portal_audit/rs_fix_driver_tests.py \
            tools/portal_audit/rs_fix_network_capture.py \
            tools/portal_audit/rs_fix_network_cleanup.py \
            tools/portal_audit/rs_fresh_repair_marker.txt \
            .github/workflows/rs-temp-artifact-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "chore(portal): remove temporary repair artifacts"
          git push origin HEAD:"$GITHUB_REF_NAME"
