name: Sync Runtime Supervisor 1355 Develop

on:
  push:
    branches:
      - codex/portal-runtime-supervisor-1355
    paths:
      - .github/workflows/sync-runtime-supervisor-1355-develop.yml

permissions:
  contents: write

jobs:
  sync-develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/portal-runtime-supervisor-1355
          fetch-depth: 0

      - name: Merge exact current develop without force
        shell: bash
        env:
          EXPECTED_PARENT: a15f634fb5d6d98dde8c47637dbb950044362bf5
          EXPECTED_DEVELOP: c0c484a1fe9139e6039e0c79512c3b0527c32446
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/sync-runtime-supervisor-1355-develop.yml"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$EXPECTED_DEVELOP"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff "$EXPECTED_DEVELOP" -m 'merge(develop): sync runtime supervisor #1355'
          git diff --check "$EXPECTED_DEVELOP"...HEAD
          git push origin HEAD:codex/portal-runtime-supervisor-1355
