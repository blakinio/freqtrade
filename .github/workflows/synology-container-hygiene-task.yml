name: Synology Container Hygiene Task

on:
  push:
    branches:
      - chore/synology-container-hygiene-20260811
    paths:
      - ".github/workflows/synology-container-hygiene-task.yml"

permissions:
  contents: read

concurrency:
  group: synology-container-hygiene-task
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: [freqtrade-staging]
    timeout-minutes: 5
    steps:
      - name: Inventory Docker resources read-only
        run: |
          set -euo pipefail
          docker version >/dev/null

          echo "=== CONTAINERS ==="
          for id in $(docker ps -aq --no-trunc); do
            docker inspect --format 'CONTAINER|{{.Id}}|{{.Name}}|{{.Config.Image}}|{{.State.Status}}|{{.State.Running}}|{{.HostConfig.RestartPolicy.Name}}|{{.Created}}|compose_project={{index .Config.Labels "com.docker.compose.project"}}|compose_service={{index .Config.Labels "com.docker.compose.service"}}|compose_config={{index .Config.Labels "com.docker.compose.project.config_files"}}|compose_workdir={{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$id"
            docker inspect --format '{{range .Mounts}}MOUNT|{{$.Id}}|{{.Type}}|{{.Source}}|{{.Destination}}|rw={{.RW}}{{println}}{{end}}' "$id"
          done

          echo "=== COMPOSE PROJECTS ==="
          docker compose ls --all --format json || true

          echo "=== COUNTS ==="
          echo "all=$(docker ps -aq | wc -l | tr -d ' ')"
          echo "running=$(docker ps -q | wc -l | tr -d ' ')"
          echo "exited=$(docker ps -aq --filter status=exited | wc -l | tr -d ' ')"
          echo "created=$(docker ps -aq --filter status=created | wc -l | tr -d ' ')"
          echo "dead=$(docker ps -aq --filter status=dead | wc -l | tr -d ' ')"
