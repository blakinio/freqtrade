name: Temporary Portal SQLite Repair Format

on:
  pull_request:
    types: [synchronize]
    branches: [develop]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/portal-sqlite-login-lock-20260802' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/portal-sqlite-login-lock-20260802
          fetch-depth: 0

      - name: Normalize test formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/ai_platform/portal/identity/test_identity_lifecycle.py")
          text = path.read_text(encoding="utf-8")
          old = '''from concurrent.futures import ThreadPoolExecutor, TimeoutError as FutureTimeoutError
          from dataclasses import dataclass
          from pathlib import Path
          from threading import Event
          from datetime import UTC, datetime, timedelta
          from urllib.parse import parse_qs, urlencode, urlparse
          '''
          new = '''from concurrent.futures import ThreadPoolExecutor, TimeoutError as FutureTimeoutError
          from dataclasses import dataclass
          from datetime import UTC, datetime, timedelta
          from pathlib import Path
          from threading import Event
          from urllib.parse import parse_qs, urlencode, urlparse
          '''
          if old not in text:
              raise SystemExit("expected import block not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              "    assert response.status_code == 422\n\n\n\ndef test_file_sqlite_engine",
              "    assert response.status_code == 422\n\n\ndef test_file_sqlite_engine",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-portal-sqlite-login-lock-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(portal): format sqlite login lock regression"
          git push origin HEAD:fix/portal-sqlite-login-lock-20260802
