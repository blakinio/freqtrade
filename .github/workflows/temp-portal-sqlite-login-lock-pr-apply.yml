name: Temporary Portal SQLite Repair PR Apply

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/portal-sqlite-login-lock-20260802' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/portal-sqlite-login-lock-20260802
          fetch-depth: 0

      - name: Apply repair
        run: python3 .github/scripts/apply_portal_sqlite_login_lock_repair.py

      - name: Remove temporary scaffolding and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/apply_portal_sqlite_login_lock_repair.py \
            .github/workflows/temp-portal-sqlite-login-lock-repair.yml \
            .github/workflows/temp-portal-sqlite-login-lock-pr-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(portal): release sqlite lock before OIDC exchange"
          git push origin HEAD:fix/portal-sqlite-login-lock-20260802
