name: Temporary Portal SQLite Repair Ruff

on:
  pull_request:
    types: [synchronize]
    branches: [develop]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/portal-sqlite-login-lock-20260802' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/portal-sqlite-login-lock-20260802
          fetch-depth: 0

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.21

      - name: Apply exact Ruff fixes
        run: |
          ruff check --fix tests/ai_platform/portal/identity/test_identity_lifecycle.py
          ruff format tests/ai_platform/portal/identity/test_identity_lifecycle.py

      - name: Remove workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-portal-sqlite-login-lock-ruff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(portal): apply exact ruff import order"
          git push origin HEAD:fix/portal-sqlite-login-lock-20260802
