name: Temporary WH09 deploy registry repair

on:
  push:
    branches:
      - ops/wickhunter-wh09-production-research-deploy-control-20260808
    paths:
      - .github/workflows/temp-wh09-deploy-registry-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ops/wickhunter-wh09-production-research-deploy-control-20260808
          persist-credentials: true
          fetch-depth: 0
      - name: Register durable deployment workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/workflow-registry.yaml')
          payload = json.loads(path.read_text(encoding='utf-8'))
          workflow_path = '.github/workflows/ai-platform-wickhunter-wh09-production-research-runtime-deploy.yml'
          entry = {
              'classification': 'canonical',
              'lifecycle': 'active',
              'name': 'Deploy WickHunter WH09 Production Research Runtime',
              'owner': 'wickhunter',
              'path': workflow_path,
              'permissions': {'contents': 'read'},
              'review_date': '2027-02-02',
              'risk_class': 'high',
              'triggers': ['push'],
          }
          workflows = payload['workflows']
          existing = [item for item in workflows if item.get('path') == workflow_path]
          if existing:
              if existing != [entry]:
                  raise SystemExit('existing registry entry differs from expected contract')
          else:
              workflows.append(entry)
              workflows.sort(key=lambda item: str(item.get('path', '')))
          path.write_text(json.dumps(payload, indent=2, sort_keys=False) + '\n', encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflow-registry.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci(wickhunter): register WH09 protected deployment workflow'
          git push origin HEAD:ops/wickhunter-wh09-production-research-deploy-control-20260808
