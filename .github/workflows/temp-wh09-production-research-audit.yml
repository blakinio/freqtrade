name: Temporary WH09 production research runtime audit

on:
  push:
    branches:
      - feat/wickhunter-wh09-production-research-runtime-20260808
    paths:
      - .github/workflows/temp-wh09-production-research-audit.yml

permissions:
  contents: write

jobs:
  fresh-audit:
    name: Fresh WH09 production research acceptance audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/wickhunter-wh09-production-research-runtime-20260808
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Repair invalid test fixture only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/ai_platform_integration/test_wickhunter_production_research_runtime.py")
          text = path.read_text(encoding="utf-8")
          old = "action=CandidateAction.ENTER,"
          new = "action=CandidateAction.ENTER_LONG,"
          if old not in text:
              raise SystemExit("expected invalid CandidateAction fixture not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install bounded validator dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest numpy lightgbm==4.6.0 "pydantic>=2.2" ruff==0.15.21
      - name: Run focused research runtime tests
        run: >-
          python -m pytest -q -o addopts=''
          --confcutdir=tests/ai_platform_integration
          tests/ai_platform_integration/test_wickhunter_production_research_runtime.py
          tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py
      - name: Falsify zero-authority and frozen-threshold invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core = Path("ai_platform/wickhunter/production_research_runtime.py").read_text(encoding="utf-8")
          operator = Path("ai_platform/wickhunter/production_research_runtime_operator.py").read_text(encoding="utf-8")
          compose = Path("deploy/synology/wickhunter-production-research-runtime/compose.yaml").read_text(encoding="utf-8")
          readme = Path("deploy/synology/wickhunter-production-research-runtime/README.md").read_text(encoding="utf-8")

          required_core = (
              'FROZEN_NO_TRADE_CONFIDENCE = Decimal("0.60")',
              "FROZEN_OUTCOME_HORIZON_MS = 900_000",
              "candidate_paper_validation_authorized=False",
              "def pending_outcome_symbols",
              '"raw_probability"',
              '"calibrated_confidence"',
              '"final_decision"',
              '"record_sha256"',
              '"deterministic_replay_equivalent": False',
              '"automatic_promotion_enabled": False',
              '"trading_credentials_present": False',
              '"order_adapter_present": False',
              '"execution_enabled": False',
              '"orders_submitted": 0',
              '"live_capital_authorized": False',
          )
          for needle in required_core:
              if needle not in core:
                  raise SystemExit(f"missing core invariant: {needle}")
          if "candidate_paper_validation_authorized=True" in core:
              raise SystemExit("research runtime can enable PAPER candidate authority")
          if "--activation-root" in operator or "--activation-root" in compose:
              raise SystemExit("research runtime consumes PAPER activation")
          for forbidden in ("BINANCE_API_KEY", "BINANCE_API_SECRET", "/var/run/docker.sock", "ports:"):
              if forbidden in compose:
                  raise SystemExit(f"forbidden deployment surface: {forbidden}")
          for required in (
              'user: "65532:65532"',
              "read_only: true",
              "cap_drop:",
              "no-new-privileges:true",
              "privileged: false",
              "LIQUID20_READER_GID",
          ):
              if required not in compose:
                  raise SystemExit(f"missing deploy hardening: {required}")
          if "no_trade_confidence=0.60" not in readme:
              raise SystemExit("documentation does not bind frozen threshold")
          PY
      - name: Compile and lint exact changed implementation
        run: |
          python -m compileall -q \
            ai_platform/wickhunter/production_research_runtime.py \
            ai_platform/wickhunter/production_research_runtime_operator.py \
            deploy/synology/wickhunter-production-research-runtime/research_runtime_healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py
          ruff check \
            ai_platform/wickhunter/production_research_runtime.py \
            ai_platform/wickhunter/production_research_runtime_operator.py \
            deploy/synology/wickhunter-production-research-runtime/research_runtime_healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py
          ruff format --diff --check \
            ai_platform/wickhunter/production_research_runtime.py \
            ai_platform/wickhunter/production_research_runtime_operator.py \
            deploy/synology/wickhunter-production-research-runtime/research_runtime_healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py
      - name: Remove temporary validator and persist audited fixture repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-wh09-production-research-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          ! git diff --cached --quiet
          git commit -m "test(wickhunter): correct WH09 research audit fixture"
          git push origin HEAD:feat/wickhunter-wh09-production-research-runtime-20260808
