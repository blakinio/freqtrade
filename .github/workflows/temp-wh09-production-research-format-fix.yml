name: Temporary WH09 production research format fix

on:
  workflow_dispatch:
  push:
    branches:
      - feat/wickhunter-wh09-production-research-runtime-20260808
    paths:
      - .github/workflows/temp-wh09-production-research-format-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/wickhunter-wh09-production-research-runtime-20260808
          persist-credentials: true
          fetch-depth: 0
      - name: Repair typing and apply repository pre-commit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path("ai_platform/wickhunter/production_research_runtime.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'int(decision["decision_timestamp_ms"]) + self.identity.outcome_horizon_ms',
              'int(str(decision["decision_timestamp_ms"])) + self.identity.outcome_horizon_ms',
          )
          text = text.replace(
              'decision_timestamp_ms = int(cached_decision["decision_timestamp_ms"])',
              'decision_timestamp_ms = int(str(cached_decision["decision_timestamp_ms"]))',
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install pre-commit
          pre-commit run --all-files || true
          pre-commit run --all-files
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/wickhunter/production_research_runtime.py \
            ai_platform/wickhunter/production_research_runtime_operator.py \
            deploy/synology/wickhunter-production-research-runtime/research_runtime_healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "fix(wickhunter): satisfy WH09 typing and formatting gates"
          git push origin HEAD:feat/wickhunter-wh09-production-research-runtime-20260808
