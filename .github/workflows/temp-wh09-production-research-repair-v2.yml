name: Temporary WH09 production research runtime repair v2

on:
  push:
    branches:
      - feat/wickhunter-wh09-production-research-runtime-20260808
    paths:
      - .github/workflows/temp-wh09-production-research-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/wickhunter-wh09-production-research-runtime-20260808
          persist-credentials: true
          fetch-depth: 0
      - name: Execute bounded repair with formatter-first E501 handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path(".github/workflows/temp-wh09-production-research-repair.yml").read_text(
                  encoding="utf-8"
              )
          )
          script = workflow["jobs"]["repair"]["steps"][1]["run"]
          script = script.replace(
              "python -m ruff check --fix \\",
              "python -m ruff check --fix --ignore E501 \\",
              1,
          )
          subprocess.run(["bash", "-euo", "pipefail", "-c", script], check=True)
          PY
      - name: Remove temporary workflows and commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-wh09-production-research-repair.yml
          rm .github/workflows/temp-wh09-production-research-repair-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          ! git diff --cached --quiet
          git commit -m "fix(wickhunter): harden WH09 production research runtime"
          git push origin HEAD:feat/wickhunter-wh09-production-research-runtime-20260808
