name: Temporary WH09 production research review repair

on:
  workflow_dispatch:
  push:
    branches:
      - feat/wickhunter-wh09-production-research-runtime-20260808
    paths:
      - .github/workflows/temp-wh09-production-research-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/wickhunter-wh09-production-research-runtime-20260808
          persist-credentials: true
          fetch-depth: 0

      - name: Apply fail-closed and bounded-journal repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing repair anchor: {label}")
              return text.replace(old, new, 1)

          core_path = Path("ai_platform/wickhunter/production_research_runtime.py")
          core = core_path.read_text(encoding="utf-8")

          field_anchor = '''    _active_traces: dict[str, ResearchScoreTrace] = field(
              default_factory=dict,
              init=False,
              repr=False,
          )
          '''
          field_replacement = field_anchor + '''    _decision_cache: dict[str, dict[str, Any]] = field(
              default_factory=dict, init=False, repr=False
          )
              _outcome_cache: dict[str, dict[str, Any]] = field(
              default_factory=dict, init=False, repr=False
          )
              _pending_outcomes: dict[str, dict[str, Any]] = field(
              default_factory=dict, init=False, repr=False
          )
          '''
          field_replacement = field_replacement.replace("              _outcome_cache", "    _outcome_cache").replace("              _pending_outcomes", "    _pending_outcomes")
          if "_decision_cache:" not in core:
              core = replace_once(core, field_anchor, field_replacement, "journal cache fields")

          init_anchor = '        _write_new_or_verify(self.root / "identity.json", identity_payload)\n\n'
          if "self._rebuild_indexes()" not in core:
              core = replace_once(
                  core,
                  init_anchor,
                  init_anchor + "        self._rebuild_indexes()\n\n",
                  "journal startup index rebuild",
              )

          method_anchor = '''    @property
              def runtime_store(self) -> ShadowRuntimeStore:
          '''.replace("              def", "    def")
          methods = '''    def _load_decision_file(self, path: Path) -> dict[str, Any]:
              payload = _verify_self_hash(
                  _load_object(path, field_name="research decision"),
                  hash_field="record_sha256",
                  field_name="research decision",
              )
              decision_id = str(payload.get("decision_id", ""))
              if SHA256_RE.fullmatch(decision_id) is None or path.stem != decision_id:
                  raise ProductionResearchRuntimeError("research decision identity is invalid")
              return payload

              def _load_outcome_file(self, path: Path) -> dict[str, Any]:
              payload = _verify_self_hash(
                  _load_object(path, field_name="research outcome"),
                  hash_field="record_sha256",
                  field_name="research outcome",
              )
              decision_id = str(payload.get("decision_id", ""))
              if SHA256_RE.fullmatch(decision_id) is None or path.stem != decision_id:
                  raise ProductionResearchRuntimeError("research outcome decision identity is invalid")
              return payload

              def _cache_decision(self, payload: dict[str, Any]) -> None:
              decision_id = str(payload.get("decision_id", ""))
              if SHA256_RE.fullmatch(decision_id) is None:
                  raise ProductionResearchRuntimeError("research decision identity is invalid")
              self._decision_cache[decision_id] = payload
              if payload.get("side") in {"long", "short"} and decision_id not in self._outcome_cache:
                  self._pending_outcomes[decision_id] = payload
              else:
                  self._pending_outcomes.pop(decision_id, None)

              def _cache_outcome(self, payload: dict[str, Any]) -> None:
              decision_id = str(payload.get("decision_id", ""))
              if SHA256_RE.fullmatch(decision_id) is None:
                  raise ProductionResearchRuntimeError("research outcome decision identity is invalid")
              if decision_id not in self._decision_cache:
                  raise ProductionResearchRuntimeError("research outcome is orphaned from its decision")
              self._outcome_cache[decision_id] = payload
              self._pending_outcomes.pop(decision_id, None)

              def _rebuild_indexes(self) -> None:
              self._decision_cache.clear()
              self._outcome_cache.clear()
              self._pending_outcomes.clear()
              for path in sorted((self.root / "decisions").glob("*.json")):
                  self._cache_decision(self._load_decision_file(path))
              for path in sorted((self.root / "outcomes").glob("*.json")):
                  self._cache_outcome(self._load_outcome_file(path))

          '''
          methods = methods.replace("              def ", "    def ")
          methods = methods.replace("\n              payload", "\n        payload")
          methods = methods.replace("\n                  _load", "\n            _load")
          methods = methods.replace("\n                  hash", "\n            hash")
          methods = methods.replace("\n                  field", "\n            field")
          methods = methods.replace("\n              )", "\n        )")
          methods = methods.replace("\n              decision_id", "\n        decision_id")
          methods = methods.replace("\n              if ", "\n        if ")
          methods = methods.replace("\n                  raise", "\n            raise")
          methods = methods.replace("\n              return", "\n        return")
          methods = methods.replace("\n              self.", "\n        self.")
          methods = methods.replace("\n                  self.", "\n            self.")
          methods = methods.replace("\n              else:", "\n        else:")
          methods = methods.replace("\n              for path", "\n        for path")
          methods = methods.replace("\n                  self._cache", "\n            self._cache")
          if "def _load_decision_file" not in core:
              core = replace_once(core, method_anchor, methods + method_anchor, "journal cache methods")

          decision_write = '''                _write_new_or_verify(
                      self.root / "decisions" / f"{evidence.shadow_decision_id}.json",
                      payload,
                  )
          '''.replace("                      ", "                    ").replace("                  )", "                )")
          decision_write_replacement = decision_write + "                self._cache_decision(payload)\n"
          if "self._cache_decision(payload)" not in core.split("def record_decisions", 1)[1].split("def pending_outcome_symbols", 1)[0]:
              core = replace_once(core, decision_write, decision_write_replacement, "decision cache update")

          pending_pattern = re.compile(
              r"    def pending_outcome_symbols\(self, \*, observed_at_ms: int\) -> tuple\[str, \.\.\.\]:\n.*?(?=    def materialize_due_outcomes\()",
              re.S,
          )
          pending_replacement = '''    def pending_outcome_symbols(self, *, observed_at_ms: int) -> tuple[str, ...]:
              symbols = {
                  str(decision["symbol"]).upper()
                  for decision in self._pending_outcomes.values()
                  if observed_at_ms
                  >= int(decision["decision_timestamp_ms"]) + self.identity.outcome_horizon_ms
              }
              return tuple(sorted(symbols))

          '''
          pending_replacement = pending_replacement.replace("              symbols", "        symbols").replace("              return", "        return")
          pending_replacement = pending_replacement.replace("\n                  str", "\n            str").replace("\n                  for", "\n            for").replace("\n                  if", "\n            if").replace("\n                  >=", "\n            >=").replace("\n              }", "\n        }")
          core, count = pending_pattern.subn(pending_replacement, core, count=1)
          if count != 1:
              raise SystemExit("unable to replace pending outcome scan")

          materialize_old = '''        created = 0
              outcome_root = self.root / "outcomes"
              for decision_path in sorted((self.root / "decisions").glob("*.json")):
              decision = _verify_self_hash(
                  _load_object(decision_path, field_name="research decision"),
                  hash_field="record_sha256",
                  field_name="research decision",
              )
              decision_id = str(decision.get("decision_id", ""))
              if SHA256_RE.fullmatch(decision_id) is None:
                  raise ProductionResearchRuntimeError("research decision identity is invalid")
              outcome_path = outcome_root / f"{decision_id}.json"
              if outcome_path.exists():
                  continue
          '''
          materialize_old = materialize_old.replace("              outcome_root", "        outcome_root").replace("              for decision_path", "        for decision_path").replace("              decision =", "            decision =").replace("\n                  _load", "\n                _load").replace("\n                  hash", "\n                hash").replace("\n                  field", "\n                field").replace("\n              )", "\n            )").replace("\n              decision_id", "\n            decision_id").replace("\n              if SHA", "\n            if SHA").replace("\n                  raise", "\n                raise").replace("\n              outcome_path", "\n            outcome_path").replace("\n              if outcome", "\n            if outcome").replace("\n                  continue", "\n                continue")
          materialize_new = '''        created = 0
              outcome_root = self.root / "outcomes"
              for decision_id, cached_decision in sorted(tuple(self._pending_outcomes.items())):
              decision_path = self.root / "decisions" / f"{decision_id}.json"
              decision = self._load_decision_file(decision_path)
              if canonical_json(decision) != canonical_json(cached_decision):
                  raise ProductionResearchRuntimeError(
                      "immutable research decision changed after startup"
                  )
              outcome_path = outcome_root / f"{decision_id}.json"
              if outcome_path.exists():
                  self._cache_outcome(self._load_outcome_file(outcome_path))
                  continue
          '''
          materialize_new = materialize_new.replace("              outcome_root", "        outcome_root").replace("              for decision_id", "        for decision_id").replace("              decision_path", "            decision_path").replace("              decision =", "            decision =").replace("              if canonical", "            if canonical").replace("\n                  raise", "\n                raise").replace("\n                      \"immutable", "\n                    \"immutable").replace("\n                  )", "\n                )").replace("              outcome_path", "            outcome_path").replace("              if outcome", "            if outcome").replace("\n                  self._cache", "\n                self._cache").replace("\n                  continue", "\n                continue")
          core = replace_once(core, materialize_old, materialize_new, "bounded outcome materialization")

          outcome_write = '''            _write_new_or_verify(outcome_path, payload)
              created += 1
          '''.replace("              created", "            created")
          outcome_write_replacement = '''            _write_new_or_verify(outcome_path, payload)
              self._cache_outcome(payload)
              created += 1
          '''.replace("              self", "            self").replace("              created", "            created")
          core = replace_once(core, outcome_write, outcome_write_replacement, "outcome cache update")

          telemetry_pattern = re.compile(
              r"        decisions = tuple\(\n.*?        confidences = tuple\(\n",
              re.S,
          )
          telemetry_replacement = '''        decisions = tuple(
              self._decision_cache[key] for key in sorted(self._decision_cache)
          )
              outcomes = tuple(self._outcome_cache[key] for key in sorted(self._outcome_cache))
              confidences = tuple(
          '''
          telemetry_replacement = telemetry_replacement.replace("              self._decision", "            self._decision").replace("              outcomes", "        outcomes").replace("              confidences", "        confidences")
          core, count = telemetry_pattern.subn(telemetry_replacement, core, count=1)
          if count != 1:
              raise SystemExit("unable to replace telemetry directory scans")
          core = replace_once(
              core,
              '            "pending_outcome_count": max(0, directional_decisions - len(outcomes)),\n',
              '            "pending_outcome_count": len(self._pending_outcomes),\n',
              "telemetry pending counter",
          )
          core_path.write_text(core, encoding="utf-8")

          operator_path = Path("ai_platform/wickhunter/production_research_runtime_operator.py")
          operator = operator_path.read_text(encoding="utf-8")
          operator_old = '''        self.last_success_at_ms = now_ms
              _atomic_health(
              self.health_path,
              self._health_payload(
                  status="healthy",
          '''
          operator_old = operator_old.replace("              _atomic", "        _atomic").replace("              self.health", "            self.health").replace("              self._health", "            self._health").replace("                  status", "                status")
          operator_new = '''        status = "fail_closed" if runtime_health == "fail_closed" else "healthy"
              if status == "healthy":
              self.last_success_at_ms = now_ms
              error_code = None if status == "healthy" else "runtime_fail_closed"
              error_message = (
              None
              if status == "healthy"
              else ",".join(canonical_breaker_reasons) or "runtime reported fail_closed"
              )
              _atomic_health(
              self.health_path,
              self._health_payload(
                  status=status,
          '''
          operator_new = operator_new.replace("              if status", "        if status").replace("\n              self.last", "\n            self.last").replace("              error_code", "        error_code").replace("              error_message", "        error_message").replace("\n              None", "\n            None").replace("\n              if status", "\n            if status").replace("\n              else ", "\n            else ").replace("\n              )", "\n        )").replace("              _atomic", "        _atomic").replace("\n              self.health", "\n            self.health").replace("\n              self._health", "\n            self._health").replace("\n                  status", "\n                status")
          operator = replace_once(operator, operator_old, operator_new, "truthful operator status")
          operator = replace_once(
              operator,
              '''                error_code=None,
                              error_message=None,
              '''.replace("                              error_message", "                error_message"),
              '''                error_code=error_code,
                              error_message=error_message,
              '''.replace("                              error_message", "                error_message"),
              "operator fail-closed reason",
          )
          operator_path.write_text(operator, encoding="utf-8")

          health_path = Path("deploy/synology/wickhunter-production-research-runtime/research_runtime_healthcheck.py")
          health = health_path.read_text(encoding="utf-8")
          health_anchor = '''        if health.get("status") != "healthy":
              return _fail("research operator is fail-closed")
          '''.replace("              return", "            return")
          health_replacement = health_anchor + '''        if health.get("runtime_health") not in {"healthy", "degraded"}:
              return _fail("research runtime is fail-closed")
              if health.get("circuit_breaker_active") is True:
              return _fail("research runtime circuit breaker is active")
          '''
          health_replacement = health_replacement.replace("              return", "            return").replace("              if health", "        if health")
          if "research runtime circuit breaker is active" not in health:
              health = replace_once(health, health_anchor, health_replacement, "healthcheck nested runtime state")
          health_path.write_text(health, encoding="utf-8")

          tests_path = Path("tests/ai_platform_integration/test_wickhunter_production_research_runtime.py")
          tests = tests_path.read_text(encoding="utf-8")
          test_name = "test_journal_rebuilds_pending_index_without_repeated_directory_scans"
          if test_name not in tests:
              tests += '''\n\ndef test_journal_rebuilds_pending_index_without_repeated_directory_scans(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    first = research.ProductionResearchJournal(tmp_path / "journal", _identity())\n    evidence = _journal_evidence()\n    trace = research.ResearchScoreTrace(\n        score_id="2" * 64,\n        raw_probability=Decimal("0.331543"),\n        calibrated_confidence=Decimal("0.333333"),\n    )\n    first.record_decisions(\n        requests=(_journal_request(),),\n        decisions=(evidence,),\n        traces={trace.score_id: trace},\n        operator_commit=CODE_SHA,\n    )\n\n    restarted = research.ProductionResearchJournal(first.root, _identity())\n\n    def forbid_glob(*_args: object, **_kwargs: object) -> object:\n        raise AssertionError("steady-state journal must not rescan historical directories")\n\n    monkeypatch.setattr(Path, "glob", forbid_glob)\n    assert restarted.pending_outcome_symbols(\n        observed_at_ms=CREATED_AT_MS + 900_000\n    ) == ("BTCUSDT",)\n    runtime_state = SimpleNamespace(\n        generation=1,\n        last_observed_at_ms=CREATED_AT_MS + 900_000,\n        positions=(),\n        closed_positions=(),\n        cumulative_realized_pnl_quote=Decimal("0"),\n        drawdown_ratio=Decimal("0"),\n    )\n    telemetry = restarted.publish_telemetry(\n        checked_at_ms=CREATED_AT_MS + 900_000,\n        operator_commit=CODE_SHA,\n        runtime_state=runtime_state,\n    )\n    assert telemetry["decision_count"] == 1\n    assert telemetry["pending_outcome_count"] == 1\n    assert restarted.materialize_due_outcomes(\n        observed_at_ms=CREATED_AT_MS + 900_000,\n        mark_prices={"BTCUSDT": Decimal("110")},\n        operator_commit=CODE_SHA,\n    ) == 1\n    telemetry = restarted.publish_telemetry(\n        checked_at_ms=CREATED_AT_MS + 900_001,\n        operator_commit=CODE_SHA,\n        runtime_state=runtime_state,\n    )\n    assert telemetry["outcome_count"] == 1\n    assert telemetry["pending_outcome_count"] == 0\n'''
          tests_path.write_text(tests, encoding="utf-8")

          deploy_tests_path = Path("tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py")
          deploy_tests = deploy_tests_path.read_text(encoding="utf-8")
          deploy_test_name = "test_healthcheck_rejects_nested_fail_closed_runtime"
          if deploy_test_name not in deploy_tests:
              deploy_tests += '''\n\ndef test_healthcheck_rejects_nested_fail_closed_runtime() -> None:\n    healthcheck = (DEPLOY / "research_runtime_healthcheck.py").read_text(encoding="utf-8")\n    assert 'health.get("runtime_health") not in {"healthy", "degraded"}' in healthcheck\n    assert 'health.get("circuit_breaker_active") is True' in healthcheck\n    operator = (ROOT / "ai_platform" / "wickhunter" / "production_research_runtime_operator.py").read_text(encoding="utf-8")\n    assert 'status = "fail_closed" if runtime_health == "fail_closed" else "healthy"' in operator\n    assert 'error_code = None if status == "healthy" else "runtime_fail_closed"' in operator\n'''
          deploy_tests_path.write_text(deploy_tests, encoding="utf-8")
          PY

          python3 -m compileall -q \
            ai_platform/wickhunter/production_research_runtime.py \
            ai_platform/wickhunter/production_research_runtime_operator.py \
            deploy/synology/wickhunter-production-research-runtime/research_runtime_healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py

          git diff --check
          git status --short
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/wickhunter/production_research_runtime.py \
            ai_platform/wickhunter/production_research_runtime_operator.py \
            deploy/synology/wickhunter-production-research-runtime/research_runtime_healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py
          git commit -m "fix(wickhunter): bound research journal and surface fail closed"
          git push origin HEAD:feat/wickhunter-wh09-production-research-runtime-20260808
