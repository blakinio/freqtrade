name: Temporary WH09 production research review repair

on:
  push:
    branches:
      - feat/wickhunter-wh09-production-research-runtime-20260808
    paths:
      - .github/workflows/temp-wh09-production-research-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/wickhunter-wh09-production-research-runtime-20260808
          persist-credentials: true
          fetch-depth: 0
      - name: Apply bounded P1/P2 review repairs
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/repair.py <<'PY'
          from pathlib import Path

          core = Path("ai_platform/wickhunter/production_research_runtime.py")
          text = core.read_text(encoding="utf-8")
          text = text.replace(
              "def _write_new_or_verify(path: Path, payload: dict[str, object]) -> None:",
              "def _write_new_or_verify(path: Path, payload: dict[str, object]) -> bool:",
              1,
          )
          text = text.replace(
              "        if canonical_json(existing) != canonical_json(payload):\n"
              "            raise ProductionResearchRuntimeError(f\"immutable record collision for {path.name}\")\n"
              "        return\n",
              "        if canonical_json(existing) != canonical_json(payload):\n"
              "            raise ProductionResearchRuntimeError(f\"immutable record collision for {path.name}\")\n"
              "        return False\n",
              1,
          )
          marker = "    try:\n        with os.fdopen(descriptor, \"w\", encoding=\"utf-8\") as handle:\n"
          if marker not in text:
              raise SystemExit("write helper body anchor missing")
          helper_end = (
              "    except Exception:\n"
              "        path.unlink(missing_ok=True)\n"
              "        raise\n\n\n"
          )
          if helper_end not in text:
              raise SystemExit("write helper end anchor missing")
          text = text.replace(helper_end, helper_end.replace("\n\n\n", "\n    return True\n\n\n"), 1)

          field_anchor = (
              "    _active_traces: dict[str, ResearchScoreTrace] = field(\n"
              "        default_factory=dict,\n"
              "        init=False,\n"
              "        repr=False,\n"
              "    )\n"
          )
          fields = field_anchor + '''    _pending_outcomes: dict[str, dict[str, Any]] = field(default_factory=dict, init=False, repr=False)
              _decision_count: int = field(default=0, init=False, repr=False)
              _no_trade_count: int = field(default=0, init=False, repr=False)
              _simulated_signal_count: int = field(default=0, init=False, repr=False)
              _directional_decision_count: int = field(default=0, init=False, repr=False)
              _above_threshold_count: int = field(default=0, init=False, repr=False)
              _confidence_count: int = field(default=0, init=False, repr=False)
              _confidence_sum: Decimal = field(default=Decimal("0"), init=False, repr=False)
              _confidence_minimum: Decimal | None = field(default=None, init=False, repr=False)
              _confidence_maximum: Decimal | None = field(default=None, init=False, repr=False)
              _outcome_count: int = field(default=0, init=False, repr=False)
              _positive_outcome_count: int = field(default=0, init=False, repr=False)
'''
          if "_pending_outcomes:" not in text:
              if field_anchor not in text:
                  raise SystemExit("journal field anchor missing")
              text = text.replace(field_anchor, fields, 1)

          init_anchor = "        _write_new_or_verify(self.root / \"identity.json\", identity_payload)\n\n"
          init_replacement = init_anchor + "        self._rebuild_indexes()\n\n"
          if "self._rebuild_indexes()" not in text:
              if init_anchor not in text:
                  raise SystemExit("journal init anchor missing")
              text = text.replace(init_anchor, init_replacement, 1)

          method_anchor = "    @property\n    def runtime_store(self) -> ShadowRuntimeStore:\n"
          methods = '''    def _register_decision(self, payload: dict[str, Any]) -> None:
              self._decision_count += 1
              final_decision = payload.get("final_decision")
              if final_decision == "SIMULATED_SIGNAL":
                  self._simulated_signal_count += 1
              else:
                  self._no_trade_count += 1
              if payload.get("side") in {"long", "short"}:
                  self._directional_decision_count += 1
                  decision_id = str(payload["decision_id"])
                  self._pending_outcomes[decision_id] = payload
              if payload.get("above_no_trade_confidence") is True:
                  self._above_threshold_count += 1
              confidence = payload.get("calibrated_confidence")
              if confidence is not None:
                  value = Decimal(str(confidence))
                  self._confidence_count += 1
                  self._confidence_sum += value
                  if self._confidence_minimum is None or value < self._confidence_minimum:
                      self._confidence_minimum = value
                  if self._confidence_maximum is None or value > self._confidence_maximum:
                      self._confidence_maximum = value

              def _register_outcome(self, payload: dict[str, Any]) -> None:
              self._outcome_count += 1
              if payload.get("positive_outcome") is True:
                  self._positive_outcome_count += 1
              self._pending_outcomes.pop(str(payload["decision_id"]), None)

              def _rebuild_indexes(self) -> None:
              self._pending_outcomes.clear()
              self._decision_count = 0
              self._no_trade_count = 0
              self._simulated_signal_count = 0
              self._directional_decision_count = 0
              self._above_threshold_count = 0
              self._confidence_count = 0
              self._confidence_sum = Decimal("0")
              self._confidence_minimum = None
              self._confidence_maximum = None
              self._outcome_count = 0
              self._positive_outcome_count = 0
              for path in sorted((self.root / "decisions").glob("*.json")):
                  payload = _verify_self_hash(
                      _load_object(path, field_name="research decision"),
                      hash_field="record_sha256",
                      field_name="research decision",
                  )
                  self._register_decision(payload)
              for path in sorted((self.root / "outcomes").glob("*.json")):
                  payload = _verify_self_hash(
                      _load_object(path, field_name="research outcome"),
                      hash_field="record_sha256",
                      field_name="research outcome",
                  )
                  self._register_outcome(payload)

'''
          methods = methods.replace("              def ", "    def ").replace("\n              self.", "\n        self.").replace("\n              if ", "\n        if ").replace("\n              final", "\n        final").replace("\n              confidence", "\n        confidence").replace("\n              value", "\n            value").replace("\n              for ", "\n        for ").replace("\n                  payload", "\n            payload").replace("\n                  self.", "\n            self.").replace("\n                      _load", "\n                _load").replace("\n                      hash", "\n                hash").replace("\n                      field", "\n                field").replace("\n                  )", "\n            )").replace("\n                  decision", "\n            decision").replace("\n                  self._pending", "\n            self._pending").replace("\n                  self._directional", "\n            self._directional").replace("\n                  self._simulated", "\n            self._simulated").replace("\n                  self._no_trade", "\n            self._no_trade").replace("\n                  self._above", "\n            self._above").replace("\n                  self._confidence", "\n            self._confidence").replace("\n                  if ", "\n            if ").replace("\n                      self._", "\n                self._").replace("\n              self._outcome", "\n        self._outcome").replace("\n              self._positive", "\n        self._positive").replace("\n              self._pending", "\n        self._pending")
          if "def _register_decision" not in text:
              if method_anchor not in text:
                  raise SystemExit("journal method anchor missing")
              text = text.replace(method_anchor, methods + method_anchor, 1)

          record_old = '''                _write_new_or_verify(
                      self.root / "decisions" / f"{evidence.shadow_decision_id}.json",
                      payload,
                  )
'''.replace("                  ", "                ")
          record_new = '''                created = _write_new_or_verify(
                      self.root / "decisions" / f"{evidence.shadow_decision_id}.json",
                      payload,
                  )
                  if created:
                      self._register_decision(payload)
'''.replace("                  ", "                ")
          if record_old not in text:
              raise SystemExit("decision write anchor missing")
          text = text.replace(record_old, record_new, 1)

          pending_start = text.index("    def pending_outcome_symbols(")
          pending_end = text.index("    def materialize_due_outcomes(", pending_start)
          pending_method = '''    def pending_outcome_symbols(self, *, observed_at_ms: int) -> tuple[str, ...]:
              symbols = {
                  str(decision["symbol"]).upper()
                  for decision in self._pending_outcomes.values()
                  if observed_at_ms
                  >= int(decision["decision_timestamp_ms"]) + self.identity.outcome_horizon_ms
              }
              return tuple(sorted(symbols))

'''.replace("              ", "        ")
          text = text[:pending_start] + pending_method + text[pending_end:]

          materialize_start = text.index("    def materialize_due_outcomes(")
          telemetry_start = text.index("    def publish_telemetry(", materialize_start)
          materialize_method = '''    def materialize_due_outcomes(
              self,
              *,
              observed_at_ms: int,
              mark_prices: dict[str, Decimal],
              operator_commit: str,
          ) -> int:
              created = 0
              outcome_root = self.root / "outcomes"
              for decision_id, decision in tuple(self._pending_outcomes.items()):
                  side = decision.get("side")
                  decision_timestamp_ms = int(decision["decision_timestamp_ms"])
                  target_at_ms = decision_timestamp_ms + self.identity.outcome_horizon_ms
                  if observed_at_ms < target_at_ms:
                      continue
                  symbol = str(decision["symbol"]).upper()
                  outcome_price = mark_prices.get(symbol)
                  if outcome_price is None or outcome_price <= 0:
                      continue
                  entry_price = Decimal(str(decision["decision_price"]))
                  gross_return = (outcome_price / entry_price) - Decimal("1")
                  directional_return = gross_return if side == "long" else -gross_return
                  payload: dict[str, object] = {
                      "schema_version": RESEARCH_OUTCOME_SCHEMA,
                      "outcome_id": canonical_sha256(
                          {
                              "decision_id": decision_id,
                              "target_at_ms": target_at_ms,
                              "labeled_at_ms": observed_at_ms,
                              "outcome_price": str(outcome_price),
                          }
                      ),
                      "decision_id": decision_id,
                      "run_id": self.identity.run_id,
                      "operator_commit": _git_sha(operator_commit, field_name="operator_commit"),
                      "symbol": symbol,
                      "side": side,
                      "decision_timestamp_ms": decision_timestamp_ms,
                      "target_horizon_ms": self.identity.outcome_horizon_ms,
                      "target_at_ms": target_at_ms,
                      "labeled_at_ms": observed_at_ms,
                      "observation_delay_ms": observed_at_ms - target_at_ms,
                      "entry_price": str(entry_price),
                      "outcome_price": str(outcome_price),
                      "gross_return_ratio": str(gross_return.quantize(Decimal("0.00000001"))),
                      "directional_return_ratio": str(
                          directional_return.quantize(Decimal("0.00000001"))
                      ),
                      "positive_outcome": directional_return > 0,
                      "semantics": "first_observed_mark_at_or_after_target_horizon_no_costs",
                      "deterministic_replay_equivalent": False,
                      "model_version": self.identity.model_version,
                      "model_hash": self.identity.model_hash,
                      "parameter_version": self.identity.parameter_version,
                      "parameter_hash": self.identity.parameter_hash,
                      "dataset_hash": self.identity.dataset_hash,
                      "model_source_commit": self.identity.model_source_commit,
                      **ZERO_AUTHORITY,
                  }
                  payload["record_sha256"] = canonical_sha256(payload)
                  if _write_new_or_verify(outcome_root / f"{decision_id}.json", payload):
                      self._register_outcome(payload)
                      created += 1
              return created

'''.replace("              ", "        ")
          text = text[:materialize_start] + materialize_method + text[telemetry_start:]

          telemetry_start = text.index("    def publish_telemetry(")
          service_start = text.index("\n\n@dataclass(slots=True)\nclass ProductionResearchRuntimeService", telemetry_start)
          telemetry_method = '''    def publish_telemetry(
              self,
              *,
              checked_at_ms: int,
              operator_commit: str,
              runtime_state: Any,
          ) -> dict[str, object]:
              confidence_summary: dict[str, object] = {
                  "count": self._confidence_count,
                  "minimum": None if self._confidence_minimum is None else str(self._confidence_minimum),
                  "maximum": None if self._confidence_maximum is None else str(self._confidence_maximum),
                  "mean": (
                      None
                      if self._confidence_count == 0
                      else str(
                          (self._confidence_sum / Decimal(self._confidence_count)).quantize(
                              Decimal("0.000001")
                          )
                      )
                  ),
              }
              payload: dict[str, object] = {
                  "schema_version": RESEARCH_TELEMETRY_SCHEMA,
                  "checked_at_ms": checked_at_ms,
                  "operator_commit": _git_sha(operator_commit, field_name="operator_commit"),
                  "run_id": self.identity.run_id,
                  "mode": self.identity.mode.value,
                  "model_version": self.identity.model_version,
                  "model_hash": self.identity.model_hash,
                  "model_artifact_sha256": self.identity.model_artifact_sha256,
                  "parameter_version": self.identity.parameter_version,
                  "parameter_hash": self.identity.parameter_hash,
                  "dataset_hash": self.identity.dataset_hash,
                  "no_trade_confidence": str(self.identity.no_trade_confidence),
                  "outcome_horizon_ms": self.identity.outcome_horizon_ms,
                  "decision_count": self._decision_count,
                  "no_trade_count": self._no_trade_count,
                  "simulated_signal_count": self._simulated_signal_count,
                  "directional_decision_count": self._directional_decision_count,
                  "above_threshold_count": self._above_threshold_count,
                  "confidence": confidence_summary,
                  "outcome_count": self._outcome_count,
                  "pending_outcome_count": len(self._pending_outcomes),
                  "positive_outcome_count": self._positive_outcome_count,
                  "positive_outcome_rate": (
                      None
                      if self._outcome_count == 0
                      else str(
                          (Decimal(self._positive_outcome_count) / Decimal(self._outcome_count)).quantize(
                              Decimal("0.000001")
                          )
                      )
                  ),
                  "runtime_generation": runtime_state.generation,
                  "last_observed_at_ms": runtime_state.last_observed_at_ms,
                  "simulated_open_positions": len(runtime_state.positions),
                  "simulated_closed_positions": len(runtime_state.closed_positions),
                  "simulated_realized_pnl_quote": str(runtime_state.cumulative_realized_pnl_quote),
                  "runtime_drawdown_ratio": str(runtime_state.drawdown_ratio),
                  **ZERO_AUTHORITY,
              }
              payload["telemetry_sha256"] = canonical_sha256(payload)
              _atomic_json(self.telemetry_path, payload)
              return payload
'''.replace("              ", "        ")
          text = text[:telemetry_start] + telemetry_method + text[service_start:]
          core.write_text(text, encoding="utf-8")

          operator = Path("ai_platform/wickhunter/production_research_runtime_operator.py")
          text = operator.read_text(encoding="utf-8")
          old = '''        self.last_success_at_ms = now_ms
              _atomic_health(
                  self.health_path,
                  self._health_payload(
                      status="healthy",
'''.replace("              ", "        ")
          new = '''        self.last_success_at_ms = now_ms
              operator_status = "healthy" if runtime_health == "healthy" else "fail_closed"
              _atomic_health(
                  self.health_path,
                  self._health_payload(
                      status=operator_status,
'''.replace("              ", "        ")
          if old not in text:
              raise SystemExit("operator health status anchor missing")
          operator.write_text(text.replace(old, new, 1), encoding="utf-8")

          health = Path("deploy/synology/wickhunter-production-research-runtime/research_runtime_healthcheck.py")
          text = health.read_text(encoding="utf-8")
          anchor = '''        if health.get("status") != "healthy":
                  return _fail("research operator is fail-closed")
'''.replace("                  ", "            ")
          replacement = anchor + '''        if health.get("runtime_health") != "healthy":
              return _fail("research runtime health is not healthy")
'''.replace("              ", "            ")
          if "research runtime health is not healthy" not in text:
              if anchor not in text:
                  raise SystemExit("healthcheck status anchor missing")
              text = text.replace(anchor, replacement, 1)
          health.write_text(text, encoding="utf-8")

          tests = Path("tests/ai_platform_integration/test_wickhunter_production_research_runtime.py")
          text = tests.read_text(encoding="utf-8")
          append = r'''

          def test_journal_hot_path_uses_incremental_indexes(tmp_path: Path, monkeypatch: pytest.MonkeyPatch) -> None:
              journal = research.ProductionResearchJournal(tmp_path / "journal", _identity())
              evidence = _journal_evidence()
              trace = research.ResearchScoreTrace(
                  score_id="2" * 64,
                  raw_probability=Decimal("0.331543"),
                  calibrated_confidence=Decimal("0.333333"),
              )
              journal.record_decisions(
                  requests=(_journal_request(),),
                  decisions=(evidence,),
                  traces={trace.score_id: trace},
                  operator_commit=CODE_SHA,
              )
              monkeypatch.setattr(
                  research,
                  "_load_object",
                  lambda *_args, **_kwargs: (_ for _ in ()).throw(AssertionError("hot path rescanned journal")),
              )
              assert journal.pending_outcome_symbols(observed_at_ms=CREATED_AT_MS + 900_000) == ("BTCUSDT",)
              telemetry = journal.publish_telemetry(
                  checked_at_ms=CREATED_AT_MS + 900_000,
                  operator_commit=CODE_SHA,
                  runtime_state=SimpleNamespace(
                      generation=1,
                      last_observed_at_ms=CREATED_AT_MS,
                      positions=(),
                      closed_positions=(),
                      cumulative_realized_pnl_quote=Decimal("0"),
                      drawdown_ratio=Decimal("0"),
                  ),
              )
              assert telemetry["decision_count"] == 1
              assert telemetry["pending_outcome_count"] == 1
              assert telemetry["no_trade_count"] == 1
'''.replace("          ", "")
          if "test_journal_hot_path_uses_incremental_indexes" not in text:
              text = text.rstrip() + append + "\n"
          tests.write_text(text, encoding="utf-8")

          deploy_tests = Path("tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py")
          text = deploy_tests.read_text(encoding="utf-8")
          old = '''    assert "BINANCE_API_SECRET" not in compose
'''
          new = old + '''    healthcheck = (DEPLOY / "research_runtime_healthcheck.py").read_text(encoding="utf-8")
              assert 'health.get("runtime_health") != "healthy"' in healthcheck
'''.replace("              ", "    ")
          if "runtime_health\") != \"healthy\"" not in text:
              if old not in text:
                  raise SystemExit("deploy test anchor missing")
              text = text.replace(old, new, 1)
          deploy_tests.write_text(text, encoding="utf-8")
          PY
          python /tmp/repair.py
      - name: Validate repair
        run: |
          python -m pip install --disable-pip-version-check pytest numpy lightgbm==4.6.0 "pydantic>=2.2" ruff==0.15.21
          python -m ruff check --fix \
            ai_platform/wickhunter/production_research_runtime.py \
            ai_platform/wickhunter/production_research_runtime_operator.py \
            deploy/synology/wickhunter-production-research-runtime/research_runtime_healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py
          python -m ruff format \
            ai_platform/wickhunter/production_research_runtime.py \
            ai_platform/wickhunter/production_research_runtime_operator.py \
            deploy/synology/wickhunter-production-research-runtime/research_runtime_healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py
          python -m ruff check \
            ai_platform/wickhunter/production_research_runtime.py \
            ai_platform/wickhunter/production_research_runtime_operator.py \
            deploy/synology/wickhunter-production-research-runtime/research_runtime_healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py
          python -m ruff format --check \
            ai_platform/wickhunter/production_research_runtime.py \
            ai_platform/wickhunter/production_research_runtime_operator.py \
            deploy/synology/wickhunter-production-research-runtime/research_runtime_healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime.py \
            tests/ai_platform_integration/test_wickhunter_production_research_runtime_deploy.py
      - name: Remove temporary workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-wh09-production-research-review-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          ! git diff --cached --quiet
          git commit -m "fix(wickhunter): resolve WH09 research runtime review findings"
          git push origin HEAD:feat/wickhunter-wh09-production-research-runtime-20260808
