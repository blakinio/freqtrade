name: Temporary WH-09 Ruff fix

on:
  push:
    branches:
      - feat/wickhunter-wh09-paper-validation-v1
    paths:
      - .github/workflows/temp-wh09-ruff-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wickhunter-wh09-paper-validation-v1
          fetch-depth: 0
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --fix ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
      - uses: astral-sh/ruff-action@v3
        with:
          args: format ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
      - name: Commit bounded fixes and remove helper
        run: |
          rm .github/workflows/temp-wh09-ruff-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py .github/workflows/temp-wh09-ruff-fix.yml
          git commit -m "style(wickhunter): apply WH-09 Ruff fixes"
          git push origin HEAD:feat/wickhunter-wh09-paper-validation-v1
