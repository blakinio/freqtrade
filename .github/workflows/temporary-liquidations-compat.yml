name: Temporary Liquidations Compatibility Repair

"on":
  push:
    branches:
      - fix/liquidations-live-health-recovery-20260803
    paths:
      - .github/workflows/temporary-liquidations-compat.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/liquidations-live-health-recovery-20260803
      - name: Preserve the established helper keyword
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("ai_platform/scripts/liquidation_operational_health.py"): [
                  ("    reconnects_per_hour_max: int,\n", "    reconnect_max: int,\n", 1),
                  (
                      "            reconnect_budget = reconnects_per_hour_max * uptime_hours\n",
                      "            reconnect_budget = reconnect_max * uptime_hours\n",
                      1,
                  ),
                  (
                      '                            f"{reconnects_per_hour_max}/h."\n',
                      '                            f"{reconnect_max}/h."\n',
                      1,
                  ),
                  (
                      "        reconnects_per_hour_max=int(\n",
                      "        reconnect_max=int(\n",
                      1,
                  ),
              ],
              Path("tests/ai_platform_integration/test_liquidation_operational_health.py"): [
                  ("        reconnects_per_hour_max=100,\n", "        reconnect_max=100,\n", 2),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new, expected in edits:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(
                          f"{path}: expected {expected} occurrences of {old!r}, found {actual}"
                      )
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/scripts/liquidation_operational_health.py \
            tests/ai_platform_integration/test_liquidation_operational_health.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(liquidations): preserve reconnect helper compatibility"
          git push origin HEAD:fix/liquidations-live-health-recovery-20260803
