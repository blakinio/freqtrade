name: Temporary Liquidations Format

"on":
  push:
    branches:
      - fix/liquidations-live-health-recovery-20260803
    paths:
      - .github/workflows/temporary-liquidations-format.yml
      - ai_platform/scripts/liquidation_operational_health.py

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/liquidations-live-health-recovery-20260803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - name: Format and commit
        run: |
          set -euo pipefail
          ruff format ai_platform/scripts/liquidation_operational_health.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/scripts/liquidation_operational_health.py
          git commit -m "style(liquidations): apply ruff formatting"
          git push origin HEAD:fix/liquidations-live-health-recovery-20260803
