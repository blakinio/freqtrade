name: Temporary apply exact #1354 E2E config repair

on:
  push:
    branches:
      - fix/portal-runtime-isolation-1354
    paths:
      - .github/workflows/tmp-apply-1354-e2e-config.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'blakinio/freqtrade'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/portal-runtime-isolation-1354
          fetch-depth: 0
          persist-credentials: true

      - name: Verify parent and apply deterministic config repair
        env:
          EXPECTED_PARENT: f6e7ba795fdb23065d0b36bbdef0daf1cc16081e
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          if [ "$parent" != "$EXPECTED_PARENT" ]; then
            echo "Refusing: workflow update commit parent is $parent, expected $EXPECTED_PARENT" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py')
          text = path.read_text(encoding='utf-8')

          fiat = '        "fiat_display_currency": "USD",\n'
          if text.count(fiat) != 1:
              raise SystemExit(f'expected one fiat_display_currency entry, found {text.count(fiat)}')
          text = text.replace(fiat, '')

          anchor = '        "dry_run_wallet": 1000,\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one dry_run_wallet anchor, found {text.count(anchor)}')
          text = text.replace(anchor, anchor + '        "initial_state": "running",\n')

          path.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
          git commit -m 'test(portal): isolate PAPER runtime startup dependencies'
          git push origin HEAD:fix/portal-runtime-isolation-1354
