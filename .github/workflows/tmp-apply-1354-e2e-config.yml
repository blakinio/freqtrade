name: Temporary apply exact #1354 E2E config repair

on:
  push:
    branches:
      - fix/portal-runtime-isolation-1354
    paths:
      - .github/workflows/tmp-apply-1354-e2e-config.yml

permissions:
  contents: write
  issues: read

jobs:
  apply:
    if: github.repository == 'blakinio/freqtrade'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/portal-runtime-isolation-1354
          fetch-depth: 0
          persist-credentials: true

      - name: Verify parent and apply exact patch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: d436914dc57e9e439148c30b440ab0a6fd9fb11a
          COMMENT_ID: '5259065085'
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          if [ "$parent" != "$EXPECTED_PARENT" ]; then
            echo "Refusing: workflow creation commit parent is $parent, expected $EXPECTED_PARENT" >&2
            exit 1
          fi
          python - <<'PY'
          import json, os, re, urllib.request
          req = urllib.request.Request(
              f"https://api.github.com/repos/blakinio/freqtrade/issues/comments/{os.environ['COMMENT_ID']}",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              },
          )
          with urllib.request.urlopen(req) as response:
              body = json.load(response)["body"]
          match = re.search(r"```diff\n(.*?)\n```", body, re.S)
          if not match:
              raise SystemExit("diff fence missing")
          open("/tmp/e2e-config.patch", "w", encoding="utf-8").write(match.group(1) + "\n")
          PY
          git apply --check /tmp/e2e-config.patch
          git apply /tmp/e2e-config.patch
          python -m compileall -q tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
          git commit -m 'test(portal): isolate PAPER runtime startup dependencies'
          git push origin HEAD:fix/portal-runtime-isolation-1354
