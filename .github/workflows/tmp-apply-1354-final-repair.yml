name: Temporary apply exact #1354 final audit repair

on:
  push:
    branches:
      - fix/portal-runtime-isolation-1354
    paths:
      - .github/workflows/tmp-apply-1354-final-repair.yml

permissions:
  contents: write
  issues: read

jobs:
  apply:
    if: github.repository == 'blakinio/freqtrade'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/portal-runtime-isolation-1354
          fetch-depth: 0
          persist-credentials: true

      - name: Verify parent and apply exact Codex diff
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: ba1af5a6147da6d59b70b9860ebab0e1637ea069
          COMMENT_ID: '5258787558'
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          current="$(git rev-parse HEAD)"
          if [ "$parent" != "$EXPECTED_PARENT" ]; then
            echo "Refusing: workflow creation commit parent is $parent, expected $EXPECTED_PARENT" >&2
            exit 1
          fi
          python - <<'PY'
          import json, os, re, urllib.request
          token = os.environ['GH_TOKEN']
          cid = os.environ['COMMENT_ID']
          req = urllib.request.Request(
              f'https://api.github.com/repos/blakinio/freqtrade/issues/comments/{cid}',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'},
          )
          with urllib.request.urlopen(req) as r:
              body = json.load(r)['body']
          marker = '### Complete unified diff against `ba1af5a6147da6d59b70b9860ebab0e1637ea069`'
          if marker not in body:
              raise SystemExit('exact diff marker missing')
          tail = body.split(marker, 1)[1]
          m = re.search(r'```diff\n(.*?)\n```', tail, re.S)
          if not m:
              raise SystemExit('diff fence missing')
          patch = m.group(1) + '\n'
          open('/tmp/repair.patch', 'w', encoding='utf-8').write(patch)
          PY
          git apply --check /tmp/repair.patch
          git apply /tmp/repair.patch
          git diff --check
          python -m compileall -q ai_platform/portal/execution tests/ai_platform/portal/execution
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/portal/execution/driver.py \
                  ai_platform/portal/execution/runtime_image/portal-runtime-quarantine \
                  tests/ai_platform/portal/execution/test_driver.py \
                  tests/ai_platform/portal/execution/test_runtime_image.py \
                  tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py \
                  docs/agents/tasks/active/FTAI-20260809-portal-runtime-isolation-1354.md
          git commit -m 'fix(portal): close final runtime isolation audit findings'
          git push origin HEAD:fix/portal-runtime-isolation-1354
