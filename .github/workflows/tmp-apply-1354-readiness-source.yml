name: Temporary apply #1354 source-independent readiness repair

on:
  push:
    branches:
      - fix/portal-runtime-isolation-1354
    paths:
      - .github/workflows/tmp-apply-1354-readiness-source.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'blakinio/freqtrade'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/portal-runtime-isolation-1354
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install focused validation dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff mypy jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6" "httpx>=0.24.1" fastapi pyjwt cryptography "PyYAML>=6.0"

      - name: Apply deterministic readiness repair and validate
        env:
          EXPECTED_PARENT: 4545190bc6f887275336a3c0a59f722291cc3778
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'ai_platform/portal/execution/driver.py',
              '    _APPLICATION_READY_FILE = f"{_RELEASE_DIR}/application-ready"\n',
              '',
          )

          replace_once(
              'ai_platform/portal/execution/driver.py',
              '''            if gate.returncode == 0:\n                ready = self._runner.run(\n                    ("docker", "exec", runtime_id, "test", "-f", self._APPLICATION_READY_FILE)\n                )\n                if ready.returncode == 0:\n                    return DriverRuntimeState.RUNNING\n                if ready.returncode == 1:\n                    return DriverRuntimeState.STARTING\n                raise RuntimeDriverError(\n                    "ISOLATION_ATTESTATION_FAILED",\n                    ready.stderr.strip() or "application readiness state is unreadable",\n                )\n''',
              '''            if gate.returncode == 0:\n                if self._application_probe(runtime_id):\n                    return DriverRuntimeState.RUNNING\n                return DriverRuntimeState.STARTING\n''',
          )

          marker = '''        try:\n            return states[state]\n        except KeyError as exc:\n            raise RuntimeDriverError(\n                "DOCKER_STATE_UNKNOWN",\n                f"unsupported docker runtime state: {state or '<empty>'}",\n            ) from exc\n\n    def _reattest_before_release'''
          replacement = '''        try:\n            return states[state]\n        except KeyError as exc:\n            raise RuntimeDriverError(\n                "DOCKER_STATE_UNKNOWN",\n                f"unsupported docker runtime state: {state or '<empty>'}",\n            ) from exc\n\n    def _application_probe(self, runtime_id: str) -> bool:\n        spec = self._specs.get(runtime_id)\n        if spec is None:\n            return False\n        try:\n            payload = json.loads(spec.config_path.read_text(encoding="utf-8"))\n        except (OSError, json.JSONDecodeError):\n            return False\n        if not isinstance(payload, dict):\n            return False\n        exchange = payload.get("exchange")\n        quote = payload.get("stake_currency")\n        if not isinstance(exchange, dict) or not isinstance(quote, str) or not quote:\n            return False\n        exchange_name = exchange.get("name")\n        if not isinstance(exchange_name, str) or not exchange_name:\n            return False\n        script = (\n            "set -eu; "\n            "cmd=\"$(tr '\\\\000' ' ' < /proc/1/cmdline)\"; "\n            "case \"$cmd\" in *freqtrade*trade*) ;; *) exit 73 ;; esac; "\n            "exec freqtrade list-pairs --config /runtime/config/config.json "\n            "--exchange \"$1\" --quote \"$2\" --print-json >/dev/null"\n        )\n        probe = self._runner.run(\n            (\n                "docker",\n                "exec",\n                runtime_id,\n                "/bin/sh",\n                "-ec",\n                script,\n                "portal-readiness",\n                exchange_name,\n                quote,\n            )\n        )\n        return probe.returncode == 0\n\n    def _reattest_before_release'''
          replace_once('ai_platform/portal/execution/driver.py', marker, replacement)

          bootstrap = Path('ai_platform/portal/execution/runtime_image/portal-runtime-quarantine')
          text = bootstrap.read_text(encoding='utf-8')
          start = text.index('child_pid=""\n')
          bootstrap.write_text(text[:start] + 'exec "$@"\n', encoding='utf-8')

          replace_once(
              'tests/ai_platform/portal/execution/test_driver.py',
              '    config.write_text("{}\\n", encoding="utf-8")\n',
              '''    config.write_text(\n        json.dumps(\n            {\n                "dry_run": True,\n                "stake_currency": "USD",\n                "exchange": {"name": "kraken", "key": "", "secret": ""},\n            }\n        )\n        + "\\n",\n        encoding="utf-8",\n    )\n''',
          )

          ready_test = '''def test_released_runtime_is_starting_until_application_ready() -> None:\n    runner = _Runner(\n        CommandResult(0, stdout="running\\n"),\n        CommandResult(0),\n        CommandResult(1),\n    )\n    assert DockerCliRuntimeDriver(runner).inspect("runtime-1") is DriverRuntimeState.STARTING\n\n\n'''
          ready_replacement = '''def test_released_runtime_is_starting_without_trusted_generation_probe() -> None:\n    runner = _Runner(\n        CommandResult(0, stdout="running\\n"),\n        CommandResult(0),\n    )\n    assert DockerCliRuntimeDriver(runner).inspect("runtime-1") is DriverRuntimeState.STARTING\n\n\ndef test_strategy_stdout_cannot_spoof_application_readiness(tmp_path: Path) -> None:\n    spec = _spec(tmp_path)\n    runner = _Runner(\n        CommandResult(0, stdout="running\\n"),\n        CommandResult(0),\n        CommandResult(\n            1,\n            stdout="Bot heartbeat. PID=999, state='RUNNING'\\n",\n            stderr="probe failed",\n        ),\n    )\n    driver = DockerCliRuntimeDriver(runner)\n    driver._specs[spec.runtime_id] = spec\n\n    assert driver.inspect(spec.runtime_id) is DriverRuntimeState.STARTING\n    assert runner.calls[-1][:3] == ("docker", "exec", spec.runtime_id)\n    assert "list-pairs" in runner.calls[-1][5]\n    assert "Bot heartbeat" not in runner.calls[-1][5]\n\n\n'''
          replace_once('tests/ai_platform/portal/execution/test_driver.py', ready_test, ready_replacement)

          replace_once(
              'tests/ai_platform/portal/execution/test_runtime_image.py',
              '''    assert 'application_ready="$release_dir/application-ready"' in script\n    assert '"Bot heartbeat."*"state=\\'RUNNING\\'"' in script\n    assert '"$@" > "$startup_pipe" 2>&1 &' in script\n    assert 'wait "$child_pid"' in script\n''',
              '''    assert "application-ready" not in script\n    assert "Bot heartbeat." not in script\n    assert "startup_pipe" not in script\n    assert script.rstrip().endswith('exec "$@"')\n''',
          )
          PY

          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/execution/test_driver.py \
            tests/ai_platform/portal/execution/test_runtime_image.py \
            tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
          python -m ruff check --ignore BLE001,TRY004 \
            ai_platform/portal/execution/driver.py \
            tests/ai_platform/portal/execution/test_driver.py \
            tests/ai_platform/portal/execution/test_runtime_image.py \
            tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
          python -m ruff format --check ai_platform/portal/execution/driver.py \
            tests/ai_platform/portal/execution/test_driver.py \
            tests/ai_platform/portal/execution/test_runtime_image.py \
            tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
          python -m mypy ai_platform/portal/execution/driver.py
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/portal/execution/driver.py \
            ai_platform/portal/execution/runtime_image/portal-runtime-quarantine \
            tests/ai_platform/portal/execution/test_driver.py \
            tests/ai_platform/portal/execution/test_runtime_image.py
          git commit -m 'fix(portal): make runtime readiness independent of strategy stdout'
          git push origin HEAD:fix/portal-runtime-isolation-1354
