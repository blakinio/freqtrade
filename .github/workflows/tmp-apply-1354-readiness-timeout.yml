name: Temporary apply #1354 readiness timeout repair

on:
  push:
    branches:
      - fix/portal-runtime-isolation-1354
    paths:
      - .github/workflows/tmp-apply-1354-readiness-timeout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/portal-runtime-isolation-1354
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install focused validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1 ruff mypy PyYAML jsonschema "pydantic>=2.2"
          "SQLAlchemy>=2.0.6" "httpx>=0.24.1" fastapi pyjwt cryptography

      - name: Apply deterministic timeout repair and validate
        env:
          EXPECTED_PARENT: 03f99f933cf0323673d6a5c5dcf32706071b44b1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "ai_platform/portal/execution/driver.py",
              """class CommandRunner(Protocol):\n    def run(self, args: Sequence[str]) -> CommandResult: ...\n\n\nclass SubprocessCommandRunner:\n    def run(self, args: Sequence[str]) -> CommandResult:\n        completed = subprocess.run(\n            list(args),\n            check=False,\n            capture_output=True,\n            text=True,\n        )\n        return CommandResult(\n            returncode=completed.returncode,\n            stdout=completed.stdout,\n            stderr=completed.stderr,\n        )\n""",
              """class CommandRunner(Protocol):\n    def run(\n        self,\n        args: Sequence[str],\n        *,\n        timeout_seconds: float | None = None,\n    ) -> CommandResult: ...\n\n\nclass SubprocessCommandRunner:\n    def run(\n        self,\n        args: Sequence[str],\n        *,\n        timeout_seconds: float | None = None,\n    ) -> CommandResult:\n        try:\n            completed = subprocess.run(\n                list(args),\n                check=False,\n                capture_output=True,\n                text=True,\n                timeout=timeout_seconds,\n            )\n        except subprocess.TimeoutExpired:\n            return CommandResult(\n                returncode=124,\n                stderr=f\"command timed out after {timeout_seconds:g}s\",\n            )\n        return CommandResult(\n            returncode=completed.returncode,\n            stdout=completed.stdout,\n            stderr=completed.stderr,\n        )\n""",
          )

          replace_once(
              "ai_platform/portal/execution/driver.py",
              """    _MAX_LOG_PROBE_BYTES = 64 * 1024 * 1024\n    _LOG_RETENTION_TOLERANCE_BYTES = 256 * 1024\n""",
              """    _MAX_LOG_PROBE_BYTES = 64 * 1024 * 1024\n    _LOG_RETENTION_TOLERANCE_BYTES = 256 * 1024\n    _APPLICATION_PROBE_TIMEOUT_SECONDS = 15.0\n""",
          )

          replace_once(
              "ai_platform/portal/execution/driver.py",
              """        probe = self._runner.run(\n            (\n                \"docker\",\n                \"exec\",\n                runtime_id,\n                \"/bin/sh\",\n                \"-ec\",\n                script,\n                \"portal-readiness\",\n                exchange_name,\n                quote,\n            )\n        )\n""",
              """        probe = self._runner.run(\n            (\n                \"docker\",\n                \"exec\",\n                runtime_id,\n                \"/bin/sh\",\n                \"-ec\",\n                script,\n                \"portal-readiness\",\n                exchange_name,\n                quote,\n            ),\n            timeout_seconds=self._APPLICATION_PROBE_TIMEOUT_SECONDS,\n        )\n""",
          )

          replace_once(
              "tests/ai_platform/portal/execution/test_driver.py",
              """import hashlib\nimport json\nfrom collections.abc import Sequence\n""",
              """import hashlib\nimport json\nimport subprocess\nfrom collections.abc import Sequence\n""",
          )

          replace_once(
              "tests/ai_platform/portal/execution/test_driver.py",
              """    ExternalIsolationCapabilities,\n)\n""",
              """    ExternalIsolationCapabilities,\n    SubprocessCommandRunner,\n)\n""",
          )

          replace_once(
              "tests/ai_platform/portal/execution/test_driver.py",
              """class _Runner:\n    def __init__(self, *results: CommandResult) -> None:\n        self.results = list(results)\n        self.calls: list[tuple[str, ...]] = []\n\n    def run(self, args: Sequence[str]) -> CommandResult:\n        self.calls.append(tuple(args))\n        if not self.results:\n            raise AssertionError(f\"unexpected command: {tuple(args)!r}\")\n        return self.results.pop(0)\n""",
              """class _Runner:\n    def __init__(self, *results: CommandResult) -> None:\n        self.results = list(results)\n        self.calls: list[tuple[str, ...]] = []\n        self.timeouts: list[float | None] = []\n\n    def run(\n        self,\n        args: Sequence[str],\n        *,\n        timeout_seconds: float | None = None,\n    ) -> CommandResult:\n        self.calls.append(tuple(args))\n        self.timeouts.append(timeout_seconds)\n        if not self.results:\n            raise AssertionError(f\"unexpected command: {tuple(args)!r}\")\n        return self.results.pop(0)\n""",
          )

          replace_once(
              "tests/ai_platform/portal/execution/test_driver.py",
              """    assert \"list-pairs\" in runner.calls[-1][5]\n    assert \"Bot heartbeat\" not in runner.calls[-1][5]\n\n\ndef test_running_generation_repeats_current_isolation_attestation(tmp_path: Path) -> None:\n""",
              """    assert \"list-pairs\" in runner.calls[-1][5]\n    assert \"Bot heartbeat\" not in runner.calls[-1][5]\n    assert runner.timeouts[-1] == DockerCliRuntimeDriver._APPLICATION_PROBE_TIMEOUT_SECONDS\n\n\ndef test_subprocess_command_runner_maps_timeout_to_bounded_failure(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    def expire(*args: object, **kwargs: object) -> subprocess.CompletedProcess[str]:\n        del args\n        assert kwargs.get(\"timeout\") == 0.25\n        raise subprocess.TimeoutExpired(cmd=[\"docker\"], timeout=0.25)\n\n    monkeypatch.setattr(subprocess, \"run\", expire)\n\n    result = SubprocessCommandRunner().run(\n        (\"docker\", \"exec\", \"runtime-1\", \"true\"),\n        timeout_seconds=0.25,\n    )\n\n    assert result.returncode == 124\n    assert \"timed out after 0.25s\" in result.stderr\n\n\ndef test_running_generation_repeats_current_isolation_attestation(tmp_path: Path) -> None:\n""",
          )
          PY

          python - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path('.github/workflows/portal-runtime-isolation-e2e.yml').read_text(encoding='utf-8'))
          PY
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/execution/test_driver.py
          python -m ruff check --ignore BLE001,TRY004 \
            ai_platform/portal/execution/driver.py \
            tests/ai_platform/portal/execution/test_driver.py
          python -m ruff format --check \
            ai_platform/portal/execution/driver.py \
            tests/ai_platform/portal/execution/test_driver.py
          python -m mypy ai_platform/portal/execution/driver.py
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/portal/execution/driver.py tests/ai_platform/portal/execution/test_driver.py
          git commit -m 'fix(portal): bound application readiness probe'
          git push origin HEAD:fix/portal-runtime-isolation-1354
