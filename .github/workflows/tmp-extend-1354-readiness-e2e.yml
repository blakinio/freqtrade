name: Temporary extend #1354 readiness E2E window

on:
  push:
    branches:
      - fix/portal-runtime-isolation-1354
    paths:
      - .github/workflows/tmp-extend-1354-readiness-e2e.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/portal-runtime-isolation-1354
          fetch-depth: 0
          persist-credentials: true
      - name: Extend only application readiness polling window
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py')
          text = path.read_text(encoding='utf-8')
          old = '''        for _ in range(40):
              state = driver.inspect(runtime_id)
              if state is DriverRuntimeState.RUNNING:
                  break
              assert state is DriverRuntimeState.STARTING
              time.sleep(0.25)
          else:
              pytest.fail("released PAPER runtime did not reach application readiness")
'''
          # Keep indentation from source exact via a less fragile unique block.
          old = '''        for _ in range(40):
            state = driver.inspect(runtime_id)
            if state is DriverRuntimeState.RUNNING:
                break
            assert state is DriverRuntimeState.STARTING
            time.sleep(0.25)
        else:
            pytest.fail("released PAPER runtime did not reach application readiness")
'''
          new = '''        for _ in range(240):
            state = driver.inspect(runtime_id)
            if state is DriverRuntimeState.RUNNING:
                break
            assert state is DriverRuntimeState.STARTING
            time.sleep(0.25)
        else:
            observed = _run("docker", "logs", runtime_id)
            pytest.fail(
                "released PAPER runtime did not reach application readiness: "
                + (observed.stdout + observed.stderr)[-4000:]
            )
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one readiness polling block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m compileall -q tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/ai_platform/portal/execution/test_linux_isolation_backend_e2e.py
          git commit -m 'test(portal): allow bounded first-process readiness'
          git push origin HEAD:fix/portal-runtime-isolation-1354
