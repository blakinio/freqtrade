name: Temporary Liquidations Watchdog Formatter

on:
  push:
    branches:
      - fix/liquidations-monitor-stale-self-heal-20260804
    paths:
      - .github/workflows/tmp-format-liquidations-watchdog.yml

permissions:
  contents: read
  issues: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ruff check --select I001 --fix ai_platform/scripts/liquidation_alert_watchdog.py
          git diff -- ai_platform/scripts/liquidation_alert_watchdog.py > "$RUNNER_TEMP/ruff-import.diff"
          python - <<'PY' > "$RUNNER_TEMP/comment.json"
          import json
          import os
          from pathlib import Path

          diff = Path(os.environ["RUNNER_TEMP"]).joinpath("ruff-import.diff").read_text()
          print(json.dumps({"body": "<!-- temporary-ruff-import-diff -->\n```diff\n" + diff + "\n```"}))
          PY
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/1200/comments" \
            --data-binary @"$RUNNER_TEMP/comment.json" >/dev/null
