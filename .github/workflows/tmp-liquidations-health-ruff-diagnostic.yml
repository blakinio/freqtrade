name: Temporary Liquidations Health Ruff Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/tmp-liquidations-health-ruff-diagnostic.yml
      - ai_platform/scripts/liquidation_live_health.py
      - tests/ai_platform_integration/test_liquidation_live_health.py
  push:
    branches:
      - feat/liquidations-live-operational-alerting-20260728
    paths:
      - .github/workflows/tmp-liquidations-health-ruff-diagnostic.yml
      - ai_platform/scripts/liquidation_live_health.py
      - tests/ai_platform_integration/test_liquidation_live_health.py

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Capture Ruff diagnostics
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.21
          set +e
          ruff check ai_platform tests/ai_platform > ruff-check.txt 2>&1
          echo $? > ruff-exit-code.txt
          ruff format --check ai_platform tests/ai_platform > ruff-format.txt 2>&1
          echo $? > ruff-format-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liquidations-health-ruff-diagnostic-${{ github.sha }}
          path: |
            ruff-check.txt
            ruff-exit-code.txt
            ruff-format.txt
            ruff-format-exit-code.txt
          if-no-files-found: error
          retention-days: 1
