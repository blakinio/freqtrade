name: Temporary Liquidations NanoCPUs Patch

on:
  push:
    branches:
      - fix/liquidations-live-synology-nanocpus-20260727

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'blakinio/freqtrade'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/liquidations-live-synology-nanocpus-20260727
          fetch-depth: 0

      - name: Apply bounded compatibility repair
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path("deploy/synology/liquid20/deploy-live.sh")
          script = script_path.read_text(encoding="utf-8")
          old = "        --memory 512m \\\n        --cpus 1.0 \\\n        --stop-timeout 30 \\\n"
          new = "        --memory 512m \\\n        --stop-timeout 30 \\\n"
          if script.count(old) != 1:
              raise SystemExit("expected one controlled deployment NanoCPUs block")
          script_path.write_text(script.replace(old, new), encoding="utf-8")

          test_path = Path("tests/ai_platform_integration/test_synology_liquid20_live_deployment.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "\ndef test_deployment_resolves_non_root_uid_and_existing_data_group() -> None:\n"
          addition = '''\n\ndef test_deployment_avoids_unsupported_synology_nanocpus_quota() -> None:\n    script = (DEPLOYMENT_ROOT / "deploy-live.sh").read_text(encoding="utf-8")\n\n    assert "--cpus" not in script\n    assert "--memory 512m" in script\n    assert "--pids-limit 128" in script\n'''
          if tests.count(marker) != 1:
              raise SystemExit("deployment identity test marker changed")
          test_path.write_text(tests.replace(marker, addition + marker), encoding="utf-8")

          doc_path = Path("deploy/synology/liquid20/LIVE_STREAM.md")
          doc = doc_path.read_text(encoding="utf-8")
          sentence = "A root-only helper may create and set mode/ownership on `data/live` and `data/live/runs`; it does not recurse and never changes `data/runs`."
          replacement = sentence + " The controlled Synology path intentionally omits Docker `NanoCPUs`/`--cpus` because the target kernel may not expose CPU CFS; the 512 MiB memory and 128-process limits remain enforced."
          if doc.count(sentence) != 1:
              raise SystemExit("live stream identity paragraph changed")
          doc_path.write_text(doc.replace(sentence, replacement), encoding="utf-8")
          PY

          bash -n deploy/synology/liquid20/deploy-live.sh
          python - <<'PY'
          from pathlib import Path

          script = Path("deploy/synology/liquid20/deploy-live.sh").read_text(encoding="utf-8")
          assert "--cpus" not in script
          assert "--memory 512m" in script
          assert "--pids-limit 128" in script
          assert "NanoCPUs" in Path("deploy/synology/liquid20/LIVE_STREAM.md").read_text(encoding="utf-8")
          PY

      - name: Commit repair and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-liquidations-nanocpus-patch.yml
          git add deploy/synology/liquid20/deploy-live.sh \
            deploy/synology/liquid20/LIVE_STREAM.md \
            tests/ai_platform_integration/test_synology_liquid20_live_deployment.py
          git commit -m "fix(liquidations): avoid unsupported Synology NanoCPUs"
          git push origin HEAD:fix/liquidations-live-synology-nanocpus-20260727
