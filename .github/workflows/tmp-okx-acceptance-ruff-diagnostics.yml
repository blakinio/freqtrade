name: Temporary OKX Acceptance Ruff Diagnostics

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop
    paths:
      - "ai_platform/scripts/liquidation_okx_shadow_acceptance.py"
      - "ai_platform/scripts/liquidation_okx_shadow_acceptance_evaluator.py"
      - "tests/ai_platform_integration/test_liquidation_okx_shadow_acceptance.py"
      - ".github/workflows/tmp-okx-acceptance-ruff-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Capture Ruff diagnostics
        run: |
          python -m pip install --disable-pip-version-check ruff==0.14.14
          ruff --version > ruff-diagnostics.txt
          ruff check \
            ai_platform/scripts/liquidation_okx_shadow_acceptance.py \
            ai_platform/scripts/liquidation_okx_shadow_acceptance_evaluator.py \
            tests/ai_platform_integration/test_liquidation_okx_shadow_acceptance.py \
            >> ruff-diagnostics.txt 2>&1 || true
          ruff format --check \
            ai_platform/scripts/liquidation_okx_shadow_acceptance.py \
            ai_platform/scripts/liquidation_okx_shadow_acceptance_evaluator.py \
            tests/ai_platform_integration/test_liquidation_okx_shadow_acceptance.py \
            >> ruff-diagnostics.txt 2>&1 || true

      - name: Upload diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: okx-acceptance-ruff-diagnostics
          path: ruff-diagnostics.txt
          retention-days: 1
