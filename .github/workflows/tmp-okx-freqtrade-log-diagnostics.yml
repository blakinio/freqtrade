name: Temporary OKX Freqtrade Log Diagnostics

on:
  pull_request:
    types: [synchronize]
    branches:
      - develop
    paths:
      - ".github/workflows/tmp-okx-freqtrade-log-diagnostics.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnostics:
    if: github.event.pull_request.number == 417
    runs-on: ubuntu-24.04
    steps:
      - name: Download failed job log tail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/89852419003/logs" \
            --output job.log
          tail -n 300 job.log > failure-tail.txt

      - name: Upload failure tail
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: okx-freqtrade-failure-tail
          path: failure-tail.txt
          retention-days: 1
