name: Temporary run #1354 runtime repair

on:
  push:
    branches:
      - fix/portal-runtime-isolation-1354
    paths:
      - .github/workflows/tmp-run-1354-runtime-repair.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'blakinio/freqtrade'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/portal-runtime-isolation-1354
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install focused validation dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff mypy jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6" "httpx>=0.24.1" fastapi pyjwt cryptography "PyYAML>=6.0"

      - name: Reuse deterministic repair and validate
        env:
          EXPECTED_PARENT: e6a48c7feaa65e6797f1a2bbe0a5cb6054135cd4
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT"..HEAD)
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/tmp-apply-1354-runtime-repair.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/tmp-run-1354-runtime-repair.yml'
          test "${#changed[@]}" -eq 2

          awk '
            /^          python - <<'\''PY'\''$/ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/tmp-apply-1354-runtime-repair.yml > /tmp/apply_repair.py
          test -s /tmp/apply_repair.py
          python /tmp/apply_repair.py

          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/execution/test_driver.py \
            tests/ai_platform/portal/execution/test_host_isolation_cleanup.py
          python -m ruff check --ignore BLE001,TRY004 \
            ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py \
            tests/ai_platform/portal/execution/test_driver.py tests/ai_platform/portal/execution/test_host_isolation_cleanup.py
          python -m ruff format --check ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py \
            tests/ai_platform/portal/execution/test_driver.py tests/ai_platform/portal/execution/test_host_isolation_cleanup.py
          python -m mypy ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/portal/execution/driver.py ai_platform/portal/execution/host_isolation.py \
            tests/ai_platform/portal/execution/test_driver.py tests/ai_platform/portal/execution/test_host_isolation_cleanup.py
          git commit -m 'fix(portal): preserve isolation through teardown and log reattestation'
          git push origin HEAD:fix/portal-runtime-isolation-1354
