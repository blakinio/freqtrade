name: Temporary WH-04 candidate contract fix

on:
  push:
    branches:
      - tmp/wh04-candidate-contract-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: tmp/wh04-candidate-contract-fix
          persist-credentials: true
      - name: Replace stale candidate reconstruction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/wickhunter/lightgbm_scorer.py")
          text = path.read_text()
          start = text.index("def _model_ignore_candidate(")
          end = text.index("\n\ndef evaluate_lightgbm_against_baseline", start)
          replacement = '''def _model_ignore_candidate(
              candidate: WickHunterCandidate,
              *,
              score_id: str,
          ) -> WickHunterCandidate:
              reasons = tuple(sorted({*candidate.reason_codes, "model_confidence_below_threshold"}))
              return WickHunterCandidate(
                  candidate_id=canonical_sha256(
                      {
                          "candidate_id": candidate.candidate_id,
                          "score_id": score_id,
                          "action": CandidateAction.IGNORE.value,
                          "reason_codes": reasons,
                      }
                  ),
                  action=CandidateAction.IGNORE,
                  hypothesis=candidate.hypothesis,
                  symbol=candidate.symbol,
                  decision_timestamp_ms=candidate.decision_timestamp_ms,
                  decision_price=candidate.decision_price,
                  reason_codes=reasons,
                  feature_hash=candidate.feature_hash,
                  parameter_version=candidate.parameter_version,
                  parameter_hash=candidate.parameter_hash,
              )
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          rm .github/workflows/tmp-wh04-contract-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/wickhunter/lightgbm_scorer.py .github/workflows/tmp-wh04-contract-fix.yml
          git commit -m "fix(wickhunter): align no-trade candidate contract [skip ci]"
          git push origin HEAD:tmp/wh04-candidate-contract-fix
