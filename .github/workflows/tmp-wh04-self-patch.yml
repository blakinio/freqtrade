name: Temporary WH-04 self patch

on:
  push:
    branches:
      - feat/wickhunter-wh04-lightgbm-scorer-v1
    paths:
      - .github/workflows/tmp-wh04-self-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wickhunter-wh04-lightgbm-scorer-v1
          fetch-depth: 0
      - name: Apply bounded source patch
        shell: python
        run: |
          from pathlib import Path

          source = Path("ai_platform/wickhunter/lightgbm_scorer.py")
          text = source.read_text(encoding="utf-8")
          replacements = {
              "    CandidateAction,\n    ModelPromotionState,": "    CandidateAction,\n    CandidateScore,\n    LiquidationFeatureVector,\n    ModelPromotionState,",
              "    \"return\",\n    \"profit\",": "    \"net_return\",\n    \"gross_return\",\n    \"future_return\",\n    \"profit\",",
              "    except Exception as exc:  # pragma: no cover - Decimal normalizes known scalar inputs\n": "    except (ArithmeticError, TypeError, ValueError) as exc:\n",
              "        features,\n        parameters: WickHunterParameters,\n    ):": "        features: LiquidationFeatureVector,\n        parameters: WickHunterParameters,\n    ) -> CandidateScore:",
              "def _feature_values(*, features, candidate: WickHunterCandidate) -> tuple[Decimal, ...]:": "def _feature_values(\n    *,\n    features: LiquidationFeatureVector,\n    candidate: WickHunterCandidate,\n) -> tuple[Decimal, ...]:",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing source patch anchor: {old!r}")
              text = text.replace(old, new, 1)
          source.write_text(text, encoding="utf-8")

          test = Path("tests/ai_platform_integration/test_wickhunter_lightgbm_scorer.py")
          text = test.read_text(encoding="utf-8")
          old = "    DEFAULT_RESEARCH_BOUNDS,\n    INITIAL_COMPATIBILITY_PRIOR,\n)"
          new = "    DEFAULT_RESEARCH_BOUNDS,\n    INITIAL_COMPATIBILITY_PRIOR,\n    WickHunterParameters,\n)"
          if old not in text:
              raise SystemExit("missing test import patch anchor")
          text = text.replace(old, new, 1)
          old = "def _parameters():"
          new = "def _parameters() -> WickHunterParameters:"
          if old not in text:
              raise SystemExit("missing test annotation patch anchor")
          test.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path(".github/workflows/tmp-wh04-self-patch.yml").unlink()
      - name: Commit bounded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/wickhunter/lightgbm_scorer.py tests/ai_platform_integration/test_wickhunter_lightgbm_scorer.py .github/workflows/tmp-wh04-self-patch.yml
          git commit -m "fix(wickhunter): tighten LightGBM leakage audit and typing"
          git push origin HEAD:feat/wickhunter-wh04-lightgbm-scorer-v1
