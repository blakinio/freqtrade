          ref: feat/wickhunter-wh05-bounded-optimizer-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded source corrections
        shell: python
        run: |
          from pathlib import Path

          source = Path("ai_platform/wickhunter/bounded_optimizer.py")
          text = source.read_text(encoding="utf-8")
          old = "    except Exception as exc:\n"
          new = "    except RuntimeError as exc:\n"
          if old not in text:
              raise SystemExit("missing evaluator exception anchor")
          text = text.replace(old, new, 1)
          old = "    policy: BoundedOptimizerPolicy = BoundedOptimizerPolicy(),\n"
          new = "    policy: BoundedOptimizerPolicy | None = None,\n"
          if old not in text:
              raise SystemExit("missing policy default anchor")
          text = text.replace(old, new, 1)
          old = ") -> BoundedOptimizationResult:\n    _audit_cases(cases, policy)\n"
          new = ") -> BoundedOptimizationResult:\n    policy = policy or BoundedOptimizerPolicy()\n    _audit_cases(cases, policy)\n"
          if old not in text:
              raise SystemExit("missing policy initialization anchor")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

