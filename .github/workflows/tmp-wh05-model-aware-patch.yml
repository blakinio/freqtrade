name: Temporary WH-05 model-aware patch

on:
  push:
    branches:
      - tmp/wh05-model-aware-patch

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: tmp/wh05-model-aware-patch
          persist-credentials: true
      - name: Apply model-aware extension
        shell: bash
        env:
          PAYLOAD_GZ_B64: 
        run: |
          python - <<'PY'
          import base64
          import gzip
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              gzip.decompress(base64.b64decode(os.environ["PAYLOAD_GZ_B64"]))
          )

          module = Path("ai_platform/wickhunter/bounded_optimizer.py")
          text = module.read_text()
          text = text.replace(
              "from dataclasses import dataclass, fields\n",
              "from dataclasses import dataclass, fields, replace\n",
              1,
          )
          text = text.replace(
              "from enum import StrEnum\n",
              "from enum import StrEnum\nfrom typing import Protocol\n",
              1,
          )
          text = text.replace(
              "    report: BaselineEvaluationReport,\n",
              "    report: OptimizationReport,\n",
              1,
          )
          if "WALK_FORWARD_SCHEMA_VERSION" in text:
              raise SystemExit("model-aware extension already present")
          module.write_text(text.rstrip() + "\n\n" + payload["extension"].strip() + "\n")

          tests = Path("tests/ai_platform_integration/test_wickhunter_bounded_optimizer.py")
          test_text = tests.read_text()
          test_text = test_text.replace(
              "    BoundedOptimizerPolicy,\n",
              "    BoundedOptimizerPolicy,\n"
              "    ModelAwareReport,\n"
              "    ParameterScope,\n"
              "    ScopeSpec,\n"
              "    WalkForwardFold,\n",
              1,
          )
          test_text = test_text.replace(
              "    optimize_bounded_parameters,\n",
              "    optimize_bounded_parameters,\n"
              "    optimize_model_aware_walk_forward,\n",
              1,
          )
          tests.write_text(test_text.rstrip() + "\n\n" + payload["tests"].strip() + "\n")
          Path("docs/ai_platform/WICKHUNTER_BOUNDED_OPTIMIZER.md").write_text(
              payload["doc"]
          )
          Path(
              "docs/agents/tasks/FTAI-20260801-wickhunter-wh05-bounded-optimizer-v1.md"
          ).write_text(payload["task"])
          PY
          python -m pip install --disable-pip-version-check ruff
          ruff check --fix --select I             ai_platform/wickhunter/bounded_optimizer.py             tests/ai_platform_integration/test_wickhunter_bounded_optimizer.py
          ruff format             ai_platform/wickhunter/bounded_optimizer.py             tests/ai_platform_integration/test_wickhunter_bounded_optimizer.py
          python -m compileall -q ai_platform/wickhunter/bounded_optimizer.py             tests/ai_platform_integration/test_wickhunter_bounded_optimizer.py
          rm .github/workflows/tmp-wh05-model-aware-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add             ai_platform/wickhunter/bounded_optimizer.py             tests/ai_platform_integration/test_wickhunter_bounded_optimizer.py             docs/ai_platform/WICKHUNTER_BOUNDED_OPTIMIZER.md             docs/agents/tasks/FTAI-20260801-wickhunter-wh05-bounded-optimizer-v1.md             .github/workflows/tmp-wh05-model-aware-patch.yml
          git commit -m "feat(wickhunter): add model-aware walk-forward optimization [skip ci]"
          git push origin HEAD:tmp/wh05-model-aware-patch
