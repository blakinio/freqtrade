name: Temporary WH-09 CI repair

on:
  push:
    branches:
      - feat/wickhunter-wh09-paper-validation-v1

permissions:
  contents: write

concurrency:
  group: tmp-wh09-ci-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'repair WH-09 CI contract') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-wh09-paper-validation-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded repair
        shell: python
        run: |
          from pathlib import Path

          implementation = Path("ai_platform/wickhunter/paper_validation.py")
          tests = Path("tests/ai_platform_integration/test_wickhunter_paper_validation.py")

          source = implementation.read_text(encoding="utf-8")
          decimal_old = '''        for value, field_name in (
              (self.cumulative_realized_pnl_quote, "cumulative_realized_pnl_quote"),
              (self.unrealized_pnl_quote, "unrealized_pnl_quote"),
              (self.simulated_equity_quote, "simulated_equity_quote"),
              (self.drawdown_ratio, "drawdown_ratio"),
          ):
              _decimal(value, field=field_name)
          '''
          decimal_new = '''        for decimal_value, field_name in (
              (self.cumulative_realized_pnl_quote, "cumulative_realized_pnl_quote"),
              (self.unrealized_pnl_quote, "unrealized_pnl_quote"),
              (self.simulated_equity_quote, "simulated_equity_quote"),
              (self.drawdown_ratio, "drawdown_ratio"),
          ):
              _decimal(decimal_value, field=field_name)
          '''
          review_old = '''    return CandidateReviewPackage(
              schema_version=REVIEW_SCHEMA_VERSION,
              package_id=package_id,
              **payload,
          )
          '''
          review_new = '''    return CandidateReviewPackage(
              schema_version=REVIEW_SCHEMA_VERSION,
              package_id=package_id,
              report_id=report.report_id,
              run_id=request.run_id,
              eligible_for_owner_review=report.candidate_review_eligible,
              model_version=request.model_version,
              model_hash=request.model_hash,
              parameter_version=request.parameter_version,
              parameter_hash=request.parameter_hash,
              rollback_model_version=request.rollback_model_version,
              rollback_model_hash=request.rollback_model_hash,
              rollback_parameter_version=request.rollback_parameter_version,
              rollback_parameter_hash=request.rollback_parameter_hash,
              owner_decision_required=True,
              automatic_promotion_enabled=False,
              trading_credentials_present=False,
              execution_enabled=False,
              orders_submitted=0,
              live_capital_authorized=False,
          )
          '''

          for old, new, label in (
              (decimal_old, decimal_new, "decimal validation typing"),
              (review_old, review_new, "candidate review typing"),
          ):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one {label} block, found {count}")
              source = source.replace(old, new)

          status_replacements = {
              "ShadowStatus.REJECTED_BY_RISK": "ShadowStatus.SIMULATED_REJECTED",
              "ShadowStatus.IGNORED": "ShadowStatus.NO_CANDIDATE",
          }
          for old, new in status_replacements.items():
              if old not in source:
                  raise SystemExit(f"missing implementation status reference: {old}")
              source = source.replace(old, new)

          test_source = tests.read_text(encoding="utf-8")
          for old, new in status_replacements.items():
              if old not in test_source:
                  raise SystemExit(f"missing test status reference: {old}")
              test_source = test_source.replace(old, new)

          implementation.write_text(source, encoding="utf-8")
          tests.write_text(test_source, encoding="utf-8")

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wh09-ci-repair.yml
          git add ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wickhunter): repair WH-09 CI contract"
          git push origin HEAD:feat/wickhunter-wh09-paper-validation-v1
