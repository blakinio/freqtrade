name: Temporary WH-09 CI repair

on:
  push:
    branches:
      - feat/wickhunter-wh09-paper-validation-v1
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/wickhunter-wh09-paper-validation-v1

permissions:
  contents: write

concurrency:
  group: tmp-wh09-ci-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'repair WH-09 CI contract') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-wh09-paper-validation-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded repair
        shell: python
        run: |
          from pathlib import Path

          implementation = Path("ai_platform/wickhunter/paper_validation.py")
          tests = Path("tests/ai_platform_integration/test_wickhunter_paper_validation.py")

          source = implementation.read_text(encoding="utf-8")
          decimal_header_old = (
              "        for value, field_name in (\n"
              "            (self.cumulative_realized_pnl_quote, "
              '"cumulative_realized_pnl_quote"),\n'
          )
          decimal_header_new = decimal_header_old.replace(
              "for value, field_name", "for decimal_value, field_name"
          )
          decimal_call_old = (
              "            _decimal(value, field=field_name)\n"
              "        if self.simulated_equity_quote <= 0:\n"
          )
          decimal_call_new = decimal_call_old.replace(
              "_decimal(value,", "_decimal(decimal_value,"
          )
          review_old = (
              "    return CandidateReviewPackage(\n"
              "        schema_version=REVIEW_SCHEMA_VERSION,\n"
              "        package_id=package_id,\n"
              "        **payload,\n"
              "    )\n"
          )
          review_new = (
              "    return CandidateReviewPackage(\n"
              "        schema_version=REVIEW_SCHEMA_VERSION,\n"
              "        package_id=package_id,\n"
              "        report_id=report.report_id,\n"
              "        run_id=request.run_id,\n"
              "        eligible_for_owner_review=report.candidate_review_eligible,\n"
              "        model_version=request.model_version,\n"
              "        model_hash=request.model_hash,\n"
              "        parameter_version=request.parameter_version,\n"
              "        parameter_hash=request.parameter_hash,\n"
              "        rollback_model_version=request.rollback_model_version,\n"
              "        rollback_model_hash=request.rollback_model_hash,\n"
              "        rollback_parameter_version=request.rollback_parameter_version,\n"
              "        rollback_parameter_hash=request.rollback_parameter_hash,\n"
              "        owner_decision_required=True,\n"
              "        automatic_promotion_enabled=False,\n"
              "        trading_credentials_present=False,\n"
              "        execution_enabled=False,\n"
              "        orders_submitted=0,\n"
              "        live_capital_authorized=False,\n"
              "    )\n"
          )

          for old, new, label in (
              (decimal_header_old, decimal_header_new, "decimal loop header"),
              (decimal_call_old, decimal_call_new, "decimal validation call"),
              (review_old, review_new, "candidate review constructor"),
          ):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one {label}, found {count}")
              source = source.replace(old, new)

          implementation_status_replacements = {
              "ShadowStatus.REJECTED_BY_RISK": "ShadowStatus.SIMULATED_REJECTED",
              "ShadowStatus.IGNORED": "ShadowStatus.NO_CANDIDATE",
          }
          for old, new in implementation_status_replacements.items():
              if old not in source:
                  raise SystemExit(f"missing implementation status reference: {old}")
              source = source.replace(old, new)

          test_source = tests.read_text(encoding="utf-8")
          test_status_replacements = {
              "ShadowStatus.REJECTED_BY_RISK": "ShadowStatus.SIMULATED_REJECTED",
          }
          for old, new in test_status_replacements.items():
              if old not in test_source:
                  raise SystemExit(f"missing test status reference: {old}")
              test_source = test_source.replace(old, new)

          implementation.write_text(source, encoding="utf-8")
          tests.write_text(test_source, encoding="utf-8")

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wh09-ci-repair.yml
          git add ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wickhunter): repair WH-09 CI contract"
          git push origin HEAD:feat/wickhunter-wh09-paper-validation-v1
