name: Temporary WH-09 final semantic verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/wickhunter-wh09-paper-validation-v1

permissions:
  contents: write

concurrency:
  group: tmp-wh09-finalize-semantic-verification
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-wh09-paper-validation-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install locked repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Apply semantic hardening and canonical fixture
        shell: python
        run: |
          from pathlib import Path

          workflow = Path(".github/workflows/tmp-wh09-semantic-verification-retry.yml")
          text = workflow.read_text(encoding="utf-8")
          start_marker = (
              "      - name: Apply bounded semantic verification hardening\n"
              "        shell: python\n"
              "        run: |\n"
          )
          end_marker = "\n      - name: Format and lint exact files\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("unable to isolate semantic hardening script")
          body = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = body.splitlines()
          if any(line and not line.startswith("          ") for line in lines):
              raise SystemExit("unexpected semantic hardening indentation")
          script = "\n".join(line[10:] if line else "" for line in lines) + "\n"
          exec(compile(script, str(workflow), "exec"), {})

          tests = Path("tests/ai_platform_integration/test_wickhunter_paper_validation.py")
          test_source = tests.read_text(encoding="utf-8")
          start = test_source.index(
              "def _parity(snapshot: PortalObservabilitySnapshot) -> ReplayShadowParityEvidence:"
          )
          end = test_source.index("\n\ndef _exercises(", start)
          replacement = '''def _parity(snapshot: PortalObservabilitySnapshot) -> ReplayShadowParityEvidence:
              decision = snapshot.decisions[0]
              schema_version = "wickhunter-replay-shadow-parity-v1"
              label_id = canonical_sha256({"label": snapshot.observed_at_ms})
              payload = {
                  "shadow_decision_id": decision.shadow_decision_id,
                  "label_id": label_id,
                  "symbol": "BTCUSDT",
                  "side": TradeDirection.LONG.value,
                  "decision_timestamp_ms": snapshot.observed_at_ms,
                  "dataset_hash": DATASET_HASH,
                  "code_sha": CODE_SHA,
                  "take_profit_ratio": Decimal("0.02"),
                  "stop_loss_ratio": Decimal("0.01"),
                  "label_outcome": LabelOutcome.TAKE_PROFIT.value,
                  "identities_match": True,
                  "policy_match": True,
                  "execution_authority_absent": True,
              }
              return ReplayShadowParityEvidence(
                  schema_version=schema_version,
                  parity_id=canonical_sha256(
                      {"schema_version": schema_version, "payload": payload}
                  ),
                  shadow_decision_id=decision.shadow_decision_id,
                  label_id=label_id,
                  symbol="BTCUSDT",
                  side=TradeDirection.LONG,
                  decision_timestamp_ms=snapshot.observed_at_ms,
                  dataset_hash=DATASET_HASH,
                  code_sha=CODE_SHA,
                  take_profit_ratio=Decimal("0.02"),
                  stop_loss_ratio=Decimal("0.01"),
                  label_outcome=LabelOutcome.TAKE_PROFIT,
                  identities_match=True,
                  policy_match=True,
                  execution_authority_absent=True,
              )
          '''
          tests.write_text(test_source[:start] + replacement + test_source[end:], encoding="utf-8")

      - name: Format and lint exact files
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          ruff format ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          ruff check ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          ruff format --check ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          python -m compileall -q ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py

      - name: Run focused WH-09 tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/ai_platform_integration/test_wickhunter_paper_validation.py

      - name: Commit final hardening and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wh09-semantic-verification.yml
          git rm .github/workflows/tmp-wh09-semantic-verification-retry.yml
          git rm .github/workflows/tmp-wh09-diagnostic.yml
          git rm .github/workflows/tmp-wh09-finalize-semantic-verification.yml
          git add ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wickhunter): verify published evidence semantics"
          git push origin HEAD:feat/wickhunter-wh09-paper-validation-v1
