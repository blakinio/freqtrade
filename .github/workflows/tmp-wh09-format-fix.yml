name: Temporary WH-09 format cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/wickhunter-wh09-paper-validation-v1

permissions:
  contents: write

concurrency:
  group: tmp-wh09-format-fix
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-wh09-paper-validation-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded formatting cleanup
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("ai_platform/wickhunter/paper_validation.py"): (
                  (
                      "def _request_identity_payload(    *,\n",
                      "def _request_identity_payload(\n    *,\n",
                  ),
              ),
              Path("tests/ai_platform_integration/test_wickhunter_paper_validation.py"): (
                  (
                      "    return PaperValidationPolicy(**overrides)  # type: ignore[arg-type]\n\ndef _request(",
                      "    return PaperValidationPolicy(**overrides)  # type: ignore[arg-type]\n\n\ndef _request(",
                  ),
                  (
                      "        for kind in sorted(SafetyExerciseKind, key=lambda item: item.value)\n    )\n\ndef _accepted_inputs():",
                      "        for kind in sorted(SafetyExerciseKind, key=lambda item: item.value)\n    )\n\n\ndef _accepted_inputs():",
                  ),
                  (
                      "    return policy, request, snapshots, parity, exercises\n\ndef test_default_policy_requires_real_sustained_window() -> None:",
                      "    return policy, request, snapshots, parity, exercises\n\n\ndef test_default_policy_requires_real_sustained_window() -> None:",
                  ),
                  (
                      "    assert not result.candidate_review.eligible_for_owner_review\n\ndef test_identity_mismatch_is_rejected() -> None:",
                      "    assert not result.candidate_review.eligible_for_owner_review\n\n\ndef test_identity_mismatch_is_rejected() -> None:",
                  ),
              ),
          }

          for path, path_replacements in replacements.items():
              content = path.read_text(encoding="utf-8")
              for old, new in path_replacements:
                  count = content.count(old)
                  if count != 1:
                      raise SystemExit(f"expected one formatting target in {path}, found {count}")
                  content = content.replace(old, new)
              path.write_text(content, encoding="utf-8")

      - name: Validate syntax and diff
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          git diff --check

      - name: Commit cleanup and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wh09-format-fix.yml
          git add ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(wickhunter): normalize WH-09 formatting"
          git push origin HEAD:feat/wickhunter-wh09-paper-validation-v1
