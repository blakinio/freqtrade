name: Temporary WH-09 mypy repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/wickhunter-wh09-paper-validation-v1

permissions:
  contents: write

concurrency:
  group: tmp-wh09-mypy-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-wh09-paper-validation-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install locked repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Apply exact annotation repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("ai_platform/wickhunter/paper_validation.py")
          source = path.read_text(encoding="utf-8")
          old = "    decision_ids = {status: [] for status in ShadowStatus}\n"
          new = (
              "    decision_ids: dict[ShadowStatus, list[str]] = "
              "{status: [] for status in ShadowStatus}\n"
          )
          if source.count(old) != 1:
              raise SystemExit("expected exactly one decision_ids annotation target")
          path.write_text(source.replace(old, new), encoding="utf-8")

      - name: Validate exact repair
        shell: bash
        run: |
          set -euo pipefail
          ruff check ai_platform/wickhunter/paper_validation.py
          ruff format --check ai_platform/wickhunter/paper_validation.py
          mypy ai_platform/wickhunter/paper_validation.py
          pytest -q tests/ai_platform_integration/test_wickhunter_paper_validation.py

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wh09-mypy-fix.yml
          git add ai_platform/wickhunter/paper_validation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wickhunter): annotate decision evidence map"
          git push origin HEAD:feat/wickhunter-wh09-paper-validation-v1
