name: Temporary WH-09 policy hardening trigger

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/wickhunter-wh09-paper-validation-v1

permissions:
  contents: write

concurrency:
  group: tmp-wh09-policy-hardening-trigger
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-wh09-paper-validation-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded policy hardening
        shell: python
        run: |
          from pathlib import Path

          implementation = Path("ai_platform/wickhunter/paper_validation.py")
          tests = Path("tests/ai_platform_integration/test_wickhunter_paper_validation.py")
          source = implementation.read_text(encoding="utf-8")
          test_source = tests.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one {label}, found {count}")
              return text.replace(old, new)

          def replace_section(
              text: str,
              start: str,
              end: str,
              replacement: str,
              label: str,
          ) -> str:
              if text.count(start) != 1:
                  raise SystemExit(f"expected exactly one {label} start")
              start_index = text.index(start)
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"missing {label} end")
              return text[:start_index] + replacement + text[end_index:]

          constants_marker = "\n\n\ndef _text(value: object, *, field: str) -> str:\n"
          constants = '''

          MINIMUM_TERMINAL_DURATION_MS = 86_400_000
          MINIMUM_TERMINAL_SNAPSHOT_COUNT = 96
          MAXIMUM_TERMINAL_SNAPSHOT_GAP_MS = 1_800_000
          MINIMUM_TERMINAL_FRESH_SOURCE_RATIO = Decimal("0.99")
          MAXIMUM_TERMINAL_DRAWDOWN_RATIO = Decimal("0.20")
          REQUIRED_SAFETY_EXERCISES = tuple(
              sorted(SafetyExerciseKind, key=lambda item: item.value)
          )


          def _text(value: object, *, field: str) -> str:
          '''
          source = replace_once(
              source,
              constants_marker,
              constants,
              "terminal policy constants marker",
          )

          policy_fields = '''    minimum_duration_ms: int = MINIMUM_TERMINAL_DURATION_MS
              minimum_snapshot_count: int = MINIMUM_TERMINAL_SNAPSHOT_COUNT
              maximum_snapshot_gap_ms: int = MAXIMUM_TERMINAL_SNAPSHOT_GAP_MS
              minimum_fresh_source_ratio: Decimal = MINIMUM_TERMINAL_FRESH_SOURCE_RATIO
              minimum_decision_count: int = 1
              minimum_allowed_decision_count: int = 1
              minimum_risk_rejection_count: int = 1
              maximum_drawdown_ratio: Decimal = MAXIMUM_TERMINAL_DRAWDOWN_RATIO
              required_exercises: tuple[SafetyExerciseKind, ...] = REQUIRED_SAFETY_EXERCISES'''
          source = replace_section(
              source,
              "    minimum_duration_ms: int =",
              "\n\n    def __post_init__(self) -> None:",
              policy_fields,
              "policy fields",
          )

          policy_validation = '''        if self.minimum_duration_ms < MINIMUM_TERMINAL_DURATION_MS:
                  raise PaperValidationError("minimum_duration_ms cannot weaken the terminal floor")
              if self.minimum_snapshot_count < MINIMUM_TERMINAL_SNAPSHOT_COUNT:
                  raise PaperValidationError("minimum_snapshot_count cannot weaken the terminal floor")
              if not 1 <= self.maximum_snapshot_gap_ms <= MAXIMUM_TERMINAL_SNAPSHOT_GAP_MS:
                  raise PaperValidationError(
                      "maximum_snapshot_gap_ms cannot weaken the terminal ceiling"
                  )
              decision_count_fields = (
                  "minimum_decision_count",
                  "minimum_allowed_decision_count",
                  "minimum_risk_rejection_count",
              )
              if any(getattr(self, name) < 1 for name in decision_count_fields):
                  raise PaperValidationError("paper policy decision counts must be >= 1")
              if not (
                  MINIMUM_TERMINAL_FRESH_SOURCE_RATIO
                  <= self.minimum_fresh_source_ratio
                  <= Decimal(1)
              ):
                  raise PaperValidationError(
                      "minimum_fresh_source_ratio cannot weaken the terminal floor"
                  )
              if not (
                  Decimal(0)
                  < self.maximum_drawdown_ratio
                  <= MAXIMUM_TERMINAL_DRAWDOWN_RATIO
              ):
                  raise PaperValidationError(
                      "maximum_drawdown_ratio cannot weaken the terminal ceiling"
                  )
              if self.required_exercises != REQUIRED_SAFETY_EXERCISES:
                  raise PaperValidationError(
                      "required_exercises must contain the complete canonical set"
                  )
              maximum_covered_duration = (
                  self.minimum_snapshot_count - 1
              ) * self.maximum_snapshot_gap_ms
              if maximum_covered_duration < self.minimum_duration_ms:
                  raise PaperValidationError("paper policy duration and cadence are infeasible")'''
          source = replace_section(
              source,
              "        integer_fields = (\n",
              "\n\n    @property\n",
              policy_validation,
              "policy validation",
          )

          request_helper_marker = "def _request_identity_payload(\n"
          request_helper = '''def _assert_request_matches_policy(
              request: PaperRunRequest,
              policy: PaperValidationPolicy,
              *,
              field: str,
          ) -> None:
              if request.policy_sha256 != policy.policy_sha256:
                  raise PaperValidationError(f"{field} policy identity mismatch")
              if request.window_end_ms - request.window_start_ms < policy.minimum_duration_ms:
                  raise PaperValidationError(f"{field} window is shorter than policy")


          def _request_identity_payload(
          '''
          source = replace_once(
              source,
              request_helper_marker,
              request_helper,
              "request policy helper marker",
          )

          source = replace_once(
              source,
              ") -> PaperRunRequest:\n    payload = _request_identity_payload(\n",
              ") -> PaperRunRequest:\n"
              "    if window_end_ms - window_start_ms < policy.minimum_duration_ms:\n"
              "        raise PaperValidationError(\"paper request window is shorter than policy\")\n"
              "    payload = _request_identity_payload(\n",
              "request window guard",
          )
          source = replace_once(
              source,
              '''    if request.policy_sha256 != policy.policy_sha256:
                  raise PaperValidationError("request policy identity mismatch")
              observations = _prepare_observations(request, snapshots)
          ''',
              '''    _assert_request_matches_policy(request, policy, field="request")
              observations = _prepare_observations(request, snapshots)
          ''',
              "evaluation policy binding",
          )
          source = replace_once(
              source,
              '''    if request.policy_sha256 != policy.policy_sha256:
                  raise PaperValidationError("activation policy identity mismatch")

              def write(root: Path) -> None:
          ''',
              '''    _assert_request_matches_policy(request, policy, field="activation")

              def write(root: Path) -> None:
          ''',
              "activation policy binding",
          )

          test_source = replace_section(
              test_source,
              "def _policy(",
              "\n\ndef _request(",
              '''def _policy(**overrides: object) -> PaperValidationPolicy:
              return PaperValidationPolicy(**overrides)  # type: ignore[arg-type]
          ''',
              "test policy helper",
          )
          test_source = replace_once(
              test_source,
              "def _request(policy: PaperValidationPolicy):\n",
              "def _request(policy: PaperValidationPolicy, *, window_end_ms: int | None = None):\n",
              "request helper signature",
          )
          request_start = test_source.index("def _request(")
          request_end = test_source.index("\n\ndef _snapshot(", request_start)
          request_body = test_source[request_start:request_end]
          request_body = replace_once(
              request_body,
              "        window_end_ms=5_000,\n",
              "        window_end_ms=(\n"
              "            window_end_ms\n"
              "            if window_end_ms is not None\n"
              "            else 1_000 + policy.minimum_duration_ms\n"
              "        ),\n",
              "request helper window",
          )
          test_source = test_source[:request_start] + request_body + test_source[request_end:]

          exercise_function = '''def _exercises(
              run_id: str,
              snapshot_id: str,
              observed_at_ms: int,
          ) -> tuple[SafetyExerciseEvidence, ...]:
              reasons = {
                  SafetyExerciseKind.CIRCUIT_BREAKER: "maximum_drawdown_exceeded",
                  SafetyExerciseKind.MODEL_DRIFT: "model_drift_not_healthy",
                  SafetyExerciseKind.RESTART_RECOVERY: "restart_state_hash_verified",
                  SafetyExerciseKind.STALE_SOURCE: "source_unhealthy_or_stale:bybit-linear",
              }
              return tuple(
                  SafetyExerciseEvidence(
                      schema_version=EXERCISE_SCHEMA_VERSION,
                      exercise_id=canonical_sha256({"exercise": kind.value, "run_id": run_id}),
                      run_id=run_id,
                      kind=kind,
                      observed_at_ms=observed_at_ms,
                      source_snapshot_id=snapshot_id,
                      expected_reason=reasons[kind],
                      observed_reasons=(reasons[kind],),
                      passed=True,
                      state_recovered=True,
                  )
                  for kind in sorted(SafetyExerciseKind, key=lambda item: item.value)
              )
          '''
          test_source = replace_section(
              test_source,
              "def _exercises(",
              "\n\ndef _accepted_inputs():",
              exercise_function,
              "exercise helper",
          )

          accepted_inputs = '''def _accepted_inputs():
              policy = _policy()
              interval_ms = (
                  policy.minimum_duration_ms + policy.minimum_snapshot_count - 2
              ) // (policy.minimum_snapshot_count - 1)
              observed_at_values = tuple(
                  1_000 + interval_ms * index for index in range(policy.minimum_snapshot_count)
              )
              request = _request(policy, window_end_ms=observed_at_values[-1])
              snapshots = tuple(
                  _snapshot(value, index)
                  for index, value in enumerate(observed_at_values, 1)
              )
              parity = tuple(_parity(snapshot) for snapshot in snapshots)
              exercises = _exercises(
                  request.run_id,
                  snapshots[-1].snapshot_id,
                  snapshots[-1].observed_at_ms,
              )
              return policy, request, snapshots, parity, exercises
          '''
          test_source = replace_section(
              test_source,
              "def _accepted_inputs():",
              "\n\ndef test_default_policy_requires_real_sustained_window() -> None:",
              accepted_inputs,
              "accepted inputs",
          )

          weakening_tests = '''@pytest.mark.parametrize(
              ("overrides", "message"),
              (
                  ({"minimum_duration_ms": 86_399_999}, "minimum_duration_ms"),
                  ({"minimum_snapshot_count": 95}, "minimum_snapshot_count"),
                  ({"maximum_snapshot_gap_ms": 1_800_001}, "maximum_snapshot_gap_ms"),
                  (
                      {"minimum_fresh_source_ratio": Decimal("0.98")},
                      "minimum_fresh_source_ratio",
                  ),
                  ({"maximum_drawdown_ratio": Decimal("0.21")}, "maximum_drawdown_ratio"),
                  (
                      {
                          "required_exercises": tuple(
                              item
                              for item in sorted(SafetyExerciseKind, key=lambda value: value.value)
                              if item is not SafetyExerciseKind.STALE_SOURCE
                          )
                      },
                      "required_exercises",
                  ),
              ),
          )
          def test_terminal_policy_cannot_be_weakened(
              overrides: dict[str, object],
              message: str,
          ) -> None:
              with pytest.raises(PaperValidationError, match=message):
                  PaperValidationPolicy(**overrides)  # type: ignore[arg-type]


          def test_activation_package_is_immutable_and_verified(tmp_path) -> None:
          '''
          test_source = replace_once(
              test_source,
              "def test_activation_package_is_immutable_and_verified(tmp_path) -> None:\n",
              weakening_tests,
              "policy weakening tests marker",
          )
          test_source = replace_once(
              test_source,
              "def test_sustained_paper_evidence_creates_owner_review_package() -> None:\n",
              '''def test_activation_window_cannot_be_shorter_than_policy() -> None:
              policy = _policy()
              with pytest.raises(PaperValidationError, match="shorter than policy"):
                  _request(policy, window_end_ms=5_000)


          def test_sustained_paper_evidence_creates_owner_review_package() -> None:
          ''',
              "short activation window test marker",
          )
          test_source = replace_once(
              test_source,
              "    assert result.report.summary.snapshot_count == 4\n"
              "    assert result.report.summary.parity_count == 4\n",
              "    assert result.report.summary.snapshot_count == policy.minimum_snapshot_count\n"
              "    assert result.report.summary.parity_count == policy.minimum_snapshot_count\n",
              "accepted summary assertions",
          )

          insufficient_test = '''def test_insufficient_window_remains_incomplete() -> None:
              policy, request, snapshots, parity, _old_exercises = _accepted_inputs()
              short_snapshots = snapshots[:-1]
              result = evaluate_paper_evidence(
                  request=request,
                  policy=policy,
                  snapshots=short_snapshots,
                  parity_evidence=parity[:-1],
                  safety_exercises=_exercises(
                      request.run_id,
                      short_snapshots[-1].snapshot_id,
                      short_snapshots[-1].observed_at_ms,
                  ),
              )
              assert result.report.outcome is PaperValidationOutcome.INCOMPLETE
              assert "minimum_duration_not_met" in result.report.blocker_codes
              assert "minimum_snapshot_count_not_met" in result.report.blocker_codes
              assert not result.candidate_review.eligible_for_owner_review
          '''
          test_source = replace_section(
              test_source,
              "def test_insufficient_window_remains_incomplete() -> None:",
              "\n\ndef test_identity_mismatch_is_rejected() -> None:",
              insufficient_test,
              "insufficient window test",
          )

          live_start = test_source.index("def test_live_request_is_forbidden() -> None:")
          live_body = test_source[live_start:]
          live_body = replace_once(
              live_body,
              "            window_end_ms=5_000,\n",
              "            window_end_ms=1_000 + policy.minimum_duration_ms,\n",
              "live request window",
          )
          test_source = test_source[:live_start] + live_body

          implementation.write_text(source, encoding="utf-8")
          tests.write_text(test_source, encoding="utf-8")

      - name: Validate syntax and staged diff
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          git diff --check

      - name: Commit hardening and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wh09-policy-hardening.yml
          git rm .github/workflows/tmp-wh09-policy-hardening-trigger.yml
          git add ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wickhunter): harden terminal policy"
          git push origin HEAD:feat/wickhunter-wh09-paper-validation-v1
