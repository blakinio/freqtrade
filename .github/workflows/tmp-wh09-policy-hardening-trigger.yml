name: Temporary WH-09 policy hardening trigger

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/wickhunter-wh09-paper-validation-v1

permissions:
  contents: write

concurrency:
  group: tmp-wh09-policy-hardening-trigger
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-wh09-paper-validation-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Execute bounded hardening script
        shell: python
        run: |
          from pathlib import Path

          workflow = Path(".github/workflows/tmp-wh09-policy-hardening.yml")
          text = workflow.read_text(encoding="utf-8")
          start_marker = (
              "      - name: Apply bounded policy hardening\n"
              "        shell: python\n"
              "        run: |\n"
          )
          end_marker = "\n      - name: Commit hardening and remove helper\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("unable to locate bounded hardening script")
          body = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = body.splitlines()
          if any(line and not line.startswith("          ") for line in lines):
              raise SystemExit("unexpected hardening script indentation")
          script = "\n".join(line[10:] if line else "" for line in lines) + "\n"
          exec(compile(script, str(workflow), "exec"), {})

          tests = Path("tests/ai_platform_integration/test_wickhunter_paper_validation.py")
          test_source = tests.read_text(encoding="utf-8")
          old_loop = (
              "        for index, kind in enumerate("
              "sorted(SafetyExerciseKind, key=lambda item: item.value), 1)\n"
          )
          new_loop = (
              "        for kind in sorted("
              "SafetyExerciseKind, key=lambda item: item.value)\n"
          )
          if test_source.count(old_loop) != 1:
              raise SystemExit("expected exactly one obsolete exercise loop")
          tests.write_text(test_source.replace(old_loop, new_loop), encoding="utf-8")

      - name: Commit hardening and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wh09-policy-hardening.yml
          git rm .github/workflows/tmp-wh09-policy-hardening-trigger.yml
          git add ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wickhunter): harden terminal policy"
          git push origin HEAD:feat/wickhunter-wh09-paper-validation-v1
