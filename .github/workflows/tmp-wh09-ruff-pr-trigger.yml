name: Temporary WH-09 Ruff PR trigger

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: tmp/wh09-ruff-patch
          persist-credentials: true
      - name: Apply exact Ruff fixes
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check ruff
          ruff check --fix --unsafe-fixes ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py || true
          ruff format ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          python -m compileall -q ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          rm .github/workflows/tmp-wh09-ruff-pr-trigger.yml
          rm -f .tmp-wh09-ruff-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style(wickhunter): apply WH-09 Ruff fixes [skip ci]'
          git push origin HEAD:tmp/wh09-ruff-patch
