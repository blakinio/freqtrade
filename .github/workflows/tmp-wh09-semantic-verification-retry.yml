name: Temporary WH-09 semantic verification retry

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/wickhunter-wh09-paper-validation-v1

permissions:
  contents: write

concurrency:
  group: tmp-wh09-semantic-verification-retry
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-wh09-paper-validation-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install locked repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Apply bounded semantic verification hardening
        shell: python
        run: |
          import base64
          import re
          import zlib
          from pathlib import Path

          workflow = Path(".github/workflows/tmp-wh09-semantic-verification.yml")
          text = workflow.read_text(encoding="utf-8")
          match = re.search(
              r'base64\.b64decode\("([A-Za-z0-9+/=]+)"\)',
              text,
          )
          if match is None:
              raise SystemExit("semantic verification payload not found")
          exec(zlib.decompress(base64.b64decode(match.group(1))), {})

          implementation = Path("ai_platform/wickhunter/paper_validation.py")
          source = implementation.read_text(encoding="utf-8")

          def replace_custom_identity(
              source_text: str,
              *,
              function_start: str,
              function_end: str,
              constructor: str,
              object_name: str,
              error_text: str,
              identity_lines: list[str],
              label: str,
          ) -> str:
              start = source_text.index(function_start)
              end = source_text.index(function_end, start)
              lines = source_text[start:end].splitlines()
              verifier_start = next(
                  (
                      index
                      for index, line in enumerate(lines)
                      if line.strip() == "_verify_derived_identity("
                  ),
                  None,
              )
              if verifier_start is None:
                  raise SystemExit(f"generic {label} identity verifier not found")
              verifier_end = next(
                  (
                      index
                      for index in range(verifier_start + 1, len(lines))
                      if lines[index].strip() == ")"
                  ),
                  None,
              )
              if verifier_end is None:
                  raise SystemExit(f"generic {label} identity verifier end not found")
              del lines[verifier_start : verifier_end + 1]
              constructor_index = next(
                  (
                      index
                      for index, line in enumerate(lines)
                      if f"return {constructor}(" in line
                  ),
                  None,
              )
              if constructor_index is None:
                  raise SystemExit(f"{label} constructor return not found")
              lines[constructor_index] = lines[constructor_index].replace(
                  f"return {constructor}(",
                  f"{object_name} = {constructor}(",
                  1,
              )
              error_index = next(
                  (
                      index
                      for index, line in enumerate(lines)
                      if error_text in line
                  ),
                  None,
              )
              if error_index is None:
                  raise SystemExit(f"{label} parser error boundary not found")
              lines[error_index + 1 : error_index + 1] = identity_lines
              return source_text[:start] + "\n".join(lines) + source_text[end:]

          request_identity = [
              "    expected_run_id = canonical_sha256(",
              "        {",
              '            "schema_version": REQUEST_SCHEMA_VERSION,',
              '            "payload": _request_identity_payload(',
              "                created_at_ms=request.created_at_ms,",
              "                window_start_ms=request.window_start_ms,",
              "                window_end_ms=request.window_end_ms,",
              "                bot_instance=request.bot_instance,",
              "                mode=request.mode,",
              "                model_version=request.model_version,",
              "                model_hash=request.model_hash,",
              "                parameter_version=request.parameter_version,",
              "                parameter_hash=request.parameter_hash,",
              "                dataset_hash=request.dataset_hash,",
              "                code_sha=request.code_sha,",
              "                rollback_model_version=request.rollback_model_version,",
              "                rollback_model_hash=request.rollback_model_hash,",
              "                rollback_parameter_version=request.rollback_parameter_version,",
              "                rollback_parameter_hash=request.rollback_parameter_hash,",
              "                wh08_consumer_version=request.wh08_consumer_version,",
              "                policy_sha256=request.policy_sha256,",
              "            ),",
              "        }",
              "    )",
              "    if request.run_id != expected_run_id:",
              '        raise PaperValidationError("request derived identity mismatch")',
              "    return request",
          ]
          source = replace_custom_identity(
              source,
              function_start="def _request_from_payload(",
              function_end="\n\ndef _observation_from_payload(",
              constructor="PaperRunRequest",
              object_name="request",
              error_text='raise PaperValidationError("request payload is invalid") from exc',
              identity_lines=request_identity,
              label="request",
          )

          parity_identity = [
              "    expected_parity_id = canonical_sha256(",
              "        {",
              '            "schema_version": parity.schema_version,',
              '            "payload": {',
              '                "shadow_decision_id": parity.shadow_decision_id,',
              '                "label_id": parity.label_id,',
              '                "symbol": parity.symbol,',
              '                "side": parity.side.value,',
              '                "decision_timestamp_ms": parity.decision_timestamp_ms,',
              '                "dataset_hash": parity.dataset_hash,',
              '                "code_sha": parity.code_sha,',
              '                "take_profit_ratio": parity.take_profit_ratio,',
              '                "stop_loss_ratio": parity.stop_loss_ratio,',
              '                "label_outcome": parity.label_outcome.value,',
              '                "identities_match": parity.identities_match,',
              '                "policy_match": parity.policy_match,',
              '                "execution_authority_absent": parity.execution_authority_absent,',
              "            },",
              "        }",
              "    )",
              "    if parity.parity_id != expected_parity_id:",
              '        raise PaperValidationError("parity derived identity mismatch")',
              "    return parity",
          ]
          source = replace_custom_identity(
              source,
              function_start="def _parity_from_payload(",
              function_end="\n\ndef _exercise_from_payload(",
              constructor="ReplayShadowParityEvidence",
              object_name="parity",
              error_text='raise PaperValidationError("parity payload is invalid") from exc',
              identity_lines=parity_identity,
              label="parity",
          )
          implementation.write_text(source, encoding="utf-8")

      - name: Format and lint exact files
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          ruff format ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          ruff check ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          ruff format --check ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          python -m compileall -q ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py

      - name: Run focused WH-09 tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/ai_platform_integration/test_wickhunter_paper_validation.py

      - name: Commit hardening and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wh09-semantic-verification.yml
          git rm .github/workflows/tmp-wh09-semantic-verification-retry.yml
          git rm .github/workflows/tmp-wh09-diagnostic.yml
          git add ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wickhunter): verify published evidence semantics"
          git push origin HEAD:feat/wickhunter-wh09-paper-validation-v1
