name: Temporary WH-09 semantic verification retry

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/wickhunter-wh09-paper-validation-v1

permissions:
  contents: write

concurrency:
  group: tmp-wh09-semantic-verification-retry
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-wh09-paper-validation-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install locked repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Apply bounded semantic verification hardening
        shell: python
        run: |
          import base64
          import re
          import zlib
          from pathlib import Path

          workflow = Path(".github/workflows/tmp-wh09-semantic-verification.yml")
          text = workflow.read_text(encoding="utf-8")
          match = re.search(
              r'base64\.b64decode\("([A-Za-z0-9+/=]+)"\)',
              text,
          )
          if match is None:
              raise SystemExit("semantic verification payload not found")
          exec(zlib.decompress(base64.b64decode(match.group(1))), {})

          implementation = Path("ai_platform/wickhunter/paper_validation.py")
          source = implementation.read_text(encoding="utf-8")
          start = source.index("def _request_from_payload(")
          end = source.index("\n\ndef _observation_from_payload(", start)
          section = source[start:end]
          generic_identity = '''    _verify_derived_identity(
              payload,
              schema=REQUEST_SCHEMA_VERSION,
              identity_field="run_id",
              field="request",
          )
          '''
          if section.count(generic_identity) != 1:
              raise SystemExit("generic request identity verifier not found")
          section = section.replace(generic_identity, "")
          if section.count("        return PaperRunRequest(\n") != 1:
              raise SystemExit("request constructor return not found")
          section = section.replace(
              "        return PaperRunRequest(\n",
              "        request = PaperRunRequest(\n",
          )
          old_tail = '''    except (TypeError, ValueError) as exc:
              raise PaperValidationError("request payload is invalid") from exc
          '''
          new_tail = '''    except (TypeError, ValueError) as exc:
              raise PaperValidationError("request payload is invalid") from exc
              expected_run_id = canonical_sha256(
                  {
                      "schema_version": REQUEST_SCHEMA_VERSION,
                      "payload": _request_identity_payload(
                          created_at_ms=request.created_at_ms,
                          window_start_ms=request.window_start_ms,
                          window_end_ms=request.window_end_ms,
                          bot_instance=request.bot_instance,
                          mode=request.mode,
                          model_version=request.model_version,
                          model_hash=request.model_hash,
                          parameter_version=request.parameter_version,
                          parameter_hash=request.parameter_hash,
                          dataset_hash=request.dataset_hash,
                          code_sha=request.code_sha,
                          rollback_model_version=request.rollback_model_version,
                          rollback_model_hash=request.rollback_model_hash,
                          rollback_parameter_version=request.rollback_parameter_version,
                          rollback_parameter_hash=request.rollback_parameter_hash,
                          wh08_consumer_version=request.wh08_consumer_version,
                          policy_sha256=request.policy_sha256,
                      ),
                  }
              )
              if request.run_id != expected_run_id:
                  raise PaperValidationError("request derived identity mismatch")
              return request
          '''
          if section.count(old_tail) != 1:
              raise SystemExit("request parser tail not found")
          section = section.replace(old_tail, new_tail)
          implementation.write_text(source[:start] + section + source[end:], encoding="utf-8")

      - name: Format and lint exact files
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          ruff format ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          ruff check ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          ruff format --check ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          python -m compileall -q ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py

      - name: Run focused WH-09 tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/ai_platform_integration/test_wickhunter_paper_validation.py

      - name: Commit hardening and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wh09-semantic-verification.yml
          git rm .github/workflows/tmp-wh09-semantic-verification-retry.yml
          git add ai_platform/wickhunter/paper_validation.py tests/ai_platform_integration/test_wickhunter_paper_validation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wickhunter): verify published evidence semantics"
          git push origin HEAD:feat/wickhunter-wh09-paper-validation-v1
