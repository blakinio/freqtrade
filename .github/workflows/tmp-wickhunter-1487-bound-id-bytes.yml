name: Publish WickHunter PR 1487 source identity byte bound

on:
  push:
    branches:
      - codex/fix-wickhunter-legacy-restart-consumer-1396
    paths:
      - .github/workflows/tmp-wickhunter-1487-bound-id-bytes.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/fix-wickhunter-legacy-restart-consumer-1396
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply source identity byte bound
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          operator = Path('ai_platform/wickhunter/candidate_paper_runtime_operator.py')
          text = operator.read_text(encoding='utf-8')
          constant_anchor = 'MAX_LIVE_SNAPSHOT_EVENT_IDENTITIES = 500_000\n'
          if 'MAX_LIVE_SOURCE_EVENT_ID_BYTES' not in text:
              if constant_anchor not in text:
                  raise SystemExit('identity-count constant anchor not found')
              text = text.replace(
                  constant_anchor,
                  constant_anchor + 'MAX_LIVE_SOURCE_EVENT_ID_BYTES = 512\n',
                  1,
              )

          old_helper = '''def _record_validated_event_id(validated_event_ids: set[str], event_id: str) -> None:\n    if len(validated_event_ids) >= MAX_LIVE_SNAPSHOT_EVENT_IDENTITIES:\n        raise CandidatePaperRuntimeOperatorError(\n            "Liquid20 snapshot contains too many event identities"\n        )\n    validated_event_ids.add(event_id)\n'''
          new_helper = '''def _record_validated_event_id(validated_event_ids: set[str], event_id: str) -> None:\n    if len(event_id.encode("utf-8")) > MAX_LIVE_SOURCE_EVENT_ID_BYTES:\n        raise CandidatePaperRuntimeOperatorError(\n            "Liquid20 source event identity is too large"\n        )\n    if len(validated_event_ids) >= MAX_LIVE_SNAPSHOT_EVENT_IDENTITIES:\n        raise CandidatePaperRuntimeOperatorError(\n            "Liquid20 snapshot contains too many event identities"\n        )\n    validated_event_ids.add(event_id)\n'''
          if old_helper not in text:
              if new_helper not in text:
                  raise SystemExit('identity helper anchor not found')
          else:
              text = text.replace(old_helper, new_helper, 1)
          operator.write_text(text, encoding='utf-8')

          tests = Path('tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py')
          t = tests.read_text(encoding='utf-8')
          marker = '\ndef test_live_root_retries_mid_publication_pointer_state_mismatch(\n'
          test = '''\n\ndef test_live_root_rejects_oversized_source_event_identity(\n    tmp_path: Path,\n) -> None:\n    oversized_event_id = "ż" * (operator_module.MAX_LIVE_SOURCE_EVENT_ID_BYTES // 2 + 1)\n    root = _write_live_root(\n        tmp_path / "oversized-source-event-id",\n        previous_events=[\n            _event(oversized_event_id, received_at_ms=NOW_MS - 3_600_000)\n        ],\n    )\n\n    with pytest.raises(\n        CandidatePaperRuntimeOperatorError,\n        match="source event identity is too large",\n    ):\n        load_liquid20_snapshot(root, now_ms=NOW_MS)\n'''
          if 'test_live_root_rejects_oversized_source_event_identity' not in t:
              if marker not in t:
                  raise SystemExit('test insertion marker not found')
              t = t.replace(marker, test + marker, 1)
          tests.write_text(t, encoding='utf-8')
          PY
      - name: Validate and publish
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q 'ruff==0.15.21'
          ruff format ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          ruff check ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          ruff format --check ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          python -m compileall -q ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          rm -f .github/workflows/tmp-wickhunter-1487-bound-id-bytes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py .github/workflows/tmp-wickhunter-1487-bound-id-bytes.yml
          git diff --cached --check
          git commit -m 'fix(wickhunter): bound source identity bytes'
          git push origin HEAD:codex/fix-wickhunter-legacy-restart-consumer-1396
