name: One-shot WickHunter PR 1487 final P2 repair

on:
  push:
    branches:
      - codex/fix-wickhunter-legacy-restart-consumer-1396
    paths:
      - .github/workflows/tmp-wickhunter-1487-final-p2-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/fix-wickhunter-legacy-restart-consumer-1396
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply final P2 repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          op = Path("ai_platform/wickhunter/candidate_paper_runtime_operator.py")
          text = op.read_text(encoding="utf-8")

          marker = "\ndef _read_committed_jsonl_tail(  # noqa: C901\n"
          helper = '''

def _legacy_restart_source_summaries_match(
    run_root: Path,
    *,
    run_id: str,
    source_payloads: dict[str, Any],
) -> bool:
    for source in ("bybit-linear", "binance-usdm"):
        try:
            summary = _read_bounded_json(
                run_root / f"{source}-summary.json",
                field=f"Liquid20 legacy source summary {source}",
            )
        except CandidatePaperRuntimeOperatorError:
            return False
        source_identity = summary.get("source")
        if not isinstance(source_identity, dict) or source_identity.get("id") != source:
            return False
        if (
            summary.get("schema_version") != 1
            or summary.get("run_id") != run_id
            or summary.get("run_state") != "active"
            or summary.get("trading_credentials_present") is not False
            or summary.get("execution_enabled") is not False
            or summary.get("stats") != source_payloads.get(source)
        ):
            return False
    return True
'''
          text = replace_once(text, marker, helper + marker, "legacy provenance helper")

