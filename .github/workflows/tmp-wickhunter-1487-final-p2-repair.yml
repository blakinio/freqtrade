              "    suffix_available_at_ms: Callable[[], int],\n    validated_event_ids: set[str],\n    require_suffix_checkpoint: bool = False,\n    suffix_checkpoint: tuple[int, int] | None = None,\n) -> tuple[dict[str, Any], ...]:\n",
              "tail signature",
