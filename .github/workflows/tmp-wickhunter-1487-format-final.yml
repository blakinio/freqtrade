name: Format WickHunter PR 1487 final patch

on:
  push:
    branches:
      - codex/fix-wickhunter-legacy-restart-consumer-1396

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/fix-wickhunter-legacy-restart-consumer-1396
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Apply repository Ruff formatting
        run: |
          python -m pip install 'ruff==0.15.21'
          ruff format ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          ruff format --check ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          python -m compileall -q ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          git diff --check
      - name: Publish formatted final patch
        run: |
          rm .github/workflows/tmp-wickhunter-1487-format-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py .github/workflows/tmp-wickhunter-1487-format-final.yml
          git commit -m "style(wickhunter): format final recovery patch"
          git push origin HEAD:codex/fix-wickhunter-legacy-restart-consumer-1396
