name: One-shot WickHunter PR 1487 lambda repair

on:
  push:
    branches:
      - codex/fix-wickhunter-legacy-restart-consumer-1396
    paths:
      - ".github/workflows/tmp-wickhunter-1487-lambda-fix.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout task branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          ref: codex/fix-wickhunter-legacy-restart-consumer-1396

      - name: Replace lambda with typed helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/wickhunter/candidate_paper_runtime_operator.py")
          text = path.read_text(encoding="utf-8")

          old = '''    return event\n\n\ndef _read_committed_jsonl_tail(  # noqa: C901\n'''
          new = '''    return event\n\n\ndef _fixed_timestamp(value: int) -> Callable[[], int]:\n    def timestamp() -> int:\n        return value\n\n    return timestamp\n\n\ndef _read_committed_jsonl_tail(  # noqa: C901\n'''
          if text.count(old) != 1:
              raise SystemExit("typed helper insertion point mismatch")
          text = text.replace(old, new, 1)

          old = '''            run_suffix_available_at_ms = (\n                lambda boundary=completion_boundary_ms: boundary\n            )\n'''
          new = '''            run_suffix_available_at_ms = _fixed_timestamp(completion_boundary_ms)\n'''
          if text.count(old) != 1:
              raise SystemExit("lambda replacement point mismatch")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          python -m compileall -q ai_platform/wickhunter/candidate_paper_runtime_operator.py
          git diff --check

      - name: Remove workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-wickhunter-1487-lambda-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/wickhunter/candidate_paper_runtime_operator.py .github/workflows/tmp-wickhunter-1487-lambda-fix.yml
          git diff --cached --check
          git commit -m "fix(wickhunter): type historical suffix clock"
          git push origin HEAD:codex/fix-wickhunter-legacy-restart-consumer-1396
