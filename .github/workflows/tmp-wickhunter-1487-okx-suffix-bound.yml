name: Fix WickHunter PR 1487 OKX legacy suffix scope

on:
  push:
    branches:
      - codex/fix-wickhunter-legacy-restart-consumer-1396

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/fix-wickhunter-legacy-restart-consumer-1396
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Apply source-scoped legacy suffix compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          operator = Path('ai_platform/wickhunter/candidate_paper_runtime_operator.py')
          text = operator.read_text(encoding='utf-8')
          old = 'EXPECTED_LIVE_SOURCES = ("binance-usdm", "bybit-linear", "okx-swap")\n'
          new = old + 'LEGACY_RESTART_SUMMARY_SOURCES = frozenset(("binance-usdm", "bybit-linear"))\n'
          if 'LEGACY_RESTART_SUMMARY_SOURCES' not in text:
              if old not in text:
                  raise SystemExit('expected source constant anchor not found')
              text = text.replace(old, new, 1)
          text = text.replace(
              '    for source in ("bybit-linear", "binance-usdm"):\n',
              '    for source in LEGACY_RESTART_SUMMARY_SOURCES:\n',
              1,
          )
          old_call = '''                    allow_uncommitted_suffix=(\n                        historical_run_id == run_id or allow_legacy_restart_suffix\n                    ),\n                    require_legacy_suffix_checkpoint=allow_legacy_restart_suffix,\n'''
          new_call = '''                    allow_uncommitted_suffix=(\n                        historical_run_id == run_id\n                        or (\n                            allow_legacy_restart_suffix\n                            and source in LEGACY_RESTART_SUMMARY_SOURCES\n                        )\n                    ),\n                    require_legacy_suffix_checkpoint=(\n                        allow_legacy_restart_suffix\n                        and source in LEGACY_RESTART_SUMMARY_SOURCES\n                    ),\n'''
          if old_call not in text:
              raise SystemExit('expected read call anchor not found')
          text = text.replace(old_call, new_call, 1)
          operator.write_text(text, encoding='utf-8')

          tests = Path('tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py')
          t = tests.read_text(encoding='utf-8')
          anchor = '''def test_live_root_accepts_legacy_suffix_after_heartbeat_before_completion(\n'''
          test = '''def test_live_root_rejects_legacy_restart_suffix_for_unprovenanced_okx(\n    tmp_path: Path,\n) -> None:\n    root, previous_root, state = _write_legacy_restart_suffix_root(\n        tmp_path / "legacy-okx-suffix"\n    )\n    committed = _event(\n        "okx-committed",\n        received_at_ms=NOW_MS - 3_600_000,\n        source="okx-swap",\n    )\n    suffix = _event(\n        "okx-uncommitted",\n        received_at_ms=NOW_MS - 3_500_000,\n        source="okx-swap",\n    )\n    (previous_root / "okx-swap.ndjson").write_text(\n        json.dumps(committed, sort_keys=True) + "\\n" + json.dumps(suffix, sort_keys=True) + "\\n",\n        encoding="utf-8",\n    )\n    okx_state = cast(dict[str, object], state["sources"])["okx-swap"]\n    assert isinstance(okx_state, dict)\n    okx_state["events_written"] = 1\n    okx_state["last_event_at_ms"] = committed["occurred_at_ms"]\n    okx_state["last_event_received_at_ms"] = committed["received_at_ms"]\n    (previous_root / "run-state-v1.json").write_text(\n        json.dumps(state, sort_keys=True) + "\\n",\n        encoding="utf-8",\n    )\n\n    with pytest.raises(CandidatePaperRuntimeOperatorError, match="contradicts events_written"):\n        load_liquid20_snapshot(root, now_ms=NOW_MS)\n\n\n'''
          if 'test_live_root_rejects_legacy_restart_suffix_for_unprovenanced_okx' not in t:
              if anchor not in t:
                  raise SystemExit('expected test insertion anchor not found')
              t = t.replace(anchor, test + anchor, 1)
          tests.write_text(t, encoding='utf-8')
          PY
      - name: Validate and publish
        shell: bash
        run: |
          python -m compileall -q ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          git diff --check
          rm .github/workflows/tmp-wickhunter-1487-okx-suffix-bound.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py .github/workflows/tmp-wickhunter-1487-okx-suffix-bound.yml
          git commit -m "fix(wickhunter): scope legacy suffix compatibility"
          git push origin HEAD:codex/fix-wickhunter-legacy-restart-consumer-1396
