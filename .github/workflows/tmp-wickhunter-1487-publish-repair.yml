name: Publish WickHunter PR 1487 final repair

on:
  push:
    branches:
      - codex/fix-wickhunter-legacy-restart-consumer-1396
    paths:
      - .github/workflows/tmp-wickhunter-1487-publish-repair.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/fix-wickhunter-legacy-restart-consumer-1396
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply prepared repair
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-wickhunter-1487-final-p2-repair.yml').read_text(encoding='utf-8')
          match = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > /tmp/wickhunter-repair.py", workflow)
          if match is None:
              raise SystemExit('prepared repair payload not found')
          Path('/tmp/wickhunter-repair.py').write_bytes(base64.b64decode(match.group(1)))
          PY
          python /tmp/wickhunter-repair.py
      - name: Validate repair with repository profile
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q 'ruff==0.15.21'
          ruff format ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          ruff check ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          ruff format --check ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          python -m compileall -q ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          git diff --check
      - name: Commit product repair and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/tmp-wickhunter-1487-final-p2-repair.yml
          rm -f .github/workflows/tmp-wickhunter-1487-publish-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_platform/wickhunter/candidate_paper_runtime_operator.py tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py .github/workflows/tmp-wickhunter-1487-final-p2-repair.yml .github/workflows/tmp-wickhunter-1487-publish-repair.yml
          git diff --cached --check
          git commit -m 'fix(wickhunter): bind legacy restart recovery evidence'
          git push origin HEAD:codex/fix-wickhunter-legacy-restart-consumer-1396
