name: Temporary WickHunter candidate artifact schema repair v2

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feat/wickhunter-candidate-paper-activation-v1
    paths:
      - ".tmp/wickhunter-candidate-artifact-schema-repair-v2.md"

permissions:
  contents: write

concurrency:
  group: tmp-wickhunter-candidate-artifact-schema-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/trigger-wickhunter-candidate-artifact-schema-repair-v2'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-candidate-paper-activation-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Apply exact schema repair and update assertion
        shell: python
        run: |
          from pathlib import Path

          workflow_path = Path(
              ".github/workflows/tmp-wickhunter-candidate-artifact-schema-repair.yml"
          )
          workflow = workflow_path.read_text(encoding="utf-8")
          start_marker = (
              "      - name: Enforce exact WH-04 model artifact schema\n"
              "        shell: python\n"
              "        run: |\n"
          )
          end_marker = "\n      - name: Validate exact repaired implementation\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          ) + "\n"
          exec(compile(script, "candidate-artifact-schema-repair", "exec"))

          test_path = Path(
              "tests/ai_platform_integration/test_wickhunter_candidate_activation.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          old = 'with pytest.raises(CandidateActivationError, match="model text"):'
          new = (
              "with pytest.raises(\n"
              "        CandidateActivationError,\n"
              '        match="model artifact semantic validation failed",\n'
              "    ):"
          )
          if tests.count(old) != 1:
              raise SystemExit("model text assertion target mismatch")
          test_path.write_text(tests.replace(old, new), encoding="utf-8")

      - name: Validate exact repaired implementation
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix ai_platform/wickhunter/candidate_activation.py tests/ai_platform_integration/test_wickhunter_candidate_activation.py
          ruff format ai_platform/wickhunter/candidate_activation.py tests/ai_platform_integration/test_wickhunter_candidate_activation.py
          ruff check ai_platform/wickhunter/candidate_activation.py tests/ai_platform_integration/test_wickhunter_candidate_activation.py
          ruff format --check ai_platform/wickhunter/candidate_activation.py tests/ai_platform_integration/test_wickhunter_candidate_activation.py
          mypy ai_platform/wickhunter/candidate_activation.py tests/ai_platform_integration/test_wickhunter_candidate_activation.py
          pytest -q tests/ai_platform_integration/test_wickhunter_candidate_activation.py

      - name: Commit repair and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/tmp-wickhunter-candidate-artifact-schema-repair.yml \
            .github/workflows/tmp-wickhunter-candidate-artifact-schema-repair-v2.yml
          git add \
            ai_platform/wickhunter/candidate_activation.py \
            tests/ai_platform_integration/test_wickhunter_candidate_activation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wickhunter): verify exact candidate model artifact"
          git push origin HEAD:feat/wickhunter-candidate-paper-activation-v1
