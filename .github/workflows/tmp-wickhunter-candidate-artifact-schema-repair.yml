name: Temporary WickHunter candidate artifact schema repair

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feat/wickhunter-candidate-paper-activation-v1
    paths:
      - ".tmp/wickhunter-candidate-artifact-schema-repair.md"

permissions:
  contents: write

concurrency:
  group: tmp-wickhunter-candidate-artifact-schema-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/trigger-wickhunter-candidate-artifact-schema-repair'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-candidate-paper-activation-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Enforce exact WH-04 model artifact schema
        shell: python
        run: |
          from pathlib import Path

          source_path = Path("ai_platform/wickhunter/candidate_activation.py")
          source = source_path.read_text(encoding="utf-8")
          import_anchor = "from ai_platform.wickhunter.paper_validation import (\n"
          model_import = '''from ai_platform.wickhunter.lightgbm_scorer import (
              CalibrationCurve,
              LightGBMModelArtifact,
              LightGBMScorerError,
              LightGBMTrainingPolicy,
          )
          '''
          if source.count(import_anchor) != 1:
              raise SystemExit("candidate activation import anchor mismatch")
          if "LightGBMModelArtifact" not in source:
              source = source.replace(import_anchor, model_import + import_anchor)

          start = source.index("def _verify_model(")
          end = source.index("\n\ndef verify_candidate_package", start)
          replacement = '''def _list(value: object, *, field: str) -> list[Any]:
              if not isinstance(value, list):
                  raise CandidateActivationError(f"{field} must be a list")
              return value


          def _text_tuple(value: object, *, field: str) -> tuple[str, ...]:
              return tuple(_require_text(item, field=field) for item in _list(value, field=field))


          def _decimal_tuple(value: object, *, field: str) -> tuple[Decimal, ...]:
              return tuple(_decimal(item, field=field) for item in _list(value, field=field))


          def _integer(value: object, *, field: str) -> int:
              if isinstance(value, bool) or not isinstance(value, int):
                  raise CandidateActivationError(f"{field} must be an integer")
              return value


          def _boolean(value: object, *, field: str) -> bool:
              if not isinstance(value, bool):
                  raise CandidateActivationError(f"{field} must be boolean")
              return value


          def _training_policy(value: object) -> LightGBMTrainingPolicy:
              if not isinstance(value, dict):
                  raise CandidateActivationError("model training policy must be an object")
              expected = {item.name for item in fields(LightGBMTrainingPolicy)}
              if set(value) != expected:
                  raise CandidateActivationError("model training policy field set mismatch")
              return LightGBMTrainingPolicy(
                  schema_version=_require_text(value["schema_version"], field="training schema"),
                  policy_version=_require_text(value["policy_version"], field="training policy"),
                  training_splits=_text_tuple(value["training_splits"], field="training splits"),
                  calibration_splits=_text_tuple(
                      value["calibration_splits"], field="calibration splits"
                  ),
                  validation_splits=_text_tuple(
                      value["validation_splits"], field="validation splits"
                  ),
                  forbidden_splits=_text_tuple(
                      value["forbidden_splits"], field="forbidden splits"
                  ),
                  seed=_integer(value["seed"], field="training seed"),
                  num_boost_round=_integer(
                      value["num_boost_round"], field="num_boost_round"
                  ),
                  num_leaves=_integer(value["num_leaves"], field="num_leaves"),
                  min_data_in_leaf=_integer(
                      value["min_data_in_leaf"], field="min_data_in_leaf"
                  ),
                  learning_rate=_decimal(value["learning_rate"], field="learning_rate"),
                  calibration_bins=_integer(
                      value["calibration_bins"], field="calibration_bins"
                  ),
                  no_trade_confidence=_decimal(
                      value["no_trade_confidence"], field="no_trade_confidence"
                  ),
              )


          def _calibration(value: object) -> CalibrationCurve:
              if not isinstance(value, dict):
                  raise CandidateActivationError("model calibration must be an object")
              expected = {item.name for item in fields(CalibrationCurve)}
              if set(value) != expected:
                  raise CandidateActivationError("model calibration field set mismatch")
              return CalibrationCurve(
                  schema_version=_require_text(
                      value["schema_version"], field="calibration schema"
                  ),
                  upper_bounds=_decimal_tuple(
                      value["upper_bounds"], field="calibration upper bounds"
                  ),
                  probabilities=_decimal_tuple(
                      value["probabilities"], field="calibration probabilities"
                  ),
              )


          def _model_artifact(payload: dict[str, Any]) -> LightGBMModelArtifact:
              artifact_fields = {item.name for item in fields(LightGBMModelArtifact)}
              expected = artifact_fields | {
                  "artifact_sha256",
                  "promotion_state",
                  "advisory_only",
              }
              if set(payload) != expected:
                  raise CandidateActivationError("model artifact field set mismatch")
              if payload.get("promotion_state") != "candidate":
                  raise CandidateActivationError("model artifact must remain a candidate")
              if payload.get("advisory_only") is not True:
                  raise CandidateActivationError("model artifact must remain advisory-only")
              claimed = _require_sha256(
                  payload.get("artifact_sha256"), field="artifact_sha256"
              )
              try:
                  artifact = LightGBMModelArtifact(
                      schema_version=_require_text(
                          payload["schema_version"], field="model schema"
                      ),
                      model_kind=_require_text(payload["model_kind"], field="model_kind"),
                      model_version=_require_text(
                          payload["model_version"], field="model_version"
                      ),
                      model_hash=_require_sha256(
                          payload["model_hash"], field="model_hash"
                      ),
                      model_text=_require_text(payload["model_text"], field="model_text"),
                      feature_schema_version=_require_text(
                          payload["feature_schema_version"],
                          field="feature_schema_version",
                      ),
                      feature_schema_sha256=_require_sha256(
                          payload["feature_schema_sha256"],
                          field="feature_schema_sha256",
                      ),
                      feature_names=_text_tuple(
                          payload["feature_names"], field="feature_names"
                      ),
                      training_policy=_training_policy(payload["training_policy"]),
                      dataset_id=_require_text(payload["dataset_id"], field="dataset_id"),
                      dataset_manifest_sha256=_require_sha256(
                          payload["dataset_manifest_sha256"],
                          field="dataset_manifest_sha256",
                      ),
                      market_manifest_sha256=_require_sha256(
                          payload["market_manifest_sha256"],
                          field="market_manifest_sha256",
                      ),
                      split_geometry_sha256=_require_sha256(
                          payload["split_geometry_sha256"],
                          field="split_geometry_sha256",
                      ),
                      price_path_manifest_sha256=_require_sha256(
                          payload["price_path_manifest_sha256"],
                          field="price_path_manifest_sha256",
                      ),
                      replay_policy_version=_require_text(
                          payload["replay_policy_version"],
                          field="replay_policy_version",
                      ),
                      replay_policy_sha256=_require_sha256(
                          payload["replay_policy_sha256"],
                          field="replay_policy_sha256",
                      ),
                      parameter_version=_require_text(
                          payload["parameter_version"], field="parameter_version"
                      ),
                      parameter_sha256=_require_sha256(
                          payload["parameter_sha256"], field="parameter_sha256"
                      ),
                      training_case_sha256s=_text_tuple(
                          payload["training_case_sha256s"],
                          field="training_case_sha256s",
                      ),
                      calibration_case_sha256s=_text_tuple(
                          payload["calibration_case_sha256s"],
                          field="calibration_case_sha256s",
                      ),
                      training_example_count=_integer(
                          payload["training_example_count"],
                          field="training_example_count",
                      ),
                      calibration_example_count=_integer(
                          payload["calibration_example_count"],
                          field="calibration_example_count",
                      ),
                      positive_example_count=_integer(
                          payload["positive_example_count"],
                          field="positive_example_count",
                      ),
                      negative_example_count=_integer(
                          payload["negative_example_count"],
                          field="negative_example_count",
                      ),
                      positive_return_mean=_decimal(
                          payload["positive_return_mean"],
                          field="positive_return_mean",
                      ),
                      negative_return_mean=_decimal(
                          payload["negative_return_mean"],
                          field="negative_return_mean",
                      ),
                      calibration=_calibration(payload["calibration"]),
                      protected_holdout_accessed=_boolean(
                          payload["protected_holdout_accessed"],
                          field="protected_holdout_accessed",
                      ),
                      automatic_promotion_enabled=_boolean(
                          payload["automatic_promotion_enabled"],
                          field="automatic_promotion_enabled",
                      ),
                      execution_enabled=_boolean(
                          payload["execution_enabled"], field="execution_enabled"
                      ),
                      live_capital_authorized=_boolean(
                          payload["live_capital_authorized"],
                          field="live_capital_authorized",
                      ),
                      orders_submitted=_integer(
                          payload["orders_submitted"], field="orders_submitted"
                      ),
                  )
              except (LightGBMScorerError, TypeError, ValueError) as exc:
                  raise CandidateActivationError(
                      "model artifact semantic validation failed"
                  ) from exc
              if artifact.artifact_sha256 != claimed:
                  raise CandidateActivationError("model artifact identity mismatch")
              return artifact


          def _verify_model(
              payload: dict[str, Any], *, manifest: dict[str, Any]
          ) -> LightGBMModelArtifact:
              _require_zero_authority(payload, field="model artifact")
              artifact = _model_artifact(payload)
              bindings = (
                  (artifact.model_version, manifest.get("model_version"), "model_version"),
                  (artifact.model_hash, manifest.get("model_hash"), "model_hash"),
                  (
                      artifact.artifact_sha256,
                      manifest.get("model_artifact_sha256"),
                      "model_artifact_sha256",
                  ),
                  (
                      artifact.parameter_version,
                      manifest.get("parameter_version"),
                      "model parameter_version",
                  ),
                  (
                      artifact.parameter_sha256,
                      manifest.get("parameter_sha256"),
                      "model parameter_sha256",
                  ),
              )
              for actual, expected_value, field in bindings:
                  if actual != expected_value:
                      raise CandidateActivationError(
                          f"candidate manifest binding mismatch: {field}"
                      )
              return artifact
          '''
          source_path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")

          test_path = Path("tests/ai_platform_integration/test_wickhunter_candidate_activation.py")
          tests = test_path.read_text(encoding="utf-8")
          import_anchor = "from decimal import Decimal\n"
          if import_anchor not in tests:
              tests = tests.replace("from dataclasses import replace\n", "from dataclasses import replace\nfrom decimal import Decimal\n")
          lightgbm_anchor = "from ai_platform.wickhunter.paper_validation import (\n"
          lightgbm_import = '''from ai_platform.wickhunter.lightgbm_scorer import (
              FEATURE_NAMES,
              FEATURE_SCHEMA_VERSION,
              MODEL_ARTIFACT_SCHEMA_VERSION,
              MODEL_KIND,
              CalibrationCurve,
              LightGBMModelArtifact,
              LightGBMTrainingPolicy,
          )
          '''
          if "LightGBMModelArtifact" not in tests:
              if tests.count(lightgbm_anchor) != 1:
                  raise SystemExit("candidate activation test import anchor mismatch")
              tests = tests.replace(lightgbm_anchor, lightgbm_import + lightgbm_anchor)

          model_start = tests.index("    model_base = {\n")
          model_end = tests.index("    payloads = {\n", model_start)
          model_replacement = '''    training_policy = LightGBMTrainingPolicy()
              calibration = CalibrationCurve(
                  schema_version="wickhunter-probability-calibration-v1",
                  upper_bounds=(Decimal("0.5"), Decimal("1")),
                  probabilities=(Decimal("0.4"), Decimal("0.7")),
              )
              artifact = LightGBMModelArtifact(
                  schema_version=MODEL_ARTIFACT_SCHEMA_VERSION,
                  model_kind=MODEL_KIND,
                  model_version="wickhunter-lightgbm-test",
                  model_hash=MODEL_HASH,
                  model_text="model-text",
                  feature_schema_version=FEATURE_SCHEMA_VERSION,
                  feature_schema_sha256=canonical_sha256(
                      {"version": FEATURE_SCHEMA_VERSION, "names": FEATURE_NAMES}
                  ),
                  feature_names=FEATURE_NAMES,
                  training_policy=training_policy,
                  dataset_id="wickhunter-test-dataset",
                  dataset_manifest_sha256="1" * 64,
                  market_manifest_sha256="2" * 64,
                  split_geometry_sha256="3" * 64,
                  price_path_manifest_sha256="4" * 64,
                  replay_policy_version="wickhunter-replay-test-v1",
                  replay_policy_sha256="5" * 64,
                  parameter_version=parameters.parameter_version,
                  parameter_sha256=parameters.parameter_hash,
                  training_case_sha256s=("6" * 64,),
                  calibration_case_sha256s=("7" * 64,),
                  training_example_count=2,
                  calibration_example_count=1,
                  positive_example_count=1,
                  negative_example_count=1,
                  positive_return_mean=Decimal("0.01"),
                  negative_return_mean=Decimal("-0.01"),
                  calibration=calibration,
                  protected_holdout_accessed=False,
                  automatic_promotion_enabled=False,
                  execution_enabled=False,
                  live_capital_authorized=False,
                  orders_submitted=0,
              )
              model_payload = artifact.as_registry_record()
          '''
          tests = tests[:model_start] + model_replacement + tests[model_end:]

          old_manifest = '        "model_version": model_payload["model_version"],\n'
          if tests.count(old_manifest) != 1:
              raise SystemExit("candidate activation test model manifest anchor mismatch")

          test_anchor = "def test_manifest_authority_tampering_is_rejected(tmp_path: Path) -> None:\n"
          new_test = '''def test_coordinated_model_schema_tampering_is_rejected(tmp_path: Path) -> None:
              root = _package(tmp_path / "candidate")
              model_path = root / "model-artifact.json"
              model = json.loads(model_path.read_text(encoding="utf-8"))
              model["feature_names"] = [*model["feature_names"], "future_return"]
              model["feature_schema_sha256"] = canonical_sha256(
                  {
                      "version": model["feature_schema_version"],
                      "names": model["feature_names"],
                  }
              )
              base = {
                  key: value
                  for key, value in model.items()
                  if key not in {"artifact_sha256", "promotion_state", "advisory_only"}
              }
              model["artifact_sha256"] = canonical_sha256(base)
              _write(model_path, model)
              _rehash(root)

              with pytest.raises(
                  CandidateActivationError,
                  match="model artifact semantic validation failed",
              ):
                  verify_candidate_package(root)


          '''
          if "test_coordinated_model_schema_tampering_is_rejected" not in tests:
              if tests.count(test_anchor) != 1:
                  raise SystemExit("candidate activation schema test anchor mismatch")
              tests = tests.replace(test_anchor, new_test + test_anchor)
          test_path.write_text(tests, encoding="utf-8")

      - name: Validate exact repaired implementation
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix ai_platform/wickhunter/candidate_activation.py tests/ai_platform_integration/test_wickhunter_candidate_activation.py
          ruff format ai_platform/wickhunter/candidate_activation.py tests/ai_platform_integration/test_wickhunter_candidate_activation.py
          ruff check ai_platform/wickhunter/candidate_activation.py tests/ai_platform_integration/test_wickhunter_candidate_activation.py
          ruff format --check ai_platform/wickhunter/candidate_activation.py tests/ai_platform_integration/test_wickhunter_candidate_activation.py
          mypy ai_platform/wickhunter/candidate_activation.py tests/ai_platform_integration/test_wickhunter_candidate_activation.py
          pytest -q tests/ai_platform_integration/test_wickhunter_candidate_activation.py

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wickhunter-candidate-artifact-schema-repair.yml
          git add ai_platform/wickhunter/candidate_activation.py tests/ai_platform_integration/test_wickhunter_candidate_activation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wickhunter): verify exact candidate model artifact"
          git push origin HEAD:feat/wickhunter-candidate-paper-activation-v1
