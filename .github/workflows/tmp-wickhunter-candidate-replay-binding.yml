name: Temporary WickHunter candidate replay binding

on:
  pull_request:
    branches:
      - ops/wickhunter-candidate-materialization-20260802-v1
    paths:
      - .github/wickhunter-candidate-replay-binding.request

permissions:
  contents: write

concurrency:
  group: wickhunter-candidate-replay-binding
  cancel-in-progress: false

jobs:
  bind:
    if: github.event.pull_request.head.ref == 'chore/trigger-wickhunter-candidate-replay-binding'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ops/wickhunter-candidate-materialization-20260802-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Bind accepted replay destination
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/wickhunter-candidate-materialization-20260802-v1.yml")
          source = path.read_text(encoding="utf-8")
          old = "/var/lib/freqtrade-staging-state/wickhunter-deterministic-replay/packages/wickhunter-wh02-deterministic-replay-20260802-v3-4369af03fa56"
          new = "/var/lib/freqtrade-staging-state/wickhunter-deterministic-replay/packages/wickhunter-wh02-deterministic-replay-20260802-v4-eac7fe2e1cb3"
          if source.count(old) != 1:
              raise SystemExit(f"expected one old replay binding, found {source.count(old)}")
          source = source.replace(old, new, 1)
          if source.count(new) != 1:
              raise SystemExit("new replay binding was not applied exactly once")
          path.write_text(source, encoding="utf-8")

      - name: Commit exact binding and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/tmp-wickhunter-candidate-replay-binding.yml
          git add \
            .github/workflows/wickhunter-candidate-materialization-20260802-v1.yml \
            .github/workflows/tmp-wickhunter-candidate-replay-binding.yml
          git diff --cached --check
          git commit -m "ops(wickhunter): bind candidate request to WH-02 replay v4"
          git push origin HEAD:ops/wickhunter-candidate-materialization-20260802-v1
