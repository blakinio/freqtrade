name: Temporary WickHunter candidate runtime binding implementation

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feat/wickhunter-candidate-runtime-binding-v1
    paths:
      - ".tmp/wickhunter-candidate-runtime-binding-implementation.md"

permissions:
  contents: write

concurrency:
  group: tmp-wickhunter-candidate-runtime-binding-implementation
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/trigger-wickhunter-candidate-runtime-binding-implementation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-candidate-runtime-binding-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Expose typed verified inputs
        shell: python
        run: |
          from pathlib import Path

          candidate_path = Path("ai_platform/wickhunter/candidate_activation.py")
          candidate = candidate_path.read_text(encoding="utf-8")

          result_anchor = '''@dataclass(frozen=True, slots=True)
          class CandidateActivationResult:
          '''
          package_block = '''@dataclass(frozen=True, slots=True)
          class VerifiedCandidatePackage:
              identity: VerifiedCandidateIdentity
              parameters: WickHunterParameters
              model_artifact: LightGBMModelArtifact


          '''
          if candidate.count(result_anchor) != 1:
              raise SystemExit("candidate result dataclass anchor mismatch")
          if "class VerifiedCandidatePackage:" in candidate:
              raise SystemExit("verified candidate package already exists")
          candidate = candidate.replace(result_anchor, package_block + result_anchor)

          old_signature = '''def verify_candidate_package(  # noqa: C901
              root: Path,
          ) -> tuple[VerifiedCandidateIdentity, WickHunterParameters]:
          '''
          new_signature = '''def load_verified_candidate_package(  # noqa: C901
              root: Path,
          ) -> VerifiedCandidatePackage:
          '''
          if candidate.count(old_signature) != 1:
              raise SystemExit("candidate package signature mismatch")
          candidate = candidate.replace(old_signature, new_signature)

          old_model = "    _verify_model(model_payload, manifest=manifest)\n"
          new_model = "    model_artifact = _verify_model(model_payload, manifest=manifest)\n"
          if candidate.count(old_model) != 1:
              raise SystemExit("candidate model verification target mismatch")
          candidate = candidate.replace(old_model, new_model)

          old_return = '''    return identity, parameters


          def _activation_binding(
          '''
          new_return = '''    return VerifiedCandidatePackage(
              identity=identity,
              parameters=parameters,
              model_artifact=model_artifact,
          )


          def verify_candidate_package(
              root: Path,
          ) -> tuple[VerifiedCandidateIdentity, WickHunterParameters]:
              package = load_verified_candidate_package(root)
              return package.identity, package.parameters


          def _activation_binding(
          '''
          if candidate.count(old_return) != 1:
              raise SystemExit("candidate package return target mismatch")
          candidate_path.write_text(candidate.replace(old_return, new_return), encoding="utf-8")

          paper_path = Path("ai_platform/wickhunter/paper_validation.py")
          paper = paper_path.read_text(encoding="utf-8")
          old_paper_signature = "def verify_paper_run_request(root: Path) -> dict[str, Any]:\n"
          new_paper_signature = '''def load_verified_paper_run_request(
              root: Path,
          ) -> tuple[PaperRunRequest, PaperValidationPolicy]:
          '''
          if paper.count(old_paper_signature) != 1:
              raise SystemExit("paper request verifier signature mismatch")
          paper = paper.replace(old_paper_signature, new_paper_signature)

          old_paper_return = '''    return {"run_id": request.run_id, "verified": True}


          def verify_paper_validation_package(root: Path) -> dict[str, Any]:  # noqa: C901
          '''
          new_paper_return = '''    return request, policy


          def verify_paper_run_request(root: Path) -> dict[str, Any]:
              request, _policy = load_verified_paper_run_request(root)
              return {"run_id": request.run_id, "verified": True}


          def verify_paper_validation_package(root: Path) -> dict[str, Any]:  # noqa: C901
          '''
          if paper.count(old_paper_return) != 1:
              raise SystemExit("paper request verifier return target mismatch")
          paper_path.write_text(paper.replace(old_paper_return, new_paper_return), encoding="utf-8")

          task_path = Path(
              "docs/agents/tasks/FTAI-20260802-wickhunter-candidate-runtime-binding-v1.md"
          )
          task = task_path.read_text(encoding="utf-8")
          task = task.replace("status: implementing", "status: validating")
          task = task.replace("phase: implementation", "phase: validation")
          task = task.replace(
              "next_action: expose typed verified loaders; validate the runtime binding with focused tests and exact-head repository CI",
              "next_action: complete exact-head repository CI; audit the final diff and merge only on an unchanged green SHA",
          )
          task_path.write_text(task, encoding="utf-8")

      - name: Validate focused implementation
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            ai_platform/wickhunter/candidate_activation.py
            ai_platform/wickhunter/candidate_runtime_binding.py
            ai_platform/wickhunter/paper_validation.py
            tests/ai_platform_integration/test_wickhunter_candidate_runtime_binding.py
          )
          ruff check --fix "${paths[@]}"
          ruff format "${paths[@]}"
          ruff check "${paths[@]}"
          ruff format --check "${paths[@]}"
          mypy "${paths[@]}"
          pytest -q \
            tests/ai_platform_integration/test_wickhunter_candidate_activation.py \
            tests/ai_platform_integration/test_wickhunter_paper_validation.py \
            tests/ai_platform_integration/test_wickhunter_candidate_runtime_binding.py

      - name: Commit validated implementation and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wickhunter-candidate-runtime-binding-implementation.yml
          git add \
            ai_platform/wickhunter/candidate_activation.py \
            ai_platform/wickhunter/candidate_runtime_binding.py \
            ai_platform/wickhunter/paper_validation.py \
            tests/ai_platform_integration/test_wickhunter_candidate_runtime_binding.py \
            docs/ai_platform/WICKHUNTER_CANDIDATE_RUNTIME_BINDING.md \
            docs/agents/tasks/FTAI-20260802-wickhunter-candidate-runtime-binding-v1.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(wickhunter): bind verified candidate to paper runtime"
          git push origin HEAD:feat/wickhunter-candidate-runtime-binding-v1
