name: Temporary WickHunter deterministic replay window index

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - perf/wickhunter-deterministic-replay-window-index-v1
    paths:
      - ".tmp/wickhunter-deterministic-replay-window-index.md"

permissions:
  contents: write

concurrency:
  group: tmp-wickhunter-deterministic-replay-window-index
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/trigger-wickhunter-deterministic-replay-window-index'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: perf/wickhunter-deterministic-replay-window-index-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Implement one-time path validation and exact slicing
        shell: python
        run: |
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label} anchor mismatch: {count}")
              return source.replace(old, new)

          implementation_path = Path("ai_platform/wickhunter/deterministic_replay.py")
          implementation = implementation_path.read_text(encoding="utf-8")
          build_anchor = '''def _build_labels(
              *,
              rows: Sequence[_DatasetRow],
              trades_by_symbol: Mapping[str, Sequence[ReplayAggregateTrade]],
              request: ReplayRequest,
          ) -> list[CandidateLabel]:
          '''
          helpers = '''def _validated_trade_timestamps(
              trades_by_symbol: Mapping[str, Sequence[ReplayAggregateTrade]],
          ) -> dict[str, tuple[int, ...]]:
              result: dict[str, tuple[int, ...]] = {}
              for symbol, trades in trades_by_symbol.items():
                  if not trades:
                      raise DeterministicReplayError(f"trade path is empty for {symbol}")
                  orders = tuple(
                      (trade.occurred_at_ms, trade.aggregate_trade_id) for trade in trades
                  )
                  if list(orders) != sorted(set(orders)):
                      raise DeterministicReplayError(
                          f"trade path must be unique and strictly ordered for {symbol}"
                      )
                  if any(trade.symbol != symbol for trade in trades):
                      raise DeterministicReplayError(
                          f"trade path symbol does not match partition for {symbol}"
                      )
                  result[symbol] = tuple(trade.occurred_at_ms for trade in trades)
              return result


          def _exact_replay_trade_window(
              *,
              trades: Sequence[ReplayAggregateTrade],
              timestamps: Sequence[int],
              decision_timestamp_ms: int,
              policy: ReplayPolicy,
          ) -> Sequence[ReplayAggregateTrade]:
              eligible_at = decision_timestamp_ms + policy.entry_delay_ms
              label_end = decision_timestamp_ms + policy.label_horizon_ms
              start_index = bisect_left(timestamps, eligible_at)
              coverage_index = bisect_left(timestamps, label_end)
              if coverage_index >= len(trades):
                  raise DeterministicReplayError(
                      "trade path does not reach the exact label deadline"
                  )
              end_index = bisect_right(timestamps, label_end)
              if end_index <= coverage_index:
                  end_index = coverage_index + 1
              return trades[start_index:end_index]


          '''
          if helpers.strip() in implementation:
              raise SystemExit("replay window helpers already exist")
          implementation = replace_once(
              implementation,
              build_anchor,
              helpers + build_anchor,
              "build-labels insertion",
          )

          implementation = replace_once(
              implementation,
              "    labels: list[CandidateLabel] = []\n"
              "    for row in rows:\n",
              "    labels: list[CandidateLabel] = []\n"
              "    timestamps_by_symbol = _validated_trade_timestamps(trades_by_symbol)\n"
              "    for row in rows:\n",
              "timestamp index initialization",
          )
          implementation = replace_once(
              implementation,
              "        trades = trades_by_symbol.get(row.symbol)\n"
              "        if trades is None:\n"
              "            raise DeterministicReplayError(f\"missing price path for {row.symbol}\")\n"
              "        for side in request.sides:\n",
              "        trades = trades_by_symbol.get(row.symbol)\n"
              "        timestamps = timestamps_by_symbol.get(row.symbol)\n"
              "        if trades is None or timestamps is None:\n"
              "            raise DeterministicReplayError(f\"missing price path for {row.symbol}\")\n"
              "        replay_trades = _exact_replay_trade_window(\n"
              "            trades=trades,\n"
              "            timestamps=timestamps,\n"
              "            decision_timestamp_ms=row.decision_timestamp_ms,\n"
              "            policy=request.policy,\n"
              "        )\n"
              "        for side in request.sides:\n",
              "row trade-window selection",
          )
          implementation = replace_once(
              implementation,
              "                replay_event_label(decision=decision, trades=trades, policy=request.policy)\n",
              "                replay_event_label(\n"
              "                    decision=decision,\n"
              "                    trades=replay_trades,\n"
              "                    policy=request.policy,\n"
              "                )\n",
              "bounded replay call",
          )
          implementation_path.write_text(implementation, encoding="utf-8")

          tests_path = Path(
              "tests/ai_platform_integration/test_wickhunter_deterministic_replay.py"
          )
          tests = tests_path.read_text(encoding="utf-8")
          test_anchor = '''def test_builds_verifies_reproduces_and_rejects_tampering(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
          '''
          regression = '''def test_build_labels_passes_only_the_exact_replay_window(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              decision_timestamp_ms = START + 10_000
              trades = (
                  _trade(1, START, "99"),
                  _trade(2, decision_timestamp_ms, "100"),
                  _trade(3, decision_timestamp_ms + 5_000, "101"),
                  _trade(4, decision_timestamp_ms + 10_000, "102"),
                  _trade(5, decision_timestamp_ms + 10_000, "103"),
                  _trade(6, decision_timestamp_ms + 11_000, "104"),
              )
              request = _request("1" * 64, PRICE_PATH_HASH)
              observed_windows: list[tuple[subject.ReplayAggregateTrade, ...]] = []
              original = subject.replay_event_label

              def observe_window(
                  *,
                  decision: subject.ReplayDecision,
                  trades: tuple[subject.ReplayAggregateTrade, ...],
                  policy: subject.ReplayPolicy,
              ) -> subject.CandidateLabel:
                  observed_windows.append(tuple(trades))
                  return original(decision=decision, trades=trades, policy=policy)

              monkeypatch.setattr(subject, "replay_event_label", observe_window)
              labels = subject._build_labels(
                  rows=(
                      subject._DatasetRow(
                          split_name="train",
                          symbol=SYMBOL,
                          decision_timestamp_ms=decision_timestamp_ms,
                          row_sha256="2" * 64,
                      ),
                  ),
                  trades_by_symbol={SYMBOL: trades},
                  request=request,
              )

              assert len(labels) == 2
              assert len(observed_windows) == 2
              for window in observed_windows:
                  assert tuple(item.aggregate_trade_id for item in window) == (2, 3, 4, 5)
                  assert window[0].occurred_at_ms == decision_timestamp_ms
                  assert window[-1].occurred_at_ms == decision_timestamp_ms + 10_000


          '''
          if tests.count(test_anchor) != 1:
              raise SystemExit("performance regression insertion anchor mismatch")
          tests_path.write_text(
              tests.replace(test_anchor, regression + test_anchor, 1),
              encoding="utf-8",
          )

          task_path = Path(
              "docs/agents/tasks/FTAI-20260802-wickhunter-deterministic-replay-window-index-v1.md"
          )
          task = task_path.read_text(encoding="utf-8")
          task = task.replace("status: implementing", "status: validating")
          task = task.replace("phase: implementation", "phase: validation")
          task = task.replace(
              "next_action: implement one-time symbol path validation and exact replay-window slicing; validate semantic parity and exact-head CI",
              "next_action: complete exact-head CI; audit semantic parity and merge only on an unchanged green SHA",
          )
          task_path.write_text(task, encoding="utf-8")

      - name: Validate semantic parity and focused performance path
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            ai_platform/wickhunter/deterministic_replay.py
            tests/ai_platform_integration/test_wickhunter_deterministic_replay.py
          )
          ruff format "${paths[@]}"
          ruff check --fix "${paths[@]}"
          ruff format "${paths[@]}"
          ruff check "${paths[@]}"
          ruff format --check "${paths[@]}"
          mypy ai_platform/wickhunter/deterministic_replay.py
          pytest -q tests/ai_platform_integration/test_wickhunter_deterministic_replay.py

      - name: Commit validated implementation and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wickhunter-deterministic-replay-window-index.yml
          git add \
            ai_platform/wickhunter/deterministic_replay.py \
            tests/ai_platform_integration/test_wickhunter_deterministic_replay.py \
            docs/ai_platform/WICKHUNTER_DETERMINISTIC_REPLAY_WINDOW_INDEX.md \
            docs/agents/tasks/FTAI-20260802-wickhunter-deterministic-replay-window-index-v1.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf(wickhunter): index exact replay trade windows"
          git push origin HEAD:perf/wickhunter-deterministic-replay-window-index-v1
