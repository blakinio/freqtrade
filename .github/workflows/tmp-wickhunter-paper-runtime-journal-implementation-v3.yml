name: Temporary WickHunter paper runtime journal implementation v3

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feat/wickhunter-paper-runtime-journal-v1
    paths:
      - ".tmp/wickhunter-paper-runtime-journal-implementation-v3.md"

permissions:
  contents: write

concurrency:
  group: tmp-wickhunter-paper-runtime-journal-implementation-v3
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/trigger-wickhunter-paper-runtime-journal-implementation-v3'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-paper-runtime-journal-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Reapply implementation and repair focused tests
        shell: python
        run: |
          from pathlib import Path
          import yaml

          previous = Path(
              ".github/workflows/tmp-wickhunter-paper-runtime-journal-implementation-v2.yml"
          )
          workflow = yaml.safe_load(previous.read_text(encoding="utf-8"))
          script = next(
              step["run"]
              for step in workflow["jobs"]["implement"]["steps"]
              if step.get("name") == "Reuse bounded implementation and apply lint repair"
          )
          exec(compile(script, str(previous), "exec"), {"__name__": "__main__"})

          service_path = Path(
              "ai_platform/wickhunter/candidate_paper_runtime_service.py"
          )
          service = service_path.read_text(encoding="utf-8")
          old_condition = (
              "        if not decision_ids or len(decision_ids) != len(set(decision_ids)):\n"
              "            raise CandidatePaperRuntimeServiceError(\n"
              "                \"generation decision identities are invalid\"\n"
              "            )\n"
          )
          new_condition = (
              "        if len(decision_ids) != len(set(decision_ids)) or any(\n"
              "            len(value) != 64\n"
              "            or any(character not in \"0123456789abcdef\" for character in value)\n"
              "            for value in decision_ids\n"
              "        ):\n"
              "            raise CandidatePaperRuntimeServiceError(\n"
              "                \"generation decision identities are invalid\"\n"
              "            )\n"
          )
          if old_condition in service:
              service = service.replace(old_condition, new_condition, 1)
          elif new_condition not in service:
              raise SystemExit("decision identity validation anchor mismatch")
          service_path.write_text(service, encoding="utf-8")

          test_path = Path(
              "tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          import_anchor = "    SourceHealth,\n"
          if "    StrategyHypothesis,\n" not in tests:
              if tests.count(import_anchor) != 1:
                  raise SystemExit("StrategyHypothesis import anchor mismatch")
              tests = tests.replace(
                  import_anchor,
                  import_anchor + "    StrategyHypothesis,\n",
                  1,
              )

          if "hypothesis=StrategyHypothesis.REVERSAL" not in tests:
              lines = tests.splitlines()
              request_start = next(
                  index
                  for index, line in enumerate(lines)
                  if line.startswith("def _request(")
              )
              request_end = next(
                  index
                  for index in range(request_start + 1, len(lines))
                  if lines[index].startswith("def _tick(")
              )
              candidates = [
                  index
                  for index in range(request_start, request_end)
                  if 'bot_instance="wickhunter-paper-v1"' in lines[index]
              ]
              if len(candidates) != 1:
                  raise SystemExit("fake request bot-instance anchor mismatch")
              index = candidates[0]
              indentation = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
              lines.insert(
                  index + 1,
                  f"{indentation}hypothesis=StrategyHypothesis.REVERSAL,",
              )
              tests = "\n".join(lines) + "\n"
          test_path.write_text(tests, encoding="utf-8")

      - name: Validate focused implementation
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            ai_platform/wickhunter/paper_validation.py
            ai_platform/wickhunter/candidate_paper_runtime_service.py
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py
          )
          ruff format "${paths[@]}"
          ruff check --fix "${paths[@]}"
          ruff format "${paths[@]}"
          ruff check "${paths[@]}"
          ruff format --check "${paths[@]}"
          mypy "${paths[@]}"
          pytest -q \
            tests/ai_platform_integration/test_wickhunter_paper_validation.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py

      - name: Commit validated implementation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/tmp-wickhunter-paper-runtime-journal-implementation.yml \
            .github/workflows/tmp-wickhunter-paper-runtime-journal-implementation-v2.yml \
            .github/workflows/tmp-wickhunter-paper-runtime-journal-implementation-v3.yml
          git add \
            ai_platform/wickhunter/paper_validation.py \
            ai_platform/wickhunter/candidate_paper_runtime_service.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py \
            docs/ai_platform/WICKHUNTER_CANDIDATE_PAPER_RUNTIME_SERVICE.md \
            docs/agents/tasks/FTAI-20260802-wickhunter-candidate-paper-runtime-journal-v1.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(wickhunter): add restart-safe candidate paper runtime"
          git push origin HEAD:feat/wickhunter-paper-runtime-journal-v1
