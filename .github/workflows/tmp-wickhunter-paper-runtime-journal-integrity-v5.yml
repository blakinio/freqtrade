name: Temporary WickHunter paper runtime journal integrity v5

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feat/wickhunter-paper-runtime-journal-v1
    paths:
      - ".tmp/wickhunter-paper-runtime-journal-integrity-v5.md"

permissions:
  contents: write

concurrency:
  group: tmp-wickhunter-paper-runtime-journal-integrity-v5
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/trigger-wickhunter-paper-runtime-journal-integrity-v5'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-paper-runtime-journal-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Reuse integrity hardening with label-scoped replacement
        shell: python
        run: |
          from pathlib import Path

          import yaml

          previous = Path(
              ".github/workflows/tmp-wickhunter-paper-runtime-journal-integrity-v3.yml"
          )
          workflow = yaml.safe_load(previous.read_text(encoding="utf-8"))
          script = next(
              step["run"]
              for step in workflow["jobs"]["harden"]["steps"]
              if step.get("name") == "Bind generation chain and canonical identities"
          )
          label = '"new generation verification",'
          label_at = script.find(label)
          if label_at < 0:
              raise SystemExit("new generation verification label not found")
          start = script.rfind("service = replace_once(", 0, label_at)
          if start < 0:
              raise SystemExit("new generation verification operation not found")
          end = script.find("\n)", label_at)
          if end < 0:
              raise SystemExit("new generation verification operation end not found")
          end += len("\n)")
          structural = '''lines = service.splitlines()
          commit_start = next(
              index
              for index, line in enumerate(lines)
              if line.startswith("    def commit(")
          )
          observations_start = next(
              index
              for index in range(commit_start + 1, len(lines))
              if lines[index].startswith("    def observations(")
          )
          matches = [
              index
              for index in range(commit_start, observations_start)
              if lines[index] == "        self._verify_generation(destination)"
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"commit generation verification anchor mismatch: {len(matches)}"
              )
          index = matches[0]
          lines[index : index + 1] = [
              "        self._verify_generation(",
              "            destination,",
              "            expected_previous_manifest_sha256=previous_manifest,",
              "        )",
          ]
          service = "\\n".join(lines) + "\\n"
          '''
          script = script[:start] + structural + script[end:]
          exec(compile(script, str(previous), "exec"), {"__name__": "__main__"})

      - name: Validate integrity hardening
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            ai_platform/wickhunter/candidate_paper_runtime_service.py
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py
          )
          ruff format "${paths[@]}"
          ruff check --fix "${paths[@]}"
          ruff format "${paths[@]}"
          ruff check "${paths[@]}"
          ruff format --check "${paths[@]}"
          mypy "${paths[@]}"
          pytest -q \
            tests/ai_platform_integration/test_wickhunter_paper_validation.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py

      - name: Commit validated hardening and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/tmp-wickhunter-paper-runtime-journal-integrity.yml \
            .github/workflows/tmp-wickhunter-paper-runtime-journal-integrity-v2.yml \
            .github/workflows/tmp-wickhunter-paper-runtime-journal-integrity-v3.yml \
            .github/workflows/tmp-wickhunter-paper-runtime-journal-integrity-v4.yml \
            .github/workflows/tmp-wickhunter-paper-runtime-journal-integrity-v5.yml
          git add \
            ai_platform/wickhunter/candidate_paper_runtime_service.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wickhunter): verify paper runtime generation chain"
          git push origin HEAD:feat/wickhunter-paper-runtime-journal-v1
