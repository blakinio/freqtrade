name: Temporary WickHunter paper runtime journal integrity v6

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feat/wickhunter-paper-runtime-journal-v1
    paths:
      - ".tmp/wickhunter-paper-runtime-journal-integrity-v6.md"

permissions:
  contents: write

concurrency:
  group: tmp-wickhunter-paper-runtime-journal-integrity-v6
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/trigger-wickhunter-paper-runtime-journal-integrity-v6'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-paper-runtime-journal-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Apply direct state-aware integrity hardening
        shell: python
        run: |
          from pathlib import Path

          def method_bounds(lines: list[str], name: str) -> tuple[int, int]:
              start = next(
                  index
                  for index, line in enumerate(lines)
                  if line.startswith(f"    def {name}(")
              )
              end = next(
                  (
                      index
                      for index in range(start + 1, len(lines))
                      if lines[index].startswith("    def ")
                  ),
                  len(lines),
              )
              return start, end

          service_path = Path(
              "ai_platform/wickhunter/candidate_paper_runtime_service.py"
          )
          lines = service_path.read_text(encoding="utf-8").splitlines()

          verify_start, verify_end = method_bounds(lines, "_verify_generation")
          if not any("expected_previous_manifest_sha256" in line for line in lines[verify_start:verify_end]):
              signature_end = next(
                  index
                  for index in range(verify_start, verify_end)
                  if lines[index].strip().startswith(") -> tuple[")
              )
              lines[signature_end:signature_end] = [
                  "        *,",
                  "        expected_previous_manifest_sha256: str | None,",
              ]
              verify_end += 2

          run_guard = next(
              index
              for index in range(verify_start, verify_end)
              if 'raise CandidatePaperRuntimeServiceError("generation run mismatch")'
              in lines[index]
          )
          if not any("generation chain identity mismatch" in line for line in lines[verify_start:verify_end]):
              lines[run_guard + 1 : run_guard + 1] = [
                  "        if (",
                  '            manifest.get("previous_manifest_sha256")',
                  "            != expected_previous_manifest_sha256",
                  "        ):",
                  "            raise CandidatePaperRuntimeServiceError(",
                  '                "generation chain identity mismatch"',
                  "            )",
                  "        if (",
                  '            manifest.get("runtime_policy_sha256")',
                  "            != self.runtime_policy.policy_sha256",
                  "        ):",
                  "            raise CandidatePaperRuntimeServiceError(",
                  '                "generation runtime policy identity mismatch"',
                  "            )",
              ]
              verify_end += 14

          snapshot_guard = next(
              index
              for index in range(verify_start, verify_end)
              if "generation snapshot identity mismatch" in lines[index]
          )
          snapshot_block_end = snapshot_guard + 2
          if not any("generation observation identity mismatch" in line for line in lines[verify_start:verify_end]):
              lines[snapshot_block_end:snapshot_block_end] = [
                  '        if manifest.get("observation_sha256") != canonical_sha256(',
                  "            observation",
                  "        ):",
                  "            raise CandidatePaperRuntimeServiceError(",
                  '                "generation observation identity mismatch"',
                  "            )",
              ]

          latest_start, latest_end = method_bounds(lines, "latest_state")
          if not any(
              line.startswith("    def _verified_generations(") for line in lines
          ):
              replacement = [
                  "    def _verified_generations(",
                  "        self,",
                  "    ) -> tuple[",
                  "        tuple[ShadowRuntimeState, PaperObservation, tuple[str, ...], str], ...",
                  "    ]:",
                  "        verified: list[",
                  "            tuple[ShadowRuntimeState, PaperObservation, tuple[str, ...], str]",
                  "        ] = []",
                  "        previous_manifest_sha256: str | None = None",
                  "        for path in self._generation_paths():",
                  "            result = self._verify_generation(",
                  "                path,",
                  "                expected_previous_manifest_sha256=previous_manifest_sha256,",
                  "            )",
                  "            previous_manifest_sha256 = result[3]",
                  "            verified.append(result)",
                  "        return tuple(verified)",
                  "",
                  "    def latest_state(self) -> ShadowRuntimeState | None:",
                  "        verified = self._verified_generations()",
                  "        if not verified:",
                  "            return None",
                  "        latest_state, latest_observation, _decision_ids_value, latest_manifest = (",
                  "            verified[-1]",
                  "        )",
                  "        self._write_pointer(",
                  "            generation=latest_state.generation,",
                  "            manifest_sha256=latest_manifest,",
                  "            runtime_state_sha256=latest_state.state_sha256,",
                  "            snapshot_id=latest_observation.snapshot_id,",
                  "        )",
                  "        return latest_state",
                  "",
              ]
              lines[latest_start:latest_end] = replacement

          commit_start, commit_end = method_bounds(lines, "commit")
          for index in range(commit_start, commit_end):
              if lines[index] == "        previous = self._generation_paths()":
                  lines[index] = "        previous = self._verified_generations()"
                  break
          else:
              if not any(
                  line == "        previous = self._verified_generations()"
                  for line in lines[commit_start:commit_end]
              ):
                  raise SystemExit("commit previous-generation anchor missing")

          commit_start, commit_end = method_bounds(lines, "commit")
          previous_start = next(
              (
                  index
                  for index in range(commit_start, commit_end)
                  if lines[index].strip() == "previous_manifest = ("
              ),
              None,
          )
          if previous_start is not None:
              previous_end = next(
                  index
                  for index in range(previous_start + 1, commit_end)
                  if lines[index].strip() == ")"
              )
              lines[previous_start : previous_end + 1] = [
                  "            previous_manifest = None if not previous else previous[-1][3]"
              ]

          commit_start, commit_end = method_bounds(lines, "commit")
          plain_calls = [
              index
              for index in range(commit_start, commit_end)
              if lines[index] == "        self._verify_generation(destination)"
          ]
          if len(plain_calls) == 1:
              index = plain_calls[0]
              lines[index : index + 1] = [
                  "        self._verify_generation(",
                  "            destination,",
                  "            expected_previous_manifest_sha256=previous_manifest,",
                  "        )",
              ]
          elif len(plain_calls) != 0:
              raise SystemExit("commit destination verification is ambiguous")

          observations_start, observations_end = method_bounds(lines, "observations")
          lines[observations_start:observations_end] = [
              "    def observations(self) -> tuple[PaperObservation, ...]:",
              "        return tuple(item[1] for item in self._verified_generations())",
              "",
          ]

          step_start, step_end = method_bounds(lines, "step")
          dead_branch = next(
              (
                  index
                  for index in range(step_start, step_end)
                  if lines[index].strip()
                  == "if isinstance(exc, CandidatePaperRuntimeServiceError):"
              ),
              None,
          )
          if dead_branch is not None:
              except_start = next(
                  index
                  for index in range(dead_branch - 1, step_start, -1)
                  if lines[index].lstrip().startswith("except (")
              )
              lines[except_start:dead_branch + 2] = [
                  "        except CandidatePaperRuntimeServiceError:",
                  "            self.runtime.state = previous_state",
                  "            raise",
                  "        except (ShadowRuntimeError, PaperValidationError, OSError, ValueError) as exc:",
                  "            self.runtime.state = previous_state",
              ]

          service_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          test_path = Path(
              "tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          if "import hashlib\n" not in tests:
              tests = tests.replace(
                  "from __future__ import annotations\n\n",
                  "from __future__ import annotations\n\nimport hashlib\nimport json\n",
                  1,
              )
          if "GENERATION_SCHEMA_VERSION," not in tests:
              tests = tests.replace(
                  "from ai_platform.wickhunter.candidate_paper_runtime_service import (\n",
                  "from ai_platform.wickhunter.candidate_paper_runtime_service import (\n"
                  "    GENERATION_SCHEMA_VERSION,\n",
                  1,
              )
          tests = tests.replace(
              "from ai_platform.wickhunter.canonical import canonical_sha256\n",
              "from ai_platform.wickhunter.canonical import canonical_json, canonical_sha256\n",
              1,
          )
          if "test_recovery_rejects_generation_manifest_identity_substitution" not in tests:
              anchor = "def test_finalize_refuses_before_prospective_window_elapsed("
              index = tests.find(anchor)
              if index < 0:
                  raise SystemExit("integrity test insertion anchor missing")
              addition = '''def _rewrite_generation_manifest_field(
              generation_root: Path,
              *,
              field: str,
              value: object,
          ) -> None:
              manifest_path = generation_root / "manifest.json"
              payload = json.loads(manifest_path.read_text(encoding="utf-8"))
              payload[field] = value
              body = {
                  key: item
                  for key, item in payload.items()
                  if key not in {"schema_version", "manifest_sha256"}
              }
              payload["manifest_sha256"] = canonical_sha256(
                  {"schema_version": GENERATION_SCHEMA_VERSION, "payload": body}
              )
              manifest_path.write_text(canonical_json(payload) + "\n", encoding="utf-8")
              digest = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
              index_path = generation_root / "artifact-sha256.txt"
              lines = [
                  f"{digest}  manifest.json"
                  if line.endswith("  manifest.json")
                  else line
                  for line in index_path.read_text(encoding="utf-8").splitlines()
              ]
              index_path.write_text("\n".join(lines) + "\n", encoding="utf-8")


          @pytest.mark.parametrize(
              ("field", "value", "message"),
              (
                  ("previous_manifest_sha256", "9" * 64, "generation chain identity"),
                  ("runtime_policy_sha256", "8" * 64, "runtime policy identity"),
                  ("observation_sha256", "7" * 64, "observation identity"),
              ),
          )
          def test_recovery_rejects_generation_manifest_identity_substitution(
              tmp_path: Path,
              field: str,
              value: object,
              message: str,
          ) -> None:
              root = (tmp_path / f"manifest-{field}").resolve()
              service = _service(root)
              service.step(_tick(START_MS + 1_000))
              service.step(_tick(START_MS + 2_000))
              generation_root = root / "generations" / "00000000000000000002"
              _rewrite_generation_manifest_field(
                  generation_root,
                  field=field,
                  value=value,
              )

              with pytest.raises(CandidatePaperRuntimeServiceError, match=message):
                  _service(root)


          '''
              tests = tests[:index] + addition + tests[index:]
          test_path.write_text(tests, encoding="utf-8")

      - name: Validate integrity hardening
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            ai_platform/wickhunter/candidate_paper_runtime_service.py
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py
          )
          ruff format "${paths[@]}"
          ruff check --fix "${paths[@]}"
          ruff format "${paths[@]}"
          ruff check "${paths[@]}"
          ruff format --check "${paths[@]}"
          mypy "${paths[@]}"
          pytest -q \
            tests/ai_platform_integration/test_wickhunter_paper_validation.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py

      - name: Commit validated hardening and remove all helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/tmp-wickhunter-paper-runtime-journal-integrity.yml \
            .github/workflows/tmp-wickhunter-paper-runtime-journal-integrity-v2.yml \
            .github/workflows/tmp-wickhunter-paper-runtime-journal-integrity-v3.yml \
            .github/workflows/tmp-wickhunter-paper-runtime-journal-integrity-v4.yml \
            .github/workflows/tmp-wickhunter-paper-runtime-journal-integrity-v5.yml \
            .github/workflows/tmp-wickhunter-paper-runtime-journal-integrity-v6.yml
          git add \
            ai_platform/wickhunter/candidate_paper_runtime_service.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wickhunter): verify paper runtime generation chain"
          git push origin HEAD:feat/wickhunter-paper-runtime-journal-v1
