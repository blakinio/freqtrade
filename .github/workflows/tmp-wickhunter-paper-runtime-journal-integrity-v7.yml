name: Temporary WickHunter paper runtime journal integrity v7

on:
  pull_request:
    branches:
      - feat/wickhunter-paper-runtime-journal-v1
    paths:
      - .github/wickhunter-paper-runtime-journal-integrity-v7.request

permissions:
  contents: write

concurrency:
  group: wickhunter-paper-runtime-journal-integrity-v7
  cancel-in-progress: false

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'chore/trigger-wickhunter-paper-runtime-journal-integrity-v7'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-paper-runtime-journal-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          activate-environment: true
          python-version: '3.13'
          enable-cache: false

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Apply exact journal integrity hardening
        shell: python
        run: |
          from pathlib import Path

          service_path = Path("ai_platform/wickhunter/candidate_paper_runtime_service.py")
          source = service_path.read_text(encoding="utf-8")

          replacements = (
              (
                  '''    def _verify_generation(  # noqa: C901
                  self,
                  generation_root: Path,
              ) -> tuple[ShadowRuntimeState, PaperObservation, tuple[str, ...], str]:
          ''',
                  '''    def _verify_generation(  # noqa: C901
                  self,
                  generation_root: Path,
                  *,
                  expected_previous_manifest_sha256: str | None,
              ) -> tuple[ShadowRuntimeState, PaperObservation, tuple[str, ...], str]:
          ''',
              ),
              (
                  '''        if manifest.get("run_id") != self.binding.request.run_id:
                      raise CandidatePaperRuntimeServiceError("generation run mismatch")
          ''',
                  '''        if manifest.get("run_id") != self.binding.request.run_id:
                      raise CandidatePaperRuntimeServiceError("generation run mismatch")
                  if manifest.get("previous_manifest_sha256") != expected_previous_manifest_sha256:
                      raise CandidatePaperRuntimeServiceError("generation chain identity mismatch")
                  if manifest.get("runtime_policy_sha256") != self.runtime_policy.policy_sha256:
                      raise CandidatePaperRuntimeServiceError(
                          "generation runtime policy identity mismatch"
                      )
          ''',
              ),
              (
                  '''        if observation.snapshot_id != manifest.get("snapshot_id"):
                      raise CandidatePaperRuntimeServiceError("generation snapshot identity mismatch")
          ''',
                  '''        if observation.snapshot_id != manifest.get("snapshot_id"):
                      raise CandidatePaperRuntimeServiceError("generation snapshot identity mismatch")
                  if manifest.get("observation_sha256") != canonical_sha256(observation):
                      raise CandidatePaperRuntimeServiceError(
                          "generation observation identity mismatch"
                      )
          ''',
              ),
              (
                  '''    def latest_state(self) -> ShadowRuntimeState | None:
                  paths = self._generation_paths()
                  if not paths:
                      return None
                  latest_state: ShadowRuntimeState | None = None
                  latest_observation: PaperObservation | None = None
                  latest_manifest = ""
                  for path in paths:
                      latest_state, latest_observation, _decision_ids_value, latest_manifest = (
                          self._verify_generation(path)
                      )
                  if latest_state is None or latest_observation is None:
                      raise CandidatePaperRuntimeServiceError("latest generation is unavailable")
                  self._write_pointer(
                      generation=latest_state.generation,
                      manifest_sha256=latest_manifest,
                      runtime_state_sha256=latest_state.state_sha256,
                      snapshot_id=latest_observation.snapshot_id,
                  )
                  return latest_state
          ''',
                  '''    def _verified_generations(
                  self,
              ) -> tuple[
                  tuple[ShadowRuntimeState, PaperObservation, tuple[str, ...], str], ...
              ]:
                  verified: list[
                      tuple[ShadowRuntimeState, PaperObservation, tuple[str, ...], str]
                  ] = []
                  previous_manifest_sha256: str | None = None
                  for path in self._generation_paths():
                      result = self._verify_generation(
                          path,
                          expected_previous_manifest_sha256=previous_manifest_sha256,
                      )
                      previous_manifest_sha256 = result[3]
                      verified.append(result)
                  return tuple(verified)

              def latest_state(self) -> ShadowRuntimeState | None:
                  verified = self._verified_generations()
                  if not verified:
                      return None
                  latest_state, latest_observation, _decision_ids_value, latest_manifest = (
                      verified[-1]
                  )
                  self._write_pointer(
                      generation=latest_state.generation,
                      manifest_sha256=latest_manifest,
                      runtime_state_sha256=latest_state.state_sha256,
                      snapshot_id=latest_observation.snapshot_id,
                  )
                  return latest_state
          ''',
              ),
              (
                  "        previous = self._generation_paths()\n",
                  "        previous = self._verified_generations()\n",
              ),
              (
                  '''            previous_manifest = None if not previous else self._verify_generation(previous[-1])[3]
          ''',
                  '''            previous_manifest = None if not previous else previous[-1][3]
          ''',
              ),
              (
                  '''        self._verify_generation(destination)
          ''',
                  '''        self._verify_generation(
                  destination,
                  expected_previous_manifest_sha256=previous_manifest,
              )
          ''',
              ),
              (
                  '''    def observations(self) -> tuple[PaperObservation, ...]:
                  return tuple(self._verify_generation(path)[1] for path in self._generation_paths())
          ''',
                  '''    def observations(self) -> tuple[PaperObservation, ...]:
                  return tuple(item[1] for item in self._verified_generations())
          ''',
              ),
              (
                  '''        except (ShadowRuntimeError, PaperValidationError, OSError, ValueError) as exc:
                      self.runtime.state = previous_state
                      if isinstance(exc, CandidatePaperRuntimeServiceError):
                          raise
                      raise CandidatePaperRuntimeServiceError("candidate PAPER runtime step failed") from exc
          ''',
                  '''        except CandidatePaperRuntimeServiceError:
                      self.runtime.state = previous_state
                      raise
                  except (ShadowRuntimeError, PaperValidationError, OSError, ValueError) as exc:
                      self.runtime.state = previous_state
                      raise CandidatePaperRuntimeServiceError("candidate PAPER runtime step failed") from exc
          ''',
              ),
          )

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one source anchor, found {count}: {old.splitlines()[0]!r}")
              source = source.replace(old, new, 1)
          service_path.write_text(source, encoding="utf-8")

          test_path = Path(
              "tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          test_replacements = (
              (
                  "from __future__ import annotations\n\n",
                  "from __future__ import annotations\n\nimport hashlib\nimport json\n",
              ),
              (
                  '''from ai_platform.wickhunter.candidate_paper_runtime_service import (
                  CandidatePaperRuntimeService,
                  CandidatePaperRuntimeServiceError,
              )
          ''',
                  '''from ai_platform.wickhunter.candidate_paper_runtime_service import (
                  GENERATION_SCHEMA_VERSION,
                  CandidatePaperRuntimeService,
                  CandidatePaperRuntimeServiceError,
              )
          ''',
              ),
              (
                  "from ai_platform.wickhunter.canonical import canonical_sha256\n",
                  "from ai_platform.wickhunter.canonical import canonical_json, canonical_sha256\n",
              ),
          )
          for old, new in test_replacements:
              count = tests.count(old)
              if count != 1:
                  raise SystemExit(f"expected one test anchor, found {count}: {old.splitlines()[0]!r}")
              tests = tests.replace(old, new, 1)

          anchor = "def test_finalize_refuses_before_prospective_window_elapsed("
          if tests.count(anchor) != 1:
              raise SystemExit("expected one integrity-test insertion anchor")
          addition = '''def _rewrite_generation_manifest_field(
              generation_root: Path,
              *,
              field: str,
              value: object,
          ) -> None:
              manifest_path = generation_root / "manifest.json"
              payload = json.loads(manifest_path.read_text(encoding="utf-8"))
              payload[field] = value
              body = {
                  key: item
                  for key, item in payload.items()
                  if key not in {"schema_version", "manifest_sha256"}
              }
              payload["manifest_sha256"] = canonical_sha256(
                  {"schema_version": GENERATION_SCHEMA_VERSION, "payload": body}
              )
              manifest_path.write_text(canonical_json(payload) + "\\n", encoding="utf-8")
              digest = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
              index_path = generation_root / "artifact-sha256.txt"
              lines = [
                  f"{digest}  manifest.json"
                  if line.endswith("  manifest.json")
                  else line
                  for line in index_path.read_text(encoding="utf-8").splitlines()
              ]
              index_path.write_text("\\n".join(lines) + "\\n", encoding="utf-8")


          @pytest.mark.parametrize(
              ("field", "value", "message"),
              (
                  ("previous_manifest_sha256", "9" * 64, "generation chain identity"),
                  ("runtime_policy_sha256", "8" * 64, "runtime policy identity"),
                  ("observation_sha256", "7" * 64, "observation identity"),
              ),
          )
          def test_recovery_rejects_generation_manifest_identity_substitution(
              tmp_path: Path,
              field: str,
              value: object,
              message: str,
          ) -> None:
              root = (tmp_path / f"manifest-{field}").resolve()
              service = _service(root)
              service.step(_tick(START_MS + 1_000))
              service.step(_tick(START_MS + 2_000))
              generation_root = root / "generations" / "00000000000000000002"
              _rewrite_generation_manifest_field(
                  generation_root,
                  field=field,
                  value=value,
              )

              with pytest.raises(CandidatePaperRuntimeServiceError, match=message):
                  _service(root)


          '''
          tests = tests.replace(anchor, addition + anchor, 1)
          test_path.write_text(tests, encoding="utf-8")

      - name: Validate integrity hardening
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            ai_platform/wickhunter/candidate_paper_runtime_service.py
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py
          )
          ruff format "${paths[@]}"
          ruff check --fix "${paths[@]}"
          ruff format "${paths[@]}"
          ruff check "${paths[@]}"
          ruff format --check "${paths[@]}"
          mypy "${paths[@]}"
          pytest -q \
            tests/ai_platform_integration/test_wickhunter_paper_validation.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py

      - name: Commit validated hardening and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/tmp-wickhunter-paper-runtime-journal-integrity*.yml
          git add \
            ai_platform/wickhunter/candidate_paper_runtime_service.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py \
            .github/workflows
          if git diff --cached --quiet; then
            echo "No validated journal integrity changes were produced" >&2
            exit 1
          fi
          git commit -m "fix(wickhunter): harden paper runtime journal integrity"
          git push origin HEAD:feat/wickhunter-paper-runtime-journal-v1
