name: Temporary WickHunter paper runtime journal integrity hardening

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feat/wickhunter-paper-runtime-journal-v1
    paths:
      - ".tmp/wickhunter-paper-runtime-journal-integrity.md"

permissions:
  contents: write

concurrency:
  group: tmp-wickhunter-paper-runtime-journal-integrity
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/trigger-wickhunter-paper-runtime-journal-integrity'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/wickhunter-paper-runtime-journal-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Bind generation chain and manifest identities
        shell: python
        run: |
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label} anchor mismatch: {count}")
              return source.replace(old, new)

          service_path = Path(
              "ai_platform/wickhunter/candidate_paper_runtime_service.py"
          )
          service = service_path.read_text(encoding="utf-8")

          service = replace_once(
              service,
              "    def _verify_generation(  # noqa: C901\n"
              "        self,\n"
              "        generation_root: Path,\n"
              "    ) -> tuple[ShadowRuntimeState, PaperObservation, tuple[str, ...], str]:\n",
              "    def _verify_generation(  # noqa: C901\n"
              "        self,\n"
              "        generation_root: Path,\n"
              "        *,\n"
              "        expected_previous_manifest_sha256: str | None,\n"
              "    ) -> tuple[ShadowRuntimeState, PaperObservation, tuple[str, ...], str]:\n",
              "generation verifier signature",
          )

          service = replace_once(
              service,
              "        if manifest.get(\"run_id\") != self.binding.request.run_id:\n"
              "            raise CandidatePaperRuntimeServiceError(\"generation run mismatch\")\n\n"
              "        index_path = generation_root / CHECKSUM_NAME\n",
              "        if manifest.get(\"run_id\") != self.binding.request.run_id:\n"
              "            raise CandidatePaperRuntimeServiceError(\"generation run mismatch\")\n"
              "        if (\n"
              "            manifest.get(\"previous_manifest_sha256\")\n"
              "            != expected_previous_manifest_sha256\n"
              "        ):\n"
              "            raise CandidatePaperRuntimeServiceError(\n"
              "                \"generation chain identity mismatch\"\n"
              "            )\n"
              "        if (\n"
              "            manifest.get(\"runtime_policy_sha256\")\n"
              "            != self.runtime_policy.policy_sha256\n"
              "        ):\n"
              "            raise CandidatePaperRuntimeServiceError(\n"
              "                \"generation runtime policy identity mismatch\"\n"
              "            )\n\n"
              "        index_path = generation_root / CHECKSUM_NAME\n",
              "generation chain and policy checks",
          )

          service = replace_once(
              service,
              "        if observation.snapshot_id != manifest.get(\"snapshot_id\"):\n"
              "            raise CandidatePaperRuntimeServiceError(\n"
              "                \"generation snapshot identity mismatch\"\n"
              "            )\n"
              "        decision_payloads = _read_jsonl(\n",
              "        if observation.snapshot_id != manifest.get(\"snapshot_id\"):\n"
              "            raise CandidatePaperRuntimeServiceError(\n"
              "                \"generation snapshot identity mismatch\"\n"
              "            )\n"
              "        if manifest.get(\"observation_sha256\") != canonical_sha256(\n"
              "            observation\n"
              "        ):\n"
              "            raise CandidatePaperRuntimeServiceError(\n"
              "                \"generation observation identity mismatch\"\n"
              "            )\n"
              "        decision_payloads = _read_jsonl(\n",
              "observation identity check",
          )

          latest_old = '''    def latest_state(self) -> ShadowRuntimeState | None:
              paths = self._generation_paths()
              if not paths:
                  return None
              latest_state: ShadowRuntimeState | None = None
              latest_observation: PaperObservation | None = None
              latest_manifest = ""
              for path in paths:
                  latest_state, latest_observation, _decision_ids_value, latest_manifest = (
                      self._verify_generation(path)
                  )
              if latest_state is None or latest_observation is None:
                  raise CandidatePaperRuntimeServiceError("latest generation is unavailable")
              self._write_pointer(
                  generation=latest_state.generation,
                  manifest_sha256=latest_manifest,
                  runtime_state_sha256=latest_state.state_sha256,
                  snapshot_id=latest_observation.snapshot_id,
              )
              return latest_state
          '''
          latest_new = '''    def _verified_generations(
              self,
          ) -> tuple[
              tuple[ShadowRuntimeState, PaperObservation, tuple[str, ...], str], ...
          ]:
              verified: list[
                  tuple[ShadowRuntimeState, PaperObservation, tuple[str, ...], str]
              ] = []
              previous_manifest_sha256: str | None = None
              for path in self._generation_paths():
                  result = self._verify_generation(
                      path,
                      expected_previous_manifest_sha256=previous_manifest_sha256,
                  )
                  previous_manifest_sha256 = result[3]
                  verified.append(result)
              return tuple(verified)

              def latest_state(self) -> ShadowRuntimeState | None:
              verified = self._verified_generations()
              if not verified:
                  return None
              latest_state, latest_observation, _decision_ids_value, latest_manifest = (
                  verified[-1]
              )
              self._write_pointer(
                  generation=latest_state.generation,
                  manifest_sha256=latest_manifest,
                  runtime_state_sha256=latest_state.state_sha256,
                  snapshot_id=latest_observation.snapshot_id,
              )
              return latest_state
          '''
          # Correct indentation deliberately after constructing multiline replacement.
          latest_new = latest_new.replace("\n    def latest_state", "\n\n    def latest_state")
          latest_new = latest_new.replace("\n              def latest_state", "\n    def latest_state")
          if latest_old not in service:
              raise SystemExit("latest-state block anchor mismatch")
          service = service.replace(latest_old, latest_new, 1)

          service = replace_once(
              service,
              "        previous = self._generation_paths()\n"
              "        if generation != len(previous) + 1:\n",
              "        previous = self._verified_generations()\n"
              "        if generation != len(previous) + 1:\n",
              "commit previous generations",
          )
          service = replace_once(
              service,
              "            previous_manifest = (\n"
              "                None if not previous else self._verify_generation(previous[-1])[3]\n"
              "            )\n",
              "            previous_manifest = None if not previous else previous[-1][3]\n",
              "commit previous manifest",
          )
          service = replace_once(
              service,
              "        self._verify_generation(destination)\n",
              "        self._verify_generation(\n"
              "            destination,\n"
              "            expected_previous_manifest_sha256=previous_manifest,\n"
              "        )\n",
              "new generation verification",
          )
          service = replace_once(
              service,
              "    def observations(self) -> tuple[PaperObservation, ...]:\n"
              "        return tuple(\n"
              "            self._verify_generation(path)[1] for path in self._generation_paths()\n"
              "        )\n",
              "    def observations(self) -> tuple[PaperObservation, ...]:\n"
              "        return tuple(item[1] for item in self._verified_generations())\n",
              "observation chain verification",
          )

          service = replace_once(
              service,
              "        try:\n"
              "            result = self.runtime.step(bound_tick)\n"
              "            self.journal.commit(result)\n"
              "        except (ShadowRuntimeError, PaperValidationError, OSError, ValueError) as exc:\n"
              "            self.runtime.state = previous_state\n"
              "            if isinstance(exc, CandidatePaperRuntimeServiceError):\n"
              "                raise\n"
              "            raise CandidatePaperRuntimeServiceError(\n"
              "                \"candidate PAPER runtime step failed\"\n"
              "            ) from exc\n"
              "        except Exception:\n",
              "        try:\n"
              "            result = self.runtime.step(bound_tick)\n"
              "            self.journal.commit(result)\n"
              "        except CandidatePaperRuntimeServiceError:\n"
              "            self.runtime.state = previous_state\n"
              "            raise\n"
              "        except (ShadowRuntimeError, PaperValidationError, OSError, ValueError) as exc:\n"
              "            self.runtime.state = previous_state\n"
              "            raise CandidatePaperRuntimeServiceError(\n"
              "                \"candidate PAPER runtime step failed\"\n"
              "            ) from exc\n"
              "        except Exception:\n",
              "runtime service exception handling",
          )
          service_path.write_text(service, encoding="utf-8")

          test_path = Path(
              "tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              "from __future__ import annotations\n\n"
              "from decimal import Decimal\n",
              "from __future__ import annotations\n\n"
              "import hashlib\n"
              "import json\n"
              "from decimal import Decimal\n",
              "test imports",
          )
          tests = replace_once(
              tests,
              "    CandidatePaperRuntimeService,\n"
              "    CandidatePaperRuntimeServiceError,\n",
              "    GENERATION_SCHEMA_VERSION,\n"
              "    CandidatePaperRuntimeService,\n"
              "    CandidatePaperRuntimeServiceError,\n",
              "generation schema import",
          )
          tests = replace_once(
              tests,
              "from ai_platform.wickhunter.canonical import canonical_sha256\n",
              "from ai_platform.wickhunter.canonical import canonical_json, canonical_sha256\n",
              "canonical json import",
          )

          helper_anchor = '''def test_finalize_refuses_before_prospective_window_elapsed(tmp_path: Path) -> None:
          '''
          helper = '''def _rewrite_generation_manifest_field(
              generation_root: Path,
              *,
              field: str,
              value: object,
          ) -> None:
              manifest_path = generation_root / "manifest.json"
              payload = json.loads(manifest_path.read_text(encoding="utf-8"))
              payload[field] = value
              body = {
                  key: item
                  for key, item in payload.items()
                  if key not in {"schema_version", "manifest_sha256"}
              }
              payload["manifest_sha256"] = canonical_sha256(
                  {
                      "schema_version": GENERATION_SCHEMA_VERSION,
                      "payload": body,
                  }
              )
              manifest_path.write_text(canonical_json(payload) + "\n", encoding="utf-8")
              manifest_digest = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
              index_path = generation_root / "artifact-sha256.txt"
              lines = [
                  (
                      f"{manifest_digest}  manifest.json"
                      if line.endswith("  manifest.json")
                      else line
                  )
                  for line in index_path.read_text(encoding="utf-8").splitlines()
              ]
              index_path.write_text("\n".join(lines) + "\n", encoding="utf-8")


          @pytest.mark.parametrize(
              ("field", "value", "message"),
              (
                  ("previous_manifest_sha256", "9" * 64, "generation chain identity"),
                  ("runtime_policy_sha256", "8" * 64, "runtime policy identity"),
                  ("observation_sha256", "7" * 64, "observation identity"),
              ),
          )
          def test_recovery_rejects_generation_manifest_identity_substitution(
              tmp_path: Path,
              field: str,
              value: object,
              message: str,
          ) -> None:
              root = (tmp_path / f"manifest-{field}").resolve()
              service = _service(root)
              service.step(_tick(START_MS + 1_000))
              service.step(_tick(START_MS + 2_000))
              generation_root = root / "generations" / "00000000000000000002"
              _rewrite_generation_manifest_field(
                  generation_root,
                  field=field,
                  value=value,
              )

              with pytest.raises(CandidatePaperRuntimeServiceError, match=message):
                  _service(root)


          '''
          if tests.count(helper_anchor) != 1:
              raise SystemExit("integrity test insertion anchor mismatch")
          tests = tests.replace(helper_anchor, helper + helper_anchor, 1)
          test_path.write_text(tests, encoding="utf-8")

      - name: Validate integrity hardening
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            ai_platform/wickhunter/candidate_paper_runtime_service.py
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py
          )
          ruff format "${paths[@]}"
          ruff check --fix "${paths[@]}"
          ruff format "${paths[@]}"
          ruff check "${paths[@]}"
          ruff format --check "${paths[@]}"
          mypy "${paths[@]}"
          pytest -q \
            tests/ai_platform_integration/test_wickhunter_paper_validation.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py

      - name: Commit validated hardening and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-wickhunter-paper-runtime-journal-integrity.yml
          git add \
            ai_platform/wickhunter/candidate_paper_runtime_service.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wickhunter): verify paper runtime generation chain"
          git push origin HEAD:feat/wickhunter-paper-runtime-journal-v1
