name: WH-01 pre-commit diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/wh01-precommit-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Capture exact pre-commit result
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pre-commit
          report="docs/agents/tasks/FTAI-20260727-wickhunter-wh01-precommit-diagnostic.txt"
          set +e
          pre-commit run --all-files >"${report}" 2>&1
          result=$?
          set -e
          printf '\nexit_code=%s\n' "${result}" >>"${report}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${report}"
          git add \
            ai_platform/wickhunter/dataset.py \
            ai_platform/wickhunter/__init__.py \
            tests/ai_platform_integration/test_wickhunter_dataset_builder.py
          git commit -m "ci(wickhunter): capture WH-01 pre-commit diagnostic"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
