name: WH-01 mypy repair

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/wh01-precommit-diagnostic.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact mypy repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/ai_platform_integration/test_wickhunter_dataset_builder.py")
          content = path.read_text(encoding="utf-8")
          import_anchor = "from pathlib import Path\n"
          typed_import = "from pathlib import Path\nfrom typing import Any\n"
          if "from typing import Any\n" not in content:
              if import_anchor not in content:
                  raise SystemExit("missing pathlib import anchor")
              content = content.replace(import_anchor, typed_import, 1)
          target = "    rows = []\n"
          replacement = "    rows: list[dict[str, Any]] = []\n"
          if target not in content:
              raise SystemExit("missing rows annotation target")
          content = content.replace(target, replacement, 1)
          path.write_text(content, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ai_platform_integration/test_wickhunter_dataset_builder.py
          git commit -m "test(wickhunter): annotate dataset fixture rows"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
