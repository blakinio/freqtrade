name: WH-01 Ruff repair

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/wh01-ruff-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Apply and commit exact Ruff repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.21
          ruff check --fix \
            ai_platform/wickhunter/dataset.py \
            ai_platform/wickhunter/__init__.py \
            tests/ai_platform_integration/test_wickhunter_dataset_builder.py
          ruff format \
            ai_platform/wickhunter/dataset.py \
            ai_platform/wickhunter/__init__.py \
            tests/ai_platform_integration/test_wickhunter_dataset_builder.py
          if git diff --quiet; then
            echo "No Ruff changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/wickhunter/dataset.py \
            ai_platform/wickhunter/__init__.py \
            tests/ai_platform_integration/test_wickhunter_dataset_builder.py
          git commit -m "style(wickhunter): apply exact Ruff repair"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
