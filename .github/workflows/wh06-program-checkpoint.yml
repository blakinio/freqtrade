name: WH-06 program checkpoint

on:
  pull_request:
    paths:
      - ".github/workflows/wh06-program-checkpoint.yml"
      - "docs/agents/programs/FTAI_WICKHUNTER_LIQUIDATION_BOT_PROGRAM.md"

permissions:
  contents: write

jobs:
  update-program:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Update WH-06 program checkpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          path = Path("docs/agents/programs/FTAI_WICKHUNTER_LIQUIDATION_BOT_PROGRAM.md")
          content = path.read_text(encoding="utf-8")
          old_decision = "The current portal risk service is DB-backed and currently exposes a manual-intent application flow with a smaller risk snapshot than this program requires. WickHunter therefore starts with pure, fail-closed strategy-owned risk contracts and does not modify active portal/BM paths. WH-06 will add a reviewed adapter after the required portal contract owner confirms the integration seam."
          new_decision = "The current portal risk service is DB-backed and exposes a manual-intent application flow. WH-06 adds a reviewed WickHunter-owned fail-closed mapping into the canonical portal risk contracts while leaving that manual service and active portal/BM paths unchanged."
          old_section = """### WH-06 — Risk Engine and TradeIntent integration

Status: `not_started`

Depends on: WH-00, a frozen portal/BM integration seam and current path-ownership preflight.

Deliver a reviewed mapping to canonical portal risk authority, full required risk snapshot/adapters and deterministic persistence. It activates no submission adapter and changes no shared portal contract without delegation."""
          new_section = """### WH-06 — Risk Engine and TradeIntent integration

Status: `completed`

Depends on: WH-00, a frozen portal/BM integration seam and current path-ownership preflight.

Delivered by PR #588:

- fail-closed mapping from a locally allowed WickHunterTradeIntent into canonical portal TradeIntent and RiskEvaluationSnapshot;
- deterministic UUIDv5 identities and correlation context;
- conservative notional mapping including bounded total DCA risk;
- full projected exposure/open-position, daily-loss, drawdown and runtime-health snapshot mapping;
- strict research/shadow/paper environment policy with structural production refusal;
- canonical approved/rejected result identity and policy validation;
- atomic no-overwrite request/result/manifest evidence with exact hashes;
- no portal/BM contract mutation, manual-service invocation, execution adapter, order submission or live-capital authority."""

          if old_decision not in content or old_section not in content:
              if new_decision in content and new_section in content:
                  raise SystemExit(0)
              raise SystemExit("expected WH-06 program text was not found")

          updated = content.replace(old_decision, new_decision, 1).replace(old_section, new_section, 1)
          repository = os.environ["REPOSITORY"]
          branch = os.environ["HEAD_BRANCH"]
          token = os.environ["GH_TOKEN"]
          api_path = str(path)
          query = urllib.parse.urlencode({"ref": branch})
          url = f"https://api.github.com/repos/{repository}/contents/{api_path}?{query}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "wickhunter-wh06-checkpoint",
          }
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request) as response:
              current = json.load(response)

          payload = json.dumps(
              {
                  "message": "docs(wickhunter): complete WH-06 program package",
                  "content": base64.b64encode(updated.encode("utf-8")).decode("ascii"),
                  "sha": current["sha"],
                  "branch": branch,
              }
          ).encode("utf-8")
          put_request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/contents/{api_path}",
              data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(put_request) as response:
              result = json.load(response)
          print(result["commit"]["sha"])
          PY
