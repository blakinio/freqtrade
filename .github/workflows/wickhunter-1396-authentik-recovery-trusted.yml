name: WickHunter #1396 trusted Authentik recovery

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - "deploy/synology/portal-authentik/run-requests/issue1396-recovery-20260814.json"

permissions:
  contents: read

concurrency:
  group: wickhunter-1396-authentik-recovery
  cancel-in-progress: false

env:
  REQUEST_PATH: deploy/synology/portal-authentik/run-requests/issue1396-recovery-20260814.json
  IMPLEMENTATION_SHA: ${{ github.event.pull_request.base.sha }}
  AUTHENTIK_PROJECT: portal-authentik-local-test
  AUTHENTIK_ENV: /var/lib/freqtrade-staging-state/portal-authentik-local-test/runtime.env

jobs:
  recover:
    name: Trusted loopback repair and Authentik recovery
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 15
    steps:
      - name: Check out exact request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prove frozen data-only request
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" == "$IMPLEMENTATION_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" == "$BASE_SHA" ]]
          [[ "$(git diff --name-status "$BASE_SHA...$HEAD_SHA")" == $'A\tdeploy/synology/portal-authentik/run-requests/issue1396-recovery-20260814.json' ]]
          [[ "$RUNNER_NAME_VALUE" == "freqtrade-synology-staging" ]]
          python3 - "$REQUEST_PATH" <<'PY'
          import json,sys
          expected={
            'schema_version':1,
            'request_id':'wickhunter-1396-authentik-recovery-20260814',
            'target_environment':'synology-staging',
            'repair':'restore-authentik-loopback-invariant-only',
            'authentik_bind_address':'127.0.0.1',
            'trading_credentials_authorized':False,
            'live_capital_authorized':False,
            'mutation_authorized':True,
          }
          payload=json.load(open(sys.argv[1],encoding='utf-8'))
          if payload!=expected: raise SystemExit('frozen recovery request mismatch')
          PY
          docker version >/dev/null
          test -S /var/run/docker.sock
          for name in OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET BINANCE_SECRET_KEY EXCHANGE_API_KEY EXCHANGE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET; do
            [[ -z "${!name:-}" ]] || { echo "forbidden trading credential environment: $name" >&2; exit 1; }
          done

      - name: Check out exact protected product
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Repair only exact loopback invariant
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$IMPLEMENTATION_SHA" ]]
          [[ -f "$AUTHENTIK_ENV" && ! -L "$AUTHENTIK_ENV" ]]
          [[ "$(stat -c '%a' "$AUTHENTIK_ENV")" == "600" ]]
          set +e
          python3 deploy/synology/portal-authentik/validate.py --env-file "$AUTHENTIK_ENV" > "$RUNNER_TEMP/authentik-validation-before.json"
          validation_exit=$?
          set -e
          if [[ "$validation_exit" != "0" ]]; then
            python3 - "$RUNNER_TEMP/authentik-validation-before.json" "$AUTHENTIK_ENV" <<'PY'
          import json,os,stat,sys,tempfile
          from pathlib import Path
          report=json.load(open(sys.argv[1],encoding='utf-8'))
          if report.get('errors') != ['AUTHENTIK_BIND_ADDRESS must remain 127.0.0.1']:
              raise SystemExit('refusing to repair anything except exact loopback bind invariant')
          path=Path(sys.argv[2]); lines=path.read_text(encoding='utf-8').splitlines()
          matches=[i for i,line in enumerate(lines) if line.startswith('AUTHENTIK_BIND_ADDRESS=')]
          if len(matches)>1: raise SystemExit('duplicate AUTHENTIK_BIND_ADDRESS entries')
          if matches: lines[matches[0]]='AUTHENTIK_BIND_ADDRESS=127.0.0.1'
          else: lines.append('AUTHENTIK_BIND_ADDRESS=127.0.0.1')
          fd,tmp=tempfile.mkstemp(prefix='.runtime.env.',dir=path.parent)
          try:
              with os.fdopen(fd,'w',encoding='utf-8') as h:
                  h.write('\n'.join(lines)+'\n'); h.flush(); os.fsync(h.fileno())
              os.chmod(tmp,0o600); os.replace(tmp,path)
          finally:
              if os.path.exists(tmp): os.unlink(tmp)
          if stat.S_IMODE(path.stat().st_mode)!=0o600: raise SystemExit('runtime.env mode changed')
          print('repaired only AUTHENTIK_BIND_ADDRESS loopback invariant')
          PY
          fi
          python3 deploy/synology/portal-authentik/validate.py --env-file "$AUTHENTIK_ENV" > "$RUNNER_TEMP/authentik-validation-after.json"
          python3 - "$RUNNER_TEMP/authentik-validation-after.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          if p.get('valid') is not True or p.get('errors') not in ([],None): raise SystemExit('Authentik env still invalid')
          print('Authentik runtime.env validation PASS')
          PY
          docker compose --project-name "$AUTHENTIK_PROJECT" --env-file "$AUTHENTIK_ENV" -f deploy/synology/portal-authentik/compose.yml config --quiet

      - name: Recover and prove protected Authentik services
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --project-name "$AUTHENTIK_PROJECT" --env-file "$AUTHENTIK_ENV" -f deploy/synology/portal-authentik/compose.yml)
          "${compose[@]}" ps -a --format json > "$RUNNER_TEMP/authentik-before.json"
          "${compose[@]}" up -d postgresql server worker
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            ok=1
            for service in postgresql server worker; do
              id="$("${compose[@]}" ps -q "$service")"
              [[ -n "$id" ]] || { ok=0; break; }
              [[ "$(docker inspect --format '{{.State.Running}}' "$id")" == "true" ]] || { ok=0; break; }
              [[ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$id")" == "healthy" ]] || { ok=0; break; }
            done
            (( ok == 1 )) && break
            sleep 10
          done
          for service in postgresql server worker; do
            id="$("${compose[@]}" ps -q "$service")"; [[ -n "$id" ]]
            [[ "$(docker inspect --format '{{.State.Running}}' "$id")" == "true" ]]
            [[ "$(docker inspect --format '{{.State.Health.Status}}' "$id")" == "healthy" ]]
          done
          "${compose[@]}" exec -T server ak healthcheck
          "${compose[@]}" exec -T worker ak healthcheck
          "${compose[@]}" exec -T worker ak dump_config >/dev/null
          "${compose[@]}" ps --format json > "$RUNNER_TEMP/authentik-after.json"
          server="$("${compose[@]}" ps -q server)"; postgresql="$("${compose[@]}" ps -q postgresql)"
          postgres_bindings="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$postgresql")"
          [[ "$postgres_bindings" == "{}" || "$postgres_bindings" == "null" ]]
          python3 - "$server" <<'PY'
          import json,subprocess,sys
          p=json.loads(subprocess.check_output(['docker','inspect',sys.argv[1]],text=True))[0]
          bindings=(p.get('HostConfig') or {}).get('PortBindings') or {}; rows=bindings.get('9000/tcp') or []
          if len(rows)!=1 or rows[0].get('HostIp') not in {'127.0.0.1','::1'}: raise SystemExit('Authentik server not loopback-only')
          if '5432/tcp' in bindings: raise SystemExit('database port unexpectedly published')
          print('Authentik exposure boundaries PASS')
          PY
          python3 deploy/synology/portal-oidc/prepare_host_state.py --repository "$GITHUB_WORKSPACE"

      - name: Cleanup exact host-preparation helper
        if: always()
        shell: bash
        run: |
          docker rm -f "portal-prepare-host-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true

      - name: Upload bounded secret-free recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue1396-authentik-recovery-trusted-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/authentik-validation-before.json
            ${{ runner.temp }}/authentik-validation-after.json
            ${{ runner.temp }}/authentik-before.json
            ${{ runner.temp }}/authentik-after.json
