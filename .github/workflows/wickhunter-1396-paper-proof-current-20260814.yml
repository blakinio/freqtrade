name: WickHunter #1396 current-base PAPER proof

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-1396-paper-proof-current-20260814.yml"

permissions:
  contents: read

concurrency:
  group: wickhunter-1396-paper-proof-current-20260814
  cancel-in-progress: false

env:
  EXPECTED_BASE_SHA: a51106eb0003910b393dd876ab68f3877eef16dc
  IMPLEMENTATION_SHA: a51106eb0003910b393dd876ab68f3877eef16dc
  CANDIDATE_PACKAGE_NAME: wickhunter-wh09-candidate-materialization-20260808-r1-h900s-7b23a958fd4d
  EXPECTED_CANDIDATE_MANIFEST_SHA256: 9f5ba852e33915678ca085c2eeafbf526457a079ba8f6f2fb7c1097f1d20ab79
  RUNNER_STATE_ROOT: /var/lib/freqtrade-staging-state
  HOST_STATE_ROOT: /volume1/docker/freqtrade/state
  LIQUID20_LIVE_HOST: /volume1/docker/freqtrade-liquidations/data/live
  PAPER_IMAGE: local/wickhunter-paper-runtime:sha-a51106eb0003-issue1396-current

jobs:
  proof:
    name: Exact-current healthy 5/5 PAPER proof
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    timeout-minutes: 45
    steps:
      - name: Check out exact request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prove bounded request and zero trading authority
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" == "$BASE_SHA" ]]
          [[ "$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")" == $'A\t.github/workflows/wickhunter-1396-paper-proof-current-20260814.yml' ]]
          [[ "$RUNNER_NAME_VALUE" == "freqtrade-synology-staging" ]]
          docker version >/dev/null
          test -S /var/run/docker.sock
          for name in OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET BINANCE_SECRET_KEY EXCHANGE_API_KEY EXCHANGE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET; do
            [[ -z "${!name:-}" ]] || { echo "forbidden trading credential: $name" >&2; exit 1; }
          done
          [[ "$(docker inspect --format '{{.State.Running}}' liquid20-live)" == "true" ]]
          [[ "$(docker inspect --format '{{.State.OOMKilled}}' liquid20-live)" == "false" ]]

      - name: Check out exact protected product
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: a51106eb0003910b393dd876ab68f3877eef16dc

      - name: Build exact current PAPER image and preflight Liquid20
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$IMPLEMENTATION_SHA" ]]
          docker image rm -f "$PAPER_IMAGE" >/dev/null 2>&1 || true
          docker build --pull --file deploy/synology/wickhunter-paper-runtime/Dockerfile \
            --build-arg "OPERATOR_COMMIT=$IMPLEMENTATION_SHA" \
            --label "org.opencontainers.image.revision=$IMPLEMENTATION_SHA" \
            --tag "$PAPER_IMAGE" .
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$PAPER_IMAGE")" == "$IMPLEMENTATION_SHA" ]]
          [[ "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$PAPER_IMAGE")" == '["python","-m","ai_platform.wickhunter.candidate_paper_runtime_parity_supervisor"]' ]]
          image_id="$(docker image inspect --format '{{.Id}}' "$PAPER_IMAGE")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "PAPER_IMAGE_DIGEST=${image_id#sha256:}" >> "$GITHUB_ENV"
          reader_gid="$(docker run --rm --read-only --entrypoint stat --mount "type=bind,src=$LIQUID20_LIVE_HOST,dst=/runtime/liquid20,readonly" "$PAPER_IMAGE" -c %g /runtime/liquid20)"
          [[ "$reader_gid" =~ ^[0-9]+$ ]]
          echo "LIQUID20_READER_GID=$reader_gid" >> "$GITHUB_ENV"
          docker run --rm --interactive --user 65532:65532 --group-add "$reader_gid" --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=bind,src=$LIQUID20_LIVE_HOST,dst=/runtime/liquid20,readonly" --entrypoint python "$PAPER_IMAGE" - <<'PY' | tee "$RUNNER_TEMP/issue1396-current-liquid20.json"
          import json,time
          from pathlib import Path
          from ai_platform.wickhunter.candidate_paper_runtime_operator import load_liquid20_snapshot
          now=time.time_ns()//1_000_000;s=load_liquid20_snapshot(Path('/runtime/liquid20'),now_ms=now,maximum_age_ms=300000)
          rows=[{'source':x.source,'health':x.health.value,'coverage_available':x.coverage_available,'age_ms':None if x.last_received_at_ms is None else now-x.last_received_at_ms} for x in s.source_states]
          expected=['binance-usdm','bybit-linear','okx-swap']
          if sorted(x['source'] for x in rows)!=expected or any(x['health']!='healthy' or x['coverage_available'] is not True or x['age_ms'] is None or x['age_ms']>300000 for x in rows): raise SystemExit('Liquid20 not 3/3 healthy')
          print(json.dumps({'result':'PASS','snapshot_id':s.snapshot_id,'sources':rows},sort_keys=True))
          PY

      - name: Create activation and initialized journal
        shell: bash
        run: |
          set -euo pipefail
          umask 027
          state_name="issue1396-current-proof-${GITHUB_RUN_ID}"
          activation_name="wickhunter-current-proof-${GITHUB_RUN_ID}"
          candidate_runner="$RUNNER_STATE_ROOT/wickhunter-candidate-materialization/packages/$CANDIDATE_PACKAGE_NAME"
          candidate_host="$HOST_STATE_ROOT/wickhunter-candidate-materialization/packages/$CANDIDATE_PACKAGE_NAME"
          state_runner="$RUNNER_STATE_ROOT/wickhunter-paper-runtime/$state_name"
          state_host="$HOST_STATE_ROOT/wickhunter-paper-runtime/$state_name"
          [[ -d "$candidate_runner" && ! -L "$candidate_runner" && ! -e "$state_runner" ]]
          install -d -m 0750 -o 65532 -g 65532 "$state_runner" "$state_runner/activations" "$state_runner/journals" "$state_runner/operator" "$state_runner/operator/$activation_name"
          docker run --rm --interactive --user 65532:65532 --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=bind,src=$candidate_host,dst=/runtime/candidate,readonly" --mount "type=bind,src=$state_host,dst=/runtime/state" \
            --env "ACTIVATION_NAME=$activation_name" --env EXPECTED_CANDIDATE_MANIFEST_SHA256 --entrypoint python "$PAPER_IMAGE" - <<'PY' | tee "$RUNNER_TEMP/issue1396-current-activation.json"
          import json,os,time
          from pathlib import Path
          from ai_platform.wickhunter.candidate_paper_runtime_operator import _runtime_policy
          from ai_platform.wickhunter.candidate_paper_runtime_service import CandidatePaperRuntimeService
          from ai_platform.wickhunter.candidate_runtime_activation import activate_verified_runtime_candidate
          from ai_platform.wickhunter.candidate_runtime_binding import build_candidate_paper_runtime_binding
          from ai_platform.wickhunter.canonical import canonical_sha256
          from ai_platform.wickhunter.contracts import BotMode
          from ai_platform.wickhunter.runtime_mode import ManagedRuntimeModeRequest,resolve_managed_runtime_mode
          root=Path('/runtime/state');name=os.environ['ACTIVATION_NAME'];activation=root/'activations'/name;journal=root/'journals'/name
          result=activate_verified_runtime_candidate(candidate_root=Path('/runtime/candidate'),activation_root=activation,created_at_ms=time.time_ns()//1_000_000,bot_instance='wickhunter-issue1396-current-proof',mode=BotMode.PAPER,wh08_consumer_version='wickhunter-portal-consumer-v1',window_duration_ms=90_000_000)
          if result.identity.manifest_sha256!=os.environ['EXPECTED_CANDIDATE_MANIFEST_SHA256']: raise SystemExit('candidate manifest mismatch')
          binding=build_candidate_paper_runtime_binding(candidate_root=Path('/runtime/candidate'),activation_root=activation)
          service=CandidatePaperRuntimeService(binding=binding,runtime_policy=_runtime_policy(),journal_root=journal)
          if service.journal.latest_state() is not None: raise SystemExit('journal not empty')
          auth={'schema_version':'issue1396-current-proof-v1','authorization_id':'issue1396-current-proof','run_id':binding.request.run_id,'binding_id':binding.binding_id,'candidate_package_id':result.identity.package_id,'candidate_manifest_sha256':result.identity.manifest_sha256,'execution_enabled':False,'live_capital_authorized':False}
          digest=canonical_sha256(auth);r=resolve_managed_runtime_mode(ManagedRuntimeModeRequest(mode=BotMode.PAPER,paper_activation_authorized=True,paper_authorization_id=auth['authorization_id'],paper_authorization_digest=digest,paper_candidate_package_id=result.identity.package_id,paper_candidate_manifest_sha256=result.identity.manifest_sha256))
          zero={'automatic_promotion_enabled':r.automatic_promotion_enabled,'trading_credentials_present':r.trading_credentials_present,'order_adapter_present':r.order_adapter_present,'execution_enabled':r.execution_enabled,'orders_submitted':r.orders_submitted,'live_capital_authorized':r.live_capital_authorized}
          if zero!={'automatic_promotion_enabled':False,'trading_credentials_present':False,'order_adapter_present':False,'execution_enabled':False,'orders_submitted':0,'live_capital_authorized':False}: raise SystemExit('authority mismatch')
          print(json.dumps({'run_id':binding.request.run_id,'binding_id':binding.binding_id,'candidate_package_id':result.identity.package_id,'candidate_manifest_sha256':result.identity.manifest_sha256,'authorization_digest':digest,**zero},sort_keys=True))
          PY
          activation_runner="$state_runner/activations/$activation_name";journal_runner="$state_runner/journals/$activation_name";operator_runner="$state_runner/operator/$activation_name"
          find "$activation_runner" -type d -exec chmod 0550 {} +;find "$activation_runner" -type f -exec chmod 0440 {} +
          find "$journal_runner" -type d -exec chmod 0750 {} +;find "$journal_runner" -type f -exec chmod 0640 {} +;chown -R 65532:65532 "$journal_runner" "$operator_runner"
          echo "PROOF_STATE_RUNNER=$state_runner" >> "$GITHUB_ENV";echo "PROOF_ACTIVATION_HOST=$state_host/activations/$activation_name" >> "$GITHUB_ENV";echo "PROOF_JOURNAL_HOST=$state_host/journals/$activation_name" >> "$GITHUB_ENV";echo "PROOF_OPERATOR_HOST=$state_host/operator/$activation_name" >> "$GITHUB_ENV"

      - name: Start constrained gateway and run five natural cycles
        shell: bash
        run: |
          set -euo pipefail
          network="issue1396-current-net-${GITHUB_RUN_ID}";gateway="issue1396-current-egress-${GITHUB_RUN_ID}";operator="issue1396-current-runtime-${GITHUB_RUN_ID}"
          echo "PROOF_NETWORK=$network" >> "$GITHUB_ENV";echo "PROOF_GATEWAY=$gateway" >> "$GITHUB_ENV";echo "PROOF_OPERATOR=$operator" >> "$GITHUB_ENV"
          docker network create --internal "$network" >/dev/null
          gateway_code="$(cat <<'PY'
          import socket,socketserver,threading
          TARGET=('fapi.binance.com',443)
          class S(socketserver.ThreadingMixIn,socketserver.TCPServer):daemon_threads=True;allow_reuse_address=True
          class H(socketserver.BaseRequestHandler):
              def handle(self):
                  r=socket.create_connection(TARGET,timeout=15)
                  def p(a,b):
                      try:
                          while True:
                              c=a.recv(65536)
                              if not c:return
                              b.sendall(c)
                      except OSError:return
                  t=threading.Thread(target=p,args=(self.request,r),daemon=True);t.start();p(r,self.request);t.join(timeout=5);r.close()
          S(('0.0.0.0',443),H).serve_forever()
          PY
          )"
          docker create --name "$gateway" --init --user 0:0 --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges:true --memory 256m --network bridge --entrypoint python "$PAPER_IMAGE" -c "$gateway_code" >/dev/null
          docker network connect "$network" "$gateway";docker start "$gateway" >/dev/null;sleep 2
          ip="$(docker inspect --format "{{with index .NetworkSettings.Networks \"$network\"}}{{.IPAddress}}{{end}}" "$gateway")";[[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker run --rm --read-only --network "$network" --add-host "fapi.binance.com:$ip" --cap-drop ALL --security-opt no-new-privileges:true --entrypoint python "$PAPER_IMAGE" -c "import socket;s=socket.socket();s.settimeout(2);r=s.connect_ex(('1.1.1.1',443));s.close();assert r!=0"
          candidate_host="$HOST_STATE_ROOT/wickhunter-candidate-materialization/packages/$CANDIDATE_PACKAGE_NAME"
          docker run --name "$operator" --user 65532:65532 --group-add "$LIQUID20_READER_GID" --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true --memory 2g --network "$network" --add-host "fapi.binance.com:$ip" \
            --env "OPERATOR_COMMIT=$IMPLEMENTATION_SHA" --env HEALTH_PATH=/runtime/operator/health.json --env HEALTH_MAX_AGE_SECONDS=1200 --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= --env http_proxy= --env https_proxy= --env all_proxy= \
            --mount "type=bind,src=$candidate_host,dst=/runtime/candidate,readonly" --mount "type=bind,src=$PROOF_ACTIVATION_HOST,dst=/runtime/activation,readonly" --mount "type=bind,src=$LIQUID20_LIVE_HOST,dst=/runtime/liquid20,readonly" --mount "type=bind,src=$PROOF_JOURNAL_HOST,dst=/runtime/journal" --mount "type=bind,src=$PROOF_OPERATOR_HOST,dst=/runtime/operator" \
            "$PAPER_IMAGE" --candidate-root /runtime/candidate --activation-root /runtime/activation --journal-root /runtime/journal --liquid20-root /runtime/liquid20 --health-root /runtime/operator --operator-commit "$IMPLEMENTATION_SHA" --public-market-base-url https://fapi.binance.com --poll-seconds 120 --maximum-source-age-ms 300000 --model-drift healthy --data-drift healthy --circuit-breaker-active false --cycles 5

      - name: Verify genuine 5/5 health and authority
        shell: bash
        run: |
          set -euo pipefail
          candidate_host="$HOST_STATE_ROOT/wickhunter-candidate-materialization/packages/$CANDIDATE_PACKAGE_NAME"
          docker run --rm --interactive --user 65532:65532 --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true --mount "type=bind,src=$candidate_host,dst=/runtime/candidate,readonly" --mount "type=bind,src=$PROOF_ACTIVATION_HOST,dst=/runtime/activation,readonly" --mount "type=bind,src=$PROOF_JOURNAL_HOST,dst=/runtime/journal,readonly" --mount "type=bind,src=$PROOF_OPERATOR_HOST,dst=/runtime/operator,readonly" --env "OPERATOR_COMMIT=$IMPLEMENTATION_SHA" --env "PAPER_IMAGE_DIGEST=$PAPER_IMAGE_DIGEST" --entrypoint python "$PAPER_IMAGE" - <<'PY' | tee "$RUNNER_TEMP/issue1396-current-proof.json"
          import json,os
          from decimal import Decimal
          from pathlib import Path
          from ai_platform.wickhunter.candidate_paper_runtime_operator import _runtime_policy
          from ai_platform.wickhunter.candidate_paper_runtime_service import CandidatePaperRuntimeJournal
          from ai_platform.wickhunter.candidate_paper_runtime_supervisor import CycleTelemetryStore
          from ai_platform.wickhunter.candidate_runtime_binding import build_candidate_paper_runtime_binding
          binding=build_candidate_paper_runtime_binding(candidate_root=Path('/runtime/candidate'),activation_root=Path('/runtime/activation'));journal=CandidatePaperRuntimeJournal(Path('/runtime/journal'),binding,_runtime_policy());obs=journal.observations();tele=CycleTelemetryStore(path=Path('/runtime/operator/cycle-telemetry.json'),binding_id=binding.binding_id,run_id=binding.request.run_id,operator_commit=os.environ['OPERATOR_COMMIT'])._load_verified();records=tele.get('records')
          if len(obs)!=5 or not isinstance(records,list) or len(records)!=5 or tele.get('last_sequence')!=5 or any(r.get('outcome')!='success' for r in records): raise SystemExit('not exact 5/5')
          expected=['binance-usdm','bybit-linear','okx-swap'];gens=[]
          for g in range(1,6):
              s=json.loads((Path('/runtime/journal/generations')/f'{g:020d}'/'runtime'/'portal-observability-snapshot.json').read_text())
              src=s.get('source_freshness');
              if s.get('health')!='healthy' or s.get('circuit_breaker_active') is not False or s.get('circuit_breaker_reasons')!=[] or not isinstance(src,list) or sorted(x.get('source') for x in src)!=expected or any(x.get('health')!='healthy' or x.get('fresh') is not True or not isinstance(x.get('age_ms'),int) or x['age_ms']>300000 for x in src): raise SystemExit(f'generation {g} unhealthy')
              gens.append({'generation':g,'sources':[{'source':x['source'],'age_ms':x['age_ms']} for x in src]})
          samples=sum(x.source_count for x in obs);fresh=sum(x.fresh_source_count for x in obs);ratio=Decimal(fresh)/Decimal(samples)
          health=json.loads(Path('/runtime/operator/health.json').read_text());zero={'protected_holdout_accessed':False,'automatic_promotion_enabled':False,'trading_credentials_present':False,'order_adapter_present':False,'execution_enabled':False,'orders_submitted':0,'live_capital_authorized':False}
          if ratio<Decimal('0.99') or health.get('status')!='healthy' or health.get('runtime_health')!='healthy' or health.get('circuit_breaker_active') is not False or health.get('circuit_breaker_reasons')!=[]: raise SystemExit('final health failed')
          for k,v in zero.items():
              if health.get(k)!=v or any(r.get(k)!=v for r in records): raise SystemExit(f'authority mismatch {k}')
          print(json.dumps({'result':'PASS','implementation_sha':os.environ['OPERATOR_COMMIT'],'image_digest':os.environ['PAPER_IMAGE_DIGEST'],'observation_count':5,'telemetry_record_count':5,'successful_outcomes':5,'fresh_source_ratio':str(ratio),'runtime_health':'healthy','generation_health':gens,'run_id':binding.request.run_id,'binding_id':binding.binding_id,**zero},sort_keys=True))
          PY
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true --mount "type=bind,src=$PROOF_OPERATOR_HOST,dst=/runtime/operator,readonly" --env HEALTH_PATH=/runtime/operator/health.json --env "OPERATOR_COMMIT=$IMPLEMENTATION_SHA" --env HEALTH_MAX_AGE_SECONDS=1200 --entrypoint python "$PAPER_IMAGE" /app/deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue1396-paper-proof-current-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/issue1396-current-liquid20.json
            ${{ runner.temp }}/issue1396-current-activation.json
            ${{ runner.temp }}/issue1396-current-proof.json

      - name: Cleanup disposable proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f "${PROOF_OPERATOR:-missing}" "${PROOF_GATEWAY:-missing}" >/dev/null 2>&1 || true
          [[ -z "${PROOF_NETWORK:-}" ]] || docker network rm "$PROOF_NETWORK" >/dev/null 2>&1 || true
          if [[ -n "${PROOF_STATE_RUNNER:-}" && -e "$PROOF_STATE_RUNNER" ]]; then
            case "$PROOF_STATE_RUNNER" in "$RUNNER_STATE_ROOT"/wickhunter-paper-runtime/issue1396-current-proof-*) ;; *) exit 1 ;; esac
            rm -rf --one-file-system "$PROOF_STATE_RUNNER"
          fi
