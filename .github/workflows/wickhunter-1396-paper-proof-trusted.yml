          if c.get('User')!='10001:10001' or h.get('ReadonlyRootfs') is not True or h.get('Privileged') is not False or 'ALL' not in (h.get('CapDrop') or []) or not any('no-new-privileges' in x for x in (h.get('SecurityOpt') or [])) or 'portal_oidc_public' not in nets or 'ai_platform.portal.control_plane.wh09_runtime_observer' not in cmd: raise SystemExit('legacy observer ownership not proven')
          PY
