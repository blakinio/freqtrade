          path,paper,old,network,observer=sys.argv[1:]; pathlib.Path(path).write_text(json.dumps({'result':'PASS','paper_runtime_preserved':paper,'old_shadow_removed':old,'old_shadow_network_removed':network=='true','legacy_observer':observer},sort_keys=True)+'\n',encoding='utf-8')
          PY

