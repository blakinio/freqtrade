          done
          python3 - "$REQUEST_PATH" "$BASE_SHA" "$GITHUB_ENV" "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8')); base=sys.argv[2]
          expected={'schema_version':1,'request_id':'wickhunter-1396-terminal-transition-20260815','implementation_sha':base,'target_environment':'synology-staging','paper_only':True,'canonical_mutation_authorized':True,'portal_deploy_authorized':True,'restart_acceptance_authorized':True,'browser_acceptance_required':True,'trading_credentials_authorized':False,'live_capital_authorized':False,'automatic_promotion_authorized':False}
          for k,v in expected.items():
              if p.get(k)!=v: raise SystemExit(f'transition request mismatch: {k}')
          required=set(expected)|{'proof_run_id','proof_artifact_id','proof_artifact_digest','proof_run_head_sha','proof_paper_image_digest'}
          if set(p)!=required: raise SystemExit('transition request field set mismatch')
          if p['proof_run_head_sha']!=base: raise SystemExit('proof is not exact-current')
          if not isinstance(p['proof_run_id'],int) or p['proof_run_id']<=0 or not isinstance(p['proof_artifact_id'],int) or p['proof_artifact_id']<=0: raise SystemExit('proof ids invalid')
          for k in ('proof_artifact_digest','proof_paper_image_digest'):
              if re.fullmatch(r'[0-9a-f]{64}',p[k]) is None: raise SystemExit(f'{k} invalid')
          exports={'IMPLEMENTATION_SHA':base,'PROOF_RUN_ID':str(p['proof_run_id']),'PROOF_ARTIFACT_ID':str(p['proof_artifact_id']),'PROOF_ARTIFACT_DIGEST':p['proof_artifact_digest'],'PROOF_RUN_HEAD_SHA':p['proof_run_head_sha'],'PROOF_PAPER_IMAGE_DIGEST':p['proof_paper_image_digest']}
          with open(sys.argv[3],'a',encoding='utf-8') as h:
              for k,v in exports.items(): h.write(f'{k}={v}\n')
          with open(sys.argv[4],'a',encoding='utf-8') as h: h.write(f'implementation_sha={base}\n')
          PY

      - name: Check out exact protected implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
