        with:
          name: issue1396-paper-browser-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/issue1396-closeout.json
            ai_platform/portal/web/artifacts/issue1396-paper-browser.json

      - name: Cleanup browser resources
        if: always()
