      EXPECTED_OBSERVED_GENERATION: ${{ needs.transition.outputs.observed_generation_id }}
    steps:
      - name: Check out exact protected implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.transition.outputs.implementation_sha }}

      - name: Serve captured real canonical production truth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s' "$CLOSEOUT_B64" | base64 --decode > artifacts/issue1396-closeout.json
          python3 - artifacts/issue1396-closeout.json "$EXPECTED_DESIRED_GENERATION" "$EXPECTED_OBSERVED_GENERATION" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8')); t=p['api']['truth']
          if p.get('result')!='PASS' or sys.argv[2]!=sys.argv[3] or t['desired_generation']['generation_id']!=sys.argv[2] or t['observed_generation']['generation_id']!=sys.argv[3] or t['desired_generation']['managed_mode']!='paper' or t['observed_generation']['managed_mode']!='paper' or t['pending_rollout'] is not False: raise SystemExit('captured canonical PAPER truth mismatch')
          PY
          cat > "$RUNNER_TEMP/issue1396-api.py" <<'PY'
          import json,sys
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  path=self.path.split('?',1)[0]
                  if path=='/v1/bots': obj=p['api']['bots']; code=200
                  elif path=='/v1/bots/wickhunter/runtime-truth': obj=p['api']['truth']; code=200
                  elif path=='/v1/runtime-evidence': obj={'source_statuses':[]}; code=200
                  elif path in {'/v1/performance','/v1/valuations','/v1/risk-events','/v1/audit-events'}: obj=[]; code=200
                  else: obj={'detail':'not found'}; code=404
                  body=json.dumps(obj,separators=(',',':')).encode(); self.send_response(code); self.send_header('content-type','application/json'); self.send_header('content-length',str(len(body))); self.end_headers(); self.wfile.write(body)
              def log_message(self,*_args): return
          ThreadingHTTPServer(('127.0.0.1',8000),H).serve_forever()
          PY
          python3 "$RUNNER_TEMP/issue1396-api.py" artifacts/issue1396-closeout.json &
          echo "API_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8000/v1/bots >/dev/null && break; sleep 1; done

      - name: Build exact API-mode Portal web
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false --label "org.opencontainers.image.revision=$IMPLEMENTATION_SHA" --file deploy/synology/portal/Dockerfile --tag "issue1396-portal-web:$IMPLEMENTATION_SHA" ai_platform/portal/web
          web="issue1396-paper-browser-${GITHUB_RUN_ID}"; echo "WEB_CONTAINER=$web" >> "$GITHUB_ENV"
          docker run --detach --name "$web" --network host --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m --tmpfs /app/.next/cache:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000 --cap-drop ALL --security-opt no-new-privileges:true --env PORTAL_WEB_DATA_MODE=api --env PORTAL_ENVIRONMENT=production --env PORTAL_IDENTITY_FIXTURE_MODE=disabled --env PORTAL_IDENTITY_TRANSPORT_MODE=https --env PORTAL_IDENTITY_ISSUER=https://issuer.example/application/o/portal/ --env PORTAL_CONTROL_PLANE_URL=http://127.0.0.1:8000 --env PORTAL_LIQUIDATIONS_DATA_ROOT=/tmp/no-liquidations "issue1396-portal-web:$IMPLEMENTATION_SHA"
          for _ in $(seq 1 60); do h="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$web")"; [[ "$h" == "healthy" ]] && break; [[ "$h" =~ ^(unhealthy|exited|dead)$ ]] && exit 1; sleep 2; done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$web")" == "healthy" ]]

      - name: Run real Chromium PAPER journey
        working-directory: ai_platform/portal/web
        shell: bash
        env:
          WICKHUNTER_EXPECTED_MODE: paper
          WICKHUNTER_EXPECTED_DESIRED_GENERATION: ${{ needs.transition.outputs.desired_generation_id }}
          WICKHUNTER_EXPECTED_OBSERVED_GENERATION: ${{ needs.transition.outputs.observed_generation_id }}
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/browser.key" -out "$RUNNER_TEMP/browser.crt" -days 1 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1" >/dev/null 2>&1
          cat > "$RUNNER_TEMP/proxy.mjs" <<'JS'
          import fs from 'node:fs';import http from 'node:http';import https from 'node:https';const [key,cert]=process.argv.slice(2);https.createServer({key:fs.readFileSync(key),cert:fs.readFileSync(cert)},(req,res)=>{const u=http.request({hostname:'127.0.0.1',port:3000,path:req.url,method:req.method,headers:{...req.headers,host:'127.0.0.1:3000'}},r=>{res.writeHead(r.statusCode??502,r.headers);r.pipe(res)});u.on('error',()=>{res.writeHead(502);res.end()});req.pipe(u)}).listen(3443,'127.0.0.1');
          JS
          node "$RUNNER_TEMP/proxy.mjs" "$RUNNER_TEMP/browser.key" "$RUNNER_TEMP/browser.crt" & proxy=$!; trap 'kill "$proxy" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do curl --insecure --fail --silent https://127.0.0.1:3443/bots >/dev/null && break; sleep 1; done
          node e2e/wickhunter-api-mode-ci.mjs
