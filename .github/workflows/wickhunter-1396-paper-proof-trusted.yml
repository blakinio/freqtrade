        with:
          name: issue1396-terminal-transition-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/issue1396-terminal-transition/

  browser:
    name: Real Chromium PAPER projection from canonical truth
    needs: transition
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
