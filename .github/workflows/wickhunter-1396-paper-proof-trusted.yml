        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s' "$CLOSEOUT_B64" | base64 --decode > artifacts/closeout.json
          python3 - artifacts/closeout.json "$IMPLEMENTATION_SHA" "$DESIRED_GENERATION" "$OBSERVED_GENERATION" "$PAPER_CONTAINER_ID" "$OLD_SHADOW_CONTAINER_ID" "$PAPER_IMAGE_DIGEST" "$PAPER_CONFIG_DIGEST" <<'PY' > artifacts/audit.json
          import json,re,sys
          p=json.load(open(sys.argv[1],encoding='utf-8')); sha,d,o,paper,old,image,config=sys.argv[2:]; findings=[]; t=p.get('api',{}).get('truth',{}); dg=t.get('desired_generation',{}); og=t.get('observed_generation',{}); proof=p.get('five_cycle_proof',{}); health=p.get('paper_health',{}); restart=p.get('restart',{}); activation=p.get('activation',{}); gateway=p.get('gateway',{})
          def req(x,c):
              if not x: findings.append(c)
          req(p.get('result')=='PASS','closeout'); req(p.get('implementation_sha')==sha,'sha'); req(d==o==dg.get('generation_id')==og.get('generation_id'),'generation'); req(dg.get('managed_mode')=='paper' and og.get('managed_mode')=='paper' and t.get('pending_rollout') is False,'mode'); req(proof.get('observation_count')==5 and proof.get('telemetry_record_count')==5 and proof.get('successful_outcomes')==5 and float(proof.get('fresh_source_ratio',0))>=.99,'5x'); req(health.get('status')=='healthy' and health.get('runtime_health')=='healthy' and health.get('operator_commit')==sha,'health'); req(restart.get('result')=='PASS' and restart.get('same_runtime_instance') is True and restart.get('runtime_instance_id')==paper and restart.get('paper_image_digest')==image and restart.get('paper_config_digest')==config and restart.get('after_generation',0)>restart.get('before_generation',0),'restart'); req(activation.get('candidate_manifest_sha256')=='9f5ba852e33915678ca085c2eeafbf526457a079ba8f6f2fb7c1097f1d20ab79','candidate'); req(all(re.fullmatch(r'[0-9a-f]{64}',str(gateway.get(k,''))) for k in ('gateway_artifact_digest','gateway_contract_digest','market_egress_policy_digest')),'gateway'); req(p.get('physical',{}).get('paper_container_id')==paper and p.get('physical',{}).get('old_shadow_container_id')==old,'physical')
          zero={'protected_holdout_accessed':False,'automatic_promotion_enabled':False,'trading_credentials_present':False,'order_adapter_present':False,'execution_enabled':False,'orders_submitted':0,'live_capital_authorized':False}
          for k,v in zero.items():
              if k in proof: req(proof.get(k)==v,'proof_'+k)
              if k in health: req(health.get(k)==v,'health_'+k)
          if findings: print(json.dumps({'result':'FAIL','material_findings':findings},sort_keys=True)); raise SystemExit('material findings')
          print(json.dumps({'result':'PASS','material_findings':[],'material_finding_count':0},sort_keys=True))
          PY

      - name: Upload audit evidence
