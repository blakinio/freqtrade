        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$IMPLEMENTATION_SHA" ]]
          bash -n deploy/synology/wickhunter-paper-runtime/issue1396_terminal_transition.sh
          bash deploy/synology/wickhunter-paper-runtime/issue1396_terminal_transition.sh

      - name: Prove LIVE remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true --entrypoint python local/wickhunter-paper-runtime:issue1396-terminal-paper - <<'PY' > "$RUNNER_TEMP/issue1396-terminal-transition/live-rejection.json"
          import json
          from ai_platform.wickhunter.contracts import BotMode
          from ai_platform.wickhunter.runtime_mode import ManagedRuntimeModeRequest,RuntimeModeResolutionError,resolve_managed_runtime_mode
          try:
              resolve_managed_runtime_mode(ManagedRuntimeModeRequest(mode=BotMode.LIVE_BLOCKED))
          except RuntimeModeResolutionError as exc:
              print(json.dumps({'result':'PASS','rejected':True,'reason':str(exc)},sort_keys=True))
          else:
