          print(f"OLD_REVISION_ID={p['old_revision']['revision_id']}")
          print(f"PAPER_GENERATION_ID={p['paper_generation']['generation_id']}")
          print(f"PAPER_GENERATION_SPEC_DIGEST={p['paper_generation']['generation_spec_digest']}")
          PY

      - name: Stop previous SHADOW runtime and persist authoritative STOPPED proof
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(docker inspect --format '{{.State.Running}}' "$OLD_SHADOW_CONTAINER_ID")" == "true" ]]
          docker stop --time 30 "$OLD_SHADOW_CONTAINER_ID" >/dev/null
          [[ "$(docker inspect --format '{{.State.Running}}' "$OLD_SHADOW_CONTAINER_ID")" == "false" ]]
          docker exec "$PORTAL_CONTROL_CONTAINER" \
            python /tmp/issue1396_terminal_transition.py record-stop \
            --generation-id "$OLD_GENERATION_ID" \
            --runtime-instance-id "$OLD_SHADOW_CONTAINER_ID" \
            --evidence-kind issue1396-authoritative-shadow-stop \
            > "$RUNNER_TEMP/issue1396-shadow-stopped.json"

      - name: Start constrained persistent PAPER runtime
        shell: bash
        run: |
          set -euo pipefail
          candidate_host="$HOST_STATE_ROOT/wickhunter-candidate-materialization/packages/$CANDIDATE_PACKAGE_NAME"
          ! docker container inspect "$PROD_PAPER_CONTAINER" >/dev/null 2>&1
          ! docker container inspect "$PROD_GATEWAY_CONTAINER" >/dev/null 2>&1
          ! docker network inspect "$PROD_INTERNAL_NETWORK" >/dev/null 2>&1
          docker network create --internal "$PROD_INTERNAL_NETWORK" >/dev/null
          gateway_code="$(cat <<'PY'
          import socket,socketserver,threading
          TARGET=("fapi.binance.com",443)
          class Server(socketserver.ThreadingMixIn,socketserver.TCPServer):
              daemon_threads=True
              allow_reuse_address=True
          class Handler(socketserver.BaseRequestHandler):
              @staticmethod
              def pump(source,destination):
                  try:
                      while True:
                          chunk=source.recv(65536)
                          if not chunk:return
                          destination.sendall(chunk)
                  except OSError:
                      return
                  finally:
                      try: destination.shutdown(socket.SHUT_WR)
                      except OSError: pass
              def handle(self):
                  remote=socket.create_connection(TARGET,timeout=15)
                  try:
                      thread=threading.Thread(target=self.pump,args=(self.request,remote),daemon=True)
                      thread.start(); self.pump(remote,self.request); thread.join(timeout=5)
                  finally: remote.close()
          Server(("0.0.0.0",443),Handler).serve_forever()
          PY
          )"
          docker create --name "$PROD_GATEWAY_CONTAINER" --init --user 0:0 --read-only \
            --restart unless-stopped \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 \
            --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges:true \
            --memory 256m --network bridge \
            --label "io.freqtrade.wickhunter.issue=1396" \
            --label "io.freqtrade.wickhunter.role=production-paper-public-market-egress" \
            --label "io.freqtrade.wickhunter.target=fapi.binance.com:443" \
            --label "org.opencontainers.image.revision=$IMPLEMENTATION_SHA" \
            --entrypoint python "$PAPER_IMAGE" -c "$gateway_code" >/dev/null
          docker network connect "$PROD_INTERNAL_NETWORK" "$PROD_GATEWAY_CONTAINER"
          docker start "$PROD_GATEWAY_CONTAINER" >/dev/null
          for _ in $(seq 1 30); do
            [[ "$(docker inspect --format '{{.State.Running}}' "$PROD_GATEWAY_CONTAINER")" == "true" ]] && break
            sleep 1
          done
          [[ "$(docker inspect --format '{{.State.Running}}' "$PROD_GATEWAY_CONTAINER")" == "true" ]]
          gateway_ip="$(docker inspect --format "{{with index .NetworkSettings.Networks \"$PROD_INTERNAL_NETWORK\"}}{{.IPAddress}}{{end}}" "$PROD_GATEWAY_CONTAINER")"
          [[ "$gateway_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker create --name "$PROD_PAPER_CONTAINER" \
            --restart unless-stopped \
            --label "io.freqtrade.wickhunter.issue=1396" \
            --label "io.freqtrade.wickhunter.bot=wickhunter" \
            --label "io.freqtrade.wickhunter.mode=paper" \
            --label "io.freqtrade.wickhunter.generation=$PAPER_GENERATION_ID" \
            --label "io.freqtrade.wickhunter.binding=$PAPER_BINDING_ID" \
            --label "org.opencontainers.image.revision=$IMPLEMENTATION_SHA" \
            --user 65532:65532 --group-add "$LIQUID20_READER_GID" --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 2g --cpus 2.0 --pids-limit 256 \
            --network "$PROD_INTERNAL_NETWORK" --add-host "fapi.binance.com:$gateway_ip" \
            --env "OPERATOR_COMMIT=$IMPLEMENTATION_SHA" \
            --env HEALTH_PATH=/runtime/operator/health.json \
            --env HEALTH_MAX_AGE_SECONDS=1200 \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= \
            --env http_proxy= --env https_proxy= --env all_proxy= \
            --env NO_PROXY=fapi.binance.com --env no_proxy=fapi.binance.com \
            --mount "type=bind,src=$candidate_host,dst=/runtime/candidate,readonly" \
            --mount "type=bind,src=$PROD_ACTIVATION_HOST,dst=/runtime/activation,readonly" \
            --mount "type=bind,src=$LIQUID20_LIVE_HOST,dst=/runtime/liquid20,readonly" \
            --mount "type=bind,src=$PROD_JOURNAL_HOST,dst=/runtime/journal" \
            --mount "type=bind,src=$PROD_OPERATOR_HOST,dst=/runtime/operator" \
            --health-cmd "python /app/deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py" \
            --health-interval 60s --health-timeout 10s --health-retries 3 --health-start-period 120s \
            "$PAPER_IMAGE" \
            --candidate-root /runtime/candidate \
            --activation-root /runtime/activation \
            --journal-root /runtime/journal \
            --liquid20-root /runtime/liquid20 \
            --health-root /runtime/operator \
            --operator-commit "$IMPLEMENTATION_SHA" \
            --public-market-base-url https://fapi.binance.com \
            --poll-seconds 120 \
            --maximum-source-age-ms 300000 \
            --model-drift healthy \
            --data-drift healthy \
            --circuit-breaker-active false \
            --cycles 0 >/dev/null
          docker start "$PROD_PAPER_CONTAINER" >/dev/null
          for _ in $(seq 1 90); do
            h="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$PROD_PAPER_CONTAINER")"
            [[ "$h" == "healthy" ]] && break
            [[ "$h" =~ ^(unhealthy|exited|dead)$ ]] && { docker logs "$PROD_PAPER_CONTAINER"; exit 1; }
            sleep 10
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$PROD_PAPER_CONTAINER")" == "healthy" ]]
          docker exec "$PROD_PAPER_CONTAINER" \
            python /app/deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py
          paper_id="$(docker inspect --format '{{.Id}}' "$PROD_PAPER_CONTAINER")"
          [[ "$paper_id" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(docker inspect --format '{{.Image}}' "$PROD_PAPER_CONTAINER")" == "sha256:$PAPER_IMAGE_DIGEST" ]]
          cp "$PROD_STATE_RUNNER/operator/$(basename "$PROD_ACTIVATION_HOST")/health.json" \
            "$RUNNER_TEMP/issue1396-production-health.json"
          python3 - "$RUNNER_TEMP/issue1396-production-health.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          if p.get("status")!="healthy" or p.get("runtime_health")!="healthy":
              raise SystemExit("persistent PAPER runtime is not genuinely healthy")
          zero={
              "protected_holdout_accessed":False,
              "automatic_promotion_enabled":False,
              "trading_credentials_present":False,
              "order_adapter_present":False,
              "execution_enabled":False,
              "orders_submitted":0,
              "live_capital_authorized":False,
          }
          for key,value in zero.items():
              if p.get(key)!=value: raise SystemExit(f"forbidden PAPER authority: {key}")
