        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/issue1396-production-health.json" > "$RUNNER_TEMP/issue1396-restart-before.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          print(json.dumps({"generation":p["generation"],"checked_at_ms":p["checked_at_ms"],"health_sha256":p["health_sha256"]},sort_keys=True))
          PY
          before_generation="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["generation"])' "$RUNNER_TEMP/issue1396-production-health.json")"
          before_checked="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["checked_at_ms"])' "$RUNNER_TEMP/issue1396-production-health.json")"
          before_id="$(docker inspect --format '{{.Id}}' "$PROD_PAPER_CONTAINER")"
          docker restart "$PROD_PAPER_CONTAINER" >/dev/null
          for _ in $(seq 1 120); do
            h="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$PROD_PAPER_CONTAINER")"
            if [[ "$h" == "healthy" && -f "$PROD_STATE_RUNNER/operator/$(basename "$PROD_ACTIVATION_HOST")/health.json" ]]; then
              current_generation="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["generation"])' "$PROD_STATE_RUNNER/operator/$(basename "$PROD_ACTIVATION_HOST")/health.json")"
              current_checked="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["checked_at_ms"])' "$PROD_STATE_RUNNER/operator/$(basename "$PROD_ACTIVATION_HOST")/health.json")"
              if (( current_generation > before_generation && current_checked > before_checked )); then break; fi
            fi
            [[ "$h" =~ ^(unhealthy|exited|dead)$ ]] && { docker logs "$PROD_PAPER_CONTAINER"; exit 1; }
            sleep 10
          done
          after_id="$(docker inspect --format '{{.Id}}' "$PROD_PAPER_CONTAINER")"
          [[ "$after_id" == "$before_id" && "$after_id" == "$PAPER_CONTAINER_ID" ]]
          [[ "$(docker inspect --format '{{.Image}}' "$PROD_PAPER_CONTAINER")" == "sha256:$PAPER_IMAGE_DIGEST" ]]
          cp "$PROD_STATE_RUNNER/operator/$(basename "$PROD_ACTIVATION_HOST")/health.json" \
            "$RUNNER_TEMP/issue1396-production-health-after-restart.json"
          docker exec "$PROD_PAPER_CONTAINER" \
            python /app/deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py
          python3 - "$RUNNER_TEMP/issue1396-restart-before.json" \
            "$RUNNER_TEMP/issue1396-production-health-after-restart.json" \
            "$PAPER_CONTAINER_ID" "$PAPER_GENERATION_ID" \
            > "$RUNNER_TEMP/issue1396-restart-proof.json" <<'PY'
          import json,sys
          before=json.load(open(sys.argv[1],encoding="utf-8"))
          after=json.load(open(sys.argv[2],encoding="utf-8"))
          if after["generation"] <= before["generation"] or after["checked_at_ms"] <= before["checked_at_ms"]:
              raise SystemExit("PAPER restart did not advance exact runtime generation")
          if after.get("status")!="healthy" or after.get("runtime_health")!="healthy":
              raise SystemExit("PAPER runtime is not healthy after restart")
          print(json.dumps({
              "same_runtime_instance":True,
              "runtime_instance_id":sys.argv[3],
              "runtime_generation_id":sys.argv[4],
              "before_generation":before["generation"],
              "after_generation":after["generation"],
              "before_checked_at_ms":before["checked_at_ms"],
              "after_checked_at_ms":after["checked_at_ms"],
              "health_sha256":after["health_sha256"],
          },sort_keys=True))
          PY
          docker cp "$RUNNER_TEMP/issue1396-production-health-after-restart.json" \
            "$PORTAL_CONTROL_CONTAINER:/tmp/issue1396-production-health-after-restart.json"
          docker exec "$PORTAL_CONTROL_CONTAINER" \
            python /tmp/issue1396_terminal_transition.py reconcile-running \
            --generation-id "$PAPER_GENERATION_ID" \
            --runtime-instance-id "$PAPER_CONTAINER_ID" \
            --health-json /tmp/issue1396-production-health-after-restart.json \
            --source-version "$IMPLEMENTATION_SHA" \
            --evidence-kind issue1396-production-paper-restart-running \
            --actor-id system-issue1396-paper-restart-reconciler \
            > "$RUNNER_TEMP/issue1396-paper-restart-observation.json"

      - name: Prove final production Portal API truth and emit browser payload
        id: final
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$PORTAL_CONTROL_CONTAINER" \
            python /tmp/issue1396_terminal_transition.py final-api --expected-mode paper \
            > "$RUNNER_TEMP/issue1396-production-api.json"
          python3 - \
            "$RUNNER_TEMP/issue1396-production-api.json" \
            "$RUNNER_TEMP/issue1396-production-health-after-restart.json" \
            "$RUNNER_TEMP/issue1396-proof.json" \
            "$RUNNER_TEMP/issue1396-restart-proof.json" \
            "$RUNNER_TEMP/issue1396-paper-restart-observation.json" \
            "$RUNNER_TEMP/issue1396-old-shadow.json" \
            "$RUNNER_TEMP/issue1396-production-activation.json" \
            "$PAPER_CONTAINER_ID" "$PAPER_IMAGE_DIGEST" "$PAPER_CONFIG_DIGEST" \
            "$IMPLEMENTATION_SHA" "$PAPER_GENERATION_ID" \
            > "$RUNNER_TEMP/issue1396-production-closeout.json" <<'PY'
          import json,sys
          api=json.load(open(sys.argv[1],encoding="utf-8"))
          health=json.load(open(sys.argv[2],encoding="utf-8"))
          proof=json.load(open(sys.argv[3],encoding="utf-8"))
          restart=json.load(open(sys.argv[4],encoding="utf-8"))
          restart_obs=json.load(open(sys.argv[5],encoding="utf-8"))
          old=json.load(open(sys.argv[6],encoding="utf-8"))
          activation=json.load(open(sys.argv[7],encoding="utf-8"))
          paper_id,image_digest,config_digest,implementation_sha,paper_generation=sys.argv[8:13]
          truth=api["truth"]; bot=api["bots"][0]
          desired=truth["desired_generation"]; observed=truth["observed_generation"]
          if proof.get("observation_count")!=5 or proof.get("telemetry_record_count")!=5 or proof.get("successful_outcomes")!=5:
              raise SystemExit("exact-head five-cycle proof is incomplete")
          if proof.get("runtime_health")!="healthy" or proof.get("implementation_sha")!=implementation_sha:
              raise SystemExit("exact-head proof is not genuinely healthy/current")
          if desired["generation_id"]!=paper_generation or observed["generation_id"]!=paper_generation:
              raise SystemExit("final desired/observed PAPER generation mismatch")
          if desired["managed_mode"]!="paper" or observed["managed_mode"]!="paper":
              raise SystemExit("final mode is not PAPER")
          if desired["runtime_image_digest"]!=image_digest or desired["normalized_runtime_config_digest"]!=config_digest:
              raise SystemExit("final RuntimeGeneration immutable identity mismatch")
          if health.get("status")!="healthy" or health.get("runtime_health")!="healthy":
              raise SystemExit("final physical PAPER health is not healthy")
          if not restart.get("same_runtime_instance") or restart.get("runtime_instance_id")!=paper_id:
              raise SystemExit("restart physical identity mismatch")
          zero={
              "protected_holdout_accessed":False,"automatic_promotion_enabled":False,
              "trading_credentials_present":False,"order_adapter_present":False,
              "execution_enabled":False,"orders_submitted":0,"live_capital_authorized":False,
          }
          for key,value in zero.items():
              if health.get(key)!=value or proof.get(key)!=value:
                  raise SystemExit(f"final zero-authority mismatch: {key}")
          report={
              "schema_version":"issue1396-terminal-paper-closeout-v1",
              "result":"PASS",
              "implementation_sha":implementation_sha,
              "bot":bot,
              "truth":truth,
              "physical":{
                  "paper_container_id":paper_id,
                  "paper_image_digest":image_digest,
                  "paper_config_digest":config_digest,
                  "old_shadow_container_id":old["container_id"],
                  "old_shadow_stopped":True,
              },
              "paper_activation":activation,
              "paper_health":health,
              "five_cycle_proof":proof,
              "restart":restart,
              "restart_observation":restart_obs,
              "zero_authority":zero,
          }
          print(json.dumps(report,sort_keys=True))
          PY
          python3 - "$RUNNER_TEMP/issue1396-production-closeout.json" "$GITHUB_OUTPUT" <<'PY'
          import base64,json,sys
          raw=open(sys.argv[1],"rb").read()
          p=json.loads(raw)
          truth=p["truth"]
          with open(sys.argv[2],"a",encoding="utf-8") as out:
              out.write("production_payload_b64="+base64.b64encode(raw).decode()+"\n")
              out.write("desired_generation_id="+truth["desired_generation"]["generation_id"]+"\n")
              out.write("observed_generation_id="+truth["observed_generation"]["generation_id"]+"\n")
              out.write("paper_container_id="+p["physical"]["paper_container_id"]+"\n")
              out.write("old_shadow_container_id="+p["physical"]["old_shadow_container_id"]+"\n")
              out.write("paper_image_digest="+p["physical"]["paper_image_digest"]+"\n")
              out.write("paper_config_digest="+p["physical"]["paper_config_digest"]+"\n")
          PY

      - name: Roll back to canonical SHADOW on transition failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          echo "terminal PAPER transition failed; restoring canonical SHADOW" >&2
          if [[ -z "${OLD_SHADOW_CONTAINER_ID:-}" ]]; then
            echo "old SHADOW identity was never captured; no authorized runtime mutation could have occurred" >&2
            exit 0
          fi
          if [[ ! -f "$RUNNER_TEMP/issue1396-desired-paper.json" ]]; then
            if [[ "$(docker inspect --format '{{.State.Running}}' "$OLD_SHADOW_CONTAINER_ID" 2>/dev/null || echo false)" != "true" ]]; then
              docker start "$OLD_SHADOW_CONTAINER_ID" >/dev/null
            fi
            for _ in $(seq 1 60); do
              h="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$OLD_SHADOW_CONTAINER_ID")"
              [[ "$h" == "healthy" ]] && break
              [[ "$h" =~ ^(unhealthy|exited|dead)$ ]] && exit 1
              sleep 5
            done
            [[ "$(docker inspect --format '{{.State.Health.Status}}' "$OLD_SHADOW_CONTAINER_ID")" == "healthy" ]]
          else
            [[ -n "${OLD_GENERATION_ID:-}" && -n "${OLD_REVISION_ID:-}" && -n "${PAPER_GENERATION_ID:-}" ]]
            [[ "$(docker inspect --format '{{.State.Running}}' "$PORTAL_CONTROL_CONTAINER" 2>/dev/null || echo false)" == "true" ]]
            if ! docker exec "$PORTAL_CONTROL_CONTAINER" test -f /tmp/issue1396_terminal_transition.py; then
              docker cp "$RUNNER_TEMP/issue1396_terminal_transition.py" \
                "$PORTAL_CONTROL_CONTAINER:/tmp/issue1396_terminal_transition.py"
            fi
            docker exec "$PORTAL_CONTROL_CONTAINER" \
              python /tmp/issue1396_terminal_transition.py request-rollback \
              --old-generation-id "$OLD_GENERATION_ID" \
              --old-revision-id "$OLD_REVISION_ID" \
              --paper-generation-id "$PAPER_GENERATION_ID" \
              > "$RUNNER_TEMP/issue1396-rollback-request.json"
            rollback_status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/issue1396-rollback-request.json")"
            if [[ "$rollback_status" == "already_shadow" ]]; then
              rollback_generation="$OLD_GENERATION_ID"
            else
              rollback_generation="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["generation"]["generation_id"])' "$RUNNER_TEMP/issue1396-rollback-request.json")"
              docker exec "$PORTAL_CONTROL_CONTAINER" \
                python /tmp/issue1396_terminal_transition.py current-state \
                > "$RUNNER_TEMP/issue1396-rollback-current-state.json"
              observed_generation="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["bot"]["observed_runtime_generation_id"])' "$RUNNER_TEMP/issue1396-rollback-current-state.json")"
              if [[ "$observed_generation" == "$PAPER_GENERATION_ID" ]]; then
                observed_runtime_id="${PAPER_CONTAINER_ID:-}"
                [[ -n "$observed_runtime_id" ]]
                if docker container inspect "$PROD_PAPER_CONTAINER" >/dev/null 2>&1; then
                  docker stop --time 30 "$PROD_PAPER_CONTAINER" >/dev/null 2>&1 || true
                fi
              elif [[ "$observed_generation" == "$OLD_GENERATION_ID" ]]; then
                observed_runtime_id="$OLD_SHADOW_CONTAINER_ID"
                if [[ "$(docker inspect --format '{{.State.Running}}' "$OLD_SHADOW_CONTAINER_ID")" == "true" ]]; then
                  docker stop --time 30 "$OLD_SHADOW_CONTAINER_ID" >/dev/null
                fi
              else
                echo "rollback observed generation is neither canonical SHADOW nor task PAPER" >&2
                exit 1
              fi
              docker exec "$PORTAL_CONTROL_CONTAINER" \
                python /tmp/issue1396_terminal_transition.py record-stop \
                --generation-id "$observed_generation" \
                --runtime-instance-id "$observed_runtime_id" \
                --evidence-kind issue1396-failure-rollback-stop \
                > "$RUNNER_TEMP/issue1396-rollback-stop.json"
              if [[ "$(docker inspect --format '{{.State.Running}}' "$OLD_SHADOW_CONTAINER_ID")" != "true" ]]; then
                docker start "$OLD_SHADOW_CONTAINER_ID" >/dev/null
              fi
              for _ in $(seq 1 90); do
                h="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$OLD_SHADOW_CONTAINER_ID")"
                [[ "$h" == "healthy" ]] && break
                [[ "$h" =~ ^(unhealthy|exited|dead)$ ]] && { docker logs "$OLD_SHADOW_CONTAINER_ID"; exit 1; }
                sleep 5
              done
              [[ "$(docker inspect --format '{{.State.Health.Status}}' "$OLD_SHADOW_CONTAINER_ID")" == "healthy" ]]
              docker exec "$PORTAL_CONTROL_CONTAINER" \
                python /tmp/issue1396_terminal_transition.py reconcile-running \
                --generation-id "$rollback_generation" \
                --runtime-instance-id "$OLD_SHADOW_CONTAINER_ID" \
                --evidence-kind issue1396-failure-rollback-shadow-running \
                --actor-id system-issue1396-failure-rollback-reconciler \
                > "$RUNNER_TEMP/issue1396-rollback-reconciled.json"
            fi
            docker exec "$PORTAL_CONTROL_CONTAINER" \
              python /tmp/issue1396_terminal_transition.py final-api --expected-mode shadow \
              > "$RUNNER_TEMP/issue1396-rollback-final-api.json"
          fi
          docker rm -f "$PROD_PAPER_CONTAINER" "$PROD_GATEWAY_CONTAINER" >/dev/null 2>&1 || true
          docker network rm "$PROD_INTERNAL_NETWORK" >/dev/null 2>&1 || true
          if [[ -n "${PROD_STATE_RUNNER:-}" && -e "$PROD_STATE_RUNNER" ]]; then
            case "$PROD_STATE_RUNNER" in
              "$RUNNER_STATE_ROOT"/wickhunter-paper-runtime/issue1396-production-paper-*) ;;
              *) echo "refusing unexpected rollback state cleanup path" >&2; exit 1 ;;
            esac
            rm -rf --one-file-system "$PROD_STATE_RUNNER"
          fi
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$OLD_SHADOW_CONTAINER_ID")" == "healthy" ]]
          echo '{"result":"PASS","restored_mode":"shadow"}' > "$RUNNER_TEMP/issue1396-rollback-result.json"

      - name: Upload bounded transition evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue1396-terminal-paper-transition-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/issue1396-old-shadow.json
            ${{ runner.temp }}/issue1396-baseline.json
            ${{ runner.temp }}/issue1396-proof.json
            ${{ runner.temp }}/issue1396-production-activation.json
            ${{ runner.temp }}/issue1396-desired-paper.json
            ${{ runner.temp }}/issue1396-shadow-stopped.json
            ${{ runner.temp }}/issue1396-production-health.json
            ${{ runner.temp }}/issue1396-paper-reconciled.json
            ${{ runner.temp }}/issue1396-restart-proof.json
            ${{ runner.temp }}/issue1396-production-health-after-restart.json
            ${{ runner.temp }}/issue1396-paper-restart-observation.json
            ${{ runner.temp }}/issue1396-production-api.json
            ${{ runner.temp }}/issue1396-production-closeout.json
            ${{ runner.temp }}/issue1396-portal-deploy-report.json
            ${{ runner.temp }}/issue1396-rollback-request.json
            ${{ runner.temp }}/issue1396-rollback-stop.json
            ${{ runner.temp }}/issue1396-rollback-reconciled.json
            ${{ runner.temp }}/issue1396-rollback-final-api.json
            ${{ runner.temp }}/issue1396-rollback-result.json

  browser:
    name: Real Chromium against exact production PAPER truth
    needs: transition
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PRODUCTION_PAYLOAD_B64: ${{ needs.transition.outputs.production_payload_b64 }}
      EXPECTED_DESIRED_GENERATION: ${{ needs.transition.outputs.desired_generation_id }}
      EXPECTED_OBSERVED_GENERATION: ${{ needs.transition.outputs.observed_generation_id }}
    steps:
      - name: Check out exact protected implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: 60f882b6c99d2409cde65a749098643c567049c4

      - name: Materialize captured production API truth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s' "$PRODUCTION_PAYLOAD_B64" | base64 --decode > artifacts/issue1396-production-closeout.json
          python3 - \
            artifacts/issue1396-production-closeout.json \
            "$EXPECTED_DESIRED_GENERATION" "$EXPECTED_OBSERVED_GENERATION" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          truth=p["truth"]
          if truth["desired_generation"]["generation_id"]!=sys.argv[2] or truth["observed_generation"]["generation_id"]!=sys.argv[3]:
              raise SystemExit("captured production generation output mismatch")
          if sys.argv[2]!=sys.argv[3] or truth["pending_rollout"] is not False:
              raise SystemExit("captured production truth is not converged")
          if truth["observed_generation"]["managed_mode"]!="paper":
              raise SystemExit("captured production truth is not PAPER")
          PY
          cat > "$RUNNER_TEMP/issue1396-api.py" <<'PY'
          import json,sys
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          def payload(path):
              if path=="/v1/bots": return 200,[p["bot"]]
              if path=="/v1/bots/wickhunter/runtime-truth": return 200,p["truth"]
              if path in {
                  "/v1/runtime-evidence","/v1/performance","/v1/valuations",
                  "/v1/risk/events","/v1/audit/events"
              }: return 200,[]
              return 404,{"detail":"not found"}
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  code,obj=payload(self.path.split("?",1)[0])
                  body=json.dumps(obj,separators=(",",":")).encode()
                  self.send_response(code); self.send_header("content-type","application/json")
                  self.send_header("content-length",str(len(body))); self.end_headers(); self.wfile.write(body)
              def log_message(self,*_args): return
          ThreadingHTTPServer(("127.0.0.1",8000),Handler).serve_forever()
          PY
          python3 "$RUNNER_TEMP/issue1396-api.py" artifacts/issue1396-production-closeout.json &
          echo "ISSUE1396_API_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8000/v1/bots >/dev/null && break; sleep 1; done

      - name: Build exact API-mode Portal web
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false \
            --label "org.opencontainers.image.revision=$EXPECTED_BASE_SHA" \
            --file deploy/synology/portal/Dockerfile \
            --tag "issue1396-portal-web:$EXPECTED_BASE_SHA" ai_platform/portal/web
          web="issue1396-paper-browser-web-${GITHUB_RUN_ID}"
          echo "ISSUE1396_WEB_CONTAINER=$web" >> "$GITHUB_ENV"
          docker run --detach --name "$web" --network host --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --env PORTAL_WEB_DATA_MODE=api \
            --env PORTAL_ENVIRONMENT=production \
            --env PORTAL_IDENTITY_FIXTURE_MODE=disabled \
            --env PORTAL_IDENTITY_TRANSPORT_MODE=https \
            --env PORTAL_IDENTITY_ISSUER=https://issuer.example/application/o/portal/ \
            --env PORTAL_CONTROL_PLANE_URL=http://127.0.0.1:8000 \
            --env PORTAL_LIQUIDATIONS_DATA_ROOT=/tmp/no-liquidations \
            "issue1396-portal-web:$EXPECTED_BASE_SHA"
          for _ in $(seq 1 60); do
            h="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$web")"
            [[ "$h" == "healthy" ]] && break
            [[ "$h" =~ ^(unhealthy|exited|dead)$ ]] && { docker logs "$web"; exit 1; }
            sleep 2
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$web")" == "healthy" ]]

      - name: Run real Chromium PAPER projection
        working-directory: ai_platform/portal/web
        shell: bash
        env:
          WICKHUNTER_EXPECTED_MODE: paper
          WICKHUNTER_EXPECTED_DESIRED_GENERATION: ${{ needs.transition.outputs.desired_generation_id }}
          WICKHUNTER_EXPECTED_OBSERVED_GENERATION: ${{ needs.transition.outputs.observed_generation_id }}
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/issue1396-browser.key" \
            -out "$RUNNER_TEMP/issue1396-browser.crt" \
            -days 1 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1" >/dev/null 2>&1
          cat > "$RUNNER_TEMP/issue1396-proxy.mjs" <<'JS'
          import fs from "node:fs"; import http from "node:http"; import https from "node:https";
          const [keyPath,certPath]=process.argv.slice(2);
          https.createServer({key:fs.readFileSync(keyPath),cert:fs.readFileSync(certPath)},(req,res)=>{
            const up=http.request({hostname:"127.0.0.1",port:3000,path:req.url,method:req.method,headers:{...req.headers,host:"127.0.0.1:3000"}},u=>{res.writeHead(u.statusCode??502,u.headers);u.pipe(res)});
            up.on("error",()=>{res.writeHead(502);res.end()});req.pipe(up)
          }).listen(3443,"127.0.0.1");
          JS
          node "$RUNNER_TEMP/issue1396-proxy.mjs" \
            "$RUNNER_TEMP/issue1396-browser.key" "$RUNNER_TEMP/issue1396-browser.crt" &
          proxy_pid=$!
          trap 'kill "$proxy_pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do curl --insecure --fail --silent https://127.0.0.1:3443/bots >/dev/null && break; sleep 1; done
          node e2e/wickhunter-api-mode-ci.mjs
          printf '%s\n' '{"result":"PASS","mode":"paper","desired_observed_equal":true}' \
            > artifacts/issue1396-production-paper-browser.json

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue1396-production-paper-browser-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/issue1396-production-closeout.json
            ai_platform/portal/web/artifacts/issue1396-production-paper-browser.json

      - name: Cleanup browser resources
        if: always()
        shell: bash
        run: |
          docker rm -f "${ISSUE1396_WEB_CONTAINER:-missing}" >/dev/null 2>&1 || true
          if [[ -n "${ISSUE1396_API_PID:-}" ]]; then kill "$ISSUE1396_API_PID" >/dev/null 2>&1 || true; fi

  audit:
    name: Deterministic adversarial terminal audit
    needs: [transition, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCTION_PAYLOAD_B64: ${{ needs.transition.outputs.production_payload_b64 }}
      EXPECTED_DESIRED_GENERATION: ${{ needs.transition.outputs.desired_generation_id }}
      EXPECTED_OBSERVED_GENERATION: ${{ needs.transition.outputs.observed_generation_id }}
      EXPECTED_PAPER_CONTAINER: ${{ needs.transition.outputs.paper_container_id }}
      EXPECTED_OLD_SHADOW_CONTAINER: ${{ needs.transition.outputs.old_shadow_container_id }}
      EXPECTED_IMAGE_DIGEST: ${{ needs.transition.outputs.paper_image_digest }}
      EXPECTED_CONFIG_DIGEST: ${{ needs.transition.outputs.paper_config_digest }}
    steps:
      - name: Falsify terminal PAPER acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s' "$PRODUCTION_PAYLOAD_B64" | base64 --decode \
            > artifacts/issue1396-production-closeout.json
          python3 - artifacts/issue1396-production-closeout.json \
            "$EXPECTED_DESIRED_GENERATION" "$EXPECTED_OBSERVED_GENERATION" \
            "$EXPECTED_PAPER_CONTAINER" "$EXPECTED_OLD_SHADOW_CONTAINER" \
            "$EXPECTED_IMAGE_DIGEST" "$EXPECTED_CONFIG_DIGEST" \
            > artifacts/issue1396-adversarial-audit.json <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          d,o,paper_id,old_id,image_digest,config_digest=sys.argv[2:8]
          if p.get("result")!="PASS" or p.get("implementation_sha")!="60f882b6c99d2409cde65a749098643c567049c4":
              raise SystemExit("terminal payload is not exact current accepted develop")
          truth=p["truth"]; desired=truth["desired_generation"]; observed=truth["observed_generation"]
          if d!=o or desired["generation_id"]!=d or observed["generation_id"]!=o:
              raise SystemExit("desired/observed identity mismatch")
          if desired["managed_mode"]!="paper" or observed["managed_mode"]!="paper" or truth["pending_rollout"] is not False:
              raise SystemExit("canonical runtime truth is not converged PAPER")
          if not desired.get("paper_authorization_digest"):
              raise SystemExit("PAPER authorization identity missing")
          rollout=truth.get("latest_rollout") or {}
          if rollout.get("status")!="SUCCEEDED" or rollout.get("reason_code")!="EXTERNAL_RUNTIME_ADOPTED":
              raise SystemExit("PAPER rollout is not terminal external adoption")
          physical=p["physical"]
          if physical["paper_container_id"]!=paper_id or physical["old_shadow_container_id"]!=old_id:
              raise SystemExit("physical runtime identity mismatch")
          if physical["paper_image_digest"]!=image_digest or physical["paper_config_digest"]!=config_digest:
              raise SystemExit("physical immutable identity mismatch")
          if desired["runtime_image_digest"]!=image_digest or desired["normalized_runtime_config_digest"]!=config_digest:
              raise SystemExit("canonical/physical immutable identity divergence")
          proof=p["five_cycle_proof"]; health=p["paper_health"]; restart=p["restart"]
          if proof["observation_count"]!=5 or proof["telemetry_record_count"]!=5 or proof["successful_outcomes"]!=5:
              raise SystemExit("5/5 proof missing")
          if float(proof["fresh_source_ratio"])<0.99 or proof["runtime_health"]!="healthy":
              raise SystemExit("5/5 proof not genuinely healthy")
          if health["status"]!="healthy" or health["runtime_health"]!="healthy":
              raise SystemExit("production PAPER health not healthy")
          if not restart["same_runtime_instance"] or restart["runtime_instance_id"]!=paper_id:
              raise SystemExit("restart did not preserve physical runtime instance")
          if restart["after_generation"]<=restart["before_generation"]:
              raise SystemExit("restart did not advance journal generation")
          zero=p["zero_authority"]
          expected={
              "protected_holdout_accessed":False,"automatic_promotion_enabled":False,
              "trading_credentials_present":False,"order_adapter_present":False,
              "execution_enabled":False,"orders_submitted":0,"live_capital_authorized":False,
          }
          if zero!=expected:
              raise SystemExit("terminal authority boundary changed")
          print(json.dumps({
              "result":"PASS","material_findings":0,
              "implementation_sha":p["implementation_sha"],
              "desired_generation_id":d,"observed_generation_id":o,
              "mode":"paper","paper_container_id":paper_id,
              "old_shadow_container_id":old_id,
              "paper_image_digest":image_digest,"paper_config_digest":config_digest,
              "five_cycle_proof":"PASS","restart":"PASS",
              "browser":"PASS","zero_authority":expected,
          },sort_keys=True))
          PY

      - name: Upload adversarial audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue1396-adversarial-terminal-audit-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/issue1396-adversarial-audit.json

  finalize:
    name: Final Synology cleanup or fail-safe rollback
    if: always()
    needs: [transition, browser, audit]
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 30
    env:
      TRANSITION_RESULT: ${{ needs.transition.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
      AUDIT_RESULT: ${{ needs.audit.result }}
      PAPER_CONTAINER_ID: ${{ needs.transition.outputs.paper_container_id }}
      OLD_SHADOW_CONTAINER_ID: ${{ needs.transition.outputs.old_shadow_container_id }}
      PAPER_IMAGE_DIGEST: ${{ needs.transition.outputs.paper_image_digest }}
      PAPER_CONFIG_DIGEST: ${{ needs.transition.outputs.paper_config_digest }}
      DESIRED_GENERATION_ID: ${{ needs.transition.outputs.desired_generation_id }}
      OBSERVED_GENERATION_ID: ${{ needs.transition.outputs.observed_generation_id }}
    steps:
      - name: Check out request helper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Finalize success or restore SHADOW after downstream failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue1396-finalize"
          if [[ "$TRANSITION_RESULT" != "success" ]]; then
            printf '%s\n' '{"result":"SKIPPED","reason":"transition_job_failed_and_owned_rollback_ran"}' \
              > "$RUNNER_TEMP/issue1396-finalize/finalize.json"
            exit 1
          fi

          [[ -n "$PAPER_CONTAINER_ID" && -n "$OLD_SHADOW_CONTAINER_ID" ]]
          [[ -n "$DESIRED_GENERATION_ID" && "$DESIRED_GENERATION_ID" == "$OBSERVED_GENERATION_ID" ]]
          [[ "$(docker inspect --format '{{.Id}}' "$PROD_PAPER_CONTAINER")" == "$PAPER_CONTAINER_ID" ]]
          [[ "$(docker inspect --format '{{.Image}}' "$PROD_PAPER_CONTAINER")" == "sha256:$PAPER_IMAGE_DIGEST" ]]

          if [[ "$BROWSER_RESULT" != "success" || "$AUDIT_RESULT" != "success" ]]; then
            echo "downstream acceptance failed; restoring canonical SHADOW" >&2
            docker cp deploy/synology/wickhunter-paper-runtime/issue1396_terminal_transition.py \
              "$PORTAL_CONTROL_CONTAINER:/tmp/issue1396_terminal_transition.py"
            docker exec "$PORTAL_CONTROL_CONTAINER" \
              python /tmp/issue1396_terminal_transition.py rollback-metadata \
              > "$RUNNER_TEMP/issue1396-finalize/rollback-metadata.json"
            old_generation="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["old_generation_id"])' "$RUNNER_TEMP/issue1396-finalize/rollback-metadata.json")"
            old_revision="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["old_revision_id"])' "$RUNNER_TEMP/issue1396-finalize/rollback-metadata.json")"
            paper_generation="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["paper_generation_id"])' "$RUNNER_TEMP/issue1396-finalize/rollback-metadata.json")"
            docker exec "$PORTAL_CONTROL_CONTAINER" \
              python /tmp/issue1396_terminal_transition.py request-rollback \
              --old-generation-id "$old_generation" \
              --old-revision-id "$old_revision" \
              --paper-generation-id "$paper_generation" \
              > "$RUNNER_TEMP/issue1396-finalize/rollback-request.json"
            rollback_generation="$(python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); print(p.get("generation",{}).get("generation_id",p.get("generation",{}).get("generation_id","")))' "$RUNNER_TEMP/issue1396-finalize/rollback-request.json")"
            rollback_status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/issue1396-finalize/rollback-request.json")"
            if [[ "$rollback_status" == "already_shadow" ]]; then
              rollback_generation="$old_generation"
            else
              [[ -n "$rollback_generation" ]]
              docker exec "$PORTAL_CONTROL_CONTAINER" \
                python /tmp/issue1396_terminal_transition.py current-state \
                > "$RUNNER_TEMP/issue1396-finalize/current-state.json"
              current_observed="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["bot"]["observed_runtime_generation_id"])' "$RUNNER_TEMP/issue1396-finalize/current-state.json")"
              if [[ "$current_observed" == "$paper_generation" ]]; then
                if [[ "$(docker inspect --format '{{.State.Running}}' "$PROD_PAPER_CONTAINER")" == "true" ]]; then
                  docker stop --time 30 "$PROD_PAPER_CONTAINER" >/dev/null
                fi
                current_runtime="$PAPER_CONTAINER_ID"
              elif [[ "$current_observed" == "$old_generation" ]]; then
                current_runtime="$OLD_SHADOW_CONTAINER_ID"
                if [[ "$(docker inspect --format '{{.State.Running}}' "$OLD_SHADOW_CONTAINER_ID")" == "true" ]]; then
                  docker stop --time 30 "$OLD_SHADOW_CONTAINER_ID" >/dev/null
                fi
              else
                echo "unexpected observed generation during downstream rollback" >&2
                exit 1
              fi
              docker exec "$PORTAL_CONTROL_CONTAINER" \
                python /tmp/issue1396_terminal_transition.py record-stop \
                --generation-id "$current_observed" \
                --runtime-instance-id "$current_runtime" \
                --evidence-kind issue1396-downstream-failure-stop \
                > "$RUNNER_TEMP/issue1396-finalize/rollback-stop.json"
              if [[ "$(docker inspect --format '{{.State.Running}}' "$OLD_SHADOW_CONTAINER_ID")" != "true" ]]; then
                docker start "$OLD_SHADOW_CONTAINER_ID" >/dev/null
              fi
              for _ in $(seq 1 90); do
                h="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$OLD_SHADOW_CONTAINER_ID")"
                [[ "$h" == "healthy" ]] && break
                [[ "$h" =~ ^(unhealthy|exited|dead)$ ]] && { docker logs "$OLD_SHADOW_CONTAINER_ID"; exit 1; }
                sleep 5
              done
              [[ "$(docker inspect --format '{{.State.Health.Status}}' "$OLD_SHADOW_CONTAINER_ID")" == "healthy" ]]
              docker exec "$PORTAL_CONTROL_CONTAINER" \
                python /tmp/issue1396_terminal_transition.py reconcile-running \
                --generation-id "$rollback_generation" \
                --runtime-instance-id "$OLD_SHADOW_CONTAINER_ID" \
                --evidence-kind issue1396-downstream-failure-shadow-running \
                --actor-id system-issue1396-downstream-failure-reconciler \
                > "$RUNNER_TEMP/issue1396-finalize/rollback-reconciled.json"
            fi
            docker exec "$PORTAL_CONTROL_CONTAINER" \
              python /tmp/issue1396_terminal_transition.py final-api --expected-mode shadow \
              > "$RUNNER_TEMP/issue1396-finalize/rollback-final-api.json"
            docker rm -f "$PROD_PAPER_CONTAINER" "$PROD_GATEWAY_CONTAINER" >/dev/null 2>&1 || true
            docker network rm "$PROD_INTERNAL_NETWORK" >/dev/null 2>&1 || true
            docker exec "$PORTAL_CONTROL_CONTAINER" rm -f /tmp/issue1396_terminal_transition.py || true
            printf '%s\n' '{"result":"PASS","action":"restored_shadow_after_downstream_acceptance_failure"}' \
              > "$RUNNER_TEMP/issue1396-finalize/finalize.json"
            exit 1
          fi

          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$PROD_PAPER_CONTAINER")" == "healthy" ]]
          [[ "$(docker inspect --format '{{index .Config.Labels "io.freqtrade.wickhunter.mode"}}' "$PROD_PAPER_CONTAINER")" == "paper" ]]
          [[ "$(docker inspect --format '{{index .Config.Labels "io.freqtrade.wickhunter.generation"}}' "$PROD_PAPER_CONTAINER")" == "$DESIRED_GENERATION_ID" ]]
          docker exec "$PROD_PAPER_CONTAINER" \
            python /app/deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py
          [[ "$(docker inspect --format '{{.State.Running}}' "$OLD_SHADOW_CONTAINER_ID")" == "false" ]]
          [[ "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$OLD_SHADOW_CONTAINER_ID")" == "$OLD_SHADOW_PROJECT" ]]
          [[ "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$OLD_SHADOW_CONTAINER_ID")" == "$OLD_SHADOW_SERVICE" ]]
          docker rm "$OLD_SHADOW_CONTAINER_ID" >/dev/null
          docker rm -f "$LEGACY_OBSERVER_CONTAINER" >/dev/null 2>&1 || true
          mapfile -t stale_ids < <(
            docker ps -aq --no-trunc \
              --filter "label=com.docker.compose.project=$OLD_SHADOW_PROJECT" \
              --filter "label=com.docker.compose.service=$OLD_SHADOW_SERVICE" |
              sed '/^$/d'
          )
          [[ ${#stale_ids[@]} -eq 0 ]]
          [[ "$(docker inspect --format '{{.State.Running}}' "$PROD_PAPER_CONTAINER")" == "true" ]]
          [[ "$(docker inspect --format '{{.State.Running}}' "$PROD_GATEWAY_CONTAINER")" == "true" ]]
          docker network inspect "$PROD_INTERNAL_NETWORK" >/dev/null

          docker cp deploy/synology/wickhunter-paper-runtime/issue1396_terminal_transition.py \
            "$PORTAL_CONTROL_CONTAINER:/tmp/issue1396_terminal_transition.py"
          docker exec "$PORTAL_CONTROL_CONTAINER" \
            python /tmp/issue1396_terminal_transition.py final-api --expected-mode paper \
            > "$RUNNER_TEMP/issue1396-finalize/final-api.json"
          docker exec "$PORTAL_CONTROL_CONTAINER" rm -f /tmp/issue1396_terminal_transition.py || true
          python3 - "$RUNNER_TEMP/issue1396-finalize/final-api.json" \
            "$PAPER_CONTAINER_ID" "$PAPER_IMAGE_DIGEST" "$DESIRED_GENERATION_ID" \
            > "$RUNNER_TEMP/issue1396-finalize/finalize.json" <<'PY'
          import json,sys
          api=json.load(open(sys.argv[1],encoding="utf-8"))
          paper_id,image_digest,generation_id=sys.argv[2:5]
          truth=api["truth"]
          if truth["desired_generation"]["generation_id"]!=generation_id or truth["observed_generation"]["generation_id"]!=generation_id:
              raise SystemExit("post-cleanup canonical PAPER truth diverged")
          if truth["observed_generation"]["runtime_image_digest"]!=image_digest:
              raise SystemExit("post-cleanup image identity diverged")
          print(json.dumps({
              "result":"PASS","mode":"paper","desired_observed_equal":True,
              "generation_id":generation_id,"paper_container_id":paper_id,
              "paper_image_digest":image_digest,"old_shadow_removed":True,
              "legacy_shadow_observer_removed":True,
          },sort_keys=True))
          PY

      - name: Upload finalizer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue1396-terminal-finalizer-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/issue1396-finalize/finalize.json
            ${{ runner.temp }}/issue1396-finalize/final-api.json
            ${{ runner.temp }}/issue1396-finalize/rollback-metadata.json
            ${{ runner.temp }}/issue1396-finalize/rollback-request.json
            ${{ runner.temp }}/issue1396-finalize/rollback-stop.json
            ${{ runner.temp }}/issue1396-finalize/rollback-reconciled.json
            ${{ runner.temp }}/issue1396-finalize/rollback-final-api.json
