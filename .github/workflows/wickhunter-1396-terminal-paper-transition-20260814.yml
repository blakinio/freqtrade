          echo "PAPER_CONTAINER_ID=$paper_id" >> "$GITHUB_ENV"

      - name: Reconcile canonical observed generation to running PAPER
        shell: bash
        run: |
          set -euo pipefail
          docker cp "$RUNNER_TEMP/issue1396-production-health.json" \
            "$PORTAL_CONTROL_CONTAINER:/tmp/issue1396-production-health.json"
          docker exec "$PORTAL_CONTROL_CONTAINER" \
            python /tmp/issue1396_terminal_transition.py reconcile-running \
