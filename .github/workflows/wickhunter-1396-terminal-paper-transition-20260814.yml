          if p.get("status")!="success" or p.get("implementation_sha")!=sys.argv[2]:
              raise SystemExit("exact Portal deploy failed")
          if p.get("live_capital_authorized") is not False:
              raise SystemExit("Portal deploy unexpectedly authorized live capital")
          PY
          for container in "$PORTAL_CONTROL_CONTAINER" "$PORTAL_WEB_CONTAINER"; do
            image="$(docker inspect --format '{{.Image}}' "$container")"
            [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
