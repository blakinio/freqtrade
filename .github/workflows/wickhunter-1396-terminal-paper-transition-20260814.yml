          docker rm -f "$LEGACY_OBSERVER_CONTAINER" >/dev/null 2>&1 || true
          docker run --detach \
            --name "$LEGACY_OBSERVER_CONTAINER" \
            --restart unless-stopped \
            --network "$PORTAL_NETWORK" \
            --network-alias portal-wh09-runtime-observer \
            --user 10001:10001 \
            --group-add 65531 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env PORTAL_WICKHUNTER_WH09_ROOT=/runtime \
            --mount "type=bind,src=$OLD_SHADOW_JOURNAL_HOST,dst=/runtime/journal,readonly" \
            --mount "type=bind,src=$OLD_SHADOW_OPERATOR_HOST,dst=/runtime/operator,readonly" \
            --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()\"" \
            --health-interval 10s --health-timeout 5s --health-retries 12 \
