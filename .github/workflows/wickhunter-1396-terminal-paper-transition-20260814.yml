          for _ in $(seq 1 60); do
            h="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$LEGACY_OBSERVER_CONTAINER")"
            [[ "$h" == "healthy" ]] && break
            [[ "$h" =~ ^(unhealthy|exited|dead)$ ]] && { docker logs "$LEGACY_OBSERVER_CONTAINER"; exit 1; }
            sleep 2
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$LEGACY_OBSERVER_CONTAINER")" == "healthy" ]]
          docker cp "$RUNNER_TEMP/issue1396_terminal_transition.py" \
