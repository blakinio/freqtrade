          binding=build_candidate_paper_runtime_binding(candidate_root=Path('/runtime/candidate'),activation_root=root/'activations'/os.environ['ACTIVATION_NAME'])
          auth={'schema_version':'wickhunter-issue1396-paper-authorization-v2','authorization_id':'issue-1396-production-paper-owner-directed-v2','run_id':binding.request.run_id,'binding_id':binding.binding_id,'candidate_package_id':result.identity.package_id,'candidate_manifest_sha256':result.identity.manifest_sha256,'live_capital_authorized':False,'execution_enabled':False}
          auth_digest=canonical_sha256(auth)
          r=resolve_managed_runtime_mode(ManagedRuntimeModeRequest(mode=BotMode.PAPER,paper_activation_authorized=True,paper_authorization_id=auth['authorization_id'],paper_authorization_digest=auth_digest,paper_candidate_package_id=result.identity.package_id,paper_candidate_manifest_sha256=result.identity.manifest_sha256))
          zero={'trading_credentials_present':r.trading_credentials_present,'order_adapter_present':r.order_adapter_present,'execution_enabled':r.execution_enabled,'orders_submitted':r.orders_submitted,'live_capital_authorized':r.live_capital_authorized,'automatic_promotion_enabled':r.automatic_promotion_enabled}
          if zero!={'trading_credentials_present':False,'order_adapter_present':False,'execution_enabled':False,'orders_submitted':0,'live_capital_authorized':False,'automatic_promotion_enabled':False}:raise SystemExit('PAPER authority mismatch')
          config={'schema_version':'issue1396-production-paper-runtime-config-v2','implementation_sha':os.environ['IMPLEMENTATION_SHA'],'runtime_image_digest':os.environ['PAPER_IMAGE_DIGEST'],'run_id':binding.request.run_id,'binding_id':binding.binding_id,'candidate_package_id':result.identity.package_id,'candidate_manifest_sha256':result.identity.manifest_sha256,'public_market_base_url':'https://fapi.binance.com','poll_seconds':120,'maximum_source_age_ms':300000,'model_drift':'healthy','data_drift':'healthy','circuit_breaker_active':False,**zero}
          print(json.dumps({'run_id':binding.request.run_id,'binding_id':binding.binding_id,'candidate_package_id':result.identity.package_id,'candidate_manifest_sha256':result.identity.manifest_sha256,'authorization_id':auth['authorization_id'],'authorization_digest':auth_digest,'config_digest':canonical_sha256(config),**zero},sort_keys=True))
          PY
          activation_runner="$state_runner/activations/$activation_name"; journal_runner="$state_runner/journals/$activation_name"; operator_runner="$state_runner/operator/$activation_name"
          find "$activation_runner" -type d -exec chmod 0550 {} +; find "$activation_runner" -type f -exec chmod 0440 {} +
          find "$journal_runner" -type d -exec chmod 0750 {} +; find "$journal_runner" -type f -exec chmod 0640 {} +
