          [[ "$gateway_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker create --name "$PROD_PAPER_CONTAINER" --restart unless-stopped \
            --label "io.freqtrade.wickhunter.issue=1396" --label "io.freqtrade.wickhunter.bot=wickhunter" --label "io.freqtrade.wickhunter.mode=paper" \
            --label "io.freqtrade.wickhunter.binding=$PAPER_BINDING_ID" --label "org.opencontainers.image.revision=$IMPLEMENTATION_SHA" \
            --user 65532:65532 --group-add "$LIQUID20_READER_GID" --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true --memory 2g --cpus 2.0 --pids-limit 256 \
            --network "$PROD_INTERNAL_NETWORK" --add-host "fapi.binance.com:$gateway_ip" \
