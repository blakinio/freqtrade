      - name: Prove exact-generation restart and second reconciliation
        shell: bash
        run: |
          set -euo pipefail
          before_generation="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["generation"])' "$RUNNER_TEMP/issue1396-production-health.json")"
          before_checked="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["checked_at_ms"])' "$RUNNER_TEMP/issue1396-production-health.json")"
          before_id="$(docker inspect --format '{{.Id}}' "$PROD_PAPER_CONTAINER")"
          docker restart "$PROD_PAPER_CONTAINER" >/dev/null
          for _ in $(seq 1 120); do
            h="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$PROD_PAPER_CONTAINER")"
            if [[ "$h" == "healthy" && -f "$PROD_OPERATOR_HOST/health.json" ]]; then
              g="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["generation"])' "$PROD_OPERATOR_HOST/health.json")"
              t="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["checked_at_ms"])' "$PROD_OPERATOR_HOST/health.json")"
              if (( g > before_generation && t > before_checked )); then break; fi
            fi
            [[ "$h" =~ ^(unhealthy|exited|dead)$ ]] && { docker logs "$PROD_PAPER_CONTAINER"; exit 1; }
            sleep 10
          done
          after_id="$(docker inspect --format '{{.Id}}' "$PROD_PAPER_CONTAINER")"; [[ "$after_id" == "$before_id" && "$after_id" == "$PAPER_CONTAINER_ID" ]]
          [[ "$(docker inspect --format '{{.Image}}' "$PROD_PAPER_CONTAINER")" == "sha256:$PAPER_IMAGE_DIGEST" ]]
          cp "$PROD_OPERATOR_HOST/health.json" "$RUNNER_TEMP/issue1396-production-health-after-restart.json"
          docker exec "$PROD_PAPER_CONTAINER" python /app/deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py
          python3 - "$RUNNER_TEMP/issue1396-production-health.json" "$RUNNER_TEMP/issue1396-production-health-after-restart.json" "$PAPER_CONTAINER_ID" \
