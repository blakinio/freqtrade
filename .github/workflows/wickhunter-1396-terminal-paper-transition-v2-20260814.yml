            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= --env http_proxy= --env https_proxy= --env all_proxy= --env NO_PROXY=fapi.binance.com --env no_proxy=fapi.binance.com \
            --mount "type=bind,src=$candidate_host,dst=/runtime/candidate,readonly" --mount "type=bind,src=$PROD_ACTIVATION_HOST,dst=/runtime/activation,readonly" \
            --mount "type=bind,src=$LIQUID20_LIVE_HOST,dst=/runtime/liquid20,readonly" --mount "type=bind,src=$PROD_JOURNAL_HOST,dst=/runtime/journal" --mount "type=bind,src=$PROD_OPERATOR_HOST,dst=/runtime/operator" \
            --health-cmd "python /app/deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py" --health-interval 60s --health-timeout 10s --health-retries 3 --health-start-period 120s \
            "$PAPER_IMAGE" --candidate-root /runtime/candidate --activation-root /runtime/activation --journal-root /runtime/journal --liquid20-root /runtime/liquid20 --health-root /runtime/operator \
            --operator-commit "$IMPLEMENTATION_SHA" --public-market-base-url https://fapi.binance.com --poll-seconds 120 --maximum-source-age-ms 300000 \
            --model-drift healthy --data-drift healthy --circuit-breaker-active false --cycles 0 >/dev/null
          docker start "$PROD_PAPER_CONTAINER" >/dev/null
          for _ in $(seq 1 90); do
            h="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$PROD_PAPER_CONTAINER")"
            [[ "$h" == "healthy" ]] && break
            [[ "$h" =~ ^(unhealthy|exited|dead)$ ]] && { docker logs "$PROD_PAPER_CONTAINER"; exit 1; }
            sleep 10
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$PROD_PAPER_CONTAINER")" == "healthy" ]]
          docker exec "$PROD_PAPER_CONTAINER" python /app/deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py
          docker exec "$PROD_PAPER_CONTAINER" python -c "import socket;\ntry: socket.create_connection(('1.1.1.1',443),timeout=2)\nexcept OSError: pass\nelse: raise SystemExit('direct external egress unexpectedly available')"
          docker exec "$PROD_PAPER_CONTAINER" python -c "import json,urllib.request; o=urllib.request.build_opener(urllib.request.ProxyHandler({})); r=o.open(urllib.request.Request('https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT',headers={'Accept':'application/json'}),timeout=20); json.loads(r.read().decode())"
          paper_id="$(docker inspect --format '{{.Id}}' "$PROD_PAPER_CONTAINER")"; [[ "$paper_id" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(docker inspect --format '{{.Image}}' "$PROD_PAPER_CONTAINER")" == "sha256:$PAPER_IMAGE_DIGEST" ]]
          cp "$PROD_OPERATOR_HOST/health.json" "$RUNNER_TEMP/issue1396-production-health.json"
          python3 - "$RUNNER_TEMP/issue1396-production-health.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8')); zero={'protected_holdout_accessed':False,'automatic_promotion_enabled':False,'trading_credentials_present':False,'order_adapter_present':False,'execution_enabled':False,'orders_submitted':0,'live_capital_authorized':False}
          if p.get('status')!='healthy' or p.get('runtime_health')!='healthy':raise SystemExit('persistent PAPER is not healthy before desired mutation')
          for k,v in zero.items():
              if p.get(k)!=v:raise SystemExit(f'persistent PAPER authority mismatch: {k}')
          PY
          echo "PAPER_CONTAINER_ID=$paper_id" >> "$GITHUB_ENV"

      - name: Atomically author PAPER desired stop old SHADOW and reconcile observed PAPER
