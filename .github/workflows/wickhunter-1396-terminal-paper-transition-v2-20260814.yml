name: WickHunter #1396 terminal PAPER transition v2

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-1396-terminal-paper-transition-v2-20260814.yml"
      - "deploy/synology/wickhunter-paper-runtime/issue1396_terminal_transition_v2.py"

permissions:
  contents: read

concurrency:
  group: wickhunter-1396-terminal-paper-transition-v2-20260814
  cancel-in-progress: false

env:
  EXPECTED_BASE_SHA: 60f882b6c99d2409cde65a749098643c567049c4
  IMPLEMENTATION_SHA: 60f882b6c99d2409cde65a749098643c567049c4
  CANDIDATE_PACKAGE_NAME: wickhunter-wh09-candidate-materialization-20260808-r1-h900s-7b23a958fd4d
  EXPECTED_CANDIDATE_MANIFEST_SHA256: 9f5ba852e33915678ca085c2eeafbf526457a079ba8f6f2fb7c1097f1d20ab79
  RUNNER_STATE_ROOT: /var/lib/freqtrade-staging-state
  HOST_STATE_ROOT: /volume1/docker/freqtrade/state
  LIQUID20_LIVE_HOST: /volume1/docker/freqtrade-liquidations/data/live
  OLD_SHADOW_PROJECT: wickhunter-production-research-runtime
  OLD_SHADOW_SERVICE: wickhunter-production-research-runtime
  OLD_SHADOW_NETWORK: wickhunter-production-research-runtime_wickhunter-public-market-egress
  PORTAL_CONTROL_CONTAINER: freqtrade-portal-control-plane
  PORTAL_WEB_CONTAINER: freqtrade-portal-staging
  PORTAL_NETWORK: portal_oidc_public
  LEGACY_OBSERVER_CONTAINER: portal-wh09-runtime-observer
  PAPER_IMAGE: local/wickhunter-paper-runtime:sha-60f882b6c99d-issue1396-terminal-v2
  PROD_PAPER_CONTAINER: wickhunter-production-paper-runtime
  PROD_GATEWAY_CONTAINER: wickhunter-production-paper-egress
  PROD_INTERNAL_NETWORK: wickhunter-production-paper-internal
  SYFT_VERSION: "1.50.0"
  SYFT_LINUX_AMD64_SHA256: bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788
  GRYPE_VERSION: "0.116.1"
  GRYPE_LINUX_AMD64_SHA256: 0122df7b655981abe547ad3d2190d65551dac6a2bfc80b4dc2a989b5d0587458

jobs:
  transition:
    name: Healthy PAPER proof and stopped-SHADOW reconciliation
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 120
    outputs:
      production_payload_b64: ${{ steps.final.outputs.production_payload_b64 }}
      desired_generation_id: ${{ steps.final.outputs.desired_generation_id }}
      observed_generation_id: ${{ steps.final.outputs.observed_generation_id }}
      paper_container_id: ${{ steps.final.outputs.paper_container_id }}
      old_shadow_container_id: ${{ steps.final.outputs.old_shadow_container_id }}
      paper_image_digest: ${{ steps.final.outputs.paper_image_digest }}
      paper_config_digest: ${{ steps.final.outputs.paper_config_digest }}
    steps:
      - name: Check out exact request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prove bounded request and capture helper
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" == "$BASE_SHA" ]]
          [[ "$IMPLEMENTATION_SHA" == "$EXPECTED_BASE_SHA" ]]
          expected=$'A\t.github/workflows/wickhunter-1396-terminal-paper-transition-v2-20260814.yml\nA\tdeploy/synology/wickhunter-paper-runtime/issue1396_terminal_transition_v2.py'
          [[ "$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")" == "$expected" ]]
          [[ "$RUNNER_NAME_VALUE" == "freqtrade-synology-staging" ]]
          [[ "$RUNNER_OS_VALUE" == "Linux" ]]
          docker version >/dev/null
          test -S /var/run/docker.sock
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET \
            BINANCE_API_KEY BINANCE_API_SECRET BINANCE_SECRET_KEY \
            EXCHANGE_API_KEY EXCHANGE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            [[ -z "${!name:-}" ]] || { echo "forbidden trading credential environment: $name" >&2; exit 1; }
          done
          cp deploy/synology/wickhunter-paper-runtime/issue1396_terminal_transition_v2.py \
            "$RUNNER_TEMP/issue1396_terminal_transition_v2.py"
          python3 -m py_compile "$RUNNER_TEMP/issue1396_terminal_transition_v2.py"

      - name: Capture exact physically stopped legacy SHADOW
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(docker inspect --format '{{.State.Running}}' liquid20-live)" == "true" ]]
          [[ "$(docker inspect --format '{{.State.OOMKilled}}' liquid20-live)" == "false" ]]
          data_source="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Source}}{{end}}{{end}}' liquid20-live)"
          [[ "$data_source" == "/volume1/docker/freqtrade-liquidations/data" ]]
          [[ "$LIQUID20_LIVE_HOST" == "$data_source/live" ]]
          mapfile -t ids < <(
            docker ps -aq --no-trunc \
              --filter "label=com.docker.compose.project=$OLD_SHADOW_PROJECT" \
              --filter "label=com.docker.compose.service=$OLD_SHADOW_SERVICE" |
              sed '/^$/d'
          )
          [[ ${#ids[@]} -eq 1 ]]
          old_id="${ids[0]}"
          docker inspect "$old_id" > "$RUNNER_TEMP/issue1396-old-shadow-inspect.json"
          python3 - "$RUNNER_TEMP/issue1396-old-shadow-inspect.json" \
            > "$RUNNER_TEMP/issue1396-old-shadow.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))[0]
          labels=(p.get('Config') or {}).get('Labels') or {}; host=p.get('HostConfig') or {}; state=p.get('State') or {}
          if labels.get('com.docker.compose.project')!='wickhunter-production-research-runtime':raise SystemExit('old SHADOW project mismatch')
          if labels.get('com.docker.compose.service')!='wickhunter-production-research-runtime':raise SystemExit('old SHADOW service mismatch')
          if (p.get('Config') or {}).get('User')!='65531:65531':raise SystemExit('old SHADOW user mismatch')
          if state.get('Running') is not False or state.get('Status')!='exited':raise SystemExit('old SHADOW is not physically stopped')
          if state.get('OOMKilled') is not False:raise SystemExit('old SHADOW was OOM-killed')
          if host.get('ReadonlyRootfs') is not True or host.get('Privileged') is not False:raise SystemExit('old SHADOW hardening mismatch')
          if 'ALL' not in (host.get('CapDrop') or []):raise SystemExit('old SHADOW cap-drop mismatch')
          if not any('no-new-privileges' in x for x in (host.get('SecurityOpt') or [])):raise SystemExit('old SHADOW no-new-privileges missing')
          image=p.get('Image','')
          if not image.startswith('sha256:') or len(image)!=71:raise SystemExit('old SHADOW image identity invalid')
          mounts={m.get('Destination'):m for m in p.get('Mounts') or []}
          print(json.dumps({
              'container_id':p['Id'],'image_digest':image.removeprefix('sha256:'),
              'image_revision':labels.get('org.opencontainers.image.revision'),
              'exit_code':state.get('ExitCode'),'oom_killed':False,'running':False,'docker_state':'exited',
              'journal_host':(mounts.get('/runtime/journal') or {}).get('Source'),
              'operator_host':(mounts.get('/runtime/operator') or {}).get('Source'),
          },sort_keys=True))
          PY
          python3 - "$RUNNER_TEMP/issue1396-old-shadow.json" >> "$GITHUB_ENV" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          print(f"OLD_SHADOW_CONTAINER_ID={p['container_id']}")
          print(f"OLD_SHADOW_IMAGE_DIGEST={p['image_digest']}")
          PY

      - name: Check out exact protected implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: 60f882b6c99d2409cde65a749098643c567049c4

      - name: Build and inspect exact current PAPER image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$IMPLEMENTATION_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          docker image rm -f "$PAPER_IMAGE" >/dev/null 2>&1 || true
          set +e
          docker build --pull \
            --file deploy/synology/wickhunter-paper-runtime/Dockerfile \
            --build-arg "OPERATOR_COMMIT=$IMPLEMENTATION_SHA" \
            --label "org.opencontainers.image.revision=$IMPLEMENTATION_SHA" \
            --tag "$PAPER_IMAGE" . 2>&1 | tee "$RUNNER_TEMP/issue1396-paper-image-build.log"
          build_exit=${PIPESTATUS[0]}
          set -e
          if [[ "$build_exit" != "0" ]]; then
            grep -F "DeadlineExceeded: context deadline exceeded" "$RUNNER_TEMP/issue1396-paper-image-build.log" >/dev/null || exit "$build_exit"
            echo "Docker client deadline after materialization; enforcing exact image postconditions" >&2
          fi
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$PAPER_IMAGE")" == "$IMPLEMENTATION_SHA" ]]
          [[ "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$PAPER_IMAGE")" == '["python","-m","ai_platform.wickhunter.candidate_paper_runtime_parity_supervisor"]' ]]
          image_id="$(docker image inspect --format '{{.Id}}' "$PAPER_IMAGE")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "PAPER_IMAGE_DIGEST=${image_id#sha256:}" >> "$GITHUB_ENV"
          reader_gid="$(docker run --rm --read-only --entrypoint stat \
            --mount "type=bind,src=$LIQUID20_LIVE_HOST,dst=/runtime/liquid20,readonly" \
            "$PAPER_IMAGE" -c %g /runtime/liquid20)"
          [[ "$reader_gid" =~ ^[0-9]+$ ]]
          echo "LIQUID20_READER_GID=$reader_gid" >> "$GITHUB_ENV"

      - name: Create disposable exact-head PAPER proof activation
        shell: bash
        run: |
          set -euo pipefail
          umask 027
          state_name="issue1396-proof-v2-${IMPLEMENTATION_SHA:0:12}-${GITHUB_RUN_ID}"
          activation_name="wickhunter-proof-v2-${IMPLEMENTATION_SHA:0:12}-${GITHUB_RUN_ID}"
          candidate_runner="$RUNNER_STATE_ROOT/wickhunter-candidate-materialization/packages/$CANDIDATE_PACKAGE_NAME"
          candidate_host="$HOST_STATE_ROOT/wickhunter-candidate-materialization/packages/$CANDIDATE_PACKAGE_NAME"
          state_runner="$RUNNER_STATE_ROOT/wickhunter-paper-runtime/$state_name"
          state_host="$HOST_STATE_ROOT/wickhunter-paper-runtime/$state_name"
          [[ -d "$candidate_runner" && ! -L "$candidate_runner" ]]
          [[ ! -e "$state_runner" && ! -L "$state_runner" ]]
          install -d -m 0750 -o 65532 -g 65532 \
            "$state_runner" "$state_runner/activations" "$state_runner/journals" "$state_runner/operator" \
            "$state_runner/operator/$activation_name"
          docker run --rm --interactive --user 65532:65532 --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount "type=bind,src=$candidate_host,dst=/runtime/candidate,readonly" \
            --mount "type=bind,src=$state_host,dst=/runtime/state" \
            --env "ACTIVATION_NAME=$activation_name" --env EXPECTED_CANDIDATE_MANIFEST_SHA256 \
            --entrypoint python "$PAPER_IMAGE" - <<'PY' \
            | tee "$RUNNER_TEMP/issue1396-proof-activation.json"
          import json,os,time
          from pathlib import Path
          from ai_platform.wickhunter.candidate_runtime_activation import activate_verified_runtime_candidate
          from ai_platform.wickhunter.candidate_runtime_binding import build_candidate_paper_runtime_binding
          from ai_platform.wickhunter.canonical import canonical_sha256
          from ai_platform.wickhunter.contracts import BotMode
          from ai_platform.wickhunter.runtime_mode import ManagedRuntimeModeRequest,resolve_managed_runtime_mode
          root=Path('/runtime/state')
          result=activate_verified_runtime_candidate(candidate_root=Path('/runtime/candidate'),activation_root=root/'activations'/os.environ['ACTIVATION_NAME'],created_at_ms=time.time_ns()//1_000_000,bot_instance='wickhunter-issue1396-proof-v2',mode=BotMode.PAPER,wh08_consumer_version='wickhunter-portal-consumer-v1',window_duration_ms=90_000_000)
          if result.identity.manifest_sha256!=os.environ['EXPECTED_CANDIDATE_MANIFEST_SHA256']:raise SystemExit('candidate manifest mismatch')
          binding=build_candidate_paper_runtime_binding(candidate_root=Path('/runtime/candidate'),activation_root=root/'activations'/os.environ['ACTIVATION_NAME'])
          auth={'schema_version':'issue1396-proof-v2','authorization_id':'issue1396-proof-v2','run_id':binding.request.run_id,'binding_id':binding.binding_id,'candidate_package_id':result.identity.package_id,'candidate_manifest_sha256':result.identity.manifest_sha256,'execution_enabled':False,'live_capital_authorized':False}
          digest=canonical_sha256(auth)
          r=resolve_managed_runtime_mode(ManagedRuntimeModeRequest(mode=BotMode.PAPER,paper_activation_authorized=True,paper_authorization_id=auth['authorization_id'],paper_authorization_digest=digest,paper_candidate_package_id=result.identity.package_id,paper_candidate_manifest_sha256=result.identity.manifest_sha256))
          zero={'automatic_promotion_enabled':r.automatic_promotion_enabled,'trading_credentials_present':r.trading_credentials_present,'order_adapter_present':r.order_adapter_present,'execution_enabled':r.execution_enabled,'orders_submitted':r.orders_submitted,'live_capital_authorized':r.live_capital_authorized}
          if zero!={'automatic_promotion_enabled':False,'trading_credentials_present':False,'order_adapter_present':False,'execution_enabled':False,'orders_submitted':0,'live_capital_authorized':False}:raise SystemExit('proof authority mismatch')
          print(json.dumps({'run_id':binding.request.run_id,'binding_id':binding.binding_id,'candidate_package_id':result.identity.package_id,'candidate_manifest_sha256':result.identity.manifest_sha256,'authorization_digest':digest,**zero},sort_keys=True))
          PY
          activation_runner="$state_runner/activations/$activation_name"
          journal_runner="$state_runner/journals/$activation_name"
          operator_runner="$state_runner/operator/$activation_name"
          find "$activation_runner" -type d -exec chmod 0550 {} +
          find "$activation_runner" -type f -exec chmod 0440 {} +
          find "$journal_runner" -type d -exec chmod 0750 {} +
          find "$journal_runner" -type f -exec chmod 0640 {} +
          chown -R 65532:65532 "$journal_runner" "$operator_runner"
          {
            echo "PROOF_STATE_RUNNER=$state_runner"
            echo "PROOF_ACTIVATION_HOST=$state_host/activations/$activation_name"
            echo "PROOF_JOURNAL_HOST=$state_host/journals/$activation_name"
            echo "PROOF_OPERATOR_HOST=$state_host/operator/$activation_name"
          } >> "$GITHUB_ENV"

      - name: Run five natural exact-head PAPER cycles
        shell: bash
        run: |
          set -euo pipefail
          network="issue1396-proof-v2-net-${GITHUB_RUN_ID}"
          gateway="issue1396-proof-v2-egress-${GITHUB_RUN_ID}"
          operator="issue1396-proof-v2-runtime-${GITHUB_RUN_ID}"
          echo "PROOF_NETWORK=$network" >> "$GITHUB_ENV"
          echo "PROOF_GATEWAY=$gateway" >> "$GITHUB_ENV"
          echo "PROOF_OPERATOR=$operator" >> "$GITHUB_ENV"
          docker network create --internal "$network" >/dev/null
          code="$(cat <<'PY'
          import socket,socketserver,threading
          TARGET=('fapi.binance.com',443)
          class S(socketserver.ThreadingMixIn,socketserver.TCPServer):daemon_threads=True;allow_reuse_address=True
          class H(socketserver.BaseRequestHandler):
              @staticmethod
              def pump(a,b):
                  try:
                      while True:
                          x=a.recv(65536)
                          if not x:return
                          b.sendall(x)
                  except OSError:return
                  finally:
                      try:b.shutdown(socket.SHUT_WR)
                      except OSError:pass
              def handle(self):
                  r=socket.create_connection(TARGET,timeout=15)
                  try:
                      t=threading.Thread(target=self.pump,args=(self.request,r),daemon=True);t.start();self.pump(r,self.request);t.join(timeout=5)
                  finally:r.close()
          S(('0.0.0.0',443),H).serve_forever()
          PY
          )"
          docker create --name "$gateway" --init --user 0:0 --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true --memory 256m --network bridge --entrypoint python "$PAPER_IMAGE" -c "$code" >/dev/null
          docker network connect "$network" "$gateway"
          docker start "$gateway" >/dev/null
          sleep 2
          ip="$(docker inspect --format "{{with index .NetworkSettings.Networks \"$network\"}}{{.IPAddress}}{{end}}" "$gateway")"
          [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          candidate_host="$HOST_STATE_ROOT/wickhunter-candidate-materialization/packages/$CANDIDATE_PACKAGE_NAME"
          docker run --name "$operator" --user 65532:65532 --group-add "$LIQUID20_READER_GID" --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 2g --network "$network" --add-host "fapi.binance.com:$ip" \
            --env "OPERATOR_COMMIT=$IMPLEMENTATION_SHA" --env HEALTH_PATH=/runtime/operator/health.json --env HEALTH_MAX_AGE_SECONDS=1200 \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= --env http_proxy= --env https_proxy= --env all_proxy= \
            --mount "type=bind,src=$candidate_host,dst=/runtime/candidate,readonly" \
            --mount "type=bind,src=$PROOF_ACTIVATION_HOST,dst=/runtime/activation,readonly" \
            --mount "type=bind,src=$LIQUID20_LIVE_HOST,dst=/runtime/liquid20,readonly" \
            --mount "type=bind,src=$PROOF_JOURNAL_HOST,dst=/runtime/journal" \
            --mount "type=bind,src=$PROOF_OPERATOR_HOST,dst=/runtime/operator" \
            "$PAPER_IMAGE" --candidate-root /runtime/candidate --activation-root /runtime/activation \
            --journal-root /runtime/journal --liquid20-root /runtime/liquid20 --health-root /runtime/operator \
            --operator-commit "$IMPLEMENTATION_SHA" --public-market-base-url https://fapi.binance.com \
            --poll-seconds 120 --maximum-source-age-ms 300000 --model-drift healthy --data-drift healthy \
            --circuit-breaker-active false --cycles 5 \
            2>&1 | tee "$RUNNER_TEMP/issue1396-proof-operator.log"

      - name: Verify genuinely healthy 5/5 proof
        shell: bash
        run: |
          set -euo pipefail
          candidate_host="$HOST_STATE_ROOT/wickhunter-candidate-materialization/packages/$CANDIDATE_PACKAGE_NAME"
          docker run --rm --user 65532:65532 --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=bind,src=$candidate_host,dst=/runtime/candidate,readonly" \
            --mount "type=bind,src=$PROOF_ACTIVATION_HOST,dst=/runtime/activation,readonly" \
            --mount "type=bind,src=$PROOF_JOURNAL_HOST,dst=/runtime/journal,readonly" \
            --mount "type=bind,src=$PROOF_OPERATOR_HOST,dst=/runtime/operator,readonly" \
            --env "OPERATOR_COMMIT=$IMPLEMENTATION_SHA" --entrypoint python "$PAPER_IMAGE" - <<'PY' \
            | tee "$RUNNER_TEMP/issue1396-proof.json"
          import json,os
          from decimal import Decimal
          from pathlib import Path
          from ai_platform.wickhunter.candidate_paper_runtime_operator import _runtime_policy
          from ai_platform.wickhunter.candidate_paper_runtime_service import CandidatePaperRuntimeJournal
          from ai_platform.wickhunter.candidate_paper_runtime_supervisor import CycleTelemetryStore
          from ai_platform.wickhunter.candidate_runtime_binding import build_candidate_paper_runtime_binding
          binding=build_candidate_paper_runtime_binding(candidate_root=Path('/runtime/candidate'),activation_root=Path('/runtime/activation'))
          obs=CandidatePaperRuntimeJournal(Path('/runtime/journal'),binding,_runtime_policy()).observations()
          telem=CycleTelemetryStore(path=Path('/runtime/operator/cycle-telemetry.json'),binding_id=binding.binding_id,run_id=binding.request.run_id,operator_commit=os.environ['OPERATOR_COMMIT'])._load_verified()
          rec=telem.get('records')
          if len(obs)!=5 or not isinstance(rec,list) or len(rec)!=5 or telem.get('last_sequence')!=5:raise SystemExit('proof is not exactly 5/5')
          if any(x.get('outcome')!='success' for x in rec):raise SystemExit('proof contains failed cycle')
          gaps=[b.observed_at_ms-a.observed_at_ms for a,b in zip(obs,obs[1:])]; gap=max(gaps,default=0)
          samples=sum(x.source_count for x in obs);fresh=sum(x.fresh_source_count for x in obs);ratio=Decimal(fresh)/Decimal(samples) if samples else Decimal(0)
          if gap>1_800_000 or ratio<Decimal('0.99'):raise SystemExit('proof freshness failed')
          health=json.loads(Path('/runtime/operator/health.json').read_text(encoding='utf-8'))
          zero={'protected_holdout_accessed':False,'automatic_promotion_enabled':False,'trading_credentials_present':False,'order_adapter_present':False,'execution_enabled':False,'orders_submitted':0,'live_capital_authorized':False}
          if health.get('status')!='healthy' or health.get('runtime_health')!='healthy':raise SystemExit('proof runtime is not genuinely healthy')
          for k,v in zero.items():
              if health.get(k)!=v or any(x.get(k)!=v for x in rec):raise SystemExit(f'proof authority mismatch: {k}')
          print(json.dumps({'result':'PASS','implementation_sha':os.environ['OPERATOR_COMMIT'],'observation_count':5,'telemetry_record_count':5,'successful_outcomes':5,'maximum_gap_ms':gap,'fresh_source_ratio':str(ratio),'runtime_health':'healthy','run_id':binding.request.run_id,'binding_id':binding.binding_id,**zero},sort_keys=True))
          PY
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=bind,src=$PROOF_OPERATOR_HOST,dst=/runtime/operator,readonly" \
            --env HEALTH_PATH=/runtime/operator/health.json --env "OPERATOR_COMMIT=$IMPLEMENTATION_SHA" --env HEALTH_MAX_AGE_SECONDS=1200 \
            --entrypoint python "$PAPER_IMAGE" /app/deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py

      - name: Cleanup disposable proof
        if: always()
        shell: bash
        run: |
          docker rm -f "${PROOF_OPERATOR:-missing}" "${PROOF_GATEWAY:-missing}" >/dev/null 2>&1 || true
          [[ -z "${PROOF_NETWORK:-}" ]] || docker network rm "$PROOF_NETWORK" >/dev/null 2>&1 || true
          if [[ -n "${PROOF_STATE_RUNNER:-}" && -e "$PROOF_STATE_RUNNER" ]]; then
            case "$PROOF_STATE_RUNNER" in "$RUNNER_STATE_ROOT"/wickhunter-paper-runtime/issue1396-proof-v2-*) ;; *) exit 1 ;; esac
            rm -rf --one-file-system "$PROOF_STATE_RUNNER"
          fi

      - name: Install pinned Portal supply-chain tools
        shell: bash
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/portal-tools"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/syft.tar.gz"
          echo "${SYFT_LINUX_AMD64_SHA256}  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check --strict
