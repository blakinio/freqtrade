          print(json.dumps({'same_runtime_instance':True,'runtime_instance_id':sys.argv[3],'before_generation':a['generation'],'after_generation':b['generation'],'before_checked_at_ms':a['checked_at_ms'],'after_checked_at_ms':b['checked_at_ms'],'health_sha256':b['health_sha256']},sort_keys=True))
          PY
          docker cp "$RUNNER_TEMP/issue1396-production-health-after-restart.json" "$PORTAL_CONTROL_CONTAINER:/tmp/issue1396-production-health-after-restart.json"
          docker exec "$PORTAL_CONTROL_CONTAINER" python /tmp/issue1396_terminal_transition_v2.py reconcile-running \
            --generation-id "$PAPER_GENERATION_ID" --runtime-instance-id "$PAPER_CONTAINER_ID" --health-json /tmp/issue1396-production-health-after-restart.json \
            --source-version "$IMPLEMENTATION_SHA" --evidence-kind issue1396-paper-restart-running-v2 --actor-id system-issue1396-paper-restart-reconciler-v2 \
            > "$RUNNER_TEMP/issue1396-paper-restart-observation.json"

