            > "$RUNNER_TEMP/issue1396-production-api.json"
          python3 - "$RUNNER_TEMP/issue1396-production-api.json" "$RUNNER_TEMP/issue1396-production-health-after-restart.json" \
            "$RUNNER_TEMP/issue1396-proof.json" "$RUNNER_TEMP/issue1396-restart-proof.json" "$RUNNER_TEMP/issue1396-old-shadow.json" \
