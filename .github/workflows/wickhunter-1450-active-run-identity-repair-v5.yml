name: WickHunter PR1450 active-run identity repair v5

on:
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/wickhunter-1450-active-run-identity-repair-v5.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: [freqtrade-staging]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile and reuse structural patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin develop
          base="$(git merge-base HEAD origin/develop)"
          changed="$(git diff --name-only "$base"..origin/develop)"
          for owned in ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md; do
            if printf '%s\n' "$changed" | grep -Fxq "$owned"; then echo "develop overlap on $owned" >&2; exit 42; fi
          done
          git merge --no-ff -m "chore(wickhunter): reconcile PR 1450 with current develop" origin/develop
          printf 'DEVELOP_HEAD=%s\n' "$(git rev-parse origin/develop)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          w = Path('.github/workflows/wickhunter-1450-active-run-identity-repair-v4.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Validate focused repair\n"
          start = w.index(start_marker) + len(start_marker)
          end = w.index(end_marker, start)
          lines = w[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/wh1450-active-run-patch.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/wh1450-active-run-patch.py

      - name: Validate focused repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check pytest "pydantic>=2.2" "SQLAlchemy>=2.0.6" "httpx>=0.24.1" fastapi pyjwt cryptography "PyYAML>=6.0" lightgbm websockets ruff==0.15.20
          python3 -m ruff format ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m py_compile ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m ruff check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m ruff format --check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          git diff --check

      - name: Commit product checkpoint and cleanup
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git commit -m "fix(liquidations): revalidate active run before publish"
          product_head="$(git rev-parse HEAD)"
          PRODUCT_HEAD="$product_head" python3 - <<'PY'
          import os, re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p = Path("docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md")
          t = p.read_text(encoding="utf-8")
          h, run, dev = os.environ["PRODUCT_HEAD"], os.environ["RUN_ID"], os.environ["DEVELOP_HEAD"]
          now = datetime.now(ZoneInfo("Europe/Warsaw")).replace(microsecond=0).isoformat()
          t = re.sub(r"updated_at: [^\n]+", f"updated_at: {now}", t, count=1)
          t = re.sub(r"head: [0-9a-f]{40}\nbranch: fix/wickhunter-1396-synology-recovery-v2", f"head: {h}\nbranch: fix/wickhunter-1396-synology-recovery-v2", t, count=1)
          t = t.replace("  - final exact-head PR 1450 ci:full result after root-identity repair and current-develop reconciliation\n", "  - final exact-head PR 1450 ci:full result after active-run identity repair and current-develop reconciliation\n", 1)
          needle = "final reconciliation merged current develop 2e7a99f6693469c0f8a009a2c8d00056fc817674 before exact-head validation"
          t = t.replace(needle, needle + f"; active-run identity now revalidates canonical runs/<run_id> against the retained run descriptor before state and pointer publication; focused validation run {run} passed; current develop {dev} reconciled without owned-path overlap", 1)
          t = t.replace("next_action: Run final exact-head PR 1450 ci:full and fresh Codex review after root-identity repair; if green, squash-merge and continue canonical Liquid20 deployment plus guarded completed-history repair.", "next_action: Run final exact-head PR 1450 ci:full and fresh Codex review after active-run identity repair; if green, squash-merge and continue canonical Liquid20 deployment plus guarded completed-history repair.", 1)
          t = t.replace("  generation: 19\n", "  generation: 20\n", 1)
          t = re.sub(r"  checkpointed_at: [^\n]+", f"  checkpointed_at: {now}", t, count=1)
          t = re.sub(r"  last_progress_at: [^\n]+", f"  last_progress_at: {now}", t, count=1)
          t = t.replace("  phase: pr1450_final_validation\n", "  phase: pr1450_active_run_identity_revalidation\n", 1)
          t = re.sub(r"  exact_head_before_checkpoint_commit: [0-9a-f]{40}", f"  exact_head_before_checkpoint_commit: {h}", t, count=1)
          t = t.replace("  active_operation: final exact-head ci:full and independent review after root-identity repair and current-develop reconciliation\n", "  active_operation: final exact-head ci:full and independent review after active-run identity repair and current-develop reconciliation\n", 1)
          t = t.replace("  next_action: Complete final exact-head ci:full plus fresh Codex review on PR 1450, then squash-merge and continue canonical Liquid20 recovery.", "  next_action: Complete final exact-head ci:full plus fresh Codex review after active-run identity repair on PR 1450, then squash-merge and continue canonical Liquid20 recovery.", 1)
          p.write_text(t, encoding="utf-8")
          PY
          python3 tools/agents/checkpoint.py docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md --require-checkpoint
          git add docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md
          for f in .github/workflows/wickhunter-1450-active-run-identity-repair.yml .github/workflows/wickhunter-1450-active-run-identity-repair-selfhosted.yml .github/workflows/wickhunter-1450-active-run-identity-repair-v2.yml .github/workflows/wickhunter-1450-active-run-identity-repair-v3.yml .github/workflows/wickhunter-1450-active-run-identity-repair-v4.yml .github/workflows/wickhunter-1450-active-run-identity-repair-v5.yml; do [[ -f "$f" ]] && git rm "$f" || true; done
          git diff --cached --check
          git commit -m "docs(wickhunter): checkpoint active-run identity repair"
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
