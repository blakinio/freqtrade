name: WickHunter PR1450 active-run identity repair v7

on:
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/wickhunter-1450-active-run-identity-repair-v7.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 0
          persist-credentials: false

      - name: Reconcile current develop and apply active-run identity repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin develop
          git merge --no-ff --no-commit origin/develop || true
          if git diff --name-only --diff-filter=U | grep -q .; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            while IFS= read -r path; do
              case "$path" in
                docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md) git rm -- "$path" ;;
                *) echo "unexpected merge conflict: $path" >&2; exit 42 ;;
              esac
            done <<< "$conflicts"
          fi
          git commit -m "chore(wickhunter): reconcile PR 1450 with current develop"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ai_platform/scripts/liquidation_live_stream.py")
          lines = p.read_text(encoding="utf-8").splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith("def _assert_runtime_roots_still_anchored("))
          end = next(i for i in range(start + 1, len(lines)) if lines[i].startswith("def _read_json_regular_at("))
          helper = [
              "def _assert_runtime_roots_still_anchored(", "    *,", "    data_root: Path,", "    live_fd: int,", "    runs_fd: int,",
              "    run_id: str | None = None,", "    run_fd: int | None = None,", ") -> None:",
              "    if (run_id is None) != (run_fd is None):", "        raise ValueError(\"run_id and run_fd must be provided together\")",
              "    flags = _secure_directory_flags()", "    opened: list[int] = []", "    try:", "        data_fd = os.open(data_root, flags)",
              "        opened.append(data_fd)", "        current_live_fd = os.open(\"live\", flags, dir_fd=data_fd)", "        opened.append(current_live_fd)",
              "        current_runs_fd = os.open(\"runs\", flags, dir_fd=current_live_fd)", "        opened.append(current_runs_fd)",
              "        comparisons = [(live_fd, current_live_fd), (runs_fd, current_runs_fd)]", "        if run_id is not None and run_fd is not None:",
              "            current_run_fd = os.open(run_id, flags, dir_fd=current_runs_fd)", "            opened.append(current_run_fd)",
              "            comparisons.append((run_fd, current_run_fd))", "        for anchored_fd, current_fd in comparisons:",
              "            anchored = os.fstat(anchored_fd)", "            current = os.fstat(current_fd)",
              "            if (anchored.st_dev, anchored.st_ino) != (current.st_dev, current.st_ino):",
              "                raise RuntimeError(\"Liquid20 runtime roots changed after anchoring\")", "    except OSError as exc:",
              "        raise RuntimeError(\"Liquid20 runtime roots changed after anchoring\") from exc", "    finally:",
              "        for descriptor in reversed(opened):", "            os.close(descriptor)", "", "",
          ]
          lines[start:end] = helper
          targets = []
          for i, line in enumerate(lines):
              if line != "        _assert_runtime_roots_still_anchored(":
                  continue
              j = i + 1
              while j < len(lines) and lines[j] != "        )":
                  j += 1
              block = lines[i:j + 1]
              if "            data_root=self.data_root," in block and "            runs_fd=runs_fd," in block and "            run_fd=run_fd," not in block:
                  targets.append(j)
          if len(targets) != 2:
              raise SystemExit(f"unexpected write-state root guard count: {len(targets)}")
          for j in reversed(targets):
              lines[j:j] = ["            run_id=self.run_id,", "            run_fd=run_fd,"]
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          tp = Path("tests/ai_platform_integration/test_liquidation_live_restart_durability.py")
          t = tp.read_text(encoding="utf-8")
          if "def test_new_run_creation_fails_closed_after_active_run_path_swap(" not in t:
              marker = "def test_restart_rejects_symlinked_run_root_without_mutating_external_target("
              idx = t.index(marker)
              regression = "\n".join([
                  "def test_new_run_creation_fails_closed_after_active_run_path_swap(tmp_path: Path) -> None:",
                  "    live_root = tmp_path / \"live\"", "    manager = OkxLiveRunManager(", "        data_root=tmp_path,",
                  "        collector_commit=\"e\" * 40,", "        host_id=\"synology-test\",", "        now_ms=lambda: 1_786_384_683_792,", "    )",
                  "    original_start_new_run = manager._start_new_run", "    detached_run: Path | None = None", "",
                  "    def start_and_swap_active_run(now_ms: int) -> None:", "        nonlocal detached_run", "        original_start_new_run(now_ms)",
                  "        canonical_run = manager.run_root", "        detached_run = canonical_run.with_name(f\"{canonical_run.name}-anchored\")",
                  "        canonical_run.rename(detached_run)", "        canonical_run.mkdir(mode=0o750)", "",
                  "    manager._start_new_run = start_and_swap_active_run  # type: ignore[method-assign]",
                  "    with pytest.raises(RuntimeError, match=\"Liquid20 runtime roots changed after anchoring\"):", "        asyncio.run(manager.start())",
                  "    assert detached_run is not None", "    assert list(manager.run_root.iterdir()) == []", "    assert not (live_root / LIVE_STATE_FILE).exists()",
                  "    assert (detached_run / \"bybit-linear.ndjson\").is_file()", "    assert (detached_run / \"binance-usdm.ndjson\").is_file()",
                  "    assert (detached_run / \"okx-swap.ndjson\").is_file()", "    assert not (detached_run / \"run-state-v1.json\").exists()", "", "",
              ])
              t = t[:idx] + regression + t[idx:]
          tp.write_text(t, encoding="utf-8")
          PY

      - name: Install isolated focused tools
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/wickhunter-1450-v7-deps"
          rm -rf "$deps" && mkdir -p "$deps"
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o "$RUNNER_TEMP/get-pip.py"
          python3 "$RUNNER_TEMP/get-pip.py" --target "$deps"
          PYTHONPATH="$deps" python3 -m pip install --disable-pip-version-check --upgrade --target "$deps" websockets==16.0 pytest==9.1.1 ruff==0.15.21
          echo "PYTHONPATH=$deps${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Validate exact repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff format ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m ruff check --fix ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m py_compile ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff check ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff format --check ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          git diff --check

      - name: Commit repair and remove temporary workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git commit -m "fix(liquidations): revalidate active run before publish"
          for f in .github/workflows/wickhunter-1450-active-run-identity-repair{,-selfhosted,-v2,-v3,-v4,-v5,-v6,-v7}.yml; do [[ -f "$f" ]] && git rm "$f" || true; done
          git diff --cached --check
          git commit -m "chore(wickhunter): remove temporary repair workflows"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
