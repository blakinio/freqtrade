name: WickHunter PR1450 active-run identity repair

on:
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/wickhunter-1450-active-run-identity-repair.yml

permissions:
  contents: write

concurrency:
  group: wickhunter-1450-active-run-identity-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded active-run identity repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("ai_platform/scripts/liquidation_live_stream.py")
          source = source_path.read_text(encoding="utf-8")
          start = source.index("def _assert_runtime_roots_still_anchored(")
          end = source.index("\ndef _read_json_regular_at(", start)
          replacement = '''def _assert_runtime_roots_still_anchored(
              *,
              data_root: Path,
              live_fd: int,
              runs_fd: int,
              run_id: str | None = None,
              run_fd: int | None = None,
          ) -> None:
              if (run_id is None) != (run_fd is None):
                  raise ValueError("run_id and run_fd must be provided together")
              flags = _secure_directory_flags()
              opened: list[int] = []
              try:
                  data_fd = os.open(data_root, flags)
                  opened.append(data_fd)
                  current_live_fd = os.open("live", flags, dir_fd=data_fd)
                  opened.append(current_live_fd)
                  current_runs_fd = os.open("runs", flags, dir_fd=current_live_fd)
                  opened.append(current_runs_fd)
                  comparisons = [
                      (live_fd, current_live_fd),
                      (runs_fd, current_runs_fd),
                  ]
                  if run_id is not None and run_fd is not None:
                      current_run_fd = os.open(run_id, flags, dir_fd=current_runs_fd)
                      opened.append(current_run_fd)
                      comparisons.append((run_fd, current_run_fd))
                  for anchored_fd, current_fd in comparisons:
                      anchored = os.fstat(anchored_fd)
                      current = os.fstat(current_fd)
                      if (anchored.st_dev, anchored.st_ino) != (current.st_dev, current.st_ino):
                          raise RuntimeError("Liquid20 runtime roots changed after anchoring")
              except OSError as exc:
                  raise RuntimeError("Liquid20 runtime roots changed after anchoring") from exc
              finally:
                  for descriptor in reversed(opened):
                      os.close(descriptor)
          '''.replace("          ", "").rstrip("\n")
          source = source[:start] + replacement + source[end:]

          old_guard = '''        _assert_runtime_roots_still_anchored(
              data_root=self.data_root,
              live_fd=live_fd,
              runs_fd=runs_fd,
          )'''.replace("              ", "            ")
          new_guard = '''        _assert_runtime_roots_still_anchored(
              data_root=self.data_root,
              live_fd=live_fd,
              runs_fd=runs_fd,
              run_id=self.run_id,
              run_fd=run_fd,
          )'''.replace("              ", "            ")
          if source.count(old_guard) != 2:
              raise SystemExit(f"unexpected root guard count: {source.count(old_guard)}")
          source = source.replace(old_guard, new_guard)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/ai_platform_integration/test_liquidation_live_restart_durability.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "\ndef test_restart_rejects_symlinked_run_root_without_mutating_external_target(\n"
          if tests.count(marker) != 1:
              raise SystemExit("unexpected active-run regression insertion marker")
          regression = r'''
          def test_new_run_creation_fails_closed_after_active_run_path_swap(tmp_path: Path) -> None:
              live_root = tmp_path / "live"
              manager = OkxLiveRunManager(
                  data_root=tmp_path,
                  collector_commit="e" * 40,
                  host_id="synology-test",
                  now_ms=lambda: 1_786_384_683_792,
              )
              original_start_new_run = manager._start_new_run
              detached_run: Path | None = None

              def start_and_swap_active_run(now_ms: int) -> None:
                  nonlocal detached_run
                  original_start_new_run(now_ms)
                  canonical_run = manager.run_root
                  detached_run = canonical_run.with_name(f"{canonical_run.name}-anchored")
                  canonical_run.rename(detached_run)
                  canonical_run.mkdir(mode=0o750)

              manager._start_new_run = start_and_swap_active_run  # type: ignore[method-assign]

              with pytest.raises(RuntimeError, match="Liquid20 runtime roots changed after anchoring"):
                  asyncio.run(manager.start())

              assert detached_run is not None
              assert list(manager.run_root.iterdir()) == []
              assert not (live_root / LIVE_STATE_FILE).exists()
              assert (detached_run / "bybit-linear.ndjson").is_file()
              assert (detached_run / "binance-usdm.ndjson").is_file()
              assert (detached_run / "okx-swap.ndjson").is_file()
              assert not (detached_run / "run-state-v1.json").exists()

          '''.replace("          ", "")
          tests = tests.replace(marker, "\n" + regression + marker.lstrip("\n"), 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install focused validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            pytest "pydantic>=2.2" "SQLAlchemy>=2.0.6" "httpx>=0.24.1" \
            fastapi pyjwt cryptography "PyYAML>=6.0" lightgbm websockets ruff==0.15.20

      - name: Format and validate repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff format \
            ai_platform/scripts/liquidation_live_stream.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m py_compile \
            ai_platform/scripts/liquidation_live_stream.py \
            ai_platform/scripts/liquidation_live_stream_okx.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m ruff check \
            ai_platform/scripts/liquidation_live_stream.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m ruff format --check \
            ai_platform/scripts/liquidation_live_stream.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py \
            tests/ai_platform_integration/test_liquidation_okx_live_source.py
          git diff --check

      - name: Commit product repair and compact task checkpoint
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ai_platform/scripts/liquidation_live_stream.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git commit -m "fix(liquidations): revalidate active run before publish"
          product_head="$(git rev-parse HEAD)"
          PRODUCT_HEAD="$product_head" python3 - <<'PY'
          import os
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md")
          text = path.read_text(encoding="utf-8")
          product_head = os.environ["PRODUCT_HEAD"]
          run_id = os.environ["RUN_ID"]
          now = datetime.now(ZoneInfo("Europe/Warsaw")).replace(microsecond=0).isoformat()

          text, n = re.subn(r"updated_at: [^\n]+", f"updated_at: {now}", text, count=1)
          assert n == 1
          text, n = re.subn(
              r"head: [0-9a-f]{40}\nbranch: fix/wickhunter-1396-synology-recovery-v2",
              f"head: {product_head}\nbranch: fix/wickhunter-1396-synology-recovery-v2",
              text,
              count=1,
          )
          assert n == 1

          proven_tail = "before exact-head validation\n"
          addition = (
              f"; active-run identity repair also reopens canonical runs/<run_id> and compares it to the retained run descriptor before state work and pointer publication, with focused run {run_id} validating the fail-closed replacement regression"
          )
          idx = text.index(proven_tail, text.index("proven:\n"))
          text = text[:idx] + addition + text[idx:]

          validation_anchor = "branch then merged current develop 2e7a99f6693469c0f8a009a2c8d00056fc817674 before final exact-head validation\n"
          assert validation_anchor in text
          text = text.replace(
              validation_anchor,
              validation_anchor.rstrip("\n") + f"; run {run_id} passed the active-run identity replacement regression plus the full focused restart/OKX suite and compile Ruff format and diff hygiene\n",
              1,
          )

          text = text.replace(
              "  - final exact-head PR 1450 ci:full result after root-identity repair and current-develop reconciliation\n",
              "  - final exact-head PR 1450 ci:full result after active-run identity repair and current-develop reconciliation\n",
              1,
          )
          text = text.replace(
              "next_action: Run final exact-head PR 1450 ci:full and fresh Codex review after root-identity repair; if green, squash-merge and continue canonical Liquid20 deployment plus guarded completed-history repair.",
              "next_action: Run final exact-head PR 1450 ci:full and fresh Codex review after active-run identity repair; if green, squash-merge and continue canonical Liquid20 deployment plus guarded completed-history repair.",
              1,
          )
          text = text.replace("  generation: 19\n", "  generation: 20\n", 1)
          text = re.sub(r"  checkpointed_at: [^\n]+", f"  checkpointed_at: {now}", text, count=1)
          text = re.sub(r"  last_progress_at: [^\n]+", f"  last_progress_at: {now}", text, count=1)
          text = text.replace("  phase: pr1450_final_validation\n", "  phase: pr1450_active_run_identity_revalidation\n", 1)
          text = re.sub(
              r"  exact_head_before_checkpoint_commit: [0-9a-f]{40}",
              f"  exact_head_before_checkpoint_commit: {product_head}",
              text,
              count=1,
          )
          text = text.replace(
              "  active_operation: final exact-head ci:full and independent review after root-identity repair and current-develop reconciliation\n",
              "  active_operation: final exact-head ci:full and independent review after active-run identity repair\n",
              1,
          )
          text = text.replace(
              "  next_action: Complete final exact-head ci:full plus fresh Codex review on PR 1450, then squash-merge and continue canonical Liquid20 recovery.",
              "  next_action: Complete final exact-head ci:full plus fresh Codex review after active-run identity repair on PR 1450, then squash-merge and continue canonical Liquid20 recovery.",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          python3 tools/agents/checkpoint.py \
            docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md \
            --require-checkpoint
          git add docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md
          git rm .github/workflows/wickhunter-1450-active-run-identity-repair.yml
          git diff --cached --check
          git commit -m "docs(wickhunter): checkpoint active-run identity repair"
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
