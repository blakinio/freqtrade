name: WickHunter 1450 atomic recovery repair v2

on:
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/wickhunter-1450-atomic-recovery-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply bounded recovery hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('ai_platform/scripts/liquidation_live_stream.py')
          source = source_path.read_text(encoding='utf-8')

          old = '''def _seal_committed_ndjson(\n    path: Path,\n    *,\n    committed_rows: int,\n    source: str,\n    allow_missing: bool,\n    directory_fd: int | None = None,\n) -> None:\n    if (\n        isinstance(committed_rows, bool)\n        or not isinstance(committed_rows, int)\n        or committed_rows < 0\n    ):\n        raise RuntimeError(f"previous {source} events_written is invalid")\n    source_directory_fd, owned = _source_directory_fd(path, directory_fd, source)\n    try:\n        descriptor = _open_committed_source_fd(\n            source_directory_fd,\n            path.name,\n            committed_rows=committed_rows,\n            source=source,\n            allow_missing=allow_missing,\n        )\n        if descriptor is None:\n            return\n        with os.fdopen(descriptor, "r+b") as handle:\n            committed_end = 0\n            for _ in range(committed_rows):\n                row = handle.readline()\n                if not row or not row.endswith(b"\\n") or not row.strip():\n                    raise RuntimeError(\n                        f"previous {source} source file has fewer rows than committed"\n                    )\n                committed_end = handle.tell()\n            if handle.read(1):\n                handle.truncate(committed_end)\n            handle.flush()\n            os.fsync(handle.fileno())\n    finally:\n        if owned:\n            os.close(source_directory_fd)\n'''
          new = '''def _validate_committed_ndjson_fd(\n    path: Path,\n    *,\n    committed_rows: int,\n    source: str,\n    allow_missing: bool,\n    directory_fd: int | None = None,\n) -> tuple[int | None, int]:\n    if (\n        isinstance(committed_rows, bool)\n        or not isinstance(committed_rows, int)\n        or committed_rows < 0\n    ):\n        raise RuntimeError(f"previous {source} events_written is invalid")\n    source_directory_fd, owned = _source_directory_fd(path, directory_fd, source)\n    descriptor: int | None = None\n    try:\n        descriptor = _open_committed_source_fd(\n            source_directory_fd,\n            path.name,\n            committed_rows=committed_rows,\n            source=source,\n            allow_missing=allow_missing,\n        )\n        if descriptor is None:\n            return None, 0\n        committed_end = 0\n        with os.fdopen(os.dup(descriptor), "rb") as handle:\n            for _ in range(committed_rows):\n                row = handle.readline()\n                if not row or not row.endswith(b"\\n") or not row.strip():\n                    raise RuntimeError(\n                        f"previous {source} source file has fewer rows than committed"\n                    )\n                committed_end = handle.tell()\n        return descriptor, committed_end\n    except BaseException:\n        if descriptor is not None:\n            os.close(descriptor)\n        raise\n    finally:\n        if owned:\n            os.close(source_directory_fd)\n\n\ndef _seal_validated_committed_ndjson(descriptor: int, committed_end: int) -> None:\n    with os.fdopen(descriptor, "r+b") as handle:\n        handle.seek(committed_end)\n        if handle.read(1):\n            handle.truncate(committed_end)\n        handle.flush()\n        os.fsync(handle.fileno())\n\n\ndef _seal_committed_ndjson(\n    path: Path,\n    *,\n    committed_rows: int,\n    source: str,\n    allow_missing: bool,\n    directory_fd: int | None = None,\n) -> None:\n    descriptor, committed_end = _validate_committed_ndjson_fd(\n        path,\n        committed_rows=committed_rows,\n        source=source,\n        allow_missing=allow_missing,\n        directory_fd=directory_fd,\n    )\n    if descriptor is not None:\n        _seal_validated_committed_ndjson(descriptor, committed_end)\n\n\ndef _seal_restart_sources(\n    run_root: Path, run_root_fd: int, sources: dict[str, object]\n) -> None:\n    validated: list[tuple[int, int]] = []\n    try:\n        for source in (BYBIT_SOURCE, BINANCE_SOURCE, OKX_SOURCE):\n            committed_rows, allow_missing = _restart_source_commit_state(\n                sources[source], source=source\n            )\n            descriptor, committed_end = _validate_committed_ndjson_fd(\n                run_root / f"{source}.ndjson",\n                committed_rows=committed_rows,\n                source=source,\n                allow_missing=allow_missing,\n                directory_fd=run_root_fd,\n            )\n            if descriptor is not None:\n                validated.append((descriptor, committed_end))\n        while validated:\n            descriptor, committed_end = validated.pop(0)\n            _seal_validated_committed_ndjson(descriptor, committed_end)\n    finally:\n        for descriptor, _ in validated:\n            os.close(descriptor)\n'''
          if source.count(old) != 1:
              raise SystemExit(f'seal anchor count={source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''            try:\n                await asyncio.to_thread(self._write_state)\n            finally:\n                for writer in self._writers.values():\n                    await asyncio.to_thread(writer.close)\n                self._writers.clear()\n                await asyncio.to_thread(self._close_runtime_root_fds)\n'''
          new = '''            try:\n                await asyncio.to_thread(self._write_state)\n            finally:\n                await asyncio.to_thread(self._close_writers_and_runtime_fds)\n'''
          if source.count(old) != 1:
              raise SystemExit(f'stop anchor count={source.count(old)}')
          source = source.replace(old, new, 1)

          anchor = '''    def _complete_previous_active_run(self) -> None:\n'''
          helper = '''    def _close_writers_and_runtime_fds(self) -> None:\n        cleanup_error: BaseException | None = None\n        try:\n            for writer in self._writers.values():\n                try:\n                    writer.close()\n                except BaseException as exc:\n                    if cleanup_error is None:\n                        cleanup_error = exc\n        finally:\n            self._writers.clear()\n            self._close_runtime_root_fds()\n        if cleanup_error is not None:\n            raise cleanup_error\n\n'''
          if source.count(anchor) != 1:
              raise SystemExit(f'helper anchor count={source.count(anchor)}')
          source = source.replace(anchor, helper + anchor, 1)

          old = '''        if payload is None:\n            return\n        run_id = payload.get("active_run_id")\n'''
          new = '''        if payload is None:\n            return\n        if payload.get("schema_version") != 1 or payload.get("contract") != LIVE_CONTRACT:\n            raise RuntimeError("previous live pointer contract is invalid")\n        run_id = payload.get("active_run_id")\n'''
          if source.count(old) != 1:
              raise SystemExit(f'pointer anchor count={source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''            run_root = self.runs_root / run_id\n            for source in (BYBIT_SOURCE, BINANCE_SOURCE, OKX_SOURCE):\n                committed_rows, allow_missing = _restart_source_commit_state(\n                    sources[source], source=source\n                )\n                _seal_committed_ndjson(\n                    run_root / f"{source}.ndjson",\n                    committed_rows=committed_rows,\n                    source=source,\n                    allow_missing=allow_missing,\n                    directory_fd=run_root_fd,\n                )\n'''
          new = '''            run_root = self.runs_root / run_id\n            _seal_restart_sources(run_root, run_root_fd, sources)\n'''
          if source.count(old) != 1:
              raise SystemExit(f'recovery loop anchor count={source.count(old)}')
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          tests_path = Path('tests/ai_platform_integration/test_liquidation_live_restart_durability.py')
          tests = tests_path.read_text(encoding='utf-8')
          first_anchor = '''def test_restart_rejects_fifo_metadata_without_blocking(tmp_path: Path) -> None:\n'''
          first_tests = '''@pytest.mark.parametrize(\n    ("field", "value"), [("schema_version", 2), ("contract", "foreign-live-contract-v2")]\n)\ndef test_restart_rejects_foreign_pointer_contract_before_sealing(\n    tmp_path: Path, field: str, value: object\n) -> None:\n    old_run_id, old_run_root = _write_previous_active_run(\n        tmp_path,\n        committed_rows={BINANCE_SOURCE: 1, BYBIT_SOURCE: 1, OKX_SOURCE: 0},\n        actual_rows={BINANCE_SOURCE: 2, BYBIT_SOURCE: 2, OKX_SOURCE: 0},\n    )\n    pointer_path = tmp_path / "live" / LIVE_STATE_FILE\n    pointer = json.loads(pointer_path.read_text(encoding="utf-8"))\n    pointer[field] = value\n    pointer_path.write_text(json.dumps(pointer), encoding="utf-8")\n    originals = {\n        source: (old_run_root / f"{source}.ndjson").read_bytes()\n        for source in (BYBIT_SOURCE, BINANCE_SOURCE, OKX_SOURCE)\n    }\n    manager = LiveRunManager(\n        data_root=tmp_path,\n        collector_commit="c" * 40,\n        host_id="synology-test",\n        now_ms=lambda: 1_786_384_683_792,\n    )\n    with pytest.raises(RuntimeError, match="previous live pointer contract is invalid"):\n        asyncio.run(manager.start())\n    for source, original in originals.items():\n        assert (old_run_root / f"{source}.ndjson").read_bytes() == original\n    persisted = json.loads((old_run_root / "run-state-v1.json").read_text(encoding="utf-8"))\n    assert persisted["run_state"] == "active"\n    assert json.loads(pointer_path.read_text(encoding="utf-8"))["active_run_id"] == old_run_id\n\n\ndef test_restart_preflights_all_sources_before_any_truncation(tmp_path: Path) -> None:\n    old_run_id, old_run_root = _write_previous_active_run(\n        tmp_path,\n        committed_rows={BYBIT_SOURCE: 1, BINANCE_SOURCE: 1, OKX_SOURCE: 0},\n        actual_rows={BYBIT_SOURCE: 2, BINANCE_SOURCE: 2, OKX_SOURCE: 0},\n    )\n    state_path = old_run_root / "run-state-v1.json"\n    state = json.loads(state_path.read_text(encoding="utf-8"))\n    del state["sources"][BINANCE_SOURCE]["events_written"]\n    state_path.write_text(json.dumps(state), encoding="utf-8")\n    bybit_path = old_run_root / f"{BYBIT_SOURCE}.ndjson"\n    original = bybit_path.read_bytes()\n    manager = LiveRunManager(\n        data_root=tmp_path,\n        collector_commit="d" * 40,\n        host_id="synology-test",\n        now_ms=lambda: 1_786_384_683_792,\n    )\n    with pytest.raises(RuntimeError, match="binance-usdm events_written is missing"):\n        asyncio.run(manager.start())\n    assert bybit_path.read_bytes() == original\n    persisted = json.loads(state_path.read_text(encoding="utf-8"))\n    assert persisted["run_state"] == "active"\n    pointer = json.loads((tmp_path / "live" / LIVE_STATE_FILE).read_text(encoding="utf-8"))\n    assert pointer["active_run_id"] == old_run_id\n\n\n'''
          if tests.count(first_anchor) != 1:
              raise SystemExit(f'first test anchor count={tests.count(first_anchor)}')
          tests = tests.replace(first_anchor, first_tests + first_anchor, 1)

          second_anchor = '''def test_stop_okx_summary_failure_is_restart_recoverable(\n'''
          second_test = '''def test_stop_closes_all_runtime_descriptors_when_writer_close_fails(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    manager = LiveRunManager(\n        data_root=tmp_path,\n        collector_commit="e" * 40,\n        host_id="synology-test",\n        now_ms=lambda: 1_786_384_683_792,\n    )\n\n    async def scenario() -> None:\n        await manager.start()\n        retained = [manager._live_root_fd, manager._runs_root_fd, manager._run_root_fd]\n        writers = list(manager._writers.values())\n        def fail_close() -> None:\n            raise OSError("forced writer close failure")\n        monkeypatch.setattr(writers[0], "close", fail_close)\n        with pytest.raises(OSError, match="forced writer close failure"):\n            await manager.stop()\n        assert manager._writers == {}\n        assert manager._live_root_fd is None\n        assert manager._runs_root_fd is None\n        assert manager._run_root_fd is None\n        for descriptor in retained:\n            assert descriptor is not None\n            with pytest.raises(OSError):\n                os.fstat(descriptor)\n        assert all(writer.closed for writer in writers[1:])\n\n    asyncio.run(scenario())\n\n\n'''
          if tests.count(second_anchor) != 1:
              raise SystemExit(f'second test anchor count={tests.count(second_anchor)}')
          tests_path.write_text(tests.replace(second_anchor, second_test + second_anchor, 1), encoding='utf-8')
          PY
      - name: Validate focused repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest==9.1.1 websockets==16.0 ruff==0.15.21
          python -m ruff format ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python -m ruff check --fix ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python -m py_compile ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python -m ruff check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python -m ruff format --check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git diff --check
      - name: Commit permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git commit -m 'fix(liquidations): make restart sealing atomic'
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
