name: WickHunter 1450 validated checkpoint

on:
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/wickhunter-1450-checkpoint.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 20
          persist-credentials: false

      - name: Refresh canonical checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          task = Path('docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md')
          text = task.read_text(encoding='utf-8')
          delivered_head = '002be13f566e2ef4646b74bd66f8df548be29e73'
          now = datetime.now(ZoneInfo('Europe/Warsaw')).replace(microsecond=0).isoformat()

          replacements = {
              'updated_at: 2026-08-11T09:14:12+02:00': f'updated_at: {now}',
              'head: ff8037e03d549f67797a4ffb017841f13f3d2719': f'head: {delivered_head}',
              'next_action: Reconcile latest develop then run final retained exact-head CI and fresh Codex audit, squash-merge PR 1450, and continue protected Liquid20 recovery.': 'next_action: Run final retained exact-head PR 1450 CI and fresh Codex audit; if green, squash-merge and continue canonical Liquid20 deployment plus guarded completed-history repair.',
              '  generation: 13': '  generation: 14',
              '  checkpointed_at: 2026-08-10T23:08:00+02:00': f'  checkpointed_at: {now}',
              '  last_progress_at: 2026-08-10T23:08:00+02:00': f'  last_progress_at: {now}',
              '  exact_head_before_checkpoint_commit: 2c3cb8387c22e3fb3864abeea312aa79476c84b1': f'  exact_head_before_checkpoint_commit: {delivered_head}',
              '  active_operation: final retained CI and independent review': '  active_operation: final exact-head CI and independent review after descriptor stop lifecycle repair',
              '  next_action: Delete the temporary recovery workflow, complete retained exact-head CI plus fresh Codex review, merge PR 1450, then continue canonical Liquid20 deployment and exact historical repair.': '  next_action: Complete retained exact-head CI plus fresh Codex review on PR 1450, merge it, then continue canonical Liquid20 deployment and exact historical repair.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'checkpoint replacement target mismatch: {old}')
              text = text.replace(old, new, 1)

          old_proven = '  - malformed active source state missing events_written now fails closed before any source truncation; no default zero commit boundary is accepted\n'
          new_proven = '  - malformed active source state missing events_written now fails closed before any source truncation with no default zero commit boundary; normal and exceptional stop paths close all retained runtime directory descriptors and repeated stop remains safe\n'
          if text.count(old_proven) != 1:
              raise SystemExit('proven compaction target mismatch')
          text = text.replace(old_proven, new_proven, 1)

          old_validation = (
              '  - command: Retained FD lifecycle new-run TOCTOU validation\n'
              '    result: PASS\n'
              '    evidence: GitHub Actions run 31467075693 passed 25 focused restart and OKX tests plus Ruff check format compile checkpoint and diff hygiene\n'
          )
          new_validation = (
              '  - command: Retained FD lifecycle and stop validation\n'
              '    result: PASS\n'
              '    evidence: GitHub Actions run 31467075693 passed 25 focused new-run descriptor tests and run 31470901848 job 93713775781 passed 27 focused restart and OKX tests including normal and exceptional stop descriptor closure plus py_compile Ruff check format and diff hygiene\n'
          )
          if text.count(old_validation) != 1:
              raise SystemExit('validation compaction target mismatch')
          text = text.replace(old_validation, new_validation, 1)

          temp_marker = 'The temporary workflow is intentionally absent from the permanent merge diff and cannot serve as final merge evidence.\n'
          temp_evidence = (
              ' Final retained-descriptor lifecycle repair was validated by temporary workflow '
              '`wickhunter-1450-close-fd-repair.yml` in run `31470901848` / job `93713775781`; '
              'it passed 27 focused tests plus compile/Ruff/diff hygiene and was removed again in '
              'commit `002be13f566e2ef4646b74bd66f8df548be29e73`.'
          )
          if temp_evidence.strip() not in text:
              if text.count(temp_marker) != 1:
                  raise SystemExit('temporary-workflow evidence marker mismatch')
              text = text.replace(temp_marker, temp_marker.rstrip('\n') + temp_evidence + '\n', 1)

          task.write_text(text, encoding='utf-8')
          PY
          python3 tools/agents/checkpoint.py docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md --require-checkpoint
          git diff --check
          git rm .github/workflows/wickhunter-1450-checkpoint.yml
          git diff --check

      - name: Commit canonical checkpoint and self-clean
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md .github/workflows/wickhunter-1450-checkpoint.yml
          git commit -m 'chore(wickhunter): checkpoint validated retained FD lifecycle'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
