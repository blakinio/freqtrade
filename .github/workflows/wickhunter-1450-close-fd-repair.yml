name: WickHunter 1450 retained FD stop repair

on:
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/wickhunter-1450-close-fd-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: freqtrade-staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 20
          persist-credentials: false

      - name: Apply descriptor stop lifecycle repair and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('ai_platform/scripts/liquidation_live_stream.py')
          text = source.read_text(encoding='utf-8')
          start_marker = '    async def stop(self, *, reason: str = "collector-stopped") -> None:\n'
          end_marker = '\n    def _complete_previous_active_run(self) -> None:\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          current = text[start:end]
          required = (
              'if self._run_id is None:',
              'await asyncio.to_thread(writer.close)',
              'await asyncio.to_thread(self._write_state)',
              'self._writers.clear()',
          )
          if any(marker not in current for marker in required):
              raise SystemExit('stop lifecycle semantic target mismatch')
          new = (
              '    async def stop(self, *, reason: str = "collector-stopped") -> None:\n'
              '        async with self._lock:\n'
              '            if self._run_id is None or self._run_root_fd is None:\n'
              '                await asyncio.to_thread(self._close_runtime_root_fds)\n'
              '                return\n'
              '            self._run_state = "completed"\n'
              '            self._completion_reason = reason\n'
              '            self._completed_at_ms = self._now_ms()\n'
              '            for state in self.sources.values():\n'
              '                state.connected = False\n'
              '            try:\n'
              '                for writer in self._writers.values():\n'
              '                    await asyncio.to_thread(writer.close)\n'
              '                await asyncio.to_thread(self._write_state)\n'
              '            finally:\n'
              '                self._writers.clear()\n'
              '                await asyncio.to_thread(self._close_runtime_root_fds)\n'
          )
          source.write_text(text[:start] + new + text[end:], encoding='utf-8')

          tests = Path('tests/ai_platform_integration/test_liquidation_live_restart_durability.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = '\n\ndef test_restart_truncates_only_uncommitted_suffix_before_completion'
          addition = dedent('''

          def test_stop_closes_retained_runtime_directory_descriptors(tmp_path: Path) -> None:
              manager = LiveRunManager(
                  data_root=tmp_path,
                  collector_commit="e" * 40,
                  host_id="synology-test",
                  now_ms=lambda: 1_786_384_683_792,
              )

              async def scenario() -> None:
                  await manager.start()
                  retained = [manager._live_root_fd, manager._runs_root_fd, manager._run_root_fd]
                  assert all(isinstance(descriptor, int) for descriptor in retained)

                  await manager.stop()

                  assert manager._live_root_fd is None
                  assert manager._runs_root_fd is None
                  assert manager._run_root_fd is None
                  for descriptor in retained:
                      assert descriptor is not None
                      with pytest.raises(OSError):
                          os.fstat(descriptor)

                  await manager.stop()

              asyncio.run(scenario())


          def test_stop_closes_retained_runtime_directory_descriptors_on_state_write_error(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              manager = LiveRunManager(
                  data_root=tmp_path,
                  collector_commit="f" * 40,
                  host_id="synology-test",
                  now_ms=lambda: 1_786_384_683_792,
              )

              async def scenario() -> None:
                  await manager.start()
                  retained = [manager._live_root_fd, manager._runs_root_fd, manager._run_root_fd]
                  assert all(isinstance(descriptor, int) for descriptor in retained)

                  def fail_state_write() -> None:
                      raise RuntimeError("forced final state write failure")

                  monkeypatch.setattr(manager, "_write_state", fail_state_write)
                  with pytest.raises(RuntimeError, match="forced final state write failure"):
                      await manager.stop()

                  assert manager._live_root_fd is None
                  assert manager._runs_root_fd is None
                  assert manager._run_root_fd is None
                  for descriptor in retained:
                      assert descriptor is not None
                      with pytest.raises(OSError):
                          os.fstat(descriptor)

                  await manager.stop()

              asyncio.run(scenario())
          ''')
          if 'test_stop_closes_retained_runtime_directory_descriptors(' in test_text:
              raise SystemExit('descriptor stop lifecycle tests already present')
          if marker not in test_text:
              raise SystemExit('test insertion marker missing')
          tests.write_text(test_text.replace(marker, addition + marker, 1), encoding='utf-8')
          PY

      - name: Install isolated focused validation tools
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/wickhunter-stop-fd-deps"
          rm -rf "$deps"
          mkdir -p "$deps"
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o "$RUNNER_TEMP/get-pip.py"
          python3 "$RUNNER_TEMP/get-pip.py" --target "$deps"
          PYTHONPATH="$deps" python3 -m pip install --disable-pip-version-check --upgrade --target "$deps" \
            websockets==16.0 pytest==9.1.1 ruff==0.15.21
          echo "PYTHONPATH=$deps${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff format ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m ruff check --fix ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m py_compile ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py \
            tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff check ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff format --check ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          git diff --check

      - name: Commit validated source repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git commit -m 'fix(liquidations): close retained directory FDs on stop'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:fix/wickhunter-1396-synology-recovery-v2

      - name: Remove temporary repair workflow after source validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/wickhunter-1450-close-fd-repair.yml
          git diff --check
          git commit -m 'chore(wickhunter): remove temporary retained FD repair workflow'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
