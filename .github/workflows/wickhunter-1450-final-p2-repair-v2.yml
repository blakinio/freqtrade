name: WickHunter 1450 final P2 repair v2

on:
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/wickhunter-1450-final-p2-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply corrected bounded P2 repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('ai_platform/scripts/liquidation_live_stream.py')
          source = source_path.read_text(encoding='utf-8')

          old = 'REDACTED = "[redacted]"\n\n\n@dataclass(slots=True)\n'
          new = 'REDACTED = "[redacted]"\nMAX_RECOVERY_SOURCE_BYTES = 128 * 1024 * 1024\nMAX_RECOVERY_SOURCE_EVENTS = 250_000\nMAX_RECOVERY_ROW_BYTES = 1024 * 1024\n\n\n@dataclass(slots=True)\n'
          if source.count(old) != 1:
              raise SystemExit(f'constant anchor count={source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''    if (\n        isinstance(committed_rows, bool)\n        or not isinstance(committed_rows, int)\n        or committed_rows < 0\n    ):\n        raise RuntimeError(f"previous {source} events_written is invalid")\n    source_directory_fd, owned = _source_directory_fd(path, directory_fd, source)\n'''
          new = '''    if (\n        isinstance(committed_rows, bool)\n        or not isinstance(committed_rows, int)\n        or committed_rows < 0\n        or committed_rows > MAX_RECOVERY_SOURCE_EVENTS\n    ):\n        raise RuntimeError(f"previous {source} events_written is invalid")\n    source_directory_fd, owned = _source_directory_fd(path, directory_fd, source)\n'''
          if source.count(old) != 1:
              raise SystemExit(f'row-count anchor count={source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''        if descriptor is None:\n            return None, 0\n        committed_end = 0\n        with os.fdopen(os.dup(descriptor), "rb") as handle:\n            for _ in range(committed_rows):\n                row = handle.readline()\n                if not row or not row.endswith(b"\\n") or not row.strip():\n                    raise RuntimeError(\n                        f"previous {source} source file has fewer rows than committed"\n                    )\n                committed_end = handle.tell()\n'''
          new = '''        if descriptor is None:\n            return None, 0\n        if os.fstat(descriptor).st_size > MAX_RECOVERY_SOURCE_BYTES:\n            raise RuntimeError(f"previous {source} source file exceeds recovery size bound")\n        committed_end = 0\n        with os.fdopen(os.dup(descriptor), "rb") as handle:\n            for _ in range(committed_rows):\n                row = handle.readline(MAX_RECOVERY_ROW_BYTES + 1)\n                if len(row) > MAX_RECOVERY_ROW_BYTES:\n                    raise RuntimeError(f"previous {source} source row exceeds recovery bound")\n                if not row or not row.endswith(b"\\n") or not row.strip():\n                    raise RuntimeError(\n                        f"previous {source} source file has fewer rows than committed"\n                    )\n                committed_end = handle.tell()\n'''
          if source.count(old) != 1:
              raise SystemExit(f'bounded-read anchor count={source.count(old)}')
          source = source.replace(old, new, 1)

          anchor = 'def _restart_source_commit_state(source_state: object, *, source: str) -> tuple[int, bool]:\n'
          helper = '''def _validate_restart_zero_authority(state: dict[str, object]) -> None:\n    for field_name in (\n        "execution_enabled",\n        "trading_authorized",\n        "trading_credentials_present",\n    ):\n        if state.get(field_name) is not False:\n            raise RuntimeError(f"previous live run must keep {field_name}=false")\n    if state.get("orders_submitted", 0) != 0:\n        raise RuntimeError("previous live run must keep orders_submitted=0")\n\n\n'''
          if source.count(anchor) != 1:
              raise SystemExit(f'zero-authority anchor count={source.count(anchor)}')
          source = source.replace(anchor, helper + anchor, 1)

          old = '''            if state.get("run_id") != run_id:\n                raise RuntimeError("previous live run_id does not match active pointer")\n            sources = state.get("sources")\n'''
          new = '''            if state.get("run_id") != run_id:\n                raise RuntimeError("previous live run_id does not match active pointer")\n            _validate_restart_zero_authority(state)\n            _assert_runtime_roots_still_anchored(\n                data_root=self.data_root,\n                live_fd=live_fd,\n                runs_fd=runs_fd,\n                run_id=run_id,\n                run_fd=run_root_fd,\n            )\n            sources = state.get("sources")\n'''
          if source.count(old) != 1:
              raise SystemExit(f'preflight anchor count={source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''                self._write_source_summaries(run_root_fd, state)\n                _assert_recovered_source_identities(run_root_fd, retained_sources)\n                _write_json_atomic_at(run_root_fd, RUN_STATE_FILE, state)\n'''
          new = '''                self._write_source_summaries(run_root_fd, state)\n                _assert_recovered_source_identities(run_root_fd, retained_sources)\n                _assert_runtime_roots_still_anchored(\n                    data_root=self.data_root,\n                    live_fd=live_fd,\n                    runs_fd=runs_fd,\n                    run_id=run_id,\n                    run_fd=run_root_fd,\n                )\n                _write_json_atomic_at(run_root_fd, RUN_STATE_FILE, state)\n'''
          if source.count(old) != 1:
              raise SystemExit(f'completion revalidation anchor count={source.count(old)}')
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          tests_path = Path('tests/ai_platform_integration/test_liquidation_live_restart_durability.py')
          tests = tests_path.read_text(encoding='utf-8')
          anchor = 'def test_restart_revalidates_source_identity_before_completed_state(\n'
          additions = '''def test_restart_revalidates_run_identity_before_completed_state(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    old_run_id, old_run_root = _write_previous_active_run(\n        tmp_path,\n        committed_rows={BYBIT_SOURCE: 1, BINANCE_SOURCE: 1, OKX_SOURCE: 0},\n        actual_rows={BYBIT_SOURCE: 2, BINANCE_SOURCE: 1, OKX_SOURCE: 0},\n    )\n    runs_root = tmp_path / "live" / "runs"\n    detached_root = runs_root / "detached-old-run"\n    replacement_root = runs_root / "replacement-old-run"\n    replacement_root.mkdir()\n    original_write_summaries = LiveRunManager._write_source_summaries\n\n    def swap_before_completion(\n        self: LiveRunManager, run_fd: int, payload: dict[str, object]\n    ) -> None:\n        original_write_summaries(self, run_fd, payload)\n        old_run_root.rename(detached_root)\n        replacement_root.rename(old_run_root)\n\n    monkeypatch.setattr(LiveRunManager, "_write_source_summaries", swap_before_completion)\n    manager = LiveRunManager(\n        data_root=tmp_path,\n        collector_commit="e" * 40,\n        host_id="synology-test",\n        now_ms=lambda: 1_786_384_683_792,\n    )\n    with pytest.raises(RuntimeError, match="runtime roots changed after anchoring"):\n        asyncio.run(manager.start())\n    state = json.loads((detached_root / "run-state-v1.json").read_text(encoding="utf-8"))\n    assert state["run_state"] == "active"\n    assert list(old_run_root.iterdir()) == []\n    pointer = json.loads((tmp_path / "live" / LIVE_STATE_FILE).read_text(encoding="utf-8"))\n    assert pointer["active_run_id"] == old_run_id\n\n\n@pytest.mark.parametrize(\n    "field_name",\n    ["execution_enabled", "trading_authorized", "trading_credentials_present"],\n)\ndef test_restart_rejects_nonzero_authority_before_sealing(\n    tmp_path: Path, field_name: str\n) -> None:\n    old_run_id, old_run_root = _write_previous_active_run(\n        tmp_path,\n        committed_rows={BYBIT_SOURCE: 1, BINANCE_SOURCE: 1, OKX_SOURCE: 0},\n        actual_rows={BYBIT_SOURCE: 2, BINANCE_SOURCE: 2, OKX_SOURCE: 0},\n    )\n    state_path = old_run_root / "run-state-v1.json"\n    state = json.loads(state_path.read_text(encoding="utf-8"))\n    state[field_name] = True\n    state_path.write_text(json.dumps(state), encoding="utf-8")\n    originals = {\n        source: (old_run_root / f"{source}.ndjson").read_bytes()\n        for source in (BYBIT_SOURCE, BINANCE_SOURCE, OKX_SOURCE)\n    }\n    manager = LiveRunManager(\n        data_root=tmp_path,\n        collector_commit="d" * 40,\n        host_id="synology-test",\n        now_ms=lambda: 1_786_384_683_792,\n    )\n    with pytest.raises(RuntimeError, match=f"previous live run must keep {field_name}=false"):\n        asyncio.run(manager.start())\n    for source, original in originals.items():\n        assert (old_run_root / f"{source}.ndjson").read_bytes() == original\n    assert json.loads(state_path.read_text(encoding="utf-8"))["run_state"] == "active"\n    pointer = json.loads((tmp_path / "live" / LIVE_STATE_FILE).read_text(encoding="utf-8"))\n    assert pointer["active_run_id"] == old_run_id\n\n\ndef test_restart_rejects_oversized_committed_row_without_unbounded_read(tmp_path: Path) -> None:\n    old_run_id, old_run_root = _write_previous_active_run(\n        tmp_path,\n        committed_rows={BYBIT_SOURCE: 1, BINANCE_SOURCE: 0, OKX_SOURCE: 0},\n        actual_rows={BYBIT_SOURCE: 1, BINANCE_SOURCE: 0, OKX_SOURCE: 0},\n    )\n    source_path = old_run_root / f"{BYBIT_SOURCE}.ndjson"\n    source_path.write_bytes(b"x" * (1024 * 1024 + 1) + b"\\n")\n    original = source_path.read_bytes()\n    manager = LiveRunManager(\n        data_root=tmp_path,\n        collector_commit="c" * 40,\n        host_id="synology-test",\n        now_ms=lambda: 1_786_384_683_792,\n    )\n    with pytest.raises(RuntimeError, match="source row exceeds recovery bound"):\n        asyncio.run(manager.start())\n    assert source_path.read_bytes() == original\n    state = json.loads((old_run_root / "run-state-v1.json").read_text(encoding="utf-8"))\n    assert state["run_state"] == "active"\n    pointer = json.loads((tmp_path / "live" / LIVE_STATE_FILE).read_text(encoding="utf-8"))\n    assert pointer["active_run_id"] == old_run_id\n\n\n'''
          if tests.count(anchor) != 1:
              raise SystemExit(f'test anchor count={tests.count(anchor)}')
          tests_path.write_text(tests.replace(anchor, additions + anchor, 1), encoding='utf-8')
          PY
      - name: Validate focused repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest==9.1.1 websockets==16.0 ruff==0.15.21
          python -m ruff format ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python -m ruff check --fix ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python -m py_compile ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python -m ruff check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python -m ruff format --check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git diff --check
      - name: Commit permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name blakinio
          git config user.email 75369544+blakinio@users.noreply.github.com
          git add ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git commit -m 'fix(liquidations): harden restart recovery bounds'
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
