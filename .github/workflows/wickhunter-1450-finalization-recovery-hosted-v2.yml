name: WickHunter 1450 hosted finalization recovery v2

on:
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/wickhunter-1450-finalization-recovery-hosted-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 40
          persist-credentials: false

      - name: Apply staged recoverable finalization patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/agents/wickhunter_1450_recoverable_finalization_repair.py

      - name: Install isolated focused validation tools
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/wickhunter-finalization-deps"
          rm -rf "$deps"
          mkdir -p "$deps"
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o "$RUNNER_TEMP/get-pip.py"
          python3 "$RUNNER_TEMP/get-pip.py" --target "$deps"
          PYTHONPATH="$deps" python3 -m pip install --disable-pip-version-check --upgrade --target "$deps" \
            websockets==16.0 pytest==9.1.1 ruff==0.15.21
          echo "PYTHONPATH=$deps${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Validate recoverable finalization repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff format \
            ai_platform/scripts/liquidation_live_stream.py \
            ai_platform/scripts/liquidation_live_stream_okx.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m ruff check --fix \
            ai_platform/scripts/liquidation_live_stream.py \
            ai_platform/scripts/liquidation_live_stream_okx.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m py_compile \
            ai_platform/scripts/liquidation_live_stream.py \
            ai_platform/scripts/liquidation_live_stream_okx.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py \
            tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py \
            tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff check \
            ai_platform/scripts/liquidation_live_stream.py \
            ai_platform/scripts/liquidation_live_stream_okx.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py \
            tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff format --check \
            ai_platform/scripts/liquidation_live_stream.py \
            ai_platform/scripts/liquidation_live_stream_okx.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py \
            tests/ai_platform_integration/test_liquidation_okx_live_source.py
          git diff --check

      - name: Commit validated product repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ai_platform/scripts/liquidation_live_stream.py \
            ai_platform/scripts/liquidation_live_stream_okx.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git commit -m 'fix(liquidations): make finalization restart recoverable'
          repair_sha="$(git rev-parse HEAD)"
          echo "REPAIR_SHA=$repair_sha" >> "$GITHUB_ENV"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:fix/wickhunter-1396-synology-recovery-v2

      - name: Refresh canonical task checkpoint
        env:
          REPAIR_SHA: ${{ env.REPAIR_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          task = Path('docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md')
          text = task.read_text(encoding='utf-8')
          repair_sha = os.environ['REPAIR_SHA']
          run_id = os.environ['GITHUB_RUN_ID']
          now = datetime.now(ZoneInfo('Europe/Warsaw')).replace(microsecond=0).isoformat()

          context_prefix = '## Context checkpoint\n\n```yaml\n'
          context_suffix = '\n```\n\n## Recovery checkpoint'
          start = text.index(context_prefix) + len(context_prefix)
          end = text.index(context_suffix, start)
          checkpoint = text[start:end]
          rows = checkpoint.splitlines()
          for index, line in enumerate(rows):
              if line.startswith('updated_at:'):
                  rows[index] = f'updated_at: {now}'
              elif line.startswith('head:'):
                  rows[index] = f'head: {repair_sha}'
              elif line.startswith('next_action:'):
                  rows[index] = 'next_action: Run final exact-head PR 1450 CI and fresh Codex audit after recoverable multi-file finalization repair; if green, squash-merge and continue canonical Liquid20 deployment plus guarded completed-history repair.'
          checkpoint = '\n'.join(rows)
          proven_marker = '  - malformed active source state missing events_written now fails closed before any source truncation with no default zero commit boundary; normal and exceptional stop paths close all retained runtime directory descriptors and repeated stop remains safe'
          if proven_marker not in checkpoint:
              raise SystemExit('proven finalization marker missing')
          checkpoint = checkpoint.replace(
              proven_marker,
              proven_marker + '; source summaries now commit before run-state and pointer publication so partial finalization failures remain restart-recoverable without retaining directory descriptors',
              1,
          )
          old_command = '  - command: Retained FD lifecycle and stop validation\n'
          if old_command not in checkpoint:
              raise SystemExit('validation command marker missing')
          checkpoint = checkpoint.replace(
              old_command,
              '  - command: Retained FD lifecycle stop and recoverable finalization validation\n',
              1,
          )
          old_evidence = '    evidence: GitHub Actions run 31467075693 passed 25 focused new-run descriptor tests and run 31470901848 job 93713775781 passed 27 focused restart and OKX tests including normal and exceptional stop descriptor closure plus py_compile Ruff check format and diff hygiene'
          if old_evidence not in checkpoint:
              raise SystemExit('validation evidence marker missing')
          checkpoint = checkpoint.replace(
              old_evidence,
              old_evidence + f'; run {run_id} passed recoverable OKX-summary and completed-pointer failure restart tests plus the full focused restart and OKX suite',
              1,
          )
          text = text[:start] + checkpoint + text[end:]

          recovery_prefix = '## Recovery checkpoint\n\n```yaml\n'
          recovery_suffix = '\n```\n\n## Terminal closeout requirements'
          rstart = text.index(recovery_prefix) + len(recovery_prefix)
          rend = text.index(recovery_suffix, rstart)
          recovery = text[rstart:rend]
          rrows = recovery.splitlines()
          for index, line in enumerate(rrows):
              if line.startswith('  generation:'):
                  rrows[index] = '  generation: 16'
              elif line.startswith('  checkpointed_at:'):
                  rrows[index] = f'  checkpointed_at: {now}'
              elif line.startswith('  last_progress_at:'):
                  rrows[index] = f'  last_progress_at: {now}'
              elif line.startswith('  exact_head_before_checkpoint_commit:'):
                  rrows[index] = f'  exact_head_before_checkpoint_commit: {repair_sha}'
              elif line.startswith('  active_operation:'):
                  rrows[index] = '  active_operation: final exact-head CI and independent review after recoverable multi-file finalization repair'
              elif line.startswith('  next_action:'):
                  rrows[index] = '  next_action: Complete final exact-head CI plus fresh Codex review on PR 1450, merge it, then continue canonical Liquid20 deployment and exact historical repair.'
          text = text[:rstart] + '\n'.join(rrows) + text[rend:]
          task.write_text(text, encoding='utf-8')
          PY
          python3 tools/agents/checkpoint.py docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md --require-checkpoint
          git diff --check

      - name: Commit checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md
          git commit -m 'chore(wickhunter): checkpoint recoverable finalization repair'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
