name: WickHunter 1450 recoverable finalization repair

on:
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/wickhunter-1450-finalization-recovery-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: freqtrade-staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 30
          persist-credentials: false

      - name: Apply recoverable multi-file finalization repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          stream_path = Path('ai_platform/scripts/liquidation_live_stream.py')
          stream = stream_path.read_text(encoding='utf-8')

          old_completion = '''            state["run_state"] = "completed"
                      state["data_mode"] = "historical"
                      state["completed_at_ms"] = self._now_ms()
                      state["completion_reason"] = "collector-restart"
                      _write_json_atomic_at(run_root_fd, RUN_STATE_FILE, state)
          '''
          old_completion = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in old_completion.splitlines()
          ) + '\n'
          new_completion = '''            state["run_state"] = "completed"
              state["data_mode"] = "historical"
              state["completed_at_ms"] = self._now_ms()
              state["completion_reason"] = "collector-restart"
              self._write_source_summaries(run_root_fd, state)
              _write_json_atomic_at(run_root_fd, RUN_STATE_FILE, state)
          '''
          new_completion = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in new_completion.splitlines()
          ) + '\n'
          if stream.count(old_completion) != 1:
              raise SystemExit('previous-run completion target mismatch')
          stream = stream.replace(old_completion, new_completion, 1)

          state_start = stream.index('    def _write_state(self) -> None:\n')
          state_end = stream.index('\n\ndef redact_error', state_start)
          old_state_block = stream[state_start:state_end]
          required = (
              '_write_json_atomic_at(run_fd, RUN_STATE_FILE, payload)',
              'for source in (BYBIT_SOURCE, BINANCE_SOURCE):',
              '_write_json_atomic_at(live_fd, LIVE_STATE_FILE, pointer_payload)',
          )
          if any(marker not in old_state_block for marker in required):
              raise SystemExit('state-write semantic target mismatch')
          new_state_block = dedent('''
              def _write_source_summaries(self, run_fd: int, payload: dict[str, object]) -> None:
                  sources = payload.get("sources")
                  run_id = payload.get("run_id")
                  run_state = payload.get("run_state")
                  if not isinstance(sources, dict) or not isinstance(run_id, str):
                      raise RuntimeError("Liquid20 source summary payload is invalid")
                  if not isinstance(run_state, str):
                      raise RuntimeError("Liquid20 run-state summary payload is invalid")
                  for source in (BYBIT_SOURCE, BINANCE_SOURCE):
                      stats = sources.get(source)
                      if not isinstance(stats, dict):
                          raise RuntimeError(f"Liquid20 {source} source summary payload is invalid")
                      source_payload = {
                          "schema_version": 1,
                          "source": {"id": source},
                          "run_id": run_id,
                          "run_state": run_state,
                          "stats": stats,
                          "trading_credentials_present": False,
                          "execution_enabled": False,
                      }
                      _write_json_atomic_at(run_fd, f"{source}-summary.json", source_payload)

              def _write_state(self) -> None:
                  run_fd = self._require_fd(self._run_root_fd, label="Liquid20 active run root")
                  live_fd = self._require_fd(self._live_root_fd, label="Liquid20 live root")
                  for writer in self._writers.values():
                      if not writer.closed:
                          writer.flush()
                  payload = self._state_payload()
                  # Source summaries are committed before run-state. If any summary write fails,
                  # the durable run-state and active pointer retain the prior commit boundary so
                  # restart recovery can safely seal and finalize the run.
                  self._write_source_summaries(run_fd, payload)
                  _write_json_atomic_at(run_fd, RUN_STATE_FILE, payload)
                  pointer_payload = {
                      "schema_version": 1,
                      "contract": LIVE_CONTRACT,
                      "active_run_id": self.run_id if self._run_state == "active" else None,
                      "collector_heartbeat_at_ms": payload["collector_heartbeat_at_ms"],
                      "state": payload,
                  }
                  _write_json_atomic_at(live_fd, LIVE_STATE_FILE, pointer_payload)
          ''').lstrip('\n')
          stream = stream[:state_start] + new_state_block.rstrip('\n') + stream[state_end:]
          stream_path.write_text(stream, encoding='utf-8')

          okx_path = Path('ai_platform/scripts/liquidation_live_stream_okx.py')
          okx = okx_path.read_text(encoding='utf-8')
          snapshot_start = okx.index('    def _write_okx_snapshot(self) -> None:\n')
          snapshot_end = okx.index('\n    def _start_new_run', snapshot_start)
          old_snapshot = okx[snapshot_start:snapshot_end]
          if 'self._run_root_fd' not in old_snapshot or 'OKX_INSTRUMENT_SNAPSHOT_FILE' not in old_snapshot:
              raise SystemExit('OKX snapshot target mismatch')
          new_snapshot = dedent('''
              def _write_okx_snapshot(self, *, directory_fd: int | None = None) -> None:
                  if self._okx_instrument_snapshot is not None:
                      run_fd = directory_fd
                      if run_fd is None:
                          run_fd = self._require_fd(
                              self._run_root_fd,
                              label="Liquid20 active run root",
                          )
                      _write_json_atomic_at(
                          run_fd,
                          OKX_INSTRUMENT_SNAPSHOT_FILE,
                          self._okx_instrument_snapshot,
                      )
          ''').lstrip('\n')
          okx = okx[:snapshot_start] + new_snapshot.rstrip('\n') + okx[snapshot_end:]

          okx_state_start = okx.index('    def _write_state(self) -> None:\n')
          okx_state_end = okx.index('\n    async def connected', okx_state_start)
          old_okx_state = okx[okx_state_start:okx_state_end]
          if 'super()._write_state()' not in old_okx_state or 'okx-swap-summary.json' not in old_okx_state:
              raise SystemExit('OKX state-write target mismatch')
          new_okx_state = dedent('''
              def _write_source_summaries(self, run_fd: int, payload: dict[str, object]) -> None:
                  super()._write_source_summaries(run_fd, payload)
                  sources = payload.get("sources")
                  run_id = payload.get("run_id")
                  run_state = payload.get("run_state")
                  if not isinstance(sources, dict) or not isinstance(run_id, str):
                      raise RuntimeError("Liquid20 OKX source summary payload is invalid")
                  stats = sources.get(OKX_SOURCE)
                  if not isinstance(stats, dict) or not isinstance(run_state, str):
                      raise RuntimeError("Liquid20 OKX source summary state is invalid")
                  source_payload = {
                      "schema_version": 1,
                      "source": {"id": OKX_SOURCE},
                      "run_id": run_id,
                      "run_state": run_state,
                      "stats": stats,
                      "trading_credentials_present": False,
                      "execution_enabled": False,
                      "orders_submitted": 0,
                  }
                  _write_json_atomic_at(run_fd, "okx-swap-summary.json", source_payload)
                  self._write_okx_snapshot(directory_fd=run_fd)
          ''').lstrip('\n')
          okx = okx[:okx_state_start] + new_okx_state.rstrip('\n') + okx[okx_state_end:]
          okx_path.write_text(okx, encoding='utf-8')

          tests_path = Path('tests/ai_platform_integration/test_liquidation_live_restart_durability.py')
          tests = tests_path.read_text(encoding='utf-8')
          marker = '\n\ndef test_restart_truncates_only_uncommitted_suffix_before_completion'
          if marker not in tests:
              raise SystemExit('test insertion marker missing')
          if 'test_stop_okx_summary_failure_is_restart_recoverable' in tests:
              raise SystemExit('recoverable-finalization tests already present')
          addition = dedent('''

              def test_stop_okx_summary_failure_is_restart_recoverable(
                  tmp_path: Path, monkeypatch: pytest.MonkeyPatch
              ) -> None:
                  import ai_platform.scripts.liquidation_live_stream_okx as okx_module

                  manager = OkxLiveRunManager(
                      data_root=tmp_path,
                      collector_commit="1" * 40,
                      host_id="synology-test",
                      now_ms=lambda: 1_786_384_683_792,
                  )

                  async def scenario() -> None:
                      await manager.start()
                      old_run_id = manager.run_id
                      old_run_root = manager.run_root
                      retained = [manager._live_root_fd, manager._runs_root_fd, manager._run_root_fd]
                      real_write = okx_module._write_json_atomic_at
                      failed = False

                      def fail_completed_okx_summary_once(
                          directory_fd: int, file_name: str, payload: dict[str, object]
                      ) -> None:
                          nonlocal failed
                          if (
                              not failed
                              and file_name == "okx-swap-summary.json"
                              and payload.get("run_state") == "completed"
                          ):
                              failed = True
                              raise RuntimeError("forced completed OKX summary failure")
                          real_write(directory_fd, file_name, payload)

                      monkeypatch.setattr(
                          okx_module,
                          "_write_json_atomic_at",
                          fail_completed_okx_summary_once,
                      )
                      with pytest.raises(RuntimeError, match="forced completed OKX summary failure"):
                          await manager.stop()

                      persisted = json.loads(
                          (old_run_root / "run-state-v1.json").read_text(encoding="utf-8")
                      )
                      pointer = json.loads(
                          (tmp_path / "live" / LIVE_STATE_FILE).read_text(encoding="utf-8")
                      )
                      assert persisted["run_state"] == "active"
                      assert pointer["active_run_id"] == old_run_id
                      assert manager._live_root_fd is None
                      assert manager._runs_root_fd is None
                      assert manager._run_root_fd is None
                      for descriptor in retained:
                          assert descriptor is not None
                          with pytest.raises(OSError):
                              os.fstat(descriptor)

                      recovery = OkxLiveRunManager(
                          data_root=tmp_path,
                          collector_commit="2" * 40,
                          host_id="synology-test",
                          now_ms=lambda: 1_786_384_683_793,
                      )
                      await recovery.start()
                      assert recovery.run_id != old_run_id
                      completed = json.loads(
                          (old_run_root / "run-state-v1.json").read_text(encoding="utf-8")
                      )
                      assert completed["run_state"] == "completed"
                      assert completed["completion_reason"] == "collector-restart"
                      for source in (BYBIT_SOURCE, BINANCE_SOURCE, OKX_SOURCE):
                          summary = json.loads(
                              (old_run_root / f"{source}-summary.json").read_text(encoding="utf-8")
                          )
                          assert summary["run_id"] == old_run_id
                          assert summary["run_state"] == "completed"
                      new_pointer = json.loads(
                          (tmp_path / "live" / LIVE_STATE_FILE).read_text(encoding="utf-8")
                      )
                      assert new_pointer["active_run_id"] == recovery.run_id
                      await recovery.stop()

                  asyncio.run(scenario())


              def test_stop_pointer_failure_leaves_coherent_history_for_restart(
                  tmp_path: Path, monkeypatch: pytest.MonkeyPatch
              ) -> None:
                  import ai_platform.scripts.liquidation_live_stream as stream_module

                  manager = OkxLiveRunManager(
                      data_root=tmp_path,
                      collector_commit="3" * 40,
                      host_id="synology-test",
                      now_ms=lambda: 1_786_384_683_792,
                  )

                  async def scenario() -> None:
                      await manager.start()
                      old_run_id = manager.run_id
                      old_run_root = manager.run_root
                      real_write = stream_module._write_json_atomic_at
                      failed = False

                      def fail_completed_pointer_once(
                          directory_fd: int, file_name: str, payload: dict[str, object]
                      ) -> None:
                          nonlocal failed
                          if (
                              not failed
                              and file_name == LIVE_STATE_FILE
                              and payload.get("active_run_id") is None
                          ):
                              failed = True
                              raise RuntimeError("forced completed pointer failure")
                          real_write(directory_fd, file_name, payload)

                      monkeypatch.setattr(
                          stream_module,
                          "_write_json_atomic_at",
                          fail_completed_pointer_once,
                      )
                      with pytest.raises(RuntimeError, match="forced completed pointer failure"):
                          await manager.stop()

                      persisted = json.loads(
                          (old_run_root / "run-state-v1.json").read_text(encoding="utf-8")
                      )
                      pointer = json.loads(
                          (tmp_path / "live" / LIVE_STATE_FILE).read_text(encoding="utf-8")
                      )
                      assert persisted["run_state"] == "completed"
                      assert pointer["active_run_id"] == old_run_id
                      for source in (BYBIT_SOURCE, BINANCE_SOURCE, OKX_SOURCE):
                          summary = json.loads(
                              (old_run_root / f"{source}-summary.json").read_text(encoding="utf-8")
                          )
                          assert summary["run_state"] == "completed"

                      recovery = OkxLiveRunManager(
                          data_root=tmp_path,
                          collector_commit="4" * 40,
                          host_id="synology-test",
                          now_ms=lambda: 1_786_384_683_793,
                      )
                      await recovery.start()
                      assert recovery.run_id != old_run_id
                      new_pointer = json.loads(
                          (tmp_path / "live" / LIVE_STATE_FILE).read_text(encoding="utf-8")
                      )
                      assert new_pointer["active_run_id"] == recovery.run_id
                      await recovery.stop()

                  asyncio.run(scenario())
          ''')
          tests_path.write_text(tests.replace(marker, addition + marker, 1), encoding='utf-8')
          PY

      - name: Install isolated focused validation tools
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/wickhunter-finalization-deps"
          rm -rf "$deps"
          mkdir -p "$deps"
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o "$RUNNER_TEMP/get-pip.py"
          python3 "$RUNNER_TEMP/get-pip.py" --target "$deps"
          PYTHONPATH="$deps" python3 -m pip install --disable-pip-version-check --upgrade --target "$deps" \
            websockets==16.0 pytest==9.1.1 ruff==0.15.21
          echo "PYTHONPATH=$deps${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Validate recoverable finalization repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff format \
            ai_platform/scripts/liquidation_live_stream.py \
            ai_platform/scripts/liquidation_live_stream_okx.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m ruff check --fix \
            ai_platform/scripts/liquidation_live_stream.py \
            ai_platform/scripts/liquidation_live_stream_okx.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m py_compile \
            ai_platform/scripts/liquidation_live_stream.py \
            ai_platform/scripts/liquidation_live_stream_okx.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py \
            tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py \
            tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff check \
            ai_platform/scripts/liquidation_live_stream.py \
            ai_platform/scripts/liquidation_live_stream_okx.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py \
            tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff format --check \
            ai_platform/scripts/liquidation_live_stream.py \
            ai_platform/scripts/liquidation_live_stream_okx.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py \
            tests/ai_platform_integration/test_liquidation_okx_live_source.py
          git diff --check

      - name: Commit validated product repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ai_platform/scripts/liquidation_live_stream.py \
            ai_platform/scripts/liquidation_live_stream_okx.py \
            tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git commit -m 'fix(liquidations): make finalization restart recoverable'
          repair_sha="$(git rev-parse HEAD)"
          echo "REPAIR_SHA=$repair_sha" >> "$GITHUB_ENV"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:fix/wickhunter-1396-synology-recovery-v2

      - name: Refresh canonical checkpoint and self-clean
        env:
          REPAIR_SHA: ${{ env.REPAIR_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          task = Path('docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md')
          text = task.read_text(encoding='utf-8')
          repair_sha = os.environ['REPAIR_SHA']
          run_id = os.environ['GITHUB_RUN_ID']
          now = datetime.now(ZoneInfo('Europe/Warsaw')).replace(microsecond=0).isoformat()

          context_prefix = '## Context checkpoint\n\n```yaml\n'
          context_suffix = '\n```\n\n## Recovery checkpoint'
          start = text.index(context_prefix) + len(context_prefix)
          end = text.index(context_suffix, start)
          checkpoint = text[start:end]
          rows = checkpoint.splitlines()
          for index, line in enumerate(rows):
              if line.startswith('updated_at:'):
                  rows[index] = f'updated_at: {now}'
              elif line.startswith('head:'):
                  rows[index] = f'head: {repair_sha}'
              elif line.startswith('next_action:'):
                  rows[index] = 'next_action: Run final exact-head PR 1450 CI and fresh Codex audit after recoverable multi-file finalization repair; if green, squash-merge and continue canonical Liquid20 deployment plus guarded completed-history repair.'
          checkpoint = '\n'.join(rows)
          old_proven = '  - malformed active source state missing events_written now fails closed before any source truncation with no default zero commit boundary; normal and exceptional stop paths close all retained runtime directory descriptors and repeated stop remains safe'
          new_proven = old_proven + '; multi-file finalization now writes all source summaries before durable run-state and pointer publication so summary failures remain restart-recoverable while descriptors still close on exceptional stop'
          if checkpoint.count(old_proven) != 1:
              raise SystemExit('proven finalization insertion target mismatch')
          checkpoint = checkpoint.replace(old_proven, new_proven, 1)
          old_command = '  - command: Retained FD lifecycle and stop validation\n'
          new_command = '  - command: Retained FD lifecycle stop and recoverable finalization validation\n'
          if checkpoint.count(old_command) != 1:
              raise SystemExit('validation command target mismatch')
          checkpoint = checkpoint.replace(old_command, new_command, 1)
          old_evidence = '    evidence: GitHub Actions run 31467075693 passed 25 focused new-run descriptor tests and run 31470901848 job 93713775781 passed 27 focused restart and OKX tests including normal and exceptional stop descriptor closure plus py_compile Ruff check format and diff hygiene'
          new_evidence = old_evidence + f'; run {run_id} additionally passed recoverable OKX-summary and final-pointer failure restart tests plus the full focused restart/OKX suite'
          if checkpoint.count(old_evidence) != 1:
              raise SystemExit('validation evidence target mismatch')
          checkpoint = checkpoint.replace(old_evidence, new_evidence, 1)
          text = text[:start] + checkpoint + text[end:]

          recovery_prefix = '## Recovery checkpoint\n\n```yaml\n'
          recovery_suffix = '\n```\n\n## Terminal closeout requirements'
          rstart = text.index(recovery_prefix) + len(recovery_prefix)
          rend = text.index(recovery_suffix, rstart)
          recovery = text[rstart:rend]
          rrows = recovery.splitlines()
          for index, line in enumerate(rrows):
              if line.startswith('  generation:'):
                  rrows[index] = '  generation: 16'
              elif line.startswith('  checkpointed_at:'):
                  rrows[index] = f'  checkpointed_at: {now}'
              elif line.startswith('  last_progress_at:'):
                  rrows[index] = f'  last_progress_at: {now}'
              elif line.startswith('  exact_head_before_checkpoint_commit:'):
                  rrows[index] = f'  exact_head_before_checkpoint_commit: {repair_sha}'
              elif line.startswith('  active_operation:'):
                  rrows[index] = '  active_operation: final exact-head CI and independent review after recoverable multi-file finalization repair'
              elif line.startswith('  next_action:'):
                  rrows[index] = '  next_action: Complete final exact-head CI plus fresh Codex review on PR 1450, merge it, then continue canonical Liquid20 deployment and exact historical repair.'
          text = text[:rstart] + '\n'.join(rrows) + text[rend:]
          task.write_text(text, encoding='utf-8')
          PY
          python3 tools/agents/checkpoint.py docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md --require-checkpoint
          git rm .github/workflows/wickhunter-1450-finalization-recovery-repair.yml
          git diff --check

      - name: Commit checkpoint and temporary workflow cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md
          git commit -m 'chore(wickhunter): checkpoint recoverable finalization repair'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
