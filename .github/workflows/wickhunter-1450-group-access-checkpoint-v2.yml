name: WickHunter 1450 shared-GID checkpoint refresh v2

on:
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/wickhunter-1450-group-access-checkpoint-v2.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 30
          persist-credentials: false

      - name: Refresh canonical task checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          task = Path('docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md')
          text = task.read_text(encoding='utf-8')
          delivered_head = '0e2658364e07f9d82480fa20eb040030af92d3cc'
          now = datetime.now(ZoneInfo('Europe/Warsaw')).replace(microsecond=0).isoformat()

          context_prefix = '## Context checkpoint\n\n```yaml\n'
          context_suffix = '\n```\n\n## Recovery checkpoint'
          start = text.index(context_prefix) + len(context_prefix)
          end = text.index(context_suffix, start)
          checkpoint = text[start:end]
          rows = checkpoint.splitlines()
          evidence_updated = False
          for index, line in enumerate(rows):
              if line.startswith('updated_at:'):
                  rows[index] = f'updated_at: {now}'
              elif line.startswith('head:'):
                  rows[index] = f'head: {delivered_head}'
              elif line.startswith('    evidence: GitHub Actions run 31467075693'):
                  if '31475928342' not in line:
                      rows[index] = line + '; run 31475928342 job 93729519994 passed 30 focused tests including production-umask shared-GID mode regression plus py_compile Ruff check format and diff hygiene'
                  evidence_updated = True
              elif line.startswith('next_action:'):
                  rows[index] = 'next_action: Run final exact-head PR 1450 CI and fresh Codex audit after shared-GID mode preservation; if green, squash-merge and continue canonical Liquid20 deployment plus guarded completed-history repair.'
          if not evidence_updated:
              raise SystemExit('retained lifecycle validation evidence row missing')
          checkpoint = '\n'.join(rows)
          proven_old = 'source summaries now commit before run-state and pointer publication so partial finalization failures remain restart-recoverable without retaining directory descriptors'
          if proven_old not in checkpoint:
              raise SystemExit('shared-GID proven insertion target missing')
          if 'production shared-GID contract with 0640 files' not in checkpoint:
              checkpoint = checkpoint.replace(proven_old, proven_old + '; descriptor-hardened runtime creation preserves the production shared-GID contract with 0640 files and 0750 run directories under umask 027', 1)
          text = text[:start] + checkpoint + text[end:]

          recovery_prefix = '## Recovery checkpoint\n\n```yaml\n'
          recovery_suffix = '\n```\n\n## Terminal closeout requirements'
          rstart = text.index(recovery_prefix) + len(recovery_prefix)
          rend = text.index(recovery_suffix, rstart)
          recovery = text[rstart:rend]
          rrows = recovery.splitlines()
          for index, line in enumerate(rrows):
              if line.startswith('  generation:'):
                  rrows[index] = '  generation: 17'
              elif line.startswith('  checkpointed_at:'):
                  rrows[index] = f'  checkpointed_at: {now}'
              elif line.startswith('  last_progress_at:'):
                  rrows[index] = f'  last_progress_at: {now}'
              elif line.startswith('  exact_head_before_checkpoint_commit:'):
                  rrows[index] = f'  exact_head_before_checkpoint_commit: {delivered_head}'
              elif line.startswith('  active_operation:'):
                  rrows[index] = '  active_operation: final exact-head CI and independent review after shared-GID mode preservation'
              elif line.startswith('  next_action:'):
                  rrows[index] = '  next_action: Complete final exact-head CI plus fresh Codex review on PR 1450, merge it, then continue canonical Liquid20 deployment and exact historical repair.'
          text = text[:rstart] + '\n'.join(rrows) + text[rend:]
          task.write_text(text, encoding='utf-8')
          PY
          python3 tools/agents/checkpoint.py docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md --require-checkpoint
          git diff --check

      - name: Commit validated checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/agents/tasks/active/FTAI-20260808-wickhunter-unified-runtime-mode.md
          git commit -m 'chore(wickhunter): checkpoint shared group access repair'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
