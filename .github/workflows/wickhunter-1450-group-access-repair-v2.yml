name: WickHunter 1450 Liquid20 group access repair v2

on:
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/wickhunter-1450-group-access-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 30
          persist-credentials: false

      - name: Preserve shared-GID access and add regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('ai_platform/scripts/liquidation_live_stream.py')
          text = source.read_text(encoding='utf-8')

          writer_old = '''                | os.O_APPEND
                          | nofollow_flag
                          | getattr(os, "O_CLOEXEC", 0),
                          0o600,
                          dir_fd=directory_fd,
          '''
          writer_old = '\n'.join(line[10:] if line.startswith('          ') else line for line in writer_old.splitlines()) + '\n'
          if text.count(writer_old) != 1:
              raise SystemExit('NDJSON secure-create mode target mismatch')
          text = text.replace(writer_old, writer_old.replace('0o600,', '0o640,'), 1)

          atomic_old = '''            os.O_WRONLY | os.O_CREAT | os.O_EXCL | nofollow_flag | getattr(os, "O_CLOEXEC", 0),
                      0o600,
                      dir_fd=directory_fd,
          '''
          atomic_old = '\n'.join(line[10:] if line.startswith('          ') else line for line in atomic_old.splitlines()) + '\n'
          if text.count(atomic_old) != 1:
              raise SystemExit('atomic JSON secure-create mode target mismatch')
          text = text.replace(atomic_old, atomic_old.replace('0o600,', '0o640,'), 1)

          mkdir_old = '                os.mkdir(run_id, mode=0o700, dir_fd=runs_fd)\n'
          if text.count(mkdir_old) != 1:
              raise SystemExit('new-run directory mode target mismatch')
          text = text.replace(mkdir_old, '                os.mkdir(run_id, mode=0o750, dir_fd=runs_fd)\n', 1)
          source.write_text(text, encoding='utf-8')

          tests_path = Path('tests/ai_platform_integration/test_liquidation_live_restart_durability.py')
          tests = tests_path.read_text(encoding='utf-8')
          if 'import stat\n' not in tests:
              if tests.count('import os\n') != 1:
                  raise SystemExit('stat import insertion target mismatch')
              tests = tests.replace('import os\n', 'import os\nimport stat\n', 1)
          if 'test_runtime_artifacts_preserve_shared_gid_modes' in tests:
              raise SystemExit('shared-GID mode regression already present')
          marker = '\n\ndef test_restart_truncates_only_uncommitted_suffix_before_completion'
          if marker not in tests:
              raise SystemExit('mode-test insertion marker missing')
          addition = dedent('''

          def test_runtime_artifacts_preserve_shared_gid_modes(tmp_path: Path) -> None:
              manager = LiveRunManager(
                  data_root=tmp_path,
                  collector_commit="5" * 40,
                  host_id="synology-test",
                  now_ms=lambda: 1_786_384_683_792,
              )

              async def scenario() -> None:
                  await manager.start()
                  assert stat.S_IMODE(manager.run_root.stat().st_mode) == 0o750
                  for path in (
                      manager.run_root / "bybit-linear.ndjson",
                      manager.run_root / "binance-usdm.ndjson",
                      manager.run_root / "run-state-v1.json",
                      manager.run_root / "bybit-linear-summary.json",
                      manager.run_root / "binance-usdm-summary.json",
                      tmp_path / "live" / LIVE_STATE_FILE,
                  ):
                      assert stat.S_IMODE(path.stat().st_mode) == 0o640, path
                  await manager.stop()

              previous_umask = os.umask(0o027)
              try:
                  asyncio.run(scenario())
              finally:
                  os.umask(previous_umask)
          ''')
          tests_path.write_text(tests.replace(marker, addition + marker, 1), encoding='utf-8')
          PY

      - name: Install isolated validation tools
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/wickhunter-group-access-deps"
          rm -rf "$deps"
          mkdir -p "$deps"
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o "$RUNNER_TEMP/get-pip.py"
          python3 "$RUNNER_TEMP/get-pip.py" --target "$deps"
          PYTHONPATH="$deps" python3 -m pip install --disable-pip-version-check --upgrade --target "$deps" websockets==16.0 pytest==9.1.1 ruff==0.15.21
          echo "PYTHONPATH=$deps${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Validate shared-GID repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m ruff format ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m ruff check --fix ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python3 -m py_compile ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff check ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          python3 -m ruff format --check ai_platform/scripts/liquidation_live_stream.py ai_platform/scripts/liquidation_live_stream_okx.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py tests/ai_platform_integration/test_liquidation_okx_live_source.py
          git diff --check

      - name: Commit validated product and regression repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git commit -m 'fix(liquidations): preserve shared group access'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
