name: WickHunter PR1450 Reconcile Develop

"on":
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/wickhunter-1450-reconcile-develop.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 0
      - name: Merge latest develop and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin develop
          git merge --no-ff --no-commit origin/develop
          git rm .github/workflows/wickhunter-1450-reconcile-develop.yml
          git diff --check --cached
          git commit -m 'chore(wickhunter): reconcile PR 1450 with latest develop'
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
