name: WickHunter 1450 run-id repair

on:
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/wickhunter-1450-run-id-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply fail-closed run identity repair and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('ai_platform/scripts/liquidation_live_stream.py')
          source = source_path.read_text(encoding='utf-8')
          old = '''            if state is None or state.get("run_state") != "active":\n                return\n            sources = state.get("sources")\n'''
          new = '''            if state is None or state.get("run_state") != "active":\n                return\n            if state.get("run_id") != run_id:\n                raise RuntimeError("previous live run_id does not match active pointer")\n            sources = state.get("sources")\n'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one source insertion point, found {source.count(old)}')
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/ai_platform_integration/test_liquidation_live_restart_durability.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '''def test_restart_rejects_missing_events_written_without_mutating_source(\n    tmp_path: Path,\n) -> None:\n'''
          regression = '''def test_restart_rejects_mismatched_state_run_id_before_sealing(tmp_path: Path) -> None:\n    old_run_id, old_run_root = _write_previous_active_run(\n        tmp_path,\n        committed_rows={BINANCE_SOURCE: 1, BYBIT_SOURCE: 0, OKX_SOURCE: 0},\n        actual_rows={BINANCE_SOURCE: 2, BYBIT_SOURCE: 0, OKX_SOURCE: 0},\n    )\n    state_path = old_run_root / "run-state-v1.json"\n    state = json.loads(state_path.read_text(encoding="utf-8"))\n    state["run_id"] = "liquid20-20260810T000000Z-2"\n    state_path.write_text(json.dumps(state), encoding="utf-8")\n    source_path = old_run_root / f"{BINANCE_SOURCE}.ndjson"\n    original = source_path.read_bytes()\n    manager = OkxLiveRunManager(\n        data_root=tmp_path,\n        collector_commit="a" * 40,\n        host_id="synology-test",\n        now_ms=lambda: 1_786_384_683_792,\n    )\n\n    with pytest.raises(RuntimeError, match="previous live run_id does not match active pointer"):\n        asyncio.run(manager.start())\n\n    assert source_path.read_bytes() == original\n    persisted = json.loads(state_path.read_text(encoding="utf-8"))\n    assert persisted["run_state"] == "active"\n    assert persisted["run_id"] == "liquid20-20260810T000000Z-2"\n    pointer = json.loads((tmp_path / "live" / LIVE_STATE_FILE).read_text(encoding="utf-8"))\n    assert pointer["active_run_id"] == old_run_id\n    assert sorted(path.name for path in (tmp_path / "live" / "runs").iterdir()) == [old_run_id]\n\n\n'''
          if tests.count(anchor) != 1:
              raise SystemExit(f'expected one test insertion point, found {tests.count(anchor)}')
          test_path.write_text(tests.replace(anchor, regression + anchor, 1), encoding='utf-8')
          PY
      - name: Validate focused repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest==9.1.1 websockets==16.0 ruff==0.15.21
          python -m ruff format ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python -m ruff check --fix ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python -m py_compile ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform_integration tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python -m ruff check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          python -m ruff format --check ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py
          git diff --check
      - name: Commit repair and remove validator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/wickhunter-1450-run-id-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_platform/scripts/liquidation_live_stream.py tests/ai_platform_integration/test_liquidation_live_restart_durability.py .github/workflows/wickhunter-1450-run-id-repair.yml
          git commit -m 'fix(liquidations): reject mismatched restart run identity'
          git push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
