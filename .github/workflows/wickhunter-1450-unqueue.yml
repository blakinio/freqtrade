name: WickHunter 1450 repair runner routing

on:
  push:
    branches:
      - fix/wickhunter-1396-synology-recovery-v2
    paths:
      - .github/workflows/wickhunter-1450-unqueue.yml

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/wickhunter-1396-synology-recovery-v2
          persist-credentials: false
      - name: Route bounded repair to hosted runner and self-clean
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target=.github/workflows/wickhunter-1450-finalization-recovery-repair.yml
          grep -q '^    runs-on: freqtrade-staging$' "$target"
          sed -i 's/^    runs-on: freqtrade-staging$/    runs-on: ubuntu-latest/' "$target"
          git rm .github/workflows/wickhunter-1450-unqueue.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'chore(wickhunter): route finalization repair to hosted runner'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:fix/wickhunter-1396-synology-recovery-v2
