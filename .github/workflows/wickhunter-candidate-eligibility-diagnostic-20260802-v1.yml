name: WickHunter candidate eligibility diagnostic v1

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-candidate-eligibility-diagnostic-20260802-v1.yml"

permissions:
  contents: read

concurrency:
  group: wickhunter-candidate-eligibility-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WORKFLOW_PATH: .github/workflows/wickhunter-candidate-eligibility-diagnostic-20260802-v1.yml
  DATASET_ROOT: /var/lib/freqtrade-staging-state/wickhunter-production-datasets/wickhunter-wh01-production-dataset-20260731-v3-2091971608df-eaccc5ec-8f5be573
  PRICE_PATH_ROOT: /var/lib/freqtrade-staging-state/wickhunter-replay-price-path/packages/wickhunter-wh02-replay-price-path-20260731-v5-h180s-5cffc1902479
  REPLAY_ROOT: /var/lib/freqtrade-staging-state/wickhunter-deterministic-replay/packages/wickhunter-wh02-deterministic-replay-20260802-v4-eac7fe2e1cb3

jobs:
  diagnose:
    name: Diagnose candidate example eligibility
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 90

    steps:
      - name: Check out exact request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact request and closed authority
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" == "$BASE_SHA" ]]
          expected=$'A\t.github/workflows/wickhunter-candidate-eligibility-diagnostic-20260802-v1.yml'
          [[ "$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")" == "$expected" ]]
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          [[ "$RUNNER_NAME_VALUE" == "freqtrade-synology-staging" ]]
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            [[ -z "${!name:-}" ]] || {
              echo "recognized trading credential present: $name" >&2
              exit 1
            }
          done
          for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy; do
            [[ -z "${!name:-}" ]] || {
              echo "proxy environment present: $name" >&2
              exit 1
            }
          done
          for path in "$DATASET_ROOT" "$PRICE_PATH_ROOT" "$REPLAY_ROOT"; do
            [[ -d "$path" && ! -L "$path" && ! -w "$path" ]]
          done
          python3 - <<'PY'
          import ctypes
          ctypes.CDLL("libgomp.so.1")
          print("libgomp_available=true")
          PY

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Inspect candidate eligibility without persistent writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from dataclasses import replace
          from decimal import Decimal
          from pathlib import Path

          from ai_platform.wickhunter.contracts import CandidateAction, StrategyHypothesis
          from ai_platform.wickhunter.deterministic_replay import LabelOutcome
          from ai_platform.wickhunter.lightgbm_scorer import (
              LightGBMScorerError,
              LightGBMTrainingPolicy,
              _candidate_examples,
              train_lightgbm_scorer,
          )
          from ai_platform.wickhunter.parameters import (
              DEFAULT_RESEARCH_BOUNDS,
              INITIAL_COMPATIBILITY_PRIOR,
              WickHunterParameters,
              validate_parameters,
          )
          from ai_platform.wickhunter.production_evaluation import load_verified_evaluation_dataset
          from ai_platform.wickhunter.strategy import SignalMemory, generate_candidate

          evaluation = load_verified_evaluation_dataset(
              materialization_root=Path(os.environ["DATASET_ROOT"]),
              price_path_root=Path(os.environ["PRICE_PATH_ROOT"]),
              replay_root=Path(os.environ["REPLAY_ROOT"]),
          )
          if len(evaluation.cases) != 919:
              raise RuntimeError("verified evaluation case count mismatch")
          if (
              evaluation.protected_holdout_accessed
              or evaluation.immutable_inputs_mutated
              or evaluation.model_execution_authorized
              or evaluation.performance_research_authorized
              or evaluation.execution_enabled
              or evaluation.live_capital_authorized
              or evaluation.trading_credentials_present
              or evaluation.orders_submitted != 0
          ):
              raise RuntimeError("evaluation dataset contains unsafe authority")

          candidates: list[WickHunterParameters] = []
          index = 0
          for band in (Decimal("0.001"), Decimal("0.0015"), Decimal("0.002")):
              for percentile in (Decimal("0.50"), Decimal("0.65")):
                  for zscore in (Decimal("0"), Decimal("1")):
                      index += 1
                      item = replace(
                          INITIAL_COMPATIBILITY_PRIOR,
                          parameter_version=f"wickhunter-production-h180s-{index:02d}",
                          liquidation_percentile=percentile,
                          liquidation_zscore=zscore,
                          minimum_quote_volume_usd=Decimal("1000000"),
                          long_vwap_distance_ratio=band,
                          short_vwap_distance_ratio=band,
                          minimum_wick_ratio=Decimal("0"),
                          minimum_volatility=Decimal("0"),
                          maximum_volatility=Decimal("0.50"),
                          cooldown_ms=0,
                          maximum_event_age_ms=300_000,
                          base_risk_ratio=Decimal("0.001"),
                          leverage=Decimal("1"),
                          dca_enabled=False,
                          dca_levels=0,
                          dca_total_risk_ratio=Decimal("0.001"),
                          maximum_holding_ms=180_000,
                          minimum_confidence=Decimal("0.50"),
                      )
                      validate_parameters(item, DEFAULT_RESEARCH_BOUNDS)
                      candidates.append(item)

          policy = LightGBMTrainingPolicy(
              training_splits=("train",),
              calibration_splits=("validation",),
              validation_splits=("test",),
              forbidden_splits=("holdout", "protected_holdout"),
              seed=20260801,
              num_boost_round=40,
              num_leaves=7,
              min_data_in_leaf=2,
              learning_rate=Decimal("0.05"),
              calibration_bins=10,
              no_trade_confidence=Decimal("0.60"),
          )

          def inspect_split(parameters: WickHunterParameters, split_name: str) -> dict[str, object]:
              split_cases = tuple(case for case in evaluation.cases if case.split_name == split_name)
              actions: Counter[str] = Counter()
              outcomes: Counter[str] = Counter()
              targets: Counter[str] = Counter()
              returns: list[Decimal] = []
              directional = 0
              eligible = 0
              for case in split_cases:
                  for hypothesis in (
                      StrategyHypothesis.CONTINUATION,
                      StrategyHypothesis.REVERSAL,
                  ):
                      candidate = generate_candidate(
                          features=case.feature,
                          parameters=parameters,
                          hypothesis=hypothesis,
                          memory=SignalMemory(),
                      )
                      actions[f"{hypothesis.value}:{candidate.action.value}"] += 1
                      if candidate.action is CandidateAction.IGNORE or candidate.side is None:
                          continue
                      directional += 1
                      label = case.label_for(candidate.side)
                      outcomes[label.outcome.value] += 1
                      if label.outcome is LabelOutcome.MISSING_ENTRY or label.net_return_ratio is None:
                          continue
                      eligible += 1
                      target = "positive" if label.net_return_ratio > 0 else "non_positive"
                      targets[target] += 1
                      returns.append(label.net_return_ratio)
              try:
                  examples = _candidate_examples(
                      split_cases,
                      parameters=parameters,
                      policy=policy,
                  )
                  example_error = None
                  example_count = len(examples)
                  example_targets = Counter(
                      "positive" if example.target == 1 else "non_positive" for example in examples
                  )
              except LightGBMScorerError as exc:
                  example_error = str(exc)
                  example_count = 0
                  example_targets = Counter()
              return {
                  "case_count": len(split_cases),
                  "action_counts": dict(sorted(actions.items())),
                  "directional_candidate_count": directional,
                  "label_outcomes": dict(sorted(outcomes.items())),
                  "eligible_example_count": eligible,
                  "target_counts": dict(sorted(targets.items())),
                  "return_min": None if not returns else str(min(returns)),
                  "return_max": None if not returns else str(max(returns)),
                  "candidate_examples_count": example_count,
                  "candidate_examples_targets": dict(sorted(example_targets.items())),
                  "candidate_examples_error": example_error,
              }

          report: dict[str, object] = {
              "schema_version": "wickhunter-candidate-eligibility-diagnostic-v1",
              "evaluation_sha256": evaluation.evaluation_sha256,
              "case_count": len(evaluation.cases),
              "split_counts": {
                  split: sum(case.split_name == split for case in evaluation.cases)
                  for split in ("train", "validation", "test")
              },
              "candidates": [],
              "protected_holdout_accessed": False,
              "persistent_state_written": False,
              "execution_enabled": False,
              "live_capital_authorized": False,
              "trading_credentials_present": False,
              "orders_submitted": 0,
          }
          candidate_reports: list[dict[str, object]] = []
          for candidate in candidates:
              candidate_report: dict[str, object] = {
                  "parameter_version": candidate.parameter_version,
                  "parameter_sha256": candidate.parameter_hash,
                  "liquidation_percentile": str(candidate.liquidation_percentile),
                  "liquidation_zscore": str(candidate.liquidation_zscore),
                  "vwap_band": str(candidate.long_vwap_distance_ratio),
                  "splits": {
                      split: inspect_split(candidate, split)
                      for split in ("train", "validation", "test")
                  },
              }
              train_split = candidate_report["splits"]["train"]
              validation_split = candidate_report["splits"]["validation"]
              prerequisites = (
                  train_split["candidate_examples_error"] is None
                  and validation_split["candidate_examples_error"] is None
                  and set(train_split["candidate_examples_targets"]) == {"positive", "non_positive"}
              )
              candidate_report["training_prerequisites_satisfied"] = prerequisites
              if prerequisites:
                  try:
                      artifact = train_lightgbm_scorer(
                          cases=evaluation.cases,
                          parameters=candidate,
                          parameter_bounds=DEFAULT_RESEARCH_BOUNDS,
                          policy=policy,
                      )
                      candidate_report["train_result"] = "accepted"
                      candidate_report["artifact_sha256"] = artifact.artifact_sha256
                  except LightGBMScorerError as exc:
                      candidate_report["train_result"] = "rejected"
                      candidate_report["train_error"] = str(exc)
              else:
                  if train_split["candidate_examples_error"] is not None:
                      reason = train_split["candidate_examples_error"]
                  elif validation_split["candidate_examples_error"] is not None:
                      reason = validation_split["candidate_examples_error"]
                  else:
                      reason = "training data must contain positive and negative outcomes"
                  candidate_report["train_result"] = "rejected"
                  candidate_report["train_error"] = reason
              candidate_reports.append(candidate_report)
          report["candidates"] = candidate_reports
          report["accepted_candidate_count"] = sum(
              item["train_result"] == "accepted" for item in candidate_reports
          )
          report["rejection_reasons"] = dict(
              sorted(Counter(str(item.get("train_error")) for item in candidate_reports).items())
          )
          payload = json.dumps(report, sort_keys=True, separators=(",", ":"))
          print(f"WICKHUNTER_DIAGNOSTIC_JSON={payload}")
          summary = {
              "accepted_candidate_count": report["accepted_candidate_count"],
              "rejection_reasons": report["rejection_reasons"],
              "split_counts": report["split_counts"],
              "execution_enabled": False,
              "live_capital_authorized": False,
              "orders_submitted": 0,
          }
          print("WICKHUNTER_DIAGNOSTIC_SUMMARY=" + json.dumps(summary, sort_keys=True))
          PY
