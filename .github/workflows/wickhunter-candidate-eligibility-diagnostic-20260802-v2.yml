name: WickHunter candidate gate diagnostic v3

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-candidate-eligibility-diagnostic-20260802-v2.yml"

permissions:
  contents: read

concurrency:
  group: wickhunter-candidate-eligibility-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WORKFLOW_PATH: .github/workflows/wickhunter-candidate-eligibility-diagnostic-20260802-v2.yml
  DATASET_ROOT: /var/lib/freqtrade-staging-state/wickhunter-production-datasets/wickhunter-wh01-production-dataset-20260731-v3-2091971608df-eaccc5ec-8f5be573
  PRICE_PATH_ROOT: /var/lib/freqtrade-staging-state/wickhunter-replay-price-path/packages/wickhunter-wh02-replay-price-path-20260731-v5-h180s-5cffc1902479
  REPLAY_ROOT: /var/lib/freqtrade-staging-state/wickhunter-deterministic-replay/packages/wickhunter-wh02-deterministic-replay-20260802-v4-eac7fe2e1cb3

jobs:
  diagnose:
    name: Isolate zero-candidate strategy gate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 30

    steps:
      - name: Check out exact request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact request and closed authority
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" == "$BASE_SHA" ]]
          expected=$'A\t.github/workflows/wickhunter-candidate-eligibility-diagnostic-20260802-v2.yml'
          [[ "$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")" == "$expected" ]]
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          [[ "$RUNNER_NAME_VALUE" == "freqtrade-synology-staging" ]]
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            [[ -z "${!name:-}" ]] || {
              echo "recognized trading credential present: $name" >&2
              exit 1
            }
          done
          for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy; do
            [[ -z "${!name:-}" ]] || {
              echo "proxy environment present: $name" >&2
              exit 1
            }
          done
          for path in "$DATASET_ROOT" "$PRICE_PATH_ROOT" "$REPLAY_ROOT"; do
            [[ -d "$path" && ! -L "$path" ]]
          done

      - name: Diagnose strategy gates without fitting or writes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from dataclasses import replace
          from decimal import Decimal
          from pathlib import Path

          from ai_platform.wickhunter.contracts import StrategyHypothesis
          from ai_platform.wickhunter.parameters import (
              DEFAULT_RESEARCH_BOUNDS,
              INITIAL_COMPATIBILITY_PRIOR,
              validate_parameters,
          )
          from ai_platform.wickhunter.production_evaluation import load_verified_evaluation_dataset
          from ai_platform.wickhunter.strategy import SignalMemory, generate_candidate

          evaluation = load_verified_evaluation_dataset(
              materialization_root=Path(os.environ["DATASET_ROOT"]),
              price_path_root=Path(os.environ["PRICE_PATH_ROOT"]),
              replay_root=Path(os.environ["REPLAY_ROOT"]),
          )
          if len(evaluation.cases) != 919:
              raise RuntimeError("verified evaluation case count mismatch")
          if (
              evaluation.protected_holdout_accessed
              or evaluation.immutable_inputs_mutated
              or evaluation.model_execution_authorized
              or evaluation.performance_research_authorized
              or evaluation.execution_enabled
              or evaluation.live_capital_authorized
              or evaluation.trading_credentials_present
              or evaluation.orders_submitted != 0
          ):
              raise RuntimeError("evaluation dataset contains unsafe authority")

          parameters = replace(
              INITIAL_COMPATIBILITY_PRIOR,
              parameter_version="wickhunter-gate-diagnostic-minimum-bounds-v1",
              liquidation_percentile=Decimal("0.50"),
              liquidation_zscore=Decimal("0"),
              minimum_quote_volume_usd=Decimal("1000000"),
              long_vwap_distance_ratio=Decimal("0.001"),
              short_vwap_distance_ratio=Decimal("0.001"),
              minimum_wick_ratio=Decimal("0"),
              minimum_volatility=Decimal("0"),
              maximum_volatility=Decimal("0.50"),
              cooldown_ms=0,
              maximum_event_age_ms=300_000,
              base_risk_ratio=Decimal("0.001"),
              leverage=Decimal("1"),
              dca_enabled=False,
              dca_levels=0,
              dca_total_risk_ratio=Decimal("0.001"),
              maximum_holding_ms=180_000,
              minimum_confidence=Decimal("0.50"),
          )
          validate_parameters(parameters, DEFAULT_RESEARCH_BOUNDS)
          hypothetical_bands = tuple(
              Decimal(value)
              for value in (
                  "0",
                  "0.00001",
                  "0.00005",
                  "0.00010",
                  "0.00025",
                  "0.00050",
                  "0.00100",
              )
          )

          split_reports: dict[str, object] = {}
          global_reason_counts: Counter[str] = Counter()
          for split in ("train", "validation", "test"):
              cases = tuple(case for case in evaluation.cases if case.split_name == split)
              gates: Counter[str] = Counter()
              reasons: Counter[str] = Counter()
              band_counts = {
                  str(band): {"reversal": 0, "continuation": 0}
                  for band in hypothetical_bands
              }
              long_capacities: list[tuple[Decimal, str, int]] = []
              short_capacities: list[tuple[Decimal, str, int]] = []
              distances: list[Decimal] = []
              for case in cases:
                  feature = case.feature
                  event_age = feature.decision_timestamp_ms - max(
                      aggregate.latest_received_at_ms for aggregate in feature.source_aggregates
                  )
                  if event_age > parameters.maximum_event_age_ms:
                      gates["stale"] += 1
                      continue
                  gates["fresh"] += 1
                  if (
                      feature.maximum_event_percentile < parameters.liquidation_percentile
                      and feature.maximum_event_zscore < parameters.liquidation_zscore
                  ):
                      gates["liquidation_threshold_not_met"] += 1
                      continue
                  gates["liquidation_threshold_met"] += 1
                  quote_volume = feature.metric("quote_volume_24h_usd")
                  volatility = feature.metric("volatility_ratio")
                  wick_ratio = feature.metric("wick_ratio")
                  if quote_volume < parameters.minimum_quote_volume_usd:
                      gates["quote_volume_below_minimum"] += 1
                      continue
                  if not parameters.minimum_volatility <= volatility <= parameters.maximum_volatility:
                      gates["volatility_outside_range"] += 1
                      continue
                  if wick_ratio < parameters.minimum_wick_ratio:
                      gates["wick_ratio_below_minimum"] += 1
                      continue
                  gates["nonprice_gates_passed"] += 1

                  vwap = feature.metric("vwap")
                  vwma = feature.metric("vwma")
                  trend = feature.metric("trend_return_ratio")
                  vwap_distance = (feature.decision_price - vwap) / vwap
                  vwma_distance = (feature.decision_price - vwma) / vwma
                  distances.extend((abs(vwap_distance), abs(vwma_distance)))
                  if feature.decision_price == vwap:
                      gates["decision_price_equals_vwap"] += 1
                  if feature.decision_price == vwma:
                      gates["decision_price_equals_vwma"] += 1
                  if vwap == vwma:
                      gates["vwap_equals_vwma"] += 1

                  longs_dominate = (
                      feature.liquidated_long_notional_usd
                      > feature.liquidated_short_notional_usd
                  )
                  shorts_dominate = (
                      feature.liquidated_short_notional_usd
                      > feature.liquidated_long_notional_usd
                  )
                  if not longs_dominate and not shorts_dominate:
                      gates["liquidation_direction_tied"] += 1
                  elif longs_dominate:
                      gates["long_liquidations_dominate"] += 1
                      capacity = min(-vwap_distance, -vwma_distance)
                      long_capacities.append(
                          (capacity, feature.symbol, feature.decision_timestamp_ms)
                      )
                      for band in hypothetical_bands:
                          if capacity >= band:
                              band_counts[str(band)]["reversal"] += 1
                              if trend < 0:
                                  band_counts[str(band)]["continuation"] += 1
                  else:
                      gates["short_liquidations_dominate"] += 1
                      capacity = min(vwap_distance, vwma_distance)
                      short_capacities.append(
                          (capacity, feature.symbol, feature.decision_timestamp_ms)
                      )
                      for band in hypothetical_bands:
                          if capacity >= band:
                              band_counts[str(band)]["reversal"] += 1
                              if trend > 0:
                                  band_counts[str(band)]["continuation"] += 1

                  for hypothesis in (
                      StrategyHypothesis.CONTINUATION,
                      StrategyHypothesis.REVERSAL,
                  ):
                      candidate = generate_candidate(
                          features=feature,
                          parameters=parameters,
                          hypothesis=hypothesis,
                          memory=SignalMemory(),
                      )
                      if candidate.action.value == "ignore":
                          for reason in candidate.reason_codes:
                              reasons[f"{hypothesis.value}:{reason}"] += 1
                      else:
                          reasons[f"{hypothesis.value}:{candidate.action.value}"] += 1

              global_reason_counts.update(reasons)
              long_capacities.sort(reverse=True)
              short_capacities.sort(reverse=True)
              split_reports[split] = {
                  "case_count": len(cases),
                  "gate_counts": dict(sorted(gates.items())),
                  "strategy_reason_counts": dict(sorted(reasons.items())),
                  "hypothetical_band_counts": band_counts,
                  "maximum_absolute_price_metric_distance": (
                      None if not distances else str(max(distances))
                  ),
                  "maximum_long_band_capacity": (
                      None if not long_capacities else str(long_capacities[0][0])
                  ),
                  "maximum_short_band_capacity": (
                      None if not short_capacities else str(short_capacities[0][0])
                  ),
                  "top_long_band_capacities": [
                      {"capacity": str(value), "symbol": symbol, "at_ms": at_ms}
                      for value, symbol, at_ms in long_capacities[:5]
                  ],
                  "top_short_band_capacities": [
                      {"capacity": str(value), "symbol": symbol, "at_ms": at_ms}
                      for value, symbol, at_ms in short_capacities[:5]
                  ],
              }

          report = {
              "schema_version": "wickhunter-candidate-gate-diagnostic-v3",
              "evaluation_sha256": evaluation.evaluation_sha256,
              "parameter_sha256": parameters.parameter_hash,
              "minimum_allowed_band": "0.001",
              "splits": split_reports,
              "global_strategy_reason_counts": dict(sorted(global_reason_counts.items())),
              "protected_holdout_accessed": False,
              "persistent_state_written": False,
              "model_fitting_performed": False,
              "execution_enabled": False,
              "live_capital_authorized": False,
              "trading_credentials_present": False,
              "orders_submitted": 0,
          }
          print("WICKHUNTER_GATE_DIAGNOSTIC=" + json.dumps(report, sort_keys=True))
          PY
