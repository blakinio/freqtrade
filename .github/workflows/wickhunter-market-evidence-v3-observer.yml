name: WickHunter Market Evidence v3 Observer

"on":
  pull_request:
    types: [opened]
    branches:
      - develop
    paths:
      - .github/workflows/wickhunter-market-evidence-v3-observer.yml

permissions:
  contents: read

concurrency:
  group: wickhunter-market-evidence-v3-observer
  cancel-in-progress: false

jobs:
  observe:
    name: Verify existing immutable v3 package
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    environment: synology-staging
    timeout-minutes: 5
    env:
      PACKAGE_ROOT: /var/lib/freqtrade-staging-state/wickhunter-production-market-evidence-v3-20260731/wickhunter-production-market-evidence-20260731-v3-r1/immutable-package
      EXPECTED_PRE_ROLL_START_MS: "1785398400000"
      EXPECTED_DECISION_START_MS: "1785484800000"
      EXPECTED_DECISION_END_MS: "1785520800000"
      PROTECTED_HOLDOUT_START_MS: "1785542400000"

    steps:
      - name: Checkout exact observer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact-one-file observer scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expected=$'A\t.github/workflows/wickhunter-market-evidence-v3-observer.yml'
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          actual="$(git diff --name-status "$merge_base" "$HEAD_SHA")"
          [[ "$actual" == "$expected" ]] || {
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          }

      - name: Refuse credentials and proxy routing
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            BINANCE_API_KEY BINANCE_API_SECRET BINANCE_SECRET_KEY \
            BYBIT_API_KEY BYBIT_API_SECRET \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            EXCHANGE_API_KEY EXCHANGE_API_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET \
            HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          do
            [[ -z "${!name:-}" ]] || {
              echo "BLOCKED forbidden environment: $name" >&2
              exit 1
            }
          done

      - name: Verify package and canonical identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_NAME}" == "freqtrade-synology-staging" ]]
          [[ -d "$PACKAGE_ROOT" && ! -L "$PACKAGE_ROOT" ]]
          PYTHONPATH=. python3 -m ai_platform.wickhunter.production_market_evidence_intersection \
            verify --package-root "$PACKAGE_ROOT"
          PYTHONPATH=. python3 - \
            "$PACKAGE_ROOT/manifest.json" \
            "$PACKAGE_ROOT/source-package-binding.json" \
            "$PACKAGE_ROOT/geometry-intersection-lineage.json" \
            "$PACKAGE_ROOT/verification-report.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          from ai_platform.wickhunter.production_market_evidence_intersection import (
              EXPECTED_SOURCES,
              EXPECTED_SYMBOLS,
          )

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          binding = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          lineage = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding="utf-8"))
          verification = json.loads(pathlib.Path(sys.argv[4]).read_text(encoding="utf-8"))
          expected_geometry = {
              "pre_roll_start_ms": int(os.environ["EXPECTED_PRE_ROLL_START_MS"]),
              "decision_start_ms": int(os.environ["EXPECTED_DECISION_START_MS"]),
              "decision_end_ms": int(os.environ["EXPECTED_DECISION_END_MS"]),
          }
          capture = manifest.get("capture")
          if not isinstance(capture, dict):
              raise SystemExit("BLOCKED first_error=manifest_capture_missing")
          for key, value in expected_geometry.items():
              if capture.get(key) != value:
                  raise SystemExit(f"BLOCKED first_error=geometry_{key}_mismatch")
          holdout = int(os.environ["PROTECTED_HOLDOUT_START_MS"])
          if manifest.get("protected_holdout_start_ms") != holdout:
              raise SystemExit("BLOCKED first_error=holdout_identity_mismatch")
          if capture["decision_end_ms"] >= holdout:
              raise SystemExit("BLOCKED first_error=holdout_overlap")

          sources = manifest.get("sources")
          instruments = manifest.get("instruments")
          if sources != list(EXPECTED_SOURCES):
              raise SystemExit(
                  f"BLOCKED first_error=sources_mismatch actual={sources!r} "
                  f"expected={list(EXPECTED_SOURCES)!r}"
              )
          if instruments != list(EXPECTED_SYMBOLS):
              raise SystemExit("BLOCKED first_error=instruments_mismatch")
          expected_samples = 120
          expected_candles_per_source_symbol = 408
          expected_counts = {
              "source_health_snapshots": expected_samples * len(sources),
              "market_quality_observations": (
                  expected_samples * len(sources) * len(instruments)
              ),
              "instrument_snapshots": (
                  expected_samples * len(sources) * len(instruments)
              ),
              "completed_candles": (
                  expected_candles_per_source_symbol
                  * len(sources)
                  * len(instruments)
              ),
          }
          if manifest.get("record_counts") != expected_counts:
              raise SystemExit("BLOCKED first_error=record_counts_mismatch")

          authorities = manifest.get("authorities")
          false_keys = (
              "trading_credentials_present",
              "execution_enabled",
              "replay_authorized",
              "model_execution_authorized",
              "performance_research_authorized",
              "live_capital_authorized",
          )
          if not isinstance(authorities, dict):
              raise SystemExit("BLOCKED first_error=authorities_missing")
          if any(authorities.get(key) is not False for key in false_keys):
              raise SystemExit("BLOCKED first_error=authority_boundary_mismatch")
          if authorities.get("orders_submitted") != 0:
              raise SystemExit("BLOCKED first_error=orders_submitted_nonzero")
          for key in (
              "protected_holdout_accessed",
              "immutable_inputs_mutated",
              "backfill_performed",
              "synthetic_observations_added",
          ):
              if manifest.get(key) is not False:
                  raise SystemExit(f"BLOCKED first_error={key}")

          wh01 = manifest.get("wh01")
          if not isinstance(wh01, dict):
              raise SystemExit("BLOCKED first_error=wh01_missing")
          if wh01.get("market_evidence_ready") is not True:
              raise SystemExit("BLOCKED first_error=market_evidence_not_ready")
          if wh01.get("ready") is not False:
              raise SystemExit("BLOCKED first_error=unexpected_wh01_ready")
          if wh01.get("blocker_code") != "LIQUIDATION_ARCHIVE_NOT_BOUND":
              raise SystemExit("BLOCKED first_error=unexpected_wh01_blocker")
          if verification.get("outcome") != "accepted":
              raise SystemExit("BLOCKED first_error=verification_not_accepted")

          print(json.dumps({
              "status": "MARKET_EVIDENCE_V3_VERIFIED",
              "run_id": manifest.get("run_id"),
              "manifest_sha256": manifest.get("manifest_sha256"),
              "binding_sha256": binding.get("binding_sha256"),
              "lineage_sha256": lineage.get("lineage_sha256"),
              "sources": sources,
              "instrument_count": len(instruments),
              "geometry": expected_geometry,
              "record_counts": expected_counts,
              "wh01_blocker": wh01.get("blocker_code"),
              "orders_submitted": 0,
          }, sort_keys=True))
          PY
