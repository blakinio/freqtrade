name: WickHunter post-merge Ruff repair

on:
  push:
    branches:
      - agent/wickhunter-postmerge-ruff-repair

permissions:
  contents: write

concurrency:
  group: wickhunter-postmerge-ruff-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install exact Ruff version
        run: python -m pip install ruff==0.15.21

      - name: Apply bounded repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, *, count: int = -1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              occurrences = text.count(old)
              if occurrences < 1:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              if count > 0 and occurrences < count:
                  raise SystemExit(f"expected at least {count} occurrences in {path}, got {occurrences}")
              target.write_text(text.replace(old, new, count), encoding="utf-8")

          replace_exact(
              "ai_platform/wickhunter/production_market_evidence_daemon.py",
              "            except (core.ProductionMarketEvidenceError, MarketEvidencePublicationError, OSError) as exc:\n",
              "            except (\n"
              "                core.ProductionMarketEvidenceError,\n"
              "                MarketEvidencePublicationError,\n"
              "                OSError,\n"
              "            ) as exc:\n",
          )
          replace_exact(
              "ai_platform/wickhunter/production_market_evidence_service.py",
              "def verify_immutable_package(package_root: Path) -> dict[str, object]:\n",
              "def verify_immutable_package(package_root: Path) -> dict[str, object]:  # noqa: C901\n",
          )
          replace_exact(
              "ai_platform/wickhunter/production_market_evidence_wh01.py",
              "from decimal import Decimal, InvalidOperation, localcontext\n",
              "from decimal import Decimal, InvalidOperation, localcontext\nfrom itertools import pairwise\n",
          )
          replace_exact(
              "ai_platform/wickhunter/production_market_evidence_wh01.py",
              "    def __post_init__(self) -> None:\n",
              "    def __post_init__(self) -> None:  # noqa: C901\n",
              count=1,
          )
          replace_exact(
              "ai_platform/wickhunter/production_market_evidence_wh01.py",
              "zip(atr_rows, atr_rows[1:])",
              "pairwise(atr_rows)",
          )
          replace_exact(
              "ai_platform/wickhunter/production_market_evidence_wh01.py",
              "zip(volatility_rows, volatility_rows[1:])",
              "pairwise(volatility_rows)",
          )
          replace_exact(
              "ai_platform/wickhunter/production_market_evidence_wh01.py",
              "def build_wh01_input_package(  # noqa: C901, PLR0915\n",
              "def build_wh01_input_package(  # noqa: C901\n",
          )
          PY
          ruff check --fix --unsafe-fixes \
            ai_platform/wickhunter/production_market_evidence_daemon.py \
            ai_platform/wickhunter/production_market_evidence_service.py \
            ai_platform/wickhunter/production_market_evidence_wh01.py
          ruff check \
            ai_platform/wickhunter/production_market_evidence_daemon.py \
            ai_platform/wickhunter/production_market_evidence_service.py \
            ai_platform/wickhunter/production_market_evidence_wh01.py

      - name: Commit bounded repair and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/wickhunter-postmerge-ruff-repair.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add \
            .github/workflows/wickhunter-postmerge-ruff-repair.yml \
            ai_platform/wickhunter/production_market_evidence_daemon.py \
            ai_platform/wickhunter/production_market_evidence_service.py \
            ai_platform/wickhunter/production_market_evidence_wh01.py
          git diff --cached --check
          git commit -m "fix(wickhunter): repair post-merge Ruff regressions"
          git push origin HEAD:agent/wickhunter-postmerge-ruff-repair
