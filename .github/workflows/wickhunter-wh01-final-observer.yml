name: WickHunter WH-01 bounded final observer

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/wickhunter-wh01-final-observer.yml

permissions:
  contents: read

concurrency:
  group: wickhunter-wh01-final-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: [freqtrade-staging]
    timeout-minutes: 5
    env:
      DURABLE_ROOT: /var/lib/freqtrade-staging-state/wickhunter-production-market-evidence-v2-20260801
      RUN_ID: wickhunter-production-market-evidence-20260801-v2-r1
      CONTAINER: wickhunter-market-evidence-v2
      BASE_DURABLE_ROOT: /var/lib/freqtrade-staging-state/wickhunter-production-market-evidence
      BASE_RUN_ID: wickhunter-production-market-evidence-20260730-v1-r1
    steps:
      - name: Checkout exact observer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Refuse credentials and proxy routing
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            BINANCE_API_KEY BINANCE_API_SECRET BINANCE_SECRET_KEY \
            BYBIT_API_KEY BYBIT_API_SECRET \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            EXCHANGE_API_KEY EXCHANGE_API_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET \
            HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          do
            [[ -z "${!name:-}" ]] || { echo "BLOCKED forbidden environment: $name"; exit 1; }
          done

      - name: Reconcile, bind v1 and verify combined package
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_NAME}" == "freqtrade-synology-staging" ]]
          [[ -d "$DURABLE_ROOT" ]]
          [[ -f "$DURABLE_ROOT/request.json" ]]

          running="$(docker inspect --format '{{.State.Running}}' "$CONTAINER" 2>/dev/null || true)"
          if [[ "$running" != "true" ]]; then
            docker start "$CONTAINER" >/dev/null
            echo "RECONCILED container_started=true"
          else
            echo "RECONCILED container_started=false"
          fi

          PYTHONPATH=. python3 -m ai_platform.wickhunter.production_market_evidence_v2 \
            sample --durable-root "$DURABLE_ROOT"

          supplement="$DURABLE_ROOT/$RUN_ID/immutable-okx-supplement"
          base_package="$BASE_DURABLE_ROOT/$BASE_RUN_ID/immutable-package"
          output_run_root="$DURABLE_ROOT/$RUN_ID"
          combined="$output_run_root/immutable-package"

          [[ -d "$supplement" ]]
          [[ -d "$base_package" ]]

          PYTHONPATH=. python3 -m ai_platform.wickhunter.production_market_evidence_v2 \
            verify --supplement-root "$supplement"
          PYTHONPATH=. python3 -m ai_platform.wickhunter.production_market_evidence_service \
            verify --package-root "$base_package"
          PYTHONPATH=. python3 -m ai_platform.wickhunter.production_market_evidence_service_v2 \
            merge \
            --base-package-root "$base_package" \
            --supplement-root "$supplement" \
            --output-run-root "$output_run_root"
          PYTHONPATH=. python3 -m ai_platform.wickhunter.production_market_evidence_service_v2 \
            verify --package-root "$combined"

          python3 - "$combined/manifest.json" "$combined/source-package-binding.json" <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          binding = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          if manifest.get("wh01_blocker") != "LIQUIDATION_ARCHIVE_NOT_BOUND":
              raise SystemExit("BLOCKED first_error=unexpected_post_merge_blocker")
          if manifest.get("orders_submitted") != 0:
              raise SystemExit("BLOCKED first_error=orders_submitted_nonzero")
          print(json.dumps({
              "status": "COMBINED_PACKAGE_VERIFIED",
              "run_id": manifest.get("run_id"),
              "manifest_sha256": manifest.get("manifest_sha256"),
              "binding_sha256": binding.get("binding_sha256"),
              "wh01_blocker": manifest.get("wh01_blocker"),
              "orders_submitted": manifest.get("orders_submitted"),
          }, sort_keys=True))
          PY
