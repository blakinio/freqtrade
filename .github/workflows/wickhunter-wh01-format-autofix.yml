name: WickHunter WH-01 format autofix

"on":
  push:
    branches:
      - fix/wickhunter-wh01-liquid20-preroll-20260801

permissions:
  contents: write

concurrency:
  group: wickhunter-wh01-format-autofix
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply exact formatter diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/ai_platform_integration/test_wickhunter_production_dataset_materialization.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          expected = [
              "    assert (",
              "        selection.requested_start_ms",
              "        <= DECISION_START - subject.DEFAULT_BURST_WINDOW_MS",
              "    )",
          ]
          matches = [index for index in range(len(lines) - 3) if lines[index:index + 4] == expected]
          if len(matches) != 1:
              raise SystemExit("formatter anchor mismatch")
          index = matches[0]
          lines[index:index + 4] = [
              "    assert selection.requested_start_ms <= DECISION_START - subject.DEFAULT_BURST_WINDOW_MS"
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          rm .github/workflows/wickhunter-wh01-format-autofix.yml
          git diff --check
      - name: Commit formatter output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ai_platform_integration/test_wickhunter_production_dataset_materialization.py \
            .github/workflows/wickhunter-wh01-format-autofix.yml
          git commit -m "style(wickhunter): apply regression test format"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:fix/wickhunter-wh01-liquid20-preroll-20260801
