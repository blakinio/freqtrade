name: WickHunter WH-01 Materialization One-Shot Autofix

"on":
  pull_request:
    types: [synchronize]
    branches:
      - develop
    paths:
      - .github/workflows/wickhunter-wh01-materialization-autofix.yml

permissions:
  contents: write

concurrency:
  group: wickhunter-wh01-materialization-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/wickhunter-wh01-production-materialization'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/wickhunter-wh01-production-materialization
          fetch-depth: 0

      - name: Apply exact mechanical repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/wickhunter/production_dataset_materialization.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "    AcceptedImportBundle,\n": "",
              "def _candle_maps(\n": "def _candle_maps(  # noqa: C901\n",
              "def _market_inputs(  # noqa: C901, PLR0912, PLR0915\n": (
                  "def _market_inputs(  # noqa: C901\n"
              ),
              "def materialize_production_dataset(  # noqa: C901, PLR0915\n": (
                  "def materialize_production_dataset(\n"
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing expected target: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply pinned Ruff fixes and formatter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install ruff==0.15.21
          files=(
            ai_platform/wickhunter/production_dataset_materialization.py
            tests/ai_platform_integration/test_wickhunter_production_dataset_materialization.py
          )
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"

      - name: Commit repairs and remove one-shot workflow
        shell: bash
        env:
          TARGET_BRANCH: agent/wickhunter-wh01-production-materialization
        run: |
          set -euo pipefail
          git rm .github/workflows/wickhunter-wh01-materialization-autofix.yml
          git add \
            ai_platform/wickhunter/production_dataset_materialization.py \
            tests/ai_platform_integration/test_wickhunter_production_dataset_materialization.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(wickhunter): satisfy materialization checks"
          git push origin "HEAD:$TARGET_BRANCH"
