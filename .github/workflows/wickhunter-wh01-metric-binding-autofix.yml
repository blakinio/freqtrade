name: WickHunter WH-01 metric binding autofix

"on":
  push:
    branches:
      - fix/wickhunter-wh01-production-metric-binding-20260801

permissions:
  contents: write

concurrency:
  group: wickhunter-wh01-metric-binding-autofix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Bind canonical production metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/wickhunter/production_dataset_materialization.py")
          text = path.read_text(encoding="utf-8")

          anchor = '''from ai_platform.wickhunter.production_market_evidence_intersection import (
              MANIFEST_NAME as MARKET_MANIFEST_NAME,
          )
          from ai_platform.wickhunter.universe import (
          '''
          replacement = '''from ai_platform.wickhunter.production_market_evidence_intersection import (
              MANIFEST_NAME as MARKET_MANIFEST_NAME,
          )
          from ai_platform.wickhunter.production_market_evidence_wh01 import (
              MetricLookbacks,
              WickHunterInputAdapterError,
              _source_metrics,
          )
          from ai_platform.wickhunter.universe import (
          '''
          if text.count(anchor) != 1:
              raise SystemExit("metric import anchor mismatch")
          text = text.replace(anchor, replacement)

          anchor = '''PRIMARY_CANDLE_SOURCE = "binance-usdm"
          
          
          class ProductionDatasetMaterializationError(RuntimeError):
          '''
          replacement = '''PRIMARY_CANDLE_SOURCE = "binance-usdm"
          PRODUCTION_METRIC_POLICY_VERSION = (
              "wickhunter-production-market-evidence-v3-wh01-metric-binding-v1"
          )
          PRODUCTION_METRIC_LOOKBACKS = MetricLookbacks(
              quote_volume_rows=288,
              vwap_rows=288,
              vwma_rows=288,
              atr_rows=14,
              volatility_rows=287,
              wick_rows=288,
              trend_rows=288,
          )
          PRODUCTION_SPREAD_AGGREGATION = "source_balanced_mean_require_all"
          PRODUCTION_LIQUIDATION_INTENSITY_POLICY = (
              "current_burst_over_mean_complete_prior_bursts_since_accepted_import_start"
          )
          
          
          class ProductionDatasetMaterializationError(RuntimeError):
          '''
          if text.count(anchor) != 1:
              raise SystemExit("metric constants anchor mismatch")
          text = text.replace(anchor, replacement)

          anchor = '''def _safe_member(root: Path, logical_name: str) -> Path:
          '''
          helpers = '''def _mean(values: Sequence[Decimal], *, field: str) -> Decimal:
              if not values:
                  raise ProductionDatasetMaterializationError(f"{field} has no values")
              return sum(values, Decimal(0)) / Decimal(len(values))
          
          
          def _market_metric_policy() -> dict[str, object]:
              payload: dict[str, object] = {
                  "policy_version": PRODUCTION_METRIC_POLICY_VERSION,
                  "timeframe": "5m",
                  "primary_candle_source": PRIMARY_CANDLE_SOURCE,
                  "metric_lookback_rows": asdict(PRODUCTION_METRIC_LOOKBACKS),
                  "spread_aggregation": PRODUCTION_SPREAD_AGGREGATION,
                  "liquidation_intensity": PRODUCTION_LIQUIDATION_INTENSITY_POLICY,
                  "burst_window_ms": DEFAULT_BURST_WINDOW_MS,
              }
              payload["policy_sha256"] = canonical_sha256(payload)
              return payload
          
          
          def _market_wide_liquidation_intensity(
              events: Sequence[Any],
              *,
              decision_timestamp_ms: int,
              history_start_ms: int,
          ) -> Decimal:
              current_start_ms = decision_timestamp_ms - DEFAULT_BURST_WINDOW_MS
              complete_bucket_count = (
                  current_start_ms - history_start_ms
              ) // DEFAULT_BURST_WINDOW_MS
              if complete_bucket_count < 1:
                  raise ProductionDatasetMaterializationError(
                      "market-wide liquidation intensity lacks a complete history bucket"
                  )
              aligned_history_start_ms = (
                  current_start_ms - complete_bucket_count * DEFAULT_BURST_WINDOW_MS
              )
              current_notional = Decimal(0)
              history_buckets = [Decimal(0) for _ in range(complete_bucket_count)]
              for event in events:
                  available_at_ms = _integer(
                      getattr(event, "available_at_ms", None),
                      field="liquidation available_at_ms",
                  )
                  if available_at_ms > decision_timestamp_ms:
                      continue
                  notional = _decimal(
                      getattr(event, "notional_usd", None),
                      field="liquidation notional_usd",
                  )
                  if notional < 0:
                      raise ProductionDatasetMaterializationError(
                          "liquidation notional_usd must be non-negative"
                      )
                  if current_start_ms <= available_at_ms <= decision_timestamp_ms:
                      current_notional += notional
                  elif aligned_history_start_ms <= available_at_ms < current_start_ms:
                      bucket_index = (
                          available_at_ms - aligned_history_start_ms
                      ) // DEFAULT_BURST_WINDOW_MS
                      if 0 <= bucket_index < complete_bucket_count:
                          history_buckets[bucket_index] += notional
              baseline = _mean(
                  history_buckets,
                  field="market-wide liquidation burst history",
              )
              if baseline <= 0:
                  raise ProductionDatasetMaterializationError(
                      "market-wide liquidation intensity lacks positive history"
                  )
              return current_notional / baseline
          
          
          def _safe_member(root: Path, logical_name: str) -> Path:
          '''
          if text.count(anchor) != 1:
              raise SystemExit("metric helper anchor mismatch")
          text = text.replace(anchor, helpers)

          anchor = '''def _market_inputs(  # noqa: C901
              market_root: Path,
          ) -> tuple[
          '''
          replacement = '''def _market_inputs(  # noqa: C901
              market_root: Path,
              *,
              accepted_events: Sequence[Any],
              liquidation_history_start_ms: int,
          ) -> tuple[
          '''
          if text.count(anchor) != 1:
              raise SystemExit("market input signature anchor mismatch")
          text = text.replace(anchor, replacement)

          anchor = '''    candles = _candle_maps(market_root, manifest=manifest)
          
              markets: list[MarketContextSnapshot] = []
          '''
          replacement = '''    candles = _candle_maps(market_root, manifest=manifest)
              ordered_candles = {
                  symbol: [by_open[key] for key in sorted(by_open)]
                  for symbol, by_open in candles.items()
              }
              metric_policy = _market_metric_policy()
              metric_policy_sha256 = str(metric_policy["policy_sha256"])
              if not accepted_events:
                  raise ProductionDatasetMaterializationError(
                      "accepted Liquid20 import contains no events"
                  )
          
              markets: list[MarketContextSnapshot] = []
          '''
          if text.count(anchor) != 1:
              raise SystemExit("ordered candle anchor mismatch")
          text = text.replace(anchor, replacement)

          anchor = '''        decisions: list[UniverseInstrumentDecision] = []
              for symbol in sorted(str(value) for value in symbols):
          '''
          replacement = '''        liquidation_intensity = _market_wide_liquidation_intensity(
                  accepted_events,
                  decision_timestamp_ms=decision_timestamp_ms,
                  history_start_ms=liquidation_history_start_ms,
              )
              decisions: list[UniverseInstrumentDecision] = []
              for symbol in sorted(str(value) for value in symbols):
          '''
          if text.count(anchor) != 1:
              raise SystemExit("liquidation intensity anchor mismatch")
          text = text.replace(anchor, replacement)

          old = '''            metrics: list[AvailableMetric] = []
                  for record in sorted(records, key=lambda item: str(item["source"])):
                      source = str(record["source"])
                      available_at_ms = _integer(
                          record.get("available_at_ms"),
                          field="quality available_at_ms",
                      )
                      for name, field in (
                          (f"{source}.last_price", "last_price"),
                          (f"{source}.spread_bps", "spread_bps"),
                          (f"{source}.quote_volume_24h_usd", "quote_volume_24h_usd"),
                      ):
                          metrics.append(
                              AvailableMetric(
                                  name=name,
                                  value=_decimal(record.get(field), field=f"{source}.{field}"),
                                  available_at_ms=available_at_ms,
                                  source=source,
                              )
                          )
                  candle = candles[symbol][scheduled - TIMEFRAME_MS]
                  markets.append(
                      MarketContextSnapshot(
                          symbol=symbol,
                          decision_timestamp_ms=decision_timestamp_ms,
                          decision_price=_decimal(
                              candle.get("close"), field="decision candle close", positive=True
                          ),
                          completed_candle_close_ms=scheduled,
                          metrics=tuple(metrics),
                      )
                  )
          '''
          new = '''            try:
                      candle_metrics = _source_metrics(
                          ordered_candles[symbol],
                          scheduled,
                          PRODUCTION_METRIC_LOOKBACKS,
                      )
                  except WickHunterInputAdapterError as exc:
                      raise ProductionDatasetMaterializationError(
                          f"unable to derive canonical WH-01 candle metrics: {exc}"
                      ) from exc
                  quality_available_at_ms = max(
                      _integer(
                          record.get("available_at_ms"),
                          field="quality available_at_ms",
                      )
                      for record in records
                  )
                  spread_bps = _mean(
                      [
                          _decimal(
                              record.get("spread_bps"),
                              field=f"{record.get('source')}.spread_bps",
                          )
                          for record in records
                      ],
                      field="source-balanced spread_bps",
                  )
                  metric_values = {
                      name: candle_metrics[name]
                      for name in (
                          "quote_volume_24h_usd",
                          "vwap",
                          "vwma",
                          "atr_ratio",
                          "volatility_ratio",
                          "wick_ratio",
                          "trend_return_ratio",
                      )
                  }
                  metric_values["spread_bps"] = spread_bps
                  metric_values["market_wide_liquidation_intensity"] = (
                      liquidation_intensity
                  )
                  metrics: list[AvailableMetric] = []
                  for name, value in sorted(metric_values.items()):
                      if name == "spread_bps":
                          available_at_ms = quality_available_at_ms
                          source_name = (
                              "market_quality:"
                              + "+".join(sorted(str(source) for source in sources))
                              + ":source_balanced_mean"
                          )
                      elif name == "market_wide_liquidation_intensity":
                          available_at_ms = decision_timestamp_ms
                          source_name = (
                              "accepted_liquidation_archive:market_wide:"
                              + PRODUCTION_METRIC_POLICY_VERSION
                          )
                      else:
                          available_at_ms = scheduled
                          source_name = (
                              f"completed_candle:{PRIMARY_CANDLE_SOURCE}:"
                              f"{PRODUCTION_METRIC_POLICY_VERSION}"
                          )
                      if available_at_ms > decision_timestamp_ms:
                          raise ProductionDatasetMaterializationError(
                              "derived market metric is unavailable at decision time"
                          )
                      metrics.append(
                          AvailableMetric(
                              name=name,
                              value=value,
                              available_at_ms=available_at_ms,
                              source=source_name,
                          )
                      )
                  markets.append(
                      MarketContextSnapshot(
                          symbol=symbol,
                          decision_timestamp_ms=decision_timestamp_ms,
                          decision_price=candle_metrics["decision_price"],
                          completed_candle_close_ms=scheduled,
                          metrics=tuple(metrics),
                      )
                  )
          '''
          if text.count(old) != 1:
              raise SystemExit("market metric construction anchor mismatch")
          text = text.replace(old, new)

          anchor = '''            "market_context_count": len(markets),
                  "universe_snapshot_count": len(universes),
              },
          '''
          replacement = '''            "market_context_count": len(markets),
                  "universe_snapshot_count": len(universes),
                  "market_metric_policy": metric_policy,
                  "market_metric_policy_sha256": metric_policy_sha256,
              },
          '''
          if text.count(anchor) != 1:
              raise SystemExit("market evidence policy anchor mismatch")
          text = text.replace(anchor, replacement)

          old = '''    markets, universes, market_evidence = _market_inputs(market_package_root.resolve(strict=True))
              market_manifest = market_evidence["market_manifest"]
          '''
          new = '''    accepted = load_accepted_import(accepted_import_root.resolve(strict=True))
              markets, universes, market_evidence = _market_inputs(
                  market_package_root.resolve(strict=True),
                  accepted_events=accepted.events,
                  liquidation_history_start_ms=accepted.selection.requested_start_ms,
              )
              market_manifest = market_evidence["market_manifest"]
          '''
          if text.count(old) != 1:
              raise SystemExit("accepted import ordering anchor mismatch")
          text = text.replace(old, new)

          old = '''    accepted = load_accepted_import(accepted_import_root.resolve(strict=True))
              if accepted.selection.protected_holdout_start_ms != holdout_start_ms:
          '''
          new = '''    if accepted.selection.protected_holdout_start_ms != holdout_start_ms:
          '''
          if text.count(old) != 1:
              raise SystemExit("duplicate accepted import anchor mismatch")
          text = text.replace(old, new)

          anchor = '''            "dataset_request_sha256": request.request_sha256,
                  "dataset_manifest_sha256": dataset_manifest["manifest_sha256"],
          '''
          replacement = '''            "dataset_request_sha256": request.request_sha256,
                  "market_metric_policy": market_evidence["market_metric_policy"],
                  "market_metric_policy_sha256": market_evidence[
                      "market_metric_policy_sha256"
                  ],
                  "dataset_manifest_sha256": dataset_manifest["manifest_sha256"],
          '''
          if text.count(anchor) != 1:
              raise SystemExit("source binding policy anchor mismatch")
          text = text.replace(anchor, replacement)

          anchor = '''            "split_geometry_sha256": geometry.geometry_sha256,
                  "market_context_count": market_evidence["market_context_count"],
          '''
          replacement = '''            "split_geometry_sha256": geometry.geometry_sha256,
                  "market_metric_policy_sha256": market_evidence[
                      "market_metric_policy_sha256"
                  ],
                  "market_context_count": market_evidence["market_context_count"],
          '''
          if text.count(anchor) != 1:
              raise SystemExit("materialization policy anchor mismatch")
          text = text.replace(anchor, replacement)

          anchor = '''    if materialization.get("source_binding_sha256") != binding_hash:
                  raise ProductionDatasetMaterializationError("materialization source binding mismatch")
              for payload, field in (
          '''
          replacement = '''    if materialization.get("source_binding_sha256") != binding_hash:
                  raise ProductionDatasetMaterializationError("materialization source binding mismatch")
              metric_policy = binding.get("market_metric_policy")
              if not isinstance(metric_policy, dict):
                  raise ProductionDatasetMaterializationError("market metric policy is missing")
              policy_hash = metric_policy.get("policy_sha256")
              policy_seed = dict(metric_policy)
              policy_seed.pop("policy_sha256", None)
              if not isinstance(policy_hash, str) or canonical_sha256(policy_seed) != policy_hash:
                  raise ProductionDatasetMaterializationError("market metric policy hash mismatch")
              if binding.get("market_metric_policy_sha256") != policy_hash:
                  raise ProductionDatasetMaterializationError("binding metric policy mismatch")
              if materialization.get("market_metric_policy_sha256") != policy_hash:
                  raise ProductionDatasetMaterializationError(
                      "materialization metric policy mismatch"
                  )
              for payload, field in (
          '''
          if text.count(anchor) != 1:
              raise SystemExit("verifier policy anchor mismatch")
          text = text.replace(anchor, replacement)

          path.write_text(text, encoding="utf-8")

          test_path = Path(
              "tests/ai_platform_integration/test_wickhunter_production_dataset_materialization.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          anchor = '''import json
          from pathlib import Path
          '''
          replacement = '''import json
          from decimal import Decimal
          from pathlib import Path
          '''
          if tests.count(anchor) != 1:
              raise SystemExit("test decimal import anchor mismatch")
          tests = tests.replace(anchor, replacement)

          old = '''            "close_time_ms_exclusive": timestamp + subject.TIMEFRAME_MS,
                      "close": "100",
                  }
          '''
          new = '''            "close_time_ms_exclusive": timestamp + subject.TIMEFRAME_MS,
                      "open": "100",
                      "high": "101",
                      "low": "99",
                      "close": "100",
                      "base_volume": "2",
                      "quote_volume": "200",
                  }
          '''
          if tests.count(old) != 1:
              raise SystemExit("test candle fields anchor mismatch")
          tests = tests.replace(old, new)

          anchor = '''def _fake_dataset_builder(**kwargs: object) -> SimpleNamespace:
          '''
          helper = '''def _accepted_events() -> tuple[SimpleNamespace, ...]:
              return (
                  SimpleNamespace(
                      available_at_ms=DECISION_START - 30 * 60 * 1000,
                      notional_usd=Decimal("100"),
                  ),
                  SimpleNamespace(
                      available_at_ms=DECISION_START - 5 * 60 * 1000,
                      notional_usd=Decimal("200"),
                  ),
              )
          
          
          def _market_evidence(manifest: dict[str, object]) -> dict[str, object]:
              policy = subject._market_metric_policy()
              return {
                  "market_verification": {
                      "manifest_sha256": "a" * 64,
                      "binding_sha256": "b" * 64,
                      "lineage_sha256": "c" * 64,
                  },
                  "market_manifest": manifest,
                  "market_context_count": 1,
                  "universe_snapshot_count": 1,
                  "market_metric_policy": policy,
                  "market_metric_policy_sha256": policy["policy_sha256"],
              }
          
          
          def _fake_dataset_builder(**kwargs: object) -> SimpleNamespace:
          '''
          if tests.count(anchor) != 1:
              raise SystemExit("test helper anchor mismatch")
          tests = tests.replace(anchor, helper)

          old = '''    markets, universes, evidence = subject._market_inputs(package)
          
              assert len(markets) == 120
          '''
          new = '''    markets, universes, evidence = subject._market_inputs(
                  package,
                  accepted_events=_accepted_events(),
                  liquidation_history_start_ms=_selection().requested_start_ms,
              )
          
              assert len(markets) == 120
          '''
          if tests.count(old) != 1:
              raise SystemExit("test market input call anchor mismatch")
          tests = tests.replace(old, new)

          anchor = '''    assert all(metric.available_at_ms <= first.decision_timestamp_ms for metric in first.metrics)
              assert universes[0].includes_symbol(SYMBOL)
          '''
          replacement = '''    assert all(metric.available_at_ms <= first.decision_timestamp_ms for metric in first.metrics)
              metrics = {metric.name: metric for metric in first.metrics}
              assert set(metrics) == {
                  "atr_ratio",
                  "market_wide_liquidation_intensity",
                  "quote_volume_24h_usd",
                  "spread_bps",
                  "trend_return_ratio",
                  "volatility_ratio",
                  "vwap",
                  "vwma",
                  "wick_ratio",
              }
              assert metrics["quote_volume_24h_usd"].value == Decimal("57600")
              assert metrics["vwap"].value == Decimal("100")
              assert metrics["vwma"].value == Decimal("100")
              assert metrics["atr_ratio"].value == Decimal("0.02")
              assert metrics["volatility_ratio"].value == Decimal(0)
              assert metrics["wick_ratio"].value == Decimal(1)
              assert metrics["trend_return_ratio"].value == Decimal(0)
              assert metrics["spread_bps"].value == Decimal(1)
              assert metrics["market_wide_liquidation_intensity"].value > 0
              assert evidence["market_metric_policy_sha256"] == evidence[
                  "market_metric_policy"
              ]["policy_sha256"]
              assert universes[0].includes_symbol(SYMBOL)
          '''
          if tests.count(anchor) != 1:
              raise SystemExit("test metric assertions anchor mismatch")
          tests = tests.replace(anchor, replacement)

          old = '''        subject,
                  "_market_inputs",
                  lambda _: (
                      (SimpleNamespace(),),
                      (SimpleNamespace(),),
                      {
                          "market_verification": {
                              "manifest_sha256": "a" * 64,
                              "binding_sha256": "b" * 64,
                              "lineage_sha256": "c" * 64,
                          },
                          "market_manifest": manifest,
                          "market_context_count": 1,
                          "universe_snapshot_count": 1,
                      },
                  ),
              )
          '''
          new = '''        subject,
                  "_market_inputs",
                  lambda *_, **__: (
                      (SimpleNamespace(),),
                      (SimpleNamespace(),),
                      _market_evidence(manifest),
                  ),
              )
          '''
          if tests.count(old) != 2:
              raise SystemExit(f"expected two market input mocks, found {tests.count(old)}")
          tests = tests.replace(old, new)

          old = '''        "load_accepted_import",
                  lambda _: SimpleNamespace(selection=selection),
              )
          '''
          new = '''        "load_accepted_import",
                  lambda _: SimpleNamespace(selection=selection, events=_accepted_events()),
              )
          '''
          if tests.count(old) != 1:
              raise SystemExit("first accepted mock anchor mismatch")
          tests = tests.replace(old, new)

          old = '''        "load_accepted_import",
                  lambda _: SimpleNamespace(selection=_selection()),
              )
          '''
          new = '''        "load_accepted_import",
                  lambda _: SimpleNamespace(selection=_selection(), events=_accepted_events()),
              )
          '''
          if tests.count(old) != 1:
              raise SystemExit("second accepted mock anchor mismatch")
          tests = tests.replace(old, new)

          anchor = '''    assert binding["liquid20_selection_sha256"] == selection.selection_sha256
              assert binding["protected_holdout_accessed"] is False
          '''
          replacement = '''    assert binding["liquid20_selection_sha256"] == selection.selection_sha256
              assert binding["market_metric_policy_sha256"] == binding[
                  "market_metric_policy"
              ]["policy_sha256"]
              assert binding["protected_holdout_accessed"] is False
          '''
          if tests.count(anchor) != 1:
              raise SystemExit("binding metric policy assertion anchor mismatch")
          tests = tests.replace(anchor, replacement)
          test_path.write_text(tests, encoding="utf-8")

          task_path = Path(
              "docs/agents/tasks/FTAI-20260731-wickhunter-wh01-production-materialization-v1.md"
          )
          task = task_path.read_text(encoding="utf-8")
          marker = "## Acceptance\n"
          checkpoint = '''## Production metric binding repair checkpoint
          
          - request-only PR #911 independently reverified both frozen packages, all expected hashes, the trusted runner and disabled authority flags, then failed before publication with all nine canonical WH-01 market metrics missing;
          - workflow `30690869876`, job `91345235052`, published no dataset and submitted no orders;
          - request-only schema observer PR #912, workflow `30691025624`, job `91345656850`, proved that verified v3 contains complete 24-hour Binance 5m candle pre-roll, source-separated spread/quality for Binance, Bybit and OKX, and that the accepted Liquid20 package has 394 events in the 15 minutes before the first decision;
          - the existing production WH-01 adapter already defines the canonical 288-row VWAP/VWMA/volume/trend/wick lookbacks, 14-row ATR, 287-return volatility ratio and market-wide liquidation burst-intensity semantics;
          - this repair binds those canonical candle formulas to the verified primary Binance candle series, uses a source-balanced mean spread across every verified market source, and computes market-wide intensity from all complete prior 15-minute buckets actually available since the accepted import start;
          - the complete metric policy is self-hashed and included in the immutable source binding and materialization manifest;
          - no source collection, backfill, synthetic production observation, holdout access, replay, model execution, performance research, trading credential, order or live capital was used.
          
          '''
          if task.count(marker) != 1:
              raise SystemExit("task acceptance marker mismatch")
          task_path.write_text(task.replace(marker, checkpoint + marker), encoding="utf-8")
          PY
          rm .github/workflows/wickhunter-wh01-metric-binding-autofix.yml
          python3 -m py_compile \
            ai_platform/wickhunter/production_dataset_materialization.py \
            tests/ai_platform_integration/test_wickhunter_production_dataset_materialization.py
          git diff --check

      - name: Commit bounded repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/wickhunter/production_dataset_materialization.py \
            tests/ai_platform_integration/test_wickhunter_production_dataset_materialization.py \
            docs/agents/tasks/FTAI-20260731-wickhunter-wh01-production-materialization-v1.md \
            .github/workflows/wickhunter-wh01-metric-binding-autofix.yml
          git commit -m "fix(wickhunter): bind canonical production market metrics"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:fix/wickhunter-wh01-production-metric-binding-20260801
