name: WickHunter WH-01 metric binding trigger v3

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh01-metric-binding-trigger-v2.yml"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh01-metric-binding-trigger-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply robust metric binding repair
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/wickhunter-wh01-metric-binding-repair.py.gz
          echo 'd186ad5c16f789c20957bc8e911cbe0001c93d0fb8485bb7ca66c8b5c177bf81  /tmp/wickhunter-wh01-metric-binding-repair.py.gz' | sha256sum -c -
          gzip -dc /tmp/wickhunter-wh01-metric-binding-repair.py.gz > /tmp/wickhunter-wh01-metric-binding-repair.py
          echo 'af7cd426ee0a25308aa65808543236d463c8ea87064e39b795d21eca7e1afcfa  /tmp/wickhunter-wh01-metric-binding-repair.py' | sha256sum -c -
          python3 /tmp/wickhunter-wh01-metric-binding-repair.py
          python3 -m compileall -q \
            ai_platform/wickhunter/production_dataset_materialization.py \
            tests/ai_platform_integration/test_wickhunter_production_dataset_materialization.py
          git diff --check

      - name: Commit robust metric binding repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/wickhunter/production_dataset_materialization.py \
            tests/ai_platform_integration/test_wickhunter_production_dataset_materialization.py \
            docs/agents/tasks/FTAI-20260731-wickhunter-wh01-production-materialization-v1.md \
            .github/workflows/wickhunter-wh01-metric-binding-autofix.yml \
            .github/workflows/wickhunter-wh01-metric-binding-trigger-v2.yml
          git commit -m "fix(wickhunter): bind canonical production market metrics"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin "HEAD:$HEAD_BRANCH"
