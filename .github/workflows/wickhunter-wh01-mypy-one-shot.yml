name: WickHunter WH-01 Mypy One-Shot Repair

"on":
  pull_request:
    types: [synchronize]
    branches:
      - develop
    paths:
      - .github/workflows/wickhunter-wh01-mypy-one-shot.yml

permissions:
  contents: write

concurrency:
  group: wickhunter-wh01-mypy-one-shot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/wickhunter-wh01-production-materialization'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/wickhunter-wh01-production-materialization
          fetch-depth: 0

      - name: Repair tuple-key typing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/wickhunter/production_dataset_materialization.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "        key = (scheduled, source)\n        if key in source_by_key:\n            raise ProductionDatasetMaterializationError(\"duplicate source health key\")\n        source_by_key[key] = row\n": (
                  "        source_key = (scheduled, source)\n"
                  "        if source_key in source_by_key:\n"
                  "            raise ProductionDatasetMaterializationError(\"duplicate source health key\")\n"
                  "        source_by_key[source_key] = row\n"
              ),
              "        key = (scheduled, source, symbol)\n        if key in quality_by_key:\n            raise ProductionDatasetMaterializationError(\"duplicate market-quality key\")\n        quality_by_key[key] = row\n": (
                  "        quality_key = (scheduled, source, symbol)\n"
                  "        if quality_key in quality_by_key:\n"
                  "            raise ProductionDatasetMaterializationError(\"duplicate market-quality key\")\n"
                  "        quality_by_key[quality_key] = row\n"
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing expected target: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate repository mypy hook
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install pre-commit
          pre-commit run mypy --all-files

      - name: Commit repair and remove one-shot workflow
        shell: bash
        env:
          TARGET_BRANCH: agent/wickhunter-wh01-production-materialization
        run: |
          set -euo pipefail
          git rm .github/workflows/wickhunter-wh01-mypy-one-shot.yml
          git add ai_platform/wickhunter/production_dataset_materialization.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(wickhunter): disambiguate materialization tuple keys"
          git push origin "HEAD:$TARGET_BRANCH"
