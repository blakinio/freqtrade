name: WickHunter WH-01 pre-roll repair autofix

"on":
  push:
    branches:
      - fix/wickhunter-wh01-liquid20-preroll-20260801

permissions:
  contents: write

concurrency:
  group: wickhunter-wh01-preroll-autofix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Apply bounded production repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          implementation = Path("ai_platform/wickhunter/production_dataset_materialization.py")
          text = implementation.read_text(encoding="utf-8")
          old = "decision_start_ms - 86_400_000"
          new = "decision_start_ms - DEFAULT_BURST_WINDOW_MS"
          if text.count(old) != 1:
              raise SystemExit("implementation repair anchor mismatch")
          implementation.write_text(text.replace(old, new), encoding="utf-8")

          tests = Path(
              "tests/ai_platform_integration/test_wickhunter_production_dataset_materialization.py"
          )
          text = tests.read_text(encoding="utf-8")
          old = "requested_start_ms=PRE_ROLL_START - 8 * 60 * 60 * 1000,"
          new = "requested_start_ms=DECISION_START - 8 * 60 * 60 * 1000,"
          if text.count(old) != 1:
              raise SystemExit("selection fixture repair anchor mismatch")
          text = text.replace(old, new)
          anchor = "    selection = _selection()\n    monkeypatch.setattr(\n"
          replacement = (
              "    selection = _selection()\n"
              "    assert selection.requested_start_ms > DECISION_START - 86_400_000\n"
              "    assert (\n"
              "        selection.requested_start_ms\n"
              "        <= DECISION_START - subject.DEFAULT_BURST_WINDOW_MS\n"
              "    )\n"
              "    monkeypatch.setattr(\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit("regression assertion anchor mismatch")
          tests.write_text(text.replace(anchor, replacement), encoding="utf-8")

          task = Path(
              "docs/agents/tasks/FTAI-20260731-wickhunter-wh01-production-materialization-v1.md"
          )
          text = task.read_text(encoding="utf-8")
          marker = "## Acceptance\n"
          checkpoint = (
              "## Production repair checkpoint\n\n"
              "- request-only PR #906 independently verified both frozen inputs, all expected hashes and all disabled authority flags on trusted runner `freqtrade-synology-staging`;\n"
              "- workflow run `30688887667`, job `91339968858`, failed before publication with `Liquid20 import lacks required pre-roll`;\n"
              "- the accepted import starts about eight hours before the decision interval and fully covers it, while the WH-01 builder requires history strictly before its declared 15-minute burst window rather than a separate 24-hour liquidation interval;\n"
              "- this repair aligns the Liquid20 pre-roll bound with the production dataset request's burst window and keeps the builder's actual event-history eligibility checks unchanged;\n"
              "- no capture, backfill, holdout access, synthetic data, replay, model execution, trading credentials, orders or live capital were used.\n\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("task checkpoint anchor mismatch")
          task.write_text(text.replace(marker, checkpoint + marker), encoding="utf-8")
          PY
          rm .github/workflows/wickhunter-wh01-preroll-autofix.yml
          python3 -m py_compile \
            ai_platform/wickhunter/production_dataset_materialization.py \
            tests/ai_platform_integration/test_wickhunter_production_dataset_materialization.py
          git diff --check

      - name: Commit repaired implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/wickhunter/production_dataset_materialization.py \
            tests/ai_platform_integration/test_wickhunter_production_dataset_materialization.py \
            docs/agents/tasks/FTAI-20260731-wickhunter-wh01-production-materialization-v1.md \
            .github/workflows/wickhunter-wh01-preroll-autofix.yml
          git commit -m "fix(wickhunter): align Liquid20 pre-roll with dataset request"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:fix/wickhunter-wh01-liquid20-preroll-20260801
