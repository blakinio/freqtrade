name: WickHunter WH-01 Ruff format

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh01-ruff-format.yml"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh01-ruff-format-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply repository-pinned Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check ruff==0.15.21
          ruff format ai_platform/wickhunter/production_dataset_materialization.py
          ruff format --check \
            ai_platform/wickhunter/production_dataset_materialization.py \
            tests/ai_platform_integration/test_wickhunter_production_dataset_materialization.py
          ruff check \
            ai_platform/wickhunter/production_dataset_materialization.py \
            tests/ai_platform_integration/test_wickhunter_production_dataset_materialization.py
          rm .github/workflows/wickhunter-wh01-ruff-format.yml
          git diff --check

      - name: Commit formatting-only repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_platform/wickhunter/production_dataset_materialization.py \
            .github/workflows/wickhunter-wh01-ruff-format.yml
          git commit -m "style(wickhunter): apply repository Ruff formatting"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin "HEAD:$HEAD_BRANCH"
