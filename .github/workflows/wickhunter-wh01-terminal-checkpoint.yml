name: WickHunter WH-01 terminal checkpoint

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - docs/wickhunter-wh01-production-materialization-terminal-20260801
    paths:
      - ".github/wickhunter-wh01-terminal-checkpoint-trigger.txt"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh01-terminal-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'docs/wickhunter-wh01-production-materialization-terminal-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out terminal documentation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: docs/wickhunter-wh01-production-materialization-terminal-20260801

      - name: Record terminal WH-01 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/wickhunter-wh01-terminal-checkpoint.py
          git diff --check

      - name: Commit documentation checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/agents/tasks/FTAI-20260731-wickhunter-wh01-production-materialization-v1.md \
            docs/agents/programs/FTAI_WICKHUNTER_LIQUIDATION_BOT_PROGRAM.md
          git commit -m "docs(wickhunter): record terminal WH-01 production dataset"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:docs/wickhunter-wh01-production-materialization-terminal-20260801
