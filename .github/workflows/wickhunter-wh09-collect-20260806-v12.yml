name: WickHunter WH09 v12 terminal PAPER evidence collection

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/scripts/wickhunter-wh09-collect-v12.sh"
      - ".github/workflows/wickhunter-wh09-collect-20260806-v12.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: wickhunter-wh09-collect-v12
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and evaluate preserved WH09 v12 evidence
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    timeout-minutes: 30
    steps:
      - name: Check out exact request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v11.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run bounded read-only terminal collector
        id: collect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: bash -x .github/scripts/wickhunter-wh09-collect-v12.sh

      - name: Upload bounded terminal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v11.0.1
        with:
          name: wickhunter-wh09-v12-terminal-${{ github.event.pull_request.number }}
          path: ${{ steps.collect.outputs.output }}
          if-no-files-found: error
          retention-days: 30
