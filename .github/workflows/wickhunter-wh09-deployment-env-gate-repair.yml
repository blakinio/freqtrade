name: WickHunter WH09 Liquid20 permission metadata probe

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-deployment-env-gate-repair.yml"

permissions:
  contents: read

concurrency:
  group: wickhunter-wh09-liquid20-permission-probe-v5
  cancel-in-progress: false

jobs:
  probe:
    name: Inspect bounded Liquid20 permission metadata
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    timeout-minutes: 5
    env:
      LIQUID20_LIVE_HOST: /volume1/docker/freqtrade-liquidations/data/live
      OPERATOR_IMAGE: local/wickhunter-paper-runtime:sha-9a9972a8db27e8dcd6672dbbf6b80a34a03b8cd7
    steps:
      - name: Record identities and path metadata only
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_identity=$(id)"
          docker inspect --format 'collector_user={{.Config.User}}' liquid20-live || true
          for path in \
            /volume1 \
            /volume1/docker \
            /volume1/docker/freqtrade-liquidations \
            /volume1/docker/freqtrade-liquidations/data \
            "$LIQUID20_LIVE_HOST" \
            "$LIQUID20_LIVE_HOST/runs" \
            "$LIQUID20_LIVE_HOST/live-state-v1.json"
          do
            if [[ -e "$path" || -L "$path" ]]; then
              stat -c 'path=%n type=%F uid=%u gid=%g mode=%a' "$path"
            else
              echo "missing=$path"
            fi
          done
          active_run_id="$(python3 - "$LIQUID20_LIVE_HOST/live-state-v1.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          state = payload.get("state")
          if not isinstance(state, dict):
              raise SystemExit("pointer state missing")
          run_id = state.get("run_id")
          if not isinstance(run_id, str) or not run_id:
              raise SystemExit("pointer run_id missing")
          print(run_id)
          PY
          )"
          stat -c 'path=%n type=%F uid=%u gid=%g mode=%a' "$LIQUID20_LIVE_HOST/runs/$active_run_id"
          find "$LIQUID20_LIVE_HOST/runs/$active_run_id" -maxdepth 1 -type f -printf 'path=%p type=file uid=%U gid=%G mode=%m\n' | sort

      - name: Prove candidate reader groups without reading payload content
        shell: bash
        run: |
          set -euo pipefail
          pointer_gid="$(stat -c '%g' "$LIQUID20_LIVE_HOST/live-state-v1.json")"
          echo "pointer_gid=$pointer_gid"
          docker run --rm \
            --user 65532:65532 \
            --group-add "$pointer_gid" \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount "type=bind,src=$LIQUID20_LIVE_HOST,dst=/runtime/liquid20,readonly" \
            --entrypoint python \
            "$OPERATOR_IMAGE" - <<'PY'
          import os
          from pathlib import Path
          pointer = Path("/runtime/liquid20/live-state-v1.json")
          print(f"container_groups={os.getgroups()}")
          print(f"pointer_regular={pointer.is_file()} pointer_size={pointer.stat().st_size}")
          PY
