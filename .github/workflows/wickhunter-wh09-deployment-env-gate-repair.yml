name: WickHunter WH09 Docker inspect template repair

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-deployment-env-gate-repair.yml"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-docker-inspect-template-repair-v9
  cancel-in-progress: false

env:
  TARGET_BRANCH: ops/wickhunter-wh09-deploy-paper-20260804-v2
  EXPECTED_TARGET_HEAD: 9241dab8d3d5e65ac634e9d52ee2e8bc497e0c87
  STAGING_BRANCH: ops/wickhunter-wh09-deploy-payload-20260805-v4
  STAGING_PATH: docs/agents/evidence/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1/wickhunter-wh09-deploy-20260805-v4-template-fixed.yml

jobs:
  repair:
    name: Stage exact Docker inspect template repair
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    timeout-minutes: 10
    steps:
      - name: Check out exact deployment branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Stage deterministic one-line repair
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TARGET_HEAD" ]]
          python3 - <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/wickhunter-wh09-deploy-20260804-v2.yml")
          destination = Path(
              "docs/agents/evidence/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1/"
              "wickhunter-wh09-deploy-20260805-v4-template-fixed.yml"
          )
          lines = source.read_text(encoding="utf-8").splitlines()
          matches = [
              index
              for index, line in enumerate(lines)
              if "collector_data_source=" in line and "docker inspect --format" in line
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one collector_data_source line, found {len(matches)}")
          lines[matches[0]] = (
              "          collector_data_source=\"$(docker inspect --format "
              "'{{range .Mounts}}{{if eq .Destination \"/data\"}}{{.Source}}{{end}}{{end}}' "
              "liquid20-live)\""
          )
          updated = "\n".join(lines) + "\n"
          if "unexpected" in updated:
              raise SystemExit("unexpected marker in payload")
          if "collector_data_source=" not in updated:
              raise SystemExit("collector source validation missing")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(updated, encoding="utf-8")
          PY
          git diff --check -- "$STAGING_PATH"
          python3 - "$STAGING_PATH" <<'PY'
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          expected = "{{range .Mounts}}{{if eq .Destination \"/data\"}}{{.Source}}{{end}}{{end}}"
          if text.count(expected) != 1:
              raise SystemExit("correct Docker template is not unique")
          if '\\\"/data\\\"' in text:
              raise SystemExit("escaped Docker template remains")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STAGING_PATH"
          git commit -m "chore(wickhunter): stage Docker inspect template repair"
          git push origin "HEAD:$STAGING_BRANCH"
