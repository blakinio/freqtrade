name: WickHunter WH09 deployment v5 generator

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-deployment-v5-repin-executor.yml"
      - ".github/wh09-deployment-v5-repin/patch.py"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-deployment-v5-generator
  cancel-in-progress: false

env:
  TARGET_BRANCH: ops/wickhunter-wh09-deploy-paper-20260804-v2
  EXPECTED_TARGET_HEAD: 0f1b6efac0e7c380320ceeda62b51731334aeb2a
  EXPECTED_DEVELOP_HEAD: 47b917812b96c0f03a18ff7d9d50cddeb8700a72
  OUTPUT_BRANCH: ops/wickhunter-wh09-deployment-v5-generated-20260805-v1
  EXPECTED_OUTPUT_HEAD: 47b917812b96c0f03a18ff7d9d50cddeb8700a72
  OLD_DEPLOYMENT_WORKFLOW: .github/workflows/wickhunter-wh09-deploy-20260804-v2.yml
  NEW_DEPLOYMENT_WORKFLOW: .github/workflows/wickhunter-wh09-deploy-20260805-v5.yml
  GENERATED_PATH: .github/wh09-deployment-v5-repin/generated-workflow.yml

jobs:
  generate:
    name: Generate exact fresh v5 PAPER deployment workflow blob
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact helper request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate helper scope and preserve patch
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" == "$EXPECTED_DEVELOP_HEAD" ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          expected=$'.github/wh09-deployment-v5-repin/patch.py\n.github/workflows/wickhunter-wh09-deployment-v5-repin-executor.yml'
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Expected helper paths:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          }
          cp .github/wh09-deployment-v5-repin/patch.py "$RUNNER_TEMP/wh09-deployment-v5-repin.py"
          python -m py_compile "$RUNNER_TEMP/wh09-deployment-v5-repin.py"

      - name: Generate and validate exact v5 workflow
        shell: bash
        run: |
          set -euo pipefail
          target_root="$RUNNER_TEMP/wickhunter-wh09-target"
          rm -rf "$target_root"
          git fetch origin "$TARGET_BRANCH" develop "$OUTPUT_BRANCH"
          [[ "$(git rev-parse origin/develop)" == "$EXPECTED_DEVELOP_HEAD" ]]
          [[ "$(git rev-parse origin/$TARGET_BRANCH)" == "$EXPECTED_TARGET_HEAD" ]]
          [[ "$(git rev-parse origin/$OUTPUT_BRANCH)" == "$EXPECTED_OUTPUT_HEAD" ]]
          git worktree add --detach "$target_root" "origin/$TARGET_BRANCH"
          trap 'git worktree remove --force "$target_root" >/dev/null 2>&1 || true' EXIT
          (
            cd "$target_root"
            python "$RUNNER_TEMP/wh09-deployment-v5-repin.py"
            python - "$OLD_DEPLOYMENT_WORKFLOW" "$NEW_DEPLOYMENT_WORKFLOW" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          old = sys.argv[1]
          new = sys.argv[2]
          text = path.read_text(encoding="utf-8")
          count = text.count(old)
          if count != 3:
              raise SystemExit(f"expected three old workflow path references, found {count}")
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          )
          cp "$target_root/$OLD_DEPLOYMENT_WORKFLOW" "$RUNNER_TEMP/generated-workflow.yml"
          python -m pip install --disable-pip-version-check "PyYAML>=6.0"
          python - "$RUNNER_TEMP/generated-workflow.yml" <<'PY'
          from pathlib import Path
          import sys
          import yaml

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          payload = yaml.safe_load(text)
          if not isinstance(payload, dict) or set(payload.get("jobs", {})) != {"runner_probe", "deploy"}:
              raise SystemExit("generated deployment workflow YAML is invalid")
          required = (
              "name: WickHunter WH09 fresh PAPER deployment v5",
              "group: wickhunter-wh09-deploy-v5",
              "EXPECTED_BASE_SHA: 47b917812b96c0f03a18ff7d9d50cddeb8700a72",
              "IMPLEMENTATION_SHA: 47b917812b96c0f03a18ff7d9d50cddeb8700a72",
              ".github/workflows/wickhunter-wh09-deploy-20260805-v5.yml",
              "ACTIVATION_NAME: wickhunter-wh09-activation-20260805-v5-47b91781",
              "BOT_INSTANCE: wickhunter-paper-v5",
              "OPERATOR_CONTAINER: wickhunter-paper-runtime-v5",
              "GATEWAY_CONTAINER: wickhunter-wh09-egress-v5",
              "INTERNAL_NETWORK: wickhunter-wh09-internal-v5",
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"generated workflow missing markers: {missing!r}")
          forbidden = (
              ".github/workflows/wickhunter-wh09-deploy-20260804-v2.yml",
              "b417d07424136a480785a2ae06e868cfefc96390",
              "9a9972a8db27e8dcd6672dbbf6b80a34a03b8cd7",
              "v4",
          )
          present = [item for item in forbidden if item in text]
          if present:
              raise SystemExit(f"generated workflow retains stale markers: {present!r}")
          PY
          git worktree remove --force "$target_root"
          trap - EXIT

      - name: Publish generated workflow as a non-workflow blob
        shell: bash
        run: |
          set -euo pipefail
          output_root="$RUNNER_TEMP/wickhunter-wh09-output"
          rm -rf "$output_root"
          git worktree add -B "$OUTPUT_BRANCH" "$output_root" "origin/$OUTPUT_BRANCH"
          trap 'git worktree remove --force "$output_root" >/dev/null 2>&1 || true' EXIT
          install -D -m 0644 "$RUNNER_TEMP/generated-workflow.yml" "$output_root/$GENERATED_PATH"
          (
            cd "$output_root"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$GENERATED_PATH"
            ! git diff --cached --quiet
            git diff --cached --check
            git commit -m "ops(wickhunter): stage exact v5 deployment workflow blob"
            actual="$(git diff --name-only "$EXPECTED_OUTPUT_HEAD" HEAD)"
            [[ "$actual" == "$GENERATED_PATH" ]]
            git push origin "HEAD:$OUTPUT_BRANCH"
          )
          git worktree remove --force "$output_root"
          trap - EXIT
