name: WickHunter WH09 v12 public-market diagnostic

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-diagnose-market-20260807-v12.yml"

permissions:
  contents: read

concurrency:
  group: wickhunter-wh09-v12-public-market-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    name: Probe current WH09 v12 public-market boundary
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.ref == 'ops/wickhunter-wh09-v12-diagnostic-20260807'
    runs-on: [freqtrade-staging]
    timeout-minutes: 20
    steps:
      - name: Check out exact diagnostic request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v11.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Probe exact running image read-only
        shell: bash
        env:
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          OPERATOR_CONTAINER: wickhunter-paper-runtime-v12
          EXPECTED_IMAGE_ID: sha256:449ff348296a91865e7d884a2de26ddbb34d67c317afd348ee9e675444566f01
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME_VALUE" == "freqtrade-synology-staging" ]]
          [[ "$RUNNER_OS_VALUE" == "Linux" ]]
          [[ "$RUNNER_ARCH_VALUE" == "X64" ]]
          docker version >/dev/null
          test -S /var/run/docker.sock
          [[ "$(docker inspect --format '{{.Image}}' "$OPERATOR_CONTAINER")" == "$EXPECTED_IMAGE_ID" ]]
          docker exec --interactive "$OPERATOR_CONTAINER" python - <<'PY'
          import json
          import time

          from ai_platform.wickhunter.candidate_paper_runtime_operator import (
              CandidatePaperRuntimeOperatorError,
              fetch_public_market_snapshot,
              load_liquid20_snapshot,
          )
          from pathlib import Path

          now_ms = time.time_ns() // 1_000_000
          snapshot = load_liquid20_snapshot(
              Path('/runtime/liquid20'),
              now_ms=now_ms,
              maximum_age_ms=300_000,
          )
          results = []
          for symbol in snapshot.universe.selected_symbols:
              started = time.monotonic()
              try:
                  market = fetch_public_market_snapshot(
                      symbol=symbol,
                      observed_at_ms=now_ms,
                      base_url='https://fapi.binance.com',
                  )
              except Exception as exc:
                  results.append({
                      'symbol': symbol,
                      'ok': False,
                      'error_type': type(exc).__name__,
                      'error': str(exc)[:500],
                      'elapsed_ms': int((time.monotonic() - started) * 1000),
                  })
              else:
                  results.append({
                      'symbol': symbol,
                      'ok': True,
                      'completed_candle_close_ms': market.completed_candle_close_ms,
                      'elapsed_ms': int((time.monotonic() - started) * 1000),
                  })
          print(json.dumps({
              'snapshot_id': snapshot.snapshot_id,
              'snapshot_observed_at_ms': snapshot.observed_at_ms,
              'selected_symbols': list(snapshot.universe.selected_symbols),
              'results': results,
              'success_count': sum(1 for row in results if row['ok']),
              'failure_count': sum(1 for row in results if not row['ok']),
          }, indent=2, sort_keys=True))
          PY
