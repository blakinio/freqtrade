name: WickHunter WH09 v12 public-market diagnostic
# Root-cause generation: inspect retained Liquid20 producer run-state counters for the v12 window.

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-diagnose-market-20260807-v12.yml"

permissions:
  contents: read

concurrency:
  group: wickhunter-wh09-v12-public-market-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    name: Probe retained WH09 v12 Liquid20 producer state
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.ref == 'ops/wickhunter-wh09-v12-diagnostic-20260807'
    runs-on: [freqtrade-staging]
    timeout-minutes: 20
    steps:
      - name: Check out exact diagnostic request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v11.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Inspect retained producer epochs read-only
        shell: bash
        env:
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          OPERATOR_CONTAINER: wickhunter-paper-runtime-v12
          EXPECTED_IMAGE_ID: sha256:449ff348296a91865e7d884a2de26ddbb34d67c317afd348ee9e675444566f01
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME_VALUE" == "freqtrade-synology-staging" ]]
          [[ "$RUNNER_OS_VALUE" == "Linux" ]]
          [[ "$RUNNER_ARCH_VALUE" == "X64" ]]
          docker version >/dev/null
          test -S /var/run/docker.sock
          [[ "$(docker inspect --format '{{.Image}}' "$OPERATOR_CONTAINER")" == "$EXPECTED_IMAGE_ID" ]]
          docker exec --interactive "$OPERATOR_CONTAINER" python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/runtime/liquid20')
          runs_root = root / 'runs'
          rows = []
          for run_root in sorted(runs_root.iterdir()):
              if not run_root.is_dir() or run_root.is_symlink():
                  continue
              run_id = run_root.name
              if not (run_id.startswith('liquid20-20260805') or run_id.startswith('liquid20-20260806')):
                  continue
              state_path = run_root / 'run-state-v1.json'
              if not state_path.is_file() or state_path.is_symlink():
                  continue
              state = json.loads(state_path.read_text(encoding='utf-8'))
              sources = {}
              for source, value in sorted(state.get('sources', {}).items()):
                  if not isinstance(value, dict):
                      continue
                  sources[source] = {
                      'configured': value.get('configured'),
                      'connected': value.get('connected'),
                      'events_written': value.get('events_written'),
                      'last_event_received_at_ms': value.get('last_event_received_at_ms'),
                      'last_heartbeat_at_ms': value.get('last_heartbeat_at_ms'),
                      'reconnect_count': value.get('reconnect_count'),
                      'error_count': value.get('error_count'),
                      'parse_error_count': value.get('parse_error_count'),
                      'latest_error': value.get('latest_error'),
                  }
              rows.append({
                  'run_id': run_id,
                  'run_state': state.get('run_state'),
                  'collector_started_at_ms': state.get('collector_started_at_ms'),
                  'collector_heartbeat_at_ms': state.get('collector_heartbeat_at_ms'),
                  'completed_at_ms': state.get('completed_at_ms'),
                  'completion_reason': state.get('completion_reason'),
                  'sources': sources,
              })
          if not rows:
              raise SystemExit('no retained Liquid20 epochs overlap the v12 window')
          summary = {
              'run_count': len(rows),
              'runs': rows,
              'total_reconnects': sum(
                  int(source.get('reconnect_count') or 0)
                  for row in rows
                  for source in row['sources'].values()
              ),
              'total_errors': sum(
                  int(source.get('error_count') or 0)
                  for row in rows
                  for source in row['sources'].values()
              ),
              'total_parse_errors': sum(
                  int(source.get('parse_error_count') or 0)
                  for row in rows
                  for source in row['sources'].values()
              ),
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
