name: WickHunter WH09 suffix validation repair

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-live-snapshot-repair-executor.yml"
      - ".github/wh09-live-snapshot-repair/**"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-suffix-validation-repair
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix/wickhunter-wh09-live-snapshot-consistency-20260805-v1
  EXPECTED_TARGET_HEAD: 71d02de86aa7afa98388f2a2d11662a8c5b08ab9

jobs:
  repair:
    name: Validate discarded active suffix events
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact helper request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate helper scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          expected=$'.github/wh09-live-snapshot-repair/patch.py\n.github/workflows/wickhunter-wh09-live-snapshot-repair-executor.yml'
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Expected helper paths:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          }

      - name: Apply exact review repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" develop
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TARGET_HEAD" ]]
          python - <<'PY'
          from pathlib import Path

          operator = Path("ai_platform/wickhunter/candidate_paper_runtime_operator.py")
          tests = Path("tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py")
          task = Path("docs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md")

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one marker, found {count}: {old[:120]!r}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          parser = '''def _parse_live_source_event(
              row: dict[str, Any],
              *,
              source: str,
              observed_at_ms: int,
          ) -> LiquidationEvent:
              try:
                  event = event_from_json_dict(row)
              except ValueError as exc:
                  raise CandidatePaperRuntimeOperatorError(
                      f"Liquid20 source event is invalid: {source}"
                  ) from exc
              if event.source != source:
                  raise CandidatePaperRuntimeOperatorError(
                      "Liquid20 event source does not match its immutable source file"
                  )
              if event.received_at_ms > observed_at_ms:
                  raise CandidatePaperRuntimeOperatorError(
                      "Liquid20 event was unavailable at live observation time"
                  )
              return event


          '''
          replace_once(
              operator,
              "def _read_committed_jsonl_tail(  # noqa: C901\n",
              parser + "def _read_committed_jsonl_tail(  # noqa: C901\n",
          )
          replace_once(
              operator,
              "    field: str,\n"
              "    committed_rows: int,\n"
              "    allow_uncommitted_suffix: bool,\n"
              ") -> tuple[dict[str, Any], ...]:\n",
              "    field: str,\n"
              "    committed_rows: int,\n"
              "    allow_uncommitted_suffix: bool,\n"
              "    source: str,\n"
              "    observed_at_ms: int,\n"
              ") -> tuple[dict[str, Any], ...]:\n",
          )
          replace_once(
              operator,
              "                if suffix_seen > MAX_UNCOMMITTED_LIVE_EVENTS:\n"
              "                    raise CandidatePaperRuntimeOperatorError(\n"
              "                        f\"{field} contains too many uncommitted events\"\n"
              "                    )\n",
              "                if suffix_seen > MAX_UNCOMMITTED_LIVE_EVENTS:\n"
              "                    raise CandidatePaperRuntimeOperatorError(\n"
              "                        f\"{field} contains too many uncommitted events\"\n"
              "                    )\n"
              "                _parse_live_source_event(\n"
              "                    row,\n"
              "                    source=source,\n"
              "                    observed_at_ms=observed_at_ms,\n"
              "                )\n",
          )
          replace_once(
              operator,
              "        committed_rows=events_written,\n"
              "        allow_uncommitted_suffix=allow_uncommitted_suffix and configured,\n"
              "    )\n",
              "        committed_rows=events_written,\n"
              "        allow_uncommitted_suffix=allow_uncommitted_suffix and configured,\n"
              "        source=source,\n"
              "        observed_at_ms=observed_at_ms,\n"
              "    )\n",
          )
          old_loop = '''    parsed_events: list[LiquidationEvent] = []
              for row in event_rows:
                  try:
                      event = event_from_json_dict(row)
                  except ValueError as exc:
                      raise CandidatePaperRuntimeOperatorError(
                          f"Liquid20 source event is invalid: {source}"
                      ) from exc
                  if event.source != source:
                      raise CandidatePaperRuntimeOperatorError(
                          "Liquid20 event source does not match its immutable source file"
                      )
                  if event.received_at_ms > observed_at_ms:
                      raise CandidatePaperRuntimeOperatorError(
                          "Liquid20 event was unavailable at live observation time"
                      )
                  parsed_events.append(event)
          '''
          new_loop = '''    parsed_events = [
              _parse_live_source_event(
                  row,
                  source=source,
                  observed_at_ms=observed_at_ms,
              )
              for row in event_rows
          ]
          '''
          replace_once(operator, old_loop, new_loop)

          marker = "\n\ndef test_live_root_allows_uncommitted_first_event_for_configured_source(\n"
          regression = r'''

          @pytest.mark.parametrize(
              ("mutation", "message"),
              (
                  ("invalid", "source event is invalid"),
                  ("wrong-source", "source does not match"),
                  ("future", "unavailable at live observation time"),
              ),
          )
          def test_live_root_rejects_invalid_uncommitted_active_suffix(
              tmp_path: Path,
              mutation: str,
              message: str,
          ) -> None:
              root = _write_live_root(tmp_path / f"active-suffix-{mutation}")
              pointer = json.loads(
                  (root / "live-state-v1.json").read_text(encoding="utf-8")
              )
              state = cast(dict[str, object], pointer["state"])
              run_id = str(state["run_id"])
              suffix = _event("event-uncommitted-invalid", received_at_ms=NOW_MS - 500)
              if mutation == "invalid":
                  suffix["price"] = "0"
              elif mutation == "wrong-source":
                  suffix["source"] = "bybit-linear"
              else:
                  suffix["received_at_ms"] = NOW_MS + 1
                  suffix["occurred_at_ms"] = NOW_MS
              with (root / "runs" / run_id / "binance-usdm.ndjson").open(
                  "a", encoding="utf-8"
              ) as handle:
                  handle.write(json.dumps(suffix, sort_keys=True) + "\n")

              with pytest.raises(CandidatePaperRuntimeOperatorError, match=message):
                  load_liquid20_snapshot(root, now_ms=NOW_MS)
          '''
          replace_once(tests, marker, regression + marker)

          task_text = task.read_text(encoding="utf-8")
          section = '''

          ## Uncommitted suffix validation repair

          Automated review identified that active-run suffix rows were bounded and decoded as
          JSON objects but discarded before canonical event, immutable source and decision-time
          validation. The shared event parser now validates both committed rows and every complete
          uncommitted suffix row before the suffix is ignored. Invalid schema, non-positive values,
          source substitution and future receipt timestamps therefore fail closed immediately,
          while valid producer-ahead rows remain excluded until atomically committed by state.
          Focused parametrized regressions cover invalid payload, wrong source and future receipt.
          '''
          if "## Uncommitted suffix validation repair" in task_text:
              raise SystemExit("task already contains suffix validation repair")
          task.write_text(task_text.rstrip() + section.rstrip() + "\n", encoding="utf-8")
          PY

      - name: Install focused validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            pytest "pydantic>=2.2" "SQLAlchemy>=2.0.6" \
            "httpx>=0.24.1" fastapi pyjwt cryptography "PyYAML>=6.0" \
            lightgbm mypy ruff==0.15.20

      - name: Validate review repair
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            ai_platform/wickhunter/candidate_paper_runtime_operator.py
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          )
          python -m ruff check --fix "${paths[@]}"
          python -m ruff format "${paths[@]}"
          python -m ruff check "${paths[@]}"
          python -m ruff format --check "${paths[@]}"
          python -m py_compile "${paths[@]}"
          python -m mypy ai_platform/wickhunter/candidate_paper_runtime_operator.py
          python -m pytest -q -o addopts='' \
            --confcutdir=tests/ai_platform_integration \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py \
            tests/ai_platform_integration/test_wickhunter_candidate_runtime_binding.py
          OPERATOR_COMMIT="$(git rev-parse HEAD)" \
          WICKHUNTER_PAPER_RUNTIME_IMAGE="wickhunter-paper-runtime:precommit" \
          CANDIDATE_ROOT_HOST=/tmp/candidate \
          ACTIVATION_ROOT_HOST=/tmp/activation \
          LIQUID20_LIVE_HOST=/tmp/liquid20 \
          JOURNAL_ROOT_HOST=/tmp/journal \
          OPERATOR_STATE_HOST=/tmp/operator \
            docker compose -f deploy/synology/wickhunter-paper-runtime/compose.yaml config >/dev/null
          git diff --check

      - name: Commit, build and push exact product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            docs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          ! git diff --cached --quiet
          git commit -m "fix(wickhunter): validate uncommitted Liquid20 suffix events"
          product_head="$(git rev-parse HEAD)"
          docker build \
            --file deploy/synology/wickhunter-paper-runtime/Dockerfile \
            --build-arg "OPERATOR_COMMIT=$product_head" \
            --tag "wickhunter-paper-runtime:$product_head" \
            .
          [[ "$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "wickhunter-paper-runtime:$product_head")" == "$product_head" ]]
          expected=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          actual="$(git diff --name-only origin/develop HEAD | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Expected product paths:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          }
          git push origin "HEAD:$TARGET_BRANCH"
