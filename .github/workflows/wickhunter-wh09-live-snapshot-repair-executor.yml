name: WickHunter WH09 live snapshot consistency repair

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-live-snapshot-repair-executor.yml"
      - ".github/wh09-live-snapshot-repair/**"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-live-snapshot-consistency-repair
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix/wickhunter-wh09-live-snapshot-consistency-20260805-v1
  EXPECTED_TARGET_HEAD: 188b7fe879987387b70fa5d051dcc3c6a8ab8682

jobs:
  repair:
    name: Repair and validate active producer snapshot contract
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact repair request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate request and retain patch executor
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          python -m py_compile .github/wh09-live-snapshot-repair/patch.py
          cp .github/wh09-live-snapshot-repair/patch.py "$RUNNER_TEMP/wh09-live-snapshot-patch.py"
          expected=$'.github/wh09-live-snapshot-repair/patch.py\n.github/workflows/wickhunter-wh09-live-snapshot-repair-executor.yml'
          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Expected request paths:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          }

      - name: Apply exact product repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" develop
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TARGET_HEAD" ]]
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/wickhunter/candidate_paper_runtime_operator.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '        if historical_run_id == run_id and run_state != active_state:\n'
              '            raise CandidatePaperRuntimeOperatorError('
              '"Liquid20 active pointer and run state differ")\n'
          )
          new = (
              '        if historical_run_id == run_id and run_state != active_state:\n'
              '            raise CandidatePaperRuntimeOperatorError(\n'
              '                "Liquid20 active pointer and run state differ"\n'
              '            )\n'
          )
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected one single-line active-state marker, found {text.count(old)}"
              )
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python "$RUNNER_TEMP/wh09-live-snapshot-patch.py"

      - name: Install focused validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            pytest "pydantic>=2.2" "SQLAlchemy>=2.0.6" \
            "httpx>=0.24.1" fastapi pyjwt cryptography "PyYAML>=6.0" \
            lightgbm mypy ruff==0.15.20

      - name: Validate repaired product paths
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            ai_platform/wickhunter/candidate_paper_runtime_operator.py
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          )
          python -m ruff check --fix "${paths[@]}"
          python -m ruff format "${paths[@]}"
          python -m ruff check "${paths[@]}"
          python -m ruff format --check "${paths[@]}"
          python -m py_compile "${paths[@]}"
          python -m mypy ai_platform/wickhunter/candidate_paper_runtime_operator.py
          python -m pytest -q -o addopts='' \
            --confcutdir=tests/ai_platform_integration \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py \
            tests/ai_platform_integration/test_wickhunter_candidate_runtime_binding.py
          OPERATOR_COMMIT="$(git rev-parse HEAD)" \
          WICKHUNTER_PAPER_RUNTIME_IMAGE="wickhunter-paper-runtime:precommit" \
          CANDIDATE_ROOT_HOST=/tmp/candidate \
          ACTIVATION_ROOT_HOST=/tmp/activation \
          LIQUID20_LIVE_HOST=/tmp/liquid20 \
          JOURNAL_ROOT_HOST=/tmp/journal \
          OPERATOR_STATE_HOST=/tmp/operator \
            docker compose \
              -f deploy/synology/wickhunter-paper-runtime/compose.yaml \
              config >/dev/null
          git diff --check

      - name: Commit, build and push exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            docs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          ! git diff --cached --quiet
          git commit -m "fix(wickhunter): read committed Liquid20 active snapshots"
          product_head="$(git rev-parse HEAD)"
          docker build \
            --file deploy/synology/wickhunter-paper-runtime/Dockerfile \
            --build-arg "OPERATOR_COMMIT=$product_head" \
            --tag "wickhunter-paper-runtime:$product_head" \
            .
          [[ "$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "wickhunter-paper-runtime:$product_head")" == "$product_head" ]]
          expected=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          actual="$(git diff --name-only origin/develop HEAD | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Expected product paths:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          }
          git push origin "HEAD:$TARGET_BRANCH"
