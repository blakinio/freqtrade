name: WickHunter WH09 PAPER operator implementation request

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-operator-implementation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/wickhunter-wh09-paper-runtime-operator-20260803-v1
  TARGET_BASE_SHA: 0a82a5c93613a213989865bd9128ac7263227148
  TARGET_HEAD_SHA: 903a3aa8f697c69ec651d301bd74b0483684210e

jobs:
  validate:
    name: Validate final persistent PAPER operator
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact helper request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact helper scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.pull_request.base.sha }}" == "$TARGET_BASE_SHA" ]]
          expected=$'A\t.github/workflows/wickhunter-wh09-operator-implementation-request.yml'
          [[ "$(git diff --name-status "$TARGET_BASE_SHA" "${{ github.event.pull_request.head.sha }}")" == "$expected" ]]

      - name: Check out exact product branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: target

      - name: Validate exact product scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C target rev-parse HEAD)" == "$TARGET_HEAD_SHA" ]]
          [[ "$(git -C target merge-base "$TARGET_BASE_SHA" HEAD)" == "$TARGET_BASE_SHA" ]]
          expected=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndeploy/synology/wickhunter-paper-runtime/Dockerfile\ndeploy/synology/wickhunter-paper-runtime/README.md\ndeploy/synology/wickhunter-paper-runtime/compose.yaml\ndeploy/synology/wickhunter-paper-runtime/healthcheck.py\ndocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          [[ "$(git -C target diff --name-only "$TARGET_BASE_SHA"...HEAD | sort)" == "$expected" ]]
          [[ -z "$(git -C target status --porcelain)" ]]

      - name: Narrow integer input exactly
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/wickhunter/candidate_paper_runtime_operator.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _integer(value: object, *, field: str) -> int:
              if isinstance(value, bool):
                  raise CandidatePaperRuntimeOperatorError(f"{field} must be an integer")
              try:
                  parsed = int(value)
          '''
          new = '''def _integer(value: object, *, field: str) -> int:
              if isinstance(value, bool) or not isinstance(value, (int, str)):
                  raise CandidatePaperRuntimeOperatorError(f"{field} must be an integer")
              try:
                  parsed = int(value)
          '''
          if text.count(old) != 1:
              raise SystemExit("integer narrowing anchor mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 -m py_compile \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false
          working-directory: target

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd target
          uv pip install -r requirements-dev.txt
          uv pip install lightgbm==4.6.0
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Validate Ruff format and lint
        shell: bash
        run: |
          set -euo pipefail
          cd target
          paths=(
            ai_platform/wickhunter/candidate_paper_runtime_operator.py
            deploy/synology/wickhunter-paper-runtime/healthcheck.py
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          )
          ruff format "${paths[@]}"
          ruff check "${paths[@]}"
          ruff format --check "${paths[@]}"

      - name: Type-check operator
        shell: bash
        run: |
          set -euo pipefail
          cd target
          mypy ai_platform/wickhunter/candidate_paper_runtime_operator.py

      - name: Run focused operator and runtime tests
        shell: bash
        run: |
          set -euo pipefail
          cd target
          pytest -q \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py \
            tests/ai_platform_integration/test_wickhunter_candidate_runtime_binding.py

      - name: Validate hardened Compose package
        shell: bash
        run: |
          set -euo pipefail
          cd target
          OPERATOR_COMMIT="$TARGET_HEAD_SHA" \
          CANDIDATE_ROOT_HOST=/tmp/candidate \
          ACTIVATION_ROOT_HOST=/tmp/activation \
          JOURNAL_ROOT_HOST=/tmp/journal \
          OPERATOR_STATE_HOST=/tmp/operator \
          LIQUID20_LIVE_HOST=/tmp/liquid20 \
          WICKHUNTER_PAPER_RUNTIME_IMAGE=wickhunter-paper-runtime:"$TARGET_HEAD_SHA" \
            docker compose \
              -f deploy/synology/wickhunter-paper-runtime/compose.yaml \
              config --quiet

      - name: Commit, build and push validated product
        shell: bash
        run: |
          set -euo pipefail
          cd target
          changed="$(git diff --name-only)"
          [[ "$changed" == "ai_platform/wickhunter/candidate_paper_runtime_operator.py" ]]
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/wickhunter/candidate_paper_runtime_operator.py
          git commit -m "fix(wickhunter): narrow integer input before conversion"
          product_sha="$(git rev-parse HEAD)"
          docker build \
            --build-arg OPERATOR_COMMIT="$product_sha" \
            --tag "wickhunter-paper-runtime:$product_sha" \
            --file deploy/synology/wickhunter-paper-runtime/Dockerfile \
            .
          image_revision="$(docker image inspect "wickhunter-paper-runtime:$product_sha" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "$image_revision" == "$product_sha" ]]
          git push origin "HEAD:$TARGET_BRANCH"
          {
            echo "## WickHunter WH09 PAPER operator final validation"
            echo
            echo "- Product head: \`$product_sha\`"
            echo "- Exact product paths: \`7\`"
            echo "- Compile, Ruff, mypy, focused pytest, Compose and image build: \`PASS\`"
            echo "- Protected holdout/credentials/order adapter/execution/orders/live capital: \`absent\`"
          } >> "$GITHUB_STEP_SUMMARY"
