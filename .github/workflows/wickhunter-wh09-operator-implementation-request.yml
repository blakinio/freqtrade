name: WickHunter WH09 operator preview materialization

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
      - ".github/wh09-payload/**"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-operator-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/wickhunter-wh09-paper-runtime-operator-20260803-v1
  TARGET_HEAD_SHA: 2cbbfef2dd2fd7361b083b409872049a9ae665f8

jobs:
  materialize:
    name: Persist audited operator preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact helper request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact helper scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          expected=(
            ".github/wh09-payload/README.md.zlib.b64"
            ".github/wh09-payload/compose.yaml.zlib.b64"
            ".github/wh09-payload/healthcheck.py.zlib.b64"
            ".github/wh09-payload/operator.py.zlib.b64"
            ".github/wh09-payload/task.md.zlib.b64"
            ".github/wh09-payload/tests.py.zlib.b64"
            ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
          )
          mapfile -t actual < <(git diff --name-only "$merge_base" "$HEAD_SHA" | sort)
          [[ "${#actual[@]}" -eq "${#expected[@]}" ]]
          for index in "${!expected[@]}"; do
            [[ "${actual[$index]}" == "${expected[$index]}" ]]
          done

      - name: Check out exact product head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: target

      - name: Materialize verified operator into existing helper payload path
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C target rev-parse HEAD)" == "$TARGET_HEAD_SHA" ]]
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import os
          import zlib
          from pathlib import Path

          payload = Path('.github/wh09-payload/operator.py.zlib.b64')
          current_bytes = payload.read_bytes()
          if current_bytes.startswith(b'from __future__ import annotations'):
              text = current_bytes.decode('utf-8')
              compile(text, str(payload), 'exec')
              print(f'materialized_operator_sha256={hashlib.sha256(current_bytes).hexdigest()}')
              raise SystemExit(0)

          compressed = base64.b64decode(current_bytes.strip(), validate=True)
          try:
              decoded = zlib.decompress(compressed)
          except zlib.error as exc:
              if 'incorrect data check' not in str(exc):
                  raise
              decoded = zlib.decompress(compressed[2:-4], -zlib.MAX_WBITS)
          if hashlib.sha256(decoded).hexdigest() != '19fb98ca6e6910eeda89d910ad6d9c63b63fbf9f7d261ba1ec2bee2bd96aa48c':
              raise SystemExit('operator payload identity mismatch')
          transformation = decoded.decode('utf-8')
          sentinel = 'operator_path.write_text(operator, encoding="utf-8")'
          index = transformation.find(sentinel)
          if index < 0 or transformation.find(sentinel, index + 1) >= 0:
              raise SystemExit('verified operator write sentinel is not unique')
          prefix = transformation[: index + len(sentinel)] + '\n'
          compile(prefix, str(payload), 'exec')
          original_cwd = Path.cwd()
          try:
              os.chdir('target')
              exec(compile(prefix, str(payload), 'exec'), {'__name__': '__main__'})
          finally:
              os.chdir(original_cwd)
          operator = Path('target/ai_platform/wickhunter/candidate_paper_runtime_operator.py')
          operator_text = operator.read_text(encoding='utf-8')
          compile(operator_text, str(operator), 'exec')
          payload.write_text(operator_text, encoding='utf-8')
          print(f'materialized_operator_sha256={hashlib.sha256(operator_text.encode()).hexdigest()}')
          PY
          git diff --check

      - name: Publish preview only when newly materialized
        shell: bash
        env:
          HELPER_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/wh09-payload/operator.py.zlib.b64; then
            echo "Operator preview already materialized and compile-valid."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/wh09-payload/operator.py.zlib.b64
          git commit -m "chore(wickhunter): materialize operator repair preview"
          git push origin "HEAD:$HELPER_BRANCH"
