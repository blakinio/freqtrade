name: WickHunter WH09 audited product repair

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
      - ".github/wh09-payload/**"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-product-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/wickhunter-wh09-paper-runtime-operator-20260803-v1
  EXPECTED_TARGET_HEAD: 2cbbfef2dd2fd7361b083b409872049a9ae665f8

jobs:
  apply-audited-repair:
    name: Apply audited root-only PAPER operator repair
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact helper head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate helper scope and corrected payload
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          expected=(
            ".github/wh09-payload/README.md.zlib.b64"
            ".github/wh09-payload/compose.yaml.zlib.b64"
            ".github/wh09-payload/healthcheck.py.zlib.b64"
            ".github/wh09-payload/operator.py.zlib.b64"
            ".github/wh09-payload/task.md.zlib.b64"
            ".github/wh09-payload/tests.py.zlib.b64"
            ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
          )
          mapfile -t actual < <(git diff --name-only "$merge_base" "$HEAD_SHA" | sort)
          [[ "${#actual[@]}" -eq "${#expected[@]}" ]]
          for index in "${!expected[@]}"; do
            [[ "${actual[$index]}" == "${expected[$index]}" ]]
          done

          python3 -m py_compile \
            .github/wh09-payload/operator.py.zlib.b64 \
            .github/wh09-payload/healthcheck.py.zlib.b64 \
            .github/wh09-payload/tests.py.zlib.b64

          operator=.github/wh09-payload/operator.py.zlib.b64
          required=(
            'LIVE_POINTER_NAME = "live-state-v1.json"'
            '"/fapi/v1/ticker/bookTicker"'
            '"atr_ratio"'
            '"market_wide_liquidation_intensity"'
            '"--liquid20-root"'
            'limit": 1441'
          )
          forbidden=(
            '"/fapi/v1/ticker/24hr"'
            '"--liquid20-snapshot"'
            'if path.is_dir():'
          )
          for marker in "${required[@]}"; do
            grep -Fq -- "$marker" "$operator"
          done
          for marker in "${forbidden[@]}"; do
            ! grep -Fq -- "$marker" "$operator"
          done
          [[ "$(grep -Fc 'def _market_wide_liquidation_intensity(' "$operator")" -eq 1 ]]
          git diff --check

      - name: Materialize and push corrected product branch
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          cp .github/wh09-payload/operator.py.zlib.b64 "$staging/operator.py"
          cp .github/wh09-payload/README.md.zlib.b64 "$staging/README.md"
          cp .github/wh09-payload/compose.yaml.zlib.b64 "$staging/compose.yaml"
          cp .github/wh09-payload/healthcheck.py.zlib.b64 "$staging/paper_runtime_healthcheck.py"
          cp .github/wh09-payload/tests.py.zlib.b64 "$staging/tests.py"

          git fetch origin develop "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TARGET_HEAD" ]]

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-ff --no-edit origin/develop

          cp "$staging/operator.py" ai_platform/wickhunter/candidate_paper_runtime_operator.py
          cp "$staging/README.md" deploy/synology/wickhunter-paper-runtime/README.md
          cp "$staging/compose.yaml" deploy/synology/wickhunter-paper-runtime/compose.yaml
          cp "$staging/paper_runtime_healthcheck.py" \
            deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py
          cp "$staging/tests.py" \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py

          python3 -m py_compile \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          git diff --check

          git add \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/README.md \
            deploy/synology/wickhunter-paper-runtime/compose.yaml \
            deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          ! git diff --cached --quiet
          git commit -m "fix(wickhunter): apply audited Liquid20 runtime contract"

          expected=(
            "ai_platform/wickhunter/candidate_paper_runtime_operator.py"
            "deploy/synology/wickhunter-paper-runtime/Dockerfile"
            "deploy/synology/wickhunter-paper-runtime/README.md"
            "deploy/synology/wickhunter-paper-runtime/compose.yaml"
            "deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py"
            "docs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md"
            "tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py"
          )
          mapfile -t actual < <(git diff --name-only origin/develop HEAD | sort)
          [[ "${#actual[@]}" -eq "${#expected[@]}" ]]
          for index in "${!expected[@]}"; do
            [[ "${actual[$index]}" == "${expected[$index]}" ]]
          done

          git push origin "HEAD:$TARGET_BRANCH"
