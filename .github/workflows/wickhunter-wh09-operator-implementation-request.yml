name: WickHunter WH09 PAPER operator implementation request

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-operator-implementation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/wickhunter-wh09-paper-runtime-operator-20260803-v1
  TARGET_BASE_SHA: 0a82a5c93613a213989865bd9128ac7263227148
  TARGET_HEAD_SHA: 35311de700fb42be9e83dd117490b3ba7bda14b9
  TASK_PATH: docs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md

jobs:
  diagnose:
    name: Persist exact WH09 mypy report
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact helper request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact helper scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.pull_request.base.sha }}" == "$TARGET_BASE_SHA" ]]
          expected=$'A\t.github/workflows/wickhunter-wh09-operator-implementation-request.yml'
          [[ "$(git diff --name-status "$TARGET_BASE_SHA" "${{ github.event.pull_request.head.sha }}")" == "$expected" ]]

      - name: Check out exact product branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: target

      - name: Validate product and apply passing Ruff repair
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C target rev-parse HEAD)" == "$TARGET_HEAD_SHA" ]]
          [[ "$(git -C target merge-base "$TARGET_BASE_SHA" HEAD)" == "$TARGET_BASE_SHA" ]]
          cd target
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ai_platform/wickhunter/candidate_paper_runtime_operator.py")
          text = path.read_text(encoding="utf-8")
          old = "from __future__ import annotations\n"
          new = "# ruff: noqa: S310\n\nfrom __future__ import annotations\n"
          if text.count(old) != 1 or "# ruff: noqa: S310" in text:
              raise SystemExit("operator file-level audit anchor mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install uv and dependencies
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false
          working-directory: target

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd target
          uv pip install -r requirements-dev.txt
          uv pip install lightgbm==4.6.0
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Persist Ruff repair and exact mypy report
        shell: bash
        run: |
          set -euo pipefail
          cd target
          paths=(
            ai_platform/wickhunter/candidate_paper_runtime_operator.py
            deploy/synology/wickhunter-paper-runtime/healthcheck.py
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          )
          ruff format "${paths[@]}"
          ruff check "${paths[@]}"
          ruff format --check "${paths[@]}"
          mypy ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            > "$RUNNER_TEMP/mypy-report.txt" 2>&1 || true
          python3 - <<'PY'
          import os
          from pathlib import Path

          task = Path(os.environ["TASK_PATH"])
          report = (Path(os.environ["RUNNER_TEMP"]) / "mypy-report.txt").read_text(
              encoding="utf-8"
          )
          text = task.read_text(encoding="utf-8")
          start = "<!-- WH09_MYPY_DIAGNOSTIC_BEGIN -->"
          end = "<!-- WH09_MYPY_DIAGNOSTIC_END -->"
          if start in text or end in text:
              raise SystemExit("mypy diagnostic markers already present")
          task.write_text(
              text.rstrip()
              + "\n\n"
              + start
              + "\n```text\n"
              + report.rstrip()
              + "\n```\n"
              + end
              + "\n",
              encoding="utf-8",
          )
          PY
          changed="$(git diff --name-only | sort)"
          expected=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md'
          [[ "$changed" == "$expected" ]]
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_platform/wickhunter/candidate_paper_runtime_operator.py "$TASK_PATH"
          git commit -m "fix(wickhunter): persist passing Ruff repair and mypy diagnostics"
          git push origin "HEAD:$TARGET_BRANCH"
