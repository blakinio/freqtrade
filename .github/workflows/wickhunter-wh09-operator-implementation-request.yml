name: WickHunter WH09 operator repair preview

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
      - ".github/wh09-payload/**"

permissions:
  contents: read

concurrency:
  group: wickhunter-wh09-operator-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/wickhunter-wh09-paper-runtime-operator-20260803-v1
  TARGET_HEAD_SHA: 2cbbfef2dd2fd7361b083b409872049a9ae665f8

jobs:
  preview:
    name: Materialize audited operator preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact helper request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact helper scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          expected=(
            ".github/wh09-payload/README.md.zlib.b64"
            ".github/wh09-payload/compose.yaml.zlib.b64"
            ".github/wh09-payload/healthcheck.py.zlib.b64"
            ".github/wh09-payload/operator.py.zlib.b64"
            ".github/wh09-payload/task.md.zlib.b64"
            ".github/wh09-payload/tests.py.zlib.b64"
            ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
          )
          mapfile -t actual < <(git diff --name-only "$merge_base" "$HEAD_SHA" | sort)
          [[ "${#actual[@]}" -eq "${#expected[@]}" ]]
          for index in "${!expected[@]}"; do
            [[ "${actual[$index]}" == "${expected[$index]}" ]]
          done

      - name: Check out exact product head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: target

      - name: Recover only the verified complete operator transformation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C target rev-parse HEAD)" == "$TARGET_HEAD_SHA" ]]
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import zlib
          from pathlib import Path

          payload = Path('.github/wh09-payload/operator.py.zlib.b64')
          compressed = base64.b64decode(payload.read_bytes().strip(), validate=True)
          try:
              decoded = zlib.decompress(compressed)
          except zlib.error as exc:
              if 'incorrect data check' not in str(exc):
                  raise
              decoded = zlib.decompress(compressed[2:-4], -zlib.MAX_WBITS)
          text = decoded.decode('utf-8')
          sentinel = 'operator_path.write_text(operator, encoding="utf-8")'
          index = text.find(sentinel)
          if index < 0 or text.find(sentinel, index + 1) >= 0:
              raise SystemExit('verified operator write sentinel is not unique')
          prefix = text[: index + len(sentinel)] + '\n'
          if hashlib.sha256(decoded).hexdigest() != '19fb98ca6e6910eeda89d910ad6d9c63b63fbf9f7d261ba1ec2bee2bd96aa48c':
              raise SystemExit('operator payload identity mismatch')
          compile(prefix, str(payload), 'exec')
          namespace = {'__name__': '__main__'}
          current = Path.cwd()
          try:
              import os
              os.chdir('target')
              exec(compile(prefix, str(payload), 'exec'), namespace)
          finally:
              os.chdir(current)
          operator = Path('target/ai_platform/wickhunter/candidate_paper_runtime_operator.py')
          compile(operator.read_text(encoding='utf-8'), str(operator), 'exec')
          print(f'preview_operator_sha256={hashlib.sha256(operator.read_bytes()).hexdigest()}')
          PY
          mkdir -p preview/ai_platform/wickhunter
          cp target/ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            preview/ai_platform/wickhunter/candidate_paper_runtime_operator.py
          git -C target diff --check
          git -C target diff --stat

      - name: Upload exact preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wickhunter-wh09-operator-preview-${{ github.event.pull_request.head.sha }}
          path: preview/
          if-no-files-found: error
          retention-days: 3
