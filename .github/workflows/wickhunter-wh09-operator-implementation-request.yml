name: WickHunter WH09 PAPER operator audit repair

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
      - ".github/wh09-payload/**"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-operator-audit-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/wickhunter-wh09-paper-runtime-operator-20260803-v1
  TARGET_HEAD_SHA: 6ad2d1db6280182626eb675060b4911cd6b5a159

jobs:
  validate:
    name: Repair audited PAPER authorization and decision-time guards
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact helper request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate bounded helper scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          expected=(
            ".github/wh09-payload/README.md.zlib.b64"
            ".github/wh09-payload/compose.yaml.zlib.b64"
            ".github/wh09-payload/healthcheck.py.zlib.b64"
            ".github/wh09-payload/operator.py.zlib.b64"
            ".github/wh09-payload/task.md.zlib.b64"
            ".github/wh09-payload/tests.py.zlib.b64"
            ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
          )
          mapfile -t actual < <(git diff --name-only "$merge_base" "$HEAD_SHA" | sort)
          [[ "${#actual[@]}" -eq "${#expected[@]}" ]]
          for index in "${!expected[@]}"; do
            [[ "${actual[$index]}" == "${expected[$index]}" ]]
          done

      - name: Check out exact product branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: target

      - name: Apply bounded audit repair
        shell: bash
        run: |
          set -euo pipefail
          cd target
          [[ "$(git rev-parse HEAD)" == "$TARGET_HEAD_SHA" ]]
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin develop
          [[ "$(git merge-base HEAD origin/develop)" == "$(git rev-parse origin/develop)" ]]
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          operator_path = Path("ai_platform/wickhunter/candidate_paper_runtime_operator.py")
          operator = operator_path.read_text(encoding="utf-8")
          operator = replace_once(
              operator,
              "    AvailableMetric,\n    DriftState,",
              "    AvailableMetric,\n    BotMode,\n    DriftState,",
              "BotMode import",
          )
          operator = replace_once(
              operator,
              "    if not source_tuple:\n        raise CandidatePaperRuntimeOperatorError(\"Liquid20 source states are empty\")\n    if any(item.observed_at_ms > observed_at_ms for item in source_tuple):",
              "    if not source_tuple:\n        raise CandidatePaperRuntimeOperatorError(\"Liquid20 source states are empty\")\n    if any(\n        item.last_received_at_ms is not None\n        and (\n            item.last_received_at_ms > observed_at_ms\n            or item.last_received_at_ms > item.observed_at_ms\n        )\n        for item in source_tuple\n    ):\n        raise CandidatePaperRuntimeOperatorError(\n            \"Liquid20 source receipt was unavailable at source observation time\"\n        )\n    if any(item.observed_at_ms > observed_at_ms for item in source_tuple):",
              "source receipt decision-time guard",
          )
          operator = replace_once(
              operator,
              "    if parsed.hostname.lower() not in {\"fapi.binance.com\", \"testnet.binancefuture.com\"}:\n",
              "    if parsed.hostname.lower() != \"fapi.binance.com\":\n",
              "real market host allowlist",
          )
          operator = replace_once(
              operator,
              "        _assert_regular_absolute(self.liquid20_snapshot_path, field=\"Liquid20 snapshot\")\n",
              "        if self.service.binding.request.mode is not BotMode.PAPER:\n            raise CandidatePaperRuntimeOperatorError(\n                \"runtime binding mode must be PAPER\"\n            )\n        _assert_regular_absolute(self.liquid20_snapshot_path, field=\"Liquid20 snapshot\")\n",
              "PAPER binding guard",
          )
          operator = replace_once(
              operator,
              "                        candidate_paper_validation_authorized=False,\n",
              "                        candidate_paper_validation_authorized=True,\n",
              "candidate PAPER authorization",
          )
          operator_path.write_text(operator, encoding="utf-8")

          tests_path = Path(
              "tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py"
          )
          tests = tests_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              "def _future_event_payload(payload: dict[str, object]) -> None:\n    events = cast(list[dict[str, object]], payload[\"events\"])\n    events[0][\"received_at_ms\"] = NOW_MS + 1\n    _rehash_payload(payload)\n\n\n",
              "def _future_event_payload(payload: dict[str, object]) -> None:\n    events = cast(list[dict[str, object]], payload[\"events\"])\n    events[0][\"received_at_ms\"] = NOW_MS + 1\n    _rehash_payload(payload)\n\n\ndef _future_source_state_payload(payload: dict[str, object]) -> None:\n    states = cast(list[dict[str, object]], payload[\"source_states\"])\n    states[0][\"last_received_at_ms\"] = NOW_MS + 1\n    _rehash_payload(payload)\n\n\n",
              "future source-state fixture",
          )
          tests = replace_once(
              tests,
              "        (_future_event_payload, \"unavailable\"),\n        (lambda payload: payload.update({\"snapshot_sha256\": \"0\" * 64}), \"self-hash\"),",
              "        (_future_event_payload, \"unavailable\"),\n        (_future_source_state_payload, \"source receipt\"),\n        (lambda payload: payload.update({\"snapshot_sha256\": \"0\" * 64}), \"self-hash\"),",
              "future source-state parameter",
          )
          tests = replace_once(
              tests,
              "    assert request.risk_context.candidate_paper_validation_authorized is False\n",
              "    assert request.risk_context.candidate_paper_validation_authorized is True\n",
              "candidate PAPER authorization assertion",
          )
          tests = replace_once(
              tests,
              "def test_public_market_redirect_fails_closed(monkeypatch: pytest.MonkeyPatch) -> None:\n",
              "def test_non_production_public_market_host_fails_closed(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    for name in operator_module.FORBIDDEN_ENVIRONMENT_NAMES:\n        monkeypatch.delenv(name, raising=False)\n    with pytest.raises(CandidatePaperRuntimeOperatorError, match=\"allowlisted\"):\n        fetch_public_market_snapshot(\n            symbol=\"BTCUSDT\",\n            observed_at_ms=NOW_MS,\n            base_url=\"https://testnet.binancefuture.com\",\n            opener=cast(Any, _Opener()),\n        )\n\n\ndef test_public_market_redirect_fails_closed(monkeypatch: pytest.MonkeyPatch) -> None:\n",
              "real host regression test",
          )
          tests = replace_once(
              tests,
              "def test_operator_composes_paper_tick_without_authority(\n",
              "def test_operator_rejects_non_paper_binding(tmp_path: Path) -> None:\n    service = _service()\n    service.binding.request.mode = BotMode.SHADOW\n    with pytest.raises(CandidatePaperRuntimeOperatorError, match=\"mode must be PAPER\"):\n        CandidatePaperRuntimeOperator(\n            service=cast(Any, service),\n            liquid20_snapshot_path=_write_snapshot(tmp_path / \"liquid20.json\").resolve(),\n            health_path=(tmp_path / \"health\" / \"health.json\").resolve(),\n            operator_commit=CODE_SHA,\n        )\n\n\ndef test_operator_composes_paper_tick_without_authority(\n",
              "PAPER binding regression test",
          )
          tests_path.write_text(tests, encoding="utf-8")
          PY
          python3 -m py_compile \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false
          working-directory: target

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd target
          uv pip install -r requirements-dev.txt
          uv pip install lightgbm==4.6.0
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Validate focused implementation
        shell: bash
        run: |
          set -euo pipefail
          cd target
          paths=(
            ai_platform/wickhunter/candidate_paper_runtime_operator.py
            deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          )
          ruff format "${paths[@]}"
          ruff check "${paths[@]}"
          ruff format --check "${paths[@]}"
          mypy ai_platform/wickhunter/candidate_paper_runtime_operator.py
          pytest -q \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py \
            tests/ai_platform_integration/test_wickhunter_candidate_runtime_binding.py
          OPERATOR_COMMIT="$TARGET_HEAD_SHA" \
          CANDIDATE_ROOT_HOST=/tmp/candidate \
          ACTIVATION_ROOT_HOST=/tmp/activation \
          JOURNAL_ROOT_HOST=/tmp/journal \
          OPERATOR_STATE_HOST=/tmp/operator \
          LIQUID20_LIVE_HOST=/tmp/liquid20 \
          WICKHUNTER_PAPER_RUNTIME_IMAGE=wickhunter-paper-runtime:"$TARGET_HEAD_SHA" \
            docker compose -f deploy/synology/wickhunter-paper-runtime/compose.yaml config --quiet

      - name: Commit, build and publish exact repaired product
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git add \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          git commit -m "fix(wickhunter): authorize bounded PAPER candidate evaluation"
          expected=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndeploy/synology/wickhunter-paper-runtime/Dockerfile\ndeploy/synology/wickhunter-paper-runtime/README.md\ndeploy/synology/wickhunter-paper-runtime/compose.yaml\ndeploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py\ndocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          [[ "$(git diff --name-only origin/develop...HEAD | sort)" == "$expected" ]]
          product_sha="$(git rev-parse HEAD)"
          docker build \
            --build-arg OPERATOR_COMMIT="$product_sha" \
            --tag "wickhunter-paper-runtime:$product_sha" \
            --file deploy/synology/wickhunter-paper-runtime/Dockerfile \
            .
          image_revision="$(docker image inspect "wickhunter-paper-runtime:$product_sha" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "$image_revision" == "$product_sha" ]]
          git push origin "HEAD:$TARGET_BRANCH"
          {
            echo "## WickHunter WH09 independent audit repair"
            echo
            echo "- Product head: \`$product_sha\`"
            echo "- Candidate PAPER evaluation is authorized only for an exact PAPER binding: \`PASS\`"
            echo "- Source-state decision-time guard and real production host restriction: \`PASS\`"
            echo "- Compile, Ruff, mypy, focused pytest, Compose and exact-revision image build: \`PASS\`"
            echo "- Trading credentials/order adapter/execution/orders/live capital: \`absent\`"
          } >> "$GITHUB_STEP_SUMMARY"
