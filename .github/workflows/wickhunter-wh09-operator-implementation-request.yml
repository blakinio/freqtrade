name: WickHunter WH09 operator preview cleanup

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
      - ".github/wh09-payload/**"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-operator-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  HELPER_BRANCH: ops/wickhunter-wh09-operator-implementation-20260803-v1

jobs:
  cleanup:
    name: Normalize audited operator preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact helper head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact helper scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          expected=(
            ".github/wh09-payload/README.md.zlib.b64"
            ".github/wh09-payload/compose.yaml.zlib.b64"
            ".github/wh09-payload/healthcheck.py.zlib.b64"
            ".github/wh09-payload/operator.py.zlib.b64"
            ".github/wh09-payload/task.md.zlib.b64"
            ".github/wh09-payload/tests.py.zlib.b64"
            ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
          )
          mapfile -t actual < <(git diff --name-only "$merge_base" "$HEAD_SHA" | sort)
          [[ "${#actual[@]}" -eq "${#expected[@]}" ]]
          for index in "${!expected[@]}"; do
            [[ "${actual[$index]}" == "${expected[$index]}" ]]
          done

      - name: Remove legacy and duplicate operator code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/wh09-payload/operator.py.zlib.b64")
          text = path.read_text(encoding="utf-8")

          legacy_start = text.find("\ndef _source_health(value: object) -> SourceHealth:")
          public_start = text.find("\ndef _public_url(")
          if legacy_start < 0 or public_start <= legacy_start:
              raise SystemExit("legacy snapshot boundary mismatch")
          loader = '''

def load_liquid20_snapshot(
    path: Path,
    *,
    now_ms: int,
    maximum_age_ms: int = DEFAULT_MAX_SOURCE_AGE_MS,
) -> Liquid20Snapshot:
    if maximum_age_ms < 1:
        raise CandidatePaperRuntimeOperatorError(
            "maximum Liquid20 age must be positive"
        )
    return _load_liquid20_live_root(
        path,
        now_ms=now_ms,
        maximum_age_ms=maximum_age_ms,
    )

'''
          text = text[:legacy_start] + loader + text[public_start:]

          marker = "\ndef _market_wide_liquidation_intensity("
          starts = []
          offset = 0
          while True:
              index = text.find(marker, offset)
              if index < 0:
                  break
              starts.append(index)
              offset = index + len(marker)
          if len(starts) == 2:
              fetch_start = text.find("\ndef fetch_public_market_snapshot(", starts[1])
              if fetch_start <= starts[1]:
                  raise SystemExit("duplicate metric function boundary mismatch")
              text = text[:starts[1]] + "\n" + text[fetch_start:]
          elif len(starts) != 1:
              raise SystemExit(
                  f"unexpected market-wide intensity definition count: {len(starts)}"
              )

          compile(text, str(path), "exec")
          required = (
              'LIVE_POINTER_NAME = "live-state-v1.json"',
              '"/fapi/v1/ticker/bookTicker"',
              '"atr_ratio"',
              '"market_wide_liquidation_intensity"',
              'def load_liquid20_snapshot(',
          )
          forbidden = (
              "def _source_health(",
              "def _history_from_payload(",
              "if path.is_dir():",
              '"/fapi/v1/ticker/24hr"',
              "--liquid20-snapshot",
          )
          if not all(value in text for value in required):
              raise SystemExit("required root-only operator contract is incomplete")
          if any(value in text for value in forbidden):
              raise SystemExit("legacy operator contract remains")
          if text.count("def _market_wide_liquidation_intensity(") != 1:
              raise SystemExit("market-wide intensity definition is not unique")
          path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile \
            .github/wh09-payload/operator.py.zlib.b64 \
            .github/wh09-payload/healthcheck.py.zlib.b64 \
            .github/wh09-payload/tests.py.zlib.b64
          git diff --check

      - name: Publish normalized preview
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/wh09-payload/operator.py.zlib.b64; then
            echo "Operator preview is already normalized."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/wh09-payload/operator.py.zlib.b64
          git commit -m "fix(wickhunter): remove legacy snapshot fallback"
          git push origin "HEAD:$HELPER_BRANCH"
