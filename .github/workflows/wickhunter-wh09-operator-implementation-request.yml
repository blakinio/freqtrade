name: WickHunter WH09 PAPER operator implementation repair

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
      - ".github/wh09-payload/**"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-operator-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/wickhunter-wh09-paper-runtime-operator-20260803-v1
  TARGET_HEAD_SHA: e0d3b9b9926a95af7a9d1f99ee109b9addc7d700

jobs:
  validate:
    name: Repair and validate real persistent PAPER operator
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact helper request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate bounded helper scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          expected=(
            ".github/wh09-payload/README.md.zlib.b64"
            ".github/wh09-payload/compose.yaml.zlib.b64"
            ".github/wh09-payload/healthcheck.py.zlib.b64"
            ".github/wh09-payload/operator.py.zlib.b64"
            ".github/wh09-payload/task.md.zlib.b64"
            ".github/wh09-payload/tests.py.zlib.b64"
            ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
          )
          mapfile -t actual < <(git diff --name-only "$merge_base" "$HEAD_SHA" | sort)
          printf 'expected helper paths:\n'
          printf '  %s\n' "${expected[@]}"
          printf 'actual helper paths:\n'
          printf '  %s\n' "${actual[@]}"
          [[ "${#actual[@]}" -eq "${#expected[@]}" ]]
          for path in "${expected[@]}"; do
            [[ -f "$path" ]]
          done
          for index in "${!expected[@]}"; do
            [[ "${actual[$index]}" == "${expected[$index]}" ]]
          done

      - name: Check out exact product branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: target

      - name: Synchronize product with current develop
        shell: bash
        run: |
          set -euo pipefail
          cd target
          [[ "$(git rev-parse HEAD)" == "$TARGET_HEAD_SHA" ]]
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin develop
          git merge --no-edit origin/develop

      - name: Materialize SHA-256-bound audited repair
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python3 - <<'PY'
          import base64
          import hashlib
          import subprocess
          import zlib
          from pathlib import Path

          payload_root = Path("../.github/wh09-payload")
          payloads = {
              "operator.py.zlib.b64": (
                  "ai_platform/wickhunter/candidate_paper_runtime_operator.py",
                  "f7baf684825e8a91f3611d5ae7203242c66e00fa3fcd2856f432ee0544d27f41",
              ),
              "README.md.zlib.b64": (
                  "deploy/synology/wickhunter-paper-runtime/README.md",
                  "94ff00497831a5eb852c9c07311e6c83bde849ab15aea4961e72310a571900c2",
              ),
              "compose.yaml.zlib.b64": (
                  "deploy/synology/wickhunter-paper-runtime/compose.yaml",
                  "1367541c0fa05f66fd91f55dcd045f7cc997973bc154f2eff0860b2ab0bd17d8",
              ),
              "healthcheck.py.zlib.b64": (
                  "deploy/synology/wickhunter-paper-runtime/healthcheck.py",
                  "2de5bc8b44fef978318674adfab78c4bb922af7537974ec6af12e422482f44d7",
              ),
              "task.md.zlib.b64": (
                  "docs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md",
                  "d43ffaf8faca8d8bdf4dc6cbbf5ebabec515be4ee1ed6e43539d9d56b89afb6f",
              ),
              "tests.py.zlib.b64": (
                  "tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py",
                  "3507dfe656b70aff5cfbf7b81dd9eb33ef61a8e6040d9d29481fa1288be6b75d",
              ),
          }
          base = subprocess.check_output(
              ["git", "rev-parse", "origin/develop"], text=True
          ).strip()
          for payload_name, (target_name, expected_sha256) in payloads.items():
              encoded = (payload_root / payload_name).read_bytes().strip()
              if hashlib.sha256(encoded).hexdigest() != expected_sha256:
                  raise SystemExit(f"payload hash mismatch: {payload_name}")
              content = zlib.decompress(base64.b64decode(encoded)).decode("utf-8")
              content = content.replace("__BASE_SHA__", base)
              target = Path(target_name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")
          PY
          expected=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndeploy/synology/wickhunter-paper-runtime/README.md\ndeploy/synology/wickhunter-paper-runtime/compose.yaml\ndeploy/synology/wickhunter-paper-runtime/healthcheck.py\ndocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          [[ "$(git diff --name-only | sort)" == "$expected" ]]
          python3 -m py_compile \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false
          working-directory: target

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd target
          uv pip install -r requirements-dev.txt
          uv pip install lightgbm==4.6.0
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Validate format and lint
        shell: bash
        run: |
          set -euo pipefail
          cd target
          paths=(
            ai_platform/wickhunter/candidate_paper_runtime_operator.py
            deploy/synology/wickhunter-paper-runtime/healthcheck.py
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          )
          ruff format "${paths[@]}"
          ruff check "${paths[@]}"
          ruff format --check "${paths[@]}"

      - name: Type-check operator
        shell: bash
        run: |
          set -euo pipefail
          cd target
          mypy ai_platform/wickhunter/candidate_paper_runtime_operator.py

      - name: Run focused operator and runtime tests
        shell: bash
        run: |
          set -euo pipefail
          cd target
          pytest -q \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py \
            tests/ai_platform_integration/test_wickhunter_candidate_runtime_binding.py

      - name: Validate hardened Compose package
        shell: bash
        run: |
          set -euo pipefail
          cd target
          OPERATOR_COMMIT="$TARGET_HEAD_SHA" \
          CANDIDATE_ROOT_HOST=/tmp/candidate \
          ACTIVATION_ROOT_HOST=/tmp/activation \
          JOURNAL_ROOT_HOST=/tmp/journal \
          OPERATOR_STATE_HOST=/tmp/operator \
          LIQUID20_LIVE_HOST=/tmp/liquid20 \
          WICKHUNTER_PAPER_RUNTIME_IMAGE=wickhunter-paper-runtime:"$TARGET_HEAD_SHA" \
            docker compose \
              -f deploy/synology/wickhunter-paper-runtime/compose.yaml \
              config --quiet

      - name: Commit exact repaired product
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git add \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/README.md \
            deploy/synology/wickhunter-paper-runtime/compose.yaml \
            deploy/synology/wickhunter-paper-runtime/healthcheck.py \
            docs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          git commit -m "fix(wickhunter): bind WH09 operator to real live contracts"
          expected=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndeploy/synology/wickhunter-paper-runtime/Dockerfile\ndeploy/synology/wickhunter-paper-runtime/README.md\ndeploy/synology/wickhunter-paper-runtime/compose.yaml\ndeploy/synology/wickhunter-paper-runtime/healthcheck.py\ndocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          [[ "$(git diff --name-only origin/develop...HEAD | sort)" == "$expected" ]]
          product_sha="$(git rev-parse HEAD)"
          docker build \
            --build-arg OPERATOR_COMMIT="$product_sha" \
            --tag "wickhunter-paper-runtime:$product_sha" \
            --file deploy/synology/wickhunter-paper-runtime/Dockerfile \
            .
          image_revision="$(docker image inspect "wickhunter-paper-runtime:$product_sha" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "$image_revision" == "$product_sha" ]]
          git push origin "HEAD:$TARGET_BRANCH"
          {
            echo "## WickHunter WH09 audited operator repair"
            echo
            echo "- Product head: \`$product_sha\`"
            echo "- Synced develop: \`$(git rev-parse origin/develop)\`"
            echo "- Real Liquid20 live contract and canonical metric path: \`PASS\`"
            echo "- Compile, Ruff, mypy, focused pytest, Compose and image build: \`PASS\`"
            echo "- Protected holdout/credentials/order adapter/execution/orders/live capital: \`absent\`"
          } >> "$GITHUB_STEP_SUMMARY"
