name: WickHunter WH09 payload integrity diagnostic

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
      - ".github/wh09-payload/**"

permissions:
  contents: read

concurrency:
  group: wickhunter-wh09-payload-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/wickhunter-wh09-paper-runtime-operator-20260803-v1
  TARGET_HEAD_SHA: 2cbbfef2dd2fd7361b083b409872049a9ae665f8

jobs:
  diagnose:
    name: Diagnose bounded repair payloads
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact helper request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact helper scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          expected=(
            ".github/wh09-payload/README.md.zlib.b64"
            ".github/wh09-payload/compose.yaml.zlib.b64"
            ".github/wh09-payload/healthcheck.py.zlib.b64"
            ".github/wh09-payload/operator.py.zlib.b64"
            ".github/wh09-payload/task.md.zlib.b64"
            ".github/wh09-payload/tests.py.zlib.b64"
            ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
          )
          mapfile -t actual < <(git diff --name-only "$merge_base" "$HEAD_SHA" | sort)
          [[ "${#actual[@]}" -eq "${#expected[@]}" ]]
          for index in "${!expected[@]}"; do
            [[ "${actual[$index]}" == "${expected[$index]}" ]]
          done
          [[ -z "$(git status --porcelain --untracked-files=no)" ]]

      - name: Decode and classify every payload without executing it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import zlib
          from pathlib import Path

          payload_root = Path('.github/wh09-payload')
          failures: list[str] = []
          for path in sorted(payload_root.glob('*.zlib.b64')):
              print(f'--- {path.name} ---')
              encoded = path.read_bytes().strip()
              try:
                  compressed = base64.b64decode(encoded, validate=True)
              except Exception as exc:
                  failures.append(f'{path.name}: base64: {exc}')
                  print(f'base64_error={type(exc).__name__}:{exc}')
                  continue
              transport = 'zlib-wrapper'
              try:
                  decoded = zlib.decompress(compressed)
              except zlib.error as exc:
                  if 'incorrect data check' not in str(exc) or len(compressed) < 7:
                      failures.append(f'{path.name}: zlib: {exc}')
                      print(f'zlib_error={exc}')
                      continue
                  decoded = zlib.decompress(compressed[2:-4], -zlib.MAX_WBITS)
                  transport = 'raw-deflate-recovery'
              print(f'transport={transport}')
              print(f'decoded_bytes={len(decoded)}')
              print(f'decoded_sha256={hashlib.sha256(decoded).hexdigest()}')
              try:
                  text = decoded.decode('utf-8')
              except UnicodeDecodeError as exc:
                  failures.append(f'{path.name}: utf8: {exc}')
                  print(f'utf8_error={exc}')
                  continue
              lines = text.splitlines()
              print(f'line_count={len(lines)}')
              print(f'first_line={lines[0] if lines else "<empty>"}')
              print(f'last_line={lines[-1] if lines else "<empty>"}')
              if path.name.endswith('.py.zlib.b64'):
                  try:
                      compile(text, path.name, 'exec')
                  except SyntaxError as exc:
                      failures.append(f'{path.name}: syntax line {exc.lineno}: {exc.msg}')
                      print(f'syntax_error_line={exc.lineno}')
                      print(f'syntax_error_offset={exc.offset}')
                      print(f'syntax_error_message={exc.msg}')
                      if exc.lineno:
                          start = max(1, exc.lineno - 8)
                          end = min(len(lines), exc.lineno + 8)
                          for number in range(start, end + 1):
                              print(f'context[{number}]={lines[number - 1]!r}')
                  else:
                      print('python_compile=PASS')
          if failures:
              print('payload_diagnostic=FAIL')
              for failure in failures:
                  print(f'failure={failure}')
              raise SystemExit(1)
          print('payload_diagnostic=PASS')
          PY
