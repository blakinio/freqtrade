name: WickHunter WH09 PAPER operator implementation request

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-operator-implementation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  WORKFLOW_PATH: .github/workflows/wickhunter-wh09-operator-implementation-request.yml
  TARGET_BRANCH: feat/wickhunter-wh09-paper-runtime-operator-20260803-v1
  TARGET_BASE_SHA: 0a82a5c93613a213989865bd9128ac7263227148
  PAYLOAD_SOURCE_SHA: e6b0dcae0ca8382821a7be56deeb558c822264d6
  PAYLOAD_SHA256: 45ed151272556b5abe93e423847123098fd2bf42bf3592d3b9ef1a4bcacf5018

jobs:
  apply-and-verify:
    name: Apply and validate persistent PAPER operator
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact helper request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact helper scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" == "$TARGET_BASE_SHA" ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" == "$BASE_SHA" ]]
          expected=$'A\t.github/workflows/wickhunter-wh09-operator-implementation-request.yml'
          actual="$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")"
          [[ "$actual" == "$expected" ]] || {
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          }
          git cat-file -e "$PAYLOAD_SOURCE_SHA^{commit}"

      - name: Check out target feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: target

      - name: Recover and materialize exact implementation payload
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C target rev-parse HEAD)" == "$TARGET_BASE_SHA" ]]
          [[ -z "$(git -C target status --porcelain)" ]]
          git show "$PAYLOAD_SOURCE_SHA:$WORKFLOW_PATH" > "$RUNNER_TEMP/source-helper.yml"
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = (Path(os.environ["RUNNER_TEMP"]) / "source-helper.yml").read_text(
              encoding="utf-8"
          )
          start = "cat > \"$RUNNER_TEMP/wh09-payload.b64\" <<'PAYLOAD'\n"
          end = "\nPAYLOAD\n"
          if source.count(start) != 1:
              raise SystemExit("payload start marker mismatch")
          tail = source.split(start, 1)[1]
          if tail.count(end) != 1:
              raise SystemExit("payload end marker mismatch")
          encoded = tail.split(end, 1)[0]
          (Path(os.environ["RUNNER_TEMP"]) / "wh09-payload.b64").write_text(
              encoded,
              encoding="ascii",
          )
          PY
          base64 --decode "$RUNNER_TEMP/wh09-payload.b64" > "$RUNNER_TEMP/wh09-payload.tar.gz"
          echo "$PAYLOAD_SHA256  $RUNNER_TEMP/wh09-payload.tar.gz" | sha256sum --check --strict
          cd target
          python3 - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          archive = Path(os.environ["RUNNER_TEMP"]) / "wh09-payload.tar.gz"
          expected = {
              "ai_platform/wickhunter/candidate_paper_runtime_operator.py",
              "deploy/synology/wickhunter-paper-runtime/Dockerfile",
              "deploy/synology/wickhunter-paper-runtime/README.md",
              "deploy/synology/wickhunter-paper-runtime/compose.yaml",
              "deploy/synology/wickhunter-paper-runtime/healthcheck.py",
              "docs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md",
              "tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py",
          }
          with tarfile.open(archive, "r:gz") as handle:
              files = {item.name for item in handle.getmembers() if item.isfile()}
              if files != expected:
                  raise SystemExit(f"payload file set mismatch: {sorted(files)}")
              for item in handle.getmembers():
                  path = Path(item.name)
                  if path.is_absolute() or ".." in path.parts or item.issym() or item.islnk():
                      raise SystemExit(f"unsafe payload member: {item.name}")
              handle.extractall(".", filter="data")

          source_path = Path("ai_platform/wickhunter/candidate_paper_runtime_operator.py")
          source = source_path.read_text(encoding="utf-8")
          replacements = (
              ("def load_liquid20_snapshot(\n", "def load_liquid20_snapshot(  # noqa: C901\n"),
              (
                  "        with opener.open(request, timeout=15) as response:\n",
                  "        with opener.open(request, timeout=15) as response:  # noqa: S310\n",
              ),
              (
                  "def fetch_public_market_snapshot(\n",
                  "def fetch_public_market_snapshot(  # noqa: C901\n",
              ),
              ("    def _compose_tick(\n", "    def _compose_tick(  # noqa: C901\n"),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"operator repair anchor mismatch: {old!r}")
              source = source.replace(old, new, 1)
          source_path.write_text(source, encoding="utf-8")

          task = Path(
              "docs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md"
          )
          text = task.read_text(encoding="utf-8")
          old_base = "base_sha: 2f9792455fcd5e5b398b8f8bd88036e1bde62010"
          new_base = "base_sha: 0a82a5c93613a213989865bd9128ac7263227148"
          if text.count(old_base) != 1:
              raise SystemExit("task base anchor mismatch")
          task.write_text(text.replace(old_base, new_base, 1), encoding="utf-8")
          PY
          python3 -m py_compile \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false
          working-directory: target

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd target
          uv pip install -r requirements-dev.txt
          uv pip install lightgbm==4.6.0
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Format and validate implementation
        shell: bash
        run: |
          set -euo pipefail
          cd target
          ruff format \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          ruff check \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          ruff format --check \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          mypy ai_platform/wickhunter/candidate_paper_runtime_operator.py
          pytest -q \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py \
            tests/ai_platform_integration/test_wickhunter_candidate_runtime_binding.py
          OPERATOR_COMMIT="$TARGET_BASE_SHA" \
          CANDIDATE_ROOT_HOST=/tmp/candidate \
          ACTIVATION_ROOT_HOST=/tmp/activation \
          JOURNAL_ROOT_HOST=/tmp/journal \
          OPERATOR_STATE_HOST=/tmp/operator \
          LIQUID20_LIVE_HOST=/tmp/liquid20 \
            docker compose \
              -f deploy/synology/wickhunter-paper-runtime/compose.yaml \
              config --quiet

      - name: Commit validated product change
        shell: bash
        run: |
          set -euo pipefail
          cd target
          expected=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndeploy/synology/wickhunter-paper-runtime/Dockerfile\ndeploy/synology/wickhunter-paper-runtime/README.md\ndeploy/synology/wickhunter-paper-runtime/compose.yaml\ndeploy/synology/wickhunter-paper-runtime/healthcheck.py\ndocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          actual="$(git diff --name-only | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Expected product paths:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime \
            docs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          git commit -m "feat(wickhunter): add persistent WH09 PAPER operator"
          git push origin "HEAD:$TARGET_BRANCH"
          {
            echo "## WickHunter WH09 PAPER operator"
            echo
            echo "- Target branch: \`$TARGET_BRANCH\`"
            echo "- Product paths: \`7\`"
            echo "- Ruff, format, mypy, focused pytest and Compose: \`PASS\`"
            echo "- Protected holdout/credentials/order adapter/execution/orders/live capital: \`absent\`"
          } >> "$GITHUB_STEP_SUMMARY"
