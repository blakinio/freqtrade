name: WickHunter WH09 PAPER operator implementation request

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-operator-implementation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  WORKFLOW_PATH: .github/workflows/wickhunter-wh09-operator-implementation-request.yml
  TARGET_BRANCH: feat/wickhunter-wh09-paper-runtime-operator-20260803-v1
  TARGET_BASE_SHA: 0a82a5c93613a213989865bd9128ac7263227148
  TARGET_HEAD_SHA: ae22c826dc46a7a71a6aa7d9f389b0d92078323c

jobs:
  apply-and-verify:
    name: Validate explicit persistent PAPER operator
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact helper request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact helper scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" == "$TARGET_BASE_SHA" ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" == "$BASE_SHA" ]]
          expected=$'A\t.github/workflows/wickhunter-wh09-operator-implementation-request.yml'
          actual="$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")"
          [[ "$actual" == "$expected" ]] || {
            printf 'Expected helper scope:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          }

      - name: Check out exact product branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: target

      - name: Validate and repair explicit product files
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C target rev-parse HEAD)" == "$TARGET_HEAD_SHA" ]]
          [[ "$(git -C target merge-base "$TARGET_BASE_SHA" HEAD)" == "$TARGET_BASE_SHA" ]]
          [[ -z "$(git -C target status --porcelain)" ]]
          expected=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndeploy/synology/wickhunter-paper-runtime/Dockerfile\ndeploy/synology/wickhunter-paper-runtime/README.md\ndeploy/synology/wickhunter-paper-runtime/compose.yaml\ndeploy/synology/wickhunter-paper-runtime/healthcheck.py\ndocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          actual="$(git -C target diff --name-only "$TARGET_BASE_SHA"...HEAD | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Expected product paths:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          }
          cd target
          python3 - <<'PY'
          import re
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label} anchor count={count}")
              return text.replace(old, new, 1)

          operator_path = Path(
              "ai_platform/wickhunter/candidate_paper_runtime_operator.py"
          )
          operator = operator_path.read_text(encoding="utf-8")
          if "from collections.abc import Mapping\n" not in operator:
              operator = replace_once(
                  operator,
                  "import time\n",
                  "import time\nfrom collections.abc import Mapping\n",
                  "operator Mapping import",
              )
          operator = replace_once(
              operator,
              "environment: dict[str, str] | os._Environ[str] | None = None",
              "environment: Mapping[str, str] | None = None",
              "operator environment type",
          )
          operator_path.write_text(operator, encoding="utf-8")

          test_path = Path(
              "tests/ai_platform_integration/"
              "test_wickhunter_candidate_paper_runtime_operator.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          if "def _rehash_payload(" not in tests:
              helpers = '''def _rehash_payload(payload: dict[str, object]) -> None:
              body = {
                  key: value
                  for key, value in payload.items()
                  if key != "snapshot_sha256"
              }
              payload["snapshot_sha256"] = canonical_sha256(body)


          def _stale_payload(payload: dict[str, object]) -> None:
              payload.clear()
              payload.update(_liquid20_payload(observed_at_ms=NOW_MS - 400_000))


          def _future_event_payload(payload: dict[str, object]) -> None:
              events = cast(list[dict[str, object]], payload["events"])
              events[0]["received_at_ms"] = NOW_MS + 1
              _rehash_payload(payload)


          '''
              tests = replace_once(
                  tests,
                  "def _write_snapshot(",
                  helpers + "def _write_snapshot(",
                  "test helper insertion",
              )
          tests = replace_once(
              tests,
              '        (lambda payload: payload.update({"observed_at_ms": NOW_MS - 400_000}), "stale"),',
              '        (_stale_payload, "stale"),',
              "stale parameter",
          )
          future_pattern = re.compile(
              r'''        \(
                  \s*lambda payload: cast\(list\[dict\[str, object\]\], payload\["events"\]\)\[0\]\.update\(
                  \s*\{"received_at_ms": NOW_MS \+ 1\}
                  \s*\),
                  \s*"unavailable",
                  \s*\),''',
              re.VERBOSE,
          )
          tests, future_count = future_pattern.subn(
              '        (_future_event_payload, "unavailable"),', tests, count=1
          )
          if future_count != 1:
              raise SystemExit(f"future parameter anchor count={future_count}")
          tests = replace_once(
              tests,
              'request.method == "GET"',
              'request.get_method() == "GET"',
              "request method",
          )
          patch_pattern = re.compile(
              r'''    monkeypatch\.setattr\(
                  runtime_operator,
                  \s*"_compose_tick",
                  \s*lambda \*\*_kwargs: cast\(
                  ShadowRuntimeTick, SimpleNamespace\(observed_at_ms=NOW_MS\)
                  \),
                  \)''',
              re.VERBOSE,
          )
          patch_replacement = '''    monkeypatch.setattr(
              CandidatePaperRuntimeOperator,
              "_compose_tick",
              lambda self, **_kwargs: cast(
                  ShadowRuntimeTick,
                  SimpleNamespace(observed_at_ms=NOW_MS),
              ),
          )'''
          tests, patch_count = patch_pattern.subn(
              patch_replacement, tests, count=1
          )
          if patch_count != 1:
              raise SystemExit(f"compose tick monkeypatch anchor count={patch_count}")
          test_path.write_text(tests, encoding="utf-8")

          dockerfile_path = Path(
              "deploy/synology/wickhunter-paper-runtime/Dockerfile"
          )
          dockerfile = dockerfile_path.read_text(encoding="utf-8")
          dockerfile = replace_once(
              dockerfile,
              "    && python - <<'PY'\n",
              "    && OPERATOR_COMMIT=\"$OPERATOR_COMMIT\" python - <<'PY'\n",
              "Dockerfile commit environment",
          )
          dockerfile_path.write_text(dockerfile, encoding="utf-8")
          print("deterministic product repairs applied")
          PY
          python3 -m py_compile \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false
          working-directory: target

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd target
          uv pip install -r requirements-dev.txt
          uv pip install lightgbm==4.6.0
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Format and validate implementation
        shell: bash
        run: |
          set -euo pipefail
          cd target
          ruff format \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          ruff check \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          ruff format --check \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          mypy ai_platform/wickhunter/candidate_paper_runtime_operator.py
          pytest -q \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py \
            tests/ai_platform_integration/test_wickhunter_candidate_runtime_binding.py
          OPERATOR_COMMIT="$TARGET_HEAD_SHA" \
          CANDIDATE_ROOT_HOST=/tmp/candidate \
          ACTIVATION_ROOT_HOST=/tmp/activation \
          JOURNAL_ROOT_HOST=/tmp/journal \
          OPERATOR_STATE_HOST=/tmp/operator \
          LIQUID20_LIVE_HOST=/tmp/liquid20 \
          WICKHUNTER_PAPER_RUNTIME_IMAGE=wickhunter-paper-runtime:"$TARGET_HEAD_SHA" \
            docker compose \
              -f deploy/synology/wickhunter-paper-runtime/compose.yaml \
              config --quiet

      - name: Commit and build validated product
        shell: bash
        run: |
          set -euo pipefail
          cd target
          expected=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndeploy/synology/wickhunter-paper-runtime/Dockerfile\ndeploy/synology/wickhunter-paper-runtime/README.md\ndeploy/synology/wickhunter-paper-runtime/compose.yaml\ndeploy/synology/wickhunter-paper-runtime/healthcheck.py\ndocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          actual="$(git diff --name-only "$TARGET_BASE_SHA"...HEAD | sort)"
          [[ "$actual" == "$expected" ]]
          repair_paths="$(git diff --name-only | sort)"
          allowed_repairs=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndeploy/synology/wickhunter-paper-runtime/Dockerfile\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            grep -Fxq "$path" <<< "$allowed_repairs" || {
              echo "unexpected repair path: $path" >&2
              exit 1
            }
          done <<< "$repair_paths"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [[ -n "$repair_paths" ]]; then
            git add \
              ai_platform/wickhunter/candidate_paper_runtime_operator.py \
              deploy/synology/wickhunter-paper-runtime/Dockerfile \
              tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
            git commit -m "fix(wickhunter): validate persistent PAPER operator"
          fi
          product_sha="$(git rev-parse HEAD)"
          docker build \
            --build-arg OPERATOR_COMMIT="$product_sha" \
            --tag "wickhunter-paper-runtime:$product_sha" \
            --file deploy/synology/wickhunter-paper-runtime/Dockerfile \
            .
          image_revision="$(docker image inspect "wickhunter-paper-runtime:$product_sha" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "$image_revision" == "$product_sha" ]]
          git push origin "HEAD:$TARGET_BRANCH"
          {
            echo "## WickHunter WH09 PAPER operator"
            echo
            echo "- Product head: \`$product_sha\`"
            echo "- Product paths: \`7\`"
            echo "- Ruff, format, mypy, focused pytest, Compose and image build: \`PASS\`"
            echo "- Protected holdout/credentials/order adapter/execution/orders/live capital: \`absent\`"
          } >> "$GITHUB_STEP_SUMMARY"
