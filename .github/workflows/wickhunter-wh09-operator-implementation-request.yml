name: WickHunter WH09 live-contract integration repair

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
      - ".github/wh09-payload/**"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-live-contract-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/wickhunter-wh09-paper-runtime-operator-20260803-v1
  TARGET_HEAD_SHA: 2cbbfef2dd2fd7361b083b409872049a9ae665f8

jobs:
  validate:
    name: Bind operator to real Liquid20 and nine market metrics
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out exact helper request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate bounded helper scope and payload
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          expected=(
            ".github/wh09-payload/README.md.zlib.b64"
            ".github/wh09-payload/compose.yaml.zlib.b64"
            ".github/wh09-payload/healthcheck.py.zlib.b64"
            ".github/wh09-payload/operator.py.zlib.b64"
            ".github/wh09-payload/task.md.zlib.b64"
            ".github/wh09-payload/tests.py.zlib.b64"
            ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"
          )
          mapfile -t actual < <(git diff --name-only "$merge_base" "$HEAD_SHA" | sort)
          [[ "${#actual[@]}" -eq "${#expected[@]}" ]]
          for index in "${!expected[@]}"; do
            [[ "${actual[$index]}" == "${expected[$index]}" ]]
          done
          payload=.github/wh09-payload/operator.py.zlib.b64
          [[ -f "$payload" && ! -L "$payload" && -s "$payload" ]]
          [[ "$(stat -c %s "$payload")" -le 1048576 ]]
          printf 'helper_commit=%s\nrepair_payload_sha256=' "$HEAD_SHA"
          sha256sum "$payload" | cut -d' ' -f1
          [[ -z "$(git status --porcelain --untracked-files=no)" ]]

      - name: Check out exact product branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: target

      - name: Verify exact product head
        shell: bash
        run: |
          set -euo pipefail
          cd target
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$TARGET_HEAD_SHA" ]] || {
            echo "::error title=WH09 product head mismatch::expected=$TARGET_HEAD_SHA actual=$actual"
            exit 1
          }
          git fetch origin develop

      - name: Execute live-contract repair
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          import base64
          import traceback
          import zlib
          from pathlib import Path

          path = Path("../.github/wh09-payload/operator.py.zlib.b64")
          try:
              script = zlib.decompress(base64.b64decode(path.read_bytes().strip())).decode("utf-8")
              exec(compile(script, str(path), "exec"), {"__name__": "__main__"})
          except BaseException as exc:
              print(f"::error title=WH09 repair execution::{type(exc).__name__}: {exc}")
              traceback.print_exc()
              raise
          PY
          git diff --name-status
          expected=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndeploy/synology/wickhunter-paper-runtime/README.md\ndeploy/synology/wickhunter-paper-runtime/compose.yaml\ndocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          actual="$(git diff --name-only | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          }
          python3 -m py_compile \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false
          working-directory: target

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd target
          uv pip install -r requirements-dev.txt
          uv pip install lightgbm==4.6.0
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Validate real contract and canonical metric path
        shell: bash
        run: |
          set -euo pipefail
          cd target
          paths=(
            ai_platform/wickhunter/candidate_paper_runtime_operator.py
            deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          )
          ruff format "${paths[@]}"
          ruff check "${paths[@]}"
          ruff format --check "${paths[@]}"
          mypy \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py
          pytest -q \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_service.py \
            tests/ai_platform_integration/test_wickhunter_candidate_runtime_binding.py
          OPERATOR_COMMIT="$TARGET_HEAD_SHA" \
          CANDIDATE_ROOT_HOST=/tmp/candidate \
          ACTIVATION_ROOT_HOST=/tmp/activation \
          JOURNAL_ROOT_HOST=/tmp/journal \
          OPERATOR_STATE_HOST=/tmp/operator \
          LIQUID20_LIVE_HOST=/tmp/liquid20 \
          WICKHUNTER_PAPER_RUNTIME_IMAGE=wickhunter-paper-runtime:"$TARGET_HEAD_SHA" \
            docker compose -f deploy/synology/wickhunter-paper-runtime/compose.yaml config --quiet

      - name: Commit, build and publish exact integrated product
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git add \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/README.md \
            deploy/synology/wickhunter-paper-runtime/compose.yaml \
            docs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          git commit -m "fix(wickhunter): consume real Liquid20 live contract"
          expected=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndeploy/synology/wickhunter-paper-runtime/Dockerfile\ndeploy/synology/wickhunter-paper-runtime/README.md\ndeploy/synology/wickhunter-paper-runtime/compose.yaml\ndeploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py\ndocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          [[ "$(git diff --name-only origin/develop...HEAD | sort)" == "$expected" ]]
          product_sha="$(git rev-parse HEAD)"
          docker build \
            --build-arg OPERATOR_COMMIT="$product_sha" \
            --tag "wickhunter-paper-runtime:$product_sha" \
            --file deploy/synology/wickhunter-paper-runtime/Dockerfile \
            .
          image_revision="$(docker image inspect "wickhunter-paper-runtime:$product_sha" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "$image_revision" == "$product_sha" ]]
          git push origin "HEAD:$TARGET_BRANCH"
          {
            echo "## WickHunter WH09 real live-contract repair"
            echo
            echo "- Product head: \`$product_sha\`"
            echo "- Exact helper commit and reported payload SHA-256: \`PASS\`"
            echo "- Real Liquid20 pointer and per-source NDJSON contract: \`PASS\`"
            echo "- Canonical nine public market metrics: \`PASS\`"
            echo "- Compile, Ruff, mypy, focused pytest, Compose and exact image build: \`PASS\`"
            echo "- Credentials/order adapter/execution/orders/live capital: \`absent\`"
          } >> "$GITHUB_STEP_SUMMARY"
