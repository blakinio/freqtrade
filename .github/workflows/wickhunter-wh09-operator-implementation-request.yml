name: WickHunter WH09 PAPER operator implementation request

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-operator-implementation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/wickhunter-wh09-paper-runtime-operator-20260803-v1
  TARGET_BASE_SHA: 0a82a5c93613a213989865bd9128ac7263227148
  TARGET_HEAD_SHA: ae22c826dc46a7a71a6aa7d9f389b0d92078323c

jobs:
  apply-and-verify:
    name: Publish exact WH09 Ruff diagnostics
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact helper request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact helper scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" == "$TARGET_BASE_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" == "$BASE_SHA" ]]
          expected=$'A\t.github/workflows/wickhunter-wh09-operator-implementation-request.yml'
          [[ "$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")" == "$expected" ]]

      - name: Check out exact product branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: target

      - name: Validate exact product scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C target rev-parse HEAD)" == "$TARGET_HEAD_SHA" ]]
          [[ "$(git -C target merge-base "$TARGET_BASE_SHA" HEAD)" == "$TARGET_BASE_SHA" ]]
          [[ -z "$(git -C target status --porcelain)" ]]
          expected=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndeploy/synology/wickhunter-paper-runtime/Dockerfile\ndeploy/synology/wickhunter-paper-runtime/README.md\ndeploy/synology/wickhunter-paper-runtime/compose.yaml\ndeploy/synology/wickhunter-paper-runtime/healthcheck.py\ndocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          [[ "$(git -C target diff --name-only "$TARGET_BASE_SHA"...HEAD | sort)" == "$expected" ]]

      - name: Apply deterministic review repairs
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label} anchor mismatch")
              return text.replace(old, new, 1)

          operator_path = Path("ai_platform/wickhunter/candidate_paper_runtime_operator.py")
          operator = operator_path.read_text(encoding="utf-8")
          operator = replace_once(
              operator,
              "import time\nfrom dataclasses import dataclass\n",
              "import time\nfrom collections.abc import Mapping\nfrom dataclasses import dataclass\n",
              "operator Mapping import",
          )
          operator = replace_once(
              operator,
              "environment: dict[str, str] | os._Environ[str] | None = None",
              "environment: Mapping[str, str] | None = None",
              "operator environment type",
          )
          operator_path.write_text(operator, encoding="utf-8")

          test_path = Path(
              "tests/ai_platform_integration/"
              "test_wickhunter_candidate_paper_runtime_operator.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          helpers = "\n".join(
              [
                  "def _rehash_payload(payload: dict[str, object]) -> None:",
                  "    body = {",
                  "        key: value",
                  "        for key, value in payload.items()",
                  '        if key != "snapshot_sha256"',
                  "    }",
                  '    payload["snapshot_sha256"] = canonical_sha256(body)',
                  "",
                  "",
                  "def _stale_payload(payload: dict[str, object]) -> None:",
                  "    payload.clear()",
                  "    payload.update(_liquid20_payload(observed_at_ms=NOW_MS - 400_000))",
                  "",
                  "",
                  "def _future_event_payload(payload: dict[str, object]) -> None:",
                  '    events = cast(list[dict[str, object]], payload["events"])',
                  '    events[0]["received_at_ms"] = NOW_MS + 1',
                  "    _rehash_payload(payload)",
                  "",
                  "",
              ]
          )
          tests = replace_once(
              tests,
              "def _write_snapshot(",
              helpers + "def _write_snapshot(",
              "test helper insertion",
          )
          tests = replace_once(
              tests,
              '        (lambda payload: payload.update({"observed_at_ms": NOW_MS - 400_000}), "stale"),',
              '        (_stale_payload, "stale"),',
              "stale mutation",
          )
          future = "\n".join(
              [
                  "        (",
                  '            lambda payload: cast(list[dict[str, object]], payload["events"])[0].update(',
                  '                {"received_at_ms": NOW_MS + 1}',
                  "            ),",
                  '            "unavailable",',
                  "        ),",
              ]
          )
          tests = replace_once(
              tests,
              future,
              '        (_future_event_payload, "unavailable"),',
              "future mutation",
          )
          tests = replace_once(
              tests,
              'request.method == "GET"',
              'request.get_method() == "GET"',
              "request method",
          )
          old_patch = '    monkeypatch.setattr(runtime_operator, "_compose_tick", lambda **_kwargs: cast(ShadowRuntimeTick, SimpleNamespace(observed_at_ms=NOW_MS)))'
          new_patch = "\n".join(
              [
                  "    monkeypatch.setattr(",
                  "        CandidatePaperRuntimeOperator,",
                  '        "_compose_tick",',
                  "        lambda self, **_kwargs: cast(",
                  "            ShadowRuntimeTick,",
                  "            SimpleNamespace(observed_at_ms=NOW_MS),",
                  "        ),",
                  "    )",
              ]
          )
          tests = replace_once(tests, old_patch, new_patch, "slots monkeypatch")
          test_path.write_text(tests, encoding="utf-8")

          dockerfile_path = Path("deploy/synology/wickhunter-paper-runtime/Dockerfile")
          dockerfile = dockerfile_path.read_text(encoding="utf-8")
          dockerfile = replace_once(
              dockerfile,
              "    && python - <<'PY'\n",
              "    && OPERATOR_COMMIT=\"$OPERATOR_COMMIT\" python - <<'PY'\n",
              "Dockerfile commit environment",
          )
          dockerfile_path.write_text(dockerfile, encoding="utf-8")
          PY
          python3 -m py_compile \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py

      - name: Install uv and dependencies
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false
          working-directory: target

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd target
          uv pip install -r requirements-dev.txt
          uv pip install lightgbm==4.6.0
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Publish formatted files and exact Ruff report
        shell: bash
        run: |
          set -euo pipefail
          cd target
          paths=(
            ai_platform/wickhunter/candidate_paper_runtime_operator.py
            deploy/synology/wickhunter-paper-runtime/healthcheck.py
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          )
          ruff format "${paths[@]}"
          ruff check --fix --exit-zero "${paths[@]}"
          ruff format "${paths[@]}"
          set +e
          {
            echo 'Ruff diagnostic after safe fixes:'
            for path in "${paths[@]}"; do
              echo
              echo "[$path]"
              ruff check --output-format=concise "$path"
            done
          } > "$RUNNER_TEMP/ruff-report.txt" 2>&1
          ruff_status=$?
          set -e
          expected_repairs=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndeploy/synology/wickhunter-paper-runtime/Dockerfile\ndeploy/synology/wickhunter-paper-runtime/healthcheck.py\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          actual_repairs="$(git diff --name-only | sort)"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            grep -Fxq "$path" <<< "$expected_repairs" || {
              echo "unexpected repair path: $path" >&2
              exit 1
            }
          done <<< "$actual_repairs"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/Dockerfile \
            deploy/synology/wickhunter-paper-runtime/healthcheck.py \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          {
            echo 'fix(wickhunter): apply safe validation repairs'
            echo
            cat "$RUNNER_TEMP/ruff-report.txt"
          } > "$RUNNER_TEMP/commit-message.txt"
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          product_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "Product diagnostic head: $product_sha" >> "$GITHUB_STEP_SUMMARY"
          exit "$ruff_status"
