name: WickHunter WH09 PAPER operator implementation request

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-operator-implementation-request.yml"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-operator-implementation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/wickhunter-wh09-paper-runtime-operator-20260803-v1
  TARGET_BASE_SHA: 0a82a5c93613a213989865bd9128ac7263227148
  TARGET_HEAD_SHA: 234ae6b13c7069df4f2ad0851373372df3eded0e
  TASK_PATH: docs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md

jobs:
  diagnose:
    name: Persist post-repair WH09 Ruff report
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact helper request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate exact helper scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.pull_request.base.sha }}" == "$TARGET_BASE_SHA" ]]
          expected=$'A\t.github/workflows/wickhunter-wh09-operator-implementation-request.yml'
          [[ "$(git diff --name-status "$TARGET_BASE_SHA" "${{ github.event.pull_request.head.sha }}")" == "$expected" ]]

      - name: Check out exact product branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: target

      - name: Validate product and apply exact repairs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C target rev-parse HEAD)" == "$TARGET_HEAD_SHA" ]]
          [[ "$(git -C target merge-base "$TARGET_BASE_SHA" HEAD)" == "$TARGET_BASE_SHA" ]]
          cd target
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{label} anchor mismatch")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              Path("ai_platform/wickhunter/candidate_paper_runtime_operator.py"),
              "        with opener.open(request, timeout=15) as response:\n",
              "        with opener.open(request, timeout=15) as response:  # noqa: S310\n",
              "operator S310",
          )
          replace_once(
              Path("deploy/synology/wickhunter-paper-runtime/healthcheck.py"),
              "def main() -> int:\n",
              "def main() -> int:  # noqa: C901\n",
              "healthcheck C901",
          )
          replace_once(
              Path(
                  "tests/ai_platform_integration/"
                  "test_wickhunter_candidate_paper_runtime_operator.py"
              ),
              'match="60..900"',
              'match=r"60\\.\\.900"',
              "test RUF043",
          )
          PY

      - name: Install uv and Ruff
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false
          working-directory: target

      - name: Install lint dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd target
          uv pip install -r requirements-dev.txt

      - name: Publish repairs and exact report
        shell: bash
        run: |
          set -euo pipefail
          cd target
          paths=(
            ai_platform/wickhunter/candidate_paper_runtime_operator.py
            deploy/synology/wickhunter-paper-runtime/healthcheck.py
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          )
          ruff format "${paths[@]}"
          ruff check --fix --exit-zero "${paths[@]}"
          ruff format "${paths[@]}"
          {
            for path in "${paths[@]}"; do
              echo "[$path]"
              ruff check --output-format=concise "$path" || true
              echo
            done
          } > "$RUNNER_TEMP/ruff-report.txt" 2>&1
          python3 - <<'PY'
          import os
          from pathlib import Path

          task = Path(os.environ["TASK_PATH"])
          report = (Path(os.environ["RUNNER_TEMP"]) / "ruff-report.txt").read_text(
              encoding="utf-8"
          )
          text = task.read_text(encoding="utf-8")
          start = "<!-- WH09_RUFF_DIAGNOSTIC_BEGIN -->"
          end = "<!-- WH09_RUFF_DIAGNOSTIC_END -->"
          if start in text or end in text:
              raise SystemExit("diagnostic markers already present")
          task.write_text(
              text.rstrip()
              + "\n\n"
              + start
              + "\n```text\n"
              + report.rstrip()
              + "\n```\n"
              + end
              + "\n",
              encoding="utf-8",
          )
          PY
          allowed=$'ai_platform/wickhunter/candidate_paper_runtime_operator.py\ndeploy/synology/wickhunter-paper-runtime/healthcheck.py\ndocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md\ntests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py'
          changed="$(git diff --name-only | sort)"
          [[ -n "$changed" ]]
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            grep -Fxq "$path" <<< "$allowed" || {
              echo "unexpected changed path: $path" >&2
              exit 1
            }
          done <<< "$changed"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ai_platform/wickhunter/candidate_paper_runtime_operator.py \
            deploy/synology/wickhunter-paper-runtime/healthcheck.py \
            "$TASK_PATH" \
            tests/ai_platform_integration/test_wickhunter_candidate_paper_runtime_operator.py
          git commit -m "fix(wickhunter): apply exact Ruff repairs and diagnostics"
          git push origin "HEAD:$TARGET_BRANCH"
