name: WickHunter WH09 Signal Data Model Diagnostic

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-signal-data-model-diagnostic-20260808.yml"
      - "docs/agents/tasks/active/FTAI-20260808-wickhunter-wh09-signal-data-model-investigation.md"

permissions:
  contents: read

concurrency:
  group: wickhunter-wh09-signal-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TRUSTED_SCIENCE_SHA: 7b23a958fd4d2bb43569c7f693d2247ef43d1ae9
  TASK_PATH: docs/agents/tasks/active/FTAI-20260808-wickhunter-wh09-signal-data-model-investigation.md
  WORKFLOW_PATH: .github/workflows/wickhunter-wh09-signal-data-model-diagnostic-20260808.yml
  DATASET_ROOT: /var/lib/freqtrade-staging-state/wickhunter-production-datasets/wickhunter-wh01-production-dataset-20260731-v3-e02199bfac82-eaccc5ec-8f5be573
  DATASET_MANIFEST_FILE_SHA256: 314ca4cc6d891fb369cce9a3fbbe16fad019a53bd74f9bc5bee0b12539b48b13
  PRICE_ROOT: /var/lib/freqtrade-staging-state/wickhunter-replay-price-path/packages/wickhunter-wh09-replay-price-path-20260808-r1-h900s-7b23a958fd4d
  REPLAY_ROOT: /var/lib/freqtrade-staging-state/wickhunter-deterministic-replay/packages/wickhunter-wh09-deterministic-replay-20260808-r1-h900s-7b23a958fd4d
  REPLAY_MANIFEST_FILE_SHA256: d21b2810e05924fcb9c9d77e20713ceec79fb1ce45537082d5cb5a796284e9e7
  CANDIDATE_ROOT: /var/lib/freqtrade-staging-state/wickhunter-candidate-materialization/packages/wickhunter-wh09-candidate-materialization-20260808-r1-h900s-7b23a958fd4d
  MODEL_ARTIFACT_FILE_SHA256: cda53aa6f689b7a85bf05aef7c2cf9efeaca5aa634162b22af28a6e8d50764a6
  SELECTED_PARAMETERS_FILE_SHA256: 0b80a803b654bdc89f4cdde78df85593e237a9f8a124fdf17258f6c414d204f4
  MODEL_ARTIFACT_SHA256: 0488eaea68a316e3659e3b9e2fcea667eb57de87a22888ce396d112a5c075d2e
  PARAMETER_SHA256: 014b471b9ccc663c3551a151353ae7cd932bd43ed48b9fbf239baad3483e2c11
  FROZEN_NO_TRADE_CONFIDENCE: "0.60"

jobs:
  diagnose:
    name: Diagnose frozen H900 signal confidence
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    timeout-minutes: 45
    steps:
      - name: Check out exact investigation head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate bounded diagnostic authority
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          [[ "$(git merge-base "$TRUSTED_SCIENCE_SHA" "$HEAD_SHA")" == "$TRUSTED_SCIENCE_SHA" ]]
          actual="$(git diff --name-only "$TRUSTED_SCIENCE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n%s\n' "$TASK_PATH" "$WORKFLOW_PATH" | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected investigation scope.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          }
          [[ "$RUNNER_NAME_VALUE" == "freqtrade-synology-staging" ]]
          [[ "$RUNNER_OS_VALUE" == "Linux" && "$RUNNER_ARCH_VALUE" == "X64" ]]
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET \
            HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          do
            [[ -z "${!name:-}" ]] || { echo "forbidden environment present: $name" >&2; exit 1; }
          done
          for path in "$DATASET_ROOT" "$PRICE_ROOT" "$REPLAY_ROOT" "$CANDIDATE_ROOT"; do
            [[ -d "$path" && ! -L "$path" ]]
          done

      - name: Install uv and project dependencies
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v7.2.1
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Run train-validation-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH="$GITHUB_WORKSPACE" python3 - <<'PY'
          import hashlib
          import json
          import math
          import os
          from collections import defaultdict
          from decimal import Decimal
          from pathlib import Path

          import lightgbm as lgb
          import numpy as np

          from ai_platform.research.liquidations.historical.manifests import sha256_file
          from ai_platform.wickhunter.baseline_strategy import EvaluationCase
          from ai_platform.wickhunter.lightgbm_scorer import (
              FEATURE_NAMES,
              LightGBMTrainingPolicy,
              _candidate_examples,
          )
          from ai_platform.wickhunter.parameters import WickHunterParameters
          from ai_platform.wickhunter.production_evaluation import _dataset_row, _label

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise RuntimeError(message)

          def read_object(path: Path) -> dict:
              require(path.is_file() and not path.is_symlink(), f"missing regular file: {path}")
              payload = json.loads(path.read_text(encoding="utf-8"))
              require(isinstance(payload, dict), f"expected JSON object: {path}")
              return payload

          def quantiles(values: np.ndarray) -> dict[str, float]:
              require(values.size > 0, "quantile input is empty")
              return {
                  "min": float(np.min(values)),
                  "p10": float(np.quantile(values, 0.10)),
                  "median": float(np.quantile(values, 0.50)),
                  "p90": float(np.quantile(values, 0.90)),
                  "p95": float(np.quantile(values, 0.95)),
                  "p99": float(np.quantile(values, 0.99)),
                  "max": float(np.max(values)),
              }

          def auc(values: np.ndarray, targets: np.ndarray) -> float | None:
              positive = int(np.sum(targets == 1))
              negative = int(np.sum(targets == 0))
              if positive == 0 or negative == 0:
                  return None
              order = np.argsort(values, kind="mergesort")
              ranks = np.empty(len(values), dtype=float)
              i = 0
              while i < len(order):
                  j = i + 1
                  while j < len(order) and values[order[j]] == values[order[i]]:
                      j += 1
                  average_rank = (i + 1 + j) / 2.0
                  ranks[order[i:j]] = average_rank
                  i = j
              rank_sum = float(np.sum(ranks[targets == 1]))
              return (rank_sum - positive * (positive + 1) / 2.0) / (positive * negative)

          def wilson_lower(positive: int, total: int, z: float = 1.959963984540054) -> float:
              if total <= 0:
                  return 0.0
              p = positive / total
              denom = 1.0 + z * z / total
              center = p + z * z / (2.0 * total)
              spread = z * math.sqrt((p * (1.0 - p) + z * z / (4.0 * total)) / total)
              return max(0.0, (center - spread) / denom)

          def calibrated(raw: float, upper: list[float], probabilities: list[float]) -> float:
              bounded = min(1.0, max(0.0, raw))
              for boundary, probability in zip(upper, probabilities, strict=True):
                  if bounded <= boundary:
                      return probability
              return probabilities[-1]

          dataset_root = Path(os.environ["DATASET_ROOT"])
          dataset_dir = dataset_root / "dataset"
          replay_root = Path(os.environ["REPLAY_ROOT"])
          candidate_root = Path(os.environ["CANDIDATE_ROOT"])
          dataset_manifest_path = dataset_dir / "manifest.json"
          replay_manifest_path = replay_root / "manifest.json"
          model_path = candidate_root / "model-artifact.json"
          parameters_path = candidate_root / "selected-parameters.json"

          require(sha256_file(dataset_manifest_path) == os.environ["DATASET_MANIFEST_FILE_SHA256"], "dataset manifest file identity changed")
          require(sha256_file(replay_manifest_path) == os.environ["REPLAY_MANIFEST_FILE_SHA256"], "replay manifest file identity changed")
          require(sha256_file(model_path) == os.environ["MODEL_ARTIFACT_FILE_SHA256"], "model artifact file identity changed")
          require(sha256_file(parameters_path) == os.environ["SELECTED_PARAMETERS_FILE_SHA256"], "selected parameters file identity changed")

          dataset_manifest = read_object(dataset_manifest_path)
          replay_manifest = read_object(replay_manifest_path)
          model = read_object(model_path)
          parameter_payload = read_object(parameters_path)

          require(replay_manifest.get("manifest_sha256") == "565ba5615ef47bf185b3ef9c20a0235249bf98b9bfe0c1d5d46f455e9d176063", "replay manifest identity mismatch")
          require(model.get("artifact_sha256") == os.environ["MODEL_ARTIFACT_SHA256"], "model artifact identity mismatch")
          require(parameter_payload.get("parameter_sha256") == os.environ["PARAMETER_SHA256"], "parameter identity mismatch")
          require(str(model["training_policy"]["no_trade_confidence"]) == os.environ["FROZEN_NO_TRADE_CONFIDENCE"], "frozen no-trade confidence changed")
          for unsafe_field in ("protected_holdout_accessed", "automatic_promotion_enabled", "execution_enabled", "live_capital_authorized"):
              require(model.get(unsafe_field) is False, f"unsafe model authority: {unsafe_field}")
          require(model.get("orders_submitted") == 0, "model artifact contains orders")

          allowed_splits = {"train", "validation"}
          rows = {}
          dataset_partition_counts = defaultdict(int)
          partitions = dataset_manifest.get("partitions")
          require(isinstance(partitions, list), "dataset partitions missing")
          for partition in partitions:
              require(isinstance(partition, dict), "invalid dataset partition")
              split = partition.get("split_name")
              if split not in allowed_splits:
                  continue
              relative = Path(str(partition["relative_path"]))
              require(not relative.is_absolute() and ".." not in relative.parts, "unsafe dataset partition path")
              path = dataset_dir / relative
              require(path.is_file() and not path.is_symlink(), "dataset partition is not a regular file")
              require(sha256_file(path) == partition.get("sha256"), "dataset partition hash mismatch")
              observed = 0
              with path.open(encoding="utf-8") as handle:
                  for line in handle:
                      require(line.strip() != "", "blank dataset row")
                      payload = json.loads(line)
                      require(isinstance(payload, dict), "dataset row is not an object")
                      row = _dataset_row(payload)
                      require(row.split_name == split, "dataset split binding mismatch")
                      require(row.row_sha256 not in rows, "duplicate dataset row")
                      rows[row.row_sha256] = row
                      observed += 1
              require(observed == partition.get("row_count"), "dataset partition count mismatch")
              dataset_partition_counts[split] += observed

          labels_by_row = defaultdict(list)
          replay_partition_counts = defaultdict(int)
          label_ids = set()
          replay_partitions = replay_manifest.get("partitions")
          require(isinstance(replay_partitions, list), "replay partitions missing")
          for partition in replay_partitions:
              require(isinstance(partition, dict), "invalid replay partition")
              split = partition.get("split_name")
              if split not in allowed_splits:
                  continue
              relative = Path(str(partition["relative_path"]))
              require(not relative.is_absolute() and ".." not in relative.parts, "unsafe replay partition path")
              path = replay_root / relative
              require(path.is_file() and not path.is_symlink(), "replay partition is not a regular file")
              require(sha256_file(path) == partition.get("sha256"), "replay partition hash mismatch")
              observed = 0
              with path.open(encoding="utf-8") as handle:
                  for line in handle:
                      require(line.strip() != "", "blank replay label")
                      payload = json.loads(line)
                      require(isinstance(payload, dict), "replay label is not an object")
                      label = _label(payload)
                      require(label.split_name == split, "replay split binding mismatch")
                      require(label.label_id not in label_ids, "duplicate replay label")
                      label_ids.add(label.label_id)
                      labels_by_row[label.dataset_row_sha256].append(label)
                      observed += 1
              require(observed == partition.get("row_count"), "replay partition count mismatch")
              replay_partition_counts[split] += observed

          cases = []
          for row_sha, labels in labels_by_row.items():
              require(row_sha in rows, "replay label references non-loaded train/validation row")
              ordered_labels = tuple(sorted(labels, key=lambda item: item.side.value))
              cases.append(EvaluationCase(dataset_row_sha256=row_sha, split_name=rows[row_sha].split_name, feature=rows[row_sha].feature, labels=ordered_labels))
          cases = tuple(sorted(cases, key=lambda item: item.case_sha256))
          require({case.split_name for case in cases} == allowed_splits, "diagnostic split boundary changed")
          require(sum(case.split_name == "train" for case in cases) == 565, "train case count changed")
          require(sum(case.split_name == "validation" for case in cases) == 178, "validation case count changed")

          decimal_fields = {
              "liquidation_percentile", "liquidation_zscore", "minimum_quote_volume_usd",
              "long_vwap_distance_ratio", "short_vwap_distance_ratio", "minimum_wick_ratio",
              "minimum_volatility", "maximum_volatility", "base_risk_ratio", "leverage",
              "dca_spacing_ratio", "dca_total_risk_ratio", "take_profit_ratio", "stop_loss_ratio",
              "minimum_confidence", "minimum_risk_multiplier", "maximum_risk_multiplier",
          }
          parameter_values = {key: value for key, value in parameter_payload.items() if key != "parameter_sha256"}
          for key in decimal_fields:
              parameter_values[key] = Decimal(str(parameter_values[key]))
          parameters = WickHunterParameters(**parameter_values)
          require(parameters.parameter_hash == os.environ["PARAMETER_SHA256"], "reconstructed parameter hash mismatch")

          policy_payload = model["training_policy"]
          policy = LightGBMTrainingPolicy(
              policy_version=str(policy_payload["policy_version"]),
              training_splits=("train",),
              calibration_splits=("validation",),
              validation_splits=("test",),
              forbidden_splits=("holdout", "protected_holdout"),
              seed=int(policy_payload["seed"]),
              num_boost_round=int(policy_payload["num_boost_round"]),
              num_leaves=int(policy_payload["num_leaves"]),
              min_data_in_leaf=int(policy_payload["min_data_in_leaf"]),
              learning_rate=Decimal(str(policy_payload["learning_rate"])),
              calibration_bins=int(policy_payload["calibration_bins"]),
              no_trade_confidence=Decimal(str(policy_payload["no_trade_confidence"])),
          )
          require(policy.no_trade_confidence == Decimal("0.60"), "policy threshold changed")

          train_cases = tuple(case for case in cases if case.split_name == "train")
          validation_cases = tuple(case for case in cases if case.split_name == "validation")
          train_examples = _candidate_examples(train_cases, parameters=parameters, policy=policy)
          validation_examples = _candidate_examples(validation_cases, parameters=parameters, policy=policy)
          require(len(train_examples) == 348, "train example count does not reproduce model artifact")
          require(len(validation_examples) == 87, "validation/calibration example count does not reproduce model artifact")
          require(sum(example.target for example in train_examples) == 18, "train positive count does not reproduce model artifact")

          booster = lgb.Booster(model_str=str(model["model_text"]))
          model_hash = hashlib.sha256(str(model["model_text"]).encode("utf-8")).hexdigest()
          require(model_hash == model["model_hash"], "model text hash mismatch")
          upper = [float(item) for item in model["calibration"]["upper_bounds"]]
          persisted_probability = [float(item) for item in model["calibration"]["probabilities"]]
          require(max(persisted_probability) < 0.60, "persisted calibration unexpectedly reaches frozen threshold")

          def matrices(examples):
              matrix = np.asarray([[float(value) for value in example.feature_values] for example in examples], dtype=np.float64)
              targets = np.asarray([example.target for example in examples], dtype=np.int32)
              raw = np.asarray(booster.predict(matrix, num_iteration=booster.current_iteration()), dtype=np.float64)
              cal = np.asarray([calibrated(float(value), upper, persisted_probability) for value in raw], dtype=np.float64)
              return matrix, targets, raw, cal

          train_matrix, train_targets, train_raw, train_cal = matrices(train_examples)
          val_matrix, val_targets, val_raw, val_cal = matrices(validation_examples)

          def split_summary(targets, raw, cal):
              positives = int(np.sum(targets))
              total = int(len(targets))
              return {
                  "support": total,
                  "positives": positives,
                  "positive_rate": positives / total,
                  "laplace_rate": (positives + 1) / (total + 2),
                  "raw_probability": quantiles(raw),
                  "calibrated_probability": quantiles(cal),
                  "raw_auc": auc(raw, targets),
                  "raw_at_or_above_0_60": int(np.sum(raw >= 0.60)),
                  "calibrated_at_or_above_0_60": int(np.sum(cal >= 0.60)),
              }

          bins = []
          for index in range(10):
              mask = np.asarray([min(9, int(min(1.0, max(0.0, float(value))) * 10)) == index for value in val_raw])
              count = int(np.sum(mask))
              positives = int(np.sum(val_targets[mask])) if count else 0
              bins.append({
                  "bin": index,
                  "raw_lower": index / 10,
                  "raw_upper": (index + 1) / 10,
                  "support": count,
                  "positives": positives,
                  "empirical_rate": None if count == 0 else positives / count,
                  "laplace_rate": None if count == 0 else (positives + 1) / (count + 2),
                  "wilson_lower_95": None if count == 0 else wilson_lower(positives, count),
                  "persisted_calibrated_probability": persisted_probability[index],
              })

          ranked = np.argsort(-val_raw, kind="mergesort")
          top_support = []
          for support in (10, 20, 30, 50):
              if len(ranked) < support:
                  continue
              selected = ranked[:support]
              positives = int(np.sum(val_targets[selected]))
              top_support.append({
                  "support": support,
                  "minimum_raw_probability": float(np.min(val_raw[selected])),
                  "positives": positives,
                  "empirical_rate": positives / support,
                  "laplace_rate": (positives + 1) / (support + 2),
                  "wilson_lower_95": wilson_lower(positives, support),
              })

          features = []
          split_importance = booster.feature_importance(importance_type="split")
          gain_importance = booster.feature_importance(importance_type="gain")
          for index, name in enumerate(FEATURE_NAMES):
              train_auc = auc(train_matrix[:, index], train_targets)
              validation_auc = auc(val_matrix[:, index], val_targets)
              if train_auc is None or validation_auc is None:
                  stable = False
                  direction_agrees = False
              else:
                  train_direction = 1 if train_auc >= 0.5 else -1
                  validation_direction = 1 if validation_auc >= 0.5 else -1
                  direction_agrees = train_direction == validation_direction
                  stable = direction_agrees and min(max(train_auc, 1 - train_auc), max(validation_auc, 1 - validation_auc)) >= 0.60
              features.append({
                  "name": name,
                  "train_auc": train_auc,
                  "validation_auc": validation_auc,
                  "direction_agrees": direction_agrees,
                  "stable_univariate_separation_ge_0_60": stable,
                  "model_split_importance": int(split_importance[index]),
                  "model_gain_importance": float(gain_importance[index]),
              })

          max_bin_laplace_ge10 = max((item["laplace_rate"] for item in bins if item["support"] >= 10 and item["laplace_rate"] is not None), default=None)
          max_top_laplace = max((item["laplace_rate"] for item in top_support), default=None)
          max_top_wilson = max((item["wilson_lower_95"] for item in top_support), default=None)

          report = {
              "schema_version": "wickhunter-wh09-signal-data-model-diagnostic-v1",
              "source_commit_sha": os.environ["TRUSTED_SCIENCE_SHA"],
              "model_artifact_sha256": os.environ["MODEL_ARTIFACT_SHA256"],
              "parameter_sha256": os.environ["PARAMETER_SHA256"],
              "frozen_no_trade_confidence": os.environ["FROZEN_NO_TRADE_CONFIDENCE"],
              "analysis_splits": ["train", "validation"],
              "test_partition_files_opened": 0,
              "protected_holdout_accessed": False,
              "test_used_for_selection": False,
              "candidate_materialized": False,
              "model_retrained": False,
              "automatic_promotion_enabled": False,
              "execution_enabled": False,
              "orders_submitted": 0,
              "live_capital_authorized": False,
              "dataset_partition_counts_loaded": dict(sorted(dataset_partition_counts.items())),
              "replay_label_counts_loaded": dict(sorted(replay_partition_counts.items())),
              "train": split_summary(train_targets, train_raw, train_cal),
              "validation": split_summary(val_targets, val_raw, val_cal),
              "calibration_bins_validation": bins,
              "top_validation_raw_score_regions": top_support,
              "persisted_calibration_max": max(persisted_probability),
              "max_validation_bin_laplace_support_ge_10": max_bin_laplace_ge10,
              "max_top_validation_laplace": max_top_laplace,
              "max_top_validation_wilson_lower_95": max_top_wilson,
              "feature_diagnostics": features,
          }
          report["report_sha256"] = hashlib.sha256(json.dumps(report, sort_keys=True, separators=(",", ":")).encode("utf-8")).hexdigest()
          output = Path(os.environ["RUNNER_TEMP"]) / "wickhunter-wh09-signal-data-model-diagnostic.json"
          output.write_text(json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "report_sha256": report["report_sha256"],
              "train_positive_rate": report["train"]["positive_rate"],
              "validation_positive_rate": report["validation"]["positive_rate"],
              "train_raw_auc": report["train"]["raw_auc"],
              "validation_raw_auc": report["validation"]["raw_auc"],
              "persisted_calibration_max": report["persisted_calibration_max"],
              "max_validation_bin_laplace_support_ge_10": report["max_validation_bin_laplace_support_ge_10"],
              "max_top_validation_laplace": report["max_top_validation_laplace"],
              "max_top_validation_wilson_lower_95": report["max_top_validation_wilson_lower_95"],
              "stable_feature_count": sum(item["stable_univariate_separation_ge_0_60"] for item in features),
          }, sort_keys=True))
          PY

      - name: Upload bounded diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wickhunter-wh09-signal-data-model-diagnostic-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/wickhunter-wh09-signal-data-model-diagnostic.json
          if-no-files-found: error
          retention-days: 30
