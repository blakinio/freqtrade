name: WickHunter WH09 v12 task checkpoint executor

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-v12-task-checkpoint-executor-20260805.yml"

permissions:
  contents: write

concurrency:
  group: wickhunter-wh09-v12-task-checkpoint-executor-selfhosted
  cancel-in-progress: true

env:
  EXPECTED_BASE_SHA: 108eff8149f3c5dba77bfcdeaea0c63c8a22b551
  PRODUCT_BRANCH: docs/wickhunter-wh09-v12-deployment-checkpoint-20260805
  PRODUCT_PLACEHOLDER: .github/wh09-v12-task-update-request.txt
  TASK_PATH: docs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md

jobs:
  checkpoint:
    name: Publish canonical v12 checkpoint
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v11.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate helper and publish task-only checkpoint
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" == "$BASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          [[ "$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")" == $'A\t.github/workflows/wickhunter-wh09-v12-task-checkpoint-executor-20260805.yml' ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "$PRODUCT_BRANCH"
          git switch --force-create "$PRODUCT_BRANCH" "origin/$PRODUCT_BRANCH"
          [[ "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git diff --name-status "$EXPECTED_BASE_SHA" HEAD)" == $'A\t.github/wh09-v12-task-update-request.txt' ]]
          python3 - "$TASK_PATH" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          replacements = {
              "status: implementing": "status: waiting",
              "base_sha: c33648acfd86a0352836498103857b601b5f486f": "base_sha: 108eff8149f3c5dba77bfcdeaea0c63c8a22b551",
              "branch: fix/wickhunter-wh09-candidate-authorization-boundary-20260805-v1": "branch: docs/wickhunter-wh09-v12-deployment-checkpoint-20260805",
              "product_pr: pending": "product_pr: 1263",
              "validated_implementation_head: 5d02cf6350126438cd9c7217dbf24bcab05828e8": "validated_implementation_head: 108eff8149f3c5dba77bfcdeaea0c63c8a22b551",
              "completion_claim: partial_producer": "completion_claim: deployed_waiting_prospective_acceptance",
              "next_action: validate and merge the candidate-authorization producer-boundary repair, then deploy a fresh v12 PAPER activation and begin the prospective acceptance window": "next_action: keep v12 PAPER runtime active through 2026-08-06T17:45:07.561Z, then collect and independently verify the complete WH-09 acceptance package",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"canonical field mismatch: {old}")
              text = text.replace(old, new)
          metadata = """checkpoint_pr: 1276
          repair_merge_sha: 108eff8149f3c5dba77bfcdeaea0c63c8a22b551
          deployment_pr: 1274
          deployment_run: 31024416013
          deployment_artifact: 8939021431
          activation_name: wickhunter-wh09-activation-20260805-v12-108eff81
          runtime_run_id: b895197c49550bd57a50fed93dda4ebbc5938839c17302ad086cce5fa4fedf14
          runtime_binding_id: 79ed4f7a3d211704d95b0304b633ba96512e44f4dedaa6ebaf37732397160702
          prospective_window_start_ms: 1785948307561
          prospective_window_end_ms: 1786038307561
          """
          text = text.replace("product_pr: 1263\n", "product_pr: 1263\n" + metadata, 1)
          recovery = """## Recovery checkpoint

          ```yaml
          recovery:
            policy_version: 1
            generation: 5
            session_id: wickhunter-wh09-20260805T1852+0200
            session_started_at: 2026-08-05T18:52:00+02:00
            checkpointed_at: 2026-08-05T18:52:00+02:00
            last_progress_at: 2026-08-05T18:52:00+02:00
            phase: prospective PAPER acceptance observation
            exact_head: 108eff8149f3c5dba77bfcdeaea0c63c8a22b551
            pull_request: 1276
            active_operation: persistent v12 PAPER observation window
            external_run_ids: [31024416013]
            operation_started_at: 2026-08-05T16:45:07.561Z
            wait_deadline_at: 2026-08-06T17:45:07.561Z
            check_generation: wh09-v12-b895197c-prospective-window
            checks_used: 0
            status: waiting
            safe_to_resume: true
            resume_condition: window end has passed and the exact v12 runtime remains available for immutable acceptance collection
            next_action: Collect and independently verify every WH-09 terminal criterion; keep the explicit owner decision separate.
          ```
          """
          recovery = "\n".join(line[10:] if line.startswith("          ") else line for line in recovery.splitlines()) + "\n"
          text, count = re.subn(r"## Recovery checkpoint\n\n```yaml\n.*?\n```\n", recovery, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("recovery checkpoint mismatch")
          marker = "## v12 trusted deployment and restart checkpoint"
          if marker in text:
              raise SystemExit("checkpoint already present")
          section = """

          ## v12 trusted deployment and restart checkpoint

          The candidate-authorization producer-boundary repair passed exact-head CI and merged
          through PR #1263 as `108eff8149f3c5dba77bfcdeaea0c63c8a22b551`. Trusted Synology
          deployment run `31024416013` from request-only PR #1274 then published fresh activation
          `wickhunter-wh09-activation-20260805-v12-108eff81`, run
          `b895197c49550bd57a50fed93dda4ebbc5938839c17302ad086cce5fa4fedf14` and binding
          `79ed4f7a3d211704d95b0304b633ba96512e44f4dedaa6ebaf37732397160702`.

          Evidence artifact `8939021431` (`wickhunter-wh09-deployment-1274`, digest
          `sha256:9172054434130e924727c1cacdcf6faa0f1968a4043976b1470a7fb6369131d9`)
          proves healthy self-hashed generation 1, a real operator restart, healthy generation 2
          with unchanged identities and exact implementation, and successful post-restart egress
          revalidation. Only the exact Binance Futures TLS path was reachable; nonallowlisted DNS
          and direct external egress remained blocked. Model/data drift were healthy and the circuit
          breaker was inactive at this checkpoint.

          The prospective window is `2026-08-05T16:45:07.561Z..2026-08-06T17:45:07.561Z`.
          Protected holdout, automatic promotion, credentials, order adapter, execution and live
          capital remain disabled, with `orders_submitted=0`. WH-09 and Issue #1144 remain open until
          all duration, snapshot/gap/freshness, decision/risk/parity, exercise, drawdown, consumer,
          immutable-evidence and independent-verification criteria pass and a separate owner decision
          is recorded.
          """
          section = "\n".join(line[10:] if line.startswith("          ") else line for line in section.splitlines())
          path.write_text(text.rstrip() + section + "\n", encoding="utf-8")
          PY
          rm "$PRODUCT_PLACEHOLDER"
          git add "$TASK_PATH" "$PRODUCT_PLACEHOLDER"
          [[ "$(git diff --cached --name-status "$EXPECTED_BASE_SHA")" == $'M\tdocs/agents/tasks/FTAI-20260803-wickhunter-wh09-paper-runtime-operator-v1.md' ]]
          git commit -m "docs(wickhunter): record WH09 v12 deployment checkpoint"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
