name: WickHunter WH09 v13 bounded PAPER preflight r2

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-v13-preflight-r2-20260807.yml"

permissions:
  contents: read

concurrency:
  group: wickhunter-wh09-v13-preflight-r2-20260807
  cancel-in-progress: false

env:
  WORKFLOW_PATH: .github/workflows/wickhunter-wh09-v13-preflight-r2-20260807.yml
  EXPECTED_BASE_SHA: 603b6502649e1213cfb3bdf20ce912d6c8640a7e
  IMPLEMENTATION_SHA: 2525419f5023dbc9bc05fbdff5b3b29917c40eea
  EXPECTED_OPERATOR_IMAGE_ID: sha256:5a06fd44864fe0078338bb21ae7d07d94ef93e60a70a212356a641d4083ba86a
  CANDIDATE_PACKAGE_NAME: wickhunter-candidate-materialization-20260803-v2-626087ca45d6
  ACTIVATION_NAME: wickhunter-wh09-v13-preflight-r2-20260807-2525419f
  BOT_INSTANCE: wickhunter-paper-v13-preflight-r2
  RUNNER_STATE_ROOT: /var/lib/freqtrade-staging-state
  HOST_STATE_ROOT: /volume1/docker/freqtrade/state
  LIQUID20_LIVE_HOST: /volume1/docker/freqtrade-liquidations/data/live
  OPERATOR_IMAGE: local/wickhunter-paper-runtime:sha-2525419f5023dbc9bc05fbdff5b3b29917c40eea
  OPERATOR_CONTAINER: wickhunter-paper-runtime-v13-preflight-r2

jobs:
  preflight:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    timeout-minutes: 45
    steps:
      - name: Prove exact trusted request
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUNNER_NAME_VALUE" == "freqtrade-synology-staging" ]]
          [[ "$RUNNER_OS_VALUE" == "Linux" && "$RUNNER_ARCH_VALUE" == "X64" ]]
          docker version >/dev/null
          test -S /var/run/docker.sock

      - name: Check out exact request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v11.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate one-file scope and closed authority
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" == "$BASE_SHA" ]]
          git merge-base --is-ancestor "$IMPLEMENTATION_SHA" "$BASE_SHA"
          [[ "$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")" == $'A\t.github/workflows/wickhunter-wh09-v13-preflight-r2-20260807.yml' ]]
          for name in OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy; do
            [[ -z "${!name:-}" ]] || { echo "forbidden credential/proxy environment: $name" >&2; exit 1; }
          done
          collector_data_source="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Source}}{{end}}{{end}}' liquid20-live)"
          [[ "$collector_data_source" == "/volume1/docker/freqtrade-liquidations/data" ]]
          [[ "$LIQUID20_LIVE_HOST" == "$collector_data_source/live" ]]

      - name: Reuse or build exact supervisor image
        shell: bash
        run: |
          set -euo pipefail
          current_id="$(docker image inspect --format '{{.Id}}' "$OPERATOR_IMAGE" 2>/dev/null || true)"
          current_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$OPERATOR_IMAGE" 2>/dev/null || true)"
          current_entrypoint="$(docker image inspect --format '{{json .Config.Entrypoint}}' "$OPERATOR_IMAGE" 2>/dev/null || true)"
          if [[ "$current_id" == "$EXPECTED_OPERATOR_IMAGE_ID" && "$current_revision" == "$IMPLEMENTATION_SHA" && "$current_entrypoint" == '["python","-m","ai_platform.wickhunter.candidate_paper_runtime_supervisor"]' ]]; then
            echo "Reusing exact image $current_id"
          else
            root="$RUNNER_TEMP/wickhunter-wh09-v13-r2-implementation"
            rm -rf "$root"
            git worktree add --detach "$root" "$IMPLEMENTATION_SHA"
            trap 'git worktree remove --force "$root" >/dev/null 2>&1 || true' EXIT
            docker build --pull \
              --file "$root/deploy/synology/wickhunter-paper-runtime/Dockerfile" \
              --build-arg "OPERATOR_COMMIT=$IMPLEMENTATION_SHA" \
              --label "org.opencontainers.image.revision=$IMPLEMENTATION_SHA" \
              --tag "$OPERATOR_IMAGE" "$root"
          fi
          actual_id="$(docker image inspect --format '{{.Id}}' "$OPERATOR_IMAGE")"
          actual_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$OPERATOR_IMAGE")"
          actual_entrypoint="$(docker image inspect --format '{{json .Config.Entrypoint}}' "$OPERATOR_IMAGE")"
          [[ "$actual_revision" == "$IMPLEMENTATION_SHA" ]]
          [[ "$actual_entrypoint" == '["python","-m","ai_platform.wickhunter.candidate_paper_runtime_supervisor"]' ]]
          printf '%s\n' "$actual_id" | tee "$RUNNER_TEMP/wickhunter-wh09-v13-preflight-r2-image-id.txt"

      - name: Create fresh policy-valid temporary PAPER activation
        shell: bash
        run: |
          set -euo pipefail
          umask 027
          candidate_runner="$RUNNER_STATE_ROOT/wickhunter-candidate-materialization/packages/$CANDIDATE_PACKAGE_NAME"
          candidate_host="$HOST_STATE_ROOT/wickhunter-candidate-materialization/packages/$CANDIDATE_PACKAGE_NAME"
          state_runner="$RUNNER_STATE_ROOT/wickhunter-paper-runtime/v13-preflight-r2-20260807"
          state_host="$HOST_STATE_ROOT/wickhunter-paper-runtime/v13-preflight-r2-20260807"
          activation_runner="$state_runner/activations/$ACTIVATION_NAME"
          journal_runner="$state_runner/journals/$ACTIVATION_NAME"
          operator_runner="$state_runner/operator/$ACTIVATION_NAME"
          [[ -d "$candidate_runner" && ! -L "$candidate_runner" ]]
          [[ ! -e "$activation_runner" && ! -L "$activation_runner" ]]
          [[ ! -e "$journal_runner" && ! -L "$journal_runner" ]]
          [[ ! -e "$operator_runner" && ! -L "$operator_runner" ]]
          install -d -m 0750 -o 65532 -g 65532 "$state_runner" "$state_runner/activations" "$state_runner/journals" "$state_runner/operator" "$operator_runner"
          docker run --rm --interactive --user 65532:65532 --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=bind,src=$candidate_host,dst=/runtime/candidate,readonly" \
            --mount "type=bind,src=$state_host,dst=/runtime/state" \
            --env ACTIVATION_NAME --env BOT_INSTANCE \
            --entrypoint python "$OPERATOR_IMAGE" - <<'PY' | tee "$RUNNER_TEMP/wickhunter-wh09-v13-preflight-r2-activation.json"
          import json, os, time
          from pathlib import Path
          from ai_platform.wickhunter.candidate_activation import activate_verified_candidate
          from ai_platform.wickhunter.candidate_paper_runtime_operator import _runtime_policy
          from ai_platform.wickhunter.candidate_paper_runtime_service import CandidatePaperRuntimeService
          from ai_platform.wickhunter.candidate_runtime_binding import build_candidate_paper_runtime_binding
          root = Path('/runtime/state')
          activation = root / 'activations' / os.environ['ACTIVATION_NAME']
          journal = root / 'journals' / os.environ['ACTIVATION_NAME']
          activate_verified_candidate(
              candidate_root=Path('/runtime/candidate'), activation_root=activation,
              created_at_ms=time.time_ns() // 1_000_000,
              bot_instance=os.environ['BOT_INSTANCE'], wh08_consumer_version='wickhunter-portal-consumer-v1',
              window_duration_ms=90_000_000,
          )
          binding = build_candidate_paper_runtime_binding(candidate_root=Path('/runtime/candidate'), activation_root=activation)
          service = CandidatePaperRuntimeService(binding=binding, runtime_policy=_runtime_policy(), journal_root=journal)
          if service.journal.latest_state() is not None:
              raise SystemExit('fresh preflight r2 journal is not empty')
          print(json.dumps({'status':'fresh_v13_preflight_r2_activation','run_id':binding.request.run_id,'binding_id':binding.binding_id,'window_start_ms':binding.request.window_start_ms,'window_end_ms':binding.request.window_end_ms,'protected_holdout_accessed':False,'automatic_promotion_enabled':False,'trading_credentials_present':False,'order_adapter_present':False,'execution_enabled':False,'orders_submitted':0,'live_capital_authorized':False}, sort_keys=True))
          PY
          find "$activation_runner" -type d -exec chmod 0550 {} +
          find "$activation_runner" -type f -exec chmod 0440 {} +
          find "$journal_runner" -type d -exec chmod 0750 {} +
          find "$journal_runner" -type f -exec chmod 0640 {} +
          chown -R 65532:65532 "$journal_runner" "$operator_runner"

      - name: Run exact five-cycle burn-in and verify evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate_host="$HOST_STATE_ROOT/wickhunter-candidate-materialization/packages/$CANDIDATE_PACKAGE_NAME"
          state_runner="$RUNNER_STATE_ROOT/wickhunter-paper-runtime/v13-preflight-r2-20260807"
          state_host="$HOST_STATE_ROOT/wickhunter-paper-runtime/v13-preflight-r2-20260807"
          activation_host="$state_host/activations/$ACTIVATION_NAME"
          journal_host="$state_host/journals/$ACTIVATION_NAME"
          operator_host="$state_host/operator/$ACTIVATION_NAME"
          operator_runner="$state_runner/operator/$ACTIVATION_NAME"
          cleanup() { docker rm -f "$OPERATOR_CONTAINER" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ! docker container inspect "$OPERATOR_CONTAINER" >/dev/null 2>&1
          docker run --name "$OPERATOR_CONTAINER" --user 65532:65532 --group-add 0 --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true --memory 2g --network bridge \
            --env "OPERATOR_COMMIT=$IMPLEMENTATION_SHA" --env HEALTH_PATH=/runtime/operator/health.json --env HEALTH_MAX_AGE_SECONDS=1200 \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= --env http_proxy= --env https_proxy= --env all_proxy= \
            --mount "type=bind,src=$candidate_host,dst=/runtime/candidate,readonly" \
            --mount "type=bind,src=$activation_host,dst=/runtime/activation,readonly" \
            --mount "type=bind,src=$LIQUID20_LIVE_HOST,dst=/runtime/liquid20,readonly" \
            --mount "type=bind,src=$journal_host,dst=/runtime/journal" \
            --mount "type=bind,src=$operator_host,dst=/runtime/operator" \
            "$OPERATOR_IMAGE" --candidate-root /runtime/candidate --activation-root /runtime/activation --journal-root /runtime/journal --liquid20-root /runtime/liquid20 --health-root /runtime/operator \
            --operator-commit "$IMPLEMENTATION_SHA" --public-market-base-url https://fapi.binance.com --poll-seconds 120 --maximum-source-age-ms 300000 --model-drift healthy --data-drift healthy --circuit-breaker-active false --cycles 5
          [[ "$(docker inspect --format '{{.State.ExitCode}}' "$OPERATOR_CONTAINER")" == "0" ]]
          docker run --rm --user 65532:65532 --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=bind,src=$candidate_host,dst=/runtime/candidate,readonly" --mount "type=bind,src=$activation_host,dst=/runtime/activation,readonly" \
            --mount "type=bind,src=$journal_host,dst=/runtime/journal,readonly" --mount "type=bind,src=$operator_host,dst=/runtime/operator,readonly" \
            --env "OPERATOR_COMMIT=$IMPLEMENTATION_SHA" --entrypoint python "$OPERATOR_IMAGE" - <<'PY' | tee "$RUNNER_TEMP/wickhunter-wh09-v13-preflight-r2-verification.json"
          import json, os
          from decimal import Decimal
          from pathlib import Path
          from ai_platform.wickhunter.candidate_paper_runtime_operator import _runtime_policy
          from ai_platform.wickhunter.candidate_paper_runtime_service import CandidatePaperRuntimeJournal
          from ai_platform.wickhunter.candidate_paper_runtime_supervisor import CycleTelemetryStore
          from ai_platform.wickhunter.candidate_runtime_binding import build_candidate_paper_runtime_binding
          binding = build_candidate_paper_runtime_binding(candidate_root=Path('/runtime/candidate'), activation_root=Path('/runtime/activation'))
          journal = CandidatePaperRuntimeJournal(Path('/runtime/journal'), binding, _runtime_policy())
          observations = journal.observations()
          if len(observations) != 5: raise SystemExit(f'expected 5 observations, got {len(observations)}')
          gaps=[b.observed_at_ms-a.observed_at_ms for a,b in zip(observations,observations[1:])]
          maximum_gap=max(gaps,default=0)
          if maximum_gap > 1_800_000: raise SystemExit('maximum snapshot gap exceeded')
          samples=sum(x.source_count for x in observations); fresh=sum(x.fresh_source_count for x in observations)
          ratio=Decimal(fresh)/Decimal(samples) if samples else Decimal(0)
          if ratio < Decimal('0.99'): raise SystemExit(f'fresh source ratio below 0.99: {ratio}')
          telemetry=CycleTelemetryStore(path=Path('/runtime/operator/cycle-telemetry.json'),binding_id=binding.binding_id,run_id=binding.request.run_id,operator_commit=os.environ['OPERATOR_COMMIT'])._load_verified()
          records=telemetry.get('records')
          if not isinstance(records,list) or len(records)!=5 or telemetry.get('last_sequence')!=5: raise SystemExit('telemetry cycle count mismatch')
          if any(x.get('outcome')!='success' or not 1 <= int(x.get('attempt_count',0)) <= 3 for x in records): raise SystemExit('telemetry contains invalid burn-in cycle')
          if Path('/runtime/operator/early-fail.json').exists(): raise SystemExit('early-fail sentinel exists')
          print(json.dumps({'status':'v13_preflight_r2_burn_in_passed','run_id':binding.request.run_id,'binding_id':binding.binding_id,'observation_count':5,'maximum_gap_ms':maximum_gap,'fresh_source_ratio':str(ratio),'transient_failure_count':sum(int(x.get('transient_failure_count',0)) for x in records),'operator_commit':os.environ['OPERATOR_COMMIT'],'protected_holdout_accessed':False,'automatic_promotion_enabled':False,'trading_credentials_present':False,'order_adapter_present':False,'execution_enabled':False,'orders_submitted':0,'live_capital_authorized':False},sort_keys=True))
          PY
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true --mount "type=bind,src=$operator_host,dst=/runtime/operator,readonly" \
            --env HEALTH_PATH=/runtime/operator/health.json --env "OPERATOR_COMMIT=$IMPLEMENTATION_SHA" --env HEALTH_MAX_AGE_SECONDS=1200 --entrypoint python "$OPERATOR_IMAGE" /app/deploy/synology/wickhunter-paper-runtime/paper_runtime_healthcheck.py
          cp "$operator_runner/health.json" "$RUNNER_TEMP/wickhunter-wh09-v13-preflight-r2-health.json"
          cp "$operator_runner/cycle-telemetry.json" "$RUNNER_TEMP/wickhunter-wh09-v13-preflight-r2-cycle-telemetry.json"
          docker inspect "$OPERATOR_CONTAINER" > "$RUNNER_TEMP/wickhunter-wh09-v13-preflight-r2-container-inspect.json"

      - name: Publish preflight summary
        shell: bash
        run: |
          echo '## WickHunter WH09 v13 bounded PAPER preflight r2' >> "$GITHUB_STEP_SUMMARY"
          echo '- Exact merged implementation: `2525419f5023dbc9bc05fbdff5b3b29917c40eea`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Policy-valid activation window: `90,000,000 ms`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Burn-in: `5/5` verified cycles at 120-second cadence' >> "$GITHUB_STEP_SUMMARY"
          echo '- Status: `v13_preflight_r2_burn_in_passed`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Evidence is preflight-only and does not start the canonical 24h clock.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v11.0.1
        with:
          name: wickhunter-wh09-v13-preflight-r2-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/wickhunter-wh09-v13-preflight-r2-image-id.txt
            ${{ runner.temp }}/wickhunter-wh09-v13-preflight-r2-activation.json
            ${{ runner.temp }}/wickhunter-wh09-v13-preflight-r2-verification.json
            ${{ runner.temp }}/wickhunter-wh09-v13-preflight-r2-health.json
            ${{ runner.temp }}/wickhunter-wh09-v13-preflight-r2-cycle-telemetry.json
            ${{ runner.temp }}/wickhunter-wh09-v13-preflight-r2-container-inspect.json
          if-no-files-found: error
          retention-days: 30
