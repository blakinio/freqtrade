name: WickHunter WH09 v13 r4 public-market diagnostic

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
    paths:
      - ".github/workflows/wickhunter-wh09-v13-r4-market-diagnostic-20260807.yml"

permissions:
  contents: read

concurrency:
  group: wickhunter-wh09-v13-r4-market-diagnostic-20260807
  cancel-in-progress: false

env:
  EXPECTED_BASE_SHA: b251483461f737c5ac095a17950df5aa217f8e17
  IMPLEMENTATION_SHA: 2525419f5023dbc9bc05fbdff5b3b29917c40eea
  EXPECTED_OPERATOR_IMAGE_ID: sha256:5a06fd44864fe0078338bb21ae7d07d94ef93e60a70a212356a641d4083ba86a
  OPERATOR_IMAGE: local/wickhunter-paper-runtime:sha-2525419f5023dbc9bc05fbdff5b3b29917c40eea
  GATEWAY_IMAGE: local/wickhunter-paper-egress-v13-preflight-r4:sha-2525419f5023dbc9bc05fbdff5b3b29917c40eea
  LIQUID20_LIVE_HOST: /volume1/docker/freqtrade-liquidations/data/live
  GATEWAY_CONTAINER: wickhunter-wh09-r4-market-diagnostic-egress
  INTERNAL_NETWORK: wickhunter-wh09-r4-market-diagnostic-internal

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: [freqtrade-staging]
    timeout-minutes: 15
    steps:
      - name: Check out exact diagnostic request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v11.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prove read-only one-file authority and exact images
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" == "$BASE_SHA" ]]
          git merge-base --is-ancestor "$IMPLEMENTATION_SHA" "$BASE_SHA"
          [[ "$(git diff --name-status "$BASE_SHA" "$HEAD_SHA")" == $'A\t.github/workflows/wickhunter-wh09-v13-r4-market-diagnostic-20260807.yml' ]]
          [[ "$RUNNER_NAME_VALUE" == "freqtrade-synology-staging" ]]
          for name in OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy; do
            [[ -z "${!name:-}" ]] || { echo "forbidden credential/proxy environment: $name" >&2; exit 1; }
          done
          [[ "$(docker image inspect --format '{{.Id}}' "$OPERATOR_IMAGE")" == "$EXPECTED_OPERATOR_IMAGE_ID" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$OPERATOR_IMAGE")" == "$IMPLEMENTATION_SHA" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$GATEWAY_IMAGE")" == "$IMPLEMENTATION_SHA" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "io.freqtrade.wickhunter.egress"}}' "$GATEWAY_IMAGE")" == "fapi-binance-only-v1" ]]
          collector_data_source="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Source}}{{end}}{{end}}' liquid20-live)"
          [[ "$collector_data_source" == "/volume1/docker/freqtrade-liquidations/data" ]]
          [[ "$LIQUID20_LIVE_HOST" == "$collector_data_source/live" ]]

      - name: Diagnose exact live symbols sequentially and concurrently
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker rm -f "$GATEWAY_CONTAINER" >/dev/null 2>&1 || true
            docker network rm "$INTERNAL_NETWORK" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ! docker container inspect "$GATEWAY_CONTAINER" >/dev/null 2>&1
          ! docker network inspect "$INTERNAL_NETWORK" >/dev/null 2>&1
          docker network create --internal "$INTERNAL_NETWORK" >/dev/null
          docker create --name "$GATEWAY_CONTAINER" --init --user 0:0 --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 \
            --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges:true --memory 256m --network bridge \
            --label "io.freqtrade.wickhunter.role=public-market-egress-diagnostic" --label "io.freqtrade.wickhunter.target=fapi.binance.com:443" \
            "$GATEWAY_IMAGE" >/dev/null
          docker network connect "$INTERNAL_NETWORK" "$GATEWAY_CONTAINER"
          docker start "$GATEWAY_CONTAINER" >/dev/null
          gateway_ip="$(docker inspect --format "{{with index .NetworkSettings.Networks \"$INTERNAL_NETWORK\"}}{{.IPAddress}}{{end}}" "$GATEWAY_CONTAINER")"
          [[ "$gateway_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]

          docker run --rm --interactive --user 65532:65532 --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --network "$INTERNAL_NETWORK" --add-host "fapi.binance.com:$gateway_ip" \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= --env http_proxy= --env https_proxy= --env all_proxy= \
            --mount "type=bind,src=$LIQUID20_LIVE_HOST,dst=/runtime/liquid20,readonly" \
            --entrypoint python "$OPERATOR_IMAGE" - > "$RUNNER_TEMP/wickhunter-wh09-v13-r4-market-diagnostic.json" <<'PY'
          import json
          import socket
          import time
          import urllib.error
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          from ai_platform.wickhunter.candidate_paper_runtime_operator import (
              CandidatePaperRuntimeOperatorError,
              fetch_public_market_snapshot,
              load_liquid20_snapshot,
          )

          now_ms = time.time_ns() // 1_000_000
          result = {
              "status": "read_only_market_diagnostic",
              "observed_at_ms": now_ms,
              "state_mutated": False,
              "orders_submitted": 0,
              "live_capital_authorized": False,
          }
          try:
              socket.create_connection(("1.1.1.1", 443), timeout=2)
          except OSError:
              result["direct_external_egress_blocked"] = True
          else:
              result["direct_external_egress_blocked"] = False
              print(json.dumps(result, indent=2, sort_keys=True))
              raise SystemExit("diagnostic unexpectedly has direct external egress")

          snapshot = load_liquid20_snapshot(Path("/runtime/liquid20"), now_ms=now_ms, maximum_age_ms=300_000)
          symbols = tuple(sorted(snapshot.universe.selected_symbols))
          result["liquid20_snapshot_id"] = snapshot.snapshot_id
          result["liquid20_observed_at_ms"] = snapshot.observed_at_ms
          result["selected_symbols"] = list(symbols)
          result["selected_symbol_count"] = len(symbols)
          result["source_states"] = [
              {
                  "source": item.source,
                  "health": item.health.value,
                  "last_received_at_ms": item.last_received_at_ms,
                  "age_ms": None if item.last_received_at_ms is None else now_ms - item.last_received_at_ms,
              }
              for item in snapshot.source_states
          ]

          def cause_chain(exc):
              values = []
              seen = set()
              current = exc
              while current is not None and id(current) not in seen:
                  seen.add(id(current))
                  row = {"type": type(current).__name__, "message": str(current)}
                  if isinstance(current, urllib.error.HTTPError):
                      row["http_status"] = current.code
                      try:
                          body = current.read(4096)
                          row["http_body"] = body.decode("utf-8", errors="replace")
                      except Exception as read_exc:
                          row["http_body_error"] = f"{type(read_exc).__name__}: {read_exc}"
                  values.append(row)
                  current = current.__cause__ or current.__context__
              return values

          def full_probe(symbol):
              started = time.monotonic_ns()
              try:
                  market = fetch_public_market_snapshot(symbol=symbol, observed_at_ms=now_ms)
                  return {
                      "symbol": symbol,
                      "ok": True,
                      "elapsed_ms": (time.monotonic_ns() - started) // 1_000_000,
                      "completed_candle_close_ms": market.completed_candle_close_ms,
                      "open_interest_usd": str(market.open_interest_usd),
                  }
              except Exception as exc:
                  return {
                      "symbol": symbol,
                      "ok": False,
                      "elapsed_ms": (time.monotonic_ns() - started) // 1_000_000,
                      "error": f"{type(exc).__name__}: {exc}",
                      "cause_chain": cause_chain(exc),
                  }

          sequential = [full_probe(symbol) for symbol in symbols]
          result["sequential"] = sequential
          result["sequential_ok_count"] = sum(1 for row in sequential if row["ok"])

          with ThreadPoolExecutor(max_workers=min(8, max(1, len(symbols))), thread_name_prefix="diagnostic-public-market") as executor:
              concurrent = list(executor.map(full_probe, symbols))
          result["concurrent"] = concurrent
          result["concurrent_ok_count"] = sum(1 for row in concurrent if row["ok"])
          result["operator_batch_reproduced"] = result["concurrent_ok_count"] != len(symbols)
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          cat "$RUNNER_TEMP/wickhunter-wh09-v13-r4-market-diagnostic.json"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v11.0.1
        with:
          name: wickhunter-wh09-v13-r4-market-diagnostic-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/wickhunter-wh09-v13-r4-market-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
