name: Temporary 1089 Docker bridge diagnostic

on:
  push:
    branches:
      - diag/1089-docker-bridge-20260809

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [freqtrade-staging]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: 0f95b0dad5cd537a783301135605f2a10ad99f98
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            test -z "${!name:-}" || { echo "trading credential environment present: $name" >&2; exit 1; }
          done
      - name: Probe Postgres listener and bridge forwarding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess

          pg = 'freqtrade-portal-postgresql'
          network = 'portal_oidc_public'
          alias = 'portal-postgresql'
          control = 'sha256:0bd79c3bb178dba4073db9c1cb47cb22e7bc11eb32d133a28a97fd44658701fc'

          def run(command, timeout=15):
              return subprocess.run(command, check=False, text=True, capture_output=True, timeout=timeout)

          listen = run(['docker','exec',pg,'psql','-U','portal','-d','portal_admin','-tAc','SHOW listen_addresses'])
          port = run(['docker','exec',pg,'psql','-U','portal','-d','portal_admin','-tAc','SHOW port'])
          print(f"POSTGRES_CONFIG listen_all={listen.returncode == 0 and listen.stdout.strip() == '*'} port_5432={port.returncode == 0 and port.stdout.strip() == '5432'}")

          inspect = json.loads(run(['docker','network','inspect',network]).stdout)[0]
          options = inspect.get('Options') or {}
          icc = options.get('com.docker.network.bridge.enable_icc')
          print(f"NETWORK_CONFIG driver={inspect.get('Driver') == 'bridge'} icc_explicit={icc is not None} icc_enabled={icc != 'false'}")

          dns = run(['docker','run','--rm','--network',network,'--entrypoint','python',control,'-c',
                     "import socket; socket.getaddrinfo('portal-postgresql',5432); print('DNS_OK')"])
          print(f"DNS alias_resolves={dns.returncode == 0 and 'DNS_OK' in dns.stdout}")

          server = 'portal-1089-bridge-probe-server'
          run(['docker','rm','-f',server])
          try:
              start = run(['docker','run','--detach','--rm','--name',server,'--network',network,'--entrypoint','python',control,
                           '-c',"import socket,time; s=socket.socket(); s.bind(('0.0.0.0',18765)); s.listen(); time.sleep(45)"])
              if start.returncode != 0:
                  print('EPHEMERAL server_started=False')
                  raise SystemExit(2)
              probe = run(['docker','run','--rm','--network',network,'--entrypoint','python',control,'-c',
                           "import socket; s=socket.create_connection(('portal-1089-bridge-probe-server',18765),5); s.close(); print('BRIDGE_OK')"], timeout=12)
              print(f"EPHEMERAL server_started=True peer_connects={probe.returncode == 0 and 'BRIDGE_OK' in probe.stdout}")
          finally:
              run(['docker','rm','-f',server])

          pg_tcp = run(['docker','run','--rm','--network',network,'--entrypoint','python',control,'-c',
                        "import socket; s=socket.create_connection(('portal-postgresql',5432),5); s.close(); print('PG_TCP_OK')"], timeout=12)
          print(f"POSTGRES_TCP peer_connects={pg_tcp.returncode == 0 and 'PG_TCP_OK' in pg_tcp.stdout}")
          PY
