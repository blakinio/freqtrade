name: Temporary 1089 Docker daemon state diagnostic

on:
  push:
    branches:
      - diag/1089-docker-daemon-state-20260809

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [freqtrade-staging]
    timeout-minutes: 8
    steps:
      - name: Checkout trusted implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: 0f95b0dad5cd537a783301135605f2a10ad99f98
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            test -z "${!name:-}" || exit 1
          done
      - name: Inspect and clean only temporary 1089 probes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          names = [
              'portal-1089-fresh-server',
              'portal-1089-default-bridge-probe',
              'portal-1089-host-probe-server',
              'portal-1089-bridge-probe-server',
          ]

          def run(command, timeout=10):
              return subprocess.run(command, check=False, text=True, capture_output=True, timeout=timeout)

          ps = run(['docker','ps','-a','--format','{{.Names}}|{{.State}}'], timeout=10)
          found = {}
          if ps.returncode == 0:
              for line in ps.stdout.splitlines():
                  name, sep, state = line.partition('|')
                  if sep and name in names:
                      found[name] = state
          print(f"PROBE_INVENTORY count={len(found)} names={','.join(sorted(found)) if found else 'none'}")

          for name in names:
              if name not in found:
                  continue
              try:
                  result = run(['docker','rm','-f',name], timeout=8)
                  print(f"PROBE_CLEANUP name={name} removed={result.returncode == 0}")
              except subprocess.TimeoutExpired:
                  print(f"PROBE_CLEANUP name={name} removed=False timeout=True")

          info = run(['docker','info','--format','{{json .}}'], timeout=10)
          print(f"DOCKER_INFO responsive={info.returncode == 0}")
          PY
