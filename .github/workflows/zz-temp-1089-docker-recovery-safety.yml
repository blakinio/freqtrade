name: Temporary 1089 Docker recovery safety diagnostic

on:
  push:
    branches:
      - diag/1089-docker-recovery-safety-20260809

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [freqtrade-staging]
    timeout-minutes: 8
    steps:
      - name: Checkout trusted implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: 0f95b0dad5cd537a783301135605f2a10ad99f98
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            test -z "${!name:-}" || exit 1
          done
      - name: Assess Docker recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          image = 'sha256:0bd79c3bb178dba4073db9c1cb47cb22e7bc11eb32d133a28a97fd44658701fc'

          def run(command, timeout=15):
              return subprocess.run(command, check=False, text=True, capture_output=True, timeout=timeout)

          live = run(['docker','info','--format','{{.LiveRestoreEnabled}}'], timeout=10)
          running = run(['docker','ps','-q'], timeout=10)
          count = len([line for line in running.stdout.splitlines() if line.strip()]) if running.returncode == 0 else -1
          print(f"DAEMON live_restore={live.stdout.strip().lower() == 'true'} running_container_count={count}")

          none = run(['docker','run','--rm','--network','none','--entrypoint','python',image,'-c',"print('NONE_OK')"], timeout=20)
          print(f"NETWORK_NONE starts={none.returncode == 0 and 'NONE_OK' in none.stdout}")
          if none.returncode != 0:
              raise SystemExit(2)
          PY
