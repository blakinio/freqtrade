name: Temporary 1089 Synology recovery probe

on:
  push:
    branches:
      - diag/1089-final-runtime-preflight-20260809

permissions:
  contents: read

jobs:
  probe:
    runs-on: [freqtrade-staging]
    timeout-minutes: 5
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            test -z "${!name:-}" || exit 1
          done

      - name: Probe host recovery capabilities without mutation
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_uid=$(id -u)"
          echo "runner_gid=$(id -g)"
          echo "runner_hostname=$(hostname)"
          echo "pid1_comm=$(cat /proc/1/comm 2>/dev/null || echo unknown)"
          echo "docker_socket=$([ -S /var/run/docker.sock ] && echo yes || echo no)"

          for tool in sudo synopkg synosystemctl systemctl service nsenter chroot; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "tool_${tool}=yes"
            else
              echo "tool_${tool}=no"
            fi
          done

          if command -v sudo >/dev/null 2>&1 && timeout 5 sudo -n true >/dev/null 2>&1; then
            echo "passwordless_sudo=yes"
          else
            echo "passwordless_sudo=no"
          fi

          timeout 10 docker info --format 'docker_server={{.ServerVersion}} live_restore={{.LiveRestoreEnabled}} running={{.ContainersRunning}}'

          self_id="$(hostname)"
          if timeout 10 docker inspect "$self_id" >/dev/null 2>&1; then
            timeout 10 docker inspect --format 'runner_container_privileged={{.HostConfig.Privileged}} pid_mode={{.HostConfig.PidMode}} network_mode={{.HostConfig.NetworkMode}}' "$self_id"
          else
            echo "runner_container_inspect=no"
          fi

          echo "candidate_existing_containers_begin"
          timeout 15 docker ps -q | while read -r cid; do
            [ -n "$cid" ] || continue
            timeout 5 docker inspect --format '{{.Name}}|priv={{.HostConfig.Privileged}}|pid={{.HostConfig.PidMode}}|{{range .Mounts}}{{if eq .Source "/"}}host_root={{.Destination}};{{end}}{{if eq .Destination "/host"}}host_mount=yes;{{end}}{{if eq .Destination "/hostfs"}}hostfs_mount=yes;{{end}}{{if eq .Destination "/rootfs"}}rootfs_mount=yes;{{end}}{{end}}' "$cid" || true
          done
          echo "candidate_existing_containers_end"

          echo "probe_complete=yes"
