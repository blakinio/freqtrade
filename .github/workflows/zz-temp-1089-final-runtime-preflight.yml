name: Temporary 1089 direct Portal candidate recovery

on:
  push:
    branches:
      - diag/1089-final-runtime-preflight-20260809

permissions:
  contents: read

jobs:
  recover:
    runs-on: [freqtrade-staging]
    timeout-minutes: 5
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            test -z "${!name:-}" || exit 1
          done

      - name: Checkout merged implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: 27b6b65ad6a79184c4922a79a86f6e72b3d4383e

      - name: Force-remove stale Portal candidate only
        shell: bash
        run: |
          set -euo pipefail
          candidate='freqtrade-portal-control-plane-candidate-81005a01301f'
          if timeout 10 docker ps -a --format '{{.Names}}' | grep -Fxq "$candidate"; then
            policy="$(timeout 5 docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$candidate" 2>/dev/null || echo unknown)"
            state="$(timeout 5 docker inspect --format '{{.State.Status}}' "$candidate" 2>/dev/null || echo unknown)"
            echo "candidate_state=$state restart_policy=$policy"
            timeout 20 docker rm -f "$candidate"
            if timeout 10 docker ps -a --format '{{.Names}}' | grep -Fxq "$candidate"; then
              echo 'stale Portal candidate still exists after force-remove' >&2
              exit 1
            fi
            echo 'portal_candidate_recovered=yes'
          else
            echo 'portal_candidate_already_absent=yes'
          fi

      - name: Verify Docker runtime after direct recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/synology/portal-oidc/docker_runtime_preflight.py
          timeout 10 docker info --format 'running={{.ContainersRunning}} stopped={{.ContainersStopped}} live_restore={{.LiveRestoreEnabled}}'
