name: Temporary 1089 Synology stuck-container probe

on:
  push:
    branches:
      - diag/1089-final-runtime-preflight-20260809

permissions:
  contents: read

jobs:
  probe:
    runs-on: [freqtrade-staging]
    timeout-minutes: 5
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            test -z "${!name:-}" || exit 1
          done

      - name: Enumerate container state without mutation
        shell: bash
        run: |
          set -euo pipefail
          timeout 10 docker info --format 'docker_server={{.ServerVersion}} live_restore={{.LiveRestoreEnabled}} running={{.ContainersRunning}} paused={{.ContainersPaused}} stopped={{.ContainersStopped}}'
          echo "containers_begin"
          timeout 20 docker ps -a --no-trunc --format '{{.ID}}|{{.Names}}|{{.State}}|{{.Status}}'
          echo "containers_end"

          echo "special_mount_candidates_begin"
          timeout 20 docker ps -q | while read -r cid; do
            [ -n "$cid" ] || continue
            timeout 4 docker inspect --format '{{.Name}}|priv={{.HostConfig.Privileged}}|pid={{.HostConfig.PidMode}}|{{range .Mounts}}{{if eq .Source "/"}}src_root={{.Destination}};{{end}}{{if eq .Source "/run"}}src_run={{.Destination}};{{end}}{{if eq .Source "/var/run"}}src_varrun={{.Destination}};{{end}}{{if eq .Source "/usr/syno"}}src_usr_syno={{.Destination}};{{end}}{{if eq .Source "/proc"}}src_proc={{.Destination}};{{end}}{{if eq .Source "/sys"}}src_sys={{.Destination}};{{end}}{{end}}' "$cid" 2>/dev/null || echo "inspect_timeout=$cid"
          done
          echo "special_mount_candidates_end"
