name: Temporary 1089 focused lifecycle validation

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-focused-lifecycle.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: 5fb6312a2ab120546cc2230efdebc812334149de

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install focused validation tools
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check
          pytest jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6"
          "httpx>=0.24.1" fastapi pyjwt cryptography "PyYAML>=6.0"
          ruff==0.15.21

      - name: Compile focused repair modules
        shell: bash
        run: |
          python -m py_compile deploy/synology/portal-oidc/bounded_schema_lifecycle.py
          python -m py_compile deploy/synology/portal-oidc/cancellation_report_bridge.py
          python -m py_compile deploy/synology/portal-oidc/deploy_entrypoint.py
          python -m py_compile ai_platform/portal/database/transfer.py
          python -m py_compile tests/ai_platform/portal/deployment/test_portal_oidc_bounded_schema_lifecycle.py
          python -m py_compile tests/ai_platform/portal/deployment/test_portal_oidc_bounded_schema_cancellation.py
          python -m py_compile tests/ai_platform/portal/deployment/test_portal_oidc_bounded_schema_health.py
          python -m py_compile tests/ai_platform/portal/deployment/test_portal_oidc_cancellation_report_bridge.py
          python -m py_compile tests/ai_platform/portal/database/test_state_transfer.py

      - name: Ruff exact repair files
        shell: bash
        run: |
          ruff check \
            deploy/synology/portal-oidc/bounded_schema_lifecycle.py \
            deploy/synology/portal-oidc/cancellation_report_bridge.py \
            deploy/synology/portal-oidc/deploy_entrypoint.py \
            ai_platform/portal/database/transfer.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_bounded_schema_lifecycle.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_bounded_schema_cancellation.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_bounded_schema_health.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_cancellation_report_bridge.py \
            tests/ai_platform/portal/database/test_state_transfer.py
          ruff format --check \
            deploy/synology/portal-oidc/bounded_schema_lifecycle.py \
            deploy/synology/portal-oidc/cancellation_report_bridge.py \
            deploy/synology/portal-oidc/deploy_entrypoint.py \
            ai_platform/portal/database/transfer.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_bounded_schema_lifecycle.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_bounded_schema_cancellation.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_bounded_schema_health.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_cancellation_report_bridge.py \
            tests/ai_platform/portal/database/test_state_transfer.py

      - name: Run focused lifecycle and transfer regressions
        shell: bash
        run: |
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/deployment/test_portal_oidc_bounded_schema_lifecycle.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_bounded_schema_cancellation.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_bounded_schema_health.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_cancellation_report_bridge.py \
            tests/ai_platform/portal/database/test_state_transfer.py
