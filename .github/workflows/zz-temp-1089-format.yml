name: Temporary 1089 exact formatter

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/1089-bounded-schema-docker-lifecycle
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install exact validation dependencies
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check
          pytest ruff==0.15.21

      - name: Make report-path ownership atomic and validate
        shell: bash
        run: |
          set -euo pipefail
          expected_head=921100bdfca379e993b5b2f692ee34c7f4e01dcf
          expected_base=bbe39128b8b94aab134a216542f94a3d65c6c949
          test "$(git rev-parse HEAD)" = "$expected_head"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$expected_base"
          git merge-base --is-ancestor "$expected_base" HEAD

          python - <<'PY'
          from pathlib import Path

          bridge = Path("deploy/synology/portal-oidc/cancellation_report_bridge.py")
          source = bridge.read_text(encoding="utf-8")

          old = '''    digest = cast(str, original_write_report(path, report))\n    deploy._portal_current_report_path = path.resolve()\n    return digest\n'''
          new = '''    return cast(str, original_write_report(path, report))\n'''
          if source.count(old) != 1:
              raise SystemExit("bridge: guarded-write marker target mismatch")
          source = source.replace(old, new)

          marker = '''def _guarded_deploy(\n    deploy: Any,\n    original_deploy: Callable[[Any], int],\n    args: Any,\n) -> int:\n'''
          helper = '''def _reserve_current_report_path(deploy: Any, args: Any) -> None:\n    report_path = Path(args.report).resolve()\n    try:\n        if report_path.exists():\n            if not report_path.is_file():\n                raise deploy.DeploymentError(\n                    "protected deployment report path is not a regular file"\n                )\n            report_path.unlink()\n    except OSError as exc:\n        raise deploy.DeploymentError(\n            "protected deployment could not clear stale report evidence"\n        ) from exc\n    deploy._portal_current_report_path = report_path\n\n\n'''
          if source.count(marker) != 1:
              raise SystemExit("bridge: guarded-deploy helper insertion target mismatch")
          source = source.replace(marker, helper + marker)

          old = '''    previous_handlers = _install_termination_handlers(deploy)\n    deploy._portal_current_report_path = None\n    try:\n        try:\n            return_code = int(original_deploy(args))\n'''
          new = '''    previous_handlers = _install_termination_handlers(deploy)\n    deploy._portal_current_report_path = None\n    try:\n        try:\n            _reserve_current_report_path(deploy, args)\n            return_code = int(original_deploy(args))\n'''
          if source.count(old) != 1:
              raise SystemExit("bridge: report reservation call target mismatch")
          bridge.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path(
              "tests/ai_platform/portal/deployment/"
              "test_portal_oidc_cancellation_report_bridge.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_sigint_after_report_bytes_preserves_current_report"
          if marker not in tests:
              tests += '''\n\ndef test_sigint_after_report_bytes_preserves_current_report(tmp_path) -> None:\n    reports: list[dict[str, Any]] = []\n    report_path = tmp_path / "report.json"\n    deploy = SimpleNamespace(\n        DeploymentError=RuntimeError,\n        REQUEST_ID="portal-authentik-public-oidc-20260801-v1",\n        _bounded_schema_cleanup_evidence=_cleanup_evidence(),\n    )\n\n    def original_run(command, *, cwd=None, sensitive=False, check=True):\n        raise AssertionError("post-write SIGINT test must not pass through _run")\n\n    def original_write_report(path: Path, report: dict[str, Any]) -> str:\n        path.write_text(json.dumps(report), encoding="utf-8")\n        reports.append(copy.deepcopy(report))\n        handler = signal.getsignal(signal.SIGINT)\n        assert callable(handler)\n        handler(signal.SIGINT, None)\n        raise AssertionError("SIGINT after report bytes must not return")\n\n    def original_deploy(args: Any) -> int:\n        report = {\n            "schema_version": 2,\n            "request_id": deploy.REQUEST_ID,\n            "implementation_sha": args.expected_repository_sha,\n            "status": "success",\n            "secret_values_recorded": False,\n            "live_capital_authorized": False,\n            "portal": {"health": "healthy", "api_mode": True},\n            "database": {"revision": "20260809_04_runtime_isolation_binding"},\n            "recovery": {"restart_verified": True},\n        }\n        deploy._write_report(report_path, report)\n        raise AssertionError("post-write SIGINT must interrupt deploy")\n\n    stale = {\n        "schema_version": 2,\n        "request_id": deploy.REQUEST_ID,\n        "implementation_sha": "2" * 40,\n        "status": "success",\n        "portal": {"health": "stale"},\n    }\n    report_path.write_text(json.dumps(stale), encoding="utf-8")\n\n    deploy._run = original_run\n    deploy._write_report = original_write_report\n    deploy.deploy = original_deploy\n    module.install(deploy)\n    args = SimpleNamespace(\n        report=str(report_path),\n        expected_repository_sha="2" * 40,\n    )\n\n    with pytest.raises(KeyboardInterrupt):\n        deploy.deploy(args)\n\n    assert len(reports) == 2\n    final = reports[-1]\n    assert final["status"] == "failed"\n    assert final["portal"] == {"health": "healthy", "api_mode": True}\n    assert final["database"] == {\n        "revision": "20260809_04_runtime_isolation_binding"\n    }\n    assert final["recovery"] == {"restart_verified": True}\n    assert final["cancellation"]["type"] == "KeyboardInterrupt"\n    assert final["failure"]["type"] == "CancellationRecoveryError"\n'''
              test_path.write_text(tests, encoding="utf-8")
          PY

          files=(
            deploy/synology/portal-oidc/cancellation_report_bridge.py
            tests/ai_platform/portal/deployment/test_portal_oidc_cancellation_report_bridge.py
          )
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/deployment/test_portal_oidc_cancellation_report_bridge.py
          git diff --check

          git config user.name "blakinio"
          git config user.email "75369544+blakinio@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "fix(portal): reserve cancellation report path per run"
          git push origin HEAD:fix/1089-bounded-schema-docker-lifecycle
