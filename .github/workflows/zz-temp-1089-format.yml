name: Temporary 1089 exact formatter

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/1089-market-evidence-host-mount
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install exact validation dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check ruff==0.15.21

      - name: Repair dynamic module assignment and push
        shell: bash
        run: |
          set -euo pipefail
          expected_head=0d30d0865cb5f68bba79c756cd259c40a66d0c49
          expected_base=9dd5887e301ddfeec6df6a3b3e2da24a9ced850f
          test "$(git rev-parse HEAD)" = "$expected_head"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$expected_base"
          git merge-base --is-ancestor "$expected_base" HEAD

          python - <<'PY'
          from pathlib import Path

          path = Path("deploy/synology/portal-oidc/deploy_entrypoint.py")
          source = path.read_text(encoding="utf-8")
          old = "    market_evidence.MARKET_EVIDENCE_HOST_ROOT = _resolve_market_evidence_host_root(deploy)\n"
          new = "    market_evidence.__dict__[\"MARKET_EVIDENCE_HOST_ROOT\"] = (\n        _resolve_market_evidence_host_root(deploy)\n    )\n"
          if source.count(old) != 1:
              raise SystemExit("Market Evidence assignment replacement mismatch")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY

          ruff format deploy/synology/portal-oidc/deploy_entrypoint.py
          ruff check deploy/synology/portal-oidc/deploy_entrypoint.py
          python -m py_compile deploy/synology/portal-oidc/deploy_entrypoint.py
          git diff --check

          git config user.name "blakinio"
          git config user.email "75369544+blakinio@users.noreply.github.com"
          git add -- deploy/synology/portal-oidc/deploy_entrypoint.py
          git commit -m "fix(portal): type dynamic Market Evidence injection"
          git push origin HEAD:fix/1089-market-evidence-host-mount
