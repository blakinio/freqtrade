name: Temporary 1089 exact formatter

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/1089-bounded-schema-docker-lifecycle
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install exact validation dependencies
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check
          pytest ruff==0.15.21

      - name: Add regression, format, lint and test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "tests/ai_platform/portal/deployment/"
              "test_portal_oidc_cancellation_report_bridge.py"
          )
          source = path.read_text(encoding="utf-8")
          if "import json\n" not in source:
              target = "import importlib.util\n"
              if source.count(target) != 1:
                  raise SystemExit("expected one import insertion target")
              source = source.replace(target, target + "import json\n")
          marker = "def test_late_sigint_preserves_existing_canonical_report"
          if marker not in source:
              source += '''\n\ndef test_late_sigint_preserves_existing_canonical_report(tmp_path) -> None:\n    reports: list[dict[str, Any]] = []\n    deploy = SimpleNamespace(\n        DeploymentError=RuntimeError,\n        REQUEST_ID="portal-authentik-public-oidc-20260801-v1",\n        _bounded_schema_cleanup_evidence=_cleanup_evidence(),\n    )\n\n    def original_run(command, *, cwd=None, sensitive=False, check=True):\n        raise AssertionError("late SIGINT test must not pass through _run")\n\n    def original_write_report(path: Path, report: dict[str, Any]) -> str:\n        report["bounded_schema_cleanup_evidence"] = list(\n            deploy._bounded_schema_cleanup_evidence\n        )\n        path.write_text(json.dumps(report), encoding="utf-8")\n        reports.append(copy.deepcopy(report))\n        return "digest"\n\n    def original_deploy(args: Any) -> int:\n        report = {\n            "schema_version": 2,\n            "request_id": deploy.REQUEST_ID,\n            "implementation_sha": args.expected_repository_sha,\n            "status": "success",\n            "secret_values_recorded": False,\n            "live_capital_authorized": False,\n            "portal": {"health": "healthy", "api_mode": True},\n            "authentik": {"issuer_verified": True},\n            "database": {"revision": "20260809_04_runtime_isolation_binding"},\n            "recovery": {"restart_verified": True},\n        }\n        deploy._write_report(Path(args.report), report)\n        handler = signal.getsignal(signal.SIGINT)\n        assert callable(handler)\n        handler(signal.SIGINT, None)\n        raise AssertionError("late SIGINT must not return")\n\n    deploy._run = original_run\n    deploy._write_report = original_write_report\n    deploy.deploy = original_deploy\n    module.install(deploy)\n    args = SimpleNamespace(\n        report=str(tmp_path / "report.json"),\n        expected_repository_sha="f" * 40,\n    )\n\n    with pytest.raises(KeyboardInterrupt):\n        deploy.deploy(args)\n\n    assert len(reports) == 2\n    final = reports[-1]\n    assert final["status"] == "failed"\n    assert final["portal"] == {"health": "healthy", "api_mode": True}\n    assert final["authentik"] == {"issuer_verified": True}\n    assert final["database"] == {\n        "revision": "20260809_04_runtime_isolation_binding"\n    }\n    assert final["recovery"] == {"restart_verified": True}\n    assert final["cancellation"]["type"] == "KeyboardInterrupt"\n    assert final["failure"]["type"] == "CancellationRecoveryError"\n    assert final["bounded_schema_cleanup_evidence"] == _cleanup_evidence()\n'''
          path.write_text(source, encoding="utf-8")
          PY

          files=(
            deploy/synology/portal-oidc/cancellation_report_bridge.py
            tests/ai_platform/portal/deployment/test_portal_oidc_cancellation_report_bridge.py
          )
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/deployment/test_portal_oidc_cancellation_report_bridge.py
          git diff --check

          git config user.name "blakinio"
          git config user.email "75369544+blakinio@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "test(portal): preserve canonical report on late cancellation"
          git push origin HEAD:fix/1089-bounded-schema-docker-lifecycle
