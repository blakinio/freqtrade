name: Temporary 1089 exact formatter

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/1089-market-evidence-host-mount
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install exact validation dependencies
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check
          pytest jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6"
          "httpx>=0.24.1" fastapi pyjwt cryptography "PyYAML>=6.0"
          ruff==0.15.21

      - name: Reject mount whitespace and push
        shell: bash
        run: |
          set -euo pipefail
          expected_head=24f27710f65113dcb3158f151f45276f9882c562
          expected_base=9dd5887e301ddfeec6df6a3b3e2da24a9ced850f
          test "$(git rev-parse HEAD)" = "$expected_head"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$expected_base"
          git merge-base --is-ancestor "$expected_base" HEAD

          python - <<'PY'
          from pathlib import Path

          entrypoint = Path("deploy/synology/portal-oidc/deploy_entrypoint.py")
          source = entrypoint.read_text(encoding="utf-8")
          old = "    lines = [line.strip() for line in result.stdout.splitlines() if line.strip()]\n"
          new = "    lines = [line for line in result.stdout.splitlines() if line]\n"
          if source.count(old) != 1:
              raise SystemExit("raw inspect line replacement mismatch")
          entrypoint.write_text(source.replace(old, new), encoding="utf-8")

          tests_path = Path(
              "tests/ai_platform/portal/deployment/test_portal_oidc_deploy_entrypoint.py"
          )
          tests = tests_path.read_text(encoding="utf-8")
          marker = '''        (\n            "true|freqtrade-deploy-runner|runner\\n"\n            "bind|/volume1/docker/freqtrade/../state\\n",\n            "staging-state host bind is invalid",\n        ),\n'''
          regression = marker + '''        (\n            "true|freqtrade-deploy-runner|runner\\n"\n            "bind|/volume1/docker/freqtrade/state \\n",\n            "staging-state host bind is invalid",\n        ),\n        (\n            "true|freqtrade-deploy-runner|runner\\n"\n            " bind|/volume1/docker/freqtrade/state\\n",\n            "staging-state host bind is invalid",\n        ),\n'''
          if tests.count(marker) != 1:
              raise SystemExit("mount whitespace regression insertion mismatch")
          tests_path.write_text(tests.replace(marker, regression), encoding="utf-8")
          PY

          files=(
            deploy/synology/portal-oidc/deploy_entrypoint.py
            tests/ai_platform/portal/deployment/test_portal_oidc_deploy_entrypoint.py
          )
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          python -m py_compile "${files[@]}"
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/deployment/test_portal_oidc_deploy_entrypoint.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_market_evidence_runtime.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_bounded_schema_lifecycle.py
          git diff --check

          git config user.name "blakinio"
          git config user.email "75369544+blakinio@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "fix(portal): reject Market Evidence mount whitespace"
          git push origin HEAD:fix/1089-market-evidence-host-mount
