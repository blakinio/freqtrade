name: Temporary 1089 exact formatter

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/1089-bounded-schema-docker-lifecycle
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install exact validation dependencies
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check
          pytest ruff==0.15.21

      - name: Acquire report lock before cancellation handlers and validate
        shell: bash
        run: |
          set -euo pipefail
          expected_head=aa967314f69076856cfd51dac954eb4749666fd8
          expected_base=bbe39128b8b94aab134a216542f94a3d65c6c949
          test "$(git rev-parse HEAD)" = "$expected_head"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$expected_base"
          git merge-base --is-ancestor "$expected_base" HEAD

          python - <<'PY'
          from pathlib import Path

          bridge = Path("deploy/synology/portal-oidc/cancellation_report_bridge.py")
          source = bridge.read_text(encoding="utf-8")
          old = '''def _guarded_deploy(\n    deploy: Any,\n    original_deploy: Callable[[Any], int],\n    args: Any,\n) -> int:\n    previous_handlers = _install_termination_handlers(deploy)\n    deploy._portal_current_report_path = None\n    try:\n        try:\n            _reserve_current_report_path(deploy, args)\n            return_code = int(original_deploy(args))\n        except BaseException as exc:\n            pending = _pending_cancellation(deploy)\n            if pending is None:\n                raise\n            _raise_pending_after_fallback(deploy, args, pending, exc)\n    finally:\n        _release_current_report_lock(deploy)\n        _restore_termination_handlers(previous_handlers)\n\n    pending = _pending_cancellation(deploy)\n    if pending is not None:\n        deploy._portal_pending_cancellation = None\n        raise pending\n    return return_code\n'''
          new = '''def _guarded_deploy(\n    deploy: Any,\n    original_deploy: Callable[[Any], int],\n    args: Any,\n) -> int:\n    deploy._portal_current_report_path = None\n    previous_handlers: dict[int, Any] | None = None\n    try:\n        _reserve_current_report_path(deploy, args)\n        previous_handlers = _install_termination_handlers(deploy)\n        try:\n            try:\n                return_code = int(original_deploy(args))\n            except BaseException as exc:\n                pending = _pending_cancellation(deploy)\n                if pending is None:\n                    raise\n                _raise_pending_after_fallback(deploy, args, pending, exc)\n        finally:\n            _restore_termination_handlers(previous_handlers)\n\n        pending = _pending_cancellation(deploy)\n        if pending is not None:\n            deploy._portal_pending_cancellation = None\n            raise pending\n        return return_code\n    finally:\n        _release_current_report_lock(deploy)\n'''
          if source.count(old) != 1:
              raise SystemExit("bridge: guarded deploy ordering target mismatch")
          bridge.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path(
              "tests/ai_platform/portal/deployment/"
              "test_portal_oidc_cancellation_report_bridge.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_lock_contention_fails_before_installing_termination_handlers"
          if marker not in tests:
              tests += '''\n\ndef test_lock_contention_fails_before_installing_termination_handlers(tmp_path) -> None:\n    report_path = tmp_path / "report.json"\n    first = SimpleNamespace(\n        DeploymentError=RuntimeError,\n        _portal_report_lock_fd=None,\n        _portal_current_report_path=None,\n    )\n    args = SimpleNamespace(\n        report=str(report_path),\n        expected_repository_sha="4" * 40,\n    )\n    module._reserve_current_report_path(first, args)\n    report_path.write_text(\n        json.dumps({"status": "success", "portal": {"health": "first"}}),\n        encoding="utf-8",\n    )\n\n    deploy_calls: list[str] = []\n    reports: list[dict[str, Any]] = []\n    second = SimpleNamespace(\n        DeploymentError=RuntimeError,\n        REQUEST_ID="portal-authentik-public-oidc-20260801-v1",\n        _bounded_schema_cleanup_evidence=_cleanup_evidence(),\n    )\n\n    def original_run(command, *, cwd=None, sensitive=False, check=True):\n        raise AssertionError("lock contention must not enter _run")\n\n    def original_write_report(path: Path, report: dict[str, Any]) -> str:\n        reports.append(copy.deepcopy(report))\n        path.write_text(json.dumps(report), encoding="utf-8")\n        return "digest"\n\n    def original_deploy(_args: Any) -> int:\n        deploy_calls.append("entered")\n        return 0\n\n    second._run = original_run\n    second._write_report = original_write_report\n    second.deploy = original_deploy\n    previous_sigint = signal.getsignal(signal.SIGINT)\n    previous_sigterm = signal.getsignal(signal.SIGTERM)\n    module.install(second)\n    try:\n        with pytest.raises(RuntimeError, match="already owned by another invocation"):\n            second.deploy(args)\n        assert deploy_calls == []\n        assert reports == []\n        assert signal.getsignal(signal.SIGINT) == previous_sigint\n        assert signal.getsignal(signal.SIGTERM) == previous_sigterm\n        assert json.loads(report_path.read_text(encoding="utf-8"))["portal"] == {\n            "health": "first"\n        }\n    finally:\n        module._release_current_report_lock(first)\n'''
              test_path.write_text(tests, encoding="utf-8")
          PY

          files=(
            deploy/synology/portal-oidc/cancellation_report_bridge.py
            tests/ai_platform/portal/deployment/test_portal_oidc_cancellation_report_bridge.py
          )
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/deployment/test_portal_oidc_cancellation_report_bridge.py
          git diff --check

          git config user.name "blakinio"
          git config user.email "75369544+blakinio@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "fix(portal): lock report before cancellation bridge"
          git push origin HEAD:fix/1089-bounded-schema-docker-lifecycle
