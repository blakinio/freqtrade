name: Temporary 1089 exact formatter

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/1089-bounded-schema-docker-lifecycle
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install exact validation dependencies
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check
          pytest ruff==0.15.21

      - name: Serialize same-report deploy invocations and validate
        shell: bash
        run: |
          set -euo pipefail
          expected_head=4838c91c5c4e9d3f940656d89014ec1bc86b6732
          expected_base=bbe39128b8b94aab134a216542f94a3d65c6c949
          test "$(git rev-parse HEAD)" = "$expected_head"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$expected_base"
          git merge-base --is-ancestor "$expected_base" HEAD

          python - <<'PY'
          from pathlib import Path

          bridge = Path("deploy/synology/portal-oidc/cancellation_report_bridge.py")
          source = bridge.read_text(encoding="utf-8")
          source = source.replace(
              "import json\nimport signal\n",
              "import fcntl\nimport json\nimport os\nimport signal\n",
              1,
          )

          old = '''def _reserve_current_report_path(deploy: Any, args: Any) -> None:\n    report_path = Path(args.report).resolve()\n    try:\n        if report_path.exists():\n            if not report_path.is_file():\n                raise deploy.DeploymentError(\n                    "protected deployment report path is not a regular file"\n                )\n            report_path.unlink()\n    except OSError as exc:\n        raise deploy.DeploymentError(\n            "protected deployment could not clear stale report evidence"\n        ) from exc\n    deploy._portal_current_report_path = report_path\n\n\n'''
          new = '''def _release_current_report_lock(deploy: Any) -> None:\n    lock_fd = getattr(deploy, "_portal_report_lock_fd", None)\n    deploy._portal_report_lock_fd = None\n    if isinstance(lock_fd, int):\n        try:\n            os.close(lock_fd)\n        except OSError:\n            pass\n\n\ndef _reserve_current_report_path(deploy: Any, args: Any) -> None:\n    report_path = Path(args.report).resolve()\n    lock_path = report_path.with_name(f".{report_path.name}.lock")\n    lock_fd: int | None = None\n    flags = os.O_RDWR | os.O_CREAT | os.O_CLOEXEC\n    if hasattr(os, "O_NOFOLLOW"):\n        flags |= os.O_NOFOLLOW\n    try:\n        report_path.parent.mkdir(parents=True, exist_ok=True)\n        lock_fd = os.open(lock_path, flags, 0o600)\n        try:\n            fcntl.flock(lock_fd, fcntl.LOCK_EX | fcntl.LOCK_NB)\n        except BlockingIOError as exc:\n            raise deploy.DeploymentError(\n                "protected deployment report path is already owned by another invocation"\n            ) from exc\n        deploy._portal_report_lock_fd = lock_fd\n        lock_fd = None\n        if report_path.exists():\n            if not report_path.is_file():\n                raise deploy.DeploymentError(\n                    "protected deployment report path is not a regular file"\n                )\n            report_path.unlink()\n    except deploy.DeploymentError:\n        if lock_fd is not None:\n            os.close(lock_fd)\n        _release_current_report_lock(deploy)\n        raise\n    except OSError as exc:\n        if lock_fd is not None:\n            try:\n                os.close(lock_fd)\n            except OSError:\n                pass\n        _release_current_report_lock(deploy)\n        raise deploy.DeploymentError(\n            "protected deployment could not reserve current report evidence"\n        ) from exc\n    deploy._portal_current_report_path = report_path\n\n\n'''
          if source.count(old) != 1:
              raise SystemExit("bridge: reservation replacement target mismatch")
          source = source.replace(old, new)

          old = '''    finally:\n        _restore_termination_handlers(previous_handlers)\n\n    pending = _pending_cancellation(deploy)\n'''
          new = '''    finally:\n        _release_current_report_lock(deploy)\n        _restore_termination_handlers(previous_handlers)\n\n    pending = _pending_cancellation(deploy)\n'''
          if source.count(old) != 1:
              raise SystemExit("bridge: lock release target mismatch")
          source = source.replace(old, new)

          old = '''    deploy._portal_pending_cancellation = None\n    deploy._portal_current_report_path = None\n\n    deploy._run = partial(_guarded_run, deploy, original_run)\n'''
          new = '''    deploy._portal_pending_cancellation = None\n    deploy._portal_current_report_path = None\n    deploy._portal_report_lock_fd = None\n\n    deploy._run = partial(_guarded_run, deploy, original_run)\n'''
          if source.count(old) != 1:
              raise SystemExit("bridge: install lock state target mismatch")
          bridge.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path(
              "tests/ai_platform/portal/deployment/"
              "test_portal_oidc_cancellation_report_bridge.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_overlapping_same_report_invocation_fails_before_deploy"
          if marker not in tests:
              tests += '''\n\ndef test_overlapping_same_report_invocation_fails_before_deploy(tmp_path) -> None:\n    report_path = tmp_path / "report.json"\n    report_path.write_text(\n        json.dumps(\n            {\n                "schema_version": 2,\n                "request_id": "portal-authentik-public-oidc-20260801-v1",\n                "implementation_sha": "3" * 40,\n                "status": "success",\n                "portal": {"health": "first-invocation"},\n            }\n        ),\n        encoding="utf-8",\n    )\n    first = SimpleNamespace(\n        DeploymentError=RuntimeError,\n        _portal_report_lock_fd=None,\n        _portal_current_report_path=None,\n    )\n    second = SimpleNamespace(\n        DeploymentError=RuntimeError,\n        _portal_report_lock_fd=None,\n        _portal_current_report_path=None,\n    )\n    args = SimpleNamespace(report=str(report_path))\n\n    module._reserve_current_report_path(first, args)\n    report_path.write_text(\n        json.dumps({"status": "success", "portal": {"health": "first-invocation"}}),\n        encoding="utf-8",\n    )\n    try:\n        with pytest.raises(RuntimeError, match="already owned by another invocation"):\n            module._reserve_current_report_path(second, args)\n        assert json.loads(report_path.read_text(encoding="utf-8"))["portal"] == {\n            "health": "first-invocation"\n        }\n        assert second._portal_current_report_path is None\n        assert second._portal_report_lock_fd is None\n    finally:\n        module._release_current_report_lock(first)\n\n    module._reserve_current_report_path(second, args)\n    try:\n        assert second._portal_current_report_path == report_path.resolve()\n        assert not report_path.exists()\n    finally:\n        module._release_current_report_lock(second)\n'''
              test_path.write_text(tests, encoding="utf-8")
          PY

          files=(
            deploy/synology/portal-oidc/cancellation_report_bridge.py
            tests/ai_platform/portal/deployment/test_portal_oidc_cancellation_report_bridge.py
          )
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/deployment/test_portal_oidc_cancellation_report_bridge.py
          git diff --check

          git config user.name "blakinio"
          git config user.email "75369544+blakinio@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "fix(portal): serialize cancellation report ownership"
          git push origin HEAD:fix/1089-bounded-schema-docker-lifecycle
