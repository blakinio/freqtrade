name: Temporary 1089 exact formatter

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-format.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/1089-market-evidence-host-mount
          fetch-depth: 0

      - name: Checkout task patch helper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ops/1089-synology-cleanup-20260810
          path: .task-tools
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install focused validation dependencies
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check
          pytest jsonschema "pydantic>=2.2" "SQLAlchemy>=2.0.6"
          "httpx>=0.24.1" fastapi pyjwt cryptography "PyYAML>=6.0"
          ruff==0.15.21

      - name: Apply JSON mount repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "69ad5452621b0d6fc772c42071f93bff86b24c81"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "1f62ff29f4a2a25c929218bd3b69bf19257f3055"
          python .task-tools/tools/zz-temp-1089-json-mount-patch.py

      - name: Validate exact repair
        shell: bash
        run: |
          set -euo pipefail
          files=(
            deploy/synology/portal-oidc/deploy_entrypoint.py
            tests/ai_platform/portal/deployment/test_portal_oidc_deploy_entrypoint.py
            tests/ai_platform/portal/deployment/test_portal_oidc_market_evidence_host_mount_whitespace.py
            tests/ai_platform/portal/deployment/test_portal_oidc_market_evidence_runtime.py
          )
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          python -m py_compile "${files[@]}"
          python -m pytest -q -o addopts='' --confcutdir=tests/ai_platform \
            tests/ai_platform/portal/deployment/test_portal_oidc_deploy_entrypoint.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_market_evidence_host_mount_whitespace.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_market_evidence_runtime.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_bounded_schema_lifecycle.py
          git diff --check

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "blakinio"
          git config user.email "75369544+blakinio@users.noreply.github.com"
          git add -- \
            deploy/synology/portal-oidc/deploy_entrypoint.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_deploy_entrypoint.py \
            tests/ai_platform/portal/deployment/test_portal_oidc_market_evidence_host_mount_whitespace.py
          git commit -m "fix(portal): JSON-encode Market Evidence runner inspection"
          git push origin HEAD:fix/1089-market-evidence-host-mount
