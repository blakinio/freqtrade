name: Temporary 1089 host network diagnostic

on:
  push:
    branches:
      - diag/1089-host-network-20260809

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [freqtrade-staging]
    timeout-minutes: 8
    steps:
      - name: Checkout trusted implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: 0f95b0dad5cd537a783301135605f2a10ad99f98
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            test -z "${!name:-}" || exit 1
          done
      - name: Probe host network loopback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import time

          image = 'sha256:0bd79c3bb178dba4073db9c1cb47cb22e7bc11eb32d133a28a97fd44658701fc'
          server = 'portal-1089-host-probe-server'
          port = 18767

          def run(command, timeout=15):
              return subprocess.run(command, check=False, text=True, capture_output=True, timeout=timeout)

          try:
              try:
                  run(['docker','rm','-f',server], timeout=5)
              except Exception:
                  pass
              simple = run(['docker','run','--rm','--network','host','--entrypoint','python',image,'-c',"print('HOST_RUN_OK')"], timeout=15)
              print(f"HOST_RUN starts={simple.returncode == 0 and 'HOST_RUN_OK' in simple.stdout}")
              if simple.returncode != 0:
                  raise SystemExit(2)

              start = run(['docker','run','--detach','--rm','--name',server,'--network','host','--entrypoint','python',image,
                           '-c',f"import socket,time; s=socket.socket(); s.bind(('127.0.0.1',{port})); s.listen(); time.sleep(45)"], timeout=15)
              print(f"HOST_SERVER starts={start.returncode == 0}")
              if start.returncode != 0:
                  raise SystemExit(3)
              time.sleep(1)
              client = run(['docker','run','--rm','--network','host','--entrypoint','python',image,'-c',
                            f"import socket; s=socket.create_connection(('127.0.0.1',{port}),5); s.close(); print('HOST_TCP_OK')"], timeout=15)
              print(f"HOST_TCP connects={client.returncode == 0 and 'HOST_TCP_OK' in client.stdout}")
              if client.returncode != 0:
                  raise SystemExit(4)
          finally:
              try:
                  run(['docker','rm','-f',server], timeout=5)
              except Exception:
                  pass
          PY
