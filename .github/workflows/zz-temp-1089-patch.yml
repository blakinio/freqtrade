name: Temporary 1089 protected deploy hook repair

on:
  push:
    branches:
      - fix/1089-approved-deploy-host-state-20260809

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/1089-approved-deploy-host-state-20260809
          persist-credentials: true
      - name: Apply runtime hook parity repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/agents/portal_supply_chain_runtime.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'def deploy_approved(args: argparse.Namespace) -> int:'
          function_start = text.index(anchor)
          start = text.index('    entrypoint = _module(\n', function_start)
          end = text.index('    archive_root = Path(deploy.PORTAL_STATE_DIR)', start)
          replacement = '\n'.join([
              '    entrypoint = _module(',
              '        "portal_oidc_deploy_entrypoint",',
              '        directory / "deploy_entrypoint.py",',
              '    )',
              '    docker_host_state = _module(',
              '        "portal_oidc_docker_host_state",',
              '        directory / "docker_host_state.py",',
              '    )',
              '    market_evidence = _module(',
              '        "portal_oidc_market_evidence_runtime",',
              '        directory / "market_evidence_runtime.py",',
              '    )',
              '    copy_on_write = _module(',
              '        "portal_oidc_postgresql_copy_on_write",',
              '        directory / "postgresql_copy_on_write.py",',
              '    )',
              '    setattr(  # noqa: B010',
              '        deploy,',
              '        "_discovery_from_identity_container",',
              '        lambda: discovery.deployment_probe(deploy.DeploymentError),',
              '    )',
              '    entrypoint._install_verified_build_timeout(deploy)',
              '    setattr(  # noqa: B010',
              '        deploy,',
              '        "_build_images",',
              '        lambda _repo, _sha: _approved_image_tuple(images),',
              '    )',
              '    docker_host_state.install(deploy)',
              '    entrypoint._install_docker_host_liquidations_preflight(deploy)',
              '    market_evidence.install(deploy)',
              '    copy_on_write.install(deploy)',
              '',
          ])
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/agents/portal_supply_chain_runtime.py
          git commit -m 'fix(portal): apply runtime hooks to approved deploy (#1089)'
          git push origin HEAD:fix/1089-approved-deploy-host-state-20260809
