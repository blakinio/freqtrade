name: Temporary 1089 Portal SQLite schema diff

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-snapshot-structure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zz-temp-1089-sqlite-schema-diff
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect live SQLite with approved schema code
    runs-on: [freqtrade-staging]
    timeout-minutes: 10
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET; do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Capture secret-free current-schema difference
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-sqlite-schema-diff.txt
          IMAGE: sha256:50f2230810559e16acbfe6a57ad5fe1fc8eb087bcb1dd38419129e99315c8cf9
          EXPECTED_REVISION: 21427e6b7f1cbe5e5882a007101ce6fe0c2f5784
        run: |
          set -euo pipefail
          python3 - "$REPORT" <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          report = pathlib.Path(sys.argv[1])
          image = os.environ["IMAGE"]
          expected_revision = os.environ["EXPECTED_REVISION"]
          name = f"portal-oidc-1089-schema-diff-{os.environ['GITHUB_RUN_ID']}-{os.environ.get('GITHUB_RUN_ATTEMPT', '1')}"
          rows = []

          def run(command, timeout):
              return subprocess.run(command, check=False, text=True, capture_output=True, timeout=timeout)

          def absent():
              listed = run(["docker", "ps", "-aq", "--no-trunc", "--filter", f"name=^/{name}$"], 45)
              inspected = run(["docker", "inspect", name], 45)
              return listed.returncode == 0 and not listed.stdout.strip() and inspected.returncode != 0

          if not absent():
              rows.append("preexisting_task_container=true")
              report.write_text("\n".join(rows) + "\n", encoding="utf-8")
              raise SystemExit(3)

          identity = run([
              "docker", "image", "inspect", "--format",
              '{{.Id}}|{{ index .Config.Labels "org.opencontainers.image.revision" }}', image,
          ], 45)
          expected = f"{image}|{expected_revision}"
          rows.append(f"image_identity_match={identity.returncode == 0 and identity.stdout.strip() == expected}")
          if identity.returncode != 0 or identity.stdout.strip() != expected:
              report.write_text("\n".join(rows) + "\n", encoding="utf-8")
              raise SystemExit(4)

          script = r'''
          import json
          from ai_platform.portal.control_plane.database import build_engine
          from ai_platform.portal.database.schema import schema_status

          engine = build_engine('sqlite+pysqlite:////state/portal.db')
          try:
              status = schema_status(engine)
              differences = status['differences']
              payload = {
                  'status': status['status'],
                  'applied_revisions': status['applied_revisions'],
                  'missing_tables': differences['missing_tables'],
                  'unexpected_tables': differences['unexpected_tables'],
                  'changed_table_names': sorted(differences['changed_tables']),
              }
              print(json.dumps(payload, sort_keys=True, separators=(',', ':')))
          finally:
              engine.dispose()
          '''
          create = [
              "docker", "create", "--name", name,
              "--network", "none",
              "--read-only",
              "--tmpfs", "/tmp:rw,noexec,nosuid,nodev,size=32m",
              "--cap-drop", "ALL",
              "--security-opt", "no-new-privileges:true",
              "--pids-limit", "64",
              "--memory", "256m",
              "--user", "10001:10001",
              "--mount", "type=bind,src=/volume1/docker/freqtrade-portal-oidc/data,dst=/state,readonly",
              "--entrypoint", "python", image, "-c", script,
          ]
          process_exit = 99
          cleanup_ok = False
          try:
              created = run(create, 180)
              rows.append(f"create_rc={created.returncode}")
              if created.returncode != 0:
                  raise RuntimeError("create failed")
              started = run(["docker", "start", name], 180)
              rows.append(f"start_rc={started.returncode}")
              if started.returncode != 0:
                  raise RuntimeError("start failed")
              waited = run(["docker", "wait", name], 180)
              rows.append(f"wait_rc={waited.returncode}")
              if waited.returncode != 0 or not waited.stdout.strip().isdigit():
                  raise RuntimeError("wait failed")
              process_exit = int(waited.stdout.strip())
              rows.append(f"process_exit={process_exit}")
              logs = run(["docker", "logs", name], 120)
              rows.append(f"logs_rc={logs.returncode}")
              if logs.returncode != 0:
                  raise RuntimeError("logs failed")
              if process_exit == 0:
                  payload = json.loads(logs.stdout.strip())
                  rows.append("schema_status=" + json.dumps(payload, sort_keys=True, separators=(",", ":")))
          finally:
              try:
                  run(["docker", "rm", "-f", name], 120)
              except subprocess.TimeoutExpired:
                  pass
              cleanup_ok = absent()
              rows.append(f"container_absent={cleanup_ok}")
              daemon = run(["docker", "version"], 45)
              rows.append(f"docker_ready={daemon.returncode == 0}")
              report.write_text("\n".join(rows) + "\n", encoding="utf-8")

          if process_exit != 0 or not cleanup_ok:
              raise SystemExit(5)
          PY

      - name: Upload schema difference evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synology-1089-sqlite-schema-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synology-1089-sqlite-schema-diff.txt
          if-no-files-found: error
          retention-days: 14
