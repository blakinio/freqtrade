name: Temporary 1089 Portal live runtime provenance

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-snapshot-structure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zz-temp-1089-runtime-provenance
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect live Portal runtime metadata read-only
    runs-on: [freqtrade-staging]
    timeout-minutes: 10
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET; do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Capture secret-free runtime provenance
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-runtime-provenance.txt
          CONTROL: freqtrade-portal-control-plane
          WEB: freqtrade-portal-staging
          POSTGRES: freqtrade-portal-postgresql
        run: |
          set -euo pipefail
          python3 - "$REPORT" <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          report = pathlib.Path(sys.argv[1])
          control = os.environ["CONTROL"]
          rows = []
          known_legacy = "/var/lib/freqtrade-staging-state/portal-oidc-public/data"
          canonical = "/volume1/docker/freqtrade-portal-oidc/data"

          def run(command, timeout=60):
              return subprocess.run(command, check=False, text=True, capture_output=True, timeout=timeout)

          for name in (control, os.environ["WEB"], os.environ["POSTGRES"]):
              inspected = run(["docker", "inspect", name])
              rows.append(f"{name}.inspect_rc={inspected.returncode}")
              if inspected.returncode != 0:
                  continue
              payload = json.loads(inspected.stdout)[0]
              state = payload.get("State", {})
              health = (state.get("Health") or {}).get("Status", "none")
              rows.append(f"{name}.state={state.get('Status','unknown')}|{health}")
              image_id = payload.get("Image", "")
              rows.append(f"{name}.image_id={image_id}")
              image = run(["docker", "image", "inspect", image_id])
              if image.returncode == 0:
                  image_payload = json.loads(image.stdout)[0]
                  labels = (image_payload.get("Config") or {}).get("Labels") or {}
                  rows.append(f"{name}.revision={labels.get('org.opencontainers.image.revision','missing')}")
              state_mounts = [
                  mount for mount in (payload.get("Mounts") or [])
                  if mount.get("Destination") in {"/state", "/portal-state"}
              ]
              rows.append(f"{name}.state_mount_count={len(state_mounts)}")
              for mount in state_mounts:
                  destination = mount.get("Destination", "")
                  source_text = mount.get("Source", "")
                  source = pathlib.PurePosixPath(source_text)
                  if source_text == known_legacy:
                      source_class = "known_legacy_public"
                  elif source_text == canonical:
                      source_class = "canonical_volume1"
                  else:
                      source_class = "unknown"
                  rows.append(f"{name}.state_mount_destination={destination}")
                  rows.append(f"{name}.state_mount_leaf={source.name}")
                  rows.append(f"{name}.state_mount_class={source_class}")

          script = r'''
          import hashlib
          import inspect
          import os
          import sqlite3
          from pathlib import Path
          from ai_platform.portal.control_plane.database import Base
          import ai_platform.portal.identity.models as identity_models
          import ai_platform.portal.product.models as product_models

          database_url = os.environ.get('PORTAL_DATABASE_URL', '')
          print('database_url_is_legacy_sqlite=' + str(database_url == 'sqlite+pysqlite:////state/portal.db'))
          print('environment=' + os.environ.get('PORTAL_ENVIRONMENT','missing'))
          print('identity_model_tables=' + ','.join(sorted(table.name for table in Base.metadata.sorted_tables if table.name.startswith('portal_identity') or table.name.startswith('portal_tenant') or table.name.startswith('portal_oidc') or table.name.startswith('portal_session'))))
          model_path = Path(inspect.getsourcefile(identity_models) or '')
          if model_path.is_file():
              print('identity_models_sha256=' + hashlib.sha256(model_path.read_bytes()).hexdigest())
          if database_url == 'sqlite+pysqlite:////state/portal.db':
              uri = 'file:/state/portal.db?mode=ro'
              with sqlite3.connect(uri, uri=True) as conn:
                  names = [row[0] for row in conn.execute("SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'portal_%' ORDER BY name")]
                  print('actual_portal_tables=' + ','.join(names))
          '''
          result = run(["docker", "exec", control, "python", "-c", script], 120)
          rows.append(f"runtime_probe_rc={result.returncode}")
          if result.returncode == 0:
              rows.extend(line for line in result.stdout.splitlines() if line.strip())
          else:
              rows.append("runtime_probe_failed=true")

          daemon = run(["docker", "version"], 45)
          rows.append(f"docker_ready={daemon.returncode == 0}")
          report.write_text("\n".join(rows) + "\n", encoding="utf-8")
          if result.returncode != 0 or daemon.returncode != 0:
              raise SystemExit(2)
          PY

      - name: Upload runtime provenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synology-1089-runtime-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synology-1089-runtime-provenance.txt
          if-no-files-found: error
          retention-days: 14
