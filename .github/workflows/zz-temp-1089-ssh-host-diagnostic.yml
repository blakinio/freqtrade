name: Temporary 1089 Synology SSH host diagnostic

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-ssh-host-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zz-temp-1089-synology-ssh-host-diagnostic
  cancel-in-progress: false

jobs:
  measure:
    name: Measure loaded Synology Docker lifecycle bounds
    runs-on: [freqtrade-staging]
    timeout-minutes: 15
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET; do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Measure exact pinned probe lifecycle under current load
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-loaded-lifecycle.txt
        run: |
          set -u
          set +e
          : > "$REPORT"
          image='docker.io/library/postgres:16.13-alpine3.23@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777'
          probe="portal-oidc-measure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          record() {
            label="$1"; seconds="$2"; shift 2
            started=$(date +%s)
            timeout --kill-after=5 "$seconds" "$@" >> "$REPORT" 2>&1
            rc=$?
            ended=$(date +%s)
            printf '%s_rc=%s\n%s_elapsed_seconds=%s\n' "$label" "$rc" "$label" "$((ended-started))" | tee -a "$REPORT"
            return "$rc"
          }
          record docker_version 30 docker version || true
          record docker_info 30 docker info || true
          stale="$(timeout --kill-after=3 20 docker ps -a --format '{{.Names}}' 2>/dev/null | grep -E '^portal-oidc-(runtime-preflight|measure)-' || true)"
          if [[ -n "$stale" ]]; then
            while IFS= read -r name; do
              [[ -n "$name" ]] || continue
              record "stale_remove_${name}" 120 docker rm -f "$name" || true
            done <<< "$stale"
          fi
          failures=0
          record create 180 docker create --name "$probe" --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --entrypoint /bin/true "$image" || failures=$((failures+1))
          if timeout --kill-after=3 20 docker inspect "$probe" >/dev/null 2>&1; then
            record start 180 docker start "$probe" || failures=$((failures+1))
            record wait 120 docker wait "$probe" || failures=$((failures+1))
            record inspect 30 docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' "$probe" || failures=$((failures+1))
            record remove 120 docker rm -f "$probe" || failures=$((failures+1))
          else
            echo 'probe_missing_after_create=true' | tee -a "$REPORT"
            failures=$((failures+1))
          fi
          record post_docker_version 30 docker version || failures=$((failures+1))
          leak="$(timeout --kill-after=3 20 docker inspect "$probe" >/dev/null 2>&1; echo $?)"
          if [[ "$leak" == 0 ]]; then echo 'probe_leaked=true' | tee -a "$REPORT"; failures=$((failures+1)); else echo 'probe_leaked=false' | tee -a "$REPORT"; fi
          echo "measure_failures=$failures" | tee -a "$REPORT"
          [[ "$failures" -eq 0 ]]

      - name: Upload loaded lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synology-1089-loaded-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synology-1089-loaded-lifecycle.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish summary
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-loaded-lifecycle.txt
        run: |
          {
            echo '## Synology #1089 loaded lifecycle measurement'
            echo
            [[ -f "$REPORT" ]] && grep -E '^(docker_|stale_|create_|start_|wait_|inspect_|remove_|post_|probe_|measure_)' "$REPORT" | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup local evidence
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-loaded-lifecycle.txt
        run: rm -f -- "$REPORT"
