name: Temporary 1089 Synology SSH host diagnostic

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-ssh-host-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Restore existing containers and verify exact Portal preflight
    runs-on: [freqtrade-staging]
    timeout-minutes: 12
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET; do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Restore exact pre-restart containers that still exist
        id: restore
        shell: bash
        env:
          RESULT: ${{ runner.temp }}/synology-1089-container-restore.txt
        run: |
          set -u
          set +e
          : > "$RESULT"
          failures=0
          for name in \
            wickhunter-production-research-runtime-wickhunter-production-research-runtime-1 \
            freqtrade-portal-postgresql \
            wickhunter-paper-runtime-v12
          do
            exists="$(timeout 10 docker inspect --format '{{.State.Status}}' "$name" 2>/dev/null || true)"
            echo "before_${name}=${exists:-missing}" >> "$RESULT"
            if [[ -n "$exists" && "$exists" != running ]]; then
              started=$(date +%s)
              timeout --kill-after=5 120 docker start "$name" >> "$RESULT" 2>&1
              rc=$?
              ended=$(date +%s)
              printf 'start_%s_rc=%s\nstart_%s_elapsed_seconds=%s\n' "$name" "$rc" "$name" "$((ended-started))" | tee -a "$RESULT"
              [[ "$rc" -eq 0 ]] || failures=$((failures+1))
            fi
            state="$(timeout 10 docker inspect --format '{{.State.Status}}' "$name" 2>/dev/null || true)"
            echo "after_${name}=${state:-missing}" | tee -a "$RESULT"
            [[ "$state" == running ]] || failures=$((failures+1))
          done
          missing_name='wickhunter-wh09-egress-v12'
          missing_state="$(timeout 10 docker inspect --format '{{.State.Status}}' "$missing_name" 2>/dev/null || true)"
          echo "after_${missing_name}=${missing_state:-missing}" | tee -a "$RESULT"
          echo "restore_failures=$failures" | tee -a "$RESULT"
          [[ "$failures" -eq 0 ]]

      - name: Verify exact protected preflight twice
        id: preflight
        shell: bash
        env:
          RESULT: ${{ runner.temp }}/synology-1089-exact-preflight.txt
        run: |
          set -u
          set +e
          : > "$RESULT"
          image='docker.io/library/postgres:16.13-alpine3.23@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777'
          failures=0
          for attempt in 1 2; do
            probe="portal-oidc-exact-${GITHUB_RUN_ID}-${attempt}"
            timeout 20 docker rm -f "$probe" >/dev/null 2>&1 || true
            started=$(date +%s)
            timeout --kill-after=5 20 docker run --rm --name "$probe" --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --entrypoint /bin/true "$image" >> "$RESULT" 2>&1
            rc=$?
            ended=$(date +%s)
            printf 'exact_preflight_%s_rc=%s\nexact_preflight_%s_elapsed_seconds=%s\n' "$attempt" "$rc" "$attempt" "$((ended-started))" | tee -a "$RESULT"
            [[ "$rc" -eq 0 ]] || failures=$((failures+1))
            timeout 20 docker rm -f "$probe" >/dev/null 2>&1 || true
            sleep 3
          done
          timeout 15 docker version >/dev/null 2>&1
          post_rc=$?
          echo "post_docker_version_rc=$post_rc" | tee -a "$RESULT"
          [[ "$post_rc" -eq 0 ]] || failures=$((failures+1))
          leaks="$(timeout 15 docker ps -a --format '{{.Names}}' 2>/dev/null | grep -E '^portal-oidc-exact-' || true)"
          [[ -z "$leaks" ]] || failures=$((failures+1))
          echo "preflight_leaks=$([ -z "$leaks" ] && echo none || echo present)" | tee -a "$RESULT"
          echo "preflight_failures=$failures" | tee -a "$RESULT"
          [[ "$failures" -eq 0 ]]

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synology-1089-restored-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/synology-1089-container-restore.txt
            ${{ runner.temp }}/synology-1089-exact-preflight.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish summary
        if: always()
        shell: bash
        env:
          RESTORE: ${{ runner.temp }}/synology-1089-container-restore.txt
          PREFLIGHT: ${{ runner.temp }}/synology-1089-exact-preflight.txt
        run: |
          {
            echo '## Synology #1089 post-restart restore + exact preflight'
            echo
            [[ -f "$RESTORE" ]] && grep -E '^(after_|start_|restore_failures=)' "$RESTORE" | sed 's/^/- /' || true
            [[ -f "$PREFLIGHT" ]] && grep -E '^(exact_preflight_[12]_(rc|elapsed_seconds)|post_docker_version_rc|preflight_leaks|preflight_failures)=' "$PREFLIGHT" | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup local evidence
        if: always()
        shell: bash
        env:
          RESTORE: ${{ runner.temp }}/synology-1089-container-restore.txt
          PREFLIGHT: ${{ runner.temp }}/synology-1089-exact-preflight.txt
        run: rm -f -- "$RESTORE" "$PREFLIGHT"
