name: Temporary 1089 Synology SSH host diagnostic

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-ssh-host-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Inspect Docker Btrfs metadata and attributable image pressure
    runs-on: [freqtrade-staging]
    timeout-minutes: 10
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET; do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Collect Docker inventory
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-docker-inventory.txt
        run: |
          set -euo pipefail
          {
            echo '===== docker info ====='
            timeout 30 docker info --format 'ServerVersion={{.ServerVersion}} StorageDriver={{.Driver}} DockerRootDir={{.DockerRootDir}} Containers={{.Containers}} ContainersRunning={{.ContainersRunning}} ContainersStopped={{.ContainersStopped}} Images={{.Images}} DriverStatus={{json .DriverStatus}}'
            echo '===== system df ====='
            timeout 60 docker system df || true
            echo '===== used image ids ====='
            for cid in $(timeout 20 docker ps -aq); do timeout 10 docker inspect --format '{{.Image}}' "$cid" 2>/dev/null || true; done | sort -u
            echo '===== attributable project images ====='
            timeout 30 docker image ls --no-trunc --format '{{.ID}}\t{{.Repository}}\t{{.Tag}}\t{{.CreatedSince}}' | grep -Ei 'freqtrade|portal|wickhunter|quant' || true
            echo '===== dangling images ====='
            timeout 30 docker image ls --filter dangling=true --no-trunc --format '{{.ID}}\t{{.Repository}}\t{{.Tag}}\t{{.CreatedSince}}' || true
            echo '===== wh09 egress ====='
            timeout 20 docker inspect --format 'name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} restart={{.HostConfig.RestartPolicy.Name}} image={{.Config.Image}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' wickhunter-wh09-egress-v12 2>/dev/null || true
          } > "$REPORT" 2>&1

      - name: Prepare SSH client
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SYNOLOGY_SSH_HOST }}
          SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SSH_USER: ${{ secrets.SYNOLOGY_SSH_USER || vars.SYNOLOGY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SYNOLOGY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SYNOLOGY_SSH_KNOWN_HOSTS }}
          SSH_DIR: ${{ runner.temp }}/ssh-1089
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do test -n "${!name:-}" || exit 2; done
          install -d -m 0700 "$SSH_DIR"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/id"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 0600 "$SSH_DIR/id" "$SSH_DIR/known_hosts"

      - name: Collect Btrfs metadata evidence
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SYNOLOGY_SSH_HOST }}
          SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SSH_USER: ${{ secrets.SYNOLOGY_SSH_USER || vars.SYNOLOGY_SSH_USER }}
          SSH_DIR: ${{ runner.temp }}/ssh-1089
          REPORT: ${{ runner.temp }}/synology-1089-btrfs-metadata.txt
        run: |
          set -euo pipefail
          ssh_opts=(-i "$SSH_DIR/id" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$SSH_DIR/known_hosts" -o ConnectTimeout=10 -o LogLevel=ERROR)
          timeout 180 ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" 'sh -s' > "$REPORT" 2>&1 <<'REMOTE'
          set -u
          echo '===== volume1 filesystem usage ====='
          timeout 60 sudo -n /sbin/btrfs filesystem usage -T /volume1 2>&1 || true
          echo '===== volume1 filesystem df ====='
          timeout 30 sudo -n /sbin/btrfs filesystem df /volume1 2>&1 || true
          echo '===== volume1 balance status ====='
          timeout 30 sudo -n /sbin/btrfs balance status /volume1 2>&1 || true
          echo '===== volume1 scrub status ====='
          timeout 30 sudo -n /sbin/btrfs scrub status /volume1 2>&1 || true
          echo '===== docker subvolume count ====='
          timeout 90 sudo -n /sbin/btrfs subvolume list -o /volume1/@docker 2>/dev/null | wc -l || true
          echo '===== qgroup summary ====='
          timeout 30 sudo -n /sbin/btrfs qgroup show /volume1 2>&1 | head -n 40 || true
          echo '===== pressure ====='
          cat /proc/loadavg
          cat /proc/pressure/io 2>/dev/null || true
          command -v iostat >/dev/null 2>&1 && timeout 15 iostat -xz 1 2 || true
          REMOTE

      - name: Upload metadata evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synology-1089-btrfs-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/synology-1089-docker-inventory.txt
            ${{ runner.temp }}/synology-1089-btrfs-metadata.txt
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        env:
          SSH_DIR: ${{ runner.temp }}/ssh-1089
          DOCKER_REPORT: ${{ runner.temp }}/synology-1089-docker-inventory.txt
          BTRFS_REPORT: ${{ runner.temp }}/synology-1089-btrfs-metadata.txt
        run: |
          rm -rf -- "$SSH_DIR"
          rm -f -- "$DOCKER_REPORT" "$BTRFS_REPORT"
