name: Temporary 1089 Synology SSH host diagnostic

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-ssh-host-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zz-temp-1089-synology-ssh-host-diagnostic
  cancel-in-progress: false

jobs:
  validate:
    name: Run calibrated PR 1454 preflight twice on Synology
    runs-on: [freqtrade-staging]
    timeout-minutes: 25
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET; do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Checkout exact calibrated preflight repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: 6ae3439986c2852130cc18bd692bba18fdc8c93e

      - name: Run exact repaired runtime preflight twice
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-calibrated-preflight.txt
        run: |
          set -euo pipefail
          : > "$REPORT"
          for attempt in 1 2; do
            started=$(date +%s)
            output="$(python3 deploy/synology/portal-oidc/docker_runtime_preflight.py)"
            ended=$(date +%s)
            printf 'attempt_%s_elapsed_seconds=%s\n%s\n' "$attempt" "$((ended-started))" "$output" | tee -a "$REPORT"
            grep -F '"status": "ready"' <<< "$output"
            grep -F '"disposable_container_start": true' <<< "$output"
            grep -F '"secret_values_recorded": false' <<< "$output"
            grep -F '"live_capital_authorized": false' <<< "$output"
          done
          leaks="$(timeout 30 docker ps -a --format '{{.Names}}' | grep -E '^portal-oidc-runtime-preflight-' || true)"
          [[ -z "$leaks" ]]
          echo 'probe_leaks=none' | tee -a "$REPORT"
          timeout 30 docker version >/dev/null
          echo 'post_docker_version=ok' | tee -a "$REPORT"

      - name: Upload calibrated preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synology-1089-calibrated-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synology-1089-calibrated-preflight.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish summary
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-calibrated-preflight.txt
        run: |
          {
            echo '## Synology #1089 calibrated preflight validation'
            echo
            [[ -f "$REPORT" ]] && sed 's/^/- /' "$REPORT" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup local evidence
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-calibrated-preflight.txt
        run: rm -f -- "$REPORT"
