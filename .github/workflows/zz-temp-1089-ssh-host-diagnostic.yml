name: Temporary 1089 Synology SSH host diagnostic

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-ssh-host-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-1089-synology-ssh-host-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Diagnose Synology Docker runtime through SSH
    runs-on: [freqtrade-staging]
    timeout-minutes: 25
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Prepare bounded SSH client
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SYNOLOGY_SSH_HOST }}
          SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SSH_USER: ${{ secrets.SYNOLOGY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SYNOLOGY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SYNOLOGY_SSH_KNOWN_HOSTS }}
          SSH_DIR: ${{ runner.temp }}/ssh-1089
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "required SSH input is missing: $name" >&2; exit 1; }
          done
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          install -d -m 0700 "$SSH_DIR"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/id"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 0600 "$SSH_DIR/id" "$SSH_DIR/known_hosts"

      - name: Collect and sanitize host and Docker evidence
        id: collect
        continue-on-error: true
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SYNOLOGY_SSH_HOST }}
          SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SSH_USER: ${{ secrets.SYNOLOGY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SYNOLOGY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SYNOLOGY_SSH_KNOWN_HOSTS }}
          SSH_DIR: ${{ runner.temp }}/ssh-1089
          REPORT: ${{ runner.temp }}/synology-1089-host-diagnostic.txt
          REMOTE_SCRIPT: ${{ runner.temp }}/synology-1089-diagnostic.sh
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$SSH_DIR/id"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_DIR/known_hosts"
            -o ConnectTimeout=10
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o LogLevel=ERROR
          )

          cat > "$REMOTE_SCRIPT" <<'REMOTE'
          #!/bin/sh
          set -u

          section() { printf '\n===== %s =====\n' "$1"; }
          if command -v timeout >/dev/null 2>&1; then
            run_timeout() { timeout "$@"; }
            timeout_provider=timeout
          elif command -v busybox >/dev/null 2>&1 && busybox timeout 1 true >/dev/null 2>&1; then
            run_timeout() { busybox timeout "$@"; }
            timeout_provider='busybox timeout'
          else
            printf 'FATAL: no bounded timeout implementation is available on the host\n' >&2
            exit 90
          fi

          bounded() {
            seconds="$1"; label="$2"; shift 2
            printf '+ %s (timeout=%ss)\n' "$label" "$seconds"
            run_timeout "$seconds" "$@" 2>&1
            rc=$?
            printf '[exit=%s]\n' "$rc"
            return 0
          }

          shell_bounded() {
            seconds="$1"; label="$2"; text="$3"
            printf '+ %s (timeout=%ss)\n' "$label" "$seconds"
            run_timeout "$seconds" sh -c "$text" 2>&1
            rc=$?
            printf '[exit=%s]\n' "$rc"
            return 0
          }

          have_sudo=false
          if command -v sudo >/dev/null 2>&1 && run_timeout 5 sudo -n true >/dev/null 2>&1; then have_sudo=true; fi
          root_shell() {
            seconds="$1"; label="$2"; text="$3"
            printf '+ %s (timeout=%ss)\n' "$label" "$seconds"
            if [ "$have_sudo" != true ]; then printf 'SKIPPED: passwordless sudo unavailable\n'; return 0; fi
            run_timeout "$seconds" sudo -n sh -c "$text" 2>&1
            rc=$?
            printf '[exit=%s]\n' "$rc"
            return 0
          }

          section 'diagnostic metadata'
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
          date '+local=%Y-%m-%dT%H:%M:%S%z'
          printf 'host=%s\n' "$(hostname 2>/dev/null || printf unknown)"
          printf 'timeout_provider=%s\n' "$timeout_provider"
          printf 'passwordless_sudo=%s\n' "$have_sudo"

          section 'identity and host'
          bounded 10 id id
          shell_bounded 10 groups groups
          bounded 10 uname uname -a
          bounded 10 uptime uptime
          shell_bounded 10 'DSM defaults version' 'sed -n "1,160p" /etc.defaults/VERSION 2>/dev/null || true'
          shell_bounded 10 'DSM active version' 'sed -n "1,160p" /etc/VERSION 2>/dev/null || true'

          section 'memory and pressure'
          shell_bounded 10 memory 'free -h 2>/dev/null || sed -n "1,120p" /proc/meminfo'
          shell_bounded 10 pressure 'cat /proc/loadavg; for f in /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory; do [ -r "$f" ] && { echo "-- $f"; cat "$f"; }; done'
          shell_bounded 15 vmstat 'command -v vmstat >/dev/null 2>&1 && vmstat 1 5 || true'
          shell_bounded 20 iostat 'command -v iostat >/dev/null 2>&1 && iostat -xz 1 3 || true'

          section 'filesystem capacity inodes and mounts'
          shell_bounded 20 df 'df -hT 2>/dev/null || df -h'
          shell_bounded 20 inodes 'df -hi 2>/dev/null || df -i 2>/dev/null || true'
          shell_bounded 20 mounts 'if command -v findmnt >/dev/null 2>&1; then findmnt -rno TARGET,SOURCE,FSTYPE,OPTIONS; else mount; fi'
          shell_bounded 20 'Docker/temp capacity' 'for p in /var/lib/docker /volume1/@docker /volume1/docker /tmp /var/tmp /run; do [ -e "$p" ] || continue; echo "-- $p"; df -h "$p" 2>&1 || true; df -i "$p" 2>&1 || true; done'

          section 'Btrfs status and error counters'
          root_shell 60 btrfs 'command -v btrfs >/dev/null 2>&1 || exit 0; btrfs filesystem show || true; if command -v findmnt >/dev/null 2>&1; then targets=$(findmnt -rn -t btrfs -o TARGET 2>/dev/null); else targets=$(grep -E "[[:space:]]btrfs[[:space:]]" /proc/mounts 2>/dev/null | tr -s " " | cut -d" " -f2); fi; printf "%s\n" "$targets" | while IFS= read -r target; do [ -n "$target" ] || continue; echo "-- target=$target"; btrfs filesystem usage -T "$target" 2>&1 || true; btrfs device stats "$target" 2>&1 || true; btrfs scrub status "$target" 2>&1 || true; done'

          section 'Container Manager package and service discovery'
          shell_bounded 20 packages 'pkgcmd=""; for candidate in synopkg /usr/syno/bin/synopkg; do if command -v "$candidate" >/dev/null 2>&1 || [ -x "$candidate" ]; then pkgcmd="$candidate"; break; fi; done; if [ -n "$pkgcmd" ]; then "$pkgcmd" list 2>&1 | grep -Ei "container|docker" || true; else echo "synopkg unavailable"; fi'
          root_shell 30 'package/service status' 'pkgcmd=""; for candidate in synopkg /usr/syno/bin/synopkg; do if command -v "$candidate" >/dev/null 2>&1 || [ -x "$candidate" ]; then pkgcmd="$candidate"; break; fi; done; if [ -n "$pkgcmd" ]; then for pkg in $("$pkgcmd" list 2>/dev/null | sed -n "s/^\([^ -][^ -]*\).*/\1/p" | grep -Ei "container|docker" || true); do echo "-- package=$pkg"; "$pkgcmd" status "$pkg" 2>&1 || true; done; fi; ps -ef 2>/dev/null | grep -E "dockerd|containerd" | grep -v grep || true'

          section 'Docker socket daemon and containerd responsiveness'
          shell_bounded 10 socket 'ls -l /var/run/docker.sock 2>&1 || true'
          shell_bounded 10 ping 'if command -v curl >/dev/null 2>&1; then curl --fail --silent --show-error --max-time 5 --unix-socket /var/run/docker.sock http://localhost/_ping; echo; else echo "curl unavailable"; fi'
          bounded 20 'docker version' docker version
          shell_bounded 30 'docker info' 'docker info --format "ServerVersion={{.ServerVersion}}\nStorageDriver={{.Driver}}\nDockerRootDir={{.DockerRootDir}}\nCgroupDriver={{.CgroupDriver}}\nContainers={{.Containers}}\nContainersRunning={{.ContainersRunning}}\nContainersStopped={{.ContainersStopped}}\nImages={{.Images}}\nOperatingSystem={{.OperatingSystem}}\nKernelVersion={{.KernelVersion}}\nNCPU={{.NCPU}}\nMemTotal={{.MemTotal}}\nLiveRestoreEnabled={{.LiveRestoreEnabled}}\nDriverStatus={{json .DriverStatus}}"'
          shell_bounded 20 'Docker root capacity' 'root=$(docker info --format "{{.DockerRootDir}}" 2>/dev/null || true); [ -n "$root" ] || exit 0; echo "DockerRootDir=$root"; df -h "$root" 2>&1 || true; df -i "$root" 2>&1 || true'
          shell_bounded 30 'docker system df' 'docker system df'
          shell_bounded 30 'docker ps -a' 'docker ps -a --no-trunc --format "{{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}"'
          shell_bounded 20 builders 'docker builder ls 2>&1 || true; docker buildx ls 2>&1 || true'
          root_shell 20 containerd 'if command -v ctr >/dev/null 2>&1; then for sock in /var/run/docker/containerd/containerd.sock /run/containerd/containerd.sock; do [ -S "$sock" ] || continue; echo "-- socket=$sock"; ctr --address "$sock" version 2>&1 || true; done; else echo "ctr unavailable"; fi'

          section 'restart policies and health'
          shell_bounded 40 containers 'for cid in $(docker ps -aq 2>/dev/null); do docker inspect --format "{{.Id}}\t{{.Name}}\tstatus={{.State.Status}}\thealth={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}\trestart={{.HostConfig.RestartPolicy.Name}}\timage={{.Config.Image}}" "$cid" 2>/dev/null || true; done'

          section 'runtime process inventory'
          shell_bounded 20 runtime_procs 'ps -eo pid,ppid,state,etime,wchan:32,comm 2>/dev/null | { head -n 1; grep -E "(dockerd|containerd|containerd-shim|buildkitd|buildkit-runc|runc)$" || true; }'
          root_shell 20 dstate 'for pid in $(ps -eo pid=,state=,comm= 2>/dev/null | grep -E "[[:space:]]D[^[:space:]]*[[:space:]]+(dockerd|containerd|containerd-shim|buildkitd|buildkit-runc|runc)$" | awk "{print \$1}"); do echo "-- pid=$pid"; cat "/proc/$pid/wchan" 2>/dev/null || true; sed -n "1,80p" "/proc/$pid/status" 2>/dev/null || true; cat "/proc/$pid/stack" 2>/dev/null || true; done'

          section 'targeted daemon and kernel logs'
          root_shell 60 'journal 13:12-13:18 UTC' 'command -v journalctl >/dev/null 2>&1 || exit 0; journalctl --utc --no-pager --since "2026-08-10 13:12:00" --until "2026-08-10 13:18:59" 2>/dev/null | grep -Ei "docker|containerd|buildkit|shim|btrfs|overlay|oom|out of memory|hung|blocked|I/O|error|fail" | tail -n 500 || true'
          root_shell 60 'journal 15:20-15:22 UTC' 'command -v journalctl >/dev/null 2>&1 || exit 0; journalctl --utc --no-pager --since "2026-08-10 15:20:00" --until "2026-08-10 15:22:59" 2>/dev/null | grep -Ei "docker|containerd|buildkit|shim|btrfs|overlay|oom|out of memory|hung|blocked|I/O|error|fail" | tail -n 500 || true'
          root_shell 60 'recent daemon journal' 'command -v journalctl >/dev/null 2>&1 || exit 0; journalctl --utc --no-pager --since "6 hours ago" 2>/dev/null | grep -Ei "docker|containerd|buildkit|shim" | tail -n 500 || true'
          root_shell 60 'recent kernel faults' 'if command -v dmesg >/dev/null 2>&1; then (dmesg -T 2>/dev/null || dmesg 2>/dev/null) | grep -Ei "oom|out of memory|hung task|blocked for more than|I/O error|btrfs|overlay|containerd|dockerd|nvme|ata.*(error|reset)|filesystem error" | tail -n 500 || true; fi'
          root_shell 60 'DSM log candidates' 'for f in /var/log/messages /var/log/synopkg.log /var/log/packages/ContainerManager.log /var/log/packages/Docker.log /var/packages/ContainerManager/var/log/*.log /var/packages/Docker/var/log/*.log; do [ -f "$f" ] || continue; echo "-- $f"; tail -n 500 "$f" 2>/dev/null | grep -Ei "2026-08-10|docker|containerd|buildkit|shim|btrfs|overlay|oom|hung|blocked|I/O|error|fail" | tail -n 250 || true; done'

          section 'minimal existing-image create start remove lifecycle probe'
          probe="ft-1089-runtime-probe-$$"
          cleanup() { run_timeout 20 docker rm -f "$probe" >/dev/null 2>&1 || true; }
          trap cleanup 0 1 2 15
          if run_timeout 10 docker image inspect alpine:3.23 >/dev/null 2>&1; then
            started=$(date +%s)
            run_timeout 30 docker create --name "$probe" --network none alpine:3.23 true 2>&1
            create_rc=$?; printf 'probe_create_rc=%s\n' "$create_rc"
            start_rc=not_run; remove_rc=not_run
            if [ "$create_rc" -eq 0 ]; then
              run_timeout 45 docker start -a "$probe" 2>&1
              start_rc=$?; printf 'probe_start_rc=%s\n' "$start_rc"
              run_timeout 30 docker rm "$probe" 2>&1
              remove_rc=$?; printf 'probe_remove_rc=%s\n' "$remove_rc"
            else
              printf 'probe_start_rc=%s\nprobe_remove_rc=%s\n' "$start_rc" "$remove_rc"
            fi
            ended=$(date +%s); printf 'minimal_lifecycle_elapsed_seconds=%s\n' "$((ended-started))"
          else
            printf 'probe_create_rc=skipped_image_absent\nprobe_start_rc=not_run\nprobe_remove_rc=not_run\n'
          fi
          trap - 0 1 2 15

          section 'post-probe responsiveness'
          bounded 20 'post docker version' docker version
          shell_bounded 30 'post docker system df' 'docker system df'
          REMOTE
          chmod 0700 "$REMOTE_SCRIPT"

          set +e
          timeout 1100 ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" 'sh -s' < "$REMOTE_SCRIPT" > "$REPORT" 2>&1
          ssh_rc=$?
          set -e
          printf '\nssh_exit=%s\n' "$ssh_rc" >> "$REPORT"

          python3 - "$REPORT" <<'PY'
          import os, pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding='utf-8', errors='replace')
          for name in ('SSH_HOST','SSH_USER','SSH_PRIVATE_KEY','SSH_KNOWN_HOSTS'):
              value = os.environ.get(name, '')
              if value:
                  text = text.replace(value, f'[REDACTED_{name}]')
          text = re.sub(r'-----BEGIN [^-\n]*PRIVATE KEY-----.*?-----END [^-\n]*PRIVATE KEY-----', '[REDACTED_PRIVATE_KEY_BLOCK]', text, flags=re.S)
          text = re.sub(r'(?i)((?:authorization|bearer|password|passwd|secret|token|api[_-]?key)\s*[:=]\s*)[^\s,;]+', r'\1[REDACTED]', text)
          text = re.sub(r'\bgh[pousr]_[A-Za-z0-9_]{20,}\b', '[REDACTED_GITHUB_TOKEN]', text)
          text = re.sub(r'\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b', '[REDACTED_JWT]', text)
          path.write_text(text, encoding='utf-8')
          PY
          printf 'ssh_exit=%s\nreport_bytes=%s\n' "$ssh_rc" "$(wc -c < "$REPORT")" >> "$GITHUB_OUTPUT"

      - name: Upload bounded diagnostic artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synology-1089-host-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/synology-1089-host-diagnostic.txt
          if-no-files-found: error
          retention-days: 14

      - name: Write diagnostic workflow summary
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-host-diagnostic.txt
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          SSH_EXIT: ${{ steps.collect.outputs.ssh_exit }}
          REPORT_BYTES: ${{ steps.collect.outputs.report_bytes }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            echo '## Synology #1089 SSH host diagnostic'
            echo
            echo "- collection_outcome: \`${COLLECT_OUTCOME:-unknown}\`"
            echo "- ssh_exit: \`${SSH_EXIT:-unknown}\`"
            echo "- report_bytes: \`${REPORT_BYTES:-unknown}\`"
            echo "- artifact_id: \`${ARTIFACT_ID:-unknown}\`"
            echo "- artifact_digest: \`${ARTIFACT_DIGEST:-unknown}\`"
            if [[ -f "$REPORT" ]]; then
              for pattern in '^timeout_provider=' '^passwordless_sudo=' '^ServerVersion=' '^StorageDriver=' '^DockerRootDir=' '^ContainersRunning=' '^ContainersStopped=' '^probe_create_rc=' '^probe_start_rc=' '^probe_remove_rc=' '^minimal_lifecycle_elapsed_seconds=' '^ssh_exit='; do
                grep -E "$pattern" "$REPORT" | tail -n 1 | sed 's/^/- /' || true
              done
              echo
              echo 'The complete sanitized report is attached as the immutable workflow artifact.'
            else
              echo '- report: `missing`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce successful SSH collection
        if: always()
        shell: bash
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          SSH_EXIT: ${{ steps.collect.outputs.ssh_exit }}
        run: |
          set -euo pipefail
          [[ "$COLLECT_OUTCOME" == success ]]
          [[ "$SSH_EXIT" == 0 ]]

      - name: Remove local SSH and diagnostic material
        if: always()
        shell: bash
        env:
          SSH_DIR: ${{ runner.temp }}/ssh-1089
          REPORT: ${{ runner.temp }}/synology-1089-host-diagnostic.txt
          REMOTE_SCRIPT: ${{ runner.temp }}/synology-1089-diagnostic.sh
        run: |
          set -euo pipefail
          rm -f -- "$SSH_DIR/id" "$SSH_DIR/known_hosts" "$REPORT" "$REMOTE_SCRIPT"
          rmdir "$SSH_DIR" 2>/dev/null || true
