name: Temporary 1089 Synology SSH host diagnostic

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-ssh-host-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zz-temp-1089-synology-ssh-host-diagnostic
  cancel-in-progress: false

jobs:
  validate:
    name: Run exact PR 1454 phased preflight on Synology
    runs-on: [freqtrade-staging]
    timeout-minutes: 12
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET; do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Checkout exact preflight repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: 9599b3e39ff9e5252882e3ea4a45fe475e6021ca

      - name: Run exact repaired runtime preflight
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-exact-repaired-preflight.txt
        run: |
          set -euo pipefail
          started=$(date +%s)
          python3 deploy/synology/portal-oidc/docker_runtime_preflight.py | tee "$REPORT"
          ended=$(date +%s)
          printf 'elapsed_seconds=%s\n' "$((ended-started))" | tee -a "$REPORT"
          grep -F '"status": "ready"' "$REPORT"
          grep -F '"disposable_container_start": true' "$REPORT"
          grep -F '"secret_values_recorded": false' "$REPORT"
          grep -F '"live_capital_authorized": false' "$REPORT"
          leaks="$(timeout 20 docker ps -a --format '{{.Names}}' | grep -E '^portal-oidc-runtime-preflight-' || true)"
          [[ -z "$leaks" ]]
          echo 'probe_leaks=none' | tee -a "$REPORT"

      - name: Upload exact repaired preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synology-1089-exact-repaired-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synology-1089-exact-repaired-preflight.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish summary
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-exact-repaired-preflight.txt
        run: |
          {
            echo '## Synology #1089 exact repaired preflight'
            echo
            [[ -f "$REPORT" ]] && sed 's/^/- /' "$REPORT" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup local evidence
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-exact-repaired-preflight.txt
        run: rm -f -- "$REPORT"
