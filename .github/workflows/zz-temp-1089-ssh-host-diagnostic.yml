name: Temporary 1089 Synology SSH host diagnostic

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-ssh-host-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Snapshot running-container restart policies before daemon repair
    runs-on: [freqtrade-staging]
    timeout-minutes: 5
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET; do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Snapshot restart policies
        id: snapshot
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-restart-policies.txt
        run: |
          set -euo pipefail
          : > "$REPORT"
          docker version --format 'docker_server={{.Server.Version}}' | tee -a "$REPORT"
          while read -r cid; do
            docker inspect --format '{{.Id}}\t{{.Name}}\tstatus={{.State.Status}}\trestart={{.HostConfig.RestartPolicy.Name}}\thealth={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" >> "$REPORT"
          done < <(docker ps -q)
          runner_policy="$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' freqtrade-synology-staging-runner 2>/dev/null || true)"
          echo "runner_restart_policy=$runner_policy" | tee -a "$REPORT"
          running_no_restart="$(grep -F '\tstatus=running\trestart=no\t' "$REPORT" || true)"
          if [[ -n "$running_no_restart" ]]; then
            echo 'running_restart_no_present=true' | tee -a "$REPORT"
          else
            echo 'running_restart_no_present=false' | tee -a "$REPORT"
          fi
          [[ "$runner_policy" == always || "$runner_policy" == unless-stopped ]]

      - name: Upload restart-policy snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synology-1089-restart-policy-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synology-1089-restart-policies.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish summary
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-restart-policies.txt
        run: |
          {
            echo '## Synology #1089 restart-policy snapshot'
            echo
            grep -E '^runner_restart_policy=|^running_restart_no_present=' "$REPORT" | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-restart-policies.txt
        run: rm -f -- "$REPORT"
