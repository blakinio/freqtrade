name: Temporary 1089 Synology SSH host diagnostic

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-ssh-host-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zz-temp-1089-synology-ssh-host-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Attribute Synology I/O pressure and verify exact preflight
    runs-on: [freqtrade-staging]
    timeout-minutes: 12
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Prepare bounded SSH client
        shell: bash
        env:
          SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SSH_USER: ${{ secrets.SYNOLOGY_SSH_USER || vars.SYNOLOGY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SYNOLOGY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SYNOLOGY_SSH_KNOWN_HOSTS }}
          SSH_DIR: ${{ runner.temp }}/ssh-1089
        run: |
          set -euo pipefail
          for name in SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "required SSH input is missing: $name" >&2; exit 1; }
          done
          install -d -m 0700 "$SSH_DIR"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/id"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 0600 "$SSH_DIR/id" "$SSH_DIR/known_hosts"

      - name: Collect host I/O attribution evidence
        id: host
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SYNOLOGY_SSH_HOST }}
          SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SSH_USER: ${{ secrets.SYNOLOGY_SSH_USER || vars.SYNOLOGY_SSH_USER }}
          SSH_DIR: ${{ runner.temp }}/ssh-1089
          REPORT: ${{ runner.temp }}/synology-1089-io-attribution.txt
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$SSH_DIR/id"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_DIR/known_hosts"
            -o ConnectTimeout=10
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o LogLevel=ERROR
          )
          set +e
          timeout 240 ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" 'sh -s' > "$REPORT" 2>&1 <<'REMOTE'
          set -u
          DOCKER=/usr/local/bin/docker
          [ -x "$DOCKER" ] || DOCKER=/var/packages/ContainerManager/target/usr/bin/docker
          echo '===== timestamp ====='
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ'; uptime
          echo '===== btrfs scrub ====='
          timeout 30 sudo -n /sbin/btrfs scrub status /volume1 2>&1 || true
          timeout 30 sudo -n /sbin/btrfs scrub status /volume2 2>&1 || true
          echo '===== mdstat ====='
          cat /proc/mdstat 2>/dev/null || true
          echo '===== process candidates ====='
          ps -eo pid,ppid,user,state,etime,%cpu,%mem,comm,args 2>/dev/null | grep -Ei 'btrfs|scrub|backup|snapshot|surveillance|syno|docker|containerd' | grep -v grep | tail -n 250 || true
          echo '===== pidstat io ====='
          if command -v pidstat >/dev/null 2>&1; then timeout 15 pidstat -d 1 5 2>&1 || true; else echo 'pidstat unavailable'; fi
          echo '===== iostat ====='
          if command -v iostat >/dev/null 2>&1; then timeout 15 iostat -xz 1 3 2>&1 || true; fi
          echo '===== docker stats ====='
          timeout 60 sudo -n "$DOCKER" stats --no-stream --format '{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.BlockIO}}\t{{.NetIO}}' 2>&1 || true
          echo '===== exact preflight probe ====='
          PROBE='ft-1089-exact-preflight'
          timeout 30 sudo -n "$DOCKER" rm -f "$PROBE" >/dev/null 2>&1 || true
          started=$(date +%s)
          timeout 20 sudo -n "$DOCKER" run --rm --name "$PROBE" --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --entrypoint /bin/true docker.io/library/postgres:16.13-alpine3.23@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 >/dev/null 2>&1
          rc=$?
          ended=$(date +%s)
          printf 'exact_preflight_rc=%s\nexact_preflight_elapsed_seconds=%s\n' "$rc" "$((ended-started))"
          timeout 30 sudo -n "$DOCKER" rm -f "$PROBE" >/dev/null 2>&1 || true
          echo '===== post docker ====='
          timeout 30 sudo -n "$DOCKER" version >/dev/null 2>&1; printf 'post_docker_version_rc=%s\n' "$?"
          exit 0
          REMOTE
          ssh_rc=$?
          set -e
          printf 'ssh_exit=%s\n' "$ssh_rc" >> "$REPORT"
          python3 - "$REPORT" <<'PY'
          import os, pathlib, re, sys
          p=pathlib.Path(sys.argv[1]); x=p.read_text(encoding='utf-8',errors='replace')
          for n in ('SSH_HOST','SSH_USER'):
              v=os.environ.get(n,'')
              if v: x=x.replace(v,f'[REDACTED_{n}]')
          x=re.sub(r'(?i)((?:authorization|bearer|password|passwd|secret|token|api[_-]?key)\s*[:=]\s*)[^\s,;]+',r'\1[REDACTED]',x)
          p.write_text(x,encoding='utf-8')
          PY
          printf 'ssh_exit=%s\n' "$ssh_rc" >> "$GITHUB_OUTPUT"
          test "$ssh_rc" -eq 0

      - name: Upload I/O attribution evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synology-1089-io-attribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synology-1089-io-attribution.txt
          if-no-files-found: error
          retention-days: 14

      - name: Write focused summary
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-io-attribution.txt
        run: |
          {
            echo '## Synology #1089 I/O attribution'
            echo
            if [[ -f "$REPORT" ]]; then
              grep -E 'scrub status|scrub started|scrub resumed|scrub canceled|scrub finished|exact_preflight_rc=|exact_preflight_elapsed_seconds=|post_docker_version_rc=|ssh_exit=' "$REPORT" | sed 's/^/- /' || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local diagnostic material
        if: always()
        shell: bash
        env:
          SSH_DIR: ${{ runner.temp }}/ssh-1089
          REPORT: ${{ runner.temp }}/synology-1089-io-attribution.txt
        run: |
          rm -rf -- "$SSH_DIR"
          rm -f -- "$REPORT"
