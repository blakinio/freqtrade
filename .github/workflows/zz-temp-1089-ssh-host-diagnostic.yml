name: Temporary 1089 Synology SSH host diagnostic

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-ssh-host-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zz-temp-1089-synology-ssh-host-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Inspect failed Portal migration state read-only
    runs-on: [freqtrade-staging]
    timeout-minutes: 8
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET; do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Collect secret-free Docker and PostgreSQL evidence
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-post-deploy-failure.txt
        run: |
          set -u
          set +e
          : > "$REPORT"
          echo '===== metadata =====' >> "$REPORT"
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ' >> "$REPORT"
          timeout 30 docker version --format 'server={{.Server.Version}}' >> "$REPORT" 2>&1
          echo "docker_version_rc=$?" >> "$REPORT"

          echo '===== portal containers =====' >> "$REPORT"
          for name in freqtrade-portal-postgresql freqtrade-portal-control-plane freqtrade-portal-staging; do
            timeout 20 docker inspect --format 'name={{.Name}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} image={{.Config.Image}} restart={{.HostConfig.RestartPolicy.Name}}' "$name" >> "$REPORT" 2>&1
            echo "inspect_${name}_rc=$?" >> "$REPORT"
          done

          echo '===== portal network members =====' >> "$REPORT"
          timeout 20 docker network inspect portal_oidc_public --format '{{range .Containers}}{{.Name}}{{"\n"}}{{end}}' >> "$REPORT" 2>&1
          echo "network_members_rc=$?" >> "$REPORT"

          echo '===== portal databases =====' >> "$REPORT"
          timeout 30 docker exec freqtrade-portal-postgresql psql -U portal -d portal_admin -Atc "SELECT datname FROM pg_database WHERE datname = 'portal_admin' OR datname LIKE 'portal_candidate_%' ORDER BY datname" >> "$REPORT" 2>&1
          echo "database_inventory_rc=$?" >> "$REPORT"

          echo '===== postgres error window =====' >> "$REPORT"
          timeout 30 docker logs --since '2026-08-10T23:20:00Z' --timestamps freqtrade-portal-postgresql 2>&1 | grep -Ei 'ERROR|FATAL|PANIC|WARNING|database|role|connection|checkpoint|ready to accept' | tail -n 400 >> "$REPORT" || true

          echo '===== exact approved control image =====' >> "$REPORT"
          timeout 20 docker image inspect --format 'id={{.Id}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}' sha256:50f2230810559e16acbfe6a57ad5fe1fc8eb087bcb1dd38419129e99315c8cf9 >> "$REPORT" 2>&1
          echo "approved_control_image_rc=$?" >> "$REPORT"

          python3 - "$REPORT" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'(?i)(password|passwd|secret|token|authorization|bearer|api[_-]?key)\s*[:=]\s*[^\s,;]+', r'\1=[REDACTED]', text)
          text = re.sub(r'postgresql(?:\+psycopg)?://[^\s]+', '[REDACTED_DATABASE_URL]', text)
          text = re.sub(r'\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b', '[REDACTED_JWT]', text)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Upload read-only failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synology-1089-post-deploy-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synology-1089-post-deploy-failure.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish summary
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-post-deploy-failure.txt
        run: |
          {
            echo '## Synology #1089 failed deployment read-only diagnostic'
            echo
            [[ -f "$REPORT" ]] && sed 's/^/- /' "$REPORT" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup local evidence
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-post-deploy-failure.txt
        run: rm -f -- "$REPORT"
