name: Temporary 1089 Synology SSH host diagnostic

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-ssh-host-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zz-temp-1089-synology-ssh-host-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Diagnose and accept Synology Docker runtime
    runs-on: [freqtrade-staging]
    timeout-minutes: 35
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Prepare bounded SSH client
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SYNOLOGY_SSH_HOST }}
          SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SSH_USER: ${{ secrets.SYNOLOGY_SSH_USER || vars.SYNOLOGY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SYNOLOGY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SYNOLOGY_SSH_KNOWN_HOSTS }}
          SSH_DIR: ${{ runner.temp }}/ssh-1089
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "required SSH input is missing: $name" >&2; exit 1; }
          done
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          install -d -m 0700 "$SSH_DIR"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/id"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 0600 "$SSH_DIR/id" "$SSH_DIR/known_hosts"

      - name: Collect corrected host and Docker evidence through restricted sudo
        id: collect
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SYNOLOGY_SSH_HOST }}
          SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SSH_USER: ${{ secrets.SYNOLOGY_SSH_USER || vars.SYNOLOGY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SYNOLOGY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SYNOLOGY_SSH_KNOWN_HOSTS }}
          SSH_DIR: ${{ runner.temp }}/ssh-1089
          REPORT: ${{ runner.temp }}/synology-1089-host-corrected.txt
          REMOTE_SCRIPT: ${{ runner.temp }}/synology-1089-corrected.sh
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$SSH_DIR/id"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_DIR/known_hosts"
            -o ConnectTimeout=10
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o LogLevel=ERROR
          )
          cat > "$REMOTE_SCRIPT" <<'REMOTE'
          #!/bin/sh
          set -u
          section() { printf '\n===== %s =====\n' "$1"; }
          if command -v timeout >/dev/null 2>&1; then t() { timeout "$@"; }
          elif command -v busybox >/dev/null 2>&1 && busybox timeout 1 true >/dev/null 2>&1; then t() { busybox timeout "$@"; }
          else echo 'FATAL: no timeout implementation' >&2; exit 90; fi
          b() { s="$1"; l="$2"; shift 2; a=$(date +%s); printf '+ %s timeout=%ss\n' "$l" "$s"; t "$s" "$@" 2>&1; r=$?; z=$(date +%s); printf '[exit=%s elapsed_seconds=%s]\n' "$r" "$((z-a))"; return 0; }
          sb() { s="$1"; l="$2"; shift 2; a=$(date +%s); printf '+ %s timeout=%ss\n' "$l" "$s"; t "$s" sudo -n "$@" 2>&1; r=$?; z=$(date +%s); printf '[exit=%s elapsed_seconds=%s]\n' "$r" "$((z-a))"; return 0; }
          DOCKER=''
          for candidate in /usr/local/bin/docker /var/packages/ContainerManager/target/usr/bin/docker; do [ -x "$candidate" ] && { DOCKER="$candidate"; break; }; done
          [ -n "$DOCKER" ] || { echo 'FATAL: allowed Docker binary not found' >&2; exit 91; }

          section metadata
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ'; date '+local=%Y-%m-%dT%H:%M:%S%z'; hostname 2>/dev/null || true; id; groups 2>/dev/null || true
          printf 'docker_binary=%s\n' "$DOCKER"

          section pressure
          b 10 uptime uptime
          b 10 memory free -h
          b 10 capacity df -hT
          b 10 inodes df -hi
          command -v iostat >/dev/null 2>&1 && b 20 iostat iostat -xz 1 3
          [ -r /proc/pressure/io ] && { echo '-- io pressure'; cat /proc/pressure/io; }
          [ -r /proc/pressure/memory ] && { echo '-- memory pressure'; cat /proc/pressure/memory; }

          section restricted_sudo
          sb 10 synopkg_status /usr/syno/bin/synopkg status ContainerManager
          sb 30 docker_version "$DOCKER" version
          sb 30 docker_info "$DOCKER" info --format 'ServerVersion={{.ServerVersion}} StorageDriver={{.Driver}} DockerRootDir={{.DockerRootDir}} Containers={{.Containers}} ContainersRunning={{.ContainersRunning}} ContainersStopped={{.ContainersStopped}} Images={{.Images}} LiveRestoreEnabled={{.LiveRestoreEnabled}}'
          sb 30 docker_system_df "$DOCKER" system df
          sb 30 docker_ps_all "$DOCKER" ps -a --no-trunc --format '{{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}'
          sb 20 docker_builder_ls "$DOCKER" builder ls

          section containers
          ids=$(t 20 sudo -n "$DOCKER" ps -aq 2>/dev/null || true)
          for cid in $ids; do sb 10 "inspect_$cid" "$DOCKER" inspect --format '{{.Id}}\t{{.Name}}\tstatus={{.State.Status}}\thealth={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}\trestart={{.HostConfig.RestartPolicy.Name}}\timage={{.Config.Image}}' "$cid"; done

          section btrfs
          for target in /volume1 /volume2 /volume3 /volume4; do [ -d "$target" ] || continue; sb 20 "btrfs_$target" /sbin/btrfs device stats "$target"; done

          section logs
          echo '+ dmesg_filtered'
          t 30 sudo -n /bin/dmesg 2>&1 | grep -Ei 'oom|out of memory|hung task|blocked for more than|I/O error|btrfs|overlay|containerd|dockerd|nvme|ata.*(error|reset)|filesystem error' | tail -n 300 || true
          echo '+ journal_filtered'
          t 60 sudo -n /bin/journalctl --utc --no-pager --since '8 hours ago' 2>&1 | grep -Ei 'docker|containerd|buildkit|btrfs|oom|out of memory|hung|blocked|I/O|error|fail|conntrack|resolver|172\.64\.36\.' | tail -n 600 || true

          section remote_lifecycle
          probe="ft-1089-ssh-probe-$$"
          cleanup() { t 20 sudo -n "$DOCKER" rm -f "$probe" >/dev/null 2>&1 || true; }
          trap cleanup 0 1 2 15
          if t 15 sudo -n "$DOCKER" image inspect alpine:3.23 >/dev/null 2>&1; then
            echo 'remote_pull_rc=already_present'; echo 'remote_pull_elapsed_seconds=0'
          else
            a=$(date +%s); t 120 sudo -n "$DOCKER" pull alpine:3.23 >/dev/null 2>&1; r=$?; z=$(date +%s); echo "remote_pull_rc=$r"; echo "remote_pull_elapsed_seconds=$((z-a))"
          fi
          a=$(date +%s); t 45 sudo -n "$DOCKER" create --name "$probe" --network none alpine:3.23 true >/dev/null 2>&1; cr=$?; z=$(date +%s); echo "remote_create_rc=$cr"; echo "remote_create_elapsed_seconds=$((z-a))"
          if [ "$cr" -eq 0 ]; then
            a=$(date +%s); t 60 sudo -n "$DOCKER" start -a "$probe" >/dev/null 2>&1; sr=$?; z=$(date +%s); echo "remote_start_rc=$sr"; echo "remote_start_elapsed_seconds=$((z-a))"
            a=$(date +%s); t 30 sudo -n "$DOCKER" rm "$probe" >/dev/null 2>&1; rr=$?; z=$(date +%s); echo "remote_remove_rc=$rr"; echo "remote_remove_elapsed_seconds=$((z-a))"
          else
            echo 'remote_start_rc=not_run'; echo 'remote_remove_rc=not_run'
          fi
          a=$(date +%s); t 60 sudo -n "$DOCKER" run --rm --network none alpine:3.23 true >/dev/null 2>&1; rr=$?; z=$(date +%s); echo "remote_run_network_none_rc=$rr"; echo "remote_run_network_none_elapsed_seconds=$((z-a))"
          cleanup; trap - 0 1 2 15
          sb 30 post_remote_docker_version "$DOCKER" version
          exit 0
          REMOTE
          chmod 0700 "$REMOTE_SCRIPT"
          set +e
          timeout 900 ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" 'sh -s' < "$REMOTE_SCRIPT" > "$REPORT" 2>&1
          ssh_rc=$?
          set -e
          printf '\nssh_exit=%s\n' "$ssh_rc" >> "$REPORT"
          python3 - "$REPORT" <<'PY'
          import os, pathlib, re, sys
          p=pathlib.Path(sys.argv[1]); x=p.read_text(encoding='utf-8',errors='replace')
          for n in ('SSH_HOST','SSH_USER','SSH_PRIVATE_KEY','SSH_KNOWN_HOSTS'):
              v=os.environ.get(n,'')
              if v: x=x.replace(v,f'[REDACTED_{n}]')
          x=re.sub(r'-----BEGIN [^-\n]*PRIVATE KEY-----.*?-----END [^-\n]*PRIVATE KEY-----','[REDACTED_PRIVATE_KEY_BLOCK]',x,flags=re.S)
          x=re.sub(r'(?i)((?:authorization|bearer|password|passwd|secret|token|api[_-]?key)\s*[:=]\s*)[^\s,;]+',r'\1[REDACTED]',x)
          x=re.sub(r'\bgh[pousr]_[A-Za-z0-9_]{20,}\b','[REDACTED_GITHUB_TOKEN]',x)
          x=re.sub(r'\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b','[REDACTED_JWT]',x)
          p.write_text(x,encoding='utf-8')
          PY
          printf 'ssh_exit=%s\n' "$ssh_rc" >> "$GITHUB_OUTPUT"
          test "$ssh_rc" -eq 0

      - name: Run bounded Docker runtime and builder acceptance
        id: acceptance
        shell: bash
        env:
          RESULT: ${{ runner.temp }}/synology-1089-runtime-acceptance.txt
        run: |
          set -u
          : > "$RESULT"
          probe="ft-1089-accept-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          legacy_image="ft-1089-legacy:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          buildkit_image="ft-1089-buildkit:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          context="${RUNNER_TEMP}/ft-1089-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { timeout 30 docker rm -f "$probe" >/dev/null 2>&1 || true; timeout 30 docker image rm -f "$legacy_image" "$buildkit_image" >/dev/null 2>&1 || true; rm -rf "$context"; }
          trap cleanup EXIT INT TERM
          record() { l="$1"; s="$2"; shift 2; a=$(date +%s); timeout "$s" "$@" >> "$RESULT" 2>&1; r=$?; z=$(date +%s); printf '%s_rc=%s\n%s_elapsed_seconds=%s\n' "$l" "$r" "$l" "$((z-a))" | tee -a "$RESULT"; return "$r"; }
          failures=0
          record docker_version 30 docker version || failures=$((failures+1))
          record docker_info 30 docker info || failures=$((failures+1))
          if timeout 15 docker image inspect alpine:3.23 >/dev/null 2>&1; then printf 'alpine_pull_rc=already_present\nalpine_pull_elapsed_seconds=0\n' | tee -a "$RESULT"; else record alpine_pull 120 docker pull alpine:3.23 || failures=$((failures+1)); fi
          record disposable_create 45 docker create --name "$probe" --network none alpine:3.23 true || failures=$((failures+1))
          if timeout 10 docker inspect "$probe" >/dev/null 2>&1; then
            record disposable_start 60 docker start -a "$probe" || failures=$((failures+1))
            record disposable_remove 30 docker rm "$probe" || failures=$((failures+1))
          else
            printf 'disposable_start_rc=not_run\ndisposable_remove_rc=not_run\n' | tee -a "$RESULT"; failures=$((failures+2))
          fi
          record run_network_none 60 docker run --rm --network none alpine:3.23 true || failures=$((failures+1))
          mkdir -p "$context"
          printf 'FROM alpine:3.23\nRUN true\n' > "$context/Dockerfile"
          record legacy_builder 180 env DOCKER_BUILDKIT=0 docker build --pull=false -t "$legacy_image" "$context" || failures=$((failures+1))
          record buildkit_builder 240 env DOCKER_BUILDKIT=1 docker build --progress=plain --pull=false -t "$buildkit_image" "$context" || failures=$((failures+1))
          record post_build_docker_version 30 docker version || failures=$((failures+1))
          record post_build_docker_info 30 docker info || failures=$((failures+1))
          cleanup
          leaked_containers=$(timeout 20 docker ps -a --format '{{.Names}}' 2>/dev/null | grep -E '^ft-1089-(accept|ssh-probe)-' || true)
          leaked_images=$(timeout 20 docker image ls --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | grep -E '^ft-1089-(legacy|buildkit):' || true)
          if [ -n "$leaked_containers" ]; then printf 'leaked_containers=%s\n' "$leaked_containers" | tee -a "$RESULT"; failures=$((failures+1)); else echo 'leaked_containers=none' | tee -a "$RESULT"; fi
          if [ -n "$leaked_images" ]; then printf 'leaked_images=%s\n' "$leaked_images" | tee -a "$RESULT"; failures=$((failures+1)); else echo 'leaked_images=none' | tee -a "$RESULT"; fi
          printf 'acceptance_failures=%s\n' "$failures" | tee -a "$RESULT"
          printf 'acceptance_failures=%s\n' "$failures" >> "$GITHUB_OUTPUT"
          trap - EXIT INT TERM
          [ "$failures" -eq 0 ]

      - name: Upload corrected diagnostic evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synology-1089-corrected-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/synology-1089-host-corrected.txt
            ${{ runner.temp }}/synology-1089-runtime-acceptance.txt
          if-no-files-found: error
          retention-days: 14

      - name: Write acceptance summary
        if: always()
        shell: bash
        env:
          HOST_REPORT: ${{ runner.temp }}/synology-1089-host-corrected.txt
          ACCEPT_REPORT: ${{ runner.temp }}/synology-1089-runtime-acceptance.txt
        run: |
          {
            echo '## Synology #1089 corrected Docker acceptance'; echo
            if [[ -f "$HOST_REPORT" ]]; then for p in '^docker_binary=' '^remote_pull_rc=' '^remote_create_rc=' '^remote_start_rc=' '^remote_remove_rc=' '^remote_run_network_none_rc=' '^ssh_exit='; do grep -E "$p" "$HOST_REPORT" | tail -n 1 | sed 's/^/- /' || true; done; fi
            if [[ -f "$ACCEPT_REPORT" ]]; then for p in '^docker_version_rc=' '^docker_info_rc=' '^disposable_create_rc=' '^disposable_start_rc=' '^disposable_remove_rc=' '^run_network_none_rc=' '^legacy_builder_rc=' '^buildkit_builder_rc=' '^post_build_docker_version_rc=' '^post_build_docker_info_rc=' '^leaked_containers=' '^leaked_images=' '^acceptance_failures='; do grep -E "$p" "$ACCEPT_REPORT" | tail -n 1 | sed 's/^/- /' || true; done; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local SSH and diagnostic material
        if: always()
        shell: bash
        env:
          SSH_DIR: ${{ runner.temp }}/ssh-1089
          HOST_REPORT: ${{ runner.temp }}/synology-1089-host-corrected.txt
          ACCEPT_REPORT: ${{ runner.temp }}/synology-1089-runtime-acceptance.txt
          REMOTE_SCRIPT: ${{ runner.temp }}/synology-1089-corrected.sh
        run: |
          rm -rf -- "$SSH_DIR"
          rm -f -- "$HOST_REPORT" "$ACCEPT_REPORT" "$REMOTE_SCRIPT"
