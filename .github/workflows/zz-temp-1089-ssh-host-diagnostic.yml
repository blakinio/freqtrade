name: Temporary 1089 Synology SSH host diagnostic

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-ssh-host-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-1089-synology-ssh-host-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Diagnose Synology Docker runtime through SSH
    runs-on: [freqtrade-staging]
    timeout-minutes: 25
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Prepare bounded SSH client
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SYNOLOGY_SSH_HOST }}
          SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SSH_USER: ${{ secrets.SYNOLOGY_SSH_USER || vars.SYNOLOGY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SYNOLOGY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SYNOLOGY_SSH_KNOWN_HOSTS }}
          SSH_DIR: ${{ runner.temp }}/ssh-1089
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "required SSH input is missing: $name" >&2; exit 1; }
          done
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          install -d -m 0700 "$SSH_DIR"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/id"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 0600 "$SSH_DIR/id" "$SSH_DIR/known_hosts"

      - name: Collect and sanitize host and Docker evidence
        id: collect
        continue-on-error: true
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SYNOLOGY_SSH_HOST }}
          SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SSH_USER: ${{ secrets.SYNOLOGY_SSH_USER || vars.SYNOLOGY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SYNOLOGY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SYNOLOGY_SSH_KNOWN_HOSTS }}
          SSH_DIR: ${{ runner.temp }}/ssh-1089
          REPORT: ${{ runner.temp }}/synology-1089-host-diagnostic.txt
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$SSH_DIR/id" -p "$SSH_PORT"
            -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_DIR/known_hosts"
            -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3
            -o LogLevel=ERROR
          )
          cat > "$SSH_DIR/diagnostic.sh" <<'REMOTE'
          #!/bin/sh
          set -u
          section() { printf '\n===== %s =====\n' "$1"; }
          if command -v timeout >/dev/null 2>&1; then t() { timeout "$@"; }
          elif command -v busybox >/dev/null 2>&1; then t() { busybox timeout "$@"; }
          else echo 'FATAL no timeout implementation'; exit 90; fi
          b() { s="$1"; l="$2"; shift 2; printf '+ %s timeout=%ss\n' "$l" "$s"; t "$s" "$@" 2>&1; r=$?; printf '[exit=%s]\n' "$r"; return 0; }
          bs() { s="$1"; l="$2"; x="$3"; printf '+ %s timeout=%ss\n' "$l" "$s"; t "$s" sh -c "$x" 2>&1; r=$?; printf '[exit=%s]\n' "$r"; return 0; }
          sudo_ok=false
          if command -v sudo >/dev/null 2>&1 && t 5 sudo -n true >/dev/null 2>&1; then sudo_ok=true; fi
          rs() { s="$1"; l="$2"; x="$3"; printf '+ %s timeout=%ss\n' "$l" "$s"; if [ "$sudo_ok" != true ]; then echo 'SKIPPED passwordless sudo unavailable'; return 0; fi; t "$s" sudo -n sh -c "$x" 2>&1; r=$?; printf '[exit=%s]\n' "$r"; return 0; }

          section metadata
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ'; date '+local=%Y-%m-%dT%H:%M:%S%z'; hostname
          printf 'passwordless_sudo=%s\n' "$sudo_ok"

          section host
          b 10 id id; bs 10 groups groups; b 10 uname uname -a; b 10 uptime uptime
          bs 10 dsm_defaults 'sed -n "1,160p" /etc.defaults/VERSION 2>/dev/null || true'
          bs 10 dsm_active 'sed -n "1,160p" /etc/VERSION 2>/dev/null || true'
          bs 10 memory 'free -h 2>/dev/null || sed -n "1,120p" /proc/meminfo'
          bs 10 pressure 'cat /proc/loadavg; for f in /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory; do [ -r "$f" ] && { echo --$f; cat "$f"; }; done'
          bs 15 vmstat 'command -v vmstat >/dev/null 2>&1 && vmstat 1 5 || true'
          bs 20 iostat 'command -v iostat >/dev/null 2>&1 && iostat -xz 1 3 || true'

          section filesystem
          bs 20 capacity 'df -hT 2>/dev/null || df -h'; bs 20 inodes 'df -hi 2>/dev/null || df -i || true'
          bs 20 mounts 'command -v findmnt >/dev/null 2>&1 && findmnt -rno TARGET,SOURCE,FSTYPE,OPTIONS || mount'
          rs 60 btrfs 'command -v btrfs >/dev/null 2>&1 || exit 0; btrfs filesystem show || true; targets=$(findmnt -rn -t btrfs -o TARGET 2>/dev/null || true); printf "%s\n" "$targets" | while read target; do [ -n "$target" ] || continue; echo --$target; btrfs filesystem usage -T "$target" 2>&1 || true; btrfs device stats "$target" 2>&1 || true; btrfs scrub status "$target" 2>&1 || true; done'

          section package
          bs 20 synopkg_list 'p=""; for c in synopkg /usr/syno/bin/synopkg; do if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then p="$c"; break; fi; done; [ -n "$p" ] && "$p" list 2>&1 | grep -Ei "container|docker" || true'
          rs 30 synopkg_status 'p=""; for c in synopkg /usr/syno/bin/synopkg; do if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then p="$c"; break; fi; done; [ -n "$p" ] || exit 0; "$p" list 2>/dev/null | grep -Ei "container|docker" || true; for pkg in ContainerManager Docker; do "$p" status "$pkg" 2>&1 || true; done'

          section docker
          bs 10 socket 'ls -l /var/run/docker.sock 2>&1 || true'
          bs 10 api_ping 'command -v curl >/dev/null 2>&1 && { curl --fail --silent --show-error --max-time 5 --unix-socket /var/run/docker.sock http://localhost/_ping; echo; } || true'
          b 20 docker_version docker version
          bs 30 docker_info 'docker info --format "ServerVersion={{.ServerVersion}}\nStorageDriver={{.Driver}}\nDockerRootDir={{.DockerRootDir}}\nContainers={{.Containers}}\nContainersRunning={{.ContainersRunning}}\nContainersStopped={{.ContainersStopped}}\nImages={{.Images}}\nOperatingSystem={{.OperatingSystem}}\nKernelVersion={{.KernelVersion}}\nNCPU={{.NCPU}}\nMemTotal={{.MemTotal}}\nLiveRestoreEnabled={{.LiveRestoreEnabled}}\nDriverStatus={{json .DriverStatus}}"'
          bs 20 docker_root_space 'root=$(docker info --format "{{.DockerRootDir}}" 2>/dev/null || true); echo "DockerRootDir=$root"; [ -n "$root" ] && { df -h "$root"; df -i "$root"; } || true'
          bs 30 docker_df 'docker system df'; bs 30 docker_ps 'docker ps -a --no-trunc --format "{{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}"'
          bs 20 builders 'docker builder ls 2>&1 || true; docker buildx ls 2>&1 || true'
          rs 20 ctr 'if command -v ctr >/dev/null 2>&1; then for s in /var/run/docker/containerd/containerd.sock /run/containerd/containerd.sock; do [ -S "$s" ] || continue; echo --$s; ctr --address "$s" version 2>&1 || true; done; fi'

          section containers
          bs 45 inventory 'for c in $(docker ps -aq 2>/dev/null); do docker inspect --format "{{.Id}}\t{{.Name}}\tstatus={{.State.Status}}\thealth={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}\trestart={{.HostConfig.RestartPolicy.Name}}\timage={{.Config.Image}}" "$c" 2>/dev/null || true; done'

          section processes
          bs 20 runtime_processes 'ps -eo pid,ppid,state,etime,wchan:32,comm 2>/dev/null | { head -n 1; grep -E "(dockerd|containerd|containerd-shim|buildkitd|buildkit-runc|runc)$" || true; }'
          rs 20 dstate_stacks 'for p in $(ps -eo pid=,state=,comm= 2>/dev/null | grep -E "[[:space:]]D[^[:space:]]*[[:space:]]+(dockerd|containerd|containerd-shim|buildkitd|buildkit-runc|runc)$" | awk "{print \$1}"); do echo --pid=$p; cat /proc/$p/wchan 2>/dev/null || true; cat /proc/$p/stack 2>/dev/null || true; done'

          section logs
          rs 60 window1 'command -v journalctl >/dev/null 2>&1 || exit 0; journalctl --utc --no-pager --since "2026-08-10 13:12:00" --until "2026-08-10 13:18:59" 2>/dev/null | grep -Ei "docker|containerd|buildkit|shim|btrfs|overlay|oom|hung|blocked|I/O|error|fail" | tail -n 500 || true'
          rs 60 window2 'command -v journalctl >/dev/null 2>&1 || exit 0; journalctl --utc --no-pager --since "2026-08-10 15:20:00" --until "2026-08-10 15:22:59" 2>/dev/null | grep -Ei "docker|containerd|buildkit|shim|btrfs|overlay|oom|hung|blocked|I/O|error|fail" | tail -n 500 || true'
          rs 60 kernel 'if command -v dmesg >/dev/null 2>&1; then (dmesg -T 2>/dev/null || dmesg 2>/dev/null) | grep -Ei "oom|out of memory|hung task|blocked for more than|I/O error|btrfs|overlay|containerd|dockerd|nvme|ata.*(error|reset)|filesystem error" | tail -n 500 || true; fi'
          rs 60 dsm_logs 'for f in /var/log/messages /var/log/synopkg.log /var/log/packages/ContainerManager.log /var/log/packages/Docker.log; do [ -f "$f" ] || continue; echo --$f; tail -n 800 "$f" | grep -Ei "2026-08-10|docker|containerd|buildkit|shim|btrfs|overlay|oom|hung|blocked|I/O|error|fail" | tail -n 300 || true; done'

          section lifecycle_probe
          n="ft-1089-runtime-probe-$$"; cleanup() { t 20 docker rm -f "$n" >/dev/null 2>&1 || true; }; trap cleanup 0 1 2 15
          if t 10 docker image inspect alpine:3.23 >/dev/null 2>&1; then
            a=$(date +%s); t 30 docker create --name "$n" --network none alpine:3.23 true 2>&1; cr=$?; echo probe_create_rc=$cr
            sr=not_run; rr=not_run
            if [ "$cr" -eq 0 ]; then t 45 docker start -a "$n" 2>&1; sr=$?; echo probe_start_rc=$sr; t 30 docker rm "$n" 2>&1; rr=$?; echo probe_remove_rc=$rr; else echo probe_start_rc=$sr; echo probe_remove_rc=$rr; fi
            z=$(date +%s); echo minimal_lifecycle_elapsed_seconds=$((z-a))
          else echo probe_create_rc=skipped_image_absent; echo probe_start_rc=not_run; echo probe_remove_rc=not_run; fi
          trap - 0 1 2 15
          b 20 post_docker_version docker version; bs 30 post_docker_df 'docker system df'
          REMOTE
          chmod 0700 "$SSH_DIR/diagnostic.sh"
          set +e
          timeout 1100 ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" 'sh -s' < "$SSH_DIR/diagnostic.sh" > "$REPORT" 2>&1
          ssh_rc=$?
          set -e
          printf '\nssh_exit=%s\n' "$ssh_rc" >> "$REPORT"
          python3 - "$REPORT" <<'PY'
          import os, pathlib, re, sys
          p=pathlib.Path(sys.argv[1]); x=p.read_text(encoding='utf-8',errors='replace')
          for n in ('SSH_HOST','SSH_USER','SSH_PRIVATE_KEY','SSH_KNOWN_HOSTS'):
              v=os.environ.get(n,'')
              if v: x=x.replace(v,f'[REDACTED_{n}]')
          x=re.sub(r'-----BEGIN [^-\n]*PRIVATE KEY-----.*?-----END [^-\n]*PRIVATE KEY-----','[REDACTED_PRIVATE_KEY_BLOCK]',x,flags=re.S)
          x=re.sub(r'(?i)((?:authorization|bearer|password|passwd|secret|token|api[_-]?key)\s*[:=]\s*)[^\s,;]+',r'\1[REDACTED]',x)
          x=re.sub(r'\bgh[pousr]_[A-Za-z0-9_]{20,}\b','[REDACTED_GITHUB_TOKEN]',x)
          x=re.sub(r'\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b','[REDACTED_JWT]',x)
          p.write_text(x,encoding='utf-8')
          PY
          printf 'ssh_exit=%s\nreport_bytes=%s\n' "$ssh_rc" "$(wc -c < "$REPORT")" >> "$GITHUB_OUTPUT"

      - name: Upload bounded diagnostic artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synology-1089-host-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/synology-1089-host-diagnostic.txt
          if-no-files-found: error
          retention-days: 14

      - name: Summarize diagnostic
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-host-diagnostic.txt
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          SSH_EXIT: ${{ steps.collect.outputs.ssh_exit }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            echo '## Synology #1089 SSH host diagnostic'; echo
            echo "- collection_outcome: \`${COLLECT_OUTCOME:-unknown}\`"
            echo "- ssh_exit: \`${SSH_EXIT:-unknown}\`"
            echo "- artifact_id: \`${ARTIFACT_ID:-unknown}\`"
            echo "- artifact_digest: \`${ARTIFACT_DIGEST:-unknown}\`"
            if [[ -f "$REPORT" ]]; then
              for p in '^passwordless_sudo=' '^ServerVersion=' '^StorageDriver=' '^DockerRootDir=' '^ContainersRunning=' '^ContainersStopped=' '^probe_create_rc=' '^probe_start_rc=' '^probe_remove_rc=' '^minimal_lifecycle_elapsed_seconds=' '^ssh_exit='; do grep -E "$p" "$REPORT" | tail -n1 | sed 's/^/- /' || true; done
            else echo '- report: `missing`'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce successful SSH collection
        if: always()
        shell: bash
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          SSH_EXIT: ${{ steps.collect.outputs.ssh_exit }}
        run: |
          set -euo pipefail
          [[ "$COLLECT_OUTCOME" == success ]]
          [[ "$SSH_EXIT" == 0 ]]

      - name: Remove local SSH and diagnostic material
        if: always()
        shell: bash
        env:
          SSH_DIR: ${{ runner.temp }}/ssh-1089
          REPORT: ${{ runner.temp }}/synology-1089-host-diagnostic.txt
        run: |
          set -euo pipefail
          rm -rf -- "$SSH_DIR"
          rm -f -- "$REPORT"
