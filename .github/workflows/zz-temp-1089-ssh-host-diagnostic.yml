name: Temporary 1089 Synology SSH host diagnostic

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-ssh-host-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zz-temp-1089-synology-ssh-host-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Isolate Docker start execution from cleanup latency
    runs-on: [freqtrade-staging]
    timeout-minutes: 12
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET FT_EXCHANGE_KEY FT_EXCHANGE_SECRET FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET; do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Inspect leaked exact-preflight containers
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-lifecycle-isolation.txt
        run: |
          set -u
          : > "$REPORT"
          for name in portal-oidc-exact-31435421798-1 portal-oidc-exact-31435421798-2; do
            started=$(date +%s)
            timeout --kill-after=3 15 docker inspect --format 'name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}} restart={{.HostConfig.RestartPolicy.Name}}' "$name" >> "$REPORT" 2>&1
            rc=$?
            ended=$(date +%s)
            printf 'inspect_%s_rc=%s\ninspect_%s_elapsed_seconds=%s\n' "$name" "$rc" "$name" "$((ended-started))" | tee -a "$REPORT"
          done
          exit 0

      - name: Run exact lifecycle without auto-remove
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-lifecycle-isolation.txt
        run: |
          set -u
          set +e
          image='docker.io/library/postgres:16.13-alpine3.23@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777'
          probe="portal-oidc-split-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          failures=0
          record() {
            label="$1"; seconds="$2"; shift 2
            started=$(date +%s)
            timeout --kill-after=5 "$seconds" "$@" >> "$REPORT" 2>&1
            rc=$?
            ended=$(date +%s)
            printf '%s_rc=%s\n%s_elapsed_seconds=%s\n' "$label" "$rc" "$label" "$((ended-started))" | tee -a "$REPORT"
            return "$rc"
          }
          record docker_version 20 docker version || failures=$((failures+1))
          record split_create 60 docker create --name "$probe" --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --entrypoint /bin/true "$image" || failures=$((failures+1))
          if timeout --kill-after=3 15 docker inspect "$probe" >/dev/null 2>&1; then
            record split_start 90 docker start "$probe" || failures=$((failures+1))
            record split_wait 45 docker wait "$probe" || failures=$((failures+1))
            record split_inspect 20 docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' "$probe" || failures=$((failures+1))
            record split_remove 120 docker rm -f "$probe" || failures=$((failures+1))
          else
            echo 'split_probe_missing=true' | tee -a "$REPORT"
            failures=$((failures+1))
          fi
          record post_docker_version 20 docker version || failures=$((failures+1))
          timeout --kill-after=3 15 docker inspect "$probe" >/dev/null 2>&1
          leak_rc=$?
          if [[ "$leak_rc" -eq 0 ]]; then echo 'split_probe_leaked=true' | tee -a "$REPORT"; else echo 'split_probe_leaked=false' | tee -a "$REPORT"; fi
          echo "split_failures=$failures" | tee -a "$REPORT"
          [[ "$failures" -eq 0 ]]

      - name: Upload lifecycle isolation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synology-1089-lifecycle-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synology-1089-lifecycle-isolation.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish summary
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-lifecycle-isolation.txt
        run: |
          {
            echo '## Synology #1089 Docker lifecycle isolation'
            echo
            grep -E '^(name=|inspect_|docker_version_|split_|post_docker_version_)' "$REPORT" | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup local evidence
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/synology-1089-lifecycle-isolation.txt
        run: rm -f -- "$REPORT"
