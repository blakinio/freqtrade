name: Temporary 1089 SSH user alias probe

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-ssh-user-alias-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Validate configured SSH user aliases without exposing values
    runs-on: [freqtrade-staging]
    timeout-minutes: 5
    steps:
      - name: Probe bounded non-mutating SSH authentication candidates
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SYNOLOGY_SSH_HOST }}
          SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SYNOLOGY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SYNOLOGY_SSH_KNOWN_HOSTS }}
          C_SECRET_USERNAME: ${{ secrets.SYNOLOGY_SSH_USERNAME }}
          C_SECRET_LOGIN: ${{ secrets.SYNOLOGY_SSH_LOGIN }}
          C_SECRET_USER: ${{ secrets.SYNOLOGY_USER }}
          C_SECRET_NAS_USER: ${{ secrets.NAS_SSH_USER }}
          C_SECRET_SSH_USER: ${{ secrets.SSH_USER }}
          C_VAR_USERNAME: ${{ vars.SYNOLOGY_SSH_USERNAME }}
          C_VAR_LOGIN: ${{ vars.SYNOLOGY_SSH_LOGIN }}
          C_VAR_USER: ${{ vars.SYNOLOGY_USER }}
          C_VAR_NAS_USER: ${{ vars.NAS_SSH_USER }}
          C_VAR_SSH_USER: ${{ vars.SSH_USER }}
          SSH_DIR: ${{ runner.temp }}/ssh-1089-alias-probe
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "required SSH input is missing: $name" >&2; exit 1; }
          done
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          install -d -m 0700 "$SSH_DIR"
          trap 'rm -rf -- "$SSH_DIR"' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/id"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 0600 "$SSH_DIR/id" "$SSH_DIR/known_hosts"
          ssh_opts=(
            -i "$SSH_DIR/id" -p "$SSH_PORT"
            -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_DIR/known_hosts"
            -o ConnectTimeout=8 -o ServerAliveInterval=5 -o ServerAliveCountMax=1
            -o LogLevel=ERROR
          )
          found=0
          for env_name in \
            C_SECRET_USERNAME C_SECRET_LOGIN C_SECRET_USER C_SECRET_NAS_USER C_SECRET_SSH_USER \
            C_VAR_USERNAME C_VAR_LOGIN C_VAR_USER C_VAR_NAS_USER C_VAR_SSH_USER
          do
            value="${!env_name:-}"
            [[ -n "$value" ]] || continue
            echo "::add-mask::$value"
            echo "candidate_present=$env_name"
            set +e
            timeout 20 ssh "${ssh_opts[@]}" "$value@$SSH_HOST" 'true' >/dev/null 2>&1
            rc=$?
            set -e
            echo "candidate_auth_exit_${env_name}=$rc"
            if [[ "$rc" -eq 0 ]]; then
              echo "validated_alias=$env_name"
              found=1
              break
            fi
          done
          [[ "$found" -eq 1 ]] || { echo 'No validated alternate SSH user secret/variable alias.' >&2; exit 43; }
