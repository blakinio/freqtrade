name: Temporary 1089 Synology cleanup and Portal retry

on:
  push:
    branches:
      - ops/1089-synology-cleanup-20260810
    paths:
      - ".github/workflows/zz-temp-1089-synology-cleanup-and-retry.yml"

permissions:
  contents: read

jobs:
  cleanup:
    name: Clean project Docker garbage and retry Portal OIDC
    runs-on: [freqtrade-staging]
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - name: Refuse trading credential environment
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            OKX_API_KEY OKX_API_SECRET OKX_SECRET_KEY OKX_PASSPHRASE \
            BYBIT_API_KEY BYBIT_API_SECRET BINANCE_API_KEY BINANCE_API_SECRET \
            FT_EXCHANGE_KEY FT_EXCHANGE_SECRET \
            FREQTRADE__EXCHANGE__KEY FREQTRADE__EXCHANGE__SECRET
          do
            test -z "${!name:-}" || { echo "recognized trading credential present: $name" >&2; exit 1; }
          done

      - name: Inspect Docker state before cleanup
        shell: bash
        run: |
          set -euo pipefail
          timeout 15 docker version --format 'docker_server={{.Server.Version}}'
          timeout 20 docker system df || echo 'docker system df timed out; continuing with bounded cleanup'
          timeout 20 docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}'

      - name: Remove stopped Freqtrade Portal bot containers only
        shell: bash
        run: |
          set -euo pipefail
          removed=0
          while IFS=$'\t' read -r cid name image; do
            [[ -n "${cid:-}" ]] || continue
            if printf '%s\n%s\n' "$name" "$image" | grep -Eiq 'freqtrade|portal|wickhunter|(^|[-_.])bot([-_.]|$)|trading|quant'; then
              echo "Removing stopped project container: $cid $name ($image)"
              timeout 30 docker rm "$cid"
              removed=$((removed + 1))
            fi
          done < <(timeout 20 docker ps -a --filter status=exited --format '{{.ID}}\t{{.Names}}\t{{.Image}}')
          echo "stopped_project_containers_removed=$removed"

      - name: Remove dangling images
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 docker image prune -f

      - name: Remove unused project images
        shell: bash
        run: |
          set -euo pipefail
          removed=0
          while IFS=$'\t' read -r image_id repository tag; do
            [[ -n "${image_id:-}" ]] || continue
            if printf '%s\n' "$repository" | grep -Eiq 'freqtrade|portal|wickhunter|(^|[-_.])bot([-_.]|$)|trading|quant'; then
              echo "Attempting removal of unused project image: $image_id $repository:$tag"
              if timeout 30 docker image rm "$image_id"; then
                removed=$((removed + 1))
              else
                echo "Image retained because Docker reports it is still referenced/protected or removal timed out: $image_id"
              fi
            fi
          done < <(timeout 20 docker image ls --no-trunc --format '{{.ID}}\t{{.Repository}}\t{{.Tag}}')
          echo "unused_project_images_removed=$removed"

      - name: Clear Docker build cache
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 docker builder prune --all --force

      - name: Verify Docker runtime after cleanup
        shell: bash
        run: |
          set -euo pipefail
          timeout 20 docker system df || echo 'docker system df still slow after cleanup'
          timeout 20 docker ps -a --format '{{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}' | grep -Ei 'freqtrade|portal|wickhunter|(^|[-_.])bot([-_.]|$)|trading|quant' || true
          helper="$(timeout 15 docker inspect --format '{{.Config.Image}}' portal-authentik-local-test-server-1 2>/dev/null || true)"
          [[ -n "$helper" ]]
          timeout 60 docker run --rm --network none --entrypoint python "$helper" -c "print('RUNTIME_OK')"

      - name: Retry failed Portal OIDC deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/93455159831/rerun"
          echo 'portal_retry_requested=true'
