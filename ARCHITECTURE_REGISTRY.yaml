latest_architecture_change:
  accepted_at: "2026-08-18"
  base_sha: 6510077ea2e7a63c0d489f94391f461a3cab4ac1
  issue: 1604
  decision: ADR-025
  product_decision: ADR-023
  supersedes_runtime_decision: ADR-024
  decision_document: docs/ai_platform/portal/ADR-025_SYNOLOGY_PERSISTENT_RUNTIME_GITHUB_BUILD_PLANE.md
  detail_document: docs/ai_platform/portal/DEVELOPER_QUANT_PORTAL_ARCHITECTURE.md
  status: accepted_target_partial_implementation
  affected_domains:
    - portal_and_ux
    - data_and_observability
    - deployment_and_operations
    - ci_and_quality
    - portal_research_integration
  implementation_note: The owner retained Synology as the current persistent Portal/bot/application runtime and durable-storage host while keeping GitHub-hosted Actions as the default stateless CI/test/build/scan/disposable-compute plane. The hosted build-plane work from PR #1609 remains valid; a separate dedicated Linux runtime host is no longer a current completion requirement. Persistent containers run on Synology, while portable images are built/published on GitHub-hosted runners where practical. Retained Synology self-hosted runner access should be deploy-only or equivalently narrow.

