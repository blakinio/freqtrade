authority:
  precedence:
    - accepted decisions and explicit owner decisions
    - exact current code, configuration, migrations, tests, workflow and deployed-target evidence
    - canonical target-state architecture
    - domain architecture and plans
    - historical baselines
  rules:
    - The registry is the canonical index of architectural authority; it is not runtime evidence.
    - Accepted decisions constrain later documents until explicitly superseded through a bounded architecture change.
    - Current implementation state is proven by exact revision evidence, not by target-state wording.
    - Target-only or mixed documents must never be reported as fully implemented without exact evidence.
    - Historical baselines preserve context but do not override accepted decisions or current-state evidence.
    - Material architecture changes update this registry and the accepted decision authority in the same change set.
    - A registered architecture candidate is not a material change to binding authority until it is independently qualified and explicitly promoted; historical candidate lifecycle text remains evidence of its review-time state after promotion.
    - ADR-026 was independently qualified at PR #1676 head 5efda8fc9297f9387fffcfc7c81e604baee4e8bf and is promoted by ADR-027 as the binding Quant Platform v2 core/migration target. ADR-027 supersedes ADR-026 candidate/pending lifecycle labels for current authority status without rewriting the qualified design record.
    - ADR-023 remains the current product overlay for the entire Portal and supersedes conflicting current-Portal assumptions in ADR-003, ADR-004, ADR-005, ADR-013, ADR-014, ADR-016, ADR-017, ADR-020, ADR-021 and ADR-022 exactly as recorded in its supersession matrix.
    - ADR-025 remains the current runtime/CI-placement overlay. Synology is the normal current persistent application runtime and durable-storage host; GitHub-hosted Actions is the default stateless/disposable CI/test/build/scan/job plane and is not a 24/7 application host.
    - ADR-027 retains ADR-023 product authority and ADR-025 placement authority while making ADR-026's deterministic Rust Quant Core, Python strategy/ML plane, Portal boundary, PostgreSQL recovery spine and Freqtrade strangler-retirement direction binding target architecture.
    - ADR-027 refines ADR-001 only where it implied permanent Freqtrade target ownership, refines ADR-002 to permit the Rust Quant Core bounded process alongside the FastAPI facade, and refines ADR-009 by removing NATS/JetStream as an unconditional V2-S1 dependency while retaining versioned events/outbox/durable-state principles. ADR-010 remains retained.
    - Existing Freqtrade-backed paths are current implementation/migration compatibility, not permanent v2 target state ownership. Freqtrade remains available as reference oracle, migration input, temporary compatibility and bounded offline/reference tooling until each replacement boundary proves parity or an accepted intentional difference, deterministic replay, restart/recovery, Portal behavior and rollback/compatibility.
    - Architecture promotion is not implementation authority. Before mutating v2 work begins, a separate execution-governance package must freeze unique implementation lanes, control-plane authority and dependency DAG; V2-S1 entry must verify its required reference oracle and canonical WickHunter/WH09 fixture.
    - ADR-025 supersedes ADR-024 only where ADR-024 required a separate dedicated Linux persistent runtime, treated Synology compute as transitional-only, or made dedicated-Linux cutover a current completion requirement. ADR-024 remains historical evidence and its GitHub-hosted build-plane direction is retained.
    - SHADOW/PAPER/LIVE are historical or compatibility vocabulary only for current Portal work; current concepts are REALTIME_PUBLIC/REPLAY data source, LOCAL/SYNOLOGY persistent runtime location, LOCAL/SYNOLOGY storage provider, integrated simulation and BASELINE/CHALLENGER/ACTIVE/ARCHIVED model lifecycle.
    - Persistent application containers run on Synology. GitHub-hosted workflows may build/publish their images and execute short-lived disposable containers, but must not be described as the persistent application runtime.
    - GitHub-hosted Actions runners are the default for stateless CI/build/validation and bounded disposable jobs where compatible. Self-hosted runners on Synology should be disabled or narrowly deploy-only/target-specific rather than serving as general repository CI shells.
    - deploy/runtime/** is an optional portability reference only under ADR-025; it does not make a separate dedicated Linux host current target authority.
    - Real-money exchange execution, private trading credentials, withdrawals and capital authority are out of current Portal scope. A future Execution/Capital Gateway requires a separate owner-approved architecture programme.
    - Existing RuntimeGeneration, Runtime Supervisor, Gateway, isolation and reconciliation implementation may be reused when it solves a concrete current problem, but ADR-023 removes them as universal completion prerequisites for ordinary developer simulation/research workflows and ADR-027 does not restore them as universal v2 prerequisites.
    - ADR-021 repository integration/release guidance may remain independently applicable, but its Portal bot-mode semantics are superseded by ADR-023.
    - ADR-022 remains historical evidence of the former PAPER-first target and is superseded for the entire current Portal by ADR-023.

