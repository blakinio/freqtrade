  implementation_note: Owner acceptance makes PAPER the default and only currently authorized operational mode, makes SHADOW optional/purpose-bound and makes LIVE unreachable. Exact code, tests, CI, runtime and protected-target evidence remain required for implementation claims. The delivery task must verify whether `develop` advanced after the recorded architecture base before opening or merging its PR.

