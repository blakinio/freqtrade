latest_architecture_change:
  accepted_at: "2026-08-18"
  base_sha: 2389e5e70161325c7f39b8ecd9da766f078bcf3e
  issue: 1603
  task: FTAI-20260818-dedicated-linux-runtime-1603
  decision: ADR-024
  decision_document: docs/ai_platform/portal/ADR-024_DEDICATED_LINUX_RUNTIME.md
  detail_document: docs/ai_platform/portal/DEVELOPER_QUANT_PORTAL_ARCHITECTURE.md
  status: accepted_target_pending_implementation
  affected_domains:
    - portal_and_ux
    - data_and_observability
    - deployment_and_operations
    - ci_and_quality
    - portal_research_integration
  implementation_note: The owner separated application compute from durable storage. GitHub/GitHub-hosted Actions remain the repository, CI, build and orchestration plane; persistent Portal, collectors, WickHunter/inference and Freqtrade simulation target a dedicated Linux runtime; Synology becomes the durable storage/evidence/backup provider. Existing Synology-hosted services are transitional implementation state and no physical cutover is claimed until exact target-host and service-level evidence exists.

