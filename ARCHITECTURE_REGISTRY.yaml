authority:
  precedence:
    - accepted decisions and explicit owner decisions
    - exact current code, configuration, migrations, tests, workflow and deployed-target evidence
    - canonical target-state architecture
    - domain architecture and plans
    - historical baselines
  rules:
    - The registry is the canonical index of architectural authority; it is not runtime evidence.
    - Accepted decisions constrain later documents until explicitly superseded through a bounded architecture change.
    - Current implementation state is proven by exact revision evidence, not by target-state wording.
    - Target-only or mixed documents must never be reported as fully implemented without exact evidence.
    - Historical baselines preserve context but do not override accepted decisions or current-state evidence.
    - Material architecture changes update this registry and the accepted decision authority in the same change set.
    - ADR-023 is the current product overlay for the entire Portal and supersedes conflicting current-Portal assumptions in ADR-003, ADR-004, ADR-005, ADR-013, ADR-014, ADR-016, ADR-017, ADR-020, ADR-021 and ADR-022 exactly as recorded in its supersession matrix.
    - ADR-024 is the current runtime/deployment topology overlay. It supersedes conflicting current-target wording that makes Synology the normal persistent application-compute location while leaving ADR-023 product semantics intact.
    - For current Portal work, SHADOW/PAPER/LIVE are historical or compatibility vocabulary only; current concepts are REALTIME_PUBLIC/REPLAY data source, LOCAL/DEDICATED_LINUX runtime location, LOCAL/SYNOLOGY storage provider, integrated simulation and BASELINE/CHALLENGER/ACTIVE/ARCHIVED model lifecycle.
    - Existing Synology-hosted application services are transitional current implementation state until exact service-level dedicated-Linux cutover evidence exists; acceptance of ADR-024 is not runtime migration evidence.
    - GitHub-hosted Actions runners are the default for stateless CI/build/validation and are not long-lived application runtime hosts. Self-hosted runners on privileged runtime/storage hosts should be disabled or narrowly deploy-only.
    - Real-money exchange execution, private trading credentials, withdrawals and capital authority are out of current Portal scope. A future Execution/Capital Gateway requires a separate owner-approved architecture programme.
    - Existing RuntimeGeneration, Runtime Supervisor, Gateway, isolation and reconciliation implementation may be reused when it solves a concrete current problem, but ADR-023 removes them as universal completion prerequisites for ordinary developer simulation/research workflows.
    - ADR-021 repository integration/release guidance may remain independently applicable, but its Portal bot-mode semantics are superseded by ADR-023.
    - ADR-022 remains historical evidence of the former PAPER-first target and is superseded for the entire current Portal by ADR-023.

