  - not_applicable
  - requires_verification

authority:
  precedence:
    - accepted decisions and explicit owner decisions
    - exact current code, configuration, migrations, tests, workflow and deployed-target evidence
    - canonical target-state architecture
    - domain architecture and plans
    - historical baselines
  rules:
    - The registry is the canonical index of architectural authority; it is not runtime evidence.
    - Accepted decisions constrain later documents until explicitly superseded through a bounded architecture change.
    - Current implementation state is proven by exact revision evidence, not by target-state wording.
    - Target-only or mixed documents must never be reported as fully implemented without exact evidence.
    - Historical baselines preserve context but do not override accepted decisions or current-state evidence.
    - Material architecture changes update this registry and the accepted decision log in the same change set.
    - ADR-020 and its Runtime Isolation / Runtime Supervisor refinement supersede older target-state wording that conflicts with RuntimeGeneration, resolved isolation-plan identity, Runtime Supervisor, per-runtime Gateway, dry-run public-data connectivity, effective isolation attestation or generation-bound reconciliation/fencing.
    - ADR-021 separates source integration/release branches, deployment environments, release channels and bot operating modes; no branch/environment/release promotion supplies LIVE authority or deployment authorization.
    - ADR-021 supersedes the temporary 2026-08-09 single-develop branch target, while exact repository evidence remains authoritative for whether the physical main migration is complete.
    - ADR-022 makes PAPER the default and only currently authorized operational mode, makes SHADOW optional and purpose-bound, and requires LIVE to remain unreachable/fail-closed until a separate explicit owner-approved architecture and implementation programme.
    - ADR-022 supersedes legacy lifecycle wording that requires SHADOW before PAPER or exposes a current path through live-small/production.

