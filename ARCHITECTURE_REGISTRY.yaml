open_architecture_findings:
  - issue: 1355
    id: FTAI-ARCH-RUNTIME-SUPERVISOR
    severity: critical
    status: open
    summary: Isolate container-engine authority behind the Runtime Supervisor boundary required by ADR-020.
  - issue: 1353
    id: FTAI-ARCH-RUNTIME-TRUSTED-STATE
    severity: high
    status: open
    summary: Separate Portal-authoritative RuntimeGeneration/config evidence from runtime-writable Freqtrade state.
  - issue: 1354
    id: FTAI-ARCH-RUNTIME-ISOLATION
    severity: high
    status: open
    summary: Enforce the ADR-020 runtime isolation, resource and network profile for every generation.
  - issue: 1357
    id: FTAI-ARCH-BOT-REVISION-STATE
    severity: high
    status: open
    summary: Separate authored/draft, desired and observed active bot revision/runtime-generation state.
