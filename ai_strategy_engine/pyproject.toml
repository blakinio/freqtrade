[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "inwestycja-strategy-engine"
version = "0.1.0"
description = "Timestamp-safe strategy and AI research engine starter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "jsonschema>=4.22",
  "optuna>=4.8,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["strategy_engine"]
