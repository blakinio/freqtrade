services:
  liquid20-live:
    build:
      context: ../../..
      dockerfile: deploy/synology/liquid20/Dockerfile
      args:
        COLLECTOR_COMMIT: ${COLLECTOR_COMMIT:-unknown}
    image: local/liquid20-collector:${IMAGE_TAG:-local}
    container_name: liquid20-live
    restart: unless-stopped
    init: true
    entrypoint: ["/usr/local/bin/liquid20-live-entrypoint"]
    user: "${PUID:-1026}:${PGID:-100}"
    environment:
      COLLECTOR_COMMIT: ${COLLECTOR_COMMIT:-}
      LIQUIDATION_STAGING_HOST_ID: ${HOST_ID:-synology-01}
      LIQUID20_DATA_ROOT: /data
      LIQUID20_HEARTBEAT_SECONDS: ${LIVE_HEARTBEAT_SECONDS:-5}
      LIQUID20_SYMBOL_REFRESH_SECONDS: ${SYMBOL_REFRESH_SECONDS:-3600}
      LIQUID20_MAXIMUM_SYMBOLS: ${MAXIMUM_SYMBOLS:-1000}
      TZ: UTC
    volumes:
      - ./data:/data:rw
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  liquid20-evidence:
    profiles: ["evidence"]
    build:
      context: ../../..
      dockerfile: deploy/synology/liquid20/Dockerfile
      args:
        COLLECTOR_COMMIT: ${COLLECTOR_COMMIT:-unknown}
    image: local/liquid20-collector:${IMAGE_TAG:-local}
    container_name: liquid20-evidence
    restart: "no"
    init: true
    entrypoint: ["/usr/local/bin/liquid20-entrypoint"]
    user: "${PUID:-1026}:${PGID:-100}"
    environment:
      COLLECTOR_COMMIT: ${COLLECTOR_COMMIT:-}
      LIQUIDATION_STAGING_HOST_ID: ${HOST_ID:-synology-01}
      LIQUID20_MODE: ${MODE:-smoke}
      LIQUID20_DURATION_SECONDS: ${SMOKE_DURATION_SECONDS:-60}
      RUN_ID: ${RUN_ID:-}
      TZ: UTC
    volumes:
      - ./data:/data:rw
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
