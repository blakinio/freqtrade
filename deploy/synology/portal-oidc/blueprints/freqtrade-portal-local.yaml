version: 1
metadata:
  name: Freqtrade Portal Local OIDC
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - id: portal-local-access-policy
    identifiers:
      name: Freqtrade Portal Local Active Users
    model: authentik_policies_expression.expressionpolicy
    attrs:
      expression: |
        return bool(request.user and request.user.is_authenticated and request.user.is_active)

  - id: portal-local-provider
    identifiers:
      name: Freqtrade Portal Local OIDC
    model: authentik_providers_oauth2.oauth2provider
    attrs:
      name: Freqtrade Portal Local OIDC
      client_type: confidential
      client_id: freqtrade-portal-local
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
      redirect_uris:
        - matching_mode: strict
          url: http://192.168.1.2:3031/api/identity/callback
          redirect_uri_type: authorization
      sub_mode: user_uuid
      issuer_mode: per_provider
      include_claims_in_id_token: true

  - id: portal-local-application
    identifiers:
      slug: freqtrade-portal-local
    model: authentik_core.application
    attrs:
      name: Freqtrade Portal Local
      slug: freqtrade-portal-local
      provider: !KeyOf portal-local-provider
      policy_engine_mode: any

  - identifiers:
      target: !KeyOf portal-local-application
      policy: !KeyOf portal-local-access-policy
      order: 0
    model: authentik_policies.policybinding
